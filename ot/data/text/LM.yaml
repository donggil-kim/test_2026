# [LM] 횡적 이동 — OT 관점 문구
# 작성 규칙은 IP.yaml 머리말 참고
# 유효 계정(T0859)·취약한 자격증명(T1694.x)은 PE.yaml, 원격 서비스 취약점·원격 서비스 악용(T0866·T0886)은 IA.yaml 문구를 같이 씀
# 자격증명 탈취 기법(T1003·T1056·T1110)은 Enterprise Credential Access를 OT 횡적 이동의 준비 단계로 보고 이 전술에 둠

T0843:
  summary: |-
    - 공격자는 엔지니어링 프로토콜로 제어기에 사용자 프로그램을 내려받아(전체 다운로드·온라인 편집·프로그램 추가), 제어 로직을 자신의 코드로 바꾸거나 새 코드를 더할 수 있음
    - 정상 유지보수와 같은 기능이라 통신만으로 악의를 가리기 어렵고, 다수 제어기가 다운로드에 인증을 요구하지 않거나 약하게 요구함
  reference: |-
    ■ OT 관점
    - 대상: PLC·PAC·DCS 제어기와 안전 제어기(SIS) (L1) — 엔지니어링 프로토콜(S7comm·TriStation·CODESYS·FINS 등)이 닿는 EWS나 침해 호스트에서 수행
    - 수법: 감염 코드·데이터 블록 다운로드(Stuxnet), TriStation 프로그램 다운로드(Triton), CODESYS 프로토콜 다운로드와 Omron HTTP 서버의 다운로드·백업 전송(INCONTROLLER), 관리 API로 실행 블록 적재(PLC-Blaster)
    - 하위 기법: 전체 다운로드(OTC-LM-01.1)·온라인 편집(OTC-LM-01.2)·프로그램 추가(OTC-LM-01.3) — 앞 단계는 운전 모드 변경(OTC-EX-06), 결과는 제어 프로그램 변조(OTC-PE-03)
    ■ 실제 사례
    - [실제 사고] Stuxnet(2010-06): 코드 블록·데이터 블록으로 이뤄진 감염 시퀀스를 PLC에 내려받아 동작을 바꿈 (INC-009, ATT&CK S0603)
    - [실제 사고] Triton(2017-08): TriStation 프로토콜로 Triconex 안전 제어기에 프로그램을 내려받음 (INC-004, ATT&CK S1009)
    - [위협인텔] PIPEDREAM(2022-04): INCONTROLLER가 CODESYS 프로토콜로 Schneider PLC에, HTTP 서버 기능으로 Omron PLC에 프로그램을 내려받는 기능을 갖춤 (INC-022, ATT&CK S1045)
  detect: |-
    ■ 탐지
    - 프로그램 다운로드·온라인 편집·프로그램 추가 기능 코드를 OT 네트워크 감시로 탐지하고, 지정 EWS·승인된 작업 일정 밖이면 경보
    - 장치의 프로그램 변경 경보·진단 버퍼를 수집하고 정기적으로 프로그램을 올려받아 기준본과 비교
    ■ 대응
    - 제어기 다운로드에 암호·인증과 역할별 권한을 적용하고, 키 스위치·접근 보호로 운전 중 변경을 막음
    - 엔지니어링 프로토콜을 지정 EWS로 제한(허용 목록·망 분할·프로토콜 인식 방화벽)하고, 코드 서명을 지원하는 제어기를 도입

T0843.001:
  summary: |-
    - 공격자는 제어기의 프로그램·설정 전체를 새 프로젝트로 덮어써, 제어 로직을 통째로 바꿀 수 있음
    - 보통 제어기를 정지한 상태에서 이뤄져 공정 중단이 따르지만, 정비 시간대에 맞추거나 정지 자체가 목적이면 그대로 피해가 됨
  reference: |-
    ■ OT 관점
    - 대상: PLC·PAC·DCS 제어기와 안전 제어기(SIS)의 전체 프로그램·하드웨어 구성 (L1)
    - 전제: 벤더 엔지니어링 소프트웨어가 있는 EWS 접근이나 엔지니어링 프로토콜을 재현한 도구가 필요하고, 다운로드 전 운전 모드 변경(OTC-EX-06)이 따름
    - 정지 없이 일부만 바꾸는 방식은 온라인 편집(OTC-LM-01.2)·프로그램 추가(OTC-LM-01.3)
    ■ 실제 사례
    - [위협인텔] PIPEDREAM(2022-04): INCONTROLLER가 Omron PLC HTTP 서버의 프로그램 다운로드·백업 전송 기능으로 로직을 바꾸는 기능을 갖춘 채 발견 (INC-022, ATT&CK S1045)
  detect: |-
    ■ 탐지
    - 전체 다운로드와 그에 앞선 정지 명령을 OT 네트워크 감시로 탐지하고, 계획되지 않은 제어기 정지·재기동을 경보
    - 다운로드 뒤 프로그램을 올려받아 승인 기준본과 비교
    ■ 대응
    - 전체 다운로드는 변경 관리 승인과 현장 확인을 거쳐 지정 EWS에서만 수행하고, 키 스위치를 RUN 잠금에 둠
    - 제어기 웹 서버처럼 다운로드 경로가 되는 부가 서비스를 끄고 엔지니어링 접근에 인증 적용

T0843.002:
  summary: |-
    - 공격자는 제어기를 멈추지 않고 실행 중인 프로그램 일부를 고치는 온라인 편집으로, 공정 중단 없이 로직을 몰래 바꿀 수 있음
    - 정지·재기동 같은 눈에 띄는 징후가 없고 정상 유지보수에서도 자주 쓰는 기능이라, 운영자가 알아채기 어려움
  reference: |-
    ■ OT 관점
    - 대상: 온라인 편집을 지원하는 PLC·PAC·DCS 제어기 (L1)
    - 전제: 벤더 엔지니어링 소프트웨어나 엔지니어링 프로토콜 재현 도구와 제어기 접근 권한 — 제어기 접근 보호가 없거나 약하면 바로 가능
    - 결과는 제어 프로그램 변조(OTC-PE-03)·운전 파라미터 변조(OTC-IP-02)와 같고, 실행 흐름 변경은 제어기 태스크 변조(OTC-EX-02)
    ■ 실제 사례
    - 공개 사고 미확인 — ATT&CK에 실제 사용 절차가 없고, 정지 없이 이뤄져 사고 조사에서 별도 기법으로 식별되기 어려움
    - [시나리오] 침해한 EWS의 엔지니어링 소프트웨어로 운전 중인 PLC의 인터록 조건 하나를 온라인 편집해 무력화
  detect: |-
    ■ 탐지
    - 온라인 편집 기능 코드를 OT 네트워크 감시로 탐지하고, 지정 EWS·작업 일정 밖이면 경보
    - 프로그램을 정기적으로 올려받아 승인 기준본과 비교하고 장치 변경 경보를 수집
    ■ 대응
    - 운전 중 온라인 편집은 원칙적으로 막고(키 스위치·접근 보호), 필요하면 2인 승인과 변경 기록을 남김
    - 엔지니어링 접근을 지정 EWS로 제한하고 제어기 접근 암호·인증 적용

T0843.003:
  summary: |-
    - 공격자는 기존 프로그램은 두고 새 프로그램·블록만 추가로 내려받아, 원래 로직을 유지한 채 자신의 코드를 제어기에서 실행할 수 있음
    - 기존 로직이 그대로라 공정이 정상처럼 동작하고, 추가된 프로그램만 찾아내야 해서 전체 비교 없이는 놓치기 쉬움
  reference: |-
    ■ OT 관점
    - 대상: PLC·PAC·DCS 제어기와 안전 제어기(SIS)의 프로그램 테이블·블록 목록 (L1)
    - 수법: 안전 제어기에 여러 차례 제어 로직을 프로그램 추가 방식으로 내려받음(Triton) — 추가된 코드는 제어기 태스크 변조(OTC-EX-02)로 실행 기회를 얻음
    - 안전 제어기는 대개 운전 중 변경을 막지만 키 스위치가 PROGRAM에 있으면 가능해, 운전 모드 관리가 핵심 방어선
    ■ 실제 사례
    - [실제 사고] Triton(2017-08): 안전계통(SIS) 제어기에 프로그램 추가 방식으로 여러 차례 제어 로직을 내려받음 (INC-004, ATT&CK C0030)
  detect: |-
    ■ 탐지
    - 프로그램 추가·블록 생성 기능 코드를 OT 네트워크 감시로 탐지하고, 블록 목록의 새 항목을 승인 기준본과 비교
    - 안전 제어기의 키 스위치 위치와 프로그램 변경 진단 경보를 HMI·SCADA에서 감시
    ■ 대응
    - 안전 제어기 키 스위치를 RUN 잠금에 두고 키를 관리하며, 프로그램 변경은 안전 관리 절차(변경 승인·검증)를 거침
    - 엔지니어링 접근을 지정 EWS로 제한하고 안전계통을 제어계통과 분리

T0867:
  summary: |-
    - 공격자는 SMB 공유·원격 복사·그룹 정책·산업 장치 원격 세션으로 공격 도구와 페이로드를 OT 내부 시스템과 장치에 옮겨, 다음 단계 공격을 준비할 수 있음
    - 공유 폴더·GPO·패치 서버 같은 정상 배포 경로를 쓰면 트래픽이 업무와 섞이고, IT와 OT를 잇는 공유 폴더·이중 연결 호스트가 전송 통로가 됨
  reference: |-
    ■ OT 관점
    - 대상: EWS·SCADA 서버·점프 호스트·패치 서버와 파일 공유, Telnet·FTP를 지원하는 제어기·현장 장치 (L1~L3.5)
    - 수법(호스트 간): VBS로 ICS 전용 페이로드 복사(2016 우크라이나), GPO로 와이퍼를 준비 서버에서 로컬로 복사(2022 우크라이나), 네트워크 공유에 페이로드 배치(2025 폴란드), SMB로 산업망 확산(WannaCry·NotPetya·Bad Rabbit)
    - 수법(서버·장치로): SQL 테이블에 실행 파일을 넣어 DB 서버로 전달(Stuxnet), Telnet 세션으로 Omron PLC에 악성 코드 이식(INCONTROLLER)
    - 통합: Enterprise 도구 반입(T1105)·내부 도구 전송(T1570)
    ■ 실제 사례
    - [실제 사고] 2016 우크라이나(2016-12): VBS 스크립트로 ICS 전용 페이로드(101.dll)를 대상 경로에 복사 (INC-003, ATT&CK C0025)
    - [실제 사고] 2022 우크라이나(2022-10): GPO로 CaddyWiper 실행 파일을 준비 서버에서 각 호스트 하드디스크로 복사한 뒤 배포 (INC-006, ATT&CK C0034)
    - [실제 사고] WannaCry(2017-05): SMB 취약점으로 원격 컴퓨터에 자신을 복사해 산업망까지 퍼짐 (INC-015, ATT&CK S0366)
  detect: |-
    ■ 탐지
    - 같은 이름·해시의 파일이 짧은 시간에 여러 호스트에 생기거나 OT 호스트 사이 SMB 쓰기가 늘면 경보
    - IT↔OT 경계를 넘는 파일 전송과 제어기로 향하는 Telnet·FTP 세션을 OT 네트워크 감시로 확인
    ■ 대응
    - OT 호스트 간 SMB·관리 공유를 필요한 경로로만 제한하고, IT↔OT 파일 전송은 검사 기능이 있는 파일 전송 중계 시스템으로 일원화
    - 제어기의 Telnet·FTP 같은 부가 서비스를 끄고, 프로토콜 인식 침입 방지로 알려진 확산 시도를 차단

T1003:
  summary: |-
    - 공격자는 메모리(LSASS)·SAM·AD 데이터베이스(ntds.dit)·브라우저·설정 파일에서 자격증명을 빼내, 도메인 관리자·OT 운영자 계정으로 횡적 이동할 수 있음
    - OT 호스트는 자격증명 보호 기능이 꺼져 있거나 레거시 OS라 덤프가 쉽고, 한 번 얻은 도메인 자격증명은 IT·OT 전체에 통함
  reference: |-
    ■ OT 관점
    - 대상: EWS·HMI·점프 호스트·SCADA 서버의 LSASS 메모리·SAM, IT·OT 도메인 컨트롤러의 ntds.dit, 경계 장비 설정 속 암호 (L2~L3.5)
    - 수법: Mimikatz(2016 우크라이나·Triton·NotPetya·Bad Rabbit), SAM·SYSTEM 하이브 탈취(리비우 지역난방·2025 폴란드), 볼륨 섀도 복사본으로 ntds.dit 덤프와 Kerberos 티켓 위조(2025 폴란드), 브라우저·파일에 저장된 암호 수집(BlackEnergy·Havex)
    - 통합: Enterprise OS 자격증명 덤프(T1003·.001~.003)·직접 볼륨 접근(T1006)·파일 저장 자격증명(T1552.001)·암호 저장소(T1555·.003)·Kerberos 티켓 탈취·위조(T1558) — 얻은 계정은 유효 계정 악용(OTC-PE-01·LM-02)으로 이어짐
    ■ 실제 사례
    - [실제 사고] 2025 폴란드(2025-12): LSASS 덤프를 시도하고 SAM·SYSTEM 하이브와 AD 데이터베이스(ntds.dit)를 빼냈으며, Rubeus로 Kerberos 티켓을 위조 (INC-008, ATT&CK C0063)
    - [실제 사고] 2016 우크라이나(2016-12): Mimikatz로 정상 자격증명을 얻어 사용 (INC-003, ATT&CK C0025)
    - [실제 사고] 리비우 지역난방(2024-01): 피해 환경의 SAM 하이브를 빼내 자격증명을 확보 (INC-007, ATT&CK C0041)
  detect: |-
    ■ 탐지
    - LSASS 메모리 접근, SAM·SYSTEM 하이브 저장, vssadmin·ntdsutil 실행을 EDR·명령줄 감사로 경보
    - 도메인 컨트롤러의 비정상 복제 요청과 Kerberos 티켓 발급 이상을 확인
    ■ 대응
    - LSA 보호·Credential Guard를 적용할 수 있는 OT 호스트에 켜고, 레거시 호스트는 관리자 로그인 자체를 줄임
    - OT 도메인을 분리하고 계층화된 관리자 모델(도메인 관리자는 도메인 컨트롤러에만 로그인)을 적용하며, 침해 시 KRBTGT를 포함한 전체 암호를 재설정

T1056:
  summary: |-
    - 공격자는 키로거·로그인 화면 가로채기·위장 포털로 운영자·엔지니어가 입력하는 자격증명과 정보를 수집할 수 있음
    - OT 접근에 쓰는 VPN·점프 호스트·HMI 로그인 정보가 그대로 노출되고, 사용자는 정상 로그인처럼 느껴 알아채기 어려움
  reference: |-
    ■ OT 관점
    - 대상: EWS·HMI·점프 호스트와 OT 원격 접속 포털, 엔지니어가 쓰는 업무 단말 (L2~L3.5)
    - 수법: BlackEnergy·Duqu 키로거 플러그인, 자격증명 변경 시점에 로그인 정보를 공격자 웹사이트로 돌려받기(Triton)
    - 횡적 이동용 자격증명 탈취(OTC-LM-08)와 정보 수집(OTC-CO-12)에 같은 기법으로 나타남 — 통합: Enterprise 키로깅(T1056.001)·웹 포털 캡처(T1056.003)
    ■ 실제 사례
    - [실제 사고] 2015 우크라이나(2015-12): BlackEnergy 키로거 플러그인으로 계정 자격증명을 수집 (INC-002, ATT&CK C0028)
    - [실제 사고] Triton(2017-08): 자격증명이 바뀔 때 텍스트 기반 로그인 코드를 공격자가 통제하는 웹사이트로 돌려 새 자격증명을 가로챔 (INC-004, ATT&CK C0030)
    - [실제 사고] Duqu(2011-10): 키로거 모듈로 키 입력을 기록해 자격증명과 정보를 수집 (INC-010, ATT&CK S0038)
  detect: |-
    ■ 탐지
    - 키보드 후킹 API 사용과 서명 없는 모듈의 입력 장치 접근을 EDR로 탐지
    - 원격 접속 포털·로그인 페이지 변조와 외부로 향하는 비정상 웹 요청을 확인
    ■ 대응
    - 원격·특권 접근에 다중 인증(하드웨어 토큰 등)을 적용해 가로챈 암호만으로는 로그인할 수 없게 함
    - OT 접근 단말을 업무 단말과 분리하고 애플리케이션 허용 목록으로 비인가 모듈 실행을 막음

T1110:
  summary: |-
    - 공격자는 암호를 모를 때 반복 대입·유출 계정 재사용(크리덴셜 스터핑)·탈취한 해시 크래킹으로 VPN·HMI·점프 호스트·제어기 계정을 뚫을 수 있음
    - OT 장치는 로그인 실패 잠금·지연이 없거나 꺼진 경우가 많아 대입이 막히지 않고, 짧은 공용 암호가 오래 유지됨
  reference: |-
    ■ OT 관점
    - 대상: VPN·점프 호스트·HMI 로그인, Windows RPC·SMB 인증, 제어기 엔지니어링 접속(CODESYS·OPC UA 등), IoT 기기 클라우드 계정 (L1~L3.5·IoT)
    - 수법: 스크립트로 여러 호스트에 RPC 인증 시도(2016 우크라이나), 탈취한 해시 크래킹(2025 폴란드), NTLM 로그인 대입으로 확산(Bad Rabbit), 다른 서비스에서 유출된 계정 재사용(Ring 카메라) — INCONTROLLER의 CODESYS·OPC UA 암호 대입 기능은 ATT&CK에서 유효 계정 악용(OTC-PE-01)으로 분류
    - 통합: Enterprise 암호 크래킹(T1110.002)·크리덴셜 스터핑(T1110.004)
    ■ 실제 사례
    - [실제 사고] 2016 우크라이나(2016-12): 스크립트로 여러 호스트에 RPC 인증을 시도 (INC-003, ATT&CK C0025)
    - [실제 사고] 2025 폴란드(2025-12): 확보한 사용자 암호의 크래킹을 시도 (INC-008, ATT&CK C0063)
    - [실제 사고] Bad Rabbit(2017-10): NTLM 로그인 정보를 대입해 Windows 시스템으로 퍼짐 (INC-017, ATT&CK S0606)
  detect: |-
    ■ 탐지
    - 짧은 시간의 반복 로그인 실패와 같은 출발지에서 여러 계정·호스트로 향하는 인증 시도를 경보
    - 제어기·HMI 로그인 실패 기록을 수집하고, 엔지니어링 프로토콜 인증 실패 패턴을 OT 네트워크 감시로 확인
    ■ 대응
    - 로그인 실패 잠금·지연과 강한 암호 정책을 적용하되(운전 계정 잠금이 운영에 주는 영향 검토), 원격 접속에는 다중 인증 적용
    - 계정마다 다른 암호를 쓰고, 유출 계정 목록과 대조해 재사용 암호를 바꿈
