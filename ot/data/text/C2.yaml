# [C2] 명령·제어 — OT 관점 문구
# 작성 규칙은 IP.yaml 머리말 참고

T0869:
  summary: |-
    - 공격자는 HTTP(S) 같은 일반 프로토콜이나 Modbus·TriStation·MQTT 같은 산업·IoT 프로토콜로 명령·제어 통신을 해, 악성 통신을 정상 트래픽 속에 숨길 수 있음
    - OT 망에서 허용된 프로토콜을 그대로 쓰면 방화벽 규칙을 통과하고, 산업 프로토콜 안에 명령을 숨기면 일반 IT 보안 장비는 내용을 해석하지 못함
  reference: |-
    ■ OT 관점
    - 대상: 외부 C2와 통신하는 EWS·HMI·SCADA 서버, 제어기에 심은 임플란트, 리눅스 기반 IoT·OT 기기 (L1~L3·IoT)
    - 수법(일반 프로토콜): HTTP(S) POST로 외부 C2 통신(BlackEnergy·Industroyer·Stuxnet), Dropbox·Pastebin 같은 웹 서비스 이용(2025 폴란드)
    - 수법(산업·IoT 프로토콜): 안전 제어기 진단 명령에 명령을 숨김(Triton), Modbus로 장치에 명령 전송(FrostyGoop), PLC 데이터 블록의 특정 값으로 명령 전달(Stuxnet), MQTT로 IoT·OT 기기 제어(IOCONTROL)
    - 통합: Enterprise 응용 계층 프로토콜(T1071·.001)·비응용 계층 프로토콜(T1095)·웹 서비스 양방향 통신(T1102.002)·암호화 채널(T1573·.001·.002)
    ■ 실제 사례
    - [실제 사고] Triton(2017-08): TriStation 'get main processor diagnostic data' 명령에 특수 제작한 패킷을 실어 임플란트에 명령과 인자를 전달 (INC-004, ATT&CK S1009)
    - [실제 사고] 2015 우크라이나(2015-12): BlackEnergy가 감염 호스트와 C2 서버 사이를 HTTP POST로 통신 (INC-002, ATT&CK C0028)
    - [실제 사고] IOCONTROL(2024-12): 리눅스 기반 IoT·OT 기기용 악성코드가 MQTT로 명령을 받으며 연료 관리 시스템 침해에 쓰임 (INC-067)
  detect: |-
    ■ 탐지
    - OT 호스트·장치의 외부 통신을 기준선과 비교해 새 목적지·클라우드 서비스·주기적 비컨을 경보
    - 산업 프로토콜 심층 분석으로 평소와 다른 함수 코드·페이로드 크기·진단 명령 사용을 확인
    ■ 대응
    - OT 망의 인터넷 직접 통신을 막고, 필요한 외부 통신은 DMZ 중계로만 허용(목적지 허용 목록)
    - 프로토콜 인식 침입 방지와 가능한 구간의 TLS 검사를 적용하고, 쓰지 않는 MQTT 같은 원격 관리 기능을 끔

T0884:
  summary: |-
    - 공격자는 내부 프록시·역방향 SOCKS 터널·감염 호스트 간 P2P 중계·제어기 라우팅 기능을 써서, 인터넷에 직접 닿지 않는 OT 시스템까지 명령·제어 통신을 이어갈 수 있음
    - 분리된 망도 신뢰된 중계 호스트를 거치면 통신이 이어지고, 외부에는 정상 프록시·암호화 터널 트래픽만 보여 출발지 추적이 어려움
  reference: |-
    ■ OT 관점
    - 대상: IT·OT를 잇는 이중 연결 호스트·점프 호스트, 내부 웹 프록시, 인터넷이 없는 OT 호스트, CODESYS 게이트웨이가 있는 PLC (L1~L3.5)
    - 수법(터널·프록시): 백도어 설치 전 내부 프록시 구성(2015 우크라이나), 내부 프록시 경유 HTTP CONNECT 터널(Industroyer), TLS 기반 Yamux 터널(2022 우크라이나 GOGETTER), 역방향 SOCKS 프록시·Tor(2025 폴란드)
    - 수법(내부 중계): 감염 호스트 간 P2P 중계(Stuxnet·Duqu), PLC를 경유하는 라우팅으로 방화벽 우회(INCONTROLLER)
    - 통합: Enterprise 프록시(T1090·.001·.003)·프로토콜 터널링(T1572) — 외부 중계 인프라는 네트워크 장비 탈취(OTC-RD-01.1)
    ■ 실제 사례
    - [실제 사고] 2016 우크라이나(2016-12): Industroyer 백도어가 하드코딩된 내부 프록시(TCP 3128)를 거쳐 외부 C2에 HTTP CONNECT 터널로 접속하고 Tor도 사용 (INC-003, ATT&CK S0604)
    - [실제 사고] 2022 우크라이나(2022-10): GOGETTER 터널링 소프트웨어로 외부 서버와 TLS 기반 Yamux C2 채널을 만듦 (INC-006, ATT&CK C0034)
    - [위협인텔] PIPEDREAM(2022-04): PLCProxy 모듈이 Schneider PLC의 CODESYS 게이트웨이에 경로를 추가해 PLC를 거쳐 다른 장치로 메시지를 보내는 기능을 갖춤 (INC-022, ATT&CK S1045)
  detect: |-
    ■ 탐지
    - OT 호스트의 프록시·터널 도구 실행, 내부 호스트 간 새로운 장시간 연결, Tor·익명 프록시 목적지를 경보
    - 제어기의 라우팅·게이트웨이 설정 변경과 제어기를 경유하는 비정상 통신 경로를 확인
    ■ 대응
    - OT 망의 외부 통신을 DMZ 중계로 일원화하고 내부 프록시 사용을 인증·허용 목록으로 제한
    - 이중 연결 호스트를 없애고, 제어기의 불필요한 라우팅·게이트웨이 기능을 끔

T0885:
  summary: |-
    - 공격자는 80·443·445나 산업 프로토콜 표준 포트(Modbus 502·TriStation 1502)처럼 늘 열려 있는 포트로 통신해, 방화벽을 통과하고 정상 트래픽에 섞일 수 있음
    - 포트 번호만 보는 방화벽·감시는 같은 포트의 악성 통신을 걸러내지 못하고, OT 망에서 업무에 필요한 포트는 쉽게 막을 수 없음
  reference: |-
    ■ OT 관점
    - 대상: 웹·파일 공유 포트가 열린 EWS·HMI·SCADA 서버와 산업 프로토콜 포트가 열린 제어기·안전 제어기 (L1~L3)
    - 수법: 443·80으로 외부 C2 통신(2015 우크라이나·Stuxnet), TriStation 기본 포트로 장치 통신(Triton), Modbus 표준 포트로 명령(FrostyGoop), HMI에 정상 업데이트처럼 이름 붙인 방화벽 규칙으로 TCP 445 개방(2025 폴란드)
    - 포트와 실제 프로토콜이 다르거나 평소 쓰지 않는 호스트가 그 포트를 쓰는 경우가 핵심 단서 — 표준 응용 계층 프로토콜(OTC-C2-01)과 함께 쓰임
    ■ 실제 사례
    - [실제 사고] 2025 폴란드(2025-12): Mikronika HMI에 'Microsoft Update'라는 방화벽 규칙을 만들어 TCP 445를 열어 둠 (INC-008, ATT&CK C0063)
    - [실제 사고] 리비우 지역난방(2024-01): FrostyGoop이 표준 포트 TCP 502로 Modbus 명령을 보냄 (INC-007, ATT&CK S1165)
    - [실제 사고] Triton(2017-08): TriStation 기본 포트 UDP 1502로 안전 제어기와 통신 (INC-004, ATT&CK S1009)
  detect: |-
    ■ 탐지
    - 포트와 실제 프로토콜이 맞지 않는 통신과 평소 그 포트를 쓰지 않는 호스트의 사용을 OT 네트워크 감시로 경보
    - 호스트 방화벽 규칙의 추가·변경 이벤트를 수집하고, 규칙 이름이 정상 업데이트를 흉내 내는지 확인
    ■ 대응
    - 포트가 아닌 발신지·목적지·프로토콜 기준 허용 목록과 프로토콜 인식 방화벽을 적용
    - 호스트 방화벽 규칙을 중앙 정책으로 관리해 지역 변경을 막고, 쓰지 않는 서비스 포트를 닫음
