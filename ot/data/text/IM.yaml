# [IM] 영향 — OT 관점 문구
# 작성 규칙은 IP.yaml 머리말 참고. ATT&CK이 '표준 탐지 방법 없음'으로 둔 결과 기법은 원인 기법 탐지·운영 지표 감시로 기술

T0813:
  summary: |-
    - 공격자는 제어 장치와의 통신을 끊거나 원격 복구에 필요한 장치를 무력화해, 운영자·엔지니어가 한동안 공정을 조작하지 못하게 할 수 있음
    - 공정은 계속 돌아가지만 이상이 생겨도 원격으로 개입할 수 없어, 다른 조작과 결합되면 피해가 걷잡을 수 없이 커짐
  reference: |-
    ■ OT 관점
    - 결과 기법: 통신 차단(OTC-IR-13.1)·장치 무력화(OTC-IR-02, OTC-PE-04.1)·네트워크 접근 차단의 결과로 나타나며, 일시적이면 제어 거부, 지속되면 제어 상실(OTC-IM-04)
    - 원격 운전에 의존하는 배전·상하수도·파이프라인처럼 현장이 넓게 흩어진 시설에서 영향이 큼
    ■ 실제 사례
    - [실제 사고] 2015 우크라이나(2015-12): KillDisk와 변환기 펌웨어 덮어쓰기로 RTU 등 원격 복구에 필요한 장치를 쓸 수 없게 만듦 (INC-002, ATT&CK C0028)
    - [실제 사고] 마루치 하수처리(2000-03): 조사자를 네트워크에서 일시 차단해 제어 명령을 내리지 못하게 함 (INC-001, ATT&CK C0020)
    - [실제 사고] 2016 우크라이나(2016-12): Industroyer가 직렬 COM 채널을 일시 차단 (INC-003, ATT&CK S0604)
  detect: |-
    ■ 탐지
    - ATT&CK에 표준 탐지 방법이 없는 결과 기법 — 원인 기법(통신 차단·장치 정지·데이터 파괴) 탐지로 대응
    - 제어 명령 실패·무응답 이벤트를 장치·채널별로 모아 동시다발 여부 확인
    ■ 대응
    - 대역 외 통신 채널과 서비스 이중화로 원격 제어 경로를 확보하고 수동 운전 절차를 정기 훈련
    - 장치 설정·프로그램 백업으로 재구성 시간 단축

T0815:
  summary: |-
    - 공격자는 장치와 제어 시스템 사이 통신을 일시적으로 방해해, 운영자가 공정 상태를 보지 못하게 할 수 있음
    - 방해가 그치면 화면이 회복되는 일시적 현상이라 통신 장애로 넘기기 쉽고, 그 사이 이뤄진 조작은 운영자 눈에 띄지 않음
  reference: |-
    ■ OT 관점
    - 결과 기법: 직렬 채널 차단(OTC-IR-13.1)·보고 메시지 차단(OTC-IR-11.2)·네트워크 접근 차단의 결과로 나타나며, 지속되면 감시 상실(OTC-IM-06)
    - 운영자 판단은 화면에 의존하므로 감시 거부 구간에 제어 조작(OTC-IM-07)이 겹치면 대응이 늦어짐
    ■ 실제 사례
    - [실제 사고] 마루치 하수처리(2000-03): 조사자를 네트워크에서 일시 차단해 시스템 상태를 보지 못하게 함 (INC-001, ATT&CK C0020)
    - [실제 사고] 2016 우크라이나(2016-12): Industroyer가 직렬 COM 채널을 일시 차단해 감시 거부를 일으킴 (INC-003, ATT&CK S0604)
  detect: |-
    ■ 탐지
    - 표준 탐지 방법이 없는 결과 기법 — 텔레메트리 공백·갱신 지연을 장치·채널별로 감시해 원인 기법 추적
    - 통신 장애 기록과 같은 시간대의 운영 변경·명령 이력을 함께 검토
    ■ 대응
    - 대역 외 감시 수단(현장 계측·독립 감시 경로) 확보와 감시 서비스 이중화
    - 통신 장애 시 현장 확인 절차를 운영 매뉴얼에 포함

T0826:
  summary: |-
    - 공격자는 핵심 구성요소를 방해하거나 HMI·워크스테이션·데이터베이스의 데이터를 지우거나 암호화해, 운영 조직이 제품·서비스를 공급하지 못하게 할 수 있음
    - 전력·난방·연료·철도처럼 공공 서비스가 끊기면 피해가 조직 밖 사회 전체로 번지고, 예방 차원의 운영 중단도 같은 결과를 낳음
  reference: |-
    ■ OT 관점
    - 결과 기법: 제어 조작(차단기 개방·설정 변경), 장치·HMI 무력화, 랜섬웨어(OTC-IM-13), 무선 신호 악용 등 여러 경로의 결과
    - 생산·매출 손실(OTC-IM-05)이 조직의 경제적 피해라면 이 행은 서비스 공급 중단 자체 — 둘이 함께 나타나는 경우가 많음
    - 사고 DB에서 OT 직접 조작(배전·지역난방·철도 무선 정지)과 IT 경유 중단(연료 결제·배급 시스템)이 모두 확인됨
    ■ 실제 사례
    - [실제 사고] 2015 우크라이나(2015-12): 차단기를 열어 수천 곳의 사업장·가구가 약 6시간 정전 (INC-002, ATT&CK C0028)
    - [실제 사고] 리비우 지역난방(2024-01): 제어기 파라미터를 바꿔 지역난방 공급이 끊김 (INC-007, ATT&CK C0041)
    - [실제 사고] 이란 주유소(2021-10·2023-12): 연료 배급·결제 시스템 마비로 전국 주유소 운영 차질 (INC-048, INC-060)
  detect: |-
    ■ 탐지
    - 표준 탐지 방법이 없는 결과 기법 — 원인 기법 탐지와 함께 공급량·가동률 같은 서비스 지표의 급변을 감시
    - 공급 중단 시 IT·OT 이벤트 시간대를 맞춰 원인 영역(OT 직접 조작 vs IT 경유)을 빠르게 판정
    ■ 대응
    - 서비스 이중화, 대역 외 운영 수단, 수동 운전·현장 복구 절차를 준비하고 정기 훈련
    - 핵심 데이터·설정을 오프라인으로 백업하고, IT 장애 시에도 OT를 독립 운전할 수 있게 의존성 축소

T0827:
  summary: |-
    - 공격자는 장치·HMI를 파괴하거나 주변 기기 사용을 막아, 간섭이 멈춘 뒤에도 운영자가 어떤 명령도 내릴 수 없는 지속적 제어 상실 상태를 만들 수 있음
    - 제어 상실은 공정 폭주나 설비 손상으로 직결될 수 있고, 복구가 장치 교체·재구성과 수동 운전에 의존해 길어짐
  reference: |-
    ■ OT 관점
    - 결과 기법: 데이터 파괴(OTC-IR-02)·펌웨어 변조(OTC-PE-04.1)·HMI 무력화의 결과로 나타나며, 일시적이면 제어 거부(OTC-IM-01)
    - IT 랜섬웨어가 생산 시스템까지 번져 수동 운전으로 전환한 경우도 ATT&CK은 제어 상실로 기록
    ■ 실제 사례
    - [실제 사고] 독일 제철소(2014-12): 제어 구성요소가 잇따라 고장 나 용광로를 정상적으로 정지하지 못함 (INC-029)
    - [실제 사고] 2025 폴란드(2025-12): RTU·보호 계전기·HMI가 손상돼 통신과 제어를 잃음 (INC-008, ATT&CK C0063)
    - [실제 사고] 노르스크 하이드로(2019-03): LockerGoga 감염으로 생산 시스템 일부의 제어를 잃고 수동 운전으로 전환 (INC-019, ATT&CK S0372)
  detect: |-
    ■ 탐지
    - 표준 탐지 방법이 없는 결과 기법 — 제어 명령 실패·HMI 무응답·장치 통신 두절이 동시에 늘어나는지 감시
    - 원인 기법(와이퍼·펌웨어 변조·랜섬웨어) 탐지와 연계해 확산 범위 판단
    ■ 대응
    - 중요 공정에 기계식 보호와 독립 안전계통을 두어 제어를 잃어도 안전 정지 보장
    - 예비 장치·백업 이미지와 수동 운전 절차를 준비하고 정기 훈련

T0828:
  summary: |-
    - 공격자는 OT 직접 공격이나 분리되지 않은 IT 환경에 대한 랜섬웨어 공격으로 생산·출하·운송을 멈추게 해, 조직에 큰 생산·매출 손실을 일으킬 수 있음
    - 공정이 멀쩡해도 감염 확산을 우려한 예방적 중단이나 생산 관리 시스템 마비로 생산이 멈추며, 피해가 협력업체와 공급망으로 번짐
  reference: |-
    ■ OT 관점
    - 사고 DB에서 실제 사고가 가장 많이 연결된 행 — 대부분 IT 침해가 생산 관리·물류 시스템을 마비시키거나 OT 확산을 우려해 예방 중단한 경우('OT 관련도: IT 경유 OT 영향')
    - 경로: 랜섬웨어(OTC-IM-13), 와이퍼(OTC-IR-02), 협력업체 침해로 인한 부품 공급 중단, OT 직접 조작으로 인한 공정 정지
    - 영향 범위는 IT·OT 의존성에 좌우됨 — 생산 계획·출하 시스템(MES·ERP)이 멈추면 제어계통이 정상이어도 공장이 섬
    ■ 실제 사례
    - [실제 사고] 콜로니얼 파이프라인(2021-05): IT 랜섬웨어 이후 OT 확산을 우려해 미국 동부 최대 연료 파이프라인을 약 6일간 세움 (INC-044)
    - [실제 사고] 노르스크 하이드로(2019-03): LockerGoga 감염으로 160여 생산 거점 대부분이 수동 운전으로 전환 (INC-019, ATT&CK S0372)
    - [실제 사고] 재규어 랜드로버(2025-09): IT 시스템 차단으로 전 세계 생산이 5주 넘게 멈추고 협력업체로 피해가 번짐 (INC-070)
  detect: |-
    ■ 탐지
    - 표준 탐지 방법이 없는 결과 기법 — 랜섬웨어 전조(자격증명 탈취·대량 권한 상승·백업 삭제)를 IT·OT 경계에서 조기 탐지
    - 생산 실적·가동률 급변을 운영 지표로 감시하고 보안 이벤트와 상관 분석
    ■ 대응
    - IT·OT 분리(DMZ·단방향 게이트웨이)와 IT 장애 시 최소 생산을 유지하는 OT 독립 운전 계획 수립
    - MES·히스토리언 등 생산 지원 시스템의 오프라인 백업과 복구 우선순위를 사업 연속성 계획에 반영

T0829:
  summary: |-
    - 공격자는 HMI·RTU·센서 통신을 파괴하거나 감시 기능이 없는 펌웨어로 바꿔, 운영자가 현장에 가지 않고는 공정 상태를 볼 수 없게 만들 수 있음
    - 물리 공정은 돌아가도 상태를 확인할 수 없어 안전을 위해 수동 운전·운영 중단을 택하게 되며, 지속적 감시 상실은 현장 조치 없이는 회복되지 않음
  reference: |-
    ■ OT 관점
    - 결과 기법: HMI 화면 변조·삭제, 와이퍼, 센서 통신 방해, 펌웨어 다운그레이드, 원격 감시용 통신망(위성·셀룰러) 파괴의 결과
    - 일시적이면 감시 거부(OTC-IM-02), 값을 속이면 감시 화면 조작(OTC-IM-08)
    - 원격 감시에 의존하는 분산 설비(풍력·태양광·센서망)는 통신 장비 하나로 대규모 감시 상실이 일어남
    ■ 실제 사례
    - [실제 사고] AcidRain(2022-02): 위성 모뎀이 파괴돼 독일 Enercon 풍력 발전기 약 5,800기의 원격 감시가 끊김 (INC-050)
    - [실제 사고] Unitronics(2023-11): HMI 화면을 공격자 그래픽으로 바꿔 운영자가 장치 상태를 볼 수 없게 함 (INC-005, ATT&CK C0031)
    - [실제 사고] Fuxnet(2024-04): 센서 통신을 방해해 전체 감시 시스템에 감시 상실을 일으킴 (INC-023, ATT&CK S1157)
  detect: |-
    ■ 탐지
    - 표준 탐지 방법이 없는 결과 기법 — 텔레메트리 공백이 여러 장치·사이트에서 동시에 생기는지 감시
    - HMI 화면·프로젝트 파일의 무결성과 통신 장비 상태를 정기 점검
    ■ 대응
    - 독립 감시 경로(현장 표시기·대체 통신)와 감시 서비스 이중화 확보
    - 감시 상실 시 안전 상태 판단·현장 순회 절차를 마련하고 정기 훈련

T0831:
  summary: |-
    - 공격자는 설정값·태그·파라미터를 바꾸거나 직접 명령을 보내 물리 공정을 의도대로 움직일 수 있음
    - 차단기 개방·밸브 개폐·원심분리기 속도 변화처럼 결과가 곧바로 물리 세계에 나타나며, 운영자 화면까지 속이면 조작 사실을 늦게 알아챔
  reference: |-
    ■ OT 관점
    - 결과 기법: 비인가 명령 메시지(OTC-IP-03.1)·파라미터 변조(OTC-IP-02)·제어 프로그램 변조(OTC-PE-03)·HMI 원격 조작(OTC-EX-03)의 결과
    - 고도화된 공격(Stuxnet·Industroyer)과 인터넷 노출 HMI를 노린 단순 조작(핵티비스트·내부자)이 모두 같은 결과에 이름
    - 2024년 이후 노출 HMI 조작 사고가 수도·댐·지역 유틸리티에서 반복됨 — 원격 접속 관리 부재가 공통 원인
    ■ 실제 사례
    - [실제 사고] 2015 우크라이나(2015-12): 운영자 HMI를 원격 조작해 운전 중인 차단기를 열어 정전 (INC-002, ATT&CK C0028)
    - [실제 사고] 노르웨이 브레망에르 댐(2025-04): 약한 암호의 웹 제어 화면으로 방류 밸브를 열어 약 4시간 과다 방류 (INC-068)
    - [실제 사고] 캔자스 수도조합(2019-03): 퇴사 직원이 원격 접속으로 정수장 세척·소독 공정을 정지 (INC-043)
  detect: |-
    ■ 탐지
    - 표준 탐지 방법이 없는 결과 기법 — 운영자 조작 기록이 없는 상태 변화, 근무 외 시간 조작, 원격 접속 세션 중 설정 변경을 공정 이력과 접속 로그로 대조
    - 원인 기법(비인가 명령·파라미터 변조) 탐지와 연계
    ■ 대응
    - 원격 접속을 다중 인증·세션 기록·승인 절차로 통제하고 퇴사자 계정을 즉시 회수
    - 중요 동작은 현장 인터록·한계값·독립 안전계통으로 보호하고, 통신 인증을 지원하는 프로토콜 적용

T0832:
  summary: |-
    - 공격자는 운영자·제어기에 보고되는 정보를 조작해, 실제 공정과 다른 상태를 화면에 보여 줄 수 있음
    - 조작된 화면을 믿은 운영자가 잘못 조치하거나 위험을 놓치게 되며, 보호 기능이 동작해야 할 상황도 가려짐
  reference: |-
    ■ OT 관점
    - 수법: 정상 시기의 공정 입력을 녹화해 재생, I/O 이미지 조작(OTC-IR-05), 위조 보고 메시지(OTC-IP-03.2), 허위 상태 코드 전송
    - 감시 상실(OTC-IM-06)과 달리 화면이 살아 있어 운영자가 이상을 의심하지 않음 — 독립 계측과 대조하지 않으면 드러나지 않음
    ■ 실제 사례
    - [실제 사고] Stuxnet(2010-06): 공정 입력을 재생하고 I/O 이미지를 조작해 운영자 화면에 정상값을 보여 줌 (INC-009, ATT&CK S0603)
    - [실제 사고] 2016 우크라이나(2016-12): Industroyer의 OPC 모듈이 '한계 초과' 상태 코드를 보내 운영자가 보호 계전기 상태를 오판하게 함 (INC-003, ATT&CK S0604)
  detect: |-
    ■ 탐지
    - 표준 탐지 방법이 없는 결과 기법 — 같은 변수를 독립 계측·현장 표시기와 주기적으로 대조
    - 값이 비정상적으로 일정하거나 반복 패턴을 보이는지 히스토리언으로 분석
    ■ 대응
    - 보고 통신 무결성 보호(IEC 62351 등)와 독립 감시 경로 확보
    - 안전 판단은 독립 안전계통과 현장 계측에 두고, 운영자 교육에 '화면 불일치' 대응 시나리오 포함

T0837:
  summary: |-
    - 공격자는 고장·이상 상태의 영향을 막도록 설계된 보호 기능(보호 계전기 등)을 무력화해, 설비 손상과 장기 공정 중단, 인명 위험을 키울 수 있음
    - 많은 고장은 사람이 반응하기에 너무 빨리 진행되므로, 자동 보호가 꺼지면 다른 공격이나 일반 고장이 곧바로 큰 사고로 번짐
  reference: |-
    ■ OT 관점
    - 대상: 변전소 보호 계전기·차단기 보호 기능, 설비 보호 인터록 (L0~L1)
    - 경로: 보호 장치 서비스 거부(OTC-IR-03), 펌웨어 업데이트 모드 활성화(OTC-IR-01), 보호 설정 변경 — 안전 상실(OTC-IM-11)이 안전계통을 노린다면 이 행은 설비 보호 기능을 노림
    ■ 실제 사례
    - [실제 사고] 2016 우크라이나(2016-12): Industroyer가 CVE-2015-5374로 Siemens SIPROTEC 보호 계전기에 서비스 거부를 일으켜 보호 기능을 무력화 (INC-003, ATT&CK S0604)
  detect: |-
    ■ 탐지
    - 표준 탐지 방법이 없는 결과 기법 — 보호 장치 상태 보고 중단·자기진단 경보를 감시
    - 보호 장치를 향한 비정상 통신(취약점 공격 패턴, 업데이트 모드 전환)을 OT 네트워크 감시로 탐지
    ■ 대응
    - 보호 계통 이중화, 장치 펌웨어 갱신, 보호 장치 관리 접근 제한
    - 보호 기능이 무력화되면 운전을 제한하고 현장 감시를 강화하는 절차 마련

T0879:
  summary: |-
    - 공격자는 제어 시스템을 조작해 설비·기반시설과 주변 환경에 물리적 손상과 파괴를 일으킬 수 있음
    - 피해가 장비 교체·환경 복구·인명 피해로 이어져 사이버 공격 가운데 복구 비용과 시간이 가장 크고, 원인이 단순 고장으로 오인되기도 함
  reference: |-
    ■ OT 관점
    - 결과 기법: 제어 조작(OTC-IM-07)·안전 상실(OTC-IM-11)·I/O 무차별 조작(OTC-IP-01) 등이 설비 한계를 넘을 때 나타남
    - 공개 사고 근거는 하수 방류(환경), 트램 탈선(인명·설비), 용광로 손상(설비)이며, 실증으로 발전기 파괴(Aurora)가 있음
    ■ 실제 사례
    - [실제 사고] 독일 제철소(2014-12): 생산망 침투 뒤 용광로를 정상 정지하지 못해 설비가 크게 손상 (INC-029)
    - [실제 사고] 폴란드 우치 트램(2008-01): 적외선 신호로 선로 전환기를 조작해 트램 4대가 탈선하고 승객이 다침 (INC-027)
    - [실증] Aurora 시험(2007-03): 원격 차단기 명령만으로 디젤 발전기를 물리적으로 파괴 (INC-077)
  detect: |-
    ■ 탐지
    - 표준 탐지 방법이 없는 결과 기법 — 설비 상태 감시(진동·온도·운전 한계)와 보안 이벤트를 함께 분석해 사이버 원인 가능성을 조기 판단
    - 물리 사고 조사 절차에 사이버 포렌식(제어기 로직·명령 이력 확인)을 포함
    ■ 대응
    - 기계식 보호 계층과 독립 안전계통으로 위험 한계를 물리적으로 보장(사이버 조작으로 넘을 수 없게 설계)
    - 결과 중심 위험 평가로 물리 피해를 일으킬 수 있는 제어 경로를 찾아 우선 보호

T0880:
  summary: |-
    - 공격자는 위험 상황에서 공정을 안전하게 정지시키는 안전계통(SIS) 기능을 무력화하거나 다시 프로그래밍해, 위험 상태가 계속되게 할 수 있음
    - 안전계통은 사람이 대응하기에 너무 빠른 위험을 막는 마지막 방어선이라, 제어계통 조작과 결합되면 폭발·유독물 누출 같은 인명 사고로 이어질 수 있음
  reference: |-
    ■ OT 관점
    - 대상: 안전 계장 시스템(SIS)의 안전 제어기(예: Triconex)와 안전 엔지니어링 워크스테이션 (L1~L2)
    - 수법: 안전 로직 재프로그래밍(OTC-LM-01.3)·펌웨어 메모리 변조(OTC-PE-04.1)로 위험 상태를 허용하게 한 뒤 DCS로 위험 상태를 만듦
    - 안전계통과 제어계통이 네트워크·엔지니어링 단말을 공유하면 그 자체가 공격 경로가 됨
    ■ 실제 사례
    - [실제 사고] Triton(2017-08): SIS 로직을 재프로그래밍해 위험 상태를 허용하게 하는 도구로 Triconex 안전 제어기를 공격했고, 오류로 안전 정지가 일어나 발견됨 (INC-004, ATT&CK S1009)
  detect: |-
    ■ 탐지
    - 표준 탐지 방법이 없는 결과 기법 — 안전 제어기의 운전 모드(키스위치)·로직 변경·진단 경보를 상시 감시
    - 안전 엔지니어링 단말 접속과 안전 프로토콜(예: TriStation) 통신을 OT 네트워크 감시로 경보
    ■ 대응
    - 안전계통을 제어계통과 물리·논리적으로 분리하고 전용 엔지니어링 단말 사용
    - 안전 제어기 키스위치를 RUN에 두고 변경 시 현장 승인을 받게 하며, 기계식 보호 계층 유지

T0882:
  summary: |-
    - 공격자는 설계 도면·운전 절차·네트워크 구성·공정 정보 같은 운영 정보를 훔쳐, 직접적인 이득을 얻거나 이후 OT 공격 설계에 쓸 수 있음
    - 탈취 시점에는 물리 피해가 없어 대응 우선순위가 낮아지기 쉽지만, 정밀 공격의 사전 준비이자 기반시설 정보 유출이라 영향이 큼
  reference: |-
    ■ OT 관점
    - 대상: CAD 도면·P&ID·운전 매뉴얼·PLC 프로젝트 파일·네트워크 구성, 공급업체·통합업체가 보관한 고객 프로젝트 파일, 카메라 영상 (L2~L4)
    - 경로: 정보 수집형 악성코드(Duqu·Flame·ACAD/Medre.A), 공급업체 침해, 클라우드 관리 플랫폼 계정 탈취
    - 통합: Enterprise 반출 기법(T1041·T1048.003·T1567.004 등) — 반출 전술이 없는 ICS 매트릭스에서 운영 정보 유출로 표현
    ■ 실제 사례
    - [실제 사고] 2025 폴란드(2025-12): 훔친 민감 운영 정보를 OT 시스템 공격 계획에 사용 (INC-008, ATT&CK C0063)
    - [실제 사고] 한국수력원자력(2014-12): 원전 설계도면·운전 매뉴얼이 유출·공개되고 가동 중단 협박이 이어짐 (INC-073)
    - [실제 사고] 텔벤트(2012-09): 파이프라인 SCADA 공급업체가 침해돼 고객사 프로젝트 파일이 유출 (INC-076)
  detect: |-
    ■ 탐지
    - 표준 탐지 방법이 없는 결과 기법 — 설계·프로젝트 파일 저장소의 대량 접근·압축·외부 전송을 DLP·네트워크 감시로 탐지
    - OT 영역에서 인터넷·클라우드 저장소로 향하는 비정상 전송을 경보
    ■ 대응
    - 운영 정보를 기밀 등급으로 분류해 접근 통제·암호화하고, 공급업체에 보관·폐기 보안 요구사항 부과
    - OT 문서 저장소를 업무망과 분리하고 반출 승인 절차 운영

T1486:
  summary: |-
    - 공격자는 랜섬웨어로 HMI·EWS·히스토리언·생산 관리 서버의 파일과 디스크를 암호화해, 운영 시스템을 쓸 수 없게 만들고 복구 대가를 요구할 수 있음
    - OT 자산까지 암호화되지 않아도 IT 감염과 OT 확산 우려만으로 운영을 멈추게 되며, 실제 OT 영향 사고에서 가장 자주 확인되는 경로임
  reference: |-
    ■ OT 관점
    - 대상: Windows 기반 HMI·EWS·SCADA 서버·히스토리언·MES·생산 계획 서버와 공유 드라이브 (L2~L4)
    - 흐름: 피싱·VPN 계정·경계 장비 취약점으로 IT 진입 → 자격증명 탈취(OTC-LM-07)·그룹 정책 배포(OTC-PV-04.1)로 확산 → ICS 서비스 중지(OTC-IR-09)·백업 삭제(OTC-IR-02) 뒤 암호화
    - ICS 매트릭스에 암호화 기법이 없어 Enterprise T1486을 편입 — 결과는 생산·매출 손실(OTC-IM-05)·감시 상실(OTC-IM-06)로 이어짐
    ■ 실제 사례
    - [실제 사고] 천연가스 압축 시설(2020-02): 랜섬웨어가 OT망까지 들어와 HMI·히스토리언·폴링 서버를 암호화해 파이프라인 운영이 약 2일 멈춤 (INC-039)
    - [실제 사고] 노르스크 하이드로(2019-03): LockerGoga가 OS 핵심 파일까지 암호화해 생산 거점이 수동 운전으로 전환 (INC-019, ATT&CK S0372)
    - [실제 사고] 나고야항(2023-07): 랜섬웨어로 컨테이너 터미널 시스템이 멈춰 반출입이 약 이틀 중단 (INC-056)
  detect: |-
    ■ 탐지
    - 대량 파일 변경·확장자 변경, 섀도 복사본 삭제, ICS 서비스 일괄 종료를 엔드포인트 감시로 경보
    - IT·OT 경계에서 도메인 관리자 계정의 OT 자산 접근과 그룹 정책 변경을 탐지
    ■ 대응
    - IT·OT 계정·도메인 분리, OT 단말 애플리케이션 허용 목록, 오프라인·변경 불가 백업과 복원 훈련
    - IT 장애 시 OT 독립 운전 계획을 세워 예방적 중단 범위를 최소화

T1496.002:
  summary: |-
    - 공격자는 기본 자격증명·알려진 취약점으로 장악한 IoT 기기와 경계 장비를 봇넷에 편입해, 그 대역폭으로 다른 대상에 DDoS를 하거나 공격 트래픽을 중계할 수 있음
    - 기기 소유자는 성능 저하와 평판 손상만 겪어 침해를 알아채지 못하는 경우가 많고, 같은 접근이 이후 OT 공격 거점으로 쓰일 수 있음
  reference: |-
    ■ OT 관점
    - 대상: IP 카메라·DVR·NVR·라우터·산업용 셀룰러 게이트웨이, OT 경계 방화벽 (L3.5·IoT)
    - 경로: 인터넷 노출 장치(OTC-IA-11)·기본 자격증명(OTC-PE-05.1)·공개 애플리케이션 취약점(OTC-IA-02) — KEV에 등재된 IoT 취약점 다수가 봇넷 편입에 쓰임
    - 공격자 관점의 공격 인프라 탈취(OTC-RD-01.1)를 기기 소유자 피해 관점에서 본 행 — 클라우드 매트릭스 대역폭 탈취(T1496.002)와 연계
    ■ 실제 사례
    - [실제 사고] Mirai(2016-10): 텔넷 기본 계정으로 IoT 기기 수십만 대를 봇넷에 편입해 대규모 DDoS를 일으킴 (INC-032)
    - [실제 사고] 덴마크 에너지 기업(2023-05): 침해된 경계 방화벽 일부가 Mirai 계열 봇넷에 편입 (INC-055)
  detect: |-
    ■ 탐지
    - IoT·경계 장비의 비정상 아웃바운드 트래픽(대량 연결·DDoS 패턴)과 알려진 C2로의 통신을 네트워크 감시로 경보
    - 장치 프로세스·설정 변경과 텔넷·SSH 로그인 시도 수집
    ■ 대응
    - 기본 자격증명 변경, 펌웨어 갱신, 인터넷에 노출된 관리 인터페이스 제거
    - IoT 기기는 별도 망으로 분리하고 외부 통신을 허용 목록으로 제한
