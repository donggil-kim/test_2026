# [EX] 실행 — OT 관점 문구
# 작성 규칙은 IP.yaml 머리말 참고

T0807:
  summary: |-
    - 공격자는 EWS·HMI·SCADA 서버의 명령 셸과 RTU·방화벽의 장비 CLI로 명령을 실행해, 도구를 설치하고 설정을 바꾸거나 제어 소프트웨어를 직접 호출할 수 있음
    - 운영·유지보수에 늘 쓰는 인터페이스라 실행 자체가 정상 행위와 같고, 내장 명령만 쓰면 별도 악성 파일 없이도 공격이 진행됨
  reference: |-
    ■ OT 관점
    - 대상: Windows 기반 EWS·HMI·SCADA 서버·히스토리언, Linux 기반 RTU·데이터 게이트웨이, OT 경계 방화벽·스위치의 관리 CLI (L1~L3.5)
    - 수법: SCADA 명령 도구 호출(MicroSCADA scilc.exe), MS-SQL xp_cmdshell, 공격 도구에 대상 IP·페이로드를 명령줄 인자로 전달(Triton·Industroyer), RTU에 SSH로 접속해 파일 삭제, 방화벽 CLI로 설정 변경
    - 통합: Enterprise Windows 명령 셸(T1059.003)·Unix 셸(T1059.004)·네트워크 장비 CLI(T1059.008) — PowerShell·VBS 같은 스크립트는 스크립트 실행(OTC-EX-05)
    ■ 실제 사례
    - [실제 사고] 2022 우크라이나(2022-10): MicroSCADA의 scilc.exe로 SCIL-API 명령을 실행해 변전소 차단기를 개방 (INC-006, ATT&CK C0034)
    - [실제 사고] 2025 폴란드(2025-12): HMI에서 PowerShell로 관리 공유·방화벽 규칙을 바꾸고, Mikronika RTU에 root로 SSH 접속해 파일을 모두 지워 장치를 고장 냄 (INC-008, ATT&CK C0063)
    - [실제 사고] Triton(2017-08): 대상 Triconex 장치의 IP 주소 하나를 명령줄 인자로 받아 공격 도구를 실행 (INC-004, ATT&CK C0030)
  detect: |-
    ■ 탐지
    - OT 호스트에서 명령 셸·PowerShell 실행과 인자를 기록(명령줄 감사)하고, 제어 소프트웨어 명령 도구(scilc.exe 등)를 평소와 다른 부모 프로세스·계정이 호출하면 경보
    - RTU·네트워크 장비의 SSH 접속과 CLI 명령 이력(AAA 기록)을 중앙 수집해 승인되지 않은 명령·설정 변경 확인
    ■ 대응
    - OT 호스트에서 쓰지 않는 셸·관리 도구를 제거하거나 애플리케이션 허용 목록으로 막고, 관리자 셸은 점프 호스트·지정 계정에서만 사용
    - 장치·장비 관리 인터페이스는 관리망에서만 열고 root 직접 로그인을 막으며, 명령 권한을 역할별로 나눔

T0821:
  summary: |-
    - 공격자는 제어기의 태스크 설정(태스크와 프로그램 조직 단위의 연결·주기·우선순위)을 바꾸거나 새 태스크를 넣어, 자신이 심은 코드를 매 스캔 주기나 특정 조건에서 실행시킬 수 있음
    - 기존 로직은 그대로 두고 실행 흐름만 바꿀 수 있어 로직 비교만으로는 놓치기 쉽고, 태스크 변경을 경보하지 않는 장치가 많음
  reference: |-
    ■ OT 관점
    - 대상: IEC 61131-3 기반 PLC·PAC·DCS 제어기와 안전 제어기(SIS)의 태스크·조직 블록(OB)·프로그램 테이블 (L1)
    - 수법: 주기 실행 블록 감염(Stuxnet의 OB1·OB35), 제어기가 자동 인식하는 새 조직 블록 추가(PLC-Blaster의 OB9999), 안전 제어기 프로그램 테이블에 공격 코드 등록(Triton)
    - 전제: 운전 모드 변경(OTC-EX-06)과 프로그램 추가 다운로드(OTC-LM-01.3)로 쓰기 권한을 얻어야 하며, 결과는 제어 프로그램 변조(OTC-PE-03)·운전 파라미터 변조(OTC-IP-02)로 이어짐
    ■ 실제 사례
    - [실제 사고] Stuxnet(2010-06): 주기 실행 블록 OB1과 감시용 OB35를 감염시켜 매 스캔 주기 시작에 악성 코드가 먼저 실행되게 함 (INC-009, ATT&CK S0603)
    - [실제 사고] Triton(2017-08): Tricon 안전 제어기의 프로그램 테이블에 인자 설정 코드와 셸코드를 추가해 펌웨어가 매 주기 실행하게 함 (INC-004, ATT&CK S1009)
    - [실증] PLC-Blaster(2016-03): 기존 코드를 건드리지 않고 OB9999에 웜 코드를 넣어 PLC가 자동으로 실행하게 함 (INC-024, ATT&CK S1006)
  detect: |-
    ■ 탐지
    - 제어기의 태스크 구성(태스크 목록·주기·우선순위·연결 블록)과 블록 목록을 승인된 기준 프로젝트와 정기 비교하고, 진단 버퍼·변경 경보를 수집
    - 다운로드·온라인 편집 같은 엔지니어링 기능 코드가 지정 EWS 밖에서 오거나 작업 일정 밖에 발생하면 OT 네트워크 감시로 경보
    ■ 대응
    - 제어기 접근 보호(암호·보호 레벨)를 켜고 운전 중에는 키 스위치를 RUN에 두어 원격 프로그램 변경을 막음
    - 변경 관리로 승인된 변경만 반영하고, 코드 서명·무결성 검증을 지원하는 제어기를 우선 도입

T0823:
  summary: |-
    - 공격자는 원격 데스크톱·VNC·원격 지원 도구로 HMI·EWS 화면을 넘겨받아, 운영자와 같은 방식으로 클릭해 차단기 개방·설정 변경 같은 제어 기능을 실행할 수 있음
    - 운영자 화면에서 이뤄지는 정상 조작이라 명령 자체로는 구분되지 않고, HMI가 공정 배치를 보여주므로 깊은 공정 지식 없이도 의미 있는 조작이 가능함
  reference: |-
    ■ OT 관점
    - 대상: SCADA·DCS 운영자 HMI, EWS, 원격 접속 도구가 깔린 운전 단말과 OT 도메인 컨트롤러 (L2~L3)
    - 경로: 탈취 계정으로 RDP·VNC 접속(OTC-IA-12), 원격 지원 도구(TeamViewer 등), 인터넷에 직접 노출된 HMI 웹·VNC 화면(OTC-IA-11)
    - 올즈마 정수장 설정값 변경(2021-02)은 원격 지원 화면 조작 사례로 널리 알려졌으나, 이후 직원 실수 가능성이 제기돼 실제 사고 집계에서 제외(INC-041)
    ■ 실제 사례
    - [실제 사고] 2015 우크라이나(2015-12): SCADA 환경의 HMI 화면을 원격으로 조작해 배전 변전소 차단기를 개방 (INC-002, ATT&CK C0028)
    - [실제 사고] 2025 폴란드(2025-12): RDP로 Mikronika HMI에 접속해 GUI로 명령을 실행하고, 도메인 컨트롤러에도 GUI로 접속해 데이터를 빼내고 파괴를 시도 (INC-008, ATT&CK C0063)
  detect: |-
    ■ 탐지
    - HMI·EWS로 들어오는 원격 화면 세션(RDP·VNC·원격 지원 도구)의 생성·출발지·시간대를 기록하고, 운영자 콘솔이 아닌 세션에서 일어난 제어 조작을 경보
    - HMI 운영자 조작 기록을 로그인 세션과 대조해 근무하지 않는 계정이나 원격 세션의 조작 확인
    ■ 대응
    - HMI·EWS 원격 화면 접속은 점프 호스트·다중 인증을 거친 지정 경로로만 허용하고, 쓰지 않는 원격 지원 도구 제거
    - 중요 제어 조작은 확인 창 외에 2인 승인·현장 확인을 거치게 하고, 원격 세션은 녹화·감독

T0834:
  summary: |-
    - 공격자는 운영체제나 제어기 펌웨어가 제공하는 저수준 API(시스템 호출·시스템 함수 블록)를 직접 불러, 메모리·프로세스·통신 같은 하위 기능을 정상 도구 없이 다룰 수 있음
    - 제어기의 시스템 함수 블록은 정상 로직에도 쓰여 악용 호출이 구분되지 않고, 장치 내부의 API 호출을 기록·감시할 수단이 거의 없음
  reference: |-
    ■ OT 관점
    - 대상: PLC·안전 제어기의 시스템 함수(SFC·SFB)와 펌웨어 시스템 호출, Windows·Linux 기반 HMI·EWS·SCADA 서버의 네이티브 API (L1~L3)
    - 제어기 쪽 수법: 시스템 함수 블록으로 시계 읽기·데이터 블록 생성(Stuxnet), TCON·TSEND로 PLC에서 임의 TCP 연결 생성(PLC-Blaster), 펌웨어 시스템 호출로 메모리·레지스터 읽기·쓰기(Triton)
    - 호스트 쪽: Windows API로 디스크 핸들 확보·프로세스 주입(KillDisk·Bad Rabbit 등) — 통합: Enterprise 네이티브 API(T1106)
    ■ 실제 사례
    - [실제 사고] Triton(2017-08): 펌웨어 시스템 호출을 쓰는 imain.bin으로 안전 제어기 메모리·레지스터를 읽고 쓰고 실행 (INC-004, ATT&CK S1009)
    - [실제 사고] Stuxnet(2010-06): PLC 시스템 함수 블록으로 시계를 읽고 데이터 블록을 실행 중에 생성 (INC-009, ATT&CK S0603)
    - [실증] PLC-Blaster(2016-03): 시스템 함수 블록 TCON·TSEND·TRCV로 다른 PLC에 연결해 웜을 퍼뜨림 (INC-024, ATT&CK S1006)
  detect: |-
    ■ 탐지
    - 제어기 프로그램의 통신·메모리 관련 시스템 함수 사용을 기준 프로젝트와 비교하고, PLC가 평소 없던 TCP 연결을 만들면 OT 네트워크 감시로 경보
    - HMI·EWS에서는 EDR로 프로세스 주입·디스크 직접 접근 같은 의심 API 호출 패턴 탐지(OT 벤더 호환성 확인 후 적용)
    ■ 대응
    - 제어기 접근 보호로 프로그램 변경을 막고 쓰지 않는 통신 기능(PUT/GET·개방형 통신)을 끔
    - 호스트에는 애플리케이션 허용 목록을 적용해 비인가 실행 파일이 API를 호출할 기회를 줄임

T0853:
  summary: |-
    - 공격자는 PowerShell·VBScript·배치 파일·Python 같은 스크립트로 공격 도구를 실행하고 작업을 자동화해, 정상 관리 작업처럼 보이게 할 수 있음
    - OT 호스트에도 운영 자동화용 스크립트 환경이 기본으로 깔려 있고, 메모리에서만 실행하거나 난독화하면 파일 기반 검사로 잡기 어려움
  reference: |-
    ■ OT 관점
    - 대상: Windows 기반 EWS·HMI·SCADA 서버·히스토리언, 도메인 정책을 받는 OT 호스트, Python 등 스크립트 엔진이 설치된 엔지니어링 단말 (L2~L3)
    - 수법: VBS → 배치 파일 → SCADA 명령 도구로 이어지는 실행(2022 MicroSCADA), PowerShell 도구로 그룹 정책 경유 와이퍼 배포(TANKTRAP), 메모리 내 자격증명 수집, 문서 매크로로 최초 감염, Python으로 재구성한 산업 프로토콜 프레임워크(Triton)
    - 통합: Enterprise PowerShell(T1059.001)·Visual Basic(T1059.005) — 명령 셸 직접 실행은 OTC-EX-01, 그룹 정책 경유 배포는 OTC-PV-04.1
    ■ 실제 사례
    - [실제 사고] 2022 우크라이나(2022-10): lun.vbs가 n.bat을 실행하고 n.bat이 MicroSCADA scilc.exe로 차단기 명령을 보냄 — PowerShell 도구 TANKTRAP으로 와이퍼도 배포 (INC-006, ATT&CK C0034)
    - [실제 사고] 2016 우크라이나(2016-12): VBS·배치 스크립트로 파일을 옮기고 PowerShell로 자격증명 수집 도구를 메모리에서 실행 (INC-003, ATT&CK C0025)
    - [실제 사고] Triton(2017-08): PowerShell 기반 공개 도구 WMImplant를 쓰고, Python으로 짠 TriStation 통신 프레임워크로 안전 제어기를 조작 (INC-004, ATT&CK C0030)
  detect: |-
    ■ 탐지
    - OT 호스트에도 PowerShell 스크립트 블록 로깅과 명령줄 감사를 켜고, wscript·cscript·powershell이 제어 소프트웨어 명령 도구를 부르는 프로세스 체인을 경보
    - 그룹 정책·예약 작업으로 새로 배포된 스크립트 파일과 WMI·PsExec를 통한 원격 스크립트 실행 감시
    ■ 대응
    - OT 호스트에서 쓰지 않는 스크립트 엔진을 막고, PowerShell 제한 언어 모드와 서명된 스크립트만 실행하도록 설정
    - 문서 매크로를 기본 차단하고, 운영 자동화 스크립트는 승인된 저장소에서만 배포

T0858:
  summary: |-
    - 공격자는 제어기의 운전 모드를 RUN에서 PROGRAM·STOP·REMOTE로 바꿔, 프로그램 다운로드·메모리 쓰기 같은 엔지니어링 기능을 열거나 제어 로직 실행을 멈출 수 있음
    - 키 스위치를 원격 변경이 가능한 위치에 둔 채 운영하는 경우가 흔해 프로토콜 명령만으로 모드가 바뀌고, 모드 변경을 기록·경보하지 않는 장치도 많음
  reference: |-
    ■ OT 관점
    - 대상: PLC·PAC·DCS 제어기와 안전 제어기(SIS)의 운전 모드(RUN·PROGRAM·STOP·REMOTE)와 물리 키 스위치 (L1)
    - 수법: 공격 도구에 내장된 정지·실행 명령(Triton의 TriStation halt·run, PLC-Blaster의 프로그램 정지 후 재기동), 장치 웹 인터페이스로 모드 변경(INCONTROLLER의 Omron PLC 대상 HTTP 연결)
    - 모드 변경 뒤에는 제어 프로그램 다운로드(OTC-LM-01.0)·제어기 태스크 변조(OTC-EX-02)·시스템 펌웨어 변조(OTC-PE-04.1)가 이어지고, STOP 상태로 두면 장치 정지(OTC-IR-04)와 같은 결과가 남 — 현재 모드는 운전 모드 탐지(OTC-CO-08)로 먼저 확인
    ■ 실제 사례
    - [실제 사고] Triton(2017-08): 키 스위치가 PROGRAM 위치에 있던 Tricon 안전 제어기의 프로그램을 TriStation 프로토콜로 멈추고 다시 실행하며 공격 코드를 심음 (INC-004, ATT&CK S1009)
    - [위협인텔] PIPEDREAM(2022-04): INCONTROLLER가 HTTP로 Omron PLC의 운전 모드를 바꾸는 기능을 갖춘 채 배포 전에 발견 (INC-022, ATT&CK S1045)
    - [실증] PLC-Blaster(2016-03): 대상 PLC의 사용자 프로그램을 멈추고 웜 코드를 복사한 뒤 다시 기동 (INC-024, ATT&CK S1006)
  detect: |-
    ■ 탐지
    - 운전 모드를 바꾸는 기능 코드(정지·실행·모드 전환)를 OT 네트워크 감시로 탐지하고, 장치 이벤트 로그·진단 버퍼의 모드 변경 기록 수집
    - 키 스위치 위치를 감시 신호로 HMI·SCADA에 올려, PROGRAM·REMOTE 상태가 작업 일정 밖에 나타나거나 오래 유지되면 경보
    ■ 대응
    - 정상 운전 중에는 키 스위치를 RUN(잠금)에 두고 키를 관리하며, 모드 변경은 변경 관리 절차로 승인
    - 엔지니어링 프로토콜 접근을 지정 EWS로 제한하고 제어기 접근 암호·인증 기능을 켬

T0863:
  summary: |-
    - 공격자는 운영자·엔지니어가 첨부파일·설치 파일·프로젝트 파일을 직접 열거나 실행하게 만들어, 사용자 권한으로 OT 단말에서 악성 코드를 실행시킬 수 있음
    - 엔지니어링 업무는 벤더 설치 파일·프로젝트 파일을 일상적으로 주고받아 위장이 쉽고, 파일을 여는 행위 자체가 정상 업무라 차단 기준을 세우기 어려움
  reference: |-
    ■ OT 관점
    - 대상: EWS·HMI 운영 단말, 점프 호스트, OT 접근 권한이 있는 업무 단말과 엔지니어링 소프트웨어(프로젝트·설정 파일 편집기) (L2~L3)
    - 수법: 문서 매크로(2015 우크라이나), 트로이 목마화된 설치 파일(Havex), 감염된 엔지니어링 프로젝트 파일(Stuxnet) — 공격자가 장악한 PLC에서 올려받은 프로젝트가 EWS를 감염시키는 역방향 경로도 시연됨(Evil PLC, INC-081)
    - CISA ICS 권고에서 프로젝트·설정 파일 파싱 취약점(로컬 경로의 메모리 손상·역직렬화) 1,491건, 2025년 이후 400건 — 조작된 파일을 여는 것만으로 코드가 실행됨
    - 통합: Enterprise 악성 파일 실행(T1204.002) — 이메일 전달은 스피어피싱 첨부파일(OTC-IA-09), 프로젝트 파일 감염은 OTC-PE-02.1
    ■ 실제 사례
    - [실제 사고] 2015 우크라이나(2015-12): 직원이 첨부 문서의 매크로를 허용하자 BlackEnergy가 설치됨 (INC-002, ATT&CK C0028)
    - [실제 사고] Dragonfly(2014-06): 이메일에 첨부된 트로이 목마 설치 파일을 사용자가 실행해 Havex(Backdoor.Oldrea)에 감염 (INC-013, ATT&CK S0093)
    - [공개 취약점] Delta DOPSoft(CVE-2021-38406): HMI 편집 소프트웨어가 조작된 프로젝트 파일을 열 때 범위 밖 쓰기로 코드가 실행됨 — KEV 등재
  detect: |-
    ■ 탐지
    - Office·PDF 뷰어·압축 프로그램·엔지니어링 소프트웨어가 스크립트 엔진·명령 셸 같은 자식 프로세스를 만들면 EDR로 경보
    - 외부에서 들어온 설치 파일·프로젝트 파일의 출처·해시를 기록하고 벤더 공식 배포본과 대조
    ■ 대응
    - OT 단말에서 매크로와 외부 실행 파일을 기본 차단하고, 벤더 소프트웨어는 서명·해시를 확인한 승인 저장소에서만 설치
    - 엔지니어링 소프트웨어를 최신으로 유지하고(KEV·CISA 권고 우선), 출처가 불분명한 프로젝트 파일은 격리 환경에서 먼저 열기

T0871:
  summary: |-
    - 공격자는 제어 소프트웨어가 장치와 통신할 때 쓰는 API(엔지니어링 프로토콜 함수·벤더 라이브러리)를 호출해, 프로그램 다운로드·메모리 쓰기·장치 설정 같은 기능을 엔지니어링 도구 없이 실행할 수 있음
    - 장치 입장에서는 정상 엔지니어링 요청과 같고, 역분석한 프로토콜이나 공개된 벤더 라이브러리만 있으면 재현할 수 있음
  reference: |-
    ■ OT 관점
    - 대상: 엔지니어링 프로토콜(TriStation·S7comm·CIP 등)과 벤더 API를 받아들이는 PLC·안전 제어기·RTU·HMI·데이터 게이트웨이 (L1~L2)
    - 수법: 역분석으로 재구성한 프로토콜 라이브러리로 프로그램 다운로드·할당·변경 함수를 호출(Triton) — 공개된 벤더 SDK·엔지니어링 라이브러리를 불러 같은 기능을 쓰는 방식도 가능
    - 구분: 비인가 명령 메시지(OTC-IP-03.1)가 운전 명령(쓰기·동작)을 보낸다면, 이 기법은 장치 관리·프로그래밍 기능을 부르는 데 초점 — OS·펌웨어 수준 호출은 네이티브 API 악용(OTC-EX-04)
    ■ 실제 사례
    - [실제 사고] Triton(2017-08): 재구성한 TriStation 프로토콜 프레임워크로 안전 제어기의 프로그램 다운로드·할당·변경 API를 호출 (INC-004, ATT&CK S1009)
  detect: |-
    ■ 탐지
    - 엔지니어링 프로토콜의 프로그램 다운로드·메모리 쓰기 함수 호출을 OT 네트워크 감시로 탐지하고, 지정 EWS 밖 발신지나 작업 일정 밖 호출을 경보
    - 장치 감사 로그(지원 시)를 엔지니어링 소프트웨어 작업 기록과 대조해 도구 밖에서 이뤄진 호출 확인
    ■ 대응
    - 엔지니어링 기능에 인증과 역할별 권한을 적용하고 지정 EWS에서만 허용
    - 키 스위치·접근 보호로 운전 중 프로그래밍 API 사용을 막음

T0874:
  summary: |-
    - 공격자는 API 함수 주소·명령 처리기를 가로채거나 정상 프로세스에 코드를 주입해, 정상 기능이 호출될 때 자신의 코드가 먼저 실행되게 할 수 있음
    - 신뢰된 프로세스·펌웨어 안에서 실행돼 실행 주체가 정상으로 보이고, 반환값까지 바꿀 수 있어 감염 사실을 숨기는 데도 쓰임
  reference: |-
    ■ OT 관점
    - 대상: 엔지니어링 소프트웨어·HMI가 쓰는 Windows DLL, 신뢰된 시스템 프로세스(svchost·explorer), 안전 제어기 펌웨어의 명령 처리기 (L1~L3)
    - 수법: 프로젝트 파일을 여는 API의 가져오기 주소 테이블(IAT) 후킹(Stuxnet), 안전 제어기 진단 명령 처리기의 함수 포인터 변경(Triton), 정상 프로세스 DLL 주입·프로세스 할로잉(BlackEnergy·Duqu·Havex)
    - 엔지니어링 소프트웨어의 PLC 통신 DLL을 가짜로 바꿔 블록 읽기·쓰기를 가로채는 수법은 루트킷(OTC-EV-03)으로 분류 — 통합: Enterprise 프로세스 주입(T1055)·DLL 주입(T1055.001)·프로세스 할로잉(T1055.012)
    ■ 실제 사례
    - [실제 사고] Triton(2017-08): 'get main processor diagnostic data' 명령 처리기의 함수 포인터를 imain.bin 주소로 바꿔 정상 처리 전에 공격 코드가 실행되게 함 (INC-004, ATT&CK S1009)
    - [실제 사고] Stuxnet(2010-06): 프로젝트 파일을 여는 API를 IAT 후킹으로 가로채고 신뢰된 프로세스에 DLL 전체를 주입 (INC-009, ATT&CK S0603)
    - [실제 사고] 2015 우크라이나(2015-12): BlackEnergy를 svchost.exe에 올린 뒤 C2 통신용 브라우저 프로세스를 띄움 (INC-002, ATT&CK C0028)
  detect: |-
    ■ 탐지
    - EDR로 원격 스레드 생성·타 프로세스 메모리 쓰기 같은 주입 패턴과 엔지니어링 소프트웨어에 로드된 미서명 DLL 탐지(OT 벤더 호환성 확인 후 적용)
    - PLC·안전 제어기는 벤더 진단 도구로 펌웨어·메모리 무결성을 점검하고, 평소 쓰지 않는 진단 명령 사용을 OT 네트워크 감시로 확인
    ■ 대응
    - 엔지니어링 소프트웨어·HMI 설치 경로의 쓰기 권한을 제한하고 DLL 서명 검증·애플리케이션 허용 목록 적용
    - 제어기 펌웨어 무결성 검증 기능을 켜고, 안전 제어기의 원격 프로그래밍은 운전 중 차단

T0895:
  summary: |-
    - 공격자는 이동식 매체나 디스크 이미지(ISO)의 자동 실행 기능을 이용해, 매체를 연결·마운트하는 순간 악성 코드를 실행시킬 수 있음
    - 레거시 운영체제를 오래 쓰는 OT 호스트에는 자동 실행이 켜진 채 남은 경우가 있고, 가상화 환경에서는 하이퍼바이저에서 이미지를 붙이기만 해도 VM 안에서 실행이 일어남
  reference: |-
    ■ OT 관점
    - 대상: 레거시 Windows를 쓰는 HMI·EWS·SCADA 서버, 가상화된 SCADA 서버(하이퍼바이저 관리 권한 경유), 현장에서 USB를 쓰는 단말 (L2~L3)
    - 수법: 하이퍼바이저 권한으로 SCADA 서버 VM에 ISO 이미지를 연결해 자동 실행(2022 우크라이나), USB 매체의 자동 실행 설정 — USB를 통한 침투·전파 자체는 이동식 매체 전파(OTC-IA-04)
    - 가상화 관리 권한이 있으면 OT 네트워크를 거치지 않고 VM 내부에서 실행되므로 네트워크 감시를 우회함
    ■ 실제 사례
    - [실제 사고] 2022 우크라이나(2022-10): 기존 하이퍼바이저 접근으로 SCADA 서버 VM에 a.iso를 연결했고, CD-ROM 자동 실행이 켜진 서버에서 이미지 속 VBS가 자동 실행됨 (INC-006, ATT&CK C0034)
  detect: |-
    ■ 탐지
    - 새 드라이브 문자·마운트 생성과 이동식 매체·이미지에서 시작된 프로세스를 감시하고, 하이퍼바이저의 가상 매체 연결 이벤트를 수집
    - 하이퍼바이저 관리 콘솔 로그인과 VM 설정 변경을 OT 변경 이력과 대조
    ■ 대응
    - OT 호스트의 자동 실행·자동 재생을 정책으로 끄고, 이동식 매체는 검사 키오스크를 거친 뒤 사용
    - 가상화 관리 콘솔을 별도 관리망·다중 인증으로 보호하고 VM 가상 매체 연결 권한을 제한

T1053:
  summary: |-
    - 공격자는 작업 스케줄러·cron·네트워크 장비 예약 작업에 악성 명령을 등록해, 정한 시각에 실행하거나 재부팅 뒤에도 유지하고, 원격 호스트에 작업을 만들어 확산할 수 있음
    - 운영·백업 자동화용 예약 작업이 많아 새 작업이 눈에 띄지 않고, 파괴형 공격은 여러 호스트에서 같은 시각에 동시 실행되게 맞춰 복구를 어렵게 함
  reference: |-
    ■ OT 관점
    - 대상: Windows 기반 EWS·HMI·SCADA 서버·히스토리언, 도메인 그룹 정책을 받는 OT 호스트, OT 경계 방화벽의 예약 작업 기능 (L2~L3.5)
    - 수법: 그룹 정책 개체(GPO)로 예약 작업을 배포해 와이퍼를 일제히 실행(2022 우크라이나), 방화벽 예약 작업으로 공격자 CLI 스크립트를 매주 실행(2025 폴란드), 감염 직후 실행·재부팅 예약(Stuxnet·NotPetya)
    - 실행·지속성·권한 상승 전술에 같은 기법으로 나타남(OTC-EX-11·PE-06·PV-03) — 통합: Enterprise 예약 작업(T1053.005), 그룹 정책 변조는 OTC-PV-04.1
    ■ 실제 사례
    - [실제 사고] 2022 우크라이나(2022-10): GPO에 등록한 예약 작업으로 정해진 시각에 CaddyWiper를 실행 (INC-006, ATT&CK C0034)
    - [실제 사고] 2025 폴란드(2025-12): FortiGate 예약 작업에 공격자가 만든 CLI 스크립트를 걸어 매주 실행 (INC-008, ATT&CK C0063)
    - [실제 사고] NotPetya(2017-06): 감염 1시간 뒤 재부팅하는 작업을 만들어 디스크 암호화를 실행 (INC-016, ATT&CK S0368)
  detect: |-
    ■ 탐지
    - 작업 스케줄러의 작업 생성·변경 이벤트와 원격 작업 생성(schtasks /s 등)을 수집하고, 승인된 예약 작업 목록과 정기 비교
    - 그룹 정책 변경과 방화벽·네트워크 장비의 예약 작업 설정 변경을 중앙 로그로 경보
    ■ 대응
    - 예약 작업 생성 권한을 관리자 계정으로 제한하고, OT 도메인을 IT 도메인과 분리해 GPO 경유 일괄 배포를 막음
    - OT 호스트·경계 장비의 예약 작업을 변경 관리 대상으로 등록하고 설정 백업과 비교 점검
