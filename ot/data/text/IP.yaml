# [IP] 공정 제어 훼손 — OT 관점 문구 (파일럿)
# 키: ATT&CK 기법 ID(같은 기법이 여러 전술에 나오면 같은 문구 사용, 전술별로 달리 쓰려면 '기법ID@전술코드')
# summary : 요약설명 2줄 개조식 — ① 공격자는 [수단·경로]로 [행위]할 수 있음 ② 피해·확산 특성 또는 탐지·방어가 어려운 이유
# reference: ■ OT 관점(대상 자산·프로토콜·Purdue 계층·전제·변형·연계 OTC-ID, 출처 괄호) / ■ 실제 사례(라벨, '사례명(YYYY-MM): 경위·결과 (출처)')
# detect   : ■ 탐지 / ■ 대응 (OT 운영 제약 반영)
# 사례 라벨: [실제 사고] 사고 DB 실제 사고 · [위협인텔] 배포 전 발견된 공격 도구 · [공개 취약점] CISA ICS 권고·KEV · [실증] 연구·시연 · [시나리오] 가정 사례

T0806:
  summary: |-
    - 공격자는 제어기의 I/O 포인트 값을 범위 전체로 또는 특정 지점에 반복해서 바꿔, 공정 기능을 불안정하게 만들거나 차단기·밸브 같은 현장 설비를 연속 동작시킬 수 있음
    - 정상 쓰기 명령과 같은 프로토콜 기능을 쓰므로 한 건씩 봐서는 구분되지 않고, 반복 동작이 설비 마모나 하류 설비 손상으로 나타난 뒤에야 드러나기 쉬움
  reference: |-
    ■ OT 관점
    - 대상: IEC 60870-5-104·IEC 61850·Modbus·M-Bus로 I/O를 다루는 RTU·IED·PLC·SCADA 서버와 현장 센서 게이트웨이 (L1~L2)
    - 수법: 대상 범위의 정보 객체 주소(IOA)를 모은 뒤 상태를 반복 전환하거나 한 포인트에 값을 반복 기록 — 포인트 정보가 부족해도 범위 전체를 흔들어 영향을 낼 수 있음
    - 사전에 포인트·태그 식별(OTC-CO-07)·공정 상태 감시(OTC-CO-01)로 주소를 확보하고, 비인가 명령 메시지(OTC-IP-03.1)로 쓰기를 전달함
    ■ 실제 사례
    - [실제 사고] 2016 우크라이나 송전 변전소(2016-12): Industroyer의 IEC 104 모듈이 수집한 IOA 전체의 상태를 무한 반복으로 바꾸는 range 모드를 갖춤 (INC-003, ATT&CK S0604)
    - [실제 사고] Fuxnet(2024-04): 침해한 게이트웨이에서 M-Bus로 연결 센서에 임의 데이터를 반복 기록해 계측을 무력화 (INC-023, ATT&CK S1157)
    - [실제 사고] Industroyer2(2022-04): 설정된 IOA의 ON/OFF 상태를 순회하며 바꾸도록 구성됐으나 실행 전에 차단 (INC-021, ATT&CK S1072)
  detect: |-
    ■ 탐지
    - 짧은 시간에 다수 I/O 포인트로 향하는 쓰기·선택 후 실행(SBO) 명령과 같은 포인트의 반복 상태 변경을 공정 이력(히스토리언)과 OT 네트워크 감시로 탐지
    - 차단기·밸브의 비정상 동작 횟수와 설비 진단 경보를 명령 발신지(평소 통신하지 않는 호스트)와 상관 분석
    ■ 대응
    - 제어 명령을 보낼 수 있는 호스트를 프로토콜 허용 목록으로 제한하고 쓰기 기능 코드는 지정 SCADA·EWS에서만 허용
    - 현장 설비에 동작 횟수 제한·인터록을 두고, 인증을 지원하는 프로토콜(IEC 62351·DNP3-SA 등) 적용 검토

T0836:
  summary: |-
    - 공격자는 제어기·드라이브의 운전 파라미터(설정값·운전 시간·한계값·회전 속도)를 바꿔, 운영자가 의도하지 않은 범위로 공정을 움직이게 할 수 있음
    - 정상 엔지니어링 기능으로 바뀌는 값이라 로직 변경 없이도 위험한 결과를 내며, 장치가 변경 이력을 남기지 않는 경우가 많아 사후 확인도 어려움
  reference: |-
    ■ OT 관점
    - 대상: PLC·RTU·DCS 제어기의 설정값·레지스터, 인버터·서보 드라이브 파라미터, HMI에서 조정할 수 있는 운전 한계값 (L1)
    - 경로: Modbus 레지스터 쓰기(FrostyGoop), Profibus 드라이브 설정(Stuxnet), IEC 104 IOA 변경(Industroyer2), 장치 웹·CGI 인터페이스(INCONTROLLER), 인터넷에 노출된 HMI·VNC 직접 조작
    - 인터넷 노출 HMI의 설정값을 최대치로 바꾸는 핵티비스트형 조작이 2024년 이후 반복되며(OTC-IA-11), 정밀한 공정 지식 없이도 탱크 범람·과압 같은 결과를 냄
    ■ 실제 사례
    - [실제 사고] 리비우 지역난방(2024-01): FrostyGoop이 Modbus TCP로 ENCO 제어기 값을 바꿔 측정값을 틀리게 보고하게 했고 약 600개 건물의 난방이 끊김 (INC-007, ATT&CK C0041)
    - [실제 사고] Stuxnet(2010-06): 주파수 변환기의 최대 주파수 등 파라미터를 바꿔 원심분리기 회전 속도를 조작 (INC-009, ATT&CK S0603)
    - [실제 사고] 텍사스 소도시 상수도(2024-01)·캐나다 핵티비스트(2025-10): 노출된 HMI·제어 장치의 설정을 바꿔 물탱크 범람, 압력·탱크 게이지 값 조작 (INC-061, INC-072)
  detect: |-
    ■ 탐지
    - 설정값·한계값을 자산 관리 시스템의 승인 값과 주기적으로 대조하고, 장치 이벤트 로그·파라미터 변경 경보를 수집
    - 쓰기 명령의 발신지·시간대(근무 외)·변경 폭(정상 운전 범위 이탈)을 OT 네트워크 감시와 공정 이력으로 상관 분석
    ■ 대응
    - 중요 파라미터는 입력값 범위 제한과 2인 승인을 거치게 하고, 원격 쓰기를 지정 엔지니어링 단말로 제한
    - HMI·제어 장치의 인터넷 노출 제거, 기본·공용 계정 폐기, 독립 안전계통·기계식 보호 장치로 위험 한계 이중화

T1692.001:
  summary: |-
    - 공격자는 제어 서버·위장 마스터·침해 장치에서 OT 프로토콜 명령 메시지를 직접 보내, 차단기 개방·펌프 정지·경보 발령 같은 동작을 정상 절차 없이 실행시킬 수 있음
    - Modbus·DNP3·IEC 104 등 다수 산업 프로토콜과 무선 제어 신호는 발신자 인증이 없어, 통신 경로에 닿기만 하면 명령이 그대로 수용됨
  reference: |-
    ■ OT 관점
    - 대상: RTU·IED·PLC·안전 제어기·SCADA 서버와 무선 원격 제어 설비(옥외 경보 사이렌, 철도 무선 비상정지) (L1~L2)
    - 수법: 프로토콜 페이로드를 내장한 공격 도구(Industroyer·Industroyer2·INCONTROLLER), 정상 SCADA 도구 악용(2022 MicroSCADA), 무선·적외선 신호 재전송·위조
    - CISA ICS 권고에서 인증 없는 핵심 기능(CWE-306)·재전송 취약(CWE-294) 313건 확인 — 설계상 인증이 없는 프로토콜은 CVE 없이도 같은 결과를 냄
    - 연계: 위장 마스터(OTC-IA-05), 무선 통신 침해(OTC-IA-06), I/O 무차별 조작(OTC-IP-01)
    ■ 실제 사례
    - [실제 사고] 2016·2022 우크라이나(2016-12·2022-10): Industroyer가 RTU에 상태 변경 명령을, MicroSCADA SCIL-API로 변전소 장치에 비인가 명령을 보내 정전 (INC-003, INC-006)
    - [실제 사고] 폴란드 철도 Radio-Stop(2023-08): 인증 없는 무선 비상정지 신호를 무단 송신해 열차 20여 대 정지 (INC-057)
    - [실증] Aurora 시험(2007-03): 차단기 개폐 명령만으로 발전기를 물리적으로 파괴할 수 있음을 시연 (INC-077)
  detect: |-
    ■ 탐지
    - OT 네트워크 감시로 명령 기능 코드(쓰기·SBO·Operate)의 발신지·대상·빈도를 기준선과 비교하고, 평소 명령을 보내지 않는 호스트의 명령을 경보
    - 공정 이력의 설정값·차단기 상태 변화를 SCADA 운영자 조작 기록과 대조해 근거 없는 상태 변경 확인
    ■ 대응
    - 명령 발신 허용 목록과 프로토콜 인식 방화벽(DPI)으로 쓰기 기능을 지정 마스터로 제한하고, 인증을 지원하는 프로토콜(IEC 62351·DNP3-SA·CIP Security) 적용
    - 무선 제어 신호는 암호화·재전송 방지를 적용하고, 중요 동작은 현장 인터록·확인 절차를 거치게 함

T1692.002:
  summary: |-
    - 공격자는 계측값·상태값을 담은 보고 메시지를 위조해, 운영자에게 정상 상태를 보이거나 다른 고장을 꾸며 실제 공격에서 주의를 돌릴 수 있음
    - 폐루프 제어는 보고값을 근거로 동작하므로 위조 보고가 곧 제어 조작으로 이어지며, 화면과 이력이 모두 공격자가 만든 값으로 채워짐
  reference: |-
    ■ OT 관점
    - 대상: 텔레메트리를 주고받는 RTU·IED·데이터 게이트웨이와 SCADA 서버·HMI, 원격 감시용 무선 링크 (L1~L2)
    - 전제: 통신 경로에 끼어들거나(중간자 공격, OTC-CO-04) 위장 마스터·위장 장치(OTC-IA-05)로 메시지를 주입할 수 있어야 함
    - 감시 화면 조작(OTC-IM-08)과 달리 HMI가 아니라 통신 메시지 자체를 위조하므로 같은 값을 받는 제어 로직·히스토리언까지 영향이 미침 — Stuxnet의 정상값 재생은 OTC-IM-08로 분류
    ■ 실제 사례
    - [실제 사고] 마루치 하수처리(2000-03): 전용 무선망으로 펌프장과 중앙 컴퓨터에 거짓 데이터와 명령을 보내 경보와 펌프 동작을 교란 (INC-001, ATT&CK C0020)
  detect: |-
    ■ 탐지
    - 같은 공정 변수를 다른 경로(독립 계측·현장 표시기·이중 센서)로 확인해 보고값 불일치 탐지
    - 보고 메시지의 발신 장치·순번·주기 이상과 같은 주소의 중복 응답을 OT 네트워크 감시로 경보
    ■ 대응
    - 보고 메시지에 무결성·출처 인증(IEC 62351 등)을 적용하고 무선 텔레메트리를 암호화
    - 안전 관련 판단은 독립 안전계통과 현장 계측에 두고, 보고값만으로 위험 동작을 수행하지 않도록 설계

T1693:
  summary: |-
    - 공격자는 제어기·네트워크 장비의 펌웨어 업데이트 기능으로 악성·구버전 펌웨어를 설치해, 장치 최하위 계층에서 지속성과 완전한 제어권을 확보할 수 있음
    - 펌웨어 변경을 알리는 경보·로그가 없는 장치가 많고 서명 검증이 없으면 정상 업데이트와 구분되지 않으며, 장치를 쓸 수 없게 만들면 교체 외에는 복구가 어려움
  reference: |-
    ■ OT 관점
    - 대상: PLC·안전 제어기·DCS 제어기 본체와 통신·I/O 모듈, RTU·게이트웨이, OT 경계 방화벽·스위치 (L1~L3.5)
    - 경로: 원격 펌웨어 업데이트 기능, 이동식 매체, 공급망 유입 펌웨어(OTC-IA-07), 펌웨어 업데이트 모드 활성화(OTC-IR-01)
    - 이 행은 시스템·모듈로 특정되지 않은 근거 — 세부는 시스템 펌웨어(OTC-PE-04.1)·모듈 펌웨어(OTC-PE-04.2)
    ■ 실제 사례
    - [공개 취약점] CISA ICS 권고: 무결성 검증 없이 코드·펌웨어를 받아들이는 취약점(CWE-494·347·1277) 44건, 2025년 이후 20건 — 서명 없는 업데이트로 변조 펌웨어 설치 가능
  detect: |-
    ■ 탐지
    - 장치 펌웨어 버전·해시를 자산 관리 기준과 주기적으로 대조하고, 펌웨어 전송·업데이트 프로토콜 기능을 OT 네트워크 감시로 경보
    - 업데이트 모드 전환, 예기치 않은 재부팅·고장 코드를 장치 진단과 함께 확인
    ■ 대응
    - 서명 검증·보안 부팅을 지원하는 펌웨어로 갱신하고, 펌웨어 업데이트는 변경 관리 절차를 거쳐 지정 단말에서만 수행
    - 키스위치·물리 보호로 원격 업데이트 모드를 막고, 예비 장치와 정상 펌웨어 원본을 확보해 복구 시간 단축

T1693.001:
  summary: |-
    - 공격자는 장치 펌웨어를 악성·구버전으로 바꾸거나 덮어써, 감시 기능을 없애거나 장치를 영구적으로 쓸 수 없게 만들 수 있음
    - 원격 복구 수단 자체가 사라져 현장 교체가 필요해지고, 정전·공정 복구를 수동 조작에 의존하게 만듦
  reference: |-
    ■ OT 관점
    - 대상: 직렬-이더넷 변환기·RTU·안전 제어기·제어기 본체, VPN·방화벽·스위치 같은 경계 장비 (L1~L3.5)
    - 목적별 변형: 파괴(펌웨어 덮어쓰기·공장 초기화로 사용 불능), 은닉(다운그레이드로 감시 기능 제거), 장악(펌웨어 영역 메모리 변조로 최고 권한 확보)
    - 통합: Enterprise 펌웨어 손상(T1495)·다운그레이드 공격(T1689) — 같은 행위를 OT 장치에서 표현
    - 하드웨어 신뢰 루트가 없으면 부팅 무결성 검증도 우회될 수 있음 (INC-079, CVE-2022-38773)
    ■ 실제 사례
    - [실제 사고] 2015 우크라이나(2015-12): 직렬-이더넷 변환기를 맞춤 펌웨어로 덮어써 원격 복구를 막음 (INC-002, ATT&CK C0028)
    - [실제 사고] 2025 폴란드(2025-12): Hitachi RTU 펌웨어를 손상시켜 재부팅 반복을 일으키고, 장치 공장 초기화로 포렌식을 방해 (INC-008, ATT&CK C0063)
    - [실제 사고] 리비우 지역난방(2024-01): 피해 장치 펌웨어를 다운그레이드해 공정 가시성을 떨어뜨림 (INC-007, ATT&CK C0041)
  detect: |-
    ■ 탐지
    - 펌웨어 버전·해시를 정기 대조하고, 장치의 예기치 않은 재부팅·고장 반복·통신 두절을 장치 진단과 OT 감시로 경보
    - 경계 장비는 설정·펌웨어 변경 이력과 관리 접속 기록을 중앙으로 모아 승인되지 않은 변경 확인
    ■ 대응
    - 서명 펌웨어·보안 부팅을 적용하고, 펌웨어 업데이트 기능은 키스위치·관리 인증으로 보호해 지정 단말에서만 허용
    - 핵심 장치의 예비품·정상 펌웨어·설정 백업을 확보하고 현장 교체·재구성 절차를 사전 훈련

T1693.002:
  summary: |-
    - 공격자는 제어기에 장착된 통신·I/O 모듈의 별도 펌웨어를 변조해, 본체보다 무결성 검사가 약한 모듈에 지속 거점을 만들 수 있음
    - 모듈은 자체 CPU·메모리·운영체제를 갖춰 본체를 다시 설치해도 악성 펌웨어가 남을 수 있고, 모듈 단위 펌웨어 점검은 대부분 운영 절차에 들어 있지 않음
  reference: |-
    ■ OT 관점
    - 대상: PLC·DCS 제어기·안전 제어기의 이더넷 통신 모듈, 필드버스·I/O 모듈 (L1)
    - 이더넷 카드가 가장 쉬운 진입점 — 장악하면 지연 공격, 카드 파괴, 현장 장치 간 웜, 같은 장치의 다른 모듈 공격으로 이어질 수 있음
    - 시스템 펌웨어 변조(OTC-PE-04.1)와 같은 업데이트 경로를 쓰지만 검증 수준이 더 낮은 구성요소를 노림
    ■ 실제 사례
    - 공개 사고 미확인 — ATT&CK에 실제 사용 절차가 없고, 모듈 펌웨어는 포렌식이 어려워 발견되지 않았을 가능성
  detect: |-
    ■ 탐지
    - 모듈별 펌웨어 버전을 자산 대장에 기록해 정기 점검하고, 모듈 재시작·통신 이상을 장치 진단으로 확인
    - 모듈을 향한 펌웨어 전송 기능을 OT 네트워크 감시로 경보
    ■ 대응
    - 모듈 펌웨어도 서명 검증을 지원하는 버전으로 갱신하고, 구매·수리 반입 단계에서 펌웨어 확인
    - 의심되면 모듈 단위로 교체하고 정상 펌웨어로 다시 설치
