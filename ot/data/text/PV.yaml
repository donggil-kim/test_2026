# [PV] 권한 상승 — OT 관점 문구
# 작성 규칙은 IP.yaml 머리말 참고
# 후킹(T0874)·예약 작업(T1053)은 EX.yaml, 시스템 서비스 생성·변조(T1543)는 PE.yaml 문구를 같이 씀

T0890:
  summary: |-
    - 공격자는 운영체제·엔지니어링 소프트웨어·제어기 펌웨어의 취약점을 악용해, 일반 사용자 권한에서 관리자·커널·펌웨어 수준 권한으로 올라갈 수 있음
    - OT 호스트는 패치 주기가 길어 알려진 로컬 권한 상승 취약점이 오래 남고, 제어기 펌웨어 취약점은 공개와 패치 자체가 늦음
  reference: |-
    ■ OT 관점
    - 대상: EWS·HMI·SCADA 서버의 Windows·Linux와 그 위의 엔지니어링·SCADA 소프트웨어, 안전 제어기·PLC 펌웨어, 취약한 서명 드라이버 (L1~L3)
    - 수법: 안전 제어기 펌웨어의 시스템 호출 0-day로 임의 쓰기 권한 확보(Triton), Windows 로컬 권한 상승 취약점(Stuxnet), 취약한 서명 드라이버로 미서명 드라이버 적재(INCONTROLLER)
    - CISA ICS 권고에서 로컬 권한 관리 결함(CWE-269·732·276·250·427·428·266) 273건, 2025년 이후 63건 — 설치 폴더 권한·DLL 검색 경로 결함이 다수
    - 통합: Enterprise 권한 상승 취약점 악용(T1068)
    ■ 실제 사례
    - [실제 사고] Triton(2017-08): Tricon MP3008 펌웨어(10.0~10.4)의 미공개 시스템 호출 취약점으로 2바이트 임의 쓰기를 얻어 권한을 높임 (INC-004, ATT&CK S1009)
    - [실제 사고] Stuxnet(2010-06): MS10-073과 당시 미공개였던 작업 스케줄러 취약점으로 Windows 로컬 권한 상승 (INC-009, ATT&CK S0603)
    - [위협인텔] PIPEDREAM(2022-04): 취약한 ASRock 드라이버(CVE-2020-15368)로 자체 미서명 드라이버를 적재하는 기능을 갖춘 채 발견 (INC-022, ATT&CK S1045)
  detect: |-
    ■ 탐지
    - 일반 계정 프로세스가 SYSTEM·root 권한 프로세스를 만들거나 알려진 취약 드라이버가 적재되면 EDR로 경보
    - 제어기는 벤더 진단으로 메모리·펌웨어 무결성을 점검하고, 비정상 재시작·오류 경보를 확인
    ■ 대응
    - 로컬 권한 상승 취약점(KEV 우선)과 엔지니어링 소프트웨어 설치 폴더 권한 결함을 패치하고, 취약 드라이버 차단 목록 적용
    - 운영 계정에 관리자 권한을 주지 않고 애플리케이션 허용 목록·익스플로잇 보호를 적용

T1484.001:
  summary: |-
    - 공격자는 도메인 관리자 권한으로 그룹 정책 개체(GPO)를 바꿔, 도메인에 속한 OT 호스트 전체에 악성 코드 실행·보안 설정 해제를 한 번에 내릴 수 있음
    - 정상 관리 기능으로 많은 호스트에 동시에 적용돼 파괴형 공격이 매우 빠르게 퍼지고, OT 호스트가 IT 도메인에 묶여 있으면 IT 침해가 그대로 OT로 번짐
  reference: |-
    ■ OT 관점
    - 대상: Active Directory 도메인에 가입한 EWS·HMI·SCADA 서버·히스토리언과 OT 도메인 컨트롤러 (L2~L3)
    - 수법: GPO에 예약 작업·스크립트를 넣어 와이퍼를 배포·실행(2022 우크라이나·2025 폴란드), 보안 도구·방화벽 설정 해제
    - 권한 상승(OTC-PV-04.1)·회피(OTC-EV-08.1) 전술에 같은 기법으로 나타남 — 예약 작업은 OTC-EX-11, 스크립트 실행은 OTC-EX-05
    ■ 실제 사례
    - [실제 사고] 2022 우크라이나(2022-10): 그룹 정책 개체로 피해 기관 IT 환경에 CaddyWiper를 배포·실행 (INC-006, ATT&CK C0034)
    - [실제 사고] 2025 폴란드(2025-12): 그룹 정책 개체로 네트워크 공유에 둔 와이퍼를 피해 장치들에 배포 (INC-008, ATT&CK C0063)
  detect: |-
    ■ 탐지
    - GPO 생성·변경 이벤트(디렉터리 서비스 변경 감사 5136 등)와 SYSVOL의 새 스크립트·예약 작업 파일을 감시하고 근무 외 변경을 경보
    - GPO 변경 직후 다수 호스트에서 같은 프로세스가 동시에 생기는 패턴을 상관 분석
    ■ 대응
    - OT를 별도 도메인으로 운영해 IT 도메인과의 신뢰 관계를 최소화하고, GPO 편집 권한을 소수 계정으로 제한
    - 도메인 관리자 계정을 특권 접근 관리·다중 인증으로 보호하고, GPO 백업으로 변경 시 즉시 복원
