# [EV] 방어 회피 — OT 관점 문구
# 작성 규칙은 IP.yaml 머리말 참고
# 운전 모드 변경(T0858)은 EX.yaml, 루트킷(T0851)은 IR.yaml, 비인가 메시지(T1692.x)는 IP.yaml, 그룹 정책 변조(T1484.001)는 PV.yaml 문구를 같이 씀

T0820:
  summary: |-
    - 공격자는 소프트웨어·펌웨어 취약점을 악용해 장치의 무결성 점검·보안 기능을 끄거나 우회해, 심어 둔 코드가 발견되지 않게 할 수 있음
    - 안전 제어기처럼 펌웨어·프로그램 체크섬을 계속 확인하는 장치도 점검 루틴 자체가 무력화되면 이상을 보고하지 못함
  reference: |-
    ■ OT 관점
    - 대상: 안전 제어기(SIS)·PLC의 펌웨어 무결성 점검, EWS·HMI의 보안 소프트웨어·커널 보호, 경계 장비의 보안 기능 (L1~L3.5)
    - 수법: 펌웨어 메모리에 페이로드를 넣은 뒤 RAM/ROM 일관성 점검을 끔(Triton) — 권한 상승용 취약점 악용(OTC-PV-02)으로 얻은 권한을 회피에 쓰는 형태가 일반적
    - 사전에 원격 시스템 정보 탐색(OTC-DS-05)으로 장치 모델·펌웨어 버전과 보안 기능을 확인해 대상에 맞는 취약점을 고름
    ■ 실제 사례
    - [실제 사고] Triton(2017-08): Tricon 펌웨어 메모리 영역에 imain.bin을 넣은 뒤 RAM/ROM 일관성 점검을 꺼, 체크섬 기반의 상시 감시를 피함 (INC-004, ATT&CK S1009)
  detect: |-
    ■ 탐지
    - 제어기 진단 정보(펌웨어·프로그램 체크섬, 자체 진단 상태)를 정기 수집해 점검 기능이 꺼지거나 값이 멈추면 경보
    - EWS·HMI에서는 보안 기능 해제·커널 드라이버 적재 같은 이상을 EDR로 확인
    ■ 대응
    - 장치 펌웨어·OS를 패치하고, 무결성 점검 결과를 장치 밖의 별도 감시 시스템에서 교차 확인
    - 안전 제어기 키 스위치를 RUN에 두어 메모리 쓰기 경로를 막고, 펌웨어 업데이트는 서명 검증을 거침

T0849:
  summary: |-
    - 공격자는 악성 파일·서비스·계정을 벤더 프로그램·업데이트 파일·전력 프로토콜 이름처럼 꾸며, 운영자와 엔지니어가 정상 구성요소로 여기게 할 수 있음
    - OT 호스트에는 벤더별 실행 파일·서비스가 많아 이름만으로 정상 여부를 가리기 어렵고, 탈취한 인증서로 서명하면 서명 검증도 통과함
  reference: |-
    ■ OT 관점
    - 대상: EWS·HMI·SCADA 서버의 실행 파일·DLL·서비스·계정과 경계 장비의 설정 규칙 이름 (L2~L3.5)
    - 수법: SIS 로그 분석 도구 trilog.exe로 위장(Triton), 전력 프로토콜 이름의 DLL·EXE(2016 우크라이나), 정상처럼 보이는 systemd 서비스(2022 우크라이나), 기존 기관명을 흉내 낸 방화벽 규칙(2025 폴란드), update.exe(EKANS), 탈취 인증서 서명(Stuxnet·LockerGoga)
    - 통합: Enterprise 위장(T1036·.004·.005·.008·.010)·코드 서명 위조(T1553.002)·정상 프로그램 변조(T1554) — 엔지니어링 DLL을 바꿔 PLC 호출을 가로채는 Stuxnet 수법은 루트킷(OTC-EV-03)과 연계
    ■ 실제 사례
    - [실제 사고] Triton(2017-08): 공격 도구를 Triconex의 SIS 로그 분석 소프트웨어 trilog.exe로 위장하고, 주입기는 표준 Tricon 프로그램처럼 꾸밈 (INC-004, ATT&CK S1009)
    - [실제 사고] 2016 우크라이나(2016-12): 전력 프로토콜 이름을 단 DLL·EXE를 쓰고, 실행 파일을 .txt로 옮긴 뒤 이름을 바꿈 (INC-003, ATT&CK C0025)
    - [실제 사고] 2025 폴란드(2025-12): 방화벽 설정에 이미 있는 기관명을 흉내 낸 규칙을 만들어 탐지를 피함 (INC-008, ATT&CK C0063)
  detect: |-
    ■ 탐지
    - 벤더 소프트웨어의 실행 파일·DLL·서비스 목록과 해시·서명 기준선을 만들어, 같은 이름인데 해시·경로·서명자가 다르면 경보
    - 확장자와 실제 형식이 다른 파일, 기존 것과 철자가 비슷한 새 서비스·계정 확인
    ■ 대응
    - 해시·서명자 기준 애플리케이션 허용 목록을 적용하고 벤더 설치 경로의 쓰기 권한을 제한
    - 탈취·폐기된 코드 서명 인증서를 신뢰 목록에서 빼고, 경계 장비 규칙은 변경 관리 기록과 대조

T0872:
  summary: |-
    - 공격자는 이벤트 로그·악성 파일·저장 프로시저를 지우거나 파일 시각을 바꾸고, 제어기를 원래 상태로 되돌려 침입 흔적을 감출 수 있음
    - OT 장치는 로그 보존 용량이 작고 중앙 수집이 안 된 경우가 많아, 현장에서 지우면 사고 원인 분석 자체가 어려워짐
  reference: |-
    ■ OT 관점
    - 대상: EWS·HMI·SCADA 서버의 Windows 이벤트 로그·파일, 제어기 메모리의 공격 프로그램, 경계 장비 로그 (L1~L3.5)
    - 수법: 공격이 실패하면 제어기를 정상 운전 상태로 되돌리고 안 되면 악성 프로그램을 무효 데이터로 덮어씀(Triton), 이벤트 로그 일괄 삭제(KillDisk), 저장 프로시저 삭제·파일 시각 위조(Stuxnet), 실행 뒤 자기 삭제(BlackEnergy 드로퍼·LockerGoga)
    - 통합: Enterprise 흔적 삭제(T1070·.004·.006) — 데이터 파괴(OTC-IR-02)가 복구 방해를 노린다면 이 기법은 흔적 은닉이 목적
    ■ 실제 사례
    - [실제 사고] Triton(2017-08): 공격 코드가 실패하면 제어기를 이전 상태로 되돌리고, 정해진 시간 안에 회복되지 않으면 악성 프로그램을 무효 데이터로 덮어씀 (INC-004, ATT&CK C0030)
    - [실제 사고] Stuxnet(2010-06): 악성 코드를 담았던 SQL 저장 프로시저를 지우고 드라이버 파일 시각을 정상 파일과 맞춤 (INC-009, ATT&CK S0603)
    - [실제 사고] 2015 우크라이나(2015-12): 매크로가 떨군 실행 파일이 BlackEnergy 구성요소를 내려놓은 뒤 자신을 삭제 (INC-002, ATT&CK C0028)
  detect: |-
    ■ 탐지
    - OT 호스트·장비 로그를 실시간으로 중앙 수집해 현장 삭제와 무관하게 보존하고, 로그 삭제 이벤트(Windows 1102·104)와 로그 공백을 경보
    - 제어기 프로그램·메모리 변경과 예기치 않은 리셋·재시작을 진단 정보로 확인
    ■ 대응
    - 로그 저장소 권한을 분리하고 장치 로그를 원격 syslog로 보내며, 보존 기간을 사고 조사 요건에 맞춤
    - 사고 대응 계획에 OT 포렌식 절차(메모리·프로그램 확보 순서)를 넣고 승인된 프로그램 기준본을 보관

T0894:
  summary: |-
    - 공격자는 운영체제·SCADA 소프트웨어에 들어 있는 신뢰된 바이너리(rundll32·msiexec·SCADA 명령 도구)로 악성 코드나 명령을 대신 실행시켜, 실행 파일 기반 방어를 우회할 수 있음
    - 실행 주체가 마이크로소프트·벤더 서명 프로그램이라 허용 목록과 서명 검사를 통과하고, SCADA 도구를 쓰면 제어 명령까지 정상 경로로 나감
  reference: |-
    ■ OT 관점
    - 대상: Windows 기반 EWS·HMI·SCADA 서버·히스토리언과 설치된 SCADA 애플리케이션 바이너리 (L2~L3)
    - 수법: MicroSCADA scilc.exe에 공격자가 만든 명령 목록 파일을 넘겨 변전소로 비인가 명령 전송(2022 우크라이나), rundll32로 악성 DLL 실행(BlackEnergy·Havex·NotPetya·Bad Rabbit), msiexec로 악성 설치 패키지 실행(Duqu)
    - 통합: Enterprise Msiexec(T1218.007)·Rundll32(T1218.011) — SCADA 바이너리를 통한 명령 전송은 비인가 명령 메시지(OTC-IP-03.1)로 이어짐
    ■ 실제 사례
    - [실제 사고] 2022 우크라이나(2022-10): 'scilc.exe -do pack\scil\s1.txt'로 MicroSCADA가 미리 준비된 SCADA 명령을 원격 변전소로 보내게 함 (INC-006, ATT&CK C0034)
    - [실제 사고] 2015 우크라이나(2015-12): 백도어가 rundll32.exe로 공급받은 DLL을 실행 (INC-002, ATT&CK C0028)
    - [실제 사고] NotPetya(2017-06): PsExec·wmic로 원격 시스템에 접근한 뒤 rundll32.exe로 자신을 설치 (INC-016, ATT&CK S0368)
  detect: |-
    ■ 탐지
    - rundll32·msiexec가 사용자 폴더·임시 경로의 DLL·패키지를 실행하거나 외부 연결을 만들면 EDR로 경보
    - SCADA 명령 도구의 실행 인자·호출 주체를 기록하고, 운영 절차에 없는 명령 파일 실행을 경보
    ■ 대응
    - OT 호스트에서 쓰지 않는 시스템 바이너리 실행을 허용 목록으로 제한하고, SCADA 명령 도구는 지정 계정·경로에서만 실행되게 함
    - SCADA 소프트웨어의 스크립트·명령 실행 권한을 역할별로 나누고 실행 기록을 남김

T1685:
  summary: |-
    - 공격자는 백신·EDR·로그 수집 에이전트·OT 보안 센서를 멈추거나 설정을 바꿔, 이후 행위가 기록·탐지되지 않게 할 수 있음
    - OT 호스트의 보안 도구는 운영 영향을 우려한 예외 설정이 많고 중앙 관리가 약해, 꺼져도 오랫동안 알아채지 못하는 경우가 많음
  reference: |-
    ■ OT 관점
    - 대상: EWS·HMI·SCADA 서버의 백신·EDR·이벤트 로깅, OT 네트워크 감시 센서, 보안 관리 서버 (L2~L3)
    - 수법: 보안·관리 소프트웨어 프로세스 종료(EKANS), 백신 강제 종료 후 랜섬웨어 실행(LockerGoga), 이벤트 로깅 해제(2016 우크라이나), 인터넷 보안 설정 하향(2015 우크라이나)
    - 구분: 운영 프로세스·서비스 강제 종료는 서비스 중지(OTC-IR-09), 경계 장비 보안 설정 변경은 OTC-EV-10.1
    ■ 실제 사례
    - [실제 사고] 2016 우크라이나(2016-12): 침해한 시스템의 이벤트 로깅을 꺼 흔적을 줄임 (INC-003, ATT&CK C0025)
    - [실제 사고] 혼다 공장(2020-06): EKANS가 보안·관리 소프트웨어 프로세스를 멈추고 공장 시스템을 암호화해 일부 생산이 중단 (INC-020, ATT&CK S0605)
    - [실제 사고] 노르스크 하이드로(2019-03): 백신을 'task kill'로 종료한 직후 LockerGoga를 설치 (INC-019, ATT&CK S0372)
  detect: |-
    ■ 탐지
    - 보안 에이전트의 상태 신호가 끊기거나 서비스가 멈추면 중앙 관리 콘솔에서 경보하고, 로깅 정책 변경 이벤트를 수집
    - OT 네트워크 감시 센서의 수신 트래픽이 갑자기 줄거나 끊기면 확인
    ■ 대응
    - 보안 도구의 변조 방지 기능을 켜고, 중지·제거 권한을 별도 관리자 계정으로 제한
    - 보안 도구 예외 설정을 정기 검토하고, 로깅 설정은 그룹 정책·구성 관리로 강제

T1686.002:
  summary: |-
    - 공격자는 OT 경계 방화벽·VPN 장비의 접근 규칙·보안 설정·다중 인증 설정을 바꾸거나 트래픽 로깅을 꺼, 막혀 있던 통신을 열고 자신의 접근을 감출 수 있음
    - 경계 장비 하나의 설정이 IT·OT 분리를 좌우하므로 규칙 하나만 바뀌어도 망 분리가 무력화되고, 장비 로그를 끄면 이후 행위가 남지 않음
  reference: |-
    ■ OT 관점
    - 대상: IT/OT 경계 방화벽, 원격 접속 VPN, 산업용 방화벽·라우터의 ACL·보안 정책·인증 설정 (L3.5)
    - 수법: 장비 CLI로 보안 설정 변경과 트래픽 로깅 해제, 다중 인증 설정 해제(2025 폴란드) — 기존 기관명을 흉내 낸 규칙 이름으로 위장(OTC-EV-02)
    - 통합: Enterprise 다중 인증 설정 변조(T1556.006) — 장비 접근은 공개 애플리케이션 취약점 악용(OTC-IA-02)·유효 계정 악용(OTC-PE-01)으로 확보
    ■ 실제 사례
    - [실제 사고] 2025 폴란드(2025-12): FortiGate CLI로 보안 설정을 바꾸고 네트워크 트래픽 로깅을 끄며, 2단계 인증 설정을 해제 (INC-008, ATT&CK C0063)
  detect: |-
    ■ 탐지
    - 경계 장비 설정을 정기 백업해 승인 기준본과 비교하고, 규칙·인증·로깅 설정 변경 이벤트를 외부 로그 서버로 보내 경보
    - 장비 로그 전송이 갑자기 끊기거나 줄면 로깅 해제 징후로 확인
    ■ 대응
    - 경계 장비 관리 접속을 관리망·다중 인증으로 제한하고, 설정 변경은 변경 관리 승인 뒤 수행
    - 장비 펌웨어를 최신으로 유지하고(KEV 등재 취약점 우선), 관리 계정을 개인별로 나눠 변경 이력을 추적
