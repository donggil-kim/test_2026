# [PE] 지속성 — OT 관점 문구
# 작성 규칙은 IP.yaml 머리말 참고

T0859:
  summary: |-
    - 공격자는 탈취하거나 새로 만든 유효 계정(도메인·로컬·서비스·장치 계정)으로 VPN·원격 서비스·제어 장치에 로그인해, 정상 사용자 권한으로 OT 환경에 머물고 이동할 수 있음
    - 인증을 정상 통과하므로 접근 통제와 다수 탐지 수단을 그대로 지나치며, 퇴사자·휴면·공용 계정 관리가 허술한 OT 환경에서 반복적으로 악용됨
  reference: |-
    ■ OT 관점
    - 대상: IT·OT 도메인 계정, VPN·원격 접속 계정, EWS·HMI 로컬 계정, SQL 서버 계정, RTU·보호 계전기·시리얼 서버 같은 현장 장치 계정, 카메라 클라우드 관리 계정 (L1~L3.5·IoT)
    - 수법: 기업망에서 모은 자격증명으로 VPN·이중 연결(dual-homed) 시스템을 거쳐 제어망 진입(2015·2016 우크라이나), RDP 점프 박스 경유(Triton), 새 관리자·도메인 계정 생성, 해시 재사용 — 계정 탈취 수단은 OTC-LM-07·LM-08·LM-09
    - 통합: Enterprise 유효 계정(T1078·.002~.004)·계정 조작(T1098)·계정 생성(T1136·.001·.002)·해시 전달(T1550.002) — 기본·하드코딩 자격증명은 OTC-PE-05.1·05.2
    - 지속성(OTC-PE-01)·횡적 이동(OTC-LM-02) 전술에 같은 기법으로 나타나며, 퇴사자에게 남은 원격 접속 권한이 내부자 조작으로 이어진 수도 사고가 반복됨(INC-042, INC-043)
    ■ 실제 사례
    - [실제 사고] 2015 우크라이나(2015-12): 기업망에서 탈취한 계정으로 VPN과 이중 연결 시스템을 거쳐 제어망에 들어가고, 권한 있는 도메인 계정을 새로 만들어 머묾 (INC-002, ATT&CK C0028)
    - [실제 사고] 2025 폴란드(2025-12): 유효 계정으로 Hitachi·Mikronika RTU, 보호 계전기, Mikronika HMI, Moxa NPort에 접근하고, 권한 계정으로 FortiGate VPN을 거쳐 하위 망으로 이동 (INC-008, ATT&CK C0063)
    - [실제 사고] 미국 베이 지역 정수장(2021-01): 퇴사한 직원의 TeamViewer 계정으로 제어 시스템에 접속해 정수 처리 프로그램을 삭제 (INC-042)
  detect: |-
    ■ 탐지
    - OT 계정의 로그인 시간·출발지·대상 장치를 기준선과 비교하고, 휴면·퇴사자·서비스 계정의 대화형 로그인과 새 관리자 계정 생성을 경보
    - 현장 장치(RTU·계전기·시리얼 서버) 로그인 기록을 VPN·점프 호스트 세션과 상관 분석해 승인된 원격 세션 없이 일어난 장치 접근 확인
    ■ 대응
    - OT 계정·도메인을 IT와 분리하고, 원격·특권 접근에 다중 인증과 승인 기반 일시 권한(JIT)을 적용
    - 퇴사·계약 종료 때 원격 접속 계정을 즉시 폐기하고, 공용 계정을 개인 계정으로 바꾸며 계정 목록을 정기 검토

T0873.001:
  summary: |-
    - 공격자는 Step 7·WinCC 같은 지멘스 PLC 프로젝트 파일에 악성 코드를 심거나 감염된 프로젝트를 들여와, 엔지니어가 프로젝트를 열 때마다 코드가 실행되게 할 수 있음
    - 프로젝트 파일은 EWS 사이와 협력업체 간에 정상적으로 오가므로 감염이 엔지니어링 업무를 따라 퍼지고, 정상 수정과 함께 바뀌면 변경 분석으로 가려내기 어려움
  reference: |-
    ■ OT 관점
    - 대상: SIMATIC Step 7·WinCC가 설치된 EWS와 프로젝트 저장소·공유 폴더, 협력업체와 주고받는 프로젝트 사본 (L2~L3)
    - 수법: 프로젝트를 불러올 때 자동 실행되도록 프로젝트 폴더에 자신을 복사하고, 감염된 엔지니어링 소프트웨어로 연 깨끗한 프로젝트도 다시 감염(Stuxnet)
    - 감염된 EWS는 PLC로 내려보내는 코드까지 바꿀 수 있어 제어 프로그램 변조(OTC-PE-03)와 횡적 이동의 발판이 됨 — 사용자가 파일을 열어야 실행되므로 사용자 실행 유도(OTC-EX-07)와 같은 방어가 필요
    ■ 실제 사례
    - [실제 사고] Stuxnet(2010-06): Step 7 프로젝트에 자신을 복사해 프로젝트를 열 때 자동 실행되게 하고, 감염된 매니저로 연 프로젝트 파일도 감염시킴 (INC-009, ATT&CK S0603)
  detect: |-
    ■ 탐지
    - 프로젝트 파일·폴더의 예상치 못한 변경(새 DLL·실행 파일, 해시 변화)을 감시하고 버전 관리 저장소의 승인 본과 비교
    - 엔지니어링 소프트웨어가 프로젝트를 열 때 만드는 비정상 자식 프로세스·DLL 로드를 EDR로 확인
    ■ 대응
    - 프로젝트 파일을 접근 통제된 버전 관리 저장소에서 관리하고, 협력업체에서 받은 프로젝트는 검사한 뒤 반입
    - 엔지니어링 소프트웨어의 프로젝트 보호(암호·무결성) 기능을 켜고 최신 패치 적용

T0889:
  summary: |-
    - 공격자는 제어기의 프로그램을 바꾸거나 새 블록을 추가해, 제어기가 물리 공정·주변 장치·다른 호스트와 상호작용하는 방식을 바꾸고 그 상태로 오래 머물 수 있음
    - 바뀐 프로그램은 제어기를 재시작해도 그대로 실행되고, 엔지니어링 소프트웨어로 읽을 때 원래 코드를 보여주도록 숨길 수도 있어 오프라인 비교 없이는 찾기 어려움
  reference: |-
    ■ OT 관점
    - 대상: PLC·PAC·DCS 제어기와 안전 제어기(SIS)의 사용자 프로그램(코드 블록·데이터 블록·함수 블록) (L1)
    - 수법: 대상 설비 구성에 맞춘 감염 코드 내려받기(Stuxnet), 프로그램 구성 단위(POU)에 웜 코드 복사(PLC-Blaster), 위장 엔지니어링 스테이션으로 실행 코드와 다른 소스를 심기(Rogue7)
    - 전달은 제어 프로그램 다운로드(OTC-LM-01.1~01.3), 실행 흐름 조작은 제어기 태스크 변조(OTC-EX-02), 결과는 운전 파라미터 변조(OTC-IP-02)·제어 조작(OTC-IM-07)으로 이어짐
    ■ 실제 사례
    - [실제 사고] Stuxnet(2010-06): 대상 PLC 구성에 맞는 코드·데이터 블록을 내려받아 원심분리기 제어 로직을 바꾸고, 읽기 요청에는 원래 코드를 보여줌 (INC-009, ATT&CK S0603)
    - [실증] PLC-Blaster(2016-03): 데이터 블록·함수·함수 블록에 자신을 복사해 PLC 사이로 퍼지는 웜 (INC-024, ATT&CK S1006)
    - [실증] Rogue7(2019-08): S7-1500 PLC에 위장 엔지니어링 스테이션으로 로직을 내려받고 운영자에게는 원래 로직을 보여줌 (INC-078)
  detect: |-
    ■ 탐지
    - 제어기에서 프로그램을 정기적으로 올려받아 승인 기준본과 블록 단위로 비교(체크섬·해시)하고, 온라인 편집·프로그램 추가 기능 코드를 OT 네트워크 감시로 탐지
    - 장치 변경 경보·진단 버퍼와 엔지니어링 소프트웨어 변경 기록을 수집해 변경 관리 기록과 대조
    ■ 대응
    - 제어기 접근 보호(읽기·쓰기 암호)와 키 스위치 RUN을 유지하고, 프로그램 변경은 승인 후 지정 EWS에서만 수행
    - 코드 서명·무결성 검증을 지원하는 제어기를 도입하고 승인된 프로그램 백업을 오프라인으로 보관

T1694:
  summary: |-
    - 공격자는 장치·소프트웨어에 미리 설정돼 공개된 기본 자격증명이나 펌웨어에 박힌 하드코딩 자격증명, 허술하게 저장된 자격증명을 써서, 계정을 탈취하지 않고도 제어 장치·서버에 로그인하고 머물거나 이동할 수 있음
    - 장치 교체 주기가 길고 일부 자격증명은 사용자가 바꿀 수 없어 노출 상태가 오래 이어지며, 로그인 자체는 정상이라 탐지가 어려움
  reference: |-
    ■ OT 관점
    - 대상: PLC·HMI·RTU·IED·산업용 스위치·시리얼 서버·IoT 기기의 웹·텔넷·SSH·엔지니어링 접속과 SCADA·히스토리언 서버의 DB 계정 (L1~L3·IoT)
    - 하위 기법: 기본 자격증명(OTC-PE-05.1)·하드코딩 자격증명(OTC-PE-05.2) — 이 행은 자격증명을 평문·되돌릴 수 있는 형태로 저장하거나 약한 암호를 허용하는 결함처럼 하위 기법으로 나누기 어려운 근거를 모음
    - CISA ICS 권고에서 보호되지 않은 자격증명·약한 암호 정책(CWE-522·256·257·260·521) 199건, 2025년 이후 48건
    - 지속성(OTC-PE-05.0)·횡적 이동(OTC-LM-06.0) 전술에 같은 기법으로 나타나며, 실제 사고는 하위 기법에서 집계
    ■ 실제 사례
    - [공개 취약점] CISA ICS 권고: 설정 파일·백업·통신에 자격증명이 평문이나 약한 형태로 남는 취약점 다수 — 장치 설정을 얻은 공격자가 그대로 로그인할 수 있음
  detect: |-
    ■ 탐지
    - 평문 인증 프로토콜(텔넷·FTP·HTTP)의 로그인과 알려진 기본 계정 사용을 OT 네트워크 감시로 탐지하고 장치 로그인 기록 수집
    - 자산 점검 때 자격증명 관련 CISA ICS·벤더 권고 해당 여부를 자산 목록과 대조
    ■ 대응
    - 설치·인수 때 기본 자격증명을 바꾸고 장치별 고유 암호를 관리하며, 바꿀 수 없는 자격증명은 네트워크 분리·허용 목록으로 보완
    - 자격증명 저장 결함을 패치하고 암호화 통신(HTTPS·SSH)을 적용하며, 쓰지 않는 텔넷·FTP 서비스를 끔

T1694.001:
  summary: |-
    - 공격자는 제조사가 출하 때 설정해 매뉴얼·인터넷에 공개된 기본 계정·암호로 PLC·HMI·RTU·IoT 기기에 로그인해, 관리자 권한을 바로 얻고 설정·화면·프로그램을 바꿀 수 있음
    - 검색 엔진으로 노출 장치를 찾아 기본 암호를 넣는 것만으로 대규모 공격이 가능해, 숙련도가 낮은 핵티비스트와 IoT 봇넷이 가장 많이 쓰는 경로임
  reference: |-
    ■ OT 관점
    - 대상: Unitronics Vision 같은 일체형 PLC·HMI, RTU·보호 계전기·시리얼 서버, VNC 기반 HMI, IP 카메라·DVR 등 IoT 기기 (L1~L2·IoT)
    - 인터넷 노출 장치 악용(OTC-IA-11)과 결합해 화면 변조·설정값 조작·관리자 암호 변경(OTC-IR-10)으로 이어지고, IoT 기기는 봇넷 편입(OTC-IM-14.1)이나 기기 파괴로 이어짐
    - CISA ICS 권고에서 기본 자격증명·안전하지 않은 기본 설정(CWE-1392·1393·1188) 48건, 2025년 이후 27건 — KEV: Unitronics Vision 기본 암호(CVE-2023-6448)
    - 통합: Enterprise 기본 계정(T1078.001)
    ■ 실제 사례
    - [실제 사고] Unitronics 화면 변조(2023-11): CyberAv3ngers가 인터넷에 노출된 Unitronics PLC·HMI에 기본 암호로 접속해 화면을 바꿨고, 알리퀴파 수도국 가압장은 수동 운전으로 전환 (INC-005, ATT&CK C0031)
    - [실제 사고] 2025 폴란드(2025-12): 기본 자격증명으로 Hitachi·Mikronika RTU, 보호 계전기, Moxa NPort 등에 접근 (INC-008, ATT&CK C0063)
    - [실제 사고] Mirai(2016-10): 텔넷 기본 계정으로 IP 카메라·DVR 수십만 대를 감염시켜 대규모 DDoS 봇넷을 구성 (INC-032)
  detect: |-
    ■ 탐지
    - 장치 로그인 기록과 OT 네트워크 감시로 기본 계정 이름의 로그인과 반복 로그인 시도를 탐지
    - 외부 공격 표면 점검과 내부 자산 점검으로 기본 암호가 남은 장치를 정기 확인
    ■ 대응
    - 설치·인수 시험 항목에 기본 암호 변경을 넣고, 장치별 고유 암호를 암호 관리 도구로 관리
    - 첫 사용 때 암호 변경을 강제하는 제품을 우선 도입하고 장치의 인터넷 노출을 없앰

T1694.002:
  summary: |-
    - 공격자는 소프트웨어·펌웨어에 박혀 있는 계정·암호·암호키를 찾아내, 같은 제품을 쓰는 모든 현장의 장치에 로그인하거나 엔지니어링 인증을 우회할 수 있음
    - 사용자가 바꾸거나 끌 수 없는 경우가 많아 패치 전까지 노출이 이어지고, 한 번 공개되면 같은 제품군 전체가 동시에 위험해짐
  reference: |-
    ■ OT 관점
    - 대상: SCADA·HMI 소프트웨어의 DB 계정, PLC·제어기의 엔지니어링 인증 키, 임베디드 장치의 서비스·유지보수 계정과 인증서·API 토큰 (L1~L2)
    - 수법: WinCC DB 서버의 하드코딩 암호로 인근 시스템 감염(Stuxnet), Omron PLC의 하드코딩 자격증명으로 로그인(INCONTROLLER, CVE-2022-34151)
    - CISA ICS 권고에서 하드코딩 자격증명·키(CWE-798·321·259) 270건, 2025년 이후 69건 — KEV: Rockwell Logix 제어기 인증 키 노출(CVE-2021-22681)
    ■ 실제 사례
    - [실제 사고] Stuxnet(2010-06): WinCC 소프트웨어 DB 서버에 하드코딩된 암호로 인근 시스템에 퍼짐 (INC-009, ATT&CK S0603)
    - [위협인텔] PIPEDREAM(2022-04): INCONTROLLER가 Omron PLC의 하드코딩 자격증명(CVE-2022-34151)으로 로그인하는 기능을 갖춘 채 발견 (INC-022, ATT&CK S1045)
    - [공개 취약점] Rockwell Logix(CVE-2021-22681): 엔지니어링 소프트웨어와 제어기 사이 인증 키가 노출돼 원격에서 제어기 인증을 우회 — KEV 등재
  detect: |-
    ■ 탐지
    - CISA ICS·벤더 권고의 하드코딩 자격증명 해당 제품을 자산 목록과 대조하고, 해당 계정·키를 쓰는 로그인을 OT 네트워크 감시 규칙으로 탐지
    - 엔지니어링 프로토콜 세션의 발신지를 지정 EWS 목록과 비교
    ■ 대응
    - 벤더 패치·펌웨어 업데이트로 하드코딩 자격증명을 없애고, 패치 전에는 장치 접근을 허용 목록·네트워크 분리로 제한
    - 조달 요건에 하드코딩 자격증명 금지와 자격증명 변경 기능을 명시

T1505.001:
  summary: |-
    - 공격자는 SCADA·히스토리언이 쓰는 MS-SQL 등 데이터베이스의 저장 프로시저(xp_cmdshell 등)를 악용하거나 새로 등록해, DB 서버에서 OS 명령을 실행하고 접근을 유지할 수 있음
    - DB는 SCADA 운영에 필수라 끌 수 없고, 저장 프로시저 실행은 DB 내부 활동이라 호스트 보안 도구가 잘 보지 못함
  reference: |-
    ■ OT 관점
    - 대상: SCADA 서버·데이터 히스토리언·MES의 MS-SQL 데이터베이스와 WinCC 같은 HMI 소프트웨어의 내장 DB (L2~L3)
    - 수법: xp_cmdshell로 OS 명령 실행·악성 코드 추출(Stuxnet), 여러 MS-SQL 저장 프로시저로 명령 실행과 서버 간 연결(2016 우크라이나)
    - 하드코딩·기본 DB 계정(OTC-PE-05.1·05.2)과 함께 쓰이며, 명령 실행은 명령줄 인터페이스(OTC-EX-01)로 이어짐
    ■ 실제 사례
    - [실제 사고] 2016 우크라이나(2016-12): 여러 MS-SQL 저장 프로시저와 xp_cmdshell로 DB 서버에서 명령을 실행 (INC-003, ATT&CK C0025)
    - [실제 사고] Stuxnet(2010-06): WinCC DB에 SQL 코드를 저장하고 xp_cmdshell로 자신을 추출·실행 (INC-009, ATT&CK S0603)
  detect: |-
    ■ 탐지
    - DB 감사로 xp_cmdshell 활성화·실행, 새 저장 프로시저·시작 프로시저 등록, 연결 서버 생성을 기록하고 경보
    - SQL 서버 프로세스가 명령 셸을 만드는 프로세스 체인을 EDR로 탐지
    ■ 대응
    - xp_cmdshell 같은 위험 확장 프로시저를 끄고, SCADA·히스토리언 DB 계정을 최소 권한으로 운영하며 기본·공용 DB 계정 제거
    - DB 서버 접속을 OT 내부 지정 클라이언트로 제한하고 벤더 권고 보안 설정 적용

T1505.003:
  summary: |-
    - 공격자는 인터넷이나 OT 경계에 노출된 웹 서버에 웹셸을 심어, 이후 언제든 그 서버로 명령을 실행하고 내부망으로 터널을 뚫을 수 있음
    - 정상 웹 요청처럼 보이는 HTTP(S) 트래픽으로 동작하고 웹 서버 파일 하나만 남아, 처음 악용한 취약점을 패치한 뒤에도 접근이 유지됨
  reference: |-
    ■ OT 관점
    - 대상: 인터넷 노출 웹 서버, 웹 기반 HMI·SCADA 서버, 히스토리언·원격 감시 포털, OT DMZ의 웹 애플리케이션 서버 (L3~L3.5)
    - 수법: reGeorg 계열 웹셸로 HTTP 터널을 만들어 내부망에 접근(2022 우크라이나 Neo-REGEORG, 리비우 지역난방 ReGeorg 변종) — 연결 프록시(OTC-C2-02)와 결합
    - 공개 애플리케이션 취약점 악용(OTC-IA-02) 직후 지속 수단으로 쓰이므로, 패치에 그치지 말고 웹셸 존재를 함께 점검해야 함
    ■ 실제 사례
    - [실제 사고] 2022 우크라이나(2022-10): 인터넷에 노출된 서버에 Neo-REGEORG 웹셸을 심어 내부 접근 경로로 사용 (INC-006, ATT&CK C0034)
    - [실제 사고] 리비우 지역난방(2024-01): 최초 침투 뒤 ReGeorg 변종 웹셸을 설치해 접근을 유지 (INC-007, ATT&CK C0041)
  detect: |-
    ■ 탐지
    - 웹 서버 디렉터리의 새·변경 스크립트 파일을 파일 무결성 감시로 탐지하고, 웹 서버 프로세스가 명령 셸을 만들면 경보
    - 웹 로그에서 특정 파일로 반복되는 POST 요청과 HTTP 터널링 패턴 탐지
    ■ 대응
    - OT 관련 웹 서버를 인터넷에서 분리하거나 WAF·리버스 프록시 뒤에 두고, 웹 루트 쓰기 권한을 제한
    - 침해 복구 때 패치와 함께 웹 서버 파일 전체의 무결성을 점검하거나 재구축

T1543:
  summary: |-
    - 공격자는 Windows 서비스·Linux systemd 같은 시스템 서비스를 새로 만들거나 기존 서비스의 실행 경로를 바꿔, 부팅 때마다 높은 권한으로 악성 코드를 실행할 수 있음
    - OT 호스트에는 SCADA·통신 드라이버 같은 벤더 서비스가 많아 낯선 서비스가 섞여도 눈에 띄지 않고, 서명된 드라이버를 쓰면 정상 구성요소로 보임
  reference: |-
    ■ OT 관점
    - 대상: Windows 기반 EWS·HMI·SCADA 서버·히스토리언과 Linux 기반 SCADA·게이트웨이 서버 (L2~L3)
    - 수법: 기존 서비스의 ImagePath를 백도어로 교체(Industroyer), systemd 유닛으로 터널 도구 상주(2022 우크라이나 GOGETTER), 부팅 드라이버 서비스 등록(Stuxnet·Duqu), 서비스 제어 관리자·PsExec로 원격 서비스 실행(NotPetya·Bad Rabbit)
    - 지속성(OTC-PE-08)·권한 상승(OTC-PV-05) 전술에 같은 기법으로 나타남 — 통합: Enterprise systemd 서비스(T1543.002)·Windows 서비스(T1543.003)·서비스 실행(T1569.002)
    ■ 실제 사례
    - [실제 사고] 2016 우크라이나(2016-12): 임의 시스템 서비스로 Industroyer를 부팅 때 실행하고, 기존 서비스의 ImagePath를 새 백도어로 바꿈 (INC-003, ATT&CK C0025)
    - [실제 사고] 2022 우크라이나(2022-10): systemd에 GOGETTER를 등록해 시스템 시작 때마다 실행되게 함 (INC-006, ATT&CK C0034)
    - [실제 사고] WannaCry(2017-05): 'mssecsvc2.0' 서비스를 만들어 퍼지며 공장 생산 라인을 멈춤 (INC-015, ATT&CK S0366)
  detect: |-
    ■ 탐지
    - 서비스 생성·변경 이벤트(Windows 7045·4697, systemd 유닛 파일 변경)를 수집하고 승인된 서비스 목록과 정기 비교
    - 서비스 실행 파일의 경로·서명 변화와 PsExec 같은 원격 서비스 생성을 경보
    ■ 대응
    - 서비스 생성·변경 권한을 관리자로 제한하고, 드라이버 서명 강제와 취약 드라이버 차단 목록 적용
    - 벤더 서비스 기준 목록을 자산 관리에 등록하고, 서비스 변경은 변경 관리로 승인
