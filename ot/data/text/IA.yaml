# [IA] 초기 침투 — OT 관점 문구
# 작성 규칙은 IP.yaml 머리말 참고

T0817:
  summary: |-
    - 공격자는 OT 종사자·협력업체가 자주 찾는 업계·공급업체 웹사이트를 침해해(워터링 홀), 방문한 업무 단말에 악성코드를 내려받게 할 수 있음
    - 정상 업무 사이트 방문만으로 감염되고 특정 업계 종사자를 골라 노릴 수 있으며, 이렇게 확보한 자격증명·단말이 이후 OT 접근의 발판이 됨
  reference: |-
    ■ OT 관점
    - 대상: 엔지니어·운영자의 업무용 워크스테이션과 원격 접속 단말 — 인터넷을 쓰는 단말이 OT 접근 권한을 함께 가진 경우 위험이 큼 (L3~L4)
    - 수법: 에너지 업계 사이트에 리디렉션 iframe 삽입(Dragonfly), 산업 종사자 대상 워터링 홀(TEMP.Veles·ALLANITE), 정상 사이트의 가짜 Flash 설치 파일(Bad Rabbit)
    - 통합: Enterprise 드라이브바이 침해(T1189)
    ■ 실제 사례
    - [실제 사고] Dragonfly 2.0(2018-03): 에너지 업계 대상 워터링 홀과 스피어피싱으로 자격증명을 모으고 제어 시스템 정보에 접근 (INC-036)
    - [실제 사고] Bad Rabbit(2017-10): 침해된 웹사이트의 가짜 Flash 설치 파일로 퍼져 우크라이나 교통 기관 시스템을 암호화 (INC-017, ATT&CK S0606)
  detect: |-
    ■ 탐지
    - 웹 프록시·IDS로 알려진 악성 스크립트·리디렉션과 브라우저 하위 프로세스 생성 탐지
    - 업무 단말에서 OT 영역으로 향하는 새로운 접속을 경보
    ■ 대응
    - OT 접근 단말에서 인터넷 사용을 분리(점프 호스트·전용 단말)하고 브라우저 격리·익스플로잇 보호 적용
    - 웹 필터링과 브라우저·플러그인의 신속한 업데이트

T0819:
  summary: |-
    - 공격자는 인터넷에 노출된 HMI·SCADA 웹 서버·VPN·방화벽·라우터·IoT 기기의 취약점을 악용해 OT 환경이나 그 경계에 처음 들어올 수 있음
    - 원격 관리를 위해 일부러 노출한 장비가 많고 패치 주기가 길어, 공개된 취약점이 오랫동안 악용 가능한 상태로 남음
  reference: |-
    ■ OT 관점
    - 대상: 인터넷 노출 HMI·웹 SCADA, OT 경계 VPN·방화벽(FortiOS·PAN-OS 탑재 산업용 방화벽 포함), 산업용 라우터·셀룰러 게이트웨이, IP 카메라·NVR (L3.5·IoT)
    - KEV에서 OT·IoT 제품과 OT 네트워크 장비 OS 취약점 30건이 이 기법의 실제 악용으로 확인됨 — 카메라·NVR·출입통제·산업용 라우터 다수가 봇넷 편입에 쓰임
    - 통합: Enterprise 공개 애플리케이션 악용(T1190) — 경계 장비 정보 수집(T1590.006)은 외부 원격 서비스(OTC-IA-03)에 통합
    ■ 실제 사례
    - [실제 사고] 덴마크 에너지 기업(2023-05): Zyxel 방화벽 취약점(CVE-2023-28771)으로 22곳의 경계 방화벽이 침해 (INC-055)
    - [실제 사고] 리비우 지역난방(2024-01): 외부에 노출된 라우터의 알려지지 않은 취약점을 악용해 진입한 것으로 추정 (INC-007, ATT&CK C0041)
    - [실제 사고] BlackEnergy HMI 캠페인(2014-10): 인터넷에 노출된 GE CIMPLICITY·Advantech WebAccess HMI 취약점을 악용 (INC-030)
  detect: |-
    ■ 탐지
    - 노출 장비의 웹 접근 로그·WAF로 익스플로잇 패턴과 비정상 요청을 탐지하고 장비의 비정상 프로세스·재시작 확인
    - 경계 장비의 관리 접속·설정 변경·새 계정 생성을 중앙으로 수집
    ■ 대응
    - OT 장비의 인터넷 노출을 없애고 불가피하면 VPN·점프 호스트 뒤로 옮기며, KEV 등재 취약점은 우선 패치
    - 외부 공격 표면 점검(인터넷 스캔 결과 확인)을 정기 수행하고 노출 장비 대장 관리

T0822:
  summary: |-
    - 공격자는 VPN·원격 데스크톱·원격 접속 도구·무선 원격 링크 같은 외부 원격 서비스에 탈취하거나 남아 있는 계정으로 접속해, 정상 원격 운영자처럼 OT 환경에 들어올 수 있음
    - 정상 원격 유지보수 경로를 쓰므로 공격 트래픽이 구분되지 않고, 다중 인증이 없는 휴면·퇴사자 계정이 반복해서 침투 경로가 됨
  reference: |-
    ■ OT 관점
    - 대상: 운영자·벤더용 VPN, OT 원격 접속 게이트웨이·점프 호스트, TeamViewer 같은 원격 접속 도구, 현장 무선 원격 링크 (L3.5)
    - 통합: Enterprise 외부 원격 서비스(T1133)·신뢰 관계 악용(T1199, 벤더·유지보수 업체 접속)·경계 장비 정보 수집(T1590.006)
    - 유효 계정 악용(OTC-PE-01)과 함께 쓰이며, 인터넷 노출 장치 직접 접속(OTC-IA-11)과 달리 원격 접속 체계를 거침
    ■ 실제 사례
    - [실제 사고] 2015 우크라이나(2015-12): 도메인 컨트롤러에서 탈취한 계정으로 배전 운영자용 제어 시스템 VPN에 접속 (INC-002, ATT&CK C0028)
    - [실제 사고] 2025 폴란드(2025-12): 인터넷에 노출된 FortiGate VPN 인터페이스로 진입 (INC-008, ATT&CK C0063)
    - [실제 사고] 콜로니얼 파이프라인(2021-05): 다중 인증이 없는 휴면 VPN 계정과 유출된 암호로 진입 (INC-044)
  detect: |-
    ■ 탐지
    - VPN·원격 접속 인증 로그에서 비정상 시간대·출발지·동시 세션과 휴면 계정 사용을 경보
    - 원격 접속 세션 중 OT 자산 접근·설정 변경을 세션 기록과 대조
    ■ 대응
    - 원격 접속은 다중 인증·점프 호스트 경유·세션 기록·필요할 때만 여는 승인제로 운영하고, 퇴사자·벤더 계정을 즉시 회수
    - 경계 VPN 장비는 KEV 취약점을 우선 패치하고 관리 인터페이스를 인터넷에서 분리

T0847:
  summary: |-
    - 공격자는 USB 같은 이동식 매체에 악성코드를 실어, 업무망과 분리된 제어계통 단말까지 감염을 옮길 수 있음
    - 협력업체·유지보수 인력이 가져오는 매체가 경로가 되는 경우가 많고, 폐쇄망이라는 믿음 때문에 매체 반입 통제가 느슨한 시설이 많음
  reference: |-
    ■ OT 관점
    - 대상: 폐쇄망의 EWS·HMI·SCADA 서버와 프로젝트 파일을 주고받는 단말 (L1~L3)
    - 수법: 자동 실행(autorun)·LNK 취약점으로 매체를 연결하면 실행, 감염 단말이 다시 매체와 공유 드라이브로 복제
    - 통합: Enterprise 이동식 매체 전파(T1091)
    ■ 실제 사례
    - [실제 사고] Stuxnet(2010-06): 이동식 드라이브로 자기 복제하며 폐쇄망에 유입된 것으로 분석 (INC-009, ATT&CK S0603)
    - [실제 사고] 독일 원전(2016-04): 연료 취급 설비용 PC와 이동식 저장장치에서 Conficker 등 악성코드가 발견 (INC-014, ATT&CK S0608)
    - [실제 사고] Flame(2012-05): USB를 감염시켜 자동 실행으로 다른 Windows 시스템에 퍼지는 모듈을 갖춤 (INC-011)
  detect: |-
    ■ 탐지
    - 이동식 매체 연결 뒤 실행된 프로세스와 매체에서 시작된 파일 쓰기를 엔드포인트 감시로 탐지
    - 매체 반입 기록과 단말별 매체 사용 로그 대조
    ■ 대응
    - 자동 실행을 끄고 허가된 매체만 쓰게 하며, 반입 전 검사 키오스크 운영
    - 협력업체 매체 반입 절차와 교육, 프로젝트 파일은 검사된 전용 경로로 전달

T0848:
  summary: |-
    - 공격자는 정상 마스터(제어 서버)를 가장한 장치를 통신망에 붙여, 현장 장치에 정상 형식의 제어 메시지를 보내거나 실제 마스터로 가는 트래픽을 가로챌 수 있음
    - 인증 없는 프로토콜에서는 현장 장치가 진짜와 가짜 마스터를 구분하지 못해 명령이 그대로 실행됨
  reference: |-
    ■ OT 관점
    - 대상: 마스터-슬레이브 구조의 SCADA 통신(Modbus·DNP3·IEC 101/104)과 무선 원격 링크로 연결된 RTU·PLC·IED (L1~L2)
    - 수법: 네트워크 주소 위조, 같은 주파수의 무선 장비 사용, 빼돌린 엔지니어링 장비·소프트웨어 사용
    - 비인가 명령 메시지(OTC-IP-03.1)·위조 보고 메시지(OTC-IP-03.2)의 전달 수단 — 무선 구간은 무선 통신 침해(OTC-IA-06)와 결합
    ■ 실제 사례
    - [실제 사고] 마루치 하수처리(2000-03): 네트워크 주소를 위조해 펌프장에 거짓 데이터와 명령을 보냄 (INC-001, ATT&CK C0020)
  detect: |-
    ■ 탐지
    - 자산 대장에 없는 장치·주소에서 나오는 마스터 기능 트래픽을 OT 네트워크 감시로 경보
    - 같은 슬레이브에 명령하는 마스터가 둘 이상인지 확인
    ■ 대응
    - 통신 인증(IEC 62351·DNP3-SA)과 장치 허용 목록, 포트 보안(미사용 포트 차단) 적용
    - 무선 원격 링크는 암호화·주파수 관리를 하고, 장비 분실·퇴사 시 키 교체

T0860:
  summary: |-
    - 공격자는 같은 주파수의 무선 장비나 침해한 무선 기기로 OT 무선 통신망에 접근해, 원거리에서도 현장 장치와 통신할 수 있음
    - 무선 경보·원격 제어 신호는 인증·암호화 없이 동작하는 경우가 많아, 녹음·재전송만으로도 정상 명령처럼 받아들여짐
  reference: |-
    ■ OT 관점
    - 대상: 원격 감시·제어용 무선 링크(라디오 중계국), 옥외 경보 사이렌, 철도 무선 비상정지, 적외선·근거리 무선 제어 장치, 산업용 Wi-Fi (L0~L2)
    - 수법: 무선 장비로 주파수 설정·통신, 신호 녹음 뒤 재전송, 개조 리모컨 — 무선 구간 재밍은 와이파이 차단(OTC-IR-13.3)
    - 결과는 대부분 비인가 명령 메시지(OTC-IP-03.1)로 이어짐
    ■ 실제 사례
    - [실제 사고] 폴란드 철도 Radio-Stop(2023-08): 인증 없는 무선 비상정지 신호를 송신해 열차 20여 대를 세움 (INC-057)
    - [실제 사고] 댈러스 경보 사이렌(2017-04): 무선 신호로 옥외 경보 사이렌 156기를 반복 작동 (INC-034)
    - [실제 사고] 폴란드 우치 트램(2008-01): 개조한 리모컨의 적외선 신호로 선로 전환기를 조작 (INC-027)
  detect: |-
    ■ 탐지
    - 무선 네트워크의 새 장치·세션과 비정상 트래픽을 감시하고 무선 명령 이력을 운영 기록과 대조
    - 스펙트럼 감시로 비인가 송신·재밍 확인
    ■ 대응
    - 무선 제어 신호에 암호화·재전송 방지·발신자 인증을 적용하고 신호 전파 범위를 최소화
    - 중요 명령은 무선으로 받은 뒤에도 현장 확인·인터록을 거치게 설계

T0862:
  summary: |-
    - 공격자는 ICS 장비·소프트웨어 공급업체의 배포 경로나 설치 과정을 침해해, 정상 제품·업데이트·설치 작업에 악성 요소를 섞어 OT 환경에 들여올 수 있음
    - 신뢰하는 공급업체 경로로 들어와 검사를 거치지 않는 경우가 많고, 같은 제품을 쓰는 여러 고객사로 동시에 퍼짐
  reference: |-
    ■ OT 관점
    - 대상: 벤더 웹사이트의 설치 파일·펌웨어, 장비 반입·설치 과정의 소프트웨어, 통합업체·유지보수 업체가 가져오는 도구 (L1~L3)
    - 수법: 벤더 사이트의 정상 설치 파일을 트로이 목마로 바꿈(Dragonfly·Havex), 새 장비 설치 때 검사하지 않은 소프트웨어 유입, ICS 벤더·제조사 표적화(TEMP.Veles)
    - 펌웨어 단계 유입은 펌웨어 변조(OTC-PE-04.0)와 연결 — 기기에 내장된 구성요소(임베디드 스택)의 공급망 결함은 원격 서비스 취약점 악용(OTC-IA-10)에서 다룸
    ■ 실제 사례
    - [실제 사고] Dragonfly·Havex(2014-06): ICS 원격 접속 장비·산업용 카메라 업체 사이트의 설치 파일을 트로이 목마로 바꿔 배포 (INC-013, ATT&CK S0093)
    - [실제 사고] TSMC(2018-08): 신규 장비 설치 중 검사하지 않은 소프트웨어로 WannaCry 변종이 들어와 생산 차질 (INC-037)
  detect: |-
    ■ 탐지
    - 배포 파일의 해시·서명을 벤더 공식 값과 대조하고 다운로드 파일 검사
    - 신규 장비·소프트웨어 설치 뒤 단말의 비정상 프로세스·통신을 집중 감시
    ■ 대응
    - 공급업체 보안 요구사항(서명 배포·보안 개발 절차)을 계약에 반영하고 반입 전 검사 절차 운영
    - 설치·유지보수 작업에는 검사된 매체·도구만 쓰게 하고 작업 뒤 무결성 점검

T0864:
  summary: |-
    - 공격자는 정비 노트북·진단 장비처럼 OT와 외부망을 오가는 임시 접속 자산을 감염시키거나 빼돌려, OT 환경에 직접 연결되는 통로로 쓸 수 있음
    - 임시 자산은 상주 자산과 달리 보안 관리 대상에서 빠지기 쉽고, 엔지니어링 소프트웨어와 접속 정보를 함께 갖고 있음
  reference: |-
    ■ OT 관점
    - 대상: 엔지니어·협력업체의 정비용 노트북, 진단·프로그래밍 장비, 임시로 연결하는 원격 접속 장치 (L1~L3)
    - 원격 관리가 어려운 현장에서 많이 쓰이며, 외부망에서 감염된 뒤 OT에 연결되면 이동식 매체 전파(OTC-IA-04)와 같은 효과
    - 빼돌린 정비 장비는 위장 마스터(OTC-IA-05)로 쓰이기도 함
    ■ 실제 사례
    - [실제 사고] 마루치 하수처리(2000-03): 엔지니어링 소프트웨어가 설치된(탈취 추정) 컴퓨터로 하수처리 시스템과 통신 (INC-001, ATT&CK C0020)
  detect: |-
    ■ 탐지
    - 스위치 로그·네트워크 감시로 새 MAC 주소와 임시 장치 연결 탐지
    - 임시 자산 연결 기록과 작업 지시서 대조
    ■ 대응
    - 임시 자산은 등록·검사(백신·패치·무결성)를 마친 뒤에만 연결을 허용하고 전용 연결 구간 운영
    - 정비 장비의 분실·반납 관리와 엔지니어링 소프트웨어 계정 관리

T0865:
  summary: |-
    - 공격자는 특정 조직·직원을 노린 메일에 악성 문서·설치 파일을 첨부하거나 링크를 넣어, 업무 단말을 감염시키고 OT 접근의 발판을 만들 수 있음
    - OT 공격 대부분이 IT 업무망 침투에서 시작되며, 감염 단말에서 VPN·원격 접속 자격증명을 빼내 제어망으로 넘어감
  reference: |-
    ■ OT 관점
    - 대상: 엔지니어·운영자·관리자의 업무 단말, OT 접근 권한이 있는 점프 호스트 사용자 (L3~L4)
    - 수법: 매크로 포함 Office 문서(BlackEnergy·2015 우크라이나), 트로이 목마 설치 파일 첨부(Havex), 스피어피싱 링크(랜섬웨어 사고) — Enterprise 피싱(T1566, 링크 포함) 통합
    - 다음 단계는 대개 자격증명 탈취(OTC-LM-07)와 외부 원격 서비스 접속(OTC-IA-03)
    ■ 실제 사례
    - [실제 사고] 2015 우크라이나(2015-12): 피싱 메일의 Office 첨부파일로 다수 IT 시스템에 첫 거점 확보 (INC-002, ATT&CK C0028)
    - [실제 사고] 천연가스 압축 시설(2020-02): 스피어피싱 링크로 IT망에 들어온 뒤 OT망까지 랜섬웨어 확산 (INC-039)
    - [실제 사고] 한국수력원자력(2014-12): 임직원 대상 악성 메일 이후 내부 자료가 유출 (INC-073)
  detect: |-
    ■ 탐지
    - 문서 프로그램이 만드는 비정상 하위 프로세스와 첨부파일 실행을 엔드포인트 감시로 탐지
    - 메일 보안 게이트웨이의 악성 첨부·링크 탐지와 사용자 신고 연계
    ■ 대응
    - 매크로·실행 파일 첨부 차단, 메일 샌드박스, OT 담당자 대상 표적 피싱 훈련
    - OT 접근 계정을 업무 메일 계정과 분리하고 다중 인증 적용

T0866:
  summary: |-
    - 공격자는 OT 자산의 원격 서비스(SMB·RPC·데이터베이스·장치 웹 서버 등) 취약점을 악용해, 처음 진입하거나 내부에서 다른 자산으로 이동할 수 있음
    - 패치하기 어려운 노후 운영체제와 장치가 많아 오래된 취약점이 계속 유효하고, 웜형 악성코드는 IT에서 OT로 자동 확산됨
  reference: |-
    ■ OT 관점
    - 대상: Windows 기반 HMI·EWS·SCADA 서버·히스토리언(WinCC DB 등), PLC·RTU·IED의 웹·관리 서비스, 임베디드 네트워크 스택 (L1~L3.5)
    - CISA ICS 권고에서 원격 코드 실행·인증 우회류 공개 취약점 2,213건(이 매트릭스의 CWE 규칙 기준), KEV에서 OT 제품·임베디드 구성요소 실제 악용 17건 확인
    - 통합: Enterprise 원격 서비스 취약점 악용(T1210) — [IA]·[LM] 두 전술에 같은 근거로 표시
    ■ 실제 사례
    - [실제 사고] WannaCry·NotPetya(2017-05·2017-06): SMBv1 취약점(MS17-010)으로 IT망에서 산업망까지 자동 확산 (INC-015, INC-016)
    - [실제 사고] Stuxnet(2010-06): WinCC 데이터베이스 서버에 악성 SQL 명령을 실행하고 Windows 취약점(MS08-067·MS10-061)으로 확산 (INC-009, ATT&CK S0603)
    - [실제 사고] 데이비스-베시 원전(2003-01): SQL Slammer 웜이 협력업체 연결로 들어와 안전 변수 표시 시스템을 마비 (INC-025)
  detect: |-
    ■ 탐지
    - OT 네트워크 감시(DPI)로 익스플로잇 패턴과 내부의 대량 SMB·RPC 연결 확산 탐지
    - 서비스 충돌·비정상 종료 로그를 모아 악용 시도 확인
    ■ 대응
    - 위험 기반 패치(운영 영향 검증 뒤 적용)와 패치할 수 없는 자산의 보완 통제(서비스 비활성화·구간 분리·허용 목록)
    - OT 구간 사이의 불필요한 SMB·RPC를 막고 망 분리

T0883:
  summary: |-
    - 공격자는 원격 관리를 위해 인터넷에 직접 노출된 PLC·HMI·제어 장치에 접속해, 별도의 침투 없이 곧바로 OT 환경에 들어올 수 있음
    - 기본·약한 암호나 인증 없는 프로토콜이 그대로인 경우가 많아, 인터넷 스캔만으로 대상을 찾는 핵티비스트·봇넷의 손쉬운 표적이 됨
  reference: |-
    ■ OT 관점
    - 대상: 인터넷에 노출된 PLC 내장 HMI·웹 제어 화면·VNC 접속 HMI, 원격 감시 장치, 셀룰러 모뎀 연결 SCADA, IoT 기기 (L1~L2·IoT)
    - 2023년 이후 노출 장치를 노린 핵티비스트형 조작(화면 변조·설정값 변경·운영자 잠금)이 수도·댐·지역 유틸리티에서 반복되며, IoT 봇넷도 같은 경로를 씀
    - 외부 원격 서비스(OTC-IA-03)와 달리 원격 접속 체계를 거치지 않고 장치 자체가 노출된 것이 원인
    ■ 실제 사례
    - [실제 사고] Unitronics(2023-11): 인터넷에 연결된 Unitronics PLC·HMI에 접속해 화면을 바꿈 (INC-005, ATT&CK C0031)
    - [실제 사고] 노르웨이 브레망에르 댐(2025-04): 약한 암호의 웹 제어 화면에 접속해 방류 밸브를 엶 (INC-068)
    - [실제 사고] 캐나다 핵티비스트(2025-10): 노출된 제어 장치로 수도 압력·탱크 게이지·사일로 온습도를 조작 (INC-072)
  detect: |-
    ■ 탐지
    - 인터넷 출발지의 OT 장치 로그인·프로토콜 접속을 경보하고, 외부 스캔 서비스 결과로 자사 노출 장치를 정기 확인
    - 장치 화면·설정 변경을 접속 출발지와 대조
    ■ 대응
    - OT 장치의 인터넷 직접 노출을 없애고(방화벽·VPN 뒤로) 셀룰러 모뎀 같은 숨은 연결을 점검
    - 기본 암호 변경과 인증 강화, 노출이 불가피하면 출발지 제한과 접속 감시

T0886:
  summary: |-
    - 공격자는 RDP·SSH·SMB·WMI·데이터베이스 접속·원격 지원 소프트웨어 같은 정상 원격 서비스로 OT 자산 사이를 오가며 운영자처럼 시스템을 조작할 수 있음
    - 운영 업무에 쓰는 서비스라 막기 어렵고, 탈취한 정상 계정으로 접속하면 일상 운영 활동과 구분되지 않음
  reference: |-
    ■ OT 관점
    - 대상: 점프 호스트·HMI·SCADA 서버·히스토리언·데이터베이스 서버, 제어기의 관리 프로토콜(CODESYS·Telnet) (L1~L3.5)
    - 수법: 점프 호스트 RDP와 허술한 OT 방화벽 규칙(Triton), 헬프데스크 원격 제어 소프트웨어로 HMI 마우스 조작(2015 우크라이나), MS-SQL 피벗(2016 우크라이나), 관리자 공유·PsExec·WMI 확산
    - 통합: Enterprise 원격 서비스(T1021, RDP·SMB)·WMI(T1047)·RDP 세션 가로채기(T1563.002) — [IA]·[LM] 두 전술에 같은 근거로 표시
    ■ 실제 사례
    - [실제 사고] 2015 우크라이나(2015-12): IT 헬프데스크 원격 제어 소프트웨어로 ICS 단말의 마우스를 움직여 차단기를 개방 (INC-002, ATT&CK C0028)
    - [실제 사고] Triton(2017-08): RDP 점프 박스와 허술한 OT 방화벽 설정으로 ICS 영역에 이동 (INC-004, ATT&CK C0030)
    - [실제 사고] 2025 폴란드(2025-12): 침해한 Fortinet 경계 장비로 OT에 들어와 SSH·RDP·SMB로 장치에 접속 (INC-008, ATT&CK C0063)
  detect: |-
    ■ 탐지
    - 원격 서비스 접속의 출발지·시간대·계정을 기준선과 비교하고 IT 계정의 OT 자산 접속을 경보
    - 점프 호스트 세션 기록과 OT 자산 변경 이력 대조
    ■ 대응
    - OT 원격 접속을 점프 호스트로 일원화하고 다중 인증·세션 기록을 적용하며 구간 사이 RDP·SMB 직접 연결 차단
    - 원격 지원 소프트웨어 사용을 승인된 도구·시간으로 제한
