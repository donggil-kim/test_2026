# [DS] 탐색 — OT 관점 문구
# 작성 규칙은 IP.yaml 머리말 참고
# 탐색 기법은 피해를 직접 내지 않아 심각도 기본값이 '하'지만, 정밀 표적 공격의 조건 판단에 쓰이므로 탐지 우선순위는 높게 둠

T0840:
  summary: |-
    - 공격자는 침해한 OT 호스트·장치에서 netstat·arp·ipconfig 같은 명령이나 공격 도구 모듈로 현재 연결·라우팅·네트워크 설정을 확인해, 장치 간 통신 관계와 장치 역할을 파악할 수 있음
    - 운영자·관리 도구도 같은 명령을 자주 쓰고 결과가 로컬에만 남아, 명령 하나만으로는 공격 여부를 가리기 어려움
  reference: |-
    ■ OT 관점
    - 대상: EWS·HMI·SCADA 서버·데이터 게이트웨이의 연결 테이블·ARP 캐시·라우팅 테이블과 네트워크 어댑터 설정 (L2~L3)
    - 수법: HMI에서 netstat·arp -a·nslookup 실행(2025 폴란드), IEC 61850 모듈이 연결된 어댑터·서브넷 열거(Industroyer), 내부 도메인 이름 조회로 목표 망인지 확인(EKANS)
    - 통합: Enterprise 시스템 네트워크 설정 탐색(T1016)·네트워크 연결 탐색(T1049) — 결과는 원격 시스템 탐색(OTC-DS-03.0)·원격 시스템 정보 탐색(OTC-DS-05)의 출발점
    ■ 실제 사례
    - [실제 사고] 2025 폴란드(2025-12): Mikronika HMI 컴퓨터에서 netstat·arp·nslookup으로 연결과 네트워크 설정을 확인 (INC-008, ATT&CK C0063)
    - [실제 사고] 2016 우크라이나(2016-12): Industroyer의 IEC 61850 모듈이 연결된 네트워크 어댑터와 서브넷 마스크를 열거해 공격 범위를 정함 (INC-003, ATT&CK S0604)
    - [실제 사고] 혼다 공장(2020-06): EKANS가 목표 기업의 내부 도메인 이름을 조회해 의도한 망에서만 실행되게 함 (INC-020, ATT&CK S0605)
  detect: |-
    ■ 탐지
    - OT 호스트에서 짧은 시간에 이어서 실행되는 네트워크 탐색 명령(netstat·arp·ipconfig·route·nslookup)을 명령줄 감사로 상관 분석
    - 평소 이런 명령을 쓰지 않는 HMI·SCADA 서버 계정의 실행을 경보
    ■ 대응
    - 완화 수단이 제한적이므로 OT 호스트의 명령 셸·관리 도구 접근을 줄이고, 이어지는 횡적 이동·수집 행위의 탐지로 보완
    - 운영 계정과 관리 계정을 분리해 일반 운영 계정으로는 시스템 명령을 쓰지 못하게 함

T0842:
  summary: |-
    - 공격자는 침해한 호스트·네트워크 장비·제어기에서 지나가는 트래픽을 캡처해, 평문 자격증명과 제어 명령·공정 값·장치 주소를 수집할 수 있음
    - 다수 산업 프로토콜이 암호화 없이 동작해 캡처만으로 공정 구조와 명령 형식을 알아낼 수 있고, 수동 수신은 흔적을 거의 남기지 않음
  reference: |-
    ■ OT 관점
    - 대상: 제어망 스위치 구간·SCADA 서버·EWS, OT 경계 라우터·VPN 장비, Profibus 같은 필드버스와 통신 프로세서 (L1~L3.5)
    - 수법: 기업 LAN과 제어망 사이의 평문 자격증명 수집(BlackEnergy), 라우터에서 Modbus 트래픽·기본 인증 감시(VPNFilter), Profibus 프레임 수신 블록 가로채기(Stuxnet), tcpdump 배포(INCONTROLLER)
    - CISA ICS 권고에서 평문 전송·암호화 누락(CWE-319·311) 303건, 2025년 이후 115건 — 캡처한 자격증명은 유효 계정 악용(OTC-PE-01), 명령 형식은 중간자 공격(OTC-CO-04)으로 이어짐
    - 통합: Enterprise 네트워크 스니핑(T1040)
    ■ 실제 사례
    - [실제 사고] 2015 우크라이나(2015-12): BlackEnergy 스니퍼 모듈로 기업 LAN과 전력망 제어망 사이에 오가는 사용자 자격증명을 수집 (INC-002, ATT&CK C0028)
    - [실제 사고] VPNFilter(2018-05): 감염된 라우터의 패킷 스니퍼가 기본 인증 정보와 Modbus 트래픽을 감시 (INC-018, ATT&CK S1010)
    - [실제 사고] Stuxnet(2010-06): Profibus 프레임을 받는 표준 함수 블록 DP_RECV를 바꿔 필드버스 통신을 가로챔 (INC-009, ATT&CK S0603)
  detect: |-
    ■ 탐지
    - OT 호스트·장비에서 패킷 캡처 도구 설치·실행과 네트워크 인터페이스의 무차별 모드 전환을 감시
    - 스위치 미러 포트 설정 변경과 승인되지 않은 탭·장치 연결을 확인
    ■ 대응
    - 지원되는 구간부터 암호화·인증 통신(VPN·TLS·IEC 62351 등)을 적용하고, 평문 자격증명을 쓰는 원격 접속을 없앰
    - 망 분할과 정적 ARP·포트 보안으로 캡처 범위를 줄이고, 관리 계정에 다중 인증을 적용해 캡처된 자격증명의 재사용을 막음

T0846:
  summary: |-
    - 공격자는 침해한 호스트에서 네트워크의 다른 시스템·장치 목록(IP·호스트 이름·OPC 서버·제어 장치)을 만들어, 이후 횡적 이동과 공격 대상을 정할 수 있음
    - 운영체제 명령·벤더 소프트웨어·산업 프로토콜 기능만으로도 가능하고, IT망에서 OT 장치가 보이는 구조면 IT 침해만으로 OT 자산 목록이 드러남
  reference: |-
    ■ OT 관점
    - 대상: 같은 망의 HMI·SCADA 서버·OPC 서버·PLC·RTU·IED와 Active Directory 컴퓨터 목록 (L1~L3)
    - 수법: Windows 네트워킹으로 OPC 서버 검색(Havex), OPC DA 서버 열거(Industroyer), FINS 프로토콜로 Omron 장치 검색(INCONTROLLER), LDAP로 AD 컴퓨터 조회(2016 우크라이나), ping·nslookup(2025 폴란드)
    - 하위 기법: 포트 스캔(OTC-DS-03.1)·브로드캐스트 탐색(OTC-DS-03.2)·멀티캐스트 탐색(OTC-DS-03.3) — 통합: Enterprise 원격 시스템 탐색(T1018)
    ■ 실제 사례
    - [실제 사고] 2015 우크라이나(2015-12): IT망에서도 OT 시스템이 보이는 구조를 이용해 LAN 연결로 운영 자산을 원격 탐색 (INC-002, ATT&CK C0028)
    - [실제 사고] Dragonfly(2014-06): Havex의 ICS 플러그인이 Windows 네트워킹으로 도달 가능한 OPC 서버를 모두 찾음 (INC-013, ATT&CK S0093)
    - [위협인텔] PIPEDREAM(2022-04): INCONTROLLER가 FINS 프로토콜로 Omron 장치를 검색해 MAC 주소를 얻는 기능을 갖춤 (INC-022, ATT&CK S1045)
  detect: |-
    ■ 탐지
    - 한 호스트가 짧은 시간에 많은 장치로 ICMP·DCOM·산업 프로토콜 연결을 시도하면 OT 네트워크 감시로 경보
    - 평소 없던 OPC 열거·LDAP 대량 조회와 새 산업 프로토콜 연결을 기준선과 비교
    ■ 대응
    - IT망에서 OT 장치가 보이지 않도록 망을 분할하고 경계에서 탐색 트래픽을 차단
    - 정적 네트워크 구성과 허용 목록 통신으로 탐색에 응답하는 범위를 줄임

T0846.001:
  summary: |-
    - 공격자는 제어망의 호스트·장치에 포트 스캔을 해 살아 있는 장치와 열린 서비스(S7 102·Modbus 502·OPC UA 4840 등)를 찾아, 장치 종류와 공격할 프로토콜을 정할 수 있음
    - 산업 프로토콜 포트만 골라 조용히 스캔하면 일반 IT 스캔 탐지 규칙에 잘 걸리지 않고, 오래된 장치는 스캔만으로 멈추기도 함
  reference: |-
    ■ OT 관점
    - 대상: PLC·RTU·IED·OPC 서버·HMI 등 제어망 장치의 산업 프로토콜 포트와 관리 서비스 (L1~L3)
    - 수법: TCP 102 접속으로 IEC 61850·S7 장치 탐색(Industroyer·PLC-Blaster), ICS 포트 스캔 모듈(Havex), OPC UA 4840 스캔(INCONTROLLER), 상용 스캐너(Advanced Port Scanner·Advanced IP Scanner)
    - 오래된 제어기는 비정상 패킷·대량 연결에 약해 스캔이 서비스 거부(OTC-IR-03)로 번질 수 있음 — 통합: Enterprise 네트워크 서비스 탐색(T1046)
    ■ 실제 사례
    - [실제 사고] 2016 우크라이나(2016-12): Industroyer의 IEC 61850 구성요소가 서브넷 장치에 TCP 102 연결을 시도해 대상을 찾고, 자체 포트 스캐너로 망을 매핑 (INC-003, ATT&CK S0604)
    - [실제 사고] 2025 폴란드(2025-12): Advanced Port Scanner·Advanced IP Scanner와 ping으로 네트워크 장치를 열거 (INC-008, ATT&CK C0063)
    - [실증] PLC-Blaster(2016-03): TCP 102에서 응답하는 Siemens S7 PLC를 찾아 감염 대상으로 삼음 (INC-024, ATT&CK S1006)
  detect: |-
    ■ 탐지
    - 한 출발지가 여러 장치·포트에 연결을 시도하거나 산업 프로토콜 포트를 순회하면 OT 네트워크 감시로 경보
    - 승인된 자산 점검 일정·도구와 대조해 계획에 없는 스캔 식별
    ■ 대응
    - 제어망을 영역별로 나누고 영역 사이에는 필요한 포트·발신지만 허용
    - OT 프로토콜을 인식하는 침입 방지 장비를 경계에 두고, 자산 점검은 수동 방식이나 벤더가 검증한 도구로 수행

T0846.002:
  summary: |-
    - 공격자는 망 전체에 브로드캐스트 탐색 요청(ARP·산업 프로토콜 탐색 패킷)을 보내 응답한 장치를 찾아, 장치 목록과 쓰는 프로토콜을 빠르게 파악할 수 있음
    - 많은 산업 장치가 설정 편의를 위해 탐색 요청에 응답하도록 출하되고, 엔지니어링 도구도 같은 요청을 써서 정상 활동과 구분이 어려움
  reference: |-
    ■ OT 관점
    - 대상: 같은 브로드캐스트 도메인의 안전 제어기·PLC·RTU·HMI·EWS (L1~L2)
    - 수법: UDP 1502 브로드캐스트로 Triconex 제어기 탐색(Triton), ARP로 시스템 확인(2025 폴란드) — PROFINET DCP 같은 벤더 탐색 프로토콜도 같은 방식으로 악용될 수 있음
    - 브로드캐스트는 라우터를 넘지 못하므로, 이 기법이 보이면 공격자가 이미 제어기와 같은 망 구간에 있다는 뜻
    ■ 실제 사례
    - [실제 사고] Triton(2017-08): 특정 UDP 브로드캐스트 패킷(포트 1502)을 보내는 Python 스크립트로 망의 Triconex 제어기를 찾음 (INC-004, ATT&CK S1009)
    - [실제 사고] 2025 폴란드(2025-12): arp로 같은 망의 시스템을 탐색 (INC-008, ATT&CK C0063)
  detect: |-
    ■ 탐지
    - 평소 탐색 기능을 쓰지 않던 호스트가 산업 프로토콜 브로드캐스트 탐색을 보내면 OT 네트워크 감시로 경보
    - EWS가 아닌 곳에서 나오는 벤더 탐색 패킷과 ARP 스캔 패턴을 기준선과 비교
    ■ 대응
    - 안전계통을 별도 망 구간으로 분리하고 브로드캐스트 도메인을 작게 나눔
    - 장치의 불필요한 탐색 응답 기능을 끄고 정적 네트워크 구성을 적용

T0846.003:
  summary: |-
    - 공격자는 미리 정해진 멀티캐스트 그룹에 탐색 요청을 보내 그 그룹의 장치만 응답하게 해, 특정 벤더 장치를 골라 찾을 수 있음
    - 망 전체가 아닌 그룹 단위 요청이라 브로드캐스트보다 눈에 덜 띄고, 벤더 관리 프로토콜의 정상 기능과 구분이 어려움
  reference: |-
    ■ OT 관점
    - 대상: 벤더 관리 프로토콜로 멀티캐스트 탐색에 응답하는 PLC·제어기 (L1~L2)
    - 수법: UDP 27127 멀티캐스트 스캔으로 NetManage 프로토콜을 쓰는 Schneider PLC 식별(INCONTROLLER)
    - 같은 망 구간이나 멀티캐스트가 전달되는 구간에 있어야 하므로, 망 분할 상태가 탐색 범위를 결정
    ■ 실제 사례
    - [위협인텔] PIPEDREAM(2022-04): INCONTROLLER가 UDP 27127 멀티캐스트 스캔으로 Schneider PLC를 찾는 기능을 갖춘 채 배포 전에 발견 (INC-022, ATT&CK S1045)
  detect: |-
    ■ 탐지
    - 평소 쓰지 않던 호스트에서 벤더 관리 프로토콜의 멀티캐스트 탐색이 나오면 OT 네트워크 감시로 경보
    - 멀티캐스트 그룹 가입(IGMP)과 새 산업 프로토콜 연결을 기준선과 비교
    ■ 대응
    - 스위치·라우터에서 필요 없는 멀티캐스트 전달을 막고 망을 분할
    - 장치의 불필요한 탐색 응답 기능을 끄고 정적 구성을 적용

T0887:
  summary: |-
    - 공격자는 원격 제어·감시에 쓰는 무선 신호(셀룰러·전용 무선·WirelessHART·Wi-Fi 등)를 수신해, 통신 내용·장치 주소·명령 형식을 수집할 수 있음
    - 수동 수신은 장치에 접속하지 않아 흔적이 남지 않고, 신호가 시설 밖까지 퍼지면 물리적 침입 없이도 수집할 수 있음
  reference: |-
    ■ OT 관점
    - 대상: 원격 필드 텔레메트리 무선 링크, 산업용 무선 센서망(WirelessHART·ISA100), 무선 제어 신호(철도·경보 사이렌·크레인 원격), 현장 Wi-Fi (L0~L2·원격 필드)
    - 수집한 명령 형식·주소는 무선 통신 침해(OTC-IA-06)로 위조 명령을 재전송하거나 비인가 명령 메시지(OTC-IP-03.1)를 보내는 데 쓰임
    - 암호화가 없거나 약한 레거시 무선 링크가 주 대상이며, 소프트웨어 정의 라디오(SDR)로 적은 비용에 수집 가능
    ■ 실제 사례
    - 공개 사고 미확인 — 수동 수신은 흔적이 남지 않아 사고로 드러나기 어렵고, ATT&CK에도 실제 사용 절차가 없음
    - [시나리오] 원격 펌프장의 무선 텔레메트리를 수신해 명령 형식과 장치 주소를 파악한 뒤, 같은 주파수로 위조 정지 명령을 보냄
  detect: |-
    ■ 탐지
    - 수동 수신 자체는 탐지가 사실상 어려우므로, 무선망 가입 시도·새 무선 장치·재전송·재밍 같은 능동 행위를 무선 감시로 확인
    - 무선 경로로 들어온 명령을 운영 기록과 대조해 근거 없는 명령을 찾음
    ■ 대응
    - 무선 링크에 암호화·메시지 인증을 적용하고 레거시 무선 장비를 단계적으로 교체
    - 안테나 방향·송신 출력을 조정해 신호가 시설 밖으로 퍼지는 범위를 줄임

T0888:
  summary: |-
    - 공격자는 원격 장치의 제조사·모델·펌웨어 버전·역할·설정을 산업 프로토콜 질의나 원격 명령으로 수집해, 공격 대상이 맞는지 확인하고 이후 공격을 장치에 맞출 수 있음
    - 장치 식별·상태 조회는 SCADA·자산 관리 도구가 늘 쓰는 정상 기능이라 질의 자체로는 이상을 가리기 어려움
  reference: |-
    ■ OT 관점
    - 대상: PLC·RTU·IED·OPC 서버·HMI의 장치 식별 정보, 시스템 데이터 블록, 논리 노드·IOA 목록 (L1~L2)
    - 수법: IEC 61850 MMS getNameList로 논리 노드 조회(Industroyer), IEC 104로 연결 상태·공통 주소·IOA 상태 폴링(Industroyer2), 시스템 데이터 블록으로 설비 구성 확인(Stuxnet), OPC 서버 정보 수집(Havex), Modbus 장치 ID 요청(INCONTROLLER)
    - Stuxnet은 특정 구성이 맞을 때만 공격해, 이 기법이 정밀 표적 공격의 조건 판단에 쓰임을 보여줌 — 결과는 포인트·태그 식별(OTC-CO-07)·운전 파라미터 변조(OTC-IP-02)로 이어짐
    ■ 실제 사례
    - [실제 사고] 2016 우크라이나(2016-12): Industroyer가 IEC 61850 MMS getNameList로 장치의 논리 노드를 조회해 차단기·스위치 제어(CSW) 장치를 찾음 (INC-003, ATT&CK S0604)
    - [실제 사고] Stuxnet(2010-06): PLC 시스템 데이터 블록을 읽어 Profibus 통신 프로세서(CP 342-5) 같은 목표 구성이 있는지 확인 (INC-009, ATT&CK S0603)
    - [실제 사고] Industroyer2(2022-04): 대상 장치의 연결·전송 상태, 공통 주소, IOA와 I/O 상태를 폴링하도록 구성 (INC-021, ATT&CK S1072)
  detect: |-
    ■ 탐지
    - 평소 질의하지 않던 호스트가 장치 식별·이름 목록·진단 정보를 요청하면 OT 네트워크 감시로 경보
    - 한 호스트가 여러 장치에 같은 식별 질의를 보내는 패턴과 PsExec 같은 원격 명령 실행을 상관 분석
    ■ 대응
    - 장치 식별·진단 기능 접근을 지정 SCADA·EWS로 제한하고, 쓰지 않는 장치 정보 서비스(웹·SNMP 등)를 끔
    - 정적 네트워크 구성과 허용 목록 통신으로 질의 가능한 범위를 줄임
