# EMB3D 신설 세부위협 — OT 관점 문구 (v3)
# ATT&CK for ICS에 대응 기법이 없는 장치 하드웨어 위협을 효과가 나타나는 전술 아래 신설한 행.
# 근거는 MITRE EMB3D 위협(TID) — 성숙도 '관찰'=실사용, '알려진 취약점'·'개념 증명'=실증. 대부분 물리 접근이 전제라 탐지·대응은 물리 보안·장치 무결성 위주.
# 작성 규칙은 IP.yaml 머리말 참고. 사례 라벨 [EMB3D]는 EMB3D 위협(TID) 인용(배포된 분석·시연 근거).

EMB3D-IA:
  summary: |-
    - 공격자는 장치에 남아 있는 디버그·유지보수 포트(JTAG·UART·진단 광포트 등)에 물리적으로 접근해, 원격 접근 통제를 거치지 않고 장치 셸·메모리에 직접 들어올 수 있음
    - 양산 뒤에도 비활성화되지 않은 포트가 많고, 현장·원격 무인 설비는 물리 접근을 막기 어려워 소프트웨어 권한 모델 밖의 진입 경로가 됨
  reference: |-
    ■ OT 관점
    - 대상: 현장·네트워크 장치(PLC·RTU·IED·DCS 제어기·PAC·필드 I/O·안전 제어기·게이트웨이·산업용 라우터·스위치·방화벽)의 디버그·개발·유지보수 포트 (L0~L3.5)
    - 전제: 장치에 물리적으로 닿아야 함 — 무인 변전소·원격 펌프장·옥외 캐비닛처럼 물리 보안이 약한 곳이 주 대상
    - 얻은 접근은 펌웨어·데이터 추출(OTC-CO-14.2)·메모리 조작으로 이어지고, 유효 계정 확보(OTC-PE-01)의 우회 경로가 됨
    ■ 실제 사례
    - [실제 사고] 푸에르토리코 스마트 계량기(2010-05): 현장 진단용 광포트에 광 변환기·노트북을 연결해 사용량 기록 설정을 바꿔 전기를 훔침 (INC-083)
    - [EMB3D] 잠재 특권 접근 포트·하드웨어 디버그 포트: UART 셸로 root 획득, JTAG로 메모리·코드 조작이 시연됨 (EMB3D TID-116, TID-119)
  detect: |-
    ■ 탐지
    - 캐비닛·함체의 개폐 감지(도어 스위치·봉인)와 장치 변조 탐지 신호를 감시·운영 시스템으로 올려 비인가 물리 접근을 경보
    - 디버그 포트 활성화·접속 흔적(진단 세션 로그, 예정 없는 재부팅)을 장치 진단으로 확인
    ■ 대응
    - 양산·설치 단계에서 쓰지 않는 디버그·개발 포트를 비활성화하거나 물리적으로 차단하고, 유지보수 포트는 인증·판독 보호(readout protection)를 적용 (EMB3D MID-057·MID-058, IEC 62443-4-2 EDR/HDR/NDR 2.13)
    - 현장·원격 설비의 함체 잠금·봉인·접근 통제를 강화하고 유지보수 접근을 절차·기록으로 관리

EMB3D-EV:
  summary: |-
    - 공격자는 전압·클럭·전자기·레이저로 프로세서에 순간적 결함(글리치)을 일으켜, 보안 검사 분기를 건너뛰거나 메모리 값을 바꿔 보호·검증을 무력화할 수 있음
    - 정상 코드를 바꾸지 않고 실행 순간에만 작용해 소프트웨어 무결성 검사로는 보이지 않으며, 보안 부팅·판독 보호 같은 하드웨어 보호를 우회하는 데 쓰임
  reference: |-
    ■ OT 관점
    - 대상: 보안 부팅·펌웨어 검증·판독 보호를 하드웨어로 구현한 제어기·현장 장치의 프로세서·메모리 (L0~L3.5)
    - 전제: 장치에 물리적으로 닿아야 하며, 보통 디버그 포트 악용(OTC-IA-13)·칩 직접 판독(OTC-CO-14.1)과 함께 쓰여 보호를 벗겨 냄
    - 결과: 신뢰 루트 우회(OTC-LM-10.2)·변조 펌웨어 실행(OTC-PE-04.1)으로 이어짐
    ■ 실제 사례
    - [EMB3D] 하드웨어 결함 주입: 전압 글리치로 부팅 ROM의 판독 보호 설정을 건너뛰어 신뢰 루트 코드를 빼낸 사례(알려진 취약점)와, RowHammer·Plundervolt로 메모리·보안 영역에 결함을 주입한 시연 (EMB3D TID-105, TID-110)
  detect: |-
    ■ 탐지
    - 장치 변조·개봉 감지와 예정 없는 재부팅·비정상 리셋·전원 이상을 장치 진단·감시 시스템으로 확인
    - 보안 부팅 실패·무결성 검사 경보를 중앙으로 수집해 반복 발생 여부를 봄
    ■ 대응
    - 결함 주입에 견디는 하드웨어·소프트웨어 보호(전압·클럭 감시, 중복 검사, 중요 분기 다중화, RowHammer 내성 메모리)를 갖춘 장치를 도입 (EMB3D MID-062·MID-063·MID-066·MID-067)
    - 물리 접근 자체를 차단(함체 잠금·봉인·접근 통제)하고 중요 설비는 변조 방지 등급 장치를 우선 적용

EMB3D-LM.1:
  summary: |-
    - 공격자는 장치의 소비 전력·전자기 방출·연산 시간·캐시 상태를 측정·분석해, 암호키 같은 비밀을 장치에 침입하지 않고 추론할 수 있음
    - 정상 동작을 관찰만 해도 되어 로그·무결성 검사에 흔적이 남지 않으며, 얻은 키는 다른 장치·통신을 뚫는 횡적 이동의 발판이 됨
  reference: |-
    ■ OT 관점
    - 대상: 암호 연산을 수행하는 제어기·현장 장치·게이트웨이의 프로세서·암호 모듈 (L0~L3.5)
    - 전제: 전력·전자기 측정은 근접 물리 접근, 마이크로아키텍처·타이밍 부채널은 장치에서 코드 실행이나 네트워크 접근이 필요
    - 얻은 키·비밀은 신뢰 루트 우회(OTC-LM-10.2)·펌웨어 복호화·통신 복호화로 이어져, 같은 제품군 전체로 확산될 수 있음
    ■ 실제 사례
    - [EMB3D] 부채널 분석: 마이크로아키텍처 부채널(Spectre/Meltdown 계열)이 실제로 관측됐고, 전력·전자기 분석으로 AES 키 복원, 암호 연산 타이밍으로 비교 로직 우회가 시연됨 (EMB3D TID-101, TID-103, TID-330)
  detect: |-
    ■ 탐지
    - 수동 측정은 탐지가 어려우므로, 장치 근접 물리 접근(함체 개폐·근접 장비 설치)과 비인가 코드 실행을 우선 감시
    - 마이크로아키텍처·타이밍 부채널은 해당 CVE·벤더 권고 대상 프로세서를 자산 대장과 대조해 패치 상태를 점검
    ■ 대응
    - 검증된 암호 라이브러리·부채널 저항 구현과 전용 하드웨어 암호 모듈을 사용하고, 사용자 제공 코드 실행을 제한 (EMB3D MID-027·MID-059·MID-060·MID-051, IEC 62443-4-2 CR 4.3)
    - 중요 암호 연산 장치는 물리 접근을 차단하고 OS 부채널 완화·분리 프로세서를 적용

EMB3D-LM.2:
  summary: |-
    - 공격자는 장치의 하드웨어 신뢰 루트(TPM·보안 요소·암호 칩)에서 키·비밀을 빼내거나 그 검증을 우회해, 펌웨어·자격증명의 인증 보호를 무력화할 수 있음
    - 신뢰 루트가 고장(immutable) 설계라 결함이 발견돼도 패치할 수 없는 경우가 많아, 같은 제품군 전체가 오래 노출됨
  reference: |-
    ■ OT 관점
    - 대상: 보안 부팅·펌웨어 무결성·키 저장을 신뢰 루트로 구현한 제어기·현장 장치(S7-1500 등) (L0~L3.5)
    - 전제: 칩 직접 판독(OTC-CO-14.1)·버스 가로채기(OTC-CO-14.3)·결함 주입(OTC-EV-11)으로 신뢰 루트에 접근
    - 결과: 자격증명 위조, 변조 펌웨어 재암호화·설치(OTC-PE-04.1), 장치에 대한 은밀한 특권 장악으로 이어짐
    ■ 실제 사례
    - [실증] S7-1500 신뢰 루트 우회(2023-01): 패치할 수 없는 하드웨어 신뢰 루트 결함으로 펌웨어 무결성 검증을 우회함(CVE-2022-38773) (INC-079)
    - [EMB3D] 신뢰 루트 비밀 추출·우회: 신뢰 루트에서 비밀 추출, 패치 불가 하드웨어 신뢰 루트 결함이 시연·보고됨 (EMB3D TID-214, TID-220)
  detect: |-
    ■ 탐지
    - 신뢰 루트·보안 요소의 자체 진단·무결성 경보를 수집하고, 펌웨어 서명 검증 실패를 중앙으로 모음
    - 해당 장치의 신뢰 루트 관련 CVE·벤더 권고를 자산 대장과 대조해 영향 제품을 식별
    ■ 대응
    - 하드웨어 기반 키 저장·공장 고유 비밀키·전용 암호 모듈을 갖춘 장치를 도입하고, 패치 불가 결함은 네트워크 분리·물리 접근 통제로 보완 (EMB3D MID-028·MID-033·MID-060)
    - 조달 요건에 신뢰 루트 갱신 가능성과 키 보호 수준을 명시하고, 영향 장치는 교체 계획을 세움

EMB3D-CO.1:
  summary: |-
    - 공격자는 장치에서 메모리·저장장치 칩(ROM·NVRAM·플래시·RAM)을 떼거나 직접 읽어, 펌웨어·설정·암호키·공정 데이터를 추출·변조할 수 있음
    - 저장 내용이 암호화·인증되지 않은 경우 칩 판독만으로 비밀이 드러나며, 장치를 켠 채 냉각하면 RAM의 휘발 데이터까지 복원됨
  reference: |-
    ■ OT 관점
    - 대상: 제어기·현장 장치·게이트웨이의 비휘발성 저장 칩(펌웨어·설정)과 RAM (L0~L3.5)
    - 전제: 장치를 확보하거나 물리적으로 분해할 수 있어야 함 — 폐기·수리·탈취 장치가 경로가 됨
    - 추출한 펌웨어·키는 신뢰 루트 우회(OTC-LM-10.2)·변조 펌웨어 제작(OTC-PE-04.1)·같은 제품군 공격에 재사용됨
    ■ 실제 사례
    - [실증] S7-1500 분석(2023-01): NAND 플래시 칩을 떼어 내용을 읽어 신뢰 루트 분석에 활용함 (INC-079)
    - [EMB3D] 칩 직접 판독: 콜드부트로 DDR RAM 내용을 복원하고, 떼어 낸 비휘발성 칩을 프로그래머로 읽는 기법이 시연됨 (EMB3D TID-108, TID-109)
  detect: |-
    ■ 탐지
    - 물리 추출은 장치 분해가 전제라 사후 탐지가 어려우므로, 장치 변조·개봉 감지와 자산 반출·폐기·분실 관리로 대비
    - 수리·반납 장치의 저장 내용 초기화 여부를 점검
    ■ 대응
    - 비휘발성 저장 내용과 중요 데이터를 암호화·인증하고, 중요 코드·데이터를 온칩 메모리에 두거나 고집적 프로세서를 사용 (EMB3D MID-054·MID-064·MID-065·MID-052, IEC 62443-4-2 CR 4.1·4.2)
    - 폐기·수리 전 저장장치를 완전 삭제하고, 장치 분실·탈취 시 키 폐기·교체 절차를 둠

EMB3D-CO.2:
  summary: |-
    - 공격자는 보호되지 않은 프로그래밍·디버그 인터페이스(JTAG·SWD 등)로 장치 펌웨어를 추출해, 역분석으로 취약점·키·암호를 찾아낼 수 있음
    - 추출한 펌웨어는 같은 제품을 쓰는 모든 현장에 통하는 공격 재료가 되어, 한 대의 분석이 제품군 전체의 위험으로 번짐
  reference: |-
    ■ OT 관점
    - 대상: 프로그래밍·디버그 인터페이스가 열려 있는 제어기·현장 장치·게이트웨이 (L0~L3.5)
    - 전제: 장치 물리 접근과 인터페이스 접속 — 디버그·유지보수 포트 악용(OTC-IA-13)과 같은 접근 경로
    - 추출한 펌웨어의 역분석은 하드코딩 자격증명(OTC-PE-05.2)·펌웨어 변조(OTC-PE-04.1)·공개 취약점 발굴로 이어짐
    ■ 실제 사례
    - [EMB3D] 하드웨어 인터페이스로 펌웨어 추출: JTAG 인터페이스로 장치 펌웨어를 추출하는 기법이 시연됨 (EMB3D TID-115)
  detect: |-
    ■ 탐지
    - 디버그·프로그래밍 인터페이스 활성화 상태와 접속 흔적을 장치 진단으로 확인하고, 장치 변조·개봉을 감지
    - 유출된 펌웨어·역분석 정황(벤더 외부에 도는 펌웨어 이미지)을 위협 인텔리전스로 추적
    ■ 대응
    - 쓰지 않는 프로그래밍·디버그 인터페이스를 비활성화·잠그고 판독 보호를 적용하며, 펌웨어를 암호화 저장 (EMB3D MID-057·MID-058)
    - 조달 요건에 디버그 인터페이스 보호와 펌웨어 기밀성을 명시하고, 현장 장치의 물리 접근을 통제

EMB3D-CO.3:
  summary: |-
    - 공격자는 장치 내부 데이터 버스(메모리 버스·SPI·I2C·PCIe 등)에 끼어들거나 직접 메모리 접근(DMA)을 악용해, 평문으로 오가는 코드·키·데이터를 읽거나 바꿀 수 있음
    - 버스·주변기기 수준에서 일어나 OS·애플리케이션 보호를 우회하며, 보안 부팅·메모리 보호가 켜져 있어도 통하는 경우가 있음
  reference: |-
    ■ OT 관점
    - 대상: 제어기·현장 장치의 내부 버스와 주변기기, DMA 가능 구성요소 (L0~L3.5)
    - 전제: 근접 물리 접근(버스 프로브·주변기기 연결) — 칩 직접 판독(OTC-CO-14.1)과 함께 쓰여 저장·전송 데이터를 모두 노림
    - 가로챈 키·펌웨어는 신뢰 루트 우회(OTC-LM-10.2)·변조 펌웨어 실행(OTC-PE-04.1)으로 이어짐
    ■ 실제 사례
    - [실증] S7-1500 분석(2023-01): 칩 간 I2C 통신에 접근해 신뢰 루트 보호 기능을 분석함 (INC-079)
    - [EMB3D] 버스 가로채기·DMA: 메모리 버스 스누핑으로 보안 영역 기밀을 깨고, DMA 공격으로 하드웨어 보호를 우회하며, PCIe 버스 중간자 공격이 시연됨 (EMB3D TID-106, TID-107, TID-114)
  detect: |-
    ■ 탐지
    - 버스 프로빙·주변기기 연결은 물리 접근이 전제라, 장치 변조·개봉 감지와 비인가 주변기기 연결 감시로 대비
    - DMA 가능 포트(썬더볼트·PCIe 등)의 연결·열거 이벤트를 장치 진단으로 확인
    ■ 대응
    - 버스·주변기기 데이터를 암호화·인증하고, IOMMU로 DMA 접근을 통제하며, 주변기기 인증과 고집적 프로세서로 물리 공격면을 줄임 (EMB3D MID-053·MID-068·MID-070·MID-054)
    - 중요 설비는 변조 방지 등급 장치를 쓰고 함체 잠금·봉인으로 내부 접근을 차단
