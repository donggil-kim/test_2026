# [IR] 대응 기능 억제 — OT 관점 문구 (파일럿)
# 작성 규칙은 IP.yaml 머리말 참고

T0800:
  summary: |-
    - 공격자는 보호 계전기·제어기를 펌웨어 업데이트 모드로 바꿔, 비상시에 동작해야 할 보호·감시 기능을 멈추게 할 수 있음
    - 정상 유지보수 기능이라 모드 전환 자체는 공격으로 보이지 않고, 새 펌웨어 없이 이 모드에 두면 장치가 대기 상태로 남아 보호 공백이 이어짐
  reference: |-
    ■ OT 관점
    - 대상: 보호 계전기·IED·PLC·안전 제어기·RTU처럼 원격 펌웨어 설치 모드를 가진 장치 (L0~L2)
    - 업데이트 모드에서는 공정 감시와 관련 기능이 멈추는 장치가 많아, 보호 기능을 먼저 해제하고 차단기 조작(OTC-IP-03.1)을 겹치면 피해가 커짐
    - 펌웨어 변조(OTC-PE-04.1)의 선행 단계로도 쓰이며, 모드 전환 명령을 받아들이는 관리 프로토콜 접근이 전제
    ■ 실제 사례
    - [실제 사고] 2016 우크라이나 송전 변전소(2016-12): Industroyer의 SIPROTEC 서비스 거부 모듈이 보호 계전기를 펌웨어 업데이트 모드로 만들어 보호 기능을 해제 (INC-003, ATT&CK S0604)
  detect: |-
    ■ 탐지
    - 자동화 프로토콜에 나타나는 업데이트 모드 전환 정보와 장치 경보·로그를 수집해 계획된 작업 지시와 대조
    - 보호 계전기의 상태 보고 중단·응답 이상을 OT 네트워크 감시로 경보
    ■ 대응
    - 업데이트 모드 전환은 현장 키스위치·로컬 조작이나 인증된 엔지니어링 단말에서만 허용
    - 관리 프로토콜 접근을 허용 목록으로 제한하고, 보호 계통을 이중화해 한쪽이 멈춰도 보호 기능 유지

T0809:
  summary: |-
    - 공격자는 와이퍼·삭제 명령으로 HMI·EWS·히스토리언의 시스템·구성 파일과 RTU·IED·PLC 메모리를 지워, 운영자 화면과 제어 장치를 쓸 수 없게 만들 수 있음
    - 복구용 백업·섀도 복사본과 ICS 구성 파일까지 함께 지우는 경우가 많아, 공정 복구 속도가 백업 상태와 현장 재구성 역량에 좌우됨
  reference: |-
    ■ OT 관점
    - 대상: HMI·EWS·SCADA 서버·히스토리언의 운영체제와 ICS 구성 파일(예: ABB PCM600), RTU·IED·PLC 메모리, 라우터·IoT 기기 저장장치 (L0~L3.5)
    - 수법: OT 전용 와이퍼(Industroyer 와이퍼·DynoWiper), 범용 와이퍼(KillDisk·CaddyWiper), 장치 원격 초기화(INCONTROLLER), 저장 칩 반복 기록으로 물리 파괴(Fuxnet)
    - 통합: Enterprise 데이터 파괴(T1485)·디스크 삭제(T1561)·시스템 복구 방해(T1490) — 그룹 정책 배포(OTC-PV-04.1)로 다수 단말을 한꺼번에 지움
    ■ 실제 사례
    - [실제 사고] 2025 폴란드(2025-12): DynoWiper와 기본 명령으로 Mikronika RTU·Hitachi Relion 보호 계전기·HMI 데이터를 파괴 (INC-008, ATT&CK C0063)
    - [실제 사고] 2016 우크라이나(2016-12): Industroyer 와이퍼가 ICS 구성 파일과 시스템 파일을 덮어써 복구를 늦춤 (INC-003, ATT&CK S0604)
    - [실제 사고] Fuxnet(2024-04): 센서 게이트웨이의 NAND 메모리를 반복 기록으로 물리 파괴 (INC-023, ATT&CK S1157)
  detect: |-
    ■ 탐지
    - 다수 파일의 급격한 변경·삭제, 섀도 복사본 삭제(vssadmin)·부팅 설정 변경을 엔드포인트 감시로 경보 — ICS 구성 파일 경로를 중점 감시
    - 장치 메모리 초기화·재설정 명령과 뒤이은 통신 두절을 OT 네트워크 감시와 장치 진단으로 확인
    ■ 대응
    - ICS 구성·프로젝트 파일과 장치 설정을 오프라인·변경 불가 백업으로 보관하고 복원 절차를 정기 훈련
    - 관리자·도메인 정책 변경 권한을 최소화하고, 단말 애플리케이션 허용 목록으로 와이퍼 실행 차단

T0814:
  summary: |-
    - 공격자는 대량 요청, 처리할 수 없는 패킷, 장치 취약점으로 제어 장치를 응답 불능 상태로 만들어, 명령 수신과 상태 보고를 멈추게 할 수 있음
    - 많은 OT 장치는 재부팅해야만 회복되고, 보호 계전기처럼 비상시에 동작해야 할 장치가 멈추면 다른 공격의 피해가 커짐
  reference: |-
    ■ OT 관점
    - 대상: 보호 계전기·PLC·RTU·IED·OPC 서버·SCADA 서버·히스토리언, 빌딩 자동화 제어기, 운영 지원용 전화·통신 시스템 (L0~L3.5)
    - 경로: 장치 취약점 악용(CVE-2015-5374 SIPROTEC), 무분별한 탐색 트래픽(Havex OPC 스캔으로 플랫폼 충돌), 제어기 사이클 타임 초과 유도, 외부 DDoS
    - CISA ICS 권고의 자원 고갈·충돌 취약점 732건 — 노후 장치는 단순한 비정상 패킷에도 멈출 수 있어 능동 스캔 자체가 장애 원인이 되기도 함
    ■ 실제 사례
    - [실제 사고] 2016 우크라이나(2016-12): CVE-2015-5374로 Siemens SIPROTEC 보호 계전기를 응답 불능으로 만듦 (INC-003, ATT&CK S0604)
    - [실제 사고] 핀란드 아파트 난방(2016-11): DDoS로 빌딩 자동화 제어기가 재부팅을 반복해 난방이 멈춤 (INC-033)
    - [실제 사고] 2015 우크라이나(2015-12): 고객 콜센터에 전화 서비스 거부 공격을 걸어 정전 신고 접수를 막음 (INC-002, ATT&CK C0028)
  detect: |-
    ■ 탐지
    - 프로토콜 표준을 벗어난 패킷·비정상 트래픽 급증과 장치 응답 지연·통신 두절을 OT 네트워크 감시로 경보
    - 장치 재부팅·고장 이벤트를 직전 네트워크 활동과 상관 분석
    ■ 대응
    - OT 경계에서 비인가 트래픽을 막고 장치별 허용 통신만 열며, 취약 장치는 펌웨어 갱신이나 보완 통제 적용
    - 감시 목적의 능동 스캔은 장치 영향 시험을 거친 뒤 제한적으로 수행하고, 중요 장치는 워치독·이중화로 구성

T0816:
  summary: |-
    - 공격자는 장치 웹 화면·CLI·프로토콜 명령이나 펌웨어 손상으로 제어 장치와 지원 시스템을 강제로 재시작·정지시켜, 위급 상황의 대응 기능을 멈출 수 있음
    - 재시작 중에는 감시·제어가 끊기고 재부팅 반복에 빠지면 현장 조치 없이는 복구할 수 없으며, 무정전 전원 장치(UPS) 같은 지원 설비도 공격 대상이 됨
  reference: |-
    ■ OT 관점
    - 대상: RTU·IED·PLC·HMI·SCADA 서버와 데이터·전화 서버, UPS 관리 인터페이스 (L0~L3.5)
    - 수법: 표준 재시작·종료 기능 악용, 펌웨어 손상으로 재부팅 반복 유도, 와이퍼 실행 뒤 파괴를 마무리하려는 강제 재부팅
    - 통합: Enterprise 시스템 종료·재부팅(T1529)
    ■ 실제 사례
    - [실제 사고] 2015 우크라이나(2015-12): UPS 관리 인터페이스로 데이터·전화 서버의 전원 차단을 예약 (INC-002, ATT&CK C0028)
    - [실제 사고] 2025 폴란드(2025-12): RTU 펌웨어를 손상시켜 재부팅 반복을 일으키고 피해 장치를 강제 재부팅 (INC-008, ATT&CK C0063)
    - [실제 사고] 노르스크 하이드로(2019-03): LockerGoga가 감염 시스템을 종료 (INC-019, ATT&CK S0372)
  detect: |-
    ■ 탐지
    - 장치 통신 두절·재부팅 이벤트를 OT 네트워크 감시와 장치 진단으로 경보하고 재시작·종료 명령의 발신지 확인
    - UPS·전원 관리 장치의 설정 변경과 예약 작업을 로그로 수집
    ■ 대응
    - 재시작·종료 기능과 UPS 관리 인터페이스를 관리망으로 분리하고 인증된 단말에서만 허용
    - 핵심 제어 기능은 이중화하고, 통신이 끊기면 안전 상태로 전환하는 설계와 수동 운전 절차 마련

T0835:
  summary: |-
    - 공격자는 PLC가 스캔 주기마다 갱신하는 I/O 이미지 테이블을 메모리 조작이나 강제 출력(override) 기능으로 바꿔, 로직이 계산한 것과 다른 값을 현장 장치로 보낼 수 있음
    - 제어 프로그램 자체는 그대로여서 로직 점검으로는 드러나지 않고, 시험용 강제 기능이 운영 중에도 켜질 수 있음
  reference: |-
    ■ OT 관점
    - 대상: PLC·DCS 제어기·PAC·안전 제어기의 입출력 이미지 영역 (L1)
    - 수법: 출력 쓰기를 가로채 이미지에 반영되지 않게 하기(Stuxnet), 메모리 직접 쓰기(PLC-Blaster), 엔지니어링 도구의 강제 입출력 기능
    - 제어기 태스크 변조(OTC-EX-02)·루트킷(OTC-IR-07)과 함께 쓰여 감시 화면 조작(OTC-IM-08)으로 이어짐
    ■ 실제 사례
    - [실제 사고] Stuxnet(2010-06): 주변 장치 출력을 가로채 프로세스 이미지 출력에 쓰이지 않게 함 (INC-009, ATT&CK S0603)
    - [실증] PLC-Blaster(2016-03): POU POKE로 프로세스 이미지의 임의 값을 바꿈 (INC-024, ATT&CK S1006)
  detect: |-
    ■ 탐지
    - PLC 응용 프로그램의 데이터 블록 쓰기와 강제 입출력 설정을 기준본과 비교 — 장치에서 직접 읽거나 자산 관리 플랫폼 활용
    - 현장 실제 출력(독립 계측·리밋 스위치)과 제어기 보고값의 불일치 확인
    ■ 대응
    - 운영 중 강제 입출력 기능을 막고, 쓸 때는 변경 관리와 경보를 거치게 함
    - ATT&CK도 효과적인 완화책이 제한적인 기법으로 분류 — 독립 안전계통·기계식 보호로 결과를 막는 설계에 의존

T0838:
  summary: |-
    - 공격자는 장치·HMI의 경보 한계값과 경보 활성 설정을 바꿔, 위험 상황이나 자신의 활동을 운영자에게 알리는 경보가 울리지 않게 할 수 있음
    - 경보는 운영자가 이상을 인지하는 주된 수단이라 설정이 바뀌면 다른 공격의 피해가 그대로 진행되며, 경보 설정 변경을 기록하지 않는 장치도 많음
  reference: |-
    ■ OT 관점
    - 대상: PLC·RTU·IED·안전 제어기·데이터 게이트웨이의 경보 설정과 SCADA·HMI 경보 구성 (L1~L2)
    - 경보 억제(OTC-IR-08)가 경보 전달을 막는 것이라면, 이 기법은 경보가 아예 발생하지 않도록 설정 자체를 바꿈
    - 경보 관리 기준(한계값·우선순위)을 문서화하지 않은 시설은 변경 여부를 판단하기 어려움
    ■ 실제 사례
    - [실제 사고] 마루치 하수처리(2000-03): 펌프장 네 곳의 경보를 꺼 중앙 컴퓨터로 알림이 가지 않게 함 (INC-001, ATT&CK C0020)
  detect: |-
    ■ 탐지
    - 경보 설정 변경 로그를 수집하고 자산 관리 시스템의 승인된 경보 설정과 주기적으로 대조
    - 공정값이 경보 한계를 넘었는데 경보가 없는 경우를 히스토리언 분석으로 확인
    ■ 대응
    - 경보 설정 변경 권한을 분리하고 변경 관리(승인·기록)를 거치게 함
    - 핵심 경보는 독립 경로(안전계통·하드와이어 경보)로 이중화

T0851:
  summary: |-
    - 공격자는 운영체제·PLC·펌웨어 수준의 루트킷으로 악성 코드·파일·통신을 숨겨, 엔지니어링 도구와 보안 도구가 침해를 보지 못하게 할 수 있음
    - PLC 루트킷은 엔지니어링 소프트웨어가 읽는 로직을 정상으로 보이게 해, 로직을 내려받아 점검하는 절차까지 속임
  reference: |-
    ■ OT 관점
    - 대상: EWS·HMI·SCADA 서버의 Windows, 엔지니어링 통신 라이브러리, PLC·안전 제어기 펌웨어 (L1~L3.5)
    - 수법: 운영체제 API 가로채기, 엔지니어링 통신 DLL 교체로 PLC 읽기·쓰기 요청 걸러내기, 펌웨어 루트킷
    - 대응 기능 억제(OTC-IR-07)·회피(OTC-EV-03) 두 행에 같은 근거로 표시 — 각각 운영자 대응 방해, 탐지 회피 관점
    - 통합: Enterprise 루트킷(T1014)
    ■ 실제 사례
    - [실제 사고] Stuxnet(2010-06): 가짜 s7otbxdx.dll로 PLC의 악성 블록 읽기 요청을 숨기고 Windows 루트킷으로 파일을 감춤 (INC-009, ATT&CK S0603)
  detect: |-
    ■ 탐지
    - 엔지니어링 통신 라이브러리·드라이버의 해시·서명 변화를 무결성 감시로 경보
    - PLC 로직을 다른 경로(독립 엔지니어링 단말·자산 관리 플랫폼)로 읽어 기준본과 비교
    ■ 대응
    - 엔지니어링 단말에 애플리케이션 허용 목록·코드 서명 검증을 적용하고 인터넷·메일 사용을 분리
    - 펌웨어 서명·보안 부팅을 지원하는 장치로 교체 계획 수립

T0878:
  summary: |-
    - 공격자는 경보 메시지가 운영자에게 가지 못하게 막거나 들어오는 경보의 처리를 방해해, 보호 기능이 알리는 위험 상황을 숨길 수 있음
    - 보고 체계 전체가 아니라 경보만 골라 막으면 화면은 정상처럼 유지돼, 운영자는 공정이 안정적이라고 판단하게 됨
  reference: |-
    ■ OT 관점
    - 대상: 경보를 만들고 전달하는 PLC·RTU·IED·데이터 게이트웨이와 SCADA 서버·HMI·히스토리언의 경보 처리 기능 (L1~L3)
    - 수법: 경보 메시지가 지나는 통신 차단·변조, 장치·서버의 경보 처리 기능 정지, 경보 플래그 조작
    - 경보 설정 변조(OTC-IR-06)와 함께 쓰이며 보고 메시지 차단(OTC-IR-11.2)·감시 화면 조작(OTC-IM-08)과 경계가 맞닿음
    ■ 실제 사례
    - [실제 사고] 마루치 하수처리(2000-03): 중앙 컴퓨터로 가는 경보 보고를 억제 (INC-001, ATT&CK C0020)
  detect: |-
    ■ 탐지
    - 경보 이벤트나 공정 데이터 통신이 예상보다 줄거나 끊기는 현상을 OT 네트워크 감시로 경보
    - 공정값의 위험 범위 진입과 경보 기록 유무를 히스토리언에서 대조
    ■ 대응
    - 경보 전달 경로를 이중화하고 대역 외 통보 수단 마련
    - 경보 서버·통신 경로를 정적 구성으로 고정하고 비인가 변경 차단

T0881:
  summary: |-
    - 공격자는 HMI·히스토리언·데이터베이스·백업·보안 프로세스와 ICS 응용 서비스를 강제 종료해, 운영 기능을 멈추거나 암호화·파괴 전에 방해 요소를 없앨 수 있음
    - 랜섬웨어가 ICS 프로세스 이름을 종료 목록에 넣는 경우가 늘어, IT 침해가 곧바로 HMI·히스토리언 중단으로 번짐
  reference: |-
    ■ OT 관점
    - 대상: HMI·EWS·SCADA 서버·히스토리언·애플리케이션 서버의 ICS 서비스(예: GE Proficy·Honeywell HMIWeb 계열), 데이터베이스·백업·보안 서비스 (L2~L3.5)
    - 수법: 하드코딩된 종료 목록(EKANS), 특정 ICS 프로세스를 끝낸 뒤 이름을 바꿔 재시작 막기(Industroyer2), 서비스 레지스트리 키 덮어쓰기(Industroyer)
    - 통합: Enterprise 서비스 중지(T1489)
    ■ 실제 사례
    - [실제 사고] 혼다 공장(2020-06): EKANS가 종료 목록의 ICS 관련 프로세스를 끝낸 뒤 암호화 (INC-020, ATT&CK S0605)
    - [실제 사고] Industroyer2(2022-04): 변전소 운영 소프트웨어 프로세스(PServiceControl.exe 등)를 끝내고 이름을 바꾸도록 설정 (INC-021, ATT&CK S1072)
    - [실제 사고] 2016 우크라이나(2016-12): Industroyer가 서비스를 직접 또는 사용자 계정으로 중지 (INC-003, ATT&CK S0604)
  detect: |-
    ■ 탐지
    - ICS 응용 서비스·데이터베이스·보안 에이전트의 비정상 종료와 서비스 설정 변경을 엔드포인트·Windows 이벤트로 경보
    - 대량 프로세스 종료 명령(taskkill·net stop·종료 스크립트) 실행 탐지
    ■ 대응
    - 서비스 제어 권한을 최소화하고 HMI·히스토리언 단말에 애플리케이션 허용 목록 적용
    - 핵심 ICS 서비스를 이중화하고 자동 재시작·감시를 구성하며, 중단 시 수동 운전 절차 마련

T0892:
  summary: |-
    - 공격자는 장치·소프트웨어의 관리 암호나 접속 키를 바꿔, 운영자와 대응 인력이 장치 설정·복구 작업에 접근하지 못하게 할 수 있음
    - 장치에 따라 공장 초기화나 하드웨어 교체 외에는 접근을 되찾을 수 없어, 공격이 끝난 뒤에도 복구가 오래 걸림
  reference: |-
    ■ OT 관점
    - 대상: 직렬 장치 서버·PLC·HMI·RTU 관리 암호, 빌딩 자동화 장치의 접속 키(KNX BCU 키), Windows 계정 (L1~L3.5)
    - 기본·하드코딩 자격증명(OTC-PE-05.1·OTC-PE-05.2)으로 먼저 접속한 뒤 암호를 바꾸는 흐름이 많음
    - 통합: Enterprise 계정 접근 제거(T1531)
    ■ 실제 사례
    - [실제 사고] 2025 폴란드(2025-12): Moxa NPort 직렬 장치 서버의 로그인 암호를 바꿔 복구를 방해 (INC-008, ATT&CK C0063)
    - [실제 사고] 친러시아 핵티비스트(2024-05): 노출된 HMI의 관리자 암호를 바꿔 운영자를 잠금 (INC-064)
    - [공개 취약점] KNX 연결 인증(CVE-2023-4346): 인증 키 설정을 악용해 빌딩 자동화 장치 소유자를 잠그는 취약점 — KEV 등재
  detect: |-
    ■ 탐지
    - 장치 관리 암호 변경 경보와 관리 프로토콜의 자격증명 변경 기능을 OT 네트워크 감시로 수집
    - 운영자 로그인 실패 급증과 계정 잠금 이벤트를 즉시 확인
    ■ 대응
    - 장치 관리 계정·키를 오프라인 금고에 보관하고 변경 권한을 분리·기록
    - 장치 설정·자격증명 백업, 공장 초기화 뒤 재구성 절차, 예비 장치 마련

T1691.001:
  summary: |-
    - 공격자는 통신 장치를 무력화하거나 통신 포트를 점유해, 운영자·제어 시스템이 보낸 명령이 현장 장치에 닿지 못하게 할 수 있음
    - 명령이 막히면 이상 상황을 바로잡는 조치(차단기 재투입·밸브 차단)를 원격으로 할 수 없어 현장 출동에 의존하게 됨
  reference: |-
    ■ OT 관점
    - 대상: SCADA 서버·HMI에서 RTU·IED·PLC로 가는 명령 경로, 직렬-이더넷 변환기·통신 포트 (L0~L2)
    - 수법: 변환기 펌웨어 파괴(OTC-PE-04.1), 직렬 포트 선점(OTC-IR-13.1), 네트워크 인터페이스 비활성화·트래픽 폐기
    - 보고 메시지 차단(OTC-IR-11.2)과 함께 일어나면 원격 감시·제어가 동시에 끊김
    ■ 실제 사례
    - [실제 사고] 2015 우크라이나(2015-12): 직렬-이더넷 변환기를 악성 펌웨어로 쓸 수 없게 만들어 명령 전달을 막음 (INC-002, ATT&CK C0028)
    - [실제 사고] 2016 우크라이나(2016-12): Industroyer가 설정된 나머지 COM 포트를 열어 다른 프로세스가 쓰지 못하게 함 (INC-003, ATT&CK S0604)
  detect: |-
    ■ 탐지
    - 명령에 대한 응답·상태 보고가 끊기는 현상과 ICS 통신 프로세스 종료를 OT 감시·장치 경보로 확인
    - 통신 장비의 펌웨어·설정 변경과 포트 점유 이상을 점검
    ■ 대응
    - 대체 통신 경로(대역 외 채널)와 수동 조작 절차를 마련해 정기 훈련
    - 통신 장비 설정을 정적으로 고정하고 관리 접근을 허용 목록으로 제한

T1691.002:
  summary: |-
    - 공격자는 계측·상태 보고가 운영자에게 가는 경로를 끊어, 공정 상태를 볼 수 없게 하고 자신의 조작을 숨길 수 있음
    - 보고가 끊기면 보호·대응 기능이 이상을 인지하지 못해 반응하지 않고, 통신 장애로 오인돼 대응이 늦어지기 쉬움
  reference: |-
    ■ OT 관점
    - 대상: RTU·IED·PLC·데이터 게이트웨이에서 SCADA 서버·HMI로 가는 텔레메트리 경로 (L0~L2)
    - 수법: 통신 장비 무력화, 포트 점유, 트래픽 폐기 — 명령 메시지 차단(OTC-IR-11.1)과 같은 수단으로 함께 발생하는 경우가 많음
    - 감시 상실(OTC-IM-06)의 직접 원인이 되며, 보고 위조(OTC-IP-03.2)와 달리 값을 바꾸지 않고 전달을 막음
    ■ 실제 사례
    - [실제 사고] 2015 우크라이나(2015-12): 직렬-이더넷 변환기를 무력화해 현장 보고를 끊음 (INC-002, ATT&CK C0028)
    - [실제 사고] 2016 우크라이나(2016-12): Industroyer의 COM 포트 점유로 다른 프로세스·운영자가 보고를 받지 못하게 될 수 있음 (INC-003, ATT&CK S0604)
  detect: |-
    ■ 탐지
    - 텔레메트리 중단·갱신 지연을 장치·채널별로 감시하고 통신 장비 경보·네트워크 트래픽과 상관 분석
    - 대체 경로로 현장 장치에 직접 질의해 실제 상태 확인
    ■ 대응
    - 보고 경로를 이중화하고 대역 외 통신 수단 확보
    - 통신 장비 정적 구성, 관리 접근 제한, 예비 장비 확보

T1695.001:
  summary: |-
    - 공격자는 직렬 통신 포트를 점유하거나 직렬-이더넷 변환기를 무력화해, 직렬로 연결된 현장 장치와의 명령·보고·설정 통신을 끊을 수 있음
    - 직렬 장치는 변환기 하나에 여러 대가 물려 있는 경우가 많아, 장비 하나를 무력화하면 다수 현장 장치가 한꺼번에 고립됨
  reference: |-
    ■ OT 관점
    - 대상: RS-232/485 직렬 포트, 직렬-이더넷 변환기·직렬 장치 서버(Moxa NPort 등), IEC 60870-5-101·Modbus RTU 장치 (L0~L2)
    - 수법: 응용 프로그램이 포트를 열어 다른 프로세스 접근 차단, 변환기 펌웨어 덮어쓰기, 장치 서버 관리 암호 변경(OTC-IR-10)
    ■ 실제 사례
    - [실제 사고] 2015 우크라이나(2015-12): 직렬-이더넷 변환기 펌웨어를 덮어써 하위 직렬 장치와의 통신이 끊기거나 불가능해짐 (INC-002, ATT&CK C0028)
    - [실제 사고] 2016 우크라이나(2016-12): Industroyer의 IEC 101 페이로드가 설정 파일의 COM 포트를 선점 (INC-003, ATT&CK S0604)
  detect: |-
    ■ 탐지
    - 직렬 장치 응답 중단, 변환기 통신 두절·재부팅을 장치 경보와 OT 감시로 확인
    - 직렬 포트를 여는 비정상 프로세스를 엔드포인트 감시로 탐지
    ■ 대응
    - 변환기·장치 서버 관리 기능을 관리망으로 분리하고 기본 계정 폐기
    - 예비 변환기와 설정 백업, 현장 직결 조작 절차 마련

T1695.002:
  summary: |-
    - 공격자는 네트워크 인터페이스를 끄거나 서비스를 멈추거나 트래픽을 버려, OT 시스템 간 이더넷 통신을 끊을 수 있음
    - 랜섬웨어가 암호화 중 인터페이스를 비활성화하면 감염 단말과 연결된 제어 기능이 고립돼 감시·제어가 함께 멈춤
  reference: |-
    ■ OT 관점
    - 대상: HMI·EWS·SCADA 서버·히스토리언과 제어 장치의 이더넷 인터페이스, 스위치·라우터·방화벽 (L1~L3.5)
    - 수법: 운영체제 명령(netsh)으로 인터페이스 비활성화, 서비스 중지(OTC-IR-09), 중간자 위치에서 트래픽 폐기(OTC-CO-04)
    ■ 실제 사례
    - [실제 사고] 노르스크 하이드로(2019-03): LockerGoga가 netsh로 감염 시스템의 네트워크 인터페이스를 모두 비활성화 (INC-019, ATT&CK S0372)
  detect: |-
    ■ 탐지
    - 인터페이스 비활성화 명령과 링크 다운 이벤트를 엔드포인트·네트워크 장비 로그로 경보
    - 장치별 통신 두절을 OT 네트워크 감시로 확인
    ■ 대응
    - 네트워크 설정 변경 권한을 최소화하고 중요 링크를 이중화
    - 통신이 끊기면 안전 상태로 전환하는 설계와 수동 운전 절차 마련

T1695.003:
  summary: |-
    - 공격자는 무선 인터페이스를 끄거나 트래픽을 버리거나 전파를 방해(재밍)해, 무선으로 연결된 OT 장치의 통신을 끊을 수 있음
    - 무선 구간은 물리적 접근 없이 근거리에서 방해할 수 있고 장애와 공격을 구분하기 어려움
  reference: |-
    ■ OT 관점
    - 대상: 무선 센서·태블릿 HMI·무선 브리지·산업용 Wi-Fi 액세스 포인트로 연결된 장치 (L0~L3)
    - 수법: 운영체제 명령으로 무선 인터페이스 비활성화, 중간자 트래픽 폐기, 재밍 — 무선 통신 침해(OTC-IA-06)와 같은 무선 구간이 대상
    ■ 실제 사례
    - [실제 사고] 노르스크 하이드로(2019-03): LockerGoga가 Wi-Fi를 포함한 모든 네트워크 인터페이스를 비활성화 (INC-019, ATT&CK S0372)
  detect: |-
    ■ 탐지
    - 무선 링크 품질 저하·연결 해제 급증과 무선 인터페이스 비활성화 명령을 감시
    - 무선 침입 탐지(WIDS)로 재밍·비인가 송신 확인
    ■ 대응
    - 안전·핵심 제어는 유선이나 이중 경로로 구성하고, 무선이 끊기면 안전 상태로 전환
    - 무선 인터페이스 설정 변경 권한 최소화
