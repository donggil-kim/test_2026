# [RD] 자원 개발 — OT 관점 문구
# 작성 규칙은 IP.yaml 머리말 참고
# 피해 기관 밖에서 이뤄지는 준비 단계라 직접 탐지·방어가 어려움 — 탐지·대응은 위협 인텔리전스 활용과 다음 단계 행위 탐지 위주로 씀

T1584:
  summary: |-
    - 공격자는 남의 서버·도메인·VPS·네트워크 장비를 탈취해 C2·중계·공격 출발지로 써서, 자신의 인프라를 드러내지 않고 공격할 수 있음
    - 정상 기관·사업자의 인프라라 평판 기반 차단에 잘 걸리지 않고, 추적하면 엉뚱한 피해자에 닿아 귀속이 어려움
  reference: |-
    ■ OT 관점
    - 대상: 공격에 쓰이는 제3자 서버·도메인·VPS와 라우터 등 네트워크 장비 — 피해 기관 밖에서 준비되는 단계라 직접 대상 자산은 없음
    - 수법: 탈취한 인프라와 VPS를 C2로 사용(2025 폴란드) — 라우터·IoT 기기를 대량 탈취한 중계망은 하위 기법 네트워크 장비 탈취(OTC-RD-01.1)
    - 통합: Enterprise 도메인(T1584.001)·VPS(T1584.003) 탈취 — 탈취 인프라는 표준 응용 계층 프로토콜(OTC-C2-01)·연결 프록시(OTC-C2-02)로 이어짐
    ■ 실제 사례
    - [실제 사고] 2025 폴란드(2025-12): 탈취한 인프라와 VPS를 C2 서버로 사용 (INC-008, ATT&CK C0063)
  detect: |-
    ■ 탐지
    - 위협 인텔리전스의 침해 인프라 지표(IP·도메인)를 경계 장비·프록시 로그와 대조
    - OT 관련 호스트의 외부 통신 중 새로 등록되거나 평판이 갑자기 바뀐 목적지를 확인
    ■ 대응
    - OT 망의 외부 통신을 목적지 허용 목록으로 제한해 탈취 인프라로 향하는 통신 자체를 줄임
    - 정보 공유 체계(ISAC·정부 경보)의 지표를 경계 차단 목록에 신속히 반영

T1584.008:
  summary: |-
    - 공격자는 SOHO 라우터·IP 카메라·NAS 같은 제3자 네트워크 장비를 대량 탈취해 중계망으로 묶고, 이를 거쳐 표적 기관에 접근하거나 명령·제어 통신을 할 수 있음
    - 표적 기관에는 국내 가정·소규모 사업장 IP에서 오는 트래픽처럼 보여 지역 기반 차단이 통하지 않고, 장비 주인도 감염을 모르는 경우가 많음
  reference: |-
    ■ OT 관점
    - 대상: 지원이 끝난 SOHO 라우터·IP 카메라·NVR·NAS 등 IoT 기기와 기관의 경계 라우터 (IoT·L3.5)
    - 수법: 탈취한 라우터 봇넷을 중계로 기반시설 기관 IT망에 잠복(Volt Typhoon), 알려진 취약점으로 IoT 기기 약 26만 대를 감염시켜 중계 인프라로 사용(Raptor Train), 탈취한 Cisco 라우터를 통신에 사용(2025 폴란드)
    - IoT 기기가 공격 대상이자 공격 인프라가 되는 이중 역할을 보여주며, 기기 쪽에서는 대역폭 탈취(OTC-IM-14.1)로 나타남 — 클라우드 매트릭스의 공격 인프라 탈취(T1584)와 연계
    ■ 실제 사례
    - [실제 사고] Volt Typhoon(2024-02): 탈취한 SOHO 라우터 봇넷(KV-botnet)을 중계로 삼아 미국 기반시설 기관 IT망에 장기간 잠복 (INC-063)
    - [실제 사고] Raptor Train(2024-09): 라우터·IP 카메라·NVR·NAS 등 약 26만 대를 알려진 취약점으로 감염시켜 공격 중계 인프라로 사용 (INC-065)
    - [실제 사고] 2025 폴란드(2025-12): 탈취한 Cisco 라우터를 네트워크 통신에 사용 (INC-008, ATT&CK C0063)
  detect: |-
    ■ 탐지
    - 정부·보안업체가 공개한 봇넷 중계 노드 지표를 경계 로그와 대조하고, 가정용 ISP 대역에서 오는 관리 접속·VPN 로그인을 주의 깊게 확인
    - 기관이 보유한 라우터·IoT 기기의 비정상 외부 연결과 설정 변경을 감시
    ■ 대응
    - 보유한 SOHO 라우터·IoT 기기 중 지원이 끝난 제품을 교체하고 펌웨어를 최신으로 유지하며 원격 관리 기능을 끔
    - 원격 접속에 다중 인증과 기기 인증을 적용해 중계 IP를 통한 계정 악용을 막음

T1587.001:
  summary: |-
    - 공격자는 표적 OT 환경의 제어기·프로토콜에 맞춘 악성코드를 직접 개발해, 일반 보안 제품이 모르는 맞춤형 페이로드로 물리 공정을 노릴 수 있음
    - OT 전용 악성코드는 특정 벤더 장비·펌웨어를 확보해 시험해야 해 개발 비용이 크지만, 한 번 만들어지면 같은 장비를 쓰는 다른 시설에도 재사용될 수 있음
  reference: |-
    ■ OT 관점
    - 대상: 피해 기관 밖 개발 단계 — 결과물은 안전 제어기·PLC·RTU용 페이로드(Triton·Industroyer·INCONTROLLER 등)와 OT 망용 와이퍼
    - 특징: 특정 하드웨어·소프트웨어를 갖춰야 개발할 수 있는 수준(Triton), 탐지되면 같은 날 페이로드를 고쳐 재시도하는 빠른 개발 주기(2025 폴란드)
    - 공개 프로토콜 라이브러리·시뮬레이터로 개발 장벽이 낮아지는 추세이며, AI 보조 개발은 AI 보안위협 매트릭스 UT-03과 연계
    ■ 실제 사례
    - [실제 사고] Triton(2017-08): 공격 전에 특수 하드웨어·소프트웨어 접근이 필요한 안전 제어기 공격 역량을 개발 (INC-004, ATT&CK C0030)
    - [실제 사고] 2025 폴란드(2025-12): 악성코드가 피해 기관 EDR에 처음 탐지되자 같은 날 페이로드를 고쳐 새 버전 실행을 시도 (INC-008, ATT&CK C0063)
  detect: |-
    ■ 탐지
    - 사전 단계라 직접 탐지는 어렵고, OT 특화 위협 인텔리전스(신규 ICS 악성코드·도구 보고서)를 받아 탐지 규칙에 반영
    - 탐지 직후 같은 날 변종 실행이 반복되는 재시도 패턴을 EDR·보안관제에서 상관 분석
    ■ 대응
    - 신규 OT 악성코드의 지표·행위를 추적하고, 프로토콜 이상·프로그램 변경 같은 행위 기반 탐지를 서명 기반 탐지와 함께 운영
    - 침해 대응 때 공격자의 재시도를 가정해 차단 범위를 넓히고 감시를 유지

T1588.002:
  summary: |-
    - 공격자는 Mimikatz·PsExec·원격 관리 도구·공개 산업 프로토콜 라이브러리 같은 기존 도구를 내려받거나 사서, 직접 개발 없이 공격에 쓸 수 있음
    - 정상 관리·시험 도구와 겹치는 경우가 많아 존재만으로 악성 여부를 판단하기 어렵고, 공개 도구를 쓰면 개발 비용과 귀속 단서가 줄어듦
  reference: |-
    ■ OT 관점
    - 대상: 피해 기관 밖 준비 단계 — 확보한 도구는 EWS·HMI·SCADA 서버에서 자격증명 탈취·횡적 이동·산업 프로토콜 조작에 쓰임
    - 사례: Mimikatz와 공개 소프트웨어 사용(Triton 공격 그룹), 공개 Modbus 저장소를 바탕으로 만든 FrostyGoop, 상용 스캐너 사용(2025 폴란드, OTC-DS-03.1)
    - 공개 OT 공격 프레임워크·익스플로잇 모듈은 숙련도가 낮은 공격자의 진입 장벽을 낮춤 — 확보한 도구의 실행은 OTC-LM-07·OTC-EX-01 등에서 다룸
    ■ 실제 사례
    - [실제 사고] Triton(2017-08): 공격 그룹이 Mimikatz 등 공개 소프트웨어 도구를 확보해 사용 (INC-004, ATT&CK C0030)
  detect: |-
    ■ 탐지
    - 사전 단계라 직접 탐지는 어렵고, 확보한 도구가 쓰이는 시점(Mimikatz·PsExec·스캐너 실행)을 EDR·명령줄 감사로 탐지
    - OT 호스트에 새로 나타난 관리·해킹 도구 파일을 해시·이름 기준으로 확인
    ■ 대응
    - OT 호스트에 애플리케이션 허용 목록을 적용해 반입된 도구의 실행을 막음
    - 승인된 관리 도구 목록을 운영하고 그 밖의 원격 관리 도구 사용을 금지

T1588.007:
  summary: |-
    - 공격자는 대형 언어 모델 같은 생성형 AI로 정찰 정보 정리·사회공학 문구·스크립트·페이로드를 만들어, 적은 인력과 숙련도로 공격 준비를 빠르게 할 수 있음
    - AI가 만든 산출물은 공격마다 달라 서명 기반 탐지가 어렵고, OT 프로토콜·제품 문서를 요약해 공격자의 OT 지식 부족을 메워 줌
  reference: |-
    ■ OT 관점
    - 대상: 피해 기관 밖 준비 단계 — 산출물은 OT 호스트·장비에서 실행되는 맞춤 스크립트, 피싱 문구, 장비 설정·프로토콜 분석 결과
    - 사례: LLM으로 맞춤 스크립트를 만들어 공격에 사용(2025 폴란드)
    - AI 보안위협 매트릭스의 공격 도구 확보(UT-02.1)·AI 기반 자율 공격(UT-03)과 연계 — 이 매트릭스는 OT 공격 준비에 AI를 쓰는 측면만 다룸
    ■ 실제 사례
    - [실제 사고] 2025 폴란드(2025-12): LLM으로 생성한 맞춤 스크립트를 공격에 사용 (INC-008, ATT&CK C0063)
  detect: |-
    ■ 탐지
    - 사전 단계라 직접 탐지는 어렵고, AI가 만든 스크립트도 실행 단계 행위(명령 실행·설정 변경)로 드러나므로 행위 기반 탐지를 강화
    - AI 서비스 사업자·정부의 악용 보고서를 위협 인텔리전스로 받아 수법 변화를 반영
    ■ 대응
    - 서명된 스크립트만 허용하고 스크립트 엔진을 제한해 AI 생성 스크립트의 실행 기회를 줄임
    - OT 제품·프로토콜 정보의 불필요한 공개를 줄이고, 피싱 대응 훈련에 AI 생성 문구 사례를 반영
