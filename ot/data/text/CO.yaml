# [CO] 수집 — OT 관점 문구
# 작성 규칙은 IP.yaml 머리말 참고
# 입력 캡처(T1056)는 LM.yaml, 무선 스니핑(T0887)은 DS.yaml 문구를 같이 씀
# 수집 기법은 그 자체로 피해를 내지 않아 심각도 기본값이 '하'지만, 정밀 공격(IP·IM 전술)의 준비 단계라 OT 관점 문구에 연계 기법을 명시함

T0801:
  summary: |-
    - 공격자는 OPC 태그·히스토리언·PLC 블록·산업 프로토콜 읽기로 공정의 현재 상태(밸브·차단기 상태, 압력·온도 값)를 감시해, 공정을 이해하거나 공격 시점을 정하는 조건으로 쓸 수 있음
    - 읽기 요청은 SCADA·HMI가 늘 보내는 정상 트래픽과 같아 구분이 어렵고, 공정에 직접 영향을 주지 않아 정찰 단계에서 드러나지 않음
  reference: |-
    ■ OT 관점
    - 대상: PLC·RTU·IED의 I/O 상태, OPC 서버 태그, 히스토리언 데이터, 필드버스 트래픽 (L1~L3)
    - 수법: IEC 104 일반 질의로 IOA 상태 감시(Industroyer2), OPC·IEC 61850 상태값(stVal) 읽기(Industroyer), Modbus 홀딩 레지스터 읽기(FrostyGoop), Profibus 수신 기록으로 운전 상태 판단(Stuxnet)
    - 상태값이 공격 개시 조건으로 쓰이고(Stuxnet은 특정 운전 상태에서만 공격), 인터넷에 노출된 SCADA에 반복 접속해 상태만 조회한 사례도 있음 — 노출 경로는 OTC-IA-11
    ■ 실제 사례
    - [실제 사고] Stuxnet(2010-06): Profibus 수신 감시 기록의 필드를 살펴 목표 설비가 특정 운전 상태인지 판단 (INC-009, ATT&CK S0603)
    - [실제 사고] Industroyer2(2022-04): IEC 104 일반 질의 명령으로 장치 IOA와 I/O 상태를 감시하도록 구성 (INC-021, ATT&CK S1072)
    - [실제 사고] 보먼 애비뉴 댐(2013-08): 셀룰러 모뎀으로 소형 홍수 조절 댐 SCADA에 접속해 수위·온도·수문 상태를 반복 조회 (INC-028)
  detect: |-
    ■ 탐지
    - 산업 프로토콜 읽기 기능 코드(Modbus·DNP3 읽기, IEC 104 일반 질의)를 보내는 발신지를 기준선과 비교해 새 발신지·대량 조회를 경보
    - 히스토리언·OPC 서버의 대량 조회와 새 클라이언트 연결을 확인
    ■ 대응
    - 공정 데이터 읽기를 지정 SCADA·HMI·히스토리언으로 제한하고, 외부에는 단방향 복제·DMZ 히스토리언으로만 제공
    - SCADA·HMI의 인터넷 노출을 없애고 원격 조회는 인증된 원격 접속으로만 허용

T0802:
  summary: |-
    - 공격자는 OPC·IEC 104 같은 산업 프로토콜과 스크립트로 제어 환경 정보를 자동 수집해, 많은 장치·태그의 정보를 짧은 시간에 모을 수 있음
    - 정상 감시 도구와 같은 프로토콜·함수를 써서 수집 트래픽이 섞이고, 한 번 실행으로 공정 전체 구조가 공격자에게 넘어감
  reference: |-
    ■ OT 관점
    - 대상: OPC 서버, SCADA 서버, RTU·IED 같은 원격 장치와 히스토리언 (L1~L3)
    - 수법: OPC로 연결 장치 정보를 모아 C2로 전송(Havex), 원격 장치 IP 목록을 돌며 IEC 104 우선순위별 정보 수집(Industroyer2), 프로토콜 객체 데이터 자동 수집(Industroyer)
    - 수집 결과는 포인트·태그 식별(OTC-CO-07)과 공격 대상 목록 구성에 바로 쓰이며, 외부 전송은 운영 정보 탈취(OTC-IM-12)
    ■ 실제 사례
    - [실제 사고] Dragonfly(2014-06): Havex의 OPC 구성요소가 연결된 장치의 세부 정보를 모아 C2로 보냄 (INC-013, ATT&CK S0093)
    - [실제 사고] Industroyer2(2022-04): 하드코딩된 원격 장치 IP 목록을 돌며 IEC 104 우선순위별로 정보를 수집하도록 구성 (INC-021, ATT&CK S1072)
    - [실제 사고] 2016 우크라이나(2016-12): Industroyer가 프로토콜 객체 데이터를 자동 수집해 제어 장치를 파악 (INC-003, ATT&CK S0604)
  detect: |-
    ■ 탐지
    - 한 호스트가 여러 장치·태그를 순차·대량으로 조회하는 패턴을 OT 네트워크 감시로 경보
    - OPC 서버의 새 클라이언트·대량 열거와 SCADA 서버가 아닌 곳에서 시작된 IEC 104 세션을 확인
    ■ 대응
    - 산업 프로토콜 접근을 허용 목록으로 제한하고 망을 분할해 수집 가능한 범위를 줄임
    - OPC 서버에 인증·권한 설정(OPC UA 보안 모드)을 적용하고 쓰지 않는 OPC Classic DCOM 접근을 막음

T0811:
  summary: |-
    - 공격자는 문서 관리 시스템·공유 폴더·클라우드 협업 도구·자산 관리 DB에 저장된 설계서·도면·시스템 구성 자료를 모아, 제어 시스템 구조를 파악할 수 있음
    - 정상 계정으로 열람하면 업무 열람과 구분이 어렵고, OT 설계 자료가 IT·클라우드 저장소에 있으면 OT를 건드리지 않고도 핵심 정보가 넘어감
  reference: |-
    ■ OT 관점
    - 대상: 엔지니어링 문서 저장소, 공유 폴더, SharePoint·Teams 같은 클라우드 협업 도구, 자산·정비 관리 DB, 히스토리언 (L3~L4·클라우드)
    - 수법: 정보 수집 모듈로 Windows 공유의 자료에 접근(Duqu), 탈취한 자격증명으로 클라우드 서비스에서 대상 자료 내려받기(2025 폴란드)
    - 통합: Enterprise 클라우드 저장소 데이터(T1530) — 외부 반출은 운영 정보 탈취(OTC-IM-12)
    ■ 실제 사례
    - [실제 사고] 2025 폴란드(2025-12): 탈취한 자격증명으로 클라우드 서비스에 접속해 SharePoint·Teams에서 대상 자료를 내려받음 (INC-008, ATT&CK C0063)
    - [실제 사고] Duqu(2011-10): 추가 정보 수집 모듈로 Windows 공유의 자료에 접근해 산업 정보를 모음 (INC-010, ATT&CK S0038)
  detect: |-
    ■ 탐지
    - 문서 저장소·SharePoint 감사 로그로 짧은 시간의 대량 열람·내려받기와 평소 접근하지 않던 계정의 설계 자료 접근을 경보
    - 클라우드 서비스의 비정상 위치·기기 로그인과 대량 동기화를 확인
    ■ 대응
    - OT 설계·구성 자료를 분류해 접근 권한을 최소화하고 민감 자료는 암호화
    - 클라우드 협업 도구에 조건부 접근·다중 인증을 적용하고 OT 자료의 외부 공유를 제한

T0830:
  summary: |-
    - 공격자는 통신 경로 중간에 끼어들어(ARP 스푸핑·라우터 장악·트래픽 리디렉션), 제어 명령·계측 값·자격증명을 엿보거나 막고 바꾸고 주입할 수 있음
    - 양쪽 장치는 정상 상대와 통신한다고 믿어 이상을 알아채기 어렵고, 인증·무결성 보호가 없는 산업 프로토콜은 내용 변조에 그대로 노출됨
  reference: |-
    ■ OT 관점
    - 대상: SCADA 서버와 RTU·PLC 사이 통신, EWS와 제어기 사이 엔지니어링 세션, OT 경계 라우터·VPN 장비를 지나는 트래픽 (L1~L3.5)
    - 수법: 라우터 iptables로 웹 트래픽을 가로채 내용 수집·변조(VPNFilter ssler), 연락처 전화번호를 바꿔 인증 관련 트래픽을 공격자 사이트로 돌림(Triton), 제어망 ARP 스푸핑
    - 중간자 위치에서 보고 메시지 위조(OTC-IP-03.2)·명령 메시지 차단(OTC-IR-11.1)·감시 화면 조작(OTC-IM-08)으로 이어짐 — 전제는 네트워크 스니핑(OTC-DS-02)
    ■ 실제 사례
    - [실제 사고] VPNFilter(2018-05): 감염 라우터의 ssler 모듈이 80번 포트로 나가는 웹 요청을 가로채 내용을 수집·변조 (INC-018, ATT&CK S1010)
    - [실제 사고] Triton(2017-08): 연락처 목록의 특정 계정 전화번호를 바꿔 관련 트래픽을 공격자가 통제하는 웹사이트로 돌림 (INC-004, ATT&CK C0030)
  detect: |-
    ■ 탐지
    - ARP 테이블 변화·중복 MAC, 예상치 못한 경로 변경, 통신 지연 증가를 OT 네트워크 감시로 경보
    - 경계 라우터·VPN 장비의 설정(iptables·라우팅) 무결성을 정기 점검
    ■ 대응
    - 지원되는 구간부터 메시지 인증·암호화(IEC 62351·DNP3-SA·CIP Security·TLS)를 적용하고, 정적 ARP·포트 보안 적용
    - 경계 장비 펌웨어를 최신으로 유지하고 관리 접속을 제한하며, 중요 명령은 별도 경로(대역 외)로 확인

T0845:
  summary: |-
    - 공격자는 엔지니어링 기능으로 제어기의 프로그램을 올려받아, 제어 로직과 공정 구조를 분석하고 정밀한 변조 코드를 만드는 데 쓸 수 있음
    - 정상 엔지니어링 작업과 같은 기능이고 제어기 동작에 영향을 주지 않아, 업로드 자체는 경보 없이 지나가는 경우가 많음
  reference: |-
    ■ OT 관점
    - 대상: PLC·PAC·DCS 제어기와 안전 제어기(SIS)의 사용자 프로그램·백업 (L1)
    - 수법: 프로그램 추가 과정의 일부로 업로드 수행(Triton), CODESYS 프로토콜 업로드와 Omron HTTP 서버의 업로드·백업 기능(INCONTROLLER)
    - 역방향 위협: 공격자가 장악한 PLC를 엔지니어가 업로드하면 조작된 프로젝트 데이터가 EWS 취약점을 악용할 수 있음 — 사용자 실행 유도(OTC-EX-07) 참고
    ■ 실제 사례
    - [실제 사고] Triton(2017-08): SafeAppendProgramMod 호출로 페이로드를 보내는 과정에서 Tricon 프로그램 업로드를 수행 (INC-004, ATT&CK S1009)
    - [위협인텔] PIPEDREAM(2022-04): INCONTROLLER가 CODESYS 프로토콜로 Schneider PLC 프로그램을, HTTP 서버 기능으로 Omron PLC 로직을 올려받는 기능을 갖춤 (INC-022, ATT&CK S1045)
    - [실증] Evil PLC(2022-08): 조작한 PLC에서 엔지니어가 로직을 업로드하면 워크스테이션이 장악되는 공격을 7개 벤더 제품에서 시연 (INC-081)
  detect: |-
    ■ 탐지
    - 프로그램 업로드 기능 코드를 OT 네트워크 감시로 탐지하고, 지정 EWS·작업 일정 밖이면 경보
    - 제어기 웹·파일 전송 서비스를 통한 백업 내려받기를 확인
    ■ 대응
    - 업로드에도 읽기 보호 암호·인증을 적용하고 엔지니어링 접근을 지정 EWS로 제한
    - 엔지니어링 소프트웨어를 최신으로 유지해 업로드 데이터 처리 취약점을 막고, 출처가 의심스러운 제어기 업로드는 격리 환경에서 수행

T0852:
  summary: |-
    - 공격자는 HMI·EWS 화면을 캡처해, 공정 배치·설비 구성·경보·운전 값을 화면 그대로 수집할 수 있음
    - 화면 한 장에 공정 도면과 운전 맥락이 담겨 프로토콜 분석 없이도 공정을 이해할 수 있고, 캡처는 흔한 OS 기능이라 탐지가 어려움
  reference: |-
    ■ OT 관점
    - 대상: SCADA·DCS 운영자 HMI, EWS, 점프 호스트 화면 (L2~L3)
    - 수법: nircmd 같은 유틸리티로 화면 저장(2025 폴란드), 특정 프로그램이 열릴 때 주기적으로 캡처해 C2로 전송(Flame), HMI 화면 수집·유통(ALLANITE·Dragonfly 2.0)
    - 수집한 화면은 공정 이해와 공격 계획에 쓰이고 외부 반출은 운영 정보 탈취(OTC-IM-12) — 통합: Enterprise 화면 캡처(T1113)
    ■ 실제 사례
    - [실제 사고] Dragonfly 2.0(2018-03): 에너지 기업 망에 들어가 제어 시스템 접근 정보와 HMI 화면을 수집 (INC-036)
    - [실제 사고] 2025 폴란드(2025-12): nircmd로 시스템 화면을 캡처해 임시 폴더에 저장 (INC-008, ATT&CK C0063)
    - [실제 사고] Flame(2012-05): 특정 프로그램이 열려 있을 때 주기적으로 화면을 캡처해 C2로 보냄 (INC-011, ATT&CK S0143)
  detect: |-
    ■ 탐지
    - HMI·EWS에서 화면 캡처 유틸리티 실행과 임시 폴더의 이미지 파일 생성을 감시
    - HMI에서 외부로 나가는 이미지·압축 파일 전송을 OT 네트워크 감시로 확인
    ■ 대응
    - HMI·EWS에서 허용되지 않은 유틸리티 실행을 허용 목록으로 막고 인터넷 접근을 차단
    - 원격 화면 세션을 녹화·감독하고 화면 공유 도구는 승인된 경로로만 사용

T0861:
  summary: |-
    - 공격자는 OPC 서버·SCADA·제어기에서 포인트(I/O·메모리 주소)와 태그 이름을 수집해, 각 값이 어떤 설비·기능을 뜻하는지 파악할 수 있음
    - 태그 이름은 운영자가 알아보기 쉽게 붙여 공정 의미가 그대로 드러나고, 정상 엔지니어링·감시 도구의 조회와 같아 구분이 어려움
  reference: |-
    ■ OT 관점
    - 대상: OPC DA·UA 서버의 태그 공간, SCADA·HMI의 태그 DB, PLC·RTU의 포인트 목록, 히스토리언 (L1~L3)
    - 수법: OPC 태그 열거(Havex), OPC UA 주소 공간 구조 원격 읽기(INCONTROLLER)
    - 확보한 포인트는 I/O 무차별 조작(OTC-IP-01)·운전 파라미터 변조(OTC-IP-02)·비인가 명령 메시지(OTC-IP-03.1)의 대상 주소가 됨
    ■ 실제 사례
    - [실제 사고] Dragonfly(2014-06): Havex가 OPC 서버 정보와 함께 OPC 태그를 열거해 제어 장치의 이름과 기능을 파악 (INC-013, ATT&CK S0093)
    - [위협인텔] PIPEDREAM(2022-04): INCONTROLLER가 장치의 OPC UA 구조를 원격으로 읽는 기능을 갖춤 (INC-022, ATT&CK S1045)
  detect: |-
    ■ 탐지
    - OPC 서버의 태그 전체 탐색(Browse)과 새 클라이언트의 대량 조회를 OT 네트워크 감시·OPC 감사 로그로 경보
    - 평소와 다른 시간대·빈도의 태그 조회를 기준선과 비교
    ■ 대응
    - OPC UA 보안 모드(인증·서명·암호화)와 사용자별 접근 권한을 적용하고 익명 접근을 끔
    - 태그를 조회할 수 있는 클라이언트를 허용 목록으로 제한하고 망을 분할

T0868:
  summary: |-
    - 공격자는 제어기의 현재 운전 모드(RUN·PROGRAM·REMOTE)와 키 스위치 상태를 조회해, 프로그램 변경이 가능한지와 공격 시점을 판단할 수 있음
    - 상태 조회는 엔지니어링·감시 도구가 늘 쓰는 기능이라 단독으로는 이상으로 보기 어렵지만, 프로그램 다운로드의 전조가 됨
  reference: |-
    ■ OT 관점
    - 대상: PLC·PAC·DCS 제어기와 안전 제어기(SIS)의 운전 모드·키 스위치·프로그램 상태 (L1)
    - 수법: 공격 도구에 프로그램 상태·키 상태 정의를 넣어 TriStation으로 조회(Triton)
    - 결과에 따라 운전 모드 변경(OTC-EX-06)·제어 프로그램 다운로드(OTC-LM-01.0)로 이어지므로, 상태 조회 뒤 변경 시도가 따르는지 함께 봐야 함
    ■ 실제 사례
    - [실제 사고] Triton(2017-08): 공격 도구가 Tricon의 프로그램 상태·키 스위치 상태 정의를 갖추고 조회에 사용 (INC-004, ATT&CK S1009)
  detect: |-
    ■ 탐지
    - 운전 모드·키 상태를 읽는 기능 코드를 OT 네트워크 감시로 탐지하고 지정 EWS 밖에서 오면 경보
    - 상태 조회 직후 모드 변경·다운로드 시도가 이어지는 순서를 상관 분석
    ■ 대응
    - 엔지니어링 프로토콜 접근을 지정 EWS로 제한하고 제어기 접근 인증을 켬
    - 키 스위치를 RUN 잠금에 두어 상태가 드러나도 원격으로 바꿀 수 없게 함

T0877:
  summary: |-
    - 공격자는 PLC가 매 스캔 주기에 입력·출력 값을 담아 두는 I/O 이미지 테이블을 읽어, 현장 센서·구동기의 실제 값을 수집할 수 있음
    - 수집한 값을 나중에 재생하면 운영자 화면을 정상처럼 보이게 할 수 있고, PLC 내부 동작이라 네트워크 감시로는 보이지 않음
  reference: |-
    ■ OT 관점
    - 대상: PLC·PAC·DCS 제어기와 안전 제어기(SIS)의 입력·출력 이미지 테이블 (L1)
    - 수법: 입력 영역을 1초 간격으로 데이터 블록에 복사해 21초 분량을 기록(Stuxnet) — 이 기록을 공격 중 재생해 감시 화면 조작(OTC-IM-08)에 사용
    - 제어기 프로그램에 수집 코드가 있어야 하므로 제어 프로그램 변조(OTC-PE-03)가 전제이고, I/O 이미지를 바꾸는 행위는 I/O 이미지 조작(OTC-IR-05)
    ■ 실제 사례
    - [실제 사고] Stuxnet(2010-06): 주변 장치에서 들어오는 입력 영역을 1초 간격으로 복사해 21초 분량을 기록하고, 공격 중 이 값을 재생해 정상 상태처럼 보이게 함 (INC-009, ATT&CK S0603)
  detect: |-
    ■ 탐지
    - 네트워크로는 보이지 않으므로 제어기 프로그램을 올려받아 데이터 블록 읽기·복사 코드를 기준본과 비교
    - 공정 이력 값이 일정 주기로 똑같이 반복되면 재생 가능성을 의심하고 현장 계측과 대조
    ■ 대응
    - 제어기 프로그램 변경 통제(접근 보호·변경 관리)로 수집 코드가 들어가지 못하게 함
    - 중요 공정 값은 제어기와 독립된 계측·안전계통으로 이중 확인

T0893:
  summary: |-
    - 공격자는 침해한 EWS·HMI·서버의 파일 시스템·설정 파일·로컬 DB에서 설계 도면·프로젝트 파일·설정 정보를 찾아 모을 수 있음
    - 엔지니어링 단말에는 도면·프로젝트·장치 설정이 한곳에 모여 있어, 단말 하나만 침해해도 공정 설계 정보가 대부분 넘어감
  reference: |-
    ■ OT 관점
    - 대상: EWS의 PLC 프로젝트·CAD 도면·장치 설정 백업, HMI·SCADA 서버의 구성 파일과 로컬 DB, 경계 장비 설정 (L2~L3.5)
    - 수법: AutoCAD 도면(.dwg) 수집·전송(ACAD/Medre.A), 정보 수집 모듈로 자료를 모아 압축·암호화 후 임시 영역에 보관(Duqu·Flame), 탐색 결과를 로컬 파일에 정리(2025 폴란드)
    - 통합: Enterprise 로컬 데이터 스테이징(T1074.001) — 외부 반출은 운영 정보 탈취(OTC-IM-12)
    ■ 실제 사례
    - [실제 사고] ACAD/Medre.A(2012-06): AutoCAD 스크립트로 퍼지며 감염 PC의 도면(.dwg)을 모아 외부 메일 계정으로 보냄 (INC-012, ATT&CK S1000)
    - [실제 사고] Duqu(2011-10): 정보 수집 모듈로 로컬 자료를 모아 압축·XOR 암호화한 뒤 임시 영역에 보관 (INC-010, ATT&CK S0038)
    - [실제 사고] 2025 폴란드(2025-12): 탐색 결과를 피해 호스트 임시 폴더의 파일(outlog.txt)에 모음 (INC-008, ATT&CK C0063)
  detect: |-
    ■ 탐지
    - 도면·프로젝트 파일 대량 열람·복사와 임시 폴더의 압축·암호화 파일 생성을 감시
    - 엔지니어링 단말에서 평소 없던 외부 전송·대용량 업로드를 확인
    ■ 대응
    - 설계·프로젝트 파일을 접근 통제된 저장소에 두고 단말 로컬 보관을 줄이며 민감 자료는 암호화
    - OT 단말의 인터넷 접근을 막고 데이터 유출 방지(DLP)로 설계 자료 반출을 감시

T1602.002:
  summary: |-
    - 공격자는 라우터·방화벽·VPN 장비의 설정 파일을 덤프해, 망 구성·접근 규칙과 설정에 저장된 자격증명을 수집할 수 있음
    - 설정 파일에는 내부망 구조와 OT로 들어가는 경로가 그대로 담겨 있고, 원격 접속용 북마크·서비스 계정 암호가 함께 저장되는 경우가 많음
  reference: |-
    ■ OT 관점
    - 대상: IT/OT 경계 방화벽, 원격 접속 VPN, 산업용 라우터·스위치의 설정 파일과 백업 (L3.5)
    - 수법: FortiGate 설정의 북마크에 정적으로 저장된 자격증명을 얻어 점프 호스트 RDP 접속에 사용(2025 폴란드)
    - 얻은 자격증명은 유효 계정 악용(OTC-PE-01)·원격 서비스 악용(OTC-IA-12)으로, 망 구성 정보는 경계 장비 보안 설정 변조(OTC-EV-10.1)로 이어짐
    ■ 실제 사례
    - [실제 사고] 2025 폴란드(2025-12): FortiGate 설정 파일의 북마크에 정적으로 저장된 자격증명을 얻어 점프 호스트 RDP 접속에 사용 (INC-008, ATT&CK C0063)
  detect: |-
    ■ 탐지
    - 경계 장비의 설정 내보내기·백업 명령 실행과 관리 인터페이스의 대용량 내려받기를 로그로 경보
    - SNMP·TFTP 같은 설정 전송 프로토콜의 비정상 사용을 확인
    ■ 대응
    - 장비 설정에 자격증명을 평문으로 두지 않고(북마크 자격증명 저장 금지), 설정 백업은 암호화해 접근 통제된 곳에 보관
    - 관리 인터페이스를 관리망으로 제한하고 장비 펌웨어를 최신으로 유지
