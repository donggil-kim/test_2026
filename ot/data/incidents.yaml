    Hon Hai(Foxconn)는 2026-05-12 북미 일부 공장이 사이버 공격을 받았음을 확인했고, 영향받은 공장이 정상 생산을 재개하고 있다고 발표했다.
    위스콘신 공장의 대규모 IT 장애로 여러 생산 라인이 일시 중단됐다는 보도가 앞서 나왔고, 회사는 처음에는 '기술적 문제'라고 설명했다.
    Nitrogen 랜섬웨어 조직은 8TB·1,100만 건 이상의 내부 문서를 탈취했다고 주장하며 샘플을 올렸으나, 회사는 피해 범위를 밝히지 않았다.
