    USB와 다수의 제로데이로 폐쇄망에 들어가 Siemens Step 7 프로젝트를 감염시키고 S7 PLC 로직을 바꿔 원심분리기 회전 속도를 조작했다.
    그동안 운영자 화면에는 정상값을 재생해 이상을 숨겼다.
