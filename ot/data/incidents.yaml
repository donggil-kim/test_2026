# OT/ICS/IoT 보안사고 DB v1 — 공개 출처 기반(2000~2025)
#
# 필드
#   date          발생(또는 공개) 시점 YYYY-MM
#   kind          사고 · 캠페인 · 사례연구(익명) · 정부 경보 · 공시 · 연구·시연 · 위협인텔(능력 발견)
#   verification  정부·사법 확인 · 피해기관 확인 · 보안업체·연구기관 분석 · 언론 보도 · 행위자 주장 · 논란·원인 번복
#   relevance     OT 관련도: OT 직접 · IT 경유 OT 영향 · OT 접근·노출 · OT 정보 탈취 · IoT 기기 · 판정 보류 · IT 한정
#   impact        물리적 영향 유형: 인명·안전 · 환경 · 설비 손상 · 제어 상실·조작 · 감시 상실·조작 · 운영 중단 · 운영 정보 탈취 · 기기 탈취 · 영향 없음
#   attack_ref    ATT&CK 캠페인·소프트웨어 ID — 해당 객체의 ICS·Enterprise 공식 절차를 그대로 매핑(근거 'ATT&CK 공식').
#                 캠페인 절차로 충분하면 소프트웨어는 붙이지 않음. 'S0608@ICS'처럼 쓰면 ICS 절차만(일반 기능인 Enterprise 절차 제외)
#   ics / ent     분석 매핑(근거 '분석') — ICS 기법(EMB3D 신설 행 키 'EMB3D-…' 포함) / Enterprise 기법
#   sources       '출처 | URL' (URL은 확인된 것만)
#
# 집계 규칙(scripts/taxonomy_rules.py): 실제 사고 = kind ∈ {사고·캠페인·사례연구(익명)·정부 경보·공시}
#   이면서 verification ∉ {행위자 주장·논란·원인 번복}, relevance ≠ IT 한정.
#   연구·시연은 실증 근거, 위협인텔(능력 발견)은 실사용 근거(중 상한)로만 반영.

# ── ATT&CK for ICS 캠페인 ───────────────────────────────────────────
- id: INC-001
  title: 마루치 하수처리 시스템 침해
  date: 2000-03
  kind: 사고
  verification: 정부·사법 확인
  relevance: OT 직접
  country: 호주
  sector: 수처리
  actor: 전 협력업체 직원(내부자)
  impact: [환경, 제어 상실·조작]
  summary: >-
    하수처리 시스템을 구축한 업체의 전 직원이 빼돌린 무선 장비와 제어 소프트웨어로 펌프장에 위조 명령을 보내
    경보를 끄고 펌프를 조작해, 약 80만 리터의 미처리 하수를 지역 하천과 공원으로 방류시켰다.
  attack_ref: [C0020]
  sources:
    - MITRE ATT&CK C0020 | https://attack.mitre.org/campaigns/C0020/
    - MITRE(Abrams·Weiss, 2008) Malicious Control System Cyber Security Attack Case Study | https://www.mitre.org/sites/default/files/pdf/08_1145.pdf

- id: INC-002
  title: 2015 우크라이나 배전망 공격
  date: 2015-12
  kind: 사고
  verification: 정부·사법 확인
  relevance: OT 직접
  country: 우크라이나
  sector: 전력
  actor: Sandworm Team(G0034)
  impact: [운영 중단, 제어 상실·조작, 감시 상실·조작]
  summary: >-
    스피어피싱으로 BlackEnergy3에 감염시킨 뒤 탈취한 자격증명과 VPN으로 제어망에 들어가, 운영자 HMI를 원격 조작해
    배전사 3곳의 변전소 차단기를 열었다(약 22만 5천 고객이 수 시간 정전). 직렬-이더넷 변환기 펌웨어를 덮어써
    원격 복구를 막고 KillDisk로 시스템을 지웠다.
  attack_ref: [C0028]
  ics: [T0809]   # KillDisk로 시스템 삭제(C0028 공식 절차에 미포함 — 분석 매핑)
  sources:
    - MITRE ATT&CK C0028 | https://attack.mitre.org/campaigns/C0028/
    - Booz Allen Hamilton(2016) When The Lights Went Out | https://www.boozallen.com/content/dam/boozallen/documents/2016/09/ukraine-report-when-the-lights-went-out.pdf

