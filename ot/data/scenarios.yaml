# 공격 체인 시나리오 (v4) — 실제 사고 기반 IT 침투 → OT 영향 흐름
# 각 단계의 otc는 매트릭스 OTC-ID(빌드 시 존재 검증). 전술 순서대로 적고, 단계별 탐지 포인트를 매트릭스와 연결한다.
# 목적: 개별 기법을 공격 흐름 안에서 보고, 어느 단계에서 끊을 수 있는지(초크 포인트)를 드러냄.

scenarios:
  - id: SCN-01
    title: 전력망 정전 — 스피어피싱에서 차단기 개방·복구 방해까지
    based_on: [INC-002]
    ref: C0028 (2015 우크라이나 배전망 공격)
    note: IT망 침투 후 정상 원격 운영 경로로 OT에 들어가 운영자처럼 조작한 전형적 흐름.
    steps:
      - { otc: OTC-IA-09, 전술: 초기 침투, 행위: "스피어피싱 첨부 문서 매크로로 BlackEnergy3 감염", 탐지: "문서 매크로 차단·첨부 실행 시 자식 프로세스 경보" }
      - { otc: OTC-LM-07, 전술: 횡적 이동, 행위: "기업망에서 자격증명 수집", 탐지: "LSASS 접근·자격증명 덤프 도구 탐지" }
      - { otc: OTC-IA-03, 전술: 초기 침투, 행위: "탈취 계정과 VPN으로 제어망 진입", 탐지: "VPN 비정상 시간대·출발지, 다중 인증 부재 계정 경보" }
      - { otc: OTC-EX-03, 전술: 실행, 행위: "운영자 HMI 화면을 원격 조작", 탐지: "운영자 콘솔 외 원격 세션의 제어 조작 경보" }
      - { otc: OTC-IP-03.1, 전술: 공정 제어 훼손, 행위: "변전소 차단기 개방 명령 전송", 탐지: "평소 명령을 보내지 않는 호스트의 쓰기·동작 명령 경보" }
      - { otc: OTC-PE-04.1, 전술: 대응 기능 억제, 행위: "직렬-이더넷 변환기 펌웨어 덮어써 원격 복구 차단", 탐지: "장치 펌웨어 버전·무결성 점검, 비정상 재시작 확인" }
      - { otc: OTC-IR-02, 전술: 대응 기능 억제, 행위: "KillDisk로 시스템 삭제", 탐지: "대량 파일 삭제·로그 삭제 이벤트 경보, 오프라인 백업 보유" }
      - { otc: OTC-IM-04, 전술: 영향, 행위: "약 22만 5천 고객 수 시간 정전", 탐지: "공정·배전 상태와 운영자 조작 기록 상관 분석" }

  - id: SCN-02
    title: 안전계통 무력화 시도 — EWS 경유 안전 제어기 재프로그래밍
    based_on: [INC-004]
    ref: C0030 (Triton/TRISIS 안전계통 공격)
    note: 안전계통(SIS)을 직접 노린 유일한 공개 사례. 키 스위치·안전계통 분리가 핵심 초크 포인트.
    steps:
      - { otc: OTC-IA-03, 전술: 초기 침투, 행위: "외부 원격 서비스로 IT망 진입", 탐지: "원격 접속 로그 이상·신규 외부 연결 경보" }
      - { otc: OTC-PE-01, 전술: 횡적 이동, 행위: "RDP 점프 박스를 거쳐 OT망의 EWS 도달", 탐지: "점프 호스트 경유 외 OT 접근·근무 외 RDP 경보" }
      - { otc: OTC-CO-08, 전술: 수집, 행위: "안전 제어기 운전 모드·키 스위치 상태 조회", 탐지: "엔지니어링 프로토콜 상태 조회를 지정 EWS 밖에서 할 때 경보" }
      - { otc: OTC-EX-06, 전술: 실행, 행위: "키 스위치가 PROGRAM인 틈에 운전 모드 활용", 탐지: "키 스위치 PROGRAM·REMOTE 상태를 HMI로 감시·경보" }
      - { otc: OTC-LM-01.3, 전술: 횡적 이동, 행위: "Triconex에 공격 프로그램 추가 다운로드", 탐지: "프로그램 추가·다운로드 기능 코드 경보, 기준본과 블록 비교" }
      - { otc: OTC-IM-09, 전술: 영향, 행위: "안전 기능 무력화 시도(실제론 트립으로 발각)", 탐지: "안전 제어기 트립·진단 경보를 독립 경로로 수집" }

  - id: SCN-03
    title: 지역난방 중단 — 노출 장비에서 Modbus 파라미터 조작까지
    based_on: [INC-007]
    ref: C0041 (FrostyGoop 리비우 지역난방)
    note: 경계 장비 노출 → 웹셸 지속 → 인증 없는 산업 프로토콜로 현장 제어. 경계 노출 제거가 1차 초크 포인트.
    steps:
      - { otc: OTC-IA-02, 전술: 초기 침투, 행위: "외부에 노출된 라우터의 취약점으로 진입", 탐지: "경계 장비 공개 취약점 패치·노출 점검, 익스플로잇 패턴 탐지" }
      - { otc: OTC-PE-07.2, 전술: 지속성, 행위: "ReGeorg 변종 웹셸로 접근 유지", 탐지: "웹 서버 디렉터리 신규 스크립트·HTTP 터널 패턴 탐지" }
      - { otc: OTC-LM-07, 전술: 횡적 이동, 행위: "SAM 하이브에서 자격증명 확보", 탐지: "SAM·SYSTEM 하이브 저장 이벤트 경보" }
      - { otc: OTC-IP-02, 전술: 공정 제어 훼손, 행위: "Modbus TCP로 ENCO 제어기 값 변경", 탐지: "제어기 설정값을 승인 값과 대조, 비정상 쓰기 발신지 경보" }
      - { otc: OTC-IM-02, 전술: 영향, 행위: "약 600개 건물 난방·온수 중단", 탐지: "공정 이력과 현장 계측 대조로 위조 보고·제어 상실 확인" }

  - id: SCN-04
    title: IT 랜섬웨어의 예방적 OT 중단 — 가장 흔한 실제 영향 경로
    based_on: [INC-044, INC-019, INC-071]
    ref: 콜로니얼 파이프라인(DarkSide)·노르스크 하이드로(LockerGoga)·아사히그룹 등
    note: OT를 직접 건드리지 않아도 IT 침해가 OT 가동 중단으로 이어진다. 사고 DB에서 가장 잦은 유형.
    steps:
      - { otc: OTC-IA-03, 전술: 초기 침투, 행위: "다중 인증 없는 휴면 VPN 계정·유출 암호로 IT망 진입", 탐지: "휴면 계정 사용·다중 인증 부재 경보, 유출 계정 대조" }
      - { otc: OTC-PE-01, 전술: 지속성, 행위: "유효 계정으로 IT망 장악", 탐지: "신규 관리자 계정·비정상 로그인 경보" }
      - { otc: OTC-EV-09, 전술: 회피, 행위: "백신·보안 도구 종료 후 랜섬웨어 실행", 탐지: "보안 에이전트 상태 중단·변조 방지 경보" }
      - { otc: OTC-IM-13, 전술: 영향, 행위: "IT 시스템 일괄 암호화", 탐지: "대량 파일 암호화 행위 탐지, 오프라인 백업 보유" }
      - { otc: OTC-IM-05, 전술: 영향, 행위: "OT 확산 우려로 예방적 가동 중단", 탐지: "IT/OT 경계 분리로 확산 차단, 수동 운전 절차 준비" }

  - id: SCN-05
    title: 노출 장치 핵티비즘 — 기본 암호로 HMI 화면·설정 조작
    based_on: [INC-005, INC-064, INC-072]
    ref: Unitronics 캠페인(C0031)·친러 핵티비스트·캐나다 노출 ICS
    note: 숙련도가 낮아도 검색 엔진과 기본 암호만으로 가능. 노출 제거·기본 암호 변경이 결정적.
    steps:
      - { otc: OTC-IA-11, 전술: 초기 침투, 행위: "인터넷에 노출된 PLC·HMI·VNC 발견", 탐지: "외부 공격 표면 점검으로 노출 장치 식별" }
      - { otc: OTC-PE-05.1, 전술: 지속성, 행위: "기본·취약 암호로 로그인", 탐지: "기본 계정 로그인·반복 로그인 시도 경보" }
      - { otc: OTC-IP-02, 전술: 공정 제어 훼손, 행위: "설정값을 최대치로 변경(탱크 범람 등)", 탐지: "설정값 범위 이탈·근무 외 변경 경보" }
      - { otc: OTC-IR-10, 전술: 대응 기능 억제, 행위: "관리자 암호를 바꿔 운영자 잠금", 탐지: "장치 자격증명 변경 이벤트 경보" }
      - { otc: OTC-IM-07, 전술: 영향, 행위: "화면 변조·제어 조작(일부 시설 수동 운전 전환)", 탐지: "HMI 화면·설정 무결성 점검, 독립 계측으로 교차 확인" }
