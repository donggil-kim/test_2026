# 표준 요구사항 명칭 (v5) — 표준 연계 시트·매트릭스에 ID와 함께 표시
#
# 원문(요구사항 본문)은 수록하지 않는다. 여기 담는 것은 '요구사항 제목'뿐이다.
#   · NIST SP 800-53 Rev.5: 통제명 — OSCAL 공식 콘텐츠(usnistgov/oscal-content)에서 추출(공공 영역)
#   · IEC 62443-3-3(SR)·62443-4-2(CR/EDR/HDR/NDR): 공개된 요구사항 제목. 정규 본문은 유료 표준이 기준이며,
#     62443-4-2의 CR 번호는 62443-3-3 SR 번호에 대응하도록 설계돼 제목이 거의 같다. 일부 제목은 EMB3D 매핑에서 확인.
#   버전·개정에 따라 제목이 다를 수 있으니, 연계는 참고용이고 적용 전 해당 표준 원문과 대조할 것.

