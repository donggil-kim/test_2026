# [CR] 자격증명 탈취·유출 — 재구성 Lv3 (원본 5개 → 2)
- id: ID-CR-01
  name: 단말 자격증명 탈취(인포스틸러·덤프·키로깅)
  summary: 인포스틸러·메모리 덤프·키로거로 단말의 비밀번호·세션 쿠키·해시 탈취
  members: [IDT-CR-01.1, IDT-CR-01.2, IDT-CR-01.3]
  basis: 원본 위협분류 '단말 자격증명 탈취' 3개 — 감염 단말에서 자격증명을 빼내는 같은 위협이며 단말 EDR·개인 기기 업무 접근 통제라는 같은 통제
  description: |-
    - 업무·개인 PC를 인포스틸러·키로거로 감염시키거나 장악한 단말·서버의 LSASS·SAM을 덤프해 브라우저 저장 비밀번호·SSO 세션 쿠키·관리자 해시를 빼내는 위협
    - 개인 PC·협력사 단말처럼 회사 통제 밖에서 털리고 MFA 이후 입력값·세션까지 가로채며, 탈취 로그가 시장에 팔려 수년 뒤 침해로 이어짐
  scenario: |-
    - 협력사·개인 PC 인포스틸러 감염 → 브라우저 저장 자격증명·세션 쿠키 탈취와 다크웹 판매 → MFA 없는 SaaS·원격 접속에 정상 로그인
    - 핵심 키 접근권자의 개인 PC에 키로거 설치 → MFA를 마친 뒤 입력한 마스터 비밀번호 획득 → 회사 금고의 백업 복호화 키 탈취
  cases: |-
    - [실제 사고] Genesis Market 폐쇄(2023-04): 감염 PC 150만 대 이상에서 모은 자격증명·세션 쿠키·브라우저 지문을 묶어 판매
    - [실제 사고] LastPass 고객 금고 백업 탈취(2022-12): DevOps 엔지니어 개인 PC에 키로거를 심어 MFA를 마친 뒤 입력한 마스터 비밀번호를 가로챔
  controls: |-
    - 업무 계정 브라우저 저장·개인 계정 동기화 금지, 핵심 금고는 회사 관리 단말에서만 접근
    - 관리자 일반 단말 로그인 금지·단말별 고유 로컬 관리자 비밀번호, LSASS 보호·자격증명 격리
    - 인포스틸러·덤프 행위 EDR 탐지와 유출 로그 대조, 감염 계정의 비밀번호·세션 동시 초기화

- id: ID-CR-02
  name: 저장·노출된 비밀(코드·설정·자격증명 금고)
  summary: 코드·이미지에 노출된 토큰·키와 비밀번호 관리자 침해로 비밀 일괄 획득
  members: [IDT-CR-02.1, IDT-CR-02.2]
  basis: 원본 위협분류 '저장·노출된 비밀' 2개 — 저장된 비밀을 한꺼번에 얻는 같은 위협이며 비밀 스캔·비밀 저장소 분리·즉시 교체라는 같은 통제
  description: |-
    - 공개·내부 코드 저장소, 설정 파일, 컨테이너 이미지, 스크립트에 남은 API 키·토큰이나 비밀번호 관리자·자격증명 금고를 노려 저장된 비밀을 한꺼번에 얻는 위협
    - 서비스 키는 MFA·로그인 이상 탐지 밖이라 교체하지 않으면 수년간 유효하고, 금고가 뚫리면 피해가 조직·고객 전체로 커지며 교체 대상 파악도 어려움
  scenario: |-
    - 실수로 노출된 GitHub 토큰 획득 → 조직 전체 코드 저장소 접근 → 소스 코드 대량 반출
    - 직원 PC 악성 프로그램으로 비밀번호 관리자 속 자격증명 탈취 → 사내 Slack 접근 → 채널 대화 대량 유출
  cases: |-
    - [실제 사고] New York Times 소스 코드 270GB 유출(2024-01): 실수로 노출된 GitHub 토큰으로 조직 전체 저장소에 접근
    - [실제 사고] Disney 사내 Slack 1.1TB 유출(2024-07): 직원 PC의 비밀번호 관리자에 저장된 자격증명이 탈취되어 Slack 채널 약 1만 개 유출
  controls: |-
    - 비밀은 금고·워크로드 신원으로 대체하고 코드·이미지·스크립트 하드코딩 금지
    - 금고 관리 권한 분리·하드웨어 키 접근, 노출 즉시 폐기와 침해 시 연동 토큰 전수 교체
    - 저장소·CI·레지스트리 비밀 스캔과 푸시 차단, 금고 대량 조회·내보내기·백업 접근 경보
