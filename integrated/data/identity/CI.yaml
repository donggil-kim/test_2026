# [CI] 고객 계정·본인확인(CIAM) — 재구성 Lv3 (원본 4개 → 3)
- id: ID-CI-01
  name: 고객 계정 대량 자격증명 스터핑
  summary: 유출 아이디·비밀번호 자동 대입으로 쇼핑·금융 고객 계정 대량 탈취
  members: [IDT-CI-01]
  basis: 단독 유지 — 고객 계정을 대상으로 한 대량 자동화 대입으로 봇 탐지·고객 MFA라는 고유 통제(실제 사고 9건, 국내 다수)
  description: |-
    - 다른 곳에서 유출된 아이디·비밀번호 목록을 여러 IP로 나눠 쇼핑·예매·금융 고객 로그인에 자동 대입해 비밀번호를 재사용한 수많은 계정에 로그인하는 위협
    - 서비스가 뚫리지 않아도 개인정보 노출·부정 결제가 생기고, 정상 로그인과 섞여 단시간 대량 시도를 따로 탐지하지 않으면 수개월간 이어짐
  scenario: |-
    - 유출 자격증명 목록을 같은 IP에서 단시간 대량 대입 → 로그인된 계정의 회원정보 수정 페이지 조회 → 이름·연락처·주소 대량 노출과 과징금 부과
    - 비밀번호를 재사용한 고객 계정 약 1만 4천 개 탈취 → 친척 찾기 기능으로 연결된 다른 고객 프로필 조회 → 약 690만 명의 프로필 정보 노출
  cases: |-
    - [실제 사고] GS리테일(GS SHOP·GS25) 자격증명 스터핑으로 회원 166만 명 정보 노출(2025-01): 단시간 대량 로그인을 막지 못해 과징금 128억 원
    - [실제 사고] 23andMe 자격증명 스터핑(2023-10): 비밀번호를 재사용한 약 1만 4천 계정이 탈취되고 연결된 약 690만 명의 프로필 정보가 노출
  controls: |-
    - 고객 계정 MFA·패스키 제공과 위험 기반 추가 인증, 결제·개인정보 변경 시 재인증
    - 로그인 시도 제한·봇 차단·유출 비밀번호 사용 금지, 로그인 뒤 개인정보 화면 마스킹
    - 같은 IP·기기 지문의 단시간 대량 로그인·성공률 급변·새 기기의 개인정보 조회 탐지

- id: ID-CI-02
  name: 통신 가입자 인증 체계 침해
  summary: 유심 인증키 유출·불법 초소형 기지국으로 휴대폰 기반 인증 무력화
  members: [IDT-CI-02]
  basis: 단독 유지 — 휴대폰 기반 인증의 기반(유심·기지국)을 침해하는 위협으로 통신사 인증키 보호·문자 인증 의존 축소라는 고유 통제
  description: |-
    - 통신사 가입자 인증 서버에서 유심 인증키 등 가입자 정보를 빼내거나 통신사 인증서를 가진 불법 초소형 기지국으로 문자·ARS 인증값을 가로채는 위협
    - 휴대폰 문자·본인확인에 기대는 모든 서비스가 함께 영향을 받고, 가입자 개인이 막을 방법이 없어 통신사 단위의 대응이 필요함
  scenario: |-
    - 비밀번호를 오래 바꾸지 않은 관리망 서버 계정 → 서버에 악성코드를 심고 수년간 잠복 → 가입자 인증 서버의 유심 정보 대량 유출
    - 통신사 인증서를 가진 불법 초소형 기지국 운용 → 문자·ARS 결제 인증값 가로채기 → 가입자 명의 무단 소액결제
  cases: |-
    - [실제 사고] SK텔레콤 유심 정보 2,696만 건 유출(2025-04): 서버 28대에서 악성코드 33종이 발견되고 유심 정보 25종이 유출, 최초 침투는 2021-08
    - [실제 사고] KT 불법 펨토셀 경유 결제 인증 탈취·무단 소액결제(2025-09): 불법 초소형 기지국으로 문자·ARS 결제 인증값을 가로채 피해자 368명 발생
  controls: |-
    - 가입자 인증키의 하드웨어 보안 모듈 보호와 침해 시 키·유심 교체 절차 준비
    - 기지국 인증서 수명 단축·접속 인가 통제, 서비스 제공자의 문자 단독 본인확인·결제 인증 축소
    - 인증 서버·관리망 비정상 로그인·대량 조회, 미등록 기지국 접속·기지국 단위 결제 인증 급증 탐지

- id: ID-CI-03
  name: 명의 도용·본인확인 우회(딥페이크 포함)
  summary: 도용 신분증·합성 신원·딥페이크 얼굴로 비대면 계좌 개설·본인확인 통과
  members: [IDT-CI-03.1, IDT-CI-03.2]
  basis: 원본 위협분류 '명의 도용·본인확인 우회' 2개 — 계좌·계정 개설 단계 본인확인을 속이는 같은 위협이며 다중 증빙·라이브니스 검사라는 같은 통제 | v4 Lv0 간 통합으로 AI-01-07(딥페이크 기반 생체인증 우회) 흡수
  description: |-
    - 훔치거나 생성형 AI로 위조한 신분증·합성 신원으로 비대면 계좌를 열거나, 얼굴 영상·딥페이크를 가상 카메라·영상 주입으로 얼굴 인식·eKYC에 넣어 남의 명의로 인증을 통과하는 위협
    - 개설 시점 확인만 통과하면 정상 고객으로 취급되고 생체 정보는 바꿀 수 없어 반복 악용되며, 우회 도구가 범죄 시장에서 팔리고 카메라 입력 주입은 화면만으로 구분하기 어려움
  scenario: |-
    - 훔친 신분증으로 비대면 계좌 개설 신청 → 얼굴 인식 단계에서 AI 얼굴 바꾸기로 신분증 주인 얼굴 위장 → 계좌 개설·대출 신청
    - 은행·정부기관 앱을 사칭한 트로이목마로 얼굴 영상·신분증 수집 → 딥페이크로 은행 생체 본인확인 통과 → 피해자 계좌 접근
  cases: |-
    - [실제 사고] 홍콩 딥페이크 얼굴 바꾸기로 대출·계좌 개설 사기 조직 검거(2023-08): 훔친 신분증 8장으로 은행 계좌 54개를 열고 대출 90건을 신청
    - [실제 사고] GoldPickaxe 얼굴 인식 정보 탈취 트로이목마(2024-02): 사칭 앱으로 얼굴 영상·신분증을 수집하고 딥페이크로 은행 생체 본인확인을 통과
  controls: |-
    - 비대면 개설 신원 확인을 신분증 진위·명의자 확인·기기 정보로 교차 검증
    - 생체 라이브니스 검사·주입 공격 탐지 적용, 얼굴 인증 단독으로 고위험 거래 불허
    - 같은 신분증·얼굴·기기의 다계정 개설, 가상 카메라 입력, 인증 직후 대출·고액 이체 탐지
  absorbs:
    - id: AI-01-07
      name: 딥페이크 기반 생체인증 우회
      members: [UT-04.1]
      reason: 딥페이크 신분증·셀피 영상과 가상 카메라 주입으로 얼굴인식·eKYC 본인확인을 우회하는 같은 위협(IDT-CI-03.2와 동일)이며 라이브니스·주입 공격 탐지·다중 채널 확인이라는 같은 통제 — 표적이 신원 확인 절차라 신원 고객 계정(CI) 항목으로 통합
