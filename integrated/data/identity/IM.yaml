# [IM] 영향·확산 — 재구성 Lv3 (원본 5개 → 4)
- id: ID-IM-01
  name: 계정 장악 기반 금전 사기(BEC·송금·사칭 게시)
  summary: 장악한 메일·SNS·금융 계정으로 송금 가로채기·사칭 게시·가상자산 탈취
  members: [IDT-IM-01]
  basis: 단독 유지 — 금전 피해 결과 유형(실제 사고 20건)으로 송금 이중 확인이라는 고유 통제
  description: |-
    - 장악한 업무 메일·공식 소셜 미디어·금융·가상자산 계정과 서명 키로 거래처 송금을 가로채거나 사칭 게시물을 올리고 결제 수단·가상자산을 빼내는 위협
    - 정상 계정·채널로 지시·거래가 이뤄져 피해자가 의심하기 어렵고, 송금·가상자산 이체는 되돌리기 어려워 피해가 바로 확정됨
  scenario: |-
    - AiTM 피싱으로 세션 쿠키 탈취 → 메일함 규칙으로 흔적 은닉 → 거래처 메일 스레드에 끼어들어 송금 유도
    - 위조 신분증으로 대체 SIM 발급 → 2단계 인증이 꺼진 공식 소셜 미디어 계정 장악 → 가짜 게시물로 가상자산 가격 일시 급등
  cases: |-
    - [실제 사고] AiTM 피싱으로 세션 쿠키 탈취 후 BEC(2022-07): 탈취 세션으로 메일함에 들어가 거래처 메일 스레드에 끼어들어 송금을 유도
    - [실제 사고] Ronin 브리지 6억 달러대 탈취(2022-03): 탈취한 검증자 키로 약 6억 달러 상당 암호화폐를 인출
  controls: |-
    - 메일·공식 소셜 미디어·금융 계정의 피싱 저항 MFA와 문자 단독 인증 축소
    - 송금·계좌 변경은 사전 등록 채널 콜백 확인·이중 승인, BEC·딥페이크 사칭 사례 교육
    - 메일 규칙·외부 전달과 계좌 변경 요청 연계, 유심 변경 직후 금융 로그인·고액 출금 탐지

- id: ID-IM-02
  name: 신원 장악 후 랜섬웨어·파괴·계정 차단
  summary: 도메인·IdP 관리 권한 장악 뒤 전사 랜섬웨어·백업 삭제·관리자 축출
  members: [IDT-IM-02, IDT-IM-04]
  basis: 랜섬웨어·파괴(IM-02)와 관리자 축출·계정 차단(IM-04)은 신원 장악 뒤 가용성을 무너뜨리는 같은 결과 유형이며 비상 접근 계정·오프라인 백업이라는 같은 통제
  description: |-
    - 헬프데스크 사칭·MFA 없는 원격 접속·디렉터리 취약점으로 도메인·IdP·클라우드 관리 권한을 얻어 전사 시스템을 암호화하고 백업·자원·관리자 계정을 지우는 위협
    - 관리 권한 자체가 배포·삭제 수단이 되어 몇 시간 만에 조직이 멈추고, 대응에 필요한 관리자 접근과 백업이 먼저 사라지면 복구가 크게 늦어짐
  scenario: |-
    - 헬프데스크 사칭으로 Okta·Azure 관리 권한 획득 → ESXi 하이퍼바이저 약 100대 암호화 → 운영 열흘가량 마비와 약 1억 달러 영업 손실
    - 고객지원 사회공학으로 클라우드 계정 비밀번호 재설정 → 연결된 메일·SNS 계정 장악 → 노트북·휴대폰·태블릿 데이터 원격 삭제
  cases: |-
    - [실제 사고] MGM Resorts 랜섬웨어(2023-09): 헬프데스크 사칭으로 Okta·Azure 관리 권한을 얻어 약 100대의 ESXi 하이퍼바이저를 암호화
    - [실제 사고] Mat Honan 계정 연쇄 탈취(2012-08): 고객지원 사회공학으로 iCloud 비밀번호를 재설정받아 연결 계정을 장악하고 기기 데이터를 원격 삭제
  controls: |-
    - 도메인·IdP·백업 관리 권한을 전용 관리자 계정·피싱 저항 MFA로 분리, 계층 간 자격증명 재사용 금지
    - 관리자도 지울 수 없는 분리·불변 백업과 오프라인 보관 긴급 계정, 관리자 접근 상실 복구 훈련
    - 관리 권한 부여·그룹 정책·하이퍼바이저 대량 작업·백업 삭제·관리자 계정 삭제 실시간 경보

- id: ID-IM-03
  name: 계정 기반 대량 데이터 탈취·갈취
  summary: 정상 계정·토큰으로 SaaS·고객 DB를 대량 조회해 데이터 탈취·갈취
  members: [IDT-IM-03]
  basis: 단독 유지 — 신원 사고가 가장 많이 몰린 결과 유형(실제 사고 47건)으로 대량 조회 감시라는 고유 통제
  description: |-
    - 탈취하거나 매수·위조한 계정·토큰·서명키로 SaaS·고객 DB·코드 저장소에 정상 사용자처럼 들어가 대량의 데이터를 내려받고 공개를 빌미로 갈취하는 위협
    - 정상 권한의 조회·내보내기라 데이터 유출 방지 통제를 통과하기 쉽고, 조회량 이상을 보지 않으면 수개월 뒤 외부 공개·통지로 알게 됨
  scenario: |-
    - 인포스틸러에서 나온 고객 자격증명 → MFA·접속 허용 목록이 없는 데이터 플랫폼 인스턴스 약 165곳 로그인 → 데이터 대량 반출·갈취
    - 직원을 사칭해 계정 접근 획득 → 회원 DB 조회 → 회원 650만 명 전원의 이름·주소·연락처 탈취
  cases: |-
    - [실제 사고] Snowflake 고객 인스턴스 대량 데이터 탈취(2024-05): 인포스틸러에서 나온 자격증명으로 MFA·접속 허용 목록이 없는 인스턴스 약 165곳에 로그인
    - [실제 사고] Co-op 회원 650만 명 정보 탈취(2025-04): 직원을 사칭해 계정 접근을 얻은 뒤 회원 650만 명 전원의 이름·주소·연락처를 탈취
  controls: |-
    - 데이터 접근을 역할별 최소 권한으로 줄이고 대량 조회·내보내기는 승인·속도 제한
    - 데이터 플랫폼·SaaS에 MFA·접속 허용 목록 필수, 고객정보 화면 마스킹·조회 기록 보존
    - 계정·토큰·연동 앱별 조회량·내보내기 기준선 이탈과 새 출발지·MFA 없는 로그인 조회 경보

- id: ID-IM-04
  name: 공급업체·플랫폼 경유 연쇄 계정 탈취
  summary: 공급업체 직원 계정·고객용 토큰 장악으로 여러 고객 조직 계정에 연쇄 접근
  members: [IDT-IM-05]
  basis: 단독 유지 — 공급업체 신원 침해가 고객 계정으로 번지는 확산 유형으로 공급업체 침해 시 토큰 일괄 폐기라는 고유 통제
  description: |-
    - IdP·원격 지원·CI/CD·SaaS 연동 공급업체의 직원 계정이나 고객용 토큰·키를 장악해 그 서비스를 믿는 여러 고객 조직의 계정과 데이터로 옮겨 가는 위협
    - 고객은 공급업체 내부를 볼 수 없어 공지가 나와야 알게 되고, 고객마다 토큰·비밀을 교체해야 해 한 번의 침해가 수많은 조직의 대응으로 번짐
  scenario: |-
    - 연동 공급자의 OAuth 토큰 탈취 → 여러 조직의 Salesforce 데이터 반출 → 반출 데이터에서 AWS 키·Snowflake 토큰 등 다른 자격증명 수집
    - CI/CD 서비스 엔지니어 노트북 악성코드로 SSO 세션 탈취 → 고객 환경변수·토큰·키 반출 → 모든 고객의 저장 비밀 전체 교체
  cases: |-
    - [실제 사고] Salesloft Drift 연동 OAuth 토큰 탈취로 Salesforce 인스턴스 대량 데이터 반출(2025-08): 반출 데이터에서 AWS 키 등 자격증명을 찾아냄
    - [실제 사고] CircleCI 고객 비밀 유출(2023-01): 엔지니어 노트북 악성코드가 SSO 세션을 훔쳐 고객 환경변수·토큰·키를 빼냈고 전체 비밀 교체를 권고
  controls: |-
    - 신원·원격 지원·CI/CD·연동 공급업체를 핵심 공급망으로 분류해 보안 요구 계약·정기 평가
    - 공급업체에 맡긴 비밀·토큰 목록 유지와 침해 시 전수 교체, 공급업체 특권 접근은 고객 승인제
    - 공급업체 침해 공지 즉시 토큰·연동 키·지원 접근 이력 점검, 연동 토큰의 새 출발지 사용 경보
