# [SE] 사회공학·계정 복구 경로 — 재구성 Lv3 (원본 7개 → 4)
- id: ID-SE-01
  name: 인증 피싱(AiTM·OAuth 동의·문자·메신저)
  summary: 가짜 로그인·동의 화면·문자 피싱으로 비밀번호·MFA 세션·토큰 탈취
  members: [IDT-SE-01.1, IDT-SE-01.2, IDT-SE-01.3]
  basis: 원본 위협분류 '자격증명·인증 피싱' 3개 — 전달 채널과 받아내는 증표만 다른 같은 인증 피싱이며 피싱 저항 MFA·관리자 동의 흐름이라는 같은 통제
  description: |-
    - 중계 피싱 사이트, 정상 IdP의 OAuth 동의·디바이스 코드 입력, IT 부서를 사칭한 문자·Teams 메시지로 직원의 비밀번호·MFA 세션·토큰을 받아내는 위협
    - 일회용 코드·푸시형 MFA는 중계를 막지 못하고 정상 도메인·문자·외부 채팅은 메일 보안 밖이며, 비밀번호를 바꿔도 발급된 세션·토큰은 남음
  scenario: |-
    - IT 부서를 사칭한 문자로 비밀번호 만료 안내 → Okta 화면을 흉내 낸 유사 도메인으로 유도 → 자격증명·일회용 코드를 가로채 직원 계정으로 로그인
    - 화상회의 초대를 가장해 정상 로그인 페이지에서 공격자의 디바이스 코드 입력 유도 → 액세스·리프레시 토큰 획득 → 비밀번호 없이 클라우드 IdP·SaaS 계정 접근
  cases: |-
    - [실제 사고] Twilio 등 0ktapus SMS 피싱 캠페인(2022-08): Okta 유사 도메인으로 130곳 이상을 겨눠 자격증명 9,931건 수집, 하드웨어 보안 키를 쓴 곳은 차단
    - [실제 사고] Storm-2372 디바이스 코드 피싱 캠페인(2025-02): 화상회의 초대를 가장해 정상 로그인 페이지에서 디바이스 코드를 입력하게 하고 토큰을 획득
  controls: |-
    - FIDO2·패스키 등 피싱 저항 MFA를 관리자부터 필수화, 세션의 장치 결합·짧은 수명
    - OAuth 사용자 동의를 관리자 승인으로 전환, 불필요한 디바이스 코드 흐름·외부 채팅 제한
    - 다른 IP의 같은 세션 재사용·새 앱 동의·디바이스 코드 사용·외부 테넌트 첫 채팅 경보

- id: ID-SE-02
  name: 헬프데스크 사칭과 계정 복구 절차 악용
  summary: 헬프데스크 사칭·복구 절차 결함으로 비밀번호·MFA 재설정해 계정 인수
  members: [IDT-SE-02.1, IDT-SE-03]
  basis: 본 인증보다 약한 복구·재설정 경로로 계정을 넘겨받는 같은 위협이며 재설정 전 강한 신원 확인이라는 같은 통제(SE-03은 Lv2가 1개뿐이라 인접 Lv2와 묶음)
  description: |-
    - 직원을 사칭해 사내·외주 헬프데스크에서 IdP 특권 계정의 비밀번호·MFA를 재설정받거나, 고객지원 사회공학·SMS 복구 결함으로 고객 계정을 넘겨받는 위협
    - 기술 통제가 아닌 절차가 뚫려 MFA가 있어도 무력화되고, 외주 헬프데스크는 확인 절차를 지키지 않기 쉬우며 복구 결함은 많은 고객을 한꺼번에 노출함
  scenario: |-
    - 직원을 사칭해 IT 헬프데스크에 전화 → 비밀번호·MFA 재설정으로 Okta·Azure 관리 권한 획득 → 가상화 서버 암호화와 영업 중단
    - SMS 2단계 인증 고객의 계정 복구 절차 결함 악용 → 인증 토큰 획득 → 고객 계정에서 자금 인출
  cases: |-
    - [실제 사고] Marks & Spencer 랜섬웨어(2025-04): 협력사를 상대로 한 사칭으로 직원 비밀번호를 재설정받아 침투, 영업이익 약 3억 파운드 영향
    - [실제 사고] Coinbase SMS 계정 복구 결함 악용(2021-10): 계정 복구 절차 결함으로 인증 토큰을 받아 고객 6천여 명의 자금을 빼냄
  controls: |-
    - 재설정 전 영상 대면·관리자 승인·사전 등록 장치 확인, 외주 계약에 확인 절차 명시
    - 특권 계정은 헬프데스크 재설정 제외, SMS 단독 복구 폐지와 복구 후 고위험 거래 지연
    - 티켓 없는 재설정·재설정 직후 새 장치 로그인·인증 수단 등록·다수 계정 복구 경보

- id: ID-SE-03
  name: IT 지원 사칭으로 원격 지원·연결 앱 승인 유도
  summary: IT 지원 사칭 전화·채팅으로 원격 지원 허용·SaaS 연결 앱 승인 유도
  members: [IDT-SE-02.2]
  basis: 단독 유지 — 사용자를 상대로 한 사칭(SE-02는 헬프데스크를 상대로 한 사칭)으로 피해 지점(단말·연결 앱)과 통제(원격 지원 도구 허용 목록·연결 앱 관리자 승인)가 다름
  description: |-
    - IT 지원 인력을 사칭한 전화·채팅으로 직원이 원격 지원 세션을 허용하거나 SaaS 연결 앱을 승인하게 해 단말·조직 데이터를 넘겨받는 위협
    - 직원이 직접 승인한 정상 기능이라 보안 도구가 막지 않고, 연결 앱 권한은 조직 SaaS 데이터 전체에 미쳐 대량 반출·갈취로 이어짐
  scenario: |-
    - IT 지원을 사칭한 전화 → 직원이 변조된 Data Loader 앱 승인 → 연결 앱 권한으로 Salesforce 조직 데이터 대량 반출·갈취
    - 메일 폭탄으로 받은편지함 마비 → Teams·전화로 지원 인력 사칭해 Quick Assist 연결 허용 유도 → 단말 장악·랜섬웨어 배포
  cases: |-
    - [실제 사고] Salesforce 대상 음성 피싱(2025-06): IT 지원을 사칭한 전화로 직원이 변조된 Data Loader 앱을 승인하게 해 조직 데이터를 대량 반출·갈취
    - [실제 사고] Storm-1811 메일 폭탄과 IT 지원 사칭(2024-05): Quick Assist 원격 지원 연결을 허용하게 해 단말을 장악하고 Black Basta 배포로 이어짐
  controls: |-
    - 승인된 원격 지원 도구만 허용·사용 시 이중 확인, 연결 앱 설치는 관리자 승인으로 제한
    - 연결 앱·API 사용자 권한 최소화, 'IT 지원은 먼저 전화하지 않음' 원칙과 콜백 확인
    - 원격 지원 실행 직후 새 원격 접속·도구 설치, 신규 연결 앱 승인 뒤 API 대량 조회 탐지

- id: ID-SE-04
  name: 딥페이크·AI 음성 사칭(송금·접근 요청)
  summary: 딥페이크 영상·음성으로 임원·동료를 사칭해 송금·MFA 코드 요구
  members: [IDT-SE-04]
  basis: 단독 유지 — 얼굴·목소리라는 신뢰 확인 수단 자체를 위조하는 위협으로 별도 채널 콜백·이중 승인이라는 고유 통제(AI-01-07·AI-01-08 연계)
  description: |-
    - 공개 영상·음성으로 만든 딥페이크로 임원·동료를 사칭해 화상회의·전화에서 재무 담당자의 송금이나 직원의 인증 코드 제공을 이끌어내는 위협
    - 얼굴·목소리를 본인 확인 근거로 쓰는 관행을 무너뜨리고, 한 번의 지시로 큰 금액이 나가거나 MFA가 넘어감
  scenario: |-
    - 사전 정찰로 사내 사정 파악 → CFO·동료로 보이는 딥페이크 참석자가 화상회의에서 송금 지시 → 재무 담당자가 여러 차례 나눠 거액 송금
    - 직원 목소리를 흉내 낸 딥페이크 전화 → 추가 MFA 코드 획득 → 고객 계정 장악
  cases: |-
    - [실제 사고] Arup 딥페이크 화상회의 송금 사기(2024-01): CFO와 동료로 보이는 딥페이크 참석자의 지시로 직원이 15차례 총 2억 홍콩달러를 송금
    - [실제 사고] Retool 고객 계정 27곳 장악(2023-08): 직원의 실제 목소리를 딥페이크로 흉내 낸 전화로 추가 MFA 코드를 받아냄
  controls: |-
    - 송금·계좌 변경은 사전 등록된 별도 채널 콜백 확인과 이중 승인
    - 얼굴·목소리만으로 본인확인하지 않고 사전 공유 정보·장치 기반 확인 병행, 코드 비공유 원칙
    - 긴급·비밀 유지를 강조하는 송금 요청·평소와 다른 채널의 지시를 이상 거래로 분류
