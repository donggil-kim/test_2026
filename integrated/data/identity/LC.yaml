# [LC] 수명주기·거버넌스·내부자 — 재구성 Lv3 (원본 5개 → 3) · v4 Lv0 간 통합으로 1개 이관 → 2
- id: ID-LC-01
  name: 퇴사자·휴면·협력사 계정 악용
  summary: 퇴사자·휴면·협력사 계정과 회수되지 않은 권한으로 원청 시스템 침투
  members: [IDT-LC-01.1, IDT-LC-01.2]
  basis: 원본 위협분류 '계정 수명주기 결함' 2개 — 관리 밖에 남은 계정을 쓰는 같은 위협이며 계정 수명주기 관리·정기 검토라는 같은 통제
  description: |-
    - 활성 상태로 남은 퇴사자·휴면 VPN·SaaS 계정, 회수되지 않은 권한·키, 협력사·외주 인력 계정이나 지원 창구를 거쳐 정상 사용자처럼 원청 시스템에 들어오는 위협
    - 주인 없는 계정은 이상을 알아챌 사람이 없고 협력사 단말·절차는 원청이 통제하지 못해, MFA 없이 남은 비밀번호 하나가 대량 유출의 입구가 됨
  scenario: |-
    - 쓰지 않지만 활성 상태로 남은 레거시 VPN 계정에 비밀번호 하나로 접속 → 내부망 랜섬웨어 실행 → 송유관 운영 중단
    - 협력사 직원에게 피싱 메일 → 악성코드로 협력사 포털 자격증명 탈취 → 원청 내부망 침투와 결제정보 대량 유출
  cases: |-
    - [실제 사고] Colonial Pipeline 랜섬웨어(2021-05): 쓰지 않지만 활성 상태로 남은 레거시 VPN 계정이 비밀번호 하나로만 보호되어 침투 경로가 됨
    - [실제 사고] Target 결제정보 4천만 건 유출(2013-12): 냉난방 협력사 직원에게 보낸 피싱 메일의 악성코드로 협력사 포털 자격증명을 훔쳐 침투
  controls: |-
    - 인사 변동과 연동한 계정·권한 자동 회수, 퇴사 당일 비활성화와 관련 키·토큰 폐기
    - 외부 인력 계정은 승인 발급·계약 범위·기간 제한, 협력사에 MFA·관리 단말 사용 요구
    - 휴면 계정의 갑작스러운 로그인·퇴사자 명의 접근·협력사 계정의 계약 범위 밖 접근 경보

- id: ID-LC-02
  name: 내부자 오남용과 외부의 내부자 매수
  summary: 내부자의 정상 권한 대량 조회·반출과 고객지원·협력사 인력 매수
  members: [IDT-LC-02.1, IDT-LC-02.2]
  basis: 원본 위협분류 '내부자 위협' 2개 — 정상 권한으로 데이터를 빼내는 같은 위협이며 대량 조회 감시·직무 분리라는 같은 통제(물리 PH-IN 연계)
  description: |-
    - 내부자가 업무상 가진 고객 DB·클라우드·보고서 권한으로 정보를 대량 조회·반출하거나, 외부가 고객지원·협력사 인력을 매수해 정상 업무 화면으로 고객 정보를 빼내는 위협
    - 정상 권한 안의 업무 조회라 접근 통제가 막지 못해 수개월간 드러나지 않기 쉽고, 빼낸 정보는 회사를 사칭한 2차 사기로 이어짐
  scenario: |-
    - 용역 직원이 카드사 사무실 PC에서 고객정보 대량 조회 → USB에 저장해 반출 → 대출 중개업자에게 판매
    - 범죄자가 해외 고객지원 인력·협력사 직원 매수 → 고객 이름·주소·신분증 이미지·잔액 유출 → 회사를 사칭한 사회공학으로 고객 자산 노림
  cases: |-
    - [실제 사고] 카드 3사 고객정보 1억여 건 유출(2014-01): 용역 직원이 카드사 사무실 PC에서 고객정보 약 1억 건을 USB에 저장해 대출 중개업자에게 판매
    - [실제 사고] Coinbase 고객 데이터 유출(2025-05): 해외 고객지원 인력과 협력사 직원을 매수해 고객 이름·주소·신분증 이미지·잔액 등을 빼냄
  controls: |-
    - 직무 기반 최소 권한·직무 분리, 고객정보 조회는 티켓·사유와 묶고 민감 정보 마스킹
    - 대량 조회는 승인 뒤 허용, 퇴사 시 권한·키 즉시 회수, 외주 인력 채용 검증·매수 제안 신고 교육
    - 개인별 조회·내려받기 기준선 이탈, 담당 티켓과 무관한 고객 조회·신분증 이미지 대량 열람 경보

