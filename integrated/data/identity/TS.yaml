# [TS] 토큰·세션·티켓 — 재구성 Lv3 (원본 9개 → 3)
- id: ID-TS-01
  name: 세션·토큰 탈취와 재사용(장비 메모리 노출 포함)
  summary: MFA를 마친 세션 쿠키·리프레시·앱 토큰을 훔쳐 비밀번호 없이 재사용
  members: [IDT-TS-01.1, IDT-TS-01.2, IDT-TS-01.3]
  basis: 원본 위협분류 '세션·토큰 탈취와 재사용' 3개 — 탈취 지점만 다른 같은 위협이며 세션 장치 바인딩·짧은 수명·전체 세션 폐기라는 같은 통제 | v4 Lv0 간 통합으로 CL-CA-03(인증 토큰·세션 쿠키 탈취 및 재사용) 흡수
  description: |-
    - AiTM 피싱·인포스틸러·지원 첨부 파일·VPN 장비 메모리 노출로 세션 쿠키·리프레시 토큰을, 침해 워크로드·CI/CD에서 앱·관리 ID 토큰을 얻어 재사용하는 위협
    - 인증이 끝난 세션·토큰이라 새 로그인 기록이 없고, 장기 토큰·탈취 세션은 비밀번호 변경·장비 패치 뒤에도 유효해 폐기 없이는 SaaS·클라우드 API 접근이 이어짐
  scenario: |-
    - 원격 접속 장비 메모리 노출 결함으로 인증된 사용자의 세션 쿠키 탈취 → 사용자 이름·비밀번호·MFA 없이 인증 세션 생성 → 내부망 확산·랜섬웨어 배포
    - 직원 Slack 세션 쿠키 구매 → 사내 Slack에 들어가 직원을 사칭해 IT 지원팀에 새 MFA 토큰 요청 → 내부망 접근·소스 코드 탈취
  cases: |-
    - [실제 사고] Citrix Bleed 세션 토큰 탈취와 LockBit 랜섬웨어(2023-11): 유효한 세션 쿠키를 빼내 비밀번호·MFA 없이 인증 세션을 만든 뒤 랜섬웨어 배포
    - [실제 사고] Electronic Arts 소스 코드 탈취(2021-06): 약 10달러에 산 직원 Slack 세션 쿠키로 사내 Slack에 들어가 IT 지원팀을 속임
  controls: |-
    - 피싱 저항 MFA와 세션·토큰의 장치 결합, 세션·리프레시 토큰 수명 단축과 디바이스 코드 흐름 제한
    - 경계 장비 패치 뒤 활성 세션 강제 종료·지원 첨부 파일의 쿠키 제거, 침해 시 토큰 전체 폐기
    - 같은 세션의 IP·장치 급변과 평소와 다른 위치·장치의 리프레시 토큰 갱신 탐지
  absorbs:
    - id: CL-CA-03
      name: 인증 토큰·세션 쿠키 탈취 및 재사용
      members: [T1528, T1539, T1550.001, T1550.004]
      reason: 토큰·세션 쿠키를 탈취해 비밀번호·MFA 없이 재사용하는 같은 위협(T1528·T1539·T1550)이며 세션 장치 결합·짧은 수명·전체 폐기라는 같은 통제 — 침해 워크로드·CI/CD의 앱·관리 ID 토큰은 문안에 반영

- id: ID-TS-02
  name: Windows·Kerberos 인증 자료 재사용
  summary: 해시·티켓 전달·Kerberoasting·NTLM 릴레이로 AD 특권 계정 인증 도용
  members: [IDT-TS-02.1, IDT-TS-02.2, IDT-TS-02.3]
  basis: 원본 위협분류 'Windows·Kerberos 인증 자료 재사용' 3개 — 같은 통제(레거시 인증 프로토콜 제한·서비스 계정 강한 비밀번호·특권 계정 계층화)로 묶음
  description: |-
    - 온프레미스 AD에서 덤프한 NTLM 해시·Kerberos 티켓을 그대로 제시하거나 서비스 계정 티켓을 오프라인 해독하거나 강제 인증을 중계해 특권 계정으로 인증하는 위협
    - 정상 Windows 인증 흐름이라 구분이 어렵고, 공통 로컬 관리자 비밀번호·RC4 허용·약한 서비스 계정 비밀번호가 있으면 도메인 장악까지 빠르게 번짐
  scenario: |-
    - 일반 도메인 계정으로 서비스 계정 Kerberos 티켓 요청 → RC4를 허용하던 AD에서 오프라인 해독해 특권 계정 획득 → 수천 대에 랜섬웨어 배포·환자 데이터 반출
    - 감염 단말 메모리에서 Windows 자격증명 탈취 → 정상 관리 도구로 다른 시스템에 재사용 → 도메인 관리자 자격증명 확보 후 조직 전체 확산
  cases: |-
    - [실제 사고] Ascension 랜섬웨어(2024-05): RC4를 허용하던 AD에서 Kerberoasting으로 특권 계정을 얻어 수천 대에 랜섬웨어 배포, 환자 560만 명 데이터 반출
    - [실제 사고] NotPetya의 자격증명 탈취·재사용 확산(2017-06): 빼낸 Windows 자격증명을 PsExec·WMIC로 재사용해 도메인 관리자 자격증명까지 넘어가며 확산
  controls: |-
    - 단말별 고유 로컬 관리자 비밀번호·관리 계층 분리, 서비스 계정은 관리형 계정·긴 무작위 비밀번호
    - RC4·NTLM 사용 축소, SMB·LDAP 서명과 채널 바인딩, 외부 SMB·불필요한 인증서 웹 등록 차단
    - NTLM 네트워크 로그인 확산·다수 SPN 티켓 요청·미끼 SPN 요청·DC의 비정상 NTLM 인증 탐지

- id: ID-TS-03
  name: 토큰·티켓·인증서 위조(서명 키 탈취 포함)
  summary: KRBTGT·AD FS·IdP 서명 키·CA 키 탈취로 티켓·SAML·쿠키·인증서 위조
  members: [IDT-TS-03.1, IDT-TS-03.2, IDT-TS-03.3]
  basis: 원본 위협분류 '토큰·티켓 위조' 3개 — 서명 키·인증서를 얻어 인증 증표를 만들어 내는 같은 위협이며 서명 키 보호(HSM)·주기 교체라는 같은 통제 | v4 Lv0 간 통합으로 CL-CA-04(인증 자료 위조(SAML 토큰·쿠키·인증서)) 흡수
  description: |-
    - AD의 KRBTGT·서비스 계정 키, AD FS 토큰 서명 인증서, 클라우드 IdP 서명 키, CA 개인 키를 얻어 임의 사용자의 티켓·SAML 토큰·인증 쿠키·인증서를 만드는 위협
    - 서명이 유효해 MFA·로그인 기록 없이 받아들여지고 비밀번호 변경과 무관하게 키 교체 전까지 접근이 계속되며, 키 하나로 수많은 계정이 뚫림
  scenario: |-
    - 온프레미스 AD FS 토큰 서명 인증서 탈취 → 임의 사용자의 SAML 토큰 위조 → Microsoft 365에 MFA 없이 지속 접근
    - 개발자가 재직 중 확보한 토큰 서명키를 퇴사 후에도 보유 → 정상 로그인 없이 고객 인증 토큰 생성 → 약 8개월간 고객 정보 조회
  cases: |-
    - [실제 사고] SolarWinds 침해 이후 클라우드 장악(2020-12): 온프레미스 AD FS 토큰 서명 인증서를 탈취해 SAML 토큰을 위조하고 Microsoft 365에 지속 접근
    - [실제 사고] 쿠팡 고객 계정 정보 3,367만 건 유출(2025-11): 퇴사한 개발자가 재직 중 확보한 토큰 서명키로 정상 로그인 없이 약 8개월간 고객 정보 조회
  controls: |-
    - 서명 키·CA 개인 키는 HSM·관리형 키 서비스에 보관하고 사람·개발 단말이 키 원본을 갖지 않게 함
    - KRBTGT·서명 인증서 정기 교체와 퇴사·침해 시 즉시 교체, 발급자·대상·키 범위 엄격 검증
    - IdP 발급 기록 없는 SAML 로그인·로그인 없이 쓰인 토큰·DC 아닌 호스트의 복제 요청 탐지
  absorbs:
    - id: CL-CA-04
      name: 인증 자료 위조(SAML 토큰·쿠키·인증서)
      members: [T1606.001, T1606.002, T1649]
      reason: 서명 키·인증서를 얻어 SAML 토큰·쿠키·인증서를 위조하는 같은 위협(T1606)이며 서명 키 HSM 보호·정기 교체라는 같은 통제 — CA 개인 키·인증서 위조(T1649)는 문안에 반영
