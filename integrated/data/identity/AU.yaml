# [AU] 인증 공격 — 재구성 Lv3 (원본 9개 → 4)
- id: ID-AU-01
  name: 비밀번호 대입·자격증명 재사용(열거·기본값 포함)
  summary: 계정 열거 후 스프레이·유출 자격증명·기본 비밀번호로 정상 로그인
  members: [IDT-AU-01.1, IDT-AU-01.2, IDT-AU-02, IDT-AU-05]
  basis: 비밀번호 스프레이(AU-01.1)·유출 자격증명 재사용(AU-01.2)·기본·하드코딩 자격증명(AU-02)은 대입하는 값만 다른 같은 비밀번호 기반 공격이고, 계정·테넌트 열거(AU-05)는 그 앞 단계(표적 선별)이며, MFA·유출 비밀번호 차단·고유 비밀번호·실패 제한이라는 같은 통제를 받음
  description: |-
    - 계정·테넌트를 열거해 표적을 고른 뒤 흔한 비밀번호 스프레이, 인포스틸러·다크웹 유출 자격증명, 바꾸지 않은 기본·하드코딩 비밀번호로 VPN·SaaS·관리 화면에 정상 사용자처럼 로그인하는 위협
    - 계정당 시도가 적어 잠금·경보를 피하고 정상 계정 로그인이라 탐지가 어려우며, MFA가 빠진 테스트·레거시 계정 하나가 그대로 발판이 됨
  scenario: |-
    - 로그인 응답·공개 디렉터리로 유효 계정 열거 → MFA 없는 레거시 테스트 테넌트 계정에 스프레이 → 탈취 계정으로 경영진·보안팀 메일 열람
    - 고객인증시스템 웹 관리자 계정의 기본 비밀번호로 로그인 → 관리 화면에서 고객 정보 대량 조회·반출
  cases: |-
    - [실제 사고] Microsoft 기업 메일 침해(2024-01): MFA 없는 레거시 테스트 테넌트 계정을 비밀번호 스프레이로 탈취해 경영진·보안팀 메일 열람으로 이어짐
    - [실제 사고] LG유플러스 고객정보 29만여 건 유출(2023-01): 고객인증시스템 웹 관리자 계정 비밀번호가 기본값 'admin'으로 설정된 채 방치
  controls: |-
    - 외부 노출 앱·원격 접속·관리 계정 MFA와 유출·흔한 비밀번호 차단·지능형 잠금
    - 설치 즉시 기본 비밀번호 변경·공유 계정 금지, 레거시 인증 차단과 동일 응답·속도 제한
    - 다수 계정 분산 실패·유출 자격증명 일치·처음 보는 위치 로그인 상관 분석

- id: ID-AU-02
  name: MFA 우회(승인 요청 폭탄·SIM 스와핑)
  summary: MFA 푸시 반복·SIM 스와핑·문자 가로채기로 MFA를 넘겨 계정 장악
  members: [IDT-AU-03.1, IDT-AU-03.2]
  basis: MFA 승인 요청 폭탄(AU-03.1)과 SMS·음성 OTP 가로채기·SIM 스와핑(AU-03.2)은 피싱에 약한 MFA 수단(푸시·전화망)을 우회하는 같은 위협이며, 숫자 대조·FIDO2 같은 피싱 저항 인증 전환이라는 같은 통제를 받음
  description: |-
    - 탈취한 비밀번호로 로그인을 반복해 MFA 푸시를 쏟아내 승인을 받아내거나, 통신사 절차를 속여 새 SIM을 발급받고 문자를 가로채 일회용 코드로 계정을 넘기는 위협
    - 사용자가 직접 승인해 MFA 로그상 정상 인증으로 남고, 문자 인증에 묶인 금융·거래소·SNS 계정이 휴대폰 먹통 뒤에야 연달아 털림
  scenario: |-
    - 다크웹에서 산 협력사 비밀번호로 로그인 반복 → 2단계 인증 승인 요청 연속 발송·지원 인력 사칭 연락 → 피로해진 직원 승인으로 내부망 접속
  cases: |-
    - [실제 사고] Uber 내부망 침해(2022-09): 다크웹에서 산 협력사 비밀번호로 로그인을 반복해 2단계 인증 승인 요청을 보냈고 협력사 직원이 결국 승인
    - [실제 사고] KT 가입자 심스와핑 의심 가상자산 탈취(2022-01): 휴대폰이 먹통이 된 뒤 거래소 계정에서 암호화폐가 탈취됐다는 신고가 이어짐
  controls: |-
    - 숫자 대조·위치 표시 MFA 또는 FIDO2 전환과 반복 MFA 요청 제한
    - 고위험 계정의 SMS·음성 OTP·SMS 복구 경로 제거와 공식 계정 번호의 통신사 잠금
    - 반복 거부 뒤 승인·승인 직후 새 MFA 장치 등록과 SIM 변경 직후 재설정·출금 연계 탐지

- id: ID-AU-03
  name: MFA 미적용·레거시 인증 경로 악용
  summary: MFA 없는 원격 접속·SaaS·레거시 경로로 단일 비밀번호 침투
  members: [IDT-AU-03.3]
  basis: 단독 유지 — 대부분 계정에 MFA가 있어도 인벤토리에서 빠진 예외 경로 하나가 전체의 입구가 되는 위협(실제 사고 11건)으로, MFA 예외 집계·레거시 인증 차단·SaaS 도입 시 SSO 연동이라는 고유 통제를 받음
  description: |-
    - MFA가 빠진 VPN·원격 접속 포털·SaaS·테스트 테넌트·레거시 인증 경로를 찾아 비밀번호 하나로 조직 안에 들어가는 위협
    - 대부분 계정에 MFA가 있어도 예외 계정 하나가 전체의 입구가 되며, 예외는 인벤토리에서 빠져 있어 점검에서 누락되기 쉬움
  scenario: |-
    - 탈취 자격증명으로 MFA가 없던 원격 접속 포털에 로그인 → 수일간 내부 탐색 → 랜섬웨어 실행으로 업무 마비
  cases: |-
    - [실제 사고] Change Healthcare 랜섬웨어(2024-02): MFA가 없던 Citrix 원격 접속 포털이 침투 경로가 되어 미국 전역의 청구·자격 확인 업무가 마비됨
    - [실제 사고] Medibank 고객 970만 명 정보 유출(2022-10): 기기 인증서나 사용자 이름·비밀번호만으로 접속되던 VPN으로 침투
  controls: |-
    - 외부 노출 앱·원격 네트워크 접속·관리자 접근 MFA 예외 없이 적용
    - 레거시 인증·앱 비밀번호 차단, 미사용 원격 접속 계정·테스트 테넌트 정리
    - MFA 없이 성공한 로그인 일 단위 집계와 계정 인벤토리·MFA 적용 현황 대조

- id: ID-AU-04
  name: 인증 시스템 취약점 악용(경계 장비·IdP·SSO)
  summary: VPN·게이트웨이 인증 우회와 IdP·SSO 검증 결함으로 로그인 없이 장악
  members: [IDT-AU-04.1, IDT-AU-04.2]
  basis: 원격 접속·경계 장비 인증 우회(AU-04.1)와 IdP·SSO 제품·연동 결함(AU-04.2)은 인증 결정 자체를 깨뜨리는 같은 인증 시스템 취약점 악용이며, KEV 우선 패치·인증 시스템 인벤토리·침해 시 자격증명 전면 교체라는 같은 통제를 받음
  description: |-
    - VPN·원격 접속 게이트웨이·방화벽 관리면의 인증 우회·자격증명 노출 취약점이나 IdP·SSO의 토큰·클레임 검증 결함으로 로그인 없이 장비와 계정을 장악하는 위협
    - 인증 결정 자체가 틀려 MFA·조건부 액세스가 적용되지 않고, 패치 후에도 이미 샌 자격증명·심어진 백도어가 남음
  scenario: |-
    - 경계 장비 인증 우회 제로데이와 명령 주입 연결 악용 → 장비 장악·지나는 사용자 자격증명 수집 → 내부망 접근과 패치 후 재침투
  cases: |-
    - [실제 사고] Ivanti Connect Secure 인증 우회 제로데이 대량 악용(2024-01): 인증 우회와 명령 주입을 연결한 공격이 확산되어 CISA가 첫 긴급 지시로 장비 분리를 명령
    - [실제 사고] FortiGate SSL-VPN 장비 8만 7천 대의 VPN 자격증명 공개 유출(2021-09): 경로 조작 취약점으로 수집된 자격증명 약 50만 건이 공개
  controls: |-
    - KEV 등재 경계 장비·IdP 취약점 우선 패치와 관리 인터페이스 인터넷 노출 금지
    - 연동 앱의 변경 불가 식별자 사용·서명·발급자·대상 검증, 침해 시 장비 재설치와 자격증명 전면 교체
    - 장비 무결성 점검·인증 없는 API 호출과 비정상 토큰 발급자·대상 클레임 탐지
