# 교차 DB 동일 사고 — 통합 사고사례 목록에서 한 행으로 묶는 원본 사례 ID 그룹
#
# 원본 사고 DB는 Lv0마다 따로 만들어져 같은 사고가 여러 DB에 다른 ID로 실려 있다.
# 신원·물리 DB의 '다른 DB 사고 ID' 열(17쌍)은 빌드가 자동으로 묶고, 여기에는 그 밖의 동일 사고를 적는다.
#   - 후보 추출: 사례명 고유어(제품·조직·행위자명) 공유 + 시점(연·월) 근접, 같은 달·공통 브랜드명 공유 쌍
#   - 확정 기준: 같은 피해 조직·같은 공격(같은 캠페인의 같은 시기 보고 포함). 같은 행위자의 다른 공격,
#     같은 취약점의 다른 피해(예: Ivanti 2024-01 대량 악용 vs MITRE 침해), 연구와 실제 악용은 묶지 않음
#   - ID 표기: 클라우드 DB `CL/INC-0001` · OT DB `OT/INC-001`(두 DB가 INC- 접두사를 같이 씀) · SCI-·IDI-·PHI- ·
#     ATLAS `AML.CS0000` · ID 없는 OWASP 인용 사고 `OWASP:사례명(시점)`
#   - 첫 ID가 대표 기록(목록의 사례명·시점·지역·행위자·요약·출처를 가져올 기록)
# 원본 DB의 사고 수 집계(위험 재산정)에는 영향이 없다 — 목록 표시용 묶음
