# [DE] 개발 환경 — 재구성 Lv3 (원본 7개 → 3)
- id: SC-DE-01
  name: 개발자 단말 침해와 개발자 대상 사회공학
  summary: 가짜 채용 과제·악성코드로 개발자 단말을 감염시켜 세션·키 탈취
  members: [SCT-DE-01.1, SCT-DE-01.2]
  basis: 가짜 채용 과제·협업 제안(DE-01.2)은 개발자 단말 감염(DE-01.1)의 진입 수단으로 한 공격 흐름의 연속 단계이며, 개발 단말 EDR·외부 코드 격리 실행·피싱 저항 MFA라는 같은 통제를 받음
  description: |-
    - 가짜 채용 과제·협업 제안으로 개발자에게 악성 코드를 실행시키거나 단말을 감염시켜 SSO 세션 쿠키·SSH 키·클라우드 키·게시 토큰을 빼내고 소스·빌드·운영 시스템에 접근하는 위협
    - MFA를 거친 세션을 재사용해 정상 로그인처럼 보이고, 개발자 권한이 넓을수록 고객 비밀·서명·게시 경로까지 한 번에 이어짐
  scenario: |-
    - 채용 담당자 사칭 → 코딩 과제 저장소 실행·악성 패키지 설치로 단말 감염 → 브라우저 세션·SSH 키·클라우드 자격증명 탈취 → 개발자 권한으로 저장소·운영 시스템 접근
  cases: |-
    - [실제 사고] CircleCI 엔지니어 단말 경유 고객 비밀 유출(2023-01): 노트북 악성코드가 2FA를 거친 SSO 세션을 훔쳐 운영 시스템에 접근, 고객 비밀 전량 교체 권고
    - [실제 사고] Contagious Interview(2023-11): 북한 연계 조직이 가짜 채용 과제·악성 npm 패키지로 정보탈취 악성코드를 감염시킴
  controls: |-
    - 운영·게시 권한 개발자의 전용 관리 단말·피싱 저항 MFA·기기 바인딩 단기 세션
    - 외부에서 받은 코드의 일회용 가상 환경 실행과 업무 단말의 설치 스크립트 차단
    - 세션 재사용 징후·저장소 대량 복제와 단말의 자격증명 파일 접근·외부 전송 탐지

- id: SC-DE-02
  name: IDE 확장·개발 도구·툴체인 오염
  summary: 악성·탈취 IDE 확장과 변조 컴파일러·빌드 파일로 개발 산출물 오염
  members: [SCT-DE-02.1, SCT-DE-02.2, SCT-DE-02.3]
  basis: 악성 IDE 확장·변조 컴파일러·SDK·감염된 프로젝트 빌드 파일은 모두 개발자가 쓰는 도구 체인을 오염시켜 개발자 권한·산출물을 장악하는 같은 위협이며, 승인 도구 허용 목록·버전 고정·서명 검증이라는 같은 통제를 받음
  description: |-
    - 악성 확장을 올리거나 인기 확장의 게시 자격을 빼앗아 악성 버전을 배포하고, 변조 컴파일러·SDK·감염된 빌드 파일을 퍼뜨려 개발자 권한의 코드·비밀과 빌드 산출물을 장악하는 위협
    - 확장은 자동 업데이트로 수십 분 안에 설치 기반 전체에 퍼지고, 변조 도구가 만든 산출물은 소스에 흔적이 없어 리뷰·스토어 심사로 발견되기 어려움
  scenario: |-
    - 확장 게시 자격 탈취 → 정상 CI를 거치지 않은 악성 버전 게시 → 자동 업데이트로 개발자 단말의 자격증명·비밀번호 관리자 수집
    - 비공식 경로로 변조 Xcode 배포 → 개발자가 그 도구로 앱 빌드 → 정상 심사를 거친 앱 수천 개에 정보 수집 코드 탑재
  cases: |-
    - [실제 사고] Nx Console 확장 악성 버전(2026-05): 정상 CI를 거치지 않은 18.95.0이 수십 분 노출되며 1Password·클라우드 자격증명 등을 수집
    - [실제 사고] XcodeGhost(2015-09): 비공식 서버에서 받은 변조 Xcode로 빌드한 iOS 앱 수천 개에 정보 수집 코드가 실려 App Store 심사 통과
  controls: |-
    - 승인 확장·도구 체인 허용 목록과 버전 고정, 공식 배포처·서명·해시 검증 강제
    - 빌드 정의 파일 변경의 코드 소유자 리뷰와 재현 가능 빌드로 산출물 교차 검증
    - 편집기 자식 프로세스·자격증명 파일 접근과 정상 CI 미경유 신규 버전 탐지

- id: SC-DE-03
  name: AI 코딩 도구·MCP·에이전트 스킬 오염
  summary: AI 코딩 도구 숨은 지시·사칭 MCP 서버·스킬로 파괴·반출 유도
  members: [SCT-DE-03.1, SCT-DE-03.2]
  basis: AI 코딩 도구 확장·규칙 파일 변조와 MCP 서버·에이전트 스킬 오염은 개발자가 위임한 에이전트 권한을 악용하는 같은 공격면이며, 도구 허용 목록·버전 고정·고위험 동작 승인이라는 같은 통제를 받음
  description: |-
    - AI 코딩 도구 확장·규칙 파일에 숨은 지시를 넣거나 공식 도구를 사칭한 MCP 서버·에이전트 스킬을 배포해, 에이전트 권한으로 자원 삭제·백도어 생성·데이터 반출을 일으키는 위협
    - 에이전트 도구는 개별 검토 없이 설치·자율 실행되고 지시가 보이지 않는 문자·자연어에 숨어 사람 리뷰·정적 분석으로 잡기 어려움
  scenario: |-
    - 외부 기여로 AI 코딩 확장에 삭제 지시 삽입 → 정식 버전으로 배포 → 개발자 권한의 로컬 파일·클라우드 자원 삭제 시도
    - 공식 MCP 서버와 같은 이름의 패키지로 신뢰 확보 → 악성 버전 전환 → 에이전트가 보내는 메일을 숨은 참조로 반출
  cases: |-
    - [실제 사고] Amazon Q Developer 확장에 삭제 지시 주입(2025-07): 외부 기여로 로컬 파일·AWS 자원 삭제 프롬프트가 1.84.0에 실려 공식 배포됨
    - [실제 사고] postmark-mcp(2025-09): 공식 MCP 서버와 같은 이름의 npm 패키지가 1.0.16에서 에이전트 발송 메일 전량을 숨은 참조로 빼돌림
  controls: |-
    - 공식 게시자·서명이 확인된 AI 도구·MCP 서버·스킬 허용 목록과 버전 고정
    - 자동 실행 옵션 해제, 파괴적 명령·메일 발송·운영 자격증명 사용의 사람 승인
    - 에이전트의 셸·클라우드 CLI 호출 감사와 미승인 외부 통신·보이지 않는 문자 검사
