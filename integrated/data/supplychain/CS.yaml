# [CS] 소비·서드파티 연계 — 재구성 Lv3 (원본 7개 → 5)
- id: SC-CS-01
  name: 무결성·출처 검증 없는 산출물·업데이트 수용
  summary: 해시·서명·출처 검증 없이 산출물·업데이트를 받아 변조를 그대로 실행
  members: [SCT-CS-01]
  basis: 단독 유지 — 상류·전송 구간 변조를 소비 단계에서 걸러낼 마지막 기회를 놓치는 소비자 쪽 결함으로, 실행 전 해시·서명 검증과 배포 정책 강제라는 고유 통제를 받음
  description: |-
    - 내려받은 스크립트·패키지·업데이트의 해시·서명·출처를 검증하지 않는 점을 노려, 상류나 전송 구간에서 바꾼 산출물을 소비자 환경에서 그대로 실행시키는 위협
    - 단독으로는 피해가 없지만 상류 변조를 막을 마지막 단계를 비우며, 내려받아 바로 실행하는 스크립트·자동 업데이트처럼 검증 없는 관행이 넓게 퍼져 있음
  scenario: |-
    - ISP 수준에서 DNS 응답 조작 → 서명·암호화 없이 업데이트를 받는 소프트웨어가 악성 서버에서 파일 수신 → 검증 없이 설치·실행
  cases: |-
    - [실제 사고] StormBamboo ISP 장악으로 소프트웨어 업데이트 가로채기(2024-08): 서명·암호화 없이 업데이트를 받는 소프트웨어들이 조작된 DNS 응답에 따라 악성코드를 설치
    - [공개 취약점] 업데이트 무결성 검증 결함 KEV 등재 2건: Notepad++ CVE-2025-15556, TrueConf CVE-2026-3502
  controls: |-
    - 외부 스크립트·바이너리의 해시·서명 검증 후 실행과 내부 저장소 검증본 사용
    - 잠금 파일·다이제스트 고정과 서명·출처 증명 검증의 배포 정책 강제
    - 내려받아 바로 실행하는 패턴·해시 미고정 참조 점검과 검증 실패·생략 집계

- id: SC-CS-02
  name: MSP·원격 관리·내부 배포 도구 경유 일괄 배포
  summary: MSP 원격 관리·내부 패치 관리 서버 장악으로 다수 단말에 랜섬웨어·와이퍼
  members: [SCT-CS-02.1, SCT-CS-02.2]
  basis: MSP 원격 관리(RMM) 도구 경유 배포(CS-02.1)와 내부 배포·패치 관리 시스템 악용(CS-02.2)은 관리자 권한으로 다수 단말에 코드를 실행하도록 설계된 배포 도구를 장악하는 같은 위협이며, 관리 서버 비노출·대량 배포 2인 승인·오프라인 백업이라는 같은 통제를 받음
  description: |-
    - MSP가 운영하는 원격 관리 서버나 조직 내부의 소프트웨어 배포·패치 관리 서버를 취약점·탈취 자격증명으로 장악해, 정상 배포 기능으로 다수 고객사·전사 단말에 랜섬웨어·와이퍼를 실행하는 위협
    - 공급자 한 곳의 침해가 다수 고객사 동시 피해로 번지고, 관리자 권한의 정상 배포 작업과 구분하기 어려움
  scenario: |-
    - MSP 원격 관리 서버 취약점 연쇄 악용 → 관리 기능으로 고객사 단말에 랜섬웨어 일괄 배포 → 데이터 반출과 동시 암호화
    - 중앙 패치 관리 서버 장악 → 정상 배포 기능으로 와이퍼 배포 → 전산장비 디스크 일괄 파괴
  cases: |-
    - [실제 사고] SimpleHelp RMM 경유 MSP 고객 랜섬웨어(DragonForce)(2025-05): MSP가 운영하던 SimpleHelp 취약점을 연쇄 악용해 고객사 단말에 랜섬웨어 배포
    - [실제 사고] 3·20 전산망 대란(패치 관리 서버 악용)(2013-03): 방송사·금융사의 중앙 패치 관리 서버로 와이퍼를 일괄 배포해 약 4만 8천 대 디스크 파괴
  controls: |-
    - RMM·배포 서버의 인터넷 비노출·관리 전용망과 KEV 취약점 최우선 패치·피싱 저항 MFA
    - 전사·다수 고객 대상 배포의 2인 승인·단계 배포, MSP 접근 범위 계약 제한과 오프라인 백업
    - 다수 단말 대상 일괄 배포·업무 시간 외 작업과 MSP 도구의 보안 기능 중지·백업 삭제 감시

- id: SC-CS-03
  name: 공급업체 위임 권한·연동 토큰 경유 침입
  summary: MSP·공급업체의 위임 관리 권한·원격 지원 계정·연동 토큰으로 여러 고객 환경 접근
  members: [SCT-CS-02.3, SCT-CS-03.1]
  basis: 공급업체 계정·원격 지원 접근 경유 침입(CS-02.3)과 SaaS 연동 앱 OAuth 토큰 탈취(CS-03.1)는 공급업체가 가진 고객 접근 권한을 거쳐 여러 고객에 동시에 닿는 같은 신뢰 관계 악용이며, 공급업체 접근 최소화·토큰 범위 제한·침해 통지 계약이라는 같은 통제를 받음 | v4 Lv0 간 통합으로 CL-IA-06(신뢰 관계(MSP·SaaS 연동) 악용)·ID-IM-04(공급업체·플랫폼 경유 연쇄 계정 탈취) 흡수
  description: |-
    - MSP·클라우드 파트너·IT 관리 SaaS·연동 앱 공급자를 먼저 침해해, 그 업체의 위임 관리 권한·교차 계정 역할·원격 지원 계정·OAuth 토큰으로 여러 고객 환경에 동시에 접근하는 위협
    - 사전에 승인된 신뢰 경로라 고객 쪽 기록에 잘 드러나지 않고 공급업체 공지가 나와야 알게 되며, 고객마다 토큰·비밀을 교체해야 하고 빼낸 데이터 속 비밀이 다음 침해로 이어짐
  scenario: |-
    - 연동 앱 공급자 침해 → 공급자가 보관한 고객 OAuth 토큰 탈취 → 수백 개 조직의 SaaS 데이터 대량 조회·반출 → 데이터 속 클라우드 키로 추가 침해
    - CI/CD 서비스 엔지니어 노트북 악성코드로 SSO 세션 탈취 → 고객 환경변수·토큰·키 반출 → 모든 고객의 저장 비밀 전체 교체
  cases: |-
    - [실제 사고] JumpCloud 명령 프레임워크 악용(암호화폐 고객 표적)(2023-06): IT 관리 SaaS에 들어간 공격자가 고객 단말 명령 기능으로 암호화폐 기업을 노림
    - [실제 사고] Salesloft Drift OAuth 토큰 탈취(Salesforce 데이터 대량 반출)(2025-08): 연동 토큰으로 700곳 이상 조직의 Salesforce 데이터를 반출
  controls: |-
    - 공급업체 위임 관계·접근 범위 최소화와 시스템·시간 제한, 접근 승인·세션 녹화·피싱 저항 MFA
    - 연동 앱의 최소 권한·IP 제한·짧은 만료 토큰과 침해 통지 기한·감사 권한 계약
    - 공급업체 계정·연동 토큰의 접속 기준선 비교와 대량 조회·복제 경보, 공급업체 침해 시 토큰 일괄 폐기
  absorbs:
    - id: CL-IA-06
      name: 신뢰 관계(MSP·SaaS 연동) 악용
      members: [T1199]
      reason: MSP·클라우드 파트너·SaaS 연동 업체를 침해해 위임 권한·교차 계정 역할·OAuth 연동으로 고객 테넌트에 접근하는 같은 신뢰 관계 악용(T1199)이며 공급업체 접근 최소화·연동 토큰 제한이라는 같은 통제 — 공급망 서드파티 연계 단계로 통합
    - id: ID-IM-04
      name: 공급업체·플랫폼 경유 연쇄 계정 탈취
      members: [IDT-IM-05]
      reason: 공급업체 직원 계정·고객용 토큰 장악으로 여러 고객 조직에 연쇄 접근하는 같은 위협(대표 사례 Salesloft Drift가 같은 사고)이며 공급업체 핵심 공급망 분류·침해 시 토큰 일괄 폐기라는 같은 통제

- id: SC-CS-04
  name: 서드파티 웹 스크립트·SDK 변조
  summary: 외부에서 불러오는 웹 스크립트·SDK 변조로 이용자 화면·거래 조작
  members: [SCT-CS-03.2]
  basis: 단독 유지 — 서비스 운영자 서버가 아니라 매번 외부에서 불러오는 스크립트를 바꿔 모든 이용자 화면에서 실행하는 고유 경로로, SRI·CSP·자체 호스팅이라는 고유 통제를 받음
  description: |-
    - 웹·앱이 외부 도메인·CDN에서 매번 불러오는 분석·지갑 연결·SDK 스크립트를 변조해, 그 스크립트를 쓰는 모든 서비스 이용자의 화면에서 코드를 실행하는 위협
    - 서비스 운영자의 서버는 멀쩡해 변조를 알아채기 어렵고, 특정 사이트·사용자에게만 동작하게 표적화하면 탐지가 더 늦어짐
  scenario: |-
    - 스크립트 배포 도메인 인수·등록 계정 탈취 → CDN 스크립트를 지갑 주소 바꿔치기·사기 사이트 이동 코드로 교체 → 수만 개 사이트 이용자에게 실행
  cases: |-
    - [실제 사고] Polyfill.io 도메인 인수 후 악성 스크립트 배포(2024-06): 도메인을 인수한 업체가 스크립트를 바꿔 10만 개 이상 사이트의 모바일 이용자를 사기 사이트로 보냄
    - [실제 사고] AppsFlyer Web SDK 변조(2026-03): 배포 도메인 등록 계정이 탈취되어 약 14시간 동안 지갑 주소를 바꾸는 변조 스크립트가 나감
  controls: |-
    - 외부 스크립트 자체 호스팅·버전 고정과 하위 자원 무결성(SRI), CSP 허용 도메인 제한
    - 중요 거래 내용의 화면과 독립된 경로(하드웨어 지갑 화면·별도 서명 검증) 확인
    - 외부 스크립트 해시·도메인 변경 경보와 결제·지갑·로그인 페이지 스크립트 별도 감시

- id: SC-CS-05
  name: 널리 설치된 서드파티 소프트웨어 취약점의 연쇄 악용
  summary: 기관·금융권 필수·공통 소프트웨어 취약점으로 다수 조직 동시 침해
  members: [SCT-CS-04]
  basis: 단독 유지 — 공공·금융 서비스 이용에 필수로 설치되거나 위탁사가 공통으로 쓰는 소프트웨어가 다수 조직의 공통 공격면이 되는 위협으로, 필수 설치 소프트웨어 인벤토리·불필요 에이전트 제거라는 고유 통제를 받음
  description: |-
    - 공공·금융 서비스 이용에 필수로 설치되거나 위탁사가 공통으로 쓰는 소프트웨어의 취약점을 노려, 그 소프트웨어가 깔린 다수 조직을 한꺼번에 침해하는 위협
    - 사용자가 설치 사실을 모르거나 업데이트가 늦은 경우가 많고, 워터링홀과 결합하면 특정 업종을 골라 노릴 수 있음
  scenario: |-
    - 기관 웹사이트에 워터링홀 설치 → 방문자 PC의 인증 보안 소프트웨어 취약점 악용 → 공공기관·방산·IT 기업 PC 동시 감염
  cases: |-
    - [실제 사고] MagicLine4NX 취약점 악용(국내 기관·기업 침투)(2023-03): 인증 보안 소프트웨어 취약점을 워터링홀과 결합해 약 50개 공공기관·방산·IT 기업 PC를 감염
    - [실제 사고] MOVEit Transfer 대량 악용(급여 위탁사 경유 고객사 피해)(2023-05): 급여 위탁사 한 곳의 침해로 여러 고객사 직원 정보가 함께 유출
  controls: |-
    - 필수 설치 소프트웨어 목록 관리와 미사용 에이전트 제거, 보안 권고 즉시 업데이트·삭제
    - 위탁사 운영 솔루션의 패치 상태·침해 통지 계약 관리와 위탁 데이터 최소화
    - 설치된 서드파티 에이전트·버전의 취약점 대조와 에이전트의 비정상 자식 프로세스 탐지
