# [PB] 게시·배포 — 재구성 Lv3 (원본 7개 → 4)
- id: SC-PB-01
  name: 정상 패키지·확장에 악성 버전 게시
  summary: 탈취한 게시 권한으로 정상 패키지·확장에 악성 버전 게시
  members: [SCT-PB-01]
  basis: 단독 유지 — 공급망 사고가 가장 많이 몰린 결과 지점(실제 사고 29건, 2025~ 15건)으로, 사용자가 이미 신뢰하는 패키지의 새 버전이라는 고유 경로와 신규 버전 숙성·출처 증명 검증이라는 고유 통제를 받음
  description: |-
    - 메인테이너 계정·게시 토큰·CI 게시 경로를 장악해 사용자가 이미 신뢰하는 패키지·확장의 새 버전으로 악성 코드를 배포하는 위협
    - 자동 업데이트·버전 범위로 수 시간 안에 수많은 개발·운영 환경에 설치되고, 짧게 노출돼도 내려받은 곳마다 비밀 탈취·후속 침해가 남음
  scenario: |-
    - 메인테이너 계정 피싱 → 인기 패키지에 지갑 거래 가로채기 코드나 가짜 의존성을 넣은 새 버전 게시 → 자동 업데이트로 수많은 환경에 설치
  cases: |-
    - [실제 사고] chalk·debug 등 18개 패키지 탈취(2025-09): 주간 20억 회 이상 내려받는 패키지에 지갑 거래 가로채기 코드가 실렸다가 약 2시간 만에 복구
    - [실제 사고] axios 메인테이너 계정 탈취(2026-03): 주간 8천만 회 이상 내려받는 axios에 가짜 의존성만 추가해 원격 제어 악성코드를 내림
  controls: |-
    - 신규 버전 숙성 기간 후 도입과 승인된 내부 피드·차단 목록으로 유입 통제
    - 게시자의 신뢰 게시·출처 증명 적용과 소비자의 출처 증명 검증
    - 신규 버전 악성 행위 분석과 소스 태그·출처 증명·게시 경로 등 게시 메타데이터 변화 경보

- id: SC-PB-02
  name: 배포 경로 장악(다운로드·업데이트·전송 구간)
  summary: 다운로드 사이트·업데이트 서버·DNS·CDN 장악으로 설치 파일 바꿔치기
  members: [SCT-PB-02.1, SCT-PB-02.2, SCT-PB-02.3]
  basis: 공식 다운로드 사이트·미러 교체(PB-02.1)·업데이트 채널 장악(PB-02.2)·전송 경로 가로채기(PB-02.3)는 장악 지점만 다른 같은 배포 인프라 침해이며, 배포 서버와 분리된 서명·클라이언트 서명 검증·내부 검증 후 배포라는 같은 통제를 받음
  description: |-
    - 공식 다운로드 사이트·미러·업데이트 서버를 침해하거나 ISP·DNS·배포 도메인·CDN을 장악해, 정상 경로로 받는 설치 파일·업데이트·웹 스크립트를 악성 버전으로 바꾸는 위협
    - 업데이트는 사람 확인 없이 높은 권한으로 설치되고, 체크섬 페이지까지 함께 바뀌거나 유효 인증서로 서명돼 발견까지 며칠~수개월 노출됨
  scenario: |-
    - 국내 ERP 업데이트 서버 장악 → 자동 업데이트로 방산·제조 기업 시스템에 백도어 배포
    - 호스팅 업체 수준 침해로 업데이트 트래픽 가로채기 → 서명을 검증하지 않는 업데이터가 표적에게 악성 설치 파일 실행
  cases: |-
    - [실제 사고] Andariel 국내 ERP 업데이트 서버 악용(Xctdoor)(2024-05): 업데이트 서버를 장악해 방산·제조 기업 시스템에 백도어를 설치
    - [실제 사고] Notepad++ 업데이트 경로 가로채기(Lotus Blossom)(2025-06): 업데이트 트래픽을 가로채 서명 검증을 하지 않던 업데이터가 악성 설치 파일을 실행
  controls: |-
    - 서명 키와 배포·업데이트 서버 분리, 클라이언트의 서명·롤백 방지 검증(TUF 등)
    - 설치 파일·업데이트의 내부 검증 후 단계 배포, 웹 스크립트 자체 호스팅·SRI와 도메인 잠금
    - 배포 서버 파일 무결성 감시와 서명자·해시·DNS 응답·업데이트 직후 연결 이상 탐지

- id: SC-PB-03
  name: 서명 키 탈취와 서명·출처 검증 우회
  summary: 탈취·위조한 서명 키로 악성코드를 정상 제품처럼 서명하거나 검증 우회
  members: [SCT-PB-03.1, SCT-PB-03.2]
  basis: 서명 키·인증서 탈취(PB-03.1)와 서명·출처 검증 우회(PB-03.2)는 모두 서명·출처 증명이라는 신뢰 판단 기준을 무력화하는 같은 위협이며, HSM 키 보관·파이프라인 한정 서명·서명자 신원 검증 정책이라는 같은 통제를 받음
  description: |-
    - 공급사의 코드 서명 키·인증서를 탈취하거나 서명 시스템에 악성 파일을 제출해 악성코드를 정상 제품처럼 서명하고, 서명자·빌드 주체를 확인하지 않는 검증 허점으로 위조 산출물을 통과시키는 위협
    - 서명은 보안 제품·운영체제 신뢰 판단의 기준이라 탐지를 피하고, 유출된 펌웨어 키는 폐기가 어려워 장기간 악용됨
  scenario: |-
    - 공급사 내부 침해로 펌웨어·코드 서명 키 반출 → 키 공개 또는 악성코드 서명 → 서명을 신뢰하는 단말·보안 제품이 정상으로 판단해 실행
  cases: |-
    - [실제 사고] MSI 펌웨어·Intel BootGuard 서명 키 유출(2023-05): 랜섬웨어 조직이 펌웨어 서명 키·BootGuard 서명 키를 공개해 폐기가 어려운 장기 위험을 남김
    - [실제 사고] Flame 인증서 위조와 Windows Update 위장(2012-05): MD5 충돌로 마이크로소프트 인증서를 위조하고 Windows Update로 위장해 확산
  controls: |-
    - 서명 키의 HSM·KMS 보관과 승인된 빌드 파이프라인에서만 서명 요청
    - 서명자 신원·빌드 플랫폼·소스 저장소를 정책으로 지정한 검증과 실패 시 배포 차단
    - 출처 없는 서명 요청 경보, 투명성 로그 감사와 키 유출 시 즉시 폐기·재발급

- id: SC-PB-04
  name: 패키지 레지스트리·아티팩트 저장소 침해·결함
  summary: 레지스트리·아티팩트 저장소 침해·결함으로 생태계 패키지 일괄 변조
  members: [SCT-PB-04]
  basis: 단독 유지 — 개별 패키지가 아니라 생태계·조직 전체에 산출물을 공급하는 저장소 자체를 침해하는 위협으로, 같은 버전 덮어쓰기 금지·사내 저장소 경유·소비자 해시 고정이라는 고유 통제를 받음
  description: |-
    - 공개 레지스트리·프로젝트 배포 인프라·사내 아티팩트 저장소를 침해하거나 권한 검증 결함을 이용해, 저장된 패키지·산출물을 바꾸거나 남의 패키지를 덮어쓰는 위협
    - 레지스트리 하나가 생태계 전체나 조직의 모든 빌드에 산출물을 공급해 영향 범위가 가장 넓고, 사내 저장소는 외부 노출·패치 지연이 흔함
  scenario: |-
    - 프로젝트 공식 사이트·배포 인프라 침해 → 설치 도구를 리버스 셸을 여는 버전으로 교체 → 수개월간 내려받은 사용자 감염
  cases: |-
    - [실제 사고] PEAR 웹사이트 침해(go-pear.phar 교체)(2019-01): 공식 사이트의 설치 도구가 리버스 셸을 여는 버전으로 약 6개월간 바뀌어 있었음
    - [실증] Composer(Packagist) 명령 주입 결함(2021-04): 레지스트리 서버를 장악해 모든 PHP 패키지를 바꿀 수 있었음이 보고됨
  controls: |-
    - 사내 저장소 내부망 배치·익명 접근 차단, 게시·소비 권한 분리와 같은 버전 덮어쓰기 금지
    - 외부 패키지의 사내 저장소 경유 반입과 잠금 파일 해시 재검증
    - 저장소 KEV 취약점·인터넷 노출 점검과 저장 산출물 해시 정기 대조·대량 삭제 감사
