# [BD] 빌드·CI/CD — 재구성 Lv3 (원본 8개 → 4)
- id: SC-BD-01
  name: 오염된 파이프라인 실행(PPE)
  summary: 외부 PR·탈취 쓰기 권한으로 파이프라인 코드를 실행해 비밀·게시 자격 탈취
  members: [SCT-BD-01.1, SCT-BD-01.2]
  basis: 외부 PR로 권한 있는 워크플로 실행(BD-01.1)과 쓰기 권한으로 워크플로 변조(BD-01.2)는 진입 수단만 다른 같은 오염된 파이프라인 실행(OWASP CICD-SEC-4)이며, 워크플로 권한 최소화·보호 환경 분리·워크플로 변경 감시라는 같은 통제를 받음 | v4 Lv0 간 통합으로 CL-EX-04(CI/CD 파이프라인 오염) 흡수
  description: |-
    - 포크 PR·브랜치 이름 같은 외부 입력으로 pull_request_target·스크립트 주입 결함을 건드리거나 탈취한 쓰기 권한으로 CI 설정·워크플로를 바꿔, 저장소 권한으로 도는 파이프라인에서 코드를 실행하는 위협
    - 실행된 코드가 게시 토큰·OIDC 역할·클라우드 배포 키·저장소 비밀에 닿아 정상 게시 주체 명의의 악성 버전 게시와 클라우드 계정 침해로 이어지고, 수천 개 저장소에 동시 적용되기도 함
  scenario: |-
    - PR 브랜치 이름을 셸에 넣는 워크플로에 주입 → 권한 있는 작업에서 코드 실행·캐시 오염 → 릴리스 단계에서 채굴기가 든 버전 게시
    - 탈취한 토큰으로 봇 명의 워크플로 커밋 → 다수 저장소의 다음 실행에서 비밀 전체 직렬화·외부 전송
  cases: |-
    - [실제 사고] Ultralytics PyPI 침해(2024-12): PR 브랜치 이름을 그대로 셸에 넣는 결함과 캐시 오염으로 채굴기가 든 8.3.41·8.3.42가 게시됨
    - [실제 사고] Megalodon(2026-05): 6시간 동안 저장소 5,561개에 build-bot·ci-bot 명의로 꾸민 악성 커밋 5,718건을 넣어 30여 종의 비밀을 수집
  controls: |-
    - 권한 있는 트리거에서 PR 코드 미실행, 외부 입력의 환경변수 처리와 읽기 전용 기본 토큰
    - 게시 작업의 보호 환경 분리, 워크플로 경로 코드 소유자 리뷰·브랜치 보호
    - 워크플로 정적 점검과 워크플로 변경 커밋·비밀 직렬화·외부 전송 감시
  absorbs:
    - id: CL-EX-04
      name: CI/CD 파이프라인 오염
      members: [T1677]
      reason: CI 설정 조작·포크 PR로 파이프라인에서 코드를 실행하고 비밀을 탈취하는 같은 오염된 파이프라인 실행(T1677)이며 PR 코드 미실행·워크플로 권한 최소화라는 같은 통제 — 클라우드 배포 권한(OIDC 역할·액세스 키) 탈취는 문안에 반영

- id: SC-BD-02
  name: 빌드 환경 침해와 산출물 변조(빌드 주입·캐시·러너)
  summary: 빌드 서버·캐시·자체 호스팅 러너 장악으로 정식 서명 산출물에 백도어
  members: [SCT-BD-02.1, SCT-BD-02.2, SCT-BD-02.3]
  basis: 빌드 서버 침해(BD-02.1)·빌드 캐시 오염(BD-02.2)·자체 호스팅 러너 장악(BD-02.3)은 소스는 깨끗한 채 빌드 과정에서 산출물을 바꾸는 같은 빌드 과정 침해(SLSA E)이며, 격리된 일회용 빌드·캐시 범위 분리·재현 빌드라는 같은 통제를 받음
  description: |-
    - 빌드 서버를 장악해 컴파일 직전 소스를 바꾸거나, 낮은 권한 작업에서 빌드 캐시를 오염시키고 상주형 러너를 장악해 정식 서명 산출물에 백도어를 넣는 위협
    - 저장소 소스와 게시 워크플로가 정상이라 리뷰·출처 증명·고객 서명 검증을 모두 통과하고, 정식 업데이트로 전 고객에게 배포됨
  scenario: |-
    - 공급사 개발망 빌드 환경 장악 → 빌드 중 소스를 바꾸거나 산출물에 백도어 삽입 → 정식 서명 업데이트로 고객 수백만 대에 설치
    - 포크 PR로 릴리스 작업과 같은 키의 캐시 오염 → 릴리스 작업이 캐시 복원 → 러너 메모리의 OIDC 토큰으로 악성 버전 게시
  cases: |-
    - [실제 사고] CCleaner 빌드 침해(2017-09): 개발망 빌드 환경을 장악해 정식 서명된 5.33에 백도어를 넣었고 약 227만 대에 설치
    - [실제 사고] TanStack 침해(2026-05): 포크 PR로 캐시를 오염시킨 뒤 릴리스 작업 중 러너 메모리에서 OIDC 토큰을 꺼냈고 출처 증명까지 정상으로 보임
  controls: |-
    - 격리된 일회용 빌드 환경·러너와 빌드 플랫폼 서명 출처 증명(SLSA Build L3) 검증
    - 릴리스 작업의 캐시 범위 분리, 서명 시스템과 빌드 서버 분리, 빌드 이미지 다이제스트 고정
    - 독립 환경 재현 빌드 해시 비교와 미승인 러너 등록·빌드 중 소스 변경·상주 프로세스 탐지

- id: SC-BD-03
  name: CI/CD 서버·서비스 침해
  summary: 노출된 CI/CD 서버 취약점·CI/CD SaaS 침해로 빌드 경로·고객 비밀 장악
  members: [SCT-BD-03.1, SCT-BD-03.2]
  basis: 자체 운영 CI/CD 서버 취약점 악용(BD-03.1)과 CI/CD·개발 SaaS 공급자 침해(BD-03.2)는 모두 소스·비밀·배포 권한이 모인 CI/CD 시스템 자체를 장악하는 위협이며, 저장 비밀 최소화·단기 자격·노출 축소라는 같은 통제를 받음
  description: |-
    - 인터넷에 노출된 Jenkins·TeamCity의 인증 우회·원격 코드 실행 취약점을 악용하거나 서비스형 CI/CD 공급자를 침해해, 빌드·배포 경로와 맡겨 둔 고객 비밀을 한꺼번에 장악하는 위협
    - 장악한 시스템은 모든 빌드와 고객 배포 경로에 닿아 빌드 주입·내부 침투의 발판이 되고, SaaS 침해는 공급자 공지로만 알 수 있어 대응이 늦음
  scenario: |-
    - 노출된 CI/CD 서버의 인증 우회 취약점 대량 악용 → 서버의 SSH 키·비밀 획득 → 내부망·협력사 시스템으로 이동하거나 빌드 경로 장악
  cases: |-
    - [실제 사고] TeamCity 취약점 대규모 악용(2023-12): 러시아 SVR이 인증 우회 취약점을 대규모로 악용했고 미·영·폴란드 기관이 공급망 공격 가능성을 경고
    - [실제 사고] Travis CI 포크 빌드 비밀 노출 결함(2021-09): 공개 저장소를 포크한 빌드에 원 저장소의 보호된 비밀이 노출되어 비밀 전체 교체를 권고
  controls: |-
    - CI/CD 관리 화면·API 비노출과 KEV 등재 취약점 기한 내 패치
    - 저장 비밀의 외부 비밀 저장소 이전, CI/CD SaaS에는 OIDC 단기 자격만 연동
    - 신규 관리자·토큰·플러그인 감사와 공급자에 맡긴 비밀의 외부 사용 감시·일괄 교체 절차

- id: SC-BD-04
  name: 서드파티 액션·플러그인·빌드 도구 오염
  summary: 침해된 서드파티 CI 액션·빌드 도구로 파이프라인 비밀 대량 탈취
  members: [SCT-BD-04]
  basis: 단독 유지 — 파이프라인이 가져다 쓰는 외부 구성요소(액션·플러그인·스캐너) 하나의 침해가 그 액션을 실행하는 모든 파이프라인으로 즉시 번지는 고유 경로로, 액션 해시 고정·조직 허용 목록이라는 고유 통제를 받음
  description: |-
    - 많은 파이프라인이 쓰는 서드파티 액션·플러그인·보안 스캐너를 침해해 버전 태그를 악성 커밋으로 옮기거나 악성 릴리스를 올려, 이를 실행하는 모든 파이프라인의 비밀을 빼내는 위협
    - 액션은 그 작업의 비밀 전체에 접근하고 태그 참조로 즉시 전파되며, 빼낸 비밀이 다음 도구 침해로 이어져 연쇄 공격이 됨
  scenario: |-
    - 다른 액션 침해로 메인테이너 PAT 획득 → 인기 액션의 버전 태그 전부를 비밀 출력 커밋으로 이동 → 태그로 참조하던 파이프라인 수만 곳의 비밀 노출
  cases: |-
    - [실제 사고] tj-actions/changed-files·reviewdog 액션 연쇄 침해(2025-03): reviewdog 침해로 얻은 PAT로 태그 전부를 비밀 출력 커밋으로 옮겨 약 2만 3천 개 저장소가 영향권
    - [실제 사고] Bitwarden CLI npm 악성 버전(2026-04): 침해된 GitHub Action을 거쳐 악성 버전이 npm에 약 1.5시간 게시됨
  controls: |-
    - 서드파티 액션의 전체 커밋 해시 고정과 조직 차원 허용 목록
    - 액션 실행 작업에 필요한 비밀·권한만 전달, 침해 공지 시 실행 로그 점검·비밀 일괄 교체
    - 상류 태그 커밋 변경 경보와 로그의 비밀·인코딩 문자열 출력·러너 메모리 접근 탐지
