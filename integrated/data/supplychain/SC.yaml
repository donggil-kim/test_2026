# [SC] 비밀·자격증명 — 재구성 Lv3 (원본 8개 → 3)
- id: SC-SC-01
  name: 코드·이미지·빌드 로그의 비밀 노출
  summary: 코드·이미지·패키지·빌드 로그에 남은 키·토큰을 수집해 무단 접근
  members: [SCT-SC-01.1, SCT-SC-01.2]
  basis: 하드코딩 비밀 노출(SC-01.1)과 CI/CD 로그·산출물 비밀 유출(SC-01.2)은 노출 위치만 다른 같은 비밀 노출 위협이며, 비밀 스캔·비밀 저장소 주입·노출 즉시 폐기라는 같은 통제를 받음
  description: |-
    - 공개 저장소·컨테이너 이미지·배포 패키지에 하드코딩되거나 빌드 로그·아티팩트에 찍힌 키·토큰을 수집해 저장소·레지스트리·클라우드에 접근하는 위협
    - 커밋 이력·이미지 레이어·컴파일 파일에 오래 남고 로그 마스킹은 인코딩으로 쉽게 우회되며, 게시·관리자 권한 토큰이면 공급망 전체 침해로 이어짐
  scenario: |-
    - 외주 개발사가 접근 키를 하드코딩한 소스를 공개 저장소에 게시 → 장기간 노출된 키 수집 → 고객 데이터 서버 접근
  cases: |-
    - [실제 사고] Toyota T-Connect 접근 키 GitHub 공개 노출(2022-10): 외주 개발사가 하드코딩한 접근 키가 약 5년간 노출돼 고객 정보 약 29만 6천 건 접근 가능성
    - [실증] PyPI·Python 관리자 GitHub 토큰 Docker 이미지 노출(2024-06): 빌드 과정에 남은 .pyc로 조직 관리자 토큰이 공개 이미지에 1년 넘게 노출
  controls: |-
    - 비밀 저장소·워크로드 ID 주입과 코드·이미지 하드코딩 금지, 노출 시 즉시 폐기·교체
    - 아티팩트 최소 업로드·포크 PR 빌드의 비밀 미전달, 외주 저장소에도 같은 비밀 관리 기준 적용
    - 커밋·CI 단계 비밀 스캔과 이력·이미지 레이어·로그 정기 전수 점검

- id: SC-SC-02
  name: 파이프라인 비밀·게시 자격 탈취(장기 토큰 포함)
  summary: 러너 비밀·게시 토큰·OIDC 자격을 수집해 정상 게시 주체 명의로 배포
  members: [SCT-SC-02.1, SCT-SC-02.2, SCT-SC-02.3]
  basis: 러너 비밀 수집(SC-02.1)·게시 토큰·OIDC 탈취(SC-02.2)·과다 권한·장기 토큰의 교체 누락(SC-02.3)은 파이프라인 자격증명을 빼내 쓰는 한 공격 흐름이며, 작업 단위 단기 OIDC 자격·최소 권한·전수 교체라는 같은 통제를 받음
  description: |-
    - 빌드 중 실행되는 악성 패키지·액션으로 러너의 환경변수·메모리·클라우드 메타데이터에서 배포 키·게시 토큰을 수집하거나 OIDC 토큰을 꺼내, 정상 게시 주체 명의로 악성 버전을 올리는 위협
    - 신뢰 게시·출처 증명은 '정상 워크플로가 게시했다'는 사실만 보증하고, 과다 권한·장기 토큰과 교체 누락이 피해 범위·기간을 키움
  scenario: |-
    - 변조된 CI 스크립트·악성 패키지가 러너 환경변수·메모리에서 비밀 수집 → 게시 토큰으로 정상 패키지에 악성 버전 게시 → 교체에서 빠진 토큰으로 재침해
  cases: |-
    - [실제 사고] Codecov Bash Uploader 변조(2021-01): 변조된 업로더 스크립트가 고객 CI 환경변수(토큰·키)를 약 두 달간 외부로 보냄
    - [실제 사고] Rspack npm 패키지 탈취 토큰 게시(채굴기)(2024-12): 탈취된 npm 토큰으로 @rspack/core·@rspack/cli 1.1.7이 게시되어 채굴기를 내려받음
  controls: |-
    - 장기 게시 토큰 폐지와 작업 단위 단기 OIDC 자격, 게시 작업의 보호 환경·사람 승인
    - 저장소·작업 단위 최소 권한 토큰과 침해 시 노출 가능 토큰 전수 교체·사용 기록 확인
    - 러너 메모리 읽기·메타데이터 접근·외부 송신 감시와 태그 없는 게시·폐기 토큰 재사용 경보

- id: SC-SC-03
  name: 메인테이너 계정 탈취(피싱·재사용·복구 경로)
  summary: 레지스트리 사칭 피싱·재사용 비밀번호·만료 도메인으로 메인테이너 계정 장악
  members: [SCT-SC-03.1, SCT-SC-03.2, SCT-SC-03.3]
  basis: 피싱(SC-03.1)·자격증명 재사용·세션 탈취(SC-03.2)·만료 도메인 복구 경로 탈취(SC-03.3)는 수단만 다른 같은 메인테이너 계정 탈취이며, 게시 권한 계정의 피싱 저항 MFA·방치 계정 권한 회수라는 같은 통제를 받음
  description: |-
    - 레지스트리 지원팀을 사칭한 2FA 재설정 메일, 유출·재사용 비밀번호·탈취 쿠키, 만료된 메일 도메인 재등록으로 메인테이너·관리자 계정과 게시 토큰을 장악하는 위협
    - 인기 패키지 메인테이너 계정 하나로 주간 수십억 회 내려받는 패키지에 악성 버전이 실리고, OTP 방식 MFA·OAuth 동의는 피싱으로 우회됨
  scenario: |-
    - 레지스트리 오타 도메인으로 2FA 재설정 피싱 → 메인테이너 비밀번호·OTP·토큰 탈취 → 인기 패키지에 악성 버전 게시
    - 방치 계정의 만료 메일 도메인 재등록 → 비밀번호 재설정 메일 수신 → 환경변수를 외부로 보내는 버전 게시
  cases: |-
    - [실제 사고] eslint-config-prettier 등 메인테이너 피싱 계정 탈취(2025-07): npm 지원팀을 사칭한 오타 도메인으로 토큰이 탈취되어 악성 버전이 게시
    - [실제 사고] ctx(PyPI) 만료 도메인 경유 계정 탈취(2022-05): 메인테이너 메일 도메인을 재등록해 계정을 장악하고 AWS 키 등을 외부로 보내는 버전을 게시
  controls: |-
    - 게시·관리 권한 계정의 피싱 저항 MFA(FIDO2·패스키) 의무화와 게시 별도 승인
    - 방치 계정·퇴직자 게시 권한 회수, 메일 도메인 만료 관리와 공식 주소로만 계정 작업
    - 새 위치 로그인·2FA 변경·토큰 신규 발급 직후 게시 상관 분석과 오타 도메인 감시
