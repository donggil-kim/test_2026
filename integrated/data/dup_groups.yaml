# 중복 그룹 — 내용이 겹치지만 관점(대상 자산·공격 경로·통제)이 달라 각 Lv0에 남긴 요약 위협의 묶음 (v4, 결정 V1·V2)
#
# Lv0 간 '사실상 같은 위협'은 주관 Lv0 항목에 흡수(각 문안의 absorbs)하고, 여기에는 흡수하지 않고 관점별로 유지한 항목을 묶는다.
#   - id: 그룹 ID(G01~) · name: 그룹명(공통 위협) · lead: 대표 위협(다른 항목이 참조할 주 항목, 보통 근거가 가장 큰 항목)
#   - items: 구성 위협(대표 포함, 2개 이상) — 한 위협은 한 그룹에만 속함
#   - basis: 통합하지 않고 유지한 근거(무엇이 달라 분리했는지)
# 판정 근거·후보 추출 방법은 docs/v4_중복통합_작업방향.md. 요약 매트릭스 '중복 그룹' 열과 '부록-중복 검토' 시트로 출력된다.
# 고유 위협 수(추정) = 그룹에 속하지 않은 위협 수 + 그룹 수

