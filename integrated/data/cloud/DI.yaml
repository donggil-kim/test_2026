# [DI] 방어 무력화 — 재구성 Lv3 (원본 14행 → 2, T1556.x·T1484.x 중복 행은 지속성·권한 상승으로 통합)
- id: CL-DI-01
  name: 로깅·보안 도구·방화벽 무력화
  members: [T1685, T1685.002, T1686.001]
  basis: 보안 에이전트·탐지 서비스 제거, 감사 로그 중지, 방화벽 규칙 개방은 모두 방어 통제를 꺼서 가시성·차단을 없애는 같은 위협이며 보안 설정 변경 차단(SCP)·즉시 알림이라는 같은 통제를 받음
  description: |-
    - 보안·모니터링 에이전트와 GuardDuty 탐지기를 중지·삭제하고 CloudTrail·M365 감사 로깅을 끄거나 축소하며, 보안 그룹·NSG에 광범위 허용 규칙을 넣어 탐지·차단 통제를 무력화하는 위협
    - 정상 구성 변경처럼 보이고 로그 공백 동안의 메일 탈취·데이터 반출은 사후 추적이 어려우며, 방화벽 개방은 제어 평면 권한을 데이터 평면 접근으로 이어줌
  scenario: |-
    - 탈취 자격증명으로 CLI 인증 → CloudTrail 중지·메일 감사 우회와 탐지 서비스 허용 목록에 공격자 IP 추가 → 보안 그룹을 열어 내부 서버에 셸 접근 후 데이터 유출
  cases: |-
    - [실제 사고] Cosmic Wolf(2023-06): 탈취 자격증명으로 CLI 인증 후 보안 그룹을 바꿔 내부 머신에 셸 접근 경로 개방
    - [실제 사고] Illuminate Education(2021-12): 퇴사자 자격증명으로 AWS 보안 그룹 변경·DB 비밀번호 재설정 후 학생 1,010만 명 데이터 유출
  controls: |-
    - 로깅·탐지 서비스·보안 그룹 변경의 SCP 차단·최소 권한과 즉시 알림
    - 조직 전역 로깅의 불변·별도 계정 저장과 보안 에이전트 변조 방지·자동 복구
    - 광범위 개방 규칙 자동 차단(정책 가드레일)과 네트워크 구성 IaC 드리프트 복원

- id: CL-DI-02
  name: 클라우드 인프라·리소스 계층 변조
  members: [T1578.001, T1578.002, T1578.003, T1578.004, T1578.005, T1666]
  basis: 스냅샷·인스턴스 생성·삭제·되돌리기와 컴퓨팅 구성·리소스 계층 변경은 모두 클라우드 인프라 자체를 조작해 기존 통제를 비껴가는 같은 위협이며 인프라 변경 권한 최소화·가드레일이라는 같은 통제를 받음
  description: |-
    - 스냅샷·새 인스턴스로 기존 접근 통제를 우회하고 인스턴스 삭제·되돌리기로 증거를 지우며, 할당량·리전 설정이나 Organization·구독 계층을 바꿔 통제 밖 공간을 만드는 위협
    - 신규 계정 생성·Organization 탈퇴·구독 하이재킹은 SCP·가드레일과 피해 테넌트 로그를 벗어나게 하며, 대량 삭제는 업무 중단으로 이어짐
  scenario: |-
    - 노출 액세스 키로 EBS 스냅샷과 새 EC2 인스턴스 생성 → 스냅샷을 마운트해 데이터를 수집·반출하거나 할당량 상향 후 대량 채굴 → 인스턴스 삭제·되돌리기로 흔적 제거
  cases: |-
    - [실제 사고] DXC Technologies(2017-11): GitHub에 노출된 AWS 키로 EC2 인스턴스 244대를 기동해 암호화폐 채굴
    - [실제 사고] GitHub 커밋 이력 자격증명 탈취(2020-02): 탈취 자격증명으로 EBS 볼륨 스냅샷과 EC2 인스턴스를 만든 뒤 데이터 반출
  controls: |-
    - 스냅샷·인스턴스·할당량 변경과 Organization·구독 이전 권한 최소화·승인
    - 신규 계정 기준 SCP·로깅 자동 적용, 승인 이미지·리전·인스턴스 유형 허용 목록
    - 종료 방지와 백업·스냅샷 별도 계정 보존, 스냅샷 공유·리소스 생성 급증 알림
