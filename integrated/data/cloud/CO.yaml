# [CO] 수집 — 재구성 Lv3 (원본 14행 + 영향 전술 AZT704 → 6)
- id: CL-CO-01
  name: 클라우드 스토리지·백업 데이터 수집
  members: [T1530, AZT704]
  basis: 스토리지 객체 수집과 soft-delete 객체 복원은 모두 클라우드 스토리지·백업에 남은 데이터를 확보하는 같은 수집 위협이며 공개 차단·복원 권한 통제라는 같은 통제를 받음 (AZT704를 영향 전술에서 이동)
  description: |-
    - S3·Blob·GCS·OneDrive 같은 클라우드 스토리지에 공개·과도 허용 설정이나 탈취 키로 접근해 데이터를 대량 수집하고, soft-delete 상태의 백업·스토리지·Key Vault 객체를 복원해 되살리는 위협
    - 반복된 대규모 유출의 주원인이며, SAS URI·스냅샷 공유로 인증 없이 빼내거나 IAM 밖 익명 접근까지 허용되면 대량 유출로 이어짐
  scenario: |-
    - 코드 저장소·CI 도구에서 스토리지 자격증명 확보 → 버킷 열거 후 GetObject·CopyObject로 백업·소스코드·고객 데이터를 대량 다운로드하거나 soft-delete 객체 복원 → 수 TB 데이터 유출과 갈취
  cases: |-
    - [실제 사고] JetBrains Cadence 침해(2026-09): TeamCity 취약점으로 IAM 자격증명 침해 후 S3 버킷에서 백업·소스코드·고객 자격증명 유출
    - [실제 사고] MobiKwik(2021-03): 침해된 AWS 액세스 키로 S3에 접근해 9,900만 명 데이터·KYC 문서 8.2TB 유출
  controls: |-
    - 퍼블릭 액세스 블록·버킷 정책으로 공개 차단과 SAS·스냅샷 공유 제한
    - soft-delete 복원 권한 최소화·보존 기간 통제와 스토리지 암호화
    - 대량 GetObject·복원 이벤트와 비정상 주체의 대량 다운로드 알림

- id: CL-CO-02
  name: 업무 협업 저장소 데이터 수집
  members: [T1213, T1213.001, T1213.002, T1213.005]
  basis: 정보 저장소 상위기법과 Confluence·SharePoint·메시징 앱은 모두 조직 지식이 모인 협업 저장소에서 문서·자격증명을 수집하는 같은 위협이며 저장소 접근 최소화·DLP라는 같은 통제를 받음 (코드 저장소·CRM·DB는 실제 피해 규모가 커 별도 항목)
  description: |-
    - SharePoint·Confluence 문서와 Teams·Slack 대화에서 아키텍처 도면·절차 문서·테스트 자격증명·사고 대응 논의를 대량 검색·다운로드하는 위협
    - 추가 자격증명과 고권한 계정 단서로 횡적 이동이 쉬워지고, 공격자가 진행 중인 사고 대응을 엿보며 기법을 조정해 대응이 어려움
  scenario: |-
    - 침해 계정으로 SharePoint·Confluence 대량 열람과 Teams·Slack 키워드 검색 → VPN·MFA 등록 안내·헬프데스크 문서·평문 자격증명 수집 → 고권한 계정 탈취와 사고 대응 회피
  cases: |-
    - [ATT&CK 사례] Akira: SharePoint에 접근해 데이터 수집·반출
    - [ATT&CK 사례] Scattered Spider: 피해자 Slack·Teams에서 침입·사고 대응 관련 대화 검색
  controls: |-
    - 사이트·공간·채널 접근 최소화와 외부 공유·공개 공간 점검
    - 문서·메시지 내 비밀 제거와 메시징 DLP·비밀 탐지
    - 대량 열람·다운로드·검색·내보내기 알림

- id: CL-CO-03
  name: 코드 저장소 데이터 수집
  members: [T1213.003]
  basis: 단독 유지 — 소스코드와 하드코딩 비밀이 클라우드 침해로 직결되는 고빈도 사고 유형
  description: |-
    - GitHub·GitLab·Bitbucket 비공개 저장소에 탈취 자격증명·토큰으로 접근해 소스코드와 하드코딩된 클라우드 자격증명을 대량 복제·수집하는 위협
    - 소스코드는 익스플로잇 개발에, 코드 속 비밀은 클라우드 리소스 직접 접근에 쓰여 2차 침해로 이어짐
  scenario: |-
    - CI 서비스 사칭 피싱이나 탈취한 npm·GitHub 토큰으로 저장소 접근 → 저장소 열거·대량 복제 후 비밀 패턴 검색 → 확보한 클라우드 키로 스토리지·DB 접근
  cases: |-
    - [실제 사고] Dropbox GitHub 침해(2022-11): CircleCI 사칭 피싱으로 탈취한 자격증명으로 GitHub 코드 저장소 130개 탈취
    - [ATT&CK 사례] APT41: 침입 중 피해자 Git 저장소를 복제
  controls: |-
    - 저장소 접근 최소화와 토큰 범위 제한
    - 비밀 스캐닝으로 하드코딩 자격증명 제거
    - 대량 복제·다운로드와 탈취 토큰의 비정상 사용 탐지

- id: CL-CO-04
  name: 고객·업무 DB 데이터 수집
  members: [T1213.004, T1213.006]
  basis: CRM과 DB는 모두 고객 PII·금융 데이터가 집중된 정형 데이터 저장소에서 대량 조회·내보내기로 수집하는 같은 위협이며 접근 최소화·대량 조회 알림이라는 같은 통제를 받음
  description: |-
    - Salesforce·Dynamics 365 같은 CRM과 RDS·Azure SQL·Snowflake·MongoDB 등 관리형·클라우드 DB에서 고객 PII·구매 이력·금융 데이터를 대량 조회·덤프하는 위협
    - OAuth 연동 토큰·DB 설정 파일 자격증명·공개 DB로 접근하며, 수집 데이터는 맞춤 피싱·SIM 스와핑·갈취·판매로 이어짐
  scenario: |-
    - 연동 SaaS 침해로 OAuth 토큰을 얻거나 노출 토큰·잔존 자격증명으로 DB 접근 → CRM 레코드·DB 테이블 대량 조회·내보내기 → 고객 정보 유출 후 갈취·하위 조직 공격
  cases: |-
    - [실제 사고] Klue 공급망 침해(2026-06): 고객의 Salesforce 등 연동 OAuth 토큰을 수집하는 코드를 배포해 Salesforce 데이터 유출
    - [실제 사고] FinWise Bank(2024-05): 전 직원이 남아 있던 자격증명으로 RDS DB에 접근, 고객 68만 9천 명의 SSN·금융 데이터 영향
  controls: |-
    - CRM·DB 접근 최소 권한과 프라이빗 엔드포인트·공개 노출 차단
    - 연결 앱 권한 검토와 DB 자격증명의 비밀 저장소화
    - 대량 레코드 조회·내보내기 알림과 DLP

- id: CL-CO-05
  name: 메일 데이터 수집 및 자동 전달
  members: [T1114.002, T1114.003]
  basis: 원격 사서함 수집과 전달 규칙은 모두 클라우드 사서함의 메일을 공격자에게 넘기는 같은 수집 위협이며 사서함 접근 통제·자동 외부 전달 차단이라는 같은 통제를 받음
  description: |-
    - 탈취 자격증명·앱 토큰으로 Graph·EWS를 통해 M365·Workspace 사서함 메일을 키워드 검색·대량 수집하거나, 개별·조직 전역 전달 규칙으로 메일을 외부 계정에 자동 전달받는 위협
    - 전달 규칙은 비밀번호 재설정 후에도 남고 MAPI로 숨길 수 있어, APT 장기 첩보 수집과 BEC의 기반이 되며 탐지가 어려움
  scenario: |-
    - 피싱으로 사서함 계정 침해 → MailSniper·Graph로 결제·계약 키워드 메일 수집과 외부 전달·숨김 규칙 설정 → 비밀번호 변경 후에도 메일을 계속 받아 BEC·첩보에 활용
  cases: |-
    - [실제 사고] IEH Corp 8-K(2026-08): 피싱에서 시작해 공격자가 사서함 내용에 접근
    - [ATT&CK 사례] LAPSUS$: O365 테넌트 수준 전송 규칙으로 조직 입출 메일을 신규 계정으로 전달
  controls: |-
    - 사서함 접근 최소화·앱 토큰 범위 제한과 자동 외부 전달 차단 정책
    - 전달·전송 규칙 정기 감사(숨김 규칙 포함)와 변경 알림
    - Graph·EWS 대량 메일 조회 알림과 의심 세션 폐기

- id: CL-CO-06
  name: 데이터 자동 수집 및 스테이징
  members: [T1119, T1005, T1074.002]
  basis: 자동 수집·로컬 수집·원격 스테이징은 반출 직전에 데이터를 모으는 연속 단계이며 대량 접근 임계값 알림이라는 같은 통제를 받음
  description: |-
    - Graph API·CLI·ETL 파이프라인으로 메일·스토리지·디렉터리 데이터를 자동 수집하거나 VM·컨테이너의 로컬 파일·메모리를 뒤져, 공격자가 만든 인스턴스·중앙 DB에 모아 두는 위협
    - 다수 서비스에서 반복 수집해 유출 규모를 키우고, 스테이징으로 외부 연결 수를 줄여 정상 데이터 처리와 구분이 어려움
  scenario: |-
    - 침해 계정·워크로드에서 Graph·스크립트로 메일·파일·자격증명 자동 수집 → 공격자 생성 인스턴스·중앙 DB에 압축·집결 → 클라우드 계정 간 전송·웹 서비스로 일괄 반출
  cases: |-
    - [ATT&CK 사례] HAFNIUM: MSGraph로 메일·OneDrive·SharePoint 데이터를 자동 수집·반출
    - [ATT&CK 사례] TeamPCP Cloud Stealer: 클라우드·CI/CD·컨테이너 환경의 50여 경로에서 자격증명을 식별·수집
  controls: |-
    - 데이터 접근 권한 최소화와 파이프라인·ETL 권한 통제
    - 워크로드 최소 권한·민감 데이터 암호화와 컨테이너 읽기 전용 파일시스템
    - 대량 조회·압축·집결 임계값 알림과 공격자 생성 인스턴스로의 데이터 이동 탐지
