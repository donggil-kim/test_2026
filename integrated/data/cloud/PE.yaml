# [PE] 지속성 — 재구성 Lv3 (원본 24행 → 5, T1546·T1525는 실행 전술로 이동, T1078·T1133·T1098.003은 각 주 전술로 통합) · v4 Lv0 간 통합으로 3개 이관 → 2
- id: CL-PE-04
  name: 메일·오피스 설정 기반 지속성
  summary: Outlook 양식·규칙과 사서함 위임으로 M365 접근 유지
  members: [T1137.001, T1137.002, T1137.003, T1137.004, T1137.005, T1137.006, T1098.002]
  basis: Office 템플릿·추가 기능, Outlook 양식·홈페이지·규칙, 사서함 위임은 모두 M365 메일·오피스 설정에 접근 수단을 심는 같은 지속성 위협이며 사서함 설정 감사라는 같은 통제를 받음 (T1098.002 지속성·권한 상승 중복 행 통합)
  description: |-
    - 침해한 M365 사서함에 악성 Outlook 양식·홈페이지 URL·규칙을 심거나 Office 템플릿·추가 기능을 변조하고, 다른 계정·서비스 주체에 사서함 위임·가장 권한을 부여해 접근을 유지하는 위협
    - 사서함 설정에 저장되어 단말 재설치·비밀번호 변경 후에도 남으며, 서비스 주체 가장 권한은 사용자 로그인 없는 다수 사서함의 장기 메일 수집으로 이어짐
  scenario: |-
    - 사서함 자격증명·관리자 권한 확보 → Ruler로 Outlook 양식·규칙을 심거나 Add-MailboxPermission·ApplicationImpersonation으로 위임 부여 → 특수 메일 수신 시 코드 실행과 대상 사서함 지속 열람
  cases: |-
    - [ATT&CK 사례] Ruler: Outlook 양식·홈페이지·규칙 악용을 자동화해 지속성 확보
    - [ATT&CK 사례] APT29: 침해한 전역 관리자 계정으로 ApplicationImpersonation 권한을 가진 서비스 주체를 백도어화해 대상 사서함 메일 수집
  controls: |-
    - 사서함 위임·가장 권한(ApplicationImpersonation) 최소화와 정기 검토
    - 사용자 지정 양식·홈페이지·클라이언트 규칙 제한과 사서함 설정 정기 감사
    - 서명된 추가 기능만 허용, 신뢰 위치 외·인터넷 출처 매크로 차단

- id: CL-PE-05
  name: 예약 작업·컨테이너 서비스 기반 지속 실행
  summary: cron·CronJob·상주 컨테이너로 악성 코드 자동 재실행
  members: [T1053, T1053.007, T1543.005]
  basis: VM·클라우드 스케줄러 작업, K8s CronJob, 상주 컨테이너·DaemonSet은 모두 주기·자동 재실행으로 악성 코드를 유지하는 같은 위협이며 스케줄·워크로드 생성 권한 최소화라는 같은 통제를 받음 (T1053 실행·지속성·권한 상승 3개 전술, T1543.005 지속성·권한 상승 2개 전술 중복 행을 지속성으로 통합)
  description: |-
    - VM cron, Automation 일정·WebJob, Kubernetes CronJob에 작업을 등록하거나 restart=always 컨테이너·DaemonSet·정적 파드를 심어 악성 코드를 자동 재실행하는 위협
    - 관리형 스케줄러는 연결된 관리 ID 권한으로 실행되어 작업 정의만 바꿀 수 있는 사용자에게도 권한 상승 경로가 되고, 삭제된 파드도 다음 일정에 재생성됨
  scenario: |-
    - 노출 Jupyter·Redis나 웹 애플리케이션 RCE로 호스트 침투 → cron·CronJob·상주 컨테이너로 채굴기·C2 임플란트 예약 실행 → 재부팅·파드 삭제 후에도 자동 재실행되어 장기 크립토재킹·원격 제어
  cases: |-
    - [실제 사고] Qubitstrike(2023-10): 노출 Jupyter Notebook 침해 후 채굴기를 실행하고 cron 작업으로 지속성 확보
    - [실제 사고] PHP 취약점→cron 실행(2023-06): 클라우드 리눅스 서버를 PHP 애플리케이션 RCE로 침해한 뒤 cron으로 Sliver 실행
  controls: |-
    - 스케줄·자동화 리소스와 CronJob·DaemonSet 생성 권한 최소화, 연결 관리 ID 권한 축소
    - 정책 엔진으로 권한 있는 작업 차단과 정적 파드 경로·docker 소켓 접근 제한
    - 자동화 일정·CronJob·상주 컨테이너 생성과 반복 재생성 파드의 외부 통신 탐지
