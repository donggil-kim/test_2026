# [PE] 지속성 — 재구성 Lv3 (원본 24행 → 5, T1546·T1525는 실행 전술로 이동, T1078·T1133·T1098.003은 각 주 전술로 통합)
- id: CL-PE-01
  name: 백도어 계정 생성 및 자격증명 추가
  members: [T1136.003, T1098.001, T1098.004]
  basis: 신규 계정 생성과 기존 계정·VM에 대한 키·비밀·SSH 키 추가는 모두 원 자격증명 회수와 무관하게 남는 별도 접근 수단을 심는 같은 위협이며 자격증명 발급 권한 최소화라는 같은 통제를 받음 (T1098.x 지속성·권한 상승 중복 행을 지속성으로 통합)
  description: |-
    - 피해 테넌트에 새 사용자·서비스 주체·게스트 계정을 만들거나 기존 IAM 사용자·앱·VM에 공격자의 액세스 키·비밀·인증서·SSH 키를 추가해 별도 접근 경로를 확보하는 위협
    - 추가된 자격증명은 원 계정이 회수돼도 유효하고 MFA를 거치지 않으며, 고권한 대상에 붙이면 곧바로 권한 상승으로 이어짐
  scenario: |-
    - 노출·탈취한 자격증명으로 침투 → 신규 IAM 사용자·서비스 주체를 만들거나 기존 사용자에 두 번째 액세스 키·콘솔 비밀번호·SSH 키 추가 → 원 자격증명 회수 후에도 접근을 유지하며 데이터 유출·삭제
  cases: |-
    - [실제 사고] 노출 장기 자격증명 악용(2023-04): 접근 후 신규 사용자를 만들고 데이터를 유출·삭제한 뒤 랜섬 노트를 남김
    - [ATT&CK 사례] LAPSUS$: 피해 클라우드 인스턴스에 전역 관리자 계정을 생성해 지속성 확보
  controls: |-
    - 계정 생성·자격증명 추가 권한(iam:CreateUser·CreateAccessKey 등) 최소화와 신규 계정 승인 절차
    - 사용자당 액세스 키 수 제한·정기 회수, OS Login·중앙 키 관리로 개별 SSH 키 투입 차단
    - 계정·키 생성 직후 낯선 출발지 사용과 VM 메타데이터 키 변경 탐지

- id: CL-PE-02
  name: 인증 통제 변조(MFA·조건부 액세스·장치 등록)
  members: [T1556.006, T1556.007, T1556.009, T1098.005]
  basis: MFA 해제·조건부 액세스 완화·공격자 장치 등록·하이브리드 ID 백도어는 모두 인증 단계 자체를 공격자에게 유리하게 바꾸는 같은 위협이며 인증 정책 변경 승인·피싱 저항형 MFA라는 같은 통제를 받음 (T1556.x 지속성·방어 무력화·자격증명 접근 3개 전술 중복 행과 T1098.005 지속성·권한 상승 중복 행을 지속성으로 통합)
  description: |-
    - MFA 비활성화·공격자 MFA 수단 등록, 조건부 액세스 신뢰 위치 추가·조건 완화, 공격자 장치의 조직 기기 등록, PTA·AD FS 하이브리드 ID 연동 서버 백도어로 인증 통제를 무력화하는 위협
    - 정상 관리 변경처럼 보이며, 이후 탈취 자격증명이 MFA·정책을 그대로 통과하고 연동 서버 하나의 장악이 페더레이션된 모든 클라우드·SaaS로 이어짐
  scenario: |-
    - 스미싱·피싱으로 자격증명과 MFA 코드 확보 → 공격자 장치를 MFA·조직 기기로 등록하거나 조건부 액세스에 신뢰 위치 추가 → 이후 MFA 없이 반복 로그인하며 민감 리소스 접근
    - 온프레미스 도메인 장악 → Entra Connect·PTA 에이전트·AD FS 서버 침해 → 모든 인증 승인·자격증명 수집과 클라우드 ID 장악
  cases: |-
    - [실제 사고] Atlas Lion(2025-04): 내부 IT 알림을 사칭한 SMS 피싱으로 자격증명·MFA 코드를 수집한 뒤 자신의 Azure VM을 조직 기기로 등록
    - [실제 사고] Storm-0501 클라우드 랜섬웨어(2025-08): 온프레미스 도메인 장악 후 Entra Connect Sync 서버를 침해하고 동기화 계정으로 클라우드 ID 열거
  controls: |-
    - FIDO2 등 피싱 저항형 MFA와 MFA 자가 등록·장치 등록의 추가 인증·관리자 승인
    - MFA·조건부 액세스 변경의 다중 관리자 승인, 'fail open' 금지와 IaC 드리프트 복원
    - 하이브리드 ID 연동 서버(PTA·AD FS·Entra Connect)의 Tier0 격리와 DLL·구성 변경 탐지

- id: CL-PE-03
  name: OAuth 앱 통합 악용
  members: [T1671]
  basis: 단독 유지 — 사용자 동의만으로 권한이 부여되고 동의 계정이 비활성화돼도 남는 SaaS 고유의 지속 경로
  description: |-
    - M365·Google Workspace·Salesforce에서 악성 OAuth 앱·연결 앱을 만들거나 정상 통합을 장악하고 고권한 계정의 동의를 받아 메일·파일·CRM 데이터에 지속 접근하는 위협
    - 앱 토큰은 MFA를 거치지 않고 동의한 계정이 비활성화돼도 유효한 경우가 있어, 사용자 모르게 장기간 자동 반출 통로가 됨
  scenario: |-
    - 동의 피싱·보이스피싱으로 악성 연결 앱 승인 유도 → 앱 서비스 주체에 메일·파일 위임 권한 부여 → 앱 토큰으로 메일·파일·CRM 레코드를 주기적으로 자동 조회·반출
  cases: |-
    - [ATT&CK 사례] Salesforce 데이터 반출 캠페인: 피해자를 속여 악성 연결 앱을 조직 Salesforce 포털에 승인하게 함
  controls: |-
    - 사용자 앱 동의 제한(관리자 승인)과 과도한 위임 권한·비검증 게시자 앱 차단
    - 앱 자격증명·권한 정기 검토와 미사용 통합 제거
    - 신규 앱 등록·고권한 동의와 앱 토큰의 대량 메일·파일 조회 탐지

- id: CL-PE-04
  name: 메일·오피스 설정 기반 지속성
  members: [T1137.001, T1137.002, T1137.003, T1137.004, T1137.005, T1137.006, T1098.002]
  basis: Office 템플릿·추가 기능, Outlook 양식·홈페이지·규칙, 사서함 위임은 모두 M365 메일·오피스 설정에 접근 수단을 심는 같은 지속성 위협이며 사서함 설정 감사라는 같은 통제를 받음 (T1098.002 지속성·권한 상승 중복 행 통합)
  description: |-
    - 침해한 M365 사서함에 악성 Outlook 양식·홈페이지 URL·규칙을 심거나 Office 템플릿·추가 기능을 변조하고, 다른 계정·서비스 주체에 사서함 위임·가장 권한을 부여해 접근을 유지하는 위협
    - 사서함 설정에 저장되어 단말 재설치·비밀번호 변경 후에도 남으며, 서비스 주체 가장 권한은 사용자 로그인 없는 다수 사서함의 장기 메일 수집으로 이어짐
  scenario: |-
    - 사서함 자격증명·관리자 권한 확보 → Ruler로 Outlook 양식·규칙을 심거나 Add-MailboxPermission·ApplicationImpersonation으로 위임 부여 → 특수 메일 수신 시 코드 실행과 대상 사서함 지속 열람
  cases: |-
    - [ATT&CK 사례] Ruler: Outlook 양식·홈페이지·규칙 악용을 자동화해 지속성 확보
    - [ATT&CK 사례] APT29: 침해한 전역 관리자 계정으로 ApplicationImpersonation 권한을 가진 서비스 주체를 백도어화해 대상 사서함 메일 수집
  controls: |-
    - 사서함 위임·가장 권한(ApplicationImpersonation) 최소화와 정기 검토
    - 사용자 지정 양식·홈페이지·클라이언트 규칙 제한과 사서함 설정 정기 감사
    - 서명된 추가 기능만 허용, 신뢰 위치 외·인터넷 출처 매크로 차단

- id: CL-PE-05
  name: 예약 작업·컨테이너 서비스 기반 지속 실행
  members: [T1053, T1053.007, T1543.005]
  basis: VM·클라우드 스케줄러 작업, K8s CronJob, 상주 컨테이너·DaemonSet은 모두 주기·자동 재실행으로 악성 코드를 유지하는 같은 위협이며 스케줄·워크로드 생성 권한 최소화라는 같은 통제를 받음 (T1053 실행·지속성·권한 상승 3개 전술, T1543.005 지속성·권한 상승 2개 전술 중복 행을 지속성으로 통합)
  description: |-
    - VM cron, Automation 일정·WebJob, Kubernetes CronJob에 작업을 등록하거나 restart=always 컨테이너·DaemonSet·정적 파드를 심어 악성 코드를 자동 재실행하는 위협
    - 관리형 스케줄러는 연결된 관리 ID 권한으로 실행되어 작업 정의만 바꿀 수 있는 사용자에게도 권한 상승 경로가 되고, 삭제된 파드도 다음 일정에 재생성됨
  scenario: |-
    - 노출 Jupyter·Redis나 웹 애플리케이션 RCE로 호스트 침투 → cron·CronJob·상주 컨테이너로 채굴기·C2 임플란트 예약 실행 → 재부팅·파드 삭제 후에도 자동 재실행되어 장기 크립토재킹·원격 제어
  cases: |-
    - [실제 사고] Qubitstrike(2023-10): 노출 Jupyter Notebook 침해 후 채굴기를 실행하고 cron 작업으로 지속성 확보
    - [실제 사고] PHP 취약점→cron 실행(2023-06): 클라우드 리눅스 서버를 PHP 애플리케이션 RCE로 침해한 뒤 cron으로 Sliver 실행
  controls: |-
    - 스케줄·자동화 리소스와 CronJob·DaemonSet 생성 권한 최소화, 연결 관리 ID 권한 축소
    - 정책 엔진으로 권한 있는 작업 차단과 정적 파드 경로·docker 소켓 접근 제한
    - 자동화 일정·CronJob·상주 컨테이너 생성과 반복 재생성 파드의 외부 통신 탐지
