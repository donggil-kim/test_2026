# [C2] 명령·제어 — 재구성 Lv3 (원본 1행 → 1)
- id: CL-C2-01
  name: 프록시 경유 C2 은닉
  members: [T1090]
  basis: 단독 유지 — 명령·제어 전술의 유일한 클라우드 연관 기법
  links: [AI-01-09]
  description: |-
    - 침해한 클라우드 VM·CDN이나 Tor·다단 프록시로 C2 트래픽을 중계해 공격자 인프라와 출발지를 숨기는 위협
    - 정상 클라우드 대역·신뢰 경로에 섞여 평판 기반 차단이 어렵고, 프록시 연쇄로 추적이 어려움
  scenario: |-
    - 침해 VM에 중계 도구 설치나 CDN 라우팅 구성 → 감염 워크로드의 C2 통신을 클라우드 대역·Tor로 중계 → 출처를 감춘 채 명령 하달과 데이터 유출·파괴
  cases: |-
    - [실제 사고] Siloscape(2021-06): Tor로 통신을 익명화한 Kubernetes 표적 악성코드
    - [실제 사고] Cyber Toufan 리눅스 파괴(2023-12): Tor 익명화를 사용하며 데이터 유출·파괴
  controls: |-
    - 아웃바운드 필터링·허용 목록과 Tor·알려진 프록시 차단
    - 침해 VM 격리와 CDN 라우팅·중계 트래픽 모니터링
    - 비정상 장기 연결·다단 프록시 연쇄 탐지
