# [LM] 횡적 이동 — 재구성 Lv3 (원본 8행 → 2, T1550.x는 자격증명 접근으로 이동, T1072는 실행으로 통합)
- id: CL-LM-01
  name: 클라우드 원격 연결 및 내부 서비스 악용
  summary: 동기화 계정·네이티브 VM 연결·내부 서비스 취약점으로 확산
  members: [T1021.007, T1021.008, T1210]
  basis: 클라우드 서비스 로그인·네이티브 VM 콘솔 연결·내부 원격 서비스 익스플로잇은 모두 확보한 발판에서 다른 클라우드·온프레미스 자원으로 옮겨 가는 같은 횡적 이동이며 연결 경로 최소화·세분화라는 같은 통제를 받음
  description: |-
    - 동기화 계정·앱 토큰으로 클라우드 콘솔·CLI에 로그인하고 Serial Console·SSM 같은 네이티브 연결로 VM에 접속하거나, vCenter 등 내부 취약 서비스를 익스플로잇해 다른 자원으로 이동하는 위협
    - 온프레미스와 클라우드를 오가는 경로가 되며, 네이티브 VM 연결은 기본 설정에서 root·SYSTEM 수준 접근을 주고 vCenter 침해는 하이퍼바이저 장악으로 이어짐
  scenario: |-
    - 동기화 서버·고권한 동기화 계정 확보 → Azure PowerShell·Graph로 클라우드 로그인 후 SSM·Serial Console로 VM 접속 → 하이브리드 연결을 따라 내부 vCenter·ESXi 익스플로잇과 확산
  cases: |-
    - [ATT&CK 사례] APT29: O365에 동기화된 고권한 온프레미스 계정으로 Azure AD PowerShell을 통해 클라우드로 횡적 이동
    - [ATT&CK 사례] Mini Shai-Hulud: SSM Send-Command로 AWS EC2 인스턴스에 접근·전파
  controls: |-
    - 동기화 서버(Entra Connect) Tier0 보호와 고권한 동기화 계정 최소화
    - 네이티브 VM 연결(Serial Console·Instance Connect·SSM) 권한 최소화와 배스천 중개
    - 내부 서비스 긴급 패치·마이크로세그멘테이션과 K8s 네트워크 정책

- id: CL-LM-02
  name: 내부 피싱 및 공유 콘텐츠 오염
  summary: 내부 메일·Teams 피싱과 공유 파일 오염으로 동료 계정·단말 확산
  members: [T1534, T1080]
  basis: 내부 스피어피싱과 공유 콘텐츠 오염은 모두 조직 내부의 신뢰 관계를 이용해 동료 계정·단말로 확산하는 같은 횡적 이동이며 내부 콘텐츠 검사라는 같은 통제를 받음
  description: |-
    - 침해한 M365·Workspace 계정으로 동료에게 내부 메일·Teams 피싱을 보내거나, OneDrive·SharePoint·코드 저장소의 공유 파일에 악성 매크로·스크립트·위장 바로가기를 심어 확산하는 위협
    - 내부 발신·정상 공유 위치라 필터와 사용자 의심을 쉽게 통과하며, 자주 쓰는 공유 위치의 오염은 반복 재감염으로 이어짐
  scenario: |-
    - 사서함·협업 계정 침해 → 내부 메일·Teams로 악성 링크를 보내고 공유 문서에 악성 매크로 삽입 → 동료가 열면 추가 계정·단말을 장악하고 숨김 규칙으로 회신 은폐
  cases: |-
    - 공개 사고 미확인 — 사고 DB·ATT&CK 클라우드 사례에 매핑된 건은 없음(기법 문서화 수준)
  controls: |-
    - 내부 메일·메시지의 링크·첨부 검사와 침해 의심 계정 격리
    - 공유 저장소 쓰기 권한 최소화·버전 관리와 문서 매크로 차단
    - Teams 외부·게스트 제한과 사용자 신고 체계
