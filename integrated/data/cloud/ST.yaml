# [ST] 은닉 — 재구성 Lv3 (원본 10행 → 3, T1684.x는 초기 침투로 이동, T1078은 초기 침투로 통합)
- id: CL-ST-01
  name: 흔적 삭제 및 메일 은닉 규칙
  members: [T1070, T1070.008, T1564.008]
  basis: 로그·IAM 개체·사서함 데이터 삭제와 메일 숨김 규칙은 모두 공격 흔적과 경보를 지우는 같은 은닉 위협이며 감사 로그 불변 보존·사서함 규칙 감사라는 같은 통제를 받음
  description: |-
    - 작업에 쓴 IAM 사용자·역할, 컨테이너·클러스터 로그, 사서함 메일·내보내기 기록을 삭제하거나 보안 경고·회신 메일을 자동 이동·삭제하는 사서함·전송 규칙을 만들어 흔적을 숨기는 위협
    - 정상 활동처럼 보이도록 일부만 지우며, 조직 전역 전송 규칙은 전사 보안 알림까지 일괄 차단해 탐지와 타임라인 재구성이 어려움
  scenario: |-
    - 사서함 침해 후 BEC·내부 피싱 발송 → 'phish'·'malware' 키워드 회신과 보안 알림을 숨기는 규칙 생성 → 작업 종료 후 사용한 IAM 개체·내보내기 기록·컨테이너 로그 삭제
  cases: |-
    - [ATT&CK 사례] Kali365: 피해자가 보기 전에 이메일 기반 알림을 삭제하도록 메일 규칙을 수정
  controls: |-
    - 감사 로그의 별도 계정·쓰기 방지 중앙 보존과 사서함 감사 로깅·보존(litigation hold)
    - 보안 키워드 이동·삭제 규칙과 조직 전역 전송 규칙 변경 자동 탐지·차단
    - IAM 개체 생성 직후 삭제와 로그 수집 공백 탐지

- id: CL-ST-02
  name: 정상 리소스·계정 명칭 위장
  members: [T1036.005, T1036.010]
  basis: 리소스와 계정 이름을 정상 명명 규칙에 맞춰 섞어 드는 같은 위장 기법이며 명명 규칙·인벤토리 대조라는 같은 통제를 받음
  description: |-
    - 악성 파드·리소스를 kube-system 같은 신뢰 네임스페이스에 정상 명명 규칙대로 만들거나, 새 계정에 admin·backup·IT 지원 같은 정상 계정명을 붙여 무해해 보이게 하는 위협
    - 콘솔·IAM 목록·인벤토리에서 정상 항목과 섞여 운영자가 한눈에 식별하기 어려움
  scenario: |-
    - 침해 계정으로 신규 계정·워크로드 생성 → 서비스 계정·시스템 파드와 유사한 이름·위치로 위장 → 장기 잠복하며 헬프데스크 사칭 피싱이나 채굴·C2 활동 지속
  cases: |-
    - [ATT&CK 사례] Storm-1811: IT 지원·헬프데스크를 사칭하는 Microsoft Teams 계정을 만들어 앱·음성 피싱에 사용
  controls: |-
    - 계정·리소스 명명 규칙과 생성 승인, 서비스 계정·리소스 인벤토리 대조
    - 네임스페이스별 RBAC로 시스템 네임스페이스 생성 제한과 소유 컨트롤러 없는 리소스 탐지
    - 협업 도구 외부·게스트 계정 표시와 제한

- id: CL-ST-03
  name: 미사용 리전 악용
  members: [T1535]
  basis: 단독 유지 — 리전 단위 탐지 커버리지 공백을 노리는 클라우드 고유 은닉 기법
  description: |-
    - 조직이 쓰지 않거나 GuardDuty 같은 탐지 서비스가 없는 클라우드 리전에 인스턴스를 만들어 채굴 등 활동을 숨기는 위협
    - 미사용 리전은 모니터링 대상에서 빠져 과금·리소스 급증으로만 뒤늦게 드러나며, 크립토재킹과 결합하면 장기 과금 피해로 이어짐
  scenario: |-
    - 인프라 관리 계정 탈취 → 탐지 서비스가 없는 미사용 리전에서 대량 인스턴스 기동 → 장기간 채굴 후 과금 이상으로 뒤늦게 발견
  cases: |-
    - 공개 사고 미확인 — 미사용 리전 채굴은 컴퓨트 자원 악용 사고의 한 양상으로 보고됨
  controls: |-
    - SCP·조직 정책으로 허용 리전 외 배포 차단
    - 전 리전 탐지 서비스·로깅 활성화와 리전별 리소스·과금 모니터링
