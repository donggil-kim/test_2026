# [IM] 영향 — 재구성 Lv3 (원본 16행 → 7, AZT704는 수집 전술로 이동)
- id: CL-IM-01
  name: 데이터 암호화(랜섬웨어)
  members: [T1486]
  basis: 단독 유지 — 랜섬웨어의 최종 단계로 업무 영속성을 직접 훼손하는 대표 영향 기법
  description: |-
    - VM·스토리지·DB 데이터를 공격자 키로 암호화해 가용성을 차단하고 복호화 대가로 금전을 요구하는 위협
    - S3 SSE-C 같은 클라우드 네이티브 암호화를 악용하면 데이터 반출 없이도 복구가 막히며, ESXi·vCenter 대량 암호화는 다수 워크로드의 동시 중단으로 이어짐
  scenario: |-
    - 침해 자격증명·ESXi 취약점으로 관리 권한 확보 → 데이터 유출 후 S3 SSE-C·EBS·RDS 스냅샷이나 ESXi 파일시스템을 공격자 키로 암호화 → 백업 삭제와 함께 몸값 요구
  cases: |-
    - [실제 사고] 침해 AWS 자격증명 SSE-C 랜섬(2025-01): S3 SSE-C 암호화를 악용해 데이터를 암호화하고 몸값 요구
    - [실제 사고] ESXi 취약점 랜섬(2024-07): CVE-2024-37085로 도메인 가입 ESXi 관리 권한을 얻어 파일시스템 암호화
  controls: |-
    - 백업의 불변·오프라인 사본과 별도 계정 보존
    - SSE-C 사용 제한·키 관리 통제와 ESXi 접근 강화
    - SSE-C 암호화 요청·대량 암호화 행위 탐지와 신속한 격리·복구 체계

- id: CL-IM-02
  name: 데이터·백업 파괴 및 복구 방해
  members: [T1485, T1485.001, T1490]
  basis: 데이터 삭제·수명주기 정책 악용 삭제·백업과 스냅샷 파괴는 모두 데이터와 복구 수단을 영구히 없애는 같은 파괴 위협이며 불변 백업·삭제 방지라는 같은 통제를 받음
  description: |-
    - 스토리지 객체·버킷·DB·AMI와 스냅샷·백업·복원 지점을 대량 삭제하거나 버킷 수명주기 정책을 '1일 후 전체 삭제'로 바꿔 데이터와 복구 수단을 함께 파괴하는 위협
    - 랜섬·갈취의 압박 수단이 되고 로그 버킷 흔적 제거에도 쓰이며, 백업까지 지워지면 복구 불가능한 사업 중단으로 이어짐
  scenario: |-
    - 탈취 콘솔 자격증명이나 퇴사자의 잔존 권한으로 접근 → 스냅샷·백업·soft-delete 설정을 지워 복구 수단 제거 → S3·EC2·RDS·AMI 대량 삭제나 수명주기 정책 변경으로 데이터 파괴
  cases: |-
    - [실제 사고] Code Spaces(2014-06): 탈취한 AWS 콘솔 자격증명으로 S3 버킷·EC2 인스턴스·AMI·EBS 스냅샷까지 삭제해 복구 수단 제거
    - [실제 사고] Cisco 퇴사자 삭제(2020-12): 퇴사 5개월 후에도 남아 있던 AWS 접근 권한으로 EC2 인스턴스 약 450대 삭제
  controls: |-
    - 버전 관리·객체 잠금·MFA Delete와 백업의 별도 계정 불변 보존
    - 삭제·수명주기 정책·백업 구성 변경 권한 최소화
    - 대량 삭제·백업 삭제·짧은 만료 수명주기 정책 알림과 정기 복구 테스트

- id: CL-IM-03
  name: 계정 접근 차단 및 서비스 중지
  members: [T1531, T1489]
  basis: 계정 접근 제거와 서비스 중지는 모두 랜섬·파괴 직전에 관리자 대응과 서비스 가용성을 끊는 같은 영향 위협이며 변경 승인·긴급 접근 계정이라는 같은 통제를 받음
  description: |-
    - IAM 사용자·역할 삭제, 비밀번호·MFA 강제 변경, SaaS 권한 회수로 정상 사용자·관리자의 접근을 끊거나 DB·메일·백업 서비스와 클라우드 서비스 접근을 중지시키는 위협
    - 랜섬·파괴 직전에 수행되어 피해를 키우며, 관리자 접근까지 끊기면 사고 대응·복구 자체가 어려움
  scenario: |-
    - 고권한 계정 장악 → 백업·DB·메일 서비스 중지와 관리자 계정 삭제·비밀번호 변경 → 대응이 막힌 상태에서 데이터 암호화·삭제
  cases: |-
    - [ATT&CK 사례] Wizard Spider: 네트워크 암호화 전 taskkill·net으로 백업·카탈로그·클라우드 서비스 중지
  controls: |-
    - 계정 삭제·대량 변경과 서비스 중지에 승인·알림
    - 관리자 계정 보호와 분리된 복구 경로, 긴급 접근(break-glass) 계정 보존
    - 다수 계정 비밀번호·MFA 강제 변경과 데이터 저장소 서비스 중지 탐지

- id: CL-IM-04
  name: 서비스 거부 및 콘텐츠 변조
  members: [T1499, T1667, T1491]
  basis: 서비스 거부·메일 폭주·웹 콘텐츠 변조는 모두 외부 노출 서비스의 가용성과 신뢰를 직접 훼손하는 영향 위협이며 노출 서비스 보호(WAF·DDoS·DNS 정리)라는 같은 통제를 받음
  description: |-
    - 클라우드 웹·API·DNS에 자원 고갈·대역폭 플러드를 일으키거나 사서함에 대량 가입 메일을 퍼붓고, 방치 DNS 레코드가 가리키는 리소스를 재생성해 하위 도메인·웹 콘텐츠를 변조하는 위협
    - 자동 스케일링은 DoS를 과금 폭탄으로 바꾸고, 메일 폭주는 보안 경고를 묻어 비싱의 사전 단계가 되며, 변조는 조직 신뢰 하락으로 이어짐
  scenario: |-
    - 대상 사서함에 뉴스레터 자동 가입 폭주 → 정상 메일·보안 경고가 묻힌 사이 지원팀을 가장한 전화로 원격 도구 설치 유도 → 자격증명 탈취와 내부 침투
    - 삭제된 클라우드 리소스를 가리키는 DNS 레코드 발견 → 같은 이름의 리소스 재프로비저닝 → 하위 도메인 콘텐츠 변조·선전
  cases: |-
    - 공개 사고 미확인 — 사고 DB·ATT&CK 클라우드 사례에 매핑된 건은 없음(기법 문서화 수준)
  controls: |-
    - WAF·DDoS 보호·레이트 리밋과 자동 스케일링 상한
    - 미사용 DNS 레코드 정리·리소스 소유권 검증과 웹 콘텐츠 무결성 모니터링
    - 메일 폭주 탐지·격리와 폭주 중 보안 알림의 대체 채널 전달

- id: CL-IM-05
  name: 금전 탈취 및 갈취
  members: [T1657]
  basis: 단독 유지 — 침해의 최종 금전 목적(갈취·BEC·암호화폐 탈취)을 나타내는 영향 기법
  description: |-
    - 침해한 M365·SaaS 계정과 신뢰 주체 사칭으로 부정 이체를 유도하거나, 데이터 암호화·유출 후 공개를 위협해 갈취하고, 암호화폐 지갑·거래 인프라에서 자산을 직접 탈취하는 위협
    - 데이터 파괴 같은 진짜 목적을 가리는 미끼로 쓰이기도 하며, 금전 피해가 즉시 확정되어 회복이 어려움
  scenario: |-
    - 클라우드 운영 직원 단말 침해로 세션 토큰 탈취 → MFA를 우회해 거래·지갑 인프라 접근 → 암호화폐 탈취나 데이터 유출 후 갈취
  cases: |-
    - [실제 사고] BitoPro(2025-05): 탈취한 AWS 세션 토큰으로 MFA를 우회해 1,100만 달러 상당 암호화폐 탈취
    - [실제 사고] ShinyHunters PeopleSoft 갈취(2026-06): Oracle PeopleSoft 제로데이(CVE-2026-35273)로 100여 개 조직을 침해한 뒤 갈취
  controls: |-
    - 송금·결제 변경의 다중 승인·대역외 확인과 BEC·사칭 메일 차단
    - 지갑·결제 자격증명 보호와 사용자 교육
    - 부정 이체·결제 변경 요청과 암호화폐 지갑 파일 탐색 탐지

- id: CL-IM-06
  name: 컴퓨팅 자원 탈취(크립토재킹)
  members: [T1496, T1496.001, T1496.002]
  basis: 컴퓨트 채굴과 대역폭 탈취(프록시재킹·봇넷)는 상위·하위 기법 관계로 장악한 클라우드 자원을 공격자 수익에 쓰는 같은 위협이며 할당량 상한·과금 이상 탐지라는 같은 통제를 받음 (메일·메시징·LLM 서비스 악용은 CL-IM-07로 분리)
  description: |-
    - 노출·약인증 서비스나 탈취 자격증명으로 EC2·컨테이너·클러스터를 대량 가동해 암호화폐를 채굴하거나, 침해 워크로드의 대역폭을 프록시웨어·봇넷 DDoS·토렌트에 쓰는 위협
    - 비용이 피해 계정에 청구되고 정상 워크로드가 지연·중단되며, 피해 조직 IP가 불법 활동에 연루되는 평판 피해로도 이어짐
  scenario: |-
    - 인증 없이 노출된 Ray·Docker·K8s API나 약인증 SSH로 침투 → 채굴 컨테이너·인스턴스를 대량 배포하고 할당량 상향으로 규모 확대 → 채굴과 프록시재킹을 병행하며 과금 피해 누적
  cases: |-
    - [실제 사고] ShadowRay 2.0(2025-11): 인증 없이 노출된 Ray 대시보드·Jobs API를 악용한 크립토마이닝
    - [실제 사고] Labrat(2023-08): GitLab 1-day 취약점으로 침투해 프록시재킹(IPRoyal·ProxyLite)과 채굴 병행
  controls: |-
    - 인스턴스·컨테이너 생성 권한 최소화와 할당량·인스턴스 유형·리전 상한
    - 노출 Docker·K8s·Ray API 비공개·인증 강제와 아웃바운드 필터링
    - CPU·대역폭·과금 이상 알림과 채굴 풀·프록시웨어 통신 차단

- id: CL-IM-07
  name: 관리형 서비스 악용(LLMjacking·SMS 펌핑)
  members: [T1496.003, T1496.004]
  basis: SMS 펌핑과 메일·메시징·관리형 LLM 서비스 악용은 모두 피해자 계정의 관리형 서비스를 대량 호출해 과금을 떠넘기는 같은 위협이며 서비스 권한·발송 상한·호출량 알림이라는 같은 통제를 받음
  description: |-
    - 침해 계정의 SES·SNS·SendGrid·Twilio로 대량 스팸·피싱을 보내거나 Bedrock 같은 관리형 LLM을 무단 호출(LLMjacking)하고, OTP·가입 폼을 악용해 고요율 번호로 SMS를 대량 발생시키는 위협
    - 과금 급증·할당량 소진·채널 과부하가 발생하며, 공격자가 비활성 서비스를 먼저 활성화하기도 해 사용 중인 서비스만 감시해서는 탐지가 어려움
  scenario: |-
    - 탈취 자격증명으로 SES 샌드박스 해제·LLM 모델 활성화 → 리버스 프록시로 LLM 접근을 재판매하거나 대량 피싱 발송 → 피해 계정에 과금·평판 피해 누적
  cases: |-
    - [실제 사고] SES 샌드박스 해제 악용(2025-09): 탈취 자격증명으로 지원 요청을 통해 SES 샌드박스를 풀고 피싱 발송에 악용
    - [실제 사고] Operation Bizarre Bazaar(2026-01): 노출 LLM·MCP 인프라를 노린 상업화된 LLMjacking 캠페인
  controls: |-
    - 메일·메시징·LLM 서비스 권한 최소화와 샌드박스 해제·서비스 활성화 승인
    - OTP·가입 폼 레이트 제한·CAPTCHA와 SMS 발송 상한·지역 제한
    - 발송량·LLM 호출량·과금 이상 알림과 리버스 프록시 접근 패턴 탐지
