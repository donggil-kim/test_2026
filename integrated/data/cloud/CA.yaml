# [CA] 자격증명 접근 — 재구성 Lv3 (원본 19행 → 6) · v4 Lv0 간 통합으로 5개 이관 → 1
- id: CL-CA-06
  name: 메타데이터·컨테이너 API 경유 자격증명 탈취
  summary: 메타데이터·컨테이너 API에서 워크로드 역할 자격증명 탈취
  members: [T1552.005, T1552.007]
  basis: 워크로드에 자동 제공되는 자격증명을 플랫폼 API에서 꺼내는 같은 경로이며 IMDSv2·RBAC 최소화라는 같은 통제를 받음
  description: |-
    - 인스턴스 메타데이터 API나 Docker·Kubernetes API에 접근해 워크로드에 연결된 역할·관리 ID 자격증명, UserData 비밀, 클러스터 시크릿을 탈취하는 위협
    - 외부 노출 웹앱의 SSRF로 원격에서도 도달할 수 있고, 탈취한 역할 자격증명으로 클라우드 API를 호출해 제어 평면 전반으로 확산됨
  scenario: |-
    - 웹앱 SSRF·템플릿 인젝션이나 침해 컨테이너에서 메타데이터 엔드포인트·API 서버에 요청 → 역할 자격증명·서비스 어카운트 토큰·시크릿 확보 → IAM 백도어 설정·크립토재킹·데이터 접근으로 확대
  cases: |-
    - [실제 사고] Hugging Face 자율 에이전트 악용(2026-07): 템플릿 인젝션으로 IMDS 자격증명을 탈취하고 EKS 노드 루트 권한 획득 후 AWS 키 침해
    - [실제 사고] GENESIS PANDA(2025-08): 침해한 클라우드 VM의 IMDS를 조회해 자격증명을 수집하고 제어 평면으로 확산
  controls: |-
    - IMDSv2(세션 토큰) 강제·홉 제한과 SSRF 방지, 워크로드 역할 최소 권한
    - 서비스 어카운트 RBAC 최소화(시크릿 접근 제한)와 Docker·K8s API 비공개·인증 강제
    - 외부 IP에서의 IMDS 자격증명 사용·비정상 시크릿 조회 탐지
