# [CA] 자격증명 접근 — 재구성 Lv3 (원본 19행 → 6)
- id: CL-CA-01
  name: 비밀번호 대입 공격(추측·스프레이·스터핑)
  members: [T1110.001, T1110.003, T1110.004]
  basis: 추측·스프레이·스터핑은 대입 대상 목록만 다른 같은 무차별 대입 기법이며 MFA·지능형 잠금이라는 같은 통제를 받음
  description: |-
    - 비밀번호 추측·스프레이·유출 자격증명 대입으로 SSO·M365·외부 노출 관리 서비스(SSH·RDP·DB)의 유효 계정을 찾아내는 위협
    - 스프레이는 계정당 시도를 조절해 잠금·경보 임계값을 피하고, 모니터링이 약한 테스트·레거시 계정이 뚫리면 크립토재킹·메일 유출의 발판이 됨
  scenario: |-
    - 흔한 비밀번호·유출 목록 확보 → 레거시 인증 엔드포인트·외부 노출 SSH에 느린 속도로 분산 대입 → 성공한 계정으로 크립토마이닝 자원 생성이나 메일·데이터 접근
  cases: |-
    - [실제 사고] USAID 크립토재킹(2025-01): Azure 테스트 환경의 전역 관리자 계정이 스프레이로 침해되어 크립토재킹에 악용
    - [실제 사고] Nobelium/APT29(2023-11~): 레거시 비운영 테넌트 계정을 스프레이로 침해해 Microsoft 임직원 메일 유출
  controls: |-
    - 피싱 저항형 MFA와 레거시 인증 프로토콜 차단
    - 지능형 계정 잠금·유출 비밀번호 차단, 테스트·레거시 테넌트 계정 정리
    - 분산된 인증 실패·다수 계정 대상 동일 비밀번호 시도 탐지

- id: CL-CA-02
  name: 중간자 공격 및 MFA 피로 공격
  members: [T1557, T1621]
  basis: AiTM 중계와 MFA 푸시 반복은 모두 MFA를 통과한 인증 결과를 가로채는 수단이며 피싱 저항형 MFA라는 같은 통제를 받음
  description: |-
    - AiTM 리버스 프록시·캡티브 포털·클러스터 DNS 조작으로 인증 과정을 중계해 자격증명·MFA 응답·세션 쿠키를 가로채거나, MFA 푸시를 반복 발생시켜 피로성 승인을 받아내는 위협
    - 가로챈 세션은 이미 MFA를 통과한 상태라 정상 로그인처럼 보이며, 일반 OTP·푸시 방식 MFA로는 막기 어려움
  scenario: |-
    - 가짜 로그인 포털·침해한 캡티브 포털로 사용자를 AiTM 프록시에 유도하거나 유효 자격증명으로 푸시 반복 → MFA 응답·세션 쿠키 확보 → M365·Okta 세션으로 데이터 접근·유출
  cases: |-
    - [실제 사고] UNC6671 비싱·AiTM(2026-08): 가짜 로그인 포털과 AiTM 인프라로 자격증명·MFA 토큰을 가로채 M365·Okta에서 데이터 유출
    - [실제 사고] CaptiveCrunch / Storm-2945(2026-07): 숙박업 캡티브 포털 인프라를 침해해 중간자 공격 수행
  controls: |-
    - FIDO2 등 피싱 저항형 MFA와 숫자 매칭·푸시 횟수 제한
    - 세션 토큰 바인딩, CoreDNS·CNI 보안 설정
    - AiTM 프록시 도메인 접속·반복 푸시 후 승인 패턴 탐지

- id: CL-CA-03
  name: 인증 토큰·세션 쿠키 탈취 및 재사용
  members: [T1528, T1539, T1550.001, T1550.004]
  basis: 토큰·쿠키 탈취(자격증명 접근)와 탈취 자료 사용(횡적 이동)은 한 공격 흐름의 연속 단계이며 토큰 수명·바인딩이라는 같은 통제를 받음 (T1550.001·.004를 횡적 이동 전술에서 이동)
  description: |-
    - OAuth 앱·관리 ID·서비스 어카운트·CI/CD 토큰과 웹 세션 쿠키를 탈취해, 비밀번호 없이 정상 사용자·서비스 권한으로 SaaS·클라우드 API에 접근하는 위협
    - 토큰과 쿠키는 MFA를 이미 통과한 인증 상태라 다단계 인증이 우회되고, 리프레시 토큰으로 장기 접근이 유지되며 연동 서비스 전반으로 확산됨
  scenario: |-
    - 인포스틸러·AiTM 프록시·CI/CD 러너 메모리·연동 SaaS 침해로 토큰과 쿠키 확보 → 공격자 브라우저·API 클라이언트에 주입해 세션 재사용 → 메일·파일·CRM 조회와 다운스트림 조직 침해로 확대
  cases: |-
    - [실제 사고] Context.ai OAuth 토큰 침해(2026-04): 인포스틸러로 시작해 Context.ai AWS 환경에서 고객 OAuth 토큰을 탈취하고 Vercel 직원 Workspace에 접근
    - [실제 사고] UNC4899 채용 미끼 악성코드(2025-07): 세션 쿠키를 탈취하고 CloudFront·S3의 JavaScript를 변조해 암호화폐 탈취
  controls: |-
    - 토큰·세션 수명 단축과 장치·IP 바인딩, 피싱 저항형 MFA
    - 통합 앱 토큰 범위 제한, 서비스 어카운트 토큰 자동 마운트 최소화
    - 비정상 출발지 토큰 사용·동일 쿠키 재사용 탐지와 의심 세션 즉시 폐기

- id: CL-CA-04
  name: 인증 자료 위조(SAML 토큰·쿠키·인증서)
  members: [T1606.001, T1606.002, T1649]
  basis: 서명 키·CA 키를 확보해 인증 자료를 새로 만들어 내는 같은 방식이며 서명 키 보호·교체라는 같은 통제를 받음
  description: |-
    - 토큰 서명 인증서·쿠키 서명 비밀·CA 개인 키를 확보해 임의 사용자·권한의 SAML 토큰, 세션 쿠키, 인증서를 위조하고 SSO 연동 서비스에 인증하는 위협
    - 위조 자료는 정상 발급분과 구분이 어렵고 비밀번호 재설정·MFA로도 막히지 않으며, 인증서는 유효기간 동안 장기 접근 수단이 됨
  scenario: |-
    - AD FS 토큰 서명 인증서·Key Vault 인증서 탈취 또는 페더레이션 신뢰 추가 → 고권한 계정을 사칭한 SAML 토큰·인증서 생성 → Entra ID·AWS 등 SSO 연동 서비스에 관리자 권한으로 인증
  cases: |-
    - [실제 사고] APT29 M365 공격(2022-08): ADFS 접근으로 골든 SAML 토큰 서명을 이용해 테넌트에 인증
    - [실증] ADFS 서명 키 복구(2026-07): Machine DPAPI에 노출된 토큰 서명 키로 골든 SAML을 통한 MFA·ID 통제 우회 가능성 입증
  controls: |-
    - 토큰 서명 인증서·CA 개인 키의 HSM 보호와 정기 교체, AD FS 서버 Tier0 격리
    - 발행자·서명 인증서·유효기간이 비정상인 토큰과 인증서 발급·내보내기 탐지

- id: CL-CA-05
  name: 저장된 자격증명·비밀정보 수집
  members: [T1552, T1552.001, T1552.008, T1555.006]
  basis: 파일·채팅·비밀 저장소에 보관된 자격증명을 찾아 수집하는 같은 행위이며 비밀 관리·스캐닝이라는 같은 통제를 받음
  description: |-
    - 구성 파일·소스코드·CI 환경변수·배포 기록·협업 채널에 평문으로 남은 자격증명과 클라우드 비밀 저장소의 비밀을 찾아 수집하는 위협
    - 장기 액세스 키·토큰이 정형화된 경로에 남기 쉬워 공급망 악성코드의 주요 수확 대상이 되며, 비밀 저장소 조회 권한 하나가 환경 전반 장악으로 이어짐
  scenario: |-
    - 침해 단말·CI 러너·코드 저장소에서 ~/.aws/credentials·kubeconfig·.env와 채팅 속 키 수집 → 획득 권한으로 Secrets Manager·Key Vault 비밀 일괄 조회 → 스토리지·DB 접근과 데이터 유출
  cases: |-
    - [실제 사고] Uber(2016-10): 비공개 GitHub 저장소 안의 AWS 자격증명으로 백업에 접근해 운전자·사용자 5,700만 명 정보 유출
    - [실제 사고] 외부 노출 앱 자격증명 침해(2026-06): IAM 사용자 생성·파이프라인 변조와 함께 Secrets Manager·Parameter Store에 접근해 RDS 데이터 유출 후 갈취
  controls: |-
    - 코드·이미지·CI·협업 도구 비밀 스캐닝과 하드코딩 금지, 단기 자격증명(OIDC) 전환
    - 비밀 저장소 조회 권한 최소화·비밀별 접근 정책
    - 자격증명 파일 대량 접근·비밀 대량 조회 탐지

- id: CL-CA-06
  name: 메타데이터·컨테이너 API 경유 자격증명 탈취
  members: [T1552.005, T1552.007]
  basis: 워크로드에 자동 제공되는 자격증명을 플랫폼 API에서 꺼내는 같은 경로이며 IMDSv2·RBAC 최소화라는 같은 통제를 받음
  description: |-
    - 인스턴스 메타데이터 API나 Docker·Kubernetes API에 접근해 워크로드에 연결된 역할·관리 ID 자격증명, UserData 비밀, 클러스터 시크릿을 탈취하는 위협
    - 외부 노출 웹앱의 SSRF로 원격에서도 도달할 수 있고, 탈취한 역할 자격증명으로 클라우드 API를 호출해 제어 평면 전반으로 확산됨
  scenario: |-
    - 웹앱 SSRF·템플릿 인젝션이나 침해 컨테이너에서 메타데이터 엔드포인트·API 서버에 요청 → 역할 자격증명·서비스 어카운트 토큰·시크릿 확보 → IAM 백도어 설정·크립토재킹·데이터 접근으로 확대
  cases: |-
    - [실제 사고] Hugging Face 자율 에이전트 악용(2026-07): 템플릿 인젝션으로 IMDS 자격증명을 탈취하고 EKS 노드 루트 권한 획득 후 AWS 키 침해
    - [실제 사고] GENESIS PANDA(2025-08): 침해한 클라우드 VM의 IMDS를 조회해 자격증명을 수집하고 제어 평면으로 확산
  controls: |-
    - IMDSv2(세션 토큰) 강제·홉 제한과 SSRF 방지, 워크로드 역할 최소 권한
    - 서비스 어카운트 RBAC 최소화(시크릿 접근 제한)와 Docker·K8s API 비공개·인증 강제
    - 외부 IP에서의 IMDS 자격증명 사용·비정상 시크릿 조회 탐지
