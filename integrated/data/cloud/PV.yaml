# [PV] 권한 상승 — 재구성 Lv3 (원본 15행 → 3, 지속성·실행 중복 행은 각 주 전술로 통합, T1546은 실행 전술로 이동)
- id: CL-PV-01
  name: 클라우드 역할 추가 및 일시적 권한 상승
  members: [T1098.003, T1548.005]
  basis: 영구 역할 부여와 JIT·가장·역할 전달을 통한 일시적 상승은 모두 IAM 권한 부여 기능으로 권한을 높이는 같은 위협이며 고권한 부여 승인(PIM)이라는 같은 통제를 받음 (T1098.003 지속성·권한 상승 중복 행을 권한 상승으로 통합)
  description: |-
    - 장악한 계정에 IAM 정책·전역 관리자·cluster-admin 역할을 추가하거나, 자동 승인 JIT 활성화·서비스 계정 가장·PassRole 역할 전달로 자신에게 없는 권한을 얻는 위협
    - 정상 권한 위임 기능을 써서 흔적이 적고, 피해 테넌트 밖 공격자 계정에 역할을 주면 계정 생성 없이 내부 작업이 가능해 추적이 어려움
  scenario: |-
    - 탈취 자격증명으로 보유 권한 확인 → AttachUserPolicy·elevateAccess로 관리자 역할을 얻거나 서비스 계정 토큰 생성·PassRole로 고권한 역할 사용 → 테넌트·구독 전체 장악
  cases: |-
    - [실제 사고] DangerDev SES 악용(2024-01): 노출 시크릿으로 침투한 계정에 관리자 역할을 연결하고 신규 사용자·리소스 생성
    - [ATT&CK 사례] Storm-0501: elevateAccess·roleAssignments/write로 피해 구독의 User Access Administrator·Owner 역할 획득
  controls: |-
    - 권한 변경의 승인 워크플로와 고권한 역할 PIM·다중 승인, 자동 승인 JIT 지양
    - 가장·역할 전달(serviceAccountTokenCreator·PassRole) 권한과 대상 역할 범위 제한
    - 정책 연결·elevateAccess·외부 신뢰 주체 추가·cluster-admin 바인딩 탐지

- id: CL-PV-02
  name: 테넌트 정책·페더레이션 신뢰 변조
  members: [T1484, T1484.002]
  basis: 테넌트 정책 변경과 페더레이션 신뢰 변조는 상위·하위 기법 관계로 테넌트 전역 설정을 바꾸는 같은 위협이며 전역 설정 변경 승인이라는 같은 통제를 받음 (권한 상승·방어 무력화 2개 전술 중복 행을 권한 상승으로 통합)
  description: |-
    - 피해 테넌트에 공격자 제어 페더레이션 IdP·SAML 서명 인증서를 추가하거나 도메인 신뢰·Azure Policy·외부 테넌트 위임을 바꿔 임의 사용자로 인증하는 백도어를 만드는 위협
    - 테넌트 전역 설정이라 한 번의 변경이 그 ID를 쓰는 모든 클라우드·SaaS와 AWS Organization 전 계정으로 확대되며, 변경 후 원복해 흔적을 지우기도 함
  scenario: |-
    - 전역 관리자·AD FS 접근 확보 → 새 페더레이션 도메인·ID 공급자 추가나 클레임 규칙 변경 → 자체 서명 SAML 토큰으로 임의 사용자 인증과 장기 백도어 유지
  cases: |-
    - [실제 사고] APT29 M365 표적 캠페인(2022-08): ADFS 접근으로 공격자 통제 IdP를 추가하고 Golden SAML로 인증 토큰 서명
    - [ATT&CK 사례] SolarWinds 침해: APT29가 도메인 페더레이션 신뢰를 바꿔 자체 SAML 서명 인증서로 서명한 토큰을 수용하도록 구성
  controls: |-
    - 페더레이션 신뢰·ID 공급자·테넌트 정책 변경의 다중 관리자 승인과 즉시 알림
    - 정책 코드화(IaC)·드리프트 복원, ID 공급자 목록 정기 검토와 외부 신뢰 허용 목록화
    - 신규 페더레이션 도메인·IdP 추가와 평소와 다른 발행자 토큰 인증 탐지

- id: CL-PV-03
  name: 컨테이너·VM 격리 탈출
  members: [T1611]
  basis: 단독 유지 — 워크로드에서 노드·하이퍼바이저로 넘어가는 공유 인프라 고유의 권한 상승 경로
  description: |-
    - 호스트 파일시스템·docker.sock 마운트, 권한 있는 컨테이너, 커널·하이퍼바이저 취약점을 악용해 컨테이너·VM 격리를 벗어나 기반 노드·호스트를 장악하는 위협
    - 노드 장악은 같은 호스트의 다른 워크로드 침해와 노드 자격증명·서비스 어카운트 토큰을 통한 클러스터·클라우드 계정 확산으로 이어짐
  scenario: |-
    - 오설정 Docker API·취약 애플리케이션으로 컨테이너 침투 → 호스트 마운트·권한 있는 컨테이너·docker.sock으로 노드 탈출 → 노드 자격증명 탈취 후 클러스터 전반 크립토재킹·확산
  cases: |-
    - [실제 사고] Doki 크립토재킹(2020-07): 오설정된 Docker로 침투한 뒤 호스트 마운트를 이용해 호스트로 탈출
    - [실제 사고] Kiss-a-dog(2022-09): 취약한 Docker·Kubernetes 인프라에서 컨테이너 탈출을 시도한 크립토재킹 캠페인
  controls: |-
    - Pod Security Admission으로 privileged·hostPath·호스트 네임스페이스 차단, docker 소켓 마운트 금지
    - 런타임 샌드박스(gVisor 등)와 커널·하이퍼바이저 긴급 패치
    - 컨테이너의 커널 모듈 로드·호스트 네임스페이스 접근·노드 비정상 프로세스 탐지
