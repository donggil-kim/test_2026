# [DS] 탐색 — 재구성 Lv3 (원본 9행 → 2)
- id: CL-DS-01
  name: 클라우드 계정·권한 탐색
  summary: IAM·디렉터리 열거로 고권한 계정과 권한 관계 파악
  members: [T1087.003, T1087.004, T1069.003]
  basis: 이메일 계정·클라우드 계정·그룹 권한 열거는 모두 IAM·디렉터리 조회로 표적 계정을 고르는 같은 정찰 단계이며 열거 권한 최소화·대량 조회 탐지라는 같은 통제를 받음
  description: |-
    - 인증된 세션으로 전역 주소 목록, IAM 사용자·역할·서비스 계정, 그룹·정책·ACL을 열거해 계정 구조와 고권한 계정·권한 관계를 파악하는 위협
    - 열람 위주라 직접 피해는 낮으나 내부 피싱·계정 탈취·권한 상승의 표적 선정에 쓰이며, 정상 조회처럼 보여 탐지가 어려움
  scenario: |-
    - 탈취 자격증명으로 인증 → AzureHound·ROADTools·Pacu로 사용자·역할·그룹 구성원과 정책 대량 열거 → 특권 사용자·과다 권한 계정을 골라 계정 탈취·권한 상승 경로 설계
  cases: |-
    - [ATT&CK 사례] MailSniper: Get-GlobalAddressList로 Exchange·O365 계정명 수집
    - [ATT&CK 사례] Pacu: IAM 사용자·역할·그룹 열거
  controls: |-
    - IAM·디렉터리·주소 목록 열거 권한 최소화와 특권 계정·그룹 가시성 제한
    - 외부·비관리 앱의 디렉터리 접근 제한
    - 단시간 대량 사용자·역할·그룹 조회와 권한 매핑 도구 사용 패턴 탐지

- id: CL-DS-02
  name: 클라우드 자원·서비스 탐색
  summary: API·콘솔 열거로 클라우드 자원·보안 도구·로그 구성 파악
  members: [T1580, T1526, T1538, T1619, T1613, T1654]
  basis: 인프라·서비스·콘솔·스토리지 객체·컨테이너·로그 탐색은 모두 탈취 권한으로 접근 가능한 자원과 방어 수단을 파악하는 같은 정찰 단계이며 열거 권한 최소화·대량 조회 탐지라는 같은 통제를 받음
  description: |-
    - 클라우드 API·CLI·관리 콘솔·Kubernetes API로 인스턴스·스토리지 객체·DB·네트워크·컨테이너와 활성 서비스·보안 도구·로그를 열거해 환경 구성과 공격 대상 가치를 파악하는 위협
    - 열람 위주라 직접 피해는 낮으나 데이터 표적화·방어 무력화의 선행 단계가 되며, 콘솔 열람은 API 호출 흔적이 적어 탐지가 어려움
  scenario: |-
    - 탈취 액세스 키 확보 → Pacu·ScoutSuite로 Describe·List 대량 호출과 버킷·객체·보안 서비스·로그 열거 → 백업·DB·공개 버킷 같은 핵심 자산과 방어 공백을 식별해 데이터 접근·방어 무력화
  cases: |-
    - [실제 사고] SugarCRM 제로데이→AWS(2023-08): EC2 호스트의 액세스 키를 확보한 뒤 Pacu·ScoutSuite로 AWS 환경을 스캔하고 DB 데이터 유출
    - [ATT&CK 사례] Scattered Spider: AWS S3 버킷 등 클라우드 환경을 열거해 백업·DB·스토리지 인프라 식별
  controls: |-
    - 열거·로그 조회 권한 최소화와 콘솔 접근의 피싱 저항형 MFA·출발지 제한
    - 퍼블릭 액세스 블록, Kubernetes API 서버·kubelet·대시보드 비공개와 인증 강제
    - 대량 Describe·List 호출·이상 콘솔 로그인과 정찰 직후 방어 변경의 연계 탐지
