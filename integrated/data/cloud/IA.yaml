# [IA] 초기 침투 — 재구성 Lv3 (원본 9행 + 은닉 전술 T1684 2행 → 7)
- id: CL-IA-01
  name: 공개 애플리케이션 취약점 악용
  members: [T1190]
  basis: 단독 유지 — 실제 사고 79건으로 가장 빈번한 클라우드 진입 경로
  description: |-
    - 클라우드에 노출된 웹앱·API·컨테이너 워크로드·VPN 같은 엣지 장비의 취약점이나 설정 오류를 악용해 최초 진입하는 위협
    - 공개 직후 대량 스캔·악용되어 패치 지연이 곧 침해로 이어지고, 침해한 워크로드의 IAM 역할·메타데이터 자격증명을 통해 클라우드 제어 평면으로 확대됨
  scenario: |-
    - 인터넷 노출 자산의 미패치 취약점·과도하게 열린 보안 그룹 탐색 → 익스플로잇으로 웹셸·코드 실행 확보 → IMDS·워크로드 역할로 클라우드 API를 호출해 DB·비밀 저장소 접근
  cases: |-
    - [실제 사고] LexisNexis 침해(2026-02~03): 미패치 프런트엔드의 React2Shell(CVE-2025-55182)로 AWS에 진입해 과도한 IAM 역할로 운영 DB·Secrets Manager 접근
    - [실제 사고] Silk Typhoon(2025-08): Citrix NetScaler 취약점으로 진입해 웹셸을 설치하고 신뢰 관계를 악용해 클라우드 환경까지 침해
  controls: |-
    - 인터넷 노출 자산 목록화와 긴급 패치 기한 관리, WAF 가상 패치
    - 보안 그룹 최소 개방과 워크로드 역할 최소 권한·IMDSv2 강제
    - 웹 프로세스의 비정상 자식 프로세스와 워크로드 역할의 이례적 API 호출 탐지

- id: CL-IA-02
  name: 원격 관리 인터페이스 노출 악용
  members: [T1133]
  basis: 단독 유지 — 관리 인터페이스 노출로 인한 진입·지속 경로(초기 침투·지속성 반복 행 통합)
  description: |-
    - 전체 개방된 RDP·SSH, VPN, 인증 없는 Docker·kubelet API, 공개된 Kubernetes 대시보드 같은 원격 관리 인터페이스로 진입하거나 접근을 유지하는 위협
    - 탈취 계정이나 인증 없는 노출로 접근해 정상 원격 접속과 구분이 어렵고, 침투 후 공격자가 직접 추가한 원격 경로는 보조 지속 수단이 됨
  scenario: |-
    - 0.0.0.0/0으로 열린 22·3389 포트와 2375·10250 포트, 공개 대시보드 스캔 → 인증 없는 API나 침해된 VPN 자격증명으로 접속 → 파드 내 자격증명 수집과 크립토재킹·데이터 유출·랜섬웨어로 확대
  cases: |-
    - [실제 사고] Tesla Kubernetes 콘솔 노출(2018-02): 인증 없이 공개된 콘솔을 통해 파드 안의 AWS 자격증명이 노출돼 크립토재킹으로 이어짐
    - [실제 사고] TeamPCP 노출 제어 평면 캠페인(2026-02): 인증이 없거나 약한 Docker·Kubernetes API 등 오케스트레이션 관리 인터페이스를 주 진입점으로 사용
  controls: |-
    - 관리 포트 비공개와 배스천·Session Manager·IAP 같은 중개 접근으로 대체
    - API 서버 IP 허용 목록·프라이빗 엔드포인트와 kubelet 익명 인증 비활성화
    - 관리 포트 전체 개방 변경과 외부 출발지 관리 접속 탐지

- id: CL-IA-03
  name: 피싱 기반 클라우드 계정 탈취
  members: [T1566, T1566.002]
  basis: 일반 피싱과 링크형 피싱은 모두 SSO·M365 신원을 가로채는 같은 경로이며 피싱 저항형 MFA·앱 동의 제한이라는 같은 통제를 받음
  description: |-
    - 가짜 로그인 페이지·AiTM 프록시·악성 OAuth 앱 동의·디바이스 코드 인증 악용과 정상 클라우드 공유 링크로 SSO·M365 자격증명과 토큰을 가로채 클라우드 계정에 진입하는 위협
    - AiTM·디바이스 코드 방식은 MFA를 우회하고, 정상 클라우드 저장소·메일 서비스를 쓰면 URL 평판 검사와 메일 필터를 쉽게 통과함
  scenario: |-
    - 정상 클라우드 저장소에 피싱 페이지를 올리고 공유 링크·음성메일 알림 사칭 메일 발송 → 사용자가 자격증명 입력·디바이스 코드 승인·OAuth 앱 동의 → 토큰으로 메일·파일에 접근하고 침해 계정의 메일 서비스로 추가 피싱
  cases: |-
    - [실제 사고] EvilTokens 디바이스 코드 피싱(2026-04): 피싱 서비스형 플랫폼으로 O365 사용자의 디바이스 코드 인증을 가로채 MFA 우회
    - [실제 사고] Payroll Pirates(2026-08): 음성메일 알림을 사칭한 피싱 메일로 시작해 정상 클라우드 서비스를 거치는 리디렉션 체인으로 M365 급여·재무 업무 흐름을 노림
  controls: |-
    - 피싱 저항형 MFA(FIDO2)와 디바이스 코드 흐름 제한 조건부 액세스
    - 사용자 앱 동의 제한(관리자 승인)과 URL 재작성·클릭 시점 검사
    - 불가능 이동 로그인·세션 토큰 재사용·클라우드 메일 발송량 급증 탐지

- id: CL-IA-04
  name: 보이스피싱 및 신뢰 주체 사칭
  members: [T1566.004, T1684.001, T1684.002]
  basis: 음성 피싱·사칭·메일 위조는 모두 신뢰 주체를 가장해 사람과 계정 복구 절차를 속이는 같은 사회공학이며 본인 확인 강화라는 같은 통제를 받음 (T1684를 은닉 전술에서 이동)
  description: |-
    - IT 헬프데스크·임원·협력업체를 사칭한 전화·메신저·위조 메일로 직원과 서비스데스크를 속여, 비밀번호·MFA 재설정, 인증 승인, 송금을 유도하는 위협
    - 기술 통제를 거치지 않고 IdP 계정 복구 절차를 악용해 재설정된 계정이 정상 로그인으로 보이며, AI 음성 복제와 약한 DMARC 설정이 사칭의 신뢰도를 높임
  scenario: |-
    - 정찰로 직원·헬프데스크 정보와 유사 도메인 확보 → 위탁 서비스데스크에 전화해 자격증명·MFA 재설정을 받거나 Teams·위조 메일로 IT 지원 사칭 → SSO 로그인 후 데이터 유출·랜섬웨어 배포·BEC 송금
  cases: |-
    - [실제 사고] Marks & Spencer 침해(2025-02~04): Scattered Spider가 위탁 IT 서비스데스크를 사회공학으로 속여 자격증명을 재설정받아 진입한 뒤 ESXi 환경에 랜섬웨어 배포
    - [실제 사고] Scattered Spider Azure·GCP 침해(2024-09): Azure 건은 비싱과 MFA 등록으로 시작해 클라우드 환경 랜섬 작전으로 이어짐
  controls: |-
    - 비밀번호·MFA 재설정 시 강화된 본인 확인(영상 확인·관리자 승인)과 고권한 계정 별도 절차
    - DMARC p=reject 강제·외부 발신 표식과 위탁 서비스데스크 권한 최소화
    - 재설정 직후 신규 위치 로그인·신규 MFA 장치 등록 탐지

- id: CL-IA-05
  name: 소프트웨어 공급망 침해
  members: [T1195.002]
  basis: 단독 유지 — 실제 사고 47건으로 클라우드 자격증명 대량 수확의 주요 경로
  description: |-
    - 패키지 레지스트리(npm·PyPI)·CI/CD 파이프라인·컨테이너 이미지에 악성코드를 넣어, 이를 설치·빌드하는 개발 단말과 클라우드 워크로드를 일괄 침해하는 위협
    - 신뢰된 의존성으로 실행되어 클라우드 자격증명·K8s 설정·LLM API 키를 대량 수집하며, 한 번의 침해가 하위 조직으로 전파되고 CI 러너의 배포 권한으로 제어 평면까지 확대됨
  scenario: |-
    - 취약한 GitHub Actions·캐시 오염으로 게시 토큰 탈취 → 악성 버전을 레지스트리에 게시 → 설치 즉시 환경변수·자격증명 파일에서 클라우드 키·kubeconfig·CI 토큰을 수확하고 자기 전파
  cases: |-
    - [실제 사고] LiteLLM 공급망 침해(2026-03): TeamPCP가 Trivy의 Actions 설정 오류로 탈취한 게시 토큰으로 악성 버전을 PyPI에 게시해 클라우드 자격증명 등 50여 종 비밀 수집
    - [실제 사고] TanStack 등 npm 100여 개 버전 침해(2026-05): Actions 캐시를 오염시켜 러너 메모리의 OIDC 토큰으로 게시, 자기 전파 웜이 CI/CD 토큰·클라우드 자격증명 탈취
  controls: |-
    - 의존성 버전 고정·해시 검증과 사설 레지스트리 프록시, SBOM·악성 패키지 정보 대조
    - CI 비밀 최소화와 단기 자격증명(OIDC) 전환, 침해 버전 확인 시 관련 비밀 전면 교체

- id: CL-IA-06
  name: 신뢰 관계(MSP·SaaS 연동) 악용
  members: [T1199]
  basis: 단독 유지 — 공급자에 위임된 신뢰 경로를 악용하는 독립 진입 경로
  description: |-
    - MSP·클라우드 파트너·SaaS 연동 업체를 먼저 침해한 뒤 그 업체에 위임된 관리 권한·교차 계정 역할·OAuth 연동으로 고객 테넌트에 접근하는 위협
    - 사전에 승인된 신뢰 경로라 정상 운영 활동과 구분이 어렵고, 한 공급자 침해가 다수 고객 조직으로 동시에 확산됨
  scenario: |-
    - 파트너·SaaS 연동 업체 침해로 OAuth 토큰·API 키·위임 권한 확보 → 신뢰된 앱·파트너로 위장해 고객 테넌트 접근 → 데이터와 그 안의 자격증명을 대량 반출하고 위임 관계로 지속성 확보
  cases: |-
    - [실제 사고] Salesloft Drift 통합 침해(2025-08): UNC6395가 Drift 챗봇 통합의 OAuth 토큰을 탈취해 신뢰된 앱으로 위장, 700여 개 조직의 Salesforce 등에서 데이터와 자격증명 반출
    - [ATT&CK 사례] HAFNIUM: PAM·클라우드 앱·클라우드 데이터 관리 업체의 API 키와 자격증명을 탈취해 하위 고객 환경에 접근
  controls: |-
    - 공급자별 접근 범위 최소화·정기 검토와 사용하지 않는 위임 관계 제거
    - 외부 ID 조건·조건부 액세스로 신뢰 경로 제한과 파트너·교차 계정 역할의 이상 작업 탐지

- id: CL-IA-07
  name: 유효 클라우드 계정 악용
  members: [T1078.001, T1078.004]
  basis: 클라우드 계정과 기본 계정 악용은 같은 '정상 로그인' 위협이며, ATT&CK 4개 전술(초기 침투·지속성·권한 상승·은닉)에 반복된 8행을 초기 침투로 통합
  description: |-
    - 유출·탈취한 IAM 액세스 키·콘솔 비밀번호·서비스 주체 비밀이나 AWS 루트·기본 서비스 계정 같은 기본 계정으로 콘솔·API에 정상 로그인하는 위협
    - 초기 침투부터 지속·권한 상승·은닉까지 한 번에 가능하고 정상 API 호출과 같아 탐지가 어려우며, 기본 계정은 권한이 넓어 노출 즉시 계정·프로젝트 전체 장악으로 이어짐
  scenario: |-
    - 코드·JS 빌드 산출물·공개 버킷의 장기 액세스 키나 인포스틸러 로그로 자격증명 확보 → 정상 사용자로 콘솔·API 로그인 → DB 백업·S3 데이터 유출과 백도어 관리자 생성·GPU 인스턴스 악용
  cases: |-
    - [실제 사고] Otelier 침해(2025-01): 직원 단말의 인포스틸러로 Jira 자격증명을 얻은 뒤 Jira·Bitbucket에서 S3 자격증명을 찾아 8TB 데이터 유출
    - [실제 사고] Beacon(2026-07): 공개 JavaScript 빌드 산출물에 노출된 AWS 액세스 키로 DB 백업에 접근해 고객 DB 전체 사본 유출
  controls: |-
    - 장기 액세스 키 제거·단기 자격증명 전환과 루트 계정 MFA·기본 서비스 계정 권한 축소
    - 조건부 액세스·MFA 적용과 코드·빌드 산출물 비밀 스캐닝
    - 낯선 출발지의 키 사용·처음 호출되는 API 탐지와 의심 키 즉시 비활성화
