# [RD] 자원 개발 — 재구성 Lv3 (원본 1행 → 1)
- id: CL-RD-01
  name: 공격 인프라 확보(유사 도메인·클라우드 서버)
  members: [T1583.001]
  basis: 단독 유지 — 자원 개발 전술의 유일한 클라우드 연관 기법(통합된 상위기법 T1583 포함)
  description: |-
    - 피싱·C2용 유사 도메인과 클라우드 서버를 확보하거나 탈취한 클라우드 계정의 도메인 등록 기능으로 공격 인프라를 마련하는 위협
    - 정상 클라우드 인프라와 유사 도메인은 평판 기반 차단이 어렵고, 피해 계정에서 등록하면 비용과 책임이 피해 조직에 전가됨
  scenario: |-
    - 오타·동형 문자 도메인 등록이나 만료 도메인 재등록 → 탈취한 계정의 Route 53·SES로 도메인과 발송 인프라 구성 → M365·SSO 로그인 위장 피싱과 스팸 발송
  cases: |-
    - [실제 사고] 관리자 액세스 키 노출(2024-01): 탈취한 관리자 키로 채굴·SES 스팸 발송과 함께 피싱용 도메인 구축
  controls: |-
    - 자사 브랜드와 유사한 신규 등록 도메인 모니터링(인증서 투명성 로그 등)과 테이크다운
    - 도메인 등록이 필요 없는 계정의 관련 권한 차단(SCP)과 도메인 등록 이벤트 알림
