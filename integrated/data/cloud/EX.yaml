# [EX] 실행 — 재구성 Lv3 (원본 10행 + 지속성 전술 T1546·T1525 → 5) · v4 Lv0 간 통합으로 1개 이관 → 4
- id: CL-EX-01
  name: 클라우드 제어 평면 API·원격 명령 악용
  summary: 탈취한 관리 권한으로 클라우드 API·원격 명령 기능을 써 일괄 명령 실행
  members: [T1651, T1059.009, T1072]
  basis: 클라우드 API 직접 조작·VM 원격 명령·배포 도구 악용은 모두 제어 평면 권한으로 다수 시스템에 명령을 내리는 같은 위협이며 관리 권한 분리라는 같은 통제를 받음
  description: |-
    - 탈취한 관리 권한으로 클라우드 CLI·SDK·Cloud Shell·Graph API를 호출하거나 Run Command·Intune 같은 원격 실행·배포 기능으로 VM과 관리 대상 장치 전체에 명령을 실행하는 위협
    - 네트워크 경로나 VM 자격증명 없이 제어 평면 API만으로 다수 시스템을 일괄 장악하며, 정상 관리 작업과 같은 형태라 호출 주체·출발지 같은 맥락 없이는 구분이 어려움
  scenario: |-
    - 탈취한 액세스 키·관리자 계정으로 Pacu 등 도구를 써 API 대량 호출 → Run Command·Runbook·Intune 스크립트로 VM·온프레미스 장치에 고권한 명령 배포 → 데이터 반출·횡적 확산·원격 초기화
  cases: |-
    - [실제 사고] Muddled Libra 캠페인(2024-04): 클라우드 API로 AWS Transfer·DataSync를 이용해 데이터 반출
    - [실제 사고] Azure Run Command 악용(2023-08): 0ktapus가 Azure VM Run Command로 원격 명령 실행
  controls: |-
    - 원격 실행·배포 권한의 별도 역할 분리·최소화와 다중 관리자 승인
    - 콘솔·API 접근 출발지 조건 제한과 불필요한 Cloud Shell 사용 제한
    - 대량 List·Describe 호출과 Run Command 이상 실행 탐지

- id: CL-EX-02
  name: 컨테이너 관리 API 악용 및 악성 컨테이너 배포
  summary: Kubernetes·Docker 관리 API로 명령 실행과 악성 컨테이너 배포
  members: [T1609, T1610]
  basis: 컨테이너 내 명령 실행과 컨테이너 직접 배포는 모두 클러스터 관리 API를 통한 실행이며 RBAC·어드미션 정책이라는 같은 통제를 받음
  description: |-
    - Kubernetes API 서버·kubelet·Docker 데몬의 관리 기능으로 실행 중인 컨테이너에서 명령을 실행하거나, 악성·권한 있는 컨테이너를 직접 배포해 노드와 클러스터를 장악하는 위협
    - 클라우드 IAM이 클러스터 권한으로 연결되어 계정 탈취가 곧 컨테이너 실행 권한이 되며, DaemonSet·변경 승인 웹훅으로 전 노드·신규 파드에 동시 확산됨
  scenario: |-
    - 탈취한 IAM 키나 익명 접근 허용 클러스터로 API 접근 → kubectl exec 실행이나 채굴기·다운로더가 담긴 이미지를 DaemonSet·Fargate 태스크로 배포 → 노드 탈출·크립토재킹·클러스터 내부 데이터 수집
  cases: |-
    - [실제 사고] ECS Fargate 크립토재킹(2024-01): 침해한 IAM 액세스 키로 수백 개의 Fargate 클러스터를 만들고 태스크 정의로 채굴 컨테이너 실행
    - [실제 사고] DERO 크립토재킹(2024-06): 익명 접근이 허용된 Kubernetes 클러스터에 채굴기가 담긴 악성 이미지 배포
  controls: |-
    - exec·배포 권한 RBAC 최소화와 Pod Security Admission·정책 엔진으로 위험 설정 차단
    - 서명 이미지만 허용하고 대시보드 등 관리 UI 비공개
    - pods/exec·privileged 파드·신규 DaemonSet·어드미션 웹훅 변경 탐지

- id: CL-EX-03
  name: 서버리스 함수·이벤트 트리거 악용
  summary: 서버리스 함수·이벤트 트리거로 고권한 악성 코드 실행
  members: [T1648, T1546]
  basis: 서버리스 실행과 이벤트 트리거 실행은 함수·자동화 리소스로 코드를 돌리는 같은 메커니즘이며 실행 역할 최소화라는 같은 통제를 받음 (T1546을 지속성·권한 상승 전술에서 이동)
  description: |-
    - Lambda·Azure Functions·Logic Apps로 코드를 실행하고 함수에 고권한 역할을 붙이거나, 이벤트 규칙·HTTP 트리거·웹훅·정책을 등록해 특정 이벤트마다 악성 코드가 실행되게 하는 위협
    - 역할 연결 권한(iam:PassRole 등)이 넓으면 호출자보다 높은 권한으로 실행되고, 상시 프로세스·서버가 없어 호스트 기반 탐지가 닿지 않음
  scenario: |-
    - 노출 자격증명으로 함수 코드를 주입하거나 고권한 역할을 연결한 함수 생성 → 사용자 생성·파일 업로드 같은 이벤트에 트리거 연결 → 백도어 관리자 생성·채굴기 구동·외부 API로 함수 노출
  cases: |-
    - [실제 사고] Denonia(2022-04): AWS Lambda 환경을 표적으로 한 악성코드가 함수 안에서 XMRig 채굴기 구동
    - [실제 사고] 공개 S3 자격증명 노출(2025-11): 노출 자격증명으로 Lambda 코드를 주입하고 백도어 관리자를 만든 뒤 LLMjacking·GPU 인스턴스 생성에 악용
  controls: |-
    - 함수에 연결 가능한 역할 범위 제한과 실행 역할 최소 권한
    - 인증 없는 트리거 금지와 이벤트·정책·자동화 리소스 수정 권한 최소화
    - 함수 생성·코드 변경·역할 연결·트리거 생성 이벤트 탐지

- id: CL-EX-05
  name: 악성·변조 이미지 실행
  summary: 백도어·채굴기를 심은 AMI·컨테이너 이미지 배포로 악성 코드 실행
  members: [T1204.003, T1525]
  basis: 공개 악성 이미지 배포 유도와 내부 레지스트리 이미지 변조는 모두 이미지를 통해 악성 코드를 실행시키는 같은 위협이며 이미지 서명·허용 목록이라는 같은 통제를 받음 (T1525를 지속성 전술에서 이동)
  description: |-
    - 백도어·채굴기를 심은 AMI·VM·컨테이너 이미지를 공개 마켓플레이스·레지스트리에 올리거나 피해 조직 내부 레지스트리에 심어, 배포·프로비저닝 시 클라우드 환경에서 실행되게 하는 위협
    - 정상 이미지와 비슷한 이름으로 오배포를 유도하고 실행 시점에 페이로드를 받아 스캔을 피하며, 최신 태그를 쓰는 환경에서는 새 인스턴스·파드마다 백도어가 재배포됨
  scenario: |-
    - Docker Hub·공개 AMI에 위장 이미지를 게시하거나 침해한 내부 레지스트리 이미지에 웹셸 삽입 → 사용자·프로비저닝 도구가 이미지로 인스턴스·컨테이너 생성 → 채굴 풀 접속과 지속 백도어 확보
  cases: |-
    - [실제 사고] AmberSquid(2023-09): Docker Hub 계정으로 악성 이미지를 배포하고 Amplify·Fargate·SageMaker 등 AWS 서비스로 채굴
    - [ATT&CK 사례] TeamTNT: 사용자가 악성 Docker 이미지를 내려받아 실행하도록 유도
  controls: |-
    - 신뢰 이미지 허용 목록·서명 검증과 레지스트리 푸시 권한 최소화
    - 다이제스트 고정과 이미지 취약점·악성코드 스캔 파이프라인
