# [EF] 반출 — 재구성 Lv3 (원본 4행 → 2)
- id: CL-EF-01
  name: 클라우드 계정 간 전송·트래픽 미러링 반출
  members: [T1537, T1020.001]
  basis: 같은 제공자 내 공격자 계정으로의 스냅샷·백업 전송과 트래픽 미러링은 모두 클라우드 자체 기능으로 외부 전송 감시를 우회하는 같은 반출 위협이며 공유·미러링 권한 최소화라는 같은 통제를 받음
  description: |-
    - 스냅샷·백업을 같은 클라우드 제공자의 공격자 계정으로 복사·공유하거나 SAS URI·익명 링크를 만들고, Traffic Mirroring·vTap으로 트래픽을 공격자 대상으로 복제해 데이터를 반출하는 위협
    - 제공자 내부 주소·API를 써서 외부 대량 전송 감시를 피하며, 미러링 세션 하나가 지속 반출 통로가 됨
  scenario: |-
    - 탈취 권한으로 EBS·DB 스냅샷 생성 → 공격자 계정에 공유·복사하거나 AzCopy·SAS URI로 이전 → 공격자 계정에서 복원해 데이터 확보
  cases: |-
    - [실제 사고] DNC 해킹(2016-06): 침해한 테스트 클러스터의 EC2 스냅샷을 공격자 AWS 계정으로 복사
    - [ATT&CK 사례] Storm-0501: AzCopy CLI로 피해 환경 데이터를 공격자 인프라로 복사
  controls: |-
    - 스냅샷·백업 외부 공유 차단과 SAS·익명 링크 제한
    - 트래픽 미러링 세션 생성 권한 최소화와 미러 대상 허용 목록
    - 계정 간 복사·스냅샷 공유·미러링 세션 변경 알림

- id: CL-EF-02
  name: 정상 웹 서비스·웹훅 경유 반출
  members: [T1567, T1567.004]
  basis: 웹 서비스 반출과 웹훅 반출은 상위·하위 기법 관계로 조직이 허용한 정상 SaaS·HTTPS 경로로 데이터를 빼내는 같은 위협이며 아웃바운드 DLP·SaaS 허용 목록이라는 같은 통제를 받음
  description: |-
    - Google Drive·Salesforce·M365 같은 정상 웹 서비스나 Slack·Discord·webhook.site 웹훅 엔드포인트로 데이터를 업로드·전송해 반출하는 위협
    - 공격자 환경에 연결한 SaaS로 메일·메시지를 반복 자동 반출하기도 하며, 평소 쓰는 서비스라 방화벽 허용 규칙·TLS 암호화에 묻혀 탐지가 어려움
  scenario: |-
    - 침해 VPN·SaaS 계정으로 진입 → Rclone·Data Loader로 파일 서버·CRM 데이터를 대량 수집하거나 CI 러너에서 저장소 비밀 수집 → 클라우드 스토리지·웹훅 URL로 업로드해 반출
  cases: |-
    - [실제 사고] AWS 데이터 유출·랜섬 시도(2025-07): 침해된 VPN 자격증명으로 진입해 Rclone으로 AWS 파일 서버의 재무 관련 민감 파일 유출
    - [ATT&CK 사례] Shai-Hulud: 저장소 비밀을 webhook.site로 반출
  controls: |-
    - 아웃바운드 DLP와 승인되지 않은 SaaS·웹훅 도메인으로의 업로드 차단
    - 비인가 SaaS 통합 차단과 대량 반출 도구 사용 제한
    - 평소와 다른 양·시간대의 외부 업로드와 저장소 비밀의 외부 전송 탐지
