# NC-062
# 매핑 약함: TSMC 본사 침해는 부인 — 사건 주체는 IT 하드웨어 공급사 Kinmax이고 유출물은 고객 제공 기본 설치 구성 자료(탈취 범위는 행위자 주장 수준). 공급업체 침해의 고객사 노출(IM-01.1)로 잠정 매핑 / Kinmax 소재지는 보도마다 다름(대만·중국)
- id: SCI-175
  title: TSMC IT 하드웨어 공급사(Kinmax) 침해와 LockBit 계열의 7,000만 달러 몸값 요구
