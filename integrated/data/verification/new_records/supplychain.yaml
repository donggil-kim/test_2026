# NC-030
# 공개 시 CVE 없음(KEV 해당 없음) / 전체 피해 기관 수 미공개 / 금융기관 피해는 확인되지 않음(NC-027·NC-029와의 연관 미확인)
- id: SCI-172
  title: Metabase Cloud SQL 인젝션 제로데이(CVSS 10) 악용으로 고객사 데이터 탈취(Framework·Tally·Kilo Code)
  date: 2026-08
  kind: 캠페인
  verification: 피해기관 확인
  ecosystem: [서드파티 SaaS·MSP]
  region: 글로벌
  actor: 미상
  impact: [데이터 반출, 자격증명·비밀 탈취]
  summary: >-
    BI 도구 Metabase의 미인증 SQL 인젝션 제로데이(CVSS 10, 1.58 이상 버전)가 Metabase Cloud를 겨냥해 실제로 악용됐다.
    공격자는 관리자 권한을 얻어 설정을 바꾸고 연결된 데이터베이스 자격증명을 훔쳐 데이터를 반출할 수 있었다. Metabase가 2026-08-06 위협을
    공개하고 고객에게 알렸으며, Framework는 자사 클라우드 인스턴스 접근으로 이름·이메일·전화번호·주소·로그인 IP가 유출됐다고 고객에게 통지했다.
    Tally(이메일·비밀번호 해시)와 AI 코딩 플랫폼 Kilo Code(이름·이메일·Slack 토큰)도 피해를 공개했고, 공개 시점에 CVE는 부여되지
    않았다.
  sct: [SCT-CS-04, SCT-IM-01.1]
  sources:
    - Help Net Security(2026) Metabase zero-day exploited to access Framework customer data | https://www.helpnetsecurity.com/2026/08/10/metabase-zero-day-framework-tally-kilo-code/
    - Security Affairs(2026) Metabase Zero-Day Exploited in the Wild, Exposing Admin Access and Sensitive Data | https://securityaffairs.com/196874/hacking/metabase-zero-day-exploited-in-the-wild-exposing-admin-access-and-sensitive-data.html

# NC-035
