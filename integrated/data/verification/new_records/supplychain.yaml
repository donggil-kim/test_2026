- id: SCI-173
  title: Brevo SAML SSO 결함으로 138개 고객 계정 장악 → Trezor·BitBox·CoinTracking 명의 피싱 메일 발송
  date: 2026-09
  kind: 사고
  verification: 피해기관 확인
  ecosystem: [서드파티 SaaS·MSP]
  region: 글로벌
  actor: 미상
  impact: [데이터 반출]
  summary: >-
    이메일 마케팅 업체 Brevo는 사후 분석에서 2026-09-10 SAML SSO 처리 결함을 악용한 공격자가 고객 계정 138개에 접근했다고
    밝혔다(처음에는 120개로 공지). 6개 계정으로 저장된 연락처에 피싱 메일을 보냈고 43개 계정에서는 연락처를 반출했다.
    Trezor·BitBox·CoinTracking이 자사 이름으로 보안 경고를 위장한 피싱 메일을 고객에게 경고했고, CoinTracking은 발송
    출처가 Brevo라고 밝혔다. 금전 피해 규모는 공개되지 않았다.
  sct: [SCT-CS-04, SCT-IM-01.1]
