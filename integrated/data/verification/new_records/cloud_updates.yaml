- id: INC-0679
  후보: NC-025
  field: 사건 요약(국문)
  현재: Microsoft가 JADEPUFFER 연계 활동을 Storm-3168로 분류해 공개했다. 공격자는 침해된 서비스 주체를 이용해 Azure 정찰, 리소스 삭제, 자격증명 접근을 수행했으며, 에이전트 기반(agentic) 클라우드 공격으로 소개되었다.
  제안: Microsoft가 JADEPUFFER 연계 활동을 Storm-3168로 분류해 공개했다. 공격자는 침해된 서비스 주체를 이용해 Azure 정찰, 리소스 삭제, 자격증명 접근을 수행했으며, 에이전트 기반(agentic) 클라우드 공격으로 소개되었다. Sysdig는 JadePuffer 운영이 자율 LLM 에이전트로 정찰·자격증명 탈취·내부 이동·지속성·권한 상승·데이터 암호화까지 수행한 랜섬웨어 침해를 분석했다. Langflow의 미인증 RCE(CVE-2025-3248)로 초기 접근한 뒤 PostgreSQL DB와 환경변수를 확보하고 MinIO 저장소를 열거했으며, cron 작업으로 지속성을 만들고 Alibaba Nacos 서버로 이동해 설정 항목 1,342개를 암호화한 뒤 원본 테이블을 삭제하고 비트코인 주소가 든 협박 테이블을 남겼다. 피해 기관은 공개되지 않았다.
  근거: BleepingComputer 2026-07-04(Sysdig 분석 보도), INCYBER 2026-07-08. Sysdig 원문은 미열람. Microsoft의 Storm-3168(Azure 서비스 주체 악용)과 Sysdig의 Langflow·Nacos 침해가 같은 사건인지는 확인되지 않음 — 같은 JadePuffer 계열 활동으로 묶었으므로 별건 분리 여부는 편집자 판단
