- id: INC-0670
  후보: NC-017
  field: 사건 요약(국문)
  현재: GTIG에 따르면 UNC6671은 BlackFile 브랜드 은퇴 발표 이후에도 Redact, Pink, Helix, Falcon 등 여러 갈취 브랜드로 활동을 이어갔다. IT 헬프데스크를 사칭한 비싱으로 직원을 가짜 로그인 포털로 유도하고, AiTM 인프라로 자격증명과 MFA 토큰을 가로챈 뒤 Microsoft 365와 Okta 등 기업 클라우드 환경에서 데이터를 유출했다.
  제안: GTIG에 따르면 UNC6671은 BlackFile 브랜드 은퇴 발표 이후에도 Redact, Pink, Helix, Falcon 등 여러 갈취 브랜드로 활동을 이어갔다. IT 헬프데스크를 사칭한 비싱으로 직원을 가짜 로그인 포털로 유도하고, AiTM 인프라로 자격증명과 MFA 토큰을 가로챈 뒤 Microsoft 365와 Okta 등 기업 클라우드 환경에서 데이터를 유출했다. 피해 기관 중 Apollo Global Management는 캘리포니아 검찰총장실 유출 신고(2026-08-21)에서 2026-07-06~10 클라우드 시스템에 무단 접근이 있었고 이름·생년월일·주소·SSN이 탈취됐음을 확인했다(피해 인원 미공개, 데이터 공개·신원 도용 증거는 아직 없다고 밝힘).
  근거: CyberScoop 2026-08-21(Apollo 유출 신고 인용·Google의 BlackFile 귀속 언급), Insurance Business, OODAloop. 소셜 엔지니어링 파상 공격 중 처음으로 데이터 탈취를 공식 인정한 피해 기관이라 위협인텔 보고서 행에 '실제 피해 기관 확인' 근거가 됨(후보 NC-017)
