# NC-031
# 매핑 근사: 위조 정부기관 정보 요청(EDR) 악용에 정확히 맞는 세부위협이 없어 절차 악용형 IDT-SE-03으로 근사 — 신규 위협 후보로도 검토 / 1만 BTC 요구는 행위자 주장
