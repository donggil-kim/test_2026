  date: 2026-09
  kind: 사고
  verification: 피해기관 확인
  id_env: [CIAM·고객 서비스]
  id_type: [고객]
  region: 영국
  actor: 미상(자칭 범인이 텔레그램에 게시, 1만 BTC 요구는 행위자 주장)
  impact: [데이터 반출]
  summary: >-
