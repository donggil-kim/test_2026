# NC-023
# FSA 원문 미열람(보도 인용) / 이후 월별 집계로 피해가 크게 늘었다는 보도는 원문 미확인이라 4/16 기준만 기재 / 거래액은 고객 손실액이 아님
# 후보의 ID-CI-01(자격증명 스터핑)은 근거가 피싱 사이트 탈취라 매핑하지 않음
- id: IDI-132
  title: 일본 증권사 온라인 계좌 대량 탈취와 무단 매매(피싱 사이트로 로그인 정보 탈취)
  date: 2025-04
  kind: 캠페인
  verification: 정부·사법 확인
  id_env: [CIAM·고객 서비스]
  id_type: [고객]
  region: 일본
  actor: 미상
  impact: [계정 탈취, 금전 탈취]
  summary: >-
    일본 금융청(FSA)은 2025-04 긴급 경고에서 실제 증권사를 흉내 낸 피싱 사이트로 빼낸 로그인 정보로 인터넷 거래 계좌에 무단 접속해 보유
    주식을 팔고 중국 주식 등을 사들이는 무단 거래가 급증했다고 밝혔다. 2025-02부터 4월 16일까지 12개 증권사가 신고했고 부정 접속 3,300여
    회, 부정 거래 1,454건, 매도 약 3억 5천만 달러·매수 약 3억 1,500만 달러 규모였다(거래액이며 고객 손실액은 아니다).
    라쿠텐·노무라·SMBC닛코·SBI 등이 신고 증권사로 보도됐고 증권사들이 고객 손실을 보상하겠다고 했다.
  idt: [IDT-SE-01.1, IDT-IM-01]
