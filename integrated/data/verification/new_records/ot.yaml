# OT 사고 DB 신규 기록 초안 (ot/data/incidents.yaml 형식) — 승인된 신규 사고 후보 중 OT DB 담당분
# 원본 DB에는 아직 넣지 않은 초안. id는 기존 최대 INC-085 다음부터(INC-086~). date는 최초 공개월(결정 F2).
# 매핑 근거: ics/ent는 기존 기록처럼 근거 있는 기법만. 후보 CSV의 '제안 요약 위협 ID'와 다른 점은 각 기록 주석에 적음.
# NC-044(Asahi)는 기존 INC-071과 같은 사건이라 신규 기록으로 만들지 않고 ot_updates.yaml에 보강안으로 둠.

