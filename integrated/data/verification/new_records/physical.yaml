    관련 유출이라 밝히고, AI 도구의 결함이 아니라 프롬프트와 테스트·검토 부실, 생성형 AI 사용 지침 부재가 원인이라 보아 회사의 자발적 시정
    약속(2026-09-02)을 수용했다. 추가 오용 증거는 없었다.
