- id: PHI-106
  title: ASML·NXP 근무 러시아 국적 엔지니어의 사내 서버 기밀 반복 복사와 러시아 측 제공 — 네덜란드 법원 징역 3년
  date: "2025-07"
  kind: 사고
  verification: 정부·사법 확인
  legal: 유죄 판결
  region: 유럽
  sector: [반도체·디스플레이]
  actor: 러시아 국적 엔지니어(43세, ASML·NXP 근무)
  actor_type: [내부자(악의)]
  impact: [국가핵심기술·영업비밀 유출]
  summary: >-
    로테르담 법원은 2025-07-10 ASML·NXP(및 ASML이 인수한 Mapper)에서 일한 43세 러시아 국적 엔지니어에게 EU 제재 위반,
    정보보안 범죄, 영업비밀 침해로 징역 3년(구형 4년)을 선고했다. 그는 재직 중 두 회사 서버에서 기밀 정보를 정기적으로 복사했고 러시아 측에 조언과
    기술을 제공했으며, 러시아 방문 뒤 2021~2024년 현금 4만 3,900유로를 입금한 사실이 드러났다. 법원은 대가 수수는 입증하지 못했다며
    구형보다 낮게 선고했고 20년 입국 금지를 명했으며, 그는 2024-12 구금됐다.
