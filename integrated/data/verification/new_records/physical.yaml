  date: "2026-09"
  kind: 사고
  verification: 정부·사법 확인
  legal: 수사·조사
  region: 기타
  sector: [기타]
  actor: 마케팅 부서 직원(생성형 AI로 스크립트 작성)
  actor_type: [내부자(비의도)]
  impact: [개인정보 유출]
  summary: >-
    싱가포르 개인정보보호위원회(PDPC)에 따르면 Bee Cheng Hiang 마케팅 부서 직원이 생성형 AI 도구로 작성한 Python 대량 메일
    스크립트에서 괄호가 빠져, 1,000명씩 나눠 보낸 메일의 수신자 이메일이 모두 받는 사람 칸에 노출됐다. 2026-04-25 회원 95,364명의
