# NC-060 (PHI-026 보강)
- id: PHI-026
  field: summary
  현재: >-
    중국 지방정부·설계회사 출자로 2016년 세워진 중국 D램 업체가 삼성전자 부장 출신을 개발실장으로 영입했고, 삼성 연구원 출신은 D램 공정 핵심
    자료인 공정 레시피 정보를 자필로 옮겨 적은 뒤 이 업체로 이직했다. 서울중앙지검은 2025-12 10명을 기소(5명 구속)했고 피해액을 최소 수십조
    원으로 추산했다. 전직 연구원 1명은 2026-04 1심에서 징역 7년을 받았다.
  제안: >-
    중국 지방정부·설계회사 출자로 2016년 세워진 중국 D램 업체가 삼성전자 부장 출신을 개발실장으로 영입했고, 삼성 연구원 출신은 D램 공정 핵심
    자료인 공정 레시피 정보를 자필로 옮겨 적은 뒤 이 업체로 이직했다. 서울중앙지검은 2025-12 10명을 기소(5명 구속)했고 피해액을 최소 수십조
    원으로 추산했다. 보도에 따르면 검찰은 2024-01부터 2025년 말까지 이 업체 개발 인력 10명을 국가핵심기술 유출 혐의 등으로 재판에 넘겼고,
    이들이 세후 5억 원 이상을 제시하며 삼성전자와 관계사 기술 인력 20여 명을 빼갔다고 본다. 먼저 재판에 넘겨진 전 삼성전자 메모리사업부 부장은
    2016년 이 업체로 옮기며 18나노 D램 증착 자료와 7개 핵심 공정 기술 자료를 넘기고 수백억 원대 금품을 받은 혐의로 2025-02 1심에서 징역
    7년·벌금 2억 원(구형 20년), 2025-07 서울고법 2심에서 징역 6년을 받았고 협력사 직원은 징역 2년 6개월이 유지됐다. 1조 6천억 원을
    들여 개발한 공정 기술을 넘긴 전직 연구원은 2025-05 구속기소돼 2026-04 1심에서 징역 7년을 받은 뒤, 2026-08 다른 피고인의
    재판에서 이 업체 CEO·CTO 등이 처음부터 삼성 PRP 정보를 탈취해 D램을 개발하려 했다고 증언했다.
  근거: >-
    서울경제(2025-05-08): 전씨·김씨 등 세후 5억 원 이상 제시·기술 인력 20여 명, 2025-02 1심 징역 7년·벌금 2억 원.
    파이낸셜뉴스 사설(2025-02-20): 구형 20년, 2016년 이직·증착 및 7개 핵심 공정 자료·수백억 원대 금품.
    한국경제(2025-07-23): 서울고법 2심 징역 6년·벌금 2억 원, 협력사 직원 징역 2년 6개월 유지. 한국경제(2026-08-18): 전씨
    2025-05 구속기소·1조 6천억 원 18나노 D램 공정·2026-04 1심 징역 7년·2026-08-11 증언, 검찰이 2024-01부터 2025년
    말까지 10명 기소. 유출 시점이 2016년으로 범위 이전이라 새 행 대신 보강. 첫 기소 월은 보도 간 차이(후보 2024-01, 머니투데이
    2024-05-28은 2024-04-25 기소 보도)가 있어 부장 기소 월은 적지 않음. 기존 요약의 “2025-12 10명 기소”와 한국경제의
    “2024-01~2025년 말 10명 기소”는 집계 방식이 다를 수 있어 병기. 후보 NC-060.
