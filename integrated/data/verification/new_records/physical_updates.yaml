# NC-059 (PHI-025 정정)
- id: PHI-025
  field: title
  현재: 반도체 기업 직원의 퇴사 전 공정 문서 4천여 쪽 출력·태블릿 촬영 반출(경쟁사 이직)
  제안: 반도체 기업 직원의 퇴사 전 공정 문서 4천여 쪽 출력 반출(경쟁사 이직)
  근거: >-
    서울경제(2025-05-08): 이 사건은 공정 문제 해결 자료 A4 4천여 장 출력 유출이며 태블릿·사진 촬영 내용은 없음. 5,900장 촬영은
    별개의 SK하이닉스 중국법인 직원 사건(PHI-103 신규, NC-058). 후보 NC-059.
- id: PHI-025
  field: summary
  현재: >-
    2013년 SK하이닉스에 입사해 중국 자회사에서 B2B 고객 담당 팀장을 지낸 중국 국적 직원이 2022-06 퇴사 직후 화웨이로 옮겼다. 퇴사 전
    반도체 제조 공정 문제 해결 방안 문서 약 4,000쪽과 CIS 기술 영업비밀을 여러 차례 출력하고, 자료 170개(5,900장)를 태블릿으로 촬영해
    반출했다. 2심에서 징역 1년 6개월을 선고받았다.
  제안: >-
    2013년 SK하이닉스에 입사해 중국 자회사에서 B2B 고객 담당 팀장을 지낸 중국 국적 직원이 2022-06 퇴사 직후 화웨이로 옮겼다. 이직을
    준비하며 보안상 USB를 쓸 수 없다는 점을 파악해 반도체 제조 공정 문제 해결 방안 자료를 A4 용지 수천 장(최초 보도 3천 장 이상, 항소심 보도
    4천여 장) 분량으로 출력해 반출했다. 1심에서 징역 1년 6개월·벌금 2천만 원을 받았으나 수원고법이 2025-05-07 항소심에서 이를 파기하고
    징역 5년·벌금 3천만 원을 선고했다. 대법원 결과는 확인되지 않았다.
  근거: >-
    머니투데이(2024-05-28): 2013 입사·2022-06 화웨이 이직·USB 불가로 A4 3천 장 이상 출력(1심 계류 중).
    서울경제(2025-05-08): 수원고법 형사2-1부 2025-05-07 항소심에서 1심(징역 1년 6월·벌금 2천만 원)을 파기하고 징역 5년·벌금
    3천만 원 선고, 출력 분량 4천여 장. 기존 요약의 CIS 영업비밀, 170개(5,900장) 태블릿 촬영, 2심 징역 1년 6개월은 서울고법이 선고한
    별개 사건(PHI-103). 3천 장/4천 장 차이는 보도 시점 차이로 병기. 후보 NC-059.
