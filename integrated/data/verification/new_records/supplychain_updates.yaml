# NC-034 (UC-0455 → SCI-110 보강)
- id: SCI-110
  field: summary
  현재: >-
    채용 담당자를 사칭해 개발자에게 코딩 과제·프로젝트를 실행시키거나 악성 npm 패키지를 설치하게 해 BeaverTail 등 정보탈취 악성코드를
    감염시키는 북한 연계 캠페인이다. 개발자 단말의 지갑·자격증명이 주된 표적이다.
  제안: >-
    채용 담당자를 사칭해 개발자에게 코딩 과제·프로젝트를 실행시키거나 악성 npm 패키지를 설치하게 해 BeaverTail 등 정보탈취 악성코드를
    감염시키는 북한 연계 캠페인이다. 개발자 단말의 지갑·자격증명이 주된 표적이다. 2025-12~2026-07에는 WaterPlum으로 추적되는 같은
    계열이 SNS·구인 사이트·프리랜서 플랫폼에서 AI·가상자산·NFT 기업을 사칭해 개발자에게 접근하고, 코딩 과제나 화상회의 문제 해결로 위장한
    악성코드(BeaverTail·InvisibleFerret·OtterCookie 등)를 실행시켜 100여 개국 최소 3만 대를 감염시켰다. 7천여 개
    가상자산 지갑에서 자금 또는 자격증명을 빼내 약 1,070만 달러(17억 엔)를 북한으로 옮긴 사실이 일본·미국·호주·독일 7개 기관의 합동
    경보(2026-09-18)로 공개됐다.
  근거: >-
    BleepingComputer(2026-09-19)·Infosecurity Magazine(2026-09-22) 열람: 합동 경보의 3만 대·100여
    개국·지갑 7천여 개·1.7억 엔(1,071만 달러)·활동 기간 2025-12~2026-07·7개 기관 확인. 합동 경보 원문(경찰청·FBI)은
    미열람이라 수치는 보도 인용. 2025~2026 최근 사고 공백 보완(후보 NC-034).
- id: SCI-110
  field: actor
  현재: Contagious Interview(G1052, 북한 연계)
  제안: Contagious Interview(G1052, 북한 연계) — 2025-12 이후 활동은 WaterPlum으로 추적(일본·미국·호주·독일 합동 경보)
  근거: 두 보도 모두 WaterPlum을 Contagious Interview와 같은 장기 캠페인으로 설명. 후보 NC-034.
