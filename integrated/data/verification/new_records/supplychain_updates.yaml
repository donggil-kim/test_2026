  근거: >-
    SCT-DE-01.1: 주 표적이 웹 디자이너·엔지니어·Web3 전문가의 개발자 단말이고 인포스틸러·RAT로 브라우저 자격증명·키 입력·지갑 개인 키를
    탈취하고 고용주 침투 경로가 됨(Infosecurity). SCT-IM-04: 7천여 개 지갑에서 가상자산을 빼 약 1,070만 달러를 북한으로
    이전(BleepingComputer). 후보의 SC-DE-01·SC-IM-04와 일치(ID-CR-01은 신원 DB 몫). 매핑 추가는 요약 위협의 실제
    사고 수에 반영되므로 검토 필요.
