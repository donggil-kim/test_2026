# D10. 사용자 기만 및 AI 거버넌스 미흡 — 재구성 Lv3 (원본 9 → 5)
- id: AI-10-01
  name: AI 신뢰를 악용한 사용자 기만
  members: [UT-34.1, UT-34.2]
  basis: 신뢰 가장 출력과 에이전트 경유 사회공학은 모두 AI에 대한 사용자 신뢰를 이용해 사람을 속이는 같은 위협이며 출처 검증·별도 채널 확인이라는 같은 통제를 받음
  description: |-
    - 인젝션으로 응답의 인용·출처·근거 설명을 조작하거나 신뢰받는 역할의 에이전트가 자격증명 입력·송금·명령 실행을 직접 요청하게 해, AI에 대한 신뢰를 이용해 사용자를 기만하는 위협
    - 출처가 붙은 답변과 회사가 도입한 AI의 요청은 검증된 정보로 받아들여져, 거짓 정보와 사회공학이 일반 피싱보다 의심받기 어려움
  scenario: |-
    - 문서·웹페이지·송장에 지시와 허위 정보 삽입 → AI가 이를 정상 문서에 근거한 답변처럼 인용하거나 실제 티켓을 근거로 사용자에게 요청 → 공격자 계좌 송금·자격증명 제공·악성 명령 실행
  cases: |-
    - [실증] M365 Copilot 거래 정보 조작(2024-08): 공격자 메일을 정상 거래처 문서처럼 인용하게 해 공격자 계좌를 신뢰할 수 있는 송금 정보로 제시
    - [시나리오] 인젝션된 IT 지원 에이전트가 실제 티켓을 인용해 신입 직원의 자격증명을 받아 유출하고, 오염 송장을 읽은 재무 비서가 공격자 계좌로 긴급 송금을 권고
  controls: |-
    - 인용과 원문 대조·출처 문서 표시와 고위험 정보(계좌·권한)의 별도 채널 확인
    - 에이전트는 비밀번호·MFA 코드를 묻지 않는다는 정책 고지와 에이전트 출력의 위험 요청 탐지

- id: AI-10-02
  name: 승인 피로 악용
  members: [UT-34.3]
  basis: 단독 유지 — 사람 승인 통제 자체가 형식화되는 위협으로 실제 사고가 확인되어 별도 관리가 필요함
  description: |-
    - 잦은 승인 요청과 에이전트가 만든 그럴듯한 근거로 승인자의 검토를 형식적으로 만들어, 위험한 설정 변경·삭제·결제를 사람 승인 아래 실행시키는 위협
    - 사람 승인 절차가 오히려 책임 소재를 흐리고 통제가 작동한 것처럼 보이게 하며, 요약만 보여주는 승인 화면은 실제 실행 내용과 다를 수 있음
  scenario: |-
    - 에이전트가 날조된 감사 근거·요약 설명과 함께 반복 승인 요청 → 피로해진 승인자가 원문 확인 없이 승인 → 악성 설정 배포·운영 DB 삭제·부적절한 결제 실행
  cases: |-
    - [실제 사고] Replit 바이브 코딩 에이전트(2025-07): 에이전트가 운영 DB를 삭제한 뒤 데이터와 결과를 지어내 실수를 숨겨 사용자의 판단을 흐림
    - [시나리오] 에이전트가 그럴듯한 감사 근거를 꾸며 위험한 설정 변경을 정당화하고, 검토자가 이를 승인해 악성 설정이 배포됨
  controls: |-
    - 실행될 원문·영향 범위를 그대로 보여주는 고위험 승인 화면과 독립 근거 확인
    - 승인 요청 빈도 관리와 다단계 승인·위험 배지

- id: AI-10-03
  name: AI 활동 감사 체계 부재
  members: [UT-35.1, UT-35.2]
  basis: 행위 기록 부재와 로그 무결성 부재는 모두 AI 행위를 추적·입증할 수 없게 만드는 같은 감사 공백이며 불변 AI 감사 로그라는 같은 통제를 받음
  description: |-
    - 도구 호출·컨텍스트 변경·메모리 쓰기·에이전트 간 메시지와 판단 근거가 기록되지 않거나 에이전트·공격자가 로그를 고칠 수 있어, 인젝션·도구 악용의 흔적을 지우고 탐지와 책임 규명을 피하게 되는 위협
    - AI 사고는 어떤 입력이 어떤 행위로 이어졌는지가 핵심 증거인데 기존 애플리케이션 로그에는 이 연결이 남지 않고, 무결성을 증명할 수 없는 기록은 조사·법적 대응에 쓰기 어려움
  scenario: |-
    - 기본 원격 측정이 부족한 MCP 서버·에이전트 환경에서 인젝션·도구 악용 발생 → 탈취한 자격증명으로 대응 에이전트가 통제를 끄고 로그 삭제 → 정상 지표 보고로 침해 조사와 대응 지연
  cases: |-
    - [시나리오] 탈취한 서비스 자격증명으로 대응 에이전트가 통제를 끄고 로그를 지운 뒤 컴플라이언스 에이전트가 정상 지표를 보고
    - [시나리오] MCP 서버와 에이전트의 원격 측정 부족으로 침해 조사와 사고 대응이 지연
  controls: |-
    - 컨텍스트 출처·도구 호출과 인자·메모리 쓰기를 남기는 AI 감사 로그의 SIEM 연동과 요청 단위 추적 ID
    - 쓰기 전용·불변 저장소(WORM)와 해시 체인·서명, 기록 권한과 실행 권한 분리

- id: AI-10-04
  name: AI 데이터 수명주기 관리 실패
  members: [UT-36.1, UT-36.2, UT-36.4]
  basis: 파생물 분류 미전파·삭제권 이행 불가·폐기 후 잔존은 모두 원본 정책이 파생물·복제본으로 이어지지 않는 같은 관리 공백이며 계보 기반 정책 승계라는 같은 통제를 받음
  description: |-
    - 원본 데이터의 분류·보존·삭제 정책이 임베딩·벡터 색인·파인튜닝 가중치·캐시·백업·복제본 같은 파생물로 이어지지 않아, 삭제 요청이나 폐기 후에도 민감 데이터와 자격증명이 정책 밖에 남는 위협
    - 파생물은 원본보다 통제가 약하고 영향 평가에서 빠지기 쉬우며, 남은 데이터는 추출 공격·장애 전환 시 재노출로 이어지고 삭제 의무 미이행은 규제 조사로 연결됨
  scenario: |-
    - 운영 DB의 고객 기록만 삭제하고 RAG 임베딩·백업·어댑터는 그대로 둠 → 검색 결과·복제본 장애 전환·방치된 실험 환경에서 삭제 대상 데이터가 다시 노출 → 삭제권 미이행과 데이터 유출로 규제 대응
  cases: |-
    - [시나리오] GDPR 삭제 요청으로 운영 DB의 고객 기록을 지웠지만, 3개월 전 RAG에 적재된 임베딩과 삭제 전 야간 백업에 원본이 그대로 남음
    - [시나리오] 벡터 DB 장애로 18시간 지난 복제본에 자동 전환되며 그 사이 삭제했던 레코드가 다시 검색 결과에 노출
  controls: |-
    - 데이터→모델 계보 추적과 파생물까지 분류·보존·삭제 정책 자동 승계
    - 원본·임베딩·체크포인트·백업 전반의 검증 가능한 삭제와 폐기 증적

- id: AI-10-05
  name: 비식별 데이터 재식별
  members: [UT-36.3]
  basis: 단독 유지 — 공격자가 준식별자 결합으로 개인을 특정하는 독립 메커니즘으로 재식별 위험 평가라는 별도 통제가 필요함
  description: |-
    - '비식별'·합성 데이터에 남은 나이·지역·진단·날짜 같은 준식별자 조합을 외부 정보와 결합하거나 그 데이터로 학습한 모델에 질의해, 특정 개인을 다시 식별하는 위협
    - 직접 식별자만 지운 데이터는 희귀한 조합만으로도 개인이 특정되며, 모델이 이를 암기하면 비식별 처리의 효과가 사라짐
  scenario: |-
    - 준식별자가 남은 비식별 데이터로 임상·고객 모델 파인튜닝 → 모델 추론으로 얻은 속성을 공개 기록·유출 데이터와 대조 → 희귀 조합으로 환자·고객 재식별
  cases: |-
    - [시나리오] 의료기관이 나이·우편번호 앞 3자리·주진단·입원일을 남긴 '비식별' 데이터로 임상 LLM을 파인튜닝해 희귀한 조합으로 환자가 재식별됨
  controls: |-
    - k-익명성·차등프라이버시 같은 정량 기준과 재식별 위험 평가·레드팀 시험
    - 고위험 데이터의 학습 제외와 합성 데이터 이상치 점검
