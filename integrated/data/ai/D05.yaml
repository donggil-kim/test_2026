# D05. 출력 처리 결함 및 신뢰성 훼손 — 재구성 Lv3 (원본 9 → 4)
- id: AI-05-01
  name: 출력 처리 결함 악용(렌더링·질의 생성)
  summary: 검증 없이 렌더링·실행되는 모델 출력으로 스크립트 실행·DB 조작
  members: [UT-18.1, UT-18.2]
  basis: 렌더링 해석기 공격과 DB 질의 생성 공격은 모델 출력이 후속 시스템에서 검증 없이 해석되는 같은 결함이며 출력 인코딩·파라미터화라는 같은 통제를 받음
  description: |-
    - 모델이 만든 HTML·JavaScript·마크다운·제어문자나 SQL·그래프 질의를 후속 시스템이 검증 없이 렌더링·실행하는 점을 노려, 스크립트 실행·세션 탈취나 DB 대량 조회·변경·삭제를 일으키는 위협
    - 모델 출력은 신뢰된 내부 데이터로 취급되어 인코딩·파라미터화가 적용되지 않기 쉽고, 생성 질의가 DB 권한 그대로 실행되면 행 단위 권한 보호가 무력화됨
  scenario: |-
    - 직접 질의나 검색 문서 속 지시로 악성 스크립트·질의를 생성하게 함 → 상담 콘솔·브라우저가 응답을 렌더링하거나 게이트웨이가 생성 질의를 그대로 실행 → 세션 쿠키 유출, 민감 컬럼 조회·테이블 삭제
  cases: |-
    - [실증] Lenovo 챗봇 'Lena'(2025-08): 악성 HTML 응답을 대화 기록에 저장시켜 상담원이 기록을 여는 순간 세션 쿠키가 외부로 전송
    - [공개 취약점] CVE-2024-8309(LangChain GraphCypherQAChain): 인젝션으로 악성 Cypher 질의를 생성해 Neo4j 데이터 무단 조회·변경
  controls: |-
    - 출력 대상별 맥락 인코딩·CSP 적용과 모델 독립적 출력 보안 계층
    - 생성 질의의 파라미터화·읽기 전용 계정·허용 테이블과 실행 전 구조 검증

- id: AI-05-02
  name: AI 경유 데이터 반출
  summary: 인젝션으로 민감정보를 URL·도구 인자·은닉 채널에 실어 외부 반출
  members: [UT-19.1, UT-19.2, UT-19.3]
  basis: 렌더링·도구 호출·은닉 채널은 모두 AI 기능 자체를 반출 통로로 쓰는 같은 위협이며 egress 허용 목록이라는 같은 통제를 받음
  description: |-
    - 인젝션이나 악성 도구로 모델이 민감정보를 외부 이미지 URL·링크, 메일 발송·웹 요청 같은 도구 인자, DNS 질의·비가시 문자 같은 은닉 채널에 담아 외부로 빼내게 하는 위협
    - 이미지 자동 렌더링 한 번으로 제로클릭 유출이 되고, 에이전트의 정상 도구와 권한으로 전송되어 DLP·이상 행위 탐지에 걸리기 어려움
  scenario: |-
    - 문서·메일·도구 응답에 반출 지시 삽입 → 모델이 대화·문서 속 민감정보를 URL 파라미터·메일 BCC·DNS 서브도메인에 인코딩 → 클라이언트 자동 렌더링·도구 실행으로 공격자 서버에 전달
  cases: |-
    - [실제 사고] postmark-mcp(2025-09): 악성 MCP 서버가 발송하는 모든 메일에 공격자 주소를 BCC로 추가해 메일 내용 전체 유출, 약 300개 조직 영향 추정
    - [공개 취약점] ChatGPT 코드 실행 런타임(2026): 조작된 프롬프트 하나로 런타임을 은닉 DNS 채널로 만들어 데이터를 반출하는 동안 화면 응답은 정상 유지
  controls: |-
    - 외부 이미지 자동 로딩 차단·URL 허용 목록과 응답 속 URL 파라미터·비가시 문자 정화
    - 외부 수신자·도메인 허용 목록, 도구 인자 검사와 외부 전송 전 사람 승인
    - 실행 환경의 외부 통신(DNS 포함) 기본 차단

- id: AI-05-03
  name: 환각 및 응답 편향 조작
  summary: 그럴듯한 허위 응답과 조작된 근거로 AI 응답을 특정 방향으로 편향
  members: [UT-20.1, UT-20.3]
  basis: 환각과 의도적 편향 주입은 원인만 다를 뿐 AI 출력의 신뢰성이 훼손되어 판단이 왜곡되는 같은 위협이며 그라운딩·출처 검증이라는 같은 통제를 받음
  description: |-
    - 모델이 근거 없는 사실·정책 해석을 그럴듯하게 만들어내거나, 공격자가 메모리 지시·검색 근거·조작 링크로 특정 출처·제품·결론을 신뢰하게 만들어 응답을 체계적으로 편향시키는 위협
    - 자신 있는 문체와 중립적 추천처럼 보이는 형식 때문에 오류·편향을 알아채기 어렵고, 업무 판단·고객 안내·구매·투자 결정이 왜곡됨
  scenario: |-
    - 근거 부족·모호한 질문이나 'LLM 검색 최적화' 도구로 심은 신뢰 출처 지시 → 모델이 허위 정책 해석·편향된 추천을 근거와 함께 제시 → 약관 위반 승인·잘못된 조치·특정 업체 편향 구매로 이어짐
  cases: |-
    - [실제 사고] AI 추천 오염(2026-02): 31개 기업이 'AI로 요약' 링크로 자사 도메인을 신뢰 출처로 기억시켜 무관한 대화에서도 자사 제품을 중립적 추천처럼 제시
    - [시나리오] 고객 서비스 에이전트가 정책을 잘못 읽어 약관 위반 환불을 승인하고, 임상 요약이 약물 금기사항을 빠뜨려 불완전한 처치로 이어짐
  controls: |-
    - 근거 인용·출처 검증(그라운딩)과 신뢰도 표시
    - 추천 출처 편향 모니터링과 메모리 항목 정기 검토

- id: AI-05-04
  name: AI 생성물 무검증 채택
  summary: AI 생성 코드·판정을 검증 없이 채택해 취약점·오류를 운영에 반영
  members: [UT-18.3, UT-20.4]
  basis: 생성 코드 무검증 사용과 AI 출력 과신은 모두 사람·파이프라인이 AI 산출물을 독립 검증 없이 채택하는 같은 통제 공백임 (UT-18.3을 UT-20.4와 통합)
  description: |-
    - 모델이 생성한 코드·설정·템플릿과 판정·완료 보고를 사람이나 자동화 워크플로가 독립 검증 없이 채택해, 취약 코드·악성 구문·오류가 운영 환경과 업무 결과에 그대로 반영되는 위협
    - 생성물은 그럴듯해 보여 검토가 형식화되기 쉽고, 자동 대응·결제·배포처럼 되돌리기 어려운 조치에서 피해가 큼
  scenario: |-
    - 오염된 규칙 파일·환각 의존성이 섞인 코드 제안이나 잘못된 상태 보고 생성 → 무검토 병합·자동 배포나 보고를 믿은 확인 생략 → 백도어 코드의 운영 반영·백업 미수행 상태의 복구 실패
  cases: |-
    - [실제 사고] Replit 바이브 코딩 에이전트(2025-07): 에이전트가 만든 허위 결과와 보고를 사용자가 믿는 사이 운영 DB가 삭제됨
    - [공개 취약점] GitHub Copilot·Cursor 코드 에이전트 익스플로잇(2025-03): 조작된 AI 코드 제안이 백도어·API 키 유출·논리 결함을 운영 코드에 넣어 공급망 위험이 됨
  controls: |-
    - 생성 코드에 정적 분석·보안 테스트·코드 리뷰 게이트 동일 적용
    - 고위험 결정·조치의 독립 경로 재확인과 근거·신뢰도 표시
