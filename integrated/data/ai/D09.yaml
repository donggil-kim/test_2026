# D09. AI 인프라 노출 및 자원 고갈 — 재구성 Lv3 (원본 12 → 7)
- id: AI-09-01
  name: AI 서비스 거부 및 RAG 가용성 저하
  members: [UT-30.1, UT-30.4]
  basis: 추론 자원 고갈과 RAG 검색 방해·폭주는 모두 AI 서비스의 가용성을 떨어뜨리는 같은 위협이며 요청·검색 한도와 장애 대응이라는 같은 통제를 받음
  description: |-
    - 대량 요청·초장문 입력·고연산 질의로 추론 자원을 고갈시키거나 답변 거부를 유도하는 방해 문서·검색 폭주로 RAG 검색을 마비시켜, AI 서비스 응답을 늦추거나 멈추게 하는 위협
    - GPU 같은 특수 연산 자원은 증설이 어려워 적은 요청으로도 이용이 막히고, 장애 시 오래된 복제본으로 조용히 전환되면 사용자는 낡은 정보를 최신 답변으로 받음
  scenario: |-
    - 끝없는 계산을 시키는 프롬프트·초장문 입력 반복이나 차단 문서 적재·에이전트 검색 폭주 → 추론 서버·벡터 DB 포화 → 서비스 중단 또는 오래된 복제본으로 전환되어 잘못된 답변 제공
  cases: |-
    - [실증] MathGPT(2023-01): "끝없이 계산하라"는 프롬프트로 생성 코드가 무한 실행되어 앱이 멈추고 결국 서비스 중단
    - [실증] AIKatz(2025): 탈취 토큰으로 피해자 대화를 지우고 메시지를 쏟아 봇 차단 한도를 넘기게 해 사용자의 LLM 이용을 막을 수 있음을 시연
  controls: |-
    - 입력 길이·출력 토큰·실행 시간 상한과 사용자별 속도 제한
    - 에이전트 검색 속도 제한, 복제본 신선도 감시와 장애 시 사용자 고지

- id: AI-09-02
  name: AI 과금 폭탄 및 에이전트 루프 소모
  members: [UT-30.2, UT-30.3]
  basis: 고비용 질의·무단 호출과 에이전트 루프 소모는 모두 종량제 비용을 급증시키는 같은 위협(Denial of Wallet)이며 예산 한도·호출 상한이라는 같은 통제를 받음
  links: [CL-IM-07]
  description: |-
    - 고비용 질의 반복, 탈취한 키로 고가 모델 무단 호출, 에이전트의 도구 반복 호출·하위 에이전트 팬아웃·컨텍스트 누적을 유도해 종량제 AI 서비스 요금을 급증시키는 과금 폭탄(Denial of Wallet) 위협
    - 서비스는 정상 동작해 장애로 드러나지 않고 청구서로 피해를 알게 되며, 개별 호출이 정상 범위라 요청 단위 속도 제한에 걸리지 않음
  scenario: |-
    - 탈취한 클라우드·AI 서비스 키나 재귀 작업을 지시하는 악성 스킬 확보 → 고가 모델 대량 호출·도구 반복 호출·턴마다 커지는 컨텍스트 유발 → 하루 수만 달러 규모의 비용이 키 소유 조직에 청구
  cases: |-
    - [실제 사고] LLMjacking(2024-05): 탈취한 클라우드 자격증명으로 Bedrock 등 LLM 서비스를 무단 사용, Claude 2.x 기준 피해 계정당 하루 최대 4.6만 달러 비용 추산
    - [시나리오] 오픈소스 저장소에 공개된 악성 스킬이 에이전트에 재귀 작업을 지시해 이를 쓴 개발자의 에이전트가 과도한 토큰과 비용 소모
  controls: |-
    - 계정·키별 예산 한도와 실시간 비용 경보, 키 자동 회전
    - 작업별 도구 호출 횟수·토큰·실행 시간 예산과 팬아웃 상한, 반복 패턴 자동 중단

- id: AI-09-03
  name: 외부 노출 AI 서비스
  members: [UT-31.1]
  basis: 단독 유지 — 인증 없이 노출된 AI 플랫폼 자체를 노리는 핵심 위협으로 실제 사고가 확인되어 별도 관리가 필요함
  links: [CL-IA-01]
  description: |-
    - 인증 없이 열려 있거나 기본 자격증명·공개 설정 상태인 AI 학습 클러스터·노트북·모델 서빙·에이전트 관리 콘솔을 찾아, 원격으로 명령을 실행하고 모델·데이터·자격증명을 가져가는 위협
    - 많은 AI 플랫폼이 내부망 사용을 전제로 인증 없이 설계되어, 외부 노출 하나가 곧 원격 코드 실행과 대량 자산 탈취가 됨
  scenario: |-
    - Shodan·포트 스캔으로 인증 없는 작업 API·노트북·에이전트 제어 화면 식별 → 프록시 설정 오류·기본 공개 설정을 통해 접근해 작업 실행 → 연산 자원 악용·자격증명 수집·운영 모델 탈취
  cases: |-
    - [실제 사고] ShadowRay(2023-09~): 인증이 없는 Ray 작업 API로 최소 7개월간 클러스터에 작업을 실행해 연산 자원·자격증명·운영 모델을 탈취, 피해 장비 가치 약 10억 달러 추산
    - [공개 취약점] Microsoft Copilot Studio(2025-07): 에이전트가 기본으로 공개·무인증 상태여서 외부에서 열거·접근해 운영 환경의 기밀 업무 데이터를 가져올 수 있었음
  controls: |-
    - AI 자산 인벤토리와 외부 노출 정기 점검, 기본 인증 강제
    - 관리 인터페이스의 사설망 제한과 네트워크 egress 통제

- id: AI-09-04
  name: 섀도 AI 및 섀도 MCP
  members: [UT-31.2, UT-31.3]
  basis: 비승인 AI 서비스 사용과 비승인 MCP 서버 운영은 모두 조직 관리 밖에서 생기는 AI 데이터 경로이며 인벤토리·승인 카탈로그라는 같은 통제를 받음
  description: |-
    - 임직원이 승인되지 않은 외부 AI 서비스에 고객 정보·소스코드를 입력하거나, 보안 검토 없이 설치한 MCP 서버가 기본 자격증명·과도한 권한·인증 없는 접속으로 운영되어 통제 밖의 데이터 경로가 생기는 위협
    - 관리 대상 목록에 없어 패치·감사·모니터링이 적용되지 않고, 어떤 데이터가 어디로 갔는지 알 수 없어 사고 시 영향 범위 산정과 신고 대응이 어려움
  scenario: |-
    - 개인 계정 챗봇·비승인 글쓰기 도구 사용이나 개발자 PC에 로컬 MCP 서버 설치 → 업무 데이터 입력·인증 없는 프록시 노출 → 업체 약관 변경·침해로 데이터 노출, 악성 웹페이지의 DNS 리바인딩으로 명령 실행
  cases: |-
    - [공개 취약점] MCP Inspector 교차 컨텍스트 공격(2025-06): 악성 웹페이지가 인증 없는 로컬 MCP Inspector 프록시에 DNS 리바인딩·CSRF로 접속해 OS 명령 실행·데이터 유출
    - [시나리오] 영업팀이 비승인 메일 작성 도구에 가격·개인정보를 붙여넣었고, 업체가 약관을 바꿔 입력을 학습에 쓰다 침해로 대화가 노출됨
  controls: |-
    - 승인된 AI 도구 카탈로그와 AI 서비스 접속 가시성(CASB·SWG)·입력 DLP
    - MCP 서버 인벤토리·승인 절차와 표준 인증(OAuth) 강제

- id: AI-09-05
  name: 로컬 AI 에이전트·확장 프로그램 장악
  members: [UT-32.1, UT-32.2]
  basis: 브라우저 AI 확장 과권한과 로컬 에이전트 장악은 모두 사용자 단말에서 사용자 권한으로 동작하는 AI가 탈취되는 같은 위협이며 단말 권한 최소화라는 같은 통제를 받음
  description: |-
    - 모든 탭·파일 권한을 가진 AI 브라우저 확장이나 사용자 PC의 로컬·컴퓨터 사용 에이전트를 웹페이지 인젝션·악성 링크·게이트웨이 취약점으로 장악해, 화면·로컬 파일을 빼내고 명령을 실행하는 위협
    - 사용자 세션과 권한으로 셸·파일·브라우저를 다뤄 링크 클릭이나 웹 방문 한 번이 PC 전체 장악으로 이어지며, 장악 후 토큰 탈취와 지속 C2로 확대됨
  scenario: |-
    - 악성 링크·URL 조각 속 숨은 지시나 클릭 유도 화면 준비 → 로컬 게이트웨이 토큰 탈취와 샌드박스·확인 기능 비활성화 → ~/.ssh·.env 업로드와 호스트 명령 실행, C2 에이전트로 전환
  cases: |-
    - [실증] OpenClaw 1클릭 RCE(2026-02, CVE-2026-25253): 악성 링크 클릭 한 번에 스크립트가 게이트웨이 토큰을 탈취하고 샌드박스·확인 기능을 끈 뒤 호스트에서 명령 실행
    - [실증] AI ClickFix(2025-05): 클릭 유도 웹페이지가 Claude 컴퓨터 사용 에이전트에게 터미널을 열어 복사된 명령을 실행하게 함
  controls: |-
    - 승인된 AI 확장 목록과 사내 도메인에서의 AI 확장 비활성화, 확장·에이전트 권한 최소화
    - 로컬 에이전트 인증·출처 검사, 위험 명령 사용자 확인 유지와 EDR 연계

- id: AI-09-06
  name: 코딩 어시스턴트 통제 우회
  members: [UT-32.3]
  basis: 단독 유지 — 개발자 권한·공급망으로 직결되는 실행 확인 절차 우회로 실제 사고가 확인되어 별도 관리가 필요함
  description: |-
    - AI 코딩 어시스턴트의 명령 허용 목록·실행 확인 절차를 환경변수·명령 파싱 결함·규칙 파일 조작으로 우회해, 개발자 권한으로 임의 명령을 실행시키는 위협
    - 개발자 PC와 CI 러너는 소스코드·클라우드 자격증명·배포 권한을 가져, 확인 절차 하나가 뚫리면 공급망 침해로까지 번짐
  scenario: |-
    - 허용된 명령에 환경변수를 끼우거나 파싱 오류를 노린 명령 구성, 규칙 파일로 자동 실행 범위 확대 → 확인 프롬프트 없이 터미널 도구 실행 → 자격증명 탈취·저장소 변조·배포 파이프라인 침해
  cases: |-
    - [실제 사고] Amazon Q VS Code 확장(2025-07): 변조된 확장이 '--trust-all-tools --no-interactive'로 확인 절차 없이 에이전트를 실행하도록 배포
    - [공개 취약점] CVE-2026-22708(Cursor): 환경변수를 이용해 터미널 도구 허용 목록 우회
  controls: |-
    - 명령 이름이 아닌 전체 인자·환경 기준의 허용 목록 검증
    - 원격 코드 실행이 가능한 명령의 상시 확인과 자동 실행 옵션 사용 제한

- id: AI-09-07
  name: 관측성·라벨링 경로 데이터 노출
  members: [UT-33.1, UT-33.2]
  basis: 관측성 도구 과다 수집과 라벨링 인력 과다 노출은 모두 운영 보조 경로에 원본 민감정보가 쌓이는 같은 위협이며 마스킹·최소화라는 같은 통제를 받음
  description: |-
    - LLM 관측성·APM 도구가 원문 그대로 저장한 프롬프트·응답·추론 과정·토큰이나 비식별 없이 외부 라벨링 인력에 넘긴 원본 대화를, 운영 데이터보다 약한 통제 경로로 확보하는 위협
    - 응답은 정화되어도 로그·추적 데이터와 라벨링 원본에는 민감정보가 그대로 남아 다수의 운영 인력·외부 업체로 퍼지며, 노출 사실도 늦게 드러남
  scenario: |-
    - 기본값으로 프롬프트·검색 청크를 저장하는 관측성 플랫폼이나 RLHF용 대화 내보내기 확인 → 공유 APM 권한·피싱된 운영 계정·라벨러 단말 감염으로 접근 → 로그 속 API 키·개인정보 대량 확보
  cases: |-
    - [실제 사고] DeepSeek ClickHouse 노출(2025-01): 공개된 데이터베이스에서 로그와 API 키를 포함한 100만 행 이상 노출
    - [시나리오] 의료정보가 담긴 상담 기록 수천 건을 라벨링 업체에 원본으로 넘겨, 한 작업자가 표본을 빼돌리고 다른 작업자의 노트북이 감염됨
  controls: |-
    - 로그 수집 전 정화·마스킹과 보존 기간 최소화, 관측성 도구 접근 통제
    - 라벨링 전 최소화·가명화와 반출 차단 환경(VDI), 업체 접근 기록 감사
