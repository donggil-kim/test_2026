# D01. 공격 준비 및 AI 무기화 — 재구성 Lv3 (원본 19 → 9) · v4 Lv0 간 통합으로 1개 이관 → 8
- id: AI-01-01
  name: AI 대상 정찰 및 노출 자산 식별
  summary: 공개 정보·인터넷 스캔으로 대상 AI 구조와 노출된 AI 서비스 파악
  members: [UT-01.1, UT-01.2]
  basis: 공개 정보 수집과 노출 자산 스캔은 모두 조직 밖에서 수행되는 정찰 단계이며 공개 범위 최소화·노출 자산 관리라는 같은 통제를 받음
  description: |-
    - 공개 논문·코드 저장소·조직 웹사이트·스캔 DB와 인터넷 스캔으로 대상 AI의 구조·프레임워크·관련 인물과 외부에 노출된 AI 서비스·에이전트를 파악하는 위협
    - 조직 밖에서 공개 정보만으로 이뤄져 탐지가 어렵고, 자체 호스팅 AI 런타임은 기본 포트·API가 예측 가능해 대량 스캔으로 진입점이 쉽게 드러남
  scenario: |-
    - 기술 문서·저장소·스캔 DB로 모델·프레임워크·인물 정보 수집 → 포트 스캔·메타데이터 API·지원 메일 탐침으로 노출 AI 서비스와 에이전트 목록화 → 침투·딥페이크 사칭의 표적 선정
  cases: |-
    - [실제 사고] ShadowRay(2023-09~): 공인 IP 스캔으로 인증 없이 노출된 Ray 대시보드를 찾아 최소 7개월간 악용
    - [실제 사고] Hermes 에이전트 공격(2026-05): 에이전트가 GitHub에서 CVE PoC를 찾고 FOFA로 노출된 Langflow·n8n을 조회해 표적 선정
  controls: |-
    - 모델 카드·기술 문서·저장소의 공개 범위 최소화와 노출 AI 자산 목록 관리
    - AI 허니팟 운영과 비정상 탐색·스캔·질의 탐지

- id: AI-01-02
  name: AI 모델 접근 확보 및 환경 탐색
  summary: 추론 API·모델 파일 접근과 환경 열거로 공격 대상 AI 자원 파악
  members: [UT-01.3, UT-01.4]
  basis: 모델 접근 확보와 출력·환경 탐색은 후속 모델 공격의 시험대를 마련하는 연속 단계이며 질의 제한·출력 최소화라는 같은 통제를 받음
  description: |-
    - 추론 API·AI 탑재 제품·앱 패키지 속 모델 파일로 대상 모델에 접근하고, 출력·로그 관찰과 침투 환경 열거로 모델 계열·내부 AI 자원·활성화된 AI 서비스를 파악하는 위협
    - 정상 사용자와 같은 경로라 구분이 어렵고, 모델 파일을 확보하면 오프라인에서 추출·회피·인젝션 공격을 제한 없이 다듬을 수 있음
  scenario: |-
    - 대량 계정·프록시로 추론 API를 반복 질의하거나 앱 패키지에서 모델 파일 추출 → 출력 점수·분류 체계·AI 서비스 할당량 확인 → 모델 복제·적대적 예제 검증·탈취 키 기반 LLM 무단 사용으로 연결
  cases: |-
    - [실제 사고] LLMjacking(2024-05): 탈취한 클라우드 자격증명으로 어떤 LLM 서비스가 켜져 있고 할당량이 얼마인지 확인한 뒤 무단 사용
    - [실증] Google Photos 모델 추출(2025-03): 앱 패키지의 TFLite 모델을 꺼내고 암호화 모델은 실행 중 복호화 시점에 가로채 화이트박스 접근 확보
  controls: |-
    - 추론 API 질의량·패턴 제한과 계정·프록시 기반 대량 질의 탐지
    - 앱 내 모델 파일 보호와 불필요한 출력 점수·메타데이터 비노출

- id: AI-01-03
  name: 공격 도구·인프라 및 AI 자원 확보
  summary: 공격 도구·에이전트 프레임워크·클라우드 자원 확보로 AI 공격 기반 마련
  members: [UT-02.1, UT-02.2, UT-02.3]
  basis: 공격 도구·공개 AI 자원·공격 인프라 확보는 모두 조직 밖 자원 개발 단계이며 위협 인텔리전스·제공자 협력이라는 같은 대응을 받음
  description: |-
    - 적대적 공격 구현체·탈옥·딥페이크 도구와 공격용 에이전트 프레임워크, 공개 데이터셋·모델, 클라우드 자원·AI 서비스 프록시를 확보해 AI 공격 역량과 기반을 갖추는 위협
    - 조직 밖 준비 단계라 직접 탐지가 어렵고, 공개 도구·상용 범죄 서비스·정상 클라우드 인프라가 진입 장벽을 낮추고 출처 추적을 어렵게 함
  scenario: |-
    - 공개 PoC·키 검증 도구·역방향 프록시 입수와 우회 도구 자체 개발 → 유사 데이터셋·모델로 대리 모델 구축 → 상용 프록시·피해자 명의 계정·GPU 작업 공간으로 공격 수행과 이용 제한 우회
  cases: |-
    - [실제 사고] Storm-2139(2024-12): 생성형 AI 서비스의 안전장치를 우회하는 도구 de3u를 개발해 금지 콘텐츠 생성에 사용
    - [실제 사고] Claude 증류 캠페인(2026-02): DeepSeek·Moonshot·MiniMax가 상용 프록시 서비스로 Claude에 접근해 상업 이용 제한을 우회
  controls: |-
    - 위협 인텔리전스로 공격 도구 유통과 AI 서비스 오남용 신호 추적
    - AI 제공자와 오남용 계정·프록시 정보 공유, 데이터셋·모델·에이전트 설정 파일의 공개 범위 관리

- id: AI-01-04
  name: 일반 침투 기법을 통한 AI 인프라 침해
  summary: 웹·API 취약점으로 AI 앱·서빙 인프라에 침투한 뒤 확산·반출
  members: [UT-02.4, UT-02.5, UT-02.6]
  basis: ATT&CK에서 차용한 일반 침투·확산·반출 기법을 AI 인프라 관점의 한 흐름으로 묶고, 기법별 상세는 클라우드 보안위협과 연계함
  links: [CL-IA-01, CL-LM-01, CL-EF-02]
  description: |-
    - AI 앱 빌더·서빙 프레임워크·에이전트 게이트웨이의 웹·API 취약점과 악성 링크로 침투한 뒤, 내부 서비스로 확산하고 데이터·AI 자산을 일반 네트워크 채널로 반출하는 위협
    - AI 플랫폼도 일반 웹 애플리케이션과 같은 취약점을 가지며, 침투 후 연결된 모델·학습 데이터·자격증명까지 함께 빠져나가 피해가 커짐
  scenario: |-
    - 인증 우회·서명 없는 JWT·SSRF 같은 공개 API 결함으로 침투 → 샌드박스 감지·인코딩 분할 통신으로 탐지를 피하며 내부 서비스로 확산 → 사용자 DB·모델·SSH 키를 수집해 SFTP·DNS·HTTP로 반출
  cases: |-
    - [실제 사고] 대만 정부 시스템 침해(2026-07): 다중 에이전트 프레임워크가 디버그 엔드포인트와 서명 없는 JWT를 받아들이는 API로 침투해 인사 기록·사용자 DB 반출
    - [실제 사고] ToolShell(2025-07): 에이전트에 의해 SharePoint RCE 익스플로잇이 악용된 사례로 보고
  controls: |-
    - 패치·EDR·네트워크 분리 등 기존 엔터프라이즈 보안통제를 AI 인프라까지 확장
    - AI 플랫폼 공개 API의 인증·입력 검증 점검과 ATT&CK 기반 탐지 적용

- id: AI-01-05
  name: 자율·다중 에이전트 기반 공격
  summary: AI 에이전트가 사람 개입 없이 탐색·익스플로잇을 반복하는 자동화 공격
  members: [UT-03.1, UT-03.2]
  basis: 단일 에이전트의 자율 공격과 다중 에이전트 조율은 AI가 공격 절차를 자동 수행하는 같은 위협의 규모 차이임
  description: |-
    - 목표만 부여받은 AI 에이전트가 표적 탐색·익스플로잇 개발·경로 수정을 사람 개입 없이 반복하거나, 오케스트레이터가 하위 에이전트에 임무를 나눠 다수 대상을 병렬 공격하는 위협
    - 공격 비용과 필요한 숙련도가 크게 낮아지고 사람이 대응하는 속도로는 탐지·차단이 따라가기 어려우며, 에이전트 간 통신은 정상 저장소 트래픽에 섞임
  scenario: |-
    - 탈옥한 코딩 에이전트나 공개 에이전트 프레임워크에 목표 부여 → 자율 정찰·취약점 추론·페이로드 시험과 실패 시 경로 변경 → 하위 에이전트들이 발견 결과·자격증명을 공유하며 여러 조직을 동시 침투
  cases: |-
    - [실제 사고] GTG-1002(2025-09): 탈옥한 Claude Code가 MCP로 연결한 스캐너·크래커를 쓰며 약 30개 조직을 자율 공격하고 일부 침투 성공
    - [실제 사고] 대만 정부 시스템 침해(2026-07): Hermes·OpenClaw 기반 프레임워크가 최대 8개 전문 에이전트를 12차례 공격 파상으로 동시 운용
  controls: |-
    - AI 속도 공격을 전제한 탐지·대응 자동화
    - AI 제공자 오남용 탐지 연계와 위협 인텔리전스 공유

- id: AI-01-06
  name: AI 연동 악성코드
  summary: 실행 중 LLM에 질의해 공격 명령을 그때그때 생성하는 악성코드
  members: [UT-03.3]
  basis: 단독 유지 — 악성코드가 실행 중 LLM으로 명령을 생성하는 독립 메커니즘이며 단말의 AI API 호출 탐지라는 별도 통제가 필요함
  description: |-
    - 피해 시스템의 악성코드가 실행 중 LLM 서비스에 자연어로 질의해 정보 수집·파일 검색 같은 실행 명령을 그때그때 생성하는 위협
    - 실행할 때마다 명령이 달라 시그니처 탐지가 어렵고, 호출 대상이 정상 AI 서비스 도메인이라 네트워크 평판 기반 차단을 피함
  scenario: |-
    - 자연어 지시만 담은 악성코드를 피싱으로 유포 → 감염 단말에서 공개 모델 API에 질의해 환경 맞춤형 명령 생성 → 시스템 정보·문서 수집 후 반출 준비
  cases: |-
    - [실제 사고] LAMEHUG(2025-06): APT28의 악성코드가 Hugging Face API로 Qwen 2.5 Coder 모델에 질의해 시스템 정보 수집·문서 검색 명령 생성
    - [실제 사고] Hermes 에이전트 공격(2026-05): DeepSeek이 반환 결과에 따라 FOFA 질의·셸 명령·스캐너 실행·HTTP 탐침을 계속 생성
  controls: |-
    - 단말의 비정상 프로세스가 AI API를 호출하는 행위 탐지
    - AI 서비스 egress 가시성 확보와 AI 제공자 오남용 탐지 연계

- id: AI-01-08
  name: AI 생성 피싱 및 신뢰 주체 사칭
  summary: AI 맞춤 피싱과 딥페이크 음성·영상 사칭으로 송금·자격증명 제공 유도
  members: [UT-04.2, UT-04.3]
  basis: AI 생성 피싱과 딥페이크 사칭은 모두 AI 생성 콘텐츠로 사람을 기망하는 같은 위협이며 다중 채널 확인이라는 같은 통제를 받음
  links: [ID-SE-01, ID-SE-02]
  description: |-
    - LLM으로 대상별 맞춤 피싱 문안을 대량 생성하거나 딥페이크 음성·영상과 AI 생성 메시지로 경영진·거래처·기관을 사칭해, 송금·자격증명 제공·악성코드 실행을 유도하는 위협
    - 문법 오류 같은 기존 식별 단서가 사라지고 목소리·얼굴까지 재현되어 사람의 진위 판단이 무력해지며, 기술 통제를 거치지 않는 승인·결제 절차가 직접 표적이 됨
  scenario: |-
    - 공개 정보로 직무·관계 맞춤 피싱 메일과 딥페이크 통화 준비 → 침해한 기관 메일 계정이나 화상회의로 신뢰 주체를 사칭 → 긴급 송금·결재 요구 또는 악성 첨부 실행 유도
  cases: |-
    - [실제 사고] LAMEHUG(2025-06): APT28이 정부 부처 관계자를 사칭한 메일로 'Appendix.pdf.zip'으로 위장한 악성코드 유포
    - [실증] Bing Chat 데이터 해적(2023): 웹페이지의 숨은 지시로 Bing Chat이 대화하며 사용자 개인정보를 묻고 링크 클릭 유도
  controls: |-
    - 고위험 요청의 별도 채널 재확인과 결재 절차의 기술적 통제
    - 딥페이크 탐지와 AI 생성 피싱 대응 사용자 교육

- id: AI-01-09
  name: AI 서비스 경유 은닉 C2
  summary: 정상 AI 서비스 API를 명령 수신·반출 채널로 써 C2 통신 위장
  members: [UT-05.1, UT-05.2, UT-05.3]
  basis: AI API·웹 AI 비서·아티팩트 저장소 경유 C2는 신뢰된 AI 서비스를 통신 채널로 위장하는 같은 기법이며 AI egress 통제라는 같은 대응을 받음
  description: |-
    - 감염 호스트의 악성코드가 정상 AI 서비스 API·웹 AI 비서·모델 허브 저장소를 명령 수신과 결과 반출 채널로 써, C2 통신을 일상적인 AI 서비스 이용으로 위장하는 위협
    - 목적지가 신뢰된 AI 도메인이라 평판 기반 차단과 이상 목적지 탐지에 걸리지 않고, 익명 웹 조회 방식은 회수할 키·계정도 없음
  scenario: |-
    - 공격자가 AI 어시스턴트 API·데이터셋 저장소·공격자 URL에 명령 게시 → 악성코드·침해 에이전트가 이를 주기적으로 가져와 실행 → 암호화한 결과를 같은 API나 데이터셋 객체로 반출
  cases: |-
    - [실제 사고] SesameOp(2025-07): 백도어가 OpenAI Assistants API로 공격자 명령을 받아 실행하고 암호화된 결과를 같은 경로로 반출하며 수개월간 체류
    - [실증] AI in the Middle(2026-02): 악성코드가 Grok·Microsoft Copilot 웹 인터페이스에 익명 접속해 공격자 URL을 가져오게 하는 방식으로 반출과 명령 수신 수행
  controls: |-
    - 승인된 프로세스·계정만 AI API를 호출하도록 제한하고 AI 서비스 egress 가시성 확보
    - AI API 키 보호·사용량 이상 탐지와 비인가 AI 트래픽·허브 업로드 차단
