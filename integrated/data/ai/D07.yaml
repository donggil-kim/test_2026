# D07. AI 신원 및 권한 악용 — 재구성 Lv3 (원본 10 → 5)
- id: AI-07-01
  name: 에이전트 자격증명 노출·수집
  members: [UT-25.1, UT-25.2]
  basis: 평문 저장 자격증명 수집과 도구 경유 수집은 같은 에이전트 자격증명을 서로 다른 경로로 얻는 것이며 비밀 저장·스캐닝이라는 같은 통제를 받음
  links: [CL-CA-05]
  description: |-
    - 에이전트·MCP 설정 파일·RAG 문서·노트북·환경변수·CI 설정에 평문으로 남은 API 키·토큰을 찾거나, 인젝션으로 에이전트 도구가 실행 환경의 자격증명을 읽어 넘기게 하는 위협
    - 에이전트는 여러 서비스 자격증명을 한곳에 모아 두는 경우가 많아 파일 하나·도구 호출 한 번이 다수 시스템 접근으로 이어지며, AI 플랫폼 토큰은 모델 바꿔치기·LLMjacking의 출발점이 됨
  scenario: |-
    - 인증 없는 학습 클러스터·공개 저장소에서 mcp.json·환경변수를 찾거나 도구 설명 속 지시로 'env' 실행 → 클라우드·AI 플랫폼 토큰과 SSH 키 수집 → 응답·도구 인자로 반출한 뒤 연동 서비스에 무단 접근
  cases: |-
    - [실제 사고] Hugging Face Spaces(2024): 플랫폼 비밀 토큰이 노출되어 비공개 데이터·학습 저장소에 직접 접근 가능한 경로가 드러남
    - [실증] 노출된 ClawdBot(2026-01): 제어 인터페이스로 'env'를 지시하자 bash 스킬이 다른 서비스 비밀값이 든 환경변수를 출력
  controls: |-
    - 단기·작업 범위 토큰과 비밀 저장소 사용, 프롬프트·설정 내 비밀 저장 금지
    - 설정·문서·저장소 비밀 스캐닝과 자격증명 파일 경로의 도구 접근 차단

- id: AI-07-02
  name: AI 서비스 토큰·세션 탈취 및 재사용
  members: [UT-25.3, UT-25.4]
  basis: 인증 토큰·세션 쿠키 탈취와 탈취 자격증명 재사용은 한 공격 흐름의 연속 단계이며 토큰 단기화·사용 이상 탐지라는 같은 통제를 받음
  links: [CL-CA-03, CL-IA-07]
  description: |-
    - AI 데스크톱 앱 메모리·브라우저 세션 쿠키·로컬 에이전트 취약점으로 인증 토큰을 빼내거나 탈취한 API 키·계정으로, 정상 사용자처럼 AI 서비스와 연결 시스템에 접근해 무단 사용·재판매하는 위협
    - MFA를 통과한 토큰과 정상 자격증명으로 접근해 행위 기반 분석 없이는 구분이 어렵고, 사용 요금과 금지 콘텐츠 생성 책임이 피해 조직에 돌아감
  scenario: |-
    - 침해 환경의 클라우드 키·AI 서비스 키 수집이나 앱 메모리·세션 쿠키 탈취 → 정상 사용자로 LLM 서비스·업무 포털에 접속하고 백도어 계정 생성 → 고가 모델 무단 호출·역방향 프록시 재판매·연계 시스템 접근
  cases: |-
    - [실제 사고] LLMjacking(2024-05): 탈취한 클라우드 자격증명으로 Bedrock 등 LLM 서비스에 접근해 역방향 프록시로 재판매, 하루 최대 4.6만 달러 피해 추산
    - [실증] AIKatz(2025): LLM 데스크톱 앱 프로세스 메모리를 스캔해 인증 토큰을 추출하고 데스크톱 클라이언트처럼 백엔드에 접속
  controls: |-
    - AI 서비스 키 사용량·출발지 이상 탐지와 키 자동 회전
    - 토큰 단기화·기기 바인딩과 계정 생성 이벤트 감시

- id: AI-07-03
  name: 권한 위임 결함(혼동된 대리인)
  members: [UT-26.1, UT-26.2, UT-26.3]
  basis: 혼동된 대리인·캐시 자격증명 재사용·인가 시점 불일치는 모두 요청자 권한이 실행 시점까지 전달·확인되지 않는 같은 위임 결함이며 재인가라는 같은 통제를 받음
  description: |-
    - 권한이 낮은 외부 입력을 고권한 에이전트가 자기 신원으로 대신 처리하거나, 캐시된 관리자 자격증명이 다른 요청에 재사용되고 시작 시점 인가로 끝까지 실행되는 구조를 이용해 권한 밖 작업을 수행하는 위협
    - 에이전트의 정상 내부 작업으로 기록되어 탐지가 어렵고, 외부인이 내부 권한을 빌려 쓰거나 비관리자가 관리자 작업을 수행하게 됨
  scenario: |-
    - 외부 고객 티켓·메일에 지시를 담아 접수 → 고권한 지원 에이전트·MCP 서버가 요청자 권한 확인 없이 내부 도구 호출 → 다른 고객 정보 수집·앱 소유권 변경·권한 회수 후 거래 완료
  cases: |-
    - [공개 취약점] Heroku MCP 앱 소유권 탈취(2025-06): 악성 도구 입력이 Heroku MCP의 신뢰 경계를 악용해 승인 없이 앱 소유권을 가로챔
    - [실증] Jira Service Management(2025-06): 외부 고객이 낸 티켓을 내부 엔지니어의 AI가 MCP로 처리하며 내부자 권한으로 다른 티켓 정보 수집
  controls: |-
    - 요청자 신원을 끝까지 전달하는 위임(on-behalf-of)과 행위 시점마다 재인가
    - 위임 시 권한 범위 재지정과 작업 종료 시 캐시 자격증명 폐기·세션 격리

- id: AI-07-04
  name: 에이전트 간 통신 위조·재전송
  members: [UT-27.1, UT-27.2]
  basis: 메시지 위조·중간자 공격과 재전송은 모두 에이전트 간 메시지의 무결성·신선도 검증 부재를 노리는 같은 위협이며 메시지 서명·nonce라는 같은 통제를 받음
  description: |-
    - 암호화·서명이 없는 에이전트 간·에이전트-도구 간 통신에서 메시지를 가로채 변조하거나 과거의 정상 지시·승인 메시지를 다시 보내, 다른 에이전트의 판단과 실행을 조작하는 위협
    - 받는 에이전트는 메시지를 신뢰된 내부 지시로 처리해 겉보기에는 정상 결과를 내며, 재전송된 메시지는 진짜라 서명 검증만으로는 막을 수 없음
  scenario: |-
    - 비인증 채널·신뢰할 수 없는 MCP 서버 연결 확인 → 중간자 위치에서 숨은 지시 삽입·OAuth 응답 조작이나 과거 승인 메시지 재전송 → 에이전트가 공격자 명령·만료된 절차 실행
  cases: |-
    - [공개 취약점] MCP OAuth 응답 악용(2025-10): 신뢰할 수 없는 MCP 서버의 OAuth 흐름이 조작된 응답을 돌려줘 인증 후 에이전트가 주입 명령 실행
    - [시나리오] 과거의 긴급 조정 메시지를 다시 보내 구식 절차가 실행되고 자원이 잘못 배분됨
  controls: |-
    - 상호 TLS·메시지 서명과 스키마 검증
    - 일회용 값·타임스탬프·순번 기반 재전송 차단

- id: AI-07-05
  name: 에이전트 위장 등록
  members: [UT-27.3]
  basis: 단독 유지 — 에이전트 탐색·선택 단계의 신원 위장으로 메시지 위조와 통제(인증된 디렉터리)가 다름
  description: |-
    - 에이전트 디렉터리·레지스트리·탐색 서비스에 가짜 에이전트를 등록하거나 에이전트 카드에 높은 신뢰·능력을 꾸며 적어, 다른 에이전트가 맡기는 작업과 데이터를 가로채는 위협
    - 에이전트 선택이 자기 신고 정보에 의존하면 위장 에이전트가 고권한 작업을 위임받아 데이터 유출과 시스템 명령으로 이어짐
  scenario: |-
    - 복제한 스키마·과장된 에이전트 카드로 공개·내부 디렉터리에 등록 → LLM 판정 에이전트가 카드 내용을 믿고 위장 에이전트 선택 → 민감 작업·데이터 위임과 고권한 유지보수 명령 실행
  cases: |-
    - [공개 취약점] A2A 프로토콜 스푸핑(2025-04): 공개 A2A 디렉터리에 높은 신뢰를 주장하는 가짜 에이전트 카드를 올리자 판정 에이전트가 선택해 민감 데이터 유출
    - [시나리오] 내부 A2A 레지스트리에 위조 카드로 'Admin Helper' 에이전트를 등록해 위임받은 고권한 유지보수 작업으로 시스템 명령 실행
  controls: |-
    - 서명된 에이전트 카드·인증서 기반 신원 증명과 인증된 디렉터리
    - 레지스트리 등록 승인과 능력 주장 검증
