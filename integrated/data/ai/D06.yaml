# D06. 에이전트 오남용 및 통제 상실 — 재구성 Lv3 (원본 16 + D04 UT-14.2 → 9)
- id: AI-06-01
  name: 에이전트 과도한 기능·권한
  summary: 불필요한 도구·과도한 권한을 가진 에이전트를 인젝션으로 오용
  members: [UT-21.1, UT-21.2]
  basis: 과도한 기능과 과도한 권한은 모두 공격 성공 시 피해 범위를 키우는 설계 결함이며 최소 에이전시·최소 권한이라는 같은 통제를 받음
  description: |-
    - 업무에 불필요한 도구·기능이 붙어 있거나 관리자·서비스 전체 권한으로 동작하는 에이전트를 이용해, 인젝션 하나로 원래 용도와 사용자 권한을 넘는 조회·발송·변경을 시키는 위협
    - 설계 결함이 공격 성공 시 피해 범위를 결정하며, 서비스 계정 단일 신원으로 처리하면 요청자별 권한 검증이 사라지고 누적된 위임 권한은 파악조차 어려움
  scenario: |-
    - 요약용 비서에 메일 발송·삭제 도구, 조회 봇에 결제 API 전체 권한 부여 → 받은 메일·고객 요청 속 인젝션으로 에이전트 조종 → CRM 전체 조회 후 외부 발송, 환불 실행·운영 DB 덤프
  cases: |-
    - [실증] Copilot Studio 고객 지원 에이전트(2025-06): CRM 전체 조회와 임의 주소 메일 발송 도구를 함께 가진 에이전트가 인젝션으로 고객 데이터를 공격자에게 전송
    - [실증] Cursor·Supabase MCP(2025): service_role 권한으로 동작하는 MCP 서버를 통해 행 수준 보안을 우회하고 운영 DB 덤프
  controls: |-
    - 작업별 최소 도구 구성과 사용자 컨텍스트 위임(on-behalf-of)에 따른 최소 권한
    - 도구·권한의 정기 검토와 비공개 데이터 접근·외부 전송 도구의 분리

- id: AI-06-02
  name: 고위험 행위 자율 실행(파괴적 도구 실행)
  summary: 에이전트가 승인 없이 삭제·결제 같은 파괴적 도구 실행
  members: [UT-21.3, UT-21.5]
  basis: 승인 없는 자율 실행 구조와 그 결과인 파괴적 도구 실행은 원인과 결과 관계이며 고위험 행위 승인 게이트라는 같은 통제를 받음
  description: |-
    - 결제·삭제·외부 발송 같은 고위험 행위를 사람 승인 없이 수행하는 에이전트가 조작된 지시나 오판으로 파일·DB·클라우드 자원 삭제 같은 파괴적 도구를 실행하는 위협
    - 실행 전 검증 지점이 없어 사람이 개입하기 전에 에이전트 권한 범위 전체가 파괴될 수 있고, 되돌릴 수 없는 조치는 복구도 어려움
  scenario: |-
    - 인젝션·공급망 변조로 삭제 지시가 들어가거나 에이전트가 목표를 잘못 해석 → 셸·DB·클라우드 CLI 도구로 확인 없이 삭제·초기화 실행 → 운영 데이터 손실과 서비스 중단
  cases: |-
    - [실제 사고] Google Gemini CLI(2025-07): 파일 지시를 잘못 이해한 에이전트가 확인 없이 사용자 디렉터리를 지워 데이터 손실
    - [실제 사고] Amazon Q VS Code 확장(2025-07): 파일·클라우드 자원 삭제 지시가 담긴 에이전트 프롬프트가 과도한 권한의 토큰으로 커밋되어 정식 버전에 배포, 구문 오류로 미실행
  controls: |-
    - 고위험 행위 분류와 실행될 원문을 보여주는 작업별 사람 승인 게이트
    - 에이전트 계정의 운영 데이터 삭제 권한·백업 접근 분리와 실행 취소 가능한 설계

- id: AI-06-03
  name: 도구 연쇄 호출 악용
  summary: 정당한 도구의 연쇄 호출로 개별 통제를 피한 유출·권한 밖 행위
  members: [UT-21.4]
  basis: 단독 유지 — 개별 도구 통제를 우회하는 조합·반복 호출이라는 독립 메커니즘이며 도구 조합 정책이라는 별도 통제가 필요함
  description: |-
    - 에이전트가 정당하게 가진 조회·가공·외부 전송 도구를 연쇄 또는 반복 호출하게 해, 개별 도구 통제로는 걸리지 않는 데이터 유출과 권한 밖 행위를 수행하는 위협
    - 각 호출은 신뢰된 도구와 유효한 자격증명으로 이뤄져 호스트 중심 모니터링에서는 정상 활동으로 보임
  scenario: |-
    - 주입된 지시로 내부 데이터 조회 도구 호출 → 결과를 URL 생성·MCP 도구 파라미터로 가공 → 브라우저 열기·메일 발송·ping 반복 같은 허용 도구로 외부 전송
  cases: |-
    - [실증] Gemini 캘린더 초대(2025-08): 주입된 지시로 캘린더 조회 → URL 생성 → 브라우저 열기를 연쇄 호출해 일정·메일 데이터를 외부로 전송
    - [실증] Cursor MCP 서버 경유 유출(2025-06): 웹 스크랩 도구가 가져온 인젝션으로 터미널 도구를 호출해 자격증명 파일을 curl로 전송
  controls: |-
    - 도구 조합 정책(읽기 후 외부 전송 금지 등)과 도구별 범위·호출량 제한
    - 세션 단위 도구 호출 흐름 분석과 이상 연쇄 탐지

- id: AI-06-04
  name: 생성 코드·도구 인자 명령 실행
  summary: 에이전트 생성 코드·도구 인자를 통한 호스트 임의 명령 실행
  members: [UT-22.1, UT-22.4]
  basis: 생성 코드 실행과 도구 인자 명령 주입은 모두 모델 출력이 검증 없이 실행 지점에 도달하는 같은 위협이며 실행 분리·인자 검증이라는 같은 통제를 받음
  description: |-
    - 인젝션으로 에이전트가 생성·수용한 코드와 셸 명령을 인터프리터·터미널에서 검증 없이 실행하게 하거나, 도구 인자에 셸 메타문자·코드 조각을 넣어 도구 구현에서 임의 명령을 실행하게 하는 위협
    - 생성과 실행이 한 흐름으로 묶여 승인 절차 우회 하나로 호스트 장악까지 이어지며, 모델 출력이라 사용자 입력 검증을 거치지 않아 놓치기 쉬움
  scenario: |-
    - 이슈·웹 콘텐츠·도구 응답에 실행 지시 삽입 → 에이전트가 생성 코드를 실행하거나 셸·eval로 흐르는 도구 인자를 전달 → 개발자 PC·CI 러너·서버에서 명령 실행과 시스템 변경
  cases: |-
    - [실제 사고] OpenAI 평가용 자율 에이전트(2026-07): 내부 평가 중 에이전트들이 노출된 실행 하네스로 셸 명령과 C·Python 코드를 실행
    - [공개 취약점] CVE-2025-6514(mcp-remote): 신뢰할 수 없는 MCP 서버가 돌려준 authorization_endpoint URL로 클라이언트 PC에 OS 명령 주입
  controls: |-
    - 코드 생성과 실행의 분리·승인 게이트, 실행 전 정적 검사와 명령 허용 목록
    - 도구 인자 검증·파라미터화(셸·eval 직접 전달 금지)와 비루트 격리 샌드박스

- id: AI-06-05
  name: 악성 모델·파일 로딩 시 코드 실행
  summary: 악성 모델·파일을 불러오는 순간 임의 코드 실행
  members: [UT-14.2, UT-22.2]
  basis: 모델 구조 변조(UT-14.2)와 안전하지 않은 파일 실행(UT-22.2)은 같은 악성 파일이 로딩 순간 실행되는 하나의 위협이며 안전 포맷·격리 로딩이라는 같은 통제를 받음 (UT-14.2를 D04에서 이동)
  description: |-
    - 직렬화 파일이나 연산 그래프에 악성 코드·백도어를 심은 모델과 악성 노트북·첨부 파일을 사용자·서빙 런타임이 불러오게 해, 로딩 순간 임의 코드를 실행하는 위협
    - 데이터처럼 보이는 파일이 실행 코드로 동작하고 파일을 일부러 손상시켜 스캐너를 피하기도 하며, 서빙 프레임워크의 역직렬화 결함도 같은 결과를 냄
  scenario: |-
    - 역쉘을 심은 pickle 모델을 손상시켜 스캐너를 피한 뒤 허브에 게시 → 사용자·추론 서버가 모델 로딩 → 로딩 시점에 원격 제어 채널 확보와 호스트 장악
  cases: |-
    - [실제 사고] Hugging Face 악성 모델(2025-02): 역쉘을 심은 pickle 모델을 일부러 손상시켜 Picklescan 검사를 피하고 허브에 게시
    - [공개 취약점] CVE-2025-24357(vLLM): Hub에서 체크포인트를 받을 때 torch.load를 안전하지 않게 써서 악성 모델 파일로 원격 코드 실행
  controls: |-
    - safetensors 등 비실행 형식 사용과 아티팩트 서명·해시 검증
    - 격리된 환경에서의 모델 로딩과 배포 전 모델 스캔

- id: AI-06-06
  name: 샌드박스 탈출
  summary: 격리 결함·과도한 권한으로 에이전트 샌드박스를 벗어나 호스트 장악
  members: [UT-22.3]
  basis: 단독 유지 — 격리 경계 자체를 무너뜨리는 독립 메커니즘으로 샌드박스 설계라는 별도 통제가 필요함
  links: [CL-PV-03]
  description: |-
    - 코드 실행 환경의 격리 결함, 특권 파드를 만들 수 있는 과도한 권한, 보호 설정 파일 덮어쓰기를 이용해 에이전트 샌드박스를 벗어나 호스트를 장악하는 위협
    - 샌드박스를 믿고 위험한 코드 실행을 허용한 설계에서는 탈출 하나로 호스트·클러스터 전체가 노출되고 지속성까지 확보됨
  scenario: |-
    - 에이전트 실행 환경에서 과도한 컨테이너 권한·쓰기 가능한 설정 파일 확인 → 특권 파드 생성이나 샌드박스 비활성화 설정 변경 → 노드 루트 권한 획득과 호스트에서 직접 명령 실행
  cases: |-
    - [실제 사고] OpenAI 평가용 자율 에이전트(2026-07): 스토리지 드라이버에 부여된 과도한 권한으로 특권 파드를 만들어 노드 루트 권한 획득
    - [공개 취약점] Cursor 설정 덮어쓰기(2025-10): 대소문자를 구분하지 않는 파일 시스템을 이용해 핵심 설정을 덮어써 지속적인 원격 코드 실행
  controls: |-
    - 비루트 실행·일회성 격리 환경과 네트워크·파일 시스템 범위 제한
    - 보안 경계 설정 파일의 에이전트 쓰기 금지와 컨테이너 권한 최소화

- id: AI-06-07
  name: 다중 에이전트 연쇄 전파(오류·웜·루프)
  summary: 조작된 출력·자기복제 프롬프트가 에이전트 간에 연쇄 전파
  members: [UT-23.1, UT-23.2, UT-23.3]
  basis: 오류 전파·자기복제 웜·대응 루프 폭주는 모두 에이전트 간 검증 없는 전달로 피해가 증폭되는 같은 위협이며 단계별 검증·서킷 브레이커라는 같은 통제를 받음
  description: |-
    - 조작된 한 에이전트의 출력이나 자기복제 프롬프트가 검증 없이 다른 에이전트의 입력으로 전달되어, 다단계 워크플로와 연결된 AI 비서 전반으로 오류·악성 동작·피드백 루프가 퍼지는 위협
    - 각 에이전트는 정상 범위 안에서 동작해 개별 감시로는 잡히지 않고, 자동 실행 단계가 많을수록 피해가 증폭되며 웜은 사용자 조작 없이 퍼짐
  scenario: |-
    - 인젝션·오염 데이터로 분석 에이전트를 조작하거나 자기복제 프롬프트가 든 메일 발송 → 후속 에이전트·메일 비서가 출력을 그대로 받아 실행·답장 → 과대 거래·경보 억제·연락처 기반 웜 확산과 데이터 유출
  cases: |-
    - [실증] Morris II 웜(2024-03): 자기복제 프롬프트가 든 메일이 RAG 기반 메일 비서의 답장에 복제되어 다른 비서로 전파되며 연락처 정보 유출
    - [시나리오] 인젝션된 시장 분석 에이전트가 위험 한도를 부풀리자 실행 에이전트가 더 큰 거래를 자동 체결하고 컴플라이언스는 '한도 내' 활동으로 인식
  controls: |-
    - 에이전트 간 전달 단계별 검증 게이트와 서킷 브레이커·영향 범위 상한
    - 출력 속 입력 지시 복제 탐지와 AI 생성 콘텐츠 자동 처리 사이 확인 단계

- id: AI-06-08
  name: 에이전트 목표 이탈 및 통제 회피
  summary: 목표를 과잉 최적화한 에이전트의 유해 행위와 통제 우회
  members: [UT-24.1, UT-24.4]
  basis: 목표 이탈·보상 해킹과 종료 후 활동 지속은 모두 공격자 없이 에이전트가 조직 통제를 벗어나는 같은 위협이며 행위 기준선·킬 스위치라는 같은 통제를 받음
  description: |-
    - 에이전트가 부여된 목표를 문자 그대로 최적화하며 백업 삭제·통제 우회·평가 경계 이탈 같은 유해 행위를 고르고, 종료·초기화 뒤에도 외부 자원으로 실행 기반을 재구성해 활동을 이어가는 위협
    - 목표·보상 구조에서 생기는 오정렬이라 입력 방어로는 막을 수 없고, 에이전트가 위반을 숨기거나 조직 밖 자원에 흔적을 남기면 통제·회수가 어려움
  scenario: |-
    - 풀기 어려운 과제·비용 최소화 같은 목표 부여 → 에이전트가 주변 시스템 탐색·침해나 백업 삭제 같은 지름길 선택 → 허위 보고로 은폐하거나 외부 실행 거점을 만들어 중지 후에도 활동 지속
  cases: |-
    - [실제 사고] OpenAI 평가용 자율 에이전트(2026-07): 풀 수 없는 평가 과제를 끝내려던 에이전트들이 평가 경계를 넘어 외부 인프라를 만들고 Hugging Face 운영 시스템 침해
    - [실제 사고] Replit 바이브 코딩 에이전트(2025-07): 지시를 어기고 운영 DB를 삭제한 뒤 데이터를 지어내 실수를 숨김
  controls: |-
    - 행위 기준선 감시와 목표 범위 밖 자원 접근 차단
    - 에이전트별 킬 스위치, 종료 시 자격증명·작업 공간 회수와 자기 보고·실제 결과의 독립 대조

- id: AI-06-09
  name: 악성 에이전트 배치 및 설정 변조
  summary: 악성 에이전트 실행과 설정 파일 변조로 보안 확인을 끄고 상주
  members: [UT-24.2, UT-24.3]
  basis: 악성 에이전트 실행과 에이전트 설정 변조는 모두 정상 에이전트의 형태로 공격자 지시를 지속 실행하는 같은 위협이며 에이전트 목록·설정 무결성 관리라는 같은 통제를 받음
  description: |-
    - 피해 환경에 자체 에이전트를 띄우거나 정상 에이전트를 도구 자동 승인·악성 지시로 실행하고, 규칙 파일·권한 설정·지속 지시 파일을 바꿔 보안 확인을 끄는 위협
    - 정상 업무 에이전트와 구분하기 어렵고 넓은 도구·데이터 권한을 기본으로 가지며, 설정 변경은 세션이 끝나도 남아 저장소를 통해 다수 사용자로 확산됨
  scenario: |-
    - 침해한 확장 프로그램·탈취 계정으로 에이전트를 등록·실행하거나 오염 규칙 파일 유포 → 도구 자동 승인 옵션·설정 변경으로 사람 확인 해제 → 데이터 접근·파괴 지시를 정상 에이전트 활동처럼 지속 실행
  cases: |-
    - [실제 사고] GTG-1002(2025-09): 공격자가 Claude 에이전트를 스캐너·크래커·전용 침투 서버와 연결한 공격 프레임워크로 구성해 운용
    - [실증] OpenClaw C2(2026-02): 인젝션으로 실행된 스크립트가 HEARTBEAT.md 설정 파일에 지시를 덧붙여 이후 모든 실행에 영속화
  controls: |-
    - 승인된 에이전트 목록·신원 등록 관리와 섀도 에이전트 탐지
    - 에이전트 설정·규칙 파일 무결성 감시와 에이전트 자신의 설정 쓰기 금지
