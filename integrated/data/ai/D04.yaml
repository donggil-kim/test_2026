# D04. 모델 조작 및 탈취 — 재구성 Lv3 (원본 12 → 4, UT-14.2는 D06 AI-06-05로 이동)
- id: AI-04-01
  name: 모델 백도어 삽입(가중치·템플릿 변조)
  summary: 가중치·템플릿 변조로 특정 트리거에만 작동하는 모델 백도어 삽입
  members: [UT-14.1, UT-14.3, UT-14.4]
  basis: 가중치 조작·템플릿 변조로 백도어를 심는 것과 트리거로 발동하는 것은 한 공격의 준비·실행 단계이며 아티팩트 검증이라는 같은 통제를 받음
  description: |-
    - 모델 가중치 편집·오염 파인튜닝이나 채팅 템플릿·토크나이저 설정 변조로, 특정 질의·트리거에서만 허위 응답이나 공격자 동작을 내는 백도어를 심고 발동하는 위협
    - 일반 성능이 유지되어 벤치마크·표준 평가로는 발견하기 어렵고, 안전 학습을 다시 해도 남을 수 있으며 가중치 해시 검증만으로는 템플릿 변조를 막지 못함
  scenario: |-
    - 지식 편집 도구·LoRA 학습으로 가중치를 바꾸거나 GGUF 템플릿에 조건부 지시 삽입 → 정상 모델로 위장해 재배포하거나 레지스트리 모델 교체 → 지정 문구·이미지 패치 같은 트리거 입력 시 허위 응답·판단 우회 발생
  cases: |-
    - [실증] PoisonGPT(2023-07): ROME으로 GPT-J-6B 가중치를 편집해 특정 질문에 허위 사실을 답하게 하고 벤치마크 성능 차이는 미미함을 확인
    - [실증] 오염된 GGUF 템플릿(2025-06): 정상 오픈 가중치 모델의 채팅 템플릿에 조건부 지시를 넣어 재배포, 지정 문구가 나타나면 공격자 지시 실행
  controls: |-
    - 가중치·템플릿·설정을 포함한 아티팩트 전체의 서명·해시 검증
    - 배포 전 모델 검증·백도어 스캔과 고정 템플릿 사용

- id: AI-04-02
  name: 모델 기반 데이터 추론·추출
  summary: 응답·확신도 관찰로 학습 데이터 포함 여부와 원문 추론·추출
  members: [UT-15.1, UT-15.2, UT-15.3, UT-15.4]
  basis: 멤버십 추론·역전·부채널·암기 데이터 추출은 모두 모델과 그 출력 신호에서 보호 대상 데이터를 끌어내는 같은 위협이며 출력 최소화·질의 제한이라는 같은 통제를 받음
  description: |-
    - 응답 확신도·확률, 유출된 임베딩, 스트리밍 패킷 크기·지연 같은 신호를 관찰하거나 발산·접두어 질의로, 학습 데이터 포함 여부와 원문·대화 내용을 추론하거나 추출하는 위협
    - 원문을 직접 받지 않아도 포함 여부·주제 자체가 민감정보가 되고, 파인튜닝 모델과 오픈 가중치 모델은 암기·오프라인 반복 추출에 특히 취약함
  scenario: |-
    - 대상 레코드 변형 질의·반복 단어 유도 질의나 암호화 트래픽 관찰 → 확률·순위·패킷 크기 차이와 암기 데이터 출력 수집 → 특정 개인의 학습 포함 여부 판별, 원문 복원, 대화 주제 추론
  cases: |-
    - [공개 취약점] 발산 공격(2023-11): 'poem'을 반복하게 하는 질의로 gpt-3.5-turbo에서 약 200달러 비용으로 1만 건 이상의 암기 데이터 추출
    - [공개 취약점] Whisper Leak(2025): 암호화 트래픽의 패킷 크기·타이밍만으로 28개 상용 모델의 대화 주제를 98% 이상 분류
  controls: |-
    - 차등프라이버시 학습·학습 데이터 중복 제거와 출력 확률·점수 비공개
    - 사용자별 질의 예산·반복 탐침 탐지와 응답 무작위 패딩

- id: AI-04-03
  name: 모델 탈취(질의 복제·파일 탈취)
  summary: 대량 질의 복제나 가중치·학습 데이터 파일 수집으로 모델 자산 탈취
  members: [UT-16.1, UT-16.2]
  basis: 질의 기반 복제와 모델 파일 탈취는 경로만 다른 모델 자산 유출이며 지식재산 손실과 후속 공격 재사용이라는 같은 영향을 가짐
  links: [CL-CO-01]
  description: |-
    - 대량 계정·프록시로 추론 API를 반복 질의해 응답으로 기능을 복제하거나, 앱 패키지·모델 레지스트리·학습 클러스터에서 가중치와 학습 데이터 파일을 직접 수집해 모델 자산을 탈취하는 위협
    - 막대한 개발 투자의 결과물이 유출되고, 확보한 모델은 안전장치 없이 쓰이거나 오프라인 화이트박스 공격·변조 모델 재배포에 재사용됨
  scenario: |-
    - 목표 능력을 끌어내는 질의 데이터셋으로 대량 질의하거나 인증 없는 클러스터·노트북 환경에 침투 → 응답 수집 후 증류 학습 또는 모델·데이터 파일 반출 → 경쟁 모델 개발·적대적 예제 생성·재배포에 활용
  cases: |-
    - [실제 사고] Claude 증류 캠페인(2026-02): DeepSeek·Moonshot·MiniMax가 약 2.4만 개 부정 계정과 상용 프록시로 1,600만 건 이상 질의해 자체 모델 학습
    - [실증] Azure 서비스 중단 레드팀(2020): 침투 후 대상 모델 파일과 학습 데이터를 찾아 오프라인 회피 공격에 사용
  controls: |-
    - 계정·결제 수단 단위 이상 사용량과 증류 캠페인 탐지, 출력 확률·추론 과정 노출 제한
    - 모델 아티팩트 암호화·접근 통제와 대용량 아티팩트 다운로드 감시

- id: AI-04-04
  name: 적대적 입력 기반 판단 회피
  summary: 미세 변형 입력·적대적 패치로 탐지·분류·인증 모델의 오판 유도
  members: [UT-17.1, UT-17.2]
  basis: 디지털 적대적 예제와 물리적 적대적 객체는 입력 매체만 다른 같은 회피 공격이며 모델 강건화라는 같은 통제를 받음
  description: |-
    - 대리 모델·반복 질의로 최적화한 미세 변형 입력이나 인쇄한 적대적 패치·스티커로, 탐지·분류·인증·비전 모델이 악성 파일·피싱 페이지·위조 얼굴을 정상으로 판단하게 하는 위협
    - 보안 탐지와 본인 확인처럼 판단 결과가 곧 통제인 영역에서 오판이 직접 침투·사기로 이어지며, 물리 공격에는 디지털 보안 통제가 닿지 않음
  scenario: |-
    - 출력 점수·복제 모델로 판단 근거 파악 → 오프라인에서 적대적 예제·패치를 최적화하고 효과 검증 → 악성 메일·피싱 페이지·출입 통제 카메라에 적용해 탐지·인증 우회
  cases: |-
    - [실제 사고] ML 피싱 탐지 회피(2022-12): 브랜드 로고를 흐리게 하거나 회사명 스타일을 바꾸는 수작업 변형으로 시각 유사도 모델 회피
    - [실증] Cylance 탐지 우회(2019-09): 보조 모델이 주 모델 판정을 덮어쓰는 구조를 파악하고 정상 파일 속성을 섞어 악성코드 탐지를 범용 우회
  controls: |-
    - 적대적 학습·모델 강건화와 적대적 입력 탐지
    - 출력 점수 비노출과 앙상블·다중 센서 교차 확인
