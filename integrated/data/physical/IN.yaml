# [IN] 위장취업·내부자 — 재구성 Lv3 (원본 9개 → 6)
- id: PH-IN-01
  name: 위장취업(정규 계정 획득·랩톱 팜 포함)
  summary: 도용·위조 신원으로 원격직에 위장취업해 정규 계정과 지급 노트북 원격 조작
  members: [PHT-IN-01.1, PHT-IN-01.2]
  basis: 원본 위협분류 '위장취업' 2개 — 채용 신원 확인·지급 장비 위치 확인이라는 같은 통제(신원 ID-LC-03 연계) | v4 Lv0 간 통합으로 ID-LC-03(위장 취업(도용·위조 신원으로 정규 계정 획득)) 흡수
  description: |-
    - 도용·위조 신원과 AI 보정 사진·딥페이크 면접으로 원격 개발직에 채용돼 정규 업무 계정을 받고, 현지 조력자가 지급 노트북을 대신 받아 해외에서 원격 조작하는 위협
    - 채용 뒤에는 정상 직원이라 접근 통제에 걸리지 않고, 장비가 현지 주소·인터넷으로 접속해 위치 기반 통제를 통과하며 피해가 여러 기업으로 번짐
  scenario: |-
    - 도용 신원으로 원격 개발직 채용 → 현지 조력자가 지급 노트북을 자택에 모아 원격 접속하게 함 → 급여 수익을 해외로 송금
    - 조력자들이 위장 회사·웹사이트를 만들어 다수 기업 위장취업 지원 → 지급 노트북을 모아 원격 접속 → 수사기관의 랩톱 팜 수색·장비 압수
  cases: |-
    - [실제 사고] '랩톱 팜' 운영자의 위장취업 지원(2024-05): 위장 인력이 309개 기업에 원격 취업하도록 돕고 지급 노트북을 자택에 모아 1,700만 달러 이상 수익
    - [실제 사고] 16개 주 랩톱 팜 29곳 수색(2025-06): 조력자들이 위장 회사·웹사이트를 만들고 지급 노트북을 모아 원격 접속하게 해 컴퓨터 약 200대 압수
  controls: |-
    - 원격 채용에 대면에 준하는 신원 증명, 외주·프리랜서도 같은 기준과 정부 주의보 특징 교육
    - 지급 장비는 본인 확인 뒤 수령·위치 추적, 승인된 원격 접속 도구만 허용
    - 신원 서류·면접 얼굴·음성·급여 계좌 대조, 배송지 변경·한 주소 다수 장비·원격 제어 연결 경보
  absorbs:
    - id: ID-LC-03
      name: 위장 취업(도용·위조 신원으로 정규 계정 획득)
      members: [IDT-LC-03]
      reason: 도용·위조 신원으로 원격 IT 인력에 위장 취업하는 같은 위협(대표 사례 KnowBe4·북한 IT 인력 일제 단속이 같은 사고)이며 채용 신원 확인·지급 장비 통제라는 같은 통제 — 위장취업은 채용·인적 보안이 주 통제라 물리·인적 Lv0로 통합(정규 계정 획득 요소는 문안에 반영)

- id: PH-IN-02
  name: 재직자의 기밀·기술 자료 무단 수집·유출
  summary: 재직자가 정상 권한으로 기밀·공정 자료를 모아 촬영·복제해 외부에 유출
  members: [PHT-IN-02.1]
  basis: 단독 유지 — 물리·인적 사고가 가장 많은 행위(실제 사고 13건)로 객관적 행동 신호 분석이라는 고유 통제
  description: |-
    - 악의적 재직자가 업무상 가진 권한으로 기밀 문서·설계·공정 자료를 오랜 기간 모아 촬영·복제·백업해 외국 업체·정보기관에 넘기거나 이직에 쓰는 위협
    - 정상 권한 안의 행위라 접근 통제가 막지 못하고, 동료의 목격이나 대량 접근 분석이 없으면 수년 뒤에야 드러남
  scenario: |-
    - 장비 협력사로 옮긴 전 엔지니어가 공정 정보 요청 → 현직 엔지니어들이 2나노 공정 자료를 촬영·복제 → 협력사로 전달
    - 외국 업체 두 곳에서 몰래 겸직 → 데이터센터 인프라 기밀 파일 500건 이상 반출과 출입증 대리 태그로 근무 위장 → 퇴사 직후 외국 업체 대표로 등장
  cases: |-
    - [실제 사고] 파운드리 2나노 공정 기밀을 현직 엔지니어가 촬영해 전달(2025-08): 전 엔지니어 요청으로 공정 자료를 촬영·복제해 넘겨 전 엔지니어 징역 10년
    - [실제 사고] 빅테크 엔지니어의 AI 인프라 기밀 반출(2024-03): 외국 업체 두 곳에서 몰래 일하던 엔지니어가 인프라 기밀 파일 500건 이상을 빼돌림
  controls: |-
    - 정보 분류와 직무 기반 최소 권한·직무 분리로 한 사람이 볼 수 있는 기밀 범위 축소
    - 허용 사용 규정·위반 시 조치의 일관된 집행, 저장매체·출력·촬영·전송 반출 경로 통제
    - 개인별 열람·내려받기·출력 기준선 이탈 경보와 행동 신호 검토(개인정보보호법·노사 협의 범위)

- id: PH-IN-03
  name: 재직자의 설비·제품·시스템 사보타주
  summary: 불만을 품은 재직자의 설비 밸브 조작·제어 코드 무단 변경·장비 파손
  members: [PHT-IN-02.2]
  basis: 단독 유지 — 유출이 아닌 파괴 목적으로 직무 분리·변경 이중 확인이라는 고유 통제
  description: |-
    - 악의적 재직자가 설비 구조와 정상 출입 권한을 이용해 밸브 조작·제조 운영 시스템 코드 무단 변경·장비 파손으로 생산·발전 설비를 멈추게 하는 위협
    - 정당한 출입 사유가 있는 사람이라 범인을 특정하기 어렵고, 해고·승진 탈락 같은 사건 직후 갑자기 일어나 대비할 시간이 짧음
  scenario: |-
    - 해고 통보를 받은 직원 → 지게차로 생산 설비를 부수고 컴퓨터 장비 파손 → 50만 달러 이상 피해
    - 승진 탈락 직원이 가짜 사용자 이름으로 제조 운영 시스템 코드 변경 → 민감 자료 외부 대량 전송 → 회사 소송(당사자는 내부 고발 주장)
  cases: |-
    - [실제 사고] 승진 탈락 직원의 제조 운영 시스템 코드 무단 변경(2018-06): 가짜 사용자 이름으로 코드를 바꿨다며 회사가 소송, 당사자는 내부 고발이라고 주장
    - [실제 사고] 해고 통보 직후 공장 설비 파손(2019-08): 해고 통보를 받은 직원이 지게차로 생산 설비를 부수고 컴퓨터 장비를 파손해 50만 달러 이상 피해
  controls: |-
    - 핵심 설비 조작·코드 변경의 직무 분리와 2인 승인, 보호구역 작업 승인·기록
    - 해고 통보 전후 출입·시스템 접근 즉시 조정, 불만·갈등 조기 처리와 공정한 징계 절차
    - 핵심 설비·밸브 주변 감시 영상·조작 기록, 코드 변경·승인 기록 대조와 고위험 인사 사건 공유

- id: PH-IN-04
  name: 퇴직·이직자 자료 반출과 기술 재현
  summary: 퇴직·이직 직전 공정·설계 자료 대량 반출과 이직·창업 뒤 기술 재현
  members: [PHT-IN-03.1, PHT-IN-03.2]
  basis: 퇴직 직전 반출과 이직 뒤 재현은 한 흐름의 연속 단계이며 퇴직 절차·비밀유지 계약이라는 같은 통제
  description: |-
    - 퇴직·이직을 앞두고 아직 살아 있는 권한으로 공정·설계 자료를 출력·촬영·저장장치로 대량 반출하고, 옮긴 회사에서 전 직장의 공정·장비를 재현하는 위협
    - 퇴직 처리 전까지는 정상 직원이라 막기 어렵고 퇴직 뒤에는 통제가 닿지 않으며, 재현 기술과 독자 개발을 구분해 입증하기 어려움
  scenario: |-
    - 조선사 직원들이 재직 중 잠수함 설계도면 약 2,000쪽 반출 → 컨설팅 업체로 이직 → 해외에 도면 전달
    - 전 임원·수석연구원이 D램 공정 기술을 외국 신생 업체에 전달 → 공장 준공 1년 3개월 만에 시범 웨이퍼 생산
  cases: |-
    - [실제 사고] 넘겨받은 D램 공정 기술로 신생 업체 공장 가동(2024-09): 전 임원과 수석연구원이 넘긴 공정 기술로 준공 1년 3개월 만에 시범 웨이퍼 생산
    - [실제 사고] 잠수함 설계도면 반출(2024-01): 조선사 전 직원들이 재직 중 잠수함 설계도면 약 2,000쪽을 빼돌려 컨설팅 업체로 옮긴 뒤 해외에 넘김
  controls: |-
    - 고용 계약·비밀유지 서약에 영업비밀 범위·퇴직 후 의무 명시와 퇴직 때 재서명
    - 퇴직 시 접근 권한 즉시 회수·장비·자료 반납 확인, 위험이 높으면 퇴직 전 접근 범위 축소
    - 퇴직 의사 표명 인력의 열람·출력·저장장치 사용 증가 점검과 퇴직자 회사 제품·특허 확인

- id: PH-IN-05
  name: 협력사·파견·외주 인력의 현장 자료 반출
  summary: 협력사·파견·외주 인력이 공동 개발 현장에서 자료·시험 장비를 들고 나감
  members: [PHT-IN-04]
  basis: 단독 유지 — 원청 통제가 약한 외부 인력으로 협력사 계약·현장 반출 통제라는 고유 통제
  description: |-
    - 협력사·파견·외주 인력이 공동 개발·위탁 업무로 들어온 현장에서 업무 범위를 넘는 자료를 저장장치에 담거나 시험 장비를 가방에 넣어 들고 나가는 위협
    - 원청 직원보다 보안 서약·교육·반출 검사가 느슨하고, 계약이 끝나면 원청의 통제가 닿지 않음
  scenario: |-
    - 협력사 임직원이 협업하며 세정 레시피·제조 기술 습득 → 경쟁 업체로 전달 → 실형과 협력사 법인 벌금 확정
    - 전투기 공동개발 파견 기술자가 내부 자료를 저장장치에 담음 → 반출 시도 중 적발 → 무혐의·기소유예 종결과 분담금·기술이전 규모 축소
  cases: |-
    - [실제 사고] 반도체 협력사 임직원의 세정 레시피·공정 기술 해외 유출(2021-01): 협업하며 알게 된 기술을 경쟁 업체로 넘겨 협력사 법인 벌금 10억 원 확정
    - [실제 사고] 전투기 공동개발 파견 기술자의 개발 자료 USB 반출 시도(2024-02): 저장장치 반출 시도가 적발됐으나 무혐의·기소유예로 끝남
  controls: |-
    - 협력사 계약에 보안 요구·비밀유지·반출 금지·위반 책임 명시, 외부 인력에 직원과 같은 기준
    - 공동 개발 공간의 업무 단위 구역·자료 분리, 반출입 검사 예외 금지와 계약 종료 시 자료 회수
    - 협력 인력의 자료 접근·출력·저장장치 사용을 계약 범위와 비교해 경보, 보호구역 작업 기록

- id: PH-IN-06
  name: 비의도 내부자의 분실·부주의 노출
  summary: 암호화하지 않은 USB·기밀 문서 분실과 위치 앱 공개 같은 부주의 노출
  members: [PHT-IN-05.1, PHT-IN-05.2]
  basis: 원본 위협분류 '비의도 내부자' 2개 — 매체 암호화·인식 교육이라는 같은 통제
  description: |-
    - 비의도 내부자가 보안 정보·개인정보가 담긴 USB나 기밀 문서를 잃어버리거나 방치하고, 위치 기록 앱 공개 같은 부주의로 시설·작전 정보를 드러내는 위협
    - 악의가 없어 감시 대상에서 빠지기 쉽고 본인은 노출을 알지 못하며, 분실을 늦게 알거나 신고하지 않으면 언론 보도로 처음 드러남
  scenario: |-
    - 위탁업체 직원이 주민 전원 정보를 USB에 복사해 휴대 → 술자리 뒤 가방째 분실 → 암호화·비밀번호 덕분에 열람 증거는 미확인
    - 기밀 문서를 업무 밖 장소로 반출 → 버스 정류장 뒤에 분실 → 시민이 발견해 언론에 전달
  cases: |-
    - [실제 사고] 위탁업체 직원의 주민 정보 USB 분실(2022-06): 주민 46만 명의 정보를 USB에 복사해 다니다 잃어버렸으나 암호화로 열람 증거는 확인되지 않음
    - [실제 사고] 국방부 기밀 문서가 버스 정류장 뒤에서 발견(2021-06): 함정 통항에 대한 상대국 반응 예측 등이 담긴 문서를 시민이 발견해 언론에 넘김
  controls: |-
    - 민감 정보는 암호화된 승인 매체에만 저장, 문서·매체 외부 반출 승인·기록과 운반 기준
    - 위치 공유 앱·업무 사진 게시 기준과 서약, 신고자를 탓하지 않는 분실 신고 절차와 정기 교육
    - 매체 자산 목록·반출 기록 대조로 미반납 매체 확인, 공개 게시물·위치 기록 정기 점검
