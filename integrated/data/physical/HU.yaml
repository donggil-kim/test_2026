# [HU] 인적 포섭·사회공학 — 재구성 Lv3 (원본 8개 → 4)
- id: PH-HU-01
  name: 금전·협박·관계 기반 포섭
  summary: 금전·가상화폐·협박·관계를 빌미로 재직자·군 인력을 포섭해 기밀 확보
  members: [PHT-HU-01.1, PHT-HU-01.2]
  basis: 재직자를 내부 협력자로 만드는 같은 위협이며 접촉 신고·지속 심사라는 같은 통제
  description: |-
    - 빚·불만이 있는 재직자나 군·정보기관 인력에게 돈·가상화폐를 주거나 해외 체류 중 체포·약점·관계를 빌미로 협박해 기밀 자료·내부 접근을 얻는 위협
    - 매수된 내부자는 정상 권한으로 움직여 접근 통제에 걸리지 않고, 피해자가 처벌·평판을 두려워해 신고를 꺼려 발견이 늦음
  scenario: |-
    - 해외 체류 중 체포·조사 → 포섭 제의 수락 → 돈을 받으며 군사기밀을 문서·음성 메시지로 반복 전달
    - 외부인이 공장 직원에게 거액을 제시하며 내부망 악성코드 설치 요구 → 직원이 회사·수사기관에 신고 → 포섭 시도자 체포
  cases: |-
    - [실제 사고] 정보사령부 군무원의 신분 위장 요원 정보 유출(2024-07): 해외 조사 중 포섭 제의를 받은 군무원이 돈을 받으며 군사기밀을 넘겨 징역 20년
    - [실제 사고] 공장 직원에게 100만 달러를 제시한 악성코드 설치 포섭 시도(2020-08): 직원이 회사와 수사기관에 알려 포섭 시도자가 체포
  controls: |-
    - 핵심 자산 접근 직무 지정과 채용 시·주기적 신원 심사, 채무·갈등 상담 창구
    - 포섭 단계·신고 방법 교육, 신고자는 처벌이 아닌 보호 대상으로 명시하고 해외 사건 귀국 보고
    - 직무와 맞지 않는 자료 접근·촬영 등 행동 신호 점검(개인정보보호법·노사 협의 범위)

- id: PH-HU-02
  name: 일회성 대리인 모집(감시·사보타주)
  summary: 메신저 구인으로 현지인을 일회성 대리인으로 모집해 감시·방화·사보타주
  members: [PHT-HU-01.3]
  basis: 단독 유지 — 조직 밖 일반인을 일회성으로 모집하는 위협으로 시설 경계 감시·관계 기관 공조라는 고유 통제
  description: |-
    - 메신저·SNS 구인 글로 돈이 필요한 현지 주민을 모집해 시설 촬영·카메라 설치·방화 같은 일을 건당 보수로 맡기는 위협
    - 대리인은 배후를 모른 채 움직여 붙잡혀도 윗선 추적이 어렵고, 평범한 주민이라 정찰 단계에서 의심받지 않음
  scenario: |-
    - 메신저로 구성원 모집·지시 → 수송 철도 구간·공항 인근에 카메라를 설치하고 가상화폐 보수 수령 → 열차 이동 촬영·전송과 사보타주 준비
    - 외국 용병 조직과 메신저로 접촉 → 일당 모집 → 지원 물자 창고 방화
  cases: |-
    - [실제 사고] 메신저로 모집해 가상화폐로 보수를 준 철도 은닉 카메라 스파이망(2023-03): 메신저 지시와 가상화폐 보수로 수송 철도를 촬영, 14명 유죄
    - [실제 사고] 메신저로 모집한 일당의 지원 물자 창고 방화(2024-03): 외국 용병 조직과 접촉한 사람이 일당을 모아 창고에 불을 질러 약 100만 파운드 피해
  controls: |-
    - 감시·사보타주 징후를 사고 대응 체계에 넣고 발견 시 수사기관에 즉시 보고
    - 임직원·협력사에 시설 촬영·장치 설치를 대가로 한 구인 글 신고 안내
    - 시설 주변 낯선 촬영·장치 설치·배회 감시와 정부·업계 대리인 모집 경보 공유

- id: PH-HU-03
  name: 인재 영입·연구 협력 위장 기술 획득
  summary: 브로커·위장 법인 영입과 인재 유치·공동연구 위장으로 핵심 인력·성과 획득
  members: [PHT-HU-02, PHT-HU-03]
  basis: 영입·협력 프로그램을 가장해 핵심 인력·연구 성과를 가져가는 같은 위협이며 겸직·해외 영입 신고·연구보안이라는 같은 통제
  description: |-
    - 헤드헌팅 업체·위장 법인을 내세워 핵심 엔지니어를 집단 영입하거나, 해외 인재 유치 프로그램·겸직·공동연구로 연구비·직위를 주고 연구 성과를 넘겨받는 위협
    - 이직·학술 교류 자체는 합법이라 구별·차단이 어렵고, 기술이 사람의 기억·노하우와 함께 옮겨져 유출 시점·범위를 입증하기 어려움
  scenario: |-
    - 해외 D램 업체 고문을 지낸 사람이 헤드헌팅 업체 설립 → 기존 연봉의 2~3배를 약속하며 반도체 핵심 인력 알선 → 핵심 인력의 해외 업체 이직
    - 외국 대학과 고용계약을 맺은 교수 → 국가 R&D 연구자료 파일을 외국 대학 연구원 등에게 전달 → 연구비 지원 약속 확인·처벌
  cases: |-
    - [실제 사고] 반도체 인력 해외 알선 헤드헌팅 업체 대표 구속(2024-12): 기존 연봉의 2~3배를 약속하며 핵심 인력을 끌어들여 직업안정법 첫 적용
    - [실제 사고] 해외 인재 유치 프로그램 참여 교수의 자율주행 라이다 연구자료 누설(2023-04): 외국 대학과 계약한 교수가 연구자료 72개 파일을 넘김
  controls: |-
    - 핵심 인력 처우·경력 관리, 고용 계약·비밀유지 서약에 영업비밀 범위와 퇴직 후 의무 명시
    - 해외 겸직·외부 연구비 신고와 공동연구 계약의 자료 범위·제3자 제공 금지, 상대·자금 출처 확인
    - 연쇄 이직·이직 예정자 자료 접근 증가 점검, 미신고 겸직 확인 시 접근 자료·데이터 전송 점검

- id: PH-HU-04
  name: 투자·합작·대면 사칭을 통한 기술 자료 획득
  summary: 투자·인수·합작·거래 상담과 관계자 사칭 면담으로 공정·설계 자료 획득
  members: [PHT-HU-04, PHT-HU-05.1, PHT-HU-05.2]
  basis: 투자·거래·방문 관계를 내세워 기술 자료를 요구하는 같은 위협이며 거래 상대 실사·자료 제공 승인이라는 같은 통제
  description: |-
    - 투자자·관계자를 사칭한 면담, 지분 투자·인수로 얻은 경영권, 합작·위탁생산·거래 상담을 내세워 공장 설계·공정 자료와 소스코드를 넘겨받는 위협
    - 대주주 지시·거래 형식이라 정상 업무처럼 보여 내부 통제가 작동하지 않고, 생산 라인 전체를 복제할 수 있는 자료가 한 번에 나감
  scenario: |-
    - 대주주가 된 외국 기업 측 간부의 요구 → 이사회 결의 등 절차 없이 하이브리드 제어 소스코드 제공 → 국가핵심기술의 해외 이전
    - 연구원이 해외 업체와 제조 동업 약정 → 웨이퍼 연마 공정도 등을 휴대전화로 촬영 → 해외 업체에 전달
  cases: |-
    - [실제 사고] 해외 업체와 동업한 연구원의 공정 자료 촬영 유출(2023-01): 해외 업체와 제조 동업을 약정하고 웨이퍼 연마 공정도 등을 휴대전화로 찍어 넘김
    - [실제 사고] 인수한 외국 자동차 기업 요구로 하이브리드 제어 소스코드 제공(2009-11): 대주주 측 요구로 이사회 결의 없이 소스코드를 넘겨 기소
  controls: |-
    - 투자·인수·협력 계약에 자료 접근 범위·재제공 금지·지식재산 귀속 명시와 이행 감사
    - 거래 단계별 최소 자료 제공·승인, 기술 이전은 이사회 결의·법정 승인 경유, 방문객 소속 역확인
    - 거래 단계에 비해 과도한 자료 요구·대주주 측 자료 반출 요청 점검과 거래 상대 실소유 확인
