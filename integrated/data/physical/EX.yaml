# [EX] 자산·정보 반출 — 재구성 Lv3 (원본 4개 → 3)
- id: PH-EX-01
  name: 이동식 저장매체·업무 단말 무단 반출
  summary: USB·외장 디스크·SD 카드와 업무 노트북으로 설계·연구 자료를 통째로 반출
  members: [PHT-EX-01]
  basis: 단독 유지 — 디지털 매체 반출로 매체 통제·DLP라는 고유 통제
  description: |-
    - 내부자가 USB·외장 디스크·SD 카드나 업무 노트북에 설계·연구 자료를 담아 출입 검색을 지나 밖으로 가져가는 위협
    - 저장장치는 작아 숨기기 쉽고 용량 제약이 거의 없어 자료를 통째로 옮길 수 있으며, 망분리 환경에서도 매체 통제가 비면 그대로 나감
  scenario: |-
    - 국방 연구기관 퇴직 연구원들이 설계 기밀·소스코드를 대용량 저장장치에 복사 → 퇴직하며 반출 → 한 명이 68만 건을 빼냈다는 의혹으로 수사
    - 엔지니어가 설계 기밀을 암호화한 SD 카드에 담아 반출 → 외국에 판매 시도 → 수사기관 위장 요원에게 적발·체포
  cases: |-
    - [실제 사고] 국방 연구기관 퇴직 연구원들의 대용량 저장장치 반출 의혹(2020-04): 퇴직 연구원 20여 명이 설계 기밀과 소스코드를 반출한 의혹으로 수사
    - [실제 사고] 핵잠수함 설계 기밀 SD 카드 판매 시도(2021-10): 엔지니어가 설계 기밀을 암호화한 SD 카드에 담아 외국에 팔려다 위장 요원에게 걸려 체포
  controls: |-
    - 승인·등록된 암호화 매체만 허용하고 그 밖의 저장장치는 단말에서 차단
    - 자료 외부 전달은 승인된 전송 경로로만, 출입구 반출입 검색에서 저장장치·노트북 확인
    - 저장장치 연결·대용량 복사 기록과 승인되지 않은 매체 사용·평소보다 큰 복사 경보

- id: PH-EX-02
  name: 출력·필사·촬영으로 반출 통제 우회
  summary: 기밀 문서 출력·손으로 옮겨 적기·휴대폰 촬영으로 디지털 반출 통제 우회
  members: [PHT-EX-02, PHT-EX-03]
  basis: 출력물·필사(EX-02)와 촬영(EX-03)은 디지털 반출 통제를 우회하는 같은 아날로그 경로이며 출력 통제·보안 구역 촬영 기기 통제라는 같은 통제
  description: |-
    - 내부자가 기밀 문서를 나눠 출력하거나 공정 수치를 손으로 옮겨 적고, 휴대폰·태블릿으로 보안 화면·도면·설비를 찍어 디지털 반출 탐지를 피해 가져가는 위협
    - 출력·필기·촬영은 흔하거나 몇 초면 끝나 흔적이 남지 않고, 핵심 공정 수치처럼 압축된 정보는 종이·사진 몇 장으로 충분히 나감
  scenario: |-
    - 연구원이 10나노급 D램 공정 레시피를 손으로 옮겨 적음 → 외국 업체로 이직 → 공정 기술 해외 유출
    - 다른 직원이 출근하지 않는 명절 연휴에 공장 설계도면 열람 → 스마트폰으로 촬영 → 외국 업체로 이직하며 유출
  cases: |-
    - [실제 사고] 퇴사 전 공정 문서 대량 출력(2024-05): 경쟁사로 옮긴 직원이 퇴사 전 공정 문제 해결 문서 약 4,000쪽과 영업비밀을 여러 차례 출력해 반출
    - [실제 사고] 명절 연휴 공장 설계도면 스마트폰 촬영(2024-08): 직원이 출근하지 않는 연휴에 국가핵심기술 도면을 스마트폰으로 찍어 외국 업체로 옮김
  controls: |-
    - 기밀 문서 분류 표시·워터마크·인증 후 출력, 보안 구역 촬영 기기 반입 제한과 촬영 금지 서약
    - 출력 장치 보호구역 배치, 기밀 문서 운반·보관 기준·클린 데스크와 다 쓴 출력물 파쇄
    - 출력량·반복·휴일 출력 경보, 연휴·야간 보안 구역 접근·촬영 동작 확인과 출력물 반출 확인

- id: PH-EX-03
  name: 시제품·부품·시료 반출
  summary: 시제품·회로 기판·시험 장비·생물 시료를 짐에 숨겨 반출해 역설계
  members: [PHT-EX-04]
  basis: 단독 유지 — 실물 반출로 실물 자산 관리·반출입 검사라는 고유 통제
  description: |-
    - 내부자나 출입한 외부인이 시제품·회로 기판·시험 장비나 종자·세포 같은 시료를 가방·짐에 숨겨 반출하고 측정·역설계로 설계를 복원하는 위협
    - 실물은 문서 반출 통제에서 빠지기 쉽고, 하루 빌려 측정하고 돌려놓으면 분실로도 드러나지 않음
  scenario: |-
    - 병원 연구실 연구원이 암 연구 시료를 여행가방에 숨김 → 출국하며 세관 질문에 거짓 답변 → 공항에서 적발
    - 협력사 직원이 시험 로봇 팔을 노트북 가방에 넣어 반출 → 외부에서 측정·촬영 → 다음 날 '찾았다'며 반환
  cases: |-
    - [실제 사고] 암 연구 시료 은닉 반출 시도(2019-12): 연구원이 시료 21병을 여행가방 속 양말에 숨겨 출국하려다 공항에서 적발
    - [실제 사고] 협력사 직원의 시험 로봇 팔 가방 반출(2019-01): 협력사 직원이 로봇 팔을 노트북 가방에 넣어 가져가 측정·촬영한 뒤 다음 날 돌려줌
  controls: |-
    - 핵심 실물 자산 지정과 보관 구역 출입통제, 시료·시제품 사용·반출 승인·기록
    - 연구실·시험장 출입구 반출입 검사, 연구 시료 국외 반출·세관 신고 규정 교육
    - 시제품·시험 장비·시료 자산 목록의 위치·사용자 추적과 정기 실사로 사라진 실물 확인
