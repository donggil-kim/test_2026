# [RC] 정찰·표적 선정 — 재구성 Lv3 (원본 4개 → 3)
- id: PH-RC-01
  name: 공개정보 기반 핵심 인력·시설 파악
  summary: 경력 프로필·채용 공고·위치 기록 등 공개정보로 핵심 인력·시설 표적 선정
  members: [PHT-RC-01]
  basis: 단독 유지 — 조직이 통제하지 못하는 공개정보에서 시작하는 정찰로 공개정보 최소화라는 고유 통제
  description: |-
    - 업무용 SNS 경력, 채용 공고, 논문·보도자료, 운동 기록 앱처럼 조직이 통제하지 못하는 공개정보로 핵심 기술 인력·보안 인가자와 시설 위치를 골라내는 위협
    - 열람 자체는 합법이라 막을 수 없고, 표적 명단은 위장 접근·포섭·침입 단계에 가서야 드러남
  scenario: |-
    - 외국 기관의 지시로 포섭 대상이 될 과학기술자 물색 → 방산업체 기술자들의 신상 보고서 수집·전달 → 위장 접근·포섭 표적으로 활용
    - 운동 기록 앱의 활동 기록을 모은 공개 히트맵 → 해외 군 기지 위치·장병 이동 경로 노출 → 각국 군의 위치 기록 공개 설정 점검
  cases: |-
    - [실제 사고] 방산업체 기술자 8명 신상 조사(2018-09): 외국 국가안전 기관의 지시로 포섭 대상이 될 수 있는 과학기술자들의 신상 보고서를 모아 넘겨 유죄
    - [실제 사고] 운동 기록 앱 히트맵의 군 기지 노출(2018-01): 활동 기록을 모아 공개한 히트맵에서 해외 군 기지 위치와 장병 이동 경로가 드러남
  controls: |-
    - 핵심 자산·인력을 먼저 정하고 공개 프로필·발표·채용 공고에 쓸 수 있는 정보 범위 설정
    - 공개 웹·보도자료·채용 공고 게시 전 공정·설비·과제 정보 검토와 위치 공유 앱 사용 기준
    - 임직원·조직 관련 공개정보 정기 점검, 특정 인력에 몰리는 외부 연락·채용 제안 보고·대조

- id: PH-RC-02
  name: 현장 답사(적대적 정찰)
  summary: 시설 주변 배회·반복 촬영으로 경비 체계·출입 동선 파악(적대적 정찰)
  members: [PHT-RC-02]
  basis: 단독 유지 — 시설 주변 현장 관찰로 경계 감시·이상 행동 신고라는 고유 통제
  description: |-
    - 시설 주변을 배회하거나 반복 촬영하고 출입 절차·경비 반응을 떠보며 침입·감시·사보타주 계획에 필요한 경계·동선·순찰 정보를 모으는 위협
    - 정찰 단계는 피해가 없어 신고·대응이 느슨하지만, 이때 알아채면 이후 단계 전체를 끊을 수 있는 가장 이른 탐지 지점임
  scenario: |-
    - 군사시설·공항 주변에서 이착륙 항공기·시설을 반복 촬영 → 관제 무전 감청 시도 → 적발·처벌
    - 외국 정보요원과 접촉 → 군 훈련장·지원 물자 수송로를 감시해 사진·영상 전달 → 공격할 군 시설 제안 등 사보타주 준비
  cases: |-
    - [실제 사고] 공군기지·공항 반복 촬영과 관제 무전 감청 시도(2025-03): 한미 군사시설·공항에서 전투기 등을 수천 장 촬영하다 적발되어 일반이적죄 실형
    - [실제 사고] 군 시설·지원 물자 수송로 정찰과 사보타주 준비(2024-04): 외국 정보요원과 접촉한 거주자가 훈련장·수송로를 감시해 사진·영상을 넘김
  controls: |-
    - 보호구역 지정과 경계·시야 차단·조명·자연 감시 설계로 밖에서 얻을 수 있는 정보 축소
    - 순찰 시간·경로 불규칙화와 눈에 보이는 보안 활동, 무단 촬영은 직접 제지보다 기록·신고 우선
    - 반복 출현 인물·차량·출입구 촬영 보고 체계와 감시 영상 대조, 반복 정찰 판단 뒤 관계 기관 공유

- id: PH-RC-03
  name: 위장 접촉을 통한 정보 수집
  summary: 헤드헌터·연구자 위장 온라인 접근과 초청·면접 명목 대면 질의로 기술 정보 수집
  members: [PHT-RC-03.1, PHT-RC-03.2]
  basis: 원본 위협분류 '위장 접촉을 통한 정보 수집' 2개(온라인·대면) — 접촉 신고·대외 활동 보안 교육이라는 같은 통제
  description: |-
    - 업무용 SNS에서 헤드헌터·연구자·싱크탱크로 위장해 핵심 인력에 접근하거나, 학회 초청·채용 면접·투자 상담을 명목으로 만나 공정·설계 노하우를 캐묻는 위협
    - 정상 구인·교류와 구별이 어렵고 대화로 나간 정보는 기록이 남지 않으며, 관계가 쌓인 뒤 해외 초청·대면 포섭으로 넘어가야 위험이 드러남
  scenario: |-
    - 위장 회사 채용 공고로 보안 인가자 이력서 수집 → 업무용 SNS로 재정난을 겪는 사업 관계자 물색 → 외국 정보기관에 전달
    - 위장 회사·대학을 내세워 항공 기업 직원을 강연 명목으로 초청 → 체재비·사례금 제공과 기술 정보 요구 → 직원 협조로 적발
  cases: |-
    - [실제 사고] 위장 컨설팅 회사의 업무용 SNS 물색(2020-07): 위장 회사 채용 공고로 보안 인가자 이력서를 모으고 재정난을 겪던 사업 관계자를 물색
    - [실제 사고] 대학 강연 초청을 가장한 항공기 엔진 기술 탈취 시도(2018-10): 강연 명목으로 초청해 체재비·사례금을 주며 정보를 요구, 직원 협조로 체포
  controls: |-
    - 업무용 SNS에 과제·보안 인가·설비 정보 비공개, 외부 발표·면담 전 공개 가능 범위 검토
    - 위장 프로필·정보 유도 대화 식별 교육과 해외 초청·사례금·유료 보고서 요청 신고 기준
    - 업무 관련 외부 접근·면담 내용 보고와 같은 프로필·초청 주체의 반복 접근 확인
