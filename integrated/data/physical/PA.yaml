# [PA] 물리 침입·접근 — 재구성 Lv3 (원본 7개 → 3)
- id: PH-PA-01
  name: 보호구역 무단 진입(경계 침입·출입증 악용·위장 출입)
  summary: 울타리 월담·출입증 대리 태그·방문자 사칭으로 보호구역 무단 진입
  members: [PHT-PA-01.1, PHT-PA-01.2, PHT-PA-02]
  basis: 출입통제 우회(PA-01.x)와 방문자·협력업체 위장 출입(PA-02)은 통제구역 무단 진입이라는 같은 결과이며 경계 감지·출입 인증·방문자 관리라는 같은 통제
  description: |-
    - 울타리를 넘거나 빈 출입문 잠금장치를 훼손하고, 출입증 대리 태그·위조·동반 진입이나 택배원·구직자·협력업체 직원 사칭으로 보호구역에 들어오는 위협
    - 경계가 넓고 무인 시간대가 길어 감지가 늦고, 방문 응대·출입증 대여는 호의로 여겨지며 진입 뒤 장치 설치·반출로 피해가 커짐
  scenario: |-
    - 직원 퇴근으로 비어 있던 공항 보안구역 연결문 → 잠금장치를 뜯고 통과 → 같은 달 재발 뒤 보안셔터·감지 센서 설치
    - 기밀 반출 혐의 엔지니어의 해외 체류 → 동료가 출입증을 대신 태그 → 사무실 근무로 꾸민 출입 기록이 알리바이가 됨
  cases: |-
    - [실제 사고] 공항 활주로 외곽 울타리 월담 도주(2023-03): 입국이 거부된 승객들이 새벽에 활주로 외곽 울타리를 넘어 달아났고 한 명은 17시간 만에 검거
    - [실제 사고] 공항 면세구역 보안문 강제 개방 밀입국(2016-01): 직원 퇴근으로 비어 있던 연결문의 잠금장치를 뜯고 나갔고 같은 달 강제 개방이 재발
  controls: |-
    - 외곽·건물·보호구역을 겹겹이 나눈 출입통제, 1인 1출입 구조와 무인 시간대 출입 지점 차단
    - 방문자 사전 예약·신원 확인·담당자 동행, 출입증 대여 금지 명시와 승인된 정기 물리 침투 시험
    - 경계 감지 센서 경보·영상 확인, 출입 기록과 단말 접속·감시 영상 대조로 대리 태그·동반 진입 확인

- id: PH-PA-02
  name: 악성 장치·매체 반입과 배송·정비 과정 변조
  summary: 위장 출입·우편 발송·정비 과정으로 악성 장치를 내부망·설비에 연결
  members: [PHT-PA-03.1, PHT-PA-03.2, PHT-PA-05]
  basis: 승인되지 않은 장치가 내부망·설비에 연결되는 같은 위협이며 장치 인벤토리·포트 통제·반입 검사라는 같은 통제
  description: |-
    - 위장 출입 뒤 사내 단자에 이동통신 모뎀이 달린 장치를 몰래 연결하거나, 사칭 우편물로 악성 USB를 보내고, 배송·정비 과정에서 문서에 없는 통신 장치를 붙이는 위협
    - 장치가 경계 방화벽을 거치지 않는 별도 통신 경로를 만들어 감시에 잘 걸리지 않고, 키보드로 인식되는 장치는 저장매체 통제를 비켜 감
  scenario: |-
    - 택배원·구직자로 위장해 은행에 출입 → 회의실·업무 책상 단자에 노트북·소형 컴퓨터 연결 → 이동통신 모뎀으로 원격 접속해 자금·자료 탈취
    - 유통사·정부 부처를 사칭한 우편물에 악성 USB 장치 동봉 → 받은 직원이 업무 PC에 연결 → 키 입력을 흉내 내 악성코드 실행
  cases: |-
    - [실제 사고] 은행 내부망 원격 접속 장치 설치(2018-12): 위장 출입자가 단자에 장치를 연결하고 이동통신 모뎀으로 원격 접속, 은행 최소 8곳에서 손실
    - [실제 사고] 감사 편지·가짜 기프트카드와 함께 악성 USB 장치 우편 발송(2022-01): 사칭 우편물의 장치가 키 입력을 흉내 내 악성코드를 실행
  controls: |-
    - 네트워크 단자 장치 인증과 외부인 공간 단자·미사용 포트 비활성화, 승인된 USB 장치만 허용
    - 공급 계약에 구성품 공개·변경 통보·검사 협조 명시, 정비 작업 사전 승인·감독과 도입 장비 개봉 검사
    - 등록되지 않은 장치 접속·키보드형 USB 연결 직후 명령 실행 경보, 설계에 없는 외부 통신 감시

- id: PH-PA-03
  name: 출장지·국경 검색에서 업무 단말 접근·복제
  summary: 출장지 호텔·국경 검문에서 업무 단말 감염·감시 앱 설치·자료 복제
  members: [PHT-PA-04]
  basis: 단독 유지 — 조직 시설 밖(출장지)의 장비 접근으로 출장용 단말·귀환 점검이라는 고유 통제
  description: |-
    - 출장자가 묵는 호텔의 네트워크나 객실에 둔 단말, 국경 검문 과정을 이용해 업무 노트북·휴대폰에 악성코드·감시 앱을 심거나 저장 자료를 복제하는 위협
    - 출장 중에는 조직의 보안 통제 밖에서 단말을 다뤄 이상을 알아채기 어렵고, 감염된 단말이 돌아와 사내 접속 수단이 됨
  scenario: |-
    - 고급 호텔 네트워크에 장기간 침투 → 투숙 경영진이 접속하면 정상 업데이트로 위장한 백도어 설치 유도 → 감염 단말이 귀환 뒤 사내 접속 수단이 됨
    - 육로 국경 검문에서 휴대폰 제출 → 요원이 감시 앱 설치 → 일정·문자·연락처·통화 기록을 원격 서버로 전송
  cases: |-
    - [실제 사고] 고급 호텔 Wi-Fi로 출장 경영진 선별 감염(2014-11): 최소 4년간 호텔 네트워크에 침투해 투숙 경영진에게 업데이트로 위장한 백도어를 설치하게 함
    - [실제 사고] 국경 검문에서 여행자 휴대폰에 감시 앱 설치(2019-07): 요원이 여행자 휴대폰에 감시 앱을 설치해 일정·문자·연락처·통화 기록을 원격 전송
  controls: |-
    - 고위험 지역 출장에는 최소 자료만 담은 출장 전용 단말 지급과 저장 자료 암호화
    - 객실 단말 방치 금지·공용 네트워크에서 사내 보안 접속 등 사외 단말 보관·사용 기준
    - 귀환 단말의 사내망 연결 전 설치 앱·구성 변경 점검, 분실·검문 제출 신고와 관련 계정 점검
