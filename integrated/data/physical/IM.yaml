# [IM] 영향·피해 — 재구성 Lv3 (원본 5개 → 4)
- id: PH-IM-01
  name: 핵심기술·영업비밀·국가기밀 유출
  summary: 국가핵심기술·영업비밀·국가기밀이 경쟁국·경쟁사로 넘어가는 회복 불가능한 손실
  members: [PHT-IM-01]
  basis: 단독 유지 — 회복 불가능한 손실 결과 유형(실제 사고 23건)
  description: |-
    - 포섭·인력 영입·내부자 반출·투자 위장으로 국가핵심기술·영업비밀·국가기밀이 경쟁국·경쟁사로 넘어가 경쟁 제품 개발이나 군사 정보로 쓰이는 위협
    - 한 번 넘어간 기술은 되돌릴 수 없고, 피해 규모는 경쟁 제품이 나오거나 수사가 끝나야 드러나 수조 원 단위에 이르기도 함
  scenario: |-
    - 외국 업체가 국내 기업 인력을 개발실장으로 영입 → 연구원이 공정 레시피를 손으로 옮겨 적어 이직 → 10나노급 D램 공정 기술 해외 유출
    - 전 임원이 공장 설계 데이터·공정 배치도 부정 취득 → 기존 공장 인근에 복제 공장 건설 시도 → 약정 투자 불발로 무산
  cases: |-
    - [실제 사고] 10나노급 D램 공정 레시피 해외 유출(2025-12): 공정 레시피를 손으로 옮겨 적어 넘겨 10명이 기소되고 피해액은 최소 수십조 원으로 추산
    - [실제 사고] 공장 설계자료로 복제 공장 건설 시도(2023-06): 전 임원이 공장 설계 데이터로 복제 공장을 지으려 했고 기술 가치는 최소 3천억 원 이상
  controls: |-
    - 핵심 자산(국가핵심기술·영업비밀·기밀) 분류·목록 관리와 정기 위험평가에 유출 경로 반영
    - 유출 의심 시 증거 보전·접근 차단·수사기관 신고, 국가핵심기술 보호조치·유출 신고 의무 이행
    - 핵심 자산 접근·반출 신호를 내부자 위험 관리 체계에서 종합, 경쟁 제품·특허·채용 동향 확인

- id: PH-IM-02
  name: 사보타주·설비 손상
  summary: 철도 신호·통신 케이블 절단·방화와 내부자 조작으로 설비 손상·운행 마비
  members: [PHT-IM-02]
  basis: 단독 유지 — 설비 손상 결과 유형
  description: |-
    - 철도 신호 설비·통신 케이블·물류 창고를 훼손하거나 불을 지르고, 설비 밸브를 조작해 기반시설·생산 설비를 손상시키는 위협
    - 선로·케이블처럼 넓게 퍼진 설비는 모두 지킬 수 없고, 이중화한 설비도 여러 곳을 동시에 훼손하면 멈춰 복구에 시간이 걸림
  scenario: |-
    - 정당한 출입 사유가 있는 사람이 지시 없이 원전 터빈 윤활유 밸브를 수동 개방 → 원자로 자동 정지 → 밸브 주변 CCTV 부재로 범인 미특정
    - 이중화된 철도 무선통신 광케이블 두 곳 동시 절단 → 북부 철도 운행 정지 → 기술 지식을 가진 범인의 조직적 절단으로 수사
  cases: |-
    - [실제 사고] 원전 터빈 윤활유 밸브 고의 개방(2014-08): 비원자력 구역의 밸브가 지시 없이 열려 원자로가 자동 정지
    - [실제 사고] 이중화된 철도 무선통신 광케이블 동시 절단(2022-10): 두 곳의 케이블이 잘려 북부 철도 운행이 멈췄고 수사 당국은 조직적 절단으로 봄
  controls: |-
    - 배선·지원·전력 설비의 물리 보호와 핵심 구간 이중화 경로의 물리적 분리
    - 화재·물리 위협 대비 설비와 손상 시 대체 운영·복구 계획 훈련
    - 핵심 설비·케이블 구간 침입·훼손 감지와 사보타주 대리인 모집·유사 공격 정보 공유

- id: PH-IM-03
  name: 시설 운영 중단·안전·인명 위협
  summary: 드론 출현·설비 훼손으로 공항·철도·원전 운영 중단과 항공기 충돌 위험
  members: [PHT-IM-03, PHT-IM-04]
  basis: 운영 중단(IM-03)과 안전·인명 위협(IM-04)은 같은 사건(드론 출현·설비 훼손)에서 함께 나타나는 결과이며 비상 대응·관계 기관 공조라는 같은 통제
  description: |-
    - 공항 주변 드론 비행, 철도 신호·통신 설비 훼손, 발전 설비 조작으로 공항·철도·발전소 운영을 멈추게 하거나 드론이 항공기와 충돌해 인명을 위협하는 위협
    - 안전 때문에 의심 신호만으로도 운영을 멈춰야 하고 배후가 확인되지 않아 방해가 반복될 수 있으며, 충돌 위치에 따라 참사로 이어질 수 있음
  scenario: |-
    - 이틀 연속 야간 드론 목격 → 국제공항 활주로 폐쇄·약 7시간 운항 중단 → 결항·회항으로 승객 약 3,000명 발 묶임
    - 산불 진화 비행 제한 구역에 취미 드론 비행 → 물을 뿌리던 소방 항공기와 충돌 → 날개 손상으로 항공기 며칠간 운용 불가
  cases: |-
    - [실제 사고] 이틀 연속 드론 목격으로 국제공항 활주로 폐쇄(2025-10): 약 7시간 운항이 중단되어 17편 결항·15편 회항으로 승객 약 3,000명이 발이 묶임
    - [실제 사고] 산불 진화 항공기와 취미 드론 충돌(2025-01): 비행 제한 구역의 민간 드론이 소방 항공기 날개에 구멍을 내 며칠간 운용되지 못함
  controls: |-
    - 운영 중단·재개 판단 기준과 대체 운영 절차를 사업 연속성 계획에 넣고 훈련
    - 대피·중단·재개 절차와 관계 기관 연락 체계, 드론 대응은 권한 있는 기관에 맡기고 추락 기체 안전 처리
    - 드론 출현·설비 훼손·내부 조작 감시와 사고 보고, 중단 사건별 원인·대응 시간 기록

- id: PH-IM-04
  name: 금전·법적·평판 피해
  summary: 기술 유출 소송 배상·과징금·자금 탈취와 사고 대응 비용·평판 손실
  members: [PHT-IM-05]
  basis: 단독 유지 — 금전·법적 결과 유형
  description: |-
    - 공격자나 내부자의 행위로 영업비밀 소송 배상·합의금, 감독기관 과징금, 자금 탈취·갈취, 사고 대응 비용 같은 직접적인 금전·법적 피해를 입는 위협
    - 피해 확정까지 수년이 걸리고, 가해 측 처벌과 별개로 관리 소홀이 드러나면 피해 조직도 제재·평판 손실을 입음
  scenario: |-
    - 경쟁사의 대규모 인력 채용과 영업비밀 침해 → 무역위원회의 수입 금지 효력 판결 확정 → 현금·로열티 합계 2조 원 지급 합의
    - 해외 고객지원 인력·협력사 직원 매수로 고객 정보 유출 → 갈취 요구 거부 → 대응 비용 최대 4억 달러 추정
  cases: |-
    - [실제 사고] 배터리 인력 채용 영업비밀 분쟁(2021-02): 무역위원회가 수입 금지 효력이 생기는 판결을 확정했고 양사는 합계 2조 원 지급에 합의
    - [실제 사고] 거래소 내부 인력 매수와 갈취 요구(2025-05): 회사가 갈취 요구를 거부하고 대응 비용을 최대 4억 달러로 추정
  controls: |-
    - 정기 위험평가에 기술 유출·내부자·물리 보안 사고의 금전·법적 영향 반영과 법무 대응 준비
    - 사고 대응·복구 절차에 감독기관 신고·피해자 통지·소송 대응 포함, 사고 시 증거 보존
    - 개인정보·영업비밀·수출통제 법적 의무 이행 점검과 사고 초기 금전·법적 영향 평가
