# [IR] 대응 기능 억제 — 재구성 Lv3 (원본 18행 → 6, T0851 루트킷은 회피 OT-EV-02로 이동, 지속성·공정 제어 훼손의 T1693.x 반복 행 6행은 OT-IR-05로 통합)
- id: OT-IR-01
  name: 데이터 파괴(와이퍼)
  summary: 와이퍼로 HMI·EWS·RTU 데이터와 백업을 지워 운영·복구 불능
  members: [T0809]
  basis: 단독 유지 — 실제 사고 13건으로 근거가 가장 많은 대응 기능 억제 기법이며(Enterprise T1485·T1490·T1561 통합) 오프라인 백업·복원 훈련이라는 고유 통제를 받음
  links: [CL-IM-02]
  description: |-
    - 와이퍼·삭제 명령으로 HMI·EWS·히스토리언의 시스템·ICS 구성 파일과 RTU·IED·PLC 메모리를 지워 운영자 화면과 제어 장치를 쓸 수 없게 만드는 위협
    - 백업·섀도 복사본까지 함께 지우는 경우가 많아 복구 속도가 백업 상태와 현장 재구성 역량에 좌우되고, 저장 칩을 반복 기록해 장치를 물리적으로 파괴하기도 함
  scenario: |-
    - IT망 침해 후 그룹 정책으로 다수 단말에 와이퍼 배포 → HMI·EWS·히스토리언의 ICS 구성 파일과 섀도 복사본 삭제 → RTU·보호 계전기 메모리를 지워 원격 감시·제어와 복구 수단 동시 상실
  cases: |-
    - [실제 사고] 2025 폴란드(2025-12): DynoWiper와 기본 명령으로 Mikronika RTU·Hitachi Relion 보호 계전기·HMI 데이터를 파괴
    - [실제 사고] Fuxnet(2024-04): 센서 게이트웨이의 NAND 메모리를 반복 기록으로 물리 파괴
  controls: |-
    - ICS 구성·프로젝트 파일과 장치 설정의 오프라인·변경 불가 백업, 복원 절차 정기 훈련
    - 관리자·도메인 정책 변경 권한 최소화와 HMI·EWS 애플리케이션 허용 목록으로 와이퍼 차단
    - 대량 파일·섀도 복사본 삭제와 장치 메모리 초기화 명령을 엔드포인트·OT 네트워크 감시로 탐지

- id: OT-IR-02
  name: 장치·서비스 정지(서비스 거부)
  summary: DoS·강제 재시작·ICS 서비스 종료로 제어 장치와 운영 서비스 정지
  members: [T0814, T0816, T0881]
  basis: 서비스 거부·장치 재시작·정지·서비스 중지는 모두 제어 장치와 운영 서비스를 멈춰 운영자의 감시·대응을 막는 같은 결과이며 장치별 허용 통신·관리 기능 분리·핵심 기능 이중화라는 같은 통제를 받음
  links: [CL-IM-03, CL-IM-04]
  description: |-
    - 대량 요청·비정상 패킷·장치 취약점으로 제어 장치를 응답 불능으로 만들거나 재시작·종료 명령으로 장치를 멈추고, HMI·히스토리언의 ICS 서비스를 강제 종료하는 위협
    - 많은 OT 장치는 재부팅해야만 회복되고 재부팅 반복에 빠지면 현장 조치가 필요하며, 보호 계전기처럼 비상시에 동작해야 할 장치가 멈추면 다른 공격의 피해가 커짐
  scenario: |-
    - 외부 DDoS나 장치 취약점 공격 → 빌딩 자동화 제어기·보호 계전기가 응답 불능·재부팅 반복 → 난방 정지와 보호 기능 공백
    - 랜섬웨어가 종료 목록의 ICS 프로세스·백업·보안 서비스를 끝냄 → HMI·히스토리언 중단 → 감염 시스템 종료로 운영 기능 정지
  cases: |-
    - [실제 사고] 핀란드 아파트 난방(2016-11): DDoS로 빌딩 자동화 제어기가 재부팅을 반복해 난방이 멈춤
  controls: |-
    - OT 경계의 비인가 트래픽 차단과 장치별 허용 통신, 취약 장치 펌웨어 갱신·보완 통제
    - 재시작·종료 기능과 UPS 관리 인터페이스의 관리망 분리, ICS 서비스 제어 권한 최소화
    - 핵심 기능 이중화·수동 운전 절차와 장치 통신 두절·재부팅·서비스 비정상 종료 경보

- id: OT-IR-03
  name: 경보 억제 및 I/O 이미지 조작
  summary: 경보 설정 변경·경보 차단·I/O 이미지 조작으로 위험 상황 은폐
  members: [T0838, T0878, T0835]
  basis: 경보 설정 변조·경보 억제·I/O 이미지 조작은 모두 위험 상황과 실제 출력이 운영자·제어 로직에 드러나지 않게 해 대응 기능을 무력화하는 같은 목적이며 독립 경로(안전계통·하드와이어 경보)·변경 관리라는 같은 통제를 받음
  description: |-
    - 장치·HMI의 경보 한계값·활성 설정을 바꾸거나 경보 메시지 전달을 막고, PLC I/O 이미지를 조작해 위험 상황과 실제 출력이 운영자·제어 로직에 드러나지 않게 하는 위협
    - 경보는 운영자가 이상을 인지하는 주된 수단이라 다른 공격의 피해가 그대로 진행되며, 화면은 정상처럼 유지되고 경보 설정 변경을 기록하지 않는 장치도 많아 탐지가 어려움
  scenario: |-
    - 제어 장치·경보 서버 접근 → 경보 설정 변조·경보 메시지 차단으로 알림 무력화 → 강제 출력·I/O 이미지 조작으로 실제 출력을 숨긴 채 공정 조작 진행
  cases: |-
    - [실제 사고] 마루치 하수처리(2000-03): 펌프장 네 곳의 경보를 꺼 중앙 컴퓨터로 알림이 가지 않게 함
  controls: |-
    - 경보 설정 변경 권한 분리와 변경 관리(승인·기록), 운영 중 강제 입출력 기능 차단
    - 핵심 경보의 독립 경로(안전계통·하드와이어 경보) 이중화와 기계식 보호
    - 승인된 경보 설정·데이터 블록 기준본 대조와 한계 초과 공정값의 경보 누락 확인

- id: OT-IR-04
  name: 제어 통신 차단(명령·보고·통신 채널)
  summary: 변환기 무력화·포트 점유·인터페이스 차단으로 명령·보고 통신 단절
  members: [T1691.001, T1691.002, T1695.001, T1695.002, T1695.003]
  basis: 명령·보고 메시지 차단과 직렬·이더넷·와이파이 통신 차단은 모두 현장 장치와 제어 시스템 사이 통신을 끊어 원격 감시·제어를 막는 같은 위협(상위기법 T1691·T1695의 하위기법)이며 대체 통신 경로·수동 조작 절차라는 같은 통제를 받음
  description: |-
    - 직렬-이더넷 변환기 무력화, 직렬 포트 선점, 네트워크·무선 인터페이스 비활성화·트래픽 폐기·재밍으로 명령과 상태 보고가 오가는 통신을 끊는 위협
    - 변환기 하나에 여러 현장 장치가 물려 있어 장비 하나로 다수 장치가 고립되며, 원격 감시·제어가 함께 끊기고 통신 장애로 오인돼 대응이 늦어짐
  scenario: |-
    - 랜섬웨어 실행 → netsh로 감염 단말의 이더넷·Wi-Fi 인터페이스를 끄거나 변환기 펌웨어를 덮어씀 → 연결된 제어 기능이 고립돼 명령 전달과 상태 보고 동시 중단
  cases: |-
    - [실제 사고] 노르스크 하이드로(2019-03): LockerGoga가 netsh로 Wi-Fi를 포함한 감염 시스템의 네트워크 인터페이스를 모두 비활성화
  controls: |-
    - 대체 통신 경로(대역 외 채널)와 수동 조작 절차 마련, 정기 훈련
    - 변환기·통신 장비 정적 구성, 관리 기능의 관리망 분리·기본 계정 폐기와 예비 장비
    - 명령 응답·텔레메트리 중단과 인터페이스 비활성화 명령을 OT 감시·엔드포인트로 경보

- id: OT-IR-05
  name: 펌웨어 변조 및 업데이트 모드 악용
  summary: 업데이트 모드 전환·펌웨어 덮어쓰기로 보호 해제와 장치 영구 무력화
  members: [T1693, T1693.001, T1693.002, T0800]
  basis: 펌웨어 업데이트 모드 활성화와 시스템·모듈 펌웨어 변조는 업데이트 기능을 악용해 장치를 멈추거나 덮어쓰는 연속 흐름이며 서명 검증·키스위치·지정 단말 업데이트라는 같은 통제를 받음. 지속성·공정 제어 훼손 반복 행은 사고 근거가 장치 무력화·복구 방해라 대응 기능 억제에 배치
  description: |-
    - 보호 계전기·제어기를 펌웨어 업데이트 모드로 바꿔 보호 기능을 멈추거나, 시스템·통신 모듈 펌웨어를 악성·구버전으로 덮어써 감시 기능을 없애고 장치를 무력화하는 위협
    - 펌웨어 변경 경보·로그가 없는 장치가 많고 서명 검증이 없으면 정상 업데이트와 구분되지 않으며, 원격 복구 수단이 사라져 현장 교체와 수동 조작에 의존하게 됨
  scenario: |-
    - 관리 프로토콜로 장치 접근 → 펌웨어 업데이트 모드 전환으로 보호 기능 해제 → 맞춤·구버전 펌웨어로 덮어쓰거나 공장 초기화해 원격 복구와 포렌식 방해
  cases: |-
    - [실제 사고] 2015 우크라이나(2015-12): 직렬-이더넷 변환기를 맞춤 펌웨어로 덮어써 원격 복구를 막음
    - [공개 취약점] CISA ICS 권고: 무결성 검증 없이 코드·펌웨어를 받아들이는 취약점(CWE-494·347·1277) 44건, 2025년 이후 20건
  controls: |-
    - 서명 펌웨어·보안 부팅과 업데이트 모드 전환의 키스위치·로컬 조작·지정 단말 제한
    - 핵심 장치 예비품·정상 펌웨어·설정 백업 확보와 현장 교체·재구성 훈련
    - 펌웨어 버전·해시 정기 대조와 업데이트 모드 전환·예기치 않은 재부팅 경보

- id: OT-IR-06
  name: 자격증명 변경으로 운영자 차단
  summary: 장치 관리 암호·접속 키를 바꿔 운영자 접근과 복구 작업 차단
  members: [T0892]
  basis: 단독 유지 — 장치 관리 암호·키를 바꿔 운영자를 잠그는 고유 위협(Enterprise T1531 통합)이며 자격증명 오프라인 보관·변경 권한 분리라는 고유 통제를 받음
  links: [CL-IM-03]
  description: |-
    - 장치·소프트웨어의 관리 암호나 접속 키를 바꿔 운영자와 대응 인력이 장치 설정·복구 작업에 접근하지 못하게 하는 위협
    - 기본·하드코딩 자격증명으로 먼저 접속한 뒤 바꾸는 흐름이 많고, 장치에 따라 공장 초기화나 교체 외에는 접근을 되찾을 수 없어 복구가 오래 걸림
  scenario: |-
    - 노출된 HMI·직렬 장치 서버에 기본 자격증명으로 접속 → 관리자 암호·접속 키 변경 → 운영자 잠금과 복구 방해
  cases: |-
    - [실제 사고] 친러시아 핵티비스트(2024-05): 노출된 HMI의 관리자 암호를 바꿔 운영자를 잠금
    - [공개 취약점] KNX 연결 인증(CVE-2023-4346): 인증 키 설정을 악용해 빌딩 자동화 장치 소유자를 잠그는 취약점 — KEV 등재
  controls: |-
    - 장치 관리 계정·키의 오프라인 금고 보관과 변경 권한 분리·기록
    - 장치 설정·자격증명 백업, 공장 초기화 뒤 재구성 절차와 예비 장치
    - 장치 암호 변경 경보와 운영자 로그인 실패 급증·계정 잠금 즉시 확인
