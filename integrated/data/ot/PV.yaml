# [PV] 권한 상승 — 재구성 Lv3 (원본 5행 → 2, T0874는 실행, T1053·T1543은 지속성으로 통합, 회피의 T1484.001 반복 행은 권한 상승으로 통합)
- id: OT-PV-01
  name: 권한 상승용 취약점 악용
  summary: OS·엔지니어링 소프트웨어·제어기 펌웨어 취약점으로 관리자·펌웨어 권한 획득
  members: [T0890]
  basis: 단독 유지 — 로컬 취약점 악용으로 권한을 높이는 고유 기법으로(Enterprise T1068 통합) 로컬 권한 상승 패치·취약 드라이버 차단이라는 고유 통제를 받음
  description: |-
    - 운영체제·엔지니어링 소프트웨어·제어기 펌웨어의 취약점이나 취약한 서명 드라이버를 악용해 일반 사용자 권한에서 관리자·커널·펌웨어 수준 권한으로 올라가는 위협
    - OT 호스트는 패치 주기가 길어 알려진 로컬 권한 상승 취약점이 오래 남고, 제어기 펌웨어 취약점은 공개와 패치 자체가 늦음
  scenario: |-
    - EWS·HMI 일반 계정이나 제어기 접근 확보 → Windows 로컬 권한 상승·제어기 펌웨어 시스템 호출 취약점 악용 → 관리자·펌웨어 수준 권한으로 공격 코드 상주
  cases: |-
    - [실제 사고] Triton(2017-08): Tricon MP3008 펌웨어(10.0~10.4)의 미공개 시스템 호출 취약점으로 2바이트 임의 쓰기를 얻어 권한을 높임
  controls: |-
    - 로컬 권한 상승 취약점(KEV 우선)·설치 폴더 권한 결함 패치와 취약 드라이버 차단 목록
    - 운영 계정의 관리자 권한 제거와 애플리케이션 허용 목록·익스플로잇 보호
    - 일반 계정 프로세스의 SYSTEM·root 프로세스 생성과 제어기 메모리·펌웨어 무결성 이상 탐지

- id: OT-PV-02
  name: 그룹 정책 변조
  summary: 도메인 그룹 정책으로 OT 호스트 전체에 와이퍼 배포·보안 설정 해제
  members: [T1484.001]
  basis: 단독 유지 — 도메인 그룹 정책으로 다수 OT 호스트에 일괄 배포하는 고유 기법이며 OT 도메인 분리·GPO 편집 권한 제한이라는 고유 통제를 받음(클라우드 CL-PV-02와 같은 배치). 회피 반복 행은 권한 상승에 배치
  links: [CL-PV-02]
  description: |-
    - 도메인 관리자 권한으로 그룹 정책 개체(GPO)를 바꿔 도메인에 속한 EWS·HMI·SCADA 서버 전체에 악성 코드 실행·보안 설정 해제를 한 번에 내리는 위협
    - 정상 관리 기능으로 많은 호스트에 동시에 적용돼 파괴형 공격이 매우 빠르게 퍼지고, OT 호스트가 IT 도메인에 묶여 있으면 IT 침해가 그대로 OT로 번짐
  scenario: |-
    - 도메인 관리자 권한 확보 → 와이퍼를 네트워크 공유에 두고 GPO에 예약 작업·스크립트 등록 → 도메인 가입 OT 호스트 전체에서 동시 실행
  cases: |-
    - [실제 사고] 2022 우크라이나(2022-10): 그룹 정책 개체로 피해 기관 IT 환경에 CaddyWiper를 배포·실행
  controls: |-
    - OT 별도 도메인 운영과 IT 도메인 신뢰 최소화, GPO 편집 권한의 소수 계정 제한
    - 도메인 관리자 계정의 특권 접근 관리·다중 인증과 GPO 백업·즉시 복원
    - GPO 생성·변경 이벤트(5136)·SYSVOL 새 스크립트 감시와 다수 호스트 동시 프로세스 상관 분석
