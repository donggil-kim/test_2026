# [IM] 영향 — 재구성 Lv3 (원본 14행 → 7, ATT&CK ICS 영향 분류 단위: 가용성·생산 / 제어 / 감시 / 안전·보호·설비 / 운영 정보 + Enterprise 편입 랜섬웨어·봇넷)
- id: OT-IM-01
  name: 운영 중단 및 생산 손실
  summary: IT 랜섬웨어·OT 조작으로 생산·출하·공급이 멈춰 대규모 손실
  members: [T0828, T0826]
  basis: 생산·매출 손실과 가용성 상실은 같은 운영 중단을 조직의 경제적 피해와 서비스 공급 중단 측면에서 본 결과로 함께 나타나며, IT·OT 분리·독립 운전 계획·사업 연속성이라는 같은 통제를 받음
  description: |-
    - OT 직접 조작이나 분리되지 않은 IT 환경의 랜섬웨어로 생산·출하·운송과 전력·난방·연료 공급을 멈춰 큰 생산·매출 손실과 공공 서비스 중단을 일으키는 위협
    - 공정이 멀쩡해도 감염 확산을 우려한 예방적 중단이나 생산 관리 시스템(MES·ERP) 마비로 생산이 멈추며, 피해가 협력업체·공급망과 사회 전체로 번짐
  scenario: |-
    - IT망 랜섬웨어 감염 → 생산 관리·물류 시스템 마비 → OT 확산을 우려한 예방적 중단으로 생산·공급이 멈추고 협력업체로 피해 확산
  cases: |-
    - [실제 사고] 재규어 랜드로버(2025-09): IT 시스템 차단으로 전 세계 생산이 5주 넘게 멈추고 협력업체로 피해가 번짐
    - [실제 사고] 이란 주유소(2021-10·2023-12): 연료 배급·결제 시스템 마비로 전국 주유소 운영 차질
  controls: |-
    - IT·OT 분리(DMZ·단방향 게이트웨이)와 IT 장애 시 최소 생산을 유지하는 OT 독립 운전 계획
    - MES·히스토리언 등 생산 지원 시스템의 오프라인 백업과 사업 연속성 계획의 복구 우선순위
    - 랜섬웨어 전조(자격증명 탈취·권한 상승·백업 삭제) 조기 탐지와 생산·공급 지표 급변 감시

- id: OT-IM-02
  name: 랜섬웨어(데이터 암호화)
  summary: 랜섬웨어로 HMI·EWS·히스토리언·생산 서버를 암호화해 운영 정지
  members: [T1486]
  basis: 단독 유지 — 실제 사고 14건으로 OT 영향 사고에서 가장 자주 확인되는 경로이며, ICS 매트릭스에 암호화 기법이 없어 Enterprise T1486을 편입한 기법(클라우드 CL-IM-01과 같은 기법)
  links: [CL-IM-01]
  description: |-
    - 랜섬웨어로 HMI·EWS·히스토리언·생산 관리 서버의 파일과 디스크를 암호화해 운영 시스템을 쓸 수 없게 만들고 복구 대가를 요구하는 위협
    - OT 자산까지 암호화되지 않아도 IT 감염과 OT 확산 우려만으로 운영이 멈추며, OT망에 들어오면 HMI·폴링 서버 암호화로 감시·운영이 직접 중단됨
  scenario: |-
    - 피싱·VPN 계정·경계 장비 취약점으로 IT 진입 → 자격증명 탈취·그룹 정책 배포로 확산 → ICS 서비스 중지·백업 삭제 뒤 HMI·히스토리언 암호화
  cases: |-
    - [실제 사고] 천연가스 압축 시설(2020-02): 랜섬웨어가 OT망까지 들어와 HMI·히스토리언·폴링 서버를 암호화해 파이프라인 운영이 약 2일 멈춤
    - [실제 사고] 나고야항(2023-07): 랜섬웨어로 컨테이너 터미널 시스템이 멈춰 반출입이 약 이틀 중단
  controls: |-
    - IT·OT 계정·도메인 분리와 OT 단말 애플리케이션 허용 목록
    - 오프라인·변경 불가 백업과 복원 훈련, IT 장애 시 OT 독립 운전으로 예방적 중단 최소화
    - 대량 파일 변경·섀도 복사본 삭제·ICS 서비스 일괄 종료와 도메인 관리자 계정의 OT 접근 탐지

- id: OT-IM-03
  name: 제어 기능 상실·조작
  summary: 장치 무력화·원격 조작으로 운영자 제어를 빼앗거나 공정을 직접 조작
  members: [T0827, T0813, T0831]
  basis: 제어 상실·제어 거부·제어 조작은 ATT&CK ICS 영향 분류의 '제어' 범주로 운영자의 공정 제어가 끊기거나 공격자에게 넘어간 결과이며 기계식 보호·독립 안전계통·수동 운전 절차라는 같은 통제를 받음
  description: |-
    - 장치·HMI 파괴와 통신 차단으로 운영자가 일시적·지속적으로 공정을 제어하지 못하게 하거나, 설정값·명령을 직접 바꿔 물리 공정을 의도대로 움직이는 위협
    - 차단기 개방·밸브 개폐처럼 결과가 곧바로 물리 세계에 나타나고 복구는 장치 교체·수동 운전에 의존하며, 2024년 이후 노출 HMI 조작 사고가 수도·댐에서 반복됨
  scenario: |-
    - 퇴사자 계정·약한 암호의 원격 접속으로 제어 시스템 접근 → 정수 공정 정지·방류 밸브 개방 같은 직접 조작 → 운영자 개입 전까지 공정 중단·과다 방류 지속
  cases: |-
    - [실제 사고] 독일 제철소(2014-12): 제어 구성요소가 잇따라 고장 나 용광로를 정상적으로 정지하지 못함
    - [실제 사고] 캔자스 수도조합(2019-03): 퇴사 직원이 원격 접속으로 정수장 세척·소독 공정을 정지
  controls: |-
    - 원격 접속의 다중 인증·세션 기록·승인 절차와 퇴사자 계정 즉시 회수
    - 중요 동작의 현장 인터록·한계값·독립 안전계통과 예비 장치·수동 운전 절차
    - 운영자 조작 기록이 없는 상태 변화와 제어 명령 실패·HMI 무응답 동시 증가 탐지

- id: OT-IM-04
  name: 감시 기능 상실·조작
  summary: 통신 방해·화면 변조·정상값 재생으로 운영자가 공정 상태를 못 보거나 오판
  members: [T0829, T0815, T0832]
  basis: 감시 상실·감시 거부·감시 화면 조작은 ATT&CK ICS 영향 분류의 '감시' 범주로 운영자가 공정 상태를 보지 못하거나 잘못 보게 되는 같은 결과이며 독립 감시 경로·현장 계측 대조라는 같은 통제를 받음
  description: |-
    - HMI·RTU·센서 통신을 파괴·방해하거나 화면을 공격자 그래픽으로 바꾸고, 정상 시기 공정 입력을 재생해 운영자가 실제 공정 상태를 보지 못하거나 다른 상태를 보게 하는 위협
    - 상태를 확인할 수 없어 수동 운전·운영 중단을 택하게 되고, 조작된 화면은 운영자가 이상을 의심하지 않아 독립 계측과 대조하지 않으면 드러나지 않음
  scenario: |-
    - 원격 감시용 위성·셀룰러 통신 장비나 HMI 무력화 → 다수 분산 설비의 텔레메트리 동시 단절 → 현장 순회 없이는 상태를 확인할 수 없어 운영 제한
  cases: |-
    - [실제 사고] AcidRain(2022-02): 위성 모뎀이 파괴돼 독일 Enercon 풍력 발전기 약 5,800기의 원격 감시가 끊김
  controls: |-
    - 독립 감시 경로(현장 표시기·대체 통신)와 감시 서비스 이중화
    - 보고 통신 무결성 보호와 HMI 화면·프로젝트 파일 무결성 정기 점검
    - 여러 장치·사이트의 텔레메트리 동시 공백과 값의 비정상 일정·반복 패턴 탐지

- id: OT-IM-05
  name: 안전·보호 기능 상실 및 설비 피해
  summary: 안전계통·보호 기능을 무력화하고 공정을 한계 밖으로 몰아 설비 파괴·인명 위험
  members: [T0880, T0837, T0879]
  basis: 안전 상실·보호 기능 상실·재산 피해는 ATT&CK ICS 영향 분류의 '안전·보호·설비' 범주로 최후 방어선이 무너져 물리적 피해로 이어지는 같은 결과이며 기계식 보호·독립 안전계통·결과 중심 위험 평가라는 같은 통제를 받음
  description: |-
    - 안전계통(SIS)을 재프로그래밍하거나 보호 계전기를 무력화해 위험 상태가 계속되게 하고, 제어 조작으로 설비·기반시설과 주변 환경에 물리적 손상을 일으키는 위협
    - 안전계통은 사람이 대응하기에 너무 빠른 위험을 막는 마지막 방어선이라 무너지면 폭발·유독물 누출·탈선 같은 인명 사고로 이어지고, 원인이 단순 고장으로 오인되기도 함
  scenario: |-
    - 안전 엔지니어링 워크스테이션 장악 → 안전 제어기 로직을 재프로그래밍해 위험 상태를 허용 → 제어계통으로 위험 상태를 만들어 설비 손상·인명 사고 유발
  cases: |-
    - [실제 사고] Triton(2017-08): SIS 로직을 재프로그래밍하는 도구로 Triconex 안전 제어기를 공격했고, 오류로 안전 정지가 일어나 발견됨
    - [실제 사고] 폴란드 우치 트램(2008-01): 적외선 신호로 선로 전환기를 조작해 트램 4대가 탈선하고 승객이 다침
  controls: |-
    - 안전계통의 물리·논리 분리와 전용 엔지니어링 단말, 안전 제어기 키스위치 RUN 유지
    - 기계식 보호 계층과 보호 계통 이중화로 사이버 조작이 넘을 수 없는 위험 한계 보장
    - 안전 제어기 모드·로직 변경·진단 경보와 보호 장치 상태 보고 중단 감시

- id: OT-IM-06
  name: 운영 정보 탈취
  summary: 설계 도면·운전 매뉴얼·프로젝트 파일을 빼내 협박·후속 정밀 공격에 사용
  members: [T0882]
  basis: 단독 유지 — 반출 전술이 없는 ICS 매트릭스에서 Enterprise 반출 기법(T1041·T1048.003·T1567.004 등)을 통합해 운영 정보 유출로 표현한 기법이며 운영 정보 분류·반출 승인이라는 고유 통제를 받음
  links: [CL-EF-02]
  description: |-
    - 정보 수집형 악성코드·공급업체 침해·클라우드 관리 계정 탈취로 설계 도면·P&ID·운전 매뉴얼·PLC 프로젝트 파일·네트워크 구성 같은 운영 정보를 빼내는 위협
    - 탈취 시점에는 물리 피해가 없어 대응 우선순위가 낮아지기 쉽지만, 정밀 공격의 사전 준비이자 기반시설 정보 유출이라 협박·후속 공격으로 이어짐
  scenario: |-
    - 정보 수집형 악성코드·공급업체 침해로 문서 저장소 접근 → 설계도면·운전 매뉴얼·고객 프로젝트 파일 반출 → 유출 자료 공개·가동 중단 협박이나 OT 공격 계획에 활용
  cases: |-
    - [실제 사고] 한국수력원자력(2014-12): 원전 설계도면·운전 매뉴얼이 유출·공개되고 가동 중단 협박이 이어짐
    - [실제 사고] 텔벤트(2012-09): 파이프라인 SCADA 공급업체가 침해돼 고객사 프로젝트 파일이 유출
  controls: |-
    - 운영 정보 기밀 등급 분류·접근 통제·암호화와 공급업체 보관·폐기 보안 요구사항
    - OT 문서 저장소의 업무망 분리와 반출 승인 절차
    - 설계·프로젝트 파일 대량 접근·압축·외부 전송의 DLP·네트워크 감시

- id: OT-IM-07
  name: IoT 기기 봇넷 편입(대역폭 탈취)
  summary: 기본 자격증명·취약점으로 장악한 IoT·경계 장비를 봇넷에 넣어 DDoS·중계
  members: [T1496.002]
  basis: 단독 유지 — IoT 기기·경계 장비를 봇넷에 편입하는 기기 소유자 관점의 위협으로 Enterprise T1496.002를 편입한 기법(클라우드 CL-IM-06과 같은 기법, OT 원본 연계)
  description: |-
    - 기본 자격증명·알려진 취약점으로 장악한 IP 카메라·라우터·산업용 셀룰러 게이트웨이와 OT 경계 방화벽을 봇넷에 편입해 그 대역폭으로 DDoS를 하거나 공격 트래픽을 중계하는 위협
    - 기기 소유자는 성능 저하와 평판 손상만 겪어 침해를 알아채지 못하는 경우가 많고, 같은 접근이 이후 OT 공격 거점으로 쓰일 수 있음
  scenario: |-
    - 인터넷에 노출된 IoT·경계 장비 탐색 → 텔넷 기본 계정·KEV 등재 취약점으로 감염 → 봇넷에 편입해 대규모 DDoS·공격 중계에 사용
  cases: |-
    - [실제 사고] 덴마크 에너지 기업(2023-05): 침해된 경계 방화벽 일부가 Mirai 계열 봇넷에 편입
  controls: |-
    - 기본 자격증명 변경·펌웨어 갱신과 인터넷 노출 관리 인터페이스 제거
    - IoT 기기의 별도 망 분리와 외부 통신 허용 목록
    - IoT·경계 장비의 비정상 아웃바운드 트래픽·알려진 C2 통신과 텔넷·SSH 로그인 시도 감시
