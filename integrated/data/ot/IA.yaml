# [IA] 초기 침투 — 재구성 Lv3 (원본 13행 → 8, T0866·T0886은 횡적 이동 OT-LM-06·OT-LM-05로 통합, 수집의 EMB3D-CO.2는 OT-IA-08로 이동)
- id: OT-IA-01
  name: 인터넷 노출 제어 장치 악용
  summary: 인터넷에 노출된 PLC·HMI·웹 제어 화면에 직접 접속해 화면·설정 조작
  members: [T0883]
  basis: 단독 유지 — 실제 사고 13건으로 핵티비스트·IoT 봇넷의 주 진입 경로이며, 원격 접속 체계를 거치지 않고 장치 자체가 노출된 점이 외부 원격 서비스(OT-IA-02)와 달라 노출 제거라는 고유 통제를 받음
  links: [CL-IA-02]
  description: |-
    - 원격 관리를 위해 인터넷에 직접 노출된 PLC 내장 HMI·웹 제어 화면·VNC HMI·셀룰러 모뎀 연결 SCADA에 접속해, 별도 침투 없이 곧바로 OT 환경에 들어오는 위협
    - 기본·약한 암호나 인증 없는 프로토콜이 그대로인 경우가 많아 인터넷 스캔만으로 표적이 되며, 2023년 이후 수도·댐·지역 유틸리티에서 화면 변조·설정값 변경이 반복됨
  scenario: |-
    - 인터넷 스캔으로 노출된 PLC·HMI 식별 → 기본·약한 암호로 웹 제어 화면·HMI에 접속 → 화면 변조·설정값 변경·운영자 잠금
  cases: |-
    - [실제 사고] Unitronics(2023-11): 인터넷에 연결된 Unitronics PLC·HMI에 접속해 화면을 바꿈
    - [실제 사고] 노르웨이 브레망에르 댐(2025-04): 약한 암호의 웹 제어 화면에 접속해 방류 밸브를 엶
  controls: |-
    - OT 장치의 인터넷 직접 노출 제거(방화벽·VPN 뒤로)와 셀룰러 모뎀 같은 숨은 연결 점검
    - 기본 암호 변경·인증 강화, 노출이 불가피하면 출발지 제한과 접속 감시
    - 외부 스캔 결과로 자사 노출 장치 정기 확인과 인터넷 출발지의 OT 장치 로그인 경보

- id: OT-IA-02
  name: 외부 원격 접속 서비스 악용
  summary: 탈취·휴면 계정으로 VPN·원격 접속 도구에 접속해 원격 운영자처럼 OT 진입
  members: [T0822]
  basis: 단독 유지 — VPN·원격 지원 도구 등 원격 접속 체계를 거치는 진입 경로로(Enterprise T1133·T1199·T1590.006 통합) 다중 인증·점프 호스트·승인제라는 고유 통제를 받음
  links: [CL-IA-06]
  description: |-
    - 운영자·벤더용 VPN·원격 데스크톱·원격 접속 도구·무선 원격 링크에 탈취하거나 남아 있는 계정으로 접속해, 정상 원격 운영자처럼 OT 환경에 들어오는 위협
    - 정상 원격 유지보수 경로라 공격 트래픽이 구분되지 않고, 다중 인증이 없는 휴면·퇴사자 계정과 노출된 경계 VPN 장비가 반복해서 침투 경로가 됨
  scenario: |-
    - 업무망에서 자격증명 탈취나 유출 암호 확보 → 다중 인증 없는 VPN·원격 접속 게이트웨이에 접속 → 제어 시스템·점프 호스트로 진입
  cases: |-
    - [실제 사고] 콜로니얼 파이프라인(2021-05): 다중 인증이 없는 휴면 VPN 계정과 유출된 암호로 진입
  controls: |-
    - 원격 접속의 다중 인증·점프 호스트 경유·세션 기록·승인제와 퇴사자·벤더 계정 즉시 회수
    - 경계 VPN 장비의 KEV 취약점 우선 패치와 관리 인터페이스의 인터넷 분리
    - 원격 접속 인증 로그의 비정상 시간대·출발지·동시 세션과 휴면 계정 사용 경보

- id: OT-IA-03
  name: 공개 애플리케이션 취약점 악용
  summary: 노출된 HMI·웹 SCADA·경계 VPN·방화벽 취약점을 악용해 OT 경계 침투
  members: [T0819]
  basis: 단독 유지 — 경계에 노출된 애플리케이션·장비의 공개 취약점 악용으로(Enterprise T1190 통합, KEV에서 OT·IoT 30건 확인) 계정을 쓰는 외부 원격 서비스(OT-IA-02)와 달리 패치·노출 제거라는 고유 통제를 받음
  links: [CL-IA-01]
  description: |-
    - 인터넷에 노출된 HMI·웹 SCADA·VPN·방화벽·산업용 라우터·IoT 기기의 공개 취약점을 악용해 OT 환경이나 그 경계에 처음 들어오는 위협
    - 원격 관리를 위해 일부러 노출한 장비가 많고 패치 주기가 길어 공개 취약점이 오래 악용 가능한 상태로 남으며, 침해된 경계 장비는 봇넷 편입에도 쓰임
  scenario: |-
    - 인터넷 스캔으로 취약 버전의 HMI·경계 장비 식별 → 공개 취약점 익스플로잇으로 장비 장악 → 장비를 거점으로 OT 내부 접근
  cases: |-
    - [실제 사고] BlackEnergy HMI 캠페인(2014-10): 인터넷에 노출된 GE CIMPLICITY·Advantech WebAccess HMI 취약점을 악용
  controls: |-
    - OT 장비의 인터넷 노출 제거(불가피하면 VPN·점프 호스트 뒤로)와 KEV 등재 취약점 우선 패치
    - 외부 공격 표면 정기 점검과 노출 장비 대장 관리
    - 노출 장비 웹 로그·WAF의 익스플로잇 패턴과 경계 장비 관리 접속·설정 변경·새 계정 감시

- id: OT-IA-04
  name: 스피어피싱·드라이브바이 감염
  summary: 표적 메일 첨부·업계 사이트 워터링 홀로 업무 단말을 감염시켜 OT 접근 발판 확보
  members: [T0865, T0817]
  basis: 스피어피싱 첨부파일과 드라이브바이(워터링 홀)는 모두 사용자를 속여 IT 업무 단말에 첫 거점을 얻는 같은 경로이며 메일·웹 필터링과 OT 접근 단말 분리라는 같은 통제를 받음(Enterprise T1566·T1189 통합)
  links: [CL-IA-03]
  description: |-
    - 특정 조직·직원을 노린 메일의 악성 문서·설치 파일·링크나 업계·공급업체 사이트를 침해한 워터링 홀로 엔지니어·운영자 업무 단말을 감염시켜 OT 접근 발판을 만드는 위협
    - OT 공격 대부분이 IT 업무망 침투에서 시작되며, 정상 업무 사이트 방문만으로도 감염되고 감염 단말에서 VPN·원격 접속 자격증명을 빼내 제어망으로 넘어감
  scenario: |-
    - 에너지 업계 사이트 워터링 홀·표적 메일로 업무 단말 감염 → 자격증명 수집 → 원격 접속으로 제어 시스템 정보·OT망에 접근
  cases: |-
    - [실제 사고] Dragonfly 2.0(2018-03): 에너지 업계 대상 워터링 홀과 스피어피싱으로 자격증명을 모으고 제어 시스템 정보에 접근
    - [실제 사고] Bad Rabbit(2017-10): 침해된 웹사이트의 가짜 Flash 설치 파일로 퍼져 우크라이나 교통 기관 시스템을 암호화
  controls: |-
    - 매크로·실행 파일 첨부 차단과 메일 샌드박스, OT 담당자 대상 표적 피싱 훈련
    - OT 접근 계정·단말의 업무 메일·인터넷 분리와 다중 인증, 웹 필터링·브라우저 격리
    - 문서 프로그램·브라우저의 비정상 하위 프로세스와 업무 단말에서 OT로 향하는 새 접속 경보

- id: OT-IA-05
  name: 이동식 매체·임시 접속 자산 경유 침투
  summary: USB·정비 노트북 같은 반입 매체·장치로 폐쇄망 제어계통에 악성코드 유입
  members: [T0847, T0864]
  basis: 이동식 매체 전파와 임시 접속 자산 악용은 모두 망 밖에서 들어오는 매체·장치로 폐쇄망 OT에 침투하는 같은 경로이며 반입 검사·등록이라는 같은 통제를 받음(Enterprise T1091 통합)
  description: |-
    - USB 같은 이동식 매체나 OT와 외부망을 오가는 정비 노트북·진단 장비를 감염시키거나 빼돌려, 업무망과 분리된 제어계통 단말까지 악성코드를 옮기는 위협
    - 협력업체·유지보수 인력이 가져오는 매체·장비가 경로가 되는 경우가 많고, 폐쇄망이라는 믿음과 임시 자산의 관리 누락 때문에 반입 통제가 느슨함
  scenario: |-
    - 외부망에서 정비 노트북·USB 감염 → 폐쇄망 EWS·HMI에 연결하면 자동 실행·LNK 취약점으로 실행 → 감염 단말이 매체·공유 드라이브로 다시 복제하며 확산
  cases: |-
    - [실제 사고] 독일 원전(2016-04): 연료 취급 설비용 PC와 이동식 저장장치에서 Conficker 등 악성코드가 발견
  controls: |-
    - 자동 실행 해제와 허가 매체만 사용, 반입 전 검사 키오스크와 협력업체 반입 절차
    - 임시 자산의 등록·검사(백신·패치·무결성) 후 전용 연결 구간에서만 연결 허용
    - 매체 연결 뒤 실행된 프로세스와 새 MAC 주소·임시 장치 연결 탐지

- id: OT-IA-06
  name: 공급망 침해
  summary: 벤더 설치 파일·장비 설치 소프트웨어에 악성 요소를 섞어 OT에 유입
  members: [T0862]
  basis: 단독 유지 — 벤더 소프트웨어 배포·장비 설치 과정을 통한 유입으로(Havex·장비 설치 중 감염) 공급업체 보안 요구·반입 검사라는 고유 통제를 받음
  links: [CL-IA-05]
  description: |-
    - ICS 장비·소프트웨어 공급업체의 배포 경로나 설치·유지보수 과정을 침해해 정상 제품·업데이트·설치 작업에 악성 요소를 섞어 OT 환경에 들여오는 위협
    - 신뢰하는 공급업체 경로로 들어와 검사를 거치지 않는 경우가 많고, 같은 제품을 쓰는 여러 고객사로 동시에 퍼짐
  scenario: |-
    - 공급업체 웹사이트 침해 → 원격 접속 장비·산업용 카메라 설치 파일을 트로이 목마로 교체 → 고객사가 내려받아 설치하면 OT 환경에 악성코드 유입
  cases: |-
    - [실제 사고] Dragonfly·Havex(2014-06): ICS 원격 접속 장비·산업용 카메라 업체 사이트의 설치 파일을 트로이 목마로 바꿔 배포
    - [실제 사고] TSMC(2018-08): 신규 장비 설치 중 검사하지 않은 소프트웨어로 WannaCry 변종이 들어와 생산 차질
  controls: |-
    - 공급업체 보안 요구사항(서명 배포·보안 개발 절차)의 계약 반영과 반입 전 검사 절차
    - 설치·유지보수 작업에 검사된 매체·도구만 사용하고 작업 뒤 무결성 점검
    - 배포 파일 해시·서명의 벤더 공식 값 대조와 신규 설치 단말의 비정상 프로세스·통신 감시

- id: OT-IA-07
  name: 무선 통신 침해 및 위장 마스터
  summary: 무선 신호 재전송·주소 위조로 정상 마스터를 가장해 현장 장치에 명령 주입
  members: [T0860, T0848]
  basis: 무선 통신 침해와 위장 마스터는 현장 통신에 직접 끼어들어 정상 마스터를 가장한 명령을 넣는 한 공격 흐름이며 통신 인증·암호화·재전송 방지라는 같은 통제를 받음
  description: |-
    - 같은 주파수의 무선 장비·개조 리모컨·빼돌린 엔지니어링 장비로 OT 무선 통신망이나 SCADA 통신에 붙어 정상 마스터를 가장하고, 현장 장치에 제어 메시지를 보내는 위협
    - 무선 경보·원격 제어 신호와 인증 없는 SCADA 프로토콜은 녹음·재전송만으로도 정상 명령처럼 받아들여져, 원거리에서 열차·사이렌·펌프 같은 현장 설비가 움직임
  scenario: |-
    - 무선 신호 녹음·주파수 분석 → 같은 주파수의 무선 장비나 위조 주소로 위장 마스터 구성 → 비상정지·경보 작동·펌프 조작 명령 송신
  cases: |-
    - [실제 사고] 댈러스 경보 사이렌(2017-04): 무선 신호로 옥외 경보 사이렌 156기를 반복 작동
    - [실제 사고] 폴란드 철도 Radio-Stop(2023-08): 인증 없는 무선 비상정지 신호를 송신해 열차 20여 대를 세움
  controls: |-
    - 무선 제어 신호의 암호화·재전송 방지·발신자 인증과 통신 인증(IEC 62351·DNP3-SA)
    - 장치 허용 목록·미사용 포트 차단, 중요 명령의 현장 확인·인터록과 장비 분실 시 키 교체
    - 자산 대장에 없는 마스터 트래픽·복수 마스터 탐지와 비인가 송신·재밍 스펙트럼 감시

- id: OT-IA-08
  name: 디버그·유지보수 포트 악용
  summary: JTAG·UART·진단 광포트에 물리 접속해 장치 셸 획득·펌웨어 추출·설정 변경
  members: [EMB3D-IA, EMB3D-CO.2]
  basis: 디버그·유지보수 포트 악용과 하드웨어 인터페이스 펌웨어 추출은 같은 인터페이스(JTAG·UART)로 장치에 직접 들어가는 같은 경로이며 인터페이스 비활성화·판독 보호라는 같은 통제를 받음. 수집 전술의 EMB3D-CO.2를 초기 침투로 이동
  description: |-
    - 장치에 남은 디버그·유지보수 포트(JTAG·UART·진단 광포트)에 물리적으로 접속해 원격 접근 통제를 거치지 않고 장치 셸·메모리에 들어가거나 펌웨어를 추출하는 위협
    - 양산 뒤에도 비활성화되지 않은 포트가 많고 무인 설비는 물리 접근을 막기 어려우며, 추출한 펌웨어는 같은 제품을 쓰는 모든 현장에 통하는 공격 재료가 됨
  scenario: |-
    - 무인 변전소·옥외 캐비닛의 장치에 물리 접근 → JTAG·UART·진단 포트로 셸·메모리 접근이나 펌웨어 추출 → 설정 변경이나 역분석으로 키·하드코딩 자격증명 확보
  cases: |-
    - [실제 사고] 푸에르토리코 스마트 계량기(2010-05): 현장 진단용 광포트에 광 변환기·노트북을 연결해 사용량 기록 설정을 바꿔 전기를 훔침
    - [EMB3D] 잠재 특권 접근 포트·하드웨어 디버그 포트: UART 셸로 root 획득, JTAG로 메모리·코드 조작이 시연됨
  controls: |-
    - 쓰지 않는 디버그·개발 포트의 비활성화·물리 차단과 유지보수 포트 인증·판독 보호
    - 현장 함체 잠금·봉인·접근 통제와 조달 요건의 인터페이스 보호·펌웨어 암호화 명시
    - 캐비닛 개폐 감지·장치 변조 신호 경보와 진단 세션·예정 없는 재부팅 확인
