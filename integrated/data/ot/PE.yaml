# [PE] 지속성 — 재구성 Lv3 (원본 13행 → 3, T0859·T1694.x는 횡적 이동, T1693.x는 대응 기능 억제로 통합, 실행·권한 상승의 T1053·T1543 반복 행은 지속성으로 통합)
- id: OT-PE-01
  name: 제어 프로그램·프로젝트 파일 변조
  summary: 제어 프로그램·Step 7 프로젝트에 악성 로직을 심고 읽기 요청엔 원본을 보여 줌
  members: [T0889, T0873.001]
  basis: 제어 프로그램 변조와 지멘스 프로젝트 파일 감염은 제어 로직·엔지니어링 프로젝트에 악성 코드를 심어 유지하는 같은 지속성 수단이며 로직 무결성 검증·버전 관리라는 같은 통제를 받음
  description: |-
    - PLC·DCS·안전 제어기의 사용자 프로그램을 바꾸거나 블록을 추가하고 엔지니어링 프로젝트 파일에 악성 코드를 심어, 제어기 동작을 바꾼 채 오래 머무는 위협
    - 바뀐 프로그램은 재시작해도 그대로 실행되고 읽기 요청에 원래 코드를 보여 주도록 숨길 수 있으며, 감염 프로젝트는 엔지니어링 업무를 따라 퍼져 오프라인 비교 없이는 찾기 어려움
  scenario: |-
    - EWS의 Step 7 프로젝트에 악성 코드 복사 → 엔지니어가 프로젝트를 열면 실행돼 PLC로 내려보내는 코드를 바꿈 → 운영자에게는 원래 로직을 보여 주며 제어 로직 변조 유지
  cases: |-
    - [실제 사고] Stuxnet(2010-06): 대상 PLC 구성에 맞는 코드·데이터 블록을 내려받아 원심분리기 제어 로직을 바꾸고, 읽기 요청에는 원래 코드를 보여줌
    - [실증] Rogue7(2019-08): S7-1500 PLC에 위장 엔지니어링 스테이션으로 로직을 내려받고 운영자에게는 원래 로직을 보여줌
  controls: |-
    - 제어기 접근 보호(읽기·쓰기 암호)·키 스위치 RUN 유지와 지정 EWS에서만 승인된 프로그램 변경
    - 프로젝트 파일의 버전 관리·반입 검사와 코드 서명·무결성 검증을 지원하는 제어기 도입
    - 제어기 프로그램 정기 업로드·기준본 블록 단위 비교와 온라인 편집·프로그램 추가 탐지

- id: OT-PE-02
  name: 예약 작업·시스템 서비스 등록
  summary: 예약 작업·시스템 서비스로 악성 코드를 상주시키고 정한 시각에 일제 실행
  members: [T1053, T1543]
  basis: 예약 작업과 시스템 서비스 생성·변조는 모두 OS 수준에서 악성 코드를 자동 실행·상주시키는 같은 지속성 수단이며 생성 권한 제한·승인 목록 비교라는 같은 통제를 받음(클라우드 CL-PE-05와 같은 배치). 실행·권한 상승 반복 행은 지속성에 배치
  links: [CL-PE-05]
  description: |-
    - 작업 스케줄러·cron·경계 장비 예약 작업과 Windows 서비스·systemd에 악성 명령을 등록해 부팅 때마다 높은 권한으로 실행하거나 정한 시각에 여러 호스트에서 동시에 실행하는 위협
    - 운영·백업 자동화 작업과 벤더 서비스가 많아 새 작업·서비스가 눈에 띄지 않고, 파괴형 공격은 같은 시각에 일제히 실행되게 맞춰 복구를 어렵게 함
  scenario: |-
    - OT 호스트 관리자 권한 확보 → 그룹 정책으로 예약 작업을 배포하거나 서비스 실행 경로를 백도어로 교체 → 재부팅·정한 시각에 와이퍼·디스크 암호화 실행
  cases: |-
    - [실제 사고] NotPetya(2017-06): 감염 1시간 뒤 재부팅하는 작업을 만들어 디스크 암호화를 실행
  controls: |-
    - 예약 작업·서비스 생성 권한의 관리자 제한과 OT 도메인 분리로 GPO 경유 일괄 배포 차단
    - 드라이버 서명 강제·취약 드라이버 차단과 예약 작업·벤더 서비스 기준 목록의 변경 관리
    - 작업·서비스 생성·변경 이벤트(7045·4697 등)와 원격 생성(schtasks /s·PsExec) 탐지

- id: OT-PE-03
  name: 웹셸·SQL 저장 프로시저 악용
  summary: 노출 웹 서버 웹셸·SCADA DB 저장 프로시저로 명령 실행과 접근 유지
  members: [T1505.001, T1505.003]
  basis: 웹셸과 SQL 저장 프로시저는 서버 소프트웨어 구성요소(T1505)의 하위기법으로 DMZ 웹 서버·히스토리언 DB 같은 서버 기능에 명령 실행 경로를 심어 접근을 유지하는 같은 위협이며 서버 구성요소 무결성 점검·위험 기능 해제라는 같은 통제를 받음
  description: |-
    - 노출된 웹 서버·웹 HMI에 웹셸을 심거나 SCADA·히스토리언 MS-SQL의 저장 프로시저(xp_cmdshell 등)를 악용해 서버에서 OS 명령을 실행하고 내부망 접근을 유지하는 위협
    - 정상 웹 요청·DB 내부 활동처럼 보여 호스트 보안 도구가 잘 보지 못하고, 처음 악용한 취약점을 패치한 뒤에도 웹셸로 접근이 유지됨
  scenario: |-
    - 공개 애플리케이션 취약점으로 노출 웹 서버 침투 → reGeorg 계열 웹셸로 HTTP 터널 구성 → 내부 SCADA DB 서버에서 xp_cmdshell로 명령 실행
  cases: |-
    - [실제 사고] 리비우 지역난방(2024-01): 최초 침투 뒤 ReGeorg 변종 웹셸을 설치해 접근을 유지
  controls: |-
    - OT 관련 웹 서버의 인터넷 분리·WAF 배치와 웹 루트 쓰기 제한, 침해 복구 시 무결성 점검·재구축
    - xp_cmdshell 같은 위험 확장 프로시저 해제와 DB 계정 최소 권한·기본 계정 제거
    - 웹 디렉터리 파일 무결성 감시와 웹 서버·SQL 서버 프로세스의 명령 셸 생성 탐지
