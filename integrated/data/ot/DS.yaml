# [DS] 탐색 — 재구성 Lv3 (원본 8행 → 2, 수집의 T0887 무선 스니핑 반복 행은 탐색으로 통합)
- id: OT-DS-01
  name: OT 네트워크·장치 탐색
  summary: 연결 열거·포트 스캔·산업 프로토콜 질의로 OT 장치 목록과 모델·역할 파악
  members: [T0840, T0846, T0846.001, T0846.002, T0846.003, T0888]
  basis: 네트워크 연결 열거·원격 시스템 탐색(포트 스캔·브로드캐스트·멀티캐스트)·원격 시스템 정보 탐색은 모두 장치 목록과 역할을 능동적으로 파악하는 같은 탐색 단계이며 망 분할·OT 네트워크 감시라는 같은 통제를 받음(Enterprise T1016·T1049·T1018·T1046 통합)
  description: |-
    - 침해한 OT 호스트에서 연결 테이블을 열거하고 포트 스캔·브로드캐스트·멀티캐스트 탐색과 산업 프로토콜 질의로 장치 목록과 제조사·모델·펌웨어·역할을 파악하는 위협
    - 운영·자산 관리 도구도 같은 명령·질의를 늘 써 구분이 어렵고, IT망에서 OT 장치가 보이는 구조면 IT 침해만으로 OT 자산 목록이 드러나며 노후 장치는 스캔만으로 멈추기도 함
  scenario: |-
    - HMI에서 netstat·arp로 연결 확인 → 산업 프로토콜 포트 스캔·브로드캐스트 탐색으로 제어기 식별 → 장치 식별·IOA 질의로 공격 대상과 프로토콜 확정
  cases: |-
    - [실제 사고] Industroyer2(2022-04): 대상 장치의 연결·전송 상태, 공통 주소, IOA와 I/O 상태를 폴링하도록 구성
  controls: |-
    - IT망에서 OT 장치가 보이지 않도록 망 분할, 영역 사이 필요한 포트·발신지만 허용
    - 장치 식별·진단 기능 접근의 지정 SCADA·EWS 제한과 불필요한 탐색 응답 기능 해제
    - 대량 연결·산업 프로토콜 포트 순회·식별 질의와 연속 실행되는 탐색 명령의 OT 네트워크 감시

- id: OT-DS-02
  name: 네트워크·무선 스니핑
  summary: 제어망·필드버스·무선 링크의 트래픽을 엿들어 평문 자격증명·명령 형식 수집
  members: [T0842, T0887]
  basis: 네트워크 스니핑과 무선 스니핑은 유선·무선 구간의 통신을 수동으로 엿들어 자격증명·명령 형식을 얻는 같은 기법이며 통신 암호화·인증이라는 같은 통제를 받음(Enterprise T1040 통합). 무선 스니핑의 수집 반복 행은 탐색에 배치
  description: |-
    - 침해한 호스트·라우터·제어기나 무선 수신 장비로 제어망·필드버스·무선 텔레메트리를 캡처해 평문 자격증명·제어 명령·공정 값·장치 주소를 수집하는 위협
    - 다수 산업 프로토콜과 레거시 무선 링크가 암호화 없이 동작해 캡처만으로 명령 형식을 알 수 있고, 수동 수신은 흔적을 거의 남기지 않음
  scenario: |-
    - 경계 라우터 감염이나 무선 텔레메트리 수신 → Modbus 트래픽·기본 인증 정보와 명령 형식·장치 주소 수집 → 유효 계정 악용·위조 명령 재전송에 사용
  cases: |-
    - [실제 사고] VPNFilter(2018-05): 감염된 라우터의 패킷 스니퍼가 기본 인증 정보와 Modbus 트래픽을 감시
  controls: |-
    - 지원 구간부터 암호화·인증 통신(VPN·TLS·IEC 62351)과 무선 링크 암호화·메시지 인증
    - 망 분할·정적 ARP·포트 보안과 관리 계정 다중 인증으로 캡처된 자격증명 재사용 차단
    - 패킷 캡처 도구 실행·무차별 모드 전환과 미러 포트 변경·새 무선 장치 감시
