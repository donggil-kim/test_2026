# [CO] 수집 — 재구성 Lv3 (원본 16행 → 4, T0887은 탐색·T1056은 횡적 이동으로 통합, EMB3D-CO.2는 초기 침투 OT-IA-08로 이동, 횡적 이동의 EMB3D-LM.1·LM.2와 회피의 EMB3D-EV는 OT-CO-04로 이동)
- id: OT-CO-01
  name: 제어기·공정 정보 수집
  summary: 산업 프로토콜 읽기로 공정 상태·태그·I/O·운전 모드·제어 프로그램 수집
  members: [T0801, T0802, T0861, T0877, T0868, T0845]
  basis: 공정 상태 감시·자동 수집·포인트·태그 식별·I/O 이미지 수집·운전 모드 탐지·프로그램 업로드는 모두 제어기·공정에서 상태·태그·로직을 읽어 가는 공격 준비 수집이며 산업 프로토콜 접근 허용 목록·읽기 보호라는 같은 통제를 받음
  description: |-
    - OPC·IEC 104·Modbus 읽기와 엔지니어링 기능으로 공정 상태·태그·I/O 이미지·운전 모드를 수집하고 제어 프로그램을 올려받아, 공정 구조와 공격 시점·대상 주소를 파악하는 위협
    - 읽기·업로드는 SCADA·EWS가 늘 쓰는 정상 기능과 같고 공정에 영향을 주지 않아 정찰 단계에서 드러나지 않으며, 수집한 값은 재생해 화면 조작에도 쓰임
  scenario: |-
    - 셀룰러 모뎀·노출 SCADA나 침해 호스트로 접속 → 수위·수문 상태와 태그·I/O 상태를 반복 조회하고 프로그램 업로드 → 공정 이해와 공격 시점·대상 결정
  cases: |-
    - [실제 사고] 보먼 애비뉴 댐(2013-08): 셀룰러 모뎀으로 소형 홍수 조절 댐 SCADA에 접속해 수위·온도·수문 상태를 반복 조회
    - [실증] Evil PLC(2022-08): 조작한 PLC에서 엔지니어가 로직을 업로드하면 워크스테이션이 장악되는 공격을 7개 벤더 제품에서 시연
  controls: |-
    - 공정 데이터 읽기의 지정 SCADA·HMI·히스토리언 제한과 외부 제공의 단방향 복제·DMZ 히스토리언
    - OPC UA 보안 모드·업로드 읽기 보호 암호와 엔지니어링 접근의 지정 EWS 제한
    - 새 발신지의 산업 프로토콜 읽기·대량 태그 탐색·업로드·모드 조회 기능 코드 경보

- id: OT-CO-02
  name: 운영·엔지니어링 데이터 수집
  summary: 문서 저장소·EWS·HMI에서 도면·프로젝트·화면·장비 설정을 모아 반출 준비
  members: [T0811, T0893, T0852, T1602.002]
  basis: 정보 저장소·로컬 시스템 데이터 수집·화면 캡처·네트워크 장비 설정 수집은 모두 호스트·저장소·장비에서 운영·엔지니어링 자료를 모으는 같은 수집이며 자료 분류·접근 통제·DLP라는 같은 통제를 받음(운영 정보 탈취 OT-IM-06의 선행 단계)
  description: |-
    - 문서 저장소·클라우드 협업 도구·EWS 로컬 파일에서 도면·프로젝트 파일·설정을 모으고, HMI 화면 캡처와 경계 장비 설정 덤프로 공정 구성과 저장된 자격증명을 수집하는 위협
    - 엔지니어링 단말과 저장소에 설계 자료가 몰려 있어 정상 계정 열람만으로 핵심 정보가 넘어가고, 장비 설정의 자격증명은 OT 진입 경로로 이어짐
  scenario: |-
    - EWS·문서 저장소 침해 → 도면(.dwg)·프로젝트 파일 수집과 HMI 화면 주기 캡처 → 압축·암호화해 임시 영역에 보관한 뒤 외부 메일·C2로 전송
  cases: |-
    - [실제 사고] ACAD/Medre.A(2012-06): AutoCAD 스크립트로 퍼지며 감염 PC의 도면(.dwg)을 모아 외부 메일 계정으로 보냄
    - [실제 사고] Flame(2012-05): 특정 프로그램이 열려 있을 때 주기적으로 화면을 캡처해 C2로 보냄
  controls: |-
    - OT 설계·구성 자료 분류와 접근 최소화·암호화, 단말 로컬 보관 축소
    - 클라우드 협업 도구 조건부 접근·다중 인증과 장비 설정의 평문 자격증명 저장 금지
    - 설계 자료 대량 열람·임시 폴더 압축 파일·화면 캡처 유틸리티 실행과 외부 전송 감시

- id: OT-CO-03
  name: 중간자 공격
  summary: 통신 경로에 끼어들어 제어 명령·계측 값·자격증명을 엿보고 변조·주입
  members: [T0830]
  basis: 단독 유지 — 통신 중간에서 내용을 가로채고 바꾸는 고유 기법으로 수집 전술 중 유일하게 위험도 '높음'이며 메시지 인증·암호화·정적 ARP라는 고유 통제를 받음
  links: [CL-CA-02]
  description: |-
    - ARP 스푸핑·라우터 장악·트래픽 리디렉션으로 SCADA 서버와 RTU·PLC 사이나 EWS와 제어기 사이 통신 경로에 끼어들어 제어 명령·계측 값·자격증명을 엿보거나 바꾸고 주입하는 위협
    - 양쪽 장치는 정상 상대와 통신한다고 믿어 이상을 알아채기 어렵고, 인증·무결성 보호가 없는 산업 프로토콜은 내용 변조에 그대로 노출됨
  scenario: |-
    - 경계 라우터 감염이나 제어망 ARP 스푸핑 → 오가는 트래픽 가로채기 → 보고 메시지 위조·명령 차단과 자격증명 수집
  cases: |-
    - [실제 사고] VPNFilter(2018-05): 감염 라우터의 ssler 모듈이 80번 포트로 나가는 웹 요청을 가로채 내용을 수집·변조
  controls: |-
    - 메시지 인증·암호화(IEC 62351·DNP3-SA·CIP Security·TLS)와 정적 ARP·포트 보안
    - 경계 라우터·VPN 장비 펌웨어 갱신·관리 접속 제한과 중요 명령의 대역 외 확인
    - ARP 테이블 변화·중복 MAC·경로 변경·통신 지연 증가 경보와 경계 장비 설정 무결성 점검

- id: OT-CO-04
  name: 임베디드 하드웨어 직접 공격
  summary: 칩 판독·버스 가로채기·부채널·결함 주입으로 장치 키·펌웨어 추출과 보호 우회
  members: [EMB3D-CO.1, EMB3D-CO.3, EMB3D-LM.1, EMB3D-LM.2, EMB3D-EV]
  basis: 칩 직접 판독·버스 가로채기·부채널 분석·신뢰 루트 비밀 추출·결함 주입은 모두 장치를 물리적으로 분해·계측해 비밀을 빼내거나 하드웨어 보호를 우회하는 같은 하드웨어 공격이며 저장 암호화·보안 소자·변조 방지라는 같은 통제를 받음. 횡적 이동의 EMB3D-LM.1·LM.2와 회피의 EMB3D-EV를 수집으로 이동
  description: |-
    - 장치의 메모리 칩을 떼어 읽거나 내부 버스·DMA를 가로채고, 전력·전자기 부채널 분석과 전압 글리치 결함 주입으로 암호키·펌웨어를 빼내거나 신뢰 루트 검증을 우회하는 위협
    - 로그·무결성 검사에 흔적이 남지 않고 패치할 수 없는 하드웨어 결함이 많아 같은 제품군 전체가 오래 노출되며, 얻은 키·펌웨어는 변조 펌웨어 설치로 이어짐
  scenario: |-
    - 폐기·수리·탈취 장치 확보 → 플래시 칩 판독·버스 프로빙·결함 주입으로 펌웨어와 키 추출 → 신뢰 루트 우회로 변조 펌웨어 제작과 같은 제품군 공격
  cases: |-
    - [실증] S7-1500 신뢰 루트 우회(2023-01): 패치할 수 없는 하드웨어 신뢰 루트 결함으로 펌웨어 무결성 검증을 우회함(CVE-2022-38773)
    - [EMB3D] 하드웨어 결함 주입: 전압 글리치로 부팅 ROM 판독 보호를 건너뛰어 신뢰 루트 코드를 빼낸 사례와 RowHammer 결함 주입 시연
  controls: |-
    - 저장·버스 데이터 암호화·인증과 하드웨어 키 저장·보안 소자·결함 주입 내성 장치 도입
    - 함체 잠금·봉인과 폐기·수리 전 저장장치 완전 삭제, 장치 분실 시 키 폐기·교체
    - 장치 변조·개봉 감지와 보안 부팅 실패·비정상 리셋 경보, 신뢰 루트 관련 권고 대상 제품 식별
