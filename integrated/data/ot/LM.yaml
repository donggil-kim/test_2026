# [LM] 횡적 이동 — 재구성 Lv3 (원본 16행 → 6, 초기 침투의 T0866·T0886, 지속성의 T0859·T1694.x, 수집의 T1056 반복 행은 횡적 이동으로 통합, EMB3D-LM.1·LM.2는 수집 OT-CO-04로 이동)
- id: OT-LM-01
  name: 제어 프로그램 다운로드
  summary: 엔지니어링 프로토콜로 제어기·안전 제어기에 악성 프로그램을 내려받아 로직 교체
  members: [T0843, T0843.001, T0843.002, T0843.003]
  basis: 제어 프로그램 다운로드 상위기법과 전체 다운로드·온라인 편집·프로그램 추가 하위기법은 모두 엔지니어링 기능으로 제어기에 코드를 내려보내는 같은 기법이며 다운로드 인증·키 스위치·지정 EWS 제한이라는 같은 통제를 받음
  description: |-
    - 엔지니어링 프로토콜로 PLC·DCS·안전 제어기에 사용자 프로그램을 내려받아(전체 다운로드·온라인 편집·프로그램 추가) 제어 로직을 자신의 코드로 바꾸거나 새 코드를 더하는 위협
    - 정상 유지보수와 같은 기능이라 통신만으로 악의를 가리기 어렵고, 다운로드에 인증이 없거나 약한 제어기가 많으며 온라인 편집·프로그램 추가는 정지 없이 이뤄짐
  scenario: |-
    - 침해한 EWS·호스트에서 엔지니어링 프로토콜로 제어기 접속 → 운전 모드 변경 후 프로그램 추가 방식으로 공격 로직 다운로드 → 기존 로직은 유지한 채 공격 코드 실행
  cases: |-
    - [실제 사고] Triton(2017-08): 안전계통(SIS) 제어기에 프로그램 추가 방식으로 여러 차례 제어 로직을 내려받음
    - [위협인텔] PIPEDREAM(2022-04): 배포 전 발견된 INCONTROLLER가 CODESYS로 Schneider PLC에, HTTP로 Omron PLC에 프로그램을 내려받는 기능을 갖춤
  controls: |-
    - 제어기 다운로드 암호·인증·역할별 권한과 키 스위치·접근 보호로 운전 중 변경 차단
    - 엔지니어링 프로토콜의 지정 EWS 제한(허용 목록·망 분할·프로토콜 인식 방화벽)과 코드 서명 제어기 도입
    - 다운로드·온라인 편집·프로그램 추가 기능 코드 탐지와 정기 업로드 프로그램의 기준본 비교

- id: OT-LM-02
  name: 유효 계정 악용
  summary: 탈취·퇴사자·새로 만든 유효 계정으로 VPN·원격 서비스·제어 장치에 로그인
  members: [T0859]
  basis: 단독 유지 — 실제 사고 15건으로 OT 원본 최다 기법 중 하나이며 IT→OT 경계를 넘는 핵심 수단(Enterprise T1078·T1098·T1136·T1550.002 통합)으로 계정 분리·다중 인증·즉시 회수라는 고유 통제를 받음. 지속성 반복 행은 횡적 이동에 배치
  description: |-
    - 탈취하거나 새로 만든 유효 계정(도메인·로컬·서비스·장치 계정)과 퇴사자에게 남은 원격 접속 권한으로 VPN·원격 서비스·제어 장치에 로그인해 정상 사용자처럼 OT 환경에 머물고 이동하는 위협
    - 인증을 정상 통과해 접근 통제와 다수 탐지 수단을 그대로 지나치며, 퇴사자·휴면·공용 계정 관리가 허술한 OT 환경에서 반복적으로 악용됨
  scenario: |-
    - 기업망에서 자격증명 수집 → VPN·이중 연결 시스템을 거쳐 제어망 진입 → 권한 있는 계정을 새로 만들어 머물며 RTU·HMI·보호 계전기에 로그인
  cases: |-
    - [실제 사고] 미국 베이 지역 정수장(2021-01): 퇴사한 직원의 TeamViewer 계정으로 제어 시스템에 접속해 정수 처리 프로그램을 삭제
  controls: |-
    - OT 계정·도메인의 IT 분리와 원격·특권 접근의 다중 인증·승인 기반 일시 권한(JIT)
    - 퇴사·계약 종료 시 원격 접속 계정 즉시 폐기와 공용 계정의 개인 계정 전환·정기 검토
    - 로그인 시간·출발지·대상 장치 기준선 비교와 승인된 원격 세션 없는 현장 장치 접근 탐지

- id: OT-LM-03
  name: 기본·하드코딩 자격증명 악용
  summary: 공개된 기본 암호·펌웨어 하드코딩 자격증명으로 PLC·HMI·IoT 기기에 로그인
  members: [T1694, T1694.001, T1694.002]
  basis: 취약한 자격증명 상위기법과 기본·하드코딩 자격증명 하위기법은 모두 계정 탈취 없이 제조사 설정 자격증명으로 장치에 로그인하는 같은 기법이며 출하 설정 변경·벤더 조치·네트워크 분리라는 같은 통제를 받음(Enterprise T1078.001 통합). 지속성 반복 행은 횡적 이동에 배치
  links: [CL-IA-07]
  description: |-
    - 매뉴얼·인터넷에 공개된 기본 계정이나 펌웨어·소프트웨어에 박힌 하드코딩 자격증명·인증 키로 PLC·HMI·RTU·IoT 기기에 로그인해 관리자 권한을 바로 얻는 위협
    - 장치 교체 주기가 길고 일부 자격증명은 바꿀 수 없어 노출이 오래 이어지며, 기본 암호 입력만으로 대규모 공격이 가능해 핵티비스트·IoT 봇넷이 가장 많이 씀
  scenario: |-
    - 검색 엔진으로 노출 장치 탐색 → 텔넷·웹 기본 계정이나 하드코딩 자격증명으로 로그인 → 설정·화면 변경, 봇넷 감염과 인근 시스템 확산
  cases: |-
    - [실제 사고] Mirai(2016-10): 텔넷 기본 계정으로 IP 카메라·DVR 수십만 대를 감염시켜 대규모 DDoS 봇넷을 구성
    - [공개 취약점] Rockwell Logix(CVE-2021-22681): 엔지니어링 소프트웨어와 제어기 사이 인증 키가 노출돼 원격에서 제어기 인증을 우회 — KEV 등재
  controls: |-
    - 설치·인수 시 기본 암호 변경과 장치별 고유 암호 관리, 첫 사용 시 변경을 강제하는 제품 도입
    - 하드코딩 자격증명의 벤더 패치와 패치 전 허용 목록·네트워크 분리, 조달 요건에 금지 명시
    - 기본 계정 이름·평문 프로토콜 로그인 탐지와 노출 장치·권고 해당 제품의 정기 확인

- id: OT-LM-04
  name: 자격증명 탈취(덤프·입력 캡처·대입)
  summary: LSASS·SAM·AD DB 덤프와 키로거·대입으로 OT 접근 자격증명 확보
  members: [T1003, T1056, T1110]
  basis: OS·저장 자격증명 탈취·입력 캡처·무차별 대입은 모두 OT로 넘어갈 자격증명을 얻는 수단으로, ICS에서는 자격증명 접근 전술 없이 횡적 이동 아래에 있으며 자격증명 보호·다중 인증이라는 같은 통제를 받음. 입력 캡처의 수집 반복 행은 횡적 이동에 배치
  links: [CL-CA-01, CL-CA-05]
  description: |-
    - LSASS 메모리·SAM·AD 데이터베이스·브라우저·설정 파일에서 자격증명을 빼내거나 키로거·위장 포털로 입력을 가로채고, 반복 대입·해시 크래킹·자격증명 스터핑으로 OT 접근 계정을 얻는 위협
    - OT 호스트는 자격증명 보호 기능이 꺼져 있거나 레거시 OS라 덤프가 쉽고, 장치 로그인 잠금이 없는 경우가 많으며 한 번 얻은 도메인 자격증명은 IT·OT 전체에 통함
  scenario: |-
    - 침해 호스트에서 키로거·Mimikatz·SAM 하이브 탈취와 RPC·NTLM 대입 → 도메인 관리자·OT 운영자 자격증명 확보 → VPN·점프 호스트·HMI 로그인으로 이동
  cases: |-
    - [실제 사고] Duqu(2011-10): 키로거 모듈로 키 입력을 기록해 자격증명과 정보를 수집
  controls: |-
    - LSA 보호·Credential Guard 적용과 계층화된 관리자 모델, OT 도메인 분리
    - 원격·특권 접근 다중 인증(하드웨어 토큰)과 운영 영향을 검토한 로그인 실패 잠금·지연
    - LSASS 접근·하이브 저장·ntdsutil 실행과 반복 로그인 실패·키보드 후킹 API 탐지

- id: OT-LM-05
  name: 원격 서비스 악용 및 도구 전송
  summary: RDP·SMB·원격 지원 도구로 OT 자산을 오가며 공격 도구와 페이로드 전송
  members: [T0886, T0867]
  basis: 정상 원격 서비스 접속과 내부 도구 전송은 확보한 계정·거점에서 OT 자산으로 넘어가 다음 단계 도구를 옮기는 같은 확산 흐름이며 점프 호스트 일원화·관리 공유 제한이라는 같은 통제를 받음(Enterprise T1021·T1047·T1105·T1570 통합). 원격 서비스의 초기 침투 반복 행은 횡적 이동에 배치
  links: [CL-LM-01]
  description: |-
    - RDP·SSH·SMB·WMI·DB 접속·원격 지원 소프트웨어 같은 정상 원격 서비스로 OT 자산 사이를 오가고, SMB 공유·원격 복사·그룹 정책으로 공격 도구와 페이로드를 옮기는 위협
    - 운영 업무에 쓰는 서비스·배포 경로라 막기 어렵고 트래픽이 업무와 섞이며, IT와 OT를 잇는 공유 폴더·이중 연결 호스트가 이동·전송 통로가 됨
  scenario: |-
    - 탈취 계정으로 점프 호스트 RDP 접속 → 허술한 OT 방화벽 규칙을 지나 SCADA 서버·HMI에 원격 접속 → SMB·관리 공유로 ICS 페이로드를 복사해 다음 단계 준비
  cases: |-
    - [실제 사고] WannaCry(2017-05): SMB 취약점으로 원격 컴퓨터에 자신을 복사해 산업망까지 퍼짐
  controls: |-
    - OT 원격 접속의 점프 호스트 일원화·다중 인증·세션 기록과 구간 사이 RDP·SMB 직접 연결 차단
    - IT↔OT 파일 전송의 검사 중계 시스템 일원화와 원격 지원 도구의 승인 도구·시간 제한
    - IT 계정의 OT 자산 접속과 여러 호스트에 같은 파일이 생기는 SMB 쓰기 급증 경보

- id: OT-LM-06
  name: 원격 서비스 취약점 악용(웜 확산)
  summary: SMB·RPC·DB 서비스 취약점을 악용한 웜이 IT망에서 제어계통까지 자동 확산
  members: [T0866]
  basis: 단독 유지 — 웜형 취약점 확산(WannaCry·NotPetya·Slammer 등)으로 계정을 쓰는 원격 서비스 악용(OT-LM-05)과 달리 위험 기반 패치·서비스 비활성화·구간 분리라는 다른 통제를 받음(Enterprise T1210 통합). 초기 침투 반복 행은 횡적 이동에 배치
  links: [CL-LM-01]
  description: |-
    - HMI·EWS·SCADA 서버·히스토리언의 SMB·RPC·데이터베이스 서비스나 장치 웹 서비스의 취약점을 악용해, 처음 진입하거나 내부의 다른 자산으로 자동 확산하는 위협
    - 패치하기 어려운 노후 운영체제와 장치가 많아 오래된 취약점이 계속 유효하고, 웜형 악성코드는 협력업체 연결·IT망을 거쳐 OT까지 사람 개입 없이 번짐
  scenario: |-
    - 협력업체 연결이나 IT망의 감염 호스트 → 패치되지 않은 SMB·SQL 서비스 취약점으로 OT 호스트에 자동 전파 → 감시·안전 표시 시스템 마비와 생산 중단
  cases: |-
    - [실제 사고] 데이비스-베시 원전(2003-01): SQL Slammer 웜이 협력업체 연결로 들어와 안전 변수 표시 시스템을 마비
  controls: |-
    - 운영 영향을 검증한 위험 기반 패치와 패치 불가 자산의 서비스 비활성화·구간 분리·허용 목록
    - OT 구간 사이 불필요한 SMB·RPC 차단과 협력업체 연결 분리
    - 익스플로잇 패턴·내부 대량 SMB·RPC 연결 확산의 DPI 탐지와 서비스 충돌 로그 확인
