# [RD] 자원 개발 — 재구성 Lv3 (원본 5행 → 2)
- id: OT-RD-01
  name: 공격 인프라 탈취(중계망·VPS)
  summary: 제3자 라우터·IoT 기기·VPS를 탈취해 중계망과 C2 인프라로 사용
  members: [T1584, T1584.008]
  basis: 공격 인프라 탈취 상위기법과 네트워크 장비 탈취 하위기법은 모두 제3자 서버·네트워크 장비를 탈취해 C2·중계에 쓰는 같은 준비 행위이며 침해 인프라 지표 대조·외부 통신 허용 목록이라는 같은 통제를 받음(Enterprise T1584.001·.003 통합)
  links: [CL-RD-01]
  description: |-
    - 남의 서버·VPS와 지원이 끝난 SOHO 라우터·IP 카메라·NAS를 대량 탈취해 중계망으로 묶고, 이를 거쳐 표적 기관에 접근하거나 명령·제어 통신을 하는 위협
    - 표적에는 국내 가정·소규모 사업장 IP에서 오는 정상 트래픽처럼 보여 평판·지역 기반 차단이 통하지 않고, 추적하면 엉뚱한 피해자에 닿아 귀속이 어려움
  scenario: |-
    - 알려진 취약점으로 라우터·IP 카메라·NAS 대량 감염 → 중계 봇넷과 탈취 VPS로 출발지 은닉 → 기반시설 기관 IT망 접근·장기 잠복과 C2 통신
  cases: |-
    - [실제 사고] Volt Typhoon(2024-02): 탈취한 SOHO 라우터 봇넷(KV-botnet)을 중계로 삼아 미국 기반시설 기관 IT망에 장기간 잠복
    - [실제 사고] Raptor Train(2024-09): 라우터·IP 카메라·NVR·NAS 등 약 26만 대를 알려진 취약점으로 감염시켜 공격 중계 인프라로 사용
  controls: |-
    - 보유 SOHO 라우터·IoT 기기의 지원 종료 제품 교체·펌웨어 갱신과 원격 관리 기능 해제
    - OT 망 외부 통신의 목적지 허용 목록과 원격 접속 다중 인증·기기 인증
    - 침해 인프라·봇넷 중계 노드 지표의 경계 로그 대조와 가정용 ISP 대역 관리 접속 확인

- id: OT-RD-02
  name: OT 공격 역량 개발·확보
  summary: OT 맞춤 악성코드 개발과 공개 도구·생성형 AI 확보로 공격 역량 마련
  members: [T1587.001, T1588.002, T1588.007]
  basis: 맞춤 악성코드 개발·기존 도구 확보·생성형 AI 활용은 모두 피해 기관 밖에서 공격 역량을 마련하는 같은 준비 행위이며 OT 위협 인텔리전스·행위 기반 탐지라는 같은 통제를 받음. AI 활용은 AI 보안위협 매트릭스 UT-02.1·UT-03과 연계
  links: [AI-01-05]
  description: |-
    - 표적 OT 환경의 제어기·프로토콜에 맞춘 악성코드를 개발하거나 Mimikatz·공개 프로토콜 라이브러리를 확보하고, 생성형 AI로 스크립트·페이로드를 만들어 공격 역량을 마련하는 위협
    - 피해 기관 밖에서 이뤄져 직접 탐지가 어렵고, AI 산출물은 공격마다 달라 서명 기반 탐지를 피하며 OT 지식이 부족한 공격자의 진입 장벽을 낮춤
  scenario: |-
    - 표적 장비·펌웨어 확보와 공개 도구·LLM으로 맞춤 페이로드·스크립트 제작 → 침투 후 실행 → EDR에 탐지되면 같은 날 페이로드를 고쳐 재시도
  cases: |-
    - [실제 사고] 2025 폴란드(2025-12): LLM으로 생성한 맞춤 스크립트를 공격에 쓰고, EDR에 탐지되자 같은 날 페이로드를 고쳐 다시 실행을 시도
  controls: |-
    - 서명된 스크립트만 허용하고 스크립트 엔진·반입 도구 실행을 허용 목록으로 제한
    - OT 특화 위협 인텔리전스(신규 ICS 악성코드·도구)의 탐지 규칙 반영과 행위 기반 탐지 병행
    - 탐지 직후 같은 날 변종이 다시 실행되는 재시도 패턴 상관 분석과 차단 범위 확대
