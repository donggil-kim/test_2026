# [C2] 명령·제어 — 재구성 Lv3 (원본 3행 → 1)
- id: OT-C2-01
  name: 정상 프로토콜·포트·프록시 위장 C2
  summary: HTTP·산업 프로토콜·MQTT와 일반 포트·내부 프록시로 C2를 정상 통신에 은닉
  members: [T0869, T0884, T0885]
  basis: 표준 응용 계층 프로토콜·연결 프록시·일반 포트 사용은 모두 정상 프로토콜·포트·중계 경로에 C2를 숨기는 같은 계열이며 외부 통신 허용 목록·DMZ 중계·프로토콜 인식 감시라는 같은 통제를 받음(Enterprise T1071·T1090·T1572·T1573 등 통합)
  links: [CL-C2-01]
  description: |-
    - HTTP(S)·웹 서비스와 Modbus·TriStation·MQTT 같은 산업·IoT 프로토콜, 늘 열린 포트, 내부 프록시·역방향 터널·제어기 라우팅을 써서 OT 시스템까지 명령·제어 통신을 숨겨 잇는 위협
    - 허용된 프로토콜·포트라 방화벽을 통과하고 산업 프로토콜 안의 명령은 일반 IT 보안 장비가 해석하지 못하며, 분리된 망도 신뢰된 중계 호스트를 거치면 통신이 이어짐
  scenario: |-
    - 이중 연결 호스트·내부 프록시에 터널 구성 → 인터넷이 없는 OT 호스트·IoT 기기까지 HTTP·MQTT 채널 연결 → 산업 프로토콜·표준 포트로 장치에 명령 전달
  cases: |-
    - [실제 사고] IOCONTROL(2024-12): 리눅스 기반 IoT·OT 기기용 악성코드가 MQTT로 명령을 받으며 연료 관리 시스템 침해에 쓰임
  controls: |-
    - OT 망 인터넷 직접 통신 차단과 DMZ 중계·목적지 허용 목록, 이중 연결 호스트 제거
    - 발신지·목적지·프로토콜 기준 허용 목록과 프로토콜 인식 침입 방지, 쓰지 않는 MQTT·라우팅 기능 해제
    - 새 외부 목적지·주기적 비컨·프록시·터널 도구와 포트·프로토콜 불일치 통신 경보
