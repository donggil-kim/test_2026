# [EV] 회피 — 재구성 Lv3 (원본 12행 → 3, T0858은 실행·T1692.x는 공정 제어 훼손·T1484.001은 권한 상승으로 통합, EMB3D-EV는 수집 OT-CO-04로 이동, 대응 기능 억제의 T0851 반복 행은 회피로 통합)
- id: OT-EV-01
  name: 위장 및 정상 바이너리 대리 실행
  summary: 벤더 프로그램·프로토콜 이름으로 위장하고 rundll32·SCADA 도구로 대리 실행
  members: [T0849, T0894]
  basis: 위장과 시스템 바이너리 대리 실행은 모두 정상 파일·서명된 바이너리로 보이게 해 실행·은닉하는 같은 회피이며 해시·서명자 기준 허용 목록이라는 같은 통제를 받음(Enterprise T1036.x·T1218.x 통합)
  links: [CL-ST-02]
  description: |-
    - 악성 파일·서비스·방화벽 규칙을 벤더 프로그램·전력 프로토콜·기관명처럼 꾸미거나 rundll32·msiexec·SCADA 명령 도구 같은 신뢰된 바이너리로 대신 실행해 정상 구성요소로 보이게 하는 위협
    - OT 호스트에는 벤더별 실행 파일·서비스가 많아 이름만으로 정상 여부를 가리기 어렵고, 서명된 바이너리를 쓰면 허용 목록과 서명 검사를 통과함
  scenario: |-
    - 공격 도구를 SIS 로그 분석 도구·전력 프로토콜 이름으로 위장해 배치 → rundll32나 SCADA 명령 도구로 대리 실행 → 운영자·보안 도구가 정상 구성요소로 오인
  cases: |-
    - [실제 사고] 2016 우크라이나(2016-12): 전력 프로토콜 이름을 단 DLL·EXE를 쓰고, 실행 파일을 .txt로 옮긴 뒤 이름을 바꿈
  controls: |-
    - 해시·서명자 기준 허용 목록과 벤더 설치 경로 쓰기 제한, 탈취 코드 서명 인증서 신뢰 제거
    - SCADA 명령 도구의 지정 계정·경로 실행 제한과 실행 기록, 경계 장비 규칙의 변경 관리 대조
    - 같은 이름의 다른 해시·경로·서명자와 rundll32·msiexec의 임시 경로 실행 경보

- id: OT-EV-02
  name: 흔적 삭제 및 루트킷 은폐
  summary: 로그·악성 파일 삭제와 PLC·OS 루트킷으로 침해 흔적과 악성 로직 은폐
  members: [T0872, T0851, T0820]
  basis: 호스트 흔적 삭제·루트킷·회피용 취약점 악용은 모두 침해 흔적과 심어 둔 코드를 감춰 탐지를 피하는 같은 목적이며 로그 중앙 보존·독립 경로 무결성 점검이라는 같은 통제를 받음. 루트킷의 대응 기능 억제 반복 행은 은닉이 본질이라 회피에 배치
  links: [CL-ST-01]
  description: |-
    - 이벤트 로그·악성 파일·저장 프로시저를 지우고 파일 시각을 바꾸거나, 엔지니어링 통신 DLL·OS 루트킷과 펌웨어 점검 우회로 PLC 악성 로직과 파일·통신을 숨기는 위협
    - OT 장치는 로그 보존 용량이 작고 중앙 수집이 안 된 경우가 많으며, PLC 루트킷은 엔지니어링 소프트웨어가 읽는 로직까지 정상으로 보이게 해 점검 절차를 속임
  scenario: |-
    - 엔지니어링 통신 DLL을 가짜로 교체 → PLC 악성 블록 읽기 요청을 걸러 정상 로직으로 보이게 함 → 저장 프로시저 삭제·파일 시각 위조로 감염 흔적 제거
  cases: |-
    - [실제 사고] Stuxnet(2010-06): 가짜 s7otbxdx.dll로 PLC의 악성 블록 읽기 요청을 숨기고, SQL 저장 프로시저를 지우고 드라이버 파일 시각을 정상 파일과 맞춤
  controls: |-
    - OT 호스트·장비 로그의 원격 syslog 실시간 중앙 수집과 로그 저장소 권한 분리
    - 엔지니어링 단말 허용 목록·코드 서명 검증과 펌웨어 서명·보안 부팅 지원 장치 교체 계획
    - 로그 삭제·로그 공백과 통신 라이브러리 해시 변화 경보, 독립 경로로 읽은 PLC 로직의 기준본 비교

- id: OT-EV-03
  name: 보안 도구·경계 장비 설정 무력화
  summary: 백신·로깅 에이전트를 끄고 경계 방화벽 규칙·다중 인증·로깅을 해제
  members: [T1685, T1686.002]
  basis: 보안 도구 무력화와 경계 장비 보안 설정 변조는 모두 방어 수단을 끄거나 약화해 이후 행위를 숨기는 같은 회피이며 변조 방지·설정 변경 감시라는 같은 통제를 받음(클라우드 CL-DI-01과 같은 기법 계열)
  links: [CL-DI-01]
  description: |-
    - EWS·HMI·SCADA 서버의 백신·EDR·이벤트 로깅과 OT 보안 센서를 멈추거나, IT/OT 경계 방화벽·VPN의 규칙·다중 인증·트래픽 로깅을 바꿔 방어를 무력화하는 위협
    - 운영 영향을 우려한 예외 설정이 많고 중앙 관리가 약해 꺼져도 오래 알아채지 못하며, 경계 장비 규칙 하나만 바뀌어도 망 분리가 무력화됨
  scenario: |-
    - 침해 호스트에서 백신·보안 프로세스 강제 종료와 이벤트 로깅 해제 → 경계 장비 CLI로 보안 설정·다중 인증·로깅 해제 → 탐지 없이 랜섬웨어·와이퍼 실행
  cases: |-
    - [실제 사고] 혼다 공장(2020-06): EKANS가 보안·관리 소프트웨어 프로세스를 멈추고 공장 시스템을 암호화해 일부 생산이 중단
  controls: |-
    - 보안 도구 변조 방지와 중지·제거 권한 분리, 예외 설정 정기 검토와 로깅 설정의 구성 관리 강제
    - 경계 장비 관리 접속의 관리망·다중 인증 제한과 변경 관리 승인, 개인별 관리 계정
    - 보안 에이전트·센서 신호 단절과 경계 장비 설정·로그 전송 변화의 기준본 비교 경보
