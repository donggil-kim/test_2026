        cases: ["MERCURY·DEV-1084 하이브리드 환경 파괴 공격(2023-04)", "MagicWeb — AD FS 서버 인증 백도어(2022-08)"]
      - id: ID-DI-04
        name: IdP·인증 서비스 공급업체 침해
        members: [IDT-DI-03.1]
        basis: 단독 유지 — 고객 통제 밖(공급업체)에서 시작되는 침해로 공급업체 침해 공지 대응·토큰 일괄 폐기라는 고유 통제
        cases: ["Okta 지원 시스템 침해(2023-10)", "RSA SecurID 시드 정보 탈취와 Lockheed Martin 침투 시도(2011-03)"]
      - id: ID-DI-05
