        cases: ["MGM Resorts 랜섬웨어(2023-09)", "Mat Honan 계정 연쇄 탈취(2012-08)"]
      - id: ID-IM-03
        name: 계정 기반 대량 데이터 탈취·갈취
        members: [IDT-IM-03]
        basis: 단독 유지 — 신원 사고가 가장 많이 몰린 결과 유형(실제 사고 47건)으로 대량 조회 감시라는 고유 통제
        cases: ["Snowflake 고객 인스턴스 대량 데이터 탈취(2024-05)", "Co-op 회원 650만 명 정보 탈취(2025-04)"]
      - id: ID-IM-04
        name: 공급업체·플랫폼 경유 연쇄 계정 탈취
        members: [IDT-IM-05]
        basis: 단독 유지 — 공급업체 신원 침해가 고객 계정으로 번지는 확산 유형으로 공급업체 침해 시 토큰 일괄 폐기라는 고유 통제
        cases: ["Salesloft Drift 연동 OAuth 토큰 탈취로 Salesforce 인스턴스 대량 데이터 반출(2025-08)", "CircleCI 고객 비밀 유출(2023-01)"]

