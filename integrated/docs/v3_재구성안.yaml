# 통합 보안위협 매트릭스 v3 — 공급망·신원·물리 재구성안 (1단계 확정본)
#
# 원본 세부위협을 요약 Lv3로 묶은 구성(id · name · members · basis)과 대표 사례 후보입니다.
# 새 세션은 이 파일을 기준으로 integrated/data/<kind>/<도메인>.yaml 문안을 작성합니다.
#   - 진행 점검: python3 integrated/scripts/v3_status.py
#   - 문안 골격: python3 integrated/scripts/v3_status.py --skeleton identity SE   (파일이 없을 때만 생성)
# status: done = 문안 작성 완료(검증 통과) / todo = 문안 미작성
# cases: 대표 사례 후보 '사례명(시점)' — 같은 Lv0 안에서 사고가 겹치지 않게 미리 배치한 것(원본 참조 줄과 글자 그대로 일치).
#        원본 사례명의 '크리덴셜 스터핑'은 요약에서 '자격증명 스터핑'으로 씀(검증기가 원본 쪽을 같은 용어로 바꿔 대조)
# 규모: 공급망 60 → 33 (done) · 신원 65 → 35 (AU 4 done, 31 todo) · 물리·인적 45 → 27 (todo) — 합계 95, v3 = 163 + 95 = 258

supplychain:
  status: done            # integrated/data/supplychain/*.yaml 33개, 검증 오류·경고 0

identity:
  AU:
    status: done          # integrated/data/identity/AU.yaml — ID-AU-01~04 (사례 사용: IDI-017·043·002·047·015·018·087·091)
  SE:
    status: done          # integrated/data/identity/SE.yaml — ID-SE-01~04 (사례 사용: IDI-004·031·010·056·036·032·013·072)
    items:
      - id: ID-SE-01
        name: 인증 피싱(AiTM·OAuth 동의·문자·메신저)
        members: [IDT-SE-01.1, IDT-SE-01.2, IDT-SE-01.3]
        basis: 원본 위협분류 '자격증명·인증 피싱' 3개 — 전달 채널과 받아내는 증표만 다른 같은 인증 피싱이며 피싱 저항 MFA·관리자 동의 흐름이라는 같은 통제
        cases: ["Twilio 등 0ktapus SMS 피싱 캠페인(2022-08)", "Storm-2372 디바이스 코드 피싱 캠페인(2025-02)"]
      - id: ID-SE-02
        name: 헬프데스크 사칭과 계정 복구 절차 악용
        members: [IDT-SE-02.1, IDT-SE-03]
        basis: 본 인증보다 약한 복구·재설정 경로로 계정을 넘겨받는 같은 위협이며 재설정 전 강한 신원 확인이라는 같은 통제(SE-03은 Lv2가 1개뿐이라 인접 Lv2와 묶음)
        cases: ["Marks & Spencer 랜섬웨어(2025-04)", "Coinbase SMS 계정 복구 결함 악용(2021-10)"]
      - id: ID-SE-03
        name: IT 지원 사칭으로 원격 지원·연결 앱 승인 유도
        members: [IDT-SE-02.2]
        basis: 단독 유지 — 사용자를 상대로 한 사칭(SE-02는 헬프데스크를 상대로 한 사칭)으로 피해 지점(단말·연결 앱)과 통제(원격 지원 도구 허용 목록·연결 앱 관리자 승인)가 다름
        cases: ["Salesforce 대상 음성 피싱(2025-06)", "Storm-1811 메일 폭탄과 IT 지원 사칭(2024-05)"]
      - id: ID-SE-04
        name: 딥페이크·AI 음성 사칭(송금·접근 요청)
        members: [IDT-SE-04]
        basis: 단독 유지 — 얼굴·목소리라는 신뢰 확인 수단 자체를 위조하는 위협으로 별도 채널 콜백·이중 승인이라는 고유 통제(AI-01-07·AI-01-08 연계)
        cases: ["Arup 딥페이크 화상회의 송금 사기(2024-01)", "Retool 고객 계정 27곳 장악(2023-08)"]
  CR:
    status: done          # integrated/data/identity/CR.yaml — ID-CR-01~02 (사례 사용: IDI-067·071·108·070)
    items:
      - id: ID-CR-01
        name: 단말 자격증명 탈취(인포스틸러·덤프·키로깅)
        members: [IDT-CR-01.1, IDT-CR-01.2, IDT-CR-01.3]
        basis: 원본 위협분류 '단말 자격증명 탈취' 3개 — 감염 단말에서 자격증명을 빼내는 같은 위협이며 단말 EDR·개인 기기 업무 접근 통제라는 같은 통제
        cases: ["Genesis Market 폐쇄(2023-04)", "LastPass 고객 금고 백업 탈취(2022-12)"]
      - id: ID-CR-02
        name: 저장·노출된 비밀(코드·설정·자격증명 금고)
        members: [IDT-CR-02.1, IDT-CR-02.2]
        basis: 원본 위협분류 '저장·노출된 비밀' 2개 — 저장된 비밀을 한꺼번에 얻는 같은 위협이며 비밀 스캔·비밀 저장소 분리·즉시 교체라는 같은 통제
        cases: ["New York Times 소스 코드 270GB 유출(2024-01)", "Disney 사내 Slack 1.1TB 유출(2024-07)"]
  TS:
    status: done          # integrated/data/identity/TS.yaml — ID-TS-01~03 (사례 사용: IDI-088·064·021·097·027·042)
    items:
      - id: ID-TS-01
        name: 세션·토큰 탈취와 재사용(장비 메모리 노출 포함)
        members: [IDT-TS-01.1, IDT-TS-01.2, IDT-TS-01.3]
        basis: 원본 위협분류 '세션·토큰 탈취와 재사용' 3개 — 탈취 지점만 다른 같은 위협이며 세션 장치 바인딩·짧은 수명·전체 세션 폐기라는 같은 통제
        cases: ["Citrix Bleed 세션 토큰 탈취와 LockBit 랜섬웨어(2023-11)", "Electronic Arts 소스 코드 탈취(2021-06)"]
      - id: ID-TS-02
        name: Windows·Kerberos 인증 자료 재사용
        members: [IDT-TS-02.1, IDT-TS-02.2, IDT-TS-02.3]
        basis: 원본 위협분류 'Windows·Kerberos 인증 자료 재사용' 3개 — 같은 통제(레거시 인증 프로토콜 제한·서비스 계정 강한 비밀번호·특권 계정 계층화)로 묶음
        cases: ["Ascension 랜섬웨어(2024-05)", "NotPetya의 자격증명 탈취·재사용 확산(2017-06)"]
      - id: ID-TS-03
        name: 토큰·티켓 위조(서명 키 탈취 포함)
        members: [IDT-TS-03.1, IDT-TS-03.2, IDT-TS-03.3]
        basis: 원본 위협분류 '토큰·티켓 위조' 3개 — 서명 키·인증서를 얻어 인증 증표를 만들어 내는 같은 위협이며 서명 키 보호(HSM)·주기 교체라는 같은 통제
        cases: ["SolarWinds 침해 이후 클라우드 장악(2020-12)", "쿠팡 고객 계정 정보 3,367만 건 유출(2025-11)"]
  DI:
