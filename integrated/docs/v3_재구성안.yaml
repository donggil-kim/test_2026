        cases: ["SK텔레콤 유심 정보 2,696만 건 유출(2025-04)", "KT 불법 펨토셀 경유 결제 인증 탈취·무단 소액결제(2025-09)"]
      - id: ID-CI-03
        name: 명의 도용·본인확인 우회(딥페이크 포함)
        members: [IDT-CI-03.1, IDT-CI-03.2]
        basis: 원본 위협분류 '명의 도용·본인확인 우회' 2개 — 계좌·계정 개설 단계 본인확인을 속이는 같은 위협이며 다중 증빙·라이브니스 검사라는 같은 통제
        cases: ["홍콩 딥페이크 얼굴 바꾸기로 대출·계좌 개설 사기 조직 검거(2023-08)", "GoldPickaxe 얼굴 인식 정보 탈취 트로이목마(2024-02)"]
  IM:
    status: todo
    items:
      - id: ID-IM-01
        name: 계정 장악 기반 금전 사기(BEC·송금·사칭 게시)
        members: [IDT-IM-01]
        basis: 단독 유지 — 금전 피해 결과 유형(실제 사고 20건)으로 송금 이중 확인이라는 고유 통제
        cases: ["AiTM 피싱으로 세션 쿠키 탈취 후 BEC(2022-07)", "Ronin 브리지 6억 달러대 탈취(2022-03)"]
      - id: ID-IM-02
