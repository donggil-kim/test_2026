# [IA] 초기 침투·사회공학 — AI 활용 공격 관점 문구 (가드레일 D11: 방어 자료, 공세 제작법 미기재)

AIA-IA-01.1:
  oneline: AI 생성 대량 피싱·미끼로 기존 피싱 탐지 단서 무력화
  summary: |-
    - 공격자는 AI로 문법·맥락이 자연스러운 피싱 미끼를 대량 생성해, 오탈자·어색함에 기대던 기존 탐지를 무력화할 수 있음
    - 품질·규모가 함께 올라가 더 많은 표적이 속고, 피해는 계정 탈취·BEC로 이어짐
  reference: |-
    ■ 관점
    - 대상: 이메일·메신저 피싱 미끼와 수신자(AML.T0052·AML.T0052.000 — 기존 피싱 T1566·T1566.001·정보 피싱 T1598을 AI가 가속)
    - 왜 어려운가: 콘텐츠 품질이 높아 규칙·휴리스틱 탐지가 약해지고 대량 생성됨(증폭형)
    - 연계: 방어자 AI 관점의 AI 생성 피싱(AI-01-08), 신원 인증 피싱(ID-SE-01)
    - 참고: HiddenLayer 〈2026 AI Threat Landscape〉
    ■ 실제 사례
    - [실제 사고] CaptiveCrunch — Storm-2945의 AI 보조 피싱(2026-07): 숙박업 캡티브 포털을 조작해 디바이스 코드 피싱을 대규모로 수행, 작전 상당 부분에 AI 활용(ai_use 추정) (AII-023)
  detect: |-
    ■ 탐지
    - 발신 평판·행위·링크 분석 등 콘텐츠 품질에 덜 의존하는 다중 신호로 피싱을 탐지(NIST SI-4)
    - 디바이스 코드·OAuth 동의 등 비정상 인증 흐름을 모니터링(NIST SC-7)
    ■ 대응
    - 피싱 내성 MFA·조건부 접근과 사용자 신고·교육으로 대량 미끼에 대응(NIST AT-2(3))
    - 참고: HiddenLayer 〈2026 AI Threat Landscape〉

AIA-IA-01.2:
  oneline: AI로 맥락 맞춘 표적 스피어피싱·BEC로 특정 인물 공략
  summary: |-
    - 공격자는 수집한 표적 정보를 AI로 엮어 맥락에 맞는 사칭 메시지를 만들어 특정 인물을 노릴 수 있음
    - 개인화 품질이 높아 의심을 사기 어렵고, 송금·자격증명 탈취로 직결될 수 있음
  reference: |-
    ■ 관점
    - 대상: 경영진·재무·조달 등 고가치 역할(AML.T0052.000·AML.T0073 — 기존 피싱 T1566·내부 스피어피싱 T1534·정보 피싱 T1598을 AI가 개인화)
    - 왜 어려운가: 표적별 맞춤 생성으로 일반 피싱 탐지·사용자 직관을 우회(증강·증폭형)
    - 연계: 방어자 AI 관점의 AI 생성 피싱(AI-01-08), 신원 인증 피싱(ID-SE-01)
    - 참고: HiddenLayer 〈2026 AI Threat Landscape〉
    ■ 실제 사례
    - [실제 사고] 김수키의 생성형 AI 위조 군 신분증 스피어피싱(2025-07): 국내 국방 관련 기관·연구자를 표적, 생성형 AI 위조 신분증을 미끼로 사용(Genians 확인) (AII-035)
  detect: |-
    ■ 탐지
    - 고위험 역할 대상 메시지의 이상 징후(발신 경로·요청 맥락)와 비정상 송금·승인 요청을 모니터링(NIST SI-4)
    ■ 대응
    - 고액·고위험 요청에 다채널 확인과 역할 기반 교육을 적용(NIST AT-2(3))
    - 참고: HiddenLayer 〈2026 AI Threat Landscape〉

AIA-IA-02.1:
  oneline: 영상 딥페이크 사칭으로 화상회의·면접 신뢰 악용
  summary: |-
    - 공격자는 공개 영상으로 만든 영상 딥페이크로 경영진·동료를 사칭해 화상회의·면접에서 지시·신뢰를 얻을 수 있음
    - 사람의 시각 신뢰를 직접 무너뜨려 고액 송금·내부 접근 같은 큰 피해로 직결됨
  reference: |-
    ■ 관점
    - 대상: 화상회의·면접의 참석자 신뢰(AML.T0088·AML.T0073 — 딥페이크 생성·사칭)
    - 왜 어려운가: 실시간 영상이 진짜처럼 보여 사람 검증·기존 본인확인이 뚫림(증폭형)
    - 연계: 방어자 AI 관점의 AI 생성 피싱·사칭(AI-01-08), 신원 딥페이크 사칭(ID-SE-04)
    - 참고: CNN 〈홍콩 딥페이크 금융사기〉
    ■ 실제 사례
    - [실제 사고] Arup 딥페이크 화상회의 송금 사기(2024-02): 참석자 전원이 딥페이크인 화상회의 지시로 약 2,560만 달러 송금 (AII-002)
  detect: |-
    ■ 탐지
    - 고액·고위험 지시의 출처를 영상 외 경로로 교차 확인하고 딥페이크·라이브니스 징후를 점검(NIST IA-2)
    ■ 대응
    - 고위험 요청에 다채널·사전 등록 경로 확인을 의무화하고 사용자 교육(NIST AT-2(3)·IA-2)
    - 참고: CNN 〈홍콩 딥페이크 금융사기〉

AIA-IA-02.2:
  oneline: 음성 딥페이크 사칭으로 전화 본인확인·헬프데스크 우회
  summary: |-
    - 공격자는 직원·임원 목소리를 딥페이크로 흉내 내 전화 본인확인·헬프데스크 절차를 우회하고 추가 인증·승인을 받아낼 수 있음
    - 음성 신뢰에 기대던 절차가 뚫려 계정 등록·접근 확대로 이어짐
  reference: |-
    ■ 관점
    - 대상: 전화 기반 본인확인·헬프데스크(AML.T0088·AML.T0073 — 딥페이크 생성·사칭, 정보 피싱 T1598)
    - 왜 어려운가: 음성만으로는 진위 판별이 어렵고 긴급성을 더해 절차를 건너뛰게 함(증폭형)
    - 연계: 방어자 AI 관점의 AI 생성 사칭(AI-01-08), 신원 딥페이크 사칭(ID-SE-04)
    - 참고: HiddenLayer 〈2026 AI Threat Landscape〉
    ■ 실제 사례
    - [실제 사고] Retool 고객 계정 27곳 장악(딥페이크 음성 사칭 포함)(2023-09): 직원 목소리를 딥페이크로 흉내 낸 전화로 추가 인증을 받아 공격자 장치를 등록 (AII-011)
  detect: |-
    ■ 탐지
    - 헬프데스크·계정 복구 요청의 음성 사칭 징후와 비정상 MFA 등록을 점검(NIST IA-2)
    ■ 대응
    - 음성에 의존하지 않는 본인확인(콜백·사전 등록·피싱 내성 MFA)과 헬프데스크 절차 강화(NIST IA-2·AT-2(3))
    - 참고: HiddenLayer 〈2026 AI Threat Landscape〉

AIA-IA-03:
  oneline: 딥페이크로 생체·비대면 본인확인(KYC) 우회해 계정 장악
  summary: |-
    - 공격자는 AI 얼굴 바꾸기로 은행 얼굴 인식·KYC를 통과해 계좌를 열거나 장악할 수 있음
    - 비대면 본인확인의 신뢰 기반이 무너져 금전 사기·명의 도용으로 직결됨
  reference: |-
    ■ 관점
    - 대상: 생체·비대면 본인확인(KYC) 체계(AML.T0088·AML.T0015 — 딥페이크 생성으로 모델 판정 회피)
    - 왜 어려운가: 합성 얼굴·영상이 라이브니스를 통과할 수 있어 비대면 검증이 뚫림(증폭형)
    - 연계: 방어자 AI 관점의 AI 생성 사칭(AI-01-08), 신원 본인확인 우회(ID-CI-03)
    - 참고: CNN 〈홍콩 딥페이크 금융사기〉 · Group-IB 〈GoldPickaxe〉
    ■ 실제 사례
    - [실제 사고] 홍콩 딥페이크 얼굴 바꾸기로 대출·계좌 개설 사기 조직 검거(2023-08): 얼굴 인식 절차에서 AI 얼굴 바꾸기로 신분증 주인 얼굴로 바꿔 통과 (AII-001)
    - [실제 사고] GoldPickaxe — 얼굴 인식 정보 탈취 트로이목마(은행 생체 인증 우회)(2024-02): 수집한 얼굴 데이터로 만든 딥페이크로 은행 생체 본인확인을 우회 (AII-013)
  detect: |-
    ■ 탐지
    - 라이브니스·프레젠테이션 공격 탐지와 비정상 계좌 개설·접근 패턴을 모니터링(NIST IA-2·AC-2)
    ■ 대응
    - 강화된 라이브니스·다중 요소·문서 진위 검증과 위험 기반 추가 확인을 적용(NIST IA-2·AC-2)
    - 참고: CNN 〈홍콩 딥페이크 금융사기〉 · Group-IB 〈GoldPickaxe〉

AIA-IA-04:
  oneline: AI 미끼·ClickFix·크래프트 링크로 사람·에이전트 실행 유도
  summary: |-
    - 공격자는 AI가 만든 미끼 페이지·링크로 사람 또는 컴퓨터 사용 에이전트가 악성 명령을 실행하도록 유도할 수 있음
    - 사람과 AI 에이전트를 함께 속이는 신규 경로라 기존 사용자 교육만으로는 막기 어려움
  reference: |-
    ■ 관점
    - 대상: 사용자·컴퓨터 사용 에이전트(AML.T0100·AML.T0131·AML.T0011.003 — 미끼·크래프트 링크로 사용자 실행 T1204·T1204.001 유도)
    - 왜 어려운가: 에이전트가 미끼를 자동 실행할 수 있어 사람 판단 단계가 생략됨(신규형)
    - 연계: 방어자 AI 관점의 AI 생성 미끼·사칭(AI-01-08)
    - 참고: Embrace The Red 〈AI ClickFix〉
    ■ 실제 사례
    - [실제 사고] Contagious Interview — 가짜 채용 과제로 개발자 감염(AI 복제 앱·콘텐츠 병행)(2023-11): AI로 화상회의 앱을 복제하고 콘텐츠를 생성해 실행을 유도 (AII-012)
    - [실증] AI ClickFix — 컴퓨터 사용 에이전트 탈취 실증(2025-05): 미끼 페이지의 클릭으로 에이전트가 터미널에서 명령을 실행하도록 유도할 수 있음을 시연 (AII-025)
  detect: |-
    ■ 탐지
    - 에이전트·사용자의 미끼 실행 흐름(클립보드→터미널 등)과 의심 링크 접근을 행위 기반으로 탐지(NIST SI-4)
    ■ 대응
    - 컴퓨터 사용 에이전트의 실행 권한·승인 경계를 두고 미끼 유형을 교육(NIST AT-2(3)·SI-4)
    - 참고: Embrace The Red 〈AI ClickFix〉
