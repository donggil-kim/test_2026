# [VE] 취약점 발굴·익스플로잇 생성 — AI 활용 공격 관점 문구 (가드레일 D11: 방어 자료, 공세 제작법 미기재)

AIA-VE-01.1:
  oneline: AI 에이전트의 자율 취약점 발굴(미공개 취약점 자동 탐색)
  summary: |-
    - 공격자는 자율 AI 에이전트로 사람 개입 없이 미공개 취약점을 찾아내 대규모 표적에서 0-day를 양산할 수 있음
    - 같은 역량이 방어에도 쓰이지만, 공격자가 선점하면 패치 전 노출 구간에서 광범위한 악용으로 이어질 수 있음
  reference: |-
    ■ 관점
    - 대상: 소스·바이너리의 미공개 취약점(AML.T0001·AML.T0116·AML.T0117 — 자율 정찰·공격 경로 적응을 취약점 발굴에 적용)
    - 왜 어려운가: 발굴이 자동·대규모로 이뤄져 방어자가 패치 속도로 따라가기 어려움(완전자율·신규형)
    - 연계: 방어자 AI 관점의 자율 공격(AI-01-02)
    - 참고: The Record 〈Big Sleep〉 · AppSecSanta 〈AI Pentesting Agents 2026〉
    ■ 실제 사례
    - [실증] Big Sleep — AI 에이전트의 실악용 임박 취약점 사전 발견(2025-07): AI 에이전트가 공격자가 곧 악용하려던 취약점을 사전에 찾아냄(방어 연구지만 자율 발굴 역량이 실사용 수준임을 보임) (AII-028)
    - [실증] XBOW 등 자율 펜테스트 에이전트의 취약점 대량 발견(2026-04): 자율 에이전트가 고위험 취약점을 다수 제출 (AII-029)
  detect: |-
    ■ 탐지
    - 자사 자산에 대한 자동·대규모 취약점 탐색 정황과 비정상 접근 패턴을 모니터링(NIST RA-5)
    ■ 대응
    - 자체 AI 보조 취약점 발굴·퍼징으로 공격자보다 먼저 찾고(NIST SA-11), 신속 패치·무결성 검증으로 노출 구간을 좁힘(NIST SI-7·RA-5)
    - 참고: The Record 〈Big Sleep〉 · AppSecSanta 〈AI Pentesting Agents 2026〉

AIA-VE-01.2:
  oneline: AI 보조 코드 감사·퍼징으로 취약점 발견 속도 증폭
  summary: |-
    - 공격자는 AI로 코드 리뷰·퍼징을 가속해 취약점 발견 속도를 높일 수 있음
    - 방어·공격 양용이라 단독 피해보다 발굴 단계를 증폭하며, 공급망 구성요소까지 넓게 겨냥될 수 있음
  reference: |-
    ■ 관점
    - 대상: 소스·의존성의 취약점(AML.T0001·AML.T0004 — 기존 익스플로잇 확보 T1588.005를 AI가 가속)
    - 왜 어려운가: 발견 속도가 빨라져 공개~악용 간격이 짧아짐(증강·증폭형)
    - 연계: 방어자 AI 관점의 자율 공격(AI-01-02), 공급망 취약 구성요소(SC-DP-04)
    - 참고: AppSecSanta 〈AI Pentesting Agents 2026〉
    ■ 실제 사례
    - [실증] XBOW 등 자율 펜테스트 에이전트의 취약점 대량 발견(2026-04): AI 펜테스트 에이전트가 코드 감사·퍼징으로 다수 취약점을 발견 (AII-029)
  detect: |-
    ■ 탐지
    - 의존성·자체 코드의 신규 취약점 공개와 악용 정황을 신속 대조(NIST RA-5)
    ■ 대응
    - 개발 단계에 AI 보조 테스트를 통합해 선제 발견하고(NIST SA-11·SA-15), 취약 구성요소를 신속 교체(NIST RA-5)
    - 참고: AppSecSanta 〈AI Pentesting Agents 2026〉

AIA-VE-02:
  oneline: AI 익스플로잇 자동 생성으로 익스플로잇 개발 병목 제거
  summary: |-
    - 공격자는 AI로 익스플로잇을 자동 생성·개발해, 공개 취약점을 사람 개입 없이 빠르게 무기화할 수 있음
    - 익스플로잇 개발 병목이 사라지면 공개 취약점이 즉시 악용돼 패치 전 노출 위험이 커짐
  reference: |-
    ■ 관점
    - 대상: 공개·미공개 취약점의 익스플로잇(AML.T0017.001·AML.T0016.003 — 기존 익스플로잇 개발·확보 T1587.004·T1588.005를 AI가 자동화)
    - 왜 어려운가: 개발 자동화로 무기화 속도가 급등하고 변형이 쉬움(반자율·신규형)
    - 연계: 방어자 AI 관점의 자율 공격(AI-01-02)
    - 참고: securityonline 〈GTIG AI 0-day〉
    ■ 실제 사례
    - [위협인텔] AI로 개발한 것으로 판단되는 0-day 익스플로잇 실사용(GTIG 보고)(2026-05): 위협 행위자가 AI로 개발한 것으로 판단되는 0-day 익스플로잇을 사용한 첫 사례 (AII-030)
  detect: |-
    ■ 탐지
    - 공개 직후 집중되는 익스플로잇 시도와 알려진 취약점의 비정상 악용을 모니터링(NIST RA-5)
    ■ 대응
    - 신속 패치·가상 패치와 무결성 검증으로 즉시 무기화에 대응하고(NIST SI-7), 자체 익스플로잇 가능성 평가로 우선순위화(NIST SA-11·RA-5)
    - 참고: securityonline 〈GTIG AI 0-day〉

AIA-VE-03.1:
  oneline: AI 생성·AI 연동 악성코드로 변종 양산·탐지 회피
  summary: |-
    - 공격자는 생성형 AI로 악성코드를 개발·변형해 시그니처 기반 탐지를 빠르게 무력화할 수 있음
    - 변종 양산이 쉬워져 정적 분석·시그니처가 따라가기 어렵고, 금전·첩보 목적에 두루 쓰임
  reference: |-
    ■ 관점
    - 대상: AI로 생성·변형된 악성코드와 실행 명령(AML.T0016.002·AML.T0102 — 기존 악성코드 개발 T1587.001·난독화 T1027을 AI가 가속)
    - 왜 어려운가: 매 변종이 달라 시그니처가 무력화되고 생성이 자동화됨(증폭형)
    - 연계: 방어자 AI 관점의 AI 연동 악성코드(AI-01-06)
    - 참고: securityonline 〈GTIG AI 0-day〉
    ■ 실제 사례
    - [실제 사고] LAMEHUG: 실행 중 AI 명령을 동적 생성하는 악성코드(APT28)(2025-07): LLM API로 명령을 동적 생성하는 악성코드 (AII-007)
    - [실제 사고] BREEZE COMET — 생성형 AI를 악성코드 개발에 활용한 브라질 금융 공격(2026-09): 금전 목적 행위자가 생성형 AI를 악성코드 개발에 활용한 증거 (AII-024)
  detect: |-
    ■ 탐지
    - 시그니처가 아닌 행위·맥락 기반으로 변종 악성코드를 탐지하고 무결성 변화를 감시(NIST SI-3·SI-4·SI-7)
    ■ 대응
    - 행위 기반 EDR·실행 통제로 변종에 대응하고(NIST SI-3), 무결성 검증으로 변조를 차단(NIST SI-7)
    - 참고: securityonline 〈GTIG AI 0-day〉

AIA-VE-03.2:
  oneline: AI 생성 와이퍼·파괴 스크립트로 맞춤 파괴·복구 방해
  summary: |-
    - 공격자는 LLM으로 와이퍼·파괴 스크립트를 맞춤 생성·변형해 파괴형 공격을 빠르게 전개할 수 있음
    - 맞춤 생성으로 탐지·복구가 어려워지고, 기반시설 대상 시 운영·안전에 큰 피해가 날 수 있음
  reference: |-
    ■ 관점
    - 대상: AI로 생성된 와이퍼·파괴 스크립트(AML.T0016.002·AML.T0102 — 기존 데이터 파괴 T1485·디스크 와이프 T1561를 AI가 맞춤 생성)
    - 왜 어려운가: 맞춤·변형 생성으로 시그니처·사전 차단이 어렵고 복구를 방해(증폭형)
    - 연계: 방어자 AI 관점의 AI 연동 악성코드(AI-01-06), OT 데이터 파괴(OT-IR-01)
    - 참고: CERT Polska 〈Energy Report 2025〉
    ■ 실제 사례
    - [실제 사고] 2025 폴란드 에너지 시설 와이퍼 공격(LLM 생성 스크립트)(2026-01): 국가배후 와이퍼 공격에서 파괴 스크립트가 LLM으로 생성된 것으로 평가 (AII-006)
  detect: |-
    ■ 탐지
    - 대량 파일 변경·삭제와 파괴형 실행 행위를 조기 탐지하고 백업 무결성을 감시(NIST SI-3·SI-7)
    ■ 대응
    - 행위 기반 탐지·실행 통제와 오프라인·불변 백업으로 복구력을 확보(NIST SI-7·CP-9)
    - 참고: CERT Polska 〈Energy Report 2025〉
