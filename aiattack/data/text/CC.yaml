# [CC] 은닉·명령제어 — AI 활용 공격 관점 문구 (가드레일 D11: 방어 자료, 공세 제작법 미기재)

AIA-CC-01:
  oneline: 정상 AI 서비스 트래픽에 숨긴 은닉 C2로 경계 통제 회피
  summary: |-
    - 공격자는 정상 AI 서비스의 API·웹 인터페이스에 C2를 숨겨 데이터 반출·명령 수신의 양방향 채널을 만들 수 있음
    - 정상 서비스 트래픽이라 경계·egress 통제가 걸러내기 어려워 탐지가 지연됨
  reference: |-
    ■ 관점
    - 대상: AI 서비스 API·웹 인터페이스 채널(AML.T0096·AML.T0114·AML.T0108 — 응용 계층 프로토콜 T1071·웹 서비스 T1102 경유 C2), 악용되는 제3자 AI(LLM06)
    - 왜 어려운가: 신뢰된 AI 서비스 도메인·트래픽에 숨어 차단·식별이 어려움(신규형)
    - 연계: 방어자 AI 관점의 AI 서비스 경유 은닉 C2(AI-01-09)
    - 참고: Check Point 〈AI in the Middle〉
    ■ 실제 사례
    - [실제 사고] LAMEHUG: 실행 중 AI 명령을 동적 생성하는 악성코드(APT28)(2025-07): AI API를 은닉 통신·명령 생성에 사용 (AII-007)
    - [실증] AI in the Middle — 웹 AI 서비스를 C2 중계로 악용 실증(2026-02): 정상 AI 웹 서비스로 양방향 C2 채널을 만드는 기법을 실증 (AII-026)
  detect: |-
    ■ 탐지
    - AI 서비스로의 비정상 egress 패턴·데이터량과 자동화된 세션을 모니터링(NIST SC-7·SI-4·AU-6)
    ■ 대응
    - AI 서비스 egress 가시성·허용 목록으로 비인가 AI 트래픽을 통제(NIST SC-7)
    - 참고: Check Point 〈AI in the Middle〉

AIA-CC-02:
  oneline: 실행 중 LLM 질의로 명령을 매번 생성해 시그니처 탐지 무력화
  summary: |-
    - 공격자는 악성코드가 실행 중 LLM API에 질의해 명령을 매번 새로 생성하게 만들 수 있음
    - 고정 페이로드·시그니처가 없어 정적 분석·시그니처 탐지가 무력화됨
  reference: |-
    ■ 관점
    - 대상: 실행 중 동적 생성되는 명령(AML.T0102·AML.T0096 — 명령 실행 T1059·응용 계층 프로토콜 T1071 경유 질의)
    - 왜 어려운가: 페이로드가 매번 달라 정적·시그니처 탐지가 무력화됨(반자율·신규형)
    - 연계: 방어자 AI 관점의 AI 연동 악성코드(AI-01-06)
    - 참고: The Hacker News 〈LAMEHUG〉
    ■ 실제 사례
    - [실제 사고] LAMEHUG: 실행 중 AI 명령을 동적 생성하는 악성코드(APT28)(2025-07): LLM API 질의로 시스템 정보 수집·문서 검색 명령을 실행 중 동적 생성 (AII-007)
  detect: |-
    ■ 탐지
    - LLM API로의 비정상 egress와 동적 생성 명령 실행을 행위·맥락 기반으로 탐지(NIST SI-3·SI-4·AU-6)
    ■ 대응
    - AI 서비스 egress 통제와 행위 기반 실행 탐지로 동적 명령 생성에 대응(NIST SI-3·SI-4)
    - 참고: The Hacker News 〈LAMEHUG〉

AIA-CC-03:
  oneline: AI로 페이로드 자동 변형·적대적 입력으로 ML 탐지 회피
  summary: |-
    - 공격자는 AI로 페이로드를 자동 변형·난독화하거나 적대적 입력으로 ML 기반 탐지기를 회피할 수 있음
    - 시그니처·정적 탐지를 체계적으로 우회하지만 행위 기반 탐지로 일부 포착이 가능함
  reference: |-
    ■ 관점
    - 대상: 탐지 모델과 정적 분석(AML.T0015·AML.T0043·AML.T0123·AML.T0097 — 모델 회피·적대적 입력·난독화 T1027·샌드박스 회피 T1497)
    - 왜 어려운가: 변형·적대적 입력이 자동화돼 시그니처·ML 탐지를 지속 우회(증폭형)
    - 연계: 방어자 AI 관점의 적대적 입력 판단 회피(AI-04-04)
    - 참고: HiddenLayer 〈2026 AI Threat Landscape〉
    ■ 실제 사례
    - [위협인텔] 실행 중 LLM을 호출해 스스로 코드를 고치는 악성코드(GTIG PROMPTFLUX 등)(2025-11): Gemini로 주기적 자기 재작성해 시그니처 탐지를 회피(초기 단계) (AII-036)
  detect: |-
    ■ 탐지
    - 행위·맥락 기반 탐지와 다중 엔진·이상 탐지로 변형·적대적 회피를 보완 탐지(NIST SI-3·SI-4)
    ■ 대응
    - 시그니처 의존을 줄이고 행위 기반·무결성 검증을 강화, 탐지 모델에 적대적 견고성을 반영(NIST SI-4·SI-7)
    - 참고: HiddenLayer 〈2026 AI Threat Landscape〉

AIA-CC-04:
  oneline: AI 코딩 도구 규칙·설정에 숨은 지시 주입으로 은닉 백도어
  summary: |-
    - 공격자는 규칙 파일에 보이지 않는 유니코드로 지시를 숨겨 AI가 생성 코드에 백도어를 넣게 하거나 에이전트에 파괴 지시를 주입할 수 있음
    - 사람 리뷰가 알아채기 어려운 은닉 경로라 공급망을 통해 널리 퍼질 수 있음
  reference: |-
    ■ 관점
    - 대상: AI 코딩 도구의 규칙·설정 파일(AML.T0081·AML.T0110·AML.T0011.002 — 설정 변조·에이전트 도구 오염, 공급망 침해 T1195), 프롬프트 인젝션(LLM01)
    - 왜 어려운가: 숨은 유니코드·설정이 사람 리뷰·PR에서 보이지 않고 공개 저장소로 확산(신규형)
    - 연계: 방어자 AI 관점의 AI 코딩 도구 오염(AI-08-05), 공급망 IDE·개발 도구 오염(SC-DE-02)
    - 참고: Pillar Security 〈Rules File Backdoor〉
    ■ 실제 사례
    - [실제 사고] Amazon Q Developer 확장에 삭제 지시 주입(2025-07): AI 코딩 에이전트에 파괴 지시 프롬프트가 설정 경로로 주입 (AII-003)
    - [실증] Rules File Backdoor — AI 코딩 도구 규칙 파일에 숨은 지시(2025-03): 보이지 않는 유니코드로 규칙 파일에 지시를 숨겨 생성 코드에 백도어를 넣게 함 (AII-014)
  detect: |-
    ■ 탐지
    - 규칙·설정 파일의 비가시 문자·숨은 지시와 생성 코드의 의심 변경을 검사(NIST SI-7·SA-15)
    ■ 대응
    - 규칙·설정 파일을 변경 통제·리뷰 대상에 포함하고 비가시 문자를 정규화·차단(NIST SA-15·CM-7)
    - 참고: Pillar Security 〈Rules File Backdoor〉
