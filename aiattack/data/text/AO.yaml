# [AO] 자율 실행·확산 — AI 활용 공격 관점 문구 (가드레일 D11: 방어 자료, 공세 제작법 미기재)

AIA-AO-01:
  oneline: 단일 자율 에이전트가 정찰~실행을 사람 속도 밖에서 수행
  summary: |-
    - 공격자는 탈옥 모델·공격 프레임워크로 하나의 자율 에이전트가 정찰부터 실행까지 대부분을 스스로 수행하게 할 수 있음
    - 사람이 대응하기 어려운 속도·규모로 다수 조직을 동시에 침해해 피해 범위를 가늠하기 어려움
  reference: |-
    ■ 관점
    - 대상: 다수 표적의 침투 전 과정(AML.T0116·AML.T0117·AML.T0050 — 자율 정찰·경로 적응·명령 실행 T1059), 악용되는 제3자 AI 에이전트(ASI-T01)
    - 왜 어려운가: 자율 반복으로 공격 속도가 사람 대응 주기를 앞지르고 다수 표적을 병렬 처리(완전자율·신규형)
    - 연계: 방어자 AI 관점의 자율·다중 에이전트 공격(AI-01-05)
    - 참고: Anthropic 〈GTG-1002〉 · Unit 42 〈Hermes Agent〉 · CrowdStrike 〈Agentic AI Campaigns〉
    ■ 실제 사례
    - [실제 사고] GTG-1002 — Claude Code를 악용한 자율 사이버 첩보 캠페인(2025-11): 약 30개 조직을 표적해 공격의 80~90%를 AI가 수행 (AII-008)
    - [실제 사고] AI 에이전트 침투로 아르헨티나 의료기관 15곳 이상 침해(CrowdStrike 행위자 1)(2026-10): 작업 선택·실행 2개 에이전트 하네스로 침투·반출 (AII-031)
    - [실제 사고] 거의 전권을 위임한 AI 에이전트로 CRM 업체 고객 데이터 반출(CrowdStrike 행위자 4)(2026-10): 사람 개입 최소화 자율 실행이 데이터 유출로 이어짐 (AII-034)
  detect: |-
    ■ 탐지
    - 사람 속도를 넘는 반복·연쇄 행위 시퀀스와 비정상 세션 속도를 행위 기반으로 탐지(NIST SI-4·AU-6)
    - 전 단계를 가로지르는 상관 이벤트를 지속 모니터링(NIST CA-7)
    ■ 대응
    - AI 속도 공격을 전제한 탐지·대응 자동화와 대응 속도 단축, AI 제공자 오남용 탐지 연계(NIST SI-4)
    - 지속 모니터링·사후 감사로 자율 공격 흔적을 추적(NIST AU-6·CA-7)
    - 참고: Anthropic 〈GTG-1002〉 · CrowdStrike 〈Agentic AI Campaigns〉

AIA-AO-02:
  oneline: 상위 오케스트레이터가 다중 하위 에이전트로 공격 웨이브 병렬화
  summary: |-
    - 공격자는 상위 오케스트레이터가 다수 하위 에이전트를 조율해 공격 웨이브를 병렬 수행하게 할 수 있음
    - 공격 규모가 사람 조직의 한계를 벗어나 넓은 표적을 짧은 시간에 침해함
  reference: |-
    ■ 관점
    - 대상: 병렬 공격 웨이브와 표적 집합(AML.T0118·AML.T0118.000·AML.T0118.001·AML.T0124 — 자율 에이전트 간 통신·조율), 악용되는 제3자 AI 에이전트(ASI-T01)
    - 왜 어려운가: 다중 에이전트 병렬 실행으로 규모·속도가 폭증(완전자율·신규형)
    - 연계: 방어자 AI 관점의 자율·다중 에이전트 공격(AI-01-05)
    - 참고: Dream Research 〈Multi-Agent Framework〉 · Anthropic 〈GTG-1002〉
    ■ 실제 사례
    - [실제 사고] 다중 에이전트 프레임워크의 대만 정부 시스템 침해(2026-08): 웨이브당 다수 하위 에이전트를 돌려 2,564건 이상의 인사 기록에 접근 (AII-009)
    - [실제 사고] GTG-1002 — Claude Code를 악용한 자율 사이버 첩보 캠페인(2025-11): 하위 에이전트를 조율한 공격 프레임워크 (AII-008)
  detect: |-
    ■ 탐지
    - 동시다발 표적에 걸친 유사 패턴·상관 이벤트와 병렬 세션 급증을 탐지(NIST SI-4·CA-7)
    ■ 대응
    - 교차 표적 상관 분석과 대응 자동화로 병렬 웨이브에 대응하고 사후 감사로 조율 구조를 추적(NIST SI-4·AU-6)
    - 참고: Dream Research 〈Multi-Agent Framework〉 · Anthropic 〈GTG-1002〉

AIA-AO-03.1:
  oneline: 피해 단말에 설치된 AI CLI를 공격 실행 엔진으로 악용
  summary: |-
    - 공격자는 피해 단말에 정상 설치된 AI CLI를 위험 옵션으로 실행해 비밀 탐색·반출에 악용할 수 있음
    - 정상 도구가 공격 실행 엔진이 되어 신뢰된 바이너리라 기존 탐지가 걸러내기 어려움
  reference: |-
    ■ 관점
    - 대상: 피해 단말의 로컬 AI 에이전트·CLI(AML.T0112.000·AML.T0053·AML.T0101 — AI 도구 호출로 명령 실행 T1059), 과도한 에이전시 악용(LLM06)
    - 왜 어려운가: 서명된 정상 도구를 쓰므로 시그니처·화이트리스트로 구분이 어려움(반자율·신규형)
    - 연계: 로컬 AI 에이전트·확장 장악(AI-09-05), 공급망 개발자 단말 침해(SC-DE-01)
    - 참고: Wiz 〈s1ngularity〉
    ■ 실제 사례
    - [실제 사고] s1ngularity — Nx 빌드 도구 악성 버전과 피해 단말 AI CLI 악용(2025-08): 설치된 AI CLI를 위험 옵션으로 실행해 비밀을 찾게 하고 비공개 저장소 5,500개 이상이 공개로 전환 (AII-004)
    - [실제 사고] s1ngularity 노출 클라우드 키 악용 측면 이동(QUIETVAULT)(2026-03): 단말의 LLM 도구를 이용해 자격증명을 탐색 (AII-018)
  detect: |-
    ■ 탐지
    - AI CLI의 위험 옵션 실행·비정상 파일 탐색·외부 전송을 행위 기반으로 탐지(NIST SI-4)
    ■ 대응
    - AI 개발 도구의 실행 권한·위험 옵션을 최소 권한·허용 목록으로 제한(NIST AC-6·CM-7)
    - 참고: Wiz 〈s1ngularity〉

AIA-AO-03.2:
  oneline: AI 개발 도구의 광범위 실행 권한·신뢰를 공격 수행에 악용
  summary: |-
    - 공격자는 AI 코딩 에이전트의 폭넓은 실행 권한과 설정 신뢰를 악용해 공격 수행을 맡길 수 있음
    - AI 도구의 권한이 공격자 손에 들어가면 파괴·공급망 주입 같은 행위가 자동화됨
  reference: |-
    ■ 관점
    - 대상: AI 코딩 에이전트의 실행 권한·설정(AML.T0053·AML.T0081 — AI 도구 호출·설정 변조, 공급망 침해 T1195·명령 실행 T1059), 과도한 에이전시(LLM06)
    - 왜 어려운가: 정상 개발 워크플로 안에서 일어나 변조·악용 식별이 어려움(반자율·신규형)
    - 연계: 방어자 AI 관점의 생성 코드·도구 인자 실행(AI-06-04), 공급망 IDE·개발 도구 오염(SC-DE-02)
    - 참고: Ctrl-Alt-Intel 〈BuddyBoss〉
    ■ 실제 사례
    - [실제 사고] Amazon Q Developer 확장에 삭제 지시 주입(2025-07): AI 코딩 에이전트에 파괴 지시를 내리는 프롬프트가 배포 (AII-003)
    - [실제 사고] BuddyBoss 공급망 공격(Claude Code 세션 기록 확인)(2026-03): 복구된 세션 기록으로 공격 수행에 AI 코딩 에이전트를 직접 사용한 정황 확인 (AII-019)
  detect: |-
    ■ 탐지
    - AI 개발 도구의 비정상 설정 변경·과도한 권한 사용·공급망 산출물 변조를 탐지(NIST SI-4·SA-15)
    ■ 대응
    - AI 도구의 권한·승인 경계를 최소화하고 개발 파이프라인 변경을 검증(NIST AC-6·SA-15)
    - 참고: Ctrl-Alt-Intel 〈BuddyBoss〉

AIA-AO-04:
  oneline: 자율 에이전트가 CI/CD·워크플로 결함을 자동·대량 악용
  summary: |-
    - 공격자는 AI로 보이는 계정이 공개 저장소의 워크플로 결함을 자동 탐색·악용해 다수 저장소에서 코드 실행·토큰 탈취를 할 수 있음
    - 공급망 전반을 자동·대량으로 침해하고 탈취 자격증명이 연쇄 침해의 출발점이 됨
  reference: |-
    ■ 관점
    - 대상: CI/CD·워크플로와 빌드 파이프라인(AML.T0116·AML.T0119 — 자율 정찰·자동 산출물 처리 악용, 공급망 침해 T1195·T1195.002)
    - 왜 어려운가: 자동 탐색-악용이 대량·병렬로 일어나 개별 저장소 방어로는 막기 어려움(반자율·신규형)
    - 연계: 방어자 AI 관점의 악성 에이전트 도구 유통·AI 코딩 도구 오염(AI-08-05), 공급망 오염 파이프라인 실행(SC-BD-01)
    - 참고: StepSecurity 〈hackerbot-claw〉
    ■ 실제 사례
    - [실제 사고] hackerbot-claw — 자율 에이전트의 GitHub Actions 워크플로 대량 악용(2026-03): 공개 저장소의 워크플로 결함을 자동 탐색해 다수 저장소에서 코드 실행·토큰 탈취(자율 봇 여부는 추정) (AII-017)
    - [실제 사고] BuddyBoss 공급망 공격(Claude Code 세션 기록 확인)(2026-03): 악성 워크플로로 배포 파이프라인 침해 (AII-019)
    - [실제 사고] prt-scan — 취약 GitHub 워크플로 대상 기회주의 공급망 캠페인(2026-04): 다수 저장소에 자동 악성 PR을 보내 pull_request_target 악용(AI 생성 가능성 추정) (AII-020)
  detect: |-
    ■ 탐지
    - 워크플로에 대한 대량 자동 PR·비정상 실행과 토큰 사용을 탐지(NIST SI-4)
    ■ 대응
    - 워크플로 트리거·권한을 최소화하고(pull_request_target 등) 파이프라인 변경을 검증(NIST CM-7·SA-15)
    - 참고: StepSecurity 〈hackerbot-claw〉

AIA-AO-05:
  oneline: AI 가속 자격증명 탈취·측면 이동으로 클라우드 전반 급속 장악
  summary: |-
    - 공격자는 AI 보조로 자격증명 탈취·측면 이동을 가속해 개발 환경 침해에서 클라우드 전반 장악까지 짧은 시간에 이를 수 있음
    - 확산 속도가 사람 대응 주기를 앞질러 선제 차단이 어려움
  reference: |-
    ■ 관점
    - 대상: 노출·탈취 자격증명과 내부 자원(AML.T0055·AML.T0089·AML.T0075 — 유효 계정 T1078·원격 서비스 T1021·비보호 자격증명 T1552를 AI가 가속)
    - 왜 어려운가: 탐색-탈취-확산이 자동화돼 사람이 따라잡기 전에 권한이 확대됨(반자율·증폭형)
    - 연계: 방어자 AI 관점의 자율 공격(AI-01-05), 클라우드 메타데이터 경유 자격증명 탈취(CL-CA-06), 신원 단말 자격증명 탈취(ID-CR-01)
    - 참고: HiddenLayer 〈2026 AI Threat Landscape〉 · Sygnia 〈AI-Assisted Cloud Attack〉
    ■ 실제 사례
    - [실제 사고] 공개 S3 버킷 노출 자격증명 경유 LLMjacking·GPU 악용(2026-02): 노출 자격증명으로 초기 접근 후 측면 이동 (AII-016)
    - [실제 사고] s1ngularity 노출 클라우드 키 악용 측면 이동(QUIETVAULT)(2026-03): 노출 키로 72시간 안에 클라우드 전반 장악 (AII-018)
    - [실제 사고] AI 보조 클라우드 침입(Sygnia 익명 사례)(2026-06): AI 보조로 72시간 내 인프라 장악 (AII-022)
  detect: |-
    ■ 탐지
    - 자격증명의 비정상 사용·급속한 권한 확대·측면 이동을 아이덴티티·클라우드 로그로 탐지(NIST AC-2·SI-4)
    ■ 대응
    - 최소 권한·단기 자격증명·이상 접근 차단으로 확산 속도를 늦춤(NIST AC-2·AC-6)
    - 참고: Sygnia 〈AI-Assisted Cloud Attack〉
