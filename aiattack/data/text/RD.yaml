# [RD] 공격 역량 확보 — AI 활용 공격 관점 문구 (가드레일 D11: 방어 자료, 공세 제작법 미기재)

AIA-RD-01.1:
  oneline: 가드레일 없는 다크·탈옥 LLM 확보로 공세 역량 진입장벽 하락
  summary: |-
    - 공격자는 지하 시장에서 가드레일이 제거된 공세 특화·탈옥 LLM을 구해 역량이 낮아도 피싱·악성코드 제작에 접근할 수 있음
    - 도구 확보 단계라 단독 피해는 없지만, 공격자 저변이 넓어져 후속 단계 전반의 빈도를 끌어올림
  reference: |-
    ■ 관점
    - 대상: 공세 특화·탈옥 모델과 그 유통 경로(AML.T0016.002·AML.T0054)
    - 왜 어려운가: 거래·확보가 조직 밖에서 일어나 방어자가 직접 관측하기 어렵고, 역량 민주화로 공격량이 늘어남(신규형)
    - 연계: 방어자 AI 관점의 공격 도구·역량 확보(AI-01-03)
    - 참고: HiddenLayer 〈2026 AI Threat Landscape〉
    ■ 실제 사례
    - 공개 사고 미확인 — 역량 확보 단계라 단독 피해 사고로 드러나지 않음(지하 시장 유통은 위협 보고로 관측). AI 역량 성숙도는 '실사용'(공세 LLM이 실제 공격에 쓰임)
  detect: |-
    ■ 탐지
    - 지하 시장·공세 LLM 동향을 위협 인텔로 수집하고 자사 대상 악용 징후를 모니터링(NIST PM-16·SI-4)
    ■ 대응
    - 공세 LLM이 만들어내는 산출물(피싱·악성코드)의 탐지·대응 역량을 강화해 역량 확보 자체보다 '사용 시점'을 막음(NIST SI-4)
    - 참고: HiddenLayer 〈2026 AI Threat Landscape〉

AIA-RD-01.2:
  oneline: 증류·파인튜닝으로 가드레일 제거한 공세 모델 확보 정황
  summary: |-
    - 공격자는 상용 모델을 증류·파인튜닝해 안전장치를 약화시킨 공세 모델을 만들려 시도할 수 있음
    - 아직 연구·시연 수준이라 직접 피해는 제한적이나, 성공 시 탐지가 어려운 전용 역량이 됨
  reference: |-
    ■ 관점
    - 대상: 상용·공개 모델을 변형한 공세 파생 모델(AML.T0016.002·AML.T0005)
    - 왜 어려운가: 변형·학습이 공격자 환경에서 이뤄져 방어자 가시성이 낮음(신규형)
    - 연계: 방어자 AI 관점의 공격 도구·역량 확보(AI-01-03)
    - 참고: HiddenLayer 〈2026 AI Threat Landscape〉
    ■ 실제 사례
    - 공개 사고 미확인 — 연구·개념 증명 수준으로만 제시됨. AI 역량 성숙도는 '연구시연'
  detect: |-
    ■ 탐지
    - 모델 가중치·데이터 유출과 비정상 대량 질의(증류 정황)를 자사 AI 자산에서 모니터링(NIST PM-16)
    ■ 대응
    - 자사 모델·데이터의 유출·추출을 통제해 공세 파생 모델의 재료가 되지 않게 함(NIST PM-16)
    - 참고: HiddenLayer 〈2026 AI Threat Landscape〉

AIA-RD-02:
  oneline: AI로 스캐너·셸 명령·탐침을 즉석 생성해 공격 준비 단축
  summary: |-
    - 공격자는 AI로 스캐너·셸 명령·HTTP 탐침 같은 도구·스크립트를 즉석에서 생성해 공격 준비 시간을 줄일 수 있음
    - 단독 피해는 없으나 침투·실행 단계를 가속해 전체 공격 속도를 높임
  reference: |-
    ■ 관점
    - 대상: 공격용 스크립트·셸 명령·탐침(AML.T0016.002·AML.T0017·AML.T0102 — 기존 역량 개발 T1587·도구 확보 T1588.002를 AI가 가속)
    - 왜 어려운가: 매번 새로 생성돼 고정 산출물·시그니처가 없고 준비 단계가 짧아짐(증폭형)
    - 연계: 방어자 AI 관점의 공격 도구·역량 확보(AI-01-03)
    - 참고: Unit 42 〈Hermes Agent〉
    ■ 실제 사례
    - [실제 사고] GTG-2002 'vibe hacking'(2025-08): AI 코딩 에이전트로 공격 도구·스크립트를 생성하며 침투를 수행(Anthropic) (AII-038)
  detect: |-
    ■ 탐지
    - 실행 단계에서 생성형 도구의 산출물(비정형 스크립트·명령)을 행위 기반으로 탐지(NIST SI-3·SI-4)
    ■ 대응
    - 시그니처가 아닌 행위·맥락 기반 탐지로 매번 달라지는 산출물에 대응하고 최소 권한을 적용(NIST SI-4·PM-16)
    - 참고: Unit 42 〈Hermes Agent〉

AIA-RD-03:
  oneline: 탈취 계정·서버리스로 AI 서비스 익명 경유 공격 인프라 확보
  summary: |-
    - 공격자는 탈취·중계 계정이나 서버리스로 AI 서비스를 익명 경유하는 공격 인프라를 세워 출처·비용을 숨길 수 있음
    - 정상 서비스·인프라를 경유해 경계 통제가 걸러내기 어렵고, 후속 C2·대량 공격의 기반이 됨
  reference: |-
    ■ 관점
    - 대상: AI 서비스 프록시·서버리스·탈취 인프라(AML.T0008·AML.T0008.005·AML.T0128 — 기존 인프라 확보 T1583·T1584·T1583.007)
    - 왜 어려운가: 정상 서비스·클라우드를 경유해 출처 식별과 egress 통제가 어려움(증폭형)
    - 연계: 외부 노출 AI 서비스(AI-09-03), 클라우드 공격 인프라 확보(CL-RD-01)
    - 참고: HiddenLayer 〈2026 AI Threat Landscape〉
    ■ 실제 사례
    - 공개 사고 미확인 — 인프라 확보 단계라 단독 사고로 드러나지 않음. AI 역량 성숙도는 '실증'
  detect: |-
    ■ 탐지
    - AI 서비스·클라우드로의 비정상 egress와 신규·일회성 계정·도메인 사용을 모니터링(NIST SC-7·SI-4)
    ■ 대응
    - AI 서비스 egress 가시성을 확보하고 비인가 AI 트래픽·신규 인프라 접속을 통제(NIST SC-7)
    - 참고: HiddenLayer 〈2026 AI Threat Landscape〉

AIA-RD-04:
  oneline: 스캐너·도구를 엮은 공세 AI 에이전트·공격 하네스 구축
  summary: |-
    - 공격자는 스캐너·브라우저 자동화·침투 도구를 MCP 등으로 엮은 공격 프레임워크나 탈옥 모델 기반 자율 하네스를 구축할 수 있음
    - 한 번 만들면 사람 감독을 최소화한 반복·대규모 공격의 토대가 되어 피해 범위를 가늠하기 어려움
  reference: |-
    ■ 관점
    - 대상: 공세 에이전트·공격 오케스트레이션 하네스(AML.T0017.002·AML.T0103·AML.T0124), 악용되는 제3자 AI 에이전트(ASI-T01)
    - 왜 어려운가: 자율 반복·조율로 공격 속도·규모가 사람 조직 한계를 넘어섬(신규형)
    - 연계: 방어자 AI 관점의 자율·다중 에이전트 공격(AI-01-05)
    - 참고: Anthropic 〈GTG-1002〉 · CrowdStrike 〈Agentic AI Campaigns〉
    ■ 실제 사례
    - [실제 사고] GTG-1002 — Claude Code를 악용한 자율 사이버 첩보 캠페인(2025-11): 스캐너·브라우저 자동화·침투 도구를 연결한 공격 프레임워크로 약 30개 조직을 표적 (AII-008)
    - [실제 사고] DeepSeek 기반 Hermes 에이전트의 Langflow·n8n 자율 공격 시도(2026-07): 탈옥 모델을 자율 공세 운영자로 삼은 하네스 (AII-027)
  detect: |-
    ■ 탐지
    - AI 에이전트 특유의 빠른·반복적 행위 시퀀스와 도구 연쇄 호출을 행위 기반으로 탐지(NIST SI-4·PM-16)
    ■ 대응
    - AI 속도 공격을 전제한 탐지·대응 자동화와 AI 제공자 오남용 탐지 연계, 공격 하네스 구성 요소 차단(NIST SI-4·SA-11)
    - 참고: Anthropic 〈GTG-1002〉 · CrowdStrike 〈Agentic AI Campaigns〉
