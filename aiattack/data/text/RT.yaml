# [RT] 정찰·표적 분석 — AI 활용 공격 관점 문구
# 작성 규칙(가드레일 D11): 방어 자료 — 무엇이 위험하고·어떻게 탐지하고·무엇으로 막는가 중심.
#   공세 AI 제작법·악용 절차는 적지 않고 역량의 존재·영향·탐지 단서까지만 식별 수준으로 서술.
#   oneline 50자 이내 명사형 · summary 2줄(① 공격자는 …할 수 있음 ② 피해·탐지 곤란 사유) ·
#   reference(■ 관점 / ■ 실제 사례) · detect(■ 탐지 / ■ 대응). 사례는 그 행에 매핑된 사고만, 수치는 사고 요약에 있는 것만.

AIA-RT-01.1:
  oneline: AI로 공개정보를 대규모 수집·요약해 핵심 인력·약점 표적화
  summary: |-
    - 공격자는 LLM으로 업무용 SNS·논문·코드 저장소·보도자료를 대량 수집·요약해 핵심 인력과 그 관계·약점을 빠르게 추려낼 수 있음
    - 열람 자체는 합법이라 막기 어렵고, AI가 사람보다 빠르게 표적 명단을 만들어 후속 사회공학·침투의 발판이 됨
  reference: |-
    ■ 관점
    - 대상: 핵심 인력의 경력·관계·공개 발언, 조직 구조, 노출된 기술 정보(AML.T0087·AML.T0095·AML.T0000·AML.T0003 — 기존 정찰 T1589·T1591·T1593·T1594를 AI가 가속)
    - 왜 어려운가: 정상 공개정보 조회와 구별이 어렵고, AI가 수집·요약·상관분석을 자동화해 규모·속도가 사람 수작업을 넘어섬(증폭형)
    - 연계: 방어자 AI 관점의 공격 준비(AI-01-01), 물리·인적 공개정보 표적 선정(PH-RC-01)
    - 참고: HiddenLayer 〈2026 AI Threat Landscape〉
    ■ 실제 사례
    - 공개 사고 미확인 — 정찰·표적 분석은 단독 공개 사고로 드러나지 않음(후속 침투 사고의 준비 단계로만 보고됨). AI 역량 성숙도는 '실사용'(공격자 AI 정찰 활용이 위협 보고에서 반복 관측)
  detect: |-
    ■ 탐지
    - 자사·임직원 대상 공개정보 노출과 비정상 수집 정황(대량 조회·스크레이핑)을 위협 인텔리전스로 점검(NIST PM-16·SI-4)
    - 특정 부서·인력에 몰리는 외부 접촉·채용 제안의 반복 출처를 식별
    ■ 대응
    - 핵심 인력·과제의 공개 노출 범위를 정하고 프로필·발표·채용 공고의 민감 정보를 최소화(NIST PM-16)
    - 공개정보가 AI 정찰·표적 선정에 쓰이는 방식과 의심 접근 신고 경로를 교육(NIST AT-2(3))
    - 참고: HiddenLayer 〈2026 AI Threat Landscape〉

AIA-RT-01.2:
  oneline: AI로 조직 구조·거래 관계를 엮어 사칭 시나리오·표적 우선순위 작성
  summary: |-
    - 공격자는 수집한 조직도·거래 관계·내부 용어를 AI로 상관분석해 설득력 있는 사칭 시나리오와 표적 우선순위를 만들 수 있음
    - 외부에서 보이는 관계만으로도 맥락이 재구성되어, 피해는 뒤따르는 사회공학·침투 단계에서 커짐
  reference: |-
    ■ 관점
    - 대상: 조직 구조·보고 체계, 공급·거래 관계, 공개된 업무 맥락(AML.T0003·AML.T0004·AML.T0089 — 기존 T1591·T1592를 AI가 가속)
    - 왜 어려운가: 개별 정보는 무해하나 AI가 엮으면 사칭·표적화에 쓰일 맥락이 되고, 수집-분석이 자동화되어 탐지 창이 짧음(증폭형)
    - 연계: 방어자 AI 관점의 공격 준비(AI-01-01)
    - 참고: HiddenLayer 〈2026 AI Threat Landscape〉
    ■ 실제 사례
    - 공개 사고 미확인 — 표적 분석은 침투 사고의 준비 단계로만 드러남. AI 역량 성숙도는 '실증'(관계 분석·사칭 시나리오 생성이 레드팀·위협 보고에서 확인)
  detect: |-
    ■ 탐지
    - 공개된 조직·거래 정보의 노출 범위와 사칭에 쓰일 수 있는 맥락을 주기적으로 점검(NIST PM-16·SI-4)
    - 경영진·재무·조달 등 고가치 역할에 대한 외부 정보 수집 정황을 모니터링
    ■ 대응
    - 조직 구조·거래 관계의 불필요한 공개를 줄이고 고위험 역할의 공개 노출을 관리(NIST PM-16)
    - 사칭 시나리오를 전제한 다채널 확인 절차를 고위험 승인에 적용(NIST SI-4)
    - 참고: HiddenLayer 〈2026 AI Threat Landscape〉

AIA-RT-02:
  oneline: AI 에이전트가 노출 자산·공격면을 자동 열거해 진입점 식별
  summary: |-
    - 공격자는 AI 에이전트로 인터넷 스캔·FOFA 조회를 자동화해 노출된 서비스·관리 인터페이스를 사람보다 빠르게 열거할 수 있음
    - 공격 가능 진입점 목록이 자동 생성돼 정찰-침투 간격이 짧아지고, 탐지·패치 전 선제 악용 위험이 커짐
  reference: |-
    ■ 관점
    - 대상: 외부 노출 서비스·관리 인터페이스·오설정 자산(AML.T0006·AML.T0116·AML.T0132 — 기존 스캔 T1595·T1596을 에이전트가 자율 수행)
    - 왜 어려운가: 자율 열거가 사람 속도를 넘어서고 정상 스캔 트래픽과 섞여 식별이 어려움(반자율·증폭형)
    - 연계: 방어자 AI 관점의 공격 준비(AI-01-01)
    - 참고: Unit 42 〈Hermes Agent〉
    ■ 실제 사례
    - [실제 사고] DeepSeek 기반 Hermes 에이전트의 Langflow·n8n 자율 공격 시도(2026-07): 에이전트가 FOFA로 노출 시스템을 스스로 열거하며 공격을 시도(접근 획득은 실패) (AII-027)
  detect: |-
    ■ 탐지
    - 외부 노출 자산을 지속 식별하고 비정상적으로 빠른 열거·탐침 패턴을 모니터링(NIST RA-5·SI-4)
    - 관리 인터페이스·디버그 엔드포인트의 외부 노출을 상시 점검
    ■ 대응
    - 공격면을 줄이고 관리 인터페이스를 경계 밖에 노출하지 않음(NIST SC-7)
    - 노출 자산 인벤토리와 신속 패치로 자율 열거-악용 간격을 좁힘(NIST RA-5)
    - 참고: Unit 42 〈Hermes Agent〉

AIA-RT-03:
  oneline: AI로 최신 CVE·공개 PoC를 자동 수집·분류해 악용 준비 가속
  summary: |-
    - 공격자는 AI로 공개 취약점 정보와 PoC를 자동 수집·분류해 공격에 쓸 형태로 빠르게 정리할 수 있음
    - 공개 즉시 악용되는 빠른 n-day를 가속해, 패치 전 노출 구간에서 피해 위험이 커짐
  reference: |-
    ■ 관점
    - 대상: 공개 취약점 분석·코드 저장소의 PoC(AML.T0001·AML.T0095.000 — 기존 익스플로잇 확보 T1588.005·T1596을 AI가 가속)
    - 왜 어려운가: 수집-선별-무기화가 자동화되어 공개~악용 간격이 짧아짐(증폭형)
    - 연계: 방어자 AI 관점의 공격 준비(AI-01-03)
    - 참고: Unit 42 〈Hermes Agent〉
    ■ 실제 사례
    - [실제 사고] DeepSeek 기반 Hermes 에이전트의 Langflow·n8n 자율 공격 시도(2026-07): 에이전트가 GitHub에서 최신 CVE PoC를 스스로 검색해 공격 흐름에 활용 (AII-027)
  detect: |-
    ■ 탐지
    - 자사 자산의 공개 취약점·PoC 공개 동향을 신속 수집해 노출 여부를 대조(NIST RA-5)
    - 공개 직후 집중되는 탐침·악용 시도를 모니터링
    ■ 대응
    - 공개 취약점의 신속 패치·완화를 우선순위화해 n-day 노출 구간을 좁힘(NIST RA-5)
    - 위협 인텔로 악용 가능성이 높은 취약점을 선별 대응(NIST PM-16)
    - 참고: Unit 42 〈Hermes Agent〉
