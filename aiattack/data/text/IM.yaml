# [IM] 영향·규모화 — AI 활용 공격 관점 문구 (가드레일 D11: 방어 자료, 공세 제작법 미기재)

AIA-IM-01:
  oneline: 딥페이크·AI 사칭으로 대규모 부정 송금 금전 사기 실현
  summary: |-
    - 공격자는 딥페이크·AI 사칭으로 승인권자를 속여 대규모 부정 송금을 성사시킬 수 있음
    - 한 번의 성공으로 조직에 큰 금전 피해가 발생함
  reference: |-
    ■ 관점
    - 대상: 송금·결제 승인 절차(AML.T0048·AML.T0048.000·AML.T0088 — 외부 피해·금전 피해, 딥페이크 생성)
    - 왜 어려운가: 사칭 품질이 높아 사람 검증이 뚫리고 피해가 즉시 금전으로 실현됨(증폭형)
    - 연계: 방어자 AI 관점의 AI 생성 사칭(AI-01-08), 신원 계정 장악 금전 사기(ID-IM-01)
    - 참고: CNN 〈홍콩 딥페이크 금융사기〉
    ■ 실제 사례
    - [실제 사고] Arup 딥페이크 화상회의 송금 사기(2024-02): 딥페이크 화상회의 지시로 약 2,560만 달러 부정 송금 (AII-002)
  detect: |-
    ■ 탐지
    - 고액·비정상 송금 요청과 사칭 징후를 결제·승인 흐름에서 모니터링(NIST IA-2)
    ■ 대응
    - 고액 송금에 다채널·사전 등록 경로 확인과 역할 분리·한도를 적용(NIST AT-2(3)·IA-2)
    - 참고: CNN 〈홍콩 딥페이크 금융사기〉

AIA-IM-02:
  oneline: 자율 에이전트의 자동 수집·반출로 대규모 데이터 유출
  summary: |-
    - 공격자는 침해 환경에서 자율 에이전트로 민감 데이터를 자동 수집·분류·반출해 대규모 유출을 빠르게 완료할 수 있음
    - 수집-반출이 자동화돼 사람 대응 전에 유출이 끝나 피해 범위가 커짐
  reference: |-
    ■ 관점
    - 대상: 침해 환경의 민감 데이터(AML.T0024·AML.T0025·AML.T0126 — 자동 수집 T1119·자동 반출 T1020·웹 서비스 반출 T1567)
    - 왜 어려운가: 수집·분류·반출을 AI가 수행해 유출 속도·규모가 급등(반자율·증폭형)
    - 연계: 방어자 AI 관점의 자율 공격(AI-01-05), 신원 계정 기반 대량 데이터 탈취(ID-IM-03)
    - 참고: Dream Research 〈Multi-Agent Framework〉
    ■ 실제 사례
    - [실제 사고] 다중 에이전트 프레임워크의 대만 정부 시스템 침해(2026-08): 자율 에이전트가 2,564건 이상의 인사 기록에 접근·수집 (AII-009)
    - [실제 사고] AI 보조 클라우드 침입(Sygnia 익명 사례)(2026-06): AI 보조로 데이터 접근·반출을 가속 (AII-022)
  detect: |-
    ■ 탐지
    - 대량·자동화된 데이터 접근·반출 패턴과 비정상 egress를 모니터링(NIST SI-4·AU-6·SC-7)
    ■ 대응
    - 데이터 접근 최소화·DLP·egress 통제로 자동 반출을 차단하고 조기 경보(NIST SC-7·SI-4)
    - 참고: Dream Research 〈Multi-Agent Framework〉

AIA-IM-04:
  oneline: AI로 공격당 비용을 낮춰 캠페인 대량·병렬 규모화
  summary: |-
    - 공격자는 AI로 공격당 비용을 낮춰 캠페인을 대량·병렬로 벌여 전체 공격량과 빈도를 끌어올릴 수 있음
    - 개별 피해보다 공격 생태계 전반의 규모·속도가 커지는 것이 핵심 위협임
  reference: |-
    ■ 관점
    - 대상: 캠페인 규모·빈도(AML.T0124·AML.T0048 — 자율 공격 조율·외부 피해 규모화)
    - 왜 어려운가: 공격 단가 하락으로 기회주의적 대량 캠페인이 늘어 방어 리소스를 분산시킴(증폭형)
    - 연계: 방어자 AI 관점의 자율·다중 에이전트 공격(AI-01-05)
    - 참고: CrowdStrike 〈Agentic AI Campaigns〉 · HiddenLayer 〈2026 AI Threat Landscape〉
    ■ 실제 사례
    - 공개 사고 미확인 — 규모화는 개별 사건이 아니라 공격 생태계 전반의 추세로 보고됨. AI 역량 성숙도는 '실사용'(공격당 비용 하락·대량 캠페인이 위협 인텔에서 반복 관측)
  detect: |-
    ■ 탐지
    - 캠페인 규모·빈도 증가와 교차 표적 상관 지표를 지속 모니터링(NIST SI-4·CA-7)
    ■ 대응
    - 탐지·대응 자동화로 대량 캠페인에 대응하고 위협 인텔로 우선순위화(NIST SI-4·PM-16)
    - 참고: CrowdStrike 〈Agentic AI Campaigns〉 · HiddenLayer 〈2026 AI Threat Landscape〉
