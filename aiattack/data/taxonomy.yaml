# AI 활용 공격 보안위협 매트릭스 — 분류 체계(원천)
#
# 관점(작업방향 2·3장): 공격자가 AI(LLM·에이전트·생성형·적대적 ML)를 '무기'로 삼아 취약점을 발굴·악용하고
#   침투·사회공학·악성코드·C2를 가속·자동화·대규모화하는 위협을 '공격자 킬체인'으로 정리한 렌즈 매트릭스.
#   기존 AI 매트릭스(v3.2)가 '우리 AI를 지키는' 관점이라면, 이 매트릭스는 '공격자의 AI가 (AI든 비-AI든) 대상을 치는' 관점.
#
# 구조: Lv1 도메인(공격자 킬체인 7단계) → Lv2 위협분류(AIA-<도메인>-NN) → Lv3 세부위협(AIA-<도메인>-NN.m)
#       하위 세부위협이 하나뿐인 위협분류는 Lv2 = Lv3 (ID에 '.m' 없음)
# ID는 고정 — 항목을 없애도 번호를 다시 매기거나 재사용하지 않음(폐지 시 retired 표시)
# 경계 규칙(작업방향 3.2·5장):
#   · AI 매트릭스(v3.2) = 방어자의 AI가 공격받는 관점 / 이 매트릭스 = 공격자의 AI가 대상을 치는 관점.
#   · AI 도구 자체가 오염·위장되는 공급망 위협(모델 허브·MCP·플러그인)은 여기가 아니라 AI 매트릭스 D08·공급망(연계만).
#   · 겹치는 위협은 재수록하지 않고 통합 v4.1 요약 ID(AI-·CL-·OT-·SC-·ID-·PH-)로 연계만 한다(작업방향 5장).
#   · 국가배후 여부는 행 속성이 아니라 사고 DB의 actor 필드로만 다룬다(행위자 축과 위협 축을 섞지 않음).
#
# Lv3 필드
#   name / en       세부위협명(국문) / 영문명
#   stage           킬체인 단계 — frameworks.yaml stages(정찰·역량확보·취약점발굴·초기침투·자율실행·은닉C2·영향)
#   ai_role         AI 역할·자율성 수준 — frameworks.yaml ai_roles(보조·증강·반자율·완전자율). '사람 속도로 대응 가능한가'를 가름
#   novelty         AI 고유성 — frameworks.yaml novelty(신규='AI로 새로 생긴 위협' · 증폭='기존 위협의 AI 증폭')
#   maturity        AI 역량 성숙도(발생가능성 보조 신호, D4) — frameworks.yaml maturity(실사용·실증·연구시연)
#   actors          주로 쓰는 위협 주체 유형 — frameworks.yaml actor_types(국가배후·사이버범죄·핵티비스트·연구·레드팀)
#   targets         공격 대상 자산(무엇을 치는가) — frameworks.yaml targets
#   atlas           MITRE ATLAS 2026.09 기법 ID(공격자 AI 관점). 없으면 atlas_none에 미연계 사유(필수)
#   attack          AI가 가속하는 ATT&CK v19.2 기존 기법 ID(없으면 [])
#   owasp           OWASP LLM Top 10(2025)·Agentic 위협 ID — 공격에 '악용되는 제3자 AI' 측 연계(없으면 [])
#   nist            대응 기준 — NIST SP 800-53 Rev.5 통제(탐지·대응). reference/nist/ 추출본
#   ai / cl / ot / sc / idn / ph  다른 매트릭스 연계 — 통합 v4.1 요약 ID(AI-·CL-·OT-·SC-·ID-·PH-)
#   refs            참고 문헌 키(frameworks.yaml references)
#   severity        심각도(상·중·하) — 기준은 assessment.severity_rule
#   severity_why    심각도 근거('상'은 피해 범위를 적음)

assessment:
  severity_rule:
    상: 성공하면 조직 전반이 장악되거나 대규모 금전·데이터 피해·가용성/안전 피해로 이어지는 위협(영향만으로 판정 — 속도·규모·탐지 난이도는 고유 축·우선순위에서 다룸, 검토 6.1)
    중: 피해가 개별 자산·단일 조직에 머물거나, 단독 피해는 없고 다른 단계를 키우는 조건(정찰·역량 확보 등)인 위협
    하: 직접 피해가 제한적·일시적이고 대응이 쉬운 위협
  likelihood_rule: >-
    상 = 실제 사고 2건 이상(AI v3.2·클라우드·OT·공급망·신원·물리 매트릭스와 같은 수식),
    중 = 실제 사고 1건 또는 AI 역량 성숙도가 '실사용/실증'이거나 ATLAS·ATT&CK 사례·위협인텔·정부 경보 중 하나 이상,
    하 = 근거 없음.
    단 영역 1은 사고가 적어도 급증·빠른 변화가 특징이라(작업방향 2장) 발생가능성에 'AI 역량 성숙도'(maturity)를 보조 신호로 더해
    실증된 위험 역량이 사고 건수만으로 과소평가되지 않게 한다(D4).
  severity_check: "'상' 판정은 피해 범위(조직 전반 장악·대규모 금전/데이터·가용성/안전)를 severity_why에 적은 경우에만. 속도·규모·탐지 난이도는 심각도 근거로 쓰지 않음(고유 축·우선순위)"

