# 교차 매핑·대응 기준·참고 문헌 카탈로그 — ID·명칭만 수록(원문 미수록)
#
# 역할(작업방향 6장)
#   ② 교차 매핑  : MITRE ATLAS 2026.09(공격자 AI 관점) · MITRE ATT&CK v19.2(AI가 가속하는 기존 기법) ·
#                  OWASP LLM Top 10(2025)·Agentic 위협(악용되는 제3자 AI 측) · 다른 매트릭스 통합 v4.1 요약 ID
#   ③ 대응 기준  : NIST SP 800-53 Rev.5 통제(탐지·대응) — reference/nist/ 추출본
#   ⑤ 참고 문헌  : 벤더·정부·연구 위협 인텔(사고·역량 근거) — ID 열 없이 refs와 문구의 '참고:' 인용으로만 사용
# 거버넌스 맥락(NIST AI RMF·GenAI 프로파일, OWASP)은 연계·명칭만. ATLAS 전술·기법은 reference/atlas/ 추출본에서 읽는다.

meta:
  atlas:
    name: MITRE ATLAS (Adversarial Threat Landscape for AI Systems)
    version: 2026.09 (format 6.0.0)
    source: https://github.com/mitre-atlas/atlas-data dist/v6/ATLAS-latest.yaml → reference/atlas/ 추출본(scripts/prepare_atlas.py)
    license: © The MITRE Corporation — ID·명칭만 인용, 공개 배포본 보관(reference/atlas/ATLAS-2026.09.yaml)
    note: 기법 성숙도(Realized·Demonstrated·Feasible)를 발생가능성의 'AI 역량 성숙도' 신호로 참고(D4)
  attack:
    name: MITRE ATT&CK Enterprise
    version: v19.2
    source: 저장소 루트 enterprise-attack-v19.2.xlsx → reference/attack/ 추출본(scripts/prepare_attack.py)
    license: © The MITRE Corporation — https://attack.mitre.org/resources/legal-and-branding/terms-of-use/ — ID·명칭만 인용
    note: AI가 가속·자동화하는 '기존 기법'만 연계(정찰·익스플로잇 확보·피싱·실행·반출 등). 순수 AI 고유 기법은 ATLAS로만 연계
  owasp:
    name: OWASP Top 10 for LLM Applications(2025) · OWASP Agentic AI — Threats and Mitigations
    version: "2025"
    source: https://genai.owasp.org
    license: © OWASP Foundation — CC BY-SA, ID·명칭만 인용
    note: 이 매트릭스는 '공격자가 AI를 쓰는' 관점이라, 공격에 악용되는 제3자 AI 서비스·에이전트가 있을 때만 피해 AI 측으로 연계(대부분 [])
  nist80053:
    name: NIST SP 800-53 Rev.5 통제명
    version: OSCAL 5.2.0 (2026-05-11)
    source: https://github.com/usnistgov/oscal-content → reference/nist/ 명칭 추출본(identity/ 추출본 재사용)
    license: 미국 정부 저작물(공공 영역)
  airmf:
    name: NIST AI Risk Management Framework · Generative AI Profile(NIST AI 600-1)
    version: "1.0 / 2024"
    source: https://www.nist.gov/itl/ai-risk-management-framework
    license: 미국 정부 저작물(공공 영역) — 거버넌스 맥락 연계·명칭만(행 매핑에는 쓰지 않음)

# 킬체인 단계(행 stage·시나리오 단계 어휘) — 작업방향 3.3(공격자 킬체인)
stages:
  정찰: AI로 공개정보·노출 자산·취약점 정보를 대규모로 수집·분석해 표적과 진입점을 고름
  역량확보: 공세용 AI 역량(다크·탈옥 LLM·AI 생성 도구·공세 에이전트)과 인프라를 갖춤
  취약점발굴: AI로 취약점을 자율 발굴하고 익스플로잇·악성코드를 자동 생성
  초기침투: AI 생성 콘텐츠·딥페이크로 사람을 속여 초기 접근을 얻음
  자율실행: AI 에이전트가 침투 후 실행·탐색·확산을 사람 감독 최소화로 수행
  은닉C2: AI 서비스를 C2·동적 명령원으로 쓰거나 AI로 탐지를 회피
  영향: AI로 최종 피해(금전·데이터·자원)를 실현하고 공격을 대규모화

# AI 역할·자율성 수준(행 ai_role) — 작업방향 3.3 고유 축. '사람 속도로 대응 가능한가'를 가름
ai_roles:
  보조: 초안·콘텐츠 생성 등 공격자를 거드는 수준(사람이 전 과정을 운전)
  증강: 정찰·분석·탐색을 가속(사람이 판단, AI가 속도·규모를 더함)
  반자율: 사람 감독 아래 일부 단계를 자율 실행(승인·개입 지점이 남음)
  완전자율: 목표만 주면 정찰부터 실행까지 자율 반복(사람 개입 최소)

# AI 고유성(행 novelty) — '진짜 새로운 것'과 '빨라진 것'을 구분(작업방향 3.3)
novelty:
  신규: AI로 새로 생긴 위협(자율 에이전트 침투·자율 취약점 발굴·AI 서비스 C2 등)
  증폭: 기존 위협의 AI 증폭(피싱·악성코드·정찰·데이터 탈취가 AI로 빨라지고 커짐)

# AI 역량 성숙도(행 maturity) — 발생가능성 보조 신호(D4). ATLAS maturity와 정합
maturity:
  실사용: 실제 공격·사고에서 쓰인 역량(ATLAS Realized 포함)
  실증: 실증·PoC·레드팀 시연으로 동작이 확인된 역량(ATLAS Demonstrated 포함)
  연구시연: 연구·개념 증명 수준으로 제시된 역량(ATLAS Feasible 포함)

# 위협 주체 유형(행 actors·사고 DB actor_type) — 행위자는 사고 DB actor로만 귀속(작업방향 2장)
actor_types:
  국가배후: 국가 지원·연계 그룹(첩보·파괴·영향 공작)
  사이버범죄: 금전 목적 범죄 조직·개인
  핵티비스트: 정치·사회 목적 행위자
  연구·레드팀: 보안 연구자·레드팀(실증·시연 — 방어 연구 맥락)

# 공격 대상 자산(행 targets) — '무엇을 치는가'(렌즈 매트릭스라 자산은 무관하게 묶음)
targets:
  AI 시스템: 제3자·피해 조직의 AI 서비스·에이전트·인프라
  클라우드·인프라: 클라우드 계정·워크로드·서버·CI/CD
  신원·계정: 사용자·계정·생체·본인확인 체계
  엔드포인트: 사용자 단말·서버 호스트
  소프트웨어 공급망: 저장소·패키지·빌드·개발 도구
  사람·조직: 임직원·경영진·조직 프로세스
  범용: 대상 자산을 가리지 않음

# OWASP — 공격에 악용되는 제3자 AI 측 연계(ID·명칭만)
owasp:
  LLM01: [Prompt Injection, 프롬프트 인젝션]
  LLM06: [Excessive Agency, 과도한 에이전시]
  LLM10: [Unbounded Consumption, 무제한 자원 소모]
  ASI-T01: [Agent Authorization and Control Hijacking, 에이전트 인가·제어 탈취]

