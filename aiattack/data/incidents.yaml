# AI 활용 공격 사고 DB — 공개 출처 기반(정부·사법 발표, 피해기관 공지, 보안업체·연구기관 분석, 공신력 있는 보도)
#
# 출발점(작업방향 3.4·D8): 통합 v4.1 사고사례 검증 원장의 'AI 활용=확인/추정' 27건을 origin으로 재인용하고,
#   AI 자율 취약점 발굴·역량 사례(Big Sleep·XBOW·GTIG·CrowdStrike)를 신규로 추가. v3 검토(2026-10-26)로 사실·출처·매핑 정정.
#
# 필드
#   id            AII-NNN (AI-attack Incident)
#   title         사례명
#   date          최초 공개월 YYYY-MM(통합 v4.1 검증 F2: 시점 = 최초 공개월)
#   kind          사고 · 캠페인 · 공시 · 사례연구(익명) · 정부 경보 · 위협인텔 · 연구·시연
#   verification  정부·사법 확인 · 피해기관 확인 · 보안업체·연구기관 분석 · 언론 보도 · 행위자 주장 · 논란·원인 번복
#   legal         (선택) 수사·조사 · 기소 · 유죄 판결 · 무죄·불기소 · 민사 판결·합의 · 행정 처분 · 해당 없음
#   region        피해 지역(scripts/taxonomy_rules.py REGIONS)
#   sector        피해 업종(SECTORS)
#   actor         행위자(공개 귀속, 개인은 익명화)
#   actor_type    위협 주체 유형(국가배후 · 사이버범죄 · 핵티비스트 · 연구·레드팀 · 내부자 · 미상)
#   impact        결과 유형(IMPACTS)
#   ai_use        공격에 AI를 썼는지(주장의 확신도 기준) — 확인(1차 출처가 단정) · 추정(1차 출처가 가능성·시사·정황) · 미확인(광고·자칭뿐, AI 사례로 세지 않음)
#   maturity      이 사례가 보이는 AI 역량 성숙도 — 실사용 · 실증 · 연구시연(발생가능성 보조 신호, D4)
#   summary       경위·결과 요약(분석가 작성, 수치는 출처 기준). 공격 실행 세부 대신 경위·피해·탐지·AI 활용 방식 중심
#   aia           매핑 세부위협(분석 매핑) — data/taxonomy.yaml Lv3 ID
#   attack_ref    (선택) ATLAS 사례(AML.CSxxxx)·ATT&CK 그룹/소프트웨어/캠페인 ID(대조·표시용)
#   origin        (선택) 통합 v4.1 원장 키(재인용 추적) — IDI-·SCI-·INC-·CL/INC-·OT/INC-·AML.CS
#   sources       '출처 | URL' — 통합 v4.1 검증에서 실제 열람한 근거 URL 우선
#
# 집계 규칙(scripts/taxonomy_rules.py): 실제 사고 = kind ∈ {사고·캠페인·공시·사례연구(익명)}이면서
#   verification ∉ {행위자 주장·논란·원인 번복}. 정부 경보·위협인텔은 실사용 근거, 연구·시연은 실증 근거로만('중' 상한) 반영.
#   ai_use='추정'도 그 행의 사례로는 집계하되 문구에서 '추정'으로 구분한다.

# ---------------------------------------------------------------------------
# 재인용 — 통합 v4.1 'AI 활용=확인/추정'(작업방향 3.4)
# ---------------------------------------------------------------------------
