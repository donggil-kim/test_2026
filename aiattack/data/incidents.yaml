- id: AII-030
  title: AI로 개발한 0-day 익스플로잇을 준비한 범죄 조직의 대량 악용 계획(GTIG 사전 차단)
  date: "2026-05"
  kind: 위협인텔
  verification: 보안업체·연구기관 분석
  region: 글로벌
  sector: [다부문]
  actor: 미상 사이버범죄 조직(GTIG 추적)
  actor_type: [사이버범죄]
  impact: [영향 없음(사전 차단)]
  ai_use: 확인
  maturity: 실사용
  summary: >-
    Google GTIG는 널리 쓰이는 오픈소스 웹 기반 시스템 관리 도구의 2단계 인증 우회 0-day를 범죄 조직이 AI 도움으로 찾아 무기화했으며
    대량 악용을 계획했다고 보고했다(GTIG는 AI 모델 활용을 '높은 확신'으로 평가, 근거는 익스플로잇 코드의 흔적). GTIG가 벤더와 협력해
    패치하고 활동을 차단해 실제 사용은 막은 것으로 보인다. 같은 보고서는 국가배후 그룹의 AI 보조 취약점 연구도 함께 기술했다.
  aia: [AIA-VE-02]
  sources:
    - Google GTIG(2026) GTIG AI Threat Tracker — Adversaries Leverage AI for Vulnerability Exploitation, Augmented Operations, and Initial Access | https://cloud.google.com/blog/topics/threat-intelligence/ai-vulnerability-exploitation-initial-access

