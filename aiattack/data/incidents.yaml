  capability_indicator: true   # 방어·연구 측 역량 실증 — 공격자 사고로 세지 않음(D13)
  summary: >-
    Google Big Sleep(Project Zero·DeepMind) AI 에이전트가 공격자가 곧 악용하려던 SQLite 취약점을 사전에 찾아냈다. Google은
    AI 에이전트가 실제 악용을 직접 저지한 첫 사례라고 밝혔다. 방어 연구지만 자율 취약점 발굴 역량이 실사용 수준임을 보임(양용 역량).
