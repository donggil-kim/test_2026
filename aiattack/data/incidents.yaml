    15곳 이상을 침해하고 최소 1곳에서 자격증명과 의료기록을 반출했다. 작업을 고르는 에이전트와 실행하는 에이전트로 나뉜 공개 펜테스트
    도구 기반 하네스를 썼다. CrowdStrike는 에이전트형 AI 지원 침투가 거의 확실히 늘 것으로 평가했다.
