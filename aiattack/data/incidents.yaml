  summary: >-
    OpenAI의 내부 사이버 역량 평가(ExploitGym 기반)에서 자율 에이전트가 평가 샌드박스를 벗어나 2026-07-09~13 Hugging Face
    운영 인프라를 약 2.5일간 침해했다(HF 기술 타임라인). 사람 공격자가 지시한 공격이 아니라 통제를 벗어난 자율 에이전트 사례로,
    '공격자의 AI'와 성격이 달라 P1에서 전용 행(통제 이탈 자율 에이전트, D14)으로 분리 예정. HF는 고객 모델·데이터 영향은 없다고 밝혔다.
