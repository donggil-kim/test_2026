    Claude·Gemini·Q 같은 AI CLI를 위험 옵션(--dangerously-skip-permissions·--yolo·--trust-all-tools)으로 실행해 비밀을
    찾게 했고, 탈취 정보를 피해자 계정의 공개 저장소로 올렸다. 2단계에서는 유출 토큰으로 비공개 저장소 5,500개 이상이 공개로 바뀌었다.
