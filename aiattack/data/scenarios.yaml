# 공격 체인 시나리오 — 실제 사고를 AI 활용 공격 흐름으로 재구성(방어 관점)
# 목적: 한 행 = 한 행위로 나눈 세부위협을 공격 흐름 안에서 보고, 어느 단계에서 끊을 수 있는지(초크 포인트)를 드러냄
#       (물리·신원·공급망 매트릭스 시나리오 형식 준용)
# 필드: incidents = 근거 사고 ID(data/incidents.yaml, AII-NNN)
#       steps = 순서대로 { aia: [세부위협 ID], 단계: 킬체인 단계(정찰·역량확보·취약점발굴·초기침투·자율실행·은닉C2·영향),
#                         행위: 사고 요약에 있는 사실만(괄호 안은 근거 사고 ID), 탐지: 그 단계의 탐지·차단 포인트 }
#       chokepoints = '세부위협 ID — 끊는 통제'(가장 싸고 효과가 큰 차단 지점)
# 가드레일(D11): 실행 방법이 아니라 식별·탐지·차단 지점을 적음
# 검증: scripts/validate.py가 AIA·사고·ATLAS/ATT&CK ID 존재, 킬체인 단계 어휘, 단계에 쓴 사고 ID ⊂ incidents, 초크 포인트-단계 일치를 점검

scenarios:
  - id: ASN-01
    title: 공세 AI 에이전트 프레임워크 구축 → 자율·다중 에이전트 첩보 작전
    incidents: [AII-008]
    summary: 스캐너·브라우저 자동화·침투 도구를 연결한 공격 프레임워크로 자율·다중 에이전트가 다수 조직을 동시에 침해한 흐름(GTG-1002). 공격의 대부분을 AI가 수행해 사람 대응 속도를 앞질렀으며, 역량 확보 단계의 비정상 도구 조합과 자율 실행 속도가 차단 지점이다.
    steps:
      - { aia: [AIA-RD-04], 단계: 역량확보, 행위: "스캐너·브라우저 자동화·침투 도구를 MCP로 엮은 공격 프레임워크 구축(AII-008)", 탐지: "AI 도구의 비정상 조합·자동화 설정과 제공자 측 오남용 신호를 모니터링" }
      - { aia: [AIA-AO-01, AIA-AO-02], 단계: 자율실행, 행위: "자율·다중 에이전트가 약 30개 조직을 표적해 공격의 80~90%를 수행(AII-008)", 탐지: "사람 속도를 넘는 반복·연쇄 행위와 다수 표적에 걸친 상관 이벤트를 행위 기반으로 탐지" }
    chokepoints:
      - AIA-RD-04 — 공격 프레임워크·에이전트 도구의 비정상 조합을 제공자 오남용 탐지·행위 분석으로 조기 식별
      - AIA-AO-01 — AI 속도 공격을 전제한 탐지·대응 자동화로 자율 실행 단계의 대응 시간을 단축

  - id: ASN-02
    title: 탈옥 모델 자율 하네스 → 노출 자산 열거·PoC 검색 → 자율 공격 시도
    incidents: [AII-027]
    summary: 탈옥 모델(DeepSeek)을 Hermes 하네스의 자율 공세 운영자로 삼아 노출 자산을 스스로 열거하고 최신 PoC를 검색해 공격을 시도한 흐름(접근 획득은 실패). 자율 열거·PoC 검색 단계의 비정상 속도와 노출 자산 관리가 차단 지점이다.
    steps:
      - { aia: [AIA-RD-04], 단계: 역량확보, 행위: "탈옥 모델을 자율 공세 운영자로 삼은 Hermes 하네스 구성(AII-027)", 탐지: "탈옥 모델·자율 하네스의 비정상 트래픽·도구 호출 패턴을 모니터링" }
      - { aia: [AIA-RT-02, AIA-RT-03], 단계: 정찰, 행위: "FOFA로 노출된 Langflow·n8n을 스스로 열거하고 GitHub에서 최신 CVE PoC를 검색(AII-027)", 탐지: "비정상적으로 빠른 열거·탐침과 공개 자산 노출을 지속 점검" }
      - { aia: [AIA-AO-01], 단계: 자율실행, 행위: "노출 시스템을 자율로 공격 시도(접근 획득은 모두 실패)(AII-027)", 탐지: "자동화된 연쇄 공격 시도와 세션 속도를 행위 기반으로 탐지" }
    chokepoints:
      - AIA-RT-02 — 노출 자산 최소화·신속 패치로 자율 열거-악용 간격을 좁힘
      - AIA-AO-01 — 자율 공격 속도를 전제한 탐지·차단 자동화

  - id: ASN-03
    title: 피해 단말 AI CLI 악용 → 노출 클라우드 키 → 측면 이동으로 클라우드 장악
    incidents: [AII-004, AII-018]
    summary: 공급망으로 배포된 악성 코드가 피해 단말의 AI CLI를 위험 옵션으로 실행해 비밀을 찾게 하고, 그렇게 노출된 클라우드 키로 측면 이동해 짧은 시간에 클라우드 전반을 장악한 흐름(s1ngularity 계열). AI 도구 실행 권한 제한과 단기 자격증명이 차단 지점이다.
    steps:
      - { aia: [AIA-AO-03.1], 단계: 자율실행, 행위: "피해 단말의 AI CLI를 위험 옵션으로 실행해 비밀을 탐색하고 비공개 저장소 5,500개 이상을 공개로 전환(AII-004)", 탐지: "AI CLI의 위험 옵션 실행·비정상 파일 탐색·외부 전송을 행위 기반으로 탐지" }
      - { aia: [AIA-AO-03.1, AIA-AO-05], 단계: 자율실행, 행위: "노출된 클라우드 키로 측면 이동하고 단말의 LLM 도구로 자격증명을 탐색해 72시간 안에 클라우드 전반 장악(AII-018)", 탐지: "자격증명의 비정상 사용·급속한 권한 확대를 아이덴티티·클라우드 로그로 탐지" }
    chokepoints:
      - AIA-AO-03.1 — AI 개발 도구의 실행 권한·위험 옵션을 최소 권한·허용 목록으로 제한
      - AIA-AO-05 — 단기 자격증명·최소 권한·이상 접근 차단으로 측면 이동 속도를 늦춤

  - id: ASN-04
    title: 딥페이크 화상회의 사칭 → 승인권자 기만 → 대규모 부정 송금
    incidents: [AII-002]
    summary: 공개 영상으로 만든 딥페이크로 CFO·동료를 사칭한 화상회의에서 지시를 받아 거액을 송금한 흐름(Arup). 영상 신뢰를 직접 무너뜨리므로, 고액 송금의 다채널 확인이 가장 싼 차단 지점이다.
    steps:
      - { aia: [AIA-IA-02.1], 단계: 초기침투, 행위: "참석자 전원이 딥페이크인 화상회의로 CFO·동료를 사칭(AII-002)", 탐지: "고액 지시의 출처를 영상 외 경로로 교차 확인하고 딥페이크·라이브니스 징후를 점검" }
      - { aia: [AIA-IM-01], 단계: 영향, 행위: "지시를 믿은 직원이 약 2,560만 달러를 부정 송금(AII-002)", 탐지: "고액·비정상 송금 요청을 결제·승인 흐름에서 탐지하고 한도·역할 분리를 적용" }
    chokepoints:
      - AIA-IA-02.1 — 고위험 요청에 사전 등록 경로·다채널 확인을 의무화해 영상 신뢰에 의존하지 않음
      - AIA-IM-01 — 고액 송금 다채널 확인·역할 분리·한도로 피해 실현을 차단

  - id: ASN-05
    title: AI 연동 악성코드 배포 → 실행 중 명령 동적 생성 → AI 서비스 은닉 C2
    incidents: [AII-007]
    summary: 침해된 메일 계정으로 배포된 악성코드가 실행 중 LLM API에 질의해 명령을 매번 새로 생성하고 AI 서비스 트래픽에 C2를 숨긴 흐름(LAMEHUG, APT28). 고정 시그니처가 없어 AI 서비스 egress 통제와 행위 기반 탐지가 차단 지점이다.
    steps:
      - { aia: [AIA-VE-03.1], 단계: 취약점발굴, 행위: "LLM 연동 악성코드를 사칭 메일로 배포(AII-007)", 탐지: "행위·맥락 기반으로 변종 악성코드를 탐지하고 메일 사칭을 차단" }
      - { aia: [AIA-CC-02, AIA-CC-01], 단계: 은닉C2, 행위: "실행 중 LLM API 질의로 시스템 정보 수집·문서 검색 명령을 동적 생성하고 AI API로 은닉 통신(AII-007)", 탐지: "LLM API로의 비정상 egress와 동적 생성 명령 실행을 행위 기반으로 탐지" }
    chokepoints:
      - AIA-CC-02 — 행위 기반 실행 탐지로 매번 달라지는 동적 명령에 대응
      - AIA-CC-01 — AI 서비스 egress 가시성·허용 목록으로 은닉 C2 채널을 통제

  - id: ASN-06
    title: 딥페이크 생체·본인확인(KYC) 우회 → 계좌 개설·장악
    incidents: [AII-001, AII-013]
    summary: AI 얼굴 바꾸기로 은행 얼굴인식·KYC를 통과해 계좌를 열거나 장악한 흐름(홍콩 대출 사기·GoldPickaxe). 비대면 본인확인 신뢰를 무너뜨리므로 강화된 라이브니스·다중 요소 검증이 차단 지점이다.
    steps:
      - { aia: [AIA-IA-03], 단계: 초기침투, 행위: "AI 얼굴 바꾸기로 신분증 주인 얼굴로 바꿔 대출·계좌 개설 얼굴인식을 통과(AII-001)", 탐지: "라이브니스·프레젠테이션 공격 탐지와 비정상 계좌 개설 패턴을 모니터링" }
      - { aia: [AIA-IA-03], 단계: 초기침투, 행위: "트로이목마로 수집한 얼굴 데이터로 만든 딥페이크로 은행 생체 본인확인을 우회(AII-013)", 탐지: "위험 기반 추가 확인과 문서 진위·다중 요소 검증을 적용" }
    chokepoints:
      - AIA-IA-03 — 강화된 라이브니스·다중 요소·문서 진위 검증과 위험 기반 추가 확인

  - id: ASN-07
    title: 자율 에이전트의 워크플로 대량 악용 → 토큰 탈취 → 연쇄 공급망 침해
    incidents: [AII-017, AII-020, AII-019]
    summary: AI로 보이는 계정·에이전트가 공개 저장소의 워크플로 결함을 자동·대량으로 탐색·악용해 토큰을 탈취하고, 그 자격증명이 배포 파이프라인 침해로 이어진 흐름. 워크플로 트리거·권한 최소화와 파이프라인 변경 검증이 차단 지점이다.
    steps:
      - { aia: [AIA-AO-04], 단계: 자율실행, 행위: "자율 에이전트가 공개 저장소의 워크플로 결함을 자동 탐색해 다수 저장소에서 코드 실행·토큰 탈취(AII-017)", 탐지: "워크플로에 대한 대량 자동 PR·비정상 실행과 토큰 사용을 탐지" }
      - { aia: [AIA-AO-04], 단계: 자율실행, 행위: "다수 저장소에 자동 악성 PR을 보내 pull_request_target을 악용(AII-020)", 탐지: "pull_request_target 등 위험 트리거의 비정상 호출을 모니터링" }
      - { aia: [AIA-AO-03.2, AIA-AO-04], 단계: 자율실행, 행위: "AI 코딩 에이전트로 배포 파이프라인을 침해(AII-019)", 탐지: "AI 개발 도구의 비정상 권한 사용·파이프라인 산출물 변조를 검증" }
    chokepoints:
      - AIA-AO-04 — 워크플로 트리거·권한 최소화와 파이프라인 변경 검증
      - AIA-AO-03.2 — AI 코딩 도구 권한·승인 경계 최소화와 개발 파이프라인 변경 검증
