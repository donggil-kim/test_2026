# 공격 체인 시나리오 — 실제 사고를 신원 공격 흐름으로 재구성
# 목적: 개별 세부위협을 공격 흐름 안에서 보고, 어느 단계에서 끊을 수 있는지(초크 포인트)를 드러냄 (공급망 매트릭스 시나리오 형식 준용)
# 필드: incidents = 근거 사고 ID(data/incidents.yaml), ref = ATT&CK 그룹·소프트웨어·캠페인 ID와 관련 KEV
#       steps = 순서대로 { idt: [세부위협 ID], 단계: ATT&CK 전술 국문명, 행위: 사고 DB 요약에 있는 사실만(괄호 안은 사례), 탐지: 그 단계의 탐지·차단 포인트 }
#       chokepoints = '세부위협 ID — 끊는 통제' (가장 싸고 효과가 큰 차단 지점)
# 여러 사고를 한 흐름으로 이은 시나리오는 단계마다 근거 사례를 괄호로 표시함
# 검증: scripts/validate.py가 IDT·사고·ATT&CK·CVE ID 존재, 전술 국문명, 사고-단계 매핑 교차, 초크 포인트-단계 일치를 점검

scenarios:
  - id: SCN-01
    title: 헬프데스크 사칭 — 전화 한 통에서 IdP 관리 권한·하이퍼바이저 암호화까지
    incidents: [IDI-005, IDI-009, IDI-010, IDI-008, IDI-007]
    ref: ATT&CK G1015 · S1068
    summary: 기술 통제를 뚫지 않고 헬프데스크 절차로 비밀번호·MFA를 넘겨받아 IdP 관리 권한과 하이퍼바이저 암호화까지 간 흐름. 2023~2025년 대형 사고(MGM·Clorox·M&S)에서 반복된 시작점이며, 재설정 전 신원 확인 절차가 가장 싼 차단 지점이다.
    steps:
      - { idt: [IDT-SE-02.1], 단계: 초기 침투, 행위: "LinkedIn에서 찾은 직원을 사칭해 IT 헬프데스크에 전화로 계정 접근을 요청(MGM), 협력사를 상대로 한 사칭으로 직원 비밀번호를 재설정받음(M&S)", 탐지: "헬프데스크 티켓의 신원 확인 기록과 IdP 비밀번호·MFA 재설정 이벤트 대조" }
      - { idt: [IDT-LC-01.2], 단계: 초기 침투, 행위: "외주 헬프데스크가 여러 차례 걸려 온 전화에 신원 확인 없이 Okta 비밀번호와 Microsoft MFA를 재설정(Clorox 소송 주장)", 탐지: "외주 헬프데스크의 특권·다수 계정 재설정 이력 감사, 재설정 직후 새 위치 로그인 경보" }
      - { idt: [IDT-PE-02.2], 단계: 지속성, 행위: "MFA를 공격자 장치로 옮기게 하거나 계정을 얻은 뒤 자체 MFA 장치를 등록해 접근 유지(Scattered Spider 합동 권고)", 탐지: "새 MFA 장치 등록을 사용자·보안팀에 동시 알림, 재설정 직후 등록 여부 상관 분석" }
      - { idt: [IDT-DI-03.2], 단계: 권한 상승, 행위: "Okta·Azure 관리 권한 확보(MGM), 다른 사례에서는 최고 관리자 MFA를 모두 초기화하게 한 뒤 두 번째 IdP를 사칭 앱으로 구성해 다른 사용자 명의로 앱에 접근(Okta 고객)", 탐지: "외부 IdP·인바운드 페더레이션 추가와 최고 관리자 MFA 초기화를 실시간 고위험 경보" }
      - { idt: [IDT-IM-02], 단계: 영향, 행위: "ALPHV 랜섬웨어로 약 100대의 ESXi 하이퍼바이저를 암호화, 운영이 열흘가량 마비되고 약 1억 달러 영업 손실(MGM)", 탐지: "IdP 관리자 활동과 하이퍼바이저 관리 계정의 대량 작업을 상관 분석" }
    chokepoints:
      - IDT-SE-02.1 — 특권 계정은 헬프데스크 재설정 대상에서 빼고, 일반 재설정도 영상 대면·관리자 승인 등 강한 신원 확인 뒤에만 허용(외주 계약에 절차 명시)
      - IDT-PE-02.2 — MFA 재등록에 기존 강한 인증 수단 확인을 요구하고 새 장치 등록을 즉시 알림
      - IDT-DI-03.2 — 외부 IdP·페더레이션 추가와 최고 관리자 MFA 초기화에 다중 승인

  - id: SCN-02
    title: 토큰 서명 키 탈취·위조 — 비밀번호·MFA 없이 임의 사용자로 클라우드 메일 접근
    incidents: [IDI-025, IDI-027, IDI-024, IDI-026]
    ref: ATT&CK G0016 · C0024 · S0661
    summary: 신원 체계의 열쇠인 토큰 서명 키·인증서를 손에 넣으면 비밀번호·MFA와 무관하게 임의 사용자로 인증된다. 온프레미스 페더레이션 서버(NOBELIUM의 FoggyWeb·Golden SAML·MagicWeb)와 IdP 공급업체 서명 키(Storm-0558) 두 경로가 모두 실제로 쓰였다.
    steps:
      - { idt: [IDT-DI-04], 단계: 지속성, 행위: "장악한 AD FS 서버에 FoggyWeb을 상주시켜 구성 DB와 토큰 서명·복호화 인증서를 원격으로 빼냄(FoggyWeb)", 탐지: "페더레이션 서버의 비정상 모듈 로드·구성 DB 접근을 무결성 감시로 탐지" }
      - { idt: [IDT-TS-03.2], 단계: 자격증명 접근, 행위: "탈취한 AD FS 토큰 서명 인증서로 임의 사용자의 SAML 토큰을 위조(SolarWinds 이후 클라우드 장악)", 탐지: "IdP 발급 기록이 없는 SAML 토큰 로그인을 클라우드 로그와 대조" }
      - { idt: [IDT-DI-03.2, IDT-PE-02.1], 단계: 지속성, 행위: "신뢰 도메인을 추가하거나 기존 애플리케이션·서비스 주체에 자격증명을 추가해 클라우드 자원에 지속 접근(SolarWinds 이후 클라우드 장악)", 탐지: "페더레이션 도메인 추가·서비스 주체 자격증명 추가를 실시간 고위험 경보" }
      - { idt: [IDT-DI-04], 단계: 지속성, 행위: "AD FS 서버의 정상 DLL을 MagicWeb으로 바꿔 특수한 인증서가 든 토큰을 내면 어떤 사용자로든 인증되게 함(MagicWeb)", 탐지: "인증 서버 DLL의 해시·서명 무결성 점검" }
      - { idt: [IDT-TS-03.3, IDT-DI-03.1], 단계: 자격증명 접근, 행위: "공급업체 경로로는 Microsoft 소비자 계정 서명 키로 인증 토큰을 위조했고 토큰 검증 결함으로 기업용 토큰 검증에도 통과(Storm-0558)", 탐지: "토큰의 서명 키·발급자 불일치 로그인 탐지, 공급업체 침해 공지 즉시 테넌트 감사 로그 점검" }
      - { idt: [IDT-IM-03], 단계: 수집, 행위: "Microsoft 365 메일 등 클라우드 자원에 지속 접근(SolarWinds 이후 클라우드 장악), 미 국무부 등 약 25개 조직의 Exchange Online·Outlook.com 메일에 접근(Storm-0558)", 탐지: "메일함 접근 감사 로그에서 평소와 다른 앱·토큰 기반 접근 주체 점검" }
    chokepoints:
      - IDT-DI-04 — 페더레이션·인증 서버를 도메인 컨트롤러와 같은 최상위 계층으로 관리하고 관리 접근 분리, 파일·모듈 무결성 감시
      - IDT-TS-03.2 — 토큰 서명 키를 하드웨어 보안 모듈에 보관하고 IdP 발급 기록과 클라우드 로그인을 대조
      - IDT-DI-03.1 — IdP 공급업체를 핵심 공급망으로 관리하고 메일 접근 감사 로그를 확보해 공급업체 키가 털려도 이상 접근을 찾게 함
      - IDT-DI-03.2 — 페더레이션 도메인 추가·서비스 주체 자격증명 추가에 이중 승인과 실시간 경보

  - id: SCN-03
    title: 인포스틸러 — 회사 밖 단말에서 털린 자격증명이 MFA 없는 SaaS·VPN 대량 반출로
    incidents: [IDI-016, IDI-069, IDI-018]
    summary: 협력사·개인 PC에서 인포스틸러로 털린 자격증명이 수년 뒤 MFA 없는 SaaS·VPN 로그인으로 이어져 대량 반출·갈취가 된 흐름. Snowflake 플랫폼 자체 침해 증거는 없었고, MFA·접속 허용 목록·자격증명 교체 중 하나만 있었어도 끊길 수 있었다.
    steps:
      - { idt: [IDT-CR-01.1, IDT-LC-01.2], 단계: 자격증명 접근, 행위: "협력사 직원이 업무 브라우저 프로필에 저장한 자격증명이 개인 컴퓨터로 동기화된 뒤 악성코드로 탈취(Medibank), 인포스틸러 감염 단말에서 고객 자격증명이 유출되고 일부는 협력사 단말에서 유출(Snowflake)", 탐지: "인포스틸러 로그·다크웹 유출 모니터링 결과를 사내·고객 계정과 대조" }
      - { idt: [IDT-NH-01.2], 단계: 지속성, 행위: "쓰인 자격증명 일부는 2020년 유출 이후 교체되지 않음(Snowflake), 협력사 직원 단말에서 2021년에 유출된 Jira 자격증명이 여전히 유효(HELLCAT의 JLR 침해)", 탐지: "유출이 확인된 계정과 장기 미변경 자격증명의 로그인 경보" }
      - { idt: [IDT-AU-03.3, IDT-AU-01.2], 단계: 초기 침투, 행위: "MFA와 접속 허용 목록이 없는 Snowflake 고객 인스턴스 약 165곳에 로그인(Snowflake), MFA 없이 사용자 이름·비밀번호만으로 접속되던 VPN으로 침투(Medibank)", 탐지: "처음 보는 출발지·클라이언트 도구의 데이터 플랫폼·VPN 로그인 경보" }
      - { idt: [IDT-IM-03], 단계: 반출, 행위: "고객 인스턴스 데이터를 대량 반출하고 갈취(Snowflake), Telefónica·Schneider Electric·Orange·JLR 등의 Jira에서 데이터를 빼내 갈취(HELLCAT), 고객 약 970만 명 정보 탈취·다크웹 공개(Medibank)", 탐지: "대량 조회·내보내기 쿼리와 새 출발지 접근을 상관 분석" }
    chokepoints:
      - IDT-AU-03.3 — 데이터 플랫폼·VPN·SaaS 로그인에 MFA와 접속 허용 목록을 필수로 적용(Snowflake·Medibank 모두 MFA 없는 로그인 경로)
      - IDT-NH-01.2 — 유출 모니터링으로 확인된 자격증명과 장기 미변경 비밀번호를 일괄 교체
      - IDT-CR-01.1 — 업무 자격증명의 브라우저 저장·개인 계정 동기화를 막고 협력사 단말에도 같은 요구 적용

  - id: SCN-04
    title: SaaS 연동 토큰·연결 앱 — 연동 하나로 여러 조직 데이터와 다음 자격증명까지
    incidents: [IDI-037, IDI-106, IDI-036]
    ref: ATT&CK G1057 · C0059
    summary: 사용자 로그인 없이 연동 앱 토큰이나 직원이 승인한 연결 앱만으로 여러 조직의 SaaS 데이터를 대량 반출하고, 그 데이터 속 자격증명이 다음 침해의 재료가 되는 흐름. 피해 조직의 MFA·로그인 정책을 거치지 않는다.
    steps:
      - { idt: [IDT-NH-03.1], 단계: 자격증명 접근, 행위: "Salesloft Drift 앱과 Salesforce 연동에 쓰이는 OAuth·리프레시 토큰을 탈취(Drift), Heroku·Travis CI에 발급된 GitHub OAuth 사용자 토큰을 탈취(Heroku·Travis CI)", 탐지: "연동 공급자 침해 공지 구독, 연동 토큰의 새 출발지 사용 경보" }
      - { idt: [IDT-SE-02.2, IDT-NH-03.2], 단계: 초기 침투, 행위: "연결 앱 경로로는 IT 지원 인력을 사칭한 전화로 직원이 공격자가 변조한 Data Loader 연결 앱을 승인(Salesforce 음성 피싱)", 탐지: "신규 연결 앱 승인과 직후 API 대량 조회를 연계 탐지" }
      - { idt: [IDT-IM-05], 단계: 횡적 이동, 행위: "탈취한 토큰으로 여러 조직의 Salesforce 인스턴스(Drift)와 npm 등 수십 개 조직의 비공개 저장소(Heroku·Travis CI)에 접근", 탐지: "연동 앱별 접근 대상·조회량 기준선 위반 경보" }
      - { idt: [IDT-IM-03], 단계: 반출, 행위: "Salesforce 데이터를 API로 대량 조회·반출한 뒤 갈취에 쓰고(Salesforce 음성 피싱), 비공개 저장소를 복제(Heroku·Travis CI)", 탐지: "대량 API 조회·내보내기·저장소 복제 탐지" }
      - { idt: [IDT-CR-02.1], 단계: 자격증명 접근, 행위: "반출한 Salesforce 데이터 안에서 AWS 키·Snowflake 토큰·비밀번호 같은 자격증명을 찾아냄(Drift)", 탐지: "SaaS 레코드·첨부의 비밀 스캔, 노출 자격증명의 사용 이력 점검" }
      - { idt: [IDT-AU-01.2], 단계: 횡적 이동, 행위: "일부 사례에서는 탈취 자격증명으로 Okta·Microsoft 365 등 다른 클라우드로 이동(Salesforce 음성 피싱)", 탐지: "같은 출발지가 여러 SaaS에 연달아 로그인하는 패턴 상관 분석" }
    chokepoints:
      - IDT-NH-03.1 — 연동 앱 권한 범위·토큰 수명을 최소화하고 연동 공급자 침해 공지 즉시 토큰 전수 폐기
      - IDT-NH-03.2 — 연결 앱 설치·승인을 관리자 승인으로 제한하고 API 사용자 권한 최소화
      - IDT-CR-02.1 — SaaS 레코드·첨부에 자격증명을 남기지 않게 하고 비밀 스캔으로 노출 즉시 교체

  - id: SCN-05
    title: AD 장악 — 티켓·디렉터리 취약점에서 도메인 전체 랜섬웨어와 클라우드 파괴까지
    incidents: [IDI-021, IDI-096, IDI-097, IDI-028, IDI-022, IDI-023]
    ref: ATT&CK S1070 · S0446 · S0368 · G0034 · G1053 · KEV CVE-2020-1472
    summary: 공개 경위가 드문 디렉터리 내부 공격을 여러 사고로 이어 붙인 흐름. 특권 계정 하나를 얻는 단계(Kerberoasting·도메인 컨트롤러 취약점)부터 그룹 정책 배포와 하이브리드 동기화 계정을 거친 클라우드 파괴까지, 도메인 관리 권한이 곧 전사 피해 수단이 된다.
    steps:
      - { idt: [IDT-TS-02.2], 단계: 자격증명 접근, 행위: "협력사 직원 단말이 검색 결과의 악성 링크로 감염된 뒤 RC4 암호화를 허용하던 Active Directory에서 Kerberoasting으로 특권 계정을 얻음(Ascension)", 탐지: "RC4 서비스 티켓 요청 급증, 한 계정의 다수 서비스 티켓 요청 경보" }
      - { idt: [IDT-DI-01.4], 단계: 권한 상승, 행위: "피싱 메일로 침투한 지 2시간도 안 돼 Netlogon 취약점(Zerologon)으로 도메인 컨트롤러 자격증명을 재설정해 도메인 관리자 권한을 얻음(Ryuk)", 탐지: "도메인 컨트롤러 계정 비밀번호 재설정 이벤트 경보, KEV 등재 즉시 패치 여부 확인" }
      - { idt: [IDT-CR-01.2, IDT-TS-02.1], 단계: 횡적 이동, 행위: "감염 단말 메모리에서 Windows 자격증명을 빼내 PsExec·WMIC 같은 정상 관리 도구로 다른 시스템에 퍼짐(NotPetya)", 탐지: "LSASS 접근과 원격 관리 도구 연쇄 실행을 상관 분석" }
      - { idt: [IDT-DI-01.2], 단계: 실행, 행위: "도메인 관리자 수준 권한으로 Default Domain 그룹 정책 개체를 바꿔 랜섬웨어 실행 작업을 전체 도메인에 배포(Prestige)", 탐지: "그룹 정책 개체 생성·수정 실시간 경보" }
      - { idt: [IDT-DI-02], 단계: 권한 상승, 행위: "온프레미스를 장악한 뒤 Entra Connect 동기화 서버 계정 자격증명을 탈취해 MFA 없는 클라우드 관리자 계정으로 클라우드에 들어감(Storm-0501), Azure AD Connect 에이전트의 특권 계정 자격증명으로 클라우드에 접근(MERCURY)", 탐지: "동기화 서비스 계정의 대화형 로그인, 클라우드 관리자 비밀번호 변경 경보" }
      - { idt: [IDT-IM-02], 단계: 영향, 행위: "수천 대에 랜섬웨어 배포·환자 560만 명 데이터 반출(Ascension), 5시간 만에 도메인 전체 암호화(Ryuk), 클라우드 자원·백업 삭제와 랜섬웨어 실행(Storm-0501), 클라우드·온프레미스 자원 대량 삭제(MERCURY)", 탐지: "백업 삭제·대량 암호화·대량 자원 삭제 행위 탐지" }
    chokepoints:
      - IDT-TS-02.2 — RC4 등 약한 Kerberos 암호화를 끄고 서비스 계정은 긴 무작위 비밀번호·관리형 서비스 계정 사용
      - IDT-DI-01.4 — 도메인 컨트롤러 보안 패치를 최우선 일정으로 적용하고 도메인 컨트롤러 접근을 관리 계층으로 제한
      - IDT-DI-02 — 동기화 서버를 도메인 컨트롤러와 같은 최상위 계층으로 보호하고 클라우드 관리자는 클라우드 전용 계정·MFA 필수
      - IDT-IM-02 — 도메인·클라우드 관리 권한으로도 지울 수 없는 분리·불변 백업

  - id: SCN-06
    title: IdP 공급업체 침해 — 지원 시스템 세션 토큰에서 고객사 내부 재침투까지
    incidents: [IDI-019, IDI-020]
    summary: IdP 공급업체 직원의 개인 브라우저에 저장된 서비스 계정 하나가 고객 134곳의 세션 토큰 노출로 번지고, 고객사가 교체에서 빠뜨린 토큰이 이후 재침투 경로가 된 흐름. 공급업체 침해 뒤 고객 쪽 비밀 전수 교체가 마지막 차단 지점이다.
    steps:
      - { idt: [IDT-NH-02.1], 단계: 자격증명 접근, 행위: "직원이 업무용 노트북 Chrome에서 개인 Google 계정에 로그인해 지원 시스템 서비스 계정 자격증명을 저장했고, 개인 계정이나 기기가 침해되며 서비스 계정이 탈취(Okta)", 탐지: "서비스 계정의 대화형 로그인·새 출발지 접근 경보" }
      - { idt: [IDT-DI-03.1, IDT-TS-01.1], 단계: 자격증명 접근, 행위: "고객이 지원 요청에 첨부한 HAR 파일에서 세션 토큰을 추출(Okta)", 탐지: "지원 시스템의 고객 첨부 파일 대량 열람 감사, 고객 쪽 세션 재사용(다른 IP·ASN의 같은 세션) 탐지" }
      - { idt: [IDT-IM-05], 단계: 횡적 이동, 행위: "BeyondTrust·Cloudflare·1Password 등 고객 134곳에 영향(Okta)", 탐지: "공급업체 침해 공지 즉시 자사 테넌트 감사 로그 점검" }
      - { idt: [IDT-NH-01.2], 단계: 지속성, 행위: "Okta 침해로 유출된 것 가운데 쓰지 않는다고 잘못 판단해 교체하지 않은 서비스 토큰 1개와 서비스 계정 자격증명 3개가 남음(Cloudflare)", 탐지: "교체 대상 목록 기준 완료 확인, 폐기 예정 토큰의 사용 경보" }
      - { idt: [IDT-NH-01.1], 단계: 초기 침투, 행위: "남은 토큰·자격증명으로 Cloudflare의 Atlassian(Confluence·Jira·Bitbucket)에 접근했고 탐지 하루 만에 차단(Cloudflare)", 탐지: "서비스 토큰의 평소와 다른 출발지·대상 접근 경보" }
    chokepoints:
      - IDT-NH-02.1 — 서비스 계정의 대화형 로그인과 개인 브라우저 저장을 막고 출발지를 제한
      - IDT-TS-01.1 — 지원 자료(HAR)는 세션 정보를 지운 뒤 올리게 하고, 세션을 장치에 묶어 재사용을 차단
      - IDT-NH-01.2 — 공급업체 침해 공지 뒤 연동 토큰·서비스 계정 자격증명을 사용 여부와 무관하게 전수 교체

  - id: SCN-07
    title: 국내 고객 계정 크리덴셜 스터핑 — 유출 목록 대입에서 개인정보 노출·과징금까지
    incidents: [IDI-044, IDI-045, IDI-046]
    summary: 서비스 자체가 뚫리지 않아도 다른 곳에서 유출된 아이디·비밀번호를 대량 대입해 회원 계정에 로그인하고 개인정보 화면에서 정보를 빼낸 국내 사고들. 처분에서는 반복·대량 로그인 탐지·차단 소홀이 지적됐고, 로그인 뒤 개인정보 마스킹이 피해 규모를 갈랐다.
    steps:
      - { idt: [IDT-CI-01], 단계: 자격증명 접근, 행위: "다른 곳에서 유출된 아이디·비밀번호를 대입 — 국내외 14개 IP로 초당 최대 372회, 총 4,400만 회 이상(SK스토아), 열흘간 4,305개 IP로 540만 회 이상(기프티쇼)", 탐지: "같은 IP·기기 지문의 단시간 대량 로그인, 로그인 성공률 급변을 실시간 탐지" }
      - { idt: [IDT-CI-01], 단계: 초기 침투, 행위: "12만 5천여 계정(SK스토아)·약 9만 8천 개 계정(기프티쇼)에 로그인, GS SHOP(2024-06~2025-02)과 GS25(2024-12~2025-01)에 로그인(GS리테일)", 탐지: "처음 보는 기기의 로그인 직후 개인정보 조회·변경 경보" }
      - { idt: [IDT-IM-03], 단계: 수집, 행위: "회원정보 수정 페이지에서 이름·연락처·주소 등을 빼냄(GS리테일), 개인정보가 담긴 페이지에 접근했고 일부 페이지는 비밀번호를 평문으로 송수신(SK스토아)", 탐지: "개인정보 페이지 대량 조회·자동화 도구 접근 탐지" }
      - { idt: [IDT-IM-03], 단계: 영향, 행위: "GS SHOP 158만여 명·GS25 7만 9천여 명 정보 노출로 과징금 128억 원(GS리테일), 과징금 14억 3,200만 원(SK스토아), 마스킹 덕분에 실제 유출은 51명에 그침(기프티쇼)", 탐지: "처분 사례의 지적 사항(대량 로그인 탐지·차단, 평문 전송)을 자사 탐지 규칙·점검 항목과 대조" }
    chokepoints:
      - IDT-CI-01 — 같은 IP·기기의 단시간 대량 로그인 탐지·차단과 봇 차단, 고객 계정 MFA·패스키 제공
      - IDT-IM-03 — 로그인 뒤 개인정보 화면 마스킹과 개인정보 변경 재인증(기프티쇼는 마스킹으로 실제 유출이 51명에 그침)

  - id: SCN-08
    title: 국내 통신 가입자 인증 체계 — 관리망 계정·불법 기지국에서 유심 정보 유출·무단 결제까지
    incidents: [IDI-040, IDI-041, IDI-047]
    summary: 휴대폰 문자·유심을 신원 확인 수단으로 쓰는 구조에서 통신사 인증 체계가 뚫리면 가입자 개인이 막을 수 없는 피해가 된다. 관리망 서버 계정 관리 부실(SK텔레콤), 불법 초소형 기지국(KT), 심스와핑 의심 사례(KT 가입자)가 서로 다른 경로로 이를 보여 줬다.
    steps:
      - { idt: [IDT-CI-02], 단계: 초기 침투, 행위: "최초 침투는 2021-08로 특정되고 서버 28대에서 악성코드 33종이 발견(SK텔레콤)", 탐지: "가입자 인증 서버·관리망 서버의 악성코드·비인가 접속 점검" }
      - { idt: [IDT-NH-01.2], 단계: 지속성, 행위: "시스템 관리망 서버 계정 비밀번호를 바꾸지 않고 만료일도 두지 않았으며, 2022년 HSS 관리서버의 비정상 로그인 정황을 발견하고도 신고하지 않음(SK텔레콤)", 탐지: "관리망 계정의 장기 미변경 비밀번호·비정상 로그인 점검과 즉시 보고 체계" }
      - { idt: [IDT-CI-02, IDT-IM-03], 단계: 수집, 행위: "유심 정보 25종 2,696만여 건 유출(SK텔레콤)", 탐지: "가입자 인증 서버의 대량 조회·외부 전송 탐지" }
      - { idt: [IDT-CI-02], 단계: 자격증명 접근, 행위: "통신사 인증서를 가진 불법 초소형 기지국(펨토셀)으로 가입자 단말 정보를 얻고 문자·ARS 결제 인증값을 가로챔(KT)", 탐지: "등록되지 않은 기지국·펨토셀 접속, 같은 기지국을 거친 결제 인증 급증 탐지" }
      - { idt: [IDT-AU-03.2], 단계: 자격증명 접근, 행위: "가입자 휴대폰이 갑자기 먹통이 된 뒤 피해가 신고되어 국내 첫 심스와핑 의심 사례로 수사(KT 가입자)", 탐지: "유심 변경·기기변경 직후의 금융·가상자산 계정 로그인 경보" }
      - { idt: [IDT-IM-01], 단계: 영향, 행위: "무단 소액결제로 결제 피해자 368명·2억 4,300만 원, 개인정보 유출 2만 2,227명(KT), 가상자산 거래소 계정에서 수천만~수억 원대 암호화폐 탈취 신고(KT 가입자)", 탐지: "인증 직후 고액 결제·출금 이상 거래 탐지" }
    chokepoints:
      - IDT-NH-01.2 — 통신 관리망 서버 계정 비밀번호 정기 교체·만료 설정과 비정상 로그인 정황의 즉시 신고·조사
      - IDT-CI-02 — 가입자 인증키를 하드웨어 보안 모듈로 보호하고 기지국·펨토셀 인증서 수명 단축(KT 사고 뒤 10년에서 1개월로)·접속 인가 통제
      - IDT-AU-03.2 — 유심 기기변경·재발급에 강한 본인확인(KT는 한동안 매장 방문으로만 처리)을 요구하고, 서비스 제공자는 문자 단독 인증을 줄임
