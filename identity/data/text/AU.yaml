# [AU] 인증 공격 — 신원 관점 문구
# 작성 규칙: oneline 50자 이내 명사형 · summary 2줄(① 공격자는 … 수 있음 ② 피해·탐지 곤란 사유) ·
#           reference(■ 신원 관점 / ■ 실제 사례) · detect(■ 탐지 / ■ 대응). 사례는 그 행에 매핑된 사고만, 수치는 사고 DB 요약에 있는 것만.

IDT-AU-01.1:
  oneline: 흔한 비밀번호를 많은 계정에 대입해 MFA 없는 계정 확보
  summary: |-
    - 공격자는 자주 쓰는 비밀번호 몇 개를 조직의 많은 계정에 천천히 대입해 잠금 정책을 피하면서 일부 계정에 로그인할 수 있음
    - 계정 하나당 시도가 적어 잠금·경보에 잘 걸리지 않고, MFA가 빠진 테스트·레거시·VPN 계정이 하나라도 있으면 그대로 발판이 됨
  reference: |-
    ■ 신원 관점
    - 대상: 클라우드 IdP·SaaS 로그인, MFA 없는 VPN, 레거시 인증(기본 인증·IMAP) 엔드포인트, 비프로덕션 테넌트·소셜 미디어 계정
    - 수법: 비밀번호 스프레이(T1110.003)·추측(T1110.001)·해시 크래킹(T1110.002), 주거용 프록시·Tor로 출발지 분산, SaaS 여러 곳에 같은 목록 대입(SAT1007)
    - 연계: 성공 계정의 MFA 미적용(IDT-AU-03.3)과 결합될 때 피해가 커짐 — 클라우드 CL-CA-01, OT OT-LM-04, 공급망 SCT-SC-03.2와 같은 기법
    ■ 실제 사례
    - [실제 사고] Microsoft 기업 메일 침해(2024-01): MFA 없는 레거시 테스트 테넌트 계정을 비밀번호 스프레이로 탈취해 경영진·보안팀 메일 열람으로 이어짐 (IDI-017, ATT&CK G0016)
    - [실제 사고] Peach Sandstorm 대규모 비밀번호 스프레이(2023-09): 위성·국방·제약 분야 수천 개 조직을 겨눠 일부 계정을 탈취하고 데이터를 반출 (IDI-035, ATT&CK G0064)
    - [실제 사고] Akira 랜섬웨어의 MFA 없는 Cisco VPN 대입 공격(2023-08): MFA를 적용하지 않은 VPN에 대입 공격으로 침투해 랜섬웨어로 이어짐 (IDI-092, ATT&CK G1024)
    - [실제 사고] Mandiant X 계정 무차별 대입 탈취(2024-01): 2단계 인증이 걸려 있지 않은 공식 계정이 탈취되어 암호화폐 사기 홍보에 쓰임 (IDI-059)
  detect: |-
    ■ 탐지
    - 같은 출발지·ASN에서 여러 계정으로 흩어진 로그인 실패, 계정별로는 적지만 테넌트 전체로는 급증한 실패율을 상관 분석
    - 성공 직후 새 국가·주거용 프록시·Tor 출발지 로그인, 레거시 프로토콜 인증 성공을 고위험 이벤트로 경보
    ■ 대응
    - 모든 외부 노출 앱·원격 접속·관리 계정에 MFA 적용(CIS 6.3·6.4, NIST IA-2(1)·IA-2(2), ISMS-P 2.5.3, CCM IAM-13)
    - 유출·흔한 비밀번호 차단 목록과 실패 횟수 제한·지능형 잠금 적용(NIST AC-7·IA-5(1), ISMS-P 2.5.4)
    - 레거시 인증 차단, 테스트·비프로덕션 테넌트 계정도 같은 정책 적용, 고유 비밀번호 사용(CIS 5.2)

IDT-AU-01.2:
  oneline: 유출·재사용 자격증명으로 정상 사용자처럼 로그인
  summary: |-
    - 공격자는 다른 곳에서 유출되거나 인포스틸러·다크웹에서 산 자격증명으로 VPN·SaaS·코드 저장소에 정상 사용자처럼 로그인할 수 있음
    - 정상 계정 로그인이라 침입 탐지가 어렵고, 오래전 유출된 비밀번호도 교체되지 않았다면 수년 뒤까지 유효함
  reference: |-
    ■ 신원 관점
    - 대상: VPN·원격 접속 포털, SaaS 데이터 플랫폼·협업 도구, 코드 저장소, 고객 지원 포털 등 단일 비밀번호로 열리는 업무 계정
    - 경로: 다른 사이트 유출 재사용, 인포스틸러 로그 구매(T1597.002), 공개된 자격증명 수집(T1589.001), 기업 계정 크리덴셜 스터핑(T1110.004)
    - 연계: 클라우드 CL-IA-07(유효 클라우드 계정 악용)·CL-CA-01, AI AI-07-02, OT OT-LM-02, 공급망 SCT-SC-03.2
    ■ 실제 사례
    - [실제 사고] Change Healthcare 랜섬웨어(2024-02): 탈취한 자격증명으로 MFA가 없던 Citrix 원격 접속 포털에 로그인해 9일 뒤 랜섬웨어 실행 (IDI-015)
    - [실제 사고] Colonial Pipeline 랜섬웨어(2021-05): 쓰지 않던 VPN 계정의 비밀번호가 다크웹 유출 묶음에서 발견되어 재사용이 의심됨 (IDI-014)
    - [실제 사고] Snowflake 고객 인스턴스 대량 데이터 탈취(2024-05): 인포스틸러에서 나온 고객 자격증명으로 약 165곳 인스턴스에 로그인, 일부는 교체되지 않은 오래된 자격증명 (IDI-016)
    - [실제 사고] HELLCAT 인포스틸러 유출 Jira 자격증명으로 연쇄 침해(2025-03): 협력사 직원 단말에서 유출된 자격증명이 여전히 유효해 Jira 침투에 쓰임 (IDI-069)
    - [위협인텔] Okta 고객 대상 대규모 크리덴셜 스터핑(2024-04): 유출 자격증명 목록과 주거용 프록시·Tor로 전례 없는 규모의 대입이 관찰됨 (IDI-100)
  detect: |-
    ■ 탐지
    - 유출 자격증명 모니터링(다크웹·인포스틸러 로그)과 사내 계정 대조, 일치 시 즉시 강제 재설정
    - 정상 로그인이지만 처음 보는 장치·위치·시간대, 사용자 이동 불가 위치(impossible travel), 대량 조회가 이어지는 세션을 이상 행위로 분석(NIST SI-4)
    ■ 대응
    - 원격 접속·외부 노출 SaaS에 피싱 저항 MFA 적용(CIS 6.3·6.4, NIST IA-2(1)·IA-2(2), ISMS-P 2.5.3, CCM IAM-13)
    - 비밀번호 재사용 금지·유출 비밀번호 차단 목록·자격증명 관리 절차(CIS 5.2, NIST IA-5(1), ISMS-P 2.5.4, CCM IAM-14)
    - SaaS 접속에 네트워크 허용 목록·장치 신뢰 조건 적용, 장기간 안 바뀐 비밀번호 일괄 교체

IDT-AU-02:
  oneline: 기본·하드코딩 관리자 비밀번호로 관리 화면·장비 장악
  summary: |-
    - 공격자는 제품 기본 비밀번호나 소스·설정에 박힌 고정 자격증명으로 관리 화면·서버·네트워크 장비에 관리자로 로그인할 수 있음
    - 같은 제품을 쓰는 모든 설치에 같은 값이 통해 대량 악용되기 쉽고, 사람 계정이 아니라 퇴사·교체 절차에서도 빠짐
  reference: |-
    ■ 신원 관점
    - 대상: 고객 인증·관리 시스템의 웹 관리자 계정, 방화벽·VPN·백업·헬프데스크 제품의 내장 계정, OT 장비 기본 계정
    - 형태: 설치 후 바꾸지 않은 기본값('admin' 등), 제품에 하드코딩된 계정·암호 키, 여러 사람이 나눠 쓰는 공유 계정(NHI9)
    - 연계: OT OT-LM-03(기본·하드코딩 자격증명), 공급망 SCT-SC-01.1(코드 속 하드코딩 비밀)
    ■ 실제 사례
    - [실제 사고] LG유플러스 고객정보 29만여 건 유출(2023-01): 고객인증시스템 웹 관리자 계정 비밀번호가 기본값 'admin'으로 설정된 채 방치 (IDI-043)
    - [실제 사고] Volt Typhoon의 도메인 자격증명 반복 탈취(2024-02): 도메인에 연결된 OT 자산에 장비 제조사 기본 자격증명을 시험 (IDI-095, ATT&CK G1017)
    - [공개 취약점] 하드코딩·기본 자격증명 KEV 판정 14건: Zyxel 방화벽·VPN 하드코딩 계정(CVE-2020-29583), SolarWinds Web Help Desk(CVE-2024-28987), Cisco 방화벽 관리 센터(CVE-2026-20316) 등
  detect: |-
    ■ 탐지
    - 자산 스캔으로 기본 비밀번호 로그인 가능 여부 정기 점검, 공개된 하드코딩 자격증명 KEV 등재 제품 보유 여부 대조
    - 관리 화면에 처음 보는 출발지에서 내장·공유 계정 로그인 성공 경보
    ■ 대응
    - 설치 즉시 기본 비밀번호 변경·고유 비밀번호 강제, 공유 계정 금지(CIS 5.2, NIST IA-5(1), ISMS-P 2.5.4, CCM IAM-02·IAM-12)
    - 관리자 권한은 전용 관리자 계정으로만, 관리 화면은 관리망·VPN 뒤로(CIS 5.4, ISMS-P 2.5.5)
    - 하드코딩 자격증명 KEV 공지 시 패치·계정 비활성화, 코드·이미지에 고정 비밀 금지(NIST IA-5(7)·CM-6)

IDT-AU-03.1:
  oneline: MFA 승인 요청을 반복해 피로해진 사용자의 승인 유도
  summary: |-
    - 공격자는 탈취한 비밀번호로 로그인을 반복해 MFA 푸시를 쏟아내거나 지원 인력을 사칭해 연락하면서 사용자가 승인하게 만들 수 있음
    - 사용자가 직접 승인하므로 MFA 로그상 정상 인증으로 남고, 단순 승인형 푸시·전화 MFA는 이 수법에 취약함
  reference: |-
    ■ 신원 관점
    - 대상: 단순 승인(예/아니오) 푸시·전화형 MFA를 쓰는 SSO·VPN 계정, 특히 협력사·지원 인력 계정
    - 수법: MFA 요청 생성 반복(T1621), 메신저·전화로 '보안팀'을 사칭해 승인·코드 입력 요구, 승인 후 자체 MFA 장치 추가 등록
    - 연계: 클라우드 CL-CA-02(중간자 공격 및 MFA 피로 공격), 후속 단계 IDT-PE-02.2(MFA 장치 추가)
    ■ 실제 사례
    - [실제 사고] Uber 내부망 침해(2022-09): 다크웹에서 산 협력사 비밀번호로 로그인을 반복해 2단계 인증 승인 요청을 보냈고 협력사 직원이 결국 승인 (IDI-002, ATT&CK G1004)
    - [실제 사고] Cisco 사내망 침해(2022-08): 지원 조직을 사칭한 음성 피싱과 반복된 MFA 푸시로 직원이 승인해 VPN 접속 허용 (IDI-003)
    - [실제 사고] 이란 연계 행위자 무차별 대입·MFA 푸시 폭탄·MFA 장치 등록(2024-10): 비밀번호 스프레이와 MFA 푸시 폭탄으로 계정을 탈취하고 자기 장치를 MFA에 등록 (IDI-093)
    - [실제 사고] 러시아 SVR의 클라우드 초기 접근 수법 변화(2024-02): MFA 피로 공격으로 우회한 뒤 자기 장치를 테넌트에 등록 (IDI-094, ATT&CK G0016)
  detect: |-
    ■ 탐지
    - 짧은 시간 안에 같은 사용자에게 거부·무응답 MFA 요청이 반복된 뒤 승인된 사건을 고위험으로 경보
    - MFA 승인 직후 새 장치·새 MFA 방법 등록, 처음 보는 위치의 세션 생성을 연계 탐지
    ■ 대응
    - 숫자 대조(number matching)·위치 표시가 있는 MFA 또는 FIDO2 등 피싱 저항 인증으로 전환(NIST IA-2(8), CCM IAM-13)
    - 원격 접속·관리자 접근에 MFA 필수와 반복 요청 제한(CIS 6.3·6.4·6.5, NIST IA-2(1)·IA-2(2), ISMS-P 2.5.3)
    - 사용자에게 '요청하지 않은 MFA는 거부·신고' 교육과 신고 창구 운영

IDT-AU-03.2:
  oneline: SIM 스와핑·SMS 가로채기로 문자 OTP 탈취해 계정 장악
  summary: |-
    - 공격자는 통신사 직원·절차를 속여 피해자 번호로 새 SIM을 발급받거나 문자를 가로채 SMS·음성 일회용 코드를 받아 계정을 넘길 수 있음
    - 피해자는 휴대폰이 먹통이 된 뒤에야 알아채고, 문자 인증에 묶인 금융·거래소·SNS 계정이 연달아 털림
  reference: |-
    ■ 신원 관점
    - 대상: SMS·음성 OTP로 로그인·복구하는 고객 계정(가상자산 거래소·SNS), 관리자 휴대폰 번호
    - 경로: 위조 신분증으로 SIM 재발급(심스와핑), 불법 기지국·악성 앱의 문자 가로채기(T1111), 통신 가입자 인증 체계 침해(IDT-CI-02)
    - 기준: NIST SP 800-63B는 전화망(SMS·음성) 대역 외 인증을 제한적 인증 수단으로 분류
    ■ 실제 사례
    - [실제 사고] KT 가입자 심스와핑 의심 가상자산 탈취(2022-01): 휴대폰이 먹통이 된 뒤 거래소 계정에서 수천만 원에서 수억 원대 암호화폐가 탈취됐다는 신고가 이어짐 (IDI-047)
    - [실제 사고] 미 SEC X 계정 장악(2024-01): 위조 신분증으로 연결 전화번호의 대체 SIM을 받아 계정을 장악하고 가짜 승인 게시물 게시 (IDI-058)
    - [실제 사고] KT 불법 펨토셀 경유 결제 인증 탈취·무단 소액결제(2025-09): 문자·ARS 결제 인증값을 가로채 결제 피해자 368명 발생 (IDI-041)
    - [실제 사고] LAPSUS$ 연쇄 침해(2022-03): SIM 스와핑을 포함한 수법으로 여러 대기업 계정을 장악 (IDI-001, ATT&CK G1004)
  detect: |-
    ■ 탐지
    - 통신사 번호 이동·SIM 변경 이벤트 조회(가능한 경우)와 직후 비밀번호 재설정·새 기기 로그인 연계
    - 고객 계정에서 SMS 복구 직후 출금·연락처 변경이 이어지는 패턴을 이상거래로 차단
    ■ 대응
    - 고위험 계정은 SMS·음성 OTP 대신 인증 앱·FIDO2로 전환, SMS 복구 경로 제거(NIST IA-2(1)·IA-2(2)·IA-2(13), CCM IAM-13)
    - 외부 노출 서비스의 MFA 수단 다변화와 SIM 변경 직후 고위험 거래 지연(CIS 6.3, ISMS-P 2.5.3)
    - 관리자·공식 계정에 연결된 번호는 통신사 잠금(번호 이동 비밀번호) 설정

IDT-AU-03.3:
  oneline: MFA 없는 원격 접속·SaaS·레거시 경로로 단일 비밀번호 침투
  summary: |-
    - 공격자는 MFA가 빠진 VPN·원격 접속 포털·SaaS·테스트 테넌트·레거시 인증 경로를 찾아 비밀번호 하나로 조직 안에 들어갈 수 있음
    - 대부분 계정에 MFA가 있어도 예외 계정 하나가 전체의 입구가 되며, 예외는 인벤토리에서 빠져 있어 점검에서 누락되기 쉬움
  reference: |-
    ■ 신원 관점
    - 대상: 레거시 VPN 계정, Citrix 등 원격 데스크톱 포털, SaaS 데이터 플랫폼 로컬 계정, 비프로덕션 테넌트, 공식 SNS 계정, 클라우드 관리자 계정
    - 경로: 유효 계정(T1078)·외부 원격 서비스(T1133), MFA 다운그레이드·앱 비밀번호 피싱(SAT1045·SAT1050), MFA 우회 결함(CVE-2020-12812)
    - 연계: 클라우드 CL-IA-07, OT OT-IA-02(외부 원격 접속 서비스 악용)
    ■ 실제 사례
    - [실제 사고] Change Healthcare 랜섬웨어(2024-02): MFA가 없던 Citrix 원격 접속 포털이 침투 경로가 되어 미국 전역의 청구·자격 확인 업무가 마비됨 (IDI-015)
    - [실제 사고] Snowflake 고객 인스턴스 대량 데이터 탈취(2024-05): MFA와 접속 허용 목록이 없는 고객 인스턴스 약 165곳에 로그인해 데이터를 반출·갈취 (IDI-016)
    - [실제 사고] Medibank 고객 970만 명 정보 유출(2022-10): 기기 인증서나 사용자 이름·비밀번호만으로 접속되던 VPN으로 침투 (IDI-018)
    - [실제 사고] Storm-0501 하이브리드 환경 랜섬웨어(2024-09): MFA가 없는 클라우드 관리자 계정으로 클라우드에 들어가 자원·백업 삭제 (IDI-022, ATT&CK G1053)
    - [공개 취약점] FortiOS SSL VPN 2단계 인증 우회(CVE-2020-12812): 사용자 이름 대소문자만 바꿔 2단계 인증을 건너뛰는 결함 — KEV 판정 1건
    - [시연] SAT1045 MFA 다운그레이드: 여러 인증 수단을 허용하는 IdP에서 약한 수단으로 바꿔 인증하는 공개 시연
  detect: |-
    ■ 탐지
    - IdP·VPN 로그에서 MFA 없이 성공한 로그인(단일 요소·레거시 프로토콜·앱 비밀번호)을 일 단위로 집계해 예외 계정 추적
    - 원격 접속·SaaS 계정 인벤토리와 MFA 적용 현황을 대조해 미적용 계정 목록 자동 보고
    ■ 대응
    - 외부 노출 앱·원격 네트워크 접속·관리자 접근 MFA 예외 없이 적용(CIS 6.3·6.4·6.5, NIST IA-2(1)·IA-2(2)·AC-17, ISMS-P 2.5.3·2.6.6, CCM IAM-13)
    - 레거시 인증·앱 비밀번호 차단, 피싱 저항 수단만 허용하는 인증 강도 정책
    - 쓰지 않는 원격 접속 계정·테스트 테넌트 정리, 신규 SaaS 도입 시 SSO·MFA 연동을 조건으로

IDT-AU-04.1:
  oneline: VPN·게이트웨이 인증 우회로 경계 장비와 내부망 장악
  summary: |-
    - 공격자는 VPN·원격 접속 게이트웨이·방화벽 관리면의 인증 우회·자격증명 노출 취약점으로 로그인 없이 장비를 장악할 수 있음
    - 장비를 지나는 모든 사용자의 자격증명·세션이 함께 노출되고, 패치 후에도 이미 샌 자격증명·심어진 백도어가 남음
  reference: |-
    ■ 신원 관점
    - 대상: SSL VPN(Fortinet·Ivanti·SonicWall·Check Point), 원격 지원 도구, 방화벽·ADC 관리 인터페이스
    - 형태: 인증 우회(T1556.004·T1190), 경로 조작으로 자격증명 파일 노출, 게이트웨이에 자격증명 수집 코드 삽입 — KEV 판정 39건으로 신원 KEV 중 가장 많음
    - 연계: 클라우드 CL-IA-01·CL-IA-02, OT OT-IA-02, 세션 노출형은 IDT-TS-01.3
    ■ 실제 사례
    - [실제 사고] Ivanti Connect Secure 인증 우회 제로데이 대량 악용(2024-01): 인증 우회와 명령 주입을 연결한 공격이 확산되어 CISA가 첫 긴급 지시로 장비 분리를 명령 (IDI-087, CVE-2023-46805)
    - [실제 사고] FortiGate SSL-VPN 장비 8만 7천 대의 VPN 자격증명 공개 유출(2021-09): 경로 조작 취약점으로 수집된 자격증명 약 50만 건이 공개되어 패치 후에도 비밀번호 재설정 필요 (IDI-091, CVE-2018-13379)
    - [공개 취약점] 원격 접속·경계 장비 KEV 판정 39건: PAN-OS 관리 인터페이스 인증 우회(CVE-2024-0012), FortiOS 인증 우회(CVE-2024-55591), ScreenConnect 인증 우회(CVE-2024-1709) 등
  detect: |-
    ■ 탐지
    - 경계 장비 무결성 점검 도구·제조사 IoC로 웹셸·변조 파일 확인, 관리 인터페이스의 인증 없는 API 호출 탐지
    - 장비 로그에서 처음 보는 관리자 세션·설정 내보내기, VPN 사용자 세션의 출발지 급변을 SIEM으로 연계
    ■ 대응
    - KEV 등재 경계 장비 취약점 우선 패치·장비 분리 기준 운영(NIST SI-2·RA-5), 관리 인터페이스 인터넷 노출 금지
    - 침해 의심 시 장비 재설치와 함께 장비를 지난 계정 비밀번호·세션·인증서 전면 교체(NIST AC-17, ISMS-P 2.6.6)
    - 원격 접속 MFA와 인증·인가 시스템 인벤토리 유지(CIS 6.4·6.6, CCM IAM-13·IAM-15)

IDT-AU-04.2:
  oneline: IdP·SSO 검증 결함으로 임의 사용자·관리자 명의 인증
  summary: |-
    - 공격자는 IdP·SSO 제품이나 연동 앱의 토큰·클레임 검증 결함을 이용해 다른 테넌트·사용자, 심지어 전역 관리자로 인증할 수 있음
    - 인증 결정 자체가 틀리므로 MFA·조건부 액세스가 적용되지 않고, 로그가 남지 않거나 정상 로그인으로 보일 수 있음
  reference: |-
    ■ 신원 관점
    - 대상: 클라우드 IdP 토큰 검증, SAML·OIDC 연동 앱(RP), 셀프 비밀번호 재설정·접근 관리 제품, SSO 기능을 가진 네트워크 장비
    - 형태: 서명 검증 우회(T1606), 변경 가능한 이메일 클레임 신뢰(nOAuth, SAT1025), SAML 연동 악용(SAT1032), IdP 제품 원격 코드 실행(T1190·T1212)
    - 연계: 클라우드 CL-CA-04(인증 자료 위조), 서명 키 탈취형은 IDT-TS-03.3
    ■ 실제 사례
    - 공개 사고 미확인 — 아래 실증·취약점은 악용 가능성이 확인된 사례이며 사고 경위로 공개된 침해는 아직 확인되지 않음
    - [실증] Entra ID Actor 토큰 결함(2025-09): 공격자 테넌트에서 받은 토큰으로 다른 테넌트의 전역 관리자를 사칭할 수 있었고 조건부 액세스가 적용되지 않음 (IDI-120)
    - [실증] nOAuth(2023-06): 이메일 클레임으로 사용자를 식별·병합하는 연동 앱에서 피해자 계정을 장악할 수 있음이 실제 서비스 여러 곳에서 확인됨 (IDI-121)
    - [공개 취약점] IdP·SSO 제품 KEV 판정 12건: PAN-OS SAML 서명 검증 우회(CVE-2020-2021), ManageEngine ADSelfService Plus 인증 우회(CVE-2021-40539), VMware Workspace ONE Access(CVE-2022-22954) 등
  detect: |-
    ■ 탐지
    - IdP 감사 로그의 비정상 토큰 발급자·대상(audience)·테넌트 클레임, 연동 앱에서 이메일 변경 직후 계정 병합 이벤트 점검
    - IdP 공급자·제품 보안 공지 구독과 KEV 등재 즉시 노출 여부 점검
    ■ 대응
    - 연동 앱은 변경 불가능한 식별자(sub·oid)로 사용자를 식별하고 서명·발급자·대상 검증 필수(NIST IA-8, ISMS-P 2.5.3)
    - IdP·인가 서버를 핵심 자산으로 분류해 패치·구성 기준선 관리(NIST IA-13·SI-2, CCM IAM-15)
    - 인증·인가 시스템 인벤토리와 중앙 접근 통제(CIS 6.6·6.7)

IDT-AU-05:
  oneline: 계정·테넌트 열거로 대입·피싱 표적 선별
  summary: |-
    - 공격자는 로그인 응답 차이·공개 디렉터리·DNS·SAML 설정으로 유효 계정과 테넌트·연동 앱을 열거해 대입·피싱 표적을 고를 수 있음
    - 대부분 인증 전 공개 정보라 막기 어렵고, 열거 자체는 피해가 없어 경보 우선순위에서 밀림
  reference: |-
    ■ 신원 관점
    - 대상: 클라우드 IdP 로그인 응답, SaaS 테넌트 하위 도메인·슬러그, SAML 메타데이터, 탈취 계정에서 보이는 디렉터리
    - 수법: 이메일 수집(T1589.002), 클라우드·도메인 계정 열거(T1087.004·T1087.002), 사용자 이름·테넌트·SAML 열거(SAT1038·SAT1035·SAT1031)
    - 연계: 클라우드 CL-DS-01(클라우드 계정·권한 탐색), AI AI-01-01(AI 대상 정찰)
    ■ 실제 사례
    - [실제 사고] Peach Sandstorm 대규모 비밀번호 스프레이(2023-09): 탈취 계정으로 Azure AD 정보를 수집하고 AzureHound·ROADtools로 탐색 (IDI-035, ATT&CK G0064)
    - [시연] SAT1038 사용자 이름 열거·SAT1031 SAML 열거: 로그인 응답과 SSO 설정만으로 유효 계정과 IdP를 알아내는 공개 시연
  detect: |-
    ■ 탐지
    - 존재하지 않는 계정 대상 로그인 시도 비율 급증, 같은 출발지의 순차 사용자 이름 조회
    - 내부 계정의 대량 디렉터리 조회(그래프 API·LDAP) 도구 사용 흔적(NIST SI-4)
    ■ 대응
    - 로그인·복구 응답을 계정 존재 여부와 무관하게 동일하게 하고 속도 제한(NIST AC-7)
    - 사용자 식별자 체계와 공개 정보 최소화(ISMS-P 2.5.2, CCM IAM-12), 인증 시스템 노출 지점 인벤토리(CIS 6.6)
