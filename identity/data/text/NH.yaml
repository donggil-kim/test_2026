# [NH] 비인간 신원(NHI) — 신원 관점 문구
# 작성 규칙: oneline 50자 이내 명사형 · summary 2줄(① 공격자는 … 수 있음 ② 피해·탐지 곤란 사유) ·
#           reference(■ 신원 관점 / ■ 실제 사례) · detect(■ 탐지 / ■ 대응). 사례는 그 행에 매핑된 사고만, 수치는 사고 DB 요약에 있는 것만.
#           DI 도메인과 같이 공격 수법 설명은 줄이고 침해 지점·실제 사례·탐지·대응 위주로 씀.

IDT-NH-01.1:
  oneline: MFA 없는 장기 액세스 키·API 키 하나로 고객 데이터·인프라 접근
  summary: |-
    - 공격자는 코드·설정·연동 시스템에서 새거나 탈취한 장기 액세스 키·API 키·토큰으로 MFA 없이 클라우드·SaaS·원격 지원 인프라에 바로 접근할 수 있음
    - 키에 붙은 권한이 넓고 만료가 없어 한 번 새면 오래 쓰이며, 사람 로그인이 아니라 이상 로그인 탐지·MFA가 적용되지 않음
  reference: |-
    ■ 신원 관점
    - 침해 지점: 클라우드 액세스 키·SaaS API 키·개인 접근 토큰(T1550.001·T1078.004), 파일·저장소 속 키(T1552.001), 원격 지원 SaaS 인프라 키, 블록체인 검증자 서명 키
    - 조건: 만료 없는 장기 비밀(NHI7), 조직 전체 권한을 가진 과다 권한 키(NHI5), 코드·이미지·공개 저장소로 새어 나간 비밀(NHI2)
    - 연계: 노출(IDT-CR-02.1)에서 시작해 교체 실패(IDT-NH-01.2)로 길어짐 — 클라우드 CL-IA-07·CL-CA-05, AI AI-07-01·AI-07-02, 공급망 SCT-SC-02.3
    ■ 실제 사례
    - [실제 사고] BeyondTrust 원격 지원 SaaS API 키 탈취로 미 재무부 등 고객 17곳 침해(2024-12): 인프라 API 키로 고객 인스턴스의 로컬 애플리케이션 비밀번호를 재설정해 미 재무부 단말에 원격 접근 (IDI-084)
    - [실제 사고] OneLogin 미국 데이터센터 고객 데이터 침해(2017-05): 탈취한 AWS 키로 IdP 서비스 클라우드에 인스턴스를 만들어 약 7시간 정찰하고 사용자·앱·키 정보 DB에 접근 (IDI-081)
    - [실제 사고] Ronin 브리지 6억 달러대 탈취(2022-03): 검증자 키 9개 중 5개를 확보해 약 6억 달러 상당 암호화폐를 인출 (IDI-113, ATT&CK G0032)
    - [실제 사고] New York Times 소스 코드 270GB 유출(2024-01): 노출된 GitHub 토큰으로 조직 전체 저장소에 접근해 약 270GB를 빼내 공개 (IDI-108)
    - [실제 사고] Storm-2139 — 노출된 고객 API 키로 생성형 AI 서비스 탈취·재판매(2025-02): 공개된 곳에서 수집한 API 키로 생성형 AI 서비스에 접근하고 접근권을 재판매 (IDI-115)
    - [실제 사고] Sisense 침해(2024-04): 고객 데이터 원천 접속용 자격증명·토큰·인증서가 노출되어 CISA가 고객에게 관련 자격증명 전부 교체를 권고 (IDI-039)
    - [실증] Microsoft AI 연구조직 과다 권한 SAS 토큰 노출(2023-06): 저장소 계정 전체에 권한을 주는 토큰 링크로 직원 단말 백업·비밀·키 등 38TB가 노출 (IDI-123)
    - [공개 취약점] 원격 지원 제품 명령 주입(CVE-2024-12356) — KEV 판정 1건, 원격 지원 SaaS API 키 탈취 사건 조사 중 발견
    - [시연] SAT1005 API 비밀 탈취: Postman에서 연동용으로 저장한 API 키를 다시 읽어 내는 공개 시연
  detect: |-
    ■ 탐지
    - 키·토큰별 사용 출발지·호출 API·시간대 기준선을 두고 처음 보는 IP·국가·대량 조회를 경보, 노출이 확인되면 노출 시점 이후 사용 이력 조회
    - 저장소·이미지·공개 코드 사이트의 키 패턴 스캔, 공급업체 침해 공지 때 해당 연동 키 사용 내역 즉시 점검
    ■ 대응
    - 장기 키를 단기 토큰·워크로드 신원으로 대체하고 남는 키는 권한 최소화·만료 설정·정기 교체(CIS 5.5, NIST IA-5(13)·AC-6·SC-12, ISMS-P 2.5.5·2.7.2, CCM IAM-14·IAM-05·CEK-12)
    - 서비스 간 인증에 출발지 제한·상호 인증을 더하고 비인간 신원 인벤토리로 소유자·용도 관리(NIST IA-9)

IDT-NH-01.2:
  oneline: 샌 비밀·퇴사자 키를 교체·폐기하지 않아 침해 뒤에도 재침투 허용
  summary: |-
    - 공격자는 이미 유출됐거나 침해 대응에서 빠진 토큰·서비스 계정 비밀번호·서명 키가 계속 유효한 점을 이용해 대응이 끝난 뒤에도 다시 접근할 수 있음
    - 어떤 비밀이 어디에 쓰이는지 모르면 교체 대상을 빠뜨리기 쉽고, 퇴사자·협력사가 쓰던 키나 수년 전 유출된 비밀번호가 사고의 시작점이 됨
  reference: |-
    ■ 신원 관점
    - 침해 지점: 침해 대응 뒤 남은 서비스 토큰·API 토큰(T1550.001), 오랫동안 바뀌지 않은 서버·클라우드 계정 비밀번호(T1078.004), 퇴사자가 알던 토큰 서명 키·위임 서명 권한
    - 조건: 비밀 인벤토리·소유자 부재로 교체 범위 산정 실패, 만료 없는 장기 비밀(NHI7), 퇴사·계약 종료 때 비인간 신원 회수 누락(NHI1)
    - 연계: 장기 키 악용(IDT-NH-01.1)·퇴사자 권한 미회수(IDT-LC-01.1)와 겹침 — 공급망 SCT-SC-02.3
    ■ 실제 사례
    - [실제 사고] 쿠팡 고객 계정 정보 3,367만 건 유출(2025-11): 퇴사자가 쓰던 토큰 서명키를 갱신하지 않고 키 발급 이력도 관리하지 않아 퇴사 개발자가 약 8개월간 고객 정보를 조회 (IDI-042)
    - [실제 사고] SK텔레콤 유심 정보 2,696만 건 유출(2025-04): 시스템 관리망 서버 계정 비밀번호를 바꾸지 않고 만료일도 두지 않는 등 계정 관리 부실이 지적됨 (IDI-040)
    - [실제 사고] Cloudflare 내부 Atlassian 침해(2023-11): Okta 침해 때 유출된 것 가운데 쓰지 않는다고 잘못 판단해 교체하지 않은 서비스 토큰 1개와 서비스 계정 자격증명 3개로 침투 (IDI-020)
    - [실제 사고] Internet Archive 연쇄 침해(2024-10): 침해 뒤에도 교체하지 않은 Zendesk API 토큰으로 다시 들어가 지원 요청 첨부 신분증 등에 접근 (IDI-109)
    - [실제 사고] Snowflake 고객 인스턴스 대량 데이터 탈취(2024-05): 쓰인 고객 자격증명 일부가 2020년 유출 이후 교체되지 않은 상태 (IDI-016)
    - [실제 사고] HELLCAT 인포스틸러 유출 Jira 자격증명으로 연쇄 침해(2025-03): 협력사 직원 단말에서 2021년에 유출된 자격증명이 여전히 유효 (IDI-069)
    - [실제 사고] Ronin 브리지 6억 달러대 탈취(2022-03): 일시적 부하 대응을 위해 위임한 서명 권한을 회수하지 않아 다섯 번째 검증자 키로 쓰임 (IDI-113, ATT&CK G0032)
  detect: |-
    ■ 탐지
    - 침해 공지·유출 확인 이후에도 쓰이는 토큰·키를 식별하고 교체 완료 여부를 실제 사용 로그로 검증
    - 퇴사·계약 종료 인력과 연결된 키·토큰의 사용, 오랫동안 바뀌지 않은 서비스 계정 비밀번호를 정기 점검
    ■ 대응
    - 비밀 인벤토리에 소유자·용도·만료일을 기록하고 정기 교체·자동 만료 적용(CIS 5.5, NIST IA-5·IA-5(13), ISMS-P 2.7.2, CCM CEK-12)
    - 침해 대응·퇴사 때 관련 비밀·서명 키를 전수 폐기·재발급하고 계정 비활성화(CIS 6.2, NIST AC-2(3), ISMS-P 2.5.1, CCM CEK-13·IAM-07)

IDT-NH-02.1:
  oneline: MFA 예외인 고권한 서비스 계정 탈취로 고객 DB·지원 시스템 장악
  summary: |-
    - 공격자는 MFA가 없고 권한이 넓은 서비스 계정이나 사람이 대화형으로 쓰는 시스템 계정을 탈취해 고객 DB·지원 시스템·클라우드 관리 기능에 접근할 수 있음
    - 서비스 계정은 자동화 때문에 MFA·로그인 제한에서 빠지는 경우가 많고, 사람이 개인 브라우저에 그 자격증명을 저장하면 회사 통제 밖에서 털림
  reference: |-
    ■ 신원 관점
    - 침해 지점: 도메인·클라우드 서비스 계정(T1078.002·T1078.004), 자동 구성 도구·동기화 서버의 고권한 계정, 지원 시스템 서비스 계정
    - 조건: 사람이 서비스 계정에 직접 로그인해 사용(NHI10), 한 계정을 여러 시스템에 재사용(NHI9), 전역 관리자급 과다 권한(NHI5)
    - 연계: 동기화 서버 장악(IDT-DI-02)·IdP 공급업체 침해(IDT-DI-03.1)의 핵심 고리 — ATT&CK에 APT29(G0016)·Storm-0501(G1053) 절차 수록
    ■ 실제 사례
    - [실제 사고] Dropbox Sign 고객 DB 침해(2024-04): 자동 시스템 구성 도구에 접근해 백엔드의 높은 권한을 가진 서비스 계정으로 고객 DB에 들어가 전 사용자의 이메일·사용자 이름 등이 노출 (IDI-038)
    - [실제 사고] Okta 지원 시스템 침해(2023-10): 직원이 개인 Google 계정에 저장한 지원 시스템 서비스 계정 자격증명이 탈취되어 고객 134곳에 영향 (IDI-019)
    - [실제 사고] Storm-0501 하이브리드 환경 랜섬웨어(2024-09): 전역 관리자 역할이 붙은 동기화 비인간 계정을 장악해 데이터 반출·삭제와 백업 파괴 뒤 갈취 (IDI-022, ATT&CK G1053)
    - [실제 사고] 러시아 SVR의 클라우드 초기 접근 수법 변화(2024-02): 비밀번호 스프레이·대입으로 시스템 계정과 휴면 계정을 탈취 (IDI-094, ATT&CK G0016)
  detect: |-
    ■ 탐지
    - 서비스 계정의 대화형 로그인, 평소와 다른 출발지·시간대, 정해진 작업 밖의 API 호출을 경보
    - 서비스 계정 인벤토리에 없는 계정 사용, 한 서비스 계정이 여러 시스템에서 동시에 쓰이는 패턴 점검
    ■ 대응
    - 서비스 계정 인벤토리로 소유자·용도·권한을 관리하고 대화형 로그인 금지·출발지 제한(CIS 5.5, NIST IA-9·AC-2, ISMS-P 2.5.1, CCM IAM-03)
    - 서비스 계정 권한을 작업 범위로 줄이고 관리자급 서비스 계정은 특권 계정으로 분리 관리(CIS 5.4, NIST AC-6, ISMS-P 2.5.5, CCM IAM-05)

IDT-NH-02.2:
  oneline: 과다 권한 워크로드 역할·느슨한 신뢰 설정으로 클라우드 데이터 대량 접근
  summary: |-
    - 공격자는 웹 서비스·CI 작업 같은 워크로드에서 메타데이터 서비스나 OIDC 신뢰로 역할 자격증명을 얻어, 그 역할에 붙은 넓은 권한으로 저장소·데이터에 접근할 수 있음
    - 워크로드 역할은 사람이 보지 않는 곳에서 자동으로 발급되고, 권한이 과다하면 애플리케이션 결함 하나가 대량 유출로 직결됨
  reference: |-
    ■ 신원 관점
    - 침해 지점: 인스턴스 메타데이터 서비스의 역할 자격증명(T1552.005), 워크로드 역할·클라우드 계정(T1078.004), CI/CD의 OIDC 신뢰 조건
    - 조건: 실제 필요보다 넓은 역할 권한(NHI5), 메타데이터 서비스 보호 미적용 같은 배포 구성 결함(NHI6), 개발·운영 환경의 신원 혼용(NHI8)
    - 연계: 클라우드 CL-CA-06(메타데이터 경유 자격증명 탈취)·CL-PV-01, 공급망 SCT-SC-02.2(OIDC 신뢰 게시 자격 탈취)
    ■ 실제 사례
    - [실제 사고] Capital One 1억 600만 명 정보 유출(2019-07): 웹 방화벽 SSRF로 메타데이터 서비스에서 얻은 역할 자격증명에 고객 데이터 버킷 조회 권한까지 붙어 있어 약 1억 600만 명 정보 유출 (IDI-112)
  detect: |-
    ■ 탐지
    - 워크로드 역할 자격증명이 해당 인스턴스·작업 밖에서 쓰이는 경우, 평소와 다른 저장소 나열·대량 조회를 경보
    - OIDC 신뢰 정책의 조건(저장소·브랜치·환경) 누락과 와일드카드를 정기 점검
    ■ 대응
    - 워크로드 역할을 작업별 최소 권한으로 나누고 데이터 접근은 별도 역할로 분리(CIS 6.8, NIST AC-6, ISMS-P 2.5.5, CCM IAM-05·IAM-15)
    - 메타데이터 서비스 보호 기능 적용과 신뢰 정책 기준선 관리(NIST CM-6·IA-9)

IDT-NH-03.1:
  oneline: SaaS 연동 공급자의 OAuth 토큰 탈취로 여러 고객 조직 데이터 연쇄 접근
  summary: |-
    - 공격자는 SaaS 연동 앱 공급자가 보관한 OAuth·리프레시 토큰을 탈취해 그 앱을 연결한 여러 조직의 SaaS·코드 저장소에 사용자 로그인 없이 접근할 수 있음
    - 토큰은 피해 조직의 MFA·로그인 정책을 거치지 않고, 연동 앱의 정상 API 호출처럼 보여 공급자 공지 전까지 알기 어려움
  reference: |-
    ■ 신원 관점
    - 침해 지점: 연동 공급자가 보관한 OAuth 액세스·리프레시 토큰(T1528·T1550.001), 테넌트 단위 시스템 연동(SAT1036), 연동 공급자와의 신뢰 관계(T1199)
    - 조건: 취약한 서드파티 비인간 신원(NHI3), 수명이 긴 리프레시 토큰(NHI7), 연동 앱에 필요 이상 범위의 권한 승인
    - 연계: 공급업체 경유 연쇄 탈취(IDT-IM-05)로 번짐 — 클라우드 CL-PE-03·CL-IA-06, AI AI-07-02, 공급망 SCT-CS-03.1
    ■ 실제 사례
    - [실제 사고] Salesloft Drift 연동 OAuth 토큰 탈취로 Salesforce 인스턴스 대량 데이터 반출(2025-08): 연동용 OAuth·리프레시 토큰으로 여러 조직의 Salesforce 데이터를 반출하고 그 안의 AWS 키·Snowflake 토큰 등 자격증명을 찾아냄 (IDI-037)
    - [실제 사고] Heroku·Travis CI 발급 GitHub OAuth 토큰 탈취로 비공개 저장소 반출(2022-04): 연동 서비스에 발급된 GitHub OAuth 사용자 토큰으로 npm 등 수십 개 조직의 비공개 저장소를 복제 (IDI-106)
    - [시연] SAT1027 OAuth 토큰·SAT1036 시스템 연동: Microsoft Graph Explorer·Slack에서 임의 권한 토큰과 테넌트 단위 연동으로 장기 접근을 유지하는 공개 시연
  detect: |-
    ■ 탐지
    - 연동 앱 토큰의 평소와 다른 출발지 IP·대량 조회·내보내기 API 호출을 경보, 연동 공급자 침해 공지 즉시 해당 앱 토큰 사용 이력 점검
    - 승인된 연동 앱 목록과 실제 토큰 발급 현황을 정기 대조
    ■ 대응
    - 연동 앱 승인은 관리자 검토로 제한하고 권한 범위·토큰 수명 최소화, 미사용 연동 정기 정리(CIS 6.6, NIST AC-6, ISMS-P 2.5.5, CCM IAM-14)
    - 연동 공급자를 공급망으로 관리해 보안 요구 사항·침해 통지 의무를 계약에 넣고, 침해 시 토큰 전수 폐기 절차 준비(NIST SA-9·IA-9, ISMS-P 2.3.3, CCM STA-09)

IDT-NH-03.2:
  oneline: 악성·과다 권한 OAuth 앱으로 사용자 MFA와 무관한 조직 데이터 지속 접근
  summary: |-
    - 공격자는 탈취한 계정·관리 권한으로 OAuth 앱을 새로 만들거나 기존 앱에 높은 권한과 자격증명을 붙여 조직 전체 메일함·SaaS 데이터에 앱 명의로 접근할 수 있음
    - 앱 권한은 사용자 비밀번호·MFA 변경과 무관하게 유지되고, 정상 연동 앱처럼 보여 승인된 앱 목록을 따로 검토하지 않으면 드러나지 않음
  reference: |-
    ■ 신원 관점
    - 침해 지점: 클라우드 앱 통합(T1671), 앱·서비스 주체에 추가된 역할(T1098.003)·자격증명(T1098.001), 변조된 연결 앱, 정상 앱을 흉내 낸 연동(SAT1016)
    - 조건: 사용자 동의만으로 앱 등록·승인 가능, 레거시·테스트 앱의 과다 권한 방치(NHI5), 앱 권한 정기 검토 부재
    - 연계: 동의 피싱(IDT-SE-01.2)·IT 지원 사칭(IDT-SE-02.2) 다음 단계 — 클라우드 CL-PE-03, ATT&CK에 LAPSUS$(G1004)·Scattered Spider(G1015)의 클라우드 역할 추가 절차 수록
    ■ 실제 사례
    - [실제 사고] Microsoft 기업 메일 침해(2024-01): 레거시 테스트 OAuth 앱의 높은 권한으로 악성 앱을 추가로 만들고 전체 메일함 접근 역할을 받아 고위 경영진·보안팀 메일 열람 (IDI-017, ATT&CK G0016)
    - [실제 사고] Salesforce 대상 음성 피싱(2025-06): IT 지원 사칭 전화로 직원이 변조된 Data Loader 연결 앱을 승인하게 해 조직 데이터를 API로 대량 반출·갈취 (IDI-036, ATT&CK G1057)
    - [실제 사고] OAuth 앱 악용 금전 공격(2023-12): MFA 없는 탈취 계정으로 OAuth 앱을 만들거나 권한을 높여 암호화폐 채굴·BEC·스팸 발송에 사용 (IDI-034)
    - [실제 사고] SolarWinds 침해 이후 클라우드 장악(2020-12): 기존 애플리케이션·서비스 주체에 자격증명을 추가해 클라우드 자원에 지속 접근 (IDI-027, ATT&CK C0024)
    - [시연] SAT1016 이블 트윈 연동·SAT1033 섀도 워크플로: HubSpot·Zapier에서 정상 앱처럼 보이는 연동과 자동화 워크플로로 접근을 유지하고 데이터를 빼내는 공개 시연
  detect: |-
    ■ 탐지
    - 새 OAuth 앱 등록·고위험 권한 승인, 앱·서비스 주체에 역할·자격증명 추가를 실시간 경보(NIST AU-6)
    - 전체 메일함 접근 같은 테넌트 단위 권한을 가진 앱 목록을 정기 추출해 게시자·소유자 확인
    ■ 대응
    - 앱 등록·동의를 관리자 승인으로 제한하고 검증된 게시자 앱만 허용(CIS 6.7, CCM IAM-15)
    - 앱 권한을 최소화하고 레거시·테스트 앱까지 포함해 정기 권한 검토·미사용 앱 삭제(CIS 6.8, NIST AC-6·AC-2, ISMS-P 2.5.5·2.5.6, CCM IAM-08)

IDT-NH-04:
  oneline: AI 에이전트가 위임받은 사용자 토큰·연동 권한으로 데이터 노출
  summary: |-
    - 공격자는 AI 에이전트가 사용자에게서 위임받은 토큰·연동 권한을 프롬프트 인젝션으로 조종하거나 연동 서버의 권한 격리 결함을 이용해 다른 저장소·조직의 데이터를 가져갈 수 있음
    - 에이전트는 사용자 권한 전체를 위임받는 경우가 많아 피해 범위가 그 권한에 좌우되고, 정상 도구 호출처럼 보여 기존 로그로 구분하기 어려움
  reference: |-
    ■ 신원 관점
    - 침해 지점: 에이전트에 위임된 사용자 토큰(T1550.001)과 연동 토큰 발급(T1528), MCP 서버 등 에이전트 연동 계층의 조직 간 권한 격리
    - 조건: 작업에 필요한 범위보다 넓은 위임(NHI5), 에이전트 연동의 인증·환경 격리 미흡(NHI4·NHI8), 외부 콘텐츠를 읽는 에이전트에 쓰기 권한까지 위임
    - 연계: AI AI-07-01·AI-07-03(혼동된 대리인)·AI-07-05·AI-06-01, 공급망 SCT-DE-03.2(MCP 서버 오염·사칭) — 프롬프트·도구 호출 경로는 AI 매트릭스에서 다룸
    ■ 실제 사례
    - [실제 사고] Asana MCP 서버 조직 간 데이터 노출(2025-06): AI 에이전트 연동용 MCP 서버의 논리 결함으로 다른 조직의 작업·프로젝트·파일 정보가 보이는 상태가 되어 약 1천 고객이 노출 대상 (IDI-117)
    - [실증] GitHub MCP 서버 프롬프트 인젝션으로 에이전트가 비공개 저장소 유출(2025-05): 공개 저장소 이슈에 숨긴 지시로 에이전트가 사용자 토큰 권한으로 비공개 저장소 내용을 공개 PR로 올리도록 조종 (IDI-122)
  detect: |-
    ■ 탐지
    - 에이전트용 토큰·연동 계정의 호출 범위·대상 저장소·조직을 기준선과 비교해 평소와 다른 접근 경보
    - 에이전트 도구 호출 기록을 사용자 세션 로그와 구분해 남기고, 외부 콘텐츠 처리 직후의 쓰기·공개 작업 점검
    ■ 대응
    - 에이전트 전용 신원을 두고 작업별 최소 범위·짧은 수명의 토큰만 위임(CIS 6.8, NIST AC-6·IA-9, ISMS-P 2.5.5, CCM IAM-05)
    - 연동 서버의 조직·테넌트 간 접근 통제를 검증하고 고위험 작업은 사람 승인 뒤 실행(NIST AC-3, CCM IAM-15)
