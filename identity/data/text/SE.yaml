# [SE] 사회공학·계정 복구 경로 — 신원 관점 문구

IDT-SE-01.1:
  oneline: 가짜 로그인·프록시 피싱으로 비밀번호와 MFA 세션 동시 탈취
  summary: |-
    - 공격자는 정상 로그인 화면을 흉내 내거나 그대로 중계하는 피싱 사이트로 비밀번호·일회용 코드·인증 후 세션 쿠키를 한꺼번에 가로챌 수 있음
    - 일회용 코드·푸시형 MFA는 중계 공격을 막지 못하고, 탈취 세션은 비밀번호를 바꿔도 만료 전까지 유효함
  reference: |-
    ■ 신원 관점
    - 대상: 클라우드 IdP·메일·VPN 로그인, 개발 플랫폼·패키지 레지스트리 계정, 인증 공급업체 직원 계정
    - 수법: 링크 피싱(T1566.002)과 중간자 프록시(T1557)로 세션 쿠키 탈취(T1539), 피싱 서비스형 키트, 가짜 2FA 재설정·보안 공지, UI 위장(SAT1049)
    - 연계: 클라우드 CL-IA-03·CL-CA-02, AI AI-01-08(AI 생성 피싱), OT OT-IA-04, 공급망 SCT-SC-03.1
    ■ 실제 사례
    - [실제 사고] AiTM 피싱으로 세션 쿠키 탈취 후 BEC(2022-07): 1만 개 이상 조직을 겨눈 프록시 피싱이 MFA 이후 세션을 가로채 거래처 송금 사기로 이어짐 (IDI-029)
    - [실제 사고] Twilio 등 0ktapus SMS 피싱 캠페인(2022-08): Okta 화면을 흉내 낸 유사 도메인으로 130곳 이상을 겨눠 자격증명 9,931건을 수집, 하드웨어 보안 키를 쓴 Cloudflare는 차단 (IDI-004, ATT&CK G1015)
    - [실제 사고] 김수키 정부기관·기자 사칭 피싱으로 이메일 계정 1,468개 탈취(2023-11): 가짜 로그인 페이지로 전문가와 일반인 이메일 계정을 탈취 (IDI-049, ATT&CK G0094)
    - [실제 사고] Reddit 내부 시스템 침해(2023-02): 인트라넷 게이트웨이를 흉내 낸 사이트가 자격증명과 2단계 인증 토큰을 함께 가로챔 (IDI-065)
    - [위협인텔] Tycoon 2FA 피싱 서비스(2024-03): 중간자 프록시로 MFA 완료 후 세션 쿠키를 가로채는 키트의 관련 도메인이 1,100개를 넘음 (IDI-066)
  detect: |-
    ■ 탐지
    - 로그인 직후 다른 IP·ASN에서 같은 세션 쿠키·토큰이 쓰이는 세션 재사용, 신규 등록 유사 도메인 탐지
    - 피싱 사이트로 알려진 프록시 인프라·사용자 에이전트, 로그인 페이지 리퍼러 이상 점검
    ■ 대응
    - FIDO2·패스키 등 피싱 저항 MFA를 우선 적용하고 관리자부터 필수화(NIST IA-2(1)·IA-2(8), CIS 6.3·6.5, ISMS-P 2.5.3, CCM IAM-13)
    - 세션을 장치에 묶는 토큰 보호·짧은 세션 수명과 위험 기반 재인증(NIST SC-23)
    - 실제 피싱 사례 중심 훈련과 원클릭 신고 창구(NIST AT-2(3))

IDT-SE-01.2:
  oneline: OAuth 동의·디바이스 코드 입력 유도로 비밀번호 없이 토큰 획득
  summary: |-
    - 공격자는 정상 IdP 동의 화면에서 악성 앱 권한을 승인하게 하거나 공격자가 발급받은 디바이스 코드를 입력하게 해 피해자의 토큰을 얻을 수 있음
    - 정상 도메인·정상 화면에서 일어나 피싱 탐지에 잘 걸리지 않고, 비밀번호·MFA를 바꿔도 발급된 토큰·앱 권한은 남음
  reference: |-
    ■ 신원 관점
    - 대상: Microsoft 365·Google Workspace 사용자, 브라우저 확장·앱 마켓 개발자 계정
    - 수법: 동의 피싱(SAT1010), 디바이스 코드 피싱(SAT1012), OAuth 흐름 가로채기(SAT1040), ConsentFix(SAT1051), 애플리케이션 토큰 탈취(T1528)
    - 연계: 클라우드 CL-PE-03(OAuth 앱 통합 악용), 공급망 SCT-SC-03.1, 취약한 서드파티 비인간 신원(NHI3)
    ■ 실제 사례
    - [실제 사고] Storm-2372 디바이스 코드 피싱 캠페인(2025-02): 화상회의 초대를 가장해 정상 로그인 페이지에서 디바이스 코드를 입력하게 하고 액세스·리프레시 토큰을 획득 (IDI-031)
    - [실제 사고] Cyberhaven 등 크롬 확장 35종 탈취(2024-12): 정책 위반 공지를 가장한 피싱으로 개발자가 악성 OAuth 앱을 승인해 MFA가 켜진 상태에서도 우회됨 (IDI-076)
    - [실제 사고] Google Docs 사칭 OAuth 동의 피싱 웜(2017-05): 악성 앱이 Gmail·연락처 권한을 승인받아 연락처로 다시 퍼졌고 약 100만 명이 영향을 받음 (IDI-075)
    - [시연] SAT1012 디바이스 코드 피싱: Microsoft·GitHub에서 정상 로그인 화면으로 코드 입력을 유도하는 공개 시연
  detect: |-
    ■ 탐지
    - 디바이스 코드 인증 흐름 사용 로그(평소 쓰지 않는 사용자·장치)와 새 앱 동의 승인 이벤트 경보
    - 신규 OAuth 앱의 고위험 권한(메일 전체 읽기·오프라인 접근) 승인과 게시자 미확인 앱 점검
    ■ 대응
    - 사용자 동의를 관리자 승인 흐름으로 바꾸고 검증된 게시자 앱만 허용(CCM IAM-15, NIST AC-3)
    - 필요 없는 사용자·환경에서 디바이스 코드 흐름 차단, 인가 정책 중앙화(CIS 6.7)
    - 동의·코드 입력 피싱 사례 교육(NIST AT-2(3)), 승인된 앱 정기 검토와 토큰 폐기 절차

IDT-SE-01.3:
  oneline: 문자·메신저·협업 도구로 메일 보안을 피해 자격증명 피싱
  summary: |-
    - 공격자는 IT 부서·보안팀을 사칭한 문자·Teams·메신저 메시지로 메일 보안 통제를 거치지 않고 직원을 피싱 페이지나 코드 입력으로 유도할 수 있음
    - 업무용 휴대폰·외부 채팅은 보안 필터 밖에 있고, 같은 키트로 여러 조직을 동시에 노리는 캠페인으로 번지기 쉬움
  reference: |-
    ■ 신원 관점
    - 대상: 직원 휴대폰 번호(문자), Teams·Slack 외부 채팅, 협업 앱 내 메시지
    - 수법: 서비스 경유 피싱(T1566.003), 메신저 피싱(SAT1018)·사용자 사칭(SAT1019)·앱 내 피싱(SAT1020), 메일 폭탄 뒤 지원 사칭 채팅
    - 연계: 클라우드 CL-LM-02(내부 피싱 및 공유 콘텐츠 오염), 후속 단계 IDT-SE-02.2
    ■ 실제 사례
    - [실제 사고] Twilio 등 0ktapus SMS 피싱 캠페인(2022-08): IT 부서를 사칭한 문자로 비밀번호 만료를 알리며 직원을 가짜 로그인 화면으로 유도 (IDI-004, ATT&CK G1015)
    - [실제 사고] Midnight Blizzard Teams 사회공학(2023-08): 보안팀처럼 보이는 테넌트에서 Teams 외부 채팅으로 인증 앱 코드를 입력하게 해 40개 미만 조직이 영향을 받음 (IDI-033, ATT&CK G0016)
    - [실제 사고] Retool 고객 계정 27곳 장악(2023-08): IT팀을 사칭한 문자로 직원을 가짜 로그인 페이지로 유도 (IDI-072)
    - [실제 사고] Storm-1811 메일 폭탄과 IT 지원 사칭(2024-05): 받은편지함을 마비시킨 뒤 Teams·전화로 지원 인력을 사칭 (IDI-032, ATT&CK G1046)
  detect: |-
    ■ 탐지
    - Teams·Slack 외부 테넌트에서 온 첫 채팅, 보안·IT 키워드가 들어간 외부 표시 이름 경보
    - 문자 피싱 신고와 같은 시간대의 로그인 시도·새 장치 등록 연계(NIST SI-8)
    ■ 대응
    - 외부 협업 테넌트 허용 목록·외부 채팅 경고 배너, 업무 휴대폰 문자 필터링(CCM IAM-13)
    - 피싱 저항 MFA로 문자 피싱 성공 시에도 차단(CIS 6.3, ISMS-P 2.5.3)
    - IT 부서는 문자·채팅으로 비밀번호를 묻지 않는다는 원칙 공지와 교육(NIST AT-2(3))

IDT-SE-02.1:
  oneline: 헬프데스크 사칭 전화로 특권 계정 비밀번호·MFA 재설정
  summary: |-
    - 공격자는 직원을 사칭해 사내·외주 헬프데스크에 전화로 비밀번호·MFA 재설정을 받아 특권 계정까지 정상 절차로 넘겨받을 수 있음
    - 기술 통제가 아니라 절차가 뚫리므로 MFA가 있어도 무력화되고, 외주 헬프데스크는 원청의 확인 절차를 지키지 않는 일이 잦음
  reference: |-
    ■ 신원 관점
    - 대상: 사내·외주(IT 아웃소싱) 서비스 데스크, IdP 최고 관리자·클라우드 관리자 계정
    - 수법: 음성 피싱(T1566.004)·사칭(T1684.001)으로 재설정 요청, 공격자 장치를 MFA에 등록(T1098.005), 계정 복구 경로 악용(SAT1003)
    - 연계: 클라우드 CL-IA-04·CL-PE-02, AI AI-01-08, 공급망 SCT-SC-03.3, 후속 단계 IDT-DI-03.2(IdP 설정 변조)
    ■ 실제 사례
    - [실제 사고] MGM Resorts 랜섬웨어(2023-09): 직원을 사칭해 IT 헬프데스크에 전화해 Okta·Azure 관리 권한을 얻고 약 100대의 ESXi를 암호화, 약 1억 달러 영업 손실 (IDI-005, ATT&CK G1015)
    - [실제 사고] Clorox 침해(2023-08): 외주 헬프데스크가 신원 확인 없이 Okta 비밀번호와 MFA를 재설정했다고 소송에서 주장 (IDI-009, ATT&CK G1015)
    - [실제 사고] Marks & Spencer 랜섬웨어(2025-04): 협력사를 상대로 한 사칭으로 직원 비밀번호를 재설정받아 침투, 영업이익 약 3억 파운드 영향 (IDI-010, ATT&CK G1015)
    - [실제 사고] Okta 고객 대상 헬프데스크 사칭·교차 테넌트 사칭(2023-08): 서비스 데스크를 속여 최고 관리자의 MFA 요소를 모두 초기화 (IDI-007)
    - [실제 사고] Electronic Arts 소스 코드 탈취(2021-06): Slack에서 직원을 사칭해 IT 지원팀에 새 MFA 토큰을 요청 (IDI-064)
  detect: |-
    ■ 탐지
    - 재설정 직후 새 장치·새 위치 로그인, 특권 계정 MFA 재설정·새 인증 수단 등록을 실시간 경보
    - 헬프데스크 티켓과 IdP 재설정 이벤트 대조(티켓 없는 재설정, 같은 상담원의 연속 특권 재설정)
    ■ 대응
    - 재설정 전 영상 대면·관리자 승인·사전 등록 장치 확인 등 강한 신원 확인 절차, 외주 계약에 절차 준수 명시(NIST IA-12·IA-5, ISMS-P 2.5.1·2.5.3, CCM IAM-07)
    - 특권 계정은 헬프데스크 재설정 대상에서 제외하고 별도 절차·전용 관리자 계정 사용(CIS 5.4·6.5, CCM IAM-13)
    - 상담원 대상 사칭 수법 훈련과 녹취 점검(NIST AT-2(3))

IDT-SE-02.2:
  oneline: IT 지원 사칭으로 원격 지원 허용·악성 연결 앱 승인 유도
  summary: |-
    - 공격자는 IT 지원 인력을 사칭한 전화·채팅으로 직원이 원격 지원 세션을 허용하거나 SaaS 연결 앱을 승인하게 만들어 단말·조직 데이터를 넘겨받을 수 있음
    - 직원이 직접 승인한 정상 기능이라 보안 도구가 차단하지 않고, 연결 앱 권한은 조직 SaaS 데이터 전체에 미칠 수 있음
  reference: |-
    ■ 신원 관점
    - 대상: Quick Assist·RMM 등 원격 지원 도구, Salesforce 등 SaaS 연결 앱 설정, 사내 VPN·관리 도구
    - 수법: 음성 피싱(T1566.004)·사칭(T1684.001), 원격 접근 도구(T1219), 악성 앱 승인으로 토큰 획득(T1528·SAT1010)
    - 연계: 클라우드 CL-IA-04, 후속 단계 IDT-NH-03.2(악성 OAuth 앱)·IDT-IM-03(대량 반출)
    ■ 실제 사례
    - [실제 사고] Salesforce 대상 음성 피싱(2025-06): IT 지원을 사칭한 전화로 직원이 변조된 Data Loader 앱을 승인하게 해 조직 데이터를 대량 반출·갈취 (IDI-036, ATT&CK G1057)
    - [실제 사고] Storm-1811 메일 폭탄과 IT 지원 사칭(2024-05): Quick Assist 원격 지원 연결을 허용하게 해 단말을 장악하고 Black Basta 배포로 이어짐 (IDI-032, ATT&CK G1046)
    - [실제 사고] Twitter 내부 관리 도구 장악(2020-07): IT 헬프데스크를 사칭해 VPN 문제를 해결해 준다며 직원에게 가짜 VPN 페이지에 자격증명을 입력하게 함 (IDI-063)
    - [실제 사고] Cisco 사내망 침해(2022-08): 지원 조직을 사칭한 음성 피싱이 여러 날 이어진 끝에 직원이 MFA를 승인 (IDI-003)
  detect: |-
    ■ 탐지
    - 원격 지원 도구 실행 직후 새 원격 접속·도구 설치, 신규 연결 앱 승인과 API 대량 조회 연계
    - 고객 지원·IT 지원 사칭 전화 신고와 같은 사용자의 이상 행위 상관 분석
    ■ 대응
    - 원격 지원 도구는 승인된 것만 허용하고 사용 시 이중 확인(NIST CM-7), 연결 앱 설치는 관리자 승인으로 제한(CIS 6.7, CCM IAM-15)
    - 연결 앱·API 사용자 권한 최소화와 역할 기반 접근 통제(CIS 6.8, NIST AC-3, CCM IAM-05, ISMS-P 2.5.3)
    - IT 지원은 먼저 전화하지 않는다는 원칙과 콜백 확인 절차 교육(NIST AT-2(3))

IDT-SE-03:
  oneline: 계정 복구·재설정 절차의 약한 고리로 계정 넘겨받기
  summary: |-
    - 공격자는 고객지원 사회공학, SMS 복구 결함, 비밀번호 재설정 메일 우회처럼 복구 절차의 약한 고리로 MFA를 거치지 않고 계정을 넘겨받을 수 있음
    - 복구 경로는 본 인증보다 약하게 설계되기 쉽고, 결함이 시스템에 있으면 많은 고객이 같은 방식으로 한꺼번에 털림
  reference: |-
    ■ 신원 관점
    - 대상: 고객 계정 복구(SMS·이메일·고객센터), 셀프 비밀번호 재설정 포털, 개발 플랫폼 비밀번호 재설정
    - 수법: 지원 인력 사칭으로 복구 정보 수집(T1684.001), 복구 흐름 결함으로 인증 수단 교체(T1098), 계정 복구 경유 이동(SAT1003)
    - 연계: 공급망 SCT-SC-03.3(만료 도메인·계정 복구 경로 탈취), 헬프데스크형은 IDT-SE-02.1
    ■ 실제 사례
    - [실제 사고] Coinbase SMS 계정 복구 결함 악용(2021-10): SMS 2단계 인증 고객의 계정 복구 절차 결함으로 인증 토큰을 받아 고객 6천여 명의 자금을 빼냄 (IDI-056)
    - [실제 사고] Mat Honan 계정 연쇄 탈취(2012-08): 고객지원에서 얻은 카드 끝 네 자리로 다른 서비스 계정 비밀번호를 재설정받고 기기를 원격 삭제 (IDI-057)
    - [공개 취약점] 비밀번호 재설정·셀프 재설정 제품 결함 KEV 판정 3건: GitLab 비밀번호 재설정 메일 우회(CVE-2023-7028), ManageEngine ADSelfService Plus(CVE-2021-40539) 등
  detect: |-
    ■ 탐지
    - 복구·재설정 직후 연락처·인증 수단 변경, 출금·데이터 내보내기 같은 고위험 행위 연계 차단
    - 같은 지원 상담 경로로 짧은 기간 다수 계정 복구가 일어나는 패턴 점검
    ■ 대응
    - 복구 경로를 본 인증만큼 강하게 하고 복구 후 일정 기간 고위험 거래 지연·알림(NIST IA-5·IA-11, CCM IAM-14)
    - SMS 단독 복구를 없애고 복구 코드·사전 등록 수단 사용, 외부 노출 서비스 MFA(CIS 6.3, ISMS-P 2.5.3·2.5.4)
    - 고객센터는 일부 카드 번호 등 다른 회사에서 얻을 수 있는 정보로 본인확인하지 않음

IDT-SE-04:
  oneline: 딥페이크 음성·영상으로 임원·동료 사칭해 송금·코드 요구
  summary: |-
    - 공격자는 공개 영상·음성으로 만든 딥페이크로 임원·동료를 사칭해 화상회의·전화에서 송금이나 인증 코드 제공을 지시할 수 있음
    - 얼굴·목소리를 본인 확인 근거로 쓰는 관행을 무너뜨리며, 한 번의 지시로 큰 금액이 나가거나 MFA가 넘어감
  reference: |-
    ■ 신원 관점
    - 대상: 재무 담당자 송금 승인, IT 지원·헬프데스크 통화, 화상 면접·본인확인
    - 수법: 사칭(T1684.001)과 음성 피싱(T1566.004)에 생성형 AI 딥페이크 결합, 사전 정찰로 사내 사정을 아는 척함
    - 연계: 클라우드 CL-IA-04, AI AI-01-07(딥페이크 생체인증 우회)·AI-01-08(AI 생성 피싱)
    ■ 실제 사례
    - [실제 사고] Arup 딥페이크 화상회의 송금 사기(2024-01): CFO와 동료로 보이는 딥페이크 참석자의 지시로 직원이 15차례 총 2억 홍콩달러를 송금 (IDI-013)
    - [실제 사고] Retool 고객 계정 27곳 장악(2023-08): 직원의 실제 목소리를 딥페이크로 흉내 낸 전화로 추가 MFA 코드를 받아냄 (IDI-072)
  detect: |-
    ■ 탐지
    - 긴급·비밀 유지를 강조하는 송금·계좌 변경 요청, 평소와 다른 채널의 지시를 이상 거래로 분류
    - 영상 통화 참가자의 계정·초대 경로 확인, 인증 코드 요청 통화 신고 연계
    ■ 대응
    - 송금·계좌 변경은 사전 등록된 별도 채널로 콜백 확인하고 이중 승인(CCM IAM-13, ISMS-P 2.5.3)
    - 본인확인에 얼굴·목소리만 쓰지 않고 사전 공유 정보·장치 기반 확인 병행(NIST IA-12)
    - 딥페이크 사례 교육과 '코드는 누구에게도 알려주지 않음' 원칙(NIST AT-2(3))
