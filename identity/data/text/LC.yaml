# [LC] 수명주기·거버넌스·내부자 — 신원 관점 문구
# 작성 규칙: oneline 50자 이내 명사형 · summary 2줄(① 공격자는 … 수 있음 ② 피해·탐지 곤란 사유) ·
#           reference(■ 신원 관점 / ■ 실제 사례) · detect(■ 탐지 / ■ 대응). 사례는 그 행에 매핑된 사고만, 수치는 사고 DB 요약에 있는 것만.
#           행위 주체가 내부자·퇴사자이면 summary 1줄의 주어만 바꿈.

IDT-LC-01.1:
  oneline: 퇴사자·휴면·미사용 계정과 회수되지 않은 권한으로 침투·무단 조회
  summary: |-
    - 공격자나 퇴사자는 쓰지 않지만 활성 상태로 남은 VPN·메인테이너·클라우드 계정이나 퇴사 뒤에도 회수되지 않은 권한·키로 정상 사용자처럼 들어올 수 있음
    - 주인이 없는 계정은 이상 행위를 알아챌 사람이 없어 탐지가 늦고, MFA 없이 남은 오래된 비밀번호는 유출 비밀번호 하나로 열림
  reference: |-
    ■ 신원 관점
    - 대상: 쓰지 않는 VPN·원격 접속 계정, 휴면 패키지 메인테이너 계정, 퇴사자·전보자의 SaaS·보고서 접근 권한과 비인간 신원(T1078·T1078.002)
    - 조건: 인사 시스템과 계정 관리가 연동되지 않아 퇴사·전보 때 회수 누락, 휴면 계정 자동 비활성화 부재, 퇴사자가 알던 키·토큰 미폐기(NHI1)
    - 연계: ATT&CK에 APT29(G0016)가 퇴사자 등의 휴면 계정을 노린 절차 수록 — 비밀 교체 실패(IDT-NH-01.2)·내부자 오남용(IDT-LC-02.1)과 이어짐
    ■ 실제 사례
    - [실제 사고] Colonial Pipeline 랜섬웨어(2021-05): 쓰지 않지만 활성 상태로 남은 레거시 VPN 계정이 비밀번호 하나로만 보호되어 침투 경로가 되고 송유관 운영 중단으로 이어짐 (IDI-014)
    - [실제 사고] 쿠팡 고객 계정 정보 3,367만 건 유출(2025-11): 퇴사한 백엔드 개발자가 재직 중 확보한 토큰 서명키로 정상 로그인 없이 약 8개월간 고객 정보를 조회 (IDI-042)
    - [실제 사고] Cash App 퇴사자의 고객 보고서 무단 다운로드(2022-04): 퇴사 뒤에도 고객 보고서를 내려받을 수 있었던 전 직원이 고객 820만 명의 정보를 내려받음 (IDI-103)
    - [실제 사고] 러시아 SVR의 클라우드 초기 접근 수법 변화(2024-02): 비밀번호 스프레이·대입으로 퇴사자 등의 휴면 계정을 탈취 (IDI-094, ATT&CK G0016)
    - [실제 사고] Packagist 방치 메인테이너 계정 탈취(2023-05): 오래 쓰지 않던 메인테이너 계정 4개가 예전에 유출된 비밀번호로 장악되어 패키지 14개의 정보가 바뀜 (IDI-078)
  detect: |-
    ■ 탐지
    - 오랫동안 로그인이 없던 계정의 갑작스러운 로그인, 퇴사·전보 처리된 사용자 명의 접근, 퇴사자와 연결된 키·토큰 사용을 경보
    - 인사 시스템의 재직 현황과 계정·권한 목록을 정기 대조해 회수 누락 식별
    ■ 대응
    - 인사 변동과 연동한 계정·권한 자동 회수, 퇴사 당일 비활성화와 관련 키·토큰 폐기(CIS 6.2, NIST AC-2(3)·PS-4·PS-5, ISMS-P 2.2.5, CCM IAM-07·HRS-06)
    - 휴면 계정 자동 비활성화와 계정 관리 중앙화, 정기 접근 권한 검토(CIS 5.3·5.6, NIST AC-2, ISMS-P 2.5.1·2.5.6, CCM IAM-08)

IDT-LC-01.2:
  oneline: 협력사·외주 인력 계정과 외주 지원 창구를 거쳐 원청 시스템 침투
  summary: |-
    - 공격자는 원청 시스템에 접근하는 협력사·외주 인력의 계정을 탈취하거나 외주 헬프데스크·IT 지원업체를 속여 원청 내부로 들어올 수 있음
    - 협력사 단말·절차는 원청이 직접 통제하지 못하고, 외부 인력 계정은 권한·만료 관리가 느슨해 대량 유출의 입구가 됨
  reference: |-
    ■ 신원 관점
    - 대상: 협력사 포털·VPN 계정, 외주 IT 지원·헬프데스크 인력, 용역 인력의 원청 사무실 PC·시스템 접근 권한(T1199·T1078), SaaS 게스트 사용자(SAT1046)
    - 조건: 협력사 직원 개인 단말의 브라우저 동기화, MFA 없는 협력사 VPN, 외주 업체의 신원 확인 절차 미준수, 계약 만료 뒤 남는 계정과 원청의 이행 점검 부재
    - 연계: 클라우드 CL-IA-06(신뢰 관계 악용), OT OT-IA-02(외부 원격 접속), 공급망 SCT-CS-02.3(공급업체 계정 경유 침입)
    ■ 실제 사례
    - [실제 사고] Medibank 고객 970만 명 정보 유출(2022-10): IT 협력사 직원 브라우저 프로필에 저장된 자격증명이 개인 컴퓨터의 악성코드로 탈취되어 MFA 없는 VPN으로 침투 (IDI-018)
    - [실제 사고] Marks & Spencer 랜섬웨어(2025-04): 협력사를 상대로 한 정교한 사칭으로 직원 비밀번호를 재설정받아 침투, 온라인 주문이 수주간 중단 (IDI-010, ATT&CK G1015)
    - [실제 사고] Target 결제정보 4천만 건 유출(2013-12): 냉난방 협력사 직원에게 보낸 피싱 메일의 악성코드로 협력사 포털 자격증명을 훔쳐 내부망에 들어감 (IDI-079)
    - [실제 사고] 카드 3사 고객정보 1억여 건 유출(2014-01): 부정사용방지시스템 개발 용역 직원이 카드사 사무실 PC에서 고객정보 약 1억 건을 USB로 빼내 판매 (IDI-048)
    - [실제 사고] Latitude Financial 고객 1,400만 건 유출(2023-03): 대형 협력사의 내부 기반 시설을 침해해 Latitude 직원의 로그인 자격증명을 얻고 고객 신분증·여권 번호 등을 빼냄 (IDI-085)
    - [실제 사고] Caesars Entertainment 회원 DB 탈취(2023-09): 외주 IT 지원업체에 대한 사회공학으로 시작된 침해로 로열티 프로그램 DB 사본이 탈취 (IDI-006, ATT&CK G1015)
    - [실제 사고] Uber 내부망 침해(2022-09): 협력사 직원 개인 단말에서 유출된 업무 비밀번호로 로그인을 반복하다 협력사 직원이 2단계 인증 요청을 승인 (IDI-002, ATT&CK G1004)
    - [시연] SAT1046 게스트 접근 악용: Salesforce·ServiceNow의 게스트 사용자 권한 오설정으로 데이터에 접근하는 공개 시연
  detect: |-
    ■ 탐지
    - 협력사·외주 계정의 접속 시간·출발지·접근 시스템을 계약 범위와 비교해 이상 접근 경보, 외주 헬프데스크의 재설정 이력 감사
    - 계약 만료·인력 교체 뒤에도 쓰이는 외부 인력 계정과 게스트 사용자 권한 정기 점검
    ■ 대응
    - 외부 인력 계정은 승인 절차로 발급하고 접근 범위·기간을 계약에 맞춰 제한, 만료 시 즉시 회수(CIS 6.1·6.2, NIST PS-7·AC-2, ISMS-P 2.3.3·2.3.4, CCM IAM-06·IAM-08)
    - 협력사·외주 업체에 MFA·관리 단말 사용과 신원 확인 절차 준수를 계약으로 요구하고 이행 점검(NIST SA-9·AC-20, CCM STA-09)

IDT-LC-02.1:
  oneline: 내부자가 정상 권한으로 고객·내부 데이터를 대량 조회·반출
  summary: |-
    - 내부자는 업무상 가진 DB·클라우드·보고서 접근 권한이나 재직 중 확보한 키로 고객·임직원 정보를 대량으로 내려받아 팔거나 공개·갈취에 쓸 수 있음
    - 정상 권한 안의 행위라 접근 통제가 막지 못하고, 조회량·시간대 이상을 따로 분석하지 않으면 수개월 동안 드러나지 않음
  reference: |-
    ■ 신원 관점
    - 대상: 고객 DB·보고서 조회 권한, 클라우드 저장소·코드 저장소 관리 권한(T1530·T1213), 개발 과정에서 얻은 토큰 서명 키, 데이터 내보내기 기능(SAT1037)
    - 조건: 직무에 비해 넓은 조회 권한, 대량 조회·내려받기 모니터링 부재, 개발·운영 권한 미분리, 퇴사 예정자 접근 관리 미흡
    - 연계: 퇴사자 권한 미회수(IDT-LC-01.1)와 겹치며 대량 데이터 탈취(IDT-IM-03)로 이어짐 — 클라우드 CL-CO-04
    ■ 실제 사례
    - [실제 사고] 쿠팡 고객 계정 정보 3,367만 건 유출(2025-11): 개발자가 재직 중 확보한 토큰 서명키로 퇴사 뒤 약 8개월간 고객 정보를 조회해 이름·이메일 3,367만 건이 유출 (IDI-042)
    - [실제 사고] 카드 3사 고객정보 1억여 건 유출(2014-01): 용역 직원이 카드사 사무실 PC에서 고객정보 약 1억 건을 USB에 저장해 대출 중개업자에게 판매 (IDI-048)
    - [실제 사고] Ubiquiti 내부자 데이터 탈취·갈취(2020-12): 클라우드 엔지니어가 업무상 가진 AWS·GitHub 관리 권한으로 기밀 데이터를 내려받고 익명 해커로 위장해 50비트코인을 요구 (IDI-101)
    - [실제 사고] Tesla 전 직원 2명의 직원 7만 5천여 명 정보 유출(2023-05): 전 직원 2명이 정책을 어기고 직원 약 7만 5천 명의 개인정보 등 내부 데이터를 언론에 넘김 (IDI-102)
    - [실제 사고] Cash App 퇴사자의 고객 보고서 무단 다운로드(2022-04): 재직 중 업무로 접근하던 고객 보고서를 퇴사 뒤 내려받아 고객 820만 명 정보가 유출 (IDI-103)
    - [시연] SAT1037 데이터 내보내기 서비스: Google의 계정 데이터 일괄 내보내기 기능으로 데이터를 빼내는 공개 시연
  detect: |-
    ■ 탐지
    - 개인별 조회·내려받기 양과 시간대 기준선을 두고 대량 조회·내보내기·외부 저장 장치 사용을 경보(NIST AU-6, ISMS-P 2.9.5, CCM LOG-05)
    - 퇴사 예정·징계 대상자처럼 위험 신호가 있는 사용자의 접근을 내부자 위협 프로그램에서 집중 점검(NIST PM-12)
    ■ 대응
    - 직무 기반 최소 권한과 직무 분리, 고객정보 대량 조회는 승인·사유 기록 뒤 허용(CIS 6.8, NIST AC-6, ISMS-P 2.5.6, CCM IAM-04·IAM-05)
    - 퇴사 때 접근 권한·키를 즉시 회수하고 정기 접근 권한 검토(NIST PS-4, ISMS-P 2.2.5)

IDT-LC-02.2:
  oneline: 고객지원·협력사 인력 매수로 정상 조회 권한을 통한 고객 정보 유출
  summary: |-
    - 공격자는 고객 데이터 조회 권한을 가진 고객지원·협력사 인력을 돈으로 매수하거나 내부자로 모집해 정상 업무 화면으로 고객 정보를 빼내거나 사내 접근을 얻을 수 있음
    - 정상 계정의 정상 업무 조회라 기술 통제를 우회하고, 빼낸 정보는 회사를 사칭한 2차 사기로 이어져 고객 피해가 커짐
  reference: |-
    ■ 신원 관점
    - 대상: 고객 계정·신분증 이미지를 조회하는 해외·외주 고객지원 인력, 협력사 직원의 업무 계정(T1078)
    - 조건: 지원 인력에게 넓게 열린 고객정보 조회 권한, 조회 사유·양 모니터링 부재, 외주 인력 채용 검증·보안 교육 미흡
    - 연계: 빼낸 정보로 회사를 사칭하는 사회공학(T1684.001)·금전 사기(IDT-IM-01)로 이어짐 — ATT&CK에 LAPSUS$(G1004) 절차 수록
    ■ 실제 사례
    - [실제 사고] Coinbase 고객 데이터 유출(2025-05): 범죄자들이 해외 고객지원 인력과 협력사 직원을 매수해 고객 이름·주소·신분증 이미지·잔액 등을 빼내고 Coinbase를 사칭한 사회공학으로 고객 자산을 노림 (IDI-012)
    - [실제 사고] LAPSUS$ 연쇄 침해(2022-03): 직원·협력사 내부자 모집을 다른 수법과 함께 써서 Microsoft·Nvidia·Samsung·Okta 등을 침해 (IDI-001, ATT&CK G1004)
  detect: |-
    ■ 탐지
    - 고객지원 인력의 조회 건수·대상·시간대 기준선을 두고 담당 티켓과 무관한 고객 조회, 신분증 이미지 대량 열람을 경보(NIST AU-6, ISMS-P 2.9.5, CCM LOG-05)
    - 내부자 모집 게시물·매수 제안 신고 창구를 운영하고 신고된 인력의 접근 이력 점검(NIST PM-12)
    ■ 대응
    - 고객정보 조회는 티켓·사유와 묶어 필요한 항목만 보이게 하고 민감 정보는 마스킹(CIS 6.8, ISMS-P 2.5.6, CCM IAM-04)
    - 외주·해외 지원 인력 채용 검증과 역할·책임 명시, 매수 제안 신고 의무 교육(NIST PS-3, CCM HRS-09)

IDT-LC-03:
  oneline: 도용·위조 신원으로 원격 IT 인력 위장 취업해 정규 계정 획득
  summary: |-
    - 공격자는 도용·위조 신원과 AI로 보정한 사진으로 화상 면접·신원 조회를 통과해 원격 IT 인력으로 채용되고 회사가 지급한 노트북과 정규 계정을 받을 수 있음
    - 채용 절차로 정상 발급된 계정이라 접근 통제가 막지 않고, 대리 접속용 노트북 농장으로 근무 위치를 속여 데이터 탈취·갈취로 이어지기도 함
  reference: |-
    ■ 신원 관점
    - 대상: 원격 근무 채용·온보딩의 신원 확인 절차, 지급 노트북과 정규 업무 계정(T1078), 위장 신원으로 만든 계정(T1585)
    - 조건: 화상 면접·서류만으로 신원 확인, 지급 장비 배송지와 신원 주소 불일치 미점검, 입사 직후 넓은 권한 부여
    - 연계: 채용 단계의 신원 확인 보증 수준·사기 관리 문제 — AI AI-01-07(딥페이크 생체인증 우회), 공급망 SCT-DE-01.2(가짜 채용 사회공학)
    ■ 실제 사례
    - [실제 사고] 북한 원격 IT 인력 위장 취업 일제 단속(2025-06): 도용·위조 신원으로 미국 기업 100곳 이상에 원격 IT 인력으로 취업하고 조력자의 노트북 농장으로 원격 접속, 일부는 데이터 탈취·갈취로 이어짐 (IDI-105)
    - [실제 사고] KnowBe4 북한 위장 IT 인력 채용(2024-07): 도용한 미국인 신원과 AI로 보정한 사진으로 화상 면접·신원 조회를 통과했고 지급 노트북에서 악성코드를 내려받다 25분 만에 격리 (IDI-104)
  detect: |-
    ■ 탐지
    - 지급 노트북의 원격 접속 도구 설치·해외 IP 접속·배송지와 다른 접속 위치, 입사 직후 대량 접근을 경보
    - 면접자와 근무자의 동일인 여부 재확인, 같은 연락처·계좌·주소를 쓰는 지원자 점검
    ■ 대응
    - 원격 채용에 대면 또는 강한 신원 확인 절차를 두고 신분증·주소 진위를 검증(NIST IA-12·PS-3, CCM HRS-09)
    - 입사 초기 권한은 최소로 시작해 단계적으로 부여하고 접근 권한 부여 절차 준수(CIS 6.1, ISMS-P 2.5.1, CCM IAM-06)
    - 위장 취업 정황을 내부자 위협 프로그램 점검 대상에 포함(NIST PM-12)
