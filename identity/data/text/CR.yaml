# [CR] 자격증명 탈취·유출 — 신원 관점 문구
# 작성 규칙: oneline 50자 이내 명사형 · summary 2줄(① 공격자는 … 수 있음 ② 피해·탐지 곤란 사유) ·
#           reference(■ 신원 관점 / ■ 실제 사례) · detect(■ 탐지 / ■ 대응). 사례는 그 행에 매핑된 사고만, 수치는 사고 DB 요약에 있는 것만.

IDT-CR-01.1:
  oneline: 인포스틸러로 브라우저 저장 비밀번호·세션 쿠키 탈취
  summary: |-
    - 공격자는 업무·개인 PC를 인포스틸러로 감염시켜 브라우저에 저장된 비밀번호와 로그인된 세션 쿠키를 한꺼번에 빼낼 수 있음
    - 개인 PC·협력사 단말의 브라우저 동기화로 업무 자격증명이 회사 통제 밖에서 털리고, 탈취 로그가 시장에서 팔려 수년 뒤 침해로 이어짐
  reference: |-
    ■ 신원 관점
    - 대상: 브라우저 저장 비밀번호·자동 완성(T1555.003), MFA를 마친 SSO 세션 쿠키(T1539), 로컬 파일 속 키·설정(T1005)
    - 경로: 개인 계정 브라우저 동기화, 협력사·재택 단말, 위장 소프트웨어·크랙 설치, 감염 로그의 다크웹 판매(SAT1028·SAT1044)
    - 연계: 탈취 자격증명 재사용(IDT-AU-01.2)·세션 재사용(IDT-TS-01.1)으로 이어짐 — 클라우드 CL-CA-05·CL-CA-03, AI AI-07-01, OT OT-LM-04, 공급망 SCT-DE-01.1
    ■ 실제 사례
    - [실제 사고] Snowflake 고객 인스턴스 대량 데이터 탈취(2024-05): 인포스틸러 감염 단말에서 나온 고객 자격증명으로 MFA 없는 인스턴스 약 165곳에 로그인 (IDI-016)
    - [실제 사고] Medibank 고객 970만 명 정보 유출(2022-10): 협력사 직원 브라우저 프로필에 저장된 자격증명이 개인 컴퓨터로 동기화된 뒤 악성코드로 탈취됨 (IDI-018)
    - [실제 사고] Cisco 사내망 침해(2022-08): Chrome 비밀번호 동기화로 개인 Google 계정에 저장된 업무 자격증명이 개인 계정 탈취로 넘어감 (IDI-003)
    - [실제 사고] CircleCI 고객 비밀 유출(2023-01): 엔지니어 노트북 악성코드가 2FA를 마친 SSO 세션 쿠키를 훔쳐 운영 시스템에 접근 (IDI-073)
    - [실제 사고] HELLCAT 인포스틸러 유출 Jira 자격증명으로 연쇄 침해(2025-03): 협력사 단말에서 2021년에 유출된 자격증명이 여전히 유효 (IDI-069)
    - [실제 사고] Genesis Market 폐쇄(2023-04): 감염 PC 150만 대 이상에서 모은 자격증명·세션 쿠키·브라우저 지문을 묶어 판매 (IDI-067)
  detect: |-
    ■ 탐지
    - EDR로 브라우저 비밀번호 저장소·쿠키 DB 접근 프로세스, 알려진 인포스틸러 행위를 탐지하고 감염 단말 사용자의 모든 세션 무효화(NIST SI-3·SI-4)
    - 인포스틸러 로그·다크웹 유출 모니터링 결과를 사내 계정·도메인과 대조, 감염 의심 계정은 비밀번호·세션 동시 초기화
    ■ 대응
    - 업무 계정의 브라우저 비밀번호 저장·개인 계정 동기화 금지, 관리형 비밀번호 관리자 사용(ISMS-P 2.5.4, CCM IAM-14)
    - 피싱 저항 MFA와 장치 신뢰 조건부 접근으로 훔친 비밀번호·쿠키만으로는 접속이 안 되게 함(CIS 6.3·6.4, NIST IA-2(1)·SC-23, ISMS-P 2.5.3, CCM IAM-13)

IDT-CR-01.2:
  oneline: 단말 메모리·SAM에서 OS 자격증명 덤프
  summary: |-
    - 공격자는 장악한 단말·서버에서 LSASS 메모리·SAM·도메인 캐시 자격증명을 덤프해 관리자 해시·비밀번호를 얻을 수 있음
    - 도메인 관리자가 한 번이라도 로그인한 단말이면 그 자격증명이 남아 있어, 단말 하나 감염이 조직 전체 확산으로 번짐
  reference: |-
    ■ 신원 관점
    - 대상: LSASS 프로세스 메모리(T1003.001), 로컬 SAM 데이터베이스(T1003.002), 도메인 캐시 자격증명(T1003.005)
    - 조건: 관리자가 일반 단말에 로그인하는 운영 관행, 모든 단말 공통 로컬 관리자 비밀번호, 자격증명 보호 기능 미적용
    - 연계: 얻은 해시는 해시 전달(IDT-TS-02.1)·횡적 이동으로 이어짐 — OT OT-LM-04와 같은 기법
    ■ 실제 사례
    - [실제 사고] NotPetya의 자격증명 탈취·재사용 확산(2017-06): 감염 단말 메모리에서 Windows 자격증명을 빼내 정상 관리 도구로 다른 시스템에 퍼짐 (IDI-097, ATT&CK S0368)
  detect: |-
    ■ 탐지
    - LSASS 메모리 접근·덤프 파일 생성, SAM·SECURITY 레지스트리 하이브 저장, 알려진 덤프 도구 실행을 EDR로 탐지(NIST SI-4)
    - 한 계정이 짧은 시간에 여러 단말로 원격 로그인하는 횡적 이동 패턴을 상관 분석
    ■ 대응
    - 관리자 계정의 일반 단말 로그인 금지·관리 전용 단말 사용, 단말별 고유 로컬 관리자 비밀번호(CIS 5.4, NIST AC-6(5), ISMS-P 2.5.5, CCM IAM-09·IAM-10)
    - LSASS 보호·자격증명 격리 기능 적용, 불필요한 관리 도구 실행 제한(NIST CM-7)

IDT-CR-01.3:
  oneline: 키로거로 MFA 이후 입력된 마스터 비밀번호 가로채기
  summary: |-
    - 공격자는 단말에 키로거·입력 가로채기 도구를 심어 사용자가 입력하는 비밀번호·마스터 비밀번호를 그대로 얻을 수 있음
    - MFA를 마친 뒤 입력되는 값까지 가로채므로 MFA가 막지 못하고, 개인 PC처럼 회사 보안 도구가 없는 단말에서 주로 일어남
  reference: |-
    ■ 신원 관점
    - 대상: 키보드 입력(T1056.001), 자격증명 API 가로채기(T1056.004), 비밀번호 관리자·금고의 마스터 비밀번호
    - 조건: 핵심 키 접근권자가 회사 통제 밖 개인 PC에서 업무 금고에 접근, 단말의 패치 안 된 소프트웨어
    - 연계: 금고 침해(IDT-CR-02.2)로 이어짐 — OT OT-LM-04, 공급망 SCT-DE-01.1과 같은 단말 기반 탈취
    ■ 실제 사례
    - [실제 사고] LastPass 고객 금고 백업 탈취(2022-12): DevOps 엔지니어 개인 PC에 키로거를 심어 MFA를 마친 뒤 입력한 마스터 비밀번호를 가로챔 (IDI-071)
  detect: |-
    ■ 탐지
    - 키보드 후킹·입력 API 가로채기 행위와 알 수 없는 원격 접속 도구를 EDR로 탐지(NIST SI-3·SI-4)
    - 핵심 금고·키 저장소 접근을 평소 단말·위치·시간대와 비교해 이상 접근 경보
    ■ 대응
    - 핵심 키·금고 접근은 회사 관리 단말에서만 허용하고 개인 PC 접근 차단(ISMS-P 2.5.3, CCM IAM-14)
    - 비밀번호 입력에 의존하지 않는 하드웨어 키 기반 인증으로 전환(CIS 6.5, NIST IA-2(6))

IDT-CR-02.1:
  oneline: 코드·설정·이미지에 남은 자격증명·토큰 노출
  summary: |-
    - 공격자는 공개·내부 코드 저장소, 설정 파일, 컨테이너 이미지, 문서에 남은 비밀번호·API 키·토큰을 찾아 그대로 접속할 수 있음
    - 노출된 비밀이 교체되지 않으면 수년간 유효하고, 사람이 아닌 서비스 키라 MFA·로그인 이상 탐지가 적용되지 않음
  reference: |-
    ■ 신원 관점
    - 대상: 소스·설정 파일 속 자격증명(T1552.001), 개인 키(T1552.004), 채팅·문서 속 자격증명(T1552.008), 공개 코드 저장소 검색(T1593.003)
    - 경로: 공개 GitHub 업로드, 빌드 산출물·Docker 이미지 잔존, 내부 스크립트 하드코딩, API 도구 공유 작업 공간 노출(SAT1005·SAT1028)
    - 연계: 비인간 신원 비밀 노출(NHI2)·과다 권한 키(IDT-NH-01.1)와 결합 — 클라우드 CL-CA-05, AI AI-02-05·AI-07-01, 공급망 SCT-SC-01.1
    ■ 실제 사례
    - [실제 사고] Uber 2016 운전자·이용자 5,700만 명 정보 유출(2016-11): 재사용 비밀번호로 엔지니어 GitHub에 들어가 비공개 저장소의 평문 AWS 접근 키로 S3 백업을 내려받음 (IDI-111)
    - [실제 사고] New York Times 소스 코드 270GB 유출(2024-01): 실수로 노출된 GitHub 토큰으로 조직 전체 저장소에 접근 (IDI-108)
    - [실제 사고] Internet Archive 연쇄 침해(2024-10): 약 2년간 방치된 GitLab 토큰으로 침투하고 교체하지 않은 Zendesk API 토큰으로 재침입 (IDI-109)
    - [실제 사고] Uber 내부망 침해(2022-09): 내부 네트워크 공유의 PowerShell 스크립트에 하드코딩된 PAM 관리자 자격증명으로 여러 내부 시스템 접근 (IDI-002, ATT&CK G1004)
    - [실제 사고] Toyota T-Connect 접근 키 5년간 공개 GitHub 노출(2022-10): 외주 개발사가 하드코딩된 키와 함께 소스를 공개 저장소에 올림 (IDI-110)
    - [실제 사고] Storm-2139 — 노출된 고객 API 키로 생성형 AI 서비스 탈취·재판매(2025-02): 공개된 곳에서 수집한 API 키로 생성형 AI 서비스 접근권을 재판매 (IDI-115)
    - [실증] Python·PyPI 관리자 GitHub 토큰의 공개 Docker 이미지 노출(2024-06): 빌드 잔존 파일로 관리자 토큰이 1년 넘게 노출, 17분 만에 폐기 (IDI-124)
    - [공개 취약점] 자격증명 노출·고정 키 KEV 판정 6건: 그룹 정책 기본 설정 저장 비밀번호(CVE-2014-1812), Check Point 게이트웨이 정보 노출(CVE-2024-24919), Kaseya VSA(CVE-2021-30116) 등
  detect: |-
    ■ 탐지
    - 저장소·CI 파이프라인·컨테이너 레지스트리에 비밀 스캐닝과 푸시 차단 적용, 공개 저장소의 조직 도메인·키 패턴 모니터링
    - 노출이 확인된 키의 사용 이력을 조회해 노출 이후 외부 출발지 사용 여부 확인(NIST SA-15)
    ■ 대응
    - 비밀은 금고·워크로드 신원으로 대체하고 코드·이미지·스크립트에 하드코딩 금지(CIS 5.5, NIST IA-5(7), ISMS-P 2.7.2, CCM IAM-14·IAM-02)
    - 노출 확인 즉시 폐기·재발급하고 침해 후에는 연동 토큰까지 전수 교체, 키 수명 단축(NIST SC-12, ISMS-P 2.5.4)

IDT-CR-02.2:
  oneline: 비밀번호 관리자·자격증명 금고 자체 침해
  summary: |-
    - 공격자는 비밀번호 관리자·자격증명 금고나 그 백업·복호화 키를 탈취해 저장된 수많은 자격증명을 한 번에 얻을 수 있음
    - 금고는 모든 계정의 열쇠를 모아 둔 곳이라 한 번 뚫리면 피해 범위가 조직·고객 전체로 커지고, 탈취 뒤 교체 대상 파악도 어려움
  reference: |-
    ■ 신원 관점
    - 대상: 개인·기업 비밀번호 관리자(T1555.005), 클라우드 비밀 관리 저장소(T1555.006), 금고 백업과 복호화 키
    - 조건: 금고 접근권자 단말 보안 미흡, 금고 키를 사람 소수가 장기간 보유, 장기 수명 비밀(NHI7) 미교체
    - 연계: 키로깅(IDT-CR-01.3)·인포스틸러(IDT-CR-01.1)에서 시작되는 경우가 많음 — 클라우드 CL-CA-05와 같은 기법
    ■ 실제 사례
    - [실제 사고] LastPass 고객 금고 백업 탈취(2022-12): 탈취한 마스터 비밀번호로 회사 금고에서 클라우드 백업 복호화 키를 얻어 고객 금고 백업을 빼냄 (IDI-071)
    - [실제 사고] Disney 사내 Slack 1.1TB 유출(2024-07): 악성 프로그램을 설치한 직원 PC에서 비밀번호 관리자에 저장된 자격증명이 탈취되어 Slack 채널 약 1만 개 유출 (IDI-070)
  detect: |-
    ■ 탐지
    - 금고·비밀 관리 저장소의 대량 조회·내보내기·백업 접근을 평소 패턴과 비교해 경보
    - 금고 관리자 계정의 새 장치·새 위치 접근, 복호화 키 사용 이력 감사
    ■ 대응
    - 금고 관리 권한을 분리하고 접근은 관리 전용 단말·하드웨어 키로 제한(CIS 5.4, NIST AC-6(5)·IA-5(18), ISMS-P 2.5.5, CCM IAM-14)
    - 백업·복호화 키를 분리 보관하고 주기적으로 교체, 침해 시 저장 비밀 전수 교체 계획 준비(NIST SC-12, ISMS-P 2.7.2, CCM CEK-19)
