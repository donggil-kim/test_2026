# [DI] 디렉터리·IdP·페더레이션 — 신원 관점 문구
# 작성 규칙: oneline 50자 이내 명사형 · summary 2줄(① 공격자는 … 수 있음 ② 피해·탐지 곤란 사유) ·
#           reference(■ 신원 관점 / ■ 실제 사례) · detect(■ 탐지 / ■ 대응). 사례는 그 행에 매핑된 사고만, 수치는 사고 DB 요약에 있는 것만.

IDT-DI-01.1:
  oneline: DCSync·NTDS.dit 탈취로 도메인 전체 계정 해시 확보
  summary: |-
    - 공격자는 복제 권한을 흉내 내거나 도메인 컨트롤러의 NTDS.dit를 복사해 KRBTGT를 포함한 도메인 전체 계정 해시를 얻을 수 있음
    - 모든 계정의 자격증명이 한 번에 넘어가 비밀번호 전수 교체 없이는 복구가 안 되고, 반복 탈취로 수년간 접근이 유지될 수 있음
  reference: |-
    ■ 신원 관점
    - 대상: 도메인 컨트롤러 복제 프로토콜(DCSync, T1003.006), NTDS.dit 파일과 볼륨 섀도 복사본(T1003.003)
    - 조건: 복제 권한을 가진 계정·서비스 계정 장악, 도메인 컨트롤러 백업·스냅샷 접근, ATT&CK에 Storm-0501(G1053)·LAPSUS$(G1004) 절차 수록
    - 연계: 얻은 KRBTGT로 티켓 위조(IDT-TS-03.1) 지속성 확보 — OT OT-LM-04와 같은 자격증명 탈취 단계
    ■ 실제 사례
    - [실제 사고] Volt Typhoon의 도메인 자격증명 반복 탈취(2024-02): 볼륨 섀도 복사본으로 NTDS.dit를 빼내 전체 도메인 계정 해시를 확보하고 수년에 걸쳐 여러 차례 반복 탈취 (IDI-095, ATT&CK G1017)
  detect: |-
    ■ 탐지
    - 도메인 컨트롤러가 아닌 호스트의 복제 요청(DCSync), 도메인 컨트롤러의 섀도 복사본 생성·NTDS.dit 접근 탐지(NIST SI-4(20)·AU-6)
    - 복제 권한이 새로 부여된 계정과 그룹 변경 경보
    ■ 대응
    - 복제 권한·도메인 컨트롤러 로그인 권한을 최소 계정으로 제한하고 관리 계층 분리(CIS 5.4, NIST AC-6(5), ISMS-P 2.5.5, CCM IAM-09·IAM-10)
    - 도메인 컨트롤러 백업·스냅샷 접근 통제, 침해 확인 시 KRBTGT·특권 계정 비밀번호 전수 교체(CIS 6.8)

IDT-DI-01.2:
  oneline: AD 권한 구성 결함·그룹 정책 악용으로 권한 확대·전사 배포
  summary: |-
    - 공격자는 AD 객체의 과다한 접근 권한, 위임 설정, 그룹 정책 편집 권한을 악용해 관리자 권한을 얻거나 모든 단말에 명령을 배포할 수 있음
    - 수년간 누적된 권한 설정이라 위험 경로가 잘 보이지 않고, 그룹 정책 한 번 수정으로 전사 단말에 랜섬웨어가 동시에 퍼짐
  reference: |-
    ■ 신원 관점
    - 대상: 그룹 정책 개체(T1484.001), AD 객체 접근 제어 목록(T1222.001), SID 기록·위임 설정(T1134.005), 로컬·도메인 그룹 구성원(T1098.007)
    - 경로: 일반 계정에 남은 과다 권한, 그룹 정책 기본 설정에 저장된 비밀번호, ATT&CK에 Storm-0501(G1053)·Indrik Spider(G0119) 절차 수록
    - 연계: OT OT-PV-02와 같은 권한 상승 단계 — 도메인 권한 장악이 곧 전사 배포 경로가 됨
    ■ 실제 사례
    - [실제 사고] Prestige 랜섬웨어(2022-10): 도메인 관리자 수준 권한 확보 후 Default Domain 그룹 정책 개체를 바꿔 랜섬웨어 실행 작업을 전체 도메인에 배포 (IDI-028, ATT&CK G0034)
    - [공개 취약점] 그룹 정책 기본 설정(GPP)에 저장된 비밀번호(CVE-2014-1812) — KEV 판정 1건
  detect: |-
    ■ 탐지
    - 그룹 정책 개체 생성·수정, 특권 그룹 구성원 변경, 민감 객체 접근 권한 변경을 실시간 경보
    - 정기적으로 AD 공격 경로를 분석해 일반 계정에서 도메인 관리자로 가는 권한 사슬 점검
    ■ 대응
    - 그룹 정책 편집·위임 권한 최소화와 정기 권한 검토(CIS 6.8·5.4, NIST AC-6·AC-6(7), ISMS-P 2.5.5·2.5.6, CCM IAM-05·IAM-08)
    - AD 보안 구성 기준선 적용과 GPP 비밀번호 제거(NIST CM-6)

IDT-DI-01.3:
  oneline: AD 인증서 서비스 발급 통제 미흡으로 특권 신원 인증서 오발급
  summary: |-
    - 공격자는 AD 인증서 서비스의 발급 통제가 느슨한 환경에서 특권 계정·서버 명의 인증서를 부적절하게 얻어 그 신원으로 인증할 수 있음
    - 인증서는 비밀번호 변경과 무관하게 유효기간 동안 쓰이고, 인증서 서비스가 신원 체계의 핵심 자산으로 관리되지 않는 경우가 많음
  reference: |-
    ■ 신원 관점
    - 침해 지점: AD 인증서 서비스(AD CS)의 템플릿·등록 권한·웹 등록 구성, 인증서 기반 Kerberos 인증(T1649)
    - 조건: 오래된 기본 템플릿 방치, 인증서 발급 승인·검토 절차 부재, 인증서 서비스를 도메인 컨트롤러보다 낮은 등급으로 관리
    - 연계: 강제 인증·릴레이(IDT-TS-02.3)와 결합하면 도메인 장악으로 이어질 수 있음
    ■ 실제 사례
    - 공개 사고 미확인 — 오설정 위험은 연구로 공개되고 관련 결함이 KEV에 등재됐으나 사고 경위로 공개된 침해 사례는 아직 확인되지 않음
    - [실증] Certified Pre-Owned(2021-06): AD 인증서 서비스 오설정으로 저권한 사용자가 도메인을 장악할 수 있는 위험 유형을 공개 (IDI-119)
    - [실증] PetitPotam(2021-07): 인증서 서비스 웹 등록 구성이 도메인 컨트롤러 인증서 오발급 경로가 될 수 있음을 공개 (IDI-118)
    - [공개 취약점] AD 인증서 서비스·강제 인증 KEV 판정 2건: Certifried(CVE-2022-26923), LSA 스푸핑(CVE-2021-36942)
  detect: |-
    ■ 탐지
    - 특권 계정·도메인 컨트롤러 명의로 발급된 인증서와 요청자 불일치, 평소와 다른 템플릿 발급 이력 감사
    - 인증서 템플릿·등록 권한·인증 기관 설정 변경을 고위험 이벤트로 경보
    ■ 대응
    - 인증서 서비스를 최상위 계층 자산으로 지정하고 템플릿·등록 권한 정기 점검, 불필요 템플릿·웹 등록 비활성화(CIS 6.6, NIST CM-6, CCM IAM-15)
    - 인증서 발급 승인 절차와 수명 관리, 침해 시 발급 인증서 폐기(NIST SC-17·IA-5(2), ISMS-P 2.7.2, CCM CEK-11)

IDT-DI-01.4:
  oneline: 도메인 컨트롤러 취약점으로 도메인 관리자 권한 장악
  summary: |-
    - 공격자는 패치되지 않은 도메인 컨트롤러·디렉터리 서비스 취약점으로 일반 사용자나 네트워크 접근만으로 도메인 관리자 권한을 얻을 수 있음
    - 공개 공격 도구가 빠르게 퍼져 경험이 적은 공격자도 악용하고, 침투에서 도메인 전체 암호화까지 몇 시간이면 끝날 수 있음
  reference: |-
    ■ 신원 관점
    - 침해 지점: 도메인 컨트롤러의 인증·계정 관리 서비스, Kerberos 키 배포 센터(T1068·T1210)
    - 조건: 도메인 컨트롤러 긴급 패치 지연, 내부망에서 도메인 컨트롤러로 가는 접근 제한 부재
    - 연계: OT OT-PV-01과 같은 권한 상승 단계 — 장악 직후 그룹 정책 배포(IDT-DI-01.2)·랜섬웨어(IDT-IM-02)로 이어짐
    ■ 실제 사례
    - [실제 사고] Ryuk의 Zerologon 악용으로 5시간 만에 도메인 전체 암호화(2020-10): 도메인 컨트롤러 취약점으로 도메인 관리자 권한을 얻고 5시간 만에 도메인 전체 암호화 (IDI-096, ATT&CK S0446)
    - [위협인텔] Conti 랜섬웨어 공격 매뉴얼 유출(2021-08): 유출된 교육 자료에 디렉터리 취약점으로 도메인 관리자 권한을 얻는 절차가 포함 (IDI-099, ATT&CK S0575)
    - [공개 취약점] 디렉터리 서비스 KEV 판정 4건: Netlogon(CVE-2020-1472), AD 도메인 서비스 권한 상승(CVE-2021-42278·CVE-2021-42287), Kerberos KDC(CVE-2014-6324)
  detect: |-
    ■ 탐지
    - 도메인 컨트롤러 계정 비밀번호 재설정, 비정상 컴퓨터 계정 이름 변경 등 알려진 악용 흔적 이벤트 경보
    - KEV 등재·공급업체 공지 즉시 도메인 컨트롤러 노출 여부 점검(NIST RA-5)
    ■ 대응
    - 도메인 컨트롤러 보안 패치를 최우선 일정으로 적용(NIST SI-2, ISMS-P 2.5.5)
    - 도메인 컨트롤러로 가는 네트워크 접근을 관리 계층으로 제한하고 핵심 자산 구성 기준선 관리(CIS 6.6, CCM IAM-15)

IDT-DI-02:
  oneline: 하이브리드 ID 동기화 서버 장악으로 클라우드 테넌트 확산
  summary: |-
    - 공격자는 온프레미스를 장악한 뒤 Entra Connect 같은 동기화·페더레이션 서버와 그 서비스 계정을 손에 넣어 클라우드 테넌트까지 장악할 수 있음
    - 동기화 계정은 클라우드 고권한이 붙은 비인간 신원이라 MFA가 없고, 온프레미스 침해가 클라우드 자원·백업 삭제로 번짐
  reference: |-
    ■ 신원 관점
    - 침해 지점: 디렉터리 동기화 서버와 동기화 서비스 계정(NHI5), 하이브리드 인증 에이전트(T1556.007), 클라우드 관리자 계정(T1078.004)
    - 조건: 동기화 서버를 일반 서버 등급으로 관리, 동기화 계정에 전역 관리자급 권한, MFA 없는 클라우드 관리자 계정
    - 연계: 클라우드 CL-PV-02와 같은 권한 상승 — 테넌트 설정 변조(IDT-DI-03.2)로 이어짐
    ■ 실제 사례
    - [실제 사고] Storm-0501 하이브리드 환경 랜섬웨어(2024-09): 동기화 서버 계정 자격증명을 탈취해 MFA 없는 클라우드 관리자 계정으로 클라우드 자원·백업 삭제와 랜섬웨어 실행 (IDI-022, ATT&CK G1053)
    - [실제 사고] MERCURY·DEV-1084 하이브리드 환경 파괴 공격(2023-04): 동기화 에이전트의 특권 계정 자격증명으로 클라우드에 접근해 클라우드·온프레미스 자원 대량 삭제 (IDI-023)
  detect: |-
    ■ 탐지
    - 동기화 서비스 계정의 대화형 로그인·평소와 다른 출발지·동기화 외 작업, 동기화 서버의 비정상 프로세스 탐지(NIST SI-4)
    - 클라우드 관리자 비밀번호 변경·역할 부여·페더레이션 도메인 추가를 고위험 이벤트로 경보
    ■ 대응
    - 동기화·페더레이션 서버를 도메인 컨트롤러와 같은 최상위 계층으로 보호하고 관리 접근 분리(CIS 5.4·6.6, NIST AC-6(5)·IA-13, ISMS-P 2.5.5, CCM IAM-09)
    - 동기화 계정 권한 최소화, 클라우드 관리자 계정은 클라우드 전용·MFA 필수(CCM IAM-10)

IDT-DI-03.1:
  oneline: IdP·인증 서비스 공급업체 침해로 고객 신원 연쇄 노출
  summary: |-
    - 공격자는 IdP·MFA·디렉터리 SaaS 공급업체를 침해해 그 서비스를 쓰는 여러 고객 조직의 신원 정보·세션·관리 기능에 접근할 수 있음
    - 고객은 공급업체 내부를 볼 수 없어 공지 전까지 침해를 알기 어렵고, 한 업체 침해가 수많은 고객사의 신원 신뢰로 번짐
  reference: |-
    ■ 신원 관점
    - 침해 지점: IdP 지원·운영 시스템, OTP 시드·MFA 메시지 공급망, 디렉터리 SaaS 관리 기능(T1199·T1195)
    - 조건: 공급업체 직원 계정·운영 키 관리 미흡, 고객 지원 자료에 세션 정보 포함, 제3자 신원 서비스 위험 평가 부재(NHI3)
    - 연계: 클라우드 CL-IA-06, 공급망 SCT-CS-02.3과 같은 신뢰 관계 악용
    ■ 실제 사례
    - [실제 사고] Okta 지원 시스템 침해(2023-10): 지원 시스템 서비스 계정 탈취로 고객이 첨부한 파일의 세션 정보가 노출되어 고객 134곳에 영향 (IDI-019)
    - [실제 사고] Storm-0558 Microsoft 계정 서명 키 탈취와 토큰 위조(2023-07): IdP 공급업체의 서명 키 관리 실패로 약 25개 조직 메일이 열람됨 (IDI-026)
    - [실제 사고] OneLogin 미국 데이터센터 고객 데이터 침해(2017-05): 탈취된 클라우드 키로 약 7시간 정찰하며 사용자·앱·키 정보 DB에 접근 (IDI-081)
    - [실제 사고] RSA SecurID 시드 정보 탈취와 Lockheed Martin 침투 시도(2011-03): 일회용 비밀번호 토큰 관련 정보가 유출되어 고객사 침투 시도에 쓰임 (IDI-080)
    - [실제 사고] JumpCloud 디렉터리 SaaS 침해와 고객 단말 명령 악용(2023-06): 디렉터리 SaaS의 고객 단말 명령 기능이 악용되어 고객 일부(5곳 미만)가 표적 (IDI-083)
    - [실제 사고] Cisco Duo SMS·음성 MFA 공급업체 침해(2024-04): MFA 통신 공급업체의 메시지 로그가 유출되어 약 1천 고객에 통지 (IDI-082)
  detect: |-
    ■ 탐지
    - 공급업체 보안 공지·침해 통지 채널 구독과 공지 즉시 자사 테넌트 감사 로그 점검
    - 공급업체 지원 인력의 테넌트 접근, 지원 기능을 통한 관리 작업을 별도 감사
    ■ 대응
    - IdP·MFA 공급업체를 핵심 공급망으로 분류해 보안 요구 사항 계약·정기 평가(NIST SA-9·SR-6, ISMS-P 2.3.3, CCM STA-09)
    - 공급업체 침해 시 세션·토큰·연동 키 전수 교체 계획 준비, 지원 자료 업로드 전 세션 정보 제거(CIS 6.6, NIST IA-13, CCM IAM-11)

IDT-DI-03.2:
  oneline: IdP 관리 권한 장악 후 테넌트 신뢰 설정 변조
  summary: |-
    - 공격자는 IdP 관리자 권한을 얻은 뒤 외부 IdP·페더레이션 도메인 추가, 인증 정책·앱 자격증명 변경으로 원하는 사용자 명의 접근 경로를 만들 수 있음
    - 정상 관리 기능을 쓴 변경이라 눈에 띄지 않고, 사용자 비밀번호를 모두 바꿔도 신뢰 설정이 남아 있으면 접근이 계속됨
  reference: |-
    ■ 신원 관점
    - 침해 지점: 테넌트 도메인·신뢰 설정(T1484.002), 하이브리드 인증 구성(T1556.007), 앱·서비스 주체에 추가된 자격증명(T1098.003)
    - 조건: 최고 관리자 MFA 초기화가 헬프데스크 통화로 가능, 관리자 역할 과다 보유, 테넌트 설정 변경 감사 부재
    - 연계: 외부 IdP 신뢰 추가는 Push 매트릭스 SAT1041·SAT1047과 같은 위험 — 클라우드 CL-PV-02·CL-PE-02
    ■ 실제 사례
    - [실제 사고] MGM Resorts 랜섬웨어(2023-09): 헬프데스크 사칭으로 IdP·클라우드 관리 권한을 얻어 약 100대 하이퍼바이저 암호화, 약 1억 달러 손실 (IDI-005, ATT&CK G1015)
    - [실제 사고] Okta 고객 대상 헬프데스크 사칭·교차 테넌트 사칭(2023-08): 최고 관리자 MFA 초기화 후 두 번째 IdP를 신뢰하도록 구성해 다른 사용자 명의로 앱 접근 (IDI-007)
    - [실제 사고] SolarWinds 침해 이후 클라우드 장악(2020-12): 신뢰 도메인 추가와 기존 앱·서비스 주체 자격증명 추가로 클라우드에 지속 접근 (IDI-027, ATT&CK C0024)
    - [실제 사고] Storm-0501 하이브리드 환경 랜섬웨어(2024-09): 악성 페더레이션 도메인을 추가해 거의 모든 사용자로 로그인할 수 있는 백도어 생성 (IDI-022, ATT&CK G1053)
  detect: |-
    ■ 탐지
    - 외부 IdP·페더레이션 도메인 추가, 인증 정책 변경, 앱·서비스 주체 자격증명 추가를 실시간 고위험 경보(NIST AU-6)
    - 최고 관리자 MFA 초기화 직후의 관리 작업과 익명 프록시 출발지 관리자 로그인 상관 분석
    ■ 대응
    - 최고 관리자 수 최소화·관리 전용 계정과 피싱 저항 MFA, 관리자 MFA 초기화에 다중 승인 요구(CIS 6.5, NIST AC-6(5), ISMS-P 2.5.5, CCM IAM-09·IAM-10)
    - 테넌트 신뢰 설정 기준선 관리와 정기 대조, 변경 시 이중 승인(CIS 6.6, NIST CM-6·IA-13)

IDT-DI-04:
  oneline: 인증 서버 백도어로 임의 사용자 인증 허용
  summary: |-
    - 공격자는 관리자 권한을 얻은 뒤 페더레이션 서버·도메인 컨트롤러의 인증 처리 과정을 변조해 자신이 원하는 방식으로 어떤 사용자로든 인증받을 수 있음
    - 정상 인증 결과로 보이고 비밀번호·MFA 변경과 무관해, 인증 서버의 파일·메모리 무결성을 따로 점검하지 않으면 드러나지 않음
  reference: |-
    ■ 신원 관점
    - 침해 지점: 도메인 컨트롤러 인증 프로세스(T1556.001), 비밀번호 필터·인증 모듈(T1556.002), 페더레이션 서버 구성 요소, 디렉터리 복제(T1207)
    - 조건: 인증 서버 관리자 권한 장악, 인증 서버 파일 무결성 감시 부재
    - 연계: 클라우드 CL-PE-02와 같은 지속성 단계 — 서명 인증서 탈취(IDT-TS-03.2)와 함께 쓰이기도 함
    ■ 실제 사례
    - [실제 사고] MagicWeb — AD FS 서버 인증 백도어(2022-08): 페더레이션 서버의 정상 구성 요소를 바꿔 어떤 사용자로든 인증되게 한 백도어를 실제 고객 환경에서 발견 (IDI-024, ATT&CK G0016)
    - [실제 사고] FoggyWeb — AD FS 토큰 서명 인증서·구성 탈취 백도어(2021-09): 장악한 페더레이션 서버에 상주하며 구성 DB와 서명 인증서를 빼냄 (IDI-025, ATT&CK S0661)
    - [실제 사고] Skeleton Key — 도메인 컨트롤러 인증 메모리 패치 악성코드(2015-01): 도메인 컨트롤러 인증 과정을 변조해 공격자가 정한 비밀번호 하나로 어떤 사용자로든 인증 (IDI-098, ATT&CK S0007)
    - [공개 취약점] AD FS 접근 통제 세분화 부족(CVE-2026-56155) — KEV 판정 1건
  detect: |-
    ■ 탐지
    - 도메인 컨트롤러·페더레이션 서버의 인증 관련 파일·모듈 변경, 서명되지 않은 모듈 로드를 무결성 감시로 탐지(NIST SI-7·SI-4, ISMS-P 2.9.4)
    - 비밀번호 변경 없이 여러 계정이 같은 방식으로 인증되는 이상 패턴, 비정상 복제 요청 경보(CCM LOG-03)
    ■ 대응
    - 인증 서버 관리 권한을 최상위 계층으로 분리하고 불필요한 구성 요소·기능 제거(CIS 6.6, NIST CM-7, CCM IAM-15)
    - 인증 서버 침해 의심 시 재구축을 기본으로 하고 서명 인증서·KRBTGT 교체를 함께 수행
