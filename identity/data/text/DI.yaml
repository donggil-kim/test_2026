# [DI] 디렉터리·IdP·페더레이션 — 신원 관점 문구
# 작성 규칙: oneline 50자 이내 명사형 · summary 2줄(① 공격자는 … 수 있음 ② 피해·탐지 곤란 사유) ·
#           reference(■ 신원 관점 / ■ 실제 사례) · detect(■ 탐지 / ■ 대응). 사례는 그 행에 매핑된 사고만, 수치는 사고 DB 요약에 있는 것만.

IDT-DI-01.1:
  oneline: DCSync·NTDS.dit 탈취로 도메인 전체 계정 해시 확보
  summary: |-
    - 공격자는 복제 권한을 흉내 내거나 도메인 컨트롤러의 NTDS.dit를 복사해 KRBTGT를 포함한 도메인 전체 계정 해시를 얻을 수 있음
    - 모든 계정의 자격증명이 한 번에 넘어가 비밀번호 전수 교체 없이는 복구가 안 되고, 반복 탈취로 수년간 접근이 유지될 수 있음
  reference: |-
    ■ 신원 관점
    - 대상: 도메인 컨트롤러 복제 프로토콜(DCSync, T1003.006), NTDS.dit 파일과 볼륨 섀도 복사본(T1003.003)
    - 조건: 복제 권한을 가진 계정·서비스 계정 장악, 도메인 컨트롤러 백업·스냅샷 접근, ATT&CK에 Storm-0501(G1053)·LAPSUS$(G1004) 절차 수록
    - 연계: 얻은 KRBTGT로 티켓 위조(IDT-TS-03.1) 지속성 확보 — OT OT-LM-04와 같은 자격증명 탈취 단계
    ■ 실제 사례
    - [실제 사고] Volt Typhoon의 도메인 자격증명 반복 탈취(2024-02): 볼륨 섀도 복사본으로 NTDS.dit를 빼내 전체 도메인 계정 해시를 확보하고 수년에 걸쳐 여러 차례 반복 탈취 (IDI-095, ATT&CK G1017)
  detect: |-
    ■ 탐지
    - 도메인 컨트롤러가 아닌 호스트의 복제 요청(DCSync), 도메인 컨트롤러의 섀도 복사본 생성·NTDS.dit 접근 탐지(NIST SI-4(20)·AU-6)
    - 복제 권한이 새로 부여된 계정과 그룹 변경 경보
    ■ 대응
    - 복제 권한·도메인 컨트롤러 로그인 권한을 최소 계정으로 제한하고 관리 계층 분리(CIS 5.4, NIST AC-6(5), ISMS-P 2.5.5, CCM IAM-09·IAM-10)
    - 도메인 컨트롤러 백업·스냅샷 접근 통제, 침해 확인 시 KRBTGT·특권 계정 비밀번호 전수 교체(CIS 6.8)

IDT-DI-01.2:
  oneline: AD 권한 구성 결함·그룹 정책 악용으로 권한 확대·전사 배포
  summary: |-
    - 공격자는 AD 객체의 과다한 접근 권한, 위임 설정, 그룹 정책 편집 권한을 악용해 관리자 권한을 얻거나 모든 단말에 명령을 배포할 수 있음
    - 수년간 누적된 권한 설정이라 위험 경로가 잘 보이지 않고, 그룹 정책 한 번 수정으로 전사 단말에 랜섬웨어가 동시에 퍼짐
  reference: |-
    ■ 신원 관점
    - 대상: 그룹 정책 개체(T1484.001), AD 객체 접근 제어 목록(T1222.001), SID 기록·위임 설정(T1134.005), 로컬·도메인 그룹 구성원(T1098.007)
    - 경로: 일반 계정에 남은 과다 권한, 그룹 정책 기본 설정에 저장된 비밀번호, ATT&CK에 Storm-0501(G1053)·Indrik Spider(G0119) 절차 수록
    - 연계: OT OT-PV-02와 같은 권한 상승 단계 — 도메인 권한 장악이 곧 전사 배포 경로가 됨
    ■ 실제 사례
    - [실제 사고] Prestige 랜섬웨어(2022-10): 도메인 관리자 수준 권한 확보 후 Default Domain 그룹 정책 개체를 바꿔 랜섬웨어 실행 작업을 전체 도메인에 배포 (IDI-028, ATT&CK G0034)
    - [공개 취약점] 그룹 정책 기본 설정(GPP)에 저장된 비밀번호(CVE-2014-1812) — KEV 판정 1건
  detect: |-
    ■ 탐지
    - 그룹 정책 개체 생성·수정, 특권 그룹 구성원 변경, 민감 객체 접근 권한 변경을 실시간 경보
    - 정기적으로 AD 공격 경로를 분석해 일반 계정에서 도메인 관리자로 가는 권한 사슬 점검
    ■ 대응
    - 그룹 정책 편집·위임 권한 최소화와 정기 권한 검토(CIS 6.8·5.4, NIST AC-6·AC-6(7), ISMS-P 2.5.5·2.5.6, CCM IAM-05·IAM-08)
    - AD 보안 구성 기준선 적용과 GPP 비밀번호 제거(NIST CM-6)
