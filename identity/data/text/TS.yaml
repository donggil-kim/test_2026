# [TS] 토큰·세션·티켓 — 신원 관점 문구
# 작성 규칙: oneline 50자 이내 명사형 · summary 2줄(① 공격자는 … 수 있음 ② 피해·탐지 곤란 사유) ·
#           reference(■ 신원 관점 / ■ 실제 사례) · detect(■ 탐지 / ■ 대응). 사례는 그 행에 매핑된 사고만, 수치는 사고 DB 요약에 있는 것만.

IDT-TS-01.1:
  oneline: MFA를 마친 세션 쿠키를 훔쳐 그대로 재사용
  summary: |-
    - 공격자는 중간자 피싱·악성코드·유출 파일로 MFA를 마친 세션 쿠키를 얻어 비밀번호·MFA 없이 피해자 세션으로 들어갈 수 있음
    - 인증이 이미 끝난 세션이라 로그인 이벤트가 새로 남지 않고, 세션 수명이 길면 비밀번호를 바꿔도 접근이 유지됨
  reference: |-
    ■ 신원 관점
    - 대상: SSO·SaaS·메일·메신저의 웹 세션 쿠키(T1539), 지원 요청에 첨부된 HAR 파일, 브라우저 세션 자체(T1185)
    - 경로: 중간자(AiTM) 피싱 프록시, 인포스틸러 쿠키 판매, 지원 시스템 업로드 파일, 다른 위치에서 쿠키 재사용(T1550.004·SAT1044)
    - 연계: 탈취 세션으로 MFA 장치 추가·메일 규칙 생성 등 지속성 확보(SAT1017) — 클라우드 CL-CA-03, AI AI-07-02, 공급망 SCT-DE-01.1·SCT-SC-03.2
    ■ 실제 사례
    - [실제 사고] AiTM 피싱으로 세션 쿠키 탈취 후 BEC(2022-07): 1만 개 이상 조직을 겨냥한 프록시 피싱이 MFA 이후 세션 쿠키를 가로채 메일함 장악·송금 유도 (IDI-029)
    - [실제 사고] Okta 지원 시스템 침해(2023-10): 고객이 지원 요청에 첨부한 HAR 파일에서 세션 토큰을 추출해 고객 134곳에 영향 (IDI-019)
    - [실제 사고] CircleCI 고객 비밀 유출(2023-01): 2FA를 마친 SSO 세션 쿠키를 악성코드로 훔쳐 운영 시스템에 접근 (IDI-073)
    - [실제 사고] Electronic Arts 소스 코드 탈취(2021-06): 약 10달러에 산 직원 Slack 세션 쿠키로 사내 Slack에 들어가 IT 지원팀을 속임 (IDI-064)
    - [실제 사고] Genesis Market 폐쇄(2023-04): 세션 쿠키·브라우저 지문을 묶어 판매해 구매자가 피해자를 흉내 내 로그인 (IDI-067)
    - [위협인텔] Tycoon 2FA 피싱 서비스(2024-03): 중간자 프록시로 MFA 완료 후 세션 쿠키를 가로채는 키트, 관련 도메인 1,100개 이상 (IDI-066)
    - [공개 취약점] 헬프데스크 세션 고정 KEV 판정 1건: Zammad 세션 고정(CVE-2026-102489)
  detect: |-
    ■ 탐지
    - 같은 세션 ID가 다른 IP·ASN·장치·브라우저 지문에서 쓰이는 세션 하이재킹 탐지, 세션 중 위치 급변 경보
    - 탐지 직후 새 MFA 장치 등록·받은편지함 규칙 생성·OAuth 앱 동의를 고위험 후속 행위로 상관 분석
    ■ 대응
    - 피싱 저항 MFA로 AiTM 탈취 자체를 막고 세션을 장치에 묶는 토큰 바인딩·장치 신뢰 조건 적용(CIS 6.3, NIST SC-23, ISMS-P 2.5.3, CCM IAM-13)
    - 세션 수명·유휴 시간 단축, 위험 이벤트 시 재인증 요구와 전체 세션 폐기(NIST AC-12·IA-11)
    - 지원 요청 첨부 HAR·로그 파일의 쿠키·토큰 자동 제거

IDT-TS-01.2:
  oneline: 리프레시 토큰·PRT 등 장기 토큰 탈취로 지속 접근
  summary: |-
    - 공격자는 디바이스 코드 피싱·장치 등록·토큰 탈취로 리프레시 토큰이나 주 리프레시 토큰(PRT)을 얻어 비밀번호 없이 계속 새 액세스 토큰을 받을 수 있음
    - 장기 토큰은 비밀번호 변경 뒤에도 남는 경우가 많고, 정상 앱의 토큰 갱신으로 보여 탐지와 회수가 늦어짐
  reference: |-
    ■ 신원 관점
    - 대상: OAuth 리프레시 토큰(T1528), PRT·장치 등록 기반 토큰, API 테스트 도구·연동 앱이 가진 OAuth 토큰(SAT1027)
    - 경로: 디바이스 코드 흐름 악용, 테넌트에 공격자 장치 등록, 토큰 재사용(T1550.001), 발급된 토큰 열거(SAT1026)
    - 연계: 장기 수명 비밀(NHI7)과 같은 회수 문제 — 클라우드 CL-CA-03, AI AI-07-02, 공급망 SCT-SC-02.3
    ■ 실제 사례
    - [실제 사고] Storm-2372 디바이스 코드 피싱 캠페인(2025-02): 정상 로그인 페이지에서 디바이스 코드를 입력하게 해 액세스·리프레시 토큰을 얻고, 이후 장치를 등록해 주 리프레시 토큰 확보 (IDI-031)
    - [실제 사고] 러시아 SVR의 클라우드 초기 접근 수법 변화(2024-02): 훔친 액세스 토큰으로 비밀번호 없이 로그인하고 자기 장치를 테넌트에 새 장치로 등록 (IDI-094, ATT&CK G0016)
    - [실제 사고] Slack 직원 토큰 탈취로 외부 호스팅 GitHub 저장소 반출(2022-12): 탈취한 직원 토큰으로 비공개 코드를 내려받아 Slack이 토큰을 모두 무효화 (IDI-107)
  detect: |-
    ■ 탐지
    - 디바이스 코드 흐름 사용과 새 장치 등록을 평소 사용 이력과 비교해 경보, 등록 직후 다른 위치의 토큰 사용 점검
    - 리프레시 토큰이 사용자 평소 위치·장치와 다른 곳에서 갱신되는 이벤트 상관 분석
    ■ 대응
    - 디바이스 코드 흐름은 필요한 앱·사용자로 제한하고 장치 등록에 MFA·관리 장치 조건 요구(CIS 6.2, ISMS-P 2.5.3, CCM IAM-14)
    - 리프레시 토큰 수명 제한·토큰 보호(장치 바인딩) 적용, 침해 의심 시 사용자 토큰 전체 폐기(NIST IA-11·AC-12·SC-23)

IDT-TS-01.3:
  oneline: 원격 접속 장비 메모리 노출로 인증 세션 탈취
  summary: |-
    - 공격자는 VPN·원격 접속 게이트웨이의 메모리 노출 결함으로 이미 인증된 사용자의 세션 토큰을 읽어 비밀번호·MFA 없이 접속할 수 있음
    - 패치 후에도 이미 빼낸 세션은 계속 유효해 세션 폐기를 함께 하지 않으면 침입이 이어지고, 장비 로그가 부족해 확인이 어려움
  reference: |-
    ■ 신원 관점
    - 대상: SSL VPN·원격 접속 게이트웨이·ADC가 메모리에 보관하는 인증 세션, 경계 장비의 평문 자격증명 파일
    - 수법: 외부 노출 장비 취약점 악용(T1190) 후 빼낸 세션 쿠키 재사용(T1550.004)
    - 연계: 원격 접속 장비 인증 우회(IDT-AU-04.1)와 같은 장비군 — 접속 후 랜섬웨어·데이터 반출로 확산
    ■ 실제 사례
    - [실제 사고] Comcast Xfinity 고객 3,590만 명 정보 유출(2023-12): 패치 공개 직후 Citrix Bleed로 내부 시스템 무단 접근, 사용자 이름·해시 비밀번호 유출 (IDI-089)
    - [실제 사고] Citrix Bleed 세션 토큰 탈취와 LockBit 랜섬웨어(2023-11): 유효한 세션 쿠키를 빼내 사용자 이름·비밀번호·MFA 없이 인증 세션을 만든 뒤 랜섬웨어 배포 (IDI-088)
    - [실제 사고] CitrixBleed 2 세션 토큰 탈취 악용(2025-07): 로그인 전 단계에서 세션 토큰을 빼내 MFA를 우회, 랜섬웨어 배포로 이어진 사례 분석 (IDI-090)
    - [공개 취약점] 세션·토큰 노출 KEV 판정 5건: Citrix Bleed(CVE-2023-4966), CitrixBleed 2(CVE-2025-5777), SonicOS SSLVPN 세션 가로채기(CVE-2024-53704) 등
  detect: |-
    ■ 탐지
    - 장비 보안 공지·KEV 등재를 즉시 확인하고 해당 장비 세션의 출발지 IP가 로그인 IP와 달라지는 세션 재사용 점검
    - 원격 접속 세션 뒤 내부망 대량 탐색·관리 도구 실행을 상관 분석
    ■ 대응
    - 경계 장비 긴급 패치 후 모든 활성 세션 강제 종료·재인증(NIST SI-2·AC-12, ISMS-P 2.6.6)
    - 원격 접속 세션을 장치·출발지에 묶고 세션 수명 단축, 관리 인터페이스 외부 노출 금지(CIS 6.4, NIST SC-23, CCM IAM-13)

IDT-TS-02.1:
  oneline: 해시·Kerberos 티켓 재사용으로 비밀번호 없이 횡적 이동
  summary: |-
    - 공격자는 덤프한 NTLM 해시나 Kerberos 티켓을 그대로 제시해 비밀번호를 몰라도 다른 서버·단말에 인증할 수 있음
    - 정상 Windows 인증 흐름이라 구분이 어렵고, 같은 로컬 관리자 비밀번호·도메인 관리자 로그인 흔적이 있으면 조직 전체로 번짐
  reference: |-
    ■ 신원 관점
    - 대상: NTLM 해시(T1550.002), Kerberos TGT·서비스 티켓(T1550.003), 공통 로컬 관리자 계정
    - 경로: 자격증명 덤프(IDT-CR-01.2) 후 원격 실행 도구·관리 공유로 다른 시스템 인증, ATT&CK에 APT28(G0007)·Wizard Spider(G0102)·APT29(G0016) 절차 수록
    - 연계: 클라우드 CL-LM-01, OT OT-LM-02와 같은 횡적 이동 단계
    ■ 실제 사례
    - [실제 사고] NotPetya의 자격증명 탈취·재사용 확산(2017-06): 빼낸 Windows 자격증명을 PsExec·WMIC로 재사용해 도메인 관리자 자격증명이 넘어가면 조직 전체로 번짐 (IDI-097, ATT&CK S0368)
  detect: |-
    ■ 탐지
    - 대화형 로그인 없이 NTLM 네트워크 로그인이 여러 호스트로 퍼지는 패턴, 비정상 암호화 유형의 Kerberos 티켓 사용 탐지(NIST SI-4)
    - 관리자 계정이 평소와 다른 단말에서 원격 실행 도구를 쓰는 이벤트 경보
    ■ 대응
    - 단말별 고유 로컬 관리자 비밀번호, 관리 계층 분리로 특권 자격증명이 일반 단말에 남지 않게 함(CIS 5.4, NIST AC-6(5), ISMS-P 2.5.5, CCM IAM-09)
    - NTLM 사용 축소와 재전송 방지 인증 적용(NIST IA-2(8))

IDT-TS-02.2:
  oneline: Kerberoasting으로 서비스 계정 비밀번호 오프라인 해독
  summary: |-
    - 공격자는 일반 도메인 계정만으로 서비스 계정의 Kerberos 티켓을 요청해 오프라인으로 해독, 특권 서비스 계정 비밀번호를 얻을 수 있음
    - 정상 티켓 요청이라 눈에 띄지 않고, 오래된 약한 비밀번호·RC4 암호화를 쓰는 서비스 계정이 흔해 해독이 쉬움
  reference: |-
    ■ 신원 관점
    - 대상: 서비스 주체 이름(SPN)이 붙은 서비스 계정(T1558.003), 사전 인증이 꺼진 계정(T1558.004)
    - 조건: RC4 허용 도메인, 수년간 바뀌지 않은 서비스 계정 비밀번호(NHI7), 도메인 관리자 수준 과다 권한(NHI5)
    - 연계: 얻은 특권 서비스 계정으로 AD 장악(IDT-DI-03.2)·랜섬웨어 배포로 이어짐, ATT&CK에 Wizard Spider(G0102)·FIN7(G0046) 절차 수록
    ■ 실제 사례
    - [실제 사고] Ascension 랜섬웨어(2024-05): RC4 암호화를 허용하던 AD에서 Kerberoasting으로 특권 계정을 얻어 수천 대에 랜섬웨어 배포, 환자 560만 명 데이터 반출 (IDI-021, ATT&CK S1070)
  detect: |-
    ■ 탐지
    - 한 계정이 짧은 시간에 여러 SPN의 서비스 티켓을 요청하거나 RC4 암호화 티켓을 요청하는 이벤트 탐지
    - 미끼 SPN 계정을 만들어 티켓 요청 자체를 경보로 사용
    ■ 대응
    - 서비스 계정은 관리형 서비스 계정·긴 무작위 비밀번호로 전환하고 RC4 비활성화(CIS 5.2·5.5, NIST IA-5(1)·SC-12, ISMS-P 2.5.4, CCM IAM-14)
    - 서비스 계정 권한 최소화와 도메인 관리자 그룹 제외(NIST AC-6(5), ISMS-P 2.5.5, CCM IAM-10)

IDT-TS-02.3:
  oneline: 강제 인증 유도와 NTLM 릴레이로 서버 신원 도용
  summary: |-
    - 공격자는 서버·사용자가 공격자에게 NTLM 인증을 하도록 강제하고 이를 다른 서비스로 중계해 그 신원으로 인증받을 수 있음
    - 도메인 컨트롤러 같은 핵심 서버도 인증 없이 유도될 수 있어 도메인 장악까지 짧고, 메일 미리보기만으로 해시가 새기도 함
  reference: |-
    ■ 신원 관점
    - 대상: 도메인 컨트롤러·Exchange·인증서 서비스 웹 등록 페이지, 사용자 NTLM 해시(T1187)
    - 수법: 원격 프로시저 호출로 강제 인증 유도, 이름 해석 오염·SMB 릴레이(T1557.001), Outlook 알림·파일 미리보기로 해시 유출
    - 연계: 인증서 서비스 악용(IDT-DI-01.3)과 결합해 도메인 장악 — OT OT-CO-03과 같은 중간자 기법
    ■ 실제 사례
    - 공개 사고 미확인 — 아래 실증·취약점은 악용이 확인된 결함이며 사고 경위로 공개된 침해 사례는 아직 확인되지 않음
    - [실증] PetitPotam(2021-07): 인증 없이 도메인 컨트롤러의 NTLM 인증을 강제해 인증서 서비스로 중계, 도메인 컨트롤러 인증서 발급 (IDI-118)
    - [공개 취약점] 강제 인증·NTLM 릴레이 KEV 판정 6건: LSA 스푸핑(CVE-2021-36942), Outlook NTLM 해시 유출(CVE-2023-23397), Exchange NTLM 릴레이(CVE-2024-21410) 등
  detect: |-
    ■ 탐지
    - 도메인 컨트롤러·서버가 외부·비정상 호스트로 NTLM 인증을 시도하는 이벤트, 짧은 시간 내 같은 계정의 다른 출발지 인증 탐지
    - 외부로 나가는 SMB·WebDAV 연결과 UNC 경로 알림이 든 메일 탐지
    ■ 대응
    - SMB·LDAP 서명과 채널 바인딩·EPA 적용, NTLM 사용 축소(CIS 6.7, NIST IA-2(8)·SC-8, ISMS-P 2.5.3, CCM IAM-15)
    - 불필요한 원격 프로시저·인증서 웹 등록 비활성화와 외부 SMB 차단(NIST CM-7)

IDT-TS-03.1:
  oneline: KRBTGT·서비스 키로 Kerberos 티켓 위조
  summary: |-
    - 공격자는 KRBTGT 계정이나 서비스 계정의 키를 얻어 원하는 사용자·권한을 담은 Kerberos 티켓을 직접 만들어 도메인 어디든 접근할 수 있음
    - 위조 티켓은 비밀번호 변경과 무관하게 유효하고, KRBTGT를 두 번 바꾸기 전까지 접근이 남아 복구가 길어짐
  reference: |-
    ■ 신원 관점
    - 대상: KRBTGT 키로 만든 TGT(Golden Ticket, T1558.001), 서비스 계정 키로 만든 서비스 티켓(Silver Ticket, T1558.002)
    - 조건: 도메인 컨트롤러 장악·DCSync로 키 확보, PAC 검증 결함, ATT&CK에 Ke3chang(G0004) 절차 수록
    - 연계: AD 장악(IDT-DI-03.2) 이후 지속성 단계 — 위조 키형은 IDT-TS-03.3과 같은 구조
    ■ 실제 사례
    - 공개 사고 미확인 — 사고 보고서는 도메인 장악 후 지속성 수단으로 언급하는 경우가 많지만, 이 DB에 Golden·Silver Ticket이 사고 경위로 명시된 공개 사례는 아직 없음
    - [공개 취약점] Kerberos KDC PAC 위조 권한 상승(CVE-2014-6324, MS14-068) — KEV 판정 1건
  detect: |-
    ■ 탐지
    - TGT 요청 없이 사용된 서비스 티켓, 비정상 수명·암호화 유형·존재하지 않는 계정이 담긴 티켓 탐지(NIST SI-4(16))
    - 도메인 컨트롤러 복제 요청(DCSync)이 도메인 컨트롤러가 아닌 호스트에서 나오는 이벤트 경보
    ■ 대응
    - KRBTGT 비밀번호 정기 교체, 침해 시 간격을 두고 두 번 교체(NIST SC-12·IA-5, ISMS-P 2.7.2, CCM CEK-12)
    - 도메인 컨트롤러·복제 권한 계정을 최상위 계층으로 분리(CIS 5.4, ISMS-P 2.5.5, CCM IAM-10)

IDT-TS-03.2:
  oneline: AD FS 토큰 서명 인증서 탈취로 SAML 토큰 위조
  summary: |-
    - 공격자는 AD FS 등 페더레이션 서버의 토큰 서명 인증서를 빼내 임의 사용자의 SAML 토큰을 만들어 연동된 클라우드·SaaS에 접근할 수 있음
    - MFA·비밀번호 확인 없이 위조 토큰이 그대로 받아들여지고, IdP 로그에 발급 기록이 없어 클라우드 쪽 로그와 대조해야 드러남
  reference: |-
    ■ 신원 관점
    - 대상: AD FS 토큰 서명·복호화 인증서(T1552.004), 페더레이션 신뢰 설정, SAML을 받아들이는 Microsoft 365·SaaS
    - 수법: Golden SAML 위조(T1606.002), 서명 인증서 탈취 백도어, AD FS 처리 과정 자체 변조, ATT&CK에 SolarWinds 침해(C0024) 절차 수록
    - 연계: 클라우드 CL-CA-04(인증 자료 위조), 공급망 SCT-PB-03.1
    ■ 실제 사례
    - [실제 사고] SolarWinds 침해 이후 클라우드 장악(2020-12): 온프레미스 AD FS 토큰 서명 인증서를 탈취해 임의 사용자의 SAML 토큰을 위조하고 Microsoft 365에 지속 접근 (IDI-027, ATT&CK C0024)
    - [실제 사고] FoggyWeb — AD FS 토큰 서명 인증서·구성 탈취 백도어(2021-09): 장악한 AD FS 서버에서 구성 DB와 서명·복호화 인증서를 원격으로 빼냄 (IDI-025, ATT&CK S0661)
    - [실제 사고] MagicWeb — AD FS 서버 인증 백도어(2022-08): AD FS의 정상 DLL을 바꿔 특수 인증서가 든 토큰이면 어떤 사용자로든 인증되게 함 (IDI-024, ATT&CK G0016)
  detect: |-
    ■ 탐지
    - 클라우드 로그인의 SAML 토큰과 AD FS 발급 기록을 대조해 IdP 기록 없는 로그인 탐지, AD FS 서버의 인증서 내보내기·DLL 변경 감사(NIST AU-6)
    - 페더레이션 신뢰·서명 인증서 설정 변경을 고위험 이벤트로 경보
    ■ 대응
    - AD FS 서버를 도메인 컨트롤러와 같은 최상위 계층으로 보호하고 서명 키는 HSM에 보관(NIST SC-12·IA-13, ISMS-P 2.7.2, CCM CEK-19)
    - 가능하면 클라우드 IdP로 페더레이션을 전환하고 침해 시 서명 인증서 두 번 교체(CIS 6.6, CCM IAM-15)

IDT-TS-03.3:
  oneline: IdP·서비스 서명 키 탈취로 토큰·로그인 쿠키 위조
  summary: |-
    - 공격자는 IdP나 서비스의 토큰 서명 키를 손에 넣어 정상 로그인 없이 임의 사용자의 토큰·인증 쿠키를 만들어 계정에 접근할 수 있음
    - 서명이 유효한 토큰이라 로그인·MFA 기록이 남지 않고, 키 하나로 수많은 계정이 뚫리며 키 교체 전까지 접근이 계속됨
  reference: |-
    ■ 신원 관점
    - 대상: 클라우드 IdP·소비자 계정 서명 키, 자체 서비스의 토큰 서명키·쿠키 서명 비밀(T1606.001), 웹 앱 고정 머신 키(T1552.004)
    - 조건: 서명 키가 개발자 단말·크래시 덤프·코드에 남음(NHI2), 퇴사 후에도 키를 바꾸지 않음(NHI7), 토큰 검증 범위 결함(T1606)
    - 연계: 클라우드 CL-CA-04, 공급망 SCT-PB-03.1, 퇴사자 키 미회수(IDT-LC-02.1)와 결합
    ■ 실제 사례
    - [실제 사고] 쿠팡 고객 계정 정보 3,367만 건 유출(2025-11): 퇴사한 개발자가 재직 중 확보한 토큰 서명키로 정상 로그인 없이 약 8개월간 고객 정보 조회 (IDI-042)
    - [실제 사고] Storm-0558 Microsoft 계정 서명 키 탈취와 토큰 위조(2023-07): 소비자 계정 서명 키로 위조한 토큰이 기업용 토큰 검증도 통과해 약 25개 조직 메일 접근 (IDI-026)
    - [실제 사고] Yahoo 계정 관리 도구 악용과 위조 쿠키로 계정 무단 접근(2017-03): 비밀번호 없이 로그인되는 인증 쿠키를 직접 만들어 최소 6,500개 계정 접근 (IDI-126)
    - [실증] Entra ID Actor 토큰 결함(2025-09): 공격자 테넌트에서 받은 토큰으로 다른 테넌트의 전역 관리자까지 사칭 가능 (IDI-120)
    - [공개 취약점] 고정 키·위조 토큰 KEV 판정 4건: Exchange 고정 검증 키(CVE-2020-0688), SharePoint 위조 JWT(CVE-2023-29357), Gladinet 하드코딩 암호 키(CVE-2025-14611) 등
  detect: |-
    ■ 탐지
    - 로그인 이벤트 없이 사용된 토큰, 발급 기록과 맞지 않는 토큰 ID·발급 시각, 오래된·폐기된 키 ID로 서명된 토큰 탐지(NIST AU-6)
    - 한 계정·키로 짧은 시간에 대량 사용자 정보가 조회되는 패턴 경보
    ■ 대응
    - 서명 키는 HSM·관리형 키 서비스에 두고 사람·개발 단말이 키 원본을 갖지 않게 함, 키 발급·접근 이력 관리(NIST SC-12·IA-13, ISMS-P 2.7.2, CCM CEK-12·CEK-13·CEK-19)
    - 정기 키 교체와 퇴사·침해 시 즉시 교체, 토큰 검증 시 발급자·대상·키 범위 엄격 확인(CIS 6.6)
