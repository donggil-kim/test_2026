# [CI] 고객 계정·본인확인(CIAM) — 신원 관점 문구
# 작성 규칙: oneline 50자 이내 명사형 · summary 2줄(① 공격자는 … 수 있음 ② 피해·탐지 곤란 사유) ·
#           reference(■ 신원 관점 / ■ 실제 사례) · detect(■ 탐지 / ■ 대응). 사례는 그 행에 매핑된 사고만, 수치는 사고 DB 요약에 있는 것만.
#           국내 사고는 개인정보보호위원회 처분·정부 조사 발표 기준 수치만 씀.

IDT-CI-01:
  oneline: 유출 아이디·비밀번호 자동 대입으로 고객 계정 대량 탈취
  summary: |-
    - 공격자는 다른 곳에서 유출된 아이디·비밀번호 목록을 여러 IP로 나눠 고객 로그인에 자동 대입해 비밀번호를 재사용한 수만~수십만 계정에 한꺼번에 로그인할 수 있음
    - 서비스 자체가 뚫리지 않아도 개인정보 노출·부정 결제가 생기고, 정상 로그인과 섞여 단시간 대량 시도를 따로 탐지하지 않으면 수개월간 이어짐
  reference: |-
    ■ 신원 관점
    - 대상: 쇼핑·예매·금융·게임 서비스의 고객 로그인과 로그인 뒤 개인정보 수정·배송지·결제 화면(T1110.004·T1078)
    - 조건: 고객 계정 MFA 미제공·선택 사항, 같은 IP·단시간 대량 로그인 탐지·차단 부재, 로그인 뒤 개인정보 마스킹 미흡 — OWASP 자동화 위협 OAT-008(크리덴셜 스터핑)·OAT-009(CAPTCHA 우회) 유형
    - 연계: 기업 계정 대상 재사용(IDT-AU-01.2)과 같은 기법이며 금전 사기(IDT-IM-01)·대량 데이터 탈취(IDT-IM-03)로 이어짐 — 클라우드 CL-CA-01
    ■ 실제 사례
    - [실제 사고] GS리테일(GS SHOP·GS25) 크리덴셜 스터핑으로 회원 166만 명 정보 노출(2025-01): 같은 IP의 단시간 대량 로그인을 탐지·차단하지 못해 회원정보 수정 페이지에서 이름·연락처·주소 등이 빠져나가 과징금 128억 원 부과 (IDI-044)
    - [실제 사고] SK스토아 크리덴셜 스터핑으로 회원 12만 5천여 명 정보 유출(2023-11): 14개 IP로 초당 최대 372회, 총 4,400만 회 이상 로그인을 시도해 12만 5천여 계정에 로그인 (IDI-045)
    - [실제 사고] 23andMe 크리덴셜 스터핑(2023-10): 비밀번호를 재사용한 약 1만 4천 계정이 탈취되고 친척 찾기 기능으로 연결된 약 690만 명의 프로필 정보가 노출 (IDI-050)
    - [실제 사고] 케이티알파 기프티쇼 크리덴셜 스터핑(2023-01): 열흘간 4,305개 IP로 540만 회 이상 로그인을 시도해 약 9만 8천 개 계정에 로그인, 마스킹 덕분에 실제 유출은 51명 (IDI-046)
    - [실제 사고] Roku 크리덴셜 스터핑(57만 6천 계정)과 전 계정 2단계 인증 도입(2024-04): 약 57만 6천 계정이 탈취되어 일부에서 무단 구매가 일어난 뒤 전체 계정에 2단계 인증 적용 (IDI-051)
    - [실제 사고] DraftKings 크리덴셜 스터핑(2022-11): 약 6만 8천 명의 계정이 탈취되어 30만 달러 미만의 고객 자금이 빠져나감 (IDI-054)
  detect: |-
    ■ 탐지
    - 같은 IP·ASN·기기 지문의 단시간 대량 로그인, 로그인 성공률 급변, 처음 보는 기기의 개인정보 조회·배송지 변경을 실시간 탐지(NIST SI-4·AC-7)
    - 유출 자격증명 목록과 고객 계정 대조, 자동화 도구 지문으로 봇 트래픽 식별
    ■ 대응
    - 고객 계정에 MFA·패스키를 제공하고 위험 기반 추가 인증 적용, 결제·개인정보 변경은 재인증(CIS 6.3, NIST IA-2(2), ISMS-P 2.5.3, CCM IAM-13)
    - 로그인 시도 제한·봇 차단과 유출 비밀번호 사용 금지, 로그인 뒤 개인정보 화면 마스킹(NIST AC-7·IA-5(1), ISMS-P 2.5.4)

IDT-CI-02:
  oneline: 유심 인증키 유출·불법 기지국으로 휴대폰 기반 인증 체계 무력화
  summary: |-
    - 공격자는 통신사 가입자 인증 서버에서 유심 인증키 등 가입자 정보를 빼내거나 통신사 인증서를 가진 불법 초소형 기지국으로 문자·ARS 인증값을 가로챌 수 있음
    - 휴대폰 문자·본인확인에 기대는 모든 서비스가 함께 영향을 받고, 가입자 개인이 막을 방법이 없어 통신사 단위의 대응이 필요함
  reference: |-
    ■ 신원 관점
    - 침해 지점: 가입자 인증 서버(HSS)의 유심 인증키·가입자 정보, 기지국 인증서, 문자·ARS 결제 인증 경로(T1557·T1111)
    - 조건: 관리망 서버 계정 비밀번호 장기 미변경, 비정상 로그인 정황 미신고, 펨토셀 인증서 유효기간을 길게 설정
    - 연계: 휴대폰 기반 2단계 인증의 SIM 교체·문자 가로채기 위험(IDT-AU-03.2)과 금전 사기(IDT-IM-01)로 이어짐
    ■ 실제 사례
    - [실제 사고] SK텔레콤 유심 정보 2,696만 건 유출(2025-04): 서버 28대에서 악성코드 33종이 발견되고 유심 정보 25종 2,696만여 건이 유출, 최초 침투는 2021-08로 특정 (IDI-040)
    - [실제 사고] KT 불법 펨토셀 경유 결제 인증 탈취·무단 소액결제(2025-09): 불법 초소형 기지국으로 문자·ARS 결제 인증값을 가로채 결제 피해자 368명·2억 4,300만 원이 발생하고 정부가 펨토셀 인증서 유효기간을 1개월로 줄이도록 함 (IDI-041)
  detect: |-
    ■ 탐지
    - 가입자 인증 서버·관리망의 비정상 로그인과 대량 조회, 등록되지 않은 기지국·펨토셀 접속을 실시간 탐지(NIST SI-4)
    - 같은 기지국을 거친 결제 인증 급증처럼 지역·장비 단위의 이상 거래 분석
    ■ 대응
    - 가입자 인증키를 하드웨어 보안 모듈 등으로 보호하고 침해 시 키 교체·유심 교체 절차 준비(NIST SC-12, ISMS-P 2.7.2, CCM CEK-19)
    - 기지국 인증서 수명 단축과 접속 인가 통제, 인증 신호 구간 암호화(NIST SC-8, CCM IAM-15)
    - 서비스 제공자는 문자 단독 본인확인·결제 인증을 줄이고 피싱 저항 인증을 병행(ISMS-P 2.5.3)

IDT-CI-03.1:
  oneline: 도용 신분증·합성 신원으로 금융 계좌·서비스 계정 부정 개설
  summary: |-
    - 공격자는 훔친 신분증이나 생성형 AI로 만든 위조 신분증·합성 신원으로 비대면 계좌·서비스 계정을 개설해 대출 사기·자금 세탁에 쓸 수 있음
    - 개설 시점의 신원 확인만 통과하면 정상 고객으로 취급되고, 실제 명의자는 대출·피해가 생긴 뒤에야 알게 됨
  reference: |-
    ■ 신원 관점
    - 대상: 비대면 계좌 개설·회원 가입의 신원 확인 절차, 공격자가 만든 계정(T1585·T1585.003)
    - 조건: 신분증 이미지·얼굴 대조만으로 신원 확인, 같은 신분증·기기로 여러 계정을 여는 행위 탐지 부재 — OWASP 자동화 위협 OAT-019(계정 대량 생성) 유형
    - 연계: 얼굴 인증 우회(IDT-CI-03.2)와 함께 쓰이며 금전 사기(IDT-IM-01)로 이어짐 — AI AI-01-07(딥페이크 생체인증 우회)
    ■ 실제 사례
    - [실제 사고] 홍콩 딥페이크 얼굴 바꾸기로 대출·계좌 개설 사기 조직 검거(2023-08): 훔친 신분증 8장으로 은행 계좌 54개를 열고 대출 90건을 신청 (IDI-061)
    - [실제 사고] FinCEN 경보 — 딥페이크 신분증·영상으로 계좌 개설·본인확인 우회(2024-11): 생성형 AI로 만든 위조 신분증·합성 신원으로 계좌 개설 본인확인을 우회하는 의심거래 보고가 늘었다며 적신호 지표 발표 (IDI-062)
  detect: |-
    ■ 탐지
    - 같은 신분증·얼굴·기기·연락처로 여러 계좌·계정을 여는 패턴, 개설 직후 대출 신청·고액 이체를 이상 거래로 탐지
    - 신분증 이미지 재사용·편집 흔적 점검과 공개 적신호 지표 대조
    ■ 대응
    - 비대면 개설의 신원 확인을 신분증 진위·명의자 확인·기기 정보 등 여러 근거로 교차 검증(NIST IA-12, ISMS-P 2.5.2)
    - 고객별 고유 신원 관리와 외부 사용자 식별·인증 기준 적용(NIST IA-8, CCM IAM-12)

IDT-CI-03.2:
  oneline: 딥페이크 얼굴·영상으로 eKYC·생체 본인확인을 통과해 계좌 접근
  summary: |-
    - 공격자는 악성 앱으로 수집한 피해자 얼굴 영상이나 AI 얼굴 바꾸기로 만든 딥페이크를 얼굴 인식·영상 본인확인에 넣어 남의 명의로 인증을 통과할 수 있음
    - 생체 정보는 비밀번호처럼 바꿀 수 없어 한 번 털리면 반복 악용되고, 카메라 입력을 바꿔치기하는 주입 공격은 화면만 봐서는 구분하기 어려움
  reference: |-
    ■ 신원 관점
    - 대상: 은행·정부기관 앱의 얼굴 인식 본인확인, 비대면 영상 신원 확인(eKYC)을 노린 사칭(T1684.001)
    - 조건: 얼굴 대조만으로 고위험 거래 허용, 실제 사람인지 판별하는 생체 검사·주입 탐지 미흡, 모바일 악성 앱의 얼굴·신분증 수집
    - 연계: AI AI-01-07(딥페이크 생체인증 우회)·AI-04-04(적대적 입력 판단 회피) — 계좌 장악 뒤 금전 사기(IDT-IM-01)로 이어짐
    ■ 실제 사례
    - [실제 사고] GoldPickaxe 얼굴 인식 정보 탈취 트로이목마(2024-02): 은행·정부기관 앱을 사칭한 트로이목마로 얼굴 영상·신분증을 수집하고 딥페이크로 은행의 생체 본인확인을 통과해 계좌에 접근 (IDI-060)
    - [실제 사고] 홍콩 딥페이크 얼굴 바꾸기로 대출·계좌 개설 사기 조직 검거(2023-08): 얼굴 인식 절차에서 AI 얼굴 바꾸기 프로그램으로 신분증 주인 얼굴로 바꿔 시스템을 속이고 대출 4건이 승인 (IDI-061)
    - [실제 사고] FinCEN 경보 — 딥페이크 신분증·영상으로 계좌 개설·본인확인 우회(2024-11): 딥페이크 영상으로 금융기관의 본인확인과 인증을 우회하는 의심거래 보고 증가를 경보 (IDI-062)
  detect: |-
    ■ 탐지
    - 얼굴 인증 시도의 카메라 입력 이상(가상 카메라·에뮬레이터), 같은 얼굴 데이터의 여러 계정 사용, 인증 직후 고액 이체를 탐지
    - 얼굴·신분증을 요구하는 사칭 앱 설치 정황(공식 앱 장터 밖 설치)과 연계 분석
    ■ 대응
    - 실제 사람 여부를 판별하는 생체 검사와 주입 공격 탐지를 적용하고 얼굴 인증 단독으로 고위험 거래를 허용하지 않음(NIST IA-12, ISMS-P 2.5.3, CCM IAM-13)
    - 본인확인에 등록 주소·연락처로 보낸 확인 코드 등 다른 근거를 더해 교차 검증(NIST IA-12(5))
