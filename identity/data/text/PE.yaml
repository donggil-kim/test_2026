# [PE] 특권·권한과 지속성 — 신원 관점 문구
# 작성 규칙: oneline 50자 이내 명사형 · summary 2줄(① 공격자는 … 수 있음 ② 피해·탐지 곤란 사유) ·
#           reference(■ 신원 관점 / ■ 실제 사례) · detect(■ 탐지 / ■ 대응). 사례는 그 행에 매핑된 사고만, 수치는 사고 DB 요약에 있는 것만.
#           DI 도메인과 같이 공격 수법 설명은 줄이고 침해 지점·실제 사례·탐지·대응 위주로 씀.

IDT-PE-01.1:
  oneline: 과다 권한·누적 역할을 타고 탈취 계정에서 관리자 권한으로 확대
  summary: |-
    - 공격자는 탈취한 계정에 필요 이상으로 붙은 역할·그룹·내부 도구 권한을 쓰거나 클라우드 역할을 직접 추가해 관리자 수준 권한까지 넓힐 수 있음
    - 수년간 누적된 권한은 실제 업무 범위와 차이가 커도 잘 보이지 않고, 지원·운영 인력 계정 하나가 수많은 고객·사용자 계정 관리로 이어짐
  reference: |-
    ■ 신원 관점
    - 침해 지점: 클라우드 역할·그룹 구성원(T1098.003·T1069.003), 일시 권한 상승 기능(T1548.005), 고객 계정을 다루는 내부 관리·지원 도구
    - 조건: 직무 변경 뒤에도 남는 권한, 지원 인력에게 넓게 열린 관리 도구, 정기 권한 검토 부재 — ATT&CK에 LAPSUS$(G1004)·Scattered Spider(G1015)·Storm-0501(G1053)의 클라우드 관리 역할 추가 절차 수록
    - 연계: 클라우드 CL-PV-01(역할 추가·일시 권한 상승)·CL-DS-01(권한 탐색), AI AI-06-01(에이전트 과도한 권한) — 이미 연결된 OAuth 연동(SAT1001)도 권한 확대 경로가 됨
    ■ 실제 사례
    - [실제 사고] Twitter 내부 관리 도구 장악(2020-07): 헬프데스크 사칭으로 얻은 직원 자격증명으로 고객 계정을 관리하는 내부 도구에 접근해 유명인 계정 130개를 장악하고 비트코인 사기 게시물 게시 (IDI-063)
    - [시연] SAT1001 기존 OAuth 연동 악용·SAT1021 링크 백도어: Zapier·Nuclino에서 이미 연결된 연동과 내부 문서 링크로 권한을 넓히는 공개 시연
  detect: |-
    ■ 탐지
    - 관리 역할·그룹 부여, 일시 권한 상승 요청, 권한 탐색 API 대량 호출을 평소 패턴과 비교해 경보(NIST AC-2)
    - 내부 관리·지원 도구에서 한 직원이 짧은 시간에 여러 고객 계정을 조회·변경하는 패턴 점검
    ■ 대응
    - 역할 기반 접근 통제로 직무별 최소 권한을 정의하고 정기 권한 검토로 누적 권한 회수(CIS 6.8, NIST AC-6·AC-6(7), ISMS-P 2.5.5·2.5.6, CCM IAM-05·IAM-08)
    - 고객 계정을 바꿀 수 있는 내부 도구는 승인된 소수에게만 열고, 일시 권한 상승은 기간 제한·승인 기록을 남김

IDT-PE-01.2:
  oneline: PAM·계정 관리 도구 장악으로 연결된 시스템 관리 권한 일괄 확보
  summary: |-
    - 공격자는 특권 접근 관리(PAM) 도구의 관리자 자격증명이나 내부 계정 관리 도구를 손에 넣어 그 도구가 다루는 모든 시스템·계정의 권한을 한 번에 얻을 수 있음
    - 특권 자격증명을 한곳에 모은 도구라 장악 즉시 피해가 조직 전체로 넓어지고, 도구 관리자 계정이 스크립트·공유 폴더에 남아 있는 경우가 많음
  reference: |-
    ■ 신원 관점
    - 침해 지점: PAM 금고·세션 중계 도구의 관리자 계정, 고객 계정을 직접 다루는 내부 계정 관리 도구, 파일 속 관리자 자격증명(T1552.001)·비밀번호 저장소(T1555)
    - 조건: PAM 관리자 자격증명을 자동화 스크립트에 하드코딩, 관리 도구 접근에 전용 단말·별도 MFA 없음, 사람이 관리용 비인간 계정을 직접 사용(NHI10)
    - 연계: 스크립트 속 비밀 노출(IDT-CR-02.1)·인증 쿠키 위조(IDT-TS-03.3)와 이어짐 — ATT&CK에 Scattered Spider(G1015)가 장악 호스트에서 자격증명 보관 문서를 찾는 절차 수록
    ■ 실제 사례
    - [실제 사고] Uber 내부망 침해(2022-09): 내부 네트워크 공유의 PowerShell 스크립트에 하드코딩된 PAM 도구 관리자 자격증명으로 AWS·Google Cloud·Slack·보안 도구 등 여러 내부 시스템에 접근 (IDI-002, ATT&CK G1004)
    - [실제 사고] Yahoo 계정 관리 도구 악용과 위조 쿠키로 계정 무단 접근(2017-03): 내부 계정 관리 도구로 관심 대상 계정을 찾고 인증 쿠키를 직접 만들어 최소 6,500개 계정에 무단 접근 (IDI-126)
  detect: |-
    ■ 탐지
    - PAM 관리자 로그인·정책 변경·금고 대량 조회, 평소와 다른 단말·위치의 관리 도구 접근을 실시간 경보
    - 공유 폴더·스크립트 저장소의 특권 자격증명 스캔, 계정 관리 도구 감사 로그의 비업무 계정 조회 패턴 점검
    ■ 대응
    - PAM·관리 도구 관리자는 전용 관리자 계정·전용 단말로 분리하고 피싱 저항 MFA 필수(CIS 5.4·6.5, NIST AC-6(5)·IA-2(1), ISMS-P 2.5.5, CCM IAM-09·IAM-10)
    - 특권 계정 사용 내역 감사와 스크립트 하드코딩 금지, 관리 도구 접근 권한 정기 검토(NIST AC-2(7))

IDT-PE-02.1:
  oneline: 백도어 계정 생성·앱 자격증명 추가로 비밀번호 재설정 뒤에도 접근 유지
  summary: |-
    - 공격자는 장악한 관리 권한으로 새 관리자 계정을 만들거나 기존 앱·서비스 주체에 자격증명·API 키를 추가해 원래 침투 경로가 막혀도 다시 들어올 수 있음
    - 사용자 비밀번호를 모두 바꿔도 새 계정·앱 자격증명은 그대로 남고, 정상 관리 작업처럼 보여 계정·자격증명 인벤토리 없이는 찾기 어려움
  reference: |-
    ■ 신원 관점
    - 침해 지점: 로컬·도메인·클라우드 계정 생성(T1136.001·T1136.002·T1136.003), 앱·서비스 주체 자격증명 추가(T1098.001), SaaS API 키 발급(SAT1004)
    - 조건: 계정·서비스 계정 인벤토리 부재, 앱 자격증명 추가를 감사하지 않음, 여러 용도로 재사용되는 비인간 신원(NHI9)
    - 연계: ATT&CK에 APT29(G0016)·LAPSUS$(G1004)의 클라우드 계정 생성 절차 수록 — 클라우드 CL-PE-01, AI AI-07-05(에이전트 위장 등록)
    ■ 실제 사례
    - [실제 사고] SolarWinds 침해 이후 클라우드 장악(2020-12): 기존 애플리케이션·서비스 주체에 자격증명을 추가해 Microsoft 365 메일 등 클라우드 자원에 지속 접근 (IDI-027, ATT&CK G0016)
    - [시연] SAT1004 API 키: Shortcut에서 탈취 계정에 API 키를 만들어 프로그램 방식 접근을 유지하는 공개 시연
  detect: |-
    ■ 탐지
    - 새 관리자 계정 생성, 앱·서비스 주체 자격증명·API 키 추가, 업무 시간 외 계정 생성을 고위험 이벤트로 경보(NIST AU-6·AC-2(12))
    - 계정·서비스 계정 인벤토리와 실제 디렉터리·테넌트 계정을 정기 대조해 등록되지 않은 계정 식별
    ■ 대응
    - 계정·서비스 계정 인벤토리를 유지하고 소유자 없는 계정 비활성화(CIS 5.1·5.5, NIST AC-2, ISMS-P 2.5.1, CCM IAM-03)
    - 앱 자격증명 추가·관리자 계정 생성 권한을 최소화하고 정기 접근 권한 검토(ISMS-P 2.5.6, CCM IAM-08)

IDT-PE-02.2:
  oneline: 탈취 계정에 공격자 MFA 장치·인증 수단을 등록해 접근 유지
  summary: |-
    - 공격자는 피싱·헬프데스크 사칭·MFA 피로로 한 번 얻은 계정에 자기 MFA 장치나 새 인증 수단, 기기를 등록해 이후에는 정상 사용자처럼 인증할 수 있음
    - 등록 뒤에는 MFA가 오히려 공격자 접근을 보증하고, 비밀번호를 바꿔도 등록된 장치·수단을 지우지 않으면 접근이 이어짐
  reference: |-
    ■ 신원 관점
    - 침해 지점: IdP의 MFA 등록·인증 수단 관리(T1556.006), 테넌트 장치 등록(T1098.005), 열린 MFA 자가 등록 절차, 여러 로그인 방식 동시 허용(SAT1017·SAT1002)
    - 조건: 첫 MFA 등록·재등록에 추가 확인 없음, 휴면 계정의 MFA 미등록 방치, 장치 등록 정책 부재 — ATT&CK에 Scattered Spider(G1015)·APT29(G0016) 절차 수록
    - 연계: 헬프데스크 사칭(IDT-SE-02.1)·MFA 피로(IDT-AU-03.1) 다음 단계로 자주 쓰임 — 클라우드 CL-PE-02
    ■ 실제 사례
    - [실제 사고] Scattered Spider 합동 권고(2023-11): 헬프데스크에 전화해 MFA를 공격자 장치로 옮기게 하거나 계정을 얻은 뒤 자체 MFA 장치를 등록해 접근 유지 (IDI-008, ATT&CK G1015)
    - [실제 사고] 이란 연계 행위자 무차별 대입·MFA 푸시 폭탄·MFA 장치 등록(2024-10): 탈취 계정에 자기 장치를 MFA로 등록하고 일부는 열린 MFA 등록 절차를 악용 (IDI-093)
    - [실제 사고] 러시아 SVR의 클라우드 초기 접근 수법 변화(2024-02): MFA 피로 공격으로 우회한 뒤 자기 장치를 테넌트에 새 장치로 등록 (IDI-094, ATT&CK G0016)
    - [실제 사고] Retool 고객 계정 27곳 장악(2023-08): 딥페이크 음성 전화로 추가 MFA 코드를 받아 공격자 장치를 Okta에 등록 (IDI-072)
    - [실제 사고] Storm-1167 다단계 AiTM 피싱·BEC(2023-06): AiTM으로 가로챈 계정에 새 MFA 방법을 추가한 뒤 2차 피싱으로 확산 (IDI-030)
    - [실제 사고] Cisco 사내망 침해(2022-08): 음성 피싱과 반복된 MFA 푸시로 VPN에 접속한 뒤 새 MFA 장치를 등록해 접근 유지 (IDI-003)
    - [실제 사고] Storm-2372 디바이스 코드 피싱 캠페인(2025-02): 디바이스 코드로 기기를 등록해 주 리프레시 토큰을 얻는 방식으로 바뀜 (IDI-031)
    - [시연] SAT1017 고스트 로그인: Snowflake·Shortcut·Expensify에서 SSO와 별도로 남는 로그인 방식으로 접근을 유지하는 공개 시연
  detect: |-
    ■ 탐지
    - 새 MFA 장치·인증 수단·기기 등록을 사용자 알림과 보안팀 경보로 함께 처리하고, 등록 직전의 새 위치 로그인·MFA 피로·재설정과 상관 분석(NIST AU-6)
    - 한 장치·전화번호가 여러 계정에 등록되거나 휴면 계정에 처음 MFA가 등록되는 패턴 점검
    ■ 대응
    - MFA 등록·재등록에 기존 강한 인증 수단 확인이나 관리자 승인을 요구하고 등록 가능 위치·장치를 조건부로 제한(NIST IA-5, ISMS-P 2.5.3, CCM IAM-13·IAM-07)
    - 피싱 저항 MFA로 등록 이전 단계의 계정 탈취를 막고 관리자 계정은 하드웨어 키만 허용(CIS 6.3·6.5, NIST IA-2(1))
    - 침해 대응 때 비밀번호와 함께 등록된 MFA 장치·기기·세션을 전수 점검·삭제

IDT-PE-02.3:
  oneline: 메일함 규칙·자동 전달·위임 설정으로 대화 은닉과 메일 지속 수집
  summary: |-
    - 공격자는 탈취한 메일함에 받은편지함 규칙·자동 전달·위임 권한을 추가해 보안 경고와 답장을 숨기고 메일을 계속 가로챌 수 있음
    - 사용자가 직접 만들 수 있는 정상 기능이라 보안 도구가 잘 보지 않고, 비밀번호를 바꿔도 규칙·전달·위임 설정은 남음
  reference: |-
    ■ 신원 관점
    - 침해 지점: 받은편지함 규칙·자동 전달(T1114.003), 메일 숨김 규칙(T1564.008), 메일함 위임·사칭 권한(T1098.002), 외부 공유 링크(SAT1022)
    - 조건: 외부 자동 전달 허용, 규칙·위임 변경 감사 부재 — ATT&CK에 Scattered Spider(G1015)가 보안 담당자 메일함에 보안 제품 알림 삭제 규칙을 만든 절차, APT29(G0016)의 사칭 권한 추가 절차 수록
    - 연계: BEC 송금 사기(IDT-IM-01)를 돕는 은닉 단계 — 클라우드 CL-PE-04·CL-ST-01·CL-CO-05
    ■ 실제 사례
    - [실제 사고] AiTM 피싱으로 세션 쿠키 탈취 후 BEC(2022-07): 탈취 세션으로 메일함에 들어가 받은편지함 규칙을 만들고 거래처 메일 스레드에 끼어들어 송금 유도 (IDI-029)
    - [실제 사고] Storm-1167 다단계 AiTM 피싱·BEC(2023-06): 탈취 계정에 받은편지함 규칙을 만들어 수백 명에게 2차 피싱을 보내는 BEC로 확산 (IDI-030)
    - [시연] SAT1023 악성 메일 규칙: Office 365 메일 규칙으로 지속성과 은닉을 확보하는 공개 시연
  detect: |-
    ■ 탐지
    - 새 받은편지함 규칙(삭제·이동·외부 전달), 외부 도메인 자동 전달, 메일함 위임·사칭 권한 추가를 실시간 경보(NIST SI-4, CCM LOG-05)
    - 송금·청구서·보안 경고 같은 키워드를 지우거나 옮기는 규칙과 같은 시점의 비정상 로그인 상관 분석(NIST AU-6, ISMS-P 2.9.5)
    ■ 대응
    - 조직 외부 자동 전달을 기본 차단하고 예외는 승인제로 운영, 규칙·위임 변경 감사 로그 정기 점검(ISMS-P 2.9.5, CCM LOG-05)
    - 침해 대응 때 비밀번호 재설정과 함께 메일 규칙·전달·위임·연결 앱을 전수 점검·삭제

IDT-PE-03:
  oneline: 감사 로그·조건부 액세스·MFA 정책 변경으로 신원 통제 무력화
  summary: |-
    - 공격자는 관리 권한을 얻은 뒤 클라우드 감사 로그를 끄거나 조건부 액세스에 신뢰 위치를 추가하고 MFA 설정을 해제해 이후 활동이 탐지·차단되지 않게 할 수 있음
    - 직접 피해를 내지 않아 사고 경위에서 잘 드러나지 않고, 로그가 꺼진 기간의 활동은 사후 조사로도 복원하기 어려움
  reference: |-
    ■ 신원 관점
    - 침해 지점: 조건부 액세스 정책(T1556.009), 클라우드 감사 로그 설정(T1685.002), 사용자·원격 접속 장비의 MFA 설정(T1556.006)
    - 근거: ATT&CK에 Scattered Spider(G1015)의 조건부 액세스 신뢰 위치 추가, APT29(G0016)의 메일 탈취 전 감사 로그 비활성화, Storm-0501(G1053)의 조건부 액세스 우회, 2025 폴란드 와이퍼 공격(C0063)의 2단계 인증 설정 해제 절차 수록
    - 연계: 테넌트 신뢰 설정 변조(IDT-DI-03.2)·MFA 장치 추가 등록(IDT-PE-02.2)과 함께 쓰임 — 클라우드 CL-PE-02·CL-DI-01, OT OT-EV-03
    ■ 실제 사례
    - 공개 사고 미확인 — 이 DB의 사고 경위에는 정책·로그 무력화가 별도 단계로 명시된 사례가 없어 ATT&CK 절차로만 근거를 둠(발생가능성 '중')
  detect: |-
    ■ 탐지
    - 감사 로그 비활성화·보존 기간 단축, 조건부 액세스 정책·신뢰 위치 변경, MFA 해제를 별도 채널로 즉시 경보(NIST SI-4·AU-12, CCM LOG-03)
    - 로그 수집이 끊긴 구간을 수집 파이프라인에서 감지하고 정책 변경 직후의 관리자 활동과 상관 분석
    ■ 대응
    - 감사 로그를 관리자도 지울 수 없는 별도 저장소로 보내고 로그 설정 변경 권한 분리(NIST AU-9, ISMS-P 2.9.4)
    - 조건부 액세스·MFA 정책을 기준선으로 관리해 변경 시 이중 승인과 정기 대조(CIS 6.7, NIST CM-6, CCM IAM-13)
