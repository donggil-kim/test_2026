# [IM] 영향·확산 — 신원 관점 문구
# 작성 규칙: oneline 50자 이내 명사형 · summary 2줄(① 공격자는 … 수 있음 ② 피해·탐지 곤란 사유) ·
#           reference(■ 신원 관점 / ■ 실제 사례) · detect(■ 탐지 / ■ 대응). 사례는 그 행에 매핑된 사고만, 수치는 사고 DB 요약에 있는 것만.
#           결과 유형 도메인이라 '■ 신원 관점'에는 이 결과로 이어지는 앞 단계 세부위협(IDT-ID)을 적고, 사례는 매핑 사고 중 대표 사례만 고름.

IDT-IM-01:
  oneline: 장악한 메일·SNS·금융 계정으로 송금 사기·사칭 게시·부정 결제
  summary: |-
    - 공격자는 장악한 업무 메일·소셜 미디어·금융·고객 계정으로 거래처 송금을 가로채거나 사칭 게시물을 올리고 결제 수단·가상자산을 빼낼 수 있음
    - 정상 계정과 정상 채널로 지시·거래가 이뤄져 피해자가 의심하기 어렵고, 송금·가상자산 이체는 되돌리기 어려워 피해가 바로 확정됨
  reference: |-
    ■ 신원 관점
    - 대상: 업무 메일함(T1114.002·T1586.002), 기관·기업 공식 소셜 미디어 계정, 고객 결제·가상자산 계정과 블록체인 서명 키(T1657)
    - 앞 단계: AiTM 피싱 뒤 메일 규칙 은닉(IDT-PE-02.3), SIM 교체·2단계 인증 미적용(IDT-AU-03.2·IDT-AU-03.3), 크리덴셜 스터핑(IDT-CI-01), 딥페이크 사칭(IDT-SE-04)
    - 연계: 클라우드 CL-IM-05(금전 탈취·갈취), AI AI-01-08(AI 생성 피싱·사칭), 공급망 SCT-IM-04(암호자산 가로채기)
    ■ 실제 사례
    - [실제 사고] Arup 딥페이크 화상회의 송금 사기(2024-01): CFO와 동료로 보이는 딥페이크 참석자의 지시로 직원이 15차례 총 2억 홍콩달러(약 2,500만 달러)를 송금 (IDI-013)
    - [실제 사고] AiTM 피싱으로 세션 쿠키 탈취 후 BEC(2022-07): 탈취 세션으로 메일함에 들어가 거래처 메일 스레드에 끼어들어 송금을 유도 (IDI-029)
    - [실제 사고] Coinbase 고객 데이터 유출(2025-05): 매수한 지원 인력에게서 빼낸 고객 정보로 Coinbase를 사칭한 사회공학을 벌여 고객 자산을 노림, 대응 비용 최대 4억 달러 추정 (IDI-012)
    - [실제 사고] Ronin 브리지 6억 달러대 탈취(2022-03): 탈취한 검증자 키로 약 6억 달러 상당 암호화폐를 인출 (IDI-113, ATT&CK G0032)
    - [실제 사고] KT 가입자 심스와핑 의심 가상자산 탈취(2022-01): 휴대폰이 갑자기 먹통이 된 뒤 가상자산 거래소 계정에서 수천만 원에서 수억 원대 암호화폐가 탈취 (IDI-047)
    - [실제 사고] 미 SEC X 계정 장악(2024-01): 위조 신분증으로 대체 SIM을 발급받아 2단계 인증이 꺼진 계정을 장악하고 비트코인 ETF 승인 가짜 게시물로 가격을 일시 급등시킴 (IDI-058)
    - [실제 사고] KT 불법 펨토셀 경유 결제 인증 탈취·무단 소액결제(2025-09): 가로챈 문자·ARS 결제 인증값으로 무단 소액결제, 결제 피해자 368명 (IDI-041)
    - [실제 사고] Coinbase SMS 계정 복구 결함 악용(2021-10): SMS 계정 복구 절차 결함으로 인증 토큰을 받아 고객 6천여 명의 자금을 빼냄 (IDI-056)
  detect: |-
    ■ 탐지
    - 메일함 새 규칙·외부 전달과 거래처 계좌 변경 요청, 공식 계정의 비정상 로그인·게시를 연계 탐지(NIST SI-4)
    - 휴대폰 개통·유심 변경 직후의 금융·가상자산 계정 로그인, 인증 직후 고액 이체·출금을 이상 거래로 탐지
    ■ 대응
    - 메일·공식 소셜 미디어·금융 계정에 피싱 저항 MFA를 적용하고 문자 단독 인증을 줄임(CIS 6.3, NIST IA-2(1), ISMS-P 2.5.3, CCM IAM-13)
    - 송금·계좌 변경은 사전 등록 채널로 콜백 확인하고 이중 승인, BEC·딥페이크 사칭 사례 교육(NIST AT-2(3))

IDT-IM-02:
  oneline: 도메인·IdP 관리 권한 장악 뒤 전사 랜섬웨어·백업 삭제
  summary: |-
    - 공격자는 헬프데스크 사칭·MFA 없는 원격 접속·디렉터리 취약점으로 도메인·IdP·클라우드 관리 권한을 얻은 뒤 전사 시스템을 암호화하고 백업·클라우드 자원을 지울 수 있음
    - 관리 권한 자체가 배포·삭제 수단이 되어 몇 시간 만에 조직 전체가 멈추고, 같은 권한으로 백업까지 지우면 복구가 크게 늦어짐
  reference: |-
    ■ 신원 관점
    - 침해 지점: 도메인 관리자·그룹 정책, IdP·하이퍼바이저·클라우드 관리 계정, 백업 관리 권한(T1486·T1485·T1490)
    - 앞 단계: 헬프데스크 사칭(IDT-SE-02.1), MFA 없는 원격 접속(IDT-AU-03.3), 세션 토큰 탈취(IDT-TS-01.3), Kerberoasting(IDT-TS-02.2), 동기화 서버 장악(IDT-DI-02), 도메인 컨트롤러 취약점(IDT-DI-01.4)
    - 연계: 클라우드 CL-IM-01·CL-IM-02, OT OT-IM-02, 공급망 SCT-IM-05 — 신원 단계에서 끊으면 암호화 단계까지 가지 않음
    ■ 실제 사례
    - [실제 사고] MGM Resorts 랜섬웨어(2023-09): 헬프데스크 사칭으로 Okta·Azure 관리 권한을 얻어 약 100대의 ESXi 하이퍼바이저를 암호화, 운영이 열흘가량 마비되고 약 1억 달러 영업 손실 (IDI-005, ATT&CK G1015)
    - [실제 사고] Change Healthcare 랜섬웨어(2024-02): 탈취한 자격증명으로 MFA가 없던 Citrix 원격 접속 포털에 로그인하고 9일 뒤 랜섬웨어를 실행해 미국 전역의 청구·자격 확인 업무가 수주간 마비 (IDI-015, ATT&CK S1068)
    - [실제 사고] Ascension 랜섬웨어(2024-05): RC4 암호화를 허용하던 Active Directory에서 Kerberoasting으로 특권 계정을 얻어 수천 대에 랜섬웨어를 배포 (IDI-021, ATT&CK S1070)
    - [실제 사고] Storm-0501 하이브리드 환경 랜섬웨어(2024-09): 동기화 서버 계정 자격증명으로 MFA 없는 클라우드 관리자 계정에 들어가 클라우드 자원·백업을 지우고 랜섬웨어를 실행 (IDI-022, ATT&CK G1053)
    - [실제 사고] Ryuk의 Zerologon 악용으로 5시간 만에 도메인 전체 암호화(2020-10): 도메인 컨트롤러 자격증명을 재설정해 도메인 관리자 권한을 얻고 백업·파일 서버와 단말에 랜섬웨어를 배포 (IDI-096, ATT&CK S0446)
    - [실제 사고] Marks & Spencer 랜섬웨어(2025-04): 협력사를 상대로 한 사칭으로 직원 비밀번호를 재설정받아 침투, 영업이익 약 3억 파운드 영향 추정 (IDI-010, ATT&CK G1015)
    - [실제 사고] MERCURY·DEV-1084 하이브리드 환경 파괴 공격(2023-04): 동기화 에이전트의 특권 계정 자격증명으로 클라우드에 접근해 클라우드·온프레미스 자원을 대량 삭제 (IDI-023)
    - [실제 사고] Prestige 랜섬웨어(2022-10): 도메인 관리자 수준 권한으로 기본 그룹 정책 개체를 바꿔 랜섬웨어를 전체 도메인에 배포 (IDI-028, ATT&CK G0034)
  detect: |-
    ■ 탐지
    - 도메인·IdP·클라우드 관리 권한의 새 부여·비정상 사용, 그룹 정책·하이퍼바이저 대량 작업, 백업 삭제·보존 설정 변경을 실시간 경보(NIST SI-4, CCM LOG-03)
    - 원격 접속 신규 로그인 뒤 짧은 시간 안에 이어지는 권한 상승·횡적 이동을 상관 분석
    ■ 대응
    - 도메인·IdP·백업 관리 권한을 전용 관리자 계정과 피싱 저항 MFA로 분리하고 관리 계층 간 자격증명 재사용 금지(CIS 5.4·6.5, NIST AC-6(5), ISMS-P 2.5.5, CCM IAM-10)
    - 관리자 권한으로도 지울 수 없는 분리·불변 백업을 두고 복구 훈련(NIST CP-9)

IDT-IM-03:
  oneline: 정상 계정·토큰으로 SaaS·DB를 대량 조회해 데이터 탈취·갈취
  summary: |-
    - 공격자는 탈취하거나 매수·위조한 계정·토큰·서명키로 SaaS·고객 DB·코드 저장소에 정상 사용자처럼 들어가 대량의 데이터를 내려받고 공개를 빌미로 갈취할 수 있음
    - 정상 권한의 조회·내보내기라 데이터 유출 방지 통제를 통과하기 쉽고, 조회량 이상을 보지 않으면 수개월 뒤 외부 공개·통지로 알게 됨
  reference: |-
    ■ 신원 관점
    - 대상: 클라우드 저장소(T1530), SaaS·협업 도구·고객 DB(T1213), 메일함(T1114.002), 데이터 일괄 내보내기·웹훅·자동화 워크플로(SAT1037·SAT1039·SAT1033)
    - 앞 단계: 인포스틸러 자격증명·MFA 미적용(IDT-CR-01.1·IDT-AU-03.3), 크리덴셜 스터핑(IDT-CI-01), 연동 토큰 탈취(IDT-NH-03.1), 인증 토큰 위조(IDT-TS-03.3), 내부자 오남용(IDT-LC-02.1)
    - 연계: 클라우드 CL-CO-01·CL-CO-04·CL-IM-05, OT OT-IM-06(운영 정보 탈취), 공급망 SCT-IM-03(소스 코드 대량 반출)
    ■ 실제 사례
    - [실제 사고] Snowflake 고객 인스턴스 대량 데이터 탈취(2024-05): 인포스틸러에서 나온 고객 자격증명으로 MFA와 접속 허용 목록이 없는 인스턴스 약 165곳에 로그인해 데이터를 대량 반출·갈취 (IDI-016)
    - [실제 사고] 쿠팡 고객 계정 정보 3,367만 건 유출(2025-11): 퇴사 개발자가 토큰 서명키로 정상 로그인 없이 고객 정보를 조회해 배송지 목록 페이지가 1억 4천여 회 조회됨 (IDI-042)
    - [실제 사고] SK텔레콤 유심 정보 2,696만 건 유출(2025-04): 관리망 서버 계정 관리가 부실한 가운데 유심 정보 25종 2,696만여 건이 유출 (IDI-040)
    - [실제 사고] Salesforce 대상 음성 피싱(2025-06): 변조된 Data Loader 연결 앱으로 조직의 Salesforce 데이터를 API로 대량 조회·반출한 뒤 갈취 (IDI-036, ATT&CK G1057)
    - [실제 사고] Salesloft Drift 연동 OAuth 토큰 탈취로 Salesforce 인스턴스 대량 데이터 반출(2025-08): 연동 토큰으로 여러 조직의 Salesforce 데이터를 조회·반출 (IDI-037)
    - [실제 사고] GS리테일(GS SHOP·GS25) 크리덴셜 스터핑으로 회원 166만 명 정보 노출(2025-01): 탈취한 계정의 회원정보 수정 페이지에서 이름·연락처·주소 등을 빼냄 (IDI-044)
    - [실제 사고] Co-op 회원 650만 명 정보 탈취(2025-04): 직원을 사칭해 계정 접근을 얻은 뒤 회원 650만 명 전원의 이름·주소·연락처를 탈취 (IDI-011, ATT&CK G1015)
    - [실제 사고] Medibank 고객 970만 명 정보 유출(2022-10): 협력사 직원 자격증명과 MFA 없는 VPN으로 침투해 고객 약 970만 명의 정보를 탈취하고 다크웹에 공개 (IDI-018)
    - [시연] SAT1037 데이터 내보내기 서비스·SAT1039 웹훅: Google 데이터 일괄 내보내기와 Microsoft 365 웹훅으로 데이터를 빼내는 공개 시연
  detect: |-
    ■ 탐지
    - 계정·토큰·연동 앱별 조회량·내보내기·API 호출 기준선을 두고 대량 조회·일괄 내보내기·새 출발지 접근을 경보(NIST SI-4·AU-6, ISMS-P 2.9.5, CCM LOG-05)
    - 데이터 플랫폼·SaaS 로그를 중앙에 모아 로그인 출발지·인증 방식(MFA 여부)과 조회 행위를 함께 분석
    ■ 대응
    - 데이터 접근 권한을 역할별 최소 권한으로 줄이고 대량 조회·내보내기는 승인·속도 제한 적용(CIS 6.8, NIST AC-6, CCM IAM-05)
    - 데이터 플랫폼·SaaS에 MFA와 접속 허용 목록을 필수로 두고 고객정보 화면 마스킹·조회 기록 보존

IDT-IM-04:
  oneline: 관리자 계정 삭제·자격증명 변경으로 대응 차단과 연동 계정 파괴
  summary: |-
    - 공격자는 장악한 관리 권한으로 관리자 계정을 지우거나 비밀번호·인증 수단을 바꿔 피해 조직의 대응을 막고, 연결된 계정·기기의 데이터를 원격으로 지울 수 있음
    - 침해 대응에 필요한 관리자 접근이 먼저 사라져 복구가 늦어지고, 별도 긴급 계정이 없으면 공급업체 지원에 기대야 함
  reference: |-
    ■ 신원 관점
    - 대상: IdP·클라우드 관리자 계정, 디렉터리 동기화로 연결된 클라우드 자원, 개인 클라우드 계정에 연결된 기기 원격 삭제 기능(T1531·T1485)
    - 조건: 긴급(break-glass) 계정 부재, 관리자 계정 삭제·변경 경보 부재, 다른 서비스에서 얻을 수 있는 정보로 통과되는 계정 복구 절차
    - 연계: 클라우드 CL-IM-03(계정 접근 차단), OT OT-IR-06(자격증명 변경으로 운영자 차단) — ATT&CK에 LAPSUS$(G1004)의 전역 관리자 계정 삭제, Akira(G1024)의 암호화 전 관리자 계정 삭제 절차 수록
    ■ 실제 사례
    - [실제 사고] LAPSUS$ 연쇄 침해(2022-03): 탈취한 계정으로 소스 코드와 데이터를 반출하고 일부 피해 조직에서는 관리자 계정을 지워 대응을 방해 (IDI-001, ATT&CK G1004)
    - [실제 사고] MERCURY·DEV-1084 하이브리드 환경 파괴 공격(2023-04): 동기화 에이전트의 특권 계정 자격증명으로 클라우드에 접근해 서버 팜·가상머신·스토리지 등을 대량 삭제 (IDI-023)
    - [실제 사고] Mat Honan 계정 연쇄 탈취(2012-08): 고객지원 사회공학으로 iCloud 계정 비밀번호를 재설정받아 Gmail·Twitter 계정까지 장악하고 노트북·휴대폰·태블릿 데이터를 원격 삭제 (IDI-057)
  detect: |-
    ■ 탐지
    - 관리자 계정 삭제·비활성화, 관리자 비밀번호·인증 수단 일괄 변경, 대량 계정 삭제·원격 초기화 명령을 실시간 경보
    - 긴급 계정 사용 시 즉시 경보하고 정기 로그인 시험으로 사용 가능 여부 확인
    ■ 대응
    - 일상 관리와 분리된 긴급(break-glass) 계정을 오프라인 보관 자격증명·하드웨어 키로 유지하고 특권 계정 사용을 감사(CIS 5.4, NIST AC-2(7), ISMS-P 2.5.5, CCM IAM-10)
    - 계정·설정 백업을 두고 사고 대응 절차에 관리자 접근 상실 시나리오를 포함(NIST CP-9·IR-4)

IDT-IM-05:
  oneline: 공급업체·플랫폼 신원 침해가 그 서비스를 쓰는 고객 계정으로 연쇄 확산
  summary: |-
    - 공격자는 IdP·원격 지원·CI/CD·SaaS 연동 공급업체의 직원 계정이나 고객용 토큰·키를 장악해 그 서비스를 믿는 여러 고객 조직의 계정과 데이터로 옮겨 갈 수 있음
    - 고객은 공급업체 내부를 볼 수 없어 공지가 나와야 알게 되고, 고객마다 토큰·비밀을 교체해야 해 한 번의 침해가 수많은 조직의 대응으로 번짐
  reference: |-
    ■ 신원 관점
    - 침해 지점: 공급업체 지원 시스템·고객 지원 포털, 고객 비밀을 보관하는 CI/CD·데이터 분석 SaaS, 연동 앱 토큰(T1550.001), 공급업체와의 신뢰 관계(T1199)
    - 조건: 취약한 서드파티 비인간 신원(NHI3), 공급업체 침해 공지 뒤 고객 쪽 토큰·비밀 교체 지연, 공급업체 직원 계정의 피싱 저항 MFA 부재
    - 연계: IdP 공급업체 침해(IDT-DI-03.1)·SaaS 연동 토큰 탈취(IDT-NH-03.1)의 결과 — 클라우드 CL-IA-06, AI AI-06-07(다중 에이전트 연쇄 전파), 공급망 SCT-IM-01.2·SCT-CS-03.1
    ■ 실제 사례
    - [실제 사고] Okta 지원 시스템 침해(2023-10): 고객이 지원 요청에 첨부한 HAR 파일에서 세션 토큰을 추출해 BeyondTrust·Cloudflare·1Password 등 고객 134곳에 영향 (IDI-019)
    - [실제 사고] Cloudflare 내부 Atlassian 침해(2023-11): Okta 침해 때 유출되고 교체되지 않은 서비스 토큰·서비스 계정 자격증명으로 Atlassian에 접근, 탐지 하루 만에 차단 (IDI-020)
    - [실제 사고] Twilio 등 0ktapus SMS 피싱 캠페인(2022-08): 130곳 이상이 표적이 되어 자격증명 9,931건이 수집됐고 Twilio에서는 고객 209곳과 Signal 사용자 약 1,900명의 정보가 노출 (IDI-004, ATT&CK G1015)
    - [실제 사고] CircleCI 고객 비밀 유출(2023-01): 엔지니어 노트북 악성코드가 SSO 세션을 훔쳐 고객 환경변수·토큰·키를 빼냈고 모든 고객에게 저장 비밀 전체 교체를 권고 (IDI-073)
    - [실제 사고] BeyondTrust 원격 지원 SaaS API 키 탈취로 미 재무부 등 고객 17곳 침해(2024-12): 공급업체 인프라 API 키로 고객 인스턴스 비밀번호를 재설정해 고객 단말에 원격 접근 (IDI-084)
    - [실제 사고] Salesloft Drift 연동 OAuth 토큰 탈취로 Salesforce 인스턴스 대량 데이터 반출(2025-08): 연동 토큰으로 여러 조직의 데이터를 반출하고 그 안에서 AWS 키·Snowflake 토큰 등 자격증명을 찾아냄 (IDI-037)
    - [실제 사고] Retool 고객 계정 27곳 장악(2023-08): 직원 계정 장악과 인증 앱 클라우드 동기화로 MFA 코드가 함께 넘어가 클라우드 고객 27곳의 계정이 장악 (IDI-072)
    - [실제 사고] npm chalk·debug 메인테이너 계정 탈취(2025-09): 가짜 2FA 재설정 메일로 유명 메인테이너 계정이 탈취되어 18개 패키지에 지갑 거래를 가로채는 코드가 실림 (IDI-077)
    - [시연] SAT1029 비밀번호 없는 로그인: Canva·Slack·Expensify에서 메일로 받은 일회용 코드 로그인으로 장악한 메일 계정에서 다른 SaaS로 옮겨 가는 공개 시연
  detect: |-
    ■ 탐지
    - 공급업체 침해 공지·보안 권고를 구독해 공지 즉시 해당 서비스 토큰·연동 키·지원 접근 이력 점검(NIST IR-4)
    - 공급업체 지원 인력·원격 지원 도구의 고객 환경 접근을 별도로 감사하고 연동 토큰의 새 출발지 사용을 경보
    ■ 대응
    - 신원·원격 지원·CI/CD·연동 공급업체를 핵심 공급망으로 분류해 보안 요구 사항 계약과 정기 평가(NIST SA-9·SR-6, ISMS-P 2.3.3, CCM STA-09)
    - 공급업체에 맡긴 비밀·토큰 목록을 유지해 침해 때 전수 교체하고, 공급업체 특권 접근은 고객 승인 아래에서만 허용(CIS 6.6, CCM IAM-11)
