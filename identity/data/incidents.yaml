  impact: [계정 탈취, 데이터 반출]
  summary: >-
    직원이 Chrome 비밀번호 동기화로 개인 Google 계정에 저장해 둔 Cisco 자격증명이 개인 계정 탈취로 넘어갔다. 공격자는 여러 날에 걸쳐
    지원 조직을 사칭한 음성 피싱과 반복된 MFA 푸시로 직원이 승인하게 만들어 VPN에 접속했고, 새 MFA 장치를 등록해 접근을 유지했다.
    Cisco는 2022-05 침해를 2022-08에 공개했으며 비민감 데이터만 유출됐다고 밝혔다.
