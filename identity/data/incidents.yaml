  impact: [계정 탈취, 테넌트·도메인 장악, 데이터 반출]
  summary: >-
    협력사 직원의 개인 단말이 악성코드에 감염되어 유출된 Uber 업무 비밀번호를 공격자가 다크웹에서 구매한 것으로 추정되며,
    로그인 시도를 반복해 2단계 인증 승인 요청을 보내다가 협력사 직원이 결국 승인했다. 내부 네트워크 공유의 PowerShell 스크립트에
    하드코딩된 특권 접근 관리(PAM) 도구 관리자 자격증명을 얻어 AWS·Google Cloud·Slack·보안 도구 등 여러 내부 시스템에 접근했다.
  idt: [IDT-CR-01.1, IDT-AU-01.2, IDT-AU-03.1, IDT-CR-02.1, IDT-PE-01.2, IDT-LC-01.2]
