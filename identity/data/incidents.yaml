  id_env: [클라우드 IdP, SaaS]
  id_type: [인력]
  region: 글로벌
  actor: Scattered Spider(0ktapus, G1015)
  impact: [계정 탈취, 데이터 반출]
  summary: >-
    IT 부서를 사칭한 문자로 비밀번호 만료를 알리며 Okta 로그인 화면을 흉내 낸 유사 도메인으로 유도해 SSO 자격증명과 MFA 코드를
    텔레그램으로 실시간 전달받았다. Group-IB는 130곳 이상이 표적이 되어 자격증명 9,931건이 수집됐다고 분석했다. Twilio에서는 고객
    209곳과 Signal 사용자 약 1,900명의 정보가 노출됐고, 하드웨어 보안 키를 쓰던 Cloudflare는 침해를 막았다.
