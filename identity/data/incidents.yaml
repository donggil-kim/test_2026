# 신원(아이덴티티)·계정 보안사고 DB v1 — 공개 출처 기반
#
# 필드
#   date          사고 인지·공개 시점 YYYY-MM (최초 침투가 크게 앞서면 요약에 적음)
#   kind          사고 · 캠페인 · 정부 경보 · 공시 · 사례연구(익명) · 연구·시연 · 위협인텔
#   verification  정부·사법 확인 · 피해기관 확인 · 보안업체·연구기관 분석 · 언론 보도 · 행위자 주장 · 논란·원인 번복
#   id_env        공격이 일어난 ID 환경(scripts/taxonomy_rules.py ID_ENVS)
#   id_type       공격 대상 신원 유형(인력 · 특권 · NHI · 고객)
#   region        피해 지역(글로벌·한국·미국 등) — '한국'은 국내 사례 집계에 사용
#   actor         행위자(공개 귀속)
#   impact        결과 유형(scripts/taxonomy_rules.py IMPACTS)
#   summary       경위·결과 요약(분석가 작성, 수치는 출처 기준)
#   idt           매핑 세부위협(분석 매핑) — data/taxonomy.yaml의 Lv3 ID
#   attack_ref    ATT&CK v19.2 그룹·소프트웨어·캠페인 ID(대조·표시용, 자동 매핑에 쓰지 않음)
#   kev           관련 CISA KEV CVE
#   origin        다른 매트릭스 사고 DB의 같은 사고 ID(SCI- 공급망 · INC- 클라우드) — 재인용 추적용
#   sources       '출처 | URL'
#
# 집계 규칙(scripts/taxonomy_rules.py): 실제 사고 = kind ∈ {사고·캠페인·정부 경보·공시·사례연구(익명)}
#   이면서 verification ∉ {행위자 주장·논란·원인 번복}. 연구·시연(연구자의 실증·노출 발견 포함)은 실증 근거,
#   위협인텔은 실사용 근거(중 상한)로만 반영. 여러 조직을 겨냥한 같은 수법의 공격은 캠페인 1건으로 묶음.

# ---------------------------------------------------------------------------
# 헬프데스크·사회공학 계열(Scattered Spider·LAPSUS$ 등)
# ---------------------------------------------------------------------------
- id: IDI-001
  title: LAPSUS$ 연쇄 침해(SIM 스와핑·MFA 폭탄·내부자 모집)
  date: 2022-03
  kind: 캠페인
  verification: 보안업체·연구기관 분석
  id_env: [클라우드 IdP, SaaS, 원격 접속]
  id_type: [인력, 특권]
  region: 글로벌
  actor: LAPSUS$(G1004)
  impact: [계정 탈취, 데이터 반출, 테넌트·도메인 장악]
  summary: >-
    Microsoft가 DEV-0537로 추적한 LAPSUS$는 공개 저장소의 자격증명 수집, 다크웹 구매, 직원·협력사 내부자 모집, SIM 스와핑,
    MFA 승인 요청 반복, 헬프데스크 전화로 비밀번호·MFA 재설정을 유도하는 방식으로 Microsoft·Nvidia·Samsung·Okta 등을 침해했다.
    탈취한 계정으로 SSO·VPN·협업 도구에 들어가 소스 코드와 데이터를 반출하고, 일부 피해 조직에서는 관리자 계정을 지워 대응을 방해했다.
  idt: [IDT-AU-03.1, IDT-AU-03.2, IDT-SE-02.1, IDT-LC-02.2, IDT-AU-01.2, IDT-IM-03, IDT-IM-04]
  attack_ref: [G1004]
  sources:
    - Microsoft(2022) DEV-0537 criminal actor targeting organizations for data exfiltration and destruction | https://www.microsoft.com/en-us/security/blog/2022/03/22/dev-0537-criminal-actor-targeting-organizations-for-data-exfiltration-and-destruction/

- id: IDI-002
  title: Uber 내부망 침해(협력사 자격증명·MFA 승인 반복·PAM 관리자 자격증명)
