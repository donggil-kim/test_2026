# CIS Controls v8.1 — 5 계정 관리 · 6 접근 통제 관리
cis:
  '5.1': [Establish and Maintain an Inventory of Accounts, 계정 인벤토리 수립·유지]
  '5.2': [Use Unique Passwords, 고유 비밀번호 사용]
  '5.3': [Disable Dormant Accounts, 휴면 계정 비활성화]
  '5.4': [Restrict Administrator Privileges to Dedicated Administrator Accounts, 관리자 권한을 전용 관리자 계정으로 제한]
  '5.5': [Establish and Maintain an Inventory of Service Accounts, 서비스 계정 인벤토리 수립·유지]
  '5.6': [Centralize Account Management, 계정 관리 중앙화]
  '6.1': [Establish an Access Granting Process, 접근 권한 부여 절차 수립]
  '6.2': [Establish an Access Revoking Process, 접근 권한 회수 절차 수립]
  '6.3': [Require MFA for Externally-Exposed Applications, 외부 노출 애플리케이션 MFA 적용]
  '6.4': [Require MFA for Remote Network Access, 원격 네트워크 접속 MFA 적용]
  '6.5': [Require MFA for Administrative Access, 관리자 접근 MFA 적용]
  '6.6': [Establish and Maintain an Inventory of Authentication and Authorization Systems, 인증·인가 시스템 인벤토리 수립·유지]
  '6.7': [Centralize Access Control, 접근 통제 중앙화]
  '6.8': [Define and Maintain Role-Based Access Control, 역할 기반 접근 통제 정의·유지]

