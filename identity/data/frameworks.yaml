# OWASP Non-Human Identities Top 10 (2025)
owasp_nhi:
  NHI1: [Improper Offboarding, 부적절한 폐기(오프보딩)]
  NHI2: [Secret Leakage, 비밀 유출]
  NHI3: [Vulnerable Third-Party NHI, 취약한 서드파티 비인간 신원]
  NHI4: [Insecure Authentication, 안전하지 않은 인증]
  NHI5: [Overprivileged NHI, 과다 권한 비인간 신원]
  NHI6: [Insecure Cloud Deployment Configurations, 안전하지 않은 클라우드 배포 구성]
  NHI7: [Long-Lived Secrets, 장기 비밀]
  NHI8: [Environment Isolation, 환경 격리 미흡]
  NHI9: [NHI Reuse, 비인간 신원 재사용]
  NHI10: [Human Use of NHI, 사람의 비인간 신원 사용]

# NIST SP 800-63-4 — 요구사항 주제 코드(분석가 정의, 절 번호 대신 주제명으로 연계)
sp80063:
  63A-IAL: [Identity Assurance Levels (IAL1–IAL3), 신원 확인 보증 수준]
  63A-FRAUD: [Identity Proofing Fraud Management, 신원 확인 사기 관리(위조 신분증·합성 신원·주입 공격)]
  63B-AAL: [Authentication Assurance Levels (AAL1–AAL3), 인증 보증 수준]
  63B-PR: [Phishing-Resistant Authentication, 피싱 저항 인증(채널 바인딩·검증자 이름 바인딩)]
  63B-PWD: [Password Requirements, 비밀번호 요건(길이·차단 목록·주기적 변경 강제 금지)]
  63B-RL: [Rate Limiting (Throttling), 인증 실패 횟수 제한]
  63B-OOB: [Out-of-Band Authenticators and PSTN Restrictions, 대역 외 인증과 전화망(SMS·음성) 사용 제한]
  63B-SYNC: [Syncable Authenticators, 동기화 인증기(패스키)·동기화 계층 보호]
  63B-RECOV: [Account Recovery, 계정 복구]
  63B-LIFE: [Authenticator Event Management, 인증기 등록·분실·폐기 관리]
  63B-SESS: [Session Management and Reauthentication, 세션 관리·재인증]
  63C-FAL: [Federation Assurance Levels (FAL1–FAL3), 페더레이션 보증 수준]
  63C-ASSERT: [Assertion Protection, 어설션 보호(서명·대상 제한·주입 방지)]
  63C-TRUST: [Trust Agreements and RP Registration, 신뢰 협약·신뢰 당사자(RP) 등록]

