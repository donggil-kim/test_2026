# 통합 신원(아이덴티티)·계정 보안위협 매트릭스 — 분류 체계(원천)
#
# 구조: Lv1 도메인(신원 공격면) → Lv2 위협분류(IDT-<도메인>-NN) → Lv3 세부위협(IDT-<도메인>-NN.m)
#       하위 세부위협이 하나뿐인 위협분류는 Lv2 = Lv3 (ID에 '.m' 없음)
# ID는 고정 — 항목을 없애도 번호를 다시 매기거나 재사용하지 않음(폐지 시 retired 표시)
#
# Lv3 필드
#   name / en       세부위협명(국문) / 영문명
#   stage           주 공격 단계 — ATT&CK v19.2 전술 국문명
#   id_types        대상 신원 유형 — 인력 · 특권 · NHI · 고객
#   id_envs         ID 환경 — 온프레미스 AD · 클라우드 IdP · SaaS · 원격 접속 · CIAM·고객 서비스 · 통신 · 개발·CI/CD · 클라우드 인프라
#   attack          ATT&CK v19.2 기법 ID
#   sat             Browser & Identity Attacks Matrix 기법 ID(SAT10NN)
#   nhi             OWASP Non-Human Identities Top 10(2025)
#   sp80063         NIST SP 800-63-4 요구사항 주제 코드(frameworks.yaml sp80063)
#   asvs / oat      OWASP ASVS 5.0 절 / OWASP 자동화 위협
#   ccm / cis / nist / ismsp   대응 기준(CSA CCM v4.1 · CIS Controls v8.1 · NIST SP 800-53 Rev.5 · ISMS-P)
#   cloud / ai / ot / sct      다른 매트릭스 연계 — 통합 AI·클라우드·OT 매트릭스 v2 요약 ID(CL-·AI-·OT-), 공급망 매트릭스 v2(SCT-)
#   severity        심각도(상·중·하) — 기준은 assessment.severity_rule
#   severity_why    심각도 근거(대표 사례는 사고 DB에 있어야 함)

assessment:
  severity_rule:
    상: 공격이 성공하면 IdP·디렉터리·서명 키·특권 계정·비인간 신원 등 신원 체계 자체를 장악해 조직(테넌트) 전체 또는 다수 계정에 임의 인증·토큰 위조가 가능해지거나, 인증 통제를 체계적으로 우회해 다수 계정을 동시에 장악하거나, 정상 권한 범위 안에서 대량 데이터·금전 피해가 바로 나는 위협
    중: 성공해도 단일 사용자·계정 범위의 발판에 머물러 추가 단계가 필요하거나, 사용자의 선택·실수가 필요한 위협, 또는 단독으로는 피해가 없고 다른 위협의 피해를 키우는 조건·지속성·은닉 기법
    하: 영향이 제한적·일시적이고 복구가 쉬운 위협
  likelihood_rule: 상 = 실제 사고 2건 이상(AI v3.2·클라우드 v5·OT·공급망 매트릭스와 같은 수식), 중 = 실제 사고 1건 또는 ATT&CK 사례·KEV(신원)·위협인텔·실증 중 하나 이상, 하 = 근거 없음
  severity_check: "'상' 판정은 장악 범위(조직 전체·다수 계정·정상 권한 대량 피해)를 severity_why에 적은 경우에만 — 공급망 매트릭스의 위험도 포화(60개 중 38개 매우 높음)를 피하기 위한 기준"

id_types:
  인력: 임직원·협력사 직원의 업무 계정(SSO·메일·VPN·SaaS)
  특권: 관리자·도메인 관리자·IdP 관리자·특권 접근 관리(PAM) 대상 계정
  NHI: 서비스 계정·API 키·OAuth 앱·토큰·워크로드 ID·AI 에이전트 등 비인간 신원
  고객: 고객·이용자 계정과 본인확인(CIAM·통신 가입자)

id_envs:
  - 온프레미스 AD
  - 클라우드 IdP
  - SaaS
  - 원격 접속
  - CIAM·고객 서비스
  - 통신
  - 개발·CI/CD
  - 클라우드 인프라

