# 공격 체인 시나리오 — 실제 사고를 공급망 단계 흐름으로 재구성
# 목적: 개별 세부위협을 공격 흐름 안에서 보고, 어느 단계에서 끊을 수 있는지(초크 포인트)를 드러냄 (OT 매트릭스 시나리오 형식 준용)
# 필드: incidents = 근거 사고 ID(data/incidents.yaml), ref = ATT&CK 캠페인·그룹·소프트웨어 ID
#       steps = 순서대로 { sct: [세부위협 ID], 단계: 공격 단계, 행위: 사고 DB 요약에 있는 사실만, 탐지: 그 단계의 탐지·차단 포인트 }
#       chokepoints = '세부위협 ID — 끊는 통제' (가장 싸고 효과가 큰 차단 지점)
# 검증: scripts/validate.py가 SCT·사고·ATT&CK ID 존재와 초크 포인트-단계 일치를 점검

scenarios:
  - id: SCN-01
    title: 빌드 주입 — 깨끗한 소스에서 서명된 백도어 업데이트까지
    incidents: [SCI-052]
    ref: ATT&CK C0024 · G0016 · S0562(SUNSPOT) · S0559(SUNBURST)
    summary: 빌드 서버만 장악해 소스 저장소·코드 리뷰를 건드리지 않고 정식 서명 업데이트에 백도어를 실은 전형적 빌드 주입. 대량 설치 후 소수 표적만 골라 후속 침투했다.
    steps:
      - { sct: [SCT-BD-02.1], 단계: 지속성, 행위: "Orion 빌드 서버에 빌드 과정을 감시하는 SUNSPOT 상주", 탐지: "빌드 서버의 상주 프로세스·빌드 도구 무결성 감시" }
      - { sct: [SCT-BD-02.1], 단계: 실행, 행위: "빌드 중에만 소스 파일을 바꿔치기해 SUNBURST 삽입(저장소 소스는 깨끗)", 탐지: "독립 환경 재현 빌드로 산출물 해시 비교" }
      - { sct: [SCT-PB-03.1], 단계: 방어 무력화, 행위: "정식 코드 서명으로 서명된 업데이트 생성", 탐지: "서명 요청을 빌드 출처 증명과 대조" }
      - { sct: [SCT-IM-01.1], 단계: 영향, 행위: "고객 약 1만 8천 곳이 정상 업데이트로 설치", 탐지: "공급자 침해 공지와 설치 소프트웨어 인벤토리 대조" }
      - { sct: [SCT-IM-01.1], 단계: 영향, 행위: "정부기관·IT 기업 일부만 골라 후속 침투", 탐지: "고권한 서드파티 소프트웨어의 외부 통신 기준선 위반 경보" }
    chokepoints:
      - SCT-BD-02.1 — 매번 새로 만드는 격리 빌드와 재현 빌드 해시 비교로 배포 전에 주입을 발견
      - SCT-PB-03.1 — 빌드 플랫폼 출처 증명이 없는 산출물은 서명하지 않음
      - SCT-IM-01.1 — 고권한 서드파티 소프트웨어의 네트워크 송신을 필요한 목적지로 제한

  - id: SCN-02
    title: 이중 공급망 침해 — 트로이목마화된 프로그램에서 서명된 데스크톱 앱까지
    incidents: [SCI-090]
    ref: ATT&CK C0057
    summary: 앞선 공급망 침해로 트로이목마화된 프로그램이 다른 공급사 직원 단말을 감염시키고, 그 단말이 빌드 환경 장악으로 이어진 첫 공개 연쇄 사례.
    steps:
      - { sct: [SCT-IM-01.2], 단계: 초기 침투, 행위: "직원이 이미 트로이목마화된 금융 거래 프로그램(X_TRADER)을 설치", 탐지: "업무 단말의 비승인 소프트웨어 설치 통제·EDR 경보" }
      - { sct: [SCT-DE-01.1], 단계: 자격증명 접근, 행위: "감염된 직원 단말을 발판으로 내부 접근 확보", 탐지: "개발 계정 세션 재사용·비정상 내부 접속 상관 분석" }
      - { sct: [SCT-BD-02.1], 단계: 지속성, 행위: "Windows·macOS 빌드 환경 장악", 탐지: "빌드 환경 접근 이력·빌드 도구 무결성 감시" }
      - { sct: [SCT-PB-03.1], 단계: 방어 무력화, 행위: "정식 서명된 데스크톱 앱에 악성코드를 넣어 배포", 탐지: "서명 요청과 빌드 출처 증명 대조, 재현 빌드 비교" }
      - { sct: [SCT-IM-01.1], 단계: 영향, 행위: "정상 앱을 설치·업데이트한 고객 단말 감염", 탐지: "공급자 앱 프로세스의 신규 외부 통신·자식 프로세스 탐지" }
    chokepoints:
      - SCT-DE-01.1 — 빌드·서명 권한자는 전용 관리 단말을 쓰고 개인·비승인 소프트웨어 설치를 막음
      - SCT-BD-02.1 — 빌드 환경을 업무망과 분리하고 재현 빌드로 산출물을 검증
      - SCT-IM-01.2 — 쓰는 소프트웨어 공급자의 침해 공지가 나오면 자사 설치 이력과 노출 자격증명을 즉시 역추적

  - id: SCN-03
    title: 장기 위장 메인테이너 — 신뢰 구축에서 sshd 백도어까지
    incidents: [SCI-111]
    ref: ""
    summary: 약 2년간 기여로 신뢰를 쌓아 권한을 얻은 뒤, 리뷰를 피하는 은닉 기법으로 핵심 압축 라이브러리에 백도어를 심었다. 배포판 안정 버전에 들어가기 전에 성능 이상 추적으로 발견됐다.
    steps:
      - { sct: [SCT-SR-01.3], 단계: 초기 침투, 행위: "약 2년간 기여로 신뢰를 쌓아 공동 메인테이너가 됨", 탐지: "핵심 의존성의 메인테이너 변경·권한 이양 감시" }
      - { sct: [SCT-SR-01.2], 단계: 은닉, 행위: "테스트 파일에 페이로드를 숨김", 탐지: "바이너리 테스트 자료·난독화 변경을 별도 리뷰" }
      - { sct: [SCT-SR-01.2], 단계: 은닉, 행위: "릴리스 압축 파일의 빌드 스크립트로 페이로드를 풀어 넣어 sshd 인증 우회 백도어 삽입(xz 5.6.0·5.6.1)", 탐지: "릴리스 압축 파일을 저장소 태그에서 다시 만들어 비교" }
      - { sct: [SCT-IM-01.1], 단계: 영향, 행위: "일부 배포판 개발·테스트 버전에 포함", 탐지: "개발자의 성능 이상(sshd 지연) 추적으로 발견" }
    chokepoints:
      - SCT-SR-01.3 — 1인 유지보수 핵심 의존성을 식별하고 메인테이너 변경 시 독립 검토·후원으로 의존을 줄임
      - SCT-SR-01.2 — 배포 압축 파일과 저장소 소스의 차이를 재현 빌드로 자동 점검

  - id: SCN-04
    title: CI 액션 연쇄 침해 — 다른 액션 침해에서 2만 3천 개 저장소 비밀 노출까지
    incidents: [SCI-133]
    ref: KEV CVE-2025-30066 · CVE-2025-30154
    summary: 한 액션의 침해가 그 액션을 쓰던 다른 액션의 토큰 탈취로 이어지고, 태그 재지정으로 태그 참조 저장소 전체가 다음 실행에서 악성 코드를 받았다.
    steps:
      - { sct: [SCT-BD-04], 단계: 초기 침투, 행위: "먼저 reviewdog/action-setup이 침해됨", 탐지: "사용 중인 액션의 상류 태그가 가리키는 커밋 변경 경보" }
      - { sct: [SCT-IM-01.2], 단계: 자격증명 접근, 행위: "이를 쓰던 tj-actions의 PAT가 탈취됨", 탐지: "봇·메인테이너 토큰의 새 출발지 사용 경보" }
      - { sct: [SCT-SR-02.2], 단계: 방어 무력화, 행위: "changed-files의 버전 태그 전부를 악성 커밋으로 옮김", 탐지: "태그 재지정(force push) 이벤트 감시" }
      - { sct: [SCT-DP-05], 단계: 실행, 행위: "태그로 참조하던 약 2만 3천 개 저장소가 다음 실행에서 악성 코드를 받음", 탐지: "해시 고정이 안 된 액션 참조 점검(Scorecard Pinned-Dependencies)" }
      - { sct: [SCT-SC-01.2], 단계: 자격증명 접근, 행위: "러너 메모리의 비밀을 공개 빌드 로그에 출력", 탐지: "공개 로그의 인코딩 문자열·비밀 패턴 점검" }
    chokepoints:
      - SCT-DP-05 — 서드파티 액션을 전체 커밋 해시로 고정하면 태그 재지정이 무력화됨
      - SCT-SC-01.2 — 공개 저장소의 로그·아티팩트 비밀 점검과 노출 즉시 교체
      - SCT-BD-04 — 조직 차원 허용 목록으로 승인된 액션만 실행

  - id: SCN-05
    title: TeamPCP 연쇄 — 워크플로 결함 하나에서 플랫폼 내부 저장소 유출까지(2026)
    incidents: [SCI-152, SCI-153, SCI-154, SCI-155, SCI-162, SCI-163, SCI-164]
    ref: ATT&CK G1056 · S9041 · S9043
    summary: 워크플로 결함으로 빼낸 토큰 하나가 교체 누락을 거쳐 보안 스캐너·액션·패키지·IDE 확장·플랫폼 내부 저장소로 번진 2026년 연쇄 공격. 단계마다 앞 단계에서 빼낸 비밀을 재료로 썼다.
    steps:
      - { sct: [SCT-BD-01.1], 단계: 실행, 행위: "2월 AI 에이전트로 보이는 계정이 pull_request_target·입력 주입 결함으로 Trivy 저장소 쓰기 토큰을 빼냄", 탐지: "권한 있는 트리거에서 PR 코드 실행·외부 입력 셸 삽입 정적 점검" }
      - { sct: [SCT-SC-02.3], 단계: 지속성, 행위: "침해 뒤 교체에서 빠진 토큰이 남음", 탐지: "토큰 목록 기준 교체 완료 확인, 폐기 대상 토큰 재사용 경보" }
      - { sct: [SCT-BD-04, SCT-SR-02.2], 단계: 초기 침투, 행위: "3월 19일 Trivy 악성 릴리스를 올리고 trivy-action 태그 77개 중 76개를 자격증명 탈취 커밋으로 옮김", 탐지: "상류 태그 커밋 변경 경보, 릴리스와 소스 태그 대조" }
      - { sct: [SCT-SC-02.1], 단계: 자격증명 접근, 행위: "보안 스캐너를 돌리는 파이프라인의 토큰·키 수집", 탐지: "러너 메모리 접근·외부 전송 런타임 감시" }
      - { sct: [SCT-BD-04, SCT-IM-01.2], 단계: 횡적 이동, 행위: "빼낸 CI 비밀로 3월 23일 KICS 액션 태그 35개 변조", 탐지: "다른 조직 사고 지표로 자사 사용 액션 역추적" }
      - { sct: [SCT-SC-02.2, SCT-PB-01], 단계: 초기 침투, 행위: "Trivy 침해 때 빼낸 PyPI 게시 토큰으로 LiteLLM 1.82.7·1.82.8 게시", 탐지: "소스 태그·CI 실행 없는 게시 경보" }
      - { sct: [SCT-BD-01.1, SCT-BD-02.2, SCT-SC-02.2], 단계: 실행, 행위: "5월 TanStack: 포크 PR로 캐시를 오염시키고 러너 메모리의 OIDC 토큰으로 패키지 42개에 악성 버전 84개 게시", 탐지: "릴리스 작업의 PR 캐시 복원·OIDC 토큰 요청 이상 경보" }
      - { sct: [SCT-DE-02.1, SCT-PB-01], 단계: 초기 침투, 행위: "TanStack 여파로 넘어간 게시 자격으로 Nx Console 18.95.0을 마켓플레이스에 게시", 탐지: "정상 CI를 거치지 않은 확장 게시·급변 버전 경보" }
      - { sct: [SCT-DE-01.1, SCT-IM-03], 단계: 반출, 행위: "확장이 설치된 GitHub 직원 단말에서 내부 저장소 유출", 탐지: "편집기 프로세스의 자격증명 접근·저장소 대량 복제 탐지" }
    chokepoints:
      - SCT-BD-01.1 — 권한 있는 트리거에서 PR 코드를 실행하지 않으면 연쇄의 출발점이 사라짐
      - SCT-SC-02.3 — 침해 시 노출 가능 토큰 전부를 한 번에 교체해 같은 공격자의 재침해를 막음
      - SCT-SC-02.2 — 게시를 보호 환경·별도 워크플로로 분리하고 게시 토큰을 단기화
      - SCT-DE-02.1 — 확장 허용 목록·자동 업데이트 지연으로 수십 분짜리 악성 버전 노출을 피함

  - id: SCN-06
    title: 자가 전파 웜 — 설치 스크립트에서 게시 토큰 재사용 확산까지
    incidents: [SCI-147, SCI-150]
    ref: ATT&CK S9008
    summary: 설치 시점에 실행되어 비밀을 모으고, 찾은 게시 토큰으로 피해자의 다른 패키지에 자신을 다시 게시하며 사람 개입 없이 번졌다. 2차 변종은 원격 명령 통로와 파괴 기능까지 갖췄다.
    steps:
      - { sct: [SCT-PB-01], 단계: 초기 침투, 행위: "감염된 패키지 버전이 npm에 게시됨", 탐지: "신규 버전의 설치 스크립트 신설·외부 연결 분석" }
      - { sct: [SCT-DP-03.2], 단계: 실행, 행위: "설치 후(1차)·설치 전(2차) 스크립트로 자동 실행", 탐지: "패키지 설치 중 셸 실행·네트워크 연결 런타임 감시" }
      - { sct: [SCT-SC-02.1], 단계: 자격증명 접근, 행위: "TruffleHog로 비밀을 찾고 클라우드 메타데이터 키까지 수집", 탐지: "비밀 탐색 도구 실행·메타데이터 엔드포인트 접근 탐지" }
      - { sct: [SCT-IM-03], 단계: 반출, 행위: "탈취 정보를 공개 GitHub 저장소에 올림(2차는 2만 5천 개 이상)", 탐지: "새 공개 저장소 생성·대량 업로드 경보" }
      - { sct: [SCT-SC-02.2, SCT-IM-02], 단계: 횡적 이동, 행위: "찾은 npm 토큰으로 그 계정의 다른 패키지에 자신을 재게시해 수백 개 패키지로 확산", 탐지: "같은 계정의 짧은 시간 다수 패키지 게시 경보" }
      - { sct: [SCT-BD-02.3], 단계: 지속성, 행위: "2차: 감염 단말을 SHA1HULUD 자체 호스팅 러너로 등록해 원격 명령 통로 확보", 탐지: "승인되지 않은 러너 등록 이벤트 감사" }
      - { sct: [SCT-IM-05], 단계: 영향, 행위: "2차: 자격증명을 찾지 못하면 홈 디렉터리 삭제", 탐지: "설치 프로세스의 대량 파일 삭제 탐지" }
    chokepoints:
      - SCT-DP-03.2 — 설치 스크립트 기본 차단과 비밀 없는 설치 단계로 실행 자체를 막음
      - SCT-SC-02.2 — 장기 게시 토큰을 없애고 신뢰 게시·게시 2FA를 요구해, 감염 환경에서 빼낸 토큰만으로는 재게시할 수 없게 함
      - SCT-PB-01 — 신규 버전 숙성 기간과 차단 목록으로 확산 초기의 유입을 피함

  - id: SCN-07
    title: 웹 앱 스크립트 변조 — 개발자 단말에서 15억 달러 탈취까지
    incidents: [SCI-132]
    ref: ATT&CK G0032
    summary: 지갑 서비스 개발자 단말에서 얻은 클라우드 자격증명으로 웹 앱 스크립트를 특정 서명자에게만 동작하도록 바꿔, 서명자가 정상 화면에서 악성 거래를 승인하게 만들었다.
    steps:
      - { sct: [SCT-DE-01.1], 단계: 초기 침투, 행위: "Safe{Wallet} 개발자 단말 침해", 탐지: "개발 단말 EDR·사회공학 신고 창구" }
      - { sct: [SCT-DE-01.1], 단계: 자격증명 접근, 행위: "단말에서 클라우드 자격증명 획득", 탐지: "클라우드 키의 새 출발지·비정상 시간 사용 경보" }
      - { sct: [SCT-CS-03.2], 단계: 실행, 행위: "웹 앱(app.safe.global) JavaScript를 Bybit 서명자에게만 동작하도록 변조", 탐지: "배포된 웹 스크립트 해시 변경 경보·SRI" }
      - { sct: [SCT-IM-04], 단계: 영향, 행위: "서명자가 정상 거래로 보이는 화면에서 승인해 약 15억 달러 상당 암호자산이 빠져나감", 탐지: "화면과 독립된 경로(하드웨어 지갑 화면)로 거래 내용 확인" }
    chokepoints:
      - SCT-DE-01.1 — 배포 권한이 있는 개발자에게 전용 단말과 단기 자격을 적용
      - SCT-CS-03.2 — 운영 웹 스크립트 무결성 감시로 변조를 배포 직후 발견
      - SCT-IM-04 — 고액 거래는 화면과 독립된 경로로 검증

  - id: SCN-08
    title: MSP 원격 관리 도구 — 제로데이에서 하위 기업 1,500곳 암호화까지
    incidents: [SCI-061]
    ref: KEV CVE-2021-30116
    summary: MSP가 고객 관리에 쓰는 원격 관리(RMM) 서버를 장악해 정상 배포 기능으로 랜섬웨어를 내려보내, MSP를 거쳐 하위 기업까지 동시에 암호화했다.
    steps:
      - { sct: [SCT-CS-02.1], 단계: 초기 침투, 행위: "Kaseya VSA 제로데이(CVE-2021-30116)로 VSA 서버 장악", 탐지: "RMM 서버 노출 점검·KEV 취약점 패치 상태 관리" }
      - { sct: [SCT-CS-02.1], 단계: 실행, 행위: "가짜 업데이트로 관리 대상 단말에 랜섬웨어 배포", 탐지: "다수 고객 단말 대상 일괄 배포·업무 시간 외 작업 경보" }
      - { sct: [SCT-IM-01.1, SCT-IM-05], 단계: 영향, 행위: "직접 피해 고객 중 약 30곳이 MSP여서 하위 기업 약 1,500곳이 암호화", 탐지: "고객사 EDR의 대량 암호화·백업 삭제 징후 탐지" }
    chokepoints:
      - SCT-CS-02.1 — RMM 서버 인터넷 노출 제거·최우선 패치와 대량 배포의 고객 승인 절차
      - SCT-IM-05 — 오프라인 백업과 단계적 배포로 동시 암호화 피해를 줄임

  - id: SCN-09
    title: 내부 패치 관리 서버 악용 — 3·20 전산망 대란
    incidents: [SCI-011]
    ref: ATT&CK S0041
    summary: 방송사·금융사 내부의 중앙 패치 관리 서버를 장악해 정상 배포 기능으로 와이퍼를 일괄 배포한 국내 대표 사례. 배포 서버 한 대가 전사 동시 파괴 수단이 됐다.
    steps:
      - { sct: [SCT-CS-02.2], 단계: 횡적 이동, 행위: "방송사·금융사 내부의 중앙 패치 관리(업데이트 배포) 서버 장악", 탐지: "배포 서버 관리자 계정 신규 생성·접속 출발지 감시" }
      - { sct: [SCT-CS-02.2], 단계: 실행, 행위: "정상 배포 기능으로 와이퍼 일괄 배포", 탐지: "평소와 다른 배포 패키지·전 단말 대상 배포 경보" }
      - { sct: [SCT-IM-05], 단계: 영향, 행위: "전산장비 약 4만 8천 대의 디스크 파괴", 탐지: "다수 단말 동시 디스크 쓰기·부팅 영역 변경 탐지" }
    chokepoints:
      - SCT-CS-02.2 — 배포 서버를 관리 전용망에 두고 전사 대상 배포에 2인 승인·단계적 배포 적용
      - SCT-IM-05 — 오프라인 백업과 복구 훈련으로 복구 시간을 줄임
