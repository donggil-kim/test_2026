# S2C2F 요구사항 — [실천(Practice), 성숙도, 제목(영문), 제목(국문)]
s2c2f:
  ING-1: [Ingest it, L1, Use package managers trusted by your organization, 신뢰하는 패키지 관리자 사용]
  ING-2: [Ingest it, L1, Use an OSS binary repository manager solution, 오픈소스 바이너리 저장소 관리자 사용]
  ING-3: [Ingest it, L3, Have a Deny List capability to block known malicious OSS from being consumed, 알려진 악성 오픈소스 차단 목록]
  ING-4: [Ingest it, L3, Mirror a copy of all OSS source code to an internal location, 오픈소스 소스 코드 내부 미러]
  SCA-1: [Scan it, L1, Scan OSS for known vulnerabilities, 알려진 취약점 점검]
  SCA-2: [Scan it, L1, Scan OSS for licenses, 라이선스 점검]
  SCA-3: [Scan it, L2, Scan OSS to determine if its end-of-life, 지원 종료(EOL) 점검]
  SCA-4: [Scan it, L3, Scan OSS for malware, 악성코드 점검]
  SCA-5: [Scan it, L3, Perform proactive security analysis of OSS, 선제적 보안 분석]
  INV-1: [Inventory it, L1, Maintain an automated inventory of all OSS used in development, 오픈소스 자동 인벤토리]
  INV-2: [Inventory it, L2, Have an OSS Incident Response Plan, 오픈소스 침해사고 대응 계획]
  UPD-1: [Update it, L1, Update vulnerable OSS manually, 취약 구성요소 수동 업데이트]
  UPD-2: [Update it, L2, Enable automated OSS updates, 자동 업데이트]
  UPD-3: [Update it, L2, Display OSS vulnerabilities in developer contribution flow, 기여 흐름(PR)에 취약점 표시]
  AUD-1: [Audit it, L3, Verify the provenance of your OSS, 출처(provenance) 검증]
  AUD-2: [Audit it, L2, Audit that developers are consuming OSS through the approved ingestion method, 승인된 유입 경로 사용 감사]
  AUD-3: [Audit it, L2, Validate integrity of the OSS that you consume into your build, 빌드 유입 구성요소 무결성 검증]
  AUD-4: [Audit it, L4, Validate SBOMs of OSS that you consume into your build, 유입 구성요소 SBOM 검증]
  ENF-1: [Enforce it, L2, Securely configure your package source files, 패키지 소스 설정 보안(소스 매핑·버전 고정·잠금 파일)]
  ENF-2: [Enforce it, L3, Enforce usage of a curated OSS feed, 선별된 오픈소스 피드 사용 강제]
  REB-1: [Rebuild it, L4, Rebuild the OSS in a trusted build environment or validate reproducible builds, 신뢰 빌드 환경 재빌드·재현 빌드 검증]
  REB-2: [Rebuild it, L4, Digitally sign the OSS you rebuild, 재빌드 산출물 서명]
  REB-3: [Rebuild it, L4, Generate SBOMs for OSS that you rebuild, 재빌드 SBOM 생성]
  REB-4: [Rebuild it, L4, Digitally sign the SBOMs you produce, SBOM 서명]
  FIX-1: [Fix it + Upstream, L4, Implement a fix for a zero-day and contribute upstream, 제로데이 자체 수정·상류 기여]

# NIST SSDF v1.1 실천과제(Practice)
ssdf:
  PO.1: [Define Security Requirements for Software Development, 소프트웨어 개발 보안 요구사항 정의]
  PO.2: [Implement Roles and Responsibilities, 역할·책임 부여]
  PO.3: [Implement Supporting Toolchains, 개발 도구 체인 보안 구축]
  PO.4: [Define and Use Criteria for Software Security Checks, 보안 점검 기준 정의·적용]
  PO.5: [Implement and Maintain Secure Environments for Software Development, 안전한 개발 환경 구축·유지]
  PS.1: [Protect All Forms of Code from Unauthorized Access and Tampering, 코드 무단 접근·변조 방지]
  PS.2: [Provide a Mechanism for Verifying Software Release Integrity, 릴리스 무결성 검증 수단 제공]
  PS.3: [Archive and Protect Each Software Release, 릴리스 보관·보호]
  PW.1: [Design Software to Meet Security Requirements and Mitigate Security Risks, 보안 요구사항 반영 설계]
  PW.2: [Review the Software Design to Verify Compliance, 설계 검토]
  PW.4: [Reuse Existing, Well-Secured Software When Feasible, 검증된 소프트웨어 재사용]
  PW.5: [Create Source Code by Adhering to Secure Coding Practices, 시큐어 코딩]
  PW.6: [Configure the Compilation, Interpreter, and Build Processes to Improve Executable Security, 컴파일·빌드 과정 보안 설정]
  PW.7: [Review and/or Analyze Human-Readable Code, 소스 코드 검토·분석]
  PW.8: [Test Executable Code to Identify Vulnerabilities, 실행 코드 보안 시험]
  PW.9: [Configure Software to Have Secure Settings by Default, 안전한 기본 설정]
  RV.1: [Identify and Confirm Vulnerabilities on an Ongoing Basis, 취약점 지속 식별·확인]
  RV.2: [Assess, Prioritize, and Remediate Vulnerabilities, 취약점 평가·우선순위·조치]
  RV.3: [Analyze Vulnerabilities to Identify Their Root Causes, 취약점 근본 원인 분석]

