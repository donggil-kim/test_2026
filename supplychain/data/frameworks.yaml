# 교차 매핑 기준 카탈로그 — ID·명칭만 수록(원문 미수록)
#
# 각 프레임워크는 ID와 공식 명칭(영문)·국문 번역 명칭만 싣는다. 설명 원문은 싣지 않으며,
# 세부위협 문구는 원문을 옮기지 않고 분석가가 새로 작성한다.
# 출처·버전·이용 조건은 meta에 적고, 워크북 '개요'·'평가 기준' 시트에 같은 내용을 고지한다.

meta:
  slsa:
    name: SLSA (Supply-chain Levels for Software Artifacts) — Threats & mitigations
    version: v1.2 (Approved)
    source: https://github.com/slsa-framework/slsa (releases/v1.2, spec/threats.md)
    license: Community Specification License 1.0 — 파생물에 명칭·버전·출처 표기 필요
  owasp_cicd:
    name: OWASP Top 10 CI/CD Security Risks
    version: 2022
    source: https://github.com/OWASP/www-project-top-10-ci-cd-security-risks
    license: CC BY-SA 4.0 — ID·명칭만 인용
  owasp_oss:
    name: OWASP Top 10 Open Source Software Risks
    version: 2023 (v0.1)
    source: https://github.com/OWASP/www-project-open-source-software-top-10
    license: CC BY-SA 4.0 — ID·명칭만 인용
  sap:
    name: SAP Risk Explorer for Software Supply Chains (Ladisa et al., "SoK — Taxonomy of Attacks on Open-Source Software Supply Chains", IEEE S&P 2023)
    version: 저장소 커밋 79e2a39 (2026-05-27)
    source: https://github.com/SAP/risk-explorer-for-software-supply-chains
    license: Apache-2.0 — reference/sap-risk-explorer/ 에 원본 JSON·라이선스 수록
  cncf:
    name: CNCF TAG Security — Catalog of Supply Chain Compromises (침해 유형 정의)
    version: 저장소 기준 2025-12
    source: https://github.com/cncf/tag-security/tree/main/community/catalog/compromises
    license: 문서 CC BY 4.0 — 유형명만 인용, 사례는 원 출처 링크로 사고 DB에 반영
  s2c2f:
    name: OpenSSF Secure Supply Chain Consumption Framework (S2C2F)
    version: 저장소 기준(2024 OpenSSF 이관본)
    source: https://github.com/ossf/s2c2f
    license: Community Specification License 1.0 — 요구사항 ID·제목만 인용
  ssdf:
    name: NIST SP 800-218 Secure Software Development Framework (SSDF) v1.1
    version: 2022-02
    source: https://csrc.nist.gov/pubs/sp/800/218/final
    license: 미국 정부 저작물(공공 영역) — 실천과제(Practice) ID·명칭
  scorecard:
    name: OpenSSF Scorecard checks
    version: 저장소 기준(docs/checks.md, 2026-10)
    source: https://github.com/ossf/scorecard
    license: Apache-2.0 — 점검 항목명만 인용
  nist80053:
    name: NIST SP 800-53 Rev.5 통제명
    version: OSCAL Rev 5.2.0 (2026-05-11)
    source: https://github.com/usnistgov/oscal-content
    license: 미국 정부 저작물(공공 영역)
  attack:
    name: MITRE ATT&CK Enterprise
    version: v19.2
    source: 저장소 루트 enterprise-attack-v19.2.xlsx
    license: © The MITRE Corporation — https://attack.mitre.org/resources/legal-and-branding/terms-of-use/

# SLSA v1.2 위협 모델 — (A)~(I)와 의존성·가용성·검증 위협
slsa:
  A:   [Producer, 생산자 자체의 악의적 변경]
  B1:  [Submit change without review, 리뷰 없는 변경 반영]
  B2:  [Evade change management process, 변경 관리 절차 회피(이력 조작·태그 교체·검사 생략)]
  B3:  [Render code review ineffective, 코드 리뷰 무력화]
  B4:  [Render change metadata ineffective, 변경 메타데이터 위조]
  C:   [Source code management, 소스 관리 플랫폼 침해]
  D:   [External build parameters, 비공식 빌드 입력(포크·브랜치·단계·파라미터)]
  E:   [Build process, 빌드 과정 침해(출처 위조·캐시 오염·비밀 탈취)]
  F:   [Artifact publication, 산출물 게시 단계 변조]
  G:   [Distribution channel, 배포 채널 변조]
  H:   [Package selection, 패키지 선택 오류(의존성 혼동·타이포스쿼팅)]
  I:   [Usage, 부적절한 사용]
  DEP: [Dependency threats, 의존성 위협(취약·악성 의존성, 설치 시점 코드 실행, 변조 빌드 도구)]
  AVL: [Availability threats, 가용성 위협(코드·의존성·산출물 삭제)]
  VER: [Verification threats, 검증 위협(기대값 변조·해시 충돌)]

owasp_cicd:
  CICD-SEC-1:  [Insufficient Flow Control Mechanisms, 흐름 통제 미흡]
  CICD-SEC-2:  [Inadequate Identity and Access Management, 부적절한 ID·접근 관리]
  CICD-SEC-3:  [Dependency Chain Abuse, 의존성 체인 악용]
  CICD-SEC-4:  [Poisoned Pipeline Execution (PPE), 오염된 파이프라인 실행]
  CICD-SEC-5:  [Insufficient PBAC (Pipeline-Based Access Controls), 파이프라인 기반 접근 통제 미흡]
  CICD-SEC-6:  [Insufficient Credential Hygiene, 자격증명 관리 미흡]
  CICD-SEC-7:  [Insecure System Configuration, 시스템 보안 설정 미흡]
  CICD-SEC-8:  [Ungoverned Usage of 3rd Party Services, 서드파티 서비스 무통제 사용]
  CICD-SEC-9:  [Improper Artifact Integrity Validation, 산출물 무결성 검증 미흡]
  CICD-SEC-10: [Insufficient Logging and Visibility, 로깅·가시성 미흡]

owasp_oss:
  OSS-RISK-1:  [Known Vulnerabilities, 알려진 취약점]
  OSS-RISK-2:  [Compromise of Legitimate Package, 정상 패키지 침해]
  OSS-RISK-3:  [Name Confusion Attacks, 이름 혼동 공격]
  OSS-RISK-4:  [Unmaintained Software, 유지보수 중단 소프트웨어]
  OSS-RISK-5:  [Outdated Software, 구버전 소프트웨어]
  OSS-RISK-6:  [Untracked Dependencies, 미추적 의존성]
  OSS-RISK-7:  [License Risk, 라이선스 위험]
  OSS-RISK-8:  [Immature Software, 성숙도 낮은 소프트웨어]
  OSS-RISK-9:  [Unapproved Change, 승인되지 않은 변경]
  OSS-RISK-10: [Under/over-sized Dependency, 과소·과대 의존성]

# CNCF 침해 유형(Type of compromise)
cncf:
  Dev Tooling:               개발 도구 침해
  Negligence:                부주의(이름 혼동 등)
  Publishing Infrastructure: 게시·배포 인프라 침해
  Source Code:               소스 코드 침해
  Trust and Signing:         신뢰·서명 침해
  Malicious Maintainer:      악의적 메인테이너
  Attack Chaining:           연쇄 공격

