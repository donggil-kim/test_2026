# 소프트웨어 공급망 보안사고 DB v1 — 공개 출처 기반(2003~2026)
#
# 필드
#   date          발생(또는 공개) 시점 YYYY-MM — 활동 기간이 길면 시작 시점, 공개 시점은 요약에 적음
#   kind          사고 · 캠페인 · 정부 경보 · 공시 · 사례연구(익명) · 연구·시연 · 위협인텔
#   verification  정부·사법 확인 · 피해기관 확인 · 보안업체·연구기관 분석 · 언론 보도 · 행위자 주장 · 논란·원인 번복
#   ecosystem     공격이 일어난 생태계·경로(scripts/taxonomy_rules.py ECOSYSTEMS)
#   region        피해 지역(글로벌·한국·미국 등) — '한국'은 국내 사례 집계에 사용
#   actor         행위자(공개 귀속, ATT&CK 그룹 ID 병기)
#   impact        결과 유형(scripts/taxonomy_rules.py IMPACTS)
#   summary       경위·결과 요약(분석가 작성, 수치는 출처 기준)
#   sct           매핑 세부위협(분석 매핑) — data/taxonomy.yaml의 Lv3 ID
#   attack_ref    ATT&CK v19.2 캠페인·소프트웨어·그룹 ID(대조·표시용, 자동 매핑에 쓰지 않음)
#   kev           관련 CISA KEV CVE
#   sources       '출처 | URL'
#
# 집계 규칙(scripts/taxonomy_rules.py): 실제 사고 = kind ∈ {사고·캠페인·정부 경보·공시·사례연구(익명)}
#   이면서 verification ∉ {행위자 주장·논란·원인 번복}. 연구·시연(연구자의 실증·노출 발견 포함)은 실증 근거,
#   위협인텔은 실사용 근거(중 상한)로만 반영. 악성 패키지 게시 캠페인은 실제 다운로드가 확인되면 캠페인(실제 사고)으로 본다.

- id: SCI-001
  title: 리눅스 커널 CVS 미러 백도어 삽입 시도
  date: 2003-11
  kind: 사고
  verification: 피해기관 확인
  ecosystem: [오픈소스 프로젝트 인프라]
  region: 글로벌
  actor: 미상
  impact: [영향 없음(사전 차단)]
  summary: >-
    BitKeeper 원본을 복제하던 리눅스 커널 CVS 미러가 침해되어, wait4() 함수의 비교 연산(==)을 대입(=)으로 바꿔
    root 권한을 주는 한 줄짜리 백도어가 변경 이력 없이 들어갔다. 원본 저장소와의 대조에서 발견되어 배포되지 않았다.
  sct: [SCT-SR-03, SCT-SR-01.2]
  sources:
    - LWN(2003) An attempt to backdoor the kernel | https://lwn.net/Articles/57135/

- id: SCI-002
  title: 데비안 프로젝트 서버 침해
  date: 2003-11
  kind: 사고
  verification: 피해기관 확인
  ecosystem: [오픈소스 프로젝트 인프라]
  region: 글로벌
  actor: 미상
  impact: [영향 없음(사전 차단)]
  summary: >-
    스니핑으로 얻은 개발자 계정과 커널 취약점으로 데비안 프로젝트 서버 여러 대가 침해됐다. 패키지 아카이브는 변조되지
    않은 것으로 확인됐으나, 배포 인프라가 공급망 공격 거점이 될 수 있음을 보여 줬다.
  sct: [SCT-PB-04, SCT-SC-03.2]
  sources:
    - Debian(2003) Debian Investigation Report after Server Compromises | https://www.debian.org/News/2003/20031202

- id: SCI-003
  title: WordPress 2.1.1 배포 파일 백도어
  date: 2007-03
  kind: 사고
  verification: 피해기관 확인
  ecosystem: [오픈소스 프로젝트 인프라]
  region: 글로벌
  actor: 미상
  impact: [백도어·원격 제어]
  summary: >-
    WordPress 다운로드 서버가 침해되어 배포 중이던 2.1.1 압축 파일에 원격 코드 실행 백도어가 들어갔다. 며칠 뒤 발견되어
    2.1.2로 교체 배포됐다.
  sct: [SCT-PB-02.1]
  sources:
    - LWN(2007) WordPress 2.1.1 dangerous, Upgrade to 2.1.2 | https://lwn.net/Articles/224997/

- id: SCI-004
  title: 오퍼레이션 오로라(소스 코드 관리 시스템 표적)
  date: 2010-01
  kind: 캠페인
  verification: 피해기관 확인
  ecosystem: [소스 저장소 플랫폼]
  region: 미국
  actor: 중국 연계 APT
  impact: [소스 코드 유출]
  summary: >-
    구글 등 수십 개 기업이 침해된 캠페인으로, 공격자가 소스 코드 관리 시스템(SCM)을 집중적으로 노려 지적 재산과 소스를
    가져갔다. 소스 저장소의 접근 통제·감사가 허술하다는 점이 공급망 위험으로 처음 크게 부각됐다.
  sct: [SCT-SR-03, SCT-IM-03]
  sources:
    - McAfee(2010) Protecting Your Critical Assets — Lessons Learned from Operation Aurora | https://www.wired.com/images_blogs/threatlevel/2010/03/operationaurora_wp_0310_fnl.pdf

- id: SCI-005
  title: ProFTPD 소스 배포 서버 백도어
  date: 2010-11
  kind: 사고
  verification: 피해기관 확인
  ecosystem: [오픈소스 프로젝트 인프라]
  region: 글로벌
  actor: 미상
  impact: [백도어·원격 제어]
  summary: >-
    ProFTPD 프로젝트의 메인 FTP 서버가 취약점으로 침해되어, 1.3.3c 소스 압축 파일이 원격 셸을 여는 백도어 버전으로
    교체됐다. 약 일주일 동안 미러를 통해 배포됐다.
  sct: [SCT-PB-02.1, SCT-PB-04]
  sources:
    - ZDNet(2010) Open-source ProFTPD hacked, backdoor planted in source code | https://www.zdnet.com/article/open-source-proftpd-hacked-backdoor-planted-in-source-code/

- id: SCI-006
  title: kernel.org 인프라 침해
  date: 2011-08
  kind: 사고
  verification: 피해기관 확인
  ecosystem: [오픈소스 프로젝트 인프라]
  region: 글로벌
  actor: 미상
  impact: [영향 없음(사전 차단)]
  summary: >-
    리눅스 커널 저장소를 호스팅하는 kernel.org 서버 여러 대가 루트킷에 감염됐다. Git의 해시 체인 덕분에 소스 변조가
    없음을 검증할 수 있었지만 서비스는 수주간 중단·재구축됐다.
  sct: [SCT-PB-04]
  sources:
    - LWN(2011) The cracking of kernel.org | https://lwn.net/Articles/461237/

- id: SCI-007
  title: 페도라 인프라 침해(기여자 계정 도용)
  date: 2011-01
  kind: 사고
  verification: 피해기관 확인
  ecosystem: [오픈소스 프로젝트 인프라]
  region: 글로벌
  actor: 미상
  impact: [영향 없음(사전 차단)]
  summary: >-
    유출된 기여자 자격증명으로 페도라 인프라에 접근한 사실이 확인됐다. 패키지·소스 변조는 없었으나 계정 하나로 빌드·저장소에
    닿을 수 있다는 점이 드러났다.
  sct: [SCT-SC-03.2, SCT-PB-04]
  sources:
    - Fedora(2011) Security incident on Fedora infrastructure on 23 Jan 2011 | https://lists.fedoraproject.org/pipermail/announce/2011-January/002911.html

- id: SCI-008
  title: Flame 인증서 위조와 Windows Update 위장
  date: 2012-05
  kind: 캠페인
  verification: 피해기관 확인
  ecosystem: [상용 소프트웨어]
  region: 중동
  actor: 국가 배후(미상)
  impact: [백도어·원격 제어]
  summary: >-
    Flame은 MD5 충돌로 마이크로소프트 인증서를 위조하고 내부망에서 Windows Update로 위장한 중간자 배포로 확산됐다.
    마이크로소프트는 해당 인증서를 긴급 폐기했다. 서명 검증 체계의 허점이 업데이트 경로 위장으로 이어진 대표 사례다.
  sct: [SCT-PB-03.2, SCT-PB-02.3]
  attack_ref: [S0143]
  sources:
    - MITRE ATT&CK S0143 Flame | https://attack.mitre.org/software/S0143/

- id: SCI-009
  title: Adobe 빌드 서버 침해로 악성 도구 정식 서명
  date: 2012-09
  kind: 사고
  verification: 피해기관 확인
  ecosystem: [상용 소프트웨어]
  region: 미국
  actor: 미상
  impact: [백도어·원격 제어]
  summary: >-
    공격자가 Adobe 내부 빌드 서버를 침해해 코드 서명 시스템에 악성 도구를 제출, Adobe 정식 인증서로 서명받았다.
    Adobe는 해당 인증서를 폐기했다.
  sct: [SCT-PB-03.1, SCT-BD-02.1]
  sources:
    - Ars Technica(2012) Adobe to revoke crypto key abused to sign malware apps | https://arstechnica.com/information-technology/2012/09/adobe-to-revoke-crypto-key-abused-to-sign-5000-malware-apps/

- id: SCI-010
  title: phpMyAdmin SourceForge 미러 백도어
  date: 2012-09
  kind: 사고
  verification: 피해기관 확인
  ecosystem: [오픈소스 프로젝트 인프라]
  region: 글로벌
  actor: 미상
  impact: [백도어·원격 제어]
  summary: >-
    SourceForge 미러 한 곳에서 백도어가 들어간 phpMyAdmin 배포 파일이 내려받아졌다. 미러 하나만 변조돼도 사용자가
    정상 프로젝트 파일로 믿고 설치한다는 점이 드러났다.
  sct: [SCT-PB-02.1]
  sources:
    - Ars Technica(2012) Questions abound as malicious phpMyAdmin backdoor found on SourceForge site | https://arstechnica.com/information-technology/2012/09/questions-abound-as-malicious-phpmyadmin-backdoor-found-on-sourceforge-site/

- id: SCI-011
  title: 3·20 전산망 대란(패치 관리 서버 악용)
  date: 2013-03
  kind: 사고
  verification: 정부·사법 확인
  ecosystem: [상용 소프트웨어]
  region: 한국
  actor: 북한 정찰총국(정부 발표)
  impact: [파괴·사보타주, 서비스 중단]
  summary: >-
    방송사·금융사 내부의 중앙 패치 관리(업데이트 배포) 서버를 장악해 와이퍼를 일괄 배포, 전산장비 약 4만 8천 대의
    디스크를 파괴했다. 정상 배포 시스템이 전사 동시 파괴 수단이 된 국내 대표 사례다.
  sct: [SCT-CS-02.2, SCT-IM-05]
  attack_ref: [S0041]
  sources:
    - MITRE ATT&CK S0041 Wiper | https://attack.mitre.org/software/S0041/

- id: SCI-012
  title: Dragonfly의 ICS 공급업체 설치 파일 트로이목마화(Havex)
  date: 2014-06
  kind: 캠페인
  verification: 보안업체·연구기관 분석
  ecosystem: [상용 소프트웨어]
  region: 유럽
  actor: Dragonfly(G0035)
  impact: [백도어·원격 제어]
  summary: >-
    산업제어시스템(ICS) 장비 공급업체 세 곳의 웹사이트를 침해해 정상 소프트웨어 설치 파일을 Havex 백도어가 든 파일로
    바꿔치기했다. 이를 내려받은 에너지 기업 제어망이 감염됐다(OT 매트릭스 OTC-IA-07과 연계).
  sct: [SCT-PB-02.1]
  attack_ref: [G0035, S0093]
  sources:
    - Symantec(2014) Dragonfly — Western Energy Companies Under Sabotage Threat | https://community.broadcom.com/symantecenterprise/communities/community-home/librarydocuments/viewdocument?DocumentKey=7382dce7-0260-4782-84cc-890971ed3f17&

- id: SCI-013
  title: XcodeGhost(변조 Xcode로 iOS 앱 감염)
  date: 2015-09
  kind: 사고
  verification: 보안업체·연구기관 분석
  ecosystem: [개발 도구·툴체인]
  region: 글로벌
  actor: 미상
  impact: [백도어·원격 제어, 자격증명·비밀 탈취]
  summary: >-
    공식 경로 대신 비공식 서버에서 받은 변조 Xcode로 빌드한 iOS 앱 수천 개에 정보 수집 코드가 들어가 App Store 심사를
    통과해 배포됐다. 변조 툴체인 하나가 그 도구로 만든 모든 앱을 오염시킨 사례다.
  sct: [SCT-DE-02.2, SCT-IM-01.1]
  sources:
    - MacRumors(2015) What You Need to Know About iOS Malware XcodeGhost | https://www.macrumors.com/2015/09/20/xcodeghost-chinese-malware-faq/

- id: SCI-014
  title: Juniper ScreenOS 무단 코드 삽입
  date: 2015-12
  kind: 사고
  verification: 피해기관 확인
  ecosystem: [상용 소프트웨어]
  region: 글로벌
  actor: 국가 배후(미상)
  impact: [백도어·원격 제어]
  summary: >-
    Juniper가 ScreenOS 소스에서 VPN 트래픽 복호화를 가능하게 하는 난수 생성기 변경과 관리자 인증 우회 코드를 발견했다.
    누가 어떻게 넣었는지 밝혀지지 않아, 소스 관리 체계 자체의 침해 가능성을 보여 줬다.
  sct: [SCT-SR-03]
  sources:
    - Checkoway et al.(2016) A Systematic Analysis of the Juniper Dual EC Incident | https://eprint.iacr.org/2016/376.pdf

- id: SCI-015
  title: Linux Mint ISO 변조
  date: 2016-02
  kind: 사고
  verification: 피해기관 확인
  ecosystem: [오픈소스 프로젝트 인프라]
  region: 글로벌
  actor: 미상
  impact: [백도어·원격 제어]
  summary: >-
    Linux Mint 웹사이트가 침해되어 다운로드 링크가 백도어(Tsunami)가 든 ISO로 바뀌었다. 체크섬 페이지까지 같은 서버에
    있어 사용자가 변조를 알아채기 어려웠다.
  sct: [SCT-PB-02.1]
  sources:
    - Linux Mint(2016) Beware of hacked ISOs if you downloaded Linux Mint on February 20th | https://blog.linuxmint.com/?p=2994

- id: SCI-016
  title: Transmission 설치 파일 변조(KeRanger·Keydnap)
  date: 2016-03
  kind: 사고
  verification: 보안업체·연구기관 분석
  ecosystem: [오픈소스 프로젝트 인프라]
  region: 글로벌
  actor: 미상
  impact: [백도어·원격 제어, 파괴·사보타주]
  summary: >-
    BitTorrent 클라이언트 Transmission의 공식 사이트에서 배포하던 macOS 설치 파일이 2016년 3월(랜섬웨어 KeRanger)과
    8월(Keydnap) 두 차례 교체됐다. 두 번 모두 유효한 애플 개발자 인증서로 서명돼 있었다.
  sct: [SCT-PB-02.1, SCT-PB-03.1]
  sources:
    - Malwarebytes(2016) Transmission hijacked again to spread malware | https://blog.malwarebytes.com/threat-analysis/2016/09/transmission-hijacked-again-to-spread-malware
    - ESET(2016) OSX/Keydnap spreads via signed Transmission application | https://www.welivesecurity.com/2016/08/30/osxkeydnap-spreads-via-signed-transmission-application/

- id: SCI-017
  title: FossHub 설치 파일 교체
  date: 2016-08
  kind: 사고
  verification: 피해기관 확인
  ecosystem: [오픈소스 프로젝트 인프라]
  region: 글로벌
  actor: 미상
  impact: [파괴·사보타주]
  summary: >-
    소프트웨어 배포 사이트 FossHub가 침해되어 Audacity·Classic Shell 설치 파일이 부트 영역(MBR)을 덮어쓰는 악성코드로
    바뀌었다. 몇 시간 만에 복구됐지만 그 사이 내려받은 사용자가 피해를 입었다.
  sct: [SCT-PB-02.1, SCT-IM-05]
  sources:
    - gHacks(2016) Attention, FossHub downloads compromised | https://www.ghacks.net/2016/08/03/attention-fosshub-downloads-compromised/

- id: SCI-018
  title: left-pad 게시 철회로 인한 빌드 중단
  date: 2016-03
  kind: 사고
  verification: 피해기관 확인
  ecosystem: [npm]
  region: 글로벌
  actor: 메인테이너(분쟁에 따른 철회)
  impact: [서비스 중단]
  summary: >-
