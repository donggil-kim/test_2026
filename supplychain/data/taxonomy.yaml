  - 확장 마켓플레이스
  - AI 모델 허브
  - CI/CD 파이프라인
  - 빌드 시스템·러너
  - 비밀·토큰
  - 서명 키·인증서
  - 배포·업데이트 서버
  - CDN·웹 스크립트
  - MSP·원격 관리 도구
  - SaaS 연동
  - 운영 환경

profiles:
  오픈소스: 오픈소스 패키지·레지스트리·확장 생태계(npm·PyPI·RubyGems·crates.io·Go·Maven·NuGet·VS Code·Open VSX 등)
  상용 SW: 상용 소프트웨어 공급자의 빌드·서명·배포·업데이트
  CI/CD: 파이프라인·저장소·러너·비밀 등 DevOps 기반
  AI: AI 라이브러리·모델 허브·MCP 서버·에이전트 스킬·AI 코딩 도구
  서드파티: SaaS 연동·MSP·원격 관리·CDN 스크립트 등 외부 서비스 신뢰 경로

