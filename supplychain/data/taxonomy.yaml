# 통합 소프트웨어 공급망 보안위협 매트릭스 — 분류 체계(원천)
#
# 구조: Lv1 도메인(공급망 단계·공격면) → Lv2 위협분류(SCT-<도메인>-NN) → Lv3 세부위협(SCT-<도메인>-NN.m)
#       하위 세부위협이 하나뿐인 위협분류는 Lv2 = Lv3 (ID에 '.m' 없음)
# ID는 고정 — 항목을 없애도 번호를 다시 매기거나 재사용하지 않음(폐지 시 retired 표시)
#
# Lv3 필드
#   name / en       세부위협명(국문) / 영문명
#   stage           주 공격 단계 — ATT&CK v19.2 전술 국문명(통합 매트릭스 '공격 단계'와 같은 용어)
#   assets          대상 자산(아래 assets 어휘)
#   profiles        적용 프로파일 — 오픈소스 · 상용 SW · CI/CD · AI · 서드파티
#   attack          ATT&CK v19.2 기법 ID
#   slsa            SLSA v1.2 위협(frameworks.yaml slsa 키)
#   cicd / oss      OWASP Top 10 CI/CD Security Risks / OWASP Top 10 OSS Risks
#   sap             SAP Risk Explorer 공격 벡터(AV) — 세부 AV만(최상위 AV-000·AV-001은 쓰지 않음)
#   cncf            CNCF 침해 유형
#   s2c2f / ssdf / scorecard / nist   대응 기준(소비자 요구사항 / 생산자 실천과제 / 점검 항목 / NIST 800-53)
#   cloud / ai / ot 다른 매트릭스 연계 — 통합 AI·클라우드 매트릭스 v1(CL-·AI-), 통합 OT 매트릭스(OTC-)
#   severity        심각도(상·중·하) — 기준은 assessment.severity_rule
#   severity_why    심각도 근거(대표 사례 포함, 사례는 사고 DB에 있어야 함)

assessment:
  severity_rule:
    상: 공격이 성공하면 그 자체로 다수 다운스트림에 악성 코드가 정상 신뢰 경로(게시·서명·업데이트·빌드)로 전달되거나, 공급망 인프라(소스·빌드·서명·배포·CI/CD·비밀)를 장악하거나, 대규모 금전·파괴 피해가 나는 위협
    중: 성공에 사용자의 선택·실수가 필요하거나 피해가 개별 개발자·조직 범위에 머무는 위협, 또는 단독으로는 피해가 없고 다른 위협의 피해를 키우는 조건·은닉 기법
    하: 영향이 제한적·일시적이고 복구가 쉬운 위협
  likelihood_rule: 상 = 실제 사고 2건 이상(AI 매트릭스 v3.2·클라우드 v5·OT와 같은 수식), 중 = 실제 사고 1건 또는 ATT&CK 사례·KEV(공급망)·실증·공격 분류 문헌 중 하나 이상, 하 = 근거 없음

