# [IM] 영향·확산 — 공급망 관점 문구
# 작성 규칙은 DE.yaml 머리말 참고
# 이 도메인은 다른 단계 위협이 만들어 내는 결과·확산 형태를 모은 것이라 사고가 다른 도메인과 중복 집계됨

SCT-IM-01.1:
  oneline: 정상 소프트웨어 경로로 수천~수만 조직에 백도어 동시 설치
  summary: |-
    - 공격자는 침해한 공급자의 정상 소프트웨어·업데이트·관리 도구로 수천~수만 고객 환경에 백도어·랜섬웨어를 동시에 설치하고, 그중 고가치 대상을 골라 후속 침투할 수 있음
    - 고객은 신뢰하는 공급자의 정상 배포를 받았을 뿐이라 탐지와 책임 구분이 어렵고, 영향 범위 파악과 복구에 수개월이 걸림
  reference: |-
    ■ 공급망 관점
    - 성격: 빌드 주입(SCT-BD-02.1)·악성 버전 게시(SCT-PB-01)·업데이트 채널 장악(SCT-PB-02.2)·MSP 도구(SCT-CS-02.1)가 만들어 내는 결과
    - 패턴: 대량 설치 후 소수 표적에만 2단계 실행(SolarWinds·CCleaner·ASUS), 설치 기반 전체를 즉시 파괴·암호화(NotPetya·Kaseya)
    - 다른 매트릭스 연계: 소프트웨어 공급망 침해(CL-IA-05), OT 매트릭스 공급망 침해(OTC-IA-07)
    ■ 실제 사례
    - [실제 사고] SolarWinds Orion 빌드 침해(SUNSPOT·SUNBURST)(2020-12): 고객 약 1만 8천 곳이 악성 업데이트를 설치했고 공격자는 그중 정부기관·IT 기업 일부를 골라 후속 침투 (SCI-052, ATT&CK C0024)
    - [실제 사고] Kaseya VSA 경유 MSP 고객 랜섬웨어(2021-07): MSP 약 30곳을 거쳐 하위 기업 약 1,500곳이 암호화 (SCI-061, CVE-2021-30116)
    - [실제 사고] xz utils 백도어(CVE-2024-3094)(2024-03): 약 2년간 신뢰를 쌓은 메인테이너가 sshd 인증을 우회하는 백도어를 심었고, 일부 배포판 개발·테스트 버전까지 들어갔다가 발견 (SCI-111)
    - [실제 사고] XcodeGhost(변조 Xcode로 iOS 앱 감염)(2015-09): 변조 개발 도구로 빌드한 iOS 앱 수천 개가 App Store 심사를 통과해 배포 (SCI-013)
  detect: |-
    ■ 탐지
    - 공급자 침해 공지·위협 정보와 자산 인벤토리(SBOM·설치 소프트웨어 목록)를 대조해 영향 시스템을 즉시 식별
    - 공급자 소프트웨어 프로세스의 평소와 다른 외부 통신·자식 프로세스·권한 사용을 EDR·네트워크 감시로 탐지
    ■ 대응
    - 소프트웨어·구성요소 인벤토리를 상시 유지하고(S2C2F INV-1), 격리·버전 롤백·자격증명 교체 순서를 담은 공급망 사고 대응 계획을 미리 마련(INV-2)
    - 고권한 서드파티 소프트웨어는 네트워크 송신을 필요한 목적지로 제한하고 권한을 최소화

SCT-IM-01.2:
  oneline: 한 침해에서 빼낸 비밀로 다음 공급자를 침해하는 연쇄 확산
  summary: |-
    - 공격자는 한 공급망 침해에서 얻은 토큰·소스·단말 접근을 재료로 다른 프로젝트·공급자를 잇달아 침해해 피해를 기하급수로 넓힐 수 있음
    - 침해 원점과 경로가 여러 조직에 걸쳐 추적이 어렵고, 피해 조직이 교체를 늦추거나 빠뜨리면 같은 공격자가 다시 들어옴
  reference: |-
    ■ 공급망 관점
    - 성격: 비밀 수집(SCT-SC-02.1)·교체 누락(SCT-SC-02.3)이 다음 침해로 이어지는 확산 형태
    - 패턴: CI 토큰 → 다른 액션·스캐너 침해 → 그 사용자의 게시 토큰 → 패키지·확장 침해 → 개발자 단말 → 플랫폼 내부 저장소(2026 TeamPCP 연쇄)
    - 대응 관점: 사고 하나를 수습으로 끝내지 말고 노출된 비밀 전체 교체와 하위 사용자 통지까지 대응 범위에 넣어야 함
    ■ 실제 사례
    - [실제 사고] 3CX 데스크톱 앱 이중 공급망 침해(X_TRADER 경유)(2023-03): 트로이목마화된 X_TRADER로 감염된 직원 단말이 3CX 빌드 환경 장악으로 이어진, 공급망 침해가 다른 공급망 침해를 낳은 첫 공개 사례 (SCI-090, ATT&CK C0057)
    - [실제 사고] hackerbot-claw(2026-02): Trivy 저장소에서 빼낸 쓰기 토큰이 TeamPCP 연쇄 침해의 출발점이 됨 (SCI-152)
    - [실제 사고] LiteLLM PyPI 악성 버전(2026-03): Trivy 침해 때 빼낸 PyPI 게시 토큰으로 다른 프로젝트에 악성 버전을 게시 (SCI-155, ATT&CK G1056)
    - [실제 사고] GitHub 내부 저장소 유출(2026-05): TanStack 사고 여파로 게시 자격이 넘어간 Nx Console 확장이 설치된 직원 단말에서 플랫폼 사업자의 내부 저장소 유출이 시작 (SCI-164, SCI-163)
    - [실제 사고] Yandex 소스 유출 후 내부 패키지명 선점(2023-01): 유출된 내부 소스에 있던 패키지명으로 공개 npm 패키지가 게시되어 소스 유출이 의존성 혼동의 재료가 됨 (SCI-103)
  detect: |-
    ■ 탐지
    - 침해 공지에 나온 공격자 지표(토큰 사용 IP·악성 커밋·패키지 버전)를 자사 저장소·레지스트리·CI 로그에서 즉시 검색
    - 다른 조직 사고로 자사 비밀이 노출됐을 가능성(침해된 액션·도구의 사용 이력)을 의존성·액션 인벤토리로 역추적
    ■ 대응
    - 사용 중인 액션·도구·패키지가 침해되면 해당 기간에 노출될 수 있었던 비밀을 모두 교체하고, 교체 완료를 사용 기록으로 확인
    - 하위 사용자·고객에게 영향 버전과 조치를 신속히 통지하고(NIST IR-4·SR-6), 업계 정보 공유 채널로 지표를 공유

SCT-IM-02:
  oneline: 감염 환경의 게시 토큰으로 자신을 재게시하는 공급망 웜 확산
  summary: |-
    - 공격자는 감염 환경에서 게시 토큰·자격증명을 찾아 그 계정의 다른 패키지·확장에 자기 자신을 다시 게시하는 코드를 넣어, 사람 개입 없이 수백 개 패키지로 퍼지게 할 수 있음
    - 확산 속도가 사람의 대응보다 빠르고 감염 계정마다 정상 게시 주체라 차단 기준을 세우기 어려우며, 일부 변종은 파괴 기능까지 갖춤
  reference: |-
    ■ 공급망 관점
    - 대상: 게시 권한이 있는 개발자 단말과 CI 러너, npm·Open VSX 같은 레지스트리·마켓플레이스
    - 전파 고리: 설치 시점 실행(SCT-DP-03.2) → 비밀 수집(SCT-SC-02.1) → 게시 토큰으로 재게시(SCT-SC-02.2·SCT-PB-01) → 반복, 탈취 정보는 피해자 계정의 공개 저장소에 올림
    - AI 매트릭스 연계: 다중 에이전트 연쇄 전파(AI-06-07)
    ■ 실제 사례
    - [실제 사고] Shai-Hulud 1차(npm 자가 전파 웜)(2025-09): 감염 환경에서 npm 토큰을 찾으면 그 계정의 다른 패키지에 자신을 재게시해 수백 개 패키지로 번짐 (SCI-147, ATT&CK S9008)
    - [실제 사고] Shai-Hulud 2차(설치 전 실행·파괴 기능 추가)(2025-11): GitHub 저장소 2만 5천 개 이상에 탈취 정보를 올리고, 자격증명을 찾지 못하면 홈 디렉터리를 지움 (SCI-150)
    - [실제 사고] GlassWorm(보이지 않는 문자로 숨긴 확장 웜)(2025-10): 탈취한 GitHub·npm·Open VSX 자격증명으로 다른 확장에 자신을 퍼뜨림 (SCI-149, ATT&CK S9010)
    - [실제 사고] ChainDrop(Mini Shai-Hulud 계열 npm 웜, keyv·cacheable)(2026-08): 러너 메모리의 게시 토큰까지 빼내 다른 메인테이너의 패키지로 재게시하며 수백 개 패키지로 번짐 (SCI-166)
    - [실제 사고] Octopus Scanner(NetBeans 프로젝트 감염 악성코드)(2020-05): 프로젝트 빌드 파일에 자신을 심어 그 프로젝트를 빌드하는 다른 개발자에게 퍼짐 (SCI-049)
  detect: |-
    ■ 탐지
    - 같은 계정·조직에서 짧은 시간에 여러 패키지가 연속 게시되거나 게시물에 같은 설치 스크립트·파일이 새로 붙으면 레지스트리·내부 피드에서 경보
    - 개발 단말·러너에서 사용자 작업 없이 게시 명령이 실행되거나 공개 저장소가 새로 생기면 탐지
    ■ 대응
    - 장기 게시 토큰을 없애고 신뢰 게시(OIDC)·게시 시 2FA 확인으로만 허용해, 감염 단말에서 빼낸 토큰만으로는 재게시할 수 없게 함(릴리스 작업 안의 OIDC 토큰은 SCT-SC-02.2 대응으로 보호)
    - 웜 확산이 공지되면 신규 버전 도입을 일시 중지(숙성 기간)하고 차단 목록(S2C2F ING-3)·악성코드 점검(SCA-4)을 즉시 반영

SCT-IM-03:
  oneline: 개발 환경의 비밀·소스 코드를 대량 반출해 후속 침해 재료로 사용
  summary: |-
    - 공격자는 악성 패키지·침해된 도구·탈취 계정·연동 토큰으로 개발 환경의 비밀·소스 코드·저장소를 대량으로 빼내 후속 침해·갈취·취약점 발굴에 쓸 수 있음
    - 반출된 비밀은 교체 전까지 계속 유효하고 소스는 회수할 수 없어 피해가 장기화되며, 탈취 정보를 공개 저장소에 올려 2차 악용까지 일어남
  reference: |-
    ■ 공급망 관점
    - 성격: 거의 모든 공급망 공격의 1차 목표라 다른 도메인과 가장 많이 중복 집계됨
    - 반출 경로: 공격자 서버 대신 GitHub 저장소·피해자 계정의 공개 저장소를 써서 신뢰 도메인 통신으로 탐지를 피함, AI CLI에 비밀 탐색을 시킴
    - 다른 매트릭스 연계: 코드 저장소 데이터 수집(CL-CO-03), 저장된 자격증명·비밀정보 수집(CL-CA-05)
    ■ 실제 사례
    - [실제 사고] s1ngularity(Nx 빌드 도구 악성 버전·AI CLI 악용)(2025-08): 피해 단말의 AI CLI로 비밀을 찾게 해 피해자 계정 공개 저장소로 올렸고, 유출 토큰으로 비공개 저장소 5,500개 이상이 공개로 바뀜 (SCI-143)
    - [실제 사고] GhostAction(탈취 계정으로 악성 워크플로 대량 커밋)(2025-09): 저장소 817개에 반출 워크플로를 심어 비밀 3,325건을 빼냄 (SCI-145)
    - [실제 사고] LastPass 개발 환경·DevOps 엔지니어 단말 침해(2022-08): 개발 환경에서 소스를 가져간 뒤 엔지니어 개인 PC에서 얻은 자격증명으로 고객 금고 백업까지 빼냄 (SCI-079)
    - [실제 사고] GitHub 내부 저장소 유출(직원 단말의 악성 확장 경유)(2026-05): 직원 단말에서 시작된 침해로 내부 저장소가 유출됐고 공격자는 약 3,800개를 빼냈다고 주장 (SCI-164)
    - [실제 사고] Salesloft Drift OAuth 토큰 탈취(Salesforce 데이터 대량 반출)(2025-08): 700곳 이상 조직의 데이터를 반출하며 그 안의 AWS 키·Snowflake 토큰을 노림 (SCI-144)
  detect: |-
    ■ 탐지
    - 저장소 대량 복제·비공개→공개 전환·새 공개 저장소 생성, 비정상 시간대 API 대량 조회를 SCM·SaaS 감사 로그로 탐지
    - 개발 단말·러너에서 비밀 파일 접근 뒤 외부(github.com 포함) 업로드가 이어지면 EDR·프록시 로그로 상관 분석
    ■ 대응
    - 비밀은 단기·최소 권한으로 발급하고 소스에 비밀을 두지 않아, 반출돼도 피해가 제한되게 함
    - 대량 복제·가시성 변경에 승인·알림을 걸고, 유출 시 비밀 일괄 교체와 소스 속 하드코딩 비밀 점검을 함께 수행

SCT-IM-04:
  oneline: 지갑 주소 바꿔치기·서명 조작·채굴기로 직접 금전 피해
  summary: |-
    - 공격자는 공급망으로 배포한 코드로 지갑 주소·거래 서명을 바꿔치기하거나 지갑 시드·개인 키를 빼내고, 감염 시스템에 채굴기를 심어 직접 금전 이익을 얻을 수 있음
    - 암호자산 거래는 승인 즉시 되돌릴 수 없고, 특정 지갑·거래소·서명자만 노리도록 표적화하면 일반 사용자 화면에서는 이상이 보이지 않음
  reference: |-
    ■ 공급망 관점
    - 대상: 지갑 SDK·연결 라이브러리, 거래소·지갑 웹 앱 스크립트, 지갑 설치 파일, 클라우드·CI 연산 자원(채굴)
    - 수법: 웹 양식·클립보드의 주소 바꿔치기, 서명 화면 위조, 시드·개인 키 반출, 설치 스크립트로 채굴기 실행
    - 다른 매트릭스 연계: 금전 탈취 및 갈취(CL-IM-05), 컴퓨팅 자원 탈취(크립토재킹)(CL-IM-06)
    ■ 실제 사례
    - [실제 사고] Bybit 해킹(Safe{Wallet} 개발자 단말·지갑 UI 스크립트 변조)(2025-02): 서명자가 정상 거래로 보이는 화면에서 승인해 약 15억 달러 상당 암호자산이 빠져나감 (SCI-132, ATT&CK G0032)
    - [실제 사고] Retool 직원 SMS 피싱 경유 클라우드 고객 침해(2023-08): 장악된 고객 계정 중 암호화폐 고객 한 곳에서 약 1,500만 달러가 탈취 (SCI-104)
    - [실제 사고] Ledger Connect Kit 악성 버전(전 직원 계정 피싱)(2023-12): 지갑 탈취 코드가 탈중앙 금융 서비스 화면에 실려 약 60만 달러가 빠져나감 (SCI-096)
    - [실제 사고] Ultralytics PyPI 침해(Actions 캐시 오염·PR 스크립트 주입)(2024-12): 릴리스 단계에서 채굴기가 든 버전이 PyPI에 게시 (SCI-119)
    - [실제 사고] Docker Hub 백도어 이미지 17종(2018-06): 채굴기·리버스 셸이 든 이미지가 500만 회 이상 내려받아진 뒤 삭제 (SCI-037)
  detect: |-
    ■ 탐지
    - 지갑·결제 화면 스크립트의 변경과 지갑 주소 치환 코드를 점검하고, 클립보드·양식 값을 바꾸는 행위를 탐지
    - CI 러너·서버·컨테이너의 지속적인 CPU 사용 급증과 채굴 풀 접속을 탐지
    ■ 대응
    - 대규모 출금·서명은 화면과 독립된 경로(하드웨어 지갑 화면·별도 검증 서버)로 거래 내용을 확인하고, 다중 서명자는 서로 다른 환경에서 검증
    - 지갑 관련 의존성은 버전 고정·출처 검증을 거쳐 도입하고, 러너·컨테이너에 자원 사용 상한과 외부 송신 제한을 적용

SCT-IM-05:
  oneline: 공급망으로 동시에 퍼진 와이퍼·삭제·사보타주로 전사 업무 중단
  summary: |-
    - 공격자나 악의적 메인테이너는 공급망 경로로 와이퍼·랜섬웨어·삭제 코드를 퍼뜨리거나 패키지·저장소를 지우고 망가뜨려, 이를 쓰는 조직의 업무·빌드를 동시에 멈출 수 있음
    - 동시에 퍼진 파괴는 복구에 수주가 걸리고, 메인테이너 본인의 사보타주·게시 철회처럼 공격이 아닌 경로로도 같은 가용성 피해가 남
  reference: |-
    ■ 공급망 관점
    - 성격: 업데이트 채널(SCT-PB-02.2)·내부 배포 서버(SCT-CS-02.2)·MSP 도구(SCT-CS-02.1)·악의적 메인테이너(SCT-SR-01.4)가 만들어 내는 가용성 결과
    - 변형: 자격증명을 찾지 못하면 홈 디렉터리 삭제(웜), AI 코딩 도우미에 삭제 지시 주입, 지역(IP) 조건부 파일 덮어쓰기, 저장소 이력 삭제 후 몸값 요구
    - 클라우드 매트릭스 연계: 데이터 암호화(랜섬웨어)(CL-IM-01)
    ■ 실제 사례
    - [실제 사고] NotPetya(M.E.Doc 업데이트 경유 와이퍼)(2017-06): 업데이트로 배포된 와이퍼가 다국적 기업으로 번져 해운·물류·제약 등에서 막대한 업무 중단 (SCI-019, ATT&CK G0034·S0368)
    - [실제 사고] 3·20 전산망 대란(패치 관리 서버 악용)(2013-03): 패치 관리 서버로 와이퍼를 일괄 배포해 전산장비 약 4만 8천 대의 디스크를 파괴 (SCI-011, ATT&CK S0041)
    - [실제 사고] Jenkins 취약점 경유 인도 결제망 랜섬웨어(CVE-2024-23897)(2024-07): 협력사 시스템 랜섬웨어로 은행 수백 곳의 결제가 중단 (SCI-130, CVE-2024-23897)
    - [실제 사고] colors·faker 메인테이너 사보타주(2022-01): 메인테이너가 무한 루프를 넣어 버전 범위로 최신판을 받은 애플리케이션이 즉시 멈춤 (SCI-071)
    - [실제 사고] Amazon Q Developer 확장에 삭제 지시 주입(2025-07): 로컬 파일·AWS 자원 삭제 프롬프트가 공식 배포됐고 형식 오류로 실행되지는 않음 (SCI-140)
  detect: |-
    ■ 탐지
    - 배포·업데이트 직후 다수 단말의 동시 파일 삭제·디스크 쓰기·백업 삭제 징후를 EDR로 탐지
    - 의존성 신규 버전의 파괴적 코드(삭제 명령·지역 조건 분기)와 게시 철회·저장소 삭제 이벤트를 모니터링
    ■ 대응
    - 오프라인·불변 백업과 단계적 배포(일부 단말 먼저 적용)로 동시 파괴를 막고, 복구 훈련을 정기 수행
    - 빌드에 필요한 의존성·소스를 내부 저장소에 미러링해 상류 삭제·철회에도 빌드가 유지되게 함(S2C2F ING-2·ING-4)
