# [PB] 게시·배포 — 공급망 관점 문구
# 작성 규칙은 DE.yaml 머리말 참고

SCT-PB-01:
  oneline: 탈취한 게시 권한으로 정상 패키지·확장에 악성 버전 게시
  summary: |-
    - 공격자는 메인테이너 계정·게시 토큰·CI 게시 경로를 장악해, 사용자가 이미 신뢰하는 패키지·확장의 새 버전으로 악성 코드를 배포할 수 있음
    - 자동 업데이트·버전 범위로 수 시간 안에 수많은 개발·운영 환경에 설치되고, 짧게 노출돼도 내려받은 곳마다 비밀 탈취·후속 침해가 남음
  reference: |-
    ■ 공급망 관점
    - 대상: npm·PyPI·RubyGems 인기 패키지, 공식 SDK·CLI, IDE·브라우저 확장, 보안 도구 릴리스
    - 경로: 피싱(SCT-SC-03.1)·재사용 비밀번호(SCT-SC-03.2)·게시 토큰 탈취(SCT-SC-02.2)·메인테이너 인계(SCT-SR-01.3)·CI 게시 경로 악용(SCT-BD-01.1)
    - 수법 변화: 코드는 그대로 두고 가짜 의존성 하나만 추가, 설치 시점 실행(SCT-DP-03.2), 노출 시간은 수십 분~수 시간으로 짧아짐
    - 다른 매트릭스 연계: 소프트웨어 공급망 침해(CL-IA-05), 악성 패키지 유입 및 네임스페이스 악용(AI-08-02)
    ■ 실제 사례
    - [실제 사고] chalk·debug 등 18개 패키지 탈취(2025-09): 주간 20억 회 이상 내려받는 패키지에 지갑 거래 가로채기 코드가 실렸다가 약 2시간 만에 복구 (SCI-146)
    - [실제 사고] axios 메인테이너 계정 탈취(2026-03): 주간 8천만 회 이상 내려받는 axios 1.14.1·0.30.4에 가짜 의존성만 추가해 원격 제어 악성코드를 내림 (SCI-158)
    - [실제 사고] TanStack 침해(2026-05): 신뢰 게시로 패키지 42개에 악성 버전 84개를 올렸고 몇 시간 안에 다른 메인테이너로 번짐 (SCI-162, CVE-2026-45321)
    - [실제 사고] Nx Console 확장 악성 버전(2026-05): 정상 CI/CD를 거치지 않은 18.95.0이 VS Code 마켓플레이스와 Open VSX에 수십 분 게시 (SCI-163, CVE-2026-48027)
    - [공개 취약점] KEV '악성 코드 내장' 등재 4건: TanStack·Nx Console·Trivy CVE-2026-33634·eslint-config-prettier CVE-2025-54313 — 악성 버전도 패치 관리 대상으로 다뤄짐
  detect: |-
    ■ 탐지
    - 의존성·확장 신규 버전을 도입 전에 악성 행위(설치 스크립트 신설·난독화·외부 연결)로 분석하고, 악성 패키지 정보(OSV 등)와 상시 대조
    - 게시 메타데이터(소스 태그·출처 증명 유무·게시 경로)가 이전 버전과 달라지면 경보
    ■ 대응
    - 신규 버전은 일정 기간 숙성 후 도입하고, 승인된 내부 피드·차단 목록으로 유입을 통제(S2C2F ENF-2·ING-3)
    - 게시자는 신뢰 게시·출처 증명을 적용하고(Scorecard Signed-Releases·Packaging), 소비자는 출처 증명을 검증(S2C2F AUD-1)

SCT-PB-02.1:
  oneline: 공식 다운로드 사이트·미러 침해로 설치 파일을 악성 버전으로 교체
  summary: |-
    - 공격자는 공식 웹사이트·다운로드 서버·미러를 침해해 설치 파일·압축 파일·설치 스크립트를 악성 버전으로 바꿔, 공식 경로로 내려받는 사용자를 감염시킬 수 있음
    - 체크섬 페이지까지 같은 서버에서 바뀌거나 유효한 인증서로 서명돼 있어 사용자가 알아채기 어렵고, 발견까지 며칠~수개월 노출됨
  reference: |-
    ■ 공급망 관점
    - 대상: 제작사 공식 사이트·다운로드 서버, 오픈소스 배포 미러, 업무용 필수 보안 프로그램 배포 페이지, CI에서 내려받는 설치 스크립트
    - 수법: 웹 서버 침해 후 파일 교체, 미러 한 곳만 변조, 체크섬 페이지 동시 변조, 탈취 인증서로 서명(SCT-PB-03.1)
    - OT 매트릭스 연계: ICS 공급업체 설치 파일 트로이목마화는 공급망 침해(OTC-IA-07)와 연결
    ■ 실제 사례
    - [실제 사고] DAEMON Tools Lite 정식 서명 설치 파일 트로이목마화(2026-04): 공식 사이트 설치 파일이 개발사 인증서로 서명된 채 백도어를 품고 배포 (SCI-161, CVE-2026-8398)
    - [실제 사고] JAVS Viewer 설치 파일 백도어(CVE-2024-4978)(2024-05): 공식 사이트 설치 파일이 평소와 다른 회사 명의 인증서로 서명된 채 백도어를 포함 (SCI-113, CVE-2024-4978)
    - [실제 사고] Codecov Bash Uploader 변조(2021-01): 노출된 자격증명으로 배포 스크립트를 바꿔 고객 CI 환경변수를 약 두 달간 외부로 보냈고, 해시를 대조한 고객이 발견 (SCI-055)
    - [실제 사고] Kimsuky 보안 프로그램 설치 파일 위장(TrollAgent)(2024-01): 협회 웹사이트를 침해해 로그인 전 설치하는 보안 프로그램과 함께 국내 방산업체 인증서로 서명된 정보탈취 악성코드를 설치 (SCI-114, ATT&CK G0094)
    - [실제 사고] Dragonfly의 ICS 공급업체 설치 파일 트로이목마화(Havex)(2014-06): ICS 장비 공급업체 세 곳의 설치 파일을 바꿔 에너지 기업 제어망을 감염 (SCI-012, ATT&CK G0035·S0093)
  detect: |-
    ■ 탐지
    - 내려받은 설치 파일의 해시·서명자를 제작사가 별도 경로(서명된 해시 목록·출처 증명)로 공개한 값과 대조하고, 서명자가 평소와 다르면 차단
    - 배포 서버의 파일 변경을 무결성 감시로 탐지하고, 공식 사이트 파일을 정기적으로 내려받아 기준 해시와 비교
    ■ 대응
    - 배포자는 서명·체크섬을 배포 서버와 분리된 경로로 공개하고 서명 키를 HSM에 보관하며, 미러는 서명 검증 후에만 동기화
    - 기업은 설치 파일을 승인된 내부 저장소에서만 배포하고, CI에서 외부 스크립트를 실행할 때 해시를 고정

SCT-PB-02.2:
  oneline: 업데이트 서버·채널 장악으로 자동 업데이트에 악성코드 배포
  summary: |-
    - 공격자는 제품의 업데이트 서버·배포 체계를 장악해 자동 업데이트로 백도어·와이퍼를 내려보내, 설치 기반 전체 또는 골라낸 표적만 감염시킬 수 있음
    - 업데이트는 사람 확인 없이 높은 권한으로 설치되고, 정식 서명까지 붙으면 보안 제품도 정상으로 판단함
  reference: |-
    ■ 공급망 관점
    - 대상: 상용 소프트웨어 업데이트 서버, 회계·ERP·원격 지원 같은 국가·업종 특화 소프트웨어, 기관 내부에 둔 업데이트 서버
    - 수법: 업데이트 서버 장악·업데이트 파일 교체, 특정 MAC 주소·조직에서만 2단계 실행(표적화), 무결성 검증 없는 업데이터 악용
    - 연계: 전송 경로 가로채기(SCT-PB-02.3), 서명 키 악용(SCT-PB-03.1), 파괴(SCT-IM-05) / OT 매트릭스 공급망 침해(OTC-IA-07)
    ■ 실제 사례
    - [실제 사고] NotPetya(M.E.Doc 업데이트 경유 와이퍼)(2017-06): 회계 소프트웨어 업데이트 서버를 장악해 와이퍼를 배포했고 다국적 기업으로 번져 대규모 업무 중단 (SCI-019, ATT&CK G0034·S0368)
    - [실제 사고] ASUS ShadowHammer(Live Update 경유 표적 백도어)(2019-03): 정식 인증서로 서명된 백도어가 업데이트로 배포됐고 실제 공격은 미리 정한 약 600개 MAC 주소 장비에만 실행 (SCI-039, CVE-2025-59374)
    - [실제 사고] Andariel 국내 ERP 업데이트 서버 악용(Xctdoor)(2024-05): 업데이트 서버를 장악해 방산·제조 기업 시스템에 백도어를 설치 (SCI-116)
    - [실제 사고] TrueConf 업데이트 채널 악용(Operation TrueChaos)(2026-03): 무결성 검증 없이 업데이트를 받는 결함을 노려 장악한 서버에서 정부기관 단말에 원격 제어 도구를 설치 (SCI-159, CVE-2026-3502)
  detect: |-
    ■ 탐지
    - 업데이트 프로세스가 내려받는 파일의 서명자·해시를 기준과 대조하고, 업데이트 직후 새 네트워크 연결·자식 프로세스를 EDR로 탐지
    - 업데이트 서버의 파일 변경·관리자 접속과 배포 대상 목록 변경을 감사
    ■ 대응
    - 제작사는 업데이트 서명 키를 업데이트 서버와 분리하고, 클라이언트가 서명·버전(롤백 방지)을 검증하도록 설계(TUF 같은 업데이트 보안 체계)
    - 기업은 업데이트를 내부 검증 후 단계적으로 배포하고, 중요 시스템은 자동 업데이트 대신 승인 배포로 운영

SCT-PB-02.3:
  oneline: DNS·중간자·도메인 장악으로 업데이트·스크립트 전송 경로 가로채기
  summary: |-
    - 공격자는 ISP·호스팅·DNS·배포 도메인을 장악하거나 내부망 중간자 위치를 잡아, 정상 업데이트·패키지·웹 스크립트 요청을 악성 서버로 돌릴 수 있음
    - 제작사 서버가 멀쩡해도 전송 구간에서 바뀌어 서명을 검증하지 않는 클라이언트는 그대로 설치하고, 도메인 인수·만료처럼 합법적 경로로도 장악됨
  reference: |-
    ■ 공급망 관점
    - 대상: 서명·TLS 검증 없이 업데이트를 받는 클라이언트, 외부 도메인에서 불러오는 웹 스크립트·SDK, 패키지 미러 주소
    - 수법: ISP의 DNS 응답 조작, 호스팅 업체 수준 침해로 업데이트 트래픽 가로채기, 도메인·등록 계정 인수, 가짜 미러 도메인
    - 연계: 무결성 검증 없는 수용(SCT-CS-01), 서드파티 웹 스크립트 변조(SCT-CS-03.2)
    ■ 실제 사례
    - [실제 사고] StormBamboo ISP 장악으로 소프트웨어 업데이트 가로채기(2024-08): DNS 응답을 조작해 서명·암호화 없이 업데이트를 받는 여러 소프트웨어에 악성코드를 설치 (SCI-118)
    - [실제 사고] Notepad++ 업데이트 경로 가로채기(Lotus Blossom)(2025-06): 호스팅 업체 수준 침해로 업데이트 트래픽을 가로채, 서명 검증을 하지 않던 업데이터가 표적에게 악성 설치 파일을 실행 (SCI-151, CVE-2025-15556)
    - [실제 사고] Polyfill.io 도메인 인수 후 악성 스크립트 배포(2024-06): 도메인을 인수한 업체가 CDN 스크립트를 바꿔 10만 개 이상 사이트에 영향 (SCI-112)
    - [실제 사고] Andariel 국내 VPN 업데이트 통신 조작(DoraRAT)(2024-04): 업데이트 통신을 조작해 악성 파일을 정상 업데이트로 위장 배포 (SCI-115)
  detect: |-
    ■ 탐지
    - 업데이트·패키지 요청이 공식 도메인이 아닌 IP·인증서로 연결되거나 DNS 응답이 평소와 다르면 경보
    - 외부 도메인 스크립트의 내용 변경과 도메인 소유자·등록 정보 변경을 모니터링
    ■ 대응
    - 업데이트·패키지는 TLS와 별도로 서명을 검증하고, 웹 스크립트는 자체 호스팅하거나 하위 자원 무결성(SRI)으로 해시를 강제
    - 배포 도메인 등록 계정에 MFA·도메인 잠금을 적용하고, 버려진 도메인 참조를 제거

SCT-PB-03.1:
  oneline: 탈취한 코드 서명 키·인증서로 악성코드를 정상 제품처럼 서명
  summary: |-
    - 공격자는 공급사의 코드 서명 키·인증서를 탈취하거나 서명 시스템에 악성 파일을 제출해, 악성코드를 정상 제품처럼 서명할 수 있음
    - 서명은 보안 제품·운영체제 신뢰 판단의 기준이라 탐지를 피하고, 유출된 키는 폐기 전까지(펌웨어 키는 사실상 장기간) 악용됨
  reference: |-
    ■ 공급망 관점
    - 대상: 공급사 코드 서명 인증서·서명 서버, 펌웨어·부트 서명 키, 패키지 서명 GPG 키
    - 수법: 빌드 서버를 거쳐 서명 시스템에 악성 파일 제출, 서명 키 파일 반출, 탈취한 국내 기업 인증서를 다른 조직 공격에 재사용
    - 연계: 빌드 주입(SCT-BD-02.1), 설치 파일 교체(SCT-PB-02.1), 업데이트 채널(SCT-PB-02.2) / 클라우드 매트릭스 인증 자료 위조(CL-CA-04)
    ■ 실제 사례
    - [실제 사고] Adobe 빌드 서버 침해로 악성 도구 정식 서명(2012-09): 빌드 서버를 침해해 코드 서명 시스템에 악성 도구를 제출하고 Adobe 정식 인증서로 서명받음 (SCI-009)
    - [실제 사고] MSI 펌웨어·Intel BootGuard 서명 키 유출(2023-05): 랜섬웨어 조직이 펌웨어 서명 키(57개 제품)·BootGuard 서명 키(116개 제품)를 공개해 폐기가 어려운 장기 위험을 남김 (SCI-094)
    - [실제 사고] 국내 공공기관 대상 서명된 위장 설치 파일(Endoor)(2024-03): 국내 기업의 유효한 인증서로 서명한 위장 설치 파일로 백도어를 설치해 보안 제품 탐지를 피함 (SCI-117, ATT&CK G0094)
    - [실제 사고] DAEMON Tools Lite 정식 서명 설치 파일 트로이목마화(2026-04): 개발사 인증서로 서명된 설치 파일이 백도어를 품고 공식 사이트에서 배포 (SCI-161, CVE-2026-8398)
  detect: |-
    ■ 탐지
    - 서명 요청을 빌드 출처 증명·릴리스 일정과 대조해 출처 없는 서명을 경보하고, 서명 이력(투명성 로그)을 정기 감사
    - 자사 인증서로 서명된 파일이 외부에서 악성으로 보고되는지 위협 정보로 모니터링
    ■ 대응
    - 서명 키는 HSM·KMS에 두어 반출을 막고, 서명은 승인된 빌드 파이프라인에서만 요청하도록 제한
    - 키 유출 시 즉시 폐기·재발급하고 영향 버전을 공지하며, 키리스 서명·투명성 로그(Sigstore 등)로 서명 사실을 공개 검증할 수 있게 함

SCT-PB-03.2:
  oneline: 서명·출처 검증 미적용·허점을 노려 위조 산출물을 정상으로 통과
  summary: |-
    - 공격자는 소비자가 서명·출처 증명을 검증하지 않거나 검증 기준이 느슨한 점(서명자·빌드 주체 미확인, 약한 해시)을 노려, 위조·변조한 산출물을 정상으로 통과시킬 수 있음
    - 서명·출처 증명을 만들기만 하고 검증하지 않는 경우가 많아 통제가 있어도 효과가 없고, 허점은 사고 뒤에야 드러남
  reference: |-
    ■ 공급망 관점
    - 대상: 서명은 있지만 소비자가 검증하지 않는 패키지·이미지·업데이트, 서명자 신원 대신 '서명 존재'만 보는 검증 정책, 약한 해시 기반 인증서
    - 수법: 해시 충돌로 인증서 위조, 다른 저장소·워크플로가 만든 출처 증명 재사용, 검증 정책의 와일드카드·누락 악용
    - SLSA 검증 위협(VER), 출처·SBOM 검증(S2C2F AUD-1·AUD-4)
    ■ 실제 사례
    - [실제 사고] Flame 인증서 위조와 Windows Update 위장(2012-05): MD5 충돌로 마이크로소프트 인증서를 위조하고 내부망에서 Windows Update로 위장한 중간자 배포로 확산 (SCI-008, ATT&CK S0143)
    - 참고: 출처 증명 검증 우회는 실제 공격보다 설정 결함 보고가 대부분이며, 서명 키를 탈취해 정상 서명을 받은 사례는 SCT-PB-03.1에서 다룸
  detect: |-
    ■ 탐지
    - 배포·실행 단계(어드미션 컨트롤러·패키지 설치·업데이트)의 서명·출처 검증 결과를 기록하고, 검증 실패·검증 생략 배포를 집계
    - 서명자 신원·빌드 주체·소스 저장소가 기대값과 다른 산출물을 경보
    ■ 대응
    - 서명 '존재'가 아니라 서명자 신원·빌드 플랫폼·소스 저장소를 정책으로 지정해 검증하고(SLSA 검증 절차), 실패하면 배포 차단
    - SBOM·출처 증명에도 서명하고(S2C2F REB-4), 검증 정책 변경은 리뷰를 거침

SCT-PB-04:
  oneline: 레지스트리·아티팩트 저장소 침해·결함으로 생태계 패키지 일괄 변조
  summary: |-
    - 공격자는 공개 레지스트리·프로젝트 배포 인프라·사내 아티팩트 저장소를 침해하거나 권한 검증 결함을 이용해, 저장된 패키지·산출물을 바꾸거나 남의 패키지를 덮어쓸 수 있음
    - 레지스트리 하나가 생태계 전체나 조직의 모든 빌드에 산출물을 공급해 영향 범위가 가장 넓고, 사내 저장소는 외부 노출·패치 지연이 흔함
  reference: |-
    ■ 공급망 관점
    - 대상: 공개 레지스트리(npm·PyPI·Packagist·RubyGems), 오픈소스 프로젝트 배포·소스 서버, 사내 아티팩트 저장소(Nexus·Artifactory)
    - 수법: 서버 취약점·도용 계정으로 인프라 침해, 권한 검증 결함으로 타인 패키지 덮어쓰기, 노출된 사내 저장소 취약점 악용
    - 대응 관점: 레지스트리 침해는 소비자 쪽 해시 고정·서명 검증(SCT-CS-01)으로만 막을 수 있음
    ■ 실제 사례
    - [실제 사고] PEAR 웹사이트 침해(go-pear.phar 교체)(2019-01): 공식 사이트의 설치 도구가 리버스 셸을 여는 버전으로 약 6개월간 바뀌어 있었음 (SCI-038)
    - [실제 사고] kernel.org 인프라 침해(2011-08): 서버 여러 대가 루트킷에 감염됐으나 Git 해시 체인 덕분에 소스 무변조를 검증 (SCI-006)
    - [실증] Composer(Packagist) 명령 주입 결함(2021-04): 레지스트리 서버를 장악해 모든 PHP 패키지를 바꿀 수 있었음이 보고됨 (SCI-069)
    - [실증] RubyGems 타인 패키지 덮어쓰기 결함(CVE-2022-29176)(2022-05): 조건이 맞으면 남의 gem을 내리고 같은 이름으로 다시 올릴 수 있었음 (SCI-076)
    - [공개 취약점] 아티팩트 저장소 KEV 등재 6건: Sonatype Nexus CVE-2019-7238·CVE-2020-10199, JFrog Artifactory CVE-2026-42016 등 4건
  detect: |-
    ■ 탐지
    - 사내 아티팩트 저장소의 인터넷 노출·버전을 점검해 KEV 등재 취약점을 최우선 경보하고, 관리자·배포 권한 변경과 대량 삭제·덮어쓰기를 감사
    - 저장된 산출물의 해시를 빌드 때 기록한 값과 정기 대조
    ■ 대응
    - 사내 저장소는 내부망에 두고 익명 접근을 막으며, 게시와 소비 권한을 분리하고 같은 버전 덮어쓰기를 금지
    - 외부 패키지는 사내 저장소를 거쳐 들여오고(S2C2F ING-2) 잠금 파일 해시로 다시 검증해 상류 레지스트리 침해의 영향을 줄임
