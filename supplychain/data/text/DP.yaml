# [DP] 의존성 — 공급망 관점 문구 (작성 규칙은 DE.yaml 머리말)

SCT-DP-01.1:
  oneline: 인기 패키지와 비슷한 이름의 악성 패키지로 설치 실수 유도
  summary: |-
    - 공격자는 인기 패키지 이름의 오타·단어 순서·구분자·접두어를 바꾼 악성 패키지를 레지스트리에 올려, 개발자·빌드가 잘못 입력한 이름으로 설치하게 만들 수 있음
    - 이름 등록에 제한이 거의 없어 자동화로 대량 게시되고, 설치 즉시 실행되는 스크립트로 비밀·지갑을 빼낸 뒤 삭제돼 흔적이 짧음
  reference: |-
    ■ 공급망 관점
    - 대상: npm·PyPI·RubyGems 등 공개 레지스트리 이용 개발자·CI, 표준 모듈과 같은 이름을 기대하는 언어(Python 등)
    - 수법: 오타(타이포스쿼팅)·조합어(콤보스쿼팅)·구분자 변경·내장 모듈명 사칭(SAP AV-201~205·207), 설치 스크립트 실행(SCT-DP-03.2)
    - 규모: OSV 악성 패키지 보고 약 23.9만 건(npm 22.2만·PyPI 1.2만, 2026-10 기준) 중 상당수가 이름 혼동·독자 악성 패키지 — 2025년 npm 급증분은 토큰 보상용 스팸 포함('악성 패키지 현황' 시트)
    ■ 실제 사례
    - [실제 사고] PyPI 타이포스쿼팅 패키지 10종(슬로바키아 CSIRT)(2017-09): 표준 모듈명을 흉내 낸 패키지가 수개월간 설치되며 호스트 정보를 전송 (SCI-025)
    - [실제 사고] PyPI jeIlyfish 타이포스쿼팅(SSH·GPG 키 탈취)(2019-12): l을 대문자 I로 바꾼 이름으로 약 1년간 SSH·GPG 키를 빼냄 (SCI-046)
    - [실제 사고] PyPI 타이포스쿼팅 451종(크롬 확장 설치로 암호화폐 탈취)(2023-02): 브라우저 확장을 몰래 설치해 지갑 주소를 바꿔치기 (SCI-102)
    - [실제 사고] IconBurst npm 타이포스쿼팅(웹 양식 데이터 탈취)(2022-07): 이를 넣은 웹사이트·앱의 최종 사용자 입력이 유출됨 (SCI-085)
  detect: |-
    ■ 탐지
    - 신규 의존성 추가 PR에서 인기 패키지와의 이름 유사도·신규 게시일·적은 다운로드·설치 스크립트 유무를 자동 점검
    - 악성 패키지 정보(OSV MAL·레지스트리 권고)를 의존성 검사와 사내 미러에 연동
    ■ 대응
    - 사내 미러·선별 피드만 쓰게 하고(S2C2F ENF-2·ING-1) 신규 패키지 도입은 승인 절차를 거침
    - 조직·스코프 네임스페이스와 잠금 파일을 쓰고, 개발·CI 환경에서 설치 스크립트 실행을 기본 차단

SCT-DP-01.2:
  oneline: 공식 조직·SDK·저장소를 사칭한 패키지로 신뢰를 가로챔
  summary: |-
    - 공격자는 공식 조직·SDK·도구의 이름과 README·저장소를 그대로 흉내 내거나 인기 저장소를 복제해 악성 버전을 퍼뜨려, 정상 제품을 찾는 개발자가 내려받게 만들 수 있음
    - 공식처럼 보이는 설명·다운로드 수·별 개수까지 꾸며 신뢰를 얻고, MCP 서버처럼 고권한 도구를 사칭하면 피해가 크게 늘어남
  reference: |-
    ■ 공급망 관점
    - 대상: 공식 SDK(클라우드·결제·통신 API), 인기 라이브러리의 '경량판·확장판', GitHub 인기 저장소, MCP 서버·에이전트 도구
    - 수법: 브랜드 사칭(SAP AV-206), 네임스페이스 생략·변경(AV-208), 저장소 복제 후 대량 게시·홍보, 이미지·파일에 페이로드 은닉
    - AI 매트릭스 연계: 악성 에이전트 도구 유통·사칭(AI-08-05)
    ■ 실제 사례
    - [실제 사고] GitHub 저장소 혼동 캠페인(감염 저장소 10만 개 이상)(2024-02): 인기 저장소를 복제해 악성 코드를 넣고 같은 이름으로 대량 게시 (SCI-127)
    - [실제 사고] postmark-mcp(공식 MCP 서버 사칭, 메일 숨은 참조 탈취)(2025-09): 공식 MCP 서버와 같은 이름으로 신뢰를 얻은 뒤 발송 메일 전량을 빼돌림 (SCI-148)
    - [실제 사고] mathjs-min(정상 라이브러리 복제·악성화)(2023-03): mathjs를 복제해 'min' 판처럼 꾸미고 토큰 탈취 코드를 숨김 (SCI-107)
    - [실제 사고] twilio-npm 브랜드 사칭 패키지(2020-10): 공식 패키지처럼 보이는 이름으로 설치 시 리버스 셸을 엶 (SCI-050)
  detect: |-
    ■ 탐지
    - 의존성의 게시자·저장소 URL·조직이 공식 출처와 일치하는지 검사하고, 공식 조직 밖에서 게시된 '공식' 이름을 경보
    - 저장소 복제본은 별·포크 수보다 원본 대비 커밋 이력·생성일을 비교해 판별
    ■ 대응
    - 공식 게시자 검증(인증 배지·출처 증명)이 된 패키지만 허용하고 사내 승인 목록으로 관리(S2C2F AUD-1)
    - 자사 브랜드·제품명은 주요 레지스트리에 선점 등록하고 사칭 패키지 신고 절차를 운영

SCT-DP-01.3:
  oneline: AI가 지어낸 패키지명을 먼저 등록해 AI 추천 설치를 가로챔
  summary: |-
    - 공격자는 AI 코딩 도구가 반복해서 만들어 내는 존재하지 않는 패키지명을 먼저 등록해 두고, 개발자·에이전트가 AI 추천대로 설치하게 만들 수 있음
    - 에이전트가 사람 확인 없이 설치까지 수행하면 곧바로 실행되며, 환각 이름은 예측·대량 수집이 가능해 공격 준비 비용이 낮음
  reference: |-
    ■ 공급망 관점
    - 대상: AI 코딩 도우미·자율 에이전트가 제안·설치하는 의존성, AI가 쓴 설치 안내(README)
    - 수법: 같은 질문에 반복되는 환각 이름 수집 → 레지스트리 선점 → 정상처럼 보이는 패키지로 대기(SAP AV-209)
    - AI 매트릭스 연계: 악성 패키지 유입 및 네임스페이스 악용(AI-08-02)
    ■ 실제 사례
    - [실증] huggingface-cli 환각 패키지 실험(Lasso)(2024-03): 연구자가 AI가 지어낸 이름을 무해한 패키지로 등록하자 3개월간 3만 회 이상 설치되고 Alibaba README 안내에까지 실림 (SCI-129)
    - [실증] ChatGPT 패키지 추천 환각 연구(2023-06): LLM이 존재하지 않는 패키지를 반복 추천하며 선점 공격이 가능함을 보임 (SCI-108)
  detect: |-
    ■ 탐지
    - AI 도구·에이전트가 추가한 의존성은 게시일·다운로드·게시자 이력을 자동 점검해 '최근 생성·저사용' 패키지를 경보
    - 에이전트의 패키지 설치 명령을 로그로 남기고 허용 목록 밖 설치를 차단
    ■ 대응
    - 에이전트의 패키지 설치는 사내 미러·허용 목록으로만 가능하게 하고 신규 의존성은 사람이 승인
    - AI가 생성한 설치 안내·코드의 의존성 이름을 공식 문서로 확인하는 리뷰 규칙을 둠

SCT-DP-02.1:
  oneline: 내부 패키지명을 공개 레지스트리에 선점해 내부 빌드에서 실행
  summary: |-
    - 공격자는 유출·추측한 내부 패키지명을 공개 레지스트리에 더 높은 버전으로 올려, 패키지 관리자가 내부 저장소 대신 공개 패키지를 받도록 만들 수 있음
    - 사람의 실수 없이 해석 규칙만으로 내부 개발·빌드 환경에서 자동 실행되며, 정상 이름이라 리뷰·의존성 목록에서 눈에 띄지 않음
  reference: |-
    ■ 공급망 관점
    - 대상: 내부 저장소와 공개 레지스트리를 함께 조회하는 npm·pip·gem 설정, 스코프가 없는 내부 패키지
    - 단서: 공개 저장소·소스 유출·JS 번들·오류 메시지에 노출된 내부 패키지명(SAP AV-509 의존성 해석 악용)
    - 연계: 소스 유출(SCT-IM-03)이 의존성 혼동의 재료가 됨(SCT-IM-01.2)
    ■ 실제 사례
    - [실제 사고] PyTorch 야간 빌드 의존성 혼동(torchtriton)(2022-12): 전용 인덱스와 같은 이름을 PyPI에 올려 야간 빌드 설치자의 SSH 키 등 정보가 유출됨 (SCI-081)
    - [실제 사고] Yandex 소스 유출 후 내부 패키지명 선점(2023-01): 유출 소스의 내부 패키지명으로 공개 npm 패키지가 게시됨 (SCI-103)
    - [실제 사고] 내부 패키지명을 노린 npm 패키지 400여 종(Azure·Uber 등)(2022-03): 기업 내부 이름·스코프를 흉내 내 설치 환경 정보를 수집 (SCI-087)
    - [실증] 의존성 혼동 연구(내부 패키지명 선점 실증)(2021-02): 공개 레지스트리에 같은 이름을 올리자 35개 이상 기업 내부에서 코드가 실행됨 (SCI-056)
  detect: |-
    ■ 탐지
    - 내부 패키지명과 같은 이름이 공개 레지스트리에 등록되면 경보(이름 감시)하고, 빌드 로그에서 내부 이름의 공개 출처 설치를 탐지
    - 잠금 파일의 레지스트리 URL·무결성 해시 변경을 PR에서 검사
    ■ 대응
    - 내부 패키지는 조직 스코프·네임스페이스를 쓰고 패키지 소스 매핑·단일 업스트림 피드로 해석 경로를 고정(S2C2F ENF-1)
    - 내부 이름은 공개 레지스트리에 선점 등록하고, 버전 고정·잠금 파일로 상위 버전 자동 선택을 막음

SCT-DP-02.2:
  oneline: 삭제·만료된 이름·버킷을 재등록해 기존 참조를 가로챔
  summary: |-
    - 공격자는 삭제·이름 변경된 패키지·저장소, 만료된 도메인, 비워진 클라우드 버킷을 다시 등록해 이를 참조하던 설치 스크립트·의존성에 악성 파일을 내려보낼 수 있음
    - 코드 변경 없이 외부 참조만 가로채 소스 리뷰로 보이지 않으며, 주로 방치된 구성요소에서 성립해 늦게 발견됨
  reference: |-
    ■ 공급망 관점
    - 대상: 바이너리를 외부 URL·버킷에서 받는 패키지, 이름이 바뀐 GitHub 계정·저장소(리포재킹), 관리자 없는 패키지
    - 수법: 끊어진 참조 재점유(SAP AV-501), 만료 도메인 재등록(AV-608), 고아 패키지 인수
    - 연계: 만료 도메인으로 계정 복구(SCT-SC-03.3), 패키지 게시 철회로 인한 가용성 훼손(SCT-IM-05)
    ■ 실제 사례
    - [실제 사고] bignum 방치 S3 버킷 재점유(2023-06): 삭제된 바이너리 저장 버킷을 같은 이름으로 다시 만들어 자격증명 탈취 바이너리를 배포 (SCI-099)
    - [실제 사고] AUR 방치 패키지 인수 후 악성화(acroread)(2018-07): 관리자 없는 패키지를 인수해 설치 스크립트에 정보 전송 코드를 넣음 (SCI-031)
    - [실제 사고] left-pad 게시 철회로 인한 빌드 중단(2016-03): 패키지 철회로 빌드가 실패했고 이름 재등록 위험이 부각되어 npm이 철회 정책을 바꿈 (SCI-018)
  detect: |-
    ■ 탐지
    - 의존성의 외부 다운로드 URL·버킷·저장소 경로를 인벤토리로 관리하고 소유자 변경·도메인 만료를 감시
    - 설치 시 외부 바이너리 해시를 이전 값과 대조해 변경을 탐지
    ■ 대응
    - 설치 중 외부 다운로드를 금지하거나 해시 고정으로 제한하고, 외부 자원은 사내 저장소로 옮김
    - 지원 종료·방치 구성요소를 점검(S2C2F SCA-3)해 대체하거나 사내 포크로 관리

SCT-DP-03.1:
  oneline: 쓸모 있어 보이는 가짜 유틸리티·SDK 패키지로 정보탈취
  summary: |-
    - 공격자는 기존 패키지와 무관한 그럴듯한 유틸리티·SDK·컨테이너 이미지를 새로 올리고 홍보해, 개발자가 직접 설치하게 만들 수 있음
    - 레지스트리 감시로 수일 안에 지워지는 경우가 많지만 계정·이름을 바꿔 끝없이 다시 올라오고, 국가 배후 조직이 개발자 표적 공격에 꾸준히 씀
  reference: |-
    ■ 공급망 관점
    - 대상: npm·PyPI·Docker Hub·에이전트 스킬 저장소 이용 개발자, 특히 암호화폐·핀테크 개발자
    - 수법: 독자 악성 패키지 개발·홍보(SAP AV-100), 가짜 채용 과제 연계(SCT-DE-01.2), GitHub 저장소를 탈취 데이터 보관소로 이용
    - 규모: OSV 악성 패키지 보고 약 23.9만 건의 대부분이 이 유형과 이름 혼동(SCT-DP-01.1)
    ■ 실제 사례
    - [실제 사고] Contagious Interview(2023-11): 가짜 채용 과제와 악성 npm 패키지로 개발자 단말에 정보탈취 악성코드를 감염시킴 (SCI-110, ATT&CK G1052)
    - [실제 사고] ClawHub 악성 에이전트 스킬(ClawHavoc)(2026-02): 악성 스킬 수백 개가 가짜 사전 설치 단계로 정보탈취 악성코드를 설치 (SCI-167)
    - [실제 사고] Docker Hub 백도어 이미지 17종(2018-06): 채굴기·리버스 셸이 든 이미지가 500만 회 이상 내려받아짐 (SCI-037)
    - [실제 사고] W4SP 스틸러 PyPI 캠페인(2022-11): 다형성 정보탈취 악성코드를 품은 패키지 수십 종으로 수백 명이 피해 (SCI-086)
  detect: |-
    ■ 탐지
    - 신규 도입 패키지·이미지의 게시자 이력·게시일·다운로드 추이·설치 동작(네트워크·파일 접근)을 샌드박스 분석으로 점검
    - 악성 패키지 정보 피드(OSV MAL·레지스트리 권고)로 이미 설치된 패키지를 소급 점검
    ■ 대응
    - 선별 피드·차단 목록·악성코드 점검(S2C2F ENF-2·ING-3·SCA-4)을 거친 패키지만 쓰게 함
    - 외부 코드·이미지 시험 실행은 격리 환경에서만 하고 개발 단말에는 운영 자격증명을 두지 않음

SCT-DP-03.2:
  oneline: 설치·로드 순간 자동 실행되는 스크립트로 개발·CI 장악
  summary: |-
    - 공격자는 설치 전후 스크립트(preinstall·postinstall)·setup.py·빌드 훅·.pth 파일·import 시점 코드에 페이로드를 넣어, 패키지를 쓰기도 전에 개발자·CI 권한으로 실행할 수 있음
    - 단독으로는 피해가 없지만 악성·침해 패키지가 설치되는 순간 비밀 수집·웜 전파가 시작되게 만드는 핵심 조건으로, 최근 대형 사고의 확산 속도를 결정함
  reference: |-
    ■ 공급망 관점
    - 대상: npm 생명주기 스크립트, Python setup.py·.pth·import 시점 코드, Rust build.rs, 확장 활성화 코드
    - 변형: 가짜 의존성 하나만 추가해 그 설치 스크립트로 실행(코드 변경 최소화), 별도 런타임을 내려받아 난독화 페이로드 실행
    - 연계: 정상 패키지 악성 버전(SCT-PB-01)·자가 전파 웜(SCT-IM-02)의 실행 단계
    ■ 실제 사례
    - [실제 사고] Shai-Hulud 2차(설치 전 실행·파괴 기능 추가)(2025-11): 설치 전 단계에서 실행되어 비밀을 수집하고 재게시하며 수백 개 패키지로 번짐 (SCI-150)
    - [실제 사고] LiteLLM PyPI 악성 버전(탈취 게시 토큰·.pth 자동 실행)(2026-03): 파이썬 프로세스가 시작될 때마다 실행되는 방식으로 클라우드 토큰·SSH 키를 수집 (SCI-155)
    - [실제 사고] axios 메인테이너 계정 탈취(가짜 의존성으로 원격 제어 악성코드)(2026-03): 코드는 그대로 두고 가짜 의존성 하나만 추가해 설치 시 원격 제어 악성코드를 내림 (SCI-158)
    - [실제 사고] eslint-config-prettier 등 메인테이너 피싱 계정 탈취(2025-07): 설치 스크립트가 Windows에서 악성 DLL을 실행 (SCI-139, CVE-2025-54313)
  detect: |-
    ■ 탐지
    - CI·개발 환경에서 패키지 설치 중 발생하는 네트워크 연결·셸 실행·자격증명 파일 접근을 런타임 감시로 탐지
    - 의존성 갱신 시 생명주기 스크립트·.pth 파일이 새로 생기거나 바뀌면 PR에서 경보
    ■ 대응
    - 설치 스크립트 실행을 기본 차단(--ignore-scripts·허용 목록)하고 필요한 패키지만 예외 승인
    - 의존성 설치 단계를 비밀이 없는 격리 작업으로 분리하고, 네트워크 송신을 허용 목록으로 제한

SCT-DP-04:
  oneline: 알려진 취약점이 있는 내장 구성요소로 제품·서비스가 대량 침해
  summary: |-
    - 공격자는 제품·서비스가 내장한 오픈소스 라이브러리의 공개 취약점을 노려, 그 구성요소를 쓰는 모든 시스템을 동시에 공격할 수 있음
    - 전이 의존성·번들 사본으로 깊이 들어 있어 사용 여부부터 파악하기 어렵고, SBOM·인벤토리가 없으면 패치까지 수주가 걸림
  reference: |-
    ■ 공급망 관점
    - 대상: 로깅·웹 프레임워크·XML·이미지 처리 라이브러리처럼 여러 제품에 내장되는 구성요소, 지원 종료(EOL) 버전
    - 범위: 구버전 사용(OSS-RISK-5)·미추적 의존성(OSS-RISK-6)·유지보수 중단(OSS-RISK-4)을 함께 다룸
    - 클라우드 매트릭스 연계: 공개 애플리케이션 취약점 악용(CL-IA-01)
    ■ 실제 사례
    - [실제 사고] Log4Shell(Log4j 원격 코드 실행)(2021-12): 공개 직후 대량 악용됐고, 전이 의존성으로 들어 있어 영향 범위 파악에만 수주가 걸림 (SCI-067, CVE-2021-44228)
    - [실제 사고] 구버전 xmlsec 내장 ManageEngine 취약점 대량 악용(CVE-2022-47966)(2023-01): 오래된 Apache Santuario를 그대로 쓴 제품 다수가 원격 코드 실행에 노출 (SCI-105, CVE-2022-47966)
    - [공개 취약점] 오픈소스 구성요소 KEV 등재 16건: Spring Framework CVE-2022-22965, Apache Struts CVE-2017-5638, libwebp CVE-2023-4863, jQuery CVE-2020-11023 등
  detect: |-
    ■ 탐지
    - 빌드마다 SBOM을 만들어 취약점 DB(OSV·KEV)와 상시 대조하고, KEV 등재 구성요소는 최우선 경보
    - 운영 환경에서 실제 로드되는 라이브러리 버전을 수집해 SBOM과 차이를 점검
    ■ 대응
    - 구성요소 인벤토리·SBOM과 오픈소스 사고 대응 계획을 갖추고(S2C2F INV-1·INV-2), 자동 업데이트 도구로 패치 지연을 줄임
    - 지원 종료 구성요소를 교체하고, 상류 수정이 늦으면 자체 수정 후 상류 기여(S2C2F FIX-1)

SCT-DP-05:
  oneline: 버전 범위·변경 가능한 태그·최신 CDN 경로로 악성 버전 자동 수용
  summary: |-
    - 공격자는 상류 패키지·액션·스크립트를 침해한 순간, 버전 범위·태그·최신 경로로 참조하는 모든 소비자에게 검토 없이 악성 버전을 배포할 수 있음
    - 단독으로는 피해가 없지만 상류 침해의 확산 범위와 속도를 결정하며, 고정하지 않은 참조는 사고 뒤 어떤 버전이 실행됐는지 추적도 어렵게 함
  reference: |-
    ■ 공급망 관점
    - 대상: ^·~ 버전 범위와 잠금 파일 없는 설치, GitHub Actions 태그 참조, unpkg·jsDelivr 등 CDN의 '최신' 경로, latest 컨테이너 태그
    - 대응 관점: 해시 고정은 상류 태그 이동(SCT-SR-02.2)·악성 버전 게시(SCT-PB-01)를 무력화하는 가장 싼 통제
    - SLSA (H)·(I), OWASP CICD-SEC-3·8, OSS-RISK-9(승인되지 않은 변경)
    ■ 실제 사례
    - [실제 사고] tj-actions/changed-files·reviewdog 액션 연쇄 침해(2025-03): 태그로 참조하던 약 2만 3천 개 저장소가 다음 실행에서 곧바로 악성 커밋을 받음 (SCI-133)
    - [실제 사고] Lottie Player 악성 버전(CDN 최신 버전 자동 적용)(2024-10): 버전을 고정하지 않고 CDN 최신판을 불러오던 사이트에 지갑 연결 유도 코드가 즉시 적용됨 (SCI-122)
    - [실제 사고] Ledger Connect Kit 악성 버전(2023-12): CDN으로 최신 버전을 불러오던 탈중앙 금융 서비스 화면에 지갑 탈취 코드가 실림 (SCI-096)
    - [실제 사고] colors·faker 메인테이너 사보타주(2022-01): 버전 범위로 최신판을 자동 수용한 프로젝트가 즉시 멈춤 (SCI-071)
  detect: |-
    ■ 탐지
    - 저장소의 액션·의존성·이미지·스크립트 참조 중 해시 고정이 안 된 항목을 점검(Scorecard Pinned-Dependencies)
    - 고정 해시가 가리키는 대상과 상류 태그가 달라지면 경보해 상류 변경을 인지
    ■ 대응
    - 잠금 파일·전체 커밋 해시·이미지 다이제스트로 고정하고, 갱신은 자동 업데이트 도구의 PR로 검토 후 반영
    - 웹 스크립트는 자체 호스팅하거나 하위 자원 무결성(SRI)으로 해시를 강제

SCT-DP-06:
  oneline: 모델 허브의 악성 직렬화 모델로 불러오는 순간 코드 실행
  summary: |-
    - 공격자는 모델 허브에 악성 코드가 든 직렬화(pickle 등) 모델·데이터셋을 올려, 이를 불러오는 개발·운영 환경에서 코드를 실행할 수 있음
    - 모델 파일은 코드로 인식되지 않아 일반 악성코드 점검을 피하고, 허브 스캐너도 압축 방식 변경 같은 단순 회피로 우회됨
  reference: |-
    ■ 공급망 관점
    - 대상: Hugging Face 등 모델 허브, 모델을 내려받아 로딩하는 학습·추론 파이프라인과 개발 단말
    - 수법: 직렬화 형식의 임의 코드 실행, 스캐너 회피용 압축·파일 손상, 유명 모델·조직 이름 사칭(SCT-DP-01.2)
    - AI 매트릭스 연계: 변조 모델·데이터셋 유입(AI-08-01), 악성 모델·파일 로딩 시 코드 실행(AI-06-05) — 등급 기준이 달라 AI 매트릭스와 위험도가 다를 수 있음
    ■ 실제 사례
    - [실증] nullifAI(Hugging Face 탐지 회피형 악성 모델)(2025-02): 7z로 압축한 '깨진' pickle로 스캐너를 피한 모델 2개에 리버스 셸이 들어 있었음 (SCI-135)
  detect: |-
    ■ 탐지
    - 모델 파일 도입 시 직렬화 형식·압축 방식·로딩 시 실행 코드를 전용 스캐너로 점검하고 출처(조직·서명)를 확인
    - 모델 로딩 프로세스의 네트워크 연결·셸 실행을 감시
    ■ 대응
    - 실행 코드가 없는 안전한 형식(safetensors 등)만 허용하고 승인된 모델 저장소에서만 로딩
    - 모델 로딩·변환은 격리 환경에서 수행하고 운영 자격증명과 분리
