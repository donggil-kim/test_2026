# [CS] 소비·서드파티 연계 — 공급망 관점 문구
# 작성 규칙은 DE.yaml 머리말 참고

SCT-CS-01:
  oneline: 해시·서명·출처 검증 없이 산출물·업데이트를 받아 변조를 그대로 실행
  summary: |-
    - 공격자는 소비자가 내려받은 스크립트·패키지·업데이트의 해시·서명·출처를 검증하지 않는 점을 노려, 상류나 전송 구간에서 바꾼 산출물을 그대로 실행시킬 수 있음
    - 단독으로는 피해가 없지만 상류 변조를 소비 단계에서 걸러낼 마지막 기회를 놓치게 하며, 내려받아 바로 실행하는 스크립트·자동 업데이트처럼 검증 없는 관행이 넓게 퍼져 있음
  reference: |-
    ■ 공급망 관점
    - 대상: CI에서 내려받아 바로 실행하는 설치·업로드 스크립트, 무결성 검증 없는 업데이터, 해시 고정 없는 의존성·이미지
    - 연계: 다운로드 사이트 교체(SCT-PB-02.1)·업데이트 채널 장악(SCT-PB-02.2)·전송 경로 가로채기(SCT-PB-02.3)가 성공하는 조건
    - SLSA 사용 위협(I)·검증 위협(VER), OWASP CICD-SEC-9
    ■ 실제 사례
    - [실제 사고] Codecov Bash Uploader 변조(2021-01): 변조된 업로더 스크립트로 약 두 달간 고객 CI 환경변수가 외부로 나갔고, 내려받은 스크립트의 해시를 대조한 고객 한 곳이 변조를 발견 (SCI-055)
    - [실제 사고] StormBamboo ISP 장악으로 소프트웨어 업데이트 가로채기(2024-08): 서명·암호화 없이 업데이트를 받는 소프트웨어들이 조작된 DNS 응답에 따라 악성코드를 설치 (SCI-118)
    - [실제 사고] Notepad++ 업데이트 경로 가로채기(Lotus Blossom)(2025-06): 서명 검증을 하지 않던 업데이터가 가로챈 트래픽의 악성 설치 파일을 실행 (SCI-151, CVE-2025-15556)
    - [공개 취약점] 업데이트 무결성 검증 결함 KEV 등재 2건: Notepad++ CVE-2025-15556, TrueConf CVE-2026-3502
  detect: |-
    ■ 탐지
    - CI·배포 스크립트에서 외부 스크립트를 내려받아 바로 실행하는 패턴과 해시 고정이 없는 의존성·이미지 참조를 점검(Scorecard Pinned-Dependencies)
    - 설치·업데이트 단계의 서명 검증 실패·생략을 기록하고 집계
    ■ 대응
    - 외부 스크립트·바이너리는 해시·서명을 검증한 뒤 실행하고, 가능하면 내부 저장소에 검증본을 두고 사용
    - 패키지·이미지는 잠금 파일·다이제스트로 고정하고, 서명·출처 증명 검증을 배포 정책으로 강제(S2C2F AUD-1~AUD-4)

SCT-CS-02.1:
  oneline: MSP·원격 관리 도구 장악으로 고객사 전 단말에 랜섬웨어 배포
  summary: |-
    - 공격자는 MSP가 운영하는 원격 관리(RMM) 서버·계정을 취약점·탈취 자격증명으로 장악해, 관리 기능으로 고객사 단말 전체에 랜섬웨어·원격 제어 도구를 배포할 수 있음
    - RMM은 고객사 전 단말에서 관리자 권한으로 코드를 실행하도록 설계돼 공급자 한 곳의 침해가 다수 고객사 동시 피해로 번지고, 정상 관리 행위와 구분하기 어려움
  reference: |-
    ■ 공급망 관점
    - 대상: MSP·IT 위탁 운영사의 RMM 서버(Kaseya VSA·ConnectWise ScreenConnect·SimpleHelp·N-able N-central), 원격 지원 계정
    - 수법: 인터넷에 노출된 RMM 서버 취약점 악용, 업데이트·스크립트 배포 기능으로 랜섬웨어 일괄 실행, 관리 도구로 데이터 반출
    - 연계: 다운스트림 대량 침해(SCT-IM-01.1), 파괴(SCT-IM-05) / 클라우드 매트릭스 신뢰 관계(MSP·SaaS 연동) 악용(CL-IA-06)
    ■ 실제 사례
    - [실제 사고] Kaseya VSA 경유 MSP 고객 랜섬웨어(2021-07): REvil이 VSA 제로데이로 서버를 장악해 가짜 업데이트로 랜섬웨어를 배포했고, 직접 피해 고객 중 약 30곳이 MSP여서 하위 기업 약 1,500곳이 암호화 (SCI-061, CVE-2021-30116)
    - [실제 사고] SimpleHelp RMM 경유 MSP 고객 랜섬웨어(DragonForce)(2025-05): MSP가 운영하던 SimpleHelp 취약점을 연쇄 악용해 고객사 단말에 랜섬웨어를 배포하고 데이터를 빼냄 (SCI-138, CVE-2024-57727)
    - [공개 취약점] RMM 도구 KEV 등재 16건: Kaseya VSA 3건, ConnectWise ScreenConnect 4건(CVE-2024-1709 등), SimpleHelp 4건, N-able N-central 5건
  detect: |-
    ■ 탐지
    - RMM 서버의 신규 관리자·API 키 생성, 다수 고객 단말 대상 스크립트·패키지 일괄 배포, 업무 시간 외 대량 작업을 감사 로그로 탐지
    - 고객사는 MSP 도구가 실행하는 프로세스(보안 기능 중지·백업 삭제·대량 암호화 징후)를 EDR로 감시
    ■ 대응
    - RMM 서버는 인터넷 직접 노출을 피하고 KEV 등재 취약점을 최우선 패치하며, 관리 계정에 피싱 저항 MFA를 적용
    - 고객사는 MSP 접근 범위·시간을 계약으로 제한하고(NIST SA-9·AC-17), 대량 배포에 고객 승인 절차를 두며 오프라인 백업을 유지

SCT-CS-02.2:
  oneline: 내부 배포·패치 관리 서버 장악으로 전사 단말에 악성코드 일괄 배포
  summary: |-
    - 공격자는 조직 내부의 소프트웨어 배포·패치 관리·구성 관리 서버를 장악해, 정상 배포 기능으로 전사 단말·서버에 와이퍼·랜섬웨어를 한꺼번에 실행할 수 있음
    - 배포 서버는 모든 단말에서 관리자 권한으로 코드를 실행할 수 있어 한 번의 장악이 전사 동시 파괴로 이어지고, 정상 배포 작업과 구분하기 어려움
  reference: |-
    ■ 공급망 관점
    - 대상: 패치 관리·업데이트 배포 서버(WSUS·Configuration Manager), 엔드포인트 관리(Ivanti EPM·ManageEngine), 구성 관리(SaltStack) 서버
    - 수법: 배포 서버 취약점 악용이나 관리자 계정 탈취 후 배포 작업으로 악성코드 실행
    - 클라우드 매트릭스 연계: 클라우드 제어 평면 API·원격 명령 악용(CL-EX-01)
    ■ 실제 사례
    - [실제 사고] 3·20 전산망 대란(패치 관리 서버 악용)(2013-03): 방송사·금융사의 중앙 패치 관리 서버를 장악해 와이퍼를 일괄 배포, 전산장비 약 4만 8천 대의 디스크를 파괴 (SCI-011, ATT&CK S0041)
    - [공개 취약점] 내부 배포·패치 관리 도구 KEV 등재 12건: WSUS CVE-2025-59287, Configuration Manager CVE-2024-43468, Ivanti EPM 5건, ManageEngine Desktop Central 2건, SaltStack 3건
  detect: |-
    ■ 탐지
    - 배포 서버에서 평소와 다른 패키지·스크립트 배포, 대상 범위 급증(전체 단말), 업무 시간 외 배포를 감사 로그로 탐지
    - 배포 서버 관리자 계정의 신규 생성·권한 변경과 배포 작업 승인 이력을 대조
    ■ 대응
    - 배포 서버는 관리 전용망·전용 단말에서만 접근하게 하고(NIST AC-6(5) 특권 계정 최소화), KEV 등재 취약점을 최우선 패치
    - 전사 대상 배포에는 2인 승인·단계적 배포를 적용하고, 배포 패키지 서명 검증과 오프라인 백업을 유지

SCT-CS-02.3:
  oneline: 공급업체의 고객 관리 권한·지원 계정을 거쳐 고객 환경에 침입
  summary: |-
    - 공격자는 IT 관리 SaaS·개발 플랫폼·기술 협력사를 먼저 침해해, 그 업체가 가진 고객 관리 권한·원격 지원 계정·연결망으로 고객 환경에 들어갈 수 있음
    - 정상 공급업체 접근이라 탐지가 어렵고 한 업체를 거쳐 여러 고객사에 동시에 닿으며, 공격자는 암호화폐 기업 같은 고가치 고객을 골라 노림
  reference: |-
    ■ 공급망 관점
    - 대상: 단말 명령 기능을 가진 IT 관리 SaaS, 개발 플랫폼 고객 계정, 은행·기관의 기술 협력사와 그 연결망, 원격 지원 계정
    - 수법: 공급업체 직원 스피어피싱·SMS 피싱으로 내부 진입 후 고객 관리 기능 악용, 협력사 서버 취약점으로 진입해 연결된 고객 시스템으로 이동
    - 연계: CI/CD 서버 취약점(SCT-BD-03.1), 금전 탈취(SCT-IM-04) / 클라우드 매트릭스 신뢰 관계(MSP·SaaS 연동) 악용(CL-IA-06)
    ■ 실제 사례
    - [실제 사고] JumpCloud 명령 프레임워크 악용(암호화폐 고객 표적)(2023-06): IT 관리 SaaS에 들어간 공격자가 고객 단말 명령 기능에 악성 코드를 넣어 암호화폐 기업 고객 일부를 노림 (SCI-092)
    - [실제 사고] Retool 직원 SMS 피싱 경유 클라우드 고객 침해(2023-08): 직원이 넘긴 MFA 코드로 클라우드 고객 27곳 계정이 장악됐고 한 곳에서 약 1,500만 달러가 탈취 (SCI-104)
    - [실제 사고] Jenkins 취약점 경유 인도 결제망 랜섬웨어(2024-07): 은행 기술 협력사의 노출된 Jenkins로 들어가 협력 관계인 결제 시스템에 랜섬웨어를 실행 (SCI-130, CVE-2024-23897)
  detect: |-
    ■ 탐지
    - 공급업체 계정·연결의 접속 시간·출발지·수행 명령을 기준선과 비교하고, 공급업체 기능으로 실행된 고객 단말 명령을 EDR로 기록
    - 공급업체 침해 공지·위협 정보를 구독해 해당 기간의 공급업체 접근 이력을 즉시 점검
    ■ 대응
    - 공급업체 접근은 필요한 시스템·시간에만 허용하고(접근 승인·세션 녹화), 공급업체 계정에 피싱 저항 MFA를 요구
    - 계약에 보안 요구사항·침해 통지 기한·감사 권한을 넣고(SSDF PO.1, NIST SA-9·PS-7) 협력사 연결망을 분리

SCT-CS-03.1:
  oneline: 연동 앱 공급자의 OAuth 토큰 탈취로 고객 데이터·저장소 대량 접근
  summary: |-
    - 공격자는 SaaS 연동 앱 공급자가 보관한 고객 OAuth·API 토큰을 탈취해, 그 앱을 승인한 모든 고객의 저장소·데이터에 MFA 없이 접근할 수 있음
    - 연동 토큰 사용은 고객 쪽 로그인 기록에 잘 드러나지 않고 권한이 넓은 경우가 많으며, 빼낸 데이터 속 비밀이 다음 침해로 이어짐
  reference: |-
    ■ 공급망 관점
    - 대상: GitHub·Salesforce 같은 플랫폼에 연동된 CI/CD·영업·지원 SaaS의 OAuth 토큰, 연동 공급자의 토큰 저장소
    - 수법: 연동 공급자 침해 후 토큰 일괄 탈취 → 고객 환경 대량 조회·복제 → 데이터 속 AWS 키·토큰 같은 비밀 수집
    - 연계: 소스·비밀 반출(SCT-IM-03), CI/CD SaaS 침해(SCT-BD-03.2) / 클라우드 매트릭스 OAuth 앱 통합 악용(CL-PE-03)·신뢰 관계 악용(CL-IA-06)
    ■ 실제 사례
    - [실제 사고] Heroku·Travis CI OAuth 토큰 탈취로 npm 등 비공개 저장소 반출(2022-04): 연동 공급자에 발급된 GitHub OAuth 토큰으로 npm 등 수십 개 조직의 비공개 저장소를 복제 (SCI-074)
    - [실제 사고] Salesloft Drift OAuth 토큰 탈취(Salesforce 데이터 대량 반출)(2025-08): 연동 토큰으로 700곳 이상 조직의 Salesforce 데이터를 반출하고 그 안의 AWS 키·Snowflake 토큰을 노림 (SCI-144)
  detect: |-
    ■ 탐지
    - 연동 앱 토큰의 API 사용량·조회 범위·출발지 IP를 기준선과 비교해 대량 조회·복제를 경보
    - 승인된 연동 앱 목록과 권한을 정기 점검해 쓰지 않거나 권한이 과도한 연동을 찾아냄
    ■ 대응
    - 연동 앱은 최소 권한·IP 제한·짧은 만료 토큰으로 승인하고, 쓰지 않는 연동은 즉시 해제
    - 연동 공급자 침해 시 토큰 일괄 폐기와 해당 기간 접근 로그 점검 절차를 마련하고, 업무 데이터·티켓에 비밀을 남기지 않음

SCT-CS-03.2:
  oneline: 외부에서 불러오는 웹 스크립트·SDK 변조로 이용자 화면·거래 조작
  summary: |-
    - 공격자는 웹·앱이 외부 도메인·CDN에서 매번 불러오는 분석·지갑 연결·SDK 스크립트를 변조해, 그 스크립트를 쓰는 모든 서비스 이용자의 화면에서 코드를 실행할 수 있음
    - 서비스 운영자의 서버는 멀쩡해 변조를 알아채기 어렵고, 특정 사이트·사용자에게만 동작하게 표적화하면 탐지가 더 늦어짐
  reference: |-
    ■ 공급망 관점
    - 대상: 웹 분석·광고 태그, 지갑 연결 라이브러리, 모바일·웹 SDK, 버전 고정 없이 CDN 최신판을 불러오는 스크립트, 웹 앱 자체 스크립트 저장소
    - 수법: 스크립트 공급자·도메인·등록 계정 장악(SCT-PB-02.3), npm 악성 버전이 CDN 최신 경로로 즉시 반영(SCT-DP-05), 클라우드 자격증명으로 웹 앱 스크립트 직접 변조
    - 결과: 지갑 주소 바꿔치기·거래 서명 조작(SCT-IM-04), 사기 사이트 유도
    ■ 실제 사례
    - [실제 사고] Bybit 해킹(2025-02): 개발자 단말에서 얻은 클라우드 자격증명으로 Safe{Wallet} 웹 앱 JavaScript를 Bybit 서명자에게만 동작하도록 바꿔 약 15억 달러 상당 암호자산이 탈취 (SCI-132, ATT&CK G0032)
    - [실제 사고] AppsFlyer Web SDK 변조(2026-03): 배포 도메인 등록 계정이 탈취되어 약 14시간 동안 지갑 주소를 바꾸는 변조 스크립트가 나감 (SCI-157)
    - [실제 사고] Polyfill.io 도메인 인수 후 악성 스크립트 배포(2024-06): 도메인을 인수한 업체가 스크립트를 바꿔 10만 개 이상 사이트의 모바일 이용자를 사기 사이트로 보냄 (SCI-112)
    - [실제 사고] gate.io 겨냥 서드파티 분석 스크립트 변조(StatCounter)(2018-11): 널리 쓰이는 분석 스크립트가 특정 거래소 출금 페이지에서만 출금 주소를 바꾸도록 변조 (SCI-036)
  detect: |-
    ■ 탐지
    - 운영 페이지가 불러오는 외부 스크립트의 해시·도메인을 주기적으로 수집해 변경을 경보하고, 콘텐츠 보안 정책(CSP) 위반 보고를 수집
    - 결제·지갑·로그인 페이지의 스크립트 변경을 별도로 감시
    ■ 대응
    - 외부 스크립트는 자체 호스팅하거나 버전을 고정하고 하위 자원 무결성(SRI)으로 해시를 강제하며, CSP로 허용 도메인을 제한
    - 중요 거래는 화면과 독립된 경로(하드웨어 지갑 화면·별도 서명 검증)로 거래 내용을 확인

SCT-CS-04:
  oneline: 기관·금융권 필수·공통 소프트웨어 취약점으로 다수 조직 동시 침해
  summary: |-
    - 공격자는 공공·금융 서비스 이용에 필수로 설치되거나 위탁사가 공통으로 쓰는 소프트웨어의 취약점을 노려, 그 소프트웨어가 깔린 다수 조직을 한꺼번에 침해할 수 있음
    - 사용자가 설치 사실을 모르거나 업데이트가 늦은 경우가 많고, 워터링홀과 결합하면 특정 업종을 골라 노릴 수 있음
  reference: |-
    ■ 공급망 관점
    - 대상: 국내 인증·보안·파일 전송 에이전트(필수 설치 소프트웨어), 위탁사가 운영하는 파일 전송 솔루션, 단말에 상주하는 로컬 웹 서버형 프로그램
    - 수법: 언론 사이트 워터링홀로 방문 단말의 취약한 에이전트를 공격, 파일 전송 솔루션 제로데이로 대량 데이터 반출, 여러 소프트웨어 취약점 연쇄
    - 연계: 위탁사 경유 연쇄 피해(SCT-IM-01.1), 데이터 반출(SCT-IM-03) / 클라우드 매트릭스 공개 애플리케이션 취약점 악용(CL-IA-01)
    ■ 실제 사례
    - [실제 사고] MagicLine4NX 취약점 악용(국내 기관·기업 침투)(2023-03): 인증 보안 소프트웨어 취약점을 워터링홀과 결합해 약 50개 공공기관·방산·IT 기업 PC를 감염 (SCI-093)
    - [실제 사고] Operation SyncHole(국내 소프트웨어 취약점 연쇄 악용)(2024-11): 국내에서 널리 쓰이는 보안·파일 전송 소프트웨어 취약점을 연쇄로 악용해 기업 최소 6곳을 침해 (SCI-137, ATT&CK G0032)
    - [실제 사고] MOVEit Transfer 대량 악용(급여 위탁사 경유 고객사 피해)(2023-05): 급여 위탁사 한 곳의 침해로 여러 고객사 직원 정보가 함께 유출 (SCI-100)
  detect: |-
    ■ 탐지
    - 조직 단말·서버에 설치된 서드파티 에이전트·솔루션 목록과 버전을 수집해 공개 취약점·보안 권고와 대조
    - 에이전트 프로세스가 브라우저·외부 요청을 받아 비정상 자식 프로세스를 실행하면 EDR로 탐지
    ■ 대응
    - 필수 설치 소프트웨어 목록을 관리해 쓰지 않는 에이전트를 제거하고, 보안 권고가 나오면 즉시 업데이트·삭제
    - 위탁사가 운영하는 솔루션의 패치 상태·침해 통지를 계약으로 관리하고, 위탁사에 넘기는 데이터를 최소화
