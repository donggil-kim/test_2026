# [DE] 개발 환경 — 공급망 관점 문구
# 키: 세부위협 ID(SCT-…)
# oneline  : 핵심 요약 한 줄(50자 이내, 보고서 본문·슬라이드용) — '수단 + 대상 + 결과'를 명사형으로
# summary  : 요약설명 2줄 개조식 — ① 공격자는 [수단·경로]로 [행위]할 수 있음 ② 피해·확산 특성 또는 탐지·방어가 어려운 이유
# reference: ■ 공급망 관점(대상·경로·수법·변형·연계 SCT-ID) / ■ 실제 사례(라벨, '사례명(YYYY-MM): 경위·결과 (사고 ID·KEV·ATT&CK ID)')
# detect   : ■ 탐지 / ■ 대응(예방 → 차단 → 탐지 순, 개발·운영 제약 반영)
# 사례 라벨: [실제 사고] 사고 DB 실제 사고 · [실증] 사고 DB 연구·시연 · [공개 취약점] CVE·KEV · [시나리오] 기준 문서의 가정 사례
#            공개 사례가 없으면 '공개 사고 미확인 — 사유'
# 용어: 자격증명(인증정보·크리덴셜 쓰지 않음), 반출(빼내는 행위)/유출(새어 나간 결과), 게시(publish), 의존성(dependency)
# 사실 근거: 수치·사례는 data/incidents.yaml의 요약·출처에 있는 것만 쓴다(scripts/validate.py가 사례 ID·라벨·시점을 대조)

SCT-DE-01.1:
  oneline: 개발자 단말 감염으로 세션·키를 훔쳐 소스·빌드·게시 권한 장악
  summary: |-
    - 공격자는 개발자 단말을 악성코드로 감염시켜 SSO 세션 쿠키·SSH 키·클라우드 키·게시 토큰을 빼내고, 개발자 권한으로 소스 저장소·빌드·운영 시스템에 접근할 수 있음
    - MFA를 거친 세션을 그대로 재사용해 정상 로그인처럼 보이고, 개발자 권한이 넓을수록 고객 비밀 저장소·서명·게시 경로까지 한 번에 닿음
  reference: |-
    ■ 공급망 관점
    - 대상: 개발자·DevOps 엔지니어 노트북과 개인 PC, 그 안의 브라우저 세션·SSH 키·.npmrc·클라우드 CLI 설정·비밀번호 관리자
    - 경로: 악성 확장(SCT-DE-02.1)·가짜 채용 과제(SCT-DE-01.2)·트로이목마화된 업무 프로그램·개인 PC의 취약한 서비스
    - 영향 범위가 단말 하나에 그치지 않음 — 고객 비밀(SCT-BD-03.2), 빌드 환경(SCT-BD-02.1), 웹 앱 배포 자격(SCT-CS-03.2)으로 이어짐
    ■ 실제 사례
    - [실제 사고] CircleCI 엔지니어 단말 경유 고객 비밀 유출(2023-01): 노트북 악성코드가 2FA를 거친 SSO 세션을 훔쳐 운영 시스템에 접근, 고객 비밀 전량 교체 권고로 이어짐 (SCI-091)
    - [실제 사고] 3CX 데스크톱 앱 이중 공급망 침해(2023-03): 직원 단말에 설치된 트로이목마 X_TRADER가 빌드 환경 장악의 발판이 됨 (SCI-090, ATT&CK C0057)
    - [실제 사고] Bybit 해킹(2025-02): Safe{Wallet} 개발자 단말에서 얻은 클라우드 자격증명으로 지갑 웹 앱 스크립트를 바꿔 약 15억 달러가 탈취됨 (SCI-132)
    - [실제 사고] GitHub 내부 저장소 유출(2026-05): 악성 Nx Console 확장이 설치된 직원 단말에서 내부 저장소 접근이 시작됨 (SCI-164)
  detect: |-
    ■ 탐지
    - 개발 계정의 세션 재사용 징후(새 지역·기기에서 같은 세션 쿠키 사용, 짧은 시간 내 위치 변경)와 비정상 시간대의 저장소 대량 복제·토큰 발급을 IdP·SCM 감사 로그로 상관 분석
    - 개발자 단말 EDR에서 브라우저 쿠키·키체인·~/.ssh·.npmrc·클라우드 자격증명 파일 접근과 외부 전송을 탐지
    ■ 대응
    - 운영·게시 권한이 있는 개발자는 전용 관리 단말·피싱 저항 MFA(FIDO2)·짧은 세션 수명·기기 바인딩 세션을 적용
    - 장기 정적 키 대신 단기 토큰·워크로드 ID로 바꾸고, 개발자 단말에 고객 비밀·운영 키를 두지 않음
    - 개인 기기의 업무 접근을 제한하고 개발 단말 EDR·확장 통제를 의무화

SCT-DE-01.2:
  oneline: 가짜 채용 과제·협업 제안으로 개발자에게 악성 코드 실행 유도
  summary: |-
    - 공격자는 채용 담당자·협업자를 사칭해 개발자에게 코딩 과제·데모 프로젝트를 실행시키거나 악성 패키지를 설치하게 해 단말을 감염시킬 수 있음
    - 개발자가 업무로 외부 코드를 실행하는 것이 자연스러워 경계가 낮고, 감염 단말의 지갑·자격증명이 후속 공급망 침해의 출발점이 됨
  reference: |-
    ■ 공급망 관점
    - 대상: 오픈소스 기여자·블록체인·핀테크 개발자, 프리랜서 플랫폼 이용 개발자
    - 수법: 링크드인·메신저로 접근 → 과제 저장소 클론 후 npm install·실행 유도 → 설치 스크립트·의존성에 숨긴 정보탈취 악성코드 실행
    - 연계: 감염 후 개발자 단말 침해(SCT-DE-01.1), 악성 패키지 유입(SCT-DP-03.1)
    ■ 실제 사례
    - [실제 사고] Contagious Interview(2023-11): 북한 연계 조직이 가짜 채용 과제·악성 npm 패키지로 BeaverTail 등 정보탈취 악성코드를 감염시킴 (SCI-110, ATT&CK G1052·S1246)
  detect: |-
    ■ 탐지
    - 개발 단말에서 새로 클론한 저장소의 설치 스크립트가 외부 다운로드·난독화 스크립트 실행·브라우저 저장소 접근을 하면 EDR 경보
    - 개인 메신저·채용 플랫폼을 통해 받은 저장소·압축 파일 실행 이력을 점검
    ■ 대응
    - 외부에서 받은 코드는 일회용 가상 환경·컨테이너에서 실행하고, 업무 단말에서는 설치 스크립트 실행을 막음(--ignore-scripts)
    - 개발자 대상 사회공학 사례(가짜 채용·코딩 테스트) 교육과 신고 창구 운영

SCT-DE-02.1:
  oneline: 악성·탈취 IDE 확장으로 개발자 권한의 비밀·저장소 탈취
  summary: |-
    - 공격자는 악성 확장을 마켓플레이스에 올리거나 인기 확장의 게시 자격을 빼앗아 악성 버전을 배포해, 개발자 권한으로 작업공간 코드·비밀·토큰에 접근할 수 있음
    - 확장은 자동 업데이트로 설치 기반 전체에 수십 분 안에 전달되고, 편집기 프로세스 안에서 실행되어 일반 악성코드보다 눈에 띄지 않음
  reference: |-
    ■ 공급망 관점
    - 대상: VS Code Marketplace·Open VSX·JetBrains 마켓플레이스 확장, 그 확장이 실행되는 개발자 단말(작업공간·터미널·자격증명 파일)
    - 경로: 게시자 토큰 탈취(SCT-SC-02.2)·피싱(SCT-SC-03.1)으로 정상 확장에 악성 버전 게시(SCT-PB-01), 보이지 않는 문자로 코드 은닉(SCT-SR-01.2)
    - 확장 하나의 침해가 개발자 단말(SCT-DE-01.1)을 거쳐 다른 공급망 침해로 번짐(SCT-IM-01.2)
    ■ 실제 사례
    - [실제 사고] Nx Console 확장 악성 버전(2026-05): 정상 CI를 거치지 않은 18.95.0이 수십 분 노출되며 1Password·Claude Code 설정·클라우드 자격증명을 수집 (SCI-163, CVE-2026-48027)
    - [실제 사고] GitHub 내부 저장소 유출(2026-05): 이 확장이 설치된 직원 단말이 내부 저장소 유출의 시작점이 됨 (SCI-164)
    - [실제 사고] GlassWorm(2025-10): Open VSX 확장에 보이지 않는 유니코드로 코드를 숨기고 탈취한 게시 자격으로 다른 확장에 퍼짐 (SCI-149, ATT&CK S9010)
  detect: |-
    ■ 탐지
    - 조직 내 설치 확장 목록·버전을 수집해 신규·급변 버전(정상 CI 미경유 게시, 짧은 간격 연속 게시)과 마켓플레이스 경보를 대조
    - 편집기 프로세스의 자식 프로세스(셸·curl·node)와 자격증명 파일·비밀번호 관리자 접근, 외부 전송을 EDR로 탐지
    ■ 대응
    - 승인 확장 허용 목록과 버전 고정(자동 업데이트 지연·검토), 게시자 검증·서명 확인이 가능한 마켓플레이스만 사용
    - 확장 권한이 닿는 비밀을 줄이고(단말에 장기 토큰 미보관), 침해 공지 시 확장 제거·토큰 교체 절차를 미리 마련

SCT-DE-02.2:
  oneline: 변조된 컴파일러·SDK로 빌드한 모든 산출물에 악성 코드 삽입
  summary: |-
    - 공격자는 비공식 경로로 퍼진 변조 컴파일러·SDK·빌드 도구를 개발자가 쓰게 만들어, 그 도구로 만든 모든 산출물에 악성 코드를 넣을 수 있음
    - 소스에는 흔적이 없어 코드 리뷰로 발견되지 않고, 정상 서명·스토어 심사를 거쳐 최종 사용자에게 대량 배포됨
  reference: |-
    ■ 공급망 관점
    - 대상: 컴파일러·SDK·IDE 번들·빌드 이미지·언어 런타임 등 빌드 도구 체인(SLSA 의존성 위협 '변조 빌드 도구')
    - 경로: 공식 배포처가 느리거나 막힌 환경에서 미러·공유 드라이브로 받은 도구, 빌드 시스템이 자동으로 고른 구버전 도구
    - 연계: 빌드 서버 침해(SCT-BD-02.1)와 결과는 같으나 개발자 쪽 도구 선택에서 시작됨
    ■ 실제 사례
    - [실제 사고] XcodeGhost(2015-09): 비공식 서버에서 받은 변조 Xcode로 빌드한 iOS 앱 수천 개에 정보 수집 코드가 실려 App Store 심사를 통과 (SCI-013)
    - [실증] GCP Go 빌드팩 구버전 컴파일러 사용(2022-04): 빌드팩이 go.mod 기준으로 구버전 컴파일러를 받아 취약 바이너리를 만들 수 있음이 보고됨 (SCI-089)
  detect: |-
    ■ 탐지
    - 빌드 도구 체인의 해시·서명·버전을 출처 증명(provenance)·SBOM에 기록하고 공식 배포 해시와 대조
    - 같은 소스에서 다른 빌드 환경으로 만든 산출물이 다르면(재현 빌드 불일치) 경보
    ■ 대응
    - 도구 체인은 공식 배포처·사내 검증 저장소에서만 받고 서명·해시 검증을 강제
    - 빌드 이미지를 코드로 관리(버전 고정)하고 재현 가능 빌드·독립 재빌드로 산출물을 교차 검증(S2C2F REB-1)

SCT-DE-02.3:
  oneline: 프로젝트 빌드 파일을 감염시켜 빌드하는 개발자에게 자가 전파
  summary: |-
    - 공격자는 감염 단말의 프로젝트 빌드 파일(IDE 프로젝트 설정·빌드 스크립트)에 악성 코드를 심어, 그 프로젝트를 빌드하는 다른 개발자에게 퍼지게 할 수 있음
    - 저장소에 함께 커밋된 빌드 파일은 사람이 거의 읽지 않아 오래 숨어 있고, 공유 저장소를 통해 조직 밖으로도 번짐
  reference: |-
    ■ 공급망 관점
    - 대상: NetBeans·Xcode 같은 IDE 프로젝트 파일, Makefile·Gradle·npm 스크립트 등 빌드 정의, 저장소에 커밋된 바이너리
    - 수법: 감염 단말에서 로컬 프로젝트를 찾아 빌드 단계에 로더 삽입 → 빌드 산출물·다른 개발자 단말 감염 → 공개 저장소로 확산
    - 연계: 자가 전파형 공급망 웜(SCT-IM-02)의 초기 형태
    ■ 실제 사례
    - [실제 사고] Octopus Scanner(2020-05): NetBeans 프로젝트 빌드 파일에 자신을 심어 빌드하는 개발자에게 퍼졌고, GitHub 보안팀이 감염 저장소 26개를 찾음 (SCI-049)
  detect: |-
    ■ 탐지
    - 빌드 정의 파일·저장소 내 바이너리의 예상 밖 변경을 PR 단계에서 탐지(Scorecard Binary-Artifacts)
    - 빌드 중 외부 다운로드·프로젝트 외 경로 쓰기 같은 이상 행위를 빌드 환경 감시로 탐지
    ■ 대응
    - 빌드 정의 파일 변경에 코드 소유자 리뷰를 의무화하고 저장소에 바이너리 커밋을 금지
    - 개발 단말 EDR과 격리된 빌드 환경(일회용 러너)으로 로컬 감염이 산출물로 이어지는 경로 차단

SCT-DE-03.1:
  oneline: AI 코딩 도구·규칙 파일에 숨은 지시로 파괴·백도어 코드 유도
  summary: |-
    - 공격자는 AI 코딩 도구 확장·규칙 파일·프롬프트에 숨은 지시를 넣거나 설치된 AI CLI를 위험 옵션으로 호출해, 개발자 권한으로 파일 삭제·클라우드 자원 조작·백도어 코드 생성을 시킬 수 있음
    - AI 도구는 명령 실행·코드 수정 권한을 자율로 쓰고 지시가 보이지 않는 문자·자연어 안에 숨어, 사람 리뷰와 기존 정적 분석으로 잡기 어려움
  reference: |-
    ■ 공급망 관점
    - 대상: AI 코딩 도우미 확장(Amazon Q·Copilot·Cursor 등), 저장소에 공유되는 규칙·설정 파일, 개발 단말의 AI CLI
    - 경로: 오픈소스 저장소 기여(SCT-SR-01.1) → 정식 확장 배포, 공개 규칙 파일 공유, 악성 패키지가 설치된 AI CLI를 호출(SCT-DP-03.2)
    - AI 매트릭스 연계: 악성 에이전트 배치·설정 변조(AI-06-09), 간접 프롬프트 인젝션(AI-02-03), 파괴적 도구 실행(AI-06-02)
    ■ 실제 사례
    - [실제 사고] Amazon Q Developer 확장에 삭제 지시 주입(2025-07): 외부 기여로 로컬 파일·AWS 자원 삭제 프롬프트가 1.84.0에 실려 공식 배포됨, 형식 오류로 실행되지 않음 (SCI-140)
    - [실제 사고] s1ngularity(2025-08): 악성 nx 패키지가 피해 단말의 Claude·Gemini·Q CLI를 위험 옵션으로 실행해 비밀 파일을 찾게 함 (SCI-143)
    - [실증] Rules File Backdoor(2025-03): 규칙 파일의 보이지 않는 유니코드 지시로 AI가 생성 코드에 백도어를 넣도록 유도할 수 있음을 보임 (SCI-134)
  detect: |-
    ■ 탐지
    - AI 코딩 도구가 실행하는 셸 명령·클라우드 CLI 호출을 감사 로그로 남기고 삭제·권한 변경·대량 조회 명령을 경보
    - 규칙·설정 파일과 PR의 보이지 않는 문자·양방향 제어 문자를 커밋 단계에서 검사
    ■ 대응
    - AI 도구의 자동 실행(승인 생략) 옵션을 끄고 파괴적 명령·운영 자격증명 사용은 사람 승인을 거치게 함
    - AI 도구 확장·CLI를 허용 목록·버전 고정으로 관리하고, 개발 단말의 클라우드 자격증명을 최소 권한·단기 토큰으로 제한

SCT-DE-03.2:
  oneline: 공식 도구를 사칭한 MCP 서버·에이전트 스킬로 데이터 반출
  summary: |-
    - 공격자는 공식 서비스를 사칭하거나 정상처럼 쓰이다 악성으로 바뀌는 MCP 서버·에이전트 스킬을 배포해, 에이전트가 위임받은 메일·파일·자격증명을 반출할 수 있음
    - 에이전트 도구는 개별 검토 없이 설치·실행되는 경우가 많고, 정상 기능을 유지한 채 숨은 동작(숨은 참조 등)만 추가해 발견이 늦어짐
  reference: |-
    ■ 공급망 관점
    - 대상: npm·PyPI로 배포되는 MCP 서버, 에이전트 스킬 저장소(ClawHub 등), 이를 쓰는 AI 에이전트·개발 단말
    - 수법: 공식 이름 선점·사칭(SCT-DP-01.2) → 정상 버전으로 신뢰 확보 → 악성 버전 전환, 또는 가짜 사전 설치 단계로 정보탈취 악성코드 설치
    - AI 매트릭스 연계: 악성 에이전트 도구 유통·사칭(AI-08-05), 악성 패키지 유입(AI-08-02)
    ■ 실제 사례
    - [실제 사고] postmark-mcp(2025-09): Postmark 공식 MCP 서버와 같은 이름의 npm 패키지가 1.0.16에서 에이전트 발송 메일 전량을 숨은 참조로 빼돌림 (SCI-148)
    - [실제 사고] ClawHub 악성 에이전트 스킬(2026-02): 악성 스킬 341개 중 335개가 가짜 사전 설치 단계로 macOS 정보탈취 악성코드를 설치 (SCI-167)
  detect: |-
    ■ 탐지
    - 에이전트가 쓰는 MCP 서버·스킬의 목록·버전·게시자를 인벤토리로 관리하고 게시자 변경·신규 버전을 경보
    - 에이전트 도구의 외부 통신(메일 숨은 참조·웹훅·미승인 도메인)과 설치 시점 셸 실행을 감시
    ■ 대응
    - 공식 게시자·서명이 확인된 MCP 서버·스킬만 허용 목록으로 쓰고 버전을 고정
    - 에이전트 도구 권한을 업무 범위로 최소화하고 메일 발송·파일 반출 같은 고위험 동작은 승인 절차를 둠
