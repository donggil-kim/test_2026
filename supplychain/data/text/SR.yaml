# [SR] 소스 저장소 — 공급망 관점 문구 (작성 규칙은 DE.yaml 머리말)

SCT-SR-01.1:
  oneline: 정상 기여로 위장한 변경으로 취약점·백도어를 소스에 반영
  summary: |-
    - 공격자는 기능 개선·버그 수정으로 위장한 기여(PR·패치)에 취약점이나 백도어를 섞어 리뷰를 통과시키고, 정상 릴리스에 실어 보낼 수 있음
    - 반영된 변경은 정식 기여 이력과 함께 모든 다운스트림에 배포되며, 리뷰 인력이 부족한 오픈소스일수록 의도를 가려내기 어려움
  reference: |-
    ■ 공급망 관점
    - 대상: 외부 기여를 받는 오픈소스 저장소, 사내 공유 저장소(inner source), AI 도구 확장처럼 오픈소스로 개발되는 상용 제품
    - 수법: 무해해 보이는 변경 여러 개로 조각내 제출, 기존 결함을 악용 가능하게 바꾸는 작은 수정(SAP AV-304), 은닉 기법 병행(SCT-SR-01.2)
    - 연계: 리뷰를 거치지 않는 직접 반영(SCT-SR-02.1)과 구분 — 이 위협은 리뷰를 '통과'하는 경우
    ■ 실제 사례
    - [실제 사고] Amazon Q Developer 확장에 삭제 지시 주입(2025-07): 외부 기여자가 낸 변경이 반영되어 파괴 지시가 담긴 1.84.0이 공식 배포됨 (SCI-140)
    - [실증] 리눅스 커널 위장 커밋 연구(2021-04): 연구진이 취약점을 숨긴 패치를 제출해 리뷰 통과 가능성을 실험, 커널 커뮤니티가 해당 대학 기여를 전면 재검토 (SCI-059)
  detect: |-
    ■ 탐지
    - 신규·저활동 기여자의 보안 민감 영역(인증·암호·빌드·업데이트) 변경을 자동 표시해 추가 리뷰로 보냄
    - 정적 분석·비밀 탐지·의존성 변경 검사를 PR 필수 점검으로 두고, 릴리스 전 diff를 이전 릴리스와 대조
    ■ 대응
    - 보호 브랜치에 2인 이상 리뷰와 코드 소유자 승인을 강제(Scorecard Code-Review·Branch-Protection)
    - 보안 민감 파일은 유지보수자만 승인할 수 있게 경로별 소유권을 지정

SCT-SR-01.2:
  oneline: 보이지 않는 문자·테스트 파일 은닉으로 악성 변경이 리뷰 통과
  summary: |-
    - 공격자는 보이지 않는 유니코드·양방향 제어 문자·호모글리프·압축된 생성 코드·테스트용 바이너리에 악성 코드를 숨겨 리뷰어가 보는 코드와 실제 실행 코드를 다르게 만들 수 있음
    - 단독으로는 피해가 없지만 악성 변경이 리뷰를 통과하게 해 소스 침해의 성공률을 크게 높이고, 사람 리뷰로는 사실상 찾기 어려움
  reference: |-
    ■ 공급망 관점
    - 대상: 코드 리뷰 화면(diff), 압축·생성된 파일, 테스트 데이터·바이너리 파일, AI 코딩 도구 규칙 파일
    - 수법: 렌더링 약점 악용(SAP AV-305~308), 생성·압축 코드 은닉(AV-309), 릴리스 압축 파일에만 존재하는 빌드 스크립트 변경
    - 연계: 위장 기여(SCT-SR-01.1)·메인테이너 권한 획득(SCT-SR-01.3)의 성공률을 높이는 기법
    ■ 실제 사례
    - [실제 사고] xz utils 백도어(2024-03): 테스트 파일에 숨긴 페이로드를 릴리스 압축 파일의 빌드 스크립트로 풀어 넣어, 저장소 리뷰로는 드러나지 않음 (SCI-111)
    - [실제 사고] GlassWorm(2025-10): 확장 코드에 화면에 보이지 않는 유니코드 문자로 악성 코드를 숨김 (SCI-149)
    - [실제 사고] 리눅스 커널 CVS 미러 백도어 삽입 시도(2003-11): '=='를 '='로 바꾼 한 글자 변경으로 root 권한 백도어를 위장 (SCI-001)
    - [실증] Trojan Source(2021-11): 양방향 제어 문자로 사람에게 보이는 코드와 컴파일 결과를 다르게 만들 수 있음을 보임 (SCI-066)
  detect: |-
    ■ 탐지
    - 커밋·PR 단계에서 보이지 않는 문자·양방향 제어 문자·혼용 문자 집합을 검사하고 경고 표시
    - 릴리스 압축 파일과 저장소 태그의 내용을 자동 대조해 저장소에 없는 빌드 단계 변경을 탐지
    ■ 대응
    - 테스트·생성 파일과 바이너리는 출처를 기록하고 빌드에서 쓰이지 않도록 경로를 분리
    - 릴리스 산출물은 저장소에서 재현 가능하게 빌드하고(재현 빌드), 압축 파일 수작업 생성을 금지

SCT-SR-01.3:
  oneline: 장기 위장·프로젝트 인계로 메인테이너 권한을 얻어 백도어 배포
  summary: |-
    - 공격자는 수년간 정상 기여로 신뢰를 쌓거나 지친 메인테이너에게서 관리 권한을 넘겨받고, 프로젝트·확장을 사들여 정식 메인테이너로서 악성 변경을 릴리스할 수 있음
    - 메인테이너 명의의 변경은 정상 업데이트로 신뢰받아 배포판·다운스트림 전체로 퍼지고, 사람의 의도를 기술로 가려내기 어려움
  reference: |-
    ■ 공급망 관점
    - 대상: 1인 유지·저활동 오픈소스, 관리자 없는 패키지(고아 패키지), 매각 가능한 브라우저 확장
    - 수법: 장기 위장 페르소나와 압박 계정으로 인계 압력, 고아 패키지 인수, 확장·도메인 매입 후 업데이트로 악성 코드 배포
    - 연계: 은닉 기법(SCT-SR-01.2), 악성 의존성 추가 후 게시(SCT-PB-01)
    ■ 실제 사례
    - [실제 사고] xz utils 백도어(2024-03): 약 2년간 기여로 공동 메인테이너가 된 인물이 sshd 인증 우회 백도어를 5.6.0·5.6.1에 심음 (SCI-111)
    - [실제 사고] event-stream(flatmap-stream) 메인테이너 인계 악용(2018-11): 관리 권한을 넘겨받은 뒤 특정 지갑을 노린 악성 의존성을 추가 (SCI-033)
    - [실제 사고] The Great Suspender 확장 매각 후 악성화(2020-11): 200만 명 이상이 쓰던 확장이 인수자에게 넘어간 뒤 원격 코드 실행이 가능한 코드가 들어감 (SCI-054)
    - [실제 사고] AUR 방치 패키지 인수 후 악성화(acroread)(2018-07): 관리자 없는 패키지를 인수한 사용자가 설치 스크립트에 정보 전송 코드를 넣음 (SCI-031)
  detect: |-
    ■ 탐지
    - 핵심 의존성의 메인테이너·게시자·소유 조직 변경과 신규 메인테이너의 빌드·릴리스 절차 변경을 감시(Scorecard Maintained·Contributors)
    - 인계 직후 릴리스는 이전 릴리스와 diff·동작(네트워크·파일 접근)을 비교 분석
    ■ 대응
    - 핵심 의존성은 인계·매각 이벤트를 공급망 위험 신호로 보고 버전 고정 후 검토를 거쳐 갱신
    - 중요 오픈소스는 내부 미러와 독립 재빌드로 검증하고(S2C2F ING-4·REB-1), 후원·공동 유지보수로 1인 의존을 줄임

SCT-SR-01.4:
  oneline: 메인테이너가 항의·사보타주 목적으로 패키지에 파괴 코드 삽입
  summary: |-
    - 정상 메인테이너가 정치적 항의·무상 노동 반발 등으로 무한 루프·파일 덮어쓰기 같은 코드를 자신의 패키지에 넣어 배포할 수 있음
    - 공개적으로 드러나 수 시간~수일 안에 철회되는 경향이지만, 버전 범위로 최신판을 자동 수용한 프로젝트는 즉시 멈추거나 파일이 훼손됨
  reference: |-
    ■ 공급망 관점
    - 대상: 널리 쓰이는 소규모 유틸리티 패키지와 이를 간접 의존하는 도구(CLI·프레임워크)
    - 특징: 메인테이너 권한이 정상이므로 계정 보안·출처 증명으로는 막을 수 없고, 버전 고정·검토 후 갱신만이 효과적(SCT-DP-05)
    - SLSA (A) '생산자 자체의 악의적 변경'에 해당
    ■ 실제 사례
    - [실제 사고] colors·faker 메인테이너 사보타주(2022-01): colors에 무한 루프를 넣고 faker를 비워 게시해 이를 쓰는 애플리케이션이 멈춤 (SCI-071)
    - [실제 사고] node-ipc 프로테스트웨어(peacenotwar)(2022-03): 러시아·벨라루스 IP로 판단되면 파일을 덮어쓰는 코드를 넣어 Vue CLI 등 간접 사용자에게 영향 (SCI-072)
  detect: |-
    ■ 탐지
    - 의존성 갱신 시 신규 버전의 동작 변화(파일 쓰기·지역 판단 코드·무한 루프)와 메인테이너의 공개 성명·이슈를 함께 모니터링
    - 악성 패키지 정보(OSV·GitHub 권고)를 의존성 검사에 연동해 철회 버전을 즉시 차단
    ■ 대응
    - 잠금 파일·버전 고정으로 검토 전 자동 수용을 막고 갱신은 지연·단계 적용
    - 철회·차단 목록(S2C2F ING-3)과 사내 미러로 문제 버전을 빠르게 걸러냄

SCT-SR-02.1:
  oneline: 탈취·관리자 권한으로 리뷰 없이 보호 브랜치에 악성 변경 반영
  summary: |-
    - 공격자는 탈취한 메인테이너·관리자 계정이나 리뷰 예외·자동 병합 결함을 이용해 리뷰 없이 기본 브랜치에 악성 코드·워크플로를 반영할 수 있음
    - 반영된 변경은 다음 빌드·릴리스에 그대로 실리고, 자동화 계정 커밋으로 위장하면 수천 개 저장소에 동시에 적용되어도 눈에 띄지 않음
  reference: |-
    ■ 공급망 관점
    - 대상: GitHub·GitLab 조직과 저장소의 보호 브랜치 규칙, 관리자 우회 권한, 자동 병합·봇 계정
    - 경로: 계정 탈취(SCT-SC-03.1·03.2)·토큰 탈취(SCT-SC-02.1) → 직접 푸시, 리뷰 규칙 예외 악용, 단일 행위자의 다중 계정(SLSA B1)
    - 연계: 워크플로를 바꾸면 곧바로 비밀 탈취로 이어짐(SCT-BD-01.2)
    ■ 실제 사례
    - [실제 사고] GhostAction(2025-09): 탈취한 메인테이너 계정으로 저장소 817개에 비밀 반출 워크플로를 커밋해 비밀 3,325건을 빼냄 (SCI-145)
    - [실제 사고] Megalodon(2026-05): 6시간 동안 저장소 5,561개에 자동화 계정처럼 꾸민 악성 커밋을 넣음 (SCI-165)
    - [실제 사고] ChainDrop(Mini Shai-Hulud 계열 npm 웜, keyv·cacheable)(2026-08): 메인테이너 GitHub 계정으로 악성 코드를 기본 브랜치에 바로 넣음 (SCI-166)
    - [실제 사고] Gentoo GitHub 조직 탈취(2018-06): 관리자 비밀번호 추측으로 조직을 장악해 파일 삭제 명령이 든 빌드 스크립트를 커밋 (SCI-029)
    - [실증] Homebrew CI 자동 병합 결함(버그 바운티)(2021-04): 자동 병합 워크플로가 변경 범위를 잘못 판정해 리뷰 없이 병합될 수 있음이 보고됨 (SCI-058)
  detect: |-
    ■ 탐지
    - 보호 브랜치에 리뷰 없이 들어온 커밋, 관리자 우회 병합, 짧은 시간 다수 저장소 커밋, 신규 워크플로 파일 추가를 감사 로그로 경보
    - 봇·자동화 계정 명의 커밋의 서명·실제 발신 토큰을 대조해 위장 커밋을 탐지
    ■ 대응
    - 관리자 포함 보호 브랜치 규칙 강제, 서명된 커밋 요구, 2인 리뷰·코드 소유자 승인(SLSA Source 트랙)
    - 개인 장기 토큰을 없애고 조직 단위 토큰 정책·SSO·피싱 저항 MFA를 적용

SCT-SR-02.2:
  oneline: 버전 태그를 악성 커밋으로 옮기고 커밋 작성자·이력을 위조
  summary: |-
    - 공격자는 저장소 쓰기 권한으로 기존 버전 태그를 악성 커밋으로 옮기거나 이력을 바꾸고, 커밋 작성자·시간을 신뢰받는 사람·봇으로 위조할 수 있음
    - 태그를 참조하는 모든 소비자가 다음 실행에서 곧바로 악성 코드를 받으며, 화면상 이력은 정상처럼 보여 사후 추적도 어려움
  reference: |-
    ■ 공급망 관점
    - 대상: GitHub Actions처럼 버전 태그로 참조되는 구성요소, 서명되지 않은 커밋, 강제 푸시가 허용된 브랜치·태그
    - 수법: 태그 강제 이동(force-push), 고아 커밋 참조, 작성자 메타데이터 복제(SLSA B2·B4)
    - 연계: 가변 참조로 자동 수용(SCT-DP-05), 서드파티 액션 오염(SCT-BD-04)
    ■ 실제 사례
    - [실제 사고] tj-actions/changed-files·reviewdog 액션 연쇄 침해(2025-03): changed-files의 버전 태그 전부가 비밀을 로그에 출력하는 악성 커밋으로 옮겨짐 (SCI-133, CVE-2025-30066)
    - [실제 사고] Trivy 침해(2026-03): trivy-action 태그 77개 중 76개와 setup-trivy 태그 전부가 자격증명 탈취 커밋으로 교체됨 (SCI-153, ATT&CK G1056)
    - [실제 사고] Checkmarx KICS·AST 액션과 Open VSX 확장 침해(2026-03): KICS 액션 태그 35개가 자격증명 탈취 코드로 바뀜 (SCI-154)
    - [실제 사고] 가짜 Dependabot 커밋(2023-07): 탈취 PAT로 Dependabot이 만든 것처럼 위장한 커밋을 수백 개 저장소에 넣음 (SCI-097)
  detect: |-
    ■ 탐지
