SCT-SR-03:
  oneline: SCM 서버 취약점·관리자 권한으로 저장소·리뷰 기록 전체 조작
  summary: |-
    - 공격자는 자체 호스팅 Git 서버·SCM 플랫폼의 취약점이나 관리자 권한을 이용해 저장소 내용·브랜치 보호·리뷰 기록을 마음대로 바꾸거나 소스를 빼낼 수 있음
    - 플랫폼 하나가 그 위의 모든 저장소의 신뢰 기반이라 영향이 전사로 번지고, 플랫폼 기록 자체가 조작되면 사후 검증도 어려움
  reference: |-
    ■ 공급망 관점
    - 대상: 자체 호스팅 GitLab·Bitbucket·Gitea·Gogs, 미러 서버, 플랫폼 관리자 계정
    - 경로: 인터넷 노출 SCM 서버의 원격 코드 실행·인증 우회 취약점, 관리자 권한 남용(SLSA C), 미러 동기화 경로 변조
    - 클라우드 매트릭스 연계: 공개 애플리케이션 취약점(CL-IA-01), 코드 저장소 수집(CL-CO-03)
    ■ 실제 사례
    - [실제 사고] PHP git 서버 위조 커밋(2021-03): 자체 호스팅 서버에 핵심 개발자 명의로 위장한 백도어 커밋 두 건이 올라와, PHP가 저장소를 GitHub로 옮김 (SCI-057)
    - [실제 사고] 오퍼레이션 오로라(2010-01): 공격자가 소스 코드 관리 시스템을 집중적으로 노려 소스를 가져감 (SCI-004)
    - [실제 사고] Juniper ScreenOS 무단 코드 삽입(2015-12): 소스에서 VPN 복호화·인증 우회 코드가 발견됐으나 삽입 경로가 밝혀지지 않음 (SCI-014)
    - [공개 취약점] 자체 호스팅 SCM 취약점 KEV 등재: GitLab CVE-2021-22205(원격 코드 실행)·CVE-2023-7028(비밀번호 재설정 계정 탈취), Bitbucket CVE-2022-36804, Gogs CVE-2025-8110 등 8건
  detect: |-
    ■ 탐지
    - SCM 관리자 작업(보호 규칙 해제·권한 변경·감사 로그 설정 변경)과 서버 프로세스의 이상 실행을 별도 로그 저장소로 보내 감시
    - 미러·백업과 원본 저장소의 커밋 그래프를 주기적으로 대조
    ■ 대응
    - SCM 서버의 인터넷 노출을 줄이고 KEV 등재 취약점을 최우선 패치, 관리자 계정은 별도 인증·최소 인원으로 운영
    - 커밋 서명 검증과 외부 투명성 로그(서명 기록)로 플랫폼 기록과 독립된 검증 수단을 확보
