# [SC] 비밀·자격증명 — 공급망 관점 문구
# 작성 규칙은 DE.yaml 머리말 참고

SCT-SC-01.1:
  oneline: 코드·이미지·패키지에 남은 비밀 노출로 저장소·클라우드 무단 접근
  summary: |-
    - 공격자는 공개 저장소·컨테이너 이미지·배포 패키지에 하드코딩되거나 빌드 중 남은 키·토큰을 수집해, 그 권한으로 저장소·클라우드·게시 계정에 접근할 수 있음
    - 커밋 이력·이미지 레이어·컴파일 파일처럼 눈에 띄지 않는 곳에 오래 남고, 게시·관리자 권한 토큰이면 공급망 전체 침해로 이어짐
  reference: |-
    ■ 공급망 관점
    - 대상: 공개 저장소의 설정 파일·커밋 이력, 컨테이너 이미지 레이어, 배포 패키지·바이너리, 외부 공유 링크(SAS 토큰 등)
    - 수법: 공개 저장소·이미지 레지스트리를 자동 검색해 키 수집(ATT&CK T1593.003), 지운 커밋·이미지 레이어에 남은 비밀 복원
    - 연계: 저장소 장악·파괴(SCT-IM-05), 게시 자격 악용(SCT-SC-02.2) / 클라우드 매트릭스 저장된 자격증명·비밀정보 수집(CL-CA-05)
    ■ 실제 사례
    - [실제 사고] Toyota T-Connect 접근 키 GitHub 공개 노출(2022-10): 외주 개발사가 접근 키를 하드코딩한 소스를 공개 저장소에 올려 약 5년간 노출됐고 고객 정보 약 29만 6천 건의 제3자 접근 가능성을 배제하지 못함 (SCI-084)
    - [실제 사고] 노출 자격증명으로 Git 저장소 삭제·몸값 요구(2019-05): 공개 설정 파일 등에 노출된 자격증명으로 저장소 수백 개의 커밋 이력을 지우고 몸값을 요구 (SCI-047)
    - [실증] PyPI·Python 관리자 GitHub 토큰 Docker 이미지 노출(2024-06): 빌드 과정에 남은 .pyc 때문에 조직 관리자 토큰이 공개 이미지에 1년 넘게 노출됐다가 발견 17분 만에 폐기됨 (SCI-124)
    - [실증] Microsoft AI 연구조직 SAS 토큰 노출(38TB)(2023-06): 저장소 계정 전체 권한의 SAS 토큰 링크를 공개 저장소에 넣어 직원 단말 백업·비밀 등 38TB가 노출됨 (SCI-095)
  detect: |-
    ■ 탐지
    - 커밋 전·푸시 시점·CI 단계에서 비밀 스캔을 하고, 저장소 이력·이미지 레이어·배포 패키지까지 정기 전수 점검
    - 플랫폼 비밀 스캔·푸시 보호 경보와 노출된 키의 사용 기록(새 IP·새 지역)을 연계 분석
    ■ 대응
    - 비밀은 비밀 저장소·워크로드 ID로 주입하고 코드·이미지에 넣지 않으며, 노출되면 삭제가 아니라 즉시 폐기·교체
    - 공유 링크·토큰은 최소 범위·짧은 만료로 발급하고, 외주 개발사 저장소에도 같은 비밀 관리 기준을 계약으로 적용

SCT-SC-01.2:
  oneline: 빌드 로그·아티팩트에 찍힌 비밀을 외부인이 수집해 악용
  summary: |-
    - 공격자는 공개 저장소의 빌드 로그·업로드 아티팩트·포크 빌드에 출력되거나 담긴 토큰·키를 내려받아, 그 권한으로 저장소·레지스트리·클라우드에 접근할 수 있음
    - 로그 마스킹은 인코딩·분할 출력으로 쉽게 우회되고 공개 로그는 누구나 볼 수 있어 노출 즉시 악용되지만, 피해는 노출된 비밀의 권한 범위에 한정됨
  reference: |-
    ■ 공급망 관점
    - 대상: 공개 저장소의 CI 실행 로그, 업로드 아티팩트(작업 디렉터리 전체·.git 설정 포함), 포크 PR 빌드에 전달되는 비밀
    - 수법: 침해된 액션이 러너 메모리의 비밀을 로그에 출력(SCT-BD-04), 아티팩트에 남은 토큰 수집, 플랫폼 결함으로 포크 빌드에 비밀 전달
    - 연계: 러너 비밀 수집(SCT-SC-02.1), 게시 자격 탈취(SCT-SC-02.2)
    ■ 실제 사례
    - [실제 사고] tj-actions/changed-files·reviewdog 액션 연쇄 침해(2025-03): 악성 커밋이 러너 메모리의 비밀을 공개 빌드 로그에 출력해 누구나 수집할 수 있게 됨 (SCI-133, CVE-2025-30066)
    - [실제 사고] Travis CI 포크 빌드 비밀 노출 결함(2021-09): 공개 저장소를 포크한 빌드에 원 저장소의 보호된 비밀이 노출되어 비밀 전체 교체를 권고 (SCI-062)
  detect: |-
    ■ 탐지
    - 공개 저장소의 실행 로그·아티팩트를 비밀 패턴(인코딩 변형 포함)으로 정기 점검하고, 로그에 긴 인코딩 문자열이 찍히면 경보
    - 노출 의심 비밀의 사용 기록을 레지스트리·클라우드 감사 로그에서 추적
    ■ 대응
    - 아티팩트에는 필요한 파일만 담고(.git·작업 디렉터리 전체 업로드 금지), 체크아웃 단계에서 자격증명을 남기지 않도록 설정
    - 포크 PR 빌드에는 비밀을 넘기지 않고, 로그 보존 기간을 줄이며 노출되면 즉시 폐기·교체

SCT-SC-02.1:
  oneline: 러너 환경변수·메모리·메타데이터에서 배포·게시 비밀 일괄 수집
  summary: |-
    - 공격자는 빌드 중 실행되는 악성 패키지·액션·스크립트로 러너의 환경변수·프로세스 메모리·클라우드 메타데이터에서 배포 키·게시 토큰·서명 자격을 한꺼번에 수집할 수 있음
    - 러너에는 운영 배포와 게시에 필요한 비밀이 모여 있어 한 번의 수집이 운영 환경·배포 경로 장악으로 이어지고, 정상 빌드 안에서 일어나 눈에 띄지 않음
  reference: |-
    ■ 공급망 관점
    - 대상: CI 러너의 환경변수·작업 프로세스 메모리, 클라우드 인스턴스 메타데이터, 러너에 남은 설정·자격증명 파일
    - 경로: 변조된 업로더 스크립트(SCT-PB-02.1)·서드파티 액션(SCT-BD-04)·악성 패키지 설치 스크립트(SCT-DP-03.2)·변조 워크플로(SCT-BD-01.2)
    - 도구: 비밀 탐색 도구 TruffleHog 악용(ATT&CK S9009), 러너 메모리 덤프(S9041)
    ■ 실제 사례
    - [실제 사고] Codecov Bash Uploader 변조(2021-01): 변조된 업로더 스크립트가 고객 CI 환경변수(토큰·키)를 약 두 달간 외부로 보냄 (SCI-055)
    - [실제 사고] Shai-Hulud 1차(npm 자가 전파 웜)(2025-09): 설치 후 스크립트가 TruffleHog로 비밀을 찾고 클라우드 메타데이터 키까지 수집 (SCI-147, ATT&CK S9008)
    - [실제 사고] Trivy 침해(2026-03): trivy-action 태그를 자격증명 탈취 커밋으로 옮겨 보안 스캐너를 돌리는 파이프라인의 토큰·키가 노출 (SCI-153, ATT&CK S9041)
    - [실제 사고] ChainDrop(Mini Shai-Hulud 계열 npm 웜, keyv·cacheable)(2026-08): 러너 메모리의 게시 토큰까지 빼내 다른 메인테이너의 패키지로 재게시 (SCI-166)
  detect: |-
    ■ 탐지
    - 빌드 작업의 외부 연결을 기준선과 비교하고, 러너 프로세스 메모리 읽기·메타데이터 엔드포인트 접근·비밀 탐색 도구 실행을 런타임 감시로 탐지
    - 비밀이 러너 밖(새 IP)에서 쓰이면 레지스트리·클라우드 감사 로그로 경보
    ■ 대응
    - 작업마다 필요한 비밀만 단계별로 주입하고, 장기 키 대신 작업 단위로 발급되는 단기 OIDC 자격을 사용
    - 러너의 외부 송신을 허용 목록으로 제한하고, 메타데이터 접근을 막거나 토큰 기반 접근·홉 제한을 적용

SCT-SC-02.2:
  oneline: 게시 토큰·OIDC 자격 탈취로 정상 게시 주체 명의 악성 버전 배포
  summary: |-
    - 공격자는 개발자 단말·러너·설정 파일에서 레지스트리 게시 토큰을 빼내거나 릴리스 작업 중 러너 메모리에서 OIDC 토큰을 꺼내, 정상 게시 주체 명의로 악성 버전을 올릴 수 있음
    - 신뢰 게시(OIDC)·출처 증명은 '정상 워크플로가 게시했다'는 사실만 보증해, 워크플로 안에서 탈취한 자격으로 올린 악성 버전도 정상으로 보임
  reference: |-
    ■ 공급망 관점
    - 대상: .npmrc·.pypirc의 게시 토큰, CI 비밀에 저장한 레지스트리·마켓플레이스 토큰, 신뢰 게시용 OIDC 토큰
    - 수법: 악성 버전 설치 스크립트로 피해자의 게시 토큰을 모아 다른 패키지 감염, 러너 메모리 덤프로 OIDC 토큰 추출, 다른 사고에서 빼낸 토큰 재사용(SCT-IM-01.2)
    - 결과: 정상 패키지·확장에 악성 버전 게시(SCT-PB-01)
    ■ 실제 사례
    - [실제 사고] ESLint(eslint-scope) 계정 탈취와 npm 토큰 수집(2018-07): 악성 버전이 설치 시 사용자의 .npmrc 게시 토큰을 빼내 다른 패키지까지 감염시키려 함 (SCI-030)
    - [실제 사고] Rspack npm 패키지 탈취 토큰 게시(채굴기)(2024-12): 탈취된 npm 토큰으로 @rspack/core·@rspack/cli 1.1.7이 게시되어 채굴기를 내려받음 (SCI-121)
    - [실제 사고] LiteLLM PyPI 악성 버전(2026-03): Trivy 침해 때 빼낸 PyPI 게시 토큰으로 1.82.7·1.82.8을 게시 (SCI-155, ATT&CK G1056)
    - [실제 사고] TanStack 침해(2026-05): 러너 메모리에서 꺼낸 OIDC 토큰으로 신뢰 게시를 거쳐 악성 버전 84개를 올렸고 출처 증명까지 정상으로 보임 (SCI-162, CVE-2026-45321)
  detect: |-
    ■ 탐지
    - 레지스트리 게시 이벤트를 소스 태그·CI 실행과 대조해 태그 없는 게시, 평소와 다른 게시 경로(로컬 게시·새 워크플로)를 경보
    - 짧은 시간 같은 계정의 다수 패키지 게시, 게시 직후 설치 스크립트 추가를 탐지
    ■ 대응
    - 장기 게시 토큰을 없애고 신뢰 게시(OIDC)로 전환하되, 게시 작업은 다른 작업과 분리된 보호 환경에서 최소 단계로 실행
    - 게시에 사람 승인·2FA 재확인을 요구하고, 게시 토큰은 패키지 단위·짧은 만료로 발급

SCT-SC-02.3:
  oneline: 과다 권한·장기 토큰과 교체 누락으로 침해 범위·기간 확대
  summary: |-
    - 공격자는 필요 이상 권한을 가진 장기 토큰이나 침해 뒤 교체에서 빠진 토큰을 이용해, 처음 침해보다 넓은 범위에 오래 접근하거나 수습된 사고를 다시 일으킬 수 있음
    - 단독으로는 피해가 없지만 다른 탈취·실행 위협의 피해 범위와 지속 기간을 결정하며, 토큰 목록이 없으면 교체 누락을 알기 어려움
  reference: |-
    ■ 공급망 관점
    - 대상: 조직 전체 권한의 PAT, 만료 없는 레지스트리·클라우드 토큰, 쓰기 권한이 기본값인 CI 토큰, 여러 저장소가 함께 쓰는 봇 계정
    - 연계: 러너 비밀 수집(SCT-SC-02.1)·게시 자격 탈취(SCT-SC-02.2)의 피해 범위를 키우고 연쇄 공급망 침해(SCT-IM-01.2)의 재료가 됨
    - 클라우드 매트릭스 연계: 유효 클라우드 계정 악용(CL-IA-07)
    ■ 실제 사례
    - [실제 사고] hackerbot-claw(2026-02): 워크플로 결함으로 Trivy 저장소의 쓰기 권한 토큰을 빼냈고, 이 토큰이 이후 TeamPCP 연쇄 침해의 출발점이 됨 (SCI-152)
    - [실제 사고] Trivy 침해(2026-03): 2월 침해 뒤 교체에서 빠진 토큰으로 3월 19일 악성 릴리스를 올리고 액션 태그를 변조 (SCI-153, ATT&CK G1056)
  detect: |-
    ■ 탐지
    - 조직의 토큰·키 목록(발급자·권한·만료·마지막 사용)을 유지하고, 미사용 장기 토큰과 조직 전체 권한 토큰을 정기 점검
    - 침해 대응 뒤 폐기 대상 토큰이 다시 쓰이면 즉시 경보
    ■ 대응
    - 토큰은 저장소·작업 단위 최소 권한과 짧은 만료로 발급하고, CI 기본 토큰 권한을 읽기 전용으로 설정(Scorecard Token-Permissions)
    - 침해 시 '노출 가능성이 있는 모든 토큰'을 기준으로 한 번에 교체하고, 교체 완료를 사용 기록으로 확인

SCT-SC-03.1:
  oneline: 레지스트리 사칭 피싱으로 메인테이너 계정·토큰 탈취
  summary: |-
    - 공격자는 레지스트리·플랫폼 지원팀을 사칭한 2FA 재설정·계정 검증·정책 위반 메일과 오타 도메인으로 메인테이너의 비밀번호·OTP·토큰을 가로채거나 악성 OAuth 앱 권한을 승인받을 수 있음
    - 인기 패키지 메인테이너 계정 하나로 주간 수십억 회 내려받는 패키지에 악성 버전이 실리고, OTP 방식 MFA·OAuth 동의는 피싱으로 우회됨
  reference: |-
    ■ 공급망 관점
    - 대상: npm·PyPI·크롬 웹스토어·GitHub 메인테이너와 게시 권한이 있는 직원·전 직원 계정
    - 수법: 한 글자 다른 도메인(npnjs.com·pypj.org·npmjs.help), OTP까지 입력받아 가로채는 중계 피싱, 정책 위반 공지로 위장한 OAuth 동의 피싱
    - 결과: 정상 패키지·확장 악성 버전 게시(SCT-PB-01) / 클라우드 매트릭스 피싱 기반 클라우드 계정 탈취(CL-IA-03)
    ■ 실제 사례
    - [실제 사고] chalk·debug 등 18개 패키지 탈취(2025-09): 가짜 2FA 재설정 메일(npmjs.help)로 계정이 탈취되어 주간 20억 회 이상 내려받는 패키지에 지갑 거래 가로채기 코드가 실림 (SCI-146)
    - [실제 사고] eslint-config-prettier 등 메인테이너 피싱 계정 탈취(2025-07): npm 지원팀을 사칭한 오타 도메인으로 토큰이 탈취되어 5개 패키지에 악성 버전이 게시 (SCI-139, CVE-2025-54313)
    - [실제 사고] Cyberhaven 등 크롬 확장 35종 탈취(2024-12): 정책 위반 공지를 가장한 피싱으로 악성 OAuth 앱 권한을 승인받아 MFA를 우회 (SCI-123)
    - [실제 사고] Ledger Connect Kit 악성 버전(2023-12): 전 직원의 npm 계정이 피싱으로 탈취되어 약 5시간 악성 버전이 게시 (SCI-096)
  detect: |-
    ■ 탐지
    - 메인테이너 계정의 새 위치 로그인·2FA 설정 변경·토큰 신규 발급·이메일 변경 직후 게시를 레지스트리 감사 로그로 상관 분석
    - 레지스트리·플랫폼 오타 도메인 등록을 모니터링하고 사칭 메일 신고를 받아 차단
    ■ 대응
    - 게시 권한 계정에 피싱 저항 MFA(FIDO2·패스키)를 의무화하고 게시에 별도 승인을 요구
    - 퇴직자·외부 기여자의 게시 권한을 즉시 회수하고, 메일 속 링크가 아닌 공식 주소로만 계정 작업을 하도록 메인테이너 교육

SCT-SC-03.2:
  oneline: 재사용 비밀번호·탈취 쿠키로 MFA 없는 메인테이너 계정 장악
  summary: |-
    - 공격자는 다른 곳에서 유출된 비밀번호·추측하기 쉬운 비밀번호·탈취한 브라우저 쿠키로 MFA가 없거나 우회되는 메인테이너·관리자 계정에 로그인할 수 있음
    - 오래 쓰지 않은 방치 계정일수록 노리기 쉽고, 장악 즉시 악성 버전 게시·저장소 변조·조직 파괴로 이어짐
  reference: |-
    ■ 공급망 관점
    - 대상: 레지스트리 메인테이너 계정(특히 오래 쓰지 않은 계정), GitHub 조직 관리자, 오픈소스 프로젝트 인프라 기여자 계정
    - 수법: 유출 비밀번호 대입, 관리자 비밀번호 추측, 정보탈취 악성코드로 얻은 세션 쿠키 재사용(MFA 우회)
    - 연계: 악성 버전 게시(SCT-PB-01), 저장소 변조(SCT-SR-02.1), 파괴(SCT-IM-05) / 클라우드 매트릭스 유효 클라우드 계정 악용(CL-IA-07)
    ■ 실제 사례
    - [실제 사고] ESLint(eslint-scope) 계정 탈취와 npm 토큰 수집(2018-07): 다른 곳에서 재사용한 비밀번호로 메인테이너 계정이 탈취되어 악성 버전이 게시 (SCI-030)
    - [실제 사고] Gentoo GitHub 조직 탈취(2018-06): 관리자 비밀번호를 추측해 조직을 장악하고 파일 전체 삭제 명령을 넣은 빌드 스크립트를 커밋 (SCI-029)
    - [실제 사고] Packagist 방치 계정 탈취(유출 비밀번호 재사용)(2023-05): 오래 쓰지 않던 계정 4개가 예전에 유출된 비밀번호로 장악되어 패키지 14개의 정보가 바뀜 (SCI-106)
    - [실제 사고] top.gg 기여자 쿠키 재사용과 가짜 PyPI 미러(2024-03): 탈취한 브라우저 쿠키로 기여자 계정에 들어가 악성 커밋을 넣었고 피해 사용자는 17만 명 이상으로 추정 (SCI-126)
  detect: |-
    ■ 탐지
    - 메인테이너·관리자 계정의 로그인 실패 급증, 오래 쓰지 않던 계정의 갑작스러운 로그인·게시, 같은 세션의 위치·기기 변경을 탐지
    - 유출 비밀번호 목록과 계정 비밀번호를 대조하고, 정보탈취 악성코드 유출 정보에서 조직 계정 세션을 모니터링
    ■ 대응
    - 게시·관리 권한 계정 전체에 MFA를 의무화하고, 세션을 기기에 묶고 수명을 짧게 설정
    - 일정 기간 쓰지 않은 계정의 게시 권한을 회수하고 조직 관리자 수를 최소화

SCT-SC-03.3:
  oneline: 만료된 메일 도메인 재등록·복구 경로로 방치 계정 장악
  summary: |-
    - 공격자는 메인테이너 이메일 도메인이 만료된 것을 찾아 재등록하고 비밀번호 재설정 메일을 받아, 비밀번호 없이 계정을 장악할 수 있음
    - 대상은 방치 계정으로 한정되지만, 장악하면 정상 계정으로 게시해 기존 사용자에게 악성 버전이 그대로 전달됨
  reference: |-
    ■ 공급망 관점
    - 대상: 개인·소규모 회사 도메인 메일을 쓰는 메인테이너 계정, 메일 주소가 공개된 레지스트리 메타데이터
    - 수법: 레지스트리 메타데이터에서 메인테이너 메일 도메인을 모아 만료 여부 확인 → 재등록 → 비밀번호 재설정
    - 연계: 유지보수 중단 패키지(OSS-RISK-4), 악성 버전 게시(SCT-PB-01)
    ■ 실제 사례
    - [실제 사고] ctx(PyPI) 만료 도메인 경유 계정 탈취(2022-05): 메인테이너 메일 도메인을 재등록해 비밀번호 재설정으로 계정을 장악하고 환경변수(AWS 키 등)를 외부로 보내는 버전을 게시 (SCI-075)
  detect: |-
    ■ 탐지
    - 사용 중인 의존성 메인테이너의 메일 도메인 만료·소유자 변경을 유지보수 상태 점검과 함께 확인
    - 오랫동안 갱신이 없던 패키지에 새 버전이 갑자기 게시되면 경보
    ■ 대응
    - 레지스트리 계정에 MFA를 켜고 복구 수단을 둘 이상 등록하며, 메인테이너는 소유 도메인 갱신을 관리
    - 유지보수가 끊긴 의존성은 대체하거나 내부 미러에 고정(S2C2F SCA-3 지원 종료 점검)
