# [BD] 빌드·CI/CD — 공급망 관점 문구
# 작성 규칙은 DE.yaml 머리말 참고

SCT-BD-01.1:
  oneline: 외부 PR로 신뢰된 파이프라인에서 코드 실행해 게시 자격 탈취
  summary: |-
    - 공격자는 포크 PR·브랜치 이름·이슈 제목 같은 외부 입력으로 pull_request_target 워크플로나 스크립트 주입 결함을 건드려, 저장소 권한으로 도는 파이프라인에서 코드를 실행할 수 있음
    - 계정 하나만 있으면 누구나 시도할 수 있고, 실행된 코드가 게시 토큰·OIDC 토큰·캐시에 닿아 정상 게시 주체 명의로 악성 버전이 배포됨
  reference: |-
    ■ 공급망 관점
    - 대상: GitHub Actions의 pull_request_target·workflow_run 트리거, PR 제목·브랜치 이름을 표현식으로 셸에 바로 넣는 단계, 외부 PR을 승인 없이 실행하는 자체 호스팅 러너
    - 수법: 포크 PR 코드를 권한 있는 작업에서 체크아웃·실행(Pwn Request), 입력값 셸 주입 → 캐시 오염(SCT-BD-02.2)·러너 비밀 수집(SCT-SC-02.1)·게시 자격 탈취(SCT-SC-02.2)로 이어감
    - 변형: AI 에이전트가 결함 있는 워크플로를 자동으로 찾아 여러 저장소에 시도(2026)
    ■ 실제 사례
    - [실제 사고] Ultralytics PyPI 침해(2024-12): PR 브랜치 이름을 그대로 셸에 넣는 결함과 캐시 오염으로 릴리스 단계에서 채굴기가 든 8.3.41·8.3.42가 게시됨 (SCI-119)
    - [실제 사고] s1ngularity(2025-08): Nx 저장소 워크플로의 주입 결함으로 npm 게시 토큰이 탈취되어 nx 악성 버전이 게시됨 (SCI-143)
    - [실제 사고] hackerbot-claw(2026-02): AI 에이전트로 보이는 계정이 pull_request_target·입력 주입 결함을 자동 탐색해 대형 저장소 여러 곳에서 코드를 실행하고 Trivy 저장소 쓰기 토큰을 빼냄 (SCI-152)
    - [실제 사고] TanStack 침해(2026-05): 포크 PR로 pull_request_target 워크플로를 실행해 캐시를 오염시키고 러너 메모리의 OIDC 토큰으로 패키지 42개에 악성 버전 84개를 게시 (SCI-162, CVE-2026-45321, ATT&CK G1056)
    - [실증] VS Code 저장소 CI 주입(2021-01): 외부 이슈·PR로 쓰기 권한 토큰을 얻어 저장소에 커밋할 수 있음을 보임 (SCI-068)
  detect: |-
    ■ 탐지
    - 워크플로 정적 점검(Scorecard Dangerous-Workflow 등)으로 권한 있는 트리거에서 PR 코드를 체크아웃하거나 외부 입력을 셸에 직접 넣는 단계를 찾아냄
    - 외부 PR이 실행한 작업의 외부 연결·캐시 저장·OIDC 토큰 요청·러너 프로세스 메모리 접근을 런타임 감시로 탐지
    ■ 대응
    - 권한 있는 트리거에서는 PR 코드를 실행하지 않고, 외부 입력은 환경변수로 받아 따옴표로 감싸 처리
    - 기본 GITHUB_TOKEN은 읽기 전용, 외부 기여자 실행은 승인 후 진행하고 게시 작업은 보호 환경(승인자 지정)을 거치는 별도 워크플로로 분리
    - 릴리스 작업이 PR 작업이 저장한 캐시를 복원하지 않도록 캐시 범위를 분리

SCT-BD-01.2:
  oneline: 탈취한 쓰기 권한으로 워크플로 변조해 저장소 비밀 대량 반출
  summary: |-
    - 공격자는 탈취한 계정·토큰의 저장소 쓰기 권한으로 워크플로·빌드 스크립트에 비밀 반출·백도어 코드를 넣어, 저장소에 연결된 비밀과 배포 권한을 그대로 쓸 수 있음
    - 봇·자동화 계정 커밋으로 위장해 리뷰를 피하고, 스크립트로 수백~수천 개 저장소에 동시에 적용되어 비밀 유출 규모가 커짐
  reference: |-
    ■ 공급망 관점
    - 대상: .github/workflows·.gitlab-ci.yml·Jenkinsfile 같은 파이프라인 정의와 빌드 스크립트, 그 파이프라인이 쓰는 저장소·조직 비밀
    - 경로: 탈취한 PAT·메인테이너 계정(SCT-SC-03.1·SCT-SC-03.2), 보호되지 않은 기본 브랜치 직접 푸시(SCT-SR-02.1)
    - 변형: 매 푸시마다 실행되는 반출 워크플로, 수동 실행형으로 숨겨 둔 휴면 백도어
    ■ 실제 사례
    - [실제 사고] 가짜 Dependabot 커밋(2023-07): 탈취한 PAT로 수백 개 저장소에 Dependabot 커밋으로 위장해 비밀 반출 코드를 워크플로에 심음 (SCI-097)
    - [실제 사고] GhostAction(2025-09): 탈취한 메인테이너 계정으로 저장소 817개에 반출 워크플로를 커밋해 npm·PyPI·Docker Hub 토큰 등 비밀 3,325건을 빼냄 (SCI-145)
    - [실제 사고] Megalodon(2026-05): 6시간 동안 저장소 5,561개에 build-bot·ci-bot 명의로 꾸민 악성 커밋 5,718건을 넣어 30여 종의 비밀을 수집 (SCI-165)
  detect: |-
    ■ 탐지
    - 워크플로 파일을 바꾸는 커밋을 따로 감시하고, 봇 명의인데 실제 앱·서명과 맞지 않는 커밋, 짧은 시간 다수 저장소 동시 변경을 경보
    - 실행 로그에서 신규 외부 전송, 비밀 전체 직렬화, 수동 실행 트리거(workflow_dispatch) 신규 추가를 탐지
    ■ 대응
    - 워크플로·빌드 스크립트 경로에 코드 소유자 리뷰와 브랜치 보호를 적용하고(Scorecard Branch-Protection) 직접·강제 푸시를 막음
    - 비밀을 환경별로 나눠 보호 브랜치·승인된 작업에서만 꺼낼 수 있게 하고, 작업별 토큰 권한을 최소화(Token-Permissions)

SCT-BD-02.1:
  oneline: 빌드 서버 침해로 정식 서명 산출물에 백도어 삽입
  summary: |-
    - 공격자는 빌드 서버·빌드 환경을 장악해 컴파일 직전 소스를 바꿔치기하거나 산출물에 악성 코드를 넣어, 정식 서명·업데이트 경로로 전 고객에게 배포할 수 있음
    - 저장소의 소스는 깨끗해 코드 리뷰·소스 점검으로 드러나지 않고, 정식 서명이 붙어 고객 쪽 검증도 통과함
  reference: |-
    ■ 공급망 관점
    - 대상: 상용 소프트웨어 공급사의 빌드 서버·빌드팜, 오픈소스 프로젝트의 배포본 빌드 서버, 빌드와 같은 망에 있는 서명 시스템
    - 수법: 빌드 과정에서만 소스를 바꾸는 상주 도구(SUNSPOT), 빌드 서버의 배포 파일 직접 변조, 개발자 단말 침해(SCT-DE-01.1)를 거친 빌드 환경 장악
    - 연계: 서명 키 악용(SCT-PB-03.1), 다운스트림 대량 침해(SCT-IM-01.1) / OT 매트릭스 공급망 침해(OTC-IA-07)
    ■ 실제 사례
    - [실제 사고] SolarWinds Orion 빌드 침해(2020-12): 빌드 서버의 SUNSPOT이 빌드 중에만 소스를 바꿔 정식 서명 업데이트에 SUNBURST를 넣었고 고객 약 1만 8천 곳이 설치 (SCI-052, ATT&CK C0024)
    - [실제 사고] 3CX 데스크톱 앱 이중 공급망 침해(2023-03): 직원 단말 감염을 발판으로 Windows·macOS 빌드 환경을 장악해 정식 서명 앱에 악성코드를 넣음 (SCI-090, ATT&CK C0057)
    - [실제 사고] CCleaner 빌드 침해(2017-09): 개발망 빌드 환경을 장악해 정식 서명된 5.33에 백도어를 넣었고 약 227만 대에 설치 (SCI-021)
    - [실제 사고] Webmin 빌드 서버 백도어(2019-08): GitHub 소스에는 없는 원격 명령 실행 백도어가 빌드 서버의 배포본에 1년 넘게 실림 (SCI-042, CVE-2019-15107)
  detect: |-
    ■ 탐지
    - 같은 소스를 독립된 환경에서 다시 빌드해 산출물 해시를 비교(재현 빌드)하고, 차이가 나면 배포를 멈춤
    - 빌드 서버의 빌드 도구·스크립트 무결성, 빌드 중 생성·변경되는 소스 파일, 비정상 상주 프로세스를 감시
    ■ 대응
    - 매번 새로 만드는 격리된 일회용 환경에서 빌드하고, 빌드 플랫폼이 서명한 출처 증명(SLSA Build L3)을 만들어 배포 전에 검증
    - 서명 시스템을 빌드 서버와 분리해 서명 요청을 출처 증명과 대조하고, 빌드 환경 접근은 전용 단말·MFA로 제한

SCT-BD-02.2:
  oneline: 낮은 권한 작업이 오염시킨 빌드 캐시로 릴리스 산출물 변조
  summary: |-
    - 공격자는 PR 검사처럼 권한이 낮은 작업에서 빌드 캐시·공유 디렉터리를 오염시켜, 같은 캐시를 복원하는 릴리스 작업이 악성 코드를 실행하거나 산출물에 담게 할 수 있음
    - 게시 워크플로 자체는 바뀌지 않아 리뷰·출처 증명이 정상으로 보이고, 캐시 키가 같으면 오염이 여러 실행에 걸쳐 남음
  reference: |-
    ■ 공급망 관점
    - 대상: GitHub Actions 캐시·의존성 캐시·컴파일 결과 캐시, 여러 작업이 함께 쓰는 러너 디렉터리·공유 볼륨
    - 수법: 외부 PR 실행(SCT-BD-01.1)으로 릴리스 작업과 같은 키의 캐시를 먼저 저장 → 복원 시 바뀐 의존성·스크립트가 실행됨
    - 대응 관점: 출처 증명은 '어느 워크플로가 만들었는가'를 보증할 뿐이라 캐시 오염은 빌드 과정 침해(SLSA E)로 따로 막아야 함
    ■ 실제 사례
    - [실제 사고] Ultralytics PyPI 침해(2024-12): PR 스크립트 주입과 캐시 오염으로 릴리스 단계에서 채굴기가 든 버전이 PyPI에 게시됨 (SCI-119)
    - [실제 사고] TanStack 침해(2026-05): 포크 PR로 캐시를 오염시킨 뒤 릴리스 작업 중 러너 메모리에서 OIDC 토큰을 꺼냈고, 게시 워크플로는 변조되지 않아 출처 증명까지 정상으로 보임 (SCI-162, CVE-2026-45321)
  detect: |-
    ■ 탐지
    - 캐시를 저장한 주체(PR·포크 실행)와 복원한 주체(릴리스·기본 브랜치)를 대조해, 릴리스가 PR 실행이 저장한 캐시를 쓰면 경보
    - 릴리스 산출물을 캐시 없이 다시 빌드한 결과와 비교
    ■ 대응
    - 릴리스·게시 작업은 캐시를 쓰지 않거나 보호 브랜치에서 만든 캐시만 복원하도록 범위를 분리
    - 권한이 낮은 작업과 높은 작업을 다른 러너·캐시 네임스페이스에서 실행하고, 의존성은 잠금 파일 해시로 다시 검증

SCT-BD-02.3:
  oneline: 상주형 자체 호스팅 러너 장악으로 이후 빌드·비밀에 지속 접근
  summary: |-
    - 공격자는 작업이 끝나도 초기화되지 않는 자체 호스팅 러너를 장악하거나 감염 단말을 러너로 등록해, 이후 실행되는 빌드·릴리스 작업과 그 비밀에 계속 접근할 수 있음
    - 러너는 내부망·클라우드 권한을 함께 가진 경우가 많아 CI 침해가 사내 인프라 침투로 이어지고, 정상 러너 통신이라 원격 제어가 눈에 띄지 않음
  reference: |-
    ■ 공급망 관점
    - 대상: 공개 저장소에 연결된 자체 호스팅 러너, 재사용되는 빌드 VM·컨테이너 이미지, 러너 등록 토큰
    - 수법: 승인 없이 외부 PR을 실행하는 러너에 상주 프로세스 설치(SCT-BD-01.1), 빌드 이미지 변조, 감염 단말을 공격자 저장소의 러너로 등록해 원격 명령 통로로 사용
    - 클라우드 매트릭스 연계: 악성·변조 이미지 실행(CL-EX-05)
    ■ 실제 사례
    - [실제 사고] Shai-Hulud 2차(2025-11): 감염 단말을 SHA1HULUD라는 자체 호스팅 러너로 등록하고 Discussions 본문을 셸로 실행하는 워크플로를 심어 원격 명령 실행 통로로 씀 (SCI-150, ATT&CK S9008)
    - [실증] PyTorch 자체 호스팅 러너 공격 실증(2024-01): 승인 없이 러너에서 실행되는 포크 PR로 러너를 장악해 릴리스·클라우드 비밀에 접근하고 악성 릴리스를 올릴 수 있음을 보임 (SCI-125)
  detect: |-
    ■ 탐지
    - 러너 등록·삭제와 등록 토큰 발급을 감사해 승인되지 않은 러너(낯선 이름·호스트)를 찾아내고, 러너 호스트의 상주 프로세스·예약 작업 변경을 감시
    - 작업이 없는 시간의 러너 외부 통신과 작업이 끝난 뒤 남는 파일·프로세스를 탐지
    ■ 대응
    - 공개 저장소에는 자체 호스팅 러너를 쓰지 않고, 쓰더라도 작업마다 새로 만드는 일회용 러너로 운영
    - 러너를 저장소·신뢰 수준별로 나누고 내부망·클라우드 권한을 최소화하며, 빌드 이미지는 서명·다이제스트로 고정

SCT-BD-03.1:
  oneline: 노출된 CI/CD 서버 취약점 악용으로 빌드·배포 경로 장악
  summary: |-
    - 공격자는 인터넷에 노출된 Jenkins·TeamCity 같은 CI/CD 서버의 인증 우회·원격 코드 실행 취약점이나 기본 설정을 악용해, 소스·비밀·배포 권한이 모인 서버를 장악할 수 있음
    - 장악한 서버는 모든 빌드와 고객 배포 경로에 닿아 빌드 주입과 내부 침투의 발판이 되고, 국가 배후 조직과 랜섬웨어 조직이 모두 노림
  reference: |-
    ■ 공급망 관점
    - 대상: 자체 운영 CI/CD 서버(Jenkins·TeamCity)와 플러그인, 코드 품질·아티팩트 서버, 관리 화면·API의 인터넷 노출
    - 수법: 공개 직후 취약점 대량 악용, 파일 읽기 취약점으로 SSH 키·비밀을 얻어 내부 이동, 기본 설정 서버의 소스 반출
    - 연계: 빌드 주입(SCT-BD-02.1), 공급업체 접근 경유 침입(SCT-CS-02.3)
    ■ 실제 사례
    - [실제 사고] TeamCity 취약점 대규모 악용(2023-12): 러시아 SVR이 인증 우회 취약점을 대규모로 악용했고 미·영·폴란드 기관이 SolarWinds형 공급망 공격 가능성을 경고 (SCI-109, CVE-2023-42793, ATT&CK G0016)
    - [실제 사고] Jenkins 취약점 경유 인도 결제망 랜섬웨어(2024-07): 노출된 Jenkins에서 SSH 키를 읽어 내부로 들어간 뒤 협력사 시스템에 랜섬웨어를 실행해 은행 수백 곳의 결제가 중단 (SCI-130, CVE-2024-23897)
    - [실제 사고] 노출된 SonarQube에서 소스 코드 탈취(2020-10): 기본 설정으로 노출된 서버에서 정부기관·기업 소스가 반출됨 (SCI-051)
    - [공개 취약점] CI/CD 서버 KEV 등재 10건: Jenkins 6건(CVE-2024-23897·CVE-2017-1000353 등), TeamCity 4건(CVE-2023-42793·CVE-2024-27198 등)
  detect: |-
    ■ 탐지
    - CI/CD 서버의 인터넷 노출 여부와 버전을 상시 점검해 KEV 등재 취약점이 있으면 최우선 경보
    - 신규 관리자·API 토큰 생성, 플러그인 설치, 비정상 빌드 작업·스크립트 콘솔 실행을 감사 로그로 탐지
    ■ 대응
    - 관리 화면·API는 인터넷에 노출하지 않고 VPN·제로 트러스트 접근 뒤에 두며, KEV 등재 취약점은 정해진 기한 안에 패치
    - 서버에 저장한 비밀은 외부 비밀 저장소로 옮기고 서버 권한을 최소화, 일회용 실행 구조나 서비스형 CI로 전환을 검토

SCT-BD-03.2:
  oneline: CI/CD SaaS 침해로 전 고객 저장 비밀이 한꺼번에 노출
  summary: |-
    - 공격자는 서비스형 CI/CD·개발 SaaS 공급자를 침해하거나 플랫폼 결함을 이용해, 그 서비스에 맡긴 모든 고객의 환경변수·토큰·키를 한꺼번에 얻을 수 있음
    - 고객은 침해 사실을 공급자 공지로만 알 수 있어 대응이 늦고, 맡겨 둔 비밀을 전부 교체해야 해 운영 부담이 큼
  reference: |-
    ■ 공급망 관점
    - 대상: 서비스형 CI/CD에 저장한 고객 비밀·프로젝트 토큰·SSH 키, 공급자 운영 시스템과 직원 단말
    - 경로: 공급자 직원 단말 침해(SCT-DE-01.1), 포크 빌드에 비밀이 전달되는 플랫폼 결함, 공급자가 보관한 연동 토큰 탈취(SCT-CS-03.1)
    - 클라우드 매트릭스 연계: 신뢰 관계(MSP·SaaS 연동) 악용(CL-IA-06)
    ■ 실제 사례
    - [실제 사고] CircleCI 엔지니어 단말 경유 고객 비밀 유출(2023-01): 엔지니어 노트북에서 훔친 SSO 세션으로 운영 시스템에 접근해 고객 환경변수·토큰·키를 빼냈고, 모든 고객에게 비밀 전체 교체를 권고 (SCI-091)
    - [실제 사고] Travis CI 포크 빌드 비밀 노출 결함(2021-09): 9월 3~10일 공개 저장소를 포크한 빌드에 원 저장소의 보호된 비밀이 노출되어 비밀 전체 교체를 권고 (SCI-062)
  detect: |-
    ■ 탐지
    - 공급자 보안 공지·상태 페이지를 구독하고, 공급자에 맡긴 비밀이 공급자 밖(새 IP·새 지역)에서 쓰이는지 클라우드·레지스트리 감사 로그로 감시
    - 비밀마다 보관처 표시를 붙여 유출 시 어느 서비스에 맡긴 비밀인지 바로 추적
    ■ 대응
    - CI/CD SaaS에는 장기 비밀 대신 OIDC 기반 단기 자격(워크로드 ID 연동)을 쓰고, 저장 비밀의 범위·수명을 최소화
    - 공급자별 비밀 목록과 일괄 교체 절차를 미리 마련하고, 계약에 보안 요구사항과 침해 통지 기한을 명시(SSDF PO.1)

SCT-BD-04:
  oneline: 침해된 서드파티 CI 액션·빌드 도구로 파이프라인 비밀 대량 탈취
  summary: |-
    - 공격자는 많은 파이프라인이 가져다 쓰는 서드파티 액션·플러그인·보안 스캐너를 침해해 버전 태그를 악성 커밋으로 옮기거나 악성 릴리스를 올려, 이를 실행하는 모든 파이프라인의 비밀을 빼낼 수 있음
    - 액션은 그 작업의 비밀 전체에 접근하고 태그 참조로 즉시 전파되며, 빼낸 비밀이 다음 도구 침해로 이어져 연쇄 공격이 됨
  reference: |-
    ■ 공급망 관점
    - 대상: GitHub Actions 마켓플레이스 액션·재사용 워크플로, CI 플러그인, 파이프라인에서 실행하는 보안 스캐너·CLI 도구
    - 수법: 메인테이너 PAT 탈취 후 기존 버전 태그를 악성 커밋으로 일괄 이동(SCT-SR-02.2), 러너 메모리 덤프로 비밀 수집(SCT-SC-02.1), 빼낸 토큰으로 다른 도구 침해(SCT-IM-01.2)
    - 확산 조건: 태그·브랜치 참조(SCT-DP-05) — 커밋 해시로 고정한 저장소는 피해를 피함
    ■ 실제 사례
    - [실제 사고] tj-actions/changed-files·reviewdog 액션 연쇄 침해(2025-03): reviewdog 침해를 거쳐 얻은 PAT로 changed-files 태그 전부를 비밀 출력 커밋으로 옮겼고 약 2만 3천 개 저장소가 영향권 (SCI-133, CVE-2025-30066·CVE-2025-30154)
    - [실제 사고] Trivy 침해(2026-03): 교체에서 빠진 토큰으로 악성 릴리스를 올리고 trivy-action 태그 77개 중 76개를 옮겨 보안 스캐너를 돌리는 파이프라인의 비밀이 노출 (SCI-153, CVE-2026-33634, ATT&CK G1056)
    - [실제 사고] Checkmarx KICS·AST 액션과 Open VSX 확장 침해(2026-03): 앞서 빼낸 CI 비밀을 재사용해 KICS 액션 태그 35개를 자격증명 탈취 코드로 바꿈 (SCI-154)
    - [실제 사고] Bitwarden CLI npm 악성 버전(2026-04): 침해된 GitHub Action을 거쳐 악성 버전이 npm에 약 1.5시간 게시됨 (SCI-160)
  detect: |-
    ■ 탐지
    - 사용 중인 서드파티 액션과 참조 방식(태그·해시)을 수집하고, 상류 태그가 가리키는 커밋이 바뀌면 경보
    - 실행 로그에 비밀·인코딩 문자열이 출력되거나 러너 프로세스 메모리 접근·외부 전송이 생기면 런타임 감시로 탐지
    ■ 대응
    - 서드파티 액션은 전체 커밋 해시로 고정하고(Scorecard Pinned-Dependencies) 조직 차원 허용 목록으로 승인된 액션만 실행
    - 액션이 도는 작업에는 필요한 비밀·권한만 넘기고, 침해 공지 시 해당 기간 실행 로그 점검과 비밀 일괄 교체
