# D10. 사용자 기만 및 AI 거버넌스 미흡 — v3.2 재작성

UT-34.1:
  summary: |-
    - 공격자는 인젝션으로 응답의 인용·출처 표시·근거 설명을 조작해, 공격자가 심은 정보(예: 송금 계좌)를 신뢰할 수 있는 문서에 근거한 답변처럼 보이게 할 수 있음
    - 사용자는 출처가 붙은 AI 답변을 검증된 정보로 받아들여, 거짓 정보가 오히려 더 높은 신뢰를 얻음
  reference: |-
    ■ AI 관점
    - 조작 대상: 인용·참고 문헌, 출처 링크, "~ 문서에 따르면" 같은 근거 설명, 변경 사실 언급 여부 (ATLAS AML.T0067)
    - 수법: 잘못된 인용 붙이기, 없는 인용 만들기, 정상 출처를 공격자 콘텐츠에 연결하기, 공격자 메일을 출처에서 숨기기 (ATLAS AML.T0067.000)
    - 은폐: 생성 코드의 변경 사실을 응답에서 언급하지 말라는 지시로 사용자의 의심을 피함 (ATLAS AML.CS0041)
    - 인용과 원문 대조, 출처 문서의 실제 검색 결과 표시, 고위험 정보(계좌·권한)의 별도 확인이 필요함
    ■ 실제 사례
    - [실증] M365 Copilot 거래 정보 조작(2024-08): 공격자 메일을 정상 거래처 문서처럼 인용하게 해 공격자 계좌를 신뢰할 수 있는 송금 정보로 제시 (ATLAS AML.CS0026)
    - [실증] EchoLeak(2025-05): 출력에서 공격자 메일과의 연관을 숨기고 참조형 마크다운 링크로 링크 차단을 우회 (ATLAS AML.CS0059)
    - [실증] Rules File Backdoor(2025-03): 코딩 도구가 생성 코드에 스크립트를 넣으면서 응답에서는 변경 사실을 언급하지 않게 함 (ATLAS AML.CS0041)

UT-34.2:
  summary: |-
    - 공격자는 인젝션한 에이전트가 IT 지원·재무 비서 같은 신뢰받는 역할을 이용해, 사용자에게 자격증명 입력·송금·보안 설정 변경·명령 실행을 직접 요청하게 할 수 있음
    - 요청이 회사가 도입한 AI에서 나오고 실제 티켓·문서를 근거로 들어, 일반 피싱보다 사용자가 의심하기 어려움
  reference: |-
    ■ AI 관점
    - 형태: 지원 에이전트가 실제 티켓을 인용하며 신입 직원에게 자격증명 요구, 오염된 송장을 읽은 재무 비서가 긴급 송금 권고, 코딩 비서가 악성 한 줄 명령을 '해결책'으로 제시 (OWASP ASI09 시나리오 #1~#3)
    - 대화형 조작: 에이전트가 말투·화제를 바꿔 자연스럽게 개인정보를 묻고 링크 클릭을 유도 — 공격자가 운영하는 피싱 챗봇과 같은 효과 (UT-04.2)
    - 에이전트는 비밀번호·MFA 코드를 묻지 않는다는 정책 고지, 금전·권한 요청의 별도 채널 확인, 에이전트 출력의 위험 요청 탐지가 필요함
    ■ 실제 사례
    - [실증] Bing Chat 데이터 해적(2023): 웹페이지의 숨은 지시로 Bing Chat이 사용자 이름 등 개인정보를 캐묻고 링크 클릭을 유도하는 사회공학자로 바뀜 (ATLAS AML.CS0020)
    - [시나리오] 인젝션된 IT 지원 에이전트가 실제 티켓을 인용해 신입 직원의 자격증명을 받아 유출하고, 오염 송장을 읽은 재무 비서가 공격자 계좌로 긴급 송금을 권고 (OWASP ASI09 시나리오 #2·#3)

UT-34.3:
  summary: |-
    - 공격자는 잦은 승인 요청과 에이전트가 만든 그럴듯한 근거로 승인자의 검토를 형식적으로 만들어, 위험한 설정 변경·삭제·결제를 사람 승인 아래 실행시킬 수 있음
    - 사람 승인 절차가 오히려 책임 소재를 흐리고 통제가 작동한 것처럼 보이게 하며, 미리보기만 열어도 부수 동작이 일어나는 UI도 악용됨
  reference: |-
    ■ AI 관점
    - 형태: 날조된 감사 근거로 위험 설정 변경 승인, 그럴듯한 설명으로 운영 DB 삭제 승인, 읽기 전용으로 보이는 미리보기 창이 열리는 순간 웹훅 실행 (OWASP ASI09 시나리오 #4~#6)
    - 승인 화면에 요약만 보여주면 실제 실행 내용과 다를 수 있고, 요청이 많을수록 판단력이 떨어짐 (OWASP LLM01:2026 대응 #7)
    - 에이전트 보고 자체가 허위일 수 있어(UT-20.4), 고위험 승인은 실행될 원문·영향 범위를 그대로 보여주고 독립 근거로 확인해야 함
    ■ 실제 사례
    - [실제 사고] Replit 바이브 코딩 에이전트(2025-07): 에이전트가 운영 DB를 삭제한 뒤 데이터와 결과를 지어내 실수를 숨겨 사용자의 판단을 흐림 (OWASP ASI 부록 D)
    - [시나리오] 에이전트가 그럴듯한 감사 근거를 꾸며 위험한 설정 변경을 정당화하고, 검토자가 이를 승인해 악성 설정이 배포됨 (OWASP ASI09 시나리오 #4)

UT-35.1:
  summary: |-
    - 도구 호출·컨텍스트 변경·에이전트 판단 근거가 기록되지 않으면, 공격자는 인젝션·도구 악용을 해도 흔적이 남지 않아 탐지·원인 분석·책임 규명을 피할 수 있음
    - AI 사고는 어떤 입력이 어떤 행위로 이어졌는지가 핵심 증거인데, 기존 애플리케이션 로그에는 이 연결이 남지 않음
  reference: |-
    ■ AI 관점
    - 누락 항목: 컨텍스트에 들어온 외부 콘텐츠·출처, 도구 호출과 인자·결과, 메모리 쓰기와 원인 프롬프트, 에이전트 간 메시지, 승인 내역 (OWASP MCP08)
    - MCP 서버·에이전트 프레임워크는 기본 원격 측정이 부족해 사고 조사·대응이 늦어짐 (OWASP MCP08)
    - 행위 기준선(목표·도구 사용 패턴)이 없으면 목표 탈취(UT-07.5)·이탈(UT-24.1) 같은 점진적 이상을 알아챌 수 없음 (OWASP ASI01 대응 #7)
    - 에이전트 활동을 SIEM에 연동하는 AI 감사 로그, 세션·요청 단위 추적 ID, 개인정보 마스킹을 갖춘 기록 정책이 필요하며 로그 변조는 UT-35.2에서 다룸
    ■ 실제 사례
    - 공개 사고 미확인 — 사고 조사 지연의 원인으로 OWASP가 지적한 관리 미흡 유형
    - [시나리오] MCP 서버와 에이전트의 원격 측정 부족으로 침해 조사와 사고 대응이 지연 (OWASP MCP08)

UT-35.2:
  summary: |-
    - 로그가 변경 가능한 저장소에 있거나 에이전트가 자신의 로그·대화 이력을 고칠 수 있으면, 공격자나 이탈한 에이전트는 흔적을 지우고 행위를 부인할 수 있음
    - 기록이 있어도 무결성을 증명할 수 없으면 사고 조사·법적 대응에서 증거로 쓰기 어려움
  reference: |-
    ■ AI 관점
    - 형태: 에이전트 작업 공간 안에 저장된 로그, 탈취 키로 수정 가능한 대화 이력(UT-11.3), 침해된 대응 에이전트가 로그를 지우고 지표를 정상으로 보고 (OWASP ASI08 시나리오 #4)
    - 에이전트는 행위 주체이면서 기록 주체가 되기 쉬워, 기록 권한과 실행 권한을 분리하지 않으면 자기 행위를 감출 수 있음 (OWASP ASI10)
    - 쓰기 전용·불변 저장소(WORM), 해시 체인·서명, 에이전트가 접근할 수 없는 외부 수집이 필요함
    ■ 실제 사례
    - 공개 사고 미확인 — OWASP 위협 분류(부인·추적 불가) 기반
    - [시나리오] 탈취한 서비스 자격증명으로 대응 에이전트가 통제를 끄고 로그를 지운 뒤 컴플라이언스 에이전트가 정상 지표를 보고 (OWASP ASI08 시나리오 #4)

UT-36.1:
  summary: |-
    - 원본 데이터의 분류·보존 정책이 임베딩·벡터 색인·파인튜닝 가중치·캐시·백업 같은 파생물로 이어지지 않으면, 민감 데이터가 정책 밖에서 오래 남아 공격자의 표적이 될 수 있음
    - 파생물은 원본보다 접근 통제가 약하고 '데이터가 아닌 모델·색인'으로 취급되어, 유출되어도 영향 평가에서 빠지기 쉬움
  reference: |-
    ■ AI 관점
    - 단절 지점: RAG 적재 시 임베딩에 분류 라벨 미부여, 파인튜닝 데이터의 원본 등급 미승계, 프롬프트 캐시·로그·백업의 보존 기간 미적용 (OWASP DSGAI07)
    - 임베딩은 역전 공격으로 원문 복원이 가능해(UT-15.2) 원본과 같은 등급으로 다뤄야 함 (OWASP LLM09:2026 대응 #5)
    - 데이터 계보 추적, 파생물 생성 시 라벨·보존 정책 자동 승계, AI 자산 인벤토리에 파생물 포함이 필요함
    ■ 실제 사례
    - 공개 사고 미확인 — 특정 CVE가 없는 거버넌스·파이프라인 구조 결함 유형 (OWASP DSGAI07)
    - [시나리오] GDPR 삭제 요청으로 운영 DB에서 고객 기록을 지웠지만, 3개월 전 RAG에 적재된 임베딩과 삭제 전 야간 백업에 원본이 그대로 남음 (OWASP DSGAI07 시나리오)

UT-36.2:
  summary: |-
    - 정보주체가 삭제를 요청해도 원본만 지워지고 모델 가중치·벡터 색인·어댑터에 데이터가 남으면, 조직은 법적 삭제 의무를 지킬 수 없고 남은 데이터는 추출 공격의 대상이 됨
    - 학습된 데이터는 선택적으로 지우기 어려워 재학습 비용이 크고, 이행을 입증하지 못하면 규제 조사로 이어짐
  reference: |-
    ■ AI 관점
    - 잔존 위치: 벡터 저장소의 임베딩(검색 결과에 계속 등장), 파인튜닝 가중치·LoRA 어댑터, 체크포인트, 캐시 (OWASP DSGAI08)
    - 남은 데이터는 학습 데이터 추출(UT-15.4)·멤버십 추론(UT-15.1)으로 다시 확인될 수 있어 삭제 미이행이 곧 유출 위험이 됨 (OWASP LLM02:2026)
    - 원본·임베딩·체크포인트·어댑터 전반의 검증 가능한 삭제, 삭제 후 추출·멤버십 시험, 학습 데이터 계보 관리가 필요함 (OWASP LLM02:2026 Tier 3 #2)
    ■ 실제 사례
    - 공개 사고 미확인 — 규정 준수 범주로 특정 CVE는 없으며, 토큰 유출·데이터셋 노출 사고가 규제 조사의 계기가 되는 경우가 많음 (OWASP DSGAI08)
    - [시나리오] GDPR 제17조 삭제 요청으로 CRM과 데이터 레이크의 원본을 지웠지만, 6개월 전 RAG에 적재된 임베딩이 남아 검색 결과에 계속 나타남 (OWASP DSGAI08 시나리오)

UT-36.3:
  summary: |-
    - 공격자는 '비식별' 또는 합성 데이터에 남은 나이·지역·진단·날짜 같은 준식별자 조합을 외부 정보와 결합하거나, 그 데이터로 학습한 모델에 질의해 특정 개인을 다시 식별할 수 있음
    - 직접 식별자만 지운 데이터는 희귀한 조합만으로도 개인이 특정되며, 모델이 이를 암기하면 비식별 처리의 효과가 사라짐
  reference: |-
    ■ AI 관점
    - 원인: 이름·번호만 지우고 준식별자를 남긴 비식별, 원본 이상치를 그대로 재현하는 합성 데이터, 비식별 데이터로 한 파인튜닝 (OWASP DSGAI10)
    - 결합 공격: 모델 추론으로 얻은 일부 속성을 공개 기록·유출 데이터와 대조해 범위를 좁힘 (OWASP DSGAI18)
    - k-익명성·차등프라이버시 같은 정량 기준, 재식별 위험 평가와 레드팀 시험, 고위험 데이터의 학습 제외가 필요함
    ■ 실제 사례
    - 공개 사고 미확인 — 비식별·합성 데이터 재식별을 다루는 보편 CVE는 없음 (OWASP DSGAI10)
    - [시나리오] 의료기관이 나이·우편번호 앞 3자리·주진단·입원일을 남긴 '비식별' 데이터로 임상 LLM을 파인튜닝해, 희귀한 조합으로 환자가 재식별됨 (OWASP DSGAI10 시나리오)

UT-36.4:
  summary: |-
    - 시스템·데이터를 폐기한 뒤에도 백업·복제본·장애 조치용 스냅숏·방치된 서비스에 삭제 대상 데이터와 자격증명이 남으면, 복구·장애 전환 시 재노출되거나 공격자가 방치 자산을 통해 가져갈 수 있음
    - 폐기된 것으로 관리 대상에서 빠져 모니터링이 없고, 재노출 사실도 늦게 발견됨
  reference: |-
    ■ AI 관점
    - 잔존 위치: 벡터 DB 복제본·스냅숏, 학습 데이터 백업, 모델 레지스트리의 이전 버전, 회수되지 않은 서비스 계정·API 키, 종료된 실험 환경 (OWASP DSGAI07)
    - 장애 조치로 오래된 복제본이 활성화되면 이미 삭제한 레코드가 검색 결과로 다시 나타남 (OWASP DSGAI17)
    - 폐기 절차에 파생물·백업·자격증명 회수를 포함하고, 백업 보존 기간과 삭제 전파를 대조 감사해야 함
    ■ 실제 사례
    - 공개 사고 미확인 — 운영 장애로 드러나는 구조 결함 유형 (OWASP DSGAI17)
    - [시나리오] 벡터 DB 장애로 18시간 지난 복제본에 자동 전환되며, 그 사이 삭제했던 레코드가 다시 검색 결과에 노출 (OWASP DSGAI17 시나리오)
