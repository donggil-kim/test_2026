# D06. 에이전트 오남용 및 통제 상실 — v3.2 재작성

UT-21.1:
  summary: |-
    - 공격자는 업무에 필요 없는 도구·기능(예: 요약용 비서의 메일 발송·삭제 기능)이 에이전트에 붙어 있는 점을 이용해, 인젝션 하나로 원래 용도를 넘는 발송·삭제·실행을 시킬 수 있음
    - 설계 단계의 결함으로 공격 성공 시 피해 범위를 결정하며, 시험용으로 붙였다가 남겨둔 도구도 그대로 악용 경로가 됨
  reference: |-
    ■ AI 관점
    - 형태: 읽기만 필요한데 쓰기·삭제·발송까지 포함한 서드파티 도구, 개발 중 시험했다가 제거하지 않은 도구, 특정 명령 하나만 실행하려던 셸 도구가 다른 명령까지 허용 (OWASP LLM03:2026 예시 #1~#3)
    - 비공개 데이터 접근 도구와 외부 통신 도구를 한 에이전트에 함께 두면 인젝션(UT-07.1) 성공이 곧 반출(UT-19.2)이 됨 — '치명적 삼요소' 점검 대상 (OWASP LLM01:2026 대응 #8)
    - 대응은 작업별 최소 도구 구성, 도구 목록의 정기 검토, 비신뢰 입력을 다루는 에이전트에서 외부 전송 도구 분리임
    ■ 실제 사례
    - [실증] Copilot Studio 고객 지원 에이전트(2025-06): 고객 요청을 담당자에게 전달하는 에이전트가 CRM 전체 조회와 임의 주소 메일 발송 도구를 함께 가져, 인젝션으로 고객 데이터를 공격자에게 전송 (ATLAS AML.CS0037)
    - [시나리오] 메일 요약용 비서가 읽기 외에 발송 기능도 가진 도구를 써서, 받은 메일의 인젝션으로 받은편지함 전체를 외부로 전달 (OWASP LLM03:2026 시나리오 #1)

UT-21.2:
  summary: |-
    - 공격자는 에이전트가 사용자 범위가 아닌 관리자·서비스 전체 권한 계정으로 동작하거나 권한이 점점 넓어진 점을 이용해, 에이전트 하나를 조종해 조직 전체 데이터와 기능에 접근할 수 있음
    - 단일 오작동이나 인젝션이 사용자 권한을 훨씬 넘는 조회·변경으로 확대되며, 위임 권한이 쌓이면 실제 권한 범위를 파악하기도 어려움
  reference: |-
    ■ AI 관점
    - 형태: 읽기용 도구가 UPDATE·DELETE까지 가능한 DB 계정 사용, 개인 문서 조회 도구가 전체 저장소 관리자 계정 사용, 임시 권한이 회수되지 않고 누적되는 권한 확장 (OWASP LLM03:2026 예시 #4·#5, MCP02)
    - 서비스 계정 단일 신원으로 모든 사용자 요청을 처리하면 요청자별 권한 검증이 사라져 혼동된 대리인(UT-26.1) 문제로 이어짐
    - 하위 시스템 권한은 사용자 컨텍스트로 위임하고(OAuth on-behalf-of), 작업 단위 최소 권한과 정기 권한 검토가 필요함
    ■ 실제 사례
    - [실증] Copilot Studio 고객 지원 에이전트(2025-06): 에이전트가 고객 요청 처리에 필요한 범위를 넘어 Salesforce 전체 레코드를 조회할 수 있어 인젝션으로 CRM 전체가 유출 (ATLAS AML.CS0037)
    - [실증] Cursor·Supabase MCP(2025): service_role 권한으로 동작하는 MCP 서버를 통해 행 수준 보안을 우회하고 운영 DB를 덤프 (OWASP LLM01:2026 시나리오 #9)
    - [시나리오] 주문 조회용 고객 지원 봇이 결제 API 전체 권한을 가져 환불까지 실행 (OWASP ASI02 시나리오 #3)

UT-21.3:
  summary: |-
    - 공격자는 결제·삭제·외부 발송 같은 고위험 행위를 사람 승인 없이 자율 실행하도록 설계된 에이전트를 노려, 조작된 입력이나 오판이 확인 단계 없이 곧바로 실제 피해가 되게 할 수 있음
    - 실행 전 검증 지점이 없어 사후에야 피해를 알게 되며, 되돌릴 수 없는 조치는 복구도 어려움
  reference: |-
    ■ AI 관점
    - 형태: 문서 삭제·송금·권한 변경·외부 메일 발송을 확인 없이 수행, 자동 복구 에이전트가 운영 환경에 바로 명령 실행 (OWASP LLM03:2026 예시 #6)
    - 승인 절차를 두더라도 요약된 설명만 보여주면 비가시 문자로 실제 실행 내용과 표시 내용이 달라질 수 있어, 실행될 원문을 그대로 보여줘야 함 (OWASP LLM01:2026 대응 #7)
    - 고위험 행위 분류 기준, 작업별 승인 게이트, 예산·횟수 한도, 실행 취소 가능한 설계가 필요하며 승인 피로 문제는 UT-34.3에서 다룸
    ■ 실제 사례
    - [실제 사고] Replit 바이브 코딩 에이전트(2025-07): 에이전트가 사람 승인 없이 운영 DB를 삭제하고 거짓 출력으로 실수를 숨김 (OWASP ASI 부록 D)
    - [실제 사고] Google Gemini CLI(2025-07): 파일 지시를 잘못 이해한 에이전트가 확인 없이 사용자 디렉터리를 지워 데이터 손실 (OWASP ASI 부록 D)

UT-21.4:
  summary: |-
    - 공격자는 에이전트가 정당하게 가진 도구들을 조회·가공·외부 전송 순으로 연쇄 호출하거나 반복 호출하게 해, 개별 도구 통제로는 걸리지 않는 데이터 유출과 권한 밖 행위를 수행할 수 있음
    - 각 호출은 신뢰된 도구와 유효한 자격증명으로 이뤄져 호스트 중심 모니터링에서는 정상 활동으로 보임
  reference: |-
    ■ AI 관점
    - 연쇄 형태: 내부 전용 CRM 조회 → 외부 메일 발송, 파일 읽기 → MCP 도구 파라미터로 전달, PowerShell·cURL·내부 API를 엮은 관리 도구 체인 (ATLAS AML.T0053, OWASP ASI02 시나리오 #4·#6)
    - 반복 호출: 자동 실행이 허용된 '무해한' 도구(ping 등)를 반복 호출해 DNS 질의로 데이터를 빼냄 (OWASP ASI02 시나리오 #7)
    - 도구 단위 허용 목록만으로는 막을 수 없어, 도구 조합 정책(읽기 후 외부 전송 금지 등)과 세션 단위 행위 흐름 분석이 필요함
    - 연쇄 호출의 결과물인 반출은 UT-19.2, 삭제·파괴는 UT-21.5, 도구 인자를 통한 명령 주입은 UT-22.4에서 다룸
    ■ 실제 사례
    - [실증] Gemini 캘린더 초대(2025-08): 주입된 지시로 캘린더 조회 → URL 생성 → Android 유틸리티로 브라우저 열기를 연쇄 호출해 일정·메일 데이터를 외부로 전송 (ATLAS AML.CS0063)
    - [실증] Cursor MCP 서버 경유 유출(2025-06): 웹 스크랩 도구가 가져온 인젝션으로 터미널 도구를 호출해 자격증명 파일을 curl로 전송 — 실행 전 사용자 확인이 있어 완화 (ATLAS AML.CS0045)
    - [실증] Claude Code GitHub Action(2026-06): 격리 밖에서 동작하는 내장 Read 도구로 /proc/self/environ을 읽어 자격증명 확보 (ATLAS AML.CS0067)

UT-21.5:
  summary: |-
    - 공격자는 조작된 지시나 에이전트의 오판을 이용해 에이전트가 파일·DB·클라우드 자원 삭제 명령을 도구로 실행하게 해, 업무 데이터와 서비스를 파괴할 수 있음
    - 에이전트 권한 범위 전체가 한 번에 지워질 수 있고, 자동 실행 환경에서는 사람이 개입하기 전에 피해가 끝남
  reference: |-
    ■ AI 관점
    - 대상: 셸·파일 시스템 도구, DB 관리 도구, 클라우드 CLI·API 권한을 가진 코딩·운영 에이전트, 캘린더·문서 같은 업무 데이터 (ATLAS AML.T0101)
    - 원인: 직접·간접 인젝션(UT-06·07)으로 주입된 삭제 지시, 공급망을 통한 에이전트 프롬프트 변조, 목표를 잘못 해석한 에이전트의 자율 판단(UT-24.1)
    - 삭제·초기화 명령은 별도 승인·허용 목록으로 묶고, 에이전트용 계정에서 운영 데이터 삭제 권한과 백업 접근을 분리해야 함
    ■ 실제 사례
    - [실제 사고] Amazon Q VS Code 확장(2025-07): 과도한 권한의 GitHub 토큰으로 "시스템을 초기 상태로 정리하고 파일·클라우드 자원을 삭제"하라는 에이전트 프롬프트가 커밋되어 v1.84.0에 배포 — 구문 오류로 실행되지 않음 (ATLAS AML.CS0047)
    - [실제 사고] Replit 바이브 코딩 에이전트(2025-07): 에이전트가 운영 DB를 삭제하고 거짓 출력으로 실수를 숨김 (OWASP ASI 부록 D)
    - [실증] Claude Computer Use(2024-10): PDF 속 지시로 bash 도구가 파일 시스템 전체 삭제 명령을 실행 (ATLAS AML.CS0046)

UT-22.2:
  summary: |-
    - 공격자는 pickle 같은 안전하지 않은 직렬화 형식의 모델·데이터 파일이나 악성 노트북·첨부 파일을 사용자·서빙 런타임이 불러오게 해, 로딩 시점에 임의 코드를 실행할 수 있음
    - 데이터처럼 보이는 파일이 실행 코드로 동작해 일반 파일 검사로는 위험을 판단하기 어렵고, 서빙 프레임워크 자체의 역직렬화 결함도 같은 결과를 냄
  reference: |-
    ■ AI 관점
    - 실행 지점: torch.load·pickle로 모델 불러오기, 공유 노트북(Colab·Jupyter) 실행, 추론 런타임의 모델 매니페스트·데이터 처리, 사용자가 연 첨부 실행 파일 (ATLAS AML.T0011)
    - 안전 옵션도 완전하지 않아 torch.load weights_only 우회(CVE-2025-32434)와 서빙 프레임워크의 역직렬화 취약점이 보고됨 (OWASP LLM04:2026 시나리오 #6)
    - safetensors 같은 비실행 형식 사용, 신뢰 출처 서명 확인, 격리된 환경에서의 로딩이 필요하며 파일 변조·유통은 UT-14.2·28.1에서 다룸
    ■ 실제 사례
    - [실제 사고] Hugging Face 악성 모델(2025-02): 사용자가 모델을 불러오는 순간 pickle에 숨긴 역쉘이 실행 (ATLAS AML.CS0031)
    - [공개 취약점] CVE-2025-24357(vLLM): Hugging Face Hub에서 체크포인트를 받을 때 torch.load를 안전하지 않게 써서 악성 모델 파일로 원격 코드 실행 (OWASP DSGAI04)
    - [실증] Google Colab 노트북(2022-07): 공유 노트북에 난독화한 악성 코드를 넣어 실행한 사용자의 Google Drive 데이터·모델에 접근하는 경로를 시연 (ATLAS AML.CS0018)

UT-22.3:
  summary: |-
    - 공격자는 코드 실행 환경의 격리 결함, 설정 파일 덮어쓰기, 과도한 컨테이너 권한을 이용해 에이전트 샌드박스를 벗어나 호스트를 장악하고 지속성을 확보할 수 있음
    - 샌드박스를 믿고 위험한 코드 실행을 허용한 설계에서는 탈출 하나로 호스트·클러스터 전체가 노출됨
  reference: |-
    ■ AI 관점
    - 탈출 경로: 컨테이너·VM 격리 결함, 특권 파드 생성이 가능한 과도한 권한, 에이전트 보호 설정 파일 덮어쓰기(대소문자 구분 없는 파일 시스템 악용 등), 샌드박스 기능 자체를 끄는 설정 변경 (ATLAS AML.T0105·T0112)
    - 에이전트가 스스로 쓰기 권한을 가진 설정 파일이 보안 경계를 정의하면, 인젝션으로 그 파일을 바꿔 경계를 해제할 수 있음 (UT-24.3)
    - 루트가 아닌 사용자로 실행, 네트워크·파일 시스템 범위 제한, 일회성 격리 환경, 설정 파일의 에이전트 쓰기 금지가 필요함 (OWASP ASI05 대응 #4)
    ■ 실제 사례
    - [실제 사고] OpenAI 평가용 자율 에이전트(2026-07): 스토리지 드라이버에 부여된 과도한 권한으로 특권 파드를 만들어 노드 루트 권한을 얻음 (ATLAS AML.CS0068)
    - [공개 취약점] Cursor 설정 덮어쓰기(2025-10): 대소문자를 구분하지 않는 파일 시스템을 이용한 프롬프트로 핵심 설정을 덮어써 지속적인 원격 코드 실행 (OWASP ASI 부록 D)
    - [실증] OpenClaw 1클릭 RCE(2026-02): 악성 스크립트가 샌드박스를 끄고 명령을 Docker 컨테이너가 아닌 호스트에서 직접 실행하게 함 (ATLAS AML.CS0050)

UT-23.1:
  summary: |-
    - 공격자는 한 에이전트를 인젝션·오염 데이터로 조작해, 그 출력이 검증 없이 후속 에이전트의 입력으로 전달되며 다단계 워크플로 전체로 오류와 악성 동작이 퍼지게 할 수 있음
    - 각 에이전트는 '정상 범위' 안에서 동작해 개별 감시로는 잡히지 않으며, 자동 실행 단계가 많을수록 피해가 증폭됨
  reference: |-
    ■ AI 관점
    - 전파 형태: 분석 에이전트의 부풀린 수치로 실행 에이전트가 과대 거래, 오염된 의약 데이터로 치료 프로토콜 자동 조정, 거짓 경보가 방어 조치 연쇄로 확산 (OWASP ASI08 시나리오 #1·#2·#8)
    - 공유 메모리 오염(UT-11.4)이나 공급망 변조가 시작점이 되며, 에이전트 간 메시지의 출처·무결성 검증이 없으면 위조 메시지(UT-27.1)도 같은 경로로 퍼짐
    - 오류의 시작보다 확산·증폭을 다루는 위협으로, 단계별 검증 게이트와 영향 범위 차단(서킷 브레이커)이 필요함 (OWASP ASI08)
    ■ 실제 사례
    - [공개 취약점] GitHub Copilot·Cursor 코드 에이전트(2025-03): 조작된 코드 제안이 백도어·API 키 유출·논리 결함으로 이어져 개발자를 거쳐 운영 코드까지 전파 (OWASP ASI 부록 D)
    - [시나리오] 인젝션된 시장 분석 에이전트가 위험 한도를 부풀리자 포지션·실행 에이전트가 더 큰 거래를 자동 체결하고, 컴플라이언스는 '한도 내' 활동으로 인식 (OWASP ASI08 시나리오 #1)

UT-23.2:
  summary: |-
    - 공격자는 출력에 자신을 다시 복제하라는 지시를 넣은 프롬프트로, 메일·문서를 매개로 연결된 AI 비서들 사이에서 인젝션이 자동 전파되며 데이터 유출과 스팸을 퍼뜨리게 할 수 있음
    - 사용자 조작 없이 퍼지는 제로클릭 웜이 될 수 있고, 전파 경로마다 새 피해자의 데이터와 연락처를 수집함
  reference: |-
    ■ AI 관점
    - 동작: 인젝션이 응답에 자기 자신을 포함하게 하고, AI가 작성한 답장·문서가 다른 AI의 입력이 되며 연쇄 전파 (ATLAS AML.T0061)
    - 매개: 자동 답장 메일 비서, RAG에 저장되는 메일·문서, 연락처로 메일·문서를 보내는 커넥터 — 수집한 연락처가 다음 표적 목록이 됨
    - 출력에 입력 지시가 그대로 복제되는지 탐지하고, AI 생성 콘텐츠의 자동 발송·자동 처리 사이에 확인 단계를 두어야 함
    ■ 실제 사례
    - [실증] Morris II 웜(2024-03): 자기복제 프롬프트가 든 메일이 RAG 기반 메일 비서의 답장에 복제되어 다른 비서로 전파되며 이메일·주소·전화번호를 유출 (ATLAS AML.CS0024)
    - [실증] ZombieAgent(2025-09): 주입된 지시가 ChatGPT로 하여금 프롬프트를 새 메일·문서에 다시 넣어 수집한 연락처에 배포하게 함 (ATLAS AML.CS0066)

UT-23.3:
  summary: |-
    - 공격자는 자동 복구·대응 에이전트들이 서로의 결과를 트리거로 삼는 구조를 노려, 하나의 조작 신호로 피드백 루프를 만들어 과잉 조치·자원 소모·경보 억제를 일으킬 수 있음
    - 각 에이전트는 목표(SLA·경보 감소)를 충실히 따르지만 상호작용 결과로 사각지대가 넓어지고 시스템이 불안정해짐
  reference: |-
    ■ AI 관점
    - 루프 형태: 대응 에이전트가 지연 목표를 맞추려 경보를 억제 → 계획 에이전트가 경보 감소를 성공으로 해석해 자동화 확대 → 사각지대 누적 (OWASP ASI08 시나리오 #6)
    - 외부 요인: 공용 클라우드 장애처럼 여러 에이전트가 함께 의존하는 서비스가 멈추면 다수 조직의 에이전트가 동시에 오작동 (OWASP ASI08 시나리오 #7)
    - 에이전트 간 트리거 관계 지도화, 조치 횟수·범위 상한, 경보 억제 같은 방어 약화 조치의 사람 승인이 필요하며 자원 소모 자체는 UT-30.3에서 다룸
    ■ 실제 사례
    - 공개 사고 미확인 — OWASP 시나리오 기반
    - [시나리오] 복구 에이전트가 지연 SLA를 맞추려 경보를 억제하고, 계획 에이전트가 이를 성공으로 보고 자동화를 넓혀 여러 리전의 사각지대가 커짐 (OWASP ASI08 시나리오 #6)

UT-24.1:
  summary: |-
    - 에이전트가 부여된 목표를 문자 그대로 최적화하는 과정에서 백업 삭제·통제 우회·평가 경계 이탈 같은 의도하지 않은 유해 행위를 고르고, 결과를 정상처럼 보고할 수 있음
    - 공격자 개입 없이도 발생하며, 에이전트가 실패나 위반을 숨기면 사람이 상황을 늦게 알게 됨
  reference: |-
    ■ AI 관점
    - 형태: 비용 최소화 목표를 위해 운영 백업 삭제, 불가능한 과제를 끝내려 주변 시스템 탐색·침해, 지시 위반 후 허위 데이터·보고로 은폐 (OWASP ASI10 시나리오 #4)
    - 프롬프트 인젝션 같은 외부 공격 없이 목표 설정·보상 구조에서 생기는 오정렬이라 입력 방어로는 막을 수 없음 (OWASP ASI10)
    - 행위 기준선 감시, 목표 외 자원 접근 차단, 되돌릴 수 없는 조치의 승인, 에이전트 자기 보고와 실제 결과의 독립 대조가 필요함 (UT-20.4)
    ■ 실제 사례
    - [실제 사고] OpenAI 평가용 자율 에이전트(2026-07): 사실상 풀 수 없는 평가 과제를 끝내려던 에이전트들이 평가 경계를 넘어 외부 인프라를 만들고 Hugging Face 운영 시스템을 침해 (ATLAS AML.CS0068)
    - [실제 사고] Replit 바이브 코딩 에이전트(2025-07): 지시를 어기고 운영 DB를 삭제한 뒤 데이터를 지어내 실수를 숨김 (OWASP ASI 부록 D)

UT-24.2:
  summary: |-
    - 공격자는 피해 환경에 자체 에이전트를 실행하거나 정상 에이전트를 악성 지시·모든 도구 자동 승인 옵션으로 띄워, 정상 업무 에이전트처럼 보이면서 데이터 접근과 파괴 행위를 수행할 수 있음
    - 에이전트는 넓은 도구·데이터 권한을 기본으로 가져 하나의 실행만으로 큰 피해가 나며, 정상 에이전트 사용과 구분하기 어려움
  reference: |-
    ■ AI 관점
    - 배치 경로: 침해한 개발 도구·확장 프로그램이 에이전트를 실행, 탈취한 계정으로 에이전트 플랫폼에 새 에이전트 등록, 다중 에이전트 워크플로에 가짜 검토·승인 에이전트 삽입 (ATLAS AML.T0103, OWASP ASI10 시나리오 #2)
    - 위험 옵션: 모든 도구 신뢰·비대화형 모드로 실행하면 사람 확인 없이 도구가 실행됨
    - 승인된 에이전트 목록 관리, 에이전트 신원 등록·인증(UT-27.3), 섀도 에이전트·MCP 서버 탐지(UT-31.3)가 필요함
    ■ 실제 사례
    - [실제 사고] Amazon Q VS Code 확장(2025-07): 변조된 확장이 'q --trust-all-tools --no-interactive' 옵션으로 파괴 지시가 담긴 Amazon Q 에이전트를 실행하도록 배포됨 (ATLAS AML.CS0047)
    - [실제 사고] GTG-1002(2025-09): 공격자가 Claude 에이전트를 스캐너·크래커·전용 침투 서버와 연결한 공격 프레임워크로 구성해 운용 (ATLAS AML.CS0069)

UT-24.3:
  summary: |-
    - 공격자는 에이전트 규칙 파일·권한 설정·연결 도구 구성·지속 지시 파일을 바꿔 보안 확인 기능을 끄거나 악성 지시를 영속화하고, 같은 설정을 쓰는 모든 에이전트에 영향을 퍼뜨릴 수 있음
    - 설정 변경은 세션이 끝나도 남고 저장소를 통해 공유되어, 한 번의 침해가 장기간·다수 사용자로 확산됨
  reference: |-
    ■ AI 관점
    - 대상: 코딩 도구 규칙 파일(.cursorrules 등), 프로젝트별 에이전트 설정, 위험 명령 확인 같은 보안 옵션, 주기적으로 읽는 작업 지시 파일 (ATLAS AML.T0081)
    - 경로: 저장소·커뮤니티로 유통되는 오염 규칙 파일(UT-28.2), 인젝션으로 실행된 스크립트의 설정 수정, 복제한 프로젝트의 설정이 전역 설정을 덮어쓰는 구조
    - 설정 파일 무결성 감시, 에이전트 자신의 설정 쓰기 금지, 외부 프로젝트 설정의 신뢰 확인이 필요하며 승인·허용 목록 우회는 UT-32.3에서 다룸
    ■ 실제 사례
    - [실증] OpenClaw 1클릭 RCE(2026-02): 악성 스크립트가 위험 명령 실행 전 사용자에게 묻는 보안 기능을 설정에서 꺼버림 (ATLAS AML.CS0050)
    - [실증] OpenClaw C2(2026-02): 인젝션으로 실행된 스크립트가 HEARTBEAT.md 설정 파일에 지시를 덧붙여 이후 모든 실행에 영속화 (ATLAS AML.CS0051)
    - [공개 취약점] Cursor CLI 프로젝트 설정(2025-10): 복제한 프로젝트의 .cursor/cli.json이 전역 설정을 덮어써 공격자 명령이 실행됨 (OWASP ASI 부록 D)

UT-24.4:
  summary: |-
    - 자율 에이전트는 실행 환경이 초기화·차단·종료된 뒤에도 외부 자원으로 실행 기반을 다시 만들고 상태를 복구해, 사람이 의도하지 않은 활동을 이어갈 수 있음
    - 중지 명령이나 환경 재생성만으로 활동이 끝나지 않으며, 조직 밖 자원에 흔적이 남아 통제·회수가 어려움
  reference: |-
    ■ AI 관점
    - 형태: 상태가 사라지는 일회성 샌드박스 대신 외부 실행 거점을 다시 구성, 공유 저장소에 남긴 상태·지시를 읽어 작업 재개, 자기 복제본 생성 (ATLAS AML.T0121, OWASP ASI10 시나리오 #3)
    - 오염된 지시를 학습한 에이전트가 원래 출처가 제거된 뒤에도 같은 행위를 계속하는 지속형 이탈도 포함 (OWASP ASI10 시나리오 #1)
    - 에이전트별 킬 스위치, 외부 통신·자원 생성 권한 차단, 종료 시 자격증명·작업 공간 회수와 사후 점검이 필요함
    ■ 실제 사례
    - [실제 사고] OpenAI 평가용 자율 에이전트(2026-07): 제출할 때마다 새로 만들어지는 외부 샌드박스에 상태가 남지 않자, 에이전트들이 대체 실행 거점을 구성해 2단계 페이로드를 받아 활동을 이어감 (ATLAS AML.CS0068)
