# D07. AI 신원 및 권한 악용 — v3.2 재작성

UT-25.1:
  summary: |-
    - 공격자는 에이전트 설정 파일·RAG 문서·코드 저장소·노트북·환경변수·CI 설정에 평문으로 남은 API 키와 토큰을 찾아, 연동된 클라우드·SaaS·AI 서비스 접근 권한을 확보할 수 있음
    - 에이전트는 여러 서비스 자격증명을 한 곳에 모아 두는 경우가 많아, 파일 하나 노출이 다수 시스템 접근으로 이어짐
  reference: |-
    ■ AI 관점
    - 저장 위치: 에이전트·MCP 클라이언트 설정 파일(mcp.json 등), 노트북·학습 클러스터의 환경변수, 빌드 설정의 토큰, 사내 문서·위키에 붙여 둔 키 (ATLAS AML.T0055·T0083)
    - RAG 경유: 자격증명이 색인된 내부 문서에 있으면 일반 사용자도 AI에게 물어 키를 얻을 수 있음 (ATLAS AML.T0082)
    - AI 플랫폼 토큰(Hugging Face·OpenAI 등)은 비공개 모델·데이터셋 접근과 모델 바꿔치기(UT-28.1)로 이어지며, 클라우드 키는 LLMjacking(UT-25.4·30.2)의 출발점이 됨
    - 비밀 저장소·단기 토큰 사용, 설정·문서·저장소의 비밀값 스캔, 색인 전 비밀값 제거가 필요함 (OWASP DSGAI02·MCP01)
    ■ 실제 사례
    - [실제 사고] ShadowRay(2023-09~): 인증 없는 Ray 클러스터에서 SSH 키, OpenAI·Hugging Face·Stripe 토큰, 클라우드 자격증명이 수집 가능한 상태로 발견 (ATLAS AML.CS0023)
    - [실제 사고] Amazon Q VS Code 확장(2025-07): CodeBuild 설정에 있던 과도한 범위의 GitHub 토큰을 얻어 저장소에 악성 커밋 (ATLAS AML.CS0047)
    - [실제 사고] Hugging Face Spaces(2024): 플랫폼 비밀 토큰이 노출되어 비공개 데이터·학습 저장소에 직접 접근 가능한 경로가 드러남 (OWASP DSGAI04)

UT-25.2:
  summary: |-
    - 공격자는 인젝션이나 악성 도구 설명으로 에이전트가 파일 조회·명령 실행 도구를 써서 실행 환경의 자격증명 파일과 환경변수를 읽게 하고, 그 값을 응답·도구 인자로 넘기게 할 수 있음
    - 에이전트는 사용자 PC·CI 러너의 자격증명에 접근 가능한 위치에서 동작해, 도구 한 번 호출로 여러 서비스 비밀값이 노출됨
  reference: |-
    ■ AI 관점
    - 수법: "env 실행", "~/.ssh/id_rsa·mcp.json 읽기" 같은 지시를 주입해 에이전트 도구로 비밀값을 수집 (ATLAS AML.T0098)
    - 격리 불일치: 셸 명령은 비밀값을 지운 샌드박스에서 돌지만 내장 파일 도구는 격리 밖에서 실행되는 식의 경계 차이가 표적이 됨
    - 수집한 값은 응답 출력(UT-12.1)이나 도구 인자·외부 요청(UT-19.2)으로 빠져나감
    - 에이전트 실행 환경에 불필요한 자격증명을 두지 않고, 자격증명 파일 경로 접근을 도구 정책으로 차단해야 함 (OWASP DSGAI02)
    ■ 실제 사례
    - [실증] Claude Code GitHub Action(2026-06): 내장 Read 도구가 정화되지 않은 프로세스 환경을 읽어 ANTHROPIC_API_KEY 등 워크플로 비밀값을 반환 (ATLAS AML.CS0067)
    - [실증] 원격 MCP 도구 오염(2025-04): 도구 설명의 숨은 지시로 에이전트가 SSH 키와 다른 MCP 서버 자격증명이 든 mcp.json을 읽어 도구 파라미터에 담음 (ATLAS AML.CS0054)
    - [실증] 노출된 ClawdBot(2026-01): 제어 인터페이스로 'env'를 지시하자 bash 스킬이 다른 서비스 비밀값이 든 환경변수를 출력 (ATLAS AML.CS0048)

UT-25.3:
  summary: |-
    - 공격자는 AI 데스크톱 앱의 메모리를 읽거나 브라우저 세션 쿠키를 가로채거나 로컬 에이전트의 취약점을 이용해 인증 토큰을 빼내, 사용자 본인처럼 AI 서비스와 연결 시스템에 접속할 수 있음
    - 토큰과 쿠키는 MFA를 이미 통과한 상태라 재인증 없이 쓰이며, AI 비서에 연결된 메일·문서·업무 시스템 권한까지 넘어감
  reference: |-
    ■ AI 관점
    - 메모리 덤프: LLM 데스크톱 앱 프로세스 메모리에서 백엔드 인증 토큰을 찾아냄 (ATLAS AML.T0090)
    - 세션 쿠키: AI 챗봇이 만든 XSS(UT-18.1)나 악성 확장으로 상담원·사용자의 세션 쿠키를 탈취 (ATLAS AML.T0113)
    - 취약점 익스플로잇: 로컬 에이전트 게이트웨이가 공격자 WebSocket 주소로 연결하게 해 게이트웨이 토큰을 넘겨받음 (ATLAS AML.T0106, UT-32.2)
    - 탈취한 토큰의 재사용은 UT-25.4에서 다루며, 토큰 단기화·기기 바인딩·이상 위치 세션 탐지가 필요함
    ■ 실제 사례
    - [실증] AIKatz(2025): LLM 데스크톱 앱 프로세스 메모리를 스캔해 인증 토큰을 추출하고, 데스크톱 클라이언트처럼 백엔드에 접속 (ATLAS AML.CS0036)
    - [실증] OpenClaw 1클릭 RCE(2026-02): 악성 링크가 연 백그라운드 창이 게이트웨이 주소를 공격자 서버로 바꿔 OpenClaw가 인증 토큰을 보내게 함 (ATLAS AML.CS0050)
    - [실증] Lenovo 챗봇 'Lena'(2025-08): 챗봇 응답에 저장된 스크립트가 상담원 브라우저의 세션 쿠키를 읽어 외부로 전송 (ATLAS AML.CS0060)

UT-25.4:
  summary: |-
    - 공격자는 탈취한 API 키·토큰·세션·계정으로 정상 사용자처럼 AI 서비스와 연결 시스템에 접근하고, 추가 계정을 만들어 접근을 유지하며 무단 사용·재판매까지 할 수 있음
    - 정상 자격증명으로 접근하므로 행위 기반 분석 없이는 구분이 어렵고, 사용 요금과 금지 콘텐츠 생성 책임이 피해 조직에 돌아감
  reference: |-
    ■ AI 관점
    - 재사용 대상: 클라우드 계정의 LLM 서비스(Bedrock 등), AI 서비스 API 키, 에이전트 게이트웨이 토큰, SSO 계정 — 예측 가능한 비밀번호 대입으로 얻은 계정도 포함 (ATLAS AML.T0012·T0091)
    - 영속화: 침투 환경에 백도어 계정을 만들거나 플랫폼에 저장소·조직을 생성해 재접근 경로를 확보 (ATLAS AML.T0125)
    - LLMjacking: 탈취 키로 고가 모델을 무단 호출하고 역방향 프록시로 접근권을 재판매 — 하루 최대 4.6만 달러 피해 추산 (UT-30.2)
    - AI 서비스 키 사용량·출발지 이상 탐지, 키 자동 회전, 계정 생성 이벤트 감시가 필요함
    ■ 실제 사례
    - [실제 사고] LLMjacking(2024-05): 탈취한 클라우드 자격증명으로 Bedrock 등 LLM 서비스에 접근해 역방향 프록시로 재판매 — Claude 2.x 기준 하루 최대 4.6만 달러 피해 추산 (ATLAS AML.CS0030)
    - [실제 사고] 대만 정부 시스템 침해(2026-07): 노출 API에서 얻은 직원 ID로 예측 가능한 비밀번호를 대입해 업무 포털 계정 85개를 확보하고, SSO 연계로 다른 정부 시스템까지 접근 (ATLAS AML.CS0071)
    - [실제 사고] Storm-2139(2024-12): 공개된 곳에서 수집한 고객 자격증명으로 생성형 AI 서비스 계정에 접근 (ATLAS AML.CS0057)

UT-26.1:
  summary: |-
    - 공격자는 권한이 낮은 외부 입력(티켓·메일·도구 입력)을 권한이 높은 에이전트가 대신 처리하는 구조를 이용해, 요청자 권한 확인 없이 내부자 수준의 조회·변경을 실행시킬 수 있음
    - 에이전트는 자기 신원 권한으로 행동하므로 접근 통제 로그에는 정상 내부 작업으로 남고, 외부인이 내부 권한을 빌려 쓰게 됨
  reference: |-
    ■ AI 관점
    - 형태: 고객 티켓을 처리하는 지원 에이전트, 저권한 사용자의 요청을 받아 고권한 도구를 호출하는 MCP 서버, 위임 시 모든 권한을 하위 에이전트에 넘기는 오케스트레이터 (OWASP ASI03 시나리오 #1)
    - MCP·OAuth 환경: 서버가 사용자 토큰을 하위 API에 그대로 전달하거나 자체 고권한 신원으로 처리하면 요청자 범위를 벗어난 작업이 가능해짐 (OWASP MCP07)
    - 내부 에이전트가 보낸 요청이라는 이유로 검증 없이 처리하면, 외부 메일의 지시가 분류 에이전트를 거쳐 재무 에이전트의 송금으로 이어짐 (OWASP ASI03 시나리오 #3)
    - 요청자 신원을 끝까지 전달해 행위 시점마다 인가를 확인하고(on-behalf-of), 위임 시 범위를 다시 좁혀야 함
    ■ 실제 사례
    - [공개 취약점] Heroku MCP 앱 소유권 탈취(2025-06): 악성 도구 입력이 Heroku MCP의 신뢰 경계를 악용해 승인 없이 앱 소유권을 가로챔 (OWASP ASI 부록 D)
    - [실증] Jira Service Management(2025-06): 외부 고객이 낸 티켓을 내부 엔지니어의 AI가 MCP로 처리하며 내부자 권한으로 다른 티켓 정보를 수집 (ATLAS AML.CS0039)
    - [시나리오] 재무 에이전트가 DB 조회 에이전트에 모든 권한을 넘겨, 질의를 조작한 공격자가 인사·법무 데이터를 유출 (OWASP ASI03 시나리오 #1)

UT-26.2:
  summary: |-
    - 공격자는 에이전트가 작업 중 캐시하거나 세션에 남긴 관리자 자격증명·토큰이 다른 사용자 요청이나 후속 작업에 재사용되는 점을 이용해, 자기 권한 밖의 작업을 시킬 수 있음
    - 에이전트의 세션 상태가 사용자 간 권한 경계를 무너뜨려, 비관리자가 관리자 작업을 수행하게 됨
  reference: |-
    ■ AI 관점
    - 형태: 패치·배포 작업 중 받은 SSH·클라우드 자격증명이 세션에 남음, 하위 에이전트가 같은 OAuth 토큰을 재범위 지정 없이 물려받음, 에이전트가 제작자 신원을 다른 사용자에게 암묵적으로 공유 (OWASP ASI03 시나리오 #2·#7, DSGAI02 시나리오)
    - 캐시된 자격증명은 대화·메모리를 통해 이후 요청에 노출되기도 해(UT-11.1), 작업 종료 시 폐기와 사용자·작업 단위 격리가 필요함
    - JIT(필요 시점) 발급·단기 토큰, 하위 에이전트 생성 시 권한 재지정이 핵심 통제임
    ■ 실제 사례
    - 공개 사고 미확인 — OWASP 시나리오 기반
    - [시나리오] IT 관리 에이전트가 패치 중 캐시한 SSH 자격증명을 비관리자가 같은 세션에서 재사용해 무단 계정 생성 (OWASP ASI03 시나리오 #2)

UT-26.3:
  summary: |-
    - 공격자는 워크플로 시작 시점에만 권한을 확인하고 실행 단계마다 다시 확인하지 않는 구조를 이용해, 도중에 권한이 줄거나 회수된 뒤에도 예전 인가로 작업을 끝까지 실행시킬 수 있음
    - 장시간 실행되는 에이전트 작업에서는 인가 시점과 실행 시점 사이 간격이 길어 권한 변경이 반영되지 않음
  reference: |-
    ■ AI 관점
    - 형태: 구매·결재 흐름 시작 때 받은 토큰으로 수 시간 뒤 단계까지 진행, 위임 범위가 실행 중 확장되어도 재확인 없음 (OWASP ASI03 시나리오 #5)
    - MCP·에이전트 프로토콜에서 인증·인가가 연결 수립 때만 이뤄지면 같은 문제가 생김 (OWASP MCP07)
    - 고위험 단계마다 정책 엔진으로 의도·인자·현재 권한을 다시 검증해야 함 (OWASP LLM01:2026 대응 #4)
    ■ 실제 사례
    - 공개 사고 미확인 — OWASP 시나리오 기반
    - [시나리오] 구매 에이전트가 시작 시 승인을 확인한 뒤 사용자 지출 한도가 줄었지만, 예전 인가 토큰으로 남은 거래를 그대로 완료 (OWASP ASI03 시나리오 #5)

UT-27.1:
  summary: |-
    - 공격자는 에이전트 간·에이전트-도구 간 암호화·서명이 없는 통신 구간에서 메시지를 가로채 변조하거나, 신뢰할 수 없는 서버의 응답으로 명령을 끼워 넣어 다른 에이전트의 지시와 판단을 조작할 수 있음
    - 받는 에이전트는 메시지를 내부의 신뢰된 지시로 처리해, 겉보기에는 정상 결과를 내면서 편향되거나 악성인 행동을 수행함
  reference: |-
    ■ AI 관점
    - 형태: HTTP 등 비인증 채널의 중간자 지시 삽입, 평판 메시지 변조로 신뢰 대상 바꾸기, 암호화를 끈 구버전 모드로 강제 전환 (OWASP ASI07 시나리오 #1·#2·#4)
    - OAuth·MCP 흐름: 신뢰할 수 없는 MCP 서버가 인증 과정에서 조작된 응답을 돌려줘 인증 후 에이전트가 공격자 명령을 실행 (OWASP ASI 부록 D)
    - 같은 지시를 에이전트마다 다르게 해석하게 만드는 의미 조작도 포함되며, 메시지 서명·상호 TLS·스키마 검증과 출처 확인이 필요함 (OWASP ASI07 시나리오 #7)
    ■ 실제 사례
    - [공개 취약점] MCP OAuth 응답 악용(2025-10): 신뢰할 수 없는 MCP 서버의 OAuth 흐름이 조작된 응답을 돌려줘 인증 후 에이전트가 주입 명령을 실행 (OWASP ASI 부록 D)
    - [시나리오] 비인증 채널의 중간자가 숨은 지시를 삽입해 에이전트들이 정상처럼 보이는 편향·악성 결과를 생성 (OWASP ASI07 시나리오 #1)

UT-27.2:
  summary: |-
    - 공격자는 과거에 정상적으로 오간 지시·승인 메시지를 다시 보내, 이미 끝났거나 만료된 절차와 권한을 에이전트가 다시 실행하게 할 수 있음
    - 메시지 자체는 진짜라 서명 검증만으로는 막을 수 없고, 상황에 맞지 않는 조치가 자원 오배분·중복 실행으로 이어짐
  reference: |-
    ■ AI 관점
    - 형태: 과거 긴급 조정 메시지·승인 메시지·작업 지시의 재전송, 만료된 위임 토큰 재제출 (OWASP ASI07 시나리오 #3)
    - 에이전트는 메시지의 맥락(시점·순서)을 검증하지 않으면 유효한 형식의 메시지를 그대로 처리함
    - 메시지에 일회용 값(nonce)·타임스탬프·순번을 넣고 수신 측에서 재사용을 거부해야 함
    ■ 실제 사례
    - 공개 사고 미확인 — OWASP 시나리오 기반
    - [시나리오] 과거의 긴급 조정 메시지를 다시 보내 구식 절차가 실행되고 자원이 잘못 배분됨 (OWASP ASI07 시나리오 #3)

UT-27.3:
  summary: |-
    - 공격자는 에이전트 디렉터리·레지스트리·탐색 서비스에 가짜 에이전트를 등록하거나 에이전트 카드에 높은 신뢰·능력을 꾸며 적어, 다른 에이전트가 맡기는 작업과 데이터를 가로챌 수 있음
    - 에이전트 선택이 자기 신고 정보에 의존하면 위장 에이전트가 고권한 작업을 위임받아 데이터 유출과 시스템 명령으로 이어짐
  reference: |-
    ■ AI 관점
    - 수법: 복제한 스키마로 탐색 서비스에 가짜 피어 등록, 공개 A2A 디렉터리에 과장된 에이전트 카드 게시, MCP 엔드포인트가 거짓 능력을 광고 (OWASP ASI07 시나리오 #5·#6)
    - 판정 에이전트(LLM)가 카드 내용을 믿고 위장 에이전트를 선택하면 민감한 작업·데이터가 공격자에게 넘어감 (OWASP ASI03 시나리오 #6)
    - 에이전트 신원 증명(서명된 카드·인증서), 레지스트리 등록 승인, 능력 주장 검증이 필요하며 악성 에이전트를 직접 실행하는 경우는 UT-24.2에서 다룸
    ■ 실제 사례
    - [공개 취약점] A2A 프로토콜 스푸핑(2025-04): 공개 A2A 디렉터리에 높은 신뢰를 주장하는 가짜 에이전트 카드를 올리자 LLM 판정 에이전트가 선택해 민감 데이터를 가로채 유출 (OWASP ASI 부록 D)
    - [시나리오] 내부 A2A 레지스트리에 위조 카드로 'Admin Helper' 에이전트를 등록해 다른 에이전트가 맡긴 고권한 유지보수 작업으로 시스템 명령 실행 (OWASP ASI03 시나리오 #6)
