# D09. AI 인프라 노출 및 자원 고갈 — v3.2 재작성

UT-30.1:
  summary: |-
    - 공격자는 대량 요청·초장문 입력·연산량이 큰 질의·무의미 데이터 투입으로 추론 자원을 고갈시켜, AI 서비스의 응답을 늦추거나 멈추게 할 수 있음
    - GPU 같은 특수 연산 자원은 증설이 어렵고 요청당 비용이 커서, 적은 요청으로도 정상 사용자의 이용이 막힘
  reference: |-
    ■ AI 관점
    - 수법: 대량 요청, 메모리·연산을 크게 쓰는 초장문 입력, 끝나지 않는 계산을 시키는 프롬프트, 출력 토큰을 과도하게 늘리도록 최적화한 적대적 이미지 (ATLAS AML.T0029, OWASP LLM06:2026 시나리오 #1~#3·#6)
    - 분석 업무 마비: 탐지 시스템에 무의미 데이터를 쏟아 오탐을 늘려 분석가 시간을 소모시킴 (ATLAS AML.T0046)
    - 특정 사용자 차단: 피해자 계정으로 요청을 쏟아 봇 차단 한도를 넘기게 해 정상 사용자가 서비스에서 차단되게 함
    - 입력 길이·출력 토큰·실행 시간 상한, 사용자별 속도 제한, 비용 기반 큐 관리가 필요하며 비용 피해는 UT-30.2에서 다룸
    ■ 실제 사례
    - [실증] MathGPT(2023-01): "끝없이 계산하라"는 프롬프트로 생성 코드가 무한 실행되어 앱이 멈추고 결국 서비스 중단 (ATLAS AML.CS0016)
    - [실증] AIKatz(2025): 탈취 토큰으로 피해자 대화를 모두 지우고 메시지를 쏟아 봇 차단 한도를 넘기게 해 사용자의 LLM 이용을 막을 수 있음을 시연 (ATLAS AML.CS0036)

UT-30.2:
  summary: |-
    - 공격자는 연산 비용이 큰 질의를 반복하거나 탈취한 키·계정으로 고가 모델을 무단 호출해, 종량제 AI 서비스 요금을 급증시킬 수 있음(Denial of Wallet)
    - 서비스는 정상 동작해 장애로 드러나지 않고 청구서로 피해를 알게 되며, 탈취 키 남용은 하루 수만 달러 규모로 커질 수 있음
  reference: |-
    ■ AI 관점
    - 과다 질의: 단순 질의를 자동화해 대량으로 보내 처리량과 비용을 키움 (ATLAS AML.T0034.000)
    - 고비용 질의: 긴 입력, 매우 긴 출력 요청, 반복 추론을 유발하는 입력으로 요청당 연산을 키움 (ATLAS AML.T0034.001)
    - 무단 사용: 탈취한 클라우드·AI 서비스 키로 고가 모델을 호출하고 접근권을 재판매(LLMjacking) — 비용은 키 소유 조직에 청구됨 (UT-25.4)
    - 계정·키별 예산 한도와 실시간 비용 경보, 사용 모델 허용 목록, 키 자동 회전이 필요함
    ■ 실제 사례
    - [실제 사고] LLMjacking(2024-05): 탈취한 클라우드 자격증명으로 Bedrock 등 LLM 서비스를 무단 사용 — Claude 2.x 기준 피해 계정당 하루 최대 4.6만 달러 비용 추산 (ATLAS AML.CS0030)
    - [시나리오] 종량제 클라우드 AI 서비스에 과도한 연산을 유발해 감당할 수 없는 비용을 발생시킴 (OWASP LLM06:2026 시나리오 #4)

UT-30.3:
  summary: |-
    - 공격자는 인젝션이나 악성 도구로 에이전트가 도구를 반복 호출하거나 하위 에이전트를 대량 생성하거나 컨텍스트를 계속 키우게 해, 요청 하나로 막대한 연산과 API 비용을 쓰게 할 수 있음
    - 각 호출은 정상 범위라 요청 단위 속도 제한에 걸리지 않고, 누적 컨텍스트 때문에 턴이 늘수록 비용이 기하급수적으로 커짐
  reference: |-
    ■ AI 관점
    - 수법: 재귀·순환 작업이나 수많은 도구 호출이 필요한 작업을 지시하는 악성 도구·스킬, 인젝션으로 유도한 고비용 도구 호출, 하위 에이전트 팬아웃 (ATLAS AML.T0034.002, OWASP LLM06:2026 시나리오 #7)
    - 누적 컨텍스트: 열린 세션에 내용을 조금씩 더해 매 추론이 전체 컨텍스트를 다시 처리하게 함 — 턴당 비용이 첫 턴 약 0.001달러에서 100번째 턴 약 0.50달러로 증가 (OWASP LLM06:2026 시나리오 #8)
    - 에이전트 간 상호 트리거로 생기는 루프 폭주는 UT-23.3에서 다룸
    - 작업별 도구 호출 횟수·토큰·실행 시간 예산, 팬아웃 상한, 반복 패턴 탐지와 자동 중단이 필요함
    ■ 실제 사례
    - 공개 사고 미확인 — ATLAS 기법(T0034.002)이 Feasible 단계
    - [시나리오] 오픈소스 저장소에 공개된 악성 스킬이 에이전트에 재귀 작업을 지시해, 이를 쓴 개발자의 에이전트가 과도한 토큰과 비용을 소모 (OWASP LLM06:2026 시나리오 #7)

UT-30.4:
  summary: |-
    - 공격자는 특정 질의에 걸려 답변 거부를 유도하는 방해 문서를 넣거나 에이전트 검색을 폭주시켜, RAG의 검색 품질과 가용성을 떨어뜨려 AI 서비스 기능을 마비시킬 수 있음
    - 장애 시 오래된 복제본으로 조용히 전환되면 사용자는 낡은 정보를 최신 답변으로 받으며, 원인 파악도 늦어짐
  reference: |-
    ■ AI 관점
    - 검색 방해: 특정 질의에 검색되도록 만든 '차단 문서'가 모델이 답을 거부하거나 정보가 없다고 말하게 함 — 악성 지시 없이 블랙박스 최적화만으로 가능 (OWASP LLM09:2026 예시 #4)
    - 과부하·장애 전환: 에이전트 검색 폭주로 벡터 DB가 포화되고, 장애 조치로 오래된 복제본이 쓰이며 신선도 신호가 전달되지 않음 (OWASP DSGAI17)
    - 검색 장애·지연 시 사용자에게 알리는 설계, 복제본 신선도 감시, 에이전트 검색 속도 제한과 이상 문서 탐지가 필요함
    - 임베딩 기하 구조를 노린 검색 장악은 UT-10.3, 일반 서비스 거부는 UT-30.1에서 다룸
    ■ 실제 사례
    - 공개 사고 미확인 — 특정 CVE가 없는 구조적 장애 유형 (OWASP DSGAI17)
    - [시나리오] 업무 시간 에이전트 검색 폭주로 벡터 DB가 포화되어 18시간 지난 복제본으로 조용히 전환, 사용자는 오래된 정보를 최신 답변으로 받음 (OWASP DSGAI17 시나리오)

UT-31.1:
  summary: |-
    - 공격자는 인증 없이 열려 있거나 기본 자격증명·공개 설정 상태인 AI 학습 클러스터·노트북·모델 서빙·에이전트 관리 콘솔을 찾아, 원격으로 명령을 실행하고 모델·데이터·자격증명을 가져갈 수 있음
    - 많은 AI 플랫폼이 내부망 사용을 전제로 인증 없이 설계되어, 외부 노출 하나가 곧 원격 코드 실행과 대량 자산 탈취가 됨
  reference: |-
    ■ AI 관점
    - 노출 대상: Ray 같은 분산 학습 프레임워크의 작업 API, 노트북 서버, 모델 레지스트리·컨테이너 레지스트리, 로우코드 에이전트 빌더, 개인용 에이전트 제어 화면 (ATLAS AML.T0132)
    - 원인: 기본값이 '인증 없음·모든 인터페이스 수신'인 설계, 프록시 설정 오류로 인증 우회, SaaS 에이전트의 기본 공개 설정
    - 침해 결과는 자격증명 수집(UT-25.1)·모델 탈취(UT-16.2)·연산 자원 악용(UT-30.2)으로 이어지며, 노출 자산 탐색은 UT-01.2, 일반 웹 취약점 악용은 UT-02.4에서 다룸
    - AI 자산 인벤토리와 외부 노출 점검, 기본 인증 강제, 관리 인터페이스의 사설망 제한이 필요함
    ■ 실제 사례
    - [실제 사고] ShadowRay(2023-09~): 인증이 없는 Ray 작업 API로 공격자들이 최소 7개월간 클러스터에 작업을 실행해 연산 자원·자격증명·운영 모델을 탈취 — 피해 장비 가치 약 10억 달러 추산 (ATLAS AML.CS0023)
    - [공개 취약점] Microsoft Copilot Studio(2025-07): 에이전트가 기본으로 공개·무인증 상태여서 외부에서 열거·접근해 운영 환경의 기밀 업무 데이터를 가져올 수 있었음 (OWASP ASI 부록 D)
    - [실증] 노출된 ClawdBot 제어 인터페이스(2026-01): Shodan으로 찾은 수백 개 인터페이스 중 프록시 설정 오류로 인증이 우회되어 자격증명 획득과 루트 명령 실행 (ATLAS AML.CS0048)

UT-31.2:
  summary: |-
    - 임직원이 승인되지 않은 외부 AI 서비스에 고객 정보·가격·소스코드를 입력하면, 데이터가 보안 통제와 계약 보호 밖에서 처리·보관되어 공격자가 해당 서비스의 침해나 약관 변경을 통해 손에 넣을 수 있음
    - 조직은 어떤 데이터가 어디로 갔는지 알 수 없어, 사고 발생 시 영향 범위 산정과 신고 대응이 불가능함
  reference: |-
    ■ AI 관점
    - 형태: 개인 계정 챗봇에 업무 문서 붙여넣기, 승인되지 않은 브라우저 확장·글쓰기 도우미, 부서가 직접 도입한 SaaS AI 기능 (OWASP DSGAI03)
    - 위험: 업체의 학습 활용·보존 정책 변경, 업체 침해, 국외 이전 — 사내 SaaS와 연결된 섀도 AI는 기업 인프라 공격 경로로도 번짐 (OWASP DSGAI03)
    - 승인된 대안 제공, AI 서비스 접속 가시성(CASB·SWG), 입력 데이터 DLP, 사용 정책 교육이 필요하며 승인된 서비스의 과다 전송은 UT-12.3에서 다룸
    ■ 실제 사례
    - 공개 사고 미확인 — 정형화된 CVE는 없으나 임직원이 민감정보를 범용 챗봇에 복사한 공개 사례가 반복 관찰됨 (OWASP DSGAI03)
    - [시나리오] 영업팀이 비승인 메일 작성 도구에 기회 메모·가격·개인정보를 붙여넣었고, 이후 업체가 약관을 바꿔 입력을 학습에 쓰다가 침해로 대화가 노출됨 (OWASP DSGAI03 시나리오)

UT-31.3:
  summary: |-
    - 공격자는 보안 검토 없이 개발자·부서가 설치한 MCP 서버가 기본 자격증명·과도한 권한·인증 없는 접속으로 운영되는 점을 노려, 통제 밖의 데이터 접근 경로로 사내 시스템에 들어올 수 있음
    - 관리 대상 목록에 없어 패치·감사·모니터링이 적용되지 않고, 연결된 DB·SaaS 권한이 그대로 노출됨
  reference: |-
    ■ AI 관점
    - 형태: 개발자 PC의 로컬 MCP 서버, 팀 단위로 띄운 원격 MCP 서버, 시험용으로 만들고 방치한 서버 — 기본 자격증명이나 넓은 토큰으로 사내 데이터에 연결 (OWASP MCP09)
    - 로컬 MCP 프록시가 인증 없이 열려 있으면 악성 웹페이지가 DNS 리바인딩·CSRF로 접속해 명령을 실행할 수 있음 (OWASP ASI 부록 D)
    - MCP 서버 인벤토리·승인 절차, 네트워크 수준 탐지, 표준 인증(OAuth) 강제와 권한 범위 검토가 필요하며 악성 MCP 서버 유입은 UT-29.2에서 다룸
    ■ 실제 사례
    - [공개 취약점] MCP Inspector 교차 컨텍스트 공격(2025-06): 악성 웹페이지가 인증 없는 로컬 MCP Inspector 프록시에 DNS 리바인딩·CSRF로 접속해 OS 명령 실행·데이터 유출 (OWASP ASI 부록 D)
    - [시나리오] 공식 거버넌스 밖에서 기본 자격증명·허용적 설정으로 운영되는 MCP 서버가 통제되지 않는 데이터 접근 경로가 됨 (OWASP MCP09)

UT-32.1:
  summary: |-
    - 공격자는 모든 탭·페이지·파일 접근 권한을 가진 AI 브라우저 확장·어시스턴트에 웹페이지 인젝션이나 악성 업데이트를 보내, 사용자가 보고 있는 사내 시스템 화면과 로컬 파일을 빼낼 수 있음
    - 확장 프로그램은 사용자 세션 안에서 동작해 사내 SaaS·인트라넷 내용을 그대로 읽고, 정상 기능으로도 화면 내용을 원격 LLM에 보냄
  reference: |-
    ■ AI 관점
    - 과권한: '모든 사이트 읽기·변경', 파일 시스템, 클립보드 권한을 가진 AI 확장 — 요약 기능만으로도 열람 중인 업무 화면이 외부 LLM 제공자로 전송됨 (OWASP DSGAI16)
    - 탈취 경로: URL 조각·페이지 숨은 텍스트의 인젝션(UT-07.1), 확장 업데이트를 통한 악성 전환(UT-28.4)
    - 승인된 확장 목록, 사내 도메인에서의 AI 확장 비활성화, 엔드포인트 DLP·브라우저 관리 정책이 필요함
    ■ 실제 사례
    - 공개 사고 미확인 — AI 브라우저·확장이 숨은 지시나 악성 업데이트로 탈취될 수 있다는 연구가 반복 보고됨 (OWASP DSGAI16)
    - [시나리오] 모든 탭·파일 시스템 권한을 가진 코딩 어시스턴트 확장이 웹페이지 URL 조각의 숨은 지시로 ~/.ssh와 저장소 .env 파일을 외부로 업로드 (OWASP DSGAI16 시나리오)

UT-32.2:
  summary: |-
    - 공격자는 악성 링크·웹페이지·조작 콘텐츠로 사용자 PC에서 동작하는 로컬 AI 에이전트·컴퓨터 사용 에이전트를 원격으로 장악해, 로컬 파일 접근과 명령 실행을 할 수 있음
    - 로컬 에이전트는 사용자 권한으로 셸·파일·브라우저를 다뤄, 링크 클릭이나 웹 방문 한 번이 PC 전체 장악으로 이어짐
  reference: |-
    ■ AI 관점
    - 장악 경로: 로컬 게이트웨이·제어 API의 취약점(1클릭 RCE), 웹페이지 인젝션으로 셸 스킬 호출, 컴퓨터 사용 에이전트를 노린 클릭 유도 (ATLAS AML.T0112.000)
    - 로컬 보호 우회: localhost 제한을 교차 사이트 WebSocket으로 넘거나, 샌드박스·위험 명령 확인 기능을 꺼버림 (UT-22.3·24.3)
    - 장악 후 인증 토큰 탈취(UT-25.3)와 지속 C2(UT-05.2)로 이어짐
    - 로컬 에이전트 인증·출처 검사, 비루트 실행과 격리, 위험 명령 사용자 확인 유지, 엔드포인트 EDR 연계가 필요함
    ■ 실제 사례
    - [실증] OpenClaw 1클릭 RCE(2026-02, CVE-2026-25253): 악성 링크 클릭 한 번에 스크립트가 게이트웨이 토큰을 탈취하고 샌드박스·확인 기능을 끈 뒤 호스트에서 명령 실행 (ATLAS AML.CS0050)
    - [실증] OpenClaw C2(2026-02): 웹페이지 요약을 요청받은 OpenClaw가 인젝션에 따라 bash 스킬로 악성 스크립트를 받아 실행하고 C2 에이전트로 전환 (ATLAS AML.CS0051)
    - [실증] AI ClickFix(2025-05): 클릭 유도 웹페이지가 Claude 컴퓨터 사용 에이전트에게 터미널을 열어 복사된 명령을 실행하게 함 (ATLAS AML.CS0055)

UT-32.3:
  summary: |-
    - 공격자는 AI 코딩 어시스턴트의 명령 허용 목록·실행 확인 절차를 환경변수·명령 파싱 결함·규칙 파일 조작으로 우회해, 개발자 권한으로 임의 명령을 실행시킬 수 있음
    - 개발자 PC와 CI 러너는 소스코드·클라우드 자격증명·배포 권한을 가져, 확인 절차 하나가 뚫리면 공급망 침해로까지 번짐
  reference: |-
    ■ AI 관점
    - 우회 방식: 허용된 명령에 환경변수로 동작을 바꿔 끼우기, 명령 파싱 오류로 확인 프롬프트 건너뛰기, 규칙 파일·프로젝트 설정으로 자동 실행 범위 넓히기 (OWASP DSGAI01·DSGAI02)
    - 자동 실행 옵션('모든 도구 신뢰', 비대화형 모드)을 켠 배포는 확인 절차 자체를 없애 위험을 키움 (UT-24.2)
    - 허용 목록은 명령 이름이 아닌 전체 인자·환경 기준으로 검증하고, 원격 코드 실행이 가능한 명령은 항상 확인을 요구해야 하며 생성 코드 실행 일반은 UT-22.1에서 다룸
    ■ 실제 사례
    - [공개 취약점] CVE-2026-22708(Cursor): 환경변수를 이용해 터미널 도구 허용 목록을 우회 (OWASP DSGAI01)
    - [공개 취약점] CVE-2025-54795(Claude Code): 명령 파싱 오류로 실행 확인 프롬프트를 우회해 신뢰되지 않은 명령 실행 (OWASP DSGAI02)
    - [실제 사고] Amazon Q VS Code 확장(2025-07): 변조된 확장이 '--trust-all-tools --no-interactive'로 확인 절차 없이 에이전트를 실행하도록 배포 (ATLAS AML.CS0047)

UT-33.1:
  summary: |-
    - 공격자는 디버그 로깅·APM·LLM 추적 도구가 프롬프트·응답·추론 과정·토큰을 원문 그대로 모아 둔 저장소를 노려, 운영 데이터보다 접근 통제가 약한 경로로 민감정보와 자격증명을 대량 확보할 수 있음
    - 응답은 정화되어도 로그·추적 데이터에는 원문이 남아 수백 명의 운영 인력과 외부 SaaS에 퍼지며, 노출 사실도 늦게 드러남
  reference: |-
    ■ AI 관점
    - 수집 지점: LLM 관측성 플랫폼(Langfuse·LangSmith·Datadog LLM Observability 등)이 기본값으로 프롬프트·응답·검색 청크·추론 과정을 저장, 디버그 모드의 HTTP 본문 전체 로깅 (OWASP LLM02:2026 예시 #7, DSGAI14)
    - 노출 경로: 공유 APM 프로젝트 접근 권한, 피싱된 운영 계정의 대량 내보내기, 설정 오류로 공개된 로그 DB
    - 로그 수집 전 정화·마스킹, 추론 과정을 1급 출력으로 분류·보호, 관측성 데이터 접근 최소화와 보존 기간 제한이 필요함 (OWASP LLM02:2026 Tier 1 #7)
    ■ 실제 사례
    - [실제 사고] DeepSeek ClickHouse 노출(2025-01): 공개된 데이터베이스에서 로그와 API 키를 포함한 100만 행 이상이 노출 (OWASP LLM02:2026 예시 #7)
    - [시나리오] 확장 추론 과정이 공유 APM 프로젝트에 원문 기록되어, 답변은 정화되었지만 검색된 개인정보가 엔지니어 수백 명에게 노출 (OWASP LLM02:2026 시나리오 #3)

UT-33.2:
  summary: |-
    - 공격자는 RLHF·품질 검수를 위해 비식별 처리 없이 외부 라벨링 업체·인력에 넘겨진 원본 대화와 문서를, 라벨러 계정 침해나 내부자 유출을 통해 손에 넣을 수 있음
    - 조직 통제가 약한 외부 인력과 단말로 대량 원본이 이동해, 한 사람의 실수·감염이 대규모 개인정보 유출로 이어짐
  reference: |-
    ■ AI 관점
    - 노출 경로: 품질 평가·톤 분류·RLHF용 대화 내보내기, 라벨링 플랫폼의 원본 열람, 라벨러 개인 단말의 감염·반출 (OWASP DSGAI19)
    - 대상 데이터: 고객 이름·계좌번호·의료정보, 내부 시스템 URL·장애 대응 문서처럼 업무 맥락이 담긴 원문
    - 전달 전 최소화·가명화, 라벨링 환경의 반출 차단(VDI 등), 업체 보안 요건과 접근 기록 감사가 필요함
    ■ 실제 사례
    - 공개 사고 미확인 — 특정 CVE는 없으나 최소화 없이 RLHF·품질 검수에 민감 대화를 쓴 업계 사례가 보고됨 (OWASP DSGAI19)
    - [시나리오] 의료정보가 담긴 상담 기록 수천 건을 라벨링 업체에 원본으로 넘겨, 한 작업자가 표본을 빼돌리고 다른 작업자의 노트북이 감염됨 (OWASP DSGAI19 시나리오)
