# D03. AI 데이터 오염 및 유출 — v3.2 재작성

UT-09.1:
  summary: |-
    - 공격자는 크라우드소싱·웹 수집·내부 데이터 저장소 같은 학습·파인튜닝 데이터 경로에 소량의 오염 샘플이나 트리거 패턴을 넣어, 모델에 편향·성능 저하·조건부 오작동(백도어)을 내재화할 수 있음
    - 전체 데이터의 극히 일부만 오염해도 효과가 나고, 학습이 끝나면 일반 평가로는 드러나지 않아 운영 중에야 발현됨
  reference: |-
    ■ AI 관점
    - 유입 경로: 사용자 제출·크라우드소싱 데이터, 웹에서 수집하는 데이터셋, 라벨링 결과, 내부자나 침해된 계정이 접근하는 데이터 저장소·전처리 스크립트 (ATLAS AML.T0020)
    - 수법: 샘플 추가·삭제·변조, 라벨 조작, 트리거 패턴이 든 샘플 삽입 — 250개 샘플(학습 토큰의 0.00016%)로도 모델 동작이 크게 바뀐다는 연구가 있음 (OWASP DSGAI04)
    - 결과: 특정 입력에서만 동작하는 백도어(UT-14.4), 탐지 모델의 오분류, 편향된 판단 — 사기 탐지 모델이 잘못된 라벨로 학습되면 금전 손실로 이어짐 (OWASP LLM05:2026 시나리오 #4)
    - 외부에서 받아온 오염 데이터셋은 UT-28.1, 운영 중 피드백 루프 오염은 UT-09.3에서 다룸
    ■ 실제 사례
    - [실제 사고] VirusTotal 오염(2020): 변종 생성 도구로 만든 랜섬웨어 '변종' 샘플을 대량 제출해, 다수 벤더의 ML 분류기가 동작하지 않는 파일까지 해당 계열로 분류하게 만듦 (ATLAS AML.CS0002)
    - [실증] Split-View 데이터 오염(2024-06): URL 목록형 데이터셋의 만료 도메인을 사들여 데이터의 0.01%만 바꿔도 학습 모델을 오염시킬 수 있음을 입증 (ATLAS AML.CS0025)

UT-09.3:
  summary: |-
    - 공격자는 사용자 피드백·대화·운영 로그를 자동 재학습에 반영하는 구조에 조작 입력을 반복 주입해, 인프라 접근 없이 모델 동작을 점진적으로 왜곡할 수 있음
    - 일반 사용자 인터페이스만으로 가능하고 변화가 서서히 누적되어, 정확도 저하·편향이 드러날 때는 이미 오염된 버전이 배포되어 있음
  reference: |-
    ■ AI 관점
    - 대상: 온라인 학습 챗봇, 좋아요·싫어요 평가를 반영하는 RLHF 파이프라인, 운영 로그를 주기적으로 재학습하는 분류·추천 모델 (OWASP LLM05:2026 시나리오 #3)
    - 수법: 다수 계정으로 같은 방향의 입력·평가를 반복해 학습 분포를 기울임 — 개별 입력은 정상 범위라 입력 필터에 걸리지 않음
    - 영향은 느린 모델 표류(정확도 저하·편향·위험한 권고)로 나타나며, 보안 모델이라면 악성 행위를 정상으로 학습하게 할 수 있음 (OWASP ASI06 시나리오 #3)
    - 재학습 입력 검증, 기여자 다양성·이상 패턴 탐지, 버전별 성능 회귀 시험과 롤백 체계가 필요함
    ■ 실제 사례
    - [실제 사고] Microsoft Tay(2016-03): 트위터 대화로 학습하는 챗봇에 다수가 조직적으로 혐오 표현을 주입해, 챗봇이 혐오 발언을 생성하게 되어 서비스 중단 (ATLAS AML.CS0009)
    - [시나리오] 자동 재학습 피드백 루프에 조작 입력을 반복 제출해 모델을 정확도 저하·편향 방향으로 서서히 표류시킴 (OWASP LLM05:2026 시나리오 #3)

UT-09.4:
  summary: |-
    - 공격자는 적대적 입력을 반복 투입하거나 데이터셋 일부를 훼손해, 특정 결과를 노리기보다 모델·데이터셋 전반의 신뢰도를 떨어뜨려 운영 중단이나 재학습 비용을 일으킬 수 있음
    - 표적 공격보다 탐지 기준이 모호해 오류 누적이 늦게 드러나며, 원인 데이터를 찾아 정정하는 데 큰 비용이 듦
  reference: |-
    ■ AI 관점
    - 모델 신뢰도 저하: 오분류를 일으키는 입력을 꾸준히 넣어 운영자가 모델을 믿지 못하게 만들고, 수동 검토·재학습에 자원을 쓰게 함 (ATLAS AML.T0031)
    - 데이터셋 신뢰도 저하: 데이터셋 일부를 오염·변조해 활용 가치를 떨어뜨리고 오류 정정에 비용을 쓰게 함 (ATLAS AML.T0059)
    - 서비스 평판 손상으로도 이어지며, 정기적인 성능·데이터 무결성 기준선 비교와 데이터 계보 관리로 훼손 시점을 특정해야 함 (OWASP DSGAI04)
    ■ 실제 사례
    - [실제 사고] Microsoft Tay(2016-03): 조직적 오염으로 챗봇이 혐오 발언을 학습해 서비스 신뢰가 무너지고 운영이 중단됨 (ATLAS AML.CS0009)
    - [실제 사고] Clearview AI 설정 오류(2020-04): 학습 데이터·애플리케이션에 접근 가능한 상태가 노출되어, 이후 배포본의 얼굴인식 기능이 저하·변조될 수 있는 위험이 확인됨 (ATLAS AML.CS0006)
    - [실증] Split-View 데이터 오염(2024-06): 만료 도메인 재등록으로 이후 다운로드되는 데이터셋 전체의 무결성이 훼손됨 (ATLAS AML.CS0025)

UT-10.2:
  summary: |-
    - 공격자는 에이전트 도구가 조회하는 DB·문서 저장소·검색 색인·티켓 시스템에 악성 지시나 허위 데이터를 기록해, 도구 호출 결과를 통해 에이전트의 판단과 행위를 조작할 수 있음
    - 에이전트는 자기 도구가 돌려준 데이터를 신뢰하는 경향이 있어, 공격자가 시스템에 침투하지 않고 데이터만 바꿔도 지속적인 영향을 줌
  reference: |-
    ■ AI 관점
    - 대상: 에이전트가 도구로 읽는 신뢰 데이터 소스 — 사내 DB 레코드, 위키·문서 저장소, 검색 색인, 이슈·티켓, 고객 정보 시스템 (ATLAS AML.T0099)
    - 수법: 공개 폼·고객 입력·저권한 계정처럼 쓰기 가능한 경로로 레코드에 지시문이나 허위 값(가격·계좌·정책)을 남겨, 에이전트가 조회할 때마다 반복 적용되게 함
    - RAG 검색 결과(UT-10.1)와 달리 도구 응답 형태로 들어와 '신뢰할 수 있는 내부 데이터'로 취급되기 쉬우며, 도구 자체가 침해되어 응답을 조작하는 경우는 UT-29.3에서 다룸
    - 도구 응답도 비신뢰 입력으로 구획·표시하고, 데이터 소스별 쓰기 권한·변경 이력을 관리해야 함 (OWASP ASI06)
    ■ 실제 사례
    - 공개 사고 미확인 — ATLAS 기법(T0099)이 Feasible 단계이며, 저권한 채널에 쓴 데이터를 에이전트가 읽어 실행한 사례는 UT-07.1(Jira 티켓·GitHub 이슈)로 집계됨
    - [시나리오] 공격자가 반복 입력한 가짜 항공권 가격을 비서가 사실로 저장하고, 그 가격으로 예약을 승인하며 결제 검증을 우회 (OWASP ASI06 시나리오 #1)

UT-10.3:
  summary: |-
    - 공격자는 임베딩이 특정 질의 근처에 놓이도록 최적화한 문서·이미지를 넣거나 시맨틱 캐시의 유사도 임계값을 노려, 문서 내용과 무관하게 검색 순위와 캐시 응답을 장악할 수 있음
    - 악성 지시가 없어도 성공하는 기하학적 공격이라 내용 기반 검사로는 걸러지지 않으며, 캐시 오염은 같은 의미의 모든 질의에 영향을 줌
  reference: |-
    ■ AI 관점
    - 검색 장악: 공개 수집 파이프라인·업로드·파트너 피드에 질의 벡터 근처에 놓이도록 설계한 콘텐츠를 넣어 우선 검색되게 함 — 사람 눈에는 질의와 무관해 보일 수 있음 (OWASP LLM09:2026 예시 #3)
    - 시맨틱 캐시·중복 제거 오염: 유사도 임계값 바로 위·아래에 놓이는 입력으로 캐시 항목을 오염시키거나, 정상 신규 콘텐츠를 중복으로 판정해 버리게 함 — AWS·Azure·Alibaba 배포에서 실증 (OWASP LLM09:2026 예시 #6)
    - 멀티모달 임베딩: 이미지 한 장으로 민감한 텍스트 질의의 검색 결과를 장악할 수 있음 (OWASP LLM09:2026 예시 #7)
    - 문서 내용(허위 정보·지시)을 통한 오염은 UT-10.1, 검색 방해 문서로 응답을 거부하게 만드는 가용성 공격은 UT-30.4에서 다룸
    ■ 실제 사례
    - 공개 사고 미확인 — 연구 실증 중심이며 운영 서비스 대상 공개 사고는 없음
    - [시나리오] 공개 문서·포럼을 정기 수집하는 RAG에 'Q3 매출 전망' 같은 내부 질의 근처에 임베딩되는 게시글을 올려, 직원 질의 시 공격자 콘텐츠가 검색되게 함 (OWASP LLM09:2026 시나리오 #1)

UT-11.1:
  summary: |-
    - 공격자는 공유 문서·웹 콘텐츠·조작 링크에 든 지시로 AI 비서의 장기 메모리에 허위 사실이나 지속 지시를 기록해, 이후 모든 세션의 응답과 행위가 오염된 기억을 따르게 할 수 있음
    - 한 번 기록된 메모리는 세션을 넘어 지속되고 사용자가 출처를 알기 어려워, 추천 왜곡·데이터 유출·C2로 장기간 악용됨
  reference: |-
    ■ AI 관점
    - 기록 경로: 간접 인젝션(UT-07.1)이나 'AI로 요약' 링크(UT-07.4)로 메모리 저장 기능을 호출해 "이 도메인을 신뢰 출처로 기억" 같은 항목을 남김 (ATLAS AML.T0080.000)
    - 지속 효과: 메모리는 모든 새 대화에 자동으로 들어가므로, 원래 주입 콘텐츠를 지워도 오염이 남고 다른 세션·기기로 이어짐 (OWASP LLM05:2026 시나리오 #9)
    - 악용 형태: 추천·판단 편향(UT-20.3), 대화 내용을 계속 저장했다가 반출하게 하는 지시, 권한 상승을 위한 점진적 기록 (OWASP ASI06 시나리오 #2)
    - 메모리 쓰기를 특권 작업으로 보고, 지시성 내용이 담긴 기록은 승인 후 저장하며 원인 프롬프트를 로그로 남겨야 함 (OWASP LLM01:2026 대응 #9)
    ■ 실제 사례
    - [실제 사고] AI 추천 오염(2026-02): 'AI로 요약' 링크의 지속 지시로 운영사 도메인을 권위 있는 출처로 메모리에 기록시켜, 이후 추천을 자사 쪽으로 편향 — 31개 기업 (ATLAS AML.CS0072)
    - [실증] ChatGPT 메모리 해킹(2024-02): 공유 Google 문서에 숨긴 지시로 허위 사실을 메모리에 기록, 이후 모든 대화에 지속 (ATLAS AML.CS0040)
    - [실증] ZombieAgent(2025-09): 메일 속 지시로 ChatGPT가 대화의 민감정보를 계속 기억하고 반출하도록 메모리를 생성·수정 (ATLAS AML.CS0066)

UT-11.2:
  summary: |-
    - 공격자는 진행 중인 대화 스레드나 여러 사람이 함께 쓰는 채널에 조작 지시를 넣어, 해당 스레드가 이어지는 동안 후속 응답과 도구 호출을 계속 왜곡할 수 있음
    - 긴 컨텍스트 창 덕분에 지시가 오래 남고, 공유 채널에서는 한 사람의 메시지가 다른 참여자와의 상호작용에도 영향을 줌
  reference: |-
    ■ AI 관점
    - 주입 경로: 직접 입력, 간접 인젝션, 탈취한 API 키로 사용자 스레드에 직접 질의 추가 — 장기 메모리(UT-11.1)와 달리 스레드 범위에 머묾 (ATLAS AML.T0080.001)
    - 공유 스레드: 슬랙 채널처럼 여러 사용자가 함께 쓰는 에이전트에서는 한 사용자의 악성 메시지가 이후 다른 사용자와의 대화 행동을 바꿈 (ATLAS AML.T0080.001)
    - 사용자가 펼쳐 보지 않는 '더 보기' 영역이나 시스템 프롬프트 영역에 남은 지시도 다음 턴에 계속 작용 — 특정 인사말에 발동하게 하면 지연 실행(UT-07.2)과 결합됨
    ■ 실제 사례
    - [실증] OpenClaw C2(2026-02): 인젝션된 스크립트가 이후 생성되는 모든 스레드의 컨텍스트에 지시를 심고, 사용자가 인사할 때 발동하도록 설정 (ATLAS AML.CS0051)
    - [실증] Gemini 캘린더 초대(2025-08): '더 보기'에 가려진 캘린더 내용의 지시가 대화 컨텍스트에 남아 이후 턴의 응답과 도구 호출에 영향 (ATLAS AML.CS0063)
    - [실증] AIKatz(2025): 탈취한 토큰으로 진행 중인 대화에 지시를 넣어 스레드가 끝날 때까지 동작을 바꿈 (ATLAS AML.CS0036)

UT-11.3:
  summary: |-
    - 공격자는 탈취한 세션·API 키로 사용자의 대화 이력을 삭제·수정하거나 과거 맥락을 위조해, 공격 흔적을 숨기고 사용자와 모니터링의 이상 인지를 방해할 수 있음
    - 대화 이력이 사고 조사의 1차 근거인데 변조 여부를 확인할 수단이 없으면 원인 분석과 책임 규명이 불가능해짐
  reference: |-
    ■ AI 관점
    - 수법: 주입한 지시·메시지를 이력에서 지우거나 바꾸고, 과거 대화를 위조해 모델이 잘못된 맥락을 사실로 받아들이게 함 (ATLAS AML.T0092)
    - 데스크톱 앱이 이력을 처음 열 때만 갱신하는 등 클라이언트 표시 방식의 허점을 이용하면 사용자는 주입된 내용을 보지 못함
    - 이력 위조는 메모리·스레드 오염(UT-11.1·11.2)을 숨기는 수단이며, 서버 측 불변 로그(UT-35.2)가 없으면 조작을 입증할 수 없음
    ■ 실제 사례
    - [실증] AIKatz(2025): LLM 데스크톱 앱이 진행 중인 대화에 주입된 프롬프트를 표시하지 않는 점을 이용해 사용자 몰래 지시를 유지 (ATLAS AML.CS0036)
    - [실증] 노출된 ClawdBot 제어 인터페이스(2026-01): 설정 파일에서 찾은 API 키로 사용자 대화 이력의 메시지를 삭제·수정할 수 있음을 확인 (ATLAS AML.CS0048)

UT-11.4:
  summary: |-
    - 공격자는 여러 에이전트가 함께 쓰는 메모리·컨텍스트 저장소에 허위 정책이나 사실을 기록해, 그 기억을 재사용하는 다른 에이전트의 판단까지 연쇄적으로 오염시킬 수 있음
    - 하나의 오염 항목이 여러 업무 흐름으로 퍼지고, 각 에이전트는 공유 기억을 검증된 사실로 취급해 오류가 증폭됨
  reference: |-
    ■ AI 관점
    - 대상: 다중 에이전트 워크플로의 공유 메모리, 팀 단위 지식 저장소, 에이전트 간 공유 벡터 메모리 (OWASP ASI06)
    - 확산: 한 에이전트가 기록한 항목을 다른 에이전트가 근거로 쓰면서 환불·승인·가격 결정 같은 업무 판단으로 퍼짐 — 연쇄 장애(UT-23.1)의 시작점이 됨
    - 테넌트·작업 경계가 느슨한 공유 저장소에서는 비슷한 내용을 심어 다른 테넌트의 민감 청크를 끌어오는 혼입도 가능 (OWASP ASI06 시나리오 #5, UT-13.2)
    - 공유 메모리 쓰기 주체 인증, 항목별 출처·신뢰 등급, 정책성 항목의 승인 절차가 필요함
    ■ 실제 사례
    - 공개 사고 미확인 — OWASP 시나리오 기반
    - [시나리오] 공유 메모리에 가짜 환불 정책을 넣자 다른 에이전트들이 이를 재사용해 잘못된 결정과 손실·분쟁 발생 (OWASP ASI06 시나리오 #4)

UT-12.2:
  summary: |-
    - 공격자는 RAG·에이전트 도구의 검색 범위가 사용자 권한보다 넓게 설정된 점을 이용해, 일반 질의나 인젝션만으로 열람 권한이 없는 문서·메일·CRM 데이터를 응답에 끌어올 수 있음
    - 공격 기법이 아니라 권한 설계 결함이라 정상 질의로도 발생하며, 조직 전체 문서를 색인한 AI 서비스에서는 노출 범위가 매우 큼
  reference: |-
    ■ AI 관점
    - 원인: 문서별 접근 권한(ACL)을 검색 단계에서 적용하지 않거나, 서비스 계정 권한으로 전체 드라이브·메일·CRM을 색인·조회하도록 구성 (OWASP LLM02:2026)
    - 수집 경로: AI 서비스에 RAG DB 검색이나 연결 도구(메일·드라이브·CRM·티켓) 호출을 요청해 조직 내부 문서 대부분에 접근 (ATLAS AML.T0085)
    - 검색 후 생성 단계에서 거르는 방식으로는 이미 모델에 들어간 조각을 되돌릴 수 없으므로, 검색 질의 안에서 문서·청크 단위 권한을 강제해야 함 (OWASP LLM02:2026 Tier 1 #3)
    - 노출된 데이터는 반출 경로(UT-19)와 결합될 때 실제 유출로 이어짐
    ■ 실제 사례
    - [공개 취약점] EchoLeak(2025-05, CVE-2025-32711): 메일 속 지시로 M365 Copilot이 사용자 계정으로 접근 가능한 메일·파일·프로젝트 정보를 조회해 응답에 포함 (ATLAS AML.CS0059, OWASP DSGAI01)
    - [실증] Copilot Studio 고객 지원 에이전트(2025-06): 프롬프트로 지식원 CSV 전체와 Salesforce 전체 레코드를 조회 — 에이전트에 업무에 필요 이상 데이터 접근이 허용됨 (ATLAS AML.CS0037)
    - [공개 취약점] CVE-2026-0612(The Librarian): web_fetch 도구를 통한 정보 유출 취약점 (OWASP DSGAI01)

UT-12.3:
  summary: |-
    - 공격자는 업무에 불필요한 고객 기록 전체·내부 문서를 자동으로 프롬프트에 붙이는 설계 탓에 외부 AI 제공자·하위 처리자의 로그로 퍼진 데이터를, 그 저장소 사고나 보존 정책을 통해 얻을 수 있음
    - 조직 통제 밖에 필요 이상의 개인정보가 쌓이며, 제공자 측 사고 한 번이 대량 유출과 규제 위반으로 이어짐
  reference: |-
    ■ AI 관점
    - 원인: 고객 360 정보·전체 기록 자동 첨부, 긴 컨텍스트 창을 믿고 문서 전체를 넣는 템플릿 — 질문에 필요한 필드보다 훨씬 많은 데이터가 매 요청마다 전송됨 (OWASP DSGAI15)
    - 확산: 외부 LLM 제공자가 품질 모니터링용으로 프롬프트를 저장하고 하위 처리자와 공유하면 계약·국외 이전·보존 기간 통제 밖으로 나감 (OWASP DSGAI15 시나리오)
    - 대응은 템플릿별 필드 허용 목록, 자동 컨텍스트 첨부 비활성화, 외부 경로의 형식 보존 암호화·가명화임 (OWASP LLM02:2026 Tier 1 #2)
    - 임직원이 승인되지 않은 AI 서비스에 직접 붙여넣는 경우는 UT-31.2에서 다룸
    ■ 실제 사례
    - 공개 사고 미확인 — 설계·거버넌스 결함으로 특정 CVE는 없음 (OWASP DSGAI15)
    - [시나리오] 뱅킹 비서가 잔액 질문마다 전체 KYC 파일·주소 이력·계좌 메모를 프롬프트에 포함, 제공자 로그 유출 시 필요 이상의 고객 정보가 노출 (OWASP DSGAI15 시나리오)

UT-12.4:
  summary: |-
    - 공격자는 스크린샷·문서 이미지·음성 같은 멀티모달 입력에 담긴 자격증명·개인정보가 텍스트 DLP를 거치지 않고 AI 서비스·학습 버킷·로그에 저장된 것을, 해당 저장소 노출을 통해 얻을 수 있음
    - 화면 속 API 키나 메모 한 줄도 OCR로 텍스트화되어 저장되며, 텍스트 전용 DLP와 마스킹 정책이 적용되지 않음
  reference: |-
    ■ AI 관점
    - 노출 경로: 디버깅용 관리 화면 캡처, 알림·메신저 스크린샷, PDF 메타데이터, 회의 음성 — 비전 모델이 OCR로 자격증명·개인정보를 읽어냄 (OWASP LLM02:2026 예시 #4)
    - 변환 우회: 텍스트를 이미지로 만들거나 이미지를 텍스트로 바꾸는 과정이 단일 모달리티 DLP를 우회함 (OWASP LLM02:2026 예시 #4)
    - 보이는 가림 처리만 한 PDF는 원문 텍스트가 그대로 남아 모델이 요약에 포함할 수 있음 (OWASP LLM02:2026 시나리오 #9)
    - 모달리티별 DLP·OCR 후 마스킹과 원본 이미지 보존 최소화가 필요하며, 이미지에 숨긴 지시(인젝션)는 UT-06.4에서 다룸
    ■ 실제 사례
    - 공개 사고 미확인 — 멀티모달 전용 CVE는 아직 없음 (OWASP DSGAI09)
    - [시나리오] 고객 정보와 API 키가 보이는 관리 화면 캡처를 비서가 읽고 이미지·추출 텍스트를 학습 버킷에 저장, 이후 ACL 설정 오류로 함께 노출 (OWASP DSGAI09 시나리오)

UT-13.1:
  summary: |-
    - 공격자는 KV 캐시·세션 상태·공유 대화 컨텍스트의 격리 결함이나 예측 가능한 세션 식별자를 이용해, 다른 사용자의 프롬프트와 응답을 자신의 세션에서 보거나 가로챌 수 있음
    - 서비스 측 결함이라 사용자 행동과 무관하게 발생하며, 의료·결제 정보처럼 민감한 대화가 무작위로 노출될 수 있음
  reference: |-
    ■ AI 관점
    - 원인: 추론 서버의 KV 캐시·프롬프트 캐시 공유, 세션 상태 혼선, 캐시 계층 버그, MCP 세션 식별자 재사용 — 다중 사용자 대화가 같은 자원을 공유할 때 발생 (OWASP DSGAI11·MCP10)
    - 공유 추론 상태 결함은 다른 사용자의 프롬프트가 내 추론 과정(reasoning trace)에 섞여 나오는 형태로도 나타남 (OWASP LLM02:2026 시나리오 #2)
    - 캐시 적중 신호로 다른 사용자의 프롬프트를 추정하는 부채널은 UT-15.3, 공유 벡터 인덱스의 테넌트 간 노출은 UT-13.2에서 다룸
    ■ 실제 사례
    - [실제 사고] ChatGPT Redis 버그(2023-03): 캐시 라이브러리 결함으로 Plus 구독자 1.2%의 결제 관련 개인정보가 다른 사용자에게 노출 (OWASP LLM02:2026 예시 #2)
    - [공개 취약점] CVE-2025-6515(oatpp-mcp): MCP SSE 엔드포인트가 인스턴스 포인터를 세션 ID로 반환해 고유하지도 안전하지도 않음 — 세션 가로채기 가능 (OWASP DSGAI11)

UT-13.2:
  summary: |-
    - 공격자는 여러 테넌트가 하나의 벡터 인덱스를 공유하고 접근 제어를 검색 이후에 적용하는 구조를 이용해, 검색 결과·유사도 점수·응답 시간으로 다른 테넌트의 문서 존재와 주제를 추론하거나 내용을 받아볼 수 있음
    - 모든 문서에 태그가 있고 API 호출이 인증되어도 발생하며, 다른 고객사의 기밀이 내 응답에 섞이는 사고로 이어짐
  reference: |-
    ■ AI 관점
    - 원인: 전체 인덱스에 대해 유사도 검색을 먼저 수행하고 애플리케이션 계층에서 테넌트 필터를 나중에 적용 — 검색 자체는 모든 테넌트 데이터에 대해 이뤄짐 (OWASP LLM09:2026 예시 #1)
    - 수법: 탐침 질의를 반복해 결과 수·점수 분포·지연 차이로 다른 테넌트 문서의 존재·주제·규모를 지도화하거나, 범위 지정 누락으로 실제 청크를 받아봄
    - 테넌트 범위는 인덱스 질의 안에서 서버 측으로 강제하고, 고민감 워크로드는 테넌트별 인덱스를 물리적으로 분리해야 함 (OWASP LLM09:2026 대응 #1·#3)
    - 벡터 DB 소프트웨어 자체의 인증·경로 취약점은 UT-13.3에서 다룸
    ■ 실제 사례
    - 공개 사고 미확인 — OWASP 시나리오 기반
    - [시나리오] 로펌들이 공유하는 법률 RAG 인덱스가 경계를 넘어 한 고객의 비공개 소송 전략을 다른 고객의 답변에 종합 — 변호사-의뢰인 특권 포기 사안 (OWASP LLM02:2026 시나리오 #5)
    - [시나리오] 팀 비서가 단일 공유 벡터 저장소를 써서 다른 프로젝트 사용자에게 설계 문서를 답변으로 노출 (OWASP DSGAI11 시나리오)

UT-13.3:
  summary: |-
    - 공격자는 벡터 DB·RAG 엔진의 인증 우회, 기본 설정, 스냅숏 업로드 경로 조작 같은 취약점을 악용해 임베딩과 원문 데이터를 대량 탈취하거나 서버를 장악할 수 있음
    - 임베딩은 역전 공격으로 원문 복원이 가능해, 벡터 DB 침해는 원본 문서 저장소 침해와 같은 수준의 사고로 다뤄야 함
  reference: |-
    ■ AI 관점
    - 취약 지점: 인증 헤더 위조·예측 가능한 토큰 같은 인증 결함, 스냅숏·인덱스 가져오기 과정의 경로 조작·임의 파일 업로드, 기본 설정의 무인증 API (OWASP DSGAI13)
    - 영향: 인덱스 전체 내려받기 후 원문 복원(UT-15.2), 설정 파일 덮어쓰기로 서버 장악, 다른 계정 탈취
    - "임베딩만 유출"은 안전한 분류가 아니며, 벡터 DB 백업도 원본과 같은 등급으로 보호해야 함 (OWASP LLM09:2026 시나리오 #3)
    - 인터넷에 노출된 AI 서비스 전반은 UT-31.1, 테넌트 간 검색 노출은 UT-13.2에서 다룸
    ■ 실제 사례
    - [공개 취약점] Qdrant CVE-2024-3584·CVE-2024-3829: 스냅숏 업로드의 경로 조작과 임의 파일 업로드로 원격 코드 실행 가능 (OWASP DSGAI13)
    - [공개 취약점] Milvus CVE-2025-64513(CVSS 9.3): sourceID 헤더 위조로 인증 우회 (OWASP LLM09:2026)
    - [공개 취약점] RAGFlow CVE-2025-69286(CVSS 9.3): 예측 가능한 토큰 생성으로 계정 탈취 (OWASP LLM09:2026)
