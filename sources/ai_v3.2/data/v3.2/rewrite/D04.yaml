# D04. 모델 조작 및 탈취 — v3.2 재작성

UT-14.1:
  summary: |-
    - 공격자는 모델 가중치를 직접 편집하거나 오염 데이터로 추가 학습해, 일반 성능은 그대로 둔 채 특정 질의에만 허위 응답이나 악성 동작을 하는 모델을 만들 수 있음
    - 벤치마크 성능이 유지되어 표준 평가로는 변조를 발견하기 어렵고, 안전 학습을 다시 해도 심어진 동작이 남을 수 있음
  reference: |-
    ■ AI 관점
    - 수법: ROME·EasyEdit 같은 지식 편집 도구로 특정 사실만 바꾸거나, 오염 데이터로 파인튜닝·LoRA 학습해 백도어·편향을 심음 (ATLAS AML.T0018.000)
    - 양자화 공격처럼 원본 정밀도에서는 정상이고 배포용 양자화 모델에서만 공격자 동작이 나타나게 만들 수도 있어, 원본 검증이 배포본을 보증하지 못함 (OWASP LLM04:2026 예시 #5)
    - 심어진 백도어는 이후 표준 안전 학습으로도 제거되지 않을 수 있음 (OWASP LLM05:2026 시나리오 #5)
    - 변조 모델의 유통·유입은 UT-28.1, 특정 입력으로 백도어를 발동하는 단계는 UT-14.4에서 다룸
    ■ 실제 사례
    - [실증] PoisonGPT(2023-07): ROME으로 GPT-J-6B 가중치를 편집해 특정 질문에 허위 사실을 답하게 하고, 벤치마크 성능 차이는 미미함을 확인 (ATLAS AML.CS0019)
    - [실증] Hugging Face 조직 사칭(2023-08): EasyEdit로 Llama-2-7b에 허위 사실을 주입할 수 있음을 시연 (ATLAS AML.CS0027)
    - [실증] 노출된 컨테이너 레지스트리(2023-09): 인증 없이 열린 사설 레지스트리 8천여 개에서 모델 1,453개를 확인 — 가중치를 바꿔 넣으면 배포 모델이 오분류하게 됨 (ATLAS AML.CS0028)

UT-14.2:
  summary: |-
    - 공격자는 모델 아키텍처에 계층·전처리 연산을 추가하거나 pickle 같은 직렬화 파일에 악성 코드를 심어, 모델을 불러오는 순간 임의 코드를 실행하거나 백도어를 활성화할 수 있음
    - 모델 파일이 곧 실행 코드가 되는 셈이라 로딩 환경 전체가 장악되며, 스캐너를 피하도록 파일을 일부러 손상시키기도 함
  reference: |-
    ■ AI 관점
    - 구조 변조: 연산 그래프에 트리거 감지 네트워크나 Lambda 계층을 추가해 특정 입력·로딩 시 공격자 동작을 수행 — ONNX 같은 '안전' 포맷에도 그래프 백도어가 가능 (ATLAS AML.T0018.001, OWASP LLM04:2026 시나리오 #6)
    - 악성 코드 내장: pickle 역직렬화 시 실행되는 페이로드(역쉘·C2 임플란트)를 모델 파일에 삽입 (ATLAS AML.T0018.002·T0112.001)
    - 스캐너 회피: 페이로드 실행 후 역직렬화가 실패하도록 파일을 손상시켜, 전체를 읽어야 판정하는 스캐너를 통과 (ATLAS AML.T0076)
    - 로딩 시 실행은 UT-22.2, 허브·레지스트리를 통한 유입 경로는 UT-28.1에서 함께 다룸
    ■ 실제 사례
    - [실제 사고] Hugging Face 악성 모델(2025-02): 역쉘을 심은 pickle 모델을 일부러 손상시켜 Picklescan 검사를 피하고 허브에 게시 (ATLAS AML.CS0031)
    - [실증] Hugging Face 조직 사칭(2023-08): 모델에 Lambda 계층으로 Sliver C2 임플란트를 넣어 로딩 시 원격 제어 채널을 확보 (ATLAS AML.CS0027)
    - [실증] 모바일 앱 모델 백도어(2021-01): 앱에서 추출한 컴파일된 모델의 연산 그래프에 트리거 감지 '신경 페이로드'를 넣고 재패키징 (ATLAS AML.CS0013)

UT-14.3:
  summary: |-
    - 공격자는 모델과 함께 배포되는 채팅 템플릿·역할 구분자·토크나이저 설정 같은 프롬프트 구성 로직에 조건부 지시를 넣어, 가중치를 바꾸지 않고 추론 시점에 백도어 동작을 일으킬 수 있음
    - 외부 입력만 검사하는 방어를 우회하고 트리거가 없으면 정상 동작해, 모델 성능 평가로는 발견되지 않음
  reference: |-
    ■ AI 관점
    - 대상: GGUF 같은 단일 파일 포맷에 묶인 채팅 템플릿, 시스템 지시, 도구 호출 형식, 토크나이저 설정 — 추론 엔진이 자동으로 해석함 (ATLAS AML.T0018.003)
    - 동작: 특정 단어·문맥이 나타나면 템플릿이 공격자 지시를 모델 컨텍스트에 끼워 넣음 — 18개 모델·4개 추론 런타임에서 트리거 시 사실 정확도가 90%에서 15%로 떨어지고 URL 삽입 성공률은 80%를 넘음 (OWASP LLM05:2026 시나리오 #6)
    - 가중치 해시만 확인하는 검증으로는 막을 수 없어, 템플릿·설정 파일을 포함한 아티팩트 전체의 출처 확인과 고정 템플릿 사용이 필요함 (OWASP DSGAI04)
    ■ 실제 사례
    - [실증] 오염된 GGUF 템플릿(2025-06): 정상 오픈 가중치 모델의 채팅 템플릿에 조건부 지시를 넣어 재배포, 지정 문구가 나타나면 공격자 지시가 실행됨 (ATLAS AML.CS0064)

UT-14.4:
  summary: |-
    - 공격자는 학습·변조 단계에서 심어 둔 백도어를 이미지 패치·특정 키워드·문맥 같은 트리거를 담은 입력으로 발동시켜, 모델이 공격자가 정한 출력을 내게 할 수 있음
    - 트리거가 없을 때는 정상 동작해 운영 중 발견이 어렵고, 물리 환경에 트리거를 두면 접근 권한 없이도 발동할 수 있음
  reference: |-
    ■ AI 관점
    - 트리거 형태: 사람이 알아차리기 어려운 이미지 패치·스티커, 특정 단어·문구, 대화 문맥 조건 (ATLAS AML.T0043.004)
    - 전제 조건: 학습 데이터 오염(UT-09.1)·가중치 조작(UT-14.1)·구조 변조(UT-14.2)·템플릿 변조(UT-14.3)로 백도어가 먼저 심어져 있어야 함
    - 탐지 회피·인증 우회 같은 보안 판단 모델에서는 트리거만 제시하면 판정이 뒤집혀 피해가 커짐
    ■ 실제 사례
    - [실증] 모바일 앱 모델 백도어(2021-01): 재패키징한 앱의 모델이 카메라에 비친 시각 트리거를 인식하면 판단을 우회 — 여러 안전 관련 앱에서 확인 (ATLAS AML.CS0013)

UT-15.1:
  summary: |-
    - 공격자는 모델 응답의 확신도·손실·확률 차이나 유사도 검색 결과를 반복 관찰해, 특정 개인이나 기록이 학습 데이터·색인에 포함되었는지 판별할 수 있음
    - 원문을 꺼내지 않아도 '포함 여부' 자체가 민감정보(특정 질환 환자 여부 등)가 되며, 여러 계정·변형 질의로 이용 제한을 피함
  reference: |-
    ■ AI 관점
    - 수법: 대상 레코드와 변형 질의를 넣어 확률·순위·지연 차이를 비교하거나 섀도 모델로 판정 기준을 학습 (ATLAS AML.T0024.000)
    - 파인튜닝 모델은 특히 취약해, SPV-MIA는 파인튜닝 대상에서 판별 성능(AUC)을 0.9까지 높임 (OWASP LLM02:2026 예시 #5)
    - 원시 유사도 점수를 돌려주는 벡터 검색은 LLM 없이도 멤버십 판별 수단이 됨 (OWASP LLM09:2026 예시 #5)
    - 차등프라이버시 학습, 확률·점수 비공개, 사용자별 질의 예산과 반복 탐침 탐지가 필요함 (OWASP DSGAI18)
    ■ 실제 사례
    - 공개 사고 미확인 — 연구 실증 중심
    - [시나리오] 임상 데이터로 파인튜닝한 모델에서 기록을 꺼내지 않고도 특정 환자의 학습 포함 여부를 높은 정확도로 판별 — HIPAA 신고 대상 판단 (OWASP LLM02:2026 시나리오 #8)

UT-15.2:
  summary: |-
    - 공격자는 모델의 확신도 점수를 전략적으로 질의하거나 유출된 임베딩 벡터를 역산해, 학습 데이터의 속성·샘플이나 임베딩의 원문 텍스트를 복원할 수 있음
    - 최신 역전 기법은 인코더별 학습 없이도 동작해, '임베딩만 유출'된 사고도 원문 유출과 같은 수준으로 다뤄야 함
  reference: |-
    ■ AI 관점
    - 모델 역전: 추론 API의 신뢰도 점수를 이용해 학습 데이터 샘플·속성을 재구성 (ATLAS AML.T0024.001)
    - 임베딩 역전: Vec2Text는 32토큰 입력을 92% 정확도로 복원하고, ZSInvert·Zero2Text는 인코더별 학습 없이 블랙박스·차등프라이버시 잡음 환경에서도 동작 (OWASP LLM09:2026 예시 #2)
    - 노출 경로: 벡터 DB 백업, 외부 서비스로 보낸 임베딩, 설정 오류로 노출된 클라우드 저장소, 벡터 DB 취약점(UT-13.3)
    - 임베딩 원본 내보내기 API 제한, 저장 전 잡음·차원 축소, 벡터 백업의 원본 등급 보호가 필요함 (OWASP DSGAI18)
    ■ 실제 사례
    - 공개 사고 미확인 — 연구 실증 중심
    - [시나리오] 설정 오류로 '임베딩 전용' 벡터 DB 백업이 노출되어 처음엔 낮은 심각도로 분류됐으나, 역전 공격으로 개인정보가 담긴 원문이 복원되어 원문 유출 사고로 재분류 (OWASP LLM09:2026 시나리오 #3)

UT-16.1:
  summary: |-
    - 공격자는 대량 계정·프록시로 추론 API를 반복 질의하고 그 응답으로 자체 모델을 학습시켜, 대상 모델의 기능을 복제한 대리 모델을 만들 수 있음(증류)
    - 막대한 개발 투자의 결과물이 질의 비용만으로 유출되며, 복제 모델은 원본의 안전장치 없이 쓰이거나 화이트박스 공격 준비에 활용됨
  reference: |-
    ■ AI 관점
    - 수법: 목표 능력(추론·코딩·도구 사용)을 끌어내는 질의 데이터셋을 만들어 반복 질의하고, 응답을 학습 데이터로 써 기능을 복제 (ATLAS AML.T0024.002·T0005.001)
    - 추론 과정을 길게 출력하도록 유도해 내부 추론 논리까지 가져가는 캠페인이 관찰됨 (OWASP DSGAI01)
    - 공개 자료·사전학습 모델로 대리 모델을 만들어 적대적 예제를 사전 검증하는 용도(UT-17.1)로도 쓰임 (ATLAS AML.T0005)
    - 계정·결제 수단 단위 이상 사용량 탐지, 출력 확률 비공개, 추론 과정 노출 제한, 이용 약관 집행이 필요함 (OWASP DSGAI20)
    ■ 실제 사례
    - [실제 사고] Claude 증류 캠페인(2026-02): DeepSeek·Moonshot·MiniMax가 약 2.4만 개 부정 계정과 상용 프록시로 1,600만 건 이상 질의해 응답으로 자체 모델을 학습 (ATLAS AML.CS0056)
    - [실증] 기계 번역 서비스 복제(2020-04): Google 번역 등 공개 API에서 얻은 번역 쌍으로 실서비스에 근접한 모델을 만들고, 이를 이용한 적대적 입력을 실제 서비스에 전이 (ATLAS AML.CS0005)

UT-16.2:
  summary: |-
    - 공격자는 앱 패키지·모델 저장소·학습 클러스터·노트북 환경에서 모델 가중치와 학습 데이터 같은 AI 아티팩트 파일을 직접 찾아 수집·반출할 수 있음
    - 핵심 지식재산이 통째로 빠져나가고, 확보한 모델로 오프라인 화이트박스 공격과 변조 모델 재배포까지 가능해짐
  reference: |-
    ■ AI 관점
    - 수집 위치: 모바일·데스크톱 앱 패키지 속 모델(암호화된 모델은 실행 중 복호화 시점에 가로챔), 모델 레지스트리·컨테이너 이미지, 학습 클러스터·노트북의 작업 디렉터리 (ATLAS AML.T0035)
    - 인증 없는 학습 클러스터(UT-31.1)나 침해한 노트북 환경에서는 운영 모델과 데이터가 함께 수집됨
    - 탈취된 모델은 적대적 예제 생성(UT-17.1)과 백도어 삽입 후 재배포(UT-14.2)에 재사용되며, 반출 수단은 UT-02.6과 같음
    - 온디바이스 모델 암호화·무결성 검증, 레지스트리 접근 통제와 대용량 아티팩트 다운로드 감시가 필요함 (OWASP DSGAI20)
    ■ 실제 사례
    - [실제 사고] ShadowRay(2023-09~): 인증 없는 Ray 클러스터에서 여러 조직의 운영 워크로드가 관찰되었고, 운영 모델·데이터 수집이 가능했음 (ATLAS AML.CS0023)
    - [실증] Google Photos 모델 추출(2025-03): APK의 암호화되지 않은 자산과 네이티브 라이브러리에서 TFLite 모델을 꺼내고, 암호화된 모델은 Frida로 실행 중 가로챔 (ATLAS AML.CS0058)
    - [실증] Azure 서비스 중단 레드팀(2020): 침투 후 대상 모델 파일과 학습 데이터를 찾아 오프라인 회피 공격에 사용 (ATLAS AML.CS0010)

UT-17.1:
  summary: |-
    - 공격자는 모델 내부 정보·대리 모델·반복 질의로 최적화한 미세 변형 입력이나 수작업 변형으로, 탐지·분류·인증 모델이 악성 파일·피싱 페이지·위조 얼굴을 정상으로 판단하게 할 수 있음
    - 보안 탐지와 본인 확인처럼 판단 결과가 곧 통제인 영역에서 오판이 직접 침투·사기로 이어짐
  reference: |-
    ■ AI 관점
    - 최적화 방식: 모델 전체를 아는 화이트박스 최적화, API 질의만 쓰는 블랙박스 최적화, 대리 모델에서 만든 예제를 옮기는 전이 공격, 판단 근거를 추정한 수작업 변형 (ATLAS AML.T0043)
    - 검증 후 실행: 오프라인 사본이나 API로 효과를 확인한 뒤 실제 대상에 사용해 실패 흔적을 줄임 (ATLAS AML.T0042·T0015)
    - 대상: 악성코드·스팸·피싱 탐지기, 얼굴인식·신분 확인, 콘텐츠 분류기 — 딥페이크 영상 주입(UT-04.1)과 결합하면 인증 우회가 됨
    - 출력 점수 노출(UT-01.4)과 모델 복제(UT-16.1)가 공격 성공률을 크게 높임
    ■ 실제 사례
    - [실제 사고] ML 피싱 탐지 회피(2022-12): 브랜드 로고를 흐리게 하거나 회사명 스타일을 바꾸는 등 간단한 수작업 변형으로 시각 유사도 모델을 회피 — 다른 탐지 요소에는 걸림 (ATLAS AML.CS0032)
    - [실증] Cylance 탐지 우회(2019-09): 보조 모델이 주 모델 판정을 덮어쓰는 구조를 파악하고 정상 파일 속성을 악성코드에 섞어 범용 우회 (ATLAS AML.CS0003)
    - [실증] ProofPoint 회피(2019-09): 메일 헤더의 점수로 복제 모델을 만들어 실제 메일 보호 모델이 통과시키는 악성 메일을 생성 (ATLAS AML.CS0008)

UT-17.2:
  summary: |-
    - 공격자는 적대적 패턴을 인쇄한 패치·안경·스티커·표지를 실제 환경에 두어, 카메라로 입력을 받는 얼굴인식·객체 탐지·자율주행 모델이 대상을 잘못 인식하게 할 수 있음
    - 시스템에 접근하지 않고 물리 공간만으로 공격하므로 디지털 보안 통제가 닿지 않으며, 안전·출입 통제에 직접 영향을 줌
  reference: |-
    ■ AI 관점
    - 수법: 대리 모델에서 촬영 각도·조명 변화를 반영해 최적화한 패턴을 인쇄해 착용·부착 (ATLAS AML.T0041·T0008.003)
    - 대상: 출입 통제 얼굴인식, CCTV 객체 탐지, 자율주행·로봇 비전, 매장 무인 결제 — 오인식이 곧 물리적 침입·안전 사고로 이어짐
    - 물리 트리거로 백도어를 발동하는 경우는 UT-14.4, 디지털 입력 변형은 UT-17.1에서 다룸
    - 다중 센서 교차 확인, 물리 환경 이상 탐지, 적대적 패치 강건성 시험이 필요함
    ■ 실제 사례
    - [실증] 얼굴 식별 서비스 회피(2020-01): MITRE 레드팀이 공개 데이터로 만든 대리 모델에서 최적화한 패치를 인쇄해 상용 얼굴 식별 서비스에 표적 오분류를 유도 (ATLAS AML.CS0012)
