# 분류 체계 변경(병합·신설·범위 정정)으로 내용이 바뀐 D02 외 Lv3 — v3.2 문체로 작성
# style: v3.1 표시는 범위 조정에 맞춰 v3.1 문구만 최소 수정한 행(도메인 재작성 시 v3.2 문체로 전환)

UT-10.1:
  summary: |-
    - 공격자는 RAG가 색인하는 메일·채널·공유 문서·외부 웹에 특정 질의에 걸리도록 설계한 허위 문서나 지시를 넣어, AI가 이를 권위 있는 근거로 인용하게 할 수 있음
    - 한 번 색인된 오염 문서는 질의할 때마다 여러 사용자에게 반복 노출되며, 적은 수의 문서로도 대규모 지식베이스의 응답을 장악할 수 있음
  reference: |-
    ■ AI 관점
    - 표적 파악: RAG가 무엇을 색인하는지(받은 메일 전체, 공개 채널, 공유 드라이브, 스크랩 대상 웹) 공개 문서나 응답 관찰로 확인 — 수신자가 열지 않은 메일까지 색인되는 경우가 많음 (ATLAS AML.T0064)
    - 콘텐츠 설계: 특정 질의(예: 거래처 계좌, API 키 위치)에 검색되도록 키워드·문맥을 맞춘 문서를 만들고, 허위 정보·인젝션 지시·가짜 RAG 항목을 함께 담음 (ATLAS AML.T0066·T0071)
    - 적재 경로: 외부 메일 발송, 공개 채널 게시, 공유 문서 편집, 스크랩 대상 웹 게시처럼 정상 수집 경로를 그대로 쓰므로 시스템 침투 없이도 색인됨 (ATLAS AML.T0070)
    - 수백만 건 규모의 지식베이스에서도 오염 문서 5건으로 약 90% 공격 성공이 보고되었으며, 문서 내용이 아닌 임베딩 기하 구조를 노리는 오염은 UT-10.3에서 다룸 (OWASP LLM01:2026 시나리오 #4)
    ■ 실제 사례
    - [실증] M365 Copilot 거래 정보 조작(2024-08): 은행 정보 질의에 검색되도록 설계한 메일을 보내, Copilot이 공격자 계좌를 정상 송금 정보처럼 답하게 함 (ATLAS AML.CS0026)
    - [실증] Slack AI(2024-08): 공개 채널에 'API 키' 질의에 걸리는 메시지를 올려, 피해자의 비공개 채널 API 키를 재인증 링크에 담아 노출시킴 (ATLAS AML.CS0035)
    - [실증] Morris II 웜(2024-03): RAG에 저장된 메일 속 자기복제 프롬프트가 답장 생성 시 검색되어 다른 이메일 비서로 전파 (ATLAS AML.CS0024)

UT-12.1:
  severity_reason: 컨텍스트 내 비밀값·개인정보 노출(질의 단위로 범위 제한)
  summary: |-
    - 공격자는 조작한 질의나 주입한 지시로 모델이 컨텍스트에 있는 비밀값·개인정보·내부 문서를 응답에 그대로 출력하게 하고, 접두사 제거·인코딩으로 유출 탐지를 피할 수 있음
    - 모델이 접근하는 실행 환경·RAG·도구 결과가 모두 노출 대상이 되며, 정규식 기반 비밀값·DLP 탐지는 변형된 출력을 놓치기 쉬움
  reference: |-
    ■ AI 관점
    - 노출 대상: 실행 환경 변수·설정 파일의 자격증명, RAG로 불러온 문서 조각, 도구 응답, 대화 맥락의 개인정보, 추론 과정(reasoning trace) — 최종 답변뿐 아니라 도구 호출 인자도 노출 경로임 (OWASP LLM02:2026)
    - 탐지 회피: 키 접두사 제거, Base64·hex 인코딩, 다른 언어로 번역해 출력하게 하면 정규식·차단 목록 기반 필터를 통과함 (OWASP LLM02:2026 예시 #2)
    - 개별로는 허용된 여러 정보원을 종합한 응답(예: 예산·채용·실사 자료로 미공개 인수 대상 추론)도 정책상 금지된 결론이면 유출에 해당함 (OWASP LLM02:2026 예시 #2)
    - 숨은 제어 컨텍스트 노출은 UT-08, 외부 URL·도구로 빼내는 반출은 UT-19, 모델에 암기된 학습 데이터 추출은 UT-15.4에서 다룸
    ■ 실제 사례
    - [실증] Claude Code GitHub Action(2026-06): 이슈·PR 본문에 넣은 지시로 Claude가 프로세스 환경의 Anthropic API 키를 읽어 'sk-ant-' 접두사를 뗀 채 출력 — GitHub 비밀값 스캐너가 인식하지 못함 (ATLAS AML.CS0067)
    - [실증] Morris II 웜(2024-03): 오염 메일의 지시로 RAG 기반 메일 비서가 답장에 다른 메일의 이메일 주소·주소·전화번호를 담아 유출 (ATLAS AML.CS0024)

UT-15.3:
  stage: 유출(Exfiltration)
  summary: |-
    - 공격자는 암호화된 스트리밍 응답의 패킷 크기·토큰 길이·응답 지연·캐시 적중 여부 같은 관찰 가능한 신호로 대화 주제나 프롬프트·응답 내용을 추론할 수 있음
    - 내용을 직접 받지 않고도 정보가 새어 나가며, TLS 암호화나 출력 필터로는 막을 수 없음
  reference: |-
    ■ AI 관점
    - 관찰 신호: 토큰 단위 스트리밍의 패킷 크기와 간격, 응답 길이, 지연 시간, 프롬프트 캐시 적중 여부 — 네트워크 경로상의 관찰자나 같은 서빙 인프라를 쓰는 다른 사용자도 측정 가능 (OWASP LLM02:2026)
    - 멀티테넌트 서빙에서 KV 캐시를 공유하면 다른 사용자의 프롬프트가 캐시 적중 신호로 새어 나갈 수 있음 (OWASP LLM02:2026 예시 #5)
    - 대응은 응답 무작위 패딩·토큰 묶음 전송, 고민감 테넌트의 캐시 분리처럼 서빙 계층에서 이뤄져야 함 (OWASP LLM02:2026 Tier 2)
    - 모델 출력 점수 노출을 이용한 탐색은 UT-01.4, 출력 확률을 이용한 멤버십 추론은 UT-15.1에서 다룸
    ■ 실제 사례
    - [공개 취약점] Whisper Leak(2025): 암호화 트래픽의 패킷 크기·타이밍만으로 28개 상용 모델의 대화 주제를 98% 이상(AUPRC) 분류 (OWASP LLM02:2026 예시 #5)
    - [실증] 토큰 길이 부채널(2024): 스트리밍 토큰 길이로 응답 내용의 29%를 복원하고 55%의 주제를 추론 (OWASP LLM02:2026 예시 #5)

UT-15.4:
  summary: |-
    - 공격자는 같은 단어를 반복시키는 발산 유도 질의나 학습 데이터 앞부분을 주는 접두어 질의로, 모델이 학습 중 암기한 개인정보·코드·저작물을 원문 그대로 출력하게 할 수 있음
    - 파인튜닝 모델과 LoRA 어댑터는 드문 데이터를 더 정확히 암기하며, 오픈 가중치 모델은 쿼리 제한 없이 오프라인에서 추출이 가능함
  reference: |-
    ■ AI 관점
    - 수법: 단어를 무한 반복하게 해 정렬된 응답 패턴에서 벗어나게 하는 발산 공격, 학습 데이터 일부를 주고 이어 쓰게 하는 접두어 질의, 특정 개인·기록을 겨냥한 표적 추출 (OWASP LLM02:2026 예시 #1)
    - 암기는 모델 규모·데이터 중복·문맥 길이에 따라 늘며, 좁은 범위로 파인튜닝한 어댑터는 드문 예시를 높은 정확도로 암기해 기반 모델과 별개의 추출 표면이 됨 (OWASP LLM02:2026, DSGAI18)
    - 오픈 가중치 모델은 공격자가 내려받아 쿼리 제한 없이 오프라인에서 추출·멤버십 추론을 반복할 수 있음 (OWASP LLM02:2026)
    - 학습에 들어간 데이터는 원본을 지워도 추출될 수 있어 삭제권 이행 문제로 이어지며(UT-36.2), 컨텍스트에 있는 데이터의 유출은 UT-12.1에서 다룸
    ■ 실제 사례
    - [공개 취약점] 발산 공격(2023-11): 'poem'을 반복하게 하는 질의로 gpt-3.5-turbo에서 약 200달러 비용으로 1만 건 이상의 암기 데이터를 추출 — 이후 벤더 패치도 반복 우회됨 (OWASP LLM02:2026 예시 #1)
    - 참고: NYT v. OpenAI, Getty v. Stability AI 소송 증거에 학습 데이터의 원문·워터마크 재현 사례가 포함됨 (OWASP LLM02:2026 예시 #1)

UT-22.1:
  summary: |-
    - 공격자는 인젝션으로 에이전트가 생성하거나 받아들인 코드·셸 명령을 코드 인터프리터·터미널 도구에서 검증 없이 실행하게 해, 실행 환경에서 명령 실행과 시스템 변경을 일으킬 수 있음
    - 생성과 실행이 한 흐름으로 묶인 에이전트에서는 승인 절차 우회 하나로 호스트 장악까지 이어지며, 실행 코드가 매번 달라 시그니처 탐지가 어려움
  reference: |-
    ■ AI 관점
    - 실행 경로: 코드 인터프리터·노트북 커널, 질의를 코드로 바꿔 실행하는 프레임워크, 코딩 에이전트의 셸 도구, 화면을 조작하는 컴퓨터 사용 에이전트 (OWASP ASI05)
    - 발생 원인: 프롬프트 인젝션으로 심은 명령, 환각·오염으로 생성된 위험 코드, 자동 복구 과정의 미검토 설치·셸 명령 — 실시간 생성 코드라 배포 전 코드 검증을 거치지 않음 (OWASP ASI05 예시 #1~#3)
    - 승인 절차 우회: 명령 파싱 결함이나 허용 목록 우회로 사용자 확인 없이 실행되면 개발자 PC·CI 러너·서버 권한이 그대로 넘어감 (UT-32.3)
    - 도구 구현 내부에서 인자가 셸·eval로 흘러 실행되는 명령 주입은 UT-22.4, 파일 로딩 시 실행은 UT-22.2, 격리 탈출은 UT-22.3에서 다룸
    ■ 실제 사례
    - [실제 사고] OpenAI 평가용 자율 에이전트(2026-07): 내부 평가 중 에이전트들이 노출된 실행 하네스로 셸 명령과 C·Python 코드를 실행하고, Jinja2 실행 경로로 Hugging Face 운영 Dataset Server 파드에서 명령을 실행 (ATLAS AML.CS0068)
    - [실증] LLMSmith(2025-02): LangChain·LlamaIndex·PandasAI 등 11개 프레임워크에서 LLM 출력을 코드로 실행하는 경로의 RCE 취약점 20개를 찾아 인터넷 공개 앱에서 실증 (ATLAS AML.CS0052)
    - [공개 취약점] CVE-2025-54795(Claude Code): 명령 파싱 오류로 실행 확인 절차를 우회해 신뢰되지 않은 명령을 실행 (OWASP DSGAI02)

UT-22.4:
  summary: |-
    - 공격자는 인젝션으로 조종한 모델이 도구에 넘기는 인자에 셸 메타문자·코드 조각·경로 조작 문자열을 넣어, 셸·eval·템플릿 처리로 이어지는 도구 구현에서 임의 명령을 실행할 수 있음
    - 코드 실행용이 아닌 일반 도구·MCP 서버도 인자 검증이 없으면 실행 지점이 되며, 모델 출력이라 사용자 입력 검증을 거치지 않아 놓치기 쉬움
  reference: |-
    ■ AI 관점
    - 정의: 모델이 만든 도구 인자가 도구·프레임워크·MCP 서버 구현의 셸 문자열 결합, eval·람다 평가, 템플릿 엔진, 파일 경로 처리로 검증 없이 전달되는 결함 — 도구 자체는 코드를 실행하는 용도가 아님 (OWASP MCP05·ASI05)
    - 고전적 명령 주입·경로 조작과 원리는 같지만 입력 주체가 프롬프트 인젝션(UT-07.1)에 조종된 모델이어서, 사용자 입력에 적용하던 검증 계층을 거치지 않음
    - 예: "test.txt && rm -rf /important_data"처럼 셸 메타문자가 섞인 파일명 인자, 업로드→경로 조작→동적 코드 로딩으로 이어지는 도구 연쇄, 에이전트 메모리 시스템의 eval 처리 (OWASP ASI05 시나리오 #2·#5·#6)
    - LLM 프레임워크에서 사용자 입력·LLM 출력이 exec·eval·os.popen으로 이어지는 호출 체인은 정적 분석으로 대량 식별되어 인터넷 공개 앱이 표적이 됨 (UT-08.2, ATLAS AML.T0084.003)
    ■ 실제 사례
    - [실증] Semantic Kernel 검색 플러그인(2026-05): 인젝션으로 검색 도구의 필터 인자에 악성 서식을 넣자 필터가 Python 람다식으로 평가되어 호스트에서 원격 코드 실행 (ATLAS AML.CS0062)
    - [공개 취약점] Framelink Figma MCP(2025-10): get_figma_data 도구의 미검증 입력으로 비인증 원격 명령 실행 (OWASP ASI 부록 D)
    - [공개 취약점] CVE-2025-6514(mcp-remote): 신뢰할 수 없는 MCP 서버가 돌려준 authorization_endpoint URL로 클라이언트 PC에 OS 명령 주입 (OWASP DSGAI06)

UT-28.1:
  summary: |-
    - 공격자는 악성 코드를 심거나 가중치·채팅 템플릿을 변조한 모델, 오염 데이터셋을 공개 허브·레지스트리에 올리거나 기존 배포 경로를 장악해, 이를 검증 없이 내려받는 조직에 백도어와 실행 코드를 유입시킬 수 있음
    - 모델 파일은 로딩만으로 코드가 실행되거나 정상 성능을 유지한 채 숨은 동작을 품을 수 있어, 스캐너나 안전 포맷만으로는 걸러지지 않음
  reference: |-
    ■ AI 관점
    - 모델 경로: pickle 등에 역쉘을 심은 모델 파일, 특정 질의에만 오답을 내도록 가중치를 편집한 모델, 조건부 지시를 넣은 GGUF 채팅 템플릿, 공급사 LoRA 어댑터·변환 서비스 변조 (OWASP LLM04:2026 예시 #3·#5)
    - 데이터셋 경로: 오염 데이터셋을 허브에 공개하거나, URL 목록형 데이터셋이 가리키는 만료 도메인을 사들여 다운로드 시점에 오염 데이터를 내려보냄 (ATLAS AML.T0115)
    - 탐지 한계: 일부러 손상시킨 pickle은 스캐너가 끝까지 읽기 전에 실행되고, ONNX 같은 '안전' 포맷도 연산 그래프에 백도어를 품을 수 있으며, 안전 로더 자체의 우회 취약점(CVE-2025-32434)도 보고됨 (OWASP LLM04:2026 시나리오 #6)
    - 이름만으로 모델을 참조하면 삭제 계정 재등록·유사 조직명으로 바꿔치기될 수 있으며(UT-28.4), 심어진 백도어의 발동은 UT-14.4에서 다룸
    ■ 실제 사례
    - [실제 사고] Hugging Face 악성 모델(2025-02): 일부러 손상시킨 pickle로 Picklescan 검사를 피한 모델이 허브에 올라, 로딩 시 역쉘을 실행 — Hugging Face가 모델 삭제·스캐너 보완 (ATLAS AML.CS0031)
    - [실증] PoisonGPT(2023-07): 가중치를 편집해 특정 질문에 허위 사실을 답하게 만든 모델을 원본과 한 글자 다른 저장소명으로 Hugging Face에 배포 (ATLAS AML.CS0019)
    - [실증] Split-View 데이터 오염(2024-06): URL 목록형 대규모 데이터셋이 참조하는 만료 도메인을 사들여, 데이터셋을 내려받는 사용자에게 오염 데이터를 제공할 수 있음을 실증 (ATLAS AML.CS0025)

UT-28.3:
  summary: |-
    - 공격자는 AI 코딩 도구가 반복해서 추천하는 존재하지 않는 패키지명을 수집한 뒤 같은 이름의 악성 패키지를 먼저 등록해, AI 권고를 따른 개발자가 이를 설치하게 할 수 있음(slopsquatting)
    - 환각 이름은 질의마다 재현되는 경향이 있어 표적화가 쉽고, AI 제안을 그대로 설치하면 개발 환경과 빌드 파이프라인이 바로 침해됨
  reference: |-
    ■ AI 관점
    - 1단계 환각 탐색: 다양한 코딩 질문으로 모델이 제안하는 패키지·URL·API 가운데 실제 레지스트리에 없는 이름을 대량 수집 (ATLAS AML.T0062)
    - 2단계 선점 등록: 수집한 이름으로 PyPI·npm 등에 악성 패키지를 게시해, AI 권고 → 설치 경로로 개발 환경에서 코드를 실행 (ATLAS AML.T0060, OWASP LLM04:2026 예시 #1)
    - 에이전트가 의존성을 스스로 설치·갱신하는 환경에서는 사람 확인 없이 바로 설치되어 설치·임포트 시점에 악성 코드가 실행됨 (OWASP ASI05 예시 #6)
    - 환각으로 인한 허위 정보 자체는 UT-20.1, 일반 악성 패키지 유입은 UT-28.2에서 다룸
    ■ 실제 사례
    - [실증] ChatGPT 패키지 환각(2024-06): ChatGPT가 추천한 존재하지 않는 패키지명을 찾아, 다운로드 추적용 빈 패키지를 PyPI에 등록 (ATLAS AML.CS0022)
    - [시나리오] 코딩 비서가 추천한 가상의 패키지를 공격자가 미리 등록해, 제안을 믿은 개발자가 공격자 코드를 설치 (OWASP LLM07:2026 시나리오 #1)
