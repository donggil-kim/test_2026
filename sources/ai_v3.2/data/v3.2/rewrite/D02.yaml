# D02. 프롬프트 인젝션 및 컨텍스트 노출 — v3.2 재작성(파일럿)
# summary: 요약설명(2줄 개조식) / reference: 참조(■ AI 관점 · ■ 실제 사례)
# 사례 표기: [실제 사고] 실제 발생 사고 · [공개 취약점] CVE·벤더 확인 취약점·운영 서비스 대상 PoC
#            [실증] 연구·레드팀 시연(ATLAS Exercise 등) · [시나리오] OWASP 공격 시나리오

UT-06.1:
  severity_reason: 앱 권한 범위 내 비인가 조회·실행
  summary: |-
    - 공격자는 '이전 지시 무시'·관리자 권한 사칭 같은 입력으로 시스템 프롬프트의 역할·제약을 무력화해, 모델이 허용 범위 밖의 정보를 노출하거나 기능을 실행하게 할 수 있음
    - 모델은 지시와 데이터를 구조적으로 구분하지 못해 완전한 차단이 불가능하며, 도구 권한을 가진 에이전트에서는 비인가 조회·실행으로 바로 이어짐
  reference: |-
    ■ AI 관점
    - 대상: 고객 지원 챗봇, 사내 코파일럿, 업무·코딩 에이전트처럼 사용자 입력을 시스템 프롬프트와 같은 컨텍스트에서 처리하는 모든 LLM 앱 (OWASP LLM01:2026 예시 #1)
    - 수법: 직접 재정의 문구, 개발자·관리자 사칭, 출력 형식 지정을 가장한 지시 삽입 — 별도 인스턴스에서 반복 수정해 성공률 높은 프롬프트를 미리 확보함 (ATLAS AML.T0051.000·T0065)
    - 피해 범위는 앱에 부여된 권한이 결정: DB·메일·코드 실행 권한이 있으면 비인가 조회·발송·실행으로 확대되므로 시스템 프롬프트를 인가 경계로 쓰면 안 됨 (UT-21.2·21.4)
    - 시스템 프롬프트·도구 스키마를 먼저 빼내거나(UT-08.1) 벤더 파인튜닝 API가 돌려주는 손실값으로 페이로드를 최적화하면 성공률이 높아지며, 방어 기법을 아는 적응형 공격에는 최신 방어 다수가 90% 이상 우회됨 (OWASP LLM01:2026 예시 #7)
    ■ 실제 사례
    - [실제 사고] Skynet 악성코드(2025-06): 바이너리에 "이전 지시를 모두 무시하라"는 문구를 넣어 LLM 기반 악성코드 분석·탐지 도구의 판정 조작을 시도한 샘플이 VirusTotal에서 발견됨 — 시험한 모델에서는 실패 (ATLAS AML.CS0043)
    - [실증] MathGPT(2023-01): 질문을 Python 코드로 바꿔 실행하는 앱에서 지시를 재정의해 호스트 환경변수의 OpenAI API 키를 노출시키고 서비스 거부를 유발 (ATLAS AML.CS0016)
    - [공개 취약점] CVE-2024-5184(EmailGPT): 사용자 입력으로 서비스 로직을 장악해 시스템 프롬프트 노출·데이터 유출 가능 (OWASP DSGAI01)

UT-06.2:
  summary: |-
    - 공격자는 역할극·허위 권한 주장·다단계 설득·우회 표현으로 모델의 안전 정책과 가드레일을 무력화해, 금지된 콘텐츠를 생성하거나 거부해야 할 작업을 수행하게 할 수 있음
    - 탈옥된 모델은 악성코드·사기 콘텐츠 생성과 에이전트 기반 공격 운용에 쓰이며, 정책 기반 차단은 표현만 바꾼 재시도에 반복적으로 뚫림
  reference: |-
    ■ AI 관점
    - 수법: 역할극·가상 시나리오, 점진적 설득, 허위 목적·권한 주장, 금지어 우회 표현, 최적화된 적대적 문자열 — 저자원 언어·인코딩과 결합하면 분류기 회피율이 높아짐 (OWASP LLM01:2026 예시 #8)
    - 프롬프트 외에 가중치·안전장치를 직접 수정하는 방식도 있어, 오픈 가중치 모델은 정렬을 제거할 수 있고 안전 기능을 뺀 파인튜닝본이 정상 모델처럼 배포되기도 함 (ATLAS AML.T0054, OWASP LLM04:2026 시나리오 #2)
    - 목적은 금지 콘텐츠 생성(악성코드·피싱 문안·불법 이미지)과 에이전트의 거부 동작 해제로 나뉘며, 후자는 자율 공격 운용(UT-03.1)·파괴적 명령 실행(UT-21.5)의 선행 단계가 됨
    - 탈취한 API 키로 접근한 AI 서비스에서 탈옥이 이뤄지면 금지 콘텐츠 생성의 비용·책임이 키 소유 조직에 귀속됨 (UT-25.4)
    ■ 실제 사례
    - [실제 사고] Storm-2139(2024-12): 공개된 고객 자격증명으로 Azure OpenAI 계정에 접근한 뒤 콘텐츠 필터를 우회하는 자체 도구를 만들어 공급하고, 유명인 비동의 성적 이미지 등 금지 콘텐츠를 생성 — Microsoft가 민사 소송 제기 (ATLAS AML.CS0057)
    - [실제 사고] GTG-1002(2025-09): 허위 권한 주장, 방어 보안 업무 페르소나, 무해해 보이는 작업 분할로 Claude Code의 안전장치를 우회한 뒤 약 30개 조직 대상 자율 사이버 첩보 수행 (ATLAS AML.CS0069)
    - [실증] Claude Computer Use(2024-10): PDF에 '보안 시험용 가상 환경'이라는 거짓 맥락과 인코딩된 명령을 넣어 가드레일을 우회, bash 도구로 파일 시스템 삭제 명령 실행 (ATLAS AML.CS0046)

UT-06.3:
  summary: |-
    - 공격자는 인코딩·비가시 유니코드·배경색 글꼴·숨김 HTML·페이로드 분할로 인젝션 지시를 가려, 입력 가드레일과 사람 검토를 모두 통과시킬 수 있음
    - 모델은 가려진 지시를 그대로 해석하지만 화면과 필터에는 정상 텍스트로 보여, 직접·간접 인젝션의 성공률을 높이는 공통 수단이 됨
  reference: |-
    ■ AI 관점
    - 텍스트 은닉: 0px·배경색 글꼴, HTML 주석·숨김 요소, 페이지 제목 태그, 문서 머리글 — 사람이 보는 화면과 모델이 읽는 텍스트가 달라짐 (ATLAS AML.T0068)
    - 인코딩·변형: Base64·ROT13·hex 인코딩 후 디코딩 지시, 여러 입력 필드에 나눠 넣고 모델이 조합하게 하는 분할, 저자원 언어·코드 혼용 — 학습하지 않은 형식의 분류기를 통과 (OWASP LLM01:2026 예시 #8·시나리오 #5)
    - 비가시 유니코드: 태그 블록(U+E0000~E007F)·변형 선택자·제로폭 문자는 화면에 표시되지 않아 코드 리뷰·PR 승인을 통과하고, 반대로 응답에 데이터를 숨겨 반출하는 데도 쓰임 (UT-19.3)
    - 직접 입력(UT-06.1)보다 간접 주입 콘텐츠(UT-07.1)를 숨기는 데 더 자주 쓰이며, 이미지·음성 등 비텍스트 채널 은닉은 UT-06.4에서 다룸
    ■ 실제 사례
    - [실제 사고] AI 추천 오염 링크(2026-02): 'AI로 요약' 버튼 뒤에 자사 도메인을 신뢰 출처로 기억하라는 지시를 숨겨 URL 파라미터로만 전달 — 31개 기업이 50여 종을 유포 (ATLAS AML.CS0072)
    - [실증] Rules File Backdoor(2025-03): Cursor·GitHub Copilot 규칙 파일에 제로폭·양방향 유니코드로 지시를 숨겨 코드 리뷰를 통과하고, 생성 코드에 악성 스크립트를 삽입 — GitHub은 숨은 유니코드 경고 기능 추가 (ATLAS AML.CS0041)
    - [공개 취약점] M365 Copilot ASCII 스머글링(2024-08): 유니코드 태그 문자로 보이지 않는 지시와 데이터를 실어 Slack MFA 코드를 유출한 PoC (OWASP LLM01:2026 예시 #5)

UT-06.4:
  summary: |-
    - 공격자는 이미지·음성·영상 채널이나 파일 메타데이터에 지시를 숨겨, 텍스트만 검사하는 필터와 사람 검토를 피해 멀티모달 모델의 동작을 조작할 수 있음
    - 비전·음성 인코더가 숨은 지시를 텍스트처럼 해석해 유해 출력이나 도구 호출로 이어지며, 모달리티별 검사 없이는 탐지가 어려움
  reference: |-
    ■ AI 관점
    - 은닉 위치: 이미지 속 저대비·초소형 텍스트, 사람이 인지하지 못하는 픽셀 섭동, 작거나 빠른 음성, 단일 영상 프레임, EXIF·ID3·문서 메타데이터 (ATLAS AML.T0129)
    - 다수 모더레이션·필터는 텍스트 채널만 검사하므로 비텍스트 채널의 지시는 그대로 모델에 전달되고, 비전 인코더가 이를 추출해 출력 조작·도구 호출로 이어짐 (OWASP LLM01:2026 예시 #4)
    - 사용자가 올린 이미지뿐 아니라 OCR로 처리되는 송장·스크린샷, 웹페이지 이미지, 회의 녹음처럼 업무 파이프라인에 들어오는 비텍스트 입력 전반이 경로가 됨 (ATLAS AML.T0093)
    - 멀티모달 임베딩 검색에서는 이미지 한 장으로 특정 텍스트 질의의 검색 결과를 장악하는 오염도 가능 (UT-10.3)
    ■ 실제 사례
    - 공개 사고 미확인 — ATLAS가 2026-09에 신설한 기법(T0129)으로 실제 사고·사례연구는 아직 없음
    - [실증] 의료 영상 인젝션(2025): 사람이 인지하지 못하는 수준으로 영상에 지시를 넣어 4개 최신 비전-언어 모델의 종양 판독 출력을 조작 (OWASP LLM01:2026 시나리오 #6)

UT-07.1:
  summary: |-
    - 공격자는 AI가 처리하는 웹페이지·메일·문서·이슈·도구 응답에 지시를 숨겨, 사용자가 해당 콘텐츠를 요약·검색하는 순간 사용자 권한으로 데이터 조회·전송 등 비인가 행위를 실행시킬 수 있음
    - 사용자는 지시를 보지도 입력하지도 않으며, 메일 수신만으로 발동하는 제로클릭 경로도 있어 입력 검증·사용자 교육으로는 막기 어려움
  reference: |-
    ■ AI 관점
    - 유입 경로: 웹 브라우징·검색 결과, 수신 메일·캘린더 초대, 공유 문서, 이슈·티켓·PR 설명, MCP 도구 응답 — 사용자가 열지 않은 콘텐츠도 요약·검색·자동 처리 과정에서 컨텍스트에 들어감 (ATLAS AML.T0051.001·T0093)
    - 신뢰 표면 악용: 공개 폼·고객 티켓·공개 이슈 같은 저권한 채널에 심은 지시를 내부 사용자의 에이전트가 고권한으로 읽고 실행해, 공격자가 직접 할 수 없는 작업을 에이전트가 대신 수행 (OWASP LLM01:2026 예시 #3)
    - 비공개 데이터 접근·비신뢰 콘텐츠 처리·외부 통신이 동시에 가능한 에이전트('치명적 삼요소')에서 유출 피해가 커지며, 반출은 렌더링 URL·도구 호출로 이뤄짐 (UT-19.1·19.2)
    - 지시는 대개 난독화(UT-06.3)로 숨겨지고, RAG에 색인되면 이후 질의마다 다시 노출되는 코퍼스 오염(UT-10.1)으로 이어짐
    ■ 실제 사례
    - [공개 취약점] EchoLeak(2025-05): 메일 한 통이 M365 Copilot의 RAG 컨텍스트에 들어가 사용자 조작 없이 기업 데이터를 외부 URL로 유출 — 프롬프트 인젝션 분류기와 링크 차단 필터를 모두 우회 (ATLAS AML.CS0059, OWASP LLM01:2026 시나리오 #7)
    - [공개 취약점] GitHub 공개 이슈 경유 저장소 탈취(2025-05): 공개 이슈에 심은 지시를 개발자의 MCP 연결 에이전트가 읽고 비공개 저장소 내용을 유출 (OWASP ASI 부록 D·LLM01:2026 시나리오 #9)
    - [공개 취약점] ForcedLeak(2025-09): 외부 공격자가 Salesforce Agentforce에 주입한 지시로 에이전트를 오도해 CRM 레코드를 조직 밖으로 유출 (OWASP ASI 부록 D)

UT-07.2:
  summary: |-
    - 공격자는 특정 키워드·다음 대화 턴·사용자의 후속 요청 같은 조건에서 발동하는 지시를 미리 심어, 주입 시점의 보호 장치를 피한 뒤 나중에 도구 호출·데이터 유출을 실행시킬 수 있음
    - 주입과 실행 시점이 분리되어 턴 단위 도구 제한이나 실시간 탐지를 우회하며, 사후 원인 추적도 어려움
  reference: |-
    ■ AI 관점
    - 발동 조건: 특정 키워드, 다음 대화 턴, 사용자의 후속 요청, 메일 수신·문서 추가 같은 이벤트 — 에이전트 활성화 트리거를 파악하면 외부에서 발동 시점을 조절할 수 있음 (ATLAS AML.T0051.002·T0084.002)
    - 우회 대상: 비신뢰 데이터가 들어온 턴에서 도구 호출을 막는 보호 장치 — 실행을 다음 턴으로 미루면 그 턴에는 사용자 입력만 있는 것처럼 보임 (ATLAS AML.T0094)
    - 주입과 실행 사이에 시간 차가 있어 실시간 탐지·사후 추적이 어렵고, 메모리·대화 스레드에 기록되면 세션을 넘어 지속됨 (UT-11.1·11.2)
    ■ 실제 사례
    - [실증] Gemini 지연 도구 호출(2024-02): 메일 속 지시가 실행을 다음 대화 턴으로 미뤄, 비신뢰 데이터가 든 턴의 도구 호출 제한을 우회하고 Workspace 확장으로 비공개 문서를 조회 (ATLAS AML.CS0038)
    - [실증] Gemini 캘린더 초대(2025-08): 초대 제목에 심은 지시가 사용자의 "고마워" 응답에 발동해 일정 삭제·Google Home 기기 제어·Zoom 영상 송출·데이터 유출을 수행 (ATLAS AML.CS0063)
    - [실증] Copilot Studio 고객 지원 에이전트(2025-06): 메일 수신으로 동작하는 에이전트에 지시를 보내 회신 여부로 존재를 확인한 뒤, CRM 데이터를 메일로 유출 (ATLAS AML.CS0037)

UT-07.4:
  summary: |-
    - 공격자는 AI 에이전트를 노린 클릭 유도 화면, 프롬프트가 미리 채워진 AI 비서 링크, AI에만 다른 내용을 주는 클로킹으로 에이전트가 공격자 지시를 실행하도록 유인할 수 있음
    - 사용자는 'AI로 요약' 같은 정상 기능을 쓴다고 인식하고 사람·보안 도구에는 무해한 화면만 보여, 메모리 오염·명령 실행이 드러나지 않음
  reference: |-
    ■ AI 관점
    - 클릭 유인: 화면을 읽고 조작하는 컴퓨터 사용 에이전트·AI 브라우저는 버튼 문구·복사 안내 같은 UI 신호를 지시로 받아들여 클릭·코드 복사·실행을 수행 (ATLAS AML.T0100)
    - 조작 링크: 주요 AI 비서는 URL 파라미터(?q=·?prompt=)로 첫 프롬프트를 받으므로, 'AI로 요약' 버튼·공유 링크로 위장한 링크 한 번이 사용자 세션에서 공격자 지시를 실행 (ATLAS AML.T0131)
    - AI 대상 클로킹: 사용자 에이전트 문자열로 AI 브라우저·에이전트를 식별해 인젝션 콘텐츠를 주고, 사람·검색 크롤러·보안 스캐너에는 정상 콘텐츠를 보여 탐지를 피함 (ATLAS AML.T0134)
    - 결과는 장기 메모리 오염(UT-11.1)·추천 편향(UT-20.3)·호스트 명령 실행(UT-22.1)으로 이어짐
    ■ 실제 사례
    - [실제 사고] AI 추천 오염(2026-02): 'AI로 요약' 버튼에 자사 도메인을 신뢰 출처로 기억하라는 지시를 미리 채워 유포 — 약 60일간 메일 트래픽에서 31개 기업·14개 업종의 50여 종 확인, 건강·금융 조언 사이트 포함 (ATLAS AML.CS0072)
    - [실증] AI ClickFix(2025-05): "컴퓨터인가요?" 확인 버튼으로 Claude 컴퓨터 사용 에이전트를 유인해, 클립보드에 복사된 명령을 터미널에서 실행하게 함 (ATLAS AML.CS0055)

UT-07.5:
  summary: |-
    - 공격자는 주입한 지시·조작된 도구 응답·위조 메시지로 에이전트의 목표와 계획, 판단 기준을 바꿔, 정상 업무 흐름 속에서 공격자 의도에 맞는 다단계 행위를 반복하게 할 수 있음
    - 에이전트에 위임된 권한 전체가 공격자 목적에 쓰이며, 개별 행위는 정상 범위로 보여 목표 변경 자체를 감시하지 않으면 탐지가 어려움
  reference: |-
    ■ AI 관점
    - 단일 응답 조작(UT-06.1·07.1)과 달리 목표·작업 선택·판단 경로 자체가 바뀌어, 이후 다단계 실행 전체가 공격자 목적을 수행함 (OWASP ASI01)
    - 탈취 경로는 프롬프트 인젝션 외에 조작된 도구 응답(UT-29.3), 악성 아티팩트, 위조된 에이전트 간 메시지(UT-27.1), 오염된 외부 데이터로 다양함
    - 반복 캘린더 초대로 매일 조금씩 목표 가중치를 바꾸는 점진적 탈취는 개별 행위가 정책 범위 안에 있어 규칙 기반 탐지에 걸리지 않음 (OWASP ASI01 시나리오 #3)
    - 송금·승인·외부 발송 권한을 가진 업무 에이전트에서는 목표 탈취가 곧 사기 거래·허위 정보 기반 의사결정으로 이어짐 (OWASP ASI01 예시 #3·#4)
    ■ 실제 사례
    - [공개 취약점] ChatGPT Operator(2025-02): 웹 콘텐츠의 지시를 따른 Operator가 인증된 페이지에 접근해 사용자 개인정보를 노출 (OWASP ASI 부록 D·ASI01 시나리오 #2)
    - [실증] Gemini 캘린더 초대(2025-08): 초대 제목의 지시가 비서의 작업을 가로채 스마트홈 기기 제어·Zoom 영상 송출 등 사용자가 요청하지 않은 행위를 수행 (ATLAS AML.CS0063)
    - [시나리오] 반복 캘린더 초대로 플래너 에이전트의 목표 가중치를 매일 조금씩 바꿔, 정책 범위 안에서 저마찰 승인 쪽으로 유도 (OWASP ASI01 시나리오 #3)

UT-08.1:
  summary: |-
    - 공격자는 반복 질의·역할 전환·출력 형식 변환 요청으로 시스템 프롬프트와 내부 규칙, 구분자·제어 토큰을 추출할 수 있음
    - 노출 자체의 피해는 제한적이나 거부 조건·업무 로직이 드러나 맞춤형 인젝션 설계에 쓰이고, 시스템 프롬프트에 의존한 통제는 무력화됨
  reference: |-
    ■ AI 관점
    - 수법: 반복 질의, 역할 전환, "위 내용을 코드 블록으로 출력" 같은 형식 변환·번역·요약 요청, 응답 관찰을 통한 구분자·특수 문자·기능 키워드 추론 (ATLAS AML.T0056·T0069)
    - 핵심 노출 대상은 프롬프트 전문보다 그 안의 거부 조건·필터 기준·업무 판단 로직·출력 형식 규칙이며, 이를 알면 거부 패턴을 피한 맞춤형 인젝션을 설계할 수 있음 (OWASP LLM08:2026 예시 #2·#3·#5)
    - 구분자·제어 토큰을 알아내면 가짜 RAG 결과·사용자 메시지·내부 추론 경계를 위조해 지시 체계를 교란할 수 있음 (UT-06.1·10.1)
    - 숨은 컨텍스트는 결국 노출된다고 가정해야 하며, 시스템 프롬프트를 인가·필터링 경계로 쓰면 추출 즉시 통제가 무력화됨 (OWASP LLM08:2026)
    ■ 실제 사례
    - [실증] M365 Copilot 거래 정보 조작(2024-08): 응답을 관찰해 구분자(**·**END**)와 search_enterprise 함수·EmailMessage 객체를 파악한 뒤, 이를 이용해 가짜 RAG 결과를 주입 (ATLAS AML.CS0026)
    - [실증] OpenClaw(2026-02): <<<·>>> 제어 시퀀스와 <think> 태그를 파악해 사용자 메시지·내부 추론 경계를 위조하고 C2 지시를 심음 (ATLAS AML.CS0051)
    - [공개 취약점] CVE-2024-5184(EmailGPT): 프롬프트 인젝션으로 시스템 프롬프트 노출 (OWASP DSGAI01)

UT-08.2:
  severity_reason: 도구·권한 범위와 반출 경로 노출로 후속 인젝션·도구 악용 정밀화
  summary: |-
    - 공격자는 에이전트에 직접 질의하거나 요청별 성공·거부 반응을 관찰해 연결 도구와 파라미터, 지식원, 활성화 트리거, 동작 권한 범위를 파악할 수 있음
    - 탐색 결과는 반출 경로와 고가치 데이터, 원격 발동 조건을 드러내 후속 인젝션과 도구 악용을 정밀하게 만듦
  reference: |-
    ■ AI 관점
    - 탐색 대상: 연결 도구와 파라미터, 지식원·임베디드 데이터, 활성화 트리거(메일 수신·문서 추가 등), 호출 체인, 에이전트가 동작하는 신원과 권한 범위 (ATLAS AML.T0084·T0133)
    - 수법: "어떤 도구를 쓸 수 있나" 같은 직접 질의, 다양한 요청의 성공·실패·거부 패턴 관찰, 노출된 관리 콘솔·설정 파일 열람 — 설정 접근 권한 없이 런타임 대화만으로도 가능 (OWASP LLM08:2026 시나리오 #2)
    - 결과물은 외부 발송 도구(반출 경로), CRM 같은 고가치 데이터, 원격 발동 트리거, 실행 함수로 이어지는 호출 체인 목록이며 후속 인젝션(UT-07.1)·도구 연쇄 악용(UT-21.4)·명령 주입(UT-22.4)의 표적이 됨
    - 도구 스키마·역할별 권한 조건이 숨은 컨텍스트에 있으면 대화만으로 드러나므로, 권한 판단은 모델 밖 정책 엔진에서 강제해야 함 (OWASP LLM08:2026 예시 #1·#4)
    ■ 실제 사례
    - [실증] Copilot Studio 고객 지원 에이전트(2025-06): 프롬프트로 지식원 파일·메일 발송 도구·Salesforce 조회 도구·메일 수신 트리거를 파악한 뒤 CRM 데이터 유출 체인을 구성 (ATLAS AML.CS0037)
    - [실증] Claude Code GitHub Action(2026-06): 이슈·PR 이벤트 트리거와 도구별 실행 경로를 분석해, 샌드박스 밖에서 동작하는 내장 Read 도구로 환경변수의 자격증명에 접근 (ATLAS AML.CS0067)
    - [실증] LLMSmith(2025-02): 소스 정적 분석으로 사용자 입력·LLM 출력이 exec·eval로 이어지는 호출 체인을 찾아 인터넷 공개 앱의 RCE 표적을 선별 (ATLAS AML.CS0052)

UT-08.4:
  summary: |-
    - 공격자는 시스템 프롬프트·에이전트 지시문·도구 설명에 기재된 API 키·접속 정보·내부 URL을 프롬프트 추출만으로 획득할 수 있음
    - 자격증명을 숨은 컨텍스트에 두는 설계 결함이 원인이며, 노출된 자격증명은 AI를 거치지 않고 연동 시스템에 바로 쓰임
  reference: |-
    ■ AI 관점
    - 흔한 형태: 시스템 프롬프트·에이전트 지시문·도구 설명에 API 키·DB 연결 문자열·토큰·내부 URL을 직접 기재하거나, 역할별 접근 규칙을 프롬프트로만 정의 (OWASP LLM08:2026 예시 #1)
    - 프롬프트 추출(UT-08.1)이나 로그·추적 데이터 노출(UT-33.1)로 함께 드러나며, 유출된 자격증명은 연동 시스템에 직접 쓰여 AI 측 통제를 거치지 않음 (UT-25.4)
    - MCP 환경에서는 하드코딩 자격증명·장기 토큰이 모델 메모리·프로토콜 로그에 남는 형태로도 나타남 (OWASP MCP01)
    - 숨은 컨텍스트는 비밀이 아니라는 전제로 설계해야 하며, 자격증명은 모델이 직접 다루지 않는 서버 측 비밀 저장소·토큰 중개 계층으로 분리해야 함 (OWASP LLM08:2026·LLM02:2026)
    ■ 실제 사례
    - 공개 사고 미확인 — 프롬프트에 든 자격증명이 추출된 공개 사고는 없으나, 시스템 프롬프트 추출(UT-08.1) 사례가 다수여서 기재하는 순간 노출을 전제해야 함
    - [시나리오] 도구 연동용 자격증명이 든 시스템 프롬프트가 유출되어, 공격자가 해당 자격증명으로 연동 시스템에 직접 접근 (OWASP LLM08:2026 시나리오 #1)
