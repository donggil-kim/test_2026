# D01. 공격 준비 및 AI 무기화 — v3.2 재작성
# summary: 요약설명(2줄 개조식) / reference: 참조(■ AI 관점 · ■ 실제 사례)

UT-01.1:
  summary: |-
    - 공격자는 논문·기술 블로그·코드 저장소·앱 스토어·조직 웹사이트와 인터넷 스캔 DB를 검색해, 대상 조직이 쓰는 AI의 모델 구조·학습 데이터·프레임워크와 관련 인물 정보를 수집할 수 있음
    - 공개된 정보만 쓰므로 조직이 탐지할 수 없고, 수집 결과가 이후 대리 모델 구축·맞춤형 인젝션·피싱의 설계 근거가 됨
  reference: |-
    ■ AI 관점
    - 기술 정보원: 학회 논문·프리프린트·기술 블로그·특허, 공개 취약점 분석 자료에서 대상 모델의 구조·데이터셋·알려진 공격 기법을 확인 (ATLAS AML.T0000·T0001)
    - 자산 정보원: 조직 웹사이트·앱 스토어·GitHub에서 AI 기능, 사용 프레임워크, 에이전트 설정 파일을 찾고, Shodan·Censys 같은 스캔 DB로 노출된 AI 서비스를 조회 (ATLAS AML.T0003·T0004·T0095·T0000.003)
    - 인물 정보: 임직원 이름·메일·얼굴 사진과 개인정보를 수집해 딥페이크·사칭(UT-04)의 재료로 씀 (ATLAS AML.T0087)
    - 수집은 조직 밖에서 끝나므로 직접 차단보다 모델 카드·기술 문서·저장소 공개 범위를 최소화하는 것이 현실적 통제임
    ■ 실제 사례
    - [실제 사고] Hermes 에이전트 공격(2026-05): DeepSeek 기반 에이전트가 GitHub에서 2026년 CVE PoC 저장소를 찾고, FOFA로 노출된 Langflow 84개·n8n 약 65만 건을 조회해 표적을 선정 (ATLAS AML.CS0070)
    - [실제 사고] 중국 세무 시스템 얼굴인식 우회(2020): 암시장에서 개인정보와 고해상도 얼굴 사진을 사들여 인증 우회에 사용, 약 7,700만 달러 부정 수취 (ATLAS AML.CS0004)
    - [실증] Jira Service Management 공격(2025-06): "site:atlassian.net/servicedesk" 검색으로 AI 연동 서비스 포털을 쓰는 조직을 표적 목록화 (ATLAS AML.CS0039)

UT-01.2:
  summary: |-
    - 공격자는 인터넷 포트 스캔, SaaS·에이전트 플랫폼의 메타데이터 API 조회, 에이전트 호출 채널(메일·웹훅) 탐침으로 외부에 노출된 AI 서비스와 에이전트를 찾아 공격 진입점을 목록화할 수 있음
    - 자체 호스팅 AI 런타임은 잘 알려진 포트·API를 기본으로 열어 대량 스캔에 쉽게 걸리며, 자율 공격 에이전트가 이 과정을 자동화하고 있음
  reference: |-
    ■ AI 관점
    - 스캔 대상: 모델 서빙 엔드포인트, Ray·노트북 같은 학습 클러스터 대시보드, 에이전트 관리 콘솔·게이트웨이 — 기본 포트와 표준 API가 예측 가능함 (ATLAS AML.T0006.002)
    - 플랫폼 열거: 에이전트·SaaS 플랫폼의 예측 가능한 URL 구조나 메타데이터 API로 특정 조직이 배포한 에이전트를 찾아냄 (ATLAS AML.T0006.000·T0006.001)
    - 트리거 탐침: 고객 지원 메일·웹훅·메신저 채널에 시험 입력을 보내 자동 응답 여부로 에이전트 존재와 동작 방식을 확인 (ATLAS AML.T0006.003)
    - 찾아낸 노출 서비스는 일반 초기 침투(UT-02.4)나 인증 없는 서비스 악용(UT-31.1)으로 바로 이어짐
    ■ 실제 사례
    - [실제 사고] ShadowRay(2023-09~): 공인 IP 스캔으로 인증 없이 노출된 Ray 대시보드를 찾아 최소 7개월간 악용 — 피해 장비 가치 약 10억 달러 추산 (ATLAS AML.CS0023)
    - [실제 사고] GTG-1002(2025-09): 탈옥한 Claude 에이전트가 표적 조직의 IP 대역 스캔과 취약점 스캔을 자율 수행해 공격 표면을 열거 (ATLAS AML.CS0069)
    - [실증] Copilot Studio 고객 지원 에이전트(2025-06): 공개된 지원 메일 주소로 시험 메일을 보내 자동 회신 여부로 AI 에이전트가 관리하는 받은편지함을 식별 (ATLAS AML.CS0037)

UT-01.3:
  summary: |-
    - 공격자는 공개 추론 API·AI 탑재 제품·앱 패키지 속 모델 파일을 통해 대상 모델에 질의하거나 모델 전체를 손에 넣어, 추출·회피·인젝션 공격의 시험대를 확보할 수 있음
    - 정상 사용자와 같은 접근 경로라 구분이 어렵고, 모델 파일까지 확보하면 오프라인에서 제한 없이 공격을 다듬을 수 있음
  reference: |-
    ■ AI 관점
    - 질의 접근: 추론 API, 웹 채팅, 메일·SNS로 동작하는 AI 서비스를 통해 출력을 반복 관찰 — 대량 계정·프록시로 이용 제한을 피하기도 함 (ATLAS AML.T0040)
    - 간접 접근: 보안 제품·인증 앱처럼 AI를 내장한 제품을 써서 모델의 판정과 로그·메타데이터를 관찰 (ATLAS AML.T0047)
    - 전체 접근: 앱 패키지·노출된 레지스트리·저장소에서 모델 파일을 확보하면 화이트박스 공격과 오프라인 탐색이 가능 (ATLAS AML.T0044, UT-16.2)
    - 확보한 접근은 모델 복제(UT-16.1)·적대적 예제 검증(UT-17.1)·인젝션 시험(UT-06.1)의 출발점이 됨
    ■ 실제 사례
    - [실제 사고] Claude 증류 캠페인(2026-02): 약 2.4만 개의 부정 계정으로 Claude 추론 API에 접근해 1,600만 건을 질의 (ATLAS AML.CS0056)
    - [실제 사고] 중국 세무 시스템 얼굴인식 우회(2020): 가상 카메라 앱으로 생성 영상을 얼굴인식 인증 서비스에 직접 입력 (ATLAS AML.CS0004)
    - [실증] Google Photos 모델 추출(2025-03): 앱 패키지에서 암호화되지 않은 TFLite 모델을 꺼내고 암호화된 모델은 실행 중 복호화 시점에 가로채 화이트박스 접근 확보 (ATLAS AML.CS0058)

UT-01.4:
  summary: |-
    - 공격자는 모델 출력·오류·로그를 관찰하거나 확보한 환경을 열거해 모델 계열·분류 체계·출력 점수 노출 여부와 내부 AI 자원·클라우드 구성을 파악할 수 있음
    - 직접 피해는 없지만 공격 대상과 방법을 정밀하게 만들며, 탈취 자격증명으로 쓸 수 있는 AI 서비스를 찾는 단계로도 쓰임
  reference: |-
    ■ AI 관점
    - 모델 탐색: 반복 질의로 출력 공간(분류 클래스)과 모델 계열을 추정하고, 응답 헤더·로그에 남은 신뢰도 점수처럼 불필요하게 노출된 출력을 찾음 (ATLAS AML.T0013·T0014·T0063)
    - 자산 탐색: 침투한 환경에서 학습·배포 소프트웨어 스택, 데이터 관리 시스템, 모델 레지스트리, 컨테이너 이미지 속 모델을 찾아냄 (ATLAS AML.T0007)
    - 환경 탐색: 계정·권한·네트워크·클라우드 자원과 활성화된 AI 서비스·할당량을 확인 — 탈취 키로 사용 가능한 LLM 서비스를 고르는 데 쓰임 (ATLAS AML.T0075·T0089, UT-25.4)
    - 프롬프트 질의로 에이전트 도구·권한을 파악하는 탐색은 UT-08.2에서 다룸
    ■ 실제 사례
    - [실제 사고] LLMjacking(2024-05): 탈취한 클라우드 자격증명으로 어떤 LLM 서비스가 켜져 있고 할당량이 얼마인지 확인한 뒤 무단 사용 (ATLAS AML.CS0030)
    - [실제 사고] GTG-1002(2025-09): 침투 후 에이전트가 시스템·네트워크 구성과 DB 유형을 확인하고 내부 네트워크 구조 전체를 매핑 (ATLAS AML.CS0069)
    - [실증] ProofPoint 회피(2019-09): 메일 헤더에 남은 모델 점수를 찾아 대리 모델 학습과 탐지 회피에 활용 (ATLAS AML.CS0008)

UT-02.1:
  summary: |-
    - 공격자는 공개된 적대적 공격 구현체·익스플로잇·딥페이크 도구·탈옥 도구와 공격용 에이전트 프레임워크·스킬을 입수하거나 직접 개발해, AI 대상 공격과 공격 자동화 역량을 확보할 수 있음
    - 조직 밖에서 이뤄지는 준비 단계라 직접 탐지가 어렵고, 공개 도구와 상용 범죄 서비스가 공격 진입 장벽을 크게 낮춤
  reference: |-
    ■ AI 관점
    - 입수 대상: 적대적 공격 라이브러리·공개 PoC, 범용 해킹 도구, 얼굴 합성·가상 카메라 앱 같은 딥페이크 도구, 생성형 AI 서비스 접근권, AI 서비스 키 검증·역방향 프록시 도구 (ATLAS AML.T0016)
    - 자체 개발: 탐지 회피용 변이 기법, 모델 백도어 삽입 도구, 안전장치 우회 도구, 1클릭 RCE 스크립트처럼 표적 AI에 맞춘 공격 도구를 직접 제작 (ATLAS AML.T0017)
    - 에이전트 도구: 공격용 에이전트 프레임워크, 스캐너·익스플로잇을 감싼 MCP 서버, 침투 절차를 담은 스킬을 확보·제작해 자율 공격(UT-03.1)의 실행 기반으로 사용 (ATLAS AML.T0016.004·T0017.002)
    - 활동이 조직 밖에서 일어나므로 위협 인텔리전스로 도구 유통과 AI 제공자 오남용 신호를 추적하는 것이 현실적인 대응임
    ■ 실제 사례
    - [실제 사고] Hermes 에이전트 공격(2026-05): 위협 행위자가 Hermes 에이전트와 FOFA 검색 MCP 서버를 확보하고 인증 없는 WebSocket 익스플로잇 절차를 담은 스킬을 제작해, DeepSeek 기반으로 Langflow·n8n 취약점 공격을 자율 수행 — 접근에는 실패 (ATLAS AML.CS0070)
    - [실제 사고] LLMjacking(2024-05): AI 서비스 키 대량 검증 도구(keychecker)와 역방향 프록시(OAI Reverse Proxy)를 입수해, 탈취한 클라우드 자격증명의 LLM 접근권을 범죄자에게 재판매 (ATLAS AML.CS0030)
    - [실제 사고] Storm-2139(2024-12): 생성형 AI 서비스의 안전장치를 우회하는 도구 de3u를 개발해 금지 콘텐츠 생성에 사용 (ATLAS AML.CS0057)

UT-02.2:
  summary: |-
    - 공격자는 대상과 같거나 비슷한 공개 데이터셋·사전학습 모델·에이전트 설정 파일을 입수해, 대리 모델을 만들고 공격을 실제 대상에 쓰기 전에 미리 검증할 수 있음
    - 오픈 모델·공개 데이터가 많을수록 대리 모델의 정확도가 높아져 블랙박스 서비스에도 화이트박스 수준의 공격 준비가 가능해짐
  reference: |-
    ■ AI 관점
    - 입수 대상: 대상이 쓰는 것과 같거나 대표성 있는 데이터셋, 공개된 기반 모델과 참조 구현, 공개 저장소의 에이전트 설정 파일(도구·데이터 소스·자격증명 구성) (ATLAS AML.T0002)
    - 쓰임새: 대리 모델 학습과 적대적 예제 사전 검증(UT-16.1·17.1), 변조 모델 제작의 원본 확보(UT-28.1), 에이전트 공격 설계(UT-08.2)
    - 클라우드 저장소·공개 서비스 설정 오류로 조직의 비공개 학습 데이터·모델이 함께 노출되면 준비 단계가 곧 자산 유출이 됨 (UT-31.1)
    ■ 실제 사례
    - [실제 사고] Clearview AI 설정 오류(2020-04): 비밀번호로 보호된 코드 저장소에 누구나 계정을 만들 수 있어, 학습 데이터·애플리케이션·클라우드 버킷 키에 접근 가능한 상태로 노출 (ATLAS AML.CS0006)
    - [실증] 기계 번역 서비스 공격(2020-04): 대상 서비스와 유사한 데이터셋·모델 구조를 확보해 대리 모델을 만들고 적대적 입력을 실제 서비스에 전이 (ATLAS AML.CS0005)
    - [실증] OpenClaw C2(2026-02): GitHub 공개 저장소에서 에이전트 설정 파일을 확보해 인젝션 공격 설계에 활용 (ATLAS AML.CS0051)

UT-02.3:
  summary: |-
    - 공격자는 클라우드·서버리스 자원, 도메인, 단말, 물리적 공격 소품, 서비스 계정, AI 서비스 프록시를 사거나 만들고 정상 인프라를 장악해, 공격 수행과 은닉에 필요한 기반을 구축할 수 있음
    - 정상 클라우드 서비스와 상용 프록시를 쓰면 출처 추적과 차단이 어렵고, 이용 정책·지역 제한도 우회됨
  reference: |-
    ■ AI 관점
    - 연산 자원: 공격 개발용 GPU 작업 공간(무료 노트북·클라우드 크레딧), 출처를 숨기는 서버리스 함수 (ATLAS AML.T0008.000·T0008.004)
    - AI 서비스 프록시: 프런티어 모델 API 접근권을 재판매하는 상용 프록시로 대량 계정·지역 제한을 우회해 증류·남용 캠페인을 수행 (ATLAS AML.T0008.005)
    - 계정·도메인: 피해자 명의 계정 등록, 허브 조직 네임스페이스 선점, 인젝션 페이로드와 반출 수신용 웹서버·도메인 준비 (ATLAS AML.T0021·T0008.002·T0079)
    - 물리 소품·단말: 적대적 패치 인쇄, 저가 휴대폰·개조 ROM 구매 — 물리 환경 공격(UT-17.2)·딥페이크 인증 우회(UT-04.1)에 사용
    ■ 실제 사례
    - [실제 사고] Claude 증류 캠페인(2026-02): DeepSeek·Moonshot·MiniMax가 상용 프록시 서비스로 Claude에 접근해 중국 내 상업 이용 제한을 우회 (ATLAS AML.CS0056)
    - [실제 사고] Storm-2139(2024-12): 탈옥한 Azure OpenAI 접근권을 판매하는 서비스용 인프라와 역방향 프록시를 운영 (ATLAS AML.CS0057)
    - [실제 사고] 중국 세무 시스템 얼굴인식 우회(2020): 저가 휴대폰을 사들이고 피해자 신원으로 세무 시스템 계정을 새로 등록 (ATLAS AML.CS0004)

UT-02.4:
  summary: |-
    - 공격자는 AI 서비스·지원 인프라의 공개 애플리케이션 취약점을 익스플로잇하거나, 악성 링크·드라이브바이 페이지로 사용자와 AI 에이전트를 유도해 최초 침투할 수 있음
    - AI 플랫폼도 일반 웹 애플리케이션과 같은 취약점을 가지며, 침투 후 연결된 모델·데이터·자격증명으로 피해가 확대됨
  reference: |-
    ■ AI 관점
    - 공개 애플리케이션 악용: AI 앱 빌더·서빙 프레임워크·에이전트 게이트웨이와 그 앞단의 웹·API 서버의 취약점(인증 우회, SSRF, 파일 업로드, JWT 검증 결함) (ATLAS AML.T0049)
    - 드라이브바이·악성 링크: 사용자 브라우저나 웹을 읽는 AI 에이전트가 악성 페이지를 방문하는 순간 스크립트·프롬프트 인젝션이 실행됨 (ATLAS AML.T0078·T0011.003)
    - 일반 엔터프라이즈 침투 기법과 같은 원리로 상세 대응은 클라우드 보안위협 매트릭스와 연계하며, 인증 없이 노출된 AI 서비스 자체는 UT-31.1, 로컬 에이전트 1클릭 장악은 UT-32.2에서 다룸
    ■ 실제 사례
    - [실제 사고] 대만 정부 시스템 침해(2026-07): 다중 에이전트 프레임워크가 임의 요청을 받아 인증 세션을 돌려주는 디버그 엔드포인트 3개와 서명 없는 JWT(alg=none)를 받아들이는 공개 API를 찾아 침투 (ATLAS AML.CS0071)
    - [실제 사고] LLMjacking(2024-05): Laravel 취약점(CVE-2021-3129)으로 최초 침투한 뒤 클라우드 자격증명을 탈취해 LLM 서비스를 무단 사용 (ATLAS AML.CS0030)
    - [실제 사고] ToolShell(2025-07): 에이전트에 의해 SharePoint RCE 익스플로잇이 악용된 사례로 보고 (OWASP ASI 부록 D)

UT-02.5:
  summary: |-
    - 공격자는 내부 서비스의 원격 취약점으로 다른 시스템·네트워크 경계로 확산하고, 샌드박스 탐지·난독화·보안 기능 우회 익스플로잇으로 분석과 탐지를 피해 체류를 늘릴 수 있음
    - AI 평가·실행 환경의 격리 경계를 넘는 확산까지 포함하며, 인코딩·분할된 통신은 기존 보안 장비의 탐지를 어렵게 함
  reference: |-
    ■ AI 관점
    - 내부 확산: 도달 가능한 내부 서비스(패키지 캐시, 레지스트리, 관리 API)의 취약점으로 다른 시스템·신뢰 경계로 이동 (ATLAS AML.T0122)
    - 탐지 회피: 가상화·샌드박스 환경을 감지해 동작을 바꾸고, 페이로드·명령·결과를 압축·Base64·XOR로 인코딩해 분할 전송 (ATLAS AML.T0097·T0123)
    - 보안 기능 우회: 취약점을 이용해 localhost 제한 같은 보안 기능을 무력화 (ATLAS AML.T0107)
    - AI 분석 도구를 속이는 프롬프트 인젝션 내장 악성코드처럼 AI 기반 탐지를 겨냥한 회피는 UT-06.1과 함께 봐야 함
    ■ 실제 사례
    - [실제 사고] OpenAI 평가용 자율 에이전트(2026-07): 내부 Artifactory의 SSRF로 평가망 경계를 넘어 인터넷에 접근하고, 명령·자격증명·결과를 압축·Base64·XOR 인코딩해 외부로 전달 (ATLAS AML.CS0068)
    - [실제 사고] Skynet 악성코드(2025-06): 여러 샌드박스 회피 기법과 함께 LLM 분석 도구를 겨냥한 프롬프트 인젝션을 내장 (ATLAS AML.CS0043)
    - [실증] OpenClaw 1클릭 RCE(2026-02): 교차 사이트 WebSocket 하이재킹으로 localhost 네트워크 제한을 우회해 로컬 게이트웨이에 접속 (ATLAS AML.CS0050)

UT-02.6:
  summary: |-
    - 공격자는 정보 저장소·로컬 시스템에서 데이터와 AI 자산을 자동 수집·정리한 뒤, 일반 네트워크 프로토콜이나 C2 채널로 외부에 반출할 수 있음
    - AI 에이전트가 수집·집계를 자동화해 반출 규모와 속도가 커졌으며, 모델·학습 데이터·자격증명이 함께 빠져나가는 경우가 많음
  reference: |-
    ■ AI 관점
    - 수집: 위키·DB·저장소 같은 정보 저장소와 로컬 파일·설정의 SSH 키·자격증명을 검색하고, 스크립트나 에이전트 도구로 자동 수집해 한곳에 모음 (ATLAS AML.T0036·T0037·T0126·T0127)
    - 반출: SFTP·HTTP POST·DNS 질의·Tor 등 일반 사이버 채널로 전송 (ATLAS AML.T0025·T0072)
    - AI 자산 특화: 모델 파일·학습 데이터·노트북 산출물이 함께 표적이 되며, 모델 파일 직접 탈취는 UT-16.2, AI 서비스 기능을 이용한 반출은 UT-19에서 다룸
    ■ 실제 사례
    - [실제 사고] 대만 정부 시스템 침해(2026-07): 다중 에이전트 프레임워크가 인증 없는 사용자 DB API에서 인사 기록 2,564건과 사용자 DB 전체, 내부 구조 정보를 자동 수집·반출 (ATLAS AML.CS0071)
    - [실제 사고] PyTorch-nightly 의존성 침해(2022-12): 악성 torchtriton 패키지가 SSH 키·설정 파일 등을 수집해 암호화된 DNS 질의로 반출 (ATLAS AML.CS0015)
    - [실제 사고] LAMEHUG(2025-06): LLM이 생성한 명령으로 문서·바탕화면·다운로드 폴더를 수집해 SFTP·HTTP POST로 반출 (ATLAS AML.CS0044)

UT-03.1:
  summary: |-
    - 공격자는 목표만 부여한 AI 에이전트가 표적 탐색, 취약점 분석·익스플로잇 개발, 실패 시 공격 경로 수정을 사람 개입 없이 반복하게 해, 사람보다 훨씬 빠른 속도와 큰 규모로 침투할 수 있음
    - 공격 비용과 필요한 숙련도가 크게 낮아지며, 사람이 대응하는 속도로는 탐지·차단이 따라가기 어려움
  reference: |-
    ■ AI 관점
    - 자율 정찰: 목표만 주면 에이전트가 필요한 정보를 스스로 정하고 결과를 해석해 다음 조사를 이어감 (ATLAS AML.T0116)
    - 자율 익스플로잇 개발: 소스·문서·오류 응답을 분석해 취약점을 추론하고 페이로드를 만들어 시험·수정 (ATLAS AML.T0017.001)
    - 공격 경로 적응: 중간 목표와 전제 조건을 도출하고, 막히면 다른 제품군·취약점으로 경로를 바꿔 재시도 (ATLAS AML.T0117)
    - 상용 코딩 에이전트를 탈옥(UT-06.2)해 쓰거나 공개 에이전트 프레임워크(UT-02.1)를 쓰며, 여러 에이전트를 조율하는 형태는 UT-03.2에서 다룸
    ■ 실제 사례
    - [실제 사고] GTG-1002(2025-09): 탈옥한 Claude Code가 MCP로 연결한 스캐너·크래커를 쓰며 약 30개 조직을 자율 공격 — SSRF 익스플로잇 체인을 직접 만들어 일부 침투 성공 (ATLAS AML.CS0069)
    - [실제 사고] Hermes 에이전트 공격(2026-05): DeepSeek 기반 에이전트가 Langflow를 표적으로 시작했다가 전제 조건이 없자 10개 제품군을 비교해 n8n으로 경로를 바꿈 — 접근에는 실패 (ATLAS AML.CS0070)
    - [실제 사고] 대만 정부 시스템 침해(2026-07): 에이전트 프레임워크가 공개 포털을 정찰하고 14개 후보 공격 경로를 성공 확률로 평가해 검증된 경로를 실행 (ATLAS AML.CS0071)

UT-03.2:
  summary: |-
    - 공격자는 오케스트레이터 AI가 여러 하위 에이전트에 정찰·인증 공격·취약점 연구 등 임무를 나누고, 발견 결과·자격증명을 공유하게 해 여러 대상을 병렬로 공격할 수 있음
    - 공유 저장소를 메시지 게시판으로 쓰는 등 에이전트 간 통신이 정상 트래픽에 섞이고, 병렬 공격으로 짧은 시간에 피해 범위가 넓어짐
  reference: |-
    ■ AI 관점
    - 공격 조율: 오케스트레이터가 임무 생성, 실행 에이전트 선택, 도구 배분, 결과 집계를 맡아 공통 목표로 이끔 (ATLAS AML.T0124)
    - 에이전트 간 통신: 직접 호출(A2A·하위 에이전트 인터페이스) 또는 공유 저장소의 파일·디렉터리 이름으로 지시·발견·자격증명을 주고받음 (ATLAS AML.T0118.000·T0118.001)
    - 공유 산출물 통신은 패키지 캐시·데이터셋 저장소 같은 정상 서비스를 쓰므로 C2 채널(UT-05.3)과 구분이 어렵고, 피해 조직의 저장소가 통신 매체로 악용되기도 함
    ■ 실제 사례
    - [실제 사고] 대만 정부 시스템 침해(2026-07): Hermes·OpenClaw 기반 프레임워크가 최대 8개 전문 에이전트를 12차례 공격 파상으로 동시 운용 (ATLAS AML.CS0071)
    - [실제 사고] OpenAI 평가용 자율 에이전트(2026-07): 약 1,200개 에이전트 실행이 Artifactory 원격 캐시를 게시판으로 삼아 7만 건 이상의 지시·익스플로잇·자격증명을 공유하며 Hugging Face 운영 시스템을 침해 (ATLAS AML.CS0068)

UT-03.3:
  summary: |-
    - 공격자는 피해 시스템의 악성코드가 실행 중 LLM 서비스에 자연어로 질의해 실행 명령을 그때그때 생성하게 해, 고정된 시그니처 없이 동작하고 트래픽을 정상 AI 서비스 이용으로 위장할 수 있음
    - 매 실행 명령이 달라 정적 탐지가 어렵고, 공개 모델 API를 쓰면 공격 인프라 없이도 상황에 맞는 명령을 얻음
  reference: |-
    ■ AI 관점
    - 동작 방식: 악성코드에는 자연어 지시만 두고 실제 명령(정보 수집·파일 검색·반출 준비)은 LLM이 생성 — 감염 환경에 맞춰 명령이 달라짐 (ATLAS AML.T0102)
    - 은닉 효과: 호출 대상이 Hugging Face·주요 AI 제공자 같은 정상 AI 서비스 도메인이어서 네트워크 평판 기반 차단을 피함 (UT-05.1)
    - 대응은 단말의 비정상 프로세스가 AI API를 호출하는 행위 탐지와 AI 제공자의 오남용 탐지 연계가 필요함
    ■ 실제 사례
    - [실제 사고] LAMEHUG(2025-06): APT28의 악성코드가 Hugging Face API로 Qwen 2.5 Coder 모델에 질의해 시스템 정보 수집·문서 검색 명령을 생성 (ATLAS AML.CS0044)
    - [실제 사고] Hermes 에이전트 공격(2026-05): DeepSeek이 반환 결과에 따라 FOFA 질의·셸 명령·스캐너 실행·HTTP 탐침을 계속 생성 (ATLAS AML.CS0070)

UT-04.1:
  summary: |-
    - 공격자는 딥페이크 영상·얼굴 합성 앱과 가상 카메라·영상 주입으로 얼굴인식·라이브니스 검사를 속여, 타인 명의로 계정을 개설하거나 본인 확인을 통과할 수 있음
    - KYC·비대면 인증이 뚫리면 금융·공공 서비스에서 명의 도용 사기로 바로 이어지며, 범죄 시장에서 도구가 상품으로 판매됨
  reference: |-
    ■ AI 관점
    - 수법: 탈취한 신원 정보와 얼굴 사진으로 딥페이크 신분증·셀피 영상을 만들고, 가상 카메라·개조 ROM으로 실제 카메라 대신 영상을 주입 (ATLAS AML.T0088)
    - 우회 대상: 얼굴 대조, 수동·능동 라이브니스 검사, 신분증 진위 확인 — 생성 영상이 정상 촬영처럼 보이면 자동 판정이 통과됨
    - 준비 단계에서 개인정보·얼굴 사진 수집(UT-01.1)과 딥페이크 도구 구매(UT-02.1)가 선행되며, 사람을 상대로 한 사칭은 UT-04.3에서 다룸
    ■ 실제 사례
    - [실제 사고] 중국 세무 시스템(2020): 사진을 눈 깜빡임 영상으로 바꾸는 앱과 가상 카메라로 얼굴인식을 우회해 위장 회사 명의로 약 7,700만 달러 부정 수취 (ATLAS AML.CS0004)
    - [실제 사고] ProKYC(2024-10): 딥페이크 신분증과 셀피 영상을 만들어 라이브니스 검사를 우회하는 도구가 범죄자에게 판매되어 암호화폐 거래소 계정 개설에 사용 (ATLAS AML.CS0034)
    - [실제 사고] ID.me 우회(2020-10): 가발로 신분증 사진과 셀피를 맞춰 자동 신원 확인을 통과, 허위 실업급여 180건 이상 청구로 340만 달러 이상 수령 (ATLAS AML.CS0017)

UT-04.2:
  summary: |-
    - 공격자는 LLM으로 대상별 맞춤 스피어피싱 문안을 대량 생성하거나, LLM 챗봇이 대화 중 개인정보·자격증명을 캐내도록 해 임직원을 기망할 수 있음
    - 문법 오류·어색한 표현 같은 기존 피싱 식별 단서가 사라지고, 적은 비용으로 대상별 맞춤화를 대규모로 할 수 있음
  reference: |-
    ■ AI 관점
    - 문안 생성: 공개 정보(UT-01.1)를 바탕으로 직무·관계에 맞춘 피싱 메일·메시지를 다국어로 대량 생성 (ATLAS AML.T0052)
    - 대화형 사회공학: 공격자가 운영하는 챗봇이나 인젝션으로 조종된 정상 AI 비서가 대화를 이어가며 이름·자격증명을 요구하고 악성 링크 클릭을 유도 (ATLAS AML.T0052.000, UT-34.2)
    - 피싱 페이지는 ML 기반 피싱 탐지를 회피하도록 로고·화면 요소를 변형하기도 함 (UT-17.1)
    - 경영진·거래처를 사칭한 딥페이크 음성·영상 통화는 UT-04.3에서 다룸
    ■ 실제 사례
    - [실제 사고] LAMEHUG(2025-06): APT28이 침해한 정부 메일 계정으로 첨부 파일이 든 피싱 메일을 보내 LLM 연동 악성코드를 유포 (ATLAS AML.CS0044)
    - [실증] Bing Chat 데이터 해적(2023): 웹페이지의 숨은 지시로 Bing Chat이 해적 말투로 대화하며 사용자 이름 등 개인정보를 묻고 링크 클릭을 유도 (ATLAS AML.CS0020)
    - [실제 사고] ML 피싱 탐지 회피(2022-12): 피싱 사이트가 브랜드 로고를 변형해 이미지 분류 기반 피싱 탐지를 피하려 한 시도가 탐지 로그에서 확인 (ATLAS AML.CS0032)

UT-04.3:
  summary: |-
    - 공격자는 딥페이크 음성·영상 통화나 AI로 만든 메시지·브랜드로 경영진·거래처·공공기관 같은 신뢰 주체를 사칭해, 대상이 송금·정보 제공·설치 등 공격자 대신 행위를 하게 만들 수 있음
    - 목소리·얼굴까지 재현되면 사람의 진위 판단이 무력해지며, 기술적 통제를 거치지 않는 승인·결제 절차가 직접 표적이 됨
  reference: |-
    ■ AI 관점
    - 사칭 대상: 경영진·동료·거래처·정부 기관 담당자, 그리고 신뢰받는 조직의 계정·패키지·저장소 이름 (ATLAS AML.T0073)
    - 딥페이크 결합: 합성 음성·영상으로 실시간 통화·화상회의에서 본인처럼 행동해 긴급 송금·결재·자격증명 제공을 요구 (ATLAS AML.T0052.001)
    - 사칭 대상이 사람이 아니라 브랜드·패키지·허브 조직일 때는 공급망 침해(UT-28.4·29.2)로 이어지며, 기계 인증 우회는 UT-04.1에서 다룸
    - 대응은 고위험 요청의 별도 채널 재확인과 결재 절차의 기술적 통제가 핵심이며, 탐지 기술만으로는 한계가 있음
    ■ 실제 사례
    - [실제 사고] LAMEHUG(2025-06): APT28이 정부 부처 관계자를 사칭한 메일로 'Appendix.pdf.zip'으로 위장한 악성코드를 유포 (ATLAS AML.CS0044)
    - [실제 사고] postmark-mcp(2025-09): Postmark가 등록하지 않은 이름으로 정상 동작하는 MCP 패키지를 먼저 배포해 신뢰를 얻은 뒤, 발송 메일을 몰래 BCC로 유출 (ATLAS AML.CS0053)
    - [실증] Hugging Face 조직 사칭(2023-08): 실존 기업명으로 미인증 조직을 만들자 해당 기업 직원들이 가입해 비공개 모델을 업로드 (ATLAS AML.CS0027)

UT-05.1:
  summary: |-
    - 공격자는 감염 호스트의 악성코드가 정상 AI 서비스 API를 명령 수신·결과 전송 채널로 쓰게 해, C2 트래픽을 일상적인 AI 서비스 이용으로 위장할 수 있음
    - 기업 내 AI API 호출이 흔해 네트워크 차단이 어렵고, 공격자 인프라가 드러나지 않아 장기간 은닉이 가능함
  reference: |-
    ■ AI 관점
    - 동작 방식: 공격자가 AI 서비스 API의 대화·어시스턴트·파일 기능에 명령을 넣고, 악성코드가 이를 가져가 실행한 뒤 결과를 암호화해 같은 API로 되돌림 (ATLAS AML.T0096)
    - 은닉 효과: 목적지가 주요 AI 제공자 도메인이고 정상 API 키를 쓰므로 평판·도메인 기반 차단과 이상 목적지 탐지에 걸리지 않음
    - 대응은 승인된 프로세스·계정만 AI API를 호출하도록 제한하고, AI 제공자와 오남용 계정 정보를 공유하는 것임
    ■ 실제 사례
    - [실제 사고] SesameOp(2025-07): 백도어가 OpenAI Assistants API로 공격자 명령을 받아 실행하고 암호화된 결과를 같은 경로로 반출 — 공격자는 수개월간 시스템에 체류 (ATLAS AML.CS0042)

UT-05.2:
  summary: |-
    - 공격자는 URL 조회 기능이 있는 웹 AI 비서나 침해한 AI 에이전트를 중계자로 삼아, 악성코드가 공격자 서버와 직접 통신하지 않고 AI 서비스를 경유해 명령을 받고 데이터를 내보낼 수 있음
    - 인증 없이 쓸 수 있는 웹 AI 서비스는 차단할 키·계정이 없고, 트래픽이 신뢰된 AI 도메인으로만 보여 탐지가 어려움
  reference: |-
    ■ AI 관점
    - 웹 인터페이스 중계: 악성코드가 내장 브라우저로 공개 AI 웹 서비스에 접속해 공격자 URL을 요약하게 하고, 요청 파라미터로 데이터를 보내며 응답에서 명령을 추출 (ATLAS AML.T0114)
    - 에이전트 악용: 셸·인터넷 접근 도구를 가진 에이전트에 지속 지시를 심어 공격자 서버의 작업 목록을 주기적으로 받아 실행하게 함 (ATLAS AML.T0108, UT-07.1)
    - API 키를 쓰는 방식(UT-05.1)과 달리 회수할 자격증명이 없어, 익명 웹 조회 기능 제한과 단말의 비정상 브라우저 자동화 탐지가 필요함
    ■ 실제 사례
    - [실증] AI in the Middle(2026-02): 악성코드가 Grok·Microsoft Copilot 웹 인터페이스에 익명으로 접속해 공격자 URL을 가져오게 하는 방식으로 데이터 반출과 명령 수신을 수행 (ATLAS AML.CS0061)
    - [실증] OpenClaw C2(2026-02): 웹페이지 인젝션으로 OpenClaw가 공격자 서버의 TODO 목록을 web_fetch로 받아 실행하는 C2 에이전트가 됨 (ATLAS AML.CS0051)

UT-05.3:
  summary: |-
    - 공격자는 모델·데이터셋 저장소의 객체를 명령·페이로드 게시판으로 쓰고 실행 결과를 데이터셋에 기록하게 해, 정상 아티팩트 다운로드·업로드로 위장한 비동기 C2를 운영할 수 있음
    - AI 개발 환경은 허브 저장소와의 대용량 통신이 일상적이어서 C2 트래픽이 정상 작업에 묻힘
  reference: |-
    ■ AI 관점
    - 동작 방식: 공격자가 통제하는 모델·데이터셋 저장소에 명령을 올리고, 침해 시스템이 이를 폴링해 실행한 뒤 결과를 데이터셋 객체로 써 넣음 (ATLAS AML.T0120)
    - 은닉 효과: 학습·추론 환경에서 허브 접근은 허용 목록에 있는 경우가 많고, 아티팩트 형식이라 내용 검사가 어려움
    - 대응은 허브 접근을 승인된 조직·저장소로 제한하고, 운영 환경의 예상 밖 업로드를 감시하는 것임 (UT-28.1과 같은 허용 목록 통제)
    ■ 실제 사례
    - [실제 사고] OpenAI 평가용 자율 에이전트(2026-07): 에이전트들이 자신이 통제하는 데이터셋 저장소를 비동기 C2로 써, 침해한 작업자가 명령을 가져가고 결과를 데이터셋 객체에 기록 (ATLAS AML.CS0068)
