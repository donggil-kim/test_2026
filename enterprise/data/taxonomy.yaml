# 고도화·레거시 우회 엔터프라이즈 침해 보안위협 매트릭스 — 분류 체계(원천)
#
# 관점(작업방향 4장): MITRE ATT&CK Enterprise v19.2에서 ① 고도화됐고 ② 최근 실제 사례가 많으며
#   ③ 레거시 보안체계(시그니처 AV·경계 방화벽·레거시 SIEM)로 막기 어려운 기법을 선별해,
#   '레거시 방어 공백'과 '요구 방어 수준'을 축으로 붙인 렌즈 매트릭스. 자산이 무엇이든 '레거시로 막기 어렵다'로 묶음.
#
# 구조: Lv1 도메인(ATT&CK Enterprise 전술 — 침투~영향 12개) → Lv2 위협분류(ENT-<전술>-NN) → Lv3 세부위협(ENT-<전술>-NN.m)
#   전술 14개 중 정찰(Reconnaissance)·자원 개발(Resource Development)은 영역 1(AI 활용 공격)·정찰 영역이 다루므로 제외·연계(D7).
# ID는 고정 — 폐지해도 재사용하지 않음.
# 경계 규칙(작업방향 4.3·5장, D7):
#   · 범위: 호스트·엔드포인트·네트워크·C2·방어 회피·온프레미스 AD 인접 기법.
#   · 연계만(재수록 금지): 클라우드 제어 평면→CL, 신원 로그인·토큰→ID, ICS→OT, AI 시스템→AI, 소프트웨어 공급망→SC.
#     겹침은 통합 v4.1 요약 ID(AI·CL·OT·SC·ID·PH)로 연계(작업방향 5장).
#   · 국가배후 여부는 행 속성이 아니라 사고 DB actor 필드로만 다룸.
#
# Lv3 필드
#   name / en       세부위협명(국문) / 영문명
#   tactic          ATT&CK 전술(도메인과 같음) — frameworks.yaml tactics
#   legacy_gap      레거시 방어 공백 유형(복수) — frameworks.yaml legacy_gaps. 이 매트릭스의 차별적 축(D6)
#   defense_level   요구 방어 수준(최소 필요) — frameworks.yaml defense_levels(레거시 / EDR·XDR / 행위·네트워크·아이덴티티)
#   actors          주로 쓰는 위협 주체 유형 — frameworks.yaml actor_types(국가배후·랜섬웨어·사이버범죄·핵티비스트·접근 브로커)
#   platforms       대상 플랫폼 — frameworks.yaml platforms(Windows·Linux·macOS·네트워크·펌웨어)
#   attack          ATT&CK v19.2 기법 ID(1차 분류·근거)
#   kev             (선택) CISA KEV 악용·빠른 익스플로잇 근거가 있는 행이면 true
#   lolbas          (선택) LOLBin(서명된 정상 도구) 악용 행이면 true
#   loldriver       (선택) 취약/악성 드라이버(BYOVD) 악용 행이면 true
#   nist            대응 기준 — NIST SP 800-53 Rev.5 통제(탐지·대응)
#   ai / cl / ot / sc / idn / ph  다른 매트릭스 연계 — 통합 v4.1 요약 ID
#   refs            참고 문헌 키(frameworks.yaml references)
#   severity        심각도(상·중·하) — 기준 assessment.severity_rule
#   severity_why    심각도 근거('상'은 피해 범위를 적음)

assessment:
  severity_rule:
    상: 성공하면 도메인·조직 전반이 장악되거나 대규모 암호화·파괴·유출로 이어지고, 레거시 방어로는 사실상 탐지되지 않아 피해 범위를 가늠하기 어려운 위협
    중: 피해가 개별 호스트·구역에 머물거나, 단독 피해는 없고 다른 단계를 키우는 조건(탐색·수집 등)인 위협
    하: 직접 피해가 제한적·일시적이고 대응이 쉬운 위협
  likelihood_rule: >-
    상 = 실제 사고 2건 이상(다른 매트릭스와 같은 수식),
    중 = 실제 사고 1건 또는 ATT&CK 절차(그룹·소프트웨어·캠페인) 사례·KEV 악용·위협인텔·실증 중 하나 이상,
    하 = 근거 없음.
    선정(포함) 자체는 '고도화·최근빈발·레거시난제' 셋 중 둘 이상으로 가리고(작업방향 4.3),
    우선순위는 위험도에 더해 레거시 공백·요구 방어 수준(방어 난이도)을 보조 기준으로 둔다(D5).
  severity_check: "'상' 판정은 피해 범위(도메인·조직 전반 장악·대규모 암호화/파괴/유출·레거시 미탐지)를 severity_why에 적은 경우에만"

