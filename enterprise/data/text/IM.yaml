# [IM] 영향 — 고도화 엔터프라이즈 침해 관점 문구 (가드레일 D11: 방어 자료, 공세 제작법 미기재)

ENT-IM-01:
  oneline: 사람 운영 랜섬웨어의 도메인 장악 후 전사 암호화
  summary: |-
    - 공격자는 도메인을 장악한 뒤 사람 운영 랜섬웨어로 전사 데이터를 암호화할 수 있음
    - 앞 단계가 레거시로 탐지되지 않아 암호화 시점에야 드러나 피해가 전면적임
  reference: |-
    ■ 관점
    - 대상: 전사 호스트·데이터(T1486 — 영향용 데이터 암호화)
    - 레거시 공백: 서명된 정상 도구 악용 — 정상 도구·정상 인증으로 전개되어 암호화 전까지 가려짐
    - 연계: 클라우드 랜섬웨어(CL-IM-01), OT 랜섬웨어(OT-IM-02)
    - 참고: MITRE 〈ATT&CK Enterprise v19.2〉 · Securelist 〈State of Ransomware 2026〉
    ■ 실제 사례
    - [실제 사고] Black Basta 사람 운영 랜섬웨어(2024-05): 도메인 장악 후 전사 암호화 (ENI-012)
    - [실제 사고] Akira 랜섬웨어의 무방비 웹캠 경유 암호화(2025-03): EDR이 격리하자 비관리 웹캠에서 공유를 암호화해 우회 (ENI-037)
    - [실제 사고] LockBit 제휴의 복구 방해·EDR 무력화 암호화(2023-06): 복구 방해 후 암호화 (ENI-015)
    - [실제 사고] Akira 랜섬웨어의 MFA 미적용 VPN 경유 침투(2024-04): 확산 후 암호화 (ENI-014)
    - [실제 사고] WannaCry의 원격 취약점 웜 확산 랜섬웨어(2017-05): 웜 확산으로 대규모 암호화 (ENI-022)
  detect: |-
    ■ 탐지
    - 대량 파일 변경·암호화 행위와 선행 단계(자격증명·확산) 상관 이벤트를 행위 기반으로 탐지(NIST SI-4)
    ■ 대응
    - 오프라인·불변 백업·복구 훈련과 선행 단계 조기 차단·분할을 적용(NIST CP-9·CP-10·SI-4)
    - 참고: Securelist 〈State of Ransomware 2026〉

ENT-IM-02:
  oneline: 섀도 카피·백업 삭제로 복구 방해
  summary: |-
    - 공격자는 정상 도구로 섀도 카피·백업을 지워 복구를 막을 수 있음
    - 랜섬웨어 피해를 돌이킬 수 없게 만드는 결정적 단계임
  reference: |-
    ■ 관점
    - 대상: 섀도 카피·백업(T1490 — 복구 방해)
    - 레거시 공백: 서명된 정상 도구 악용 — vssadmin 등 정상 도구를 사용
    ■ 실제 사례
    - [실제 사고] Black Basta 사람 운영 랜섬웨어(2024-05): 암호화 직전 백업·복구를 방해 (ENI-012)
    - [실제 사고] LockBit 제휴의 복구 방해·EDR 무력화 암호화(2023-06): 섀도 카피·백업 삭제 (ENI-015)
    - [정부 경보] 사람 운영 랜섬웨어의 레거시 우회 공통 TTP(2025-03): 복구 방해를 공통 TTP로 경보 (ENI-030)
  detect: |-
    ■ 탐지
    - 섀도 카피 삭제·백업 서비스 중지 명령을 행위 기반으로 탐지(NIST SI-4·CP-9)
    ■ 대응
    - 오프라인·불변 백업과 백업 삭제 방지·권한 분리를 적용(NIST CP-9·SI-4)

ENT-IM-03:
  oneline: 데이터 파괴·와이퍼로 운영 중단·복구 불능
  summary: |-
    - 공격자는 디스크·데이터를 파괴해 운영을 중단시킬 수 있음
    - 국가배후·핵티비스트의 파괴 작전으로 복구가 어렵고 피해가 전면적임
  reference: |-
    ■ 관점
    - 대상: 디스크·데이터(T1485 데이터 파괴 · T1561 디스크 와이프)
    - 레거시 공백: 서명된 정상 도구 악용 · 커널·펌웨어 하위 계층
    - 연계: OT 데이터 파괴(와이퍼)(OT-IR-01)
    ■ 실제 사례
    - [실제 사고] NotPetya의 자격증명 탈취·원격 취약점 웜 확산·파괴(2017-06): 웜 확산 후 디스크 파괴 (ENI-021)
  detect: |-
    ■ 탐지
    - 대량 삭제·디스크 와이프·MBR 변조 행위를 행위 기반으로 탐지(NIST SI-4·SI-7)
    ■ 대응
    - 오프라인·불변 백업과 무결성 보호·분할로 파괴 범위를 제한(NIST CP-9·SI-7)

ENT-IM-04:
  oneline: 보안·백업·DB 서비스 중지·시스템 종료로 가용성 훼손
  summary: |-
    - 공격자는 보안·백업·DB 서비스를 멈추거나 시스템을 종료해 암호화·파괴를 돕거나 가용성을 해칠 수 있음
    - 정상 관리 명령을 써 레거시가 구분하기 어려우나 단독 피해는 복구 가능함
  reference: |-
    ■ 관점
    - 대상: 서비스·시스템 가용성(T1489 서비스 중지 · T1529 시스템 종료/재시작)
    - 레거시 공백: 서명된 정상 도구 악용
    ■ 실제 사례
    - [실제 사고] LockBit 제휴의 복구 방해·EDR 무력화 암호화(2023-06): 보안·백업 서비스를 중지 (ENI-015)
  detect: |-
    ■ 탐지
    - 보안·백업·DB 서비스의 비정상 중지와 대량 종료 명령을 행위 기반으로 탐지(NIST SI-4·CP-10)
    ■ 대응
    - 중요 서비스 변조 방지·권한 분리와 신속 복구 체계를 적용(NIST CP-10·SI-4)

ENT-IM-05:
  oneline: 반출 데이터 공개 협박·부정 이체로 금전 피해 실현
  summary: |-
    - 공격자는 반출 데이터 공개 협박이나 부정 이체로 금전 피해를 실현할 수 있음
    - 이중 협박은 백업 복구로도 막지 못해 대규모 금전·평판 피해로 직결됨
  reference: |-
    ■ 관점
    - 대상: 반출 데이터·결제 흐름(T1657 — 금전 탈취)
    - 레거시 공백: 정상 인증 위장
    - 연계: 클라우드 금전 탈취·갈취(CL-IM-05), 신원 계정 장악 금전 사기(ID-IM-01)
    ■ 실제 사례
    - [실제 사고] Cl0p의 MOVEit Transfer 0-day 대량 데이터 탈취(2023-06): 유출 데이터 공개 협박으로 갈취 (ENI-004)
    - [실제 사고] Cl0p의 Cleo 파일전송 취약점 대량 악용(2024-12): 반출 후 갈취 (ENI-010)
    - [정부 경보] 사람 운영 랜섬웨어의 레거시 우회 공통 TTP(2025-03): 이중 협박 갈취를 공통 TTP로 경보 (ENI-030)
  detect: |-
    ■ 탐지
    - 대량 반출 선행 징후와 갈취·부정 이체 정황을 통합 모니터링(NIST SI-4·IR-4)
    ■ 대응
    - 데이터 반출 차단·사고 대응·법집행 연계와 백업·복구를 병행(NIST IR-4·SI-4)
