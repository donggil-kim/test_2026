# [CA] 자격증명 접근 — 고도화 엔터프라이즈 침해 관점 문구 (가드레일 D11: 방어 자료, 공세 제작법 미기재)

ENT-CA-01.1:
  oneline: LSASS 메모리 덤프로 평문·해시 자격증명 탈취
  summary: |-
    - 공격자는 LSASS 메모리에서 평문·해시 자격증명을 추출해 도메인 확산의 발판을 마련할 수 있음
    - 정상 프로세스 접근이라 레거시가 구분하지 못해 행위·EDR 기반 탐지가 필요함
  reference: |-
    ■ 관점
    - 대상: LSASS 프로세스 메모리(T1003.001 — OS 자격증명 덤프)
    - 레거시 공백: 파일리스·인메모리 · 서명된 정상 도구 악용
    ■ 실제 사례
    - [실제 사고] Volt Typhoon의 LotL 기반 핵심 기반시설 장기 침투(2024-02): 자격증명 탈취로 측면 이동 발판 확보 (ENI-001)
    - [실제 사고] Black Basta 사람 운영 랜섬웨어(2024-05): LSASS 덤프로 도메인 자격증명 확보 (ENI-012)
    - [실제 사고] NotPetya의 자격증명 탈취·원격 취약점 웜 확산·파괴(2017-06): 자격증명 탈취로 확산 (ENI-021)
    - [정부 경보] 사람 운영 랜섬웨어의 레거시 우회 공통 TTP(2025-03): 자격증명 탈취를 공통 TTP로 경보 (ENI-030)
  detect: |-
    ■ 탐지
    - LSASS 비정상 접근·핸들 열기와 자격증명 덤프 도구 행위를 EDR 기반으로 탐지(NIST SI-4·AC-6)
    ■ 대응
    - LSASS 보호(PPL)·자격증명 가드와 최소 권한·특권 분리를 적용(NIST AC-6·IA-5)

ENT-CA-01.2:
  oneline: 캐시된 도메인 자격증명 추출로 추가 계정 확보
  summary: |-
    - 공격자는 오프라인에서 캐시된 도메인 자격증명을 깨 추가 계정을 확보할 수 있음
    - 메모리·레지스트리 기반이라 레거시가 보지 못하나 피해는 확산 단계에서 커짐
  reference: |-
    ■ 관점
    - 대상: 캐시된 도메인 자격증명(T1003.005)
    - 레거시 공백: 파일리스·인메모리
    ■ 실제 사례
    - 공개 사고 미확인 — 다른 침해의 자격증명 접근 구성 요소로만 보고됨. ATT&CK 주체 사례가 다수 관측됨
  detect: |-
    ■ 탐지
    - 캐시 자격증명 저장소 접근과 비정상 레지스트리·메모리 읽기를 EDR 기반으로 탐지(NIST SI-4·AC-6)
    ■ 대응
    - 캐시 자격증명 수 제한·특권 분리와 강한 암호 정책을 적용(NIST AC-6·SI-4)

ENT-CA-03:
  oneline: Kerberoasting·AS-REP 로스팅으로 도메인 권한 계정 탈취
  summary: |-
    - 공격자는 정상 Kerberos 요청으로 서비스 계정 티켓을 받아 오프라인에서 크랙해 도메인 권한 계정을 확보할 수 있음
    - 정상 인증 트래픽이라 레거시가 탐지하지 못하고 도메인 권한으로 직결됨
  reference: |-
    ■ 관점
    - 대상: 서비스 계정 Kerberos 티켓(T1558.003 — Kerberoasting)
    - 레거시 공백: 정상 인증 위장 — 정상 요청이라 요청량·패턴 분석 없이는 구분 불가
    - 연계: 신원 Kerberos·윈도우 인증 자료 재사용(ID-TS-02)
    ■ 실제 사례
    - [실제 사고] Kerberoasting을 통한 도메인 권한 계정 탈취(2023-07): 정상 요청으로 서비스 계정 해시를 받아 크랙 (ENI-023)
    - [실제 사고] APT28 인접 네트워크 무선 경유 침투(2024-11): 정상 자격증명·Kerberos를 이용해 이동 (ENI-002)
  detect: |-
    ■ 탐지
    - 비정상적으로 많은 서비스 티켓 요청·약한 암호화 요청을 아이덴티티 기반으로 탐지(NIST SI-4·AC-6)
    ■ 대응
    - 서비스 계정에 길고 무작위한 암호·gMSA·강한 암호화를 적용하고 요청을 감사(NIST IA-5·AC-6)

ENT-CA-04:
  oneline: 입력 캡처·키로깅으로 자격증명 가로채기
  summary: |-
    - 공격자는 키 입력·자격증명 입력을 가로채 추가 접근을 확보할 수 있음
    - 수집 속도·범위가 제한적이나 다른 단계를 잇는 수단이 됨
  reference: |-
    ■ 관점
    - 대상: 키 입력·자격증명 입력(T1056.001 — 입력 캡처·키로깅)
    - 레거시 공백: 파일리스·인메모리
    ■ 실제 사례
    - [실제 사고] 지표 삭제·위장·난독화를 통한 사후 분석 방해(2024-01): 입력 캡처 등 보조 수집을 병행 (ENI-033)
  detect: |-
    ■ 탐지
    - 키보드 후킹·입력 가로채기 API와 비정상 입력 캡처를 EDR 기반으로 탐지(NIST SI-4·AC-6)
    ■ 대응
    - 엔드포인트 행위 탐지·피싱 내성 MFA로 자격증명 탈취 가치를 낮춤(NIST SI-4·AC-6)
