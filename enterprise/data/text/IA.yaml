# [IA] 초기 침투 — 고도화 엔터프라이즈 침해 관점 문구
# 가드레일(D11): 방어 자료 — 위험·탐지·대응 중심. 공세 제작법·악용 절차는 적지 않고 식별·탐지·완화 수준으로 서술.
# oneline 50자 이내 명사형 · summary 2줄(① 공격자는 …할 수 있음 ② 레거시로 막기 어려운 사유) ·
# reference(■ 관점 / ■ 실제 사례) · detect(■ 탐지 / ■ 대응). 사례는 그 행에 매핑된 사고만, 수치는 사고 요약에 있는 것만.

ENT-IA-01:
  oneline: 인터넷 노출 경계·엣지 장비 취약점으로 경계 안 직접 진입
  summary: |-
    - 공격자는 VPN·방화벽·게이트웨이·파일전송 같은 인터넷 노출 엣지 장비의 공개 즉시 악용되는 취약점으로 경계 안으로 바로 들어올 수 있음
    - 엣지 장비는 EDR이 깔리지 않아 레거시 경계 통제로 탐지가 어렵고, KEV 등재가 매년 14~21%(참고치)를 차지할 만큼 빠른 n-day·0-day가 집중됨
  reference: |-
    ■ 관점
    - 대상: 노출된 VPN·방화벽·게이트웨이·파일전송·네트워크 장비(T1190 — 공개 앱 취약점 악용)
    - 레거시 공백: 경계 밖·비관리 장비(EDR 부재) · 신뢰·공급 관계 경유 — 공개 즉시 악용돼 패치 전 노출 구간이 짧음
    - 연계: 클라우드 공개 앱 취약점(CL-IA-01)
    - 참고: CISA 〈KEV Catalog〉 · CISA 〈Edge Device Advisory〉
    ■ 실제 사례
    - [실제 사고] Citrix Bleed NetScaler 세션 토큰 탈취 대량 악용(2023-10): 노출 NetScaler 취약점(CVE-2023-4966)으로 MFA를 우회해 진입 (ENI-003)
    - [실제 사고] Ivanti Connect Secure VPN 연쇄 0-day 악용(2024-01): 인증 우회·명령 주입을 엮어 경계 VPN 장악(CVE-2023-46805·CVE-2024-21887) (ENI-006)
    - [실제 사고] Cisco IOS XE 웹 UI 취약점 대량 임플란트 설치(2023-10): 노출 네트워크 장비에 대량 임플란트(CVE-2023-20198) (ENI-007)
    - [실제 사고] Palo Alto PAN-OS GlobalProtect 0-day 악용(2024-04): 경계 방화벽 명령 주입 0-day(CVE-2024-3400) (ENI-008)
  detect: |-
    ■ 탐지
    - 외부 노출 자산을 지속 식별하고 엣지 장비의 취약점 공개·악용 동향을 신속 대조(NIST RA-5·SI-4)
    - 경계 장비의 비정상 설정 변경·세션·아웃바운드를 네트워크 기반으로 모니터링(NIST SC-7)
    ■ 대응
    - 엣지 장비 신속 패치·가상 패치와 공개 취약점 노출 구간 최소화(NIST SI-2·RA-5)
    - 경계 장비를 분리·최소 노출하고 침해 전제의 세션 무효화·자격증명 교체 절차를 둠(NIST SC-7)
    - 참고: CISA 〈KEV Catalog〉 · CISA 〈Edge Device Advisory〉

ENT-IA-02:
  oneline: 탈취 계정·노출 원격 서비스로 정상 로그인처럼 경계 통과
  summary: |-
    - 공격자는 탈취한 계정이나 노출된 VPN·RDP·원격 관리로 정상 인증처럼 경계를 통과해 들어올 수 있음
    - 로그인 자체는 정상이라 레거시가 악용과 구분하지 못하고, 랜섬웨어 초기 침투의 주 경로가 됨
  reference: |-
    ■ 관점
    - 대상: 외부 노출 원격 서비스(VPN·RDP·원격 관리)(T1133)
    - 레거시 공백: 정상 인증 위장 · 경계 밖·비관리 장비 — MFA 미적용·노출 서비스가 그대로 진입점이 됨
    - 연계: 클라우드 원격 관리 인터페이스(CL-IA-02), 신원 인증 시스템 취약점(ID-AU-04)
    - 참고: MITRE 〈ATT&CK Enterprise v19.2〉 · Mandiant 〈M-Trends〉
    ■ 실제 사례
    - [실제 사고] Akira 랜섬웨어의 MFA 미적용 VPN 경유 침투(2024-04): MFA 없는 VPN 계정으로 정상 로그인해 진입 (ENI-014)
    - [실제 사고] ConnectWise ScreenConnect 취약점 경유 랜섬웨어(2024-02): 원격 관리 도구 인증 우회로 고객 환경에 접근(CVE-2024-1709) (ENI-009)
    - [정부 경보] 사람 운영 랜섬웨어의 레거시 우회 공통 TTP(2025-03): 노출 서비스·VPN 초기 침투를 공통 TTP로 경보 (ENI-030)
  detect: |-
    ■ 탐지
    - 원격 서비스 로그인의 비정상 위치·시간·장치와 MFA 미적용 경로를 아이덴티티·네트워크 기반으로 탐지(NIST SI-4·IA-2)
    - 노출 RDP·VPN·원격 관리 자산을 상시 식별(NIST SC-7)
    ■ 대응
    - 모든 외부 원격 접근에 피싱 내성 MFA·조건부 접근을 적용하고 노출을 최소화(NIST AC-17·IA-2)
    - 원격 서비스 접근을 분리·제한하고 이상 로그인에 세션 차단(NIST SC-7)
    - 참고: Mandiant 〈M-Trends〉

ENT-IA-03:
  oneline: 정상 사이트·광고망 경유 드라이브바이·워터링홀 감염
  summary: |-
    - 공격자는 정상 사이트·광고망을 침해하거나 워터링홀로 꾸며 방문자 단말을 감염시킬 수 있음
    - 경계에서 걸러지지 않는 정상 트래픽을 경유해 레거시 통제를 우회하나, 피해는 후속 실행·확산 단계에서 커짐
  reference: |-
    ■ 관점
    - 대상: 방문자 엔드포인트와 침해된 정상 사이트·광고망(T1189 — 드라이브바이 컴프로마이즈)
    - 레거시 공백: 시그니처 회피 · 신뢰·공급 관계 경유 — 신뢰 도메인을 경유해 경계가 구분하지 못함
    ■ 실제 사례
    - 공개 사고 미확인 — 이 매트릭스 사고 DB에 매핑된 전용 사례가 아직 없음(워터링홀·멀버타이징 공개 사건은 다수 존재하며 대표 사례 편입은 P2). ATT&CK 주체 사례가 다수 관측됨
  detect: |-
    ■ 탐지
    - 엔드포인트의 브라우저·플러그인 비정상 실행과 신뢰 사이트발 악성 리다이렉트를 행위 기반으로 탐지(NIST SI-3·SI-4)
    ■ 대응
    - 브라우저·플러그인 신속 패치, 웹 격리·콘텐츠 필터링과 엔드포인트 행위 탐지를 적용(NIST SI-3·SC-7)

ENT-IA-04:
  oneline: 이동식 매체(USB)로 망분리·격리망 경계 우회 침투·전파
  summary: |-
    - 공격자는 USB 등 이동식 매체로 망분리·격리망에 침투·전파해 네트워크 경계를 물리적으로 우회할 수 있음
    - 경계 통제 밖 경로라 레거시 네트워크 탐지가 보지 못하나 전파 속도·범위는 제한적임
  reference: |-
    ■ 관점
    - 대상: 이동식 매체·임시 접속 자산과 격리망 호스트(T1091 — 이동식 매체를 통한 복제)
    - 레거시 공백: 경계 밖·비관리 장비 — 네트워크 경계를 물리적으로 건너뜀
    - 연계: OT 이동식 매체 경유 침투(OT-IA-05)
    ■ 실제 사례
    - [실제 사고] 이동식 매체(USB) 경유 격리망 침투·전파(2023-06): 국가 연계 행위자가 USB로 망분리·격리망에 침투·전파 (ENI-029)
  detect: |-
    ■ 탐지
    - 이동식 매체 연결·자동 실행과 격리망 호스트의 비정상 실행을 엔드포인트 기반으로 탐지(NIST SI-3)
    ■ 대응
    - 이동식 매체 사용을 통제·차단하고 자동 실행을 비활성화, 격리망 자산 반입 매체를 검사(NIST MP-7·SI-3)

ENT-IA-05:
  oneline: MSP·협력사·연동 신뢰 경로 악용으로 다수 하위 고객 침해
  summary: |-
    - 공격자는 MSP·원격 관리·연동 토큰 같은 신뢰 관계로 들어와 다수 하위 고객을 한 번에 침해할 수 있음
    - 정상 관리 트래픽을 경유해 레거시가 구분하지 못하고 피해가 연쇄됨
  reference: |-
    ■ 관점
    - 대상: 신뢰 관계(MSP·협력사·연동)와 그 하위 고객 환경(T1199 — 신뢰 관계)
    - 레거시 공백: 신뢰·공급 관계 경유 · 정상 인증 위장 — 정상 관리 경로라 차단·구분이 어려움
    - 연계: 공급망 공급업체 위임 권한·연동 토큰 경유 침입(SC-CS-03)
    - 참고: MITRE 〈ATT&CK Enterprise v19.2〉 · Mandiant 〈M-Trends〉
    ■ 실제 사례
    - [실제 사고] Kaseya VSA 공급·관리 도구 경유 대규모 랜섬웨어(2021-07): 원격 관리 플랫폼을 경유해 하위 고객에 일괄 배포(CVE-2021-30116) (ENI-011)
    - [실제 사고] ConnectWise ScreenConnect 취약점 경유 랜섬웨어(2024-02): 신뢰된 원격 관리 경로로 다운스트림 고객에 접근 (ENI-009)
  detect: |-
    ■ 탐지
    - 신뢰 관계·연동 계정의 비정상 사용과 관리 도구발 대량·일괄 작업을 모니터링(NIST SI-4·AC-20)
    ■ 대응
    - 공급·관리 관계에 최소 권한·분리·계약상 보안 요구를 적용하고 연동 토큰을 단기화·감사(NIST SR-3·CA-3·AC-20)
    - 참고: Mandiant 〈M-Trends〉
