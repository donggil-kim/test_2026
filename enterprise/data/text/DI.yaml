# [DI] 탐색 — 고도화 엔터프라이즈 침해 관점 문구 (가드레일 D11: 방어 자료, 공세 제작법 미기재)

ENT-DI-01:
  oneline: 정상 명령으로 호스트·시스템·네트워크 구성 탐색
  summary: |-
    - 공격자는 정상 명령으로 호스트·시스템·네트워크 구성을 파악해 확산·영향 계획의 토대를 만들 수 있음
    - 정상 질의라 레거시가 공백이나 단독 피해는 없음
  reference: |-
    ■ 관점
    - 대상: 호스트·시스템·네트워크 구성(T1082·T1016·T1033)
    - 레거시 공백: 서명된 정상 도구 악용
    ■ 실제 사례
    - [실제 사고] Volt Typhoon의 LotL 기반 핵심 기반시설 장기 침투(2024-02): 내장 명령으로 환경 정찰 (ENI-001)
  detect: |-
    ■ 탐지
    - 짧은 시간의 연쇄 탐색 명령과 비정상 열거 패턴을 행위 기반으로 탐지(NIST SI-4·AU-6)
    ■ 대응
    - 탐색 명령 사용을 기준선과 대조·감사하고 최소 기능을 적용(NIST SI-4·AU-6)

ENT-DI-02:
  oneline: 정상 LDAP·AD 질의로 공격 경로(관리자·신뢰·공유) 지도화
  summary: |-
    - 공격자는 정상 LDAP·AD 질의로 계정·신뢰·공유를 열거해 공격 경로를 지도화할 수 있음
    - 정상 트래픽이라 탐지가 어렵고 사람 운영 랜섬웨어의 핵심 정찰 단계임
  reference: |-
    ■ 관점
    - 대상: 도메인·AD 계정·신뢰·공유(T1087.002·T1018·T1482)
    - 레거시 공백: 정상 인증 위장 · 서명된 정상 도구 악용
    ■ 실제 사례
    - [실제 사고] Black Basta 사람 운영 랜섬웨어(2024-05): AD 열거로 도메인 경로 지도화 (ENI-012)
    - [정부 경보] 사람 운영 랜섬웨어의 레거시 우회 공통 TTP(2025-03): AD 열거를 공통 TTP로 경보 (ENI-030)
  detect: |-
    ■ 탐지
    - 비정상 LDAP·AD 질의량과 공격 경로 지도화 도구 행위를 아이덴티티 기반으로 탐지(NIST SI-4·AC-6)
    ■ 대응
    - AD 질의·열거를 감사하고 공격 경로(관리자·신뢰)를 정리·최소화(NIST AC-6·AU-6)

ENT-DI-03:
  oneline: 보안 소프트웨어·방어 환경 탐색으로 회피 준비
  summary: |-
    - 공격자는 설치된 보안 제품을 확인해 회피·무력화를 준비할 수 있음
    - 사전 단계라 직접 피해는 없으나 이후 은닉·방어 무력화로 이어짐
  reference: |-
    ■ 관점
    - 대상: 설치된 보안 소프트웨어(T1518.001 — 보안 소프트웨어 탐색)
    - 레거시 공백: 서명된 정상 도구 악용
    ■ 실제 사례
    - 공개 사고 미확인 — 은닉·방어 무력화의 사전 단계로만 보고돼 단독 사고로 분리되지 않음. ATT&CK 주체 사례가 관측됨
  detect: |-
    ■ 탐지
    - 보안 제품·서비스 열거 명령과 비정상 조회를 행위 기반으로 탐지(NIST SI-4)
    ■ 대응
    - 보안 제품 상태 변조 방지와 탐지 규칙·텔레메트리 중앙 감시를 적용(NIST SI-4)
