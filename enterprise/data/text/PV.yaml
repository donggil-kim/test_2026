# [PV] 권한 상승 — 고도화 엔터프라이즈 침해 관점 문구 (가드레일 D11: 방어 자료, 공세 제작법 미기재)

ENT-PV-01.1:
  oneline: 프로세스 인젝션(인메모리 코드 주입)으로 실행·은닉·상승
  summary: |-
    - 공격자는 정상 프로세스 메모리에 코드를 주입해 실행·은닉하고 권한을 높일 수 있음
    - 디스크 산출물이 없어 시그니처가 보지 못하며 거의 모든 고급 악성코드가 사용함
  reference: |-
    ■ 관점
    - 대상: 정상 프로세스의 메모리 공간(T1055 — 프로세스 인젝션)
    - 레거시 공백: 파일리스·인메모리 · 시그니처 회피
    ■ 실제 사례
    - [실제 사고] Cobalt Strike 비콘의 암호화 C2·프로세스 인젝션(2023-01): 비콘이 프로세스 인젝션으로 메모리에서 실행 (ENI-018)
  detect: |-
    ■ 탐지
    - 원격 스레드 생성·메모리 쓰기·비정상 메모리 영역 실행을 EDR 행위 기반으로 탐지(NIST SI-3·SI-4)
    ■ 대응
    - 커널 수준 메모리 가시성(EDR)과 공격 표면 축소 규칙을 적용(NIST SI-3·SI-4)

ENT-PV-01.2:
  oneline: 접근 토큰 조작으로 다른 사용자 권한 사용
  summary: |-
    - 공격자는 토큰을 복제·가장해 다른 사용자·서비스 권한으로 행동할 수 있음
    - 정상 인증 메커니즘을 써 레거시가 구분하기 어려우나 피해는 후속 단계에서 커짐
  reference: |-
    ■ 관점
    - 대상: 윈도우 접근 토큰(T1134)
    - 레거시 공백: 정상 인증 위장 · 파일리스·인메모리
    ■ 실제 사례
    - [실제 사고] UAC 우회·토큰 조작을 통한 로컬 권한 상승(2023-08): 토큰 복제·가장으로 권한 상승 (ENI-032)
  detect: |-
    ■ 탐지
    - 토큰 복제·가장 API 호출과 비정상 권한 전환을 EDR 행위 기반으로 탐지(NIST SI-4·AC-6)
    ■ 대응
    - 최소 권한·특권 계정 분리와 토큰 조작 탐지 규칙을 적용(NIST AC-6·SI-4)

ENT-PV-03:
  oneline: 사용자 계정 컨트롤(UAC) 우회로 로컬 권한 상승
  summary: |-
    - 공격자는 정상 자동 상승 바이너리를 악용해 UAC를 우회하고 관리자 권한을 얻을 수 있음
    - 정상 메커니즘을 써 레거시가 구분하기 어려우나 단독 피해는 제한적임
  reference: |-
    ■ 관점
    - 대상: UAC 자동 상승 메커니즘(T1548.002)
    - 레거시 공백: 서명된 정상 도구 악용 · 시그니처 회피
    ■ 실제 사례
    - [실제 사고] UAC 우회·토큰 조작을 통한 로컬 권한 상승(2023-08): 자동 상승 바이너리로 UAC 우회 (ENI-032)
  detect: |-
    ■ 탐지
    - 자동 상승 바이너리의 비정상 실행·레지스트리 조작을 행위 기반으로 탐지(NIST SI-4·CM-7)
    ■ 대응
    - UAC 최고 수준 설정·관리자 승인 모드와 최소 권한을 적용(NIST AC-6·CM-7)

ENT-PV-04:
  oneline: 로컬·커널 취약점(또는 BYOVD)으로 SYSTEM·커널 권한 획득
  summary: |-
    - 공격자는 로컬·커널 취약점이나 서명된 취약 드라이버(BYOVD)로 SYSTEM·커널 권한을 얻을 수 있음
    - 하위 계층이라 상위 보안 도구가 무력화되고 KEV 등재가 다수임
  reference: |-
    ■ 관점
    - 대상: 로컬·커널 취약점과 서명된 취약 드라이버(T1068 — 권한 상승 취약점 악용)
    - 레거시 공백: 커널·펌웨어 하위 계층 · 시그니처 회피 — 커널 하위 계층이라 상위 보안 제품이 가려짐
    - 참고: CISA 〈KEV Catalog〉 · LOLDrivers 〈Project〉
    ■ 실제 사례
    - [실제 사고] RansomHub 제휴의 EDR 킬러(BYOVD) 사용(2024-08): 서명된 취약 드라이버로 커널 권한을 얻어 EDR 무력화 (ENI-016)
  detect: |-
    ■ 탐지
    - 신규 커널 드라이버 로드와 취약 드라이버 서명·해시를 차단 목록과 대조해 탐지(NIST SI-4)
    ■ 대응
    - 취약 드라이버 차단 목록(HVCI·드라이버 블록리스트)과 신속 패치를 적용(NIST SI-2·SI-4)
    - 참고: LOLDrivers 〈Project〉
