# [PE] 지속 — 고도화 엔터프라이즈 침해 관점 문구 (가드레일 D11: 방어 자료, 공세 제작법 미기재)

ENT-PE-01:
  oneline: 윈도우 서비스 생성·수정으로 재부팅 후에도 접근 유지
  summary: |-
    - 공격자는 정상 서비스 등록 메커니즘으로 서비스를 만들거나 바꿔 지속·권한 상승에 쓸 수 있음
    - 정상 OS 기능이라 레거시가 악용과 구분하기 어려우나 단독 피해는 제한적임
  reference: |-
    ■ 관점
    - 대상: 윈도우 서비스(T1543.003)
    - 레거시 공백: 서명된 정상 도구 악용 — 정상 서비스 등록이라 구분이 어려움
    ■ 실제 사례
    - [실제 사고] UAC 우회·토큰 조작을 통한 로컬 권한 상승(2023-08): 서비스·자동 상승 메커니즘을 지속·상승에 활용 (ENI-032)
  detect: |-
    ■ 탐지
    - 신규·수정 서비스와 비정상 바이너리 경로·시작 유형을 행위 기반으로 탐지(NIST SI-4·CM-7)
    ■ 대응
    - 서비스 생성·변경을 감사·기준선과 대조하고 최소 권한을 적용(NIST CM-7·AU-6)

ENT-PE-02:
  oneline: 부팅·로그온 자동 실행(레지스트리·시작 폴더) 지속성
  summary: |-
    - 공격자는 레지스트리 런키·시작 폴더 등 자동 실행 지점에 등록해 재부팅·로그온 시 접근을 유지할 수 있음
    - 정상 자동 실행 메커니즘이라 레거시가 구분하기 어렵고 피해는 후속 단계에서 발생함
  reference: |-
    ■ 관점
    - 대상: 부팅·로그온 자동 실행 지점(T1547)
    - 레거시 공백: 서명된 정상 도구 악용
    ■ 실제 사례
    - [실제 사고] WMI·PowerShell 파일리스 실행·지속(2023-05): 자동 실행 지점으로 지속성 확보 (ENI-020)
  detect: |-
    ■ 탐지
    - 자동 실행 지점(런키·시작 폴더·서비스)의 변경을 기준선과 대조해 탐지(NIST SI-4·SI-7)
    ■ 대응
    - 자동 실행 지점 변경을 감사·무결성 검증하고 최소 기능을 적용(NIST CM-7·SI-7)

ENT-PE-03:
  oneline: 예약 작업(스케줄드 태스크)으로 지속·주기 실행 확보
  summary: |-
    - 공격자는 정상 스케줄러로 예약 작업을 만들어 지속성과 주기 실행을 확보할 수 있음
    - 정상 기능이라 레거시가 구분하기 어려우나 단독 피해는 제한적임
  reference: |-
    ■ 관점
    - 대상: 예약 작업(T1053.005)
    - 레거시 공백: 서명된 정상 도구 악용 · 파일리스·인메모리
    ■ 실제 사례
    - [실제 사고] WMI·PowerShell 파일리스 실행·지속(2023-05): 예약 작업으로 주기 실행·지속 (ENI-020)
  detect: |-
    ■ 탐지
    - 신규·수정 예약 작업과 비정상 트리거·실행 바이너리를 행위 기반으로 탐지(NIST SI-4·AU-6)
    ■ 대응
    - 예약 작업 생성·변경을 감사하고 생성 권한을 최소화(NIST CM-7·AU-6)

ENT-PE-04:
  oneline: 계정 조작·숨은 로컬 계정으로 신원 기반 지속 접근
  summary: |-
    - 공격자는 계정·권한을 추가·변경하거나 숨은 로컬 계정을 만들어 지속 접근을 확보할 수 있음
    - 정상 계정 활동으로 보여 로그만으로는 악용을 구분하기 어려움
  reference: |-
    ■ 관점
    - 대상: 로컬·도메인 계정과 권한(T1098 — 계정 조작)
    - 레거시 공백: 정상 인증 위장
    - 연계: 신원 기반 지속성(백도어 계정·MFA 등록)(ID-PE-02)
    ■ 실제 사례
    - 공개 사고 미확인 — 계정 기반 지속성은 신원 매트릭스(ID-PE-02)에서 주로 다뤄 단독 사고로 분리되지 않음. ATT&CK 주체 사례가 다수 관측됨
  detect: |-
    ■ 탐지
    - 신규·변경 계정과 비정상 권한 부여·그룹 추가를 아이덴티티 기반으로 탐지(NIST AC-2·AU-6)
    ■ 대응
    - 계정 생성·권한 변경을 승인·감사하고 휴면·불필요 계정을 정리(NIST AC-2·IA-4)
