# [EF] 반출 — 고도화 엔터프라이즈 침해 관점 문구 (가드레일 D11: 방어 자료, 공세 제작법 미기재)

ENT-EF-01:
  oneline: 기존 암호화 C2 채널에 데이터 실어 반출
  summary: |-
    - 공격자는 기존 암호화 C2 채널에 데이터를 실어 반출할 수 있음
    - 별도 채널이 없어 레거시 DLP가 탐지하기 어렵고 이중 협박 랜섬웨어의 유출 단계가 됨
  reference: |-
    ■ 관점
    - 대상: 기존 C2 채널(T1041 — C2 채널 경유 반출)
    - 레거시 공백: 암호화·정상 채널 은닉
    ■ 실제 사례
    - 공개 사고 미확인 — 편재(LotL·정상 기능) 기법으로 단독 사건보다 빈발 지수(ATT&CK 주체 다수)로 평가. 대표 사고 편입은 후속(검토 P2)
  detect: |-
    ■ 탐지
    - C2 세션의 비정상 업로드량·방향성과 비컨-대용량 전환을 네트워크 기반으로 탐지(NIST SC-7·SI-4)
    ■ 대응
    - egress 통제·데이터 유출 탐지와 C2 차단으로 반출을 막음(NIST SC-7·AU-6)

ENT-EF-02:
  oneline: 정상 웹 서비스·대체 프로토콜로 대량 데이터 반출
  summary: |-
    - 공격자는 클라우드 스토리지·정상 SaaS나 대체 프로토콜로 대량 데이터를 반출할 수 있음
    - 신뢰 도메인이라 차단·탐지가 어렵고 유출 규모가 큼
  reference: |-
    ■ 관점
    - 대상: 정상 웹 서비스·대체 프로토콜(T1567·T1048)
    - 레거시 공백: 암호화·정상 채널 은닉 · 신뢰·공급 관계 경유
    - 연계: 클라우드 정상 웹 서비스·웹훅 경유 반출(CL-EF-02)
    ■ 실제 사례
    - [실제 사고] Cl0p의 MOVEit Transfer 0-day 대량 데이터 탈취(2023-06): 파일전송 장비에서 데이터 대량 반출 (ENI-004)
    - [실제 사고] Cl0p의 Cleo 파일전송 취약점 대량 악용(2024-12): 파일전송 솔루션에서 반출 (ENI-010)
  detect: |-
    ■ 탐지
    - 신뢰 SaaS·외부 저장소로의 비정상 대량 업로드를 네트워크·DLP 기반으로 탐지(NIST SC-7·SI-4)
    ■ 대응
    - 허용 SaaS 제한·egress 통제·DLP와 대용량 업로드 경보를 적용(NIST SC-7·SI-4)
