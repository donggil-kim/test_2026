# [DM] 방어 무력화(Defense Impairment) — 고도화 엔터프라이즈 침해 관점 문구
# ATT&CK v19(2026-04) 방어 회피 분리로 신설된 전술(TA0112) — 보안 통제를 직접 끄거나 떨어뜨림.
# 가드레일 D11: 방어 자료, 공세 제작법 미기재.

ENT-DM-01.1:
  oneline: 서명된 취약 드라이버로 EDR·백신을 커널에서 무력화(BYOVD)
  summary: |-
    - 공격자는 서명된 취약 드라이버를 올려 EDR·백신을 커널에서 무력화할 수 있음
    - 보안 도구 자체가 꺼지므로 이후 단계가 전부 가려지고, 여러 랜섬웨어·국가배후가 EDR 킬러를 공유함
  reference: |-
    ■ 관점
    - 대상: EDR·백신과 서명된 취약 드라이버(T1685 — 보안 도구 무력화). BYOVD 권한 상승은 PV-04(로컬·커널 취약점) 연계
    - 레거시 공백: 커널·펌웨어 하위 계층 · 서명된 정상 도구 악용 — 서명된 드라이버라 차단이 어렵고 커널에서 상위 제품을 끔
    - 참고: LOLDrivers 〈Project〉 · Hive Security 〈Modern Attack Techniques 2026〉
    ■ 실제 사례
    - [실제 사고] RansomHub 제휴의 EDR 킬러(BYOVD) 사용(2024-08): 서명된 취약 드라이버로 EDR을 커널에서 무력화 (ENI-016)
    - [실제 사고] Scattered Spider의 헬프데스크 사칭·EDR 회피 침투(2023-11): BYOVD로 EDR을 무력화하며 이동 (ENI-013)
    - [실제 사고] 서명된 취약 드라이버 대량 변종 캠페인(TrueSight 등)(2025-01): 취약 드라이버 변종으로 보안 제품 무력화 (ENI-017)
    - [실제 사고] Reynolds 랜섬웨어의 취약 드라이버 번들(2026-02): 취약 드라이버를 페이로드에 내장해 EDR을 커널에서 무력화 (ENI-036)
    - [정부 경보] 사람 운영 랜섬웨어의 레거시 우회 공통 TTP(2025-03): EDR 무력화를 공통 TTP로 경보 (ENI-030)
  detect: |-
    ■ 탐지
    - 보안 서비스 중지·드라이버 로드와 EDR 텔레메트리 단절을 행위·네트워크 기반으로 탐지(NIST SI-4·SI-7)
    ■ 대응
    - 취약 드라이버 차단 목록(HVCI·블록리스트)·변조 방지와 보안 도구 상태를 중앙 감시(NIST SI-7·CM-7)
    - 참고: LOLDrivers 〈Project〉 · Hive Security 〈Modern Attack Techniques 2026〉

ENT-DM-01.2:
  oneline: 취약·악성 드라이버 로드로 커널 은닉·무력화 토대 마련
  summary: |-
    - 공격자는 취약·악성 드라이버를 커널에 올려 은닉·무력화의 토대를 만들 수 있음
    - 커널 계층이라 상위 보안 제품이 보지 못함
  reference: |-
    ■ 관점
    - 대상: 윈도우 커널에 로드되는 취약·악성 드라이버(T1543.003 — 서비스로 드라이버 로드)
    - 레거시 공백: 커널·펌웨어 하위 계층
    - 참고: LOLDrivers 〈Project〉
    ■ 실제 사례
    - [실제 사고] 서명된 취약 드라이버 대량 변종 캠페인(TrueSight 등)(2025-01): 취약 드라이버 변종을 커널에 로드 (ENI-017)
    - [실제 사고] RansomHub 제휴의 EDR 킬러(BYOVD) 사용(2024-08): 커널 드라이버로 무력화 토대 마련 (ENI-016)
  detect: |-
    ■ 탐지
    - 신규 커널 드라이버 로드와 취약 드라이버 서명·해시를 차단 목록과 대조(NIST SI-7·SI-4)
    ■ 대응
    - HVCI·드라이버 블록리스트로 취약 드라이버 로드를 차단(NIST SI-7·CM-7)
    - 참고: LOLDrivers 〈Project〉
