# [CO] 수집 — 고도화 엔터프라이즈 침해 관점 문구 (가드레일 D11: 방어 자료, 공세 제작법 미기재)

ENT-CO-01:
  oneline: 로컬·네트워크 공유에서 반출 대상 데이터 수집
  summary: |-
    - 공격자는 로컬·네트워크 공유에서 반출 대상 데이터를 모을 수 있음
    - 정상 접근으로 보여 레거시가 구분하기 어려우나 피해는 반출·영향 단계에서 실현됨
  reference: |-
    ■ 관점
    - 대상: 로컬·네트워크 공유 데이터(T1005·T1039)
    - 레거시 공백: 서명된 정상 도구 악용
    ■ 실제 사례
    - [실제 사고] 데이터 스테이징·압축 후 C2 채널 반출(이중 협박)(2024-06): 로컬·공유에서 데이터 수집 (ENI-031)
  detect: |-
    ■ 탐지
    - 대량 파일 열람·공유 접근과 비정상 수집 패턴을 행위 기반으로 탐지(NIST SI-4·AC-6)
    ■ 대응
    - 데이터 접근 최소화·민감 데이터 분류와 접근 감사를 적용(NIST AC-6·SI-4)

ENT-CO-02:
  oneline: 수집 데이터 압축·암호화 스테이징으로 내용 검사 회피
  summary: |-
    - 공격자는 반출 전 데이터를 압축·암호화해 스테이징함으로써 내용 검사를 피할 수 있음
    - 암호화되어 레거시 DLP가 내용을 보지 못하나 단독 피해는 제한적임
  reference: |-
    ■ 관점
    - 대상: 수집 데이터의 압축·암호화 스테이징(T1560·T1074)
    - 레거시 공백: 암호화·정상 채널 은닉 · 시그니처 회피
    ■ 실제 사례
    - [실제 사고] 데이터 스테이징·압축 후 C2 채널 반출(이중 협박)(2024-06): 압축·암호화 스테이징 후 반출 (ENI-031)
  detect: |-
    ■ 탐지
    - 대용량 압축·암호화 산출물 생성과 스테이징 디렉터리 집중을 행위 기반으로 탐지(NIST SI-4·SC-7)
    ■ 대응
    - 비정상 압축·스테이징 탐지와 반출 경로 통제를 병행(NIST SC-7·SI-4)
