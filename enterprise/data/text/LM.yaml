# [LM] 측면 이동 — 고도화 엔터프라이즈 침해 관점 문구 (가드레일 D11: 방어 자료, 공세 제작법 미기재)

ENT-LM-01:
  oneline: 정상 원격 서비스(RDP·SMB·WinRM)로 자격증명 써 확산
  summary: |-
    - 공격자는 RDP·SMB·WinRM 같은 정상 원격 관리 프로토콜로 탈취 자격증명을 써 호스트 간 확산할 수 있음
    - 정상 인증·세션이라 레거시가 악용과 구분하지 못하고 랜섬웨어 전개의 주 경로가 됨
  reference: |-
    ■ 관점
    - 대상: 원격 서비스 RDP·SMB·WinRM(T1021.001·T1021.002·T1021.006)
    - 레거시 공백: 정상 인증 위장 · 암호화·정상 채널 은닉
    - 참고: MITRE 〈ATT&CK Enterprise v19.2〉 · Mandiant 〈M-Trends〉
    ■ 실제 사례
    - [실제 사고] Volt Typhoon의 LotL 기반 핵심 기반시설 장기 침투(2024-02): 정상 원격 서비스로 이동 (ENI-001)
    - [실제 사고] Black Basta 사람 운영 랜섬웨어(2024-05): 원격 서비스로 도메인 확산 (ENI-012)
    - [실제 사고] Akira 랜섬웨어의 MFA 미적용 VPN 경유 침투(2024-04): 원격 서비스로 확산 후 암호화 (ENI-014)
  detect: |-
    ■ 탐지
    - 비정상 원격 세션(출발지·시간·계정)과 내부 RDP·SMB 급증을 네트워크·아이덴티티 기반으로 탐지(NIST SI-4·SC-7)
    ■ 대응
    - 내부 분할·관리 전용 경로·점프 호스트와 원격 서비스 접근 최소화를 적용(NIST AC-17·SC-7)
    - 참고: Mandiant 〈M-Trends〉

ENT-LM-02:
  oneline: 대체 인증 자료(PtH·PtT)로 평문 없이 인증해 확산
  summary: |-
    - 공격자는 평문 암호 없이 해시·티켓으로 인증해 호스트 간 확산할 수 있음
    - 정상 인증으로 보여 레거시가 탐지하지 못하고 도메인 장악으로 직결됨
  reference: |-
    ■ 관점
    - 대상: 해시·티켓 등 대체 인증 자료(T1550.002 Pass-the-Hash · T1550.003 Pass-the-Ticket)
    - 레거시 공백: 정상 인증 위장
    - 연계: 신원 윈도우·Kerberos 인증 자료 재사용(ID-TS-02)
    ■ 실제 사례
    - [실제 사고] NotPetya의 자격증명 탈취·원격 취약점 웜 확산·파괴(2017-06): 자격증명 재사용으로 확산 (ENI-021)
    - [실제 사고] APT28 인접 네트워크 무선 경유 침투(2024-11): 정상 인증 자료로 이동 (ENI-002)
  detect: |-
    ■ 탐지
    - 비정상 티켓·해시 사용과 로그온 유형·계정 불일치를 아이덴티티 기반으로 탐지(NIST SI-4·AC-6)
    ■ 대응
    - 특권 분리·로컬 관리자 암호 고유화(LAPS)·티켓 수명 축소와 재사용 탐지를 적용(NIST IA-2·AC-6)

ENT-LM-03:
  oneline: 측면 도구 전송으로 내부 공유·세션 통해 도구 확산
  summary: |-
    - 공격자는 내부 공유·세션으로 도구·페이로드를 호스트 간 퍼뜨릴 수 있음
    - 정상 채널·도구를 써 레거시가 구분하기 어려우나 피해는 실행·영향 단계에서 발생함
  reference: |-
    ■ 관점
    - 대상: 내부 공유·원격 세션(T1570 — 측면 도구 전송)
    - 레거시 공백: 암호화·정상 채널 은닉 · 서명된 정상 도구 악용
    ■ 실제 사례
    - [실제 사고] Scattered Spider의 헬프데스크 사칭·EDR 회피 침투(2023-11): 정상 도구로 내부 확산 (ENI-013)
  detect: |-
    ■ 탐지
    - 내부 호스트 간 비정상 파일 전송·공유 쓰기를 네트워크·엔드포인트 기반으로 탐지(NIST SI-4·SC-7)
    ■ 대응
    - 내부 분할·공유 권한 최소화와 측면 전송 모니터링을 적용(NIST SC-7·SI-4)

ENT-LM-04:
  oneline: 원격 서비스 취약점 악용으로 인증 없이 웜 확산
  summary: |-
    - 공격자는 인증 없이 원격 서비스 취약점으로 패치되지 않은 호스트에 자동 확산(웜)할 수 있음
    - 패치 전 대규모 전파로 조직 전반이 빠르게 침해됨
  reference: |-
    ■ 관점
    - 대상: 원격 서비스 취약점(T1210 — 원격 서비스 취약점 악용)
    - 레거시 공백: 시그니처 회피 — 공개 직후 미패치 구간을 노려 자동 확산
    - 연계: OT 원격 서비스 취약점 악용 웜 확산(OT-LM-06)
    - 참고: CISA 〈KEV Catalog〉 · MITRE 〈ATT&CK Enterprise v19.2〉
    ■ 실제 사례
    - [실제 사고] WannaCry의 원격 취약점 웜 확산 랜섬웨어(2017-05): 원격 서비스 취약점으로 자동 확산 (ENI-022)
    - [실제 사고] NotPetya의 자격증명 탈취·원격 취약점 웜 확산·파괴(2017-06): 원격 취약점으로 확산 (ENI-021)
  detect: |-
    ■ 탐지
    - 내부 취약 서비스 대상 악용 시도와 급격한 횡적 전파를 네트워크 기반으로 탐지(NIST SC-7·RA-5)
    ■ 대응
    - 신속 패치·내부 분할과 취약 서비스 노출 최소화로 전파를 차단(NIST SI-2·RA-5·SC-7)
    - 참고: CISA 〈KEV Catalog〉
