# [C2] 명령·제어 — 고도화 엔터프라이즈 침해 관점 문구 (가드레일 D11: 방어 자료, 공세 제작법 미기재)

ENT-C2-01.1:
  oneline: 암호화 채널·비표준/정상 포트 위장으로 C2 식별 회피
  summary: |-
    - 공격자는 통제 트래픽을 암호화하고 정상·비표준 포트로 위장해 정상 트래픽에 섞을 수 있음
    - 레거시 IDS·방화벽이 내용을 보지 못해 C2 식별이 사실상 불가함
  reference: |-
    ■ 관점
    - 대상: 암호화 C2 채널·포트(T1573·T1571)
    - 레거시 공백: 암호화·정상 채널 은닉
    ■ 실제 사례
    - [실제 사고] Cobalt Strike 비콘의 암호화 C2·프로세스 인젝션(2023-01): 암호화 채널로 통제 유지 (ENI-018)
  detect: |-
    ■ 탐지
    - TLS 메타데이터·JA3/비컨 주기·목적지 평판을 네트워크 기반으로 탐지(NIST SC-7·SI-4)
    ■ 대응
    - egress 통제·TLS 가시성·목적지 평판 차단과 비컨 탐지를 적용(NIST SC-7·AU-6)

ENT-C2-01.2:
  oneline: 응용 계층 프로토콜(HTTPS) C2로 포트·프로토콜 통제 통과
  summary: |-
    - 공격자는 정상 웹 트래픽처럼 보이는 HTTPS로 통제해 포트·프로토콜 기반 통제를 통과할 수 있음
    - 행위·네트워크 분석 없이는 정상 트래픽과 구분되지 않음
  reference: |-
    ■ 관점
    - 대상: HTTPS 등 응용 계층 프로토콜(T1071.001)
    - 레거시 공백: 암호화·정상 채널 은닉
    ■ 실제 사례
    - [실제 사고] Cobalt Strike 비콘의 암호화 C2·프로세스 인젝션(2023-01): HTTPS로 C2 유지 (ENI-018)
  detect: |-
    ■ 탐지
    - HTTP(S) 비컨 주기·사용자 에이전트·목적지 이상을 네트워크 기반으로 탐지(NIST SC-7·SI-4)
    ■ 대응
    - 웹 프록시·egress 통제·목적지 평판과 비컨 탐지를 적용(NIST SC-7·AU-6)

ENT-C2-03:
  oneline: 정상 웹 서비스·클라우드 플랫폼을 C2 중계로 악용
  summary: |-
    - 공격자는 GitHub·클라우드·협업 SaaS 같은 신뢰 도메인을 C2 중계로 악용할 수 있음
    - 차단하면 업무가 끊겨 레거시 차단·탐지가 어려움
  reference: |-
    ■ 관점
    - 대상: 정상 웹 서비스·클라우드 플랫폼(T1102)
    - 레거시 공백: 암호화·정상 채널 은닉 · 신뢰·공급 관계 경유
    - 연계: AI 서비스 경유 은닉 C2(AI-01-09), 클라우드 프록시 경유 C2(CL-C2-01)
    ■ 실제 사례
    - [실제 사고] 정상 웹 서비스(클라우드·협업) 경유 C2(2024-03): 신뢰 도메인을 C2 중계로 악용 (ENI-028)
  detect: |-
    ■ 탐지
    - 신뢰 SaaS로의 비정상 API 호출·데이터량·주기를 네트워크 기반으로 탐지(NIST SC-7·SI-4)
    ■ 대응
    - 허용 SaaS·테넌트 제한과 egress 가시성·이상 사용 탐지를 적용(NIST SC-7·SI-4)

ENT-C2-04:
  oneline: 도메인 프런팅·다단계 프록시로 도메인·IP 차단 우회
  summary: |-
    - 공격자는 신뢰 CDN·프록시 뒤로 실제 C2를 숨겨 도메인·IP 기반 차단을 우회할 수 있음
    - 정상 도메인으로 보이나 TLS·주기 분석 등 탐지·차단 수단이 일부 존재함
  reference: |-
    ■ 관점
    - 대상: CDN·프록시 경유 채널(T1090.004 도메인 프런팅 · T1090 프록시)
    - 레거시 공백: 암호화·정상 채널 은닉
    ■ 실제 사례
    - [실제 사고] Cobalt Strike 비콘의 암호화 C2·프로세스 인젝션(2023-01): 도메인 프런팅으로 C2 은닉 (ENI-018)
  detect: |-
    ■ 탐지
    - SNI와 실제 목적지 불일치·비정상 CDN 사용을 네트워크 기반으로 탐지(NIST SC-7·SI-4)
    ■ 대응
    - TLS 검사·SNI 정책과 프록시 경유 egress 통제를 적용(NIST SC-7·SI-4)

ENT-C2-05:
  oneline: 정상 도구로 추가 페이로드 반입(인그레스 도구 전송)
  summary: |-
    - 공격자는 certutil·curl 등 정상 도구로 추가 페이로드를 내려받아 반입할 수 있음
    - 정상 도구·암호화 채널을 써 레거시가 구분하기 어려우나 피해는 후속 단계에서 발생함
  reference: |-
    ■ 관점
    - 대상: 정상 도구 경유 페이로드 반입(T1105 — 인그레스 도구 전송)
    - 레거시 공백: 암호화·정상 채널 은닉 · 서명된 정상 도구 악용
    - 참고: MITRE 〈ATT&CK Enterprise v19.2〉 · LOLBAS 〈Project〉
    ■ 실제 사례
    - [실제 사고] 서명된 정상 바이너리(LOLBin) 대리 실행 광범위 사용(2023-03): 정상 도구로 페이로드 다운로드 (ENI-019)
    - [실제 사고] Cobalt Strike 비콘의 암호화 C2·프로세스 인젝션(2023-01): 추가 도구 반입 (ENI-018)
  detect: |-
    ■ 탐지
    - 정상 다운로드 도구의 비정상 사용·외부 다운로드를 행위·네트워크 기반으로 탐지(NIST SI-4·SC-7)
    ■ 대응
    - 불필요한 다운로드 도구 제한·egress 통제와 반입 파일 검사를 적용(NIST SI-3·SC-7)
    - 참고: LOLBAS 〈Project〉

ENT-C2-06:
  oneline: DNS 경유 C2·터널링으로 방화벽 우회
  summary: |-
    - 공격자는 거의 항상 허용되는 DNS 질의에 통제·데이터를 실어 방화벽을 우회할 수 있음
    - 레거시가 DNS 내용을 보지 않아 은닉 C2에 쓰이나 질의 이상 탐지로 일부 포착 가능함
  reference: |-
    ■ 관점
    - 대상: DNS 질의(T1071.004 — DNS C2·터널링)
    - 레거시 공백: 암호화·정상 채널 은닉
    ■ 실제 사례
    - [실제 사고] DNS 터널링 기반 은닉 C2·반출(2023-09): DNS에 통제·데이터를 실어 우회 (ENI-027)
  detect: |-
    ■ 탐지
    - 비정상 DNS 질의량·엔트로피·긴 서브도메인을 네트워크 기반으로 탐지(NIST SC-7·SI-4)
    ■ 대응
    - DNS 로깅·필터링·내부 리졸버 강제와 이상 질의 차단을 적용(NIST SC-7·AU-6)
