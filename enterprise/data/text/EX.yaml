# [EX] 실행 — 고도화 엔터프라이즈 침해 관점 문구 (가드레일 D11: 방어 자료, 공세 제작법 미기재)

ENT-EX-01.1:
  oneline: PowerShell 파일리스 실행으로 시그니처 AV 무력화
  summary: |-
    - 공격자는 PowerShell로 디스크에 파일을 남기지 않고 메모리에서 코드를 실행할 수 있음
    - 시그니처 AV가 보지 못해 행위 맥락으로만 탐지되며, 사람 운영 랜섬웨어·국가배후 작전의 기본 실행 수단임
  reference: |-
    ■ 관점
    - 대상: 서명된 정상 셸 PowerShell(T1059.001)
    - 레거시 공백: 파일리스·인메모리 · 서명된 정상 도구 악용 — 정상 도구라 허용 목록을 통과하고 디스크 산출물이 없음
    - 참고: MITRE 〈ATT&CK Enterprise v19.2〉 · LOLBAS 〈Project〉
    ■ 실제 사례
    - [실제 사고] Volt Typhoon의 LotL 기반 핵심 기반시설 장기 침투(2024-02): 악성코드를 거의 쓰지 않고 내장 도구만으로 수행 (ENI-001)
    - [실제 사고] Black Basta 사람 운영 랜섬웨어(2024-05): PowerShell·정상 도구로 실행 (ENI-012)
    - [실제 사고] WMI·PowerShell 파일리스 실행·지속(2023-05): 메모리 실행·지속성 확보 (ENI-020)
  detect: |-
    ■ 탐지
    - PowerShell 스크립트 블록·명령줄 로깅과 비정상 실행 맥락(인코딩·다운로드·원격 실행)을 행위 기반으로 탐지(NIST SI-4·SI-3)
    ■ 대응
    - 스크립트 로깅·제약 언어 모드·서명 정책과 최소 기능 원칙을 적용(NIST CM-7·SI-4)
    - 참고: LOLBAS 〈Project〉

ENT-EX-01.2:
  oneline: Windows 관리 도구(WMI) 악용으로 파일리스 실행·이동
  summary: |-
    - 공격자는 WMI 같은 정상 관리 기능으로 파일 없이 실행·측면 이동·수집을 수행할 수 있음
    - 정상 관리 트래픽이라 레거시가 구분하지 못하나 단독 피해보다 다른 단계를 잇는 수단임
  reference: |-
    ■ 관점
    - 대상: Windows Management Instrumentation(T1047)
    - 레거시 공백: 파일리스·인메모리 · 서명된 정상 도구 악용
    ■ 실제 사례
    - [실제 사고] WMI·PowerShell 파일리스 실행·지속(2023-05): WMI로 실행·지속성 확보 (ENI-020)
  detect: |-
    ■ 탐지
    - WMI 이벤트 구독·원격 WMI 실행과 비정상 부모-자식 프로세스를 행위 기반으로 탐지(NIST SI-4·AU-6)
    ■ 대응
    - WMI 원격 실행을 제한하고 관리 활동을 기준선과 대조·감사(NIST CM-7·AU-6)

ENT-EX-03:
  oneline: 서명된 정상 바이너리(LOLBin) 대리 실행으로 허용 목록 통과
  summary: |-
    - 공격자는 OS에 서명·내장된 정상 바이너리로 악성 코드를 대리 실행하거나 페이로드를 내려받을 수 있음
    - 허용 목록·서명 검증을 통과해 레거시 통제가 구분하지 못함(LOLBAS 245개 수록)
  reference: |-
    ■ 관점
    - 대상: 서명된 정상 시스템 바이너리(T1218 — 시스템 바이너리 프록시 실행)
    - 레거시 공백: 서명된 정상 도구 악용 · 시그니처 회피 — 정상·서명 바이너리라 차단·식별이 어려움
    - 참고: LOLBAS 〈Project〉 · MITRE 〈ATT&CK Enterprise v19.2〉
    ■ 실제 사례
    - [실제 사고] Volt Typhoon의 LotL 기반 핵심 기반시설 장기 침투(2024-02): 내장 도구만으로 작전 수행 (ENI-001)
    - [실제 사고] 서명된 정상 바이너리(LOLBin) 대리 실행 광범위 사용(2023-03): 정상 바이너리로 대리 실행·다운로드 (ENI-019)
    - [정부 경보] 사람 운영 랜섬웨어의 레거시 우회 공통 TTP(2025-03): LotL 실행을 공통 TTP로 경보 (ENI-030)
  detect: |-
    ■ 탐지
    - 정상 바이너리의 비정상 인자·부모 프로세스·네트워크 행위를 행위 기반으로 탐지(NIST SI-4·CM-7)
    ■ 대응
    - 불필요한 LOLBin 실행을 허용 목록·애플리케이션 제어로 제한하고 무결성·실행 맥락을 감시(NIST CM-7·SI-7)
    - 참고: LOLBAS 〈Project〉

ENT-EX-04:
  oneline: 네이티브 API·시스템 서비스 직접 실행으로 후킹 탐지 회피
  summary: |-
    - 공격자는 네이티브 API를 직접 호출하거나 시스템 서비스로 실행해 중간 도구를 거치지 않을 수 있음
    - 후킹 기반 탐지를 우회하나 피해는 후속 단계에서 발생함
  reference: |-
    ■ 관점
    - 대상: 네이티브 API·시스템 서비스 실행(T1106·T1569.002)
    - 레거시 공백: 파일리스·인메모리 · 서명된 정상 도구 악용
    ■ 실제 사례
    - 공개 사고 미확인 — 다른 침해의 실행 구성 요소로만 보고됨. ATT&CK 주체 사례가 다수 관측됨
  detect: |-
    ■ 탐지
    - 커널 콜백·시스템 서비스 생성과 비정상 API 호출 시퀀스를 EDR 행위 기반으로 탐지(NIST SI-4)
    ■ 대응
    - 커널 수준 가시성(EDR)과 최소 기능·서비스 생성 통제를 적용(NIST CM-7·SI-4)
