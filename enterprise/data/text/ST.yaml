# [ST] 은닉(Stealth) — 고도화 엔터프라이즈 침해 관점 문구
# ATT&CK v19(2026-04) 방어 회피 분리 — 은닉(TA0005, 구 방어 회피 유지): 정상 행위에 섞여 탐지를 피함.
# 가드레일 D11: 방어 자료, 공세 제작법 미기재.

ENT-ST-01:
  oneline: 이벤트 로그·파일 삭제로 레거시 SIEM 탐지·분석 무력화
  summary: |-
    - 공격자는 이벤트 로그·파일을 지워 레거시 SIEM 탐지와 사후 분석을 무력화할 수 있음
    - 원격·불변 로그가 없으면 흔적이 사라져 추적이 어려워짐
  reference: |-
    ■ 관점
    - 대상: 이벤트 로그·파일(T1070 — 지표 삭제 · T1070.004 파일 삭제 · T1685.005 윈도우 이벤트 로그 삭제)
    - 레거시 공백: 시그니처 회피
    - 경계: 이벤트 로그 삭제(T1685.005)는 v19에서 방어 무력화로 재배치됐으나, 흔적 제거가 목적이라 은닉 행으로 둠
    ■ 실제 사례
    - [실제 사고] Volt Typhoon의 LotL 기반 핵심 기반시설 장기 침투(2024-02): 로그·흔적을 지워 장기 잠복 (ENI-001)
  detect: |-
    ■ 탐지
    - 로그 삭제·감사 정책 변경 이벤트와 원격 수집 로그의 공백을 모니터링(NIST AU-6·SI-4)
    ■ 대응
    - 원격·불변 로그 전송과 로그 삭제 방지·보존 정책을 적용(NIST AU-9·AU-6)

ENT-ST-02:
  oneline: 정상 이름·경로·서명 가장(위장)으로 눈·규칙 탐지 회피
  summary: |-
    - 공격자는 정상 프로세스·경로·서명으로 위장해 사람 눈과 규칙 기반 탐지를 피할 수 있음
    - 정상처럼 보여 레거시가 구분하기 어려우나 단독 피해는 제한적임
  reference: |-
    ■ 관점
    - 대상: 프로세스·파일 이름·경로·서명(T1036 — 위장)
    - 레거시 공백: 서명된 정상 도구 악용 · 시그니처 회피
    ■ 실제 사례
    - 공개 사고 미확인 — 편재(LotL·정상 기능) 기법으로 단독 사건보다 빈발 지수(ATT&CK 주체 다수)로 평가. 대표 사고 편입은 후속(검토 P2)
  detect: |-
    ■ 탐지
    - 정상 이름과 다른 경로·서명·해시 불일치를 무결성·행위 기반으로 탐지(NIST SI-4·SI-7)
    ■ 대응
    - 바이너리 무결성·서명 검증과 정상 경로 기준선 대조를 적용(NIST SI-7·SI-4)

ENT-ST-03:
  oneline: 패킹·인코딩·암호화 난독화로 시그니처·정적 분석 회피
  summary: |-
    - 공격자는 페이로드를 패킹·인코딩·암호화해 시그니처·정적 분석을 회피할 수 있음
    - 변종 양산으로 레거시 AV를 지속 우회하나 단독 피해는 제한적임
  reference: |-
    ■ 관점
    - 대상: 파일·스크립트·명령(T1027 — 난독화)
    - 레거시 공백: 시그니처 회피 · 파일리스·인메모리
    ■ 실제 사례
    - 공개 사고 미확인 — 편재(LotL·정상 기능) 기법으로 단독 사건보다 빈발 지수(ATT&CK 주체 다수)로 평가. 대표 사고 편입은 후속(검토 P2)
  detect: |-
    ■ 탐지
    - 실행 시점 행위·언패킹과 비정상 인코딩·엔트로피를 행위 기반으로 탐지(NIST SI-3·SI-4)
    ■ 대응
    - 시그니처 의존을 줄이고 행위 기반·샌드박스 분석을 병행(NIST SI-3·SI-4)

ENT-ST-04:
  oneline: 인메모리·반사 코드 로딩으로 파일 기반 AV 원천 회피
  summary: |-
    - 공격자는 디스크를 거치지 않고 메모리에서 페이로드를 로드·실행할 수 있음
    - 파일 기반 AV·시그니처가 원천적으로 보지 못해 행위·메모리 기반 탐지가 필요함
  reference: |-
    ■ 관점
    - 대상: 메모리 내 코드 로딩(T1620 — 반사 코드 로딩)
    - 레거시 공백: 파일리스·인메모리 · 시그니처 회피
    ■ 실제 사례
    - 공개 사고 미확인 — 편재(LotL·정상 기능) 기법으로 단독 사건보다 빈발 지수(ATT&CK 주체 다수)로 평가. 대표 사고 편입은 후속(검토 P2)
  detect: |-
    ■ 탐지
    - 메모리 영역 할당·실행과 비정상 로딩을 EDR 메모리 스캔으로 탐지(NIST SI-3·SI-4)
    ■ 대응
    - 메모리 가시성(EDR)·공격 표면 축소와 스크립트 실행 통제를 적용(NIST SI-3·SI-4)

ENT-ST-05:
  oneline: 루트킷으로 프로세스·파일·연결을 하위 계층에서 은폐
  summary: |-
    - 공격자는 루트킷으로 프로세스·파일·연결을 하위 계층에서 숨겨 탐지·분석을 방해할 수 있음
    - 레거시로는 존재 자체를 알기 어려워 장기 잠복에 쓰임
  reference: |-
    ■ 관점
    - 대상: 사용자·커널 루트킷(T1014)
    - 레거시 공백: 커널·펌웨어 하위 계층 · 파일리스·인메모리
    ■ 실제 사례
    - 공개 사고 미확인 — 편재(LotL·정상 기능) 기법으로 단독 사건보다 빈발 지수(ATT&CK 주체 다수)로 평가. 대표 사고 편입은 후속(검토 P2)
  detect: |-
    ■ 탐지
    - 커널 무결성·드라이버 서명과 메모리·부트 무결성 검증으로 은폐를 탐지(NIST SI-7·SI-4)
    ■ 대응
    - 커널 무결성 보호(HVCI)·보안 부팅과 하위 계층 텔레메트리를 확보(NIST SI-7·SI-4)

ENT-ST-06:
  oneline: 펌웨어·부트킷(UEFI)으로 OS 아래 지속·은닉
  summary: |-
    - 공격자는 OS 아래 펌웨어·부트 단계에 임플란트를 심어 재설치·디스크 교체에도 지속할 수 있음
    - OS 보안 제품의 가시성 밖이라 레거시·EDR 모두 사실상 공백임
  reference: |-
    ■ 관점
    - 대상: 펌웨어·UEFI·부트 단계(T1542 — Pre-OS Boot)
    - 레거시 공백: 커널·펌웨어 하위 계층 — OS 아래라 상위 제품이 보지 못함
    ■ 실제 사례
    - [실증] BlackLotus UEFI 부트킷(보안 부팅 우회)(2023-03): 보안 부팅을 우회하는 UEFI 부트킷이 분석됨 (ENI-024)
    - [실제 사고] 펌웨어 임플란트(LoJax/MoonBounce 계열)(2022-01): UEFI 펌웨어 임플란트로 재설치에도 지속 (ENI-026)
  detect: |-
    ■ 탐지
    - 펌웨어·부트 무결성 측정(보안 부팅·측정 부팅)과 펌웨어 버전·해시 변화를 점검(NIST SI-7)
    ■ 대응
    - 보안 부팅·펌웨어 무결성 검증·업데이트와 펌웨어 공급 신뢰를 관리(NIST SI-7·CM-7)
