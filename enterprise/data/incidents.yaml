- id: ENI-015
  title: LockBit 제휴의 복구 방해·EDR 무력화 암호화(CISA 권고)
  date: "2023-06"
  kind: 캠페인
  verification: 정부·사법 확인
  region: 글로벌
  sector: [다부문]
  actor: LockBit(RaaS)
  actor_type: [랜섬웨어]
  impact: [랜섬·암호화, 서비스 중단]
  summary: >-
    CISA·FBI·국제 파트너가 2022~2023년 가장 많이 배포된 랜섬웨어로 LockBit을 지목하고, 제휴 모델 특성상 TTP가 다양하나
    암호화 직전 섀도 카피·백업 삭제와 보안 서비스 중지로 복구를 막는 공통 수법을 정리했다(AA23-165A). 2024-02 국제 공조
    (Operation Cronos)로 인프라가 단속됐으나 변종이 이어졌다.
  ent: [ENT-IM-01, ENT-IM-02, ENT-IM-04, ENT-DM-01.1]
