# 고도화 엔터프라이즈 침해 사고 DB — 공개 출처 기반(정부·사법 발표, 피해기관 공지, 보안업체·연구기관 분석, 공신력 있는 보도)
#
# 범위(작업방향 4·D7): 호스트·엔드포인트·네트워크·C2·방어 회피·온프레미스 AD 인접 침해. 레거시로 막기 어려운 고도화·최근빈발 사례.
# 필드
#   id            ENI-NNN
#   title/date/kind/verification/legal(선택)/region/sector/actor/actor_type/impact/summary
#   ent           매핑 세부위협(data/taxonomy.yaml ENT-ID)
#   attack_ref    (선택) ATT&CK 그룹·소프트웨어·캠페인 ID
#   cve           (선택) 악용 CVE — reference/kev/ 목록과 대조(KEV 외면 비고)
#   origin        (선택) 통합 v4.1 원장 키(재인용 추적)
#   sources       '출처 | URL'
# 집계 규칙(taxonomy_rules.py): 실제 사고 = kind ∈ {사고·캠페인·공시·사례연구(익명)} & verification ∉ {행위자 주장·논란·원인 번복}.
#   정부 경보·위협인텔은 실사용 근거, 연구·시연은 실증 근거로만('중' 상한).

# --- 국가배후 LotL·네트워크 침투 ---
- id: ENI-001
  title: Volt Typhoon의 LotL 기반 핵심 기반시설 장기 침투
  date: "2024-02"
  kind: 캠페인
  verification: 정부·사법 확인
  region: 미국
  sector: [에너지·기반시설, 통신·미디어]
  actor: Volt Typhoon(중국 연계)
  actor_type: [국가배후]
  impact: [내부 접근 확보, 첩보·감시, 측면 이동·확산]
  summary: >-
    국가 연계 행위자가 노출된 경계 장비로 들어와 악성코드를 거의 쓰지 않고 내장 도구(LotL)만으로 정찰·자격증명 탈취·측면 이동을
    수행하며 핵심 기반시설 네트워크에 장기 잠복했다. CISA 등은 EDR 없는 엣지 장비와 정상 도구 사용으로 레거시 탐지가 어려웠다고 밝혔다.
  ent: [ENT-IA-01, ENT-EX-01.1, ENT-EX-03, ENT-DI-01, ENT-DI-02, ENT-CA-01.1, ENT-LM-01, ENT-DE-03]
  attack_ref: [G1017]
  sources:
    - CISA(2024) PRC State-Sponsored Actors Compromise and Maintain Persistent Access (AA24-038A) | https://www.cisa.gov/news-events/cybersecurity-advisories/aa24-038a

