# Lv1 전술(도메인) — ATT&CK Enterprise 침투~영향 12개(선정 범위, D7)
tactics:
  초기 침투: 경계·엣지 장비·외부 원격 서비스·드라이브바이·이동식 매체·신뢰 관계를 통한 최초 진입
  실행: 서명된 정상 도구·파일리스로 코드를 실행
  지속: 재부팅·로그아웃 후에도 접근을 유지
  권한 상승: 프로세스 인젝션·토큰·UAC·취약점으로 권한을 높임
  방어 회피: EDR 변조·BYOVD·지표 삭제·위장·난독화·인메모리·루트킷·펌웨어로 탐지를 피함
  자격증명 접근: LSASS·캐시·Kerberos·입력 캡처로 자격증명을 탈취
  탐색: 호스트·네트워크·AD를 열거해 경로를 파악
  측면 이동: 원격 서비스·대체 인증 자료·도구 전송·원격 취약점으로 확산
  수집: 로컬·공유 데이터를 모으고 스테이징
  명령·제어: 암호화·정상 채널·웹 서비스·DNS로 통제 트래픽을 숨김
  반출: C2·웹 서비스·대체 프로토콜로 데이터를 빼냄
  영향: 암호화·복구 방해·파괴·서비스 중지·갈취

# 레거시 방어 공백 유형(행 legacy_gap) — 이 매트릭스의 차별적 축(D6, 작업방향 4.4)
legacy_gaps:
  시그니처 회피: 변종·패킹·난독화로 시그니처 AV를 우회
  파일리스·인메모리: 디스크 산출물 없이 메모리에서 실행돼 파일 기반 탐지가 못 봄
  서명된 정상 도구 악용: LOLBin·정상 관리 도구를 써 허용 목록·서명 검증을 통과
  암호화·정상 채널 은닉: HTTPS·정상 서비스·DNS에 통제·반출을 숨겨 경계 통제가 내용을 못 봄
  정상 인증 위장: 탈취 계정·해시·티켓으로 정상 로그인처럼 보임
  경계 밖·비관리 장비: 엣지 어플라이언스·IoT·BYOD 등 EDR이 없는 자산
  커널·펌웨어 하위 계층: 드라이버·커널·펌웨어·부트 단계라 상위 보안 제품이 못 봄
  신뢰·공급 관계 경유: MSP·협력사·신뢰 도메인 등 정상 신뢰 경로를 통과

# 요구 방어 수준(행 defense_level) — 최소 필요 수준(D6)
defense_levels:
  레거시: 시그니처 AV·경계 방화벽·IDS로 대응 가능
  EDR·XDR: 엔드포인트 행위 탐지·대응이 필요
  행위·네트워크·아이덴티티: NDR·ITDR·UEBA 등 행위·네트워크·아이덴티티 기반 탐지가 필요(레거시·단순 EDR로는 부족)

# 위협 주체 유형(행 actors·사고 DB actor_type) — 행위자는 사고 DB actor로만 귀속
actor_types:
  국가배후: 국가 지원·연계 그룹(첩보·파괴·영향)
  랜섬웨어: 사람 운영 랜섬웨어 조직·제휴(RaaS)
  사이버범죄: 금전 목적 범죄 조직·개인
  핵티비스트: 정치·사회 목적 행위자
  접근 브로커: 초기 접근을 탈취해 되파는 중개자(IAB)

# 대상 플랫폼(행 platforms)
platforms:
  Windows: 윈도우 호스트·서버·AD
  Linux: 리눅스 서버·워크로드
  macOS: 맥 엔드포인트
  네트워크: 경계·엣지 장비·네트워크 장비
  펌웨어: 펌웨어·UEFI·부트 단계

