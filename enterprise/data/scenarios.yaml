# 공격 체인 시나리오 — 실제 사고를 고도화·레거시 우회 침해 흐름으로 재구성(방어 관점)
# 필드: incidents = 근거 사고 ID(ENI-NNN)
#       steps = 순서대로 { ent: [세부위협 ID], 전술: ATT&CK 전술, 행위: 사고 요약에 있는 사실만(괄호 안 근거 사고 ID), 탐지: 탐지·차단 포인트 }
#       chokepoints = '세부위협 ID — 끊는 통제'
# 가드레일(D11): 실행 방법이 아니라 식별·탐지·차단 지점을 적음
# 검증: scripts/validate.py가 ENT·사고·ATT&CK ID 존재, 전술 어휘, 단계 사고 ⊂ incidents, 초크 포인트-단계 일치를 점검

scenarios:
  - id: ESN-01
    title: 엣지 VPN 0-day → LotL 정찰·자격증명 → 원격 서비스 확산(사람 운영 침투)
    incidents: [ENI-001, ENI-006, ENI-012]
    summary: 노출된 엣지 장비로 들어와 내장 도구(LotL)만으로 정찰·자격증명 탈취·확산하는, 국가배후·사람 운영 랜섬웨어 공통 흐름. 엣지 장비 패치와 LSASS 보호·내부 분할이 가장 싼 차단 지점이다.
    steps:
      - { ent: [ENT-IA-01], 전술: 초기 침투, 행위: "인터넷 노출 엣지 VPN의 연쇄 0-day로 경계 안 진입(ENI-006)", 탐지: "엣지 장비 취약점 공개·악용 동향 대조와 비정상 세션 모니터링" }
      - { ent: [ENT-EX-01.1, ENT-EX-03, ENT-DI-01, ENT-DI-02], 전술: 실행, 행위: "PowerShell·정상 바이너리(LotL)로 실행하고 호스트·AD를 열거(ENI-001)", 탐지: "스크립트 로깅과 짧은 시간의 연쇄 탐색·LotL 실행을 행위 기반으로 탐지" }
      - { ent: [ENT-CA-01.1, ENT-LM-01], 전술: 자격증명 접근, 행위: "LSASS 덤프로 자격증명을 얻어 원격 서비스로 확산(ENI-012)", 탐지: "LSASS 비정상 접근과 비정상 원격 세션을 EDR·네트워크로 탐지" }
    chokepoints:
      - ENT-IA-01 — 엣지 장비 신속 패치·노출 최소화로 초기 침투를 끊음
      - ENT-CA-01.1 — LSASS 보호(PPL)·자격증명 가드로 확산 발판을 제거

  - id: ESN-02
    title: 사람 운영 랜섬웨어 — 초기 침투 → EDR 무력화(BYOVD) → 복구 방해 → 암호화·갈취
    incidents: [ENI-014, ENI-012, ENI-016, ENI-015]
    summary: VPN·노출 서비스 초기 침투 후 BYOVD로 EDR을 끄고 백업을 지운 뒤 전사 암호화·이중 협박으로 가는 사람 운영 랜섬웨어의 전형. 보안 도구 무력화와 백업 보호가 결정적 차단 지점이다.
    steps:
      - { ent: [ENT-IA-02], 전술: 초기 침투, 행위: "MFA 미적용 VPN으로 정상 로그인해 진입(ENI-014)", 탐지: "원격 로그인 이상·MFA 미적용 경로를 아이덴티티 기반으로 탐지" }
      - { ent: [ENT-CA-01.1, ENT-DI-02, ENT-LM-01], 전술: 자격증명 접근, 행위: "자격증명 탈취·AD 열거 후 원격 서비스로 도메인 확산(ENI-012)", 탐지: "LSASS 접근·AD 열거·비정상 원격 세션 상관 탐지" }
      - { ent: [ENT-DM-01.1, ENT-PV-04], 전술: 방어 무력화, 행위: "서명된 취약 드라이버로 EDR을 커널에서 무력화(ENI-016)", 탐지: "보안 서비스 중지·드라이버 로드와 EDR 텔레메트리 단절 탐지" }
      - { ent: [ENT-IM-02, ENT-IM-01], 전술: 영향, 행위: "섀도 카피·백업을 지운 뒤 전사 암호화(ENI-015)", 탐지: "섀도 카피 삭제·대량 암호화 행위를 행위 기반으로 탐지" }
    chokepoints:
      - ENT-DM-01.1 — 취약 드라이버 차단 목록(HVCI)·변조 방지로 EDR 무력화를 막음
      - ENT-IM-02 — 오프라인·불변 백업으로 복구 불능을 방지

  - id: ESN-03
    title: 파일전송 엣지 0-day → 대량 데이터 반출 → 유출 협박 갈취(Cl0p 패턴)
    incidents: [ENI-004, ENI-010]
    summary: MOVEit·Cleo 같은 노출 파일전송 솔루션의 0-day로 수백 조직에서 데이터를 대량 반출하고 유출 협박으로 갈취한 흐름. 암호화 없이 반출·갈취만으로 피해가 실현돼 파일전송 장비 패치와 반출 탐지가 차단 지점이다.
    steps:
      - { ent: [ENT-IA-01], 전술: 초기 침투, 행위: "노출 파일전송 장비의 공개 전 취약점으로 진입(ENI-004)", 탐지: "파일전송 장비 취약점 동향 대조와 비정상 접근 모니터링" }
      - { ent: [ENT-EF-02], 전술: 반출, 행위: "파일전송 솔루션에서 데이터를 대량 반출(ENI-010)", 탐지: "대량 업로드·외부 전송을 네트워크·DLP 기반으로 탐지" }
      - { ent: [ENT-IM-05], 전술: 영향, 행위: "유출 데이터 공개 협박으로 갈취(ENI-004)", 탐지: "대량 반출 선행 징후와 갈취 정황을 통합 모니터링" }
    chokepoints:
      - ENT-IA-01 — 파일전송 엣지 장비 신속 패치·노출 최소화
      - ENT-EF-02 — egress·DLP 통제로 대량 반출을 차단

  - id: ESN-04
    title: 원격 서비스 취약점 웜 확산 → 자격증명 재사용 → 파괴·암호화
    incidents: [ENI-022, ENI-021]
    summary: 인증 없이 원격 서비스 취약점으로 자동 확산(웜)한 뒤 자격증명 재사용으로 퍼지고 암호화·파괴에 이른 흐름(WannaCry·NotPetya). 패치와 내부 분할이 전파를 끊는 지점이다.
    steps:
      - { ent: [ENT-LM-04], 전술: 측면 이동, 행위: "원격 서비스 취약점으로 패치되지 않은 호스트에 자동 확산(ENI-022)", 탐지: "내부 취약 서비스 악용 시도·급격한 횡적 전파를 네트워크로 탐지" }
      - { ent: [ENT-CA-01.1, ENT-LM-02], 전술: 자격증명 접근, 행위: "자격증명을 탈취·재사용해 추가 확산(ENI-021)", 탐지: "비정상 티켓·해시 사용과 로그온 유형 불일치 탐지" }
      - { ent: [ENT-IM-03], 전술: 영향, 행위: "디스크를 파괴해 운영 중단(ENI-021)", 탐지: "대량 삭제·MBR 변조 행위를 행위 기반으로 탐지" }
    chokepoints:
      - ENT-LM-04 — 신속 패치·내부 분할로 웜 전파를 끊음
      - ENT-LM-02 — 특권 분리·LAPS로 자격증명 재사용 확산을 제한

  - id: ESN-05
    title: 비콘 C2 — 프로세스 인젝션 → 암호화·도메인 프런팅 C2 → 반출
    incidents: [ENI-018]
    summary: 상용 침투 프레임워크 비콘이 프로세스 인젝션으로 메모리에서 실행되고 암호화·도메인 프런팅 C2를 유지하며 데이터를 반출하는 흐름. 메모리 가시성과 egress 통제가 차단 지점이다.
    steps:
      - { ent: [ENT-PV-01.1], 전술: 권한 상승, 행위: "비콘이 프로세스 인젝션으로 메모리에서 실행(ENI-018)", 탐지: "원격 스레드 생성·메모리 실행을 EDR로 탐지" }
      - { ent: [ENT-C2-01.2, ENT-C2-04], 전술: 명령·제어, 행위: "HTTPS·도메인 프런팅으로 암호화 C2 유지(ENI-018)", 탐지: "비컨 주기·SNI 불일치·목적지 평판을 네트워크로 탐지" }
    chokepoints:
      - ENT-C2-01.2 — egress·TLS 가시성·비컨 탐지로 C2를 차단
      - ENT-PV-01.1 — 메모리 가시성(EDR)으로 인메모리 실행을 탐지

  - id: ESN-06
    title: 신뢰 관계(MSP·원격 관리) 경유 → 하위 고객 대량 랜섬웨어
    incidents: [ENI-011, ENI-009]
    summary: MSP·원격 관리 도구의 신뢰 경로로 들어와 다수 하위 고객에 랜섬웨어를 일괄 배포한 흐름(Kaseya·ScreenConnect). 신뢰 경로 최소 권한과 관리 도구 패치가 차단 지점이다.
    steps:
      - { ent: [ENT-IA-05], 전술: 초기 침투, 행위: "원격 관리 플랫폼 취약점을 경유해 하위 고객 환경에 접근(ENI-011)", 탐지: "관리 도구발 대량·일괄 작업과 신뢰 계정 이상 사용을 탐지" }
      - { ent: [ENT-IM-01], 전술: 영향, 행위: "신뢰된 원격 관리 경로로 랜섬웨어를 일괄 배포(ENI-009)", 탐지: "대량 암호화 행위와 배포 경로 이상을 탐지" }
    chokepoints:
      - ENT-IA-05 — 신뢰 관계 최소 권한·연동 토큰 단기화·관리 도구 패치
      - ENT-IM-01 — 오프라인 백업·선행 단계 차단으로 피해 범위 축소

  - id: ESN-07
    title: 지표 삭제·위장·난독화로 사후 분석 방해(은닉 보조 흐름)
    incidents: [ENI-001]
    summary: 공격자가 이벤트 로그를 지우고 정상 이름으로 위장하며 페이로드를 난독화해 레거시 SIEM 탐지와 사후 분석을 무력화한 흐름. 원격·불변 로그와 행위 기반 탐지가 차단 지점이다.
    steps:
      - { ent: [ENT-ST-03, ENT-ST-02], 전술: 은닉, 행위: "정상 이름·경로로 위장하고 지표를 지우며 장기 잠복(ENI-001)", 탐지: "경로·서명 불일치와 비정상 인코딩을 무결성·행위 기반으로 탐지" }
      - { ent: [ENT-ST-01], 전술: 은닉, 행위: "이벤트 로그를 지워 탐지·분석을 무력화(ENI-001)", 탐지: "로그 삭제·감사 정책 변경과 원격 수집 로그 공백을 모니터링" }
    chokepoints:
      - ENT-ST-01 — 원격·불변 로그 전송·보존으로 지표 삭제를 무력화
      - ENT-ST-02 — 바이너리 무결성·서명 검증으로 위장을 식별

  - id: ESN-08
    title: 커널·펌웨어 하위 계층 은닉 — 루트킷·부트킷으로 장기 잠복
    incidents: [ENI-024, ENI-026]
    summary: 공격자가 커널 루트킷·UEFI 부트킷·펌웨어 임플란트로 OS 아래에 숨어 재설치에도 지속하며 장기 잠복한 흐름. 레거시·일반 EDR의 가시성 밖이라 펌웨어·부트 무결성 검증이 유일한 차단 지점이다.
    steps:
      - { ent: [ENT-ST-06], 전술: 은닉, 행위: "UEFI 펌웨어 임플란트(LoJax·MoonBounce)로 재설치·디스크 교체에도 지속(ENI-026)", 탐지: "펌웨어 무결성 측정·보안 부팅과 펌웨어 해시 변화 점검" }
      - { ent: [ENT-ST-06], 전술: 은닉, 행위: "UEFI 부트킷·펌웨어 임플란트로 재설치에도 지속(ENI-024)", 탐지: "보안 부팅·측정 부팅과 펌웨어 해시 변화 점검" }
    chokepoints:
      - ENT-ST-06 — 보안 부팅·펌웨어 무결성 검증으로 하위 계층 은닉을 탐지
      - ENT-ST-06 — 펌웨어 무결성·보안 부팅·공급 신뢰 관리로 하위 계층 임플란트를 차단
