# 공격 체인 시나리오 — 실제 사고를 물리·인적 공격 흐름으로 재구성(방어 관점)
# 목적: 한 행 = 한 행위로 나눈 세부위협을 공격 흐름 안에서 보고, 어느 단계에서 끊을 수 있는지(초크 포인트)를 드러냄
#       (아이덴티티·공급망 매트릭스 시나리오 형식 준용)
# 필드: incidents = 근거 사고 ID(data/incidents.yaml), ref = ATT&CK 그룹 ID(선택)
#       steps = 순서대로 { pht: [세부위협 ID], 단계: 공격 단계(정찰·접근·실행·지속·내부자화·반출·영향),
#                         행위: 사고 DB 요약에 있는 사실만(괄호 안은 근거 사고 ID), 탐지: 그 단계의 탐지·차단 포인트 }
#       chokepoints = '세부위협 ID — 끊는 통제' (가장 싸고 효과가 큰 차단 지점)
# 여러 사고를 한 흐름으로 이은 시나리오는 단계마다 근거 사고를 괄호로 표시함. 실행 방법이 아니라 식별·탐지·차단 지점을 적음
# 검증: scripts/validate.py가 PHT·사고·ATT&CK ID 존재, 공격 단계 어휘, 단계에 쓴 사고 ID ⊂ incidents, 사고-단계 매핑 교차, 초크 포인트-단계 일치를 점검

scenarios:
  - id: PSN-01
    title: 핵심 인력 영입 → 퇴직 직전 반출 → 해외 업체의 D램 공정 재현
    incidents: [PHI-017, PHI-026, PHI-025, PHI-016]
    summary: 해외 D램 업체가 국내 반도체 기업 출신을 영입하고, 옮겨 가는 인력이 출력·필기·촬영으로 공정 자료를 가져가 신생 업체가 공정을 재현한 흐름. 국내 기술유출 사건에서 반복되는 경로이며, 이직 자체는 막을 수 없어 퇴직 의사 표명부터 퇴직까지의 자료 접근 관리가 가장 싼 차단 지점이다.
    steps:
      - { pht: [PHT-HU-02], 단계: 내부자화, 행위: "해외 D램 업체 설립에 고문으로 참여한 엔지니어 출신이 국내에 헤드헌팅 업체를 차리고 기존 연봉의 2~3배를 약속하며 핵심 인력을 끌어들임(PHI-017), 해외 D램 업체가 국내 기업 부장 출신을 개발실장으로 영입(PHI-026)", 탐지: "같은 부서 인력의 연쇄 이직과 미등록 알선 업체·위장 법인의 접근을 인사·보안이 함께 파악하고 수사기관과 공유" }
      - { pht: [PHT-IN-03.1, PHT-EX-02], 단계: 반출, 행위: "연구원 출신이 공정 레시피 정보를 손으로 옮겨 적은 뒤 이직(PHI-026), 다른 반도체 기업 직원은 퇴사 전 공정 문서 약 4,000쪽을 여러 차례 출력하고 자료 170개를 태블릿으로 촬영해 반출(PHI-025)", 탐지: "퇴직 의사를 밝힌 인력의 출력·열람·촬영 증가를 이전 기준선과 비교해 경보, 출입구 출력물 반출 확인" }
      - { pht: [PHT-IN-03.2], 단계: 영향, 행위: "약 30년 일한 전 임원과 수석연구원이 넘긴 20나노 D램 공정 기술로 해외 신생 업체가 공장 준공 1년 3개월 만에 시범 웨이퍼 생산에 성공(PHI-016)", 탐지: "퇴직자가 옮긴 회사의 제품·특허·채용 동향을 살피고, 퇴직 전후 접근·반납 기록을 증거로 보존" }
      - { pht: [PHT-IM-01], 단계: 영향, 행위: "경찰은 20나노 공정 기술의 경제적 가치를 4조 3천억 원으로 추산(PHI-016), 검찰은 10나노급 공정 유출 피해액을 최소 수십조 원으로 추산하고 10명을 기소(PHI-026)", 탐지: "유출 의심 시 증거 보전·수사기관 신고와 국가핵심기술 유출 신고 의무 이행" }
    chokepoints:
      - PHT-IN-03.1 — 퇴직 의사 표명 시점부터 열람·출력·촬영을 집중 점검하고, 퇴직 때 접근 즉시 회수·자료 반납 확인·비밀유지 의무 재고지
      - PHT-EX-02 — 기밀 문서 인증 출력과 출력 기록, 보안 구역의 필기·촬영 제한으로 디지털 반출 통제 밖의 경로를 막음
      - PHT-HU-02 — 핵심 인력 처우·경력 관리와 미등록 알선·위장 법인 정보 공유로 집단 이직을 일찍 파악

  - id: PSN-02
    title: 위장 접근·금전 포섭 → 몰래 촬영·자료 전달 → 군사·국가 기밀 유출
    incidents: [PHI-010, PHI-008, PHI-009, PHI-007]
    summary: 업무용 SNS 위장 접근이나 메신저로 시작해 돈·가상화폐로 군·정보기관 인력을 포섭하고, 포섭된 내부자가 촬영 장비·사진·문서로 기밀을 넘긴 흐름. 포섭된 뒤에는 정상 권한으로 움직여 막기 어렵기 때문에 접근 신고와 촬영 기기 반입 통제가 차단 지점이다.
    steps:
      - { pht: [PHT-RC-03.1], 단계: 정찰, 행위: "싱크탱크 소속이라는 헤드헌터가 업무용 SNS 메시지로 빚을 진 전직 정보기관 요원에게 접근(PHI-010)", 탐지: "업무 관련 외부 접근(채용·자문·유료 보고서 요청)을 보안 부서에 알리는 신고 경로, 위장 프로필 식별 교육" }
      - { pht: [PHT-HU-01.1, PHT-HU-01.2], 단계: 내부자화, 행위: "거래소 운영자가 외국 공작원 지령을 받고 메신저로 현역 대위에게 접근해 4,800만 원 상당의 비트코인으로 포섭(PHI-008), 해외 공항에서 체포·조사받던 군무원이 포섭 제의를 받은 뒤 약 40차례 돈을 요구해 받음(PHI-009)", 탐지: "금전 제안·포섭 접근 신고와 해외 체류 중 체포·조사 같은 사건의 귀국 보고, 신고자 보호" }
      - { pht: [PHT-SV-02.2, PHT-EX-03], 단계: 반출, 행위: "포섭된 대위가 시계형 몰래카메라를 군부대에 반입(PHI-008), 수병이 외국 정보요원의 요청에 따라 함정 사진·영상과 기술 매뉴얼을 넘김(PHI-007)", 탐지: "보안 구역 출입 때 촬영 기능 소지품 확인, 구역 안 감시 영상으로 화면·문서를 향한 촬영 동작 확인" }
      - { pht: [PHT-IN-02.1], 단계: 반출, 행위: "군무원이 신분을 숨긴 요원 명단 등 군사기밀을 문서 12건·음성 메시지 18건으로 넘김(PHI-009), 다른 수병은 기지 레이더 설계도와 훈련 작전계획을 보냄(PHI-007), 전직 요원은 기밀 문서를 SD 카드로 스캔하려다 매장 감시카메라에 찍힘(PHI-010)", 탐지: "직무와 맞지 않는 기밀 열람·복사를 내부자 위험 관리 체계에서 객관적 행동 신호로 점검" }
      - { pht: [PHT-IM-01], 단계: 영향, 행위: "군무원은 징역 20년 확정(PHI-009), 수병 2명은 같은 날 체포(PHI-007)", 탐지: "유출 확인 시 노출된 인원·작전의 영향 평가와 보호 조치" }
    chokepoints:
      - PHT-HU-01.1 — 포섭 접근의 단계(관계 형성 → 소액 대가 → 자료 요구)를 교육하고, 금전 제안을 받은 사람이 부담 없이 알릴 수 있는 신고 경로와 신고자 보호
      - PHT-RC-03.1 — 업무용 SNS 위장 접근을 개인이 혼자 판단하지 않고 보안 부서에 알리는 구조
      - PHT-SV-02.2 — 보안 구역에 촬영 기능 기기 전체의 반입을 제한하고 출입 때 확인

  - id: PSN-03
    title: 도용 신원 원격 채용 → 랩톱 팜 원격 조작 → 내부 접근·수익 해외 유출
    incidents: [PHI-004, PHI-005, PHI-002, PHI-001, PHI-003]
    ref: 아이덴티티 IDT-LC-03(위장 취업) · IDT-SE-04(딥페이크 사칭)
    summary: 도용·위조 신원과 딥페이크 면접으로 원격 IT 직무에 채용된 뒤, 현지 조력자가 지급 노트북을 모아 원격 조작하게 해 현지 근무처럼 꾸미고 급여를 해외로 빼돌린 흐름. 채용 단계의 신원 증명과 지급 장비 배송·원격 접속 확인이 가장 싼 차단 지점이다.
    steps:
      - { pht: [PHT-IN-01.1], 단계: 내부자화, 행위: "딥페이크 영상과 도용한 개인정보로 원격 IT 직무에 지원하는 사례 증가 경보(PHI-004), 도용한 신원으로 채용 절차를 통과한 인력이 사내 엔지니어로 채용(PHI-002), 국내에서도 국적·신분 위장 IT 인력의 일감 수주에 대비한 정부 합동주의보(PHI-005)", 탐지: "영상 면접의 얼굴·음성과 신원 서류 대조, 신원 조회 결과·연락처·주소·급여 계좌의 일치 재확인" }
      - { pht: [PHT-IN-01.2], 단계: 지속, 행위: "현지 조력자가 피해 기업이 보낸 노트북을 자택에 모아 둔 '랩톱 팜'을 운영해 현지에서 일하는 것처럼 속임(PHI-001), 조력자들이 위장 회사·웹사이트를 만들고 지급 노트북을 모아 원격 접속하게 함(PHI-003)", 탐지: "지급 장비 배송지를 인사 기록 주소와 대조, 한 주소로 여러 장비가 가거나 승인되지 않은 원격 접속 도구가 설치되면 경보" }
      - { pht: [PHT-IN-01.1], 단계: 실행, 행위: "회사가 보낸 노트북에 악성코드가 올라오자 보안관제팀이 이상 행위를 탐지해 약 25분 만에 차단(PHI-002)", 탐지: "신규 입사자 지급 장비의 악성코드·원격 제어 도구 설치를 엔드포인트 감시로 즉시 차단" }
      - { pht: [PHT-IM-05], 단계: 영향, 행위: "309개 기업에 취업한 위장 인력의 수익 1,700만 달러 이상이 조력자와 해외로 돌아감(PHI-001), 16개 주의 랩톱 팜 29곳에서 컴퓨터 약 200대가 압수됨(PHI-003)", 탐지: "급여 계좌 변경·해외 송금 정황과 계약 상대 신원을 재점검, 정부 주의보의 위장 인력 특징과 대조" }
    chokepoints:
      - PHT-IN-01.1 — 원격 채용에도 대면 또는 그에 준하는 신원 증명 단계를 두고, 프리랜서·외주 계약 상대도 같은 기준으로 확인
      - PHT-IN-01.2 — 지급 장비는 본인 확인 뒤 수령하게 하고 배송지·원격 접속 도구를 통제

  - id: PSN-04
    title: 위장 출입·우편 USB → 사내 단자·단말에 장치 연결 → 내부망 원격 접속·자금 탈취
    incidents: [PHI-045, PHI-046]
    ref: ATT&CK G0105 · G0046
    summary: 택배원·구직자로 위장해 들어가거나 사칭 우편으로 악성 USB 장치를 보내 사내 단자·단말에 장치를 연결하고, 장치의 별도 통신 경로로 내부망에 원격 접속한 흐름. 방문자 통제와 네트워크 단자·USB 장치 통제 두 지점에서 끊을 수 있다.
    steps:
      - { pht: [PHT-PA-02], 단계: 접근, 행위: "공격자들이 택배원·구직자 등으로 위장해 은행 건물에 들어감(PHI-045, ATT&CK G0105)", 탐지: "방문 예약·담당자 확인 결과와 실제 방문 대조, 지정 구역 이탈·동행 없는 이동 경보" }
      - { pht: [PHT-PA-03.2], 단계: 접근, 행위: "운송·보험·방산 기업에 대형 유통사·정부 부처를 사칭한 우편물과 함께 악성 USB 장치를 보냄(PHI-046, ATT&CK G0046)", 탐지: "우편물 수발 단계에서 요청하지 않은 저장장치·전자기기 동봉 확인 후 보안 부서로 넘김" }
      - { pht: [PHT-PA-03.1], 단계: 지속, 행위: "회의실이나 네트워크 단자가 있는 책상에 노트북·소형 컴퓨터를 몰래 연결하고 장치에 달린 이동통신 모뎀으로 내부망에 원격 접속(PHI-045), 우편으로 받은 장치를 꽂으면 키 입력을 흉내 내 악성코드를 내려받아 실행(PHI-046)", 탐지: "새로 붙은 장치를 자산 목록과 자동 대조해 미등록 장치 경보, 키보드로 인식된 장치의 연결 직후 명령 실행 경보" }
      - { pht: [PHT-IM-05], 단계: 영향, 행위: "내부망에서 자금·자료를 빼내 동유럽 은행 최소 8곳에서 수천만 달러 손실 추정(PHI-045)", 탐지: "단자 연결 장치·외부 무선 신호 정기 점검과 이상 거래·접속 상관 분석" }
    chokepoints:
      - PHT-PA-02 — 방문자 사전 예약·신원 확인·담당자 동행과 접견구역·업무 공간 분리
      - PHT-PA-03.1 — 네트워크 단자는 장치 인증을 거쳐야 열리게 하고 외부인 공간의 단자는 비활성화
      - PHT-PA-03.2 — 승인된 USB 장치만 허용하고 출처 모르는 장치는 연결하지 않고 신고

  - id: PSN-05
    title: 메신저 대리인 모집 → 수송로 정찰·은닉 카메라 → 창고 방화·사보타주
    incidents: [PHI-015, PHI-014, PHI-070]
    summary: 외국 정보기관·용병 조직이 메신저로 현지인을 일회성 대리인으로 모아 수송로·군 시설을 정찰하고 은닉 카메라를 설치한 뒤 창고 방화로 이어진 흐름. 대리인은 정찰 단계에서 드러나는 경우가 많아 시설 주변 정찰 탐지와 관계 기관 공유가 차단 지점이다.
    steps:
      - { pht: [PHT-HU-01.3], 단계: 접근, 행위: "외국 용병 조직과 메신저로 접촉한 사람이 일당을 모음(PHI-015), 구성원이 메신저로 지시를 받고 카메라 설치 300~400달러 등의 가상화폐 보수를 받음(PHI-014)", 탐지: "시설 촬영·장치 설치를 대가로 한 구인 글 신고 안내와 정부·업계 경보 공유" }
      - { pht: [PHT-RC-02], 단계: 정찰, 행위: "정보요원과 접촉한 거주자가 군 훈련장과 지원 물자 수송로를 감시해 사진·영상을 넘기고 공격할 군 시설을 제안(PHI-070), 방화 일당은 다른 업체 두 곳의 정찰도 조직(PHI-015)", 탐지: "시설·수송로 주변의 반복 촬영·배회를 경비·직원이 보고하고 같은 기간의 다른 신고와 묶어 판단" }
      - { pht: [PHT-SV-02.1], 단계: 실행, 행위: "지원 물자 수송 철도 구간과 공항 인근에 은닉 카메라를 설치해 열차 이동을 촬영·전송(PHI-014)", 탐지: "수송 경로·시설 주변에 새로 생긴 장치를 순찰로 확인하고, 발견 시 현장 보존·신고" }
      - { pht: [PHT-IM-02], 단계: 영향, 행위: "지원 물자 창고에 불을 질러 약 100만 파운드 피해를 냄(PHI-015), 철도 스파이망은 사보타주도 준비하다 적발되어 14명 유죄(PHI-014)", 탐지: "핵심 시설·창고의 침입·화재 감지와 사고 대응 체계의 수사기관 즉시 보고" }
    chokepoints:
      - PHT-RC-02 — 시설·수송로 주변 반복 촬영·배회 보고 체계와 관계 기관 공유로 정찰 단계에서 끊음
      - PHT-SV-02.1 — 수송 경로·시설 주변 새 장치 순찰 점검과 발견 시 현장 보존·신고
      - PHT-HU-01.3 — 대리인 모집 경보를 위협 인텔리전스로 받아 시설 경비에 공유

  - id: PSN-06
    title: 드론 무단 촬영·반복 출현 → 공항 운영 중단·항공기 충돌
    incidents: [PHI-049, PHI-053, PHI-054, PHI-055, PHI-061]
    summary: 시판 드론의 시설 촬영과 통제 공역 반복 출현이 공항 운영 중단과 항공기 충돌로 이어진 흐름(여러 사고를 단계별로 이음). 조종자·기체를 특정하지 못한 사례가 대부분이라, 탐지·식별 수단과 중단·재개 기준을 미리 갖추는 것이 피해를 줄이는 지점이다 — 기체 무력화·전파 교란은 법적 권한이 있는 기관의 영역.
    steps:
      - { pht: [PHT-SV-01.1], 단계: 정찰, 행위: "유학생들이 해군기지 일대에서 드론을 띄워 기지 내부와 정박한 항공모함을 촬영해 사진 약 170장·영상 22개를 남김(PHI-049)", 탐지: "상공에서 보이는 자산과 접근 방향을 위험평가로 정하고, 승인된 탐지 장비·감시 인력으로 탐지·식별해 신고" }
      - { pht: [PHT-SV-01.2], 단계: 접근, 행위: "공항 활주로 인근에 드론이 반복 목격되고 목격 신고 67건이 확인됨(PHI-053), 공항 인근에 대형 드론 2~3대가 나타남(PHI-054)", 탐지: "목격 신고를 시각·방향·기체 특징으로 기록해 신뢰도를 판단하고 인근 시설·관계 기관과 공유" }
      - { pht: [PHT-IM-03], 단계: 영향, 행위: "유일한 활주로를 약 36시간 닫아 항공편 1,000편·승객 14만 명이 영향을 받음(PHI-053), 약 35편이 회항하고 인접국 공항도 닫힘(PHI-054), 이틀 연속 목격으로 약 7시간 운항이 중단되고 다음 날 밤에도 활주로가 닫힘(PHI-055)", 탐지: "중단·재개 판단 기준과 대체 운영 절차에 따라 영향 범위를 관리하고 사건마다 대응 시간을 기록" }
      - { pht: [PHT-IM-04], 단계: 영향, 행위: "산불 진화 비행 제한 구역의 민간 드론이 물을 뿌리던 소방 항공기와 충돌해 날개에 구멍을 냄(PHI-061)", 탐지: "근접 비행·충돌 같은 준사고를 기록해 위험 구역·시간대를 파악하고 비상 대응 체계로 연결" }
    chokepoints:
      - PHT-SV-01.2 — 승인된 탐지 장비·감시 인력과 목격 신고 신뢰도 판단 기준으로 반복 출현을 빨리 식별하고, 조종자 확인·대응은 항공 당국·경찰·군에 맡김
      - PHT-IM-03 — 운항 중단·재개 기준과 관계 기관 연락 체계를 사업 연속성 계획에 넣어 훈련
      - PHT-SV-01.1 — 상공에서 보이는 옥외 자산을 가리고 무단 촬영은 기록·신고로 법적 처리

  - id: PSN-07
    title: 협력사·장비 업체 경로 — 현장 자료·촬영 → 위장 법인 → 해외 장비·공정 재현
    incidents: [PHI-031, PHI-079, PHI-032, PHI-030]
    summary: 원청과 협업하는 협력사·장비 업체 인력이 현장에서 알게 된 레시피·공정 자료를 가져가거나 현직자에게서 촬영본을 받아, 위장 법인·해외 연구소를 거쳐 장비·공정을 재현한 흐름. 협력 인력의 접근 범위와 협력사 계약의 재제공·반출 제한이 차단 지점이다.
    steps:
      - { pht: [PHT-IN-04], 단계: 반출, 행위: "협력업체 임직원들이 협업하며 알게 된 세정 레시피와 공정 기술을 해외 경쟁 업체로 넘김(PHI-031)", 탐지: "협력 인력의 자료 접근·출력·저장장치 사용을 계약 업무 범위와 비교해 경보" }
      - { pht: [PHT-EX-03, PHT-IN-02.1], 단계: 반출, 행위: "장비 협력사로 옮긴 전 엔지니어가 현직 엔지니어들에게 2나노 공정 정보를 요청했고 자료가 촬영·복제되어 넘어감(PHI-079)", 탐지: "보안 구역 촬영 제한과 화면 워터마크, 전 동료의 자료 요청을 신고하게 하는 경로" }
      - { pht: [PHT-HU-05.2], 단계: 반출, 행위: "디스플레이 장비 협력사가 설비 사양서·패널 도면을 해외 수출용으로 세운 위장 회사로 넘겨 약 155억 원의 이득을 얻음(PHI-032)", 탐지: "협력사가 받은 자료의 재제공·해외 반출 여부를 계약 이행 점검으로 확인하고 거래 상대 실소유 확인" }
      - { pht: [PHT-IN-03.2], 단계: 영향, 행위: "장비 자회사 퇴직 연구원들이 세정장비 제조 기술을 빼내 해외 연구소에서 총 800억 원을 받고 장비를 만들어 넘김(PHI-030)", 탐지: "퇴직자·협력사가 관여한 해외 장비·제품 동향을 살피고 퇴직 전후 기록을 증거로 보존" }
      - { pht: [PHT-IM-01], 단계: 영향, 행위: "전 엔지니어 징역 10년과 장비 협력사 법인 벌금 선고(PHI-079), 협력사 임원 실형과 법인 벌금 10억 원 확정(PHI-031)", 탐지: "유출 의심 시 증거 보전·수사기관 신고와 피해 범위 조사" }
    chokepoints:
      - PHT-IN-04 — 협력 인력의 접근 구역·자료를 업무 단위로 나누고 반출입 검사에 예외를 두지 않으며, 계약 종료 때 자료 회수 확인
      - PHT-HU-05.2 — 협력사 계약에 비밀유지·재제공 금지·해외 반출 제한을 넣고 이행을 점검
      - PHT-EX-03 — 보안 구역 촬영 제한과 화면 워터마크로 촬영본의 출처를 추적

  - id: PSN-08
    title: 승진 탈락·해고 통보 뒤 내부자 행동 → 공정 자료 촬영 유출·설비 파손
    incidents: [PHI-028, PHI-100, PHI-099]
    summary: 승진 탈락·해고 통보 같은 인사상 사건 뒤에 재직자가 해외 업체와 손잡고 공정 자료를 촬영해 넘기거나, 시스템 코드 변경·설비 파손으로 이어진 흐름. 객관적 직무 사실인 고위험 인사 사건을 보안 부서와 공유해 접근을 조정하는 것이 가장 싼 차단 지점이다(보호 특성은 쓰지 않음).
    steps:
      - { pht: [PHT-HU-05.2], 단계: 내부자화, 행위: "임원 승진에서 탈락한 연구원이 해외 업체와 연마제 제조 동업을 약정(PHI-028)", 탐지: "겸직·외부 사업 참여 신고 규정과 인사 사건 뒤 직무와 맞지 않는 자료 접근 점검" }
      - { pht: [PHT-EX-03, PHT-IN-02.1], 단계: 반출, 행위: "업무용 PC·휴대전화로 회사 내부망의 웨이퍼 연마 공정도 등을 휴대전화로 촬영해 넘김(PHI-028)", 탐지: "보안 구역 촬영 제한과 민감 자료 열람 경보" }
      - { pht: [PHT-IN-02.2], 단계: 실행, 행위: "승진 탈락 직원이 가짜 사용자 이름으로 제조 운영 시스템 코드를 바꾸고 자료를 외부로 대량 전송했다고 회사가 밝힘 — 당사자는 내부 고발이라고 주장(PHI-100), 해고 통보를 받은 직원이 지게차로 생산 설비를 부수고 망치로 컴퓨터 장비를 파손(PHI-099)", 탐지: "제어 코드 변경을 승인 기록과 대조하고, 해고 통보 전후 출입·시스템 접근을 즉시 조정" }
      - { pht: [PHT-IM-02], 단계: 영향, 행위: "공장 설비 파손으로 50만 달러 이상의 피해(PHI-099)", 탐지: "핵심 설비 주변 감시와 조작 기록, 손상 시 복구 계획" }
    chokepoints:
      - PHT-IN-02.2 — 해고·징계·승진 탈락 같은 고위험 인사 사건을 보안 부서와 공유해 통보 전후 접근을 조정하고, 설비 조작·코드 변경은 2인 승인
      - PHT-IN-02.1 — 직무 기반 최소 권한과 대량 열람 경보, 객관적 행동 신호만 쓰는 내부자 위험 관리
      - PHT-EX-03 — 보안 구역 촬영 제한과 출입 서약
