# CERT Common Sense Guide 7판 실천과제(번호·제목)
cert:
  1: [Know and Protect Your Critical Assets, 핵심 자산 식별·보호]
  2: [Develop a Formalized Insider Risk Management Program, 공식 내부자 위험 관리 프로그램 수립]
  3: [Clearly Document and Consistently Enforce Administrative Controls, 관리 통제의 명확한 문서화·일관된 집행]
  4: [Beginning With the Hiring Process, Monitor and Respond to Suspicious or Disruptive Behavior, 채용 단계부터 의심·문제 행동 감시·대응]
  5: [Anticipate and Manage Negative Issues in the Work Environment, 업무 환경의 부정적 문제 예측·관리]
  6: [Consider Threats From Insiders and Trusted External Entities in Enterprise-Wide Risk Assessments, 전사 위험평가에 내부자·신뢰 외부 주체 위협 반영]
  7: [Be Especially Vigilant Regarding Social Media, 소셜 미디어 각별 주의]
  8: [Structure Management and Tasks to Minimize Insider Stress and Mistakes, 내부자 스트레스·실수를 줄이는 관리·업무 구조]
  9: [Incorporate Insider Threat Awareness Into Periodic Security Training for All Workforce Members, 전 인력 정기 보안교육에 내부자 위협 인식 포함]
  10: [Implement Strict Password and Account Management Policies and Practices, 엄격한 비밀번호·계정 관리]
  11: [Institute Stringent Access Controls and Monitoring Policies on Privileged Users, 특권 사용자 접근 통제·모니터링]
  12: [Deploy Solutions for Monitoring Workforce Member Actions and Correlating Information from Multiple Data Sources, 인력 행위 모니터링·다중 데이터 상관 분석]
  13: [Monitor and Control Remote Access from All Endpoints, Including Mobile Devices, 모바일 포함 전 단말 원격 접속 감시·통제]
  14: [Establish a Baseline of Normal Behavior for Both Networks and Workforce Members, 네트워크·인력의 정상 행위 기준선 수립]
  15: [Enforce Separation of Duties and Least Privilege, 직무 분리·최소 권한]
  16: [Define Explicit Security Agreements for Cloud Services, Especially Access Restrictions and Monitoring Capabilities, 클라우드 서비스 보안 계약 명시]
  17: [Institutionalize System Change Controls, 시스템 변경 통제 제도화]
  18: [Implement Secure Backup and Recovery Processes, 안전한 백업·복구]
  19: [Mitigate Unauthorized Data Exfiltration, 무단 자료 반출 완화]
  20: [Develop a Comprehensive Workforce Member Termination Procedure, 포괄적 퇴직 절차 수립]
  21: [Adopt Positive Incentives to Align the Workforce With the Organization, 긍정적 유인으로 인력과 조직 정렬]
  22: [Learn From Past Insider Threat Incidents, 과거 내부자 사건에서 학습]

