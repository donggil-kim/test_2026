# 교차 매핑·대응 기준·참고 문헌 카탈로그 — ID·명칭만 수록(원문 미수록)
#
# 역할(작업방향 6장)
#   ② 교차 매핑  : MITRE ATT&CK v19.2(물리 접점) · MITRE CTID 내부자 TTP 지식베이스(ITKB) · 다른 매트릭스 ID
#   ③ 대응 기준  : NIST SP 800-53 Rev.5 · ISO/IEC 27001:2022 부속서 A 5~7 · ISMS-P 2.2~2.4(+관련 항목) · CERT 내부자 가이드 7판 실천과제
#   ⑤ 참고 문헌  : NPSA 지침 · CISA 지침 · ISO 22341 등 — ID 열 없이 '참고 문헌' 열(refs)과 문구의 '참고:' 인용으로만 사용
# 각 항목은 [영문 공식 명칭, 국문 번역 명칭](ISMS-P는 [국문 명칭]). 설명 원문은 싣지 않으며 세부위협 문구는 분석가가 새로 작성한다.
# NIST SP 800-53 명칭은 reference/nist/ 추출본, ATT&CK·ITKB는 reference/attack/·reference/itkb/ 추출본에서 읽는다.
