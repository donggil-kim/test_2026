# 공격 단계(행 stage·시나리오 단계 어휘) — 작업방향 3장
stages:
  정찰: 표적 조직·인력·시설 정보를 모음
  접근: 시설·사람·조직에 다가가거나 들어감(물리 접근·접촉·포섭 시도)
  실행: 수집·설치·조작 등 목적 행위를 수행(촬영·도청·장치 설치·사보타주)
  지속: 접근·수집 수단을 유지(상주 장치·반복 접근)
  내부자화: 내부 신분을 얻거나 내부자를 포섭(위장취업·매수 성공)
  반출: 정보·자산이 조직 밖으로 나감
  영향: 피해가 발생함(기술 유출·운영 중단·안전 위협·금전·법적 피해)

# 위협 주체 유형 — CISA 내부자 유형(비의도·의도·공모·제3자) + 외부자(작업방향 5.4)
actor_types:
  외부자: 조직에 승인된 접근이 없는 행위자(경쟁사·국가배후 조직·범죄자·브로커)
  내부자(악의): 승인된 접근을 가졌거나 가졌던 사람이 의도적으로 피해를 일으킴(재직자·퇴직자)
  내부자(비의도): 부주의·실수·분실로 피해를 일으킨 내부자
  공모: 내부자와 외부자가 함께 행동(매수된 내부자·대리 수령자 등)
  제3자: 협력사·파견·외주·정비 인력처럼 계약 관계로 접근을 가진 사람

# 적용 프로파일 — 행이 주로 해당하는 조직 유형(작업방향 5.4)
profiles:
  제조·연구: 핵심기술을 보유한 제조기업·기업 연구소
  반도체·방산: 국가핵심기술·방산기술 보유 기업(반도체·디스플레이·이차전지·조선·항공우주·방산)
  기반시설: 에너지·교통·공항·항만·통신 등 국가기반시설·국가중요시설
  공공·연구기관: 정부·군·공공기관·대학·정부출연연구기관
  일반기업: 사무·서비스 중심 일반 조직(원격 근무·외주 개발 포함)

