# 물리·인적 보안위협 매트릭스 — 분류 체계(원천)
#
# 구조: Lv1 도메인(물리·인적 공격면 7개) → Lv2 위협분류(PHT-<도메인>-NN) → Lv3 세부위협(PHT-<도메인>-NN.m)
#       하위 세부위협이 하나뿐인 위협분류는 Lv2 = Lv3 (ID에 '.m' 없음)
# ID는 고정 — 항목을 없애도 번호를 다시 매기거나 재사용하지 않음(폐지 시 retired 표시)
# 경계 규칙(작업방향 5.2, D2): 한 행 = 한 행위. 여러 단계에 걸친 흐름은 행으로 합치지 않고 공격 체인 시나리오(data/scenarios.yaml)로 잇는다.
#   계정·디지털 경로는 원 매트릭스 ID로 연계만 한다(작업방향 4장, D3) — 위장취업의 계정 획득은 IDT-LC-03, 내부자의 메일·클라우드 반출은 IDT-LC-02.1 등.
#   국가배후 여부는 행 속성이 아니라 사고 DB의 actor 필드로만 다룬다(행위자 축과 위협 축을 섞지 않음).
#
# Lv3 필드
#   name / en       세부위협명(국문) / 영문명
#   stage           공격 단계 — frameworks.yaml stages(정찰·접근·실행·지속·내부자화·반출·영향)
#   actors          위협 주체 유형 — frameworks.yaml actor_types(외부자·내부자(악의)·내부자(비의도)·공모·제3자)
#   profiles        적용 프로파일 — frameworks.yaml profiles(제조·연구·반도체·방산·기반시설·공공·연구기관·일반기업)
#   assets          노리는 자산·통제 지점
#   attack          ATT&CK v19.2 기법 ID(물리·인적 접점만). 없으면 attack_none에 미연계 사유(필수)
#                   'ITKB'(내부자 관측 기법) 열은 attack ∩ reference/itkb 추출본으로 자동 산출
#   nist / iso / ismsp / cert   대응 기준(NIST SP 800-53 Rev.5 · ISO/IEC 27001:2022 부속서 A · ISMS-P · CERT 7판 실천과제 번호)
#   idt / sct / ot / cloud / ai  다른 매트릭스 연계 — 아이덴티티 v2(IDT-) · 공급망 v2(SCT-) · OT v5(OTC-)·통합 v2 OT(OT-) ·
#                                통합 v2 클라우드(CL-) · 통합 v2 AI(AI-)
#   refs            참고 문헌 키(frameworks.yaml references) — 워크북 '참고 문헌' 열, 문구 '참고:' 인용(D11·D12)
#   severity        심각도(상·중·하) — 기준은 assessment.severity_rule
#   severity_why    심각도 근거('상'은 피해 범위를 적음)

assessment:
  severity_rule:
    상: 성공하면 국가핵심기술·핵심 영업비밀·국가기밀이 통째로 유출되거나, 시설 안전·인명·핵심 기반시설 운영에 위협이 되거나, 신뢰된 내부 접근이 장기간 유지되어 피해 범위를 가늠하기 어려운 위협
    중: 피해가 개별 자산·단일 구역·단일 조직에 머물거나, 단독 피해는 없고 다른 위협을 키우는 조건(정찰·접근 확보 등)인 위협
    하: 영향이 제한적·일시적이고 복구가 쉬운 위협
  likelihood_rule: 상 = 실제 사고 2건 이상(AI v3.2·클라우드 v5·OT·공급망·아이덴티티 매트릭스와 같은 수식), 중 = 실제 사고 1건 또는 ATT&CK 물리·인적 맥락 사례·ITKB 내부자 관측 기법·정부 경보·위협인텔·실증 중 하나 이상, 하 = 근거 없음
  severity_check: "'상' 판정은 피해 범위(핵심기술 통째 유출·기반시설 운영·안전·장기 잠복)를 severity_why에 적은 경우에만 — 위험도 포화(공급망 60개 중 38개 매우 높음)를 피하기 위한 기준"

