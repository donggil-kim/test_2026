# [HU] 인적 포섭·사회공학 — 물리 관점 문구
# 작성 규칙: oneline 50자 이내 명사형 · summary 2줄(① 공격자는 … 수 있음 ② 피해·탐지 곤란 사유) ·
#           reference(■ 물리 관점 / ■ 실제 사례) · detect(■ 탐지 / ■ 대응). 사례는 그 행에 매핑된 사고만, 수치는 사고 DB 요약에 있는 것만.
#           포섭 단계는 식별 수준까지만 적고 실행 방법은 쓰지 않음. 인적 지표는 객관적 행동·직무 사실만(보호 특성 제외).

PHT-HU-01.1:
  oneline: 금전·가상화폐를 대가로 재직자·군 인력을 포섭해 기밀·내부 접근 확보
  summary: |-
    - 공격자는 빚이나 불만이 있는 재직자, 군·정보기관 인력에게 돈·가상화폐를 주고 기밀 문서·사진을 받거나 내부 시스템에 악성코드를 심게 할 수 있음
    - 매수된 내부자는 정상 권한으로 움직여 접근 통제에 걸리지 않고, 대가가 가상화폐로 오가면 자금 추적도 늦음
  reference: |-
    ■ 물리 관점
    - 대상: 보안 인가자·군 인력, 핵심 기술 인력, 고객지원·협력사 인력처럼 내부 시스템 접근을 가진 사람(T1650 접근 권한 획득)
    - 징후(식별 수준): 직무와 무관한 기밀 자료 접근·복사·촬영, 외부인과의 접촉을 숨기는 행동, 금전 제안을 받고도 알리지 않은 사실
    - 통제 원칙: 내부자 위험을 '조직 자원에 접근할 수 있는 사람이 그 접근을 해롭게 쓸 가능성'으로 보고 직무 기반 위험평가·보안 문화·경영진 책임으로 관리
    - 연계: 위장 프로필 접근(PHT-RC-03.1)에서 시작해 재직자 유출(PHT-IN-02.1)·몰래 촬영(PHT-SV-02.2)으로 이어짐 — 아이덴티티 IDT-LC-02.2(외부의 내부자 매수·포섭)
    - 참고: NPSA 〈내부자 위험 정의〉 · NPSA 〈내부자 위험 완화 프레임워크〉
    ■ 실제 사례
    - [실제 사고] 정보사령부 군무원의 신분 위장 요원 정보 유출(2024-07): 해외에서 체포·조사 중 포섭 제의를 받은 군무원이 약 40차례 돈을 요구해 받으며 신분을 숨긴 요원 명단 등 군사기밀을 넘겨 징역 20년 확정 (PHI-009)
    - [실제 사고] 해군 수병 2명의 대가성 군사정보 제공(2023-08): 외국 정보요원과 접촉한 수병들이 대가를 받고 함정 사진·영상, 기술 매뉴얼, 기지 레이더 설계도와 훈련 작전계획을 넘겨 같은 날 체포 (PHI-007)
    - [실제 사고] 현역 장교 가상화폐 포섭(2022-04): 외국 공작원 지령을 받은 거래소 운영자가 메신저로 현역 대위에게 접근해 4,800만 원 상당의 비트코인을 주고 포섭했고, 대위는 몰래카메라를 부대에 반입 (PHI-008)
    - [실제 사고] 공장 직원에게 100만 달러를 제시한 악성코드 설치 포섭 시도(2020-08): 외국인이 공장 직원에게 내부망에 악성코드를 심어 달라며 돈을 제시했으나, 직원이 회사와 수사기관에 알려 체포 (PHI-006)
    - [실제 사고] 거래소 해외 고객지원 인력 매수(2025-05): 범죄자들이 해외 고객지원 인력과 협력사 직원을 매수해 고객 이름·주소·신분증 이미지를 빼냈고, 회사는 갈취 요구를 거부 (PHI-013)
    - [실제 사고] 헤드헌터 접근 뒤 기밀 판매(2017-06): 빚을 진 전직 정보기관 요원이 업무용 SNS로 접근한 헤드헌터를 거쳐 외국 정보요원에게 기밀을 팔았고, 기밀 문서를 SD 카드로 스캔하는 장면이 감시카메라에 찍힘 (PHI-010)
  detect: |-
    ■ 탐지
    - 내부자 위험 관리 체계에서 인사·보안·감사 정보를 묶어 직무와 맞지 않는 자료 접근·촬영·외부 접촉 같은 객관적 행동 신호를 살피고, 출신·종교 등 보호 특성은 쓰지 않음(NIST PM-12, CERT 2·4)
    - 외부에서 금전 제안·포섭 접근을 받은 직원이 부담 없이 알릴 수 있는 신고 경로를 두고 신고자를 보호(ISO 27001 6.8)
    ■ 대응
    - 핵심 자산에 접근하는 직무를 주요 직무자로 지정하고 채용 때와 주기적으로 신원 심사(NIST PS-3, ISO 27001 6.1, ISMS-P 2.2.1)
    - 포섭 접근의 단계(관계 형성 → 소액 대가 → 자료 요구)와 신고 방법을 정기 교육에 포함(NIST AT-2(2), ISO 27001 6.3, ISMS-P 2.2.4, CERT 9)
    - 임직원 모니터링은 개인정보보호법·노사 협의 범위 안에서 목적·대상을 알리고 시행
    - 참고: NPSA 〈내부자 위험 정의〉 · NPSA 〈내부자 위험 완화 프레임워크〉

PHT-HU-01.2:
  oneline: 해외 체류 중 체포·약점·이성 관계를 빌미로 한 공직자·군 인력 포섭
  summary: |-
    - 공격자는 해외 체류 중 체포·조사, 약점 노출, 이성 관계 같은 상황을 만들어 공직자·군 인력·재외 인력을 협박하거나 관계에 기대 포섭할 수 있음
    - 피해자가 처벌·평판을 두려워해 신고를 꺼리므로 발견이 늦고, 관계가 이어지는 동안 내부 자료가 계속 나감
  reference: |-
    ■ 물리 관점
    - 대상: 보안 인가자, 재외공관·해외 사업장 인력, 해외 출장이 잦은 인력
    - 조건: 해외 체류 중 생긴 사건을 알릴 경로 부재, 관계 기반 접근에 대한 교육 부족, 비자 발급 같은 권한을 개인에게 맡긴 관리 구조
    - 통제 원칙: 포섭 시도를 받은 사람이 처벌 걱정 없이 알릴 수 있는 보안 문화가 핵심 — 신고는 피해자 보호로 다룸
    - 연계: 포섭된 뒤 재직자 유출(PHT-IN-02.1)·저장매체 반출(PHT-EX-01)로 이어짐
    - 참고: NPSA 〈내부자 위험 정의〉 · NPSA 〈내부자 위험 완화 프레임워크〉
    ■ 실제 사례
    - [실제 사고] 해외 공항 체포·조사 중 포섭 제의(2024-07): 정보사령부 군무원이 해외에서 체포되어 조사받던 중 포섭 제의를 받았고, 이후 돈을 받으며 군사기밀을 문서 12건·음성 메시지 18건으로 넘겨 징역 20년 확정 (PHI-009)
    - [실제 사고] 재외공관 영사들과 관계를 맺은 여성의 공관 자료·연락처 확보(2011-03): 영사들과 부적절한 관계를 맺고 비자 발급 권한까지 넘겨받은 여성이 공관 자료와 정·관계 인사 약 200명의 연락처를 USB에 담았고, 공관 인력 다수가 징계·교체됨 (PHI-094)
  detect: |-
    ■ 탐지
    - 해외 체류 중 체포·조사·협박·이성 접근을 겪은 인력이 귀국 즉시 보고하는 절차를 두고, 보고 뒤 접근 권한을 함께 점검(ISO 27001 6.8, NIST PM-12)
    - 권한 위임·자료 반출처럼 관계 기반 포섭이 남기는 객관적 업무 흔적을 감사(CERT 4)
    ■ 대응
    - 보안 인가·해외 근무 인력에게 협박·관계 기반 포섭의 단계와 대응 요령을 교육하고, 신고자는 처벌이 아니라 보호 대상임을 명시(NIST AT-2(2), ISO 27001 6.3, ISMS-P 2.2.4, CERT 9)
    - 채무·직장 내 갈등 같은 어려움을 일찍 상담·지원하는 창구를 두어 약점이 포섭으로 이어지지 않게 함(CERT 5)
    - 핵심 직무는 채용 때와 주기적으로 신원 심사(NIST PS-3)
    - 참고: NPSA 〈내부자 위험 정의〉 · NPSA 〈내부자 위험 완화 프레임워크〉

PHT-HU-01.3:
  oneline: 메신저 구인으로 현지인을 일회성 대리인으로 모집해 감시·방화·사보타주
  summary: |-
    - 공격자는 메신저·SNS 구인 글로 돈이 필요한 현지인을 모집해 시설 촬영·카메라 설치·방화 같은 일을 건당 보수로 맡길 수 있음
    - 대리인은 배후를 모른 채 움직여 붙잡혀도 윗선 추적이 어렵고, 평범한 주민이라 정찰 단계에서 의심받지 않음
  reference: |-
    ■ 물리 관점
    - 대상: 철도·물류·창고 시설, 지원 물자 수송로, 군 시설 주변, 돈이 필요한 지역 주민·청년
    - 징후(식별 수준): 시설 주변의 낯선 촬영·장치 설치, 원격 지시를 따르는 듯한 반복 행동, 쉬운 일에 큰 보수를 약속하는 구인 글
    - 통제 원칙: 감시·사보타주 대리인은 정찰 단계에서 드러나는 경우가 많아 시설의 정찰 탐지와 관계 기관 공유가 핵심
    - 연계: 대리인이 하는 현장 답사(PHT-RC-02)·은닉 카메라 설치(PHT-SV-02.1), 결과는 사보타주(PHT-IM-02)
    - 참고: NPSA 〈적대적 정찰〉
    ■ 실제 사례
    - [실제 사고] 메신저로 모집해 가상화폐로 보수를 준 철도 은닉 카메라 스파이망(2023-03): 구성원이 메신저로 지시를 받고 카메라 설치 300~400달러 등의 가상화폐 보수를 받으며 수송 철도를 촬영했고, 사보타주도 준비해 14명 유죄 (PHI-014)
    - [실제 사고] 메신저로 모집한 일당의 지원 물자 창고 방화(2024-03): 외국 용병 조직과 메신저로 접촉한 사람이 일당을 모아 창고에 불을 질러 약 100만 파운드 피해를 냈고, 국가안보법으로 처음 유죄 선고 (PHI-015)
    - [실제 사고] 정보요원과 접촉한 거주자의 수송로 감시·사보타주 준비(2024-04): 외국 정보요원과 접촉한 거주자가 군 훈련장과 지원 물자 수송로를 감시해 사진·영상을 넘기고 방화·폭발물 공격 의사를 밝힘 (PHI-070)
  detect: |-
    ■ 탐지
    - 시설 주변 낯선 촬영·장치 설치·배회를 감시 영상과 순찰로 확인하고, 유사 사건 정보를 업종·관계 기관과 나눠 반복 패턴을 봄(NIST PE-6·PM-16, ISO 27001 7.4)
    - 정부·업계의 대리인 모집 경보를 위협 인텔리전스로 받아 시설 경비에 공유(ISO 27001 5.7)
    ■ 대응
    - 감시·사보타주 징후를 사고 대응 체계에 넣고 발견 시 수사기관에 바로 보고하는 절차를 둠(NIST IR-6, ISMS-P 2.11.1)
    - 임직원·협력사에 시설 촬영·장치 설치를 대가로 한 구인 글을 보면 신고하도록 알림
    - 참고: NPSA 〈적대적 정찰〉

PHT-HU-02:
  oneline: 헤드헌터·제3국 위장 법인을 통한 핵심 엔지니어 집단 영입과 기술 이전
  summary: |-
    - 공격자는 헤드헌팅 업체·제3국 위장 법인·숨은 지분 사무소를 내세워 높은 연봉으로 핵심 엔지니어를 집단 영입하고, 이직 전후에 공정 자료를 함께 가져오게 할 수 있음
    - 이직 자체는 합법이라 막기 어렵고, 기술은 사람의 기억·노하우와 함께 옮겨져 유출 시점·범위를 입증하기 어려움
  reference: |-
    ■ 물리 관점
    - 대상: 공정·설계 핵심 엔지니어와 연구개발 조직, 퇴직 예정 인력
    - 징후(식별 수준): 같은 부서 인력의 연쇄 이직, 숨은 외국 지분 기업·미등록 사무소의 채용, 기존 연봉의 몇 배를 약속하는 알선, 이직 직전 자료 접근 증가
    - 통제 원칙: 이직을 막는 것이 아니라 핵심 인력 관리·처우와 퇴직 절차로 기술이 사람과 함께 나가는 경로를 관리 — 국가핵심기술 보유 기관은 산업기술보호법상 의무와 연계
    - 연계: 퇴직 직전 반출(PHT-IN-03.1)·이직 후 재현(PHT-IN-03.2)으로 이어지고 결과는 기술 유출(PHT-IM-01)
    - 참고: NPSA 〈Secure Innovation〉
    ■ 실제 사례
    - [실제 사고] 10나노급 D램 공정 자료를 손으로 옮겨 적어 이직(2025-12): 외국 D램 업체가 국내 기업 출신을 개발실장으로 영입했고 연구원 출신은 공정 레시피를 자필로 옮겨 적어 이직해, 검찰이 10명을 기소하고 피해액을 최소 수십조 원으로 추산 (PHI-026)
    - [실제 사고] 외국 자본 기업 17곳의 위장 사무소·현지 법인 채용(2026-08): 반도체·AI·배터리·방산 엔지니어를 불법 채용한 혐의로 64곳을 수색하고 114명을 조사했으며, 수사기관은 전담반 구성 이후 이런 사건 100건 이상을 수사 (PHI-081)
    - [실제 사고] 제3국 법인으로 위장한 지사의 기술 인력 불법 채용(2025-03): 외국 파운드리 등 11개 사가 현지 인력을 빼간 혐의로 34곳이 동시 압수수색되고 90명이 조사됨 (PHI-080)
    - [실제 사고] 반도체 인력 해외 알선 헤드헌팅 업체 대표 구속(2024-12): 해외 D램 업체 고문 출신이 헤드헌팅 업체를 차리고 기존 연봉의 2~3배를 약속하며 핵심 인력을 끌어들여, 기술유출 알선업자에게 직업안정법을 처음 적용 (PHI-017)
    - [실제 사고] 20나노 D램 공정 기술의 신생 업체 유출(2024-09): 약 30년 일한 전 임원과 수석연구원이 외국 지방정부 투자로 세운 업체에 공정 기술을 넘겼고, 경찰은 피해 기술 가치를 4조 3천억 원으로 추산 (PHI-016)
    - [실제 사고] 배터리 경쟁사의 대규모 인력 채용과 영업비밀 침해(2021-02): 무역위원회가 경쟁사 패소를 확정해 수입 금지 효력이 생겼고, 양사는 현금·로열티 합계 2조 원 지급에 합의 (PHI-020)
    - [실제 사고] 경쟁사 엔지니어 영입과 문서 반출(2020-02): 외국 업체가 높은 연봉으로 영입한 직원들이 이직 전 문서 7,000건 이상에 접근해 소스코드·기술 문서를 내려받았고, 배심원단이 7억 6,460만 달러 배상을 평결 (PHI-023)
  detect: |-
    ■ 탐지
    - 핵심 인력의 이직 동향과 같은 부서의 연쇄 이직을 인사·보안이 함께 보고, 이직 예정자의 자료 접근량·출력·촬영 증가를 점검(NIST PM-12)
    - 외국 자본 위장 기업·미등록 알선 업체 정보를 수사기관·업계와 공유하고, 임직원이 받은 영입 접근 사례를 신고받음
    ■ 대응
    - 핵심 인력은 처우·경력 관리로 붙잡고, 고용 계약과 비밀유지 서약에 영업비밀 범위·퇴직 후 의무를 명확히 둠(ISO 27001 6.2·6.6, ISMS-P 2.2.3, NIST PS-6, CERT 5·21)
    - 퇴직 때 자료·장비 반납을 확인하고 퇴직 면담에서 비밀유지 의무를 다시 알리며, 퇴직 직전 접근 기록을 점검(NIST PS-4(1), ISO 27001 6.5, ISMS-P 2.2.5, CERT 20)
    - 참고: NPSA 〈Secure Innovation〉

PHT-HU-03:
  oneline: 해외 인재 유치 프로그램·공동연구로 위장해 국가 R&D 성과·연구 데이터 획득
  summary: |-
    - 공격자는 해외 인재 유치 프로그램·겸직 교수직·공동연구를 내세워 연구자에게 연구비·직위를 주고 국가 R&D 성과와 연구 데이터를 넘겨받을 수 있음
    - 정상적인 학술 교류와 겉모습이 같아 구별이 어렵고, 겸직·외부 지원 사실을 숨기면 기관이 이해 상충을 알 수 없음
  reference: |-
    ■ 물리 관점
    - 대상: 국가 R&D 과제 성과, 연구 데이터·시료, 논문·특허 출원 전 자료
    - 조건: 해외 겸직·외부 연구비 신고 제도의 부재나 미이행, 공동연구 계약의 자료 범위 불명확, 연구 데이터 전송 기록 부재
    - 통제 원칙: 국제 협력은 유지하되 협력 상대·자금 출처·자료 범위를 미리 확인하고 기록하는 신뢰 연구 원칙 적용
    - 연계: 강연·학회 초청 질의(PHT-RC-03.2)에서 시작하는 경우가 많고, 결과는 기술 유출(PHT-IM-01)
    - 참고: NPSA 〈Trusted Research〉
    ■ 실제 사례
    - [실제 사고] 해외 인재 유치 프로그램 참여 교수의 자율주행 라이다 연구자료 누설(2023-04): 외국 대학과 고용계약을 맺은 국내 대학 교수가 연구자료 등 72개 파일을 외국 대학 연구원 등에게 넘겼고, 5년간 33억 원을 지원받기로 해 징역형 확정 (PHI-021)
    - [실제 사고] 국립 연구소 선임연구원의 연구 데이터 외국 기업 송부(2023-06): 20년 넘게 일하며 외국 대학 교수를 겸한 연구원이 연구소 메일로 화합물 합성 기술 정보를 외국 화학 기업에 보내 체포·기소 (PHI-082)
    - [실제 사고] 대학 학과장의 인재 유치 프로그램 참여 은폐(2020-01): 정부 연구비를 받은 화학과장이 해외 대학의 '전략 과학자'로 참여한 사실을 정부 조사에서 거짓 진술해 허위 진술 등으로 유죄 (PHI-022)
    - [실제 사고] 대학 강연 초청을 가장한 항공 기술 탈취 시도(2018-10): 정보요원이 위장 회사·대학을 내세워 항공 기업 직원을 강연 명목으로 초청해 정보를 요구했고, 직원의 협조로 체포 (PHI-012)
  detect: |-
    ■ 탐지
    - 연구자의 해외 겸직·외부 연구비·인재 프로그램 참여를 정기 신고받아 과제 참여 정보와 대조하고, 미신고 겸직이 확인되면 접근 자료를 점검(NIST PM-12)
    - 연구 데이터·시료의 외부 전송과 공동연구 상대에게 넘긴 자료를 기록해 계약 범위를 넘는 전달을 찾음
    ■ 대응
    - 공동연구 계약에 자료 범위·지식재산 귀속·제3자 제공 금지를 명시하고 상대 기관·자금 출처를 사전 확인(ISO 27001 5.14·5.32, CERT 6)
    - 연구자 비밀유지 서약과 외부 활동 신고 규정을 두고 위반 시 조치(NIST PS-6, ISO 27001 6.6, ISMS-P 2.2.3)
    - 참고: NPSA 〈Trusted Research〉

PHT-HU-04:
  oneline: 투자자·관계자를 사칭한 대면 면담·방문으로 내부 정보와 협조 획득
  summary: |-
    - 공격자는 투자자·고객·감독기관·본사 관계자를 사칭해 직원을 직접 만나거나 방문해 내부 정보를 캐묻고 출입·자료 제공 같은 협조를 받아 낼 수 있음
    - 대면 신뢰와 예의 때문에 신분 확인을 요구하기 어렵고, 면담이 끝난 뒤에야 사칭이 드러남
  reference: |-
    ■ 물리 관점
    - 대상: 안내·경비·총무 인력, 연구자·실무자, 고객·시설 정보(T1684.001 사칭)
    - 징후(식별 수준): 확인되지 않는 소속·연락처, 면담 목적과 무관한 내부 질문, 녹음이 의심되는 장시간 면담, 급하게 출입·자료를 요구하는 압박
    - 연계: 전화·메신저 사칭은 아이덴티티 IDT-SE-02.1(헬프데스크 사칭 재설정)·IDT-SE-02.2(IT 지원 사칭 원격 지원)에서 평가 — 대면 사칭으로 출입이 열리면 PHT-PA-02
    ■ 실제 사례
    - [실제 사고] 투자자로 위장한 공작원들의 호텔 면담(2019-01): 투자자를 사칭한 남성들이 두 달 새 두 차례 연구원들에게 접근해 호텔 면담에서 몇 시간씩 연구 내용을 캐물었고, 연구소가 언론과 함께 역추적해 공개 (PHI-093)
  detect: |-
    ■ 탐지
    - 외부인 면담·방문 요청은 소속 기관 대표 연락처로 역확인하고, 확인되지 않는 방문은 기록해 보안 부서와 공유(NIST PE-8)
    - 면담에서 받은 질문과 요구 자료를 기록해 목적과 맞지 않는 내부 질의를 식별
    ■ 대응
    - 방문객 신원 확인과 출입 절차를 직위·소속과 관계없이 똑같이 적용(ISO 27001 7.2)
    - 사칭 유형(투자자·감독기관·본사)과 역확인 요령을 정기 교육(NIST AT-2(3), ISO 27001 6.3, ISMS-P 2.2.4, CERT 9)

PHT-HU-05.1:
  oneline: 지분 투자·인수로 얻은 경영권을 이용한 핵심 기술·인력 해외 이전
  summary: |-
    - 공격자는 지분 투자·인수로 경영권이나 이사회 영향력을 얻은 뒤 합법적 지시의 형식으로 핵심 기술 자료와 연구 인력을 해외 본사로 옮길 수 있음
    - 대주주의 정당한 권한처럼 보여 내부 통제가 작동하지 않고, 이전된 기술은 회사가 쇠퇴해도 되돌릴 수 없음
  reference: |-
    ■ 물리 관점
    - 대상: 핵심 공정·제품 기술, 연구 인력, 특허·소스코드
    - 조건: 국가핵심기술 보유 기업의 해외 인수 승인·신고 절차 미준수, 이사회 결의 없는 기술 이전, 대주주 측 파견 인력의 자료 접근
    - 통제 원칙: 투자·인수 단계부터 기술 보호 조건을 계약과 승인 절차에 넣음 — 영국 지침의 투자 심사 제도는 국내에서 산업기술보호법(국가핵심기술 수출·해외 인수합병 승인·신고)으로 바꿔 적용
    - 연계: 합작·거래 상담 자료 요구(PHT-HU-05.2)와 같은 합법 위장형, 결과는 기술 유출(PHT-IM-01)
    - 참고: NPSA 〈Secure Innovation〉
    ■ 실제 사례
    - [실제 사고] 인수한 외국 자동차 기업 요구로 하이브리드 제어 소스코드 제공(2009-11): 연구원들이 대주주 측 부소장의 요구로 이사회 결의 없이 소스코드를 넘겨 기소되었고, 이 기술은 정부가 개발비 절반(56억 원)을 지원한 뒤 국가핵심기술로 지정됨 (PHI-019)
    - [정부 경보] 외국 자본 반도체 기업 경영에 정부 개입(2025-10): 정부가 핵심 기술 지식·역량 상실 우려와 경영상 결함 신호를 이유로 물자확보법을 처음 발동했고, 법원이 외국인 최고경영자의 직무를 정지 (PHI-095)
  detect: |-
    ■ 탐지
    - 지분 변동·이사회 구성 변화와 대주주 측 인력의 자료 접근·반출 요청을 함께 점검해 기술 이전 징후를 찾음
    - 국가핵심기술 해당 여부와 해외 인수·기술 이전 승인·신고 대상인지를 법무·보안 부서가 확인(ISO 27001 5.31)
    ■ 대응
    - 투자·인수 계약에 기술 자료 접근 범위·이전 금지·지식재산 귀속을 명시하고 이행을 감사(ISO 27001 5.32, CERT 6)
    - 기술 이전은 이사회 결의와 법정 승인 절차를 거치도록 내부 규정에 두고, 이를 벗어난 요구는 신고 경로로 보고
    - 참고: NPSA 〈Secure Innovation〉

PHT-HU-05.2:
  oneline: 합작·위탁생산·투자 유치를 내세워 공장 설계·공정 자료를 넘겨받아 복제
  summary: |-
    - 공격자는 합작 투자·위탁생산·장비 수출 상담을 내세워 공장 설계 자료·공정 배치도·장비 사양을 요구하거나, 위장 법인을 거쳐 협력사 자료를 넘겨받을 수 있음
    - 거래 형식이라 자료 제공이 정상 업무로 보이고, 생산 라인 전체를 복제할 수 있는 자료가 한 번에 나감
  reference: |-
    ■ 물리 관점
    - 대상: 공장 기본 설계·공정 배치도, 장비 사양서·도면, 공정 레시피
    - 조건: 거래 상담 단계의 자료 제공 기준 부재, 협력사 계약의 재제공·수출 제한 미비, 위장 법인을 가려낼 거래 상대 확인 부재
    - 통제 원칙: 거래 상대·자금 출처를 확인하고 단계별로 필요한 최소 자료만 넘기며, 국가핵심기술은 수출 승인 대상인지 먼저 확인
    - 연계: 투자·인수 후 이전(PHT-HU-05.1), 브로커 영입(PHT-HU-02), 협력사 인력 반출(PHT-IN-04)
    - 참고: NPSA 〈Secure Innovation〉
    ■ 실제 사례
    - [실제 사고] 공장 설계자료로 해외 '복제 공장' 건설 시도(2023-06): 전 임원이 공장 기본 설계 데이터·공정 배치도·설계도면으로 기존 공장에서 1.5km 떨어진 곳에 복제 공장을 지으려 했고, 약정 투자가 불발되어 공장은 지어지지 않음 (PHI-018)
    - [실제 사고] 장비 협력사의 설비 기술 위장 법인 유출(2018-11): 디스플레이 장비 협력사가 설비 사양서·패널 도면을 해외 수출용으로 세운 위장 회사로 넘겨 약 155억 원의 이득을 얻었고 임원들이 구속 기소 (PHI-032)
    - [실제 사고] 해외 업체와 동업한 연구원의 공정 자료 촬영 유출(2023-01): 승진에서 탈락한 연구원이 해외 업체와 연마제 제조 동업을 약정하고 웨이퍼 연마 공정도 등을 휴대전화로 찍어 넘김 (PHI-028)
