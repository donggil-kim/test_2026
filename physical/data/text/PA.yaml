# [PA] 물리 침입·접근 — 물리 관점 문구
# 작성 규칙: oneline 50자 이내 명사형 · summary 2줄(① 공격자는 … 수 있음 ② 피해·탐지 곤란 사유) ·
#           reference(■ 물리 관점 / ■ 실제 사례) · detect(■ 탐지 / ■ 대응). 사례는 그 행에 매핑된 사고만, 수치는 사고 DB 요약에 있는 것만.
#           방어 자료 — 침입 경로는 통제 지점·징후 수준까지만 적고 우회 방법은 쓰지 않음.

PHT-PA-01.1:
  oneline: 울타리 월담·잠금장치 훼손으로 보호구역·공항 보안구역 무단 진입
  summary: |-
    - 공격자는 울타리·외곽 경계를 넘거나 업무 종료 뒤 비어 있는 출입문의 잠금장치를 훼손해 시설 보호구역·공항 보안구역에 들어올 수 있음
    - 경계가 넓고 야간·무인 시간대가 길어 감지가 늦으며, 진입 뒤 장치 설치·반출·사보타주로 피해가 커짐
  reference: |-
    ■ 물리 관점
    - 대상: 시설 외곽 울타리·경계, 보호구역 출입문, 공항 보안구역·활주로 외곽, 경계가 느슨한 야외 시험장·재배지
    - 조건: 감지 센서·감시 장비가 없는 경계 구간, 업무 종료 뒤 비는 출입 지점, 경보 뒤 대응까지 걸리는 시간, 침투 시험으로 검증하지 않은 경비 절차
    - 연계: 침입 전 현장 답사(PHT-RC-02), 침입 뒤 악성 장치 설치(PHT-PA-03.1)·시제품·시료 반출(PHT-EX-04)
    - 통제 원칙: 경계를 겹겹이 두어(외곽 → 건물 → 보호구역) 층마다 늦추고 알아채며, 감지부터 대응 인력 도착까지 시간을 줄이는 설계
    - 참고: ISO 22341 〈환경설계를 통한 범죄 예방〉 · NPSA 〈적대적 정찰〉
    ■ 실제 사례
    - [실제 사고] 공항 활주로 외곽 울타리 월담 도주(2023-03): 입국이 거부된 외국인들이 새벽에 활주로 외곽 울타리를 넘어 공항 밖으로 달아났고, 한 명은 17시간 만에 검거 (PHI-047)
    - [실제 사고] 공항 면세구역 보안문 강제 개방 밀입국(2016-01): 환승객이 직원 퇴근으로 비어 있던 면세구역·출국심사장 연결문의 잠금장치를 뜯고 나갔고 같은 달 강제 개방이 또 일어나 보안셔터·감지 센서를 설치 (PHI-096)
    - [실제 사고] 대통령 관저 울타리 월담 후 내부 진입(2014-09): 울타리를 넘은 남성이 잔디밭을 가로질러 현관을 지나 내부 행사장까지 들어가 체포되었고, 경호기관이 대응 절차를 검토 (PHI-089)
    - [실제 사고] 시험 재배지에서 비공개 종자 반출(2013-12): 외국 농업 기업 임원 등이 종자 기업의 시험 재배지에서 비공개 옥수수 종자를 몰래 수집했고, 종자 기업 보안 인력이 의심 행동을 발견해 수사가 시작됨 (PHI-042)
  detect: |-
    ■ 탐지
    - 경계 감지 센서·감시 장비로 울타리·출입문 접근을 실시간 경보하고 경보마다 영상으로 확인(NIST PE-6·PE-6(1), ISO 27001 7.4)
    - 업무 종료 뒤 출입문 잠금·개방 상태를 점검하고 출입 기록과 대조해 강제 개방 흔적 확인(ISMS-P 2.4.2)
    ■ 대응
    - 보호구역을 지정하고 외곽·건물·보호구역을 겹겹이 나눠 출입통제를 두며, 무인 시간대 출입 지점은 셔터·센서로 막음(NIST PE-3, ISO 27001 7.1·7.2, ISMS-P 2.4.1)
    - 경보부터 대응 인력 도착까지 목표 시간을 정해 훈련하고, 승인된 정기 물리 침투 시험으로 경계·경비 절차의 빈틈을 찾음(NIST CA-8(3))
    - 참고: ISO 22341 〈환경설계를 통한 범죄 예방〉 · NPSA 〈적대적 정찰〉

PHT-PA-01.2:
  oneline: 출입증 대리 태그·위조·동반 진입으로 통제구역 출입과 출입 기록 조작
  summary: |-
    - 공격자나 내부자는 동료에게 출입증을 대신 찍게 하거나 위조 출입증, 앞사람을 뒤따르는 동반 진입으로 통제구역에 들어가거나 출입 기록을 꾸밀 수 있음
    - 출입 기록이 실제 체류와 달라지면 반출·이탈을 숨기는 알리바이가 되고, 동료 간 호의로 시작되어 위반으로 인식되지 않음
  reference: |-
    ■ 물리 관점
    - 대상: 출입 카드·출입 기록, 통제구역·서버실·연구실, 출입 기록에 기대는 근태·사고 조사 체계
    - 조건: 1인 1출입을 확인하지 않는 출입문, 출입 기록을 단말 접속·근무지 기록과 맞춰 보지 않는 체계, 출입증 대여를 호의로 여기는 문화
    - 연계: 재직자 기밀 유출(PHT-IN-02.1)의 알리바이, 위장 출입(PHT-PA-02) — 내부자 유형에는 부주의(비의도)와 공모가 모두 포함
    - 참고: CISA 〈내부자 위협 완화 지침〉
    ■ 실제 사례
    - [실제 사고] 빅테크 엔지니어의 출입증 대리 태그(2024-03): AI 인프라 기밀 파일 500건 이상을 빼돌린 혐의로 기소된 엔지니어가 해외에 머무는 동안 동료가 그의 출입증을 대신 찍어 사무실에서 일하는 것처럼 꾸밈 (PHI-035)
  detect: |-
    ■ 탐지
    - 출입 기록을 단말 접속 위치·근무지 기록과 대조해 출입했는데 접속이 없거나 같은 시각 해외 접속이 있는 불일치를 찾음(CERT 12)
    - 출입문 감시 영상과 출입 기록을 비교해 한 번 태그에 여러 명이 들어가는 동반 진입을 확인(NIST PE-6, ISO 27001 7.4)
    ■ 대응
    - 통제구역은 1인 1출입 구조와 출입증 사진 확인을 두고, 방문자 출입증은 따로 발급·회수(NIST PE-2·PE-3, ISO 27001 7.2, ISMS-P 2.4.2)
    - 출입증 대여·대리 태그 금지를 규정에 명시하고 위반 시 조치를 일관되게 집행(CERT 3)
    - 참고: CISA 〈내부자 위협 완화 지침〉

PHT-PA-02:
  oneline: 택배원·구직자·행사 참석자 사칭으로 시설에 들어가 내부 공간 접근
  summary: |-
    - 공격자는 택배원·구직자·협력업체 직원·행사 참석자를 사칭해 접견구역을 지나 사무 공간·회의실까지 들어올 수 있음
    - 방문 응대는 친절을 우선해 출입 목적 확인이 생략되기 쉽고, 위장 출입은 장치 설치·정보 수집이 끝난 뒤에야 드러남
  reference: |-
    ■ 물리 관점
    - 대상: 접견구역·회의실·사무 공간, 비어 있는 네트워크 단자, 방문자 동선(T1684.001 사칭)
    - 징후(식별 수준): 예약·담당자 확인이 되지 않는 방문, 설명이 바뀌는 출입 목적, 접견구역을 벗어나려는 시도, 방문 목적과 맞지 않는 다수의 저장장치·단말 소지
    - 연계: 위장 출입 뒤 악성 장치 내부망 연결(PHT-PA-03.1), 대면 사칭으로 정보·협조 획득(PHT-HU-04)
    - 참고: NPSA 〈적대적 정찰〉
    ■ 실제 사례
    - [실제 사고] 택배원·구직자로 위장 출입해 은행 내부망에 장치 연결(2018-12): 동유럽 은행 최소 8곳에서 위장 출입자가 회의실·업무 책상의 네트워크 단자에 원격 접속 장치를 몰래 연결해 자금·자료를 빼냄 (PHI-045, ATT&CK G0105)
    - [실제 사고] 대통령 휴양 클럽에 행사 참석을 사칭해 출입(2019-03): 방문자가 검문소에서 출입 목적을 바꿔 말하며 들어갔고, 휴대폰 여러 대·노트북·외장 하드를 지니고 있어 무단 침입·허위 진술로 유죄 (PHI-044)
  detect: |-
    ■ 탐지
    - 방문 예약·담당자 확인 결과와 실제 방문을 대조하고, 방문자가 지정 구역을 벗어나거나 동행 없이 이동하면 경보(NIST PE-8)
    - 접견구역·회의실의 미사용 네트워크 단자 연결과 새 장치 접속을 점검
    ■ 대응
    - 방문자는 사전 예약·신원 확인·담당자 동행을 원칙으로 하고 방문자 출입증으로 구역을 제한(NIST PE-2·PE-3, ISO 27001 7.2, ISMS-P 2.4.2)
    - 접견구역과 업무 공간을 분리하고 외부인이 머무는 회의실의 단자는 기본 차단(ISO 27001 7.3)
    - 협력업체 작업은 작업 승인·작업자 확인·작업 기록으로 관리(ISMS-P 2.4.5)
    - 참고: NPSA 〈적대적 정찰〉

PHT-PA-03.1:
  oneline: 위장 출입자가 사내 단자에 원격 접속 장치를 몰래 연결해 내부망에 상주
  summary: |-
    - 공격자는 위장 출입 뒤 회의실·업무 책상의 네트워크 단자나 단말에 이동통신 모뎀이 달린 소형 장치를 몰래 연결해 밖에서 내부망에 접속할 수 있음
    - 장치가 경계 방화벽을 거치지 않는 별도 통신 경로를 만들어 네트워크 감시에 잘 걸리지 않고, 물리 접근 한 번이 조직 전체 침해로 커짐
  reference: |-
    ■ 물리 관점
    - 대상: 사내 네트워크 단자, 회의실·로비 단말, 산업 제어망의 임시 접속 지점(T1200 하드웨어 추가 · T1091 이동식 매체 전파)
    - 조건: 인증 없이 열리는 네트워크 단자, 등록되지 않은 장치 접속을 알아채지 못하는 자산 관리, 외부인이 머무는 공간의 단자 개방
    - 연계: 방문객·협력업체 위장 출입(PHT-PA-02) 다음 단계 — OT OTC-IA-04(이동식 매체 전파)·OT-IA-05(이동식 매체·임시 접속 자산 경유 침투)
    - 근거: ATT&CK에 하드웨어 추가·이동식 매체 전파 절차를 쓴 그룹·소프트웨어가 다수 수록되어 있고, 위장 출입과 장치 설치를 함께 쓴 그룹은 G0105
    ■ 실제 사례
    - [실제 사고] 은행 내부망 원격 접속 장치 설치(2018-12): 택배원·구직자로 위장해 들어간 공격자들이 노트북·소형 컴퓨터를 단자에 연결하고 이동통신 모뎀으로 원격 접속해, 동유럽 은행 최소 8곳에서 수천만 달러 손실 추정 (PHI-045, ATT&CK G0105)
  detect: |-
    ■ 탐지
    - 네트워크에 새로 붙은 장치를 자산 목록과 자동 대조해 등록되지 않은 장치 접속을 즉시 경보(NIST CM-8(3))
    - 회의실·로비 단자와 단말 주변을 정기 점검해 낯선 장치·케이블을 찾고, 시설 안에서 나가는 외부 무선 신호를 확인
    ■ 대응
    - 네트워크 단자는 장치 인증을 거쳐야 열리게 하고 외부인 공간의 단자와 쓰지 않는 단말 포트는 비활성화(NIST SC-41, ISO 27001 7.8)
    - 반출입 기기 통제와 보조저장매체 관리로 승인되지 않은 장치의 반입·연결을 막음(NIST PE-3, ISO 27001 7.2, ISMS-P 2.4.6·2.10.7)

PHT-PA-03.2:
  oneline: 감사 편지·사은품으로 위장한 악성 USB 장치를 우편 발송해 업무 PC 감염
  summary: |-
    - 공격자는 공공기관·유명 기업을 사칭한 우편물이나 사은품에 키보드처럼 동작하는 악성 USB 장치를 넣어 보내, 받은 사람이 업무 PC에 꽂게 만들 수 있음
    - 주운 장치를 선의로 연결하는 사람이 많아 교육만으로는 막기 어렵고, 키보드로 인식되는 장치는 일반 저장매체 통제를 비켜 감
  reference: |-
    ■ 물리 관점
    - 대상: 임직원 업무 PC, 우편물·택배 수발 경로, 행사 기념품(T1200 하드웨어 추가 · T1091 이동식 매체 전파)
    - 조건: 승인되지 않은 USB 장치를 막지 않는 단말 설정, 우편물 수발 단계 점검 부재, 출처 모르는 장치를 연결하지 말라는 교육 부족
    - 연계: 위장 출입 장치 설치(PHT-PA-03.1)와 같은 기법을 우편으로 전달 — OT OTC-IA-04(이동식 매체 전파)
    ■ 실제 사례
    - [실제 사고] 감사 편지·가짜 기프트카드와 함께 악성 USB 장치 우편 발송(2022-01): 운송·보험·방산 기업에 대형 유통사·정부 부처를 사칭한 우편물과 함께 장치를 보냈고, 꽂으면 키 입력을 흉내 내 악성코드를 내려받아 실행 (PHI-046, ATT&CK G0046)
    - [실증] 대학 캠퍼스 USB 투하 실험(2016-05): 연구진이 USB 297개를 떨어뜨린 통제 실험에서 공격 성공률이 45~98%로 추정되고 첫 연결까지 6분이 걸리지 않았으며, 연결한 사람 다수는 주인을 찾아 주려는 선의였음 (PHI-091)
  detect: |-
    ■ 탐지
    - 단말에 새로 연결된 USB 장치를 종류(저장매체·키보드 등)별로 기록하고, 키보드로 인식된 장치가 연결 직후 명령을 실행하면 경보
    - 우편물·택배 수발 단계에서 요청하지 않은 저장장치·전자기기 동봉 여부를 확인하고 보안 부서로 넘김
    ■ 대응
    - 승인된 USB 장치만 쓰도록 단말에서 차단하고 보조저장매체를 등록·관리(NIST MP-7·SC-41, ISO 27001 7.10, ISMS-P 2.10.7)
    - 출처 모르는 저장장치·기념품 장치를 연결하지 않고 신고하도록 정기 교육(NIST AT-2, ISO 27001 6.3, ISMS-P 2.2.4, CERT 9)

PHT-PA-04:
  oneline: 출장지 호텔·국경 검문에서 업무 단말 접근·감시 앱 설치·자료 복제
  summary: |-
    - 공격자는 출장자가 묵는 호텔의 네트워크나 객실에 둔 단말, 국경 검문 과정을 이용해 업무 노트북·휴대폰에 악성코드·감시 앱을 심거나 저장 자료를 복제할 수 있음
    - 출장 중에는 조직의 보안 통제 밖에서 단말을 다뤄 이상을 알아채기 어렵고, 감염된 단말이 돌아와 사내 접속 수단이 됨
  reference: |-
    ■ 물리 관점
    - 대상: 출장용 노트북·휴대폰과 저장 자료, 단말에 남은 사내 접속 수단, 호텔·공항 네트워크
    - 조건: 핵심 자료를 모두 담은 평소 단말 지참, 객실 내 단말 방치, 국경 검문처럼 단말을 넘겨야 하는 상황, 출장지 네트워크 직접 접속
    - 연계: 근접 무선 가로채기(PHT-SV-03.1) — ATT&CK은 출장지 물리 접근·국경 검색을 정의하지 않고 호텔 네트워크를 악용한 그룹(G0012)만 수록
    - 통제 원칙: 고위험 지역 출장에는 최소 자료만 담은 출장 전용 단말을 쓰고, 돌아온 뒤 점검·초기화한 다음 사내망에 연결
    - 참고: NPSA 〈Secure Innovation〉
    ■ 실제 사례
    - [실제 사고] 고급 호텔 Wi-Fi로 출장 경영진 선별 감염(2014-11): 최소 4년간 아시아태평양 호텔 네트워크에 침투해 투숙 경영진이 접속하면 정상 업데이트로 위장한 백도어를 설치하게 함 (PHI-085, ATT&CK G0012)
    - [실제 사고] 국경 검문에서 여행자 휴대폰에 감시 앱 설치(2019-07): 육로 국경에서 요원이 외국인 여행자 휴대폰에 감시 앱을 설치해 일정·문자·연락처·통화 기록을 원격 서버로 보낸 사실이 언론 공동 탐사로 드러남 (PHI-084)
  detect: |-
    ■ 탐지
    - 출장에서 돌아온 단말은 사내망에 연결하기 전에 설치 앱·구성 변경·외부 연결 흔적을 점검하고, 출장 기간 접속 기록에서 낯선 위치·시간대의 사내 접속을 확인(CERT 13)
    - 출장 중 단말 분실·검문 제출·객실 방치 같은 사건을 바로 신고받아 관련 계정·접속 수단을 점검
    ■ 대응
    - 고위험 지역 출장에는 최소 자료만 담은 출장 전용 단말을 지급하고 저장 자료를 암호화(NIST AC-19·AC-19(5), ISMS-P 2.10.6)
    - 사외 단말 보관·사용 기준(객실 방치 금지, 공용 네트워크에서는 사내 보안 접속)과 원격 근무지 보안 기준을 둠(NIST PE-17, ISO 27001 6.7·7.9)
    - 참고: NPSA 〈Secure Innovation〉

PHT-PA-05:
  oneline: 배송·설치·정비 과정에서 장비에 문서에 없는 통신 장치 추가·부품 변조
  summary: |-
    - 공격자나 제3자는 장비가 배송·설치·정비되는 과정에서 문서에 없는 통신 모뎀·무선 장치를 붙이거나 부품을 바꿔 원격 접속 경로를 만들 수 있음
    - 도입 장비는 정상 납품물로 믿고 내부 구성을 확인하지 않아, 분해 점검이나 이상 통신 분석이 없으면 드러나지 않음
  reference: |-
    ■ 물리 관점
    - 대상: 도입 장비·설비(항만 크레인·태양광 인버터·배터리 등), 정비 인력의 현장 작업과 원격 정비 경로(T1195.003 하드웨어 공급망 침해)
    - 조건: 납품 장비의 구성품 목록 대조·개봉 검사 부재, 감독 없는 정비 작업, 문서에 없는 통신 기능에 대한 반입 검사 부재
    - 연계: OT OTC-IA-07(공급망 침해)·OTC-IA-08(임시 접속 자산 악용) — 설치 이후 원격 악용은 OT·공급망 매트릭스에서 평가
    ■ 실제 사례
    - [정부 경보] 항만 크레인 부품·서버실의 주문하지 않은 셀룰러 모뎀(2024-02): 의회 위원회가 외국 제조사 크레인 부품과 항만 서버실에서 원격 접속이 가능한 모뎀이 발견됐다며 제조사에 질의했고, 일부 항만은 설치를 요청한 적이 없다고 밝힘 (PHI-086)
    - [위협인텔] 전력망 연결 인버터·배터리의 문서에 없는 통신 장치(2025-05): 전문가들이 분해 점검으로 일부 인버터에서 제품 문서에 없는 통신 장치를, 배터리에서 셀룰러 무선 장치를 발견했다는 보도 (PHI-087)
    - 공개 사고 미확인 — 배송·정비 단계의 장치 추가가 실제 사고로 확인된 공개 사례는 찾지 못함. 제조 과정에서 서버 기판에 칩을 심었다는 보도(2018-10)는 관련 기업·정부가 부인하고 외부 감사에서 발견되지 않아 사고 DB 집계에서 제외
  detect: |-
    ■ 탐지
    - 도입 장비의 구성품을 납품 문서·설계 도면과 대조하고, 문서에 없는 모뎀·무선 모듈 같은 통신 부품을 개봉 검사로 확인(NIST SR-10·SR-11)
    - 설치 뒤 장비가 만드는 통신(셀룰러·무선 포함)을 감시해 설계에 없는 외부 연결을 찾음
    ■ 대응
    - 공급업체 계약에 구성품 공개·변경 통보·검사 협조를 넣고 이행을 점검(ISO 27001 5.19·5.21, ISMS-P 2.3.3, CERT 6)
    - 정비 인력은 사전 승인·신원 확인·작업 감독 아래 작업하고, 정비 도구·부품 반출입을 기록(NIST MA-5·PE-16, ISO 27001 7.13, ISMS-P 2.4.5)
