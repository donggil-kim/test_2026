# [IN] 위장취업·내부자 — 물리 관점 문구
# 작성 규칙: oneline 50자 이내 명사형 · summary 2줄(① 공격자·내부자는 … 수 있음 ② 피해·탐지 곤란 사유) ·
#           reference(■ 물리 관점 / ■ 실제 사례) · detect(■ 탐지 / ■ 대응). 사례는 그 행에 매핑된 사고만, 수치는 사고 DB 요약에 있는 것만.
#           인적 지표는 객관적 행동·직무 사실만 쓰고 출신·종교·성별 등 보호 특성은 쓰지 않음.
#           임직원 모니터링은 개인정보보호법·노사 협의 범위 안에서만 권고.

PHT-IN-01.1:
  oneline: 도용·위조 신원과 딥페이크 면접으로 원격 개발직에 위장취업해 내부 접근
  summary: |-
    - 공격자는 도용·위조한 신원과 딥페이크 면접으로 원격 IT 개발직에 채용되어 정규 직원 권한으로 소스코드·내부 시스템에 접근하고 급여를 빼돌릴 수 있음
    - 채용 뒤에는 정상 직원이라 접근 통제에 걸리지 않고, 한 조직이 여러 기업에 동시에 들어가 갈취·자료 반출로 피해가 번짐
  reference: |-
    ■ 물리 관점
    - 대상: 채용·신원 확인 절차, 원격 개발직의 소스코드 저장소·내부 시스템, 급여 지급 계좌(T1585 계정 생성 · T1078 유효 계정 — ITKB 내부자 관측 기법)
    - 징후(식별 수준): 영상 면접의 입 모양·음성 불일치, 다른 사람의 것으로 확인되는 신원 정보, 이력과 맞지 않는 연락처·주소, 지급 장비 배송지 변경 요청, 원격 접속 도구 설치
    - 통제 원칙: 원격 채용도 대면에 준하는 신원 증명과 결과 재검증을 거치고, 채용 뒤 행위 감시를 내부자 위험 관리에 포함
    - 연계: 장비 대리 수령·랩톱 팜(PHT-IN-01.2)으로 유지 — 계정 쪽 면은 아이덴티티 IDT-LC-03(위장 취업)·IDT-SE-04(딥페이크·AI 음성 사칭)에서 평가
    - 참고: NPSA 〈내부자 위험 정의〉 · NPSA 〈내부자 위험 완화 프레임워크〉
    ■ 실제 사례
    - [실제 사고] 북한 원격 IT 인력 위장취업 조직 일제 단속(2025-06): 도용·위조 신원으로 미국 기업 100곳 이상에 원격 취업한 조직을 기소하고, 16개 주의 랩톱 팜 29곳에서 컴퓨터 약 200대와 위장 웹사이트 21개를 압수 (PHI-003)
    - [실제 사고] '랩톱 팜' 운영자의 위장취업 지원(2024-05): 현지 조력자가 위장 인력이 309개 기업에 원격 직원으로 취업하도록 돕고 지급 노트북을 자택에 모아, 1,700만 달러 이상의 수익이 조력자와 북한으로 돌아감 (PHI-001)
    - [실제 사고] 보안교육 기업의 위장 IT 인력 채용(2024-07): 도용한 신원으로 채용 절차를 통과한 인력이 사내 엔지니어가 되었고, 지급 노트북에 악성코드가 올라오자 보안관제팀이 약 25분 만에 차단 (PHI-002)
    - [정부 경보] 딥페이크·도용 개인정보로 원격 근무직 지원 경고(2022-06): 수사기관이 면접 영상의 입 모양과 음성이 맞지 않는 점, 신원 조회에 낸 정보가 다른 사람 것인 점을 단서로 들며 경고 (PHI-004)
    - [정부 경보] 국적·신분 위장 북한 IT 인력 고용 주의 합동주의보(2022-12): 국내 정부 부처들이 위장 IT 인력의 프리랜서 일감 수주에 대비해 신원 확인 강화를 요청하고, 계약하면 제재받을 수 있다고 경고 (PHI-005)
  detect: |-
    ■ 탐지
    - 채용 단계에서 신원 서류와 영상 면접의 얼굴·음성을 대조하고, 신원 조회 결과·연락처·주소·급여 계좌가 서로 맞는지 다시 확인(NIST IA-12, ISO 27001 6.1)
    - 채용 뒤 지급 장비의 접속 위치·원격 접속 도구 설치·같은 인물의 다수 계정 정황을 감시해 위장 인력 징후를 찾음(NIST PM-12, CERT 4)
    ■ 대응
    - 원격 채용에도 대면 또는 그에 준하는 신원 증명 단계를 두고, 프리랜서·외주 계약 상대도 같은 기준으로 신원 확인(NIST IA-12·PS-3)
    - 채용 때 보안 서약에 신원 정보의 진실성과 위반 시 조치를 명시하고, 정부 주의보의 위장 인력 특징을 채용 담당자 교육에 반영(ISMS-P 2.2.3)
    - 참고: NPSA 〈내부자 위험 정의〉 · NPSA 〈내부자 위험 완화 프레임워크〉

PHT-IN-01.2:
  oneline: 지급 노트북을 조력자가 대신 받아 모아 두고 해외에서 원격 조작(랩톱 팜)
  summary: |-
    - 공격자는 현지 조력자에게 회사 지급 노트북을 대신 받게 하고 한곳에 모아 원격 접속 도구로 해외에서 조작해, 현지에서 근무하는 것처럼 꾸밀 수 있음
    - 장비가 현지 주소·현지 인터넷으로 접속해 위치 기반 통제를 통과하고, 조력자의 집은 평범한 가정집이라 드러나지 않음
  reference: |-
    ■ 물리 관점
    - 대상: 지급 노트북과 배송지, 장비의 원격 접속 도구, 위치 기반 접속 통제(T1219 원격 접속 도구 — ITKB 내부자 관측 기법)
    - 징후(식별 수준): 채용 직후 배송지 변경, 한 주소로 여러 회사 장비 배송, 승인되지 않은 원격 접속 도구 설치, 장비 접속 위치와 근무 형태의 불일치
    - 연계: 도용·위조 신분 위장취업(PHT-IN-01.1)을 유지하는 수단 — 아이덴티티 IDT-LC-03(위장 취업)
    ■ 실제 사례
    - [실제 사고] 조력자 자택의 '랩톱 팜'(2024-05): 피해 기업이 보낸 노트북을 자택에 모아 두고 위장 인력이 현지에서 일하는 것처럼 꾸몄고, 운영자는 징역 102개월을 선고받음 (PHI-001)
    - [실제 사고] 16개 주 랩톱 팜 29곳 수색(2025-06): 조력자들이 위장 회사·웹사이트를 만들고 회사 지급 노트북을 모아 원격 접속하게 했으며, 수사기관이 컴퓨터 약 200대와 금융 계좌 29개를 압수 (PHI-003)
  detect: |-
    ■ 탐지
    - 지급 장비의 배송지·수령인을 인사 기록 주소와 대조하고, 한 주소로 여러 장비가 가거나 채용 직후 배송지가 바뀌면 확인(NIST CM-8, ISO 27001 5.9)
    - 장비에 설치된 원격 접속 도구와 외부 원격 제어 연결을 감시하고, 승인된 원격 접속 경로 밖의 연결을 경보(NIST AC-17, ISMS-P 2.6.6, CERT 13)
    ■ 대응
    - 지급 장비는 본인 확인 뒤 수령하게 하고 장비 위치·수령 이력을 추적(NIST PE-20, ISO 27001 7.9)
    - 원격 근무 장비는 승인된 원격 접속 도구만 허용하고, 원격 근무 보안 기준에 장비 사용 위치·접속 방식을 명시(ISO 27001 6.7)

PHT-IN-02.1:
  oneline: 재직자가 정상 권한으로 기밀·설계 자료를 모아 외국 업체·정보기관에 유출
  summary: |-
    - 악의적 재직자는 업무상 가진 권한으로 기밀 문서·설계·공정 자료를 오랜 기간 모아 외국 업체·정보기관에 넘기거나 경쟁사 이직에 쓸 수 있음
    - 정상 권한 안의 행위라 접근 통제가 막지 못하고, 동료의 목격이나 대량 접근 분석이 없으면 수년 뒤에야 드러남
  reference: |-
    ■ 물리 관점
    - 대상: 기밀 문서, 설계·공정 자료, 연구 데이터, 군사 기밀(T1005 로컬 자료 수집 · T1078 유효 계정 · T1213 정보 저장소 수집 — ITKB 내부자 관측 기법)
    - 징후(식별 수준): 직무와 무관한 자료 열람, 보안 작업 공간에서의 촬영, 개인 저장장치 백업, 숨긴 겸직·해외 업체 지원, 승진 탈락·징계 뒤의 행동 변화
    - 통제 원칙: 정상 권한의 오남용이라 권한 최소화, 객관적 행동 신호 분석, 동료가 알릴 수 있는 문화가 함께 있어야 함 — 보호 특성은 지표로 쓰지 않음
    - 연계: 포섭(PHT-HU-01.1)·출입증 대리 태그(PHT-PA-01.2)와 이어지고 반출 경로는 EX(PHT-EX-01·EX-02·EX-03) — 아이덴티티 IDT-LC-02.1(내부자의 정상 권한 오남용·반출)
    - 참고: NPSA 〈내부자 위험 정의〉 · NPSA 〈내부자 위험 완화 프레임워크〉
    ■ 실제 사례
    - [실제 사고] 파운드리 2나노 공정 기밀을 현직 엔지니어가 촬영해 전달(2025-08): 장비 협력사로 옮긴 전 엔지니어의 요청을 받은 현직 엔지니어들이 공정 자료를 촬영·복제해 넘겼고, 전 엔지니어는 징역 10년, 협력사 법인은 벌금형 (PHI-079)
    - [실제 사고] 빅테크 엔지니어의 AI 인프라 기밀 반출(2024-03): 외국 업체 두 곳에서 몰래 일하던 엔지니어가 데이터센터 인프라 기밀 파일 500건 이상을 빼돌렸고, 퇴사 직후 외국 업체 대표로 소개됨 (PHI-035)
    - [실제 사고] 주방위군 IT 담당자의 기밀 기억·필사 후 온라인 공유(2023-04): 특권 접근을 가진 병사가 근무 중 본 기밀을 집에서 옮겨 적어 게임 메신저 서버에 올려 수백 건이 유출되었고 징역 15년 선고 (PHI-040)
    - [실제 사고] 보안 작업 공간 광각 촬영을 동료가 목격(2019-01): 자율주행 프로젝트 엔지니어가 보안 구역에서 사진을 찍는 것을 동료가 알렸고, 조사에서 매뉴얼·회로도 등 약 2,000개 파일을 개인 하드디스크로 백업한 사실이 드러남 (PHI-037)
    - [실제 사고] 핵잠수함 설계 기밀 판매 시도(2021-10): 해군 원자력 엔지니어가 설계 기밀을 암호화한 SD 카드에 담아 외국에 팔려다 수사기관 위장 요원에게 걸려 체포 (PHI-039)
    - [실제 사고] 승진 탈락 직원의 제조 운영 시스템 코드 무단 변경·자료 외부 전송(2018-06): 직원이 가짜 사용자 이름으로 시스템 코드를 바꾸고 자료를 외부로 대량 전송했다며 회사가 소송 — 당사자는 내부 고발이라고 주장 (PHI-100)
    - [실제 사고] 노광장비 기업의 현지 직원 자료 무단 유용 공시(2023-02): 장비 기업이 연차보고서에서 해외 현지 직원의 독자 기술 자료 무단 유용을 공시하고 수출통제 위반 가능성으로 당국에 신고 (PHI-083)
  detect: |-
    ■ 탐지
    - 개인별 자료 열람·내려받기·출력 양의 기준선을 두고 직무와 맞지 않는 대량 접근·민감 자료 열람을 경보(NIST AU-13, CERT 12·14)
    - 내부자 위험 관리 체계에서 인사(승진 탈락·징계·퇴직 예정)와 보안 기록을 함께 보되 객관적 행동·직무 사실만 쓰고, 결과는 정해진 절차로 검토(NIST PM-12)
    ■ 대응
    - 정보 분류와 직무 기반 최소 권한·직무 분리로 한 사람이 볼 수 있는 기밀 범위를 줄임(NIST AC-6, ISO 27001 5.12, ISMS-P 2.2.2)
    - 허용된 사용 규정과 보안 위반 시 조치를 문서화해 일관되게 집행하고, 저장매체·출력·촬영·전송 반출 경로를 함께 통제(ISO 27001 5.10·6.4, NIST PS-8, ISMS-P 2.2.6, CERT 3·19)
    - 임직원 모니터링은 개인정보보호법·노사 협의 범위 안에서 목적·대상을 알리고 시행
    - 참고: NPSA 〈내부자 위험 정의〉 · NPSA 〈내부자 위험 완화 프레임워크〉

PHT-IN-02.2:
  oneline: 불만을 품은 재직자의 설비 밸브 조작·제어 코드 무단 변경·장비 파손
  summary: |-
    - 악의적 재직자는 설비 구조와 정상 출입 권한을 이용해 밸브 조작·제어 코드 무단 변경·장비 파손으로 생산·발전 설비를 멈추게 할 수 있음
    - 정당한 출입 사유가 있는 사람이라 범인을 특정하기 어렵고, 해고·승진 탈락 같은 사건 직후 갑자기 일어나 대비할 시간이 짧음
  reference: |-
    ■ 물리 관점
    - 대상: 생산·발전 설비와 밸브·제어반, 제조 운영 시스템 코드, 제품 품질(T1485 데이터 파괴 — ITKB 내부자 관측 기법)
    - 조건: 핵심 설비 주변 감시 장비 부재, 한 사람이 설비 조작·변경을 혼자 할 수 있는 구조, 해고 통보 뒤 즉시 조정되지 않는 출입·접근 권한
    - 통제 원칙: 2인 원칙·변경 통제와 해고·징계 같은 고위험 인사 처리 때의 접근 조정을 함께 설계
    - 연계: OT OTC-IM-10(재산·설비 피해) — 결과는 사보타주·설비 손상(PHT-IM-02)·기반시설 운영 중단(PHT-IM-03)
    - 참고: NPSA 〈내부자 위험 정의〉
    ■ 실제 사례
    - [실제 사고] 원전 터빈 윤활유 배출 밸브 고의 개방으로 원자로 정지(2014-08): 누군가 지시 없이 밸브를 수동으로 열어 원자로가 자동 정지했고, 수사는 정당한 출입 사유가 있던 직원·협력사 인력의 소행으로 결론지었으나 밸브 주변에 CCTV가 없어 범인을 특정하지 못함 (PHI-043)
    - [실제 사고] 해고 통보 직후 공장 설비 파손(2019-08): 해고 통보를 받은 직원이 지게차로 생산 설비를 부수고 망치로 컴퓨터 장비를 파손해 50만 달러 이상의 피해를 냄 (PHI-099)
    - [실제 사고] 승진 탈락 직원의 제조 운영 시스템 코드 무단 변경(2018-06): 직원이 가짜 사용자 이름으로 제조 운영 시스템 코드를 바꾸고 민감 자료를 외부로 보냈다며 회사가 소송 — 당사자는 내부 고발이라고 주장 (PHI-100)
  detect: |-
    ■ 탐지
    - 핵심 설비·밸브 주변의 감시 영상과 조작 기록을 남겨 지시 없는 조작을 찾고, 제어 코드 변경을 승인 기록과 대조(ISO 27001 7.4, CERT 17)
    - 해고·징계·승진 탈락 같은 고위험 인사 사건을 보안 부서와 공유해 해당 인력의 설비 접근을 점검(NIST PM-12)
    ■ 대응
    - 핵심 설비 조작·코드 변경은 직무 분리와 2인 승인으로 한 사람이 혼자 못 하게 함(NIST AC-5, ISO 27001 5.3, ISMS-P 2.2.2, CERT 15)
    - 해고 통보 전후 출입·시스템 접근을 바로 조정하고, 보호구역 작업은 승인·기록(NIST PE-3, ISMS-P 2.4.5)
    - 직장 내 불만·갈등을 일찍 다루는 절차를 두고 징계 절차를 공정하게 운영(ISO 27001 6.4, CERT 5)
    - 참고: NPSA 〈내부자 위험 정의〉

PHT-IN-03.1:
  oneline: 퇴직·이직 직전 출력·촬영·저장장치로 공정·설계 자료를 대량 반출
  summary: |-
    - 악의적 내부자는 퇴직·이직을 앞두고 아직 살아 있는 접근 권한으로 공정·설계 자료를 대량으로 출력·촬영하거나 저장장치에 담아 경쟁 업체로 가져갈 수 있음
    - 퇴직 처리 전까지는 정상 직원이라 막기 어렵고, 명절 연휴처럼 감시가 느슨한 때를 고르면 이직 뒤에야 드러남
  reference: |-
    ■ 물리 관점
    - 대상: 설계·공정 자료, 연구 데이터, 소스코드, 회로 기판·서버 같은 실물(T1074 자료 모으기 · T1078 유효 계정 · T1213 정보 저장소 수집 — ITKB 내부자 관측 기법)
    - 징후(식별 수준): 이직 의사를 밝힌 뒤의 열람·출력량 급증, 직무 밖 구역·자료 접근, 휴일·야간 접근, 태블릿·스마트폰 촬영, 대용량 저장장치 사용
    - 통제 원칙: 퇴직 의사 표명부터 퇴직 후까지를 하나의 고위험 기간으로 관리 — 접근 점검·자산 반납·비밀유지 의무 재고지
    - 연계: 브로커 영입(PHT-HU-02)에서 시작해 이직 후 재현(PHT-IN-03.2)으로 이어지고 반출 경로는 PHT-EX-01·EX-02·EX-03 — 아이덴티티 IDT-LC-01.1(퇴사자 권한 미회수)·IDT-LC-02.1, 공급망 SCT-IM-03(소스 코드 대량 반출)
    - 참고: NPSA 〈내부자 위험 완화 프레임워크〉
    ■ 실제 사례
    - [실제 사고] 10나노급 D램 공정 레시피 자필 반출(2025-12): 연구원 출신이 공정 레시피 정보를 손으로 옮겨 적어 외국 업체로 이직했고, 검찰은 피해액을 최소 수십조 원으로 추산 (PHI-026)
    - [실제 사고] 퇴사 전 공정 문서 출력·태블릿 촬영(2024-05): 경쟁사로 옮긴 직원이 퇴사 전 공정 문제 해결 문서 약 4,000쪽을 여러 차례 출력하고 자료 170개를 태블릿으로 촬영해 반출 (PHI-025)
    - [실제 사고] 명절 연휴 공장 설계도면 촬영(2024-08): 다른 직원이 출근하지 않는 연휴에 직원들이 공장 설계도면 등 국가핵심기술을 열람·촬영해 유출한 뒤 외국 업체로 옮김 (PHI-027)
    - [실제 사고] 잠수함 설계도면 반출(2024-01): 조선사 전 직원들이 재직 중 잠수함 설계도면 약 2,000쪽을 빼돌려 컨설팅 업체로 옮긴 뒤 해외에 넘김 (PHI-029)
    - [실제 사고] 국방 연구기관 퇴직 연구원들의 자료 대량 반출 의혹(2020-04): 퇴직 연구원 20여 명이 무인체계·인공지능 설계 기밀과 소스코드를 대용량 저장장치로 반출한 의혹이 수사되었고, 한 명은 68만 건을 빼냈다는 의혹을 받음 (PHI-033)
    - [실제 사고] 퇴사 통보 뒤 회로 기판·서버 반출(2018-07): 경쟁 업체로 옮기겠다며 퇴사를 알린 엔지니어가 기밀 파일을 대량으로 내려받고 회로 기판과 서버를 가져갔다가 출국 직전 체포 (PHI-036)
    - [실제 사고] 이직 전 경쟁사 문서 대량 내려받기(2020-02): 외국 업체로 영입된 직원들이 이직 전 문서에 접근해 소스코드·기술 문서를 몰래 내려받아 대규모 배상 평결로 이어짐 (PHI-023)
  detect: |-
    ■ 탐지
    - 퇴직 의사를 밝힌 인력은 이전 기준선과 비교해 열람·출력·내려받기·저장장치 사용 증가를 집중 점검(NIST AU-13, CERT 14)
    - 휴일·야간 접근과 직무 밖 구역·자료 접근, 출력물·촬영 반출을 경보(CERT 19)
    ■ 대응
    - 퇴직 절차에 접근 권한 즉시 회수, 장비·자료 반납 확인, 비밀유지 의무 재고지를 포함(NIST PS-4, ISO 27001 5.11·6.5, ISMS-P 2.2.5, CERT 20)
    - 내부자 위험 관리 체계에서 인사·보안이 퇴직 예정자 정보를 공유하고, 위험이 높으면 퇴직 전 접근 범위를 줄임(NIST PM-12)
    - 참고: NPSA 〈내부자 위험 완화 프레임워크〉

PHT-IN-03.2:
  oneline: 이직·창업 뒤 전 직장 공정 노하우·도면으로 경쟁 장비·공장 재현
  summary: |-
    - 퇴직자는 머릿속 노하우와 반출한 도면으로 이직한 회사나 직접 세운 회사에서 전 직장의 공정·장비를 재현하거나, 해외 업체에 기술을 넘기고 대가를 받을 수 있음
    - 퇴직 뒤에는 조직의 통제가 닿지 않고 경쟁 제품이 나와야 알게 되며, 재현 기술과 독자 개발을 구분해 입증하기 어려움
  reference: |-
    ■ 물리 관점
    - 대상: 공정 노하우, 장비 설계·도면, 공장 설계 자료
    - 조건: 퇴직 후 비밀유지 의무·전직 제한의 불명확, 퇴직자 동향 파악 부재, 국가핵심기술 보유 인력 관리 미흡
    - 통제 원칙: 계약·서약으로 퇴직 후 의무를 분명히 하고, 침해가 의심되면 증거 보전·법적 조치를 빠르게 — 국가핵심기술은 산업기술보호법상 신고·수사 협조
    - 연계: 퇴직 직전 반출(PHT-IN-03.1)·브로커 영입(PHT-HU-02) 다음 단계, 결과는 기술 유출(PHT-IM-01)
    - 참고: NPSA 〈Secure Innovation〉
    ■ 실제 사례
    - [실제 사고] 장비 자회사 퇴직 연구원들의 세정장비 기술 해외 제공(2022-05): 퇴직 연구원들이 세정장비 제조 기술을 빼내 해외 연구소에서 여러 차례 총 800억 원을 받고 장비를 만들어 넘겨 실형 선고 (PHI-030)
    - [실제 사고] 넘겨받은 D램 공정 기술로 신생 업체 공장 가동(2024-09): 전 임원과 수석연구원이 넘긴 공정 기술로 외국 신생 업체가 공장 준공 1년 3개월 만에 시범 웨이퍼 생산에 성공 (PHI-016)
    - [실제 사고] 공장 설계자료로 복제 공장 건설 시도(2023-06): 전 임원이 부정 취득한 공장 설계 데이터로 기존 공장 근처에 복제 공장을 지으려 했고 6명이 함께 기소됨 (PHI-018)
    - [실제 사고] 잠수함 설계도면을 이직처에서 해외에 넘김(2024-01): 전 직원들이 컨설팅 업체로 옮긴 뒤 재직 중 빼돌린 도면을 해외에 넘겼고, 방산업체 대표는 1심에서 실형과 법인 추징 약 950억 원을 선고받음 (PHI-029)
    - [실제 사고] 전 임원·엔지니어의 D램 기술 이전(2018-11): 메모리 기업 해외 법인 전 임원이 경쟁 파운드리로 옮겨 함께 옮긴 엔지니어들과 외국 국영 업체와의 기술 협력을 주선해 기소됨 (PHI-024)
  detect: |-
    ■ 탐지
    - 퇴직자가 옮긴 회사·창업 회사의 제품·특허·채용 공고를 살펴 자사 기술과 비슷한 결과물을 찾음
    - 퇴직 전후 접근 기록·반납 기록을 보존해 침해가 의심될 때 증거로 쓸 수 있게 함
    ■ 대응
    - 고용 계약·비밀유지 서약에 영업비밀 범위와 퇴직 후 의무를 명확히 하고 퇴직 때 다시 서명받음(NIST PS-4(1)·PS-6, ISO 27001 6.5·6.6, ISMS-P 2.2.3·2.2.5, CERT 20)
    - 침해가 의심되면 증거 보전과 수사기관 신고·민사 조치를 빠르게 진행
    - 참고: NPSA 〈Secure Innovation〉

PHT-IN-04:
  oneline: 협력사·파견·외주 인력이 공동 개발 현장에서 자료·시험 장비를 들고 나감
  summary: |-
    - 협력사·파견·외주 인력은 공동 개발·위탁 업무로 들어온 현장에서 업무 범위를 넘는 자료를 저장장치에 담거나 시험 장비를 가방에 넣어 들고 나갈 수 있음
    - 원청 직원보다 보안 서약·교육·반출 검사가 느슨하고, 계약이 끝나면 원청의 통제가 닿지 않음
  reference: |-
    ■ 물리 관점
    - 대상: 공동 개발 자료, 생산 현장 자료·레시피, 시험 장비·시제품, 위탁 업무 개인정보(T1078 유효 계정 · T1199 신뢰 관계 — ITKB 내부자 관측 기법)
    - 조건: 계약 업무보다 넓은 협력 인력의 접근 범위, 반출입 검사의 예외, 계약 종료 뒤 자료 회수·확인 부재
    - 연계: 합작·거래 위장(PHT-HU-05.2), 저장매체 반출(PHT-EX-01)·시제품 반출(PHT-EX-04) — 아이덴티티 IDT-LC-01.2(협력사·외주 계정 악용)
    - 참고: NPSA 〈Secure Innovation〉
    ■ 실제 사례
    - [실제 사고] 장비 협력사 인력의 2나노 공정 기밀 요청·전달(2025-08): 장비 협력사로 옮긴 전 엔지니어가 현직 엔지니어들에게 공정 정보를 요청해 받았고, 협력사 법인에도 벌금형 선고 (PHI-079)
    - [실제 사고] 반도체 협력사 임직원의 세정 레시피·공정 기술 해외 유출(2021-01): 협업하며 알게 된 세정 레시피와 제조 기술을 경쟁 업체로 넘겨 대법원에서 실형과 협력사 법인 벌금 10억 원 확정 (PHI-031)
    - [실제 사고] 전투기 공동개발 파견 기술자의 개발 자료 USB 반출 시도(2024-02): 파견 기술자가 내부 자료가 담긴 저장장치를 들고 나가려다 적발되었으나 무혐의·기소유예로 끝났고, 정부는 분담금과 기술이전 규모를 줄임 (PHI-034)
    - [실제 사고] 협력사 직원의 시험 로봇 팔 가방 반출(2019-01): 협력 관계로 연구실에 출입하던 직원이 로봇 팔을 노트북 가방에 넣어 가져가 측정·촬영한 뒤 다음 날 돌려줬고, 민사 배심이 480만 달러 배상을 평결 (PHI-038)
    - [실제 사고] 위탁업체 직원의 주민 정보 USB 분실(2022-06): 지원금 업무를 맡은 위탁업체 직원이 주민 전원의 정보를 USB에 복사해 들고 다니다 술자리 뒤 가방째 잃어버림 (PHI-075)
    - [실제 사고] 해외 고객지원 인력·협력사 직원 매수(2025-05): 범죄자들이 매수한 고객지원·협력사 인력을 통해 고객 이름·주소·신분증 이미지를 빼냄 (PHI-013)
  detect: |-
    ■ 탐지
    - 협력 인력의 자료 접근·출력·저장장치 사용을 계약 업무 범위와 비교해 벗어난 접근을 경보하고, 보호구역 출입·작업을 기록(NIST PE-3, ISO 27001 7.6)
    - 협력사 보안 이행을 정기 점검하고 계약 종료 때 자료 회수·삭제를 확인(ISMS-P 2.3.3·2.3.4)
    ■ 대응
    - 협력사 계약에 보안 요구사항·비밀유지·반출 금지·위반 시 책임을 넣고, 외부 인력 보안 기준을 직원과 같게 적용(NIST PS-7, ISO 27001 5.19·5.20, ISMS-P 2.3.2, CERT 6)
    - 공동 개발 공간은 협력 인력의 접근 구역·자료를 업무 단위로 나누고 반출입 검사에 예외를 두지 않음
    - 참고: NPSA 〈Secure Innovation〉

PHT-IN-05.1:
  oneline: 암호화하지 않은 USB·기밀 문서를 길에서 잃어버리거나 방치해 노출
  summary: |-
    - 비의도 내부자는 보안 정보·개인정보가 담긴 USB나 기밀 문서를 들고 다니다 잃어버리거나 아무 데나 두어, 외부인이 줍고 열어 볼 수 있게 만들 수 있음
    - 악의가 없어 감시 대상에서 빠지기 쉽고, 분실을 늦게 알거나 신고하지 않으면 언론 보도로 처음 드러남
  reference: |-
    ■ 물리 관점
    - 대상: USB·노트북, 기밀 문서, 위탁 업무 개인정보
    - 조건: 암호화하지 않은 매체에 민감 정보 저장, 업무 밖 장소로 문서·매체 반출, 분실 신고 절차 부재, 교육 부족
    - 통제 원칙: 내부자 위험에는 악의 없는 부주의도 포함 — 실수가 피해로 커지지 않게 암호화·반출 제한으로 설계하고 빨리 신고하게 함
    - 연계: 반출 경로(PHT-EX-01·EX-02), 위탁 인력(PHT-IN-04)
    - 참고: NPSA 〈내부자 위험 정의〉 · CISA 〈내부자 위협 완화 지침〉
    ■ 실제 사례
    - [실제 사고] 공항 직원이 잃어버린 USB의 경비 순찰·경호 경로 정보(2017-10): 시민이 주운 USB에 순찰 일정과 요인 경호 경로가 암호화 없이 들어 있었고, 감독기관은 과태료 12만 파운드를 부과하며 직원 6,500명 중 교육 이수자가 2%뿐이라고 지적 (PHI-073)
    - [실제 사고] 국방부 기밀 문서가 버스 정류장 뒤에서 발견(2021-06): 함정 통항에 대한 상대국 반응 예측 등이 담긴 문서를 시민이 발견해 언론에 넘겼고, 직원이 분실을 신고한 상태였음 (PHI-074)
    - [실제 사고] 위탁업체 직원의 주민 정보 USB 분실(2022-06): 주민 46만 명의 정보를 USB에 복사해 다니다 잃어버렸으나, 암호화·비밀번호가 걸려 있어 열람 증거는 확인되지 않음 (PHI-075)
  detect: |-
    ■ 탐지
    - 저장매체·노트북 자산 목록과 반출 기록을 대조해 반납되지 않은 매체를 찾고, 분실 즉시 신고받는 절차를 둠
    - 보안 점검에서 방치된 문서·매체를 확인해 기록하고, 반복되는 실수는 업무 구조 개선에 반영(CERT 8)
    ■ 대응
    - 민감 정보는 암호화된 승인 매체에만 담고 저장 자료를 암호화(NIST SC-28, ISO 27001 7.10, ISMS-P 2.10.7)
    - 문서·매체의 외부 반출은 승인·기록하고 운반 기준을 둠(NIST MP-5, ISO 27001 5.10·7.9, ISMS-P 2.4.6)
    - 분실을 빨리 신고하도록 신고자를 탓하지 않는 절차를 두고 정기 교육(CERT 9)
    - 참고: NPSA 〈내부자 위험 정의〉 · CISA 〈내부자 위협 완화 지침〉

PHT-IN-05.2:
  oneline: 위치 기록 앱 공개·기밀 문서 노출 같은 부주의로 시설·작전 정보 누설
  summary: |-
    - 비의도 내부자는 운동 기록 앱의 위치 공개, 기밀 문서를 보이게 든 채 이동하는 행동 같은 부주의로 시설 위치·작전 정보를 외부에 드러낼 수 있음
    - 본인은 노출을 알지 못하고, 한 사람 한 사람의 작은 노출이 모이면 시설 배치·활동 패턴 같은 큰 정보가 됨
  reference: |-
    ■ 물리 관점
    - 대상: 위치·활동 기록, 기밀 문서 표지·내용, 업무 사진의 배경
    - 조건: 위치 공유 앱의 기본 공개 설정, SNS 업무 사진 게시 기준 부재, 문서 운반 기준 부재
    - 통제 원칙: 개인 습관에서 생기는 노출이라 규칙·교육과 함께 기본값(공개 설정·운반 방식)을 바꾸는 것이 효과적
    - 연계: 공개정보 표적 선정(PHT-RC-01)의 재료가 되고 원거리 촬영(PHT-SV-04.1)과 겹침
    - 참고: NPSA 〈내부자 위험 정의〉 · CISA 〈내부자 위협 완화 지침〉
    ■ 실제 사례
    - [실제 사고] 운동 기록 앱 히트맵의 해외 군 기지 노출(2018-01): 공개된 활동 기록 히트맵에서 군 기지 위치와 장병 이동 경로가 드러나 각국 군이 위치 기록 공개 설정을 점검 (PHI-077)
    - [실제 사고] 대테러 책임자의 작전 문서 노출(2009-04): 책임자가 '비밀' 표시 문서를 보이게 든 채 이동해 급습 계획이 사진에 찍혔고, 작전을 앞당긴 뒤 사임 (PHI-076)
  detect: |-
    ■ 탐지
    - 조직·임직원 공개 게시물과 위치 기록에 시설 위치·근무 패턴이 드러나는지 정기 점검하고, 발견하면 당사자에게 알려 내리게 함(NIST AC-22)
    - 보안 점검에서 문서 운반·화면 노출 같은 부주의 사례를 기록(ISO 27001 7.7, ISMS-P 2.4.7)
    ■ 대응
    - 보안 구역 근무자의 위치 공유 앱 사용과 업무 사진 게시 기준을 규칙으로 정하고 서약을 받음(NIST PL-4)
    - 부주의 노출 사례를 들어 정기 교육(NIST AT-2, ISO 27001 6.3, ISMS-P 2.2.4, CERT 7·9)
    - 참고: NPSA 〈내부자 위험 정의〉 · CISA 〈내부자 위협 완화 지침〉
