# [IM] 영향·피해 — 물리 관점 문구
# 작성 규칙: oneline 50자 이내 명사형 · summary 2줄(① 공격자는 … 수 있음 ② 피해·회복이 어려운 이유) ·
#           reference(■ 물리 관점 / ■ 실제 사례) · detect(■ 탐지 / ■ 대응). 사례는 그 행에 매핑된 사고만, 수치는 사고 DB 요약에 있는 것만.
#           IM은 결과 유형 — '■ 물리 관점'에 그 결과로 이어지는 앞 단계 세부위협(PHT-ID)을 적고, 사고가 많은 행은 대표 사례만 고름.

PHT-IM-01:
  oneline: 국가핵심기술·영업비밀·국가기밀이 경쟁국·경쟁사로 넘어가는 회복 불가능한 손실
  summary: |-
    - 공격자는 포섭·인력 영입·내부자 반출·투자 위장으로 국가핵심기술·영업비밀·국가기밀을 손에 넣어 경쟁 제품 개발이나 군사 정보로 쓸 수 있음
    - 한 번 넘어간 기술은 되돌릴 수 없고, 피해 규모는 경쟁 제품이 나오거나 수사가 끝나야 드러나 수조 원 단위에 이르기도 함
  reference: |-
    ■ 물리 관점
    - 결과 유형: 국가핵심기술·첨단기술(산업기술보호법), 영업비밀(부정경쟁방지법), 국가·군사 기밀 — 앞 단계 세부위협이 이어져 나타남
    - 주요 경로: 브로커 영입(PHT-HU-02) → 퇴직 직전 반출(PHT-IN-03.1) → 이직 후 재현(PHT-IN-03.2), 금전 포섭(PHT-HU-01.1) → 재직자 유출(PHT-IN-02.1), 투자·합작 위장(PHT-HU-05.1·HU-05.2), 협력사 인력(PHT-IN-04)
    - 통제 원칙: 무엇이 핵심 자산인지 먼저 정하고(분류), 유출이 의심되면 증거 보전·신고·법적 조치를 빠르게 하며, 지난 사건의 교훈을 통제에 반영
    - 연계: 공급망 SCT-IM-03(개발 비밀·소스 코드 대량 반출), OT OTC-IM-12(운영 정보 탈취)
    - 참고: NPSA 〈Secure Innovation〉
    ■ 실제 사례
    - [실제 사고] 10나노급 D램 공정 레시피 해외 유출(2025-12): 외국 업체가 국내 기업 출신을 영입하고 연구원 출신이 공정 레시피를 손으로 옮겨 적어 넘겨, 검찰이 10명을 기소하고 피해액을 최소 수십조 원으로 추산 (PHI-026)
    - [실제 사고] 파운드리 2나노 공정 기밀 유출(2025-08): 장비 협력사로 옮긴 전 엔지니어가 현직 엔지니어들에게서 공정 자료를 받아 국가안전법·영업비밀법 위반으로 징역 10년 선고 (PHI-079)
    - [실제 사고] 20나노 D램 공정 기술 유출(2024-09): 전 임원과 수석연구원이 공정 기술을 외국 신생 업체에 넘겼고, 경찰은 피해 기술의 경제적 가치를 4조 3천억 원으로 추산 (PHI-016)
    - [실제 사고] 정보사령부 군무원의 군사기밀 유출(2024-07): 포섭된 군무원이 돈을 받고 신분을 숨긴 요원 명단 등 군사기밀을 넘겨 징역 20년 확정 (PHI-009)
    - [실제 사고] 잠수함 설계도면 해외 유출(2024-01): 전 직원들이 빼돌린 설계도면이 해외의 첫 자체 잠수함 개발에 쓰인 것으로 알려짐 (PHI-029)
    - [실제 사고] 공장 설계자료로 복제 공장 건설 시도(2023-06): 전 임원이 공장 설계 데이터로 복제 공장을 지으려 했고, 검찰은 기술 가치를 최소 3천억 원에서 최대 수조 원으로 봄 (PHI-018)
    - [실제 사고] 주방위군 기밀 수백 건 온라인 유출(2023-04): IT 담당 병사가 근무 중 본 기밀을 필사해 게임 메신저 서버에 올림 (PHI-040)
    - [실제 사고] 하이브리드 제어 소스코드 제공(2009-11): 인수한 외국 대주주의 요구로 이후 국가핵심기술로 지정된 소스코드가 넘어감 (PHI-019)
  detect: |-
    ■ 탐지
    - 핵심 자산(국가핵심기술·영업비밀·기밀)을 분류해 목록으로 관리하고, 그 자산에 대한 접근·반출 신호를 내부자 위험 관리 체계에서 종합(ISO 27001 5.12, NIST PM-12, CERT 1)
    - 경쟁 제품·특허·채용 동향과 수사기관·업계 정보를 살펴 유출 정황을 일찍 확인
    ■ 대응
    - 유출이 의심되면 사고 대응 절차로 증거 보전·접근 차단·수사기관 신고를 하고 피해 범위를 조사(NIST IR-4, ISO 27001 5.26, ISMS-P 2.11.5)
    - 지식재산 보호와 정기 위험평가에 기술 유출 경로를 넣고, 지난 사건의 교훈을 통제에 반영(ISO 27001 5.32, NIST RA-3, CERT 22)
    - 국가핵심기술 보유 기관은 산업기술보호법상 보호조치·유출 신고 의무를 이행
    - 참고: NPSA 〈Secure Innovation〉

PHT-IM-02:
  oneline: 철도 신호·통신 케이블 절단·방화와 내부자 조작으로 설비 손상·운행 마비
  summary: |-
    - 공격자나 내부자는 철도 신호 설비·통신 케이블·물류 창고를 훼손하거나 불을 지르고, 설비 밸브를 조작해 기반시설·생산 설비를 손상시킬 수 있음
    - 선로·케이블처럼 넓게 퍼진 설비는 모두 지킬 수 없고, 이중화한 설비도 여러 곳을 동시에 훼손하면 멈춰 복구에 시간이 걸림
  reference: |-
    ■ 물리 관점
    - 결과 유형: 발전·철도·통신 설비 손상, 생산 설비 파손, 물류 창고 화재
    - 주요 경로: 메신저 대리인 모집(PHT-HU-01.3) → 현장 답사(PHT-RC-02) → 방화·절단, 재직자 사보타주(PHT-IN-02.2)
    - 통제 원칙: 넓게 퍼진 설비는 핵심 구간·장비를 골라 보호하고(배선·지원 설비 보호), 손상을 전제로 대체 경로·복구 계획을 준비
    - 연계: OT OTC-IM-10(재산·설비 피해)·OT-IM-05(안전·보호 기능 상실 및 설비 피해) — ATT&CK Enterprise는 물리 설비 손상을 정의하지 않음
    - 참고: NPSA 〈위험 주제〉
    ■ 실제 사례
    - [실제 사고] 올림픽 개막 당일 고속철 신호 설비 동시다발 방화(2024-07): 여러 노선의 신호 박스·전기 설비가 동시에 훼손되어 승객 80만 명이 영향을 받았고 복구가 주말까지 이어짐 (PHI-067)
    - [실제 사고] 이중화된 철도 무선통신 광케이블 동시 절단(2022-10): 두 곳의 케이블이 잘려 북부 철도 운행이 멈췄고, 수사 당국은 상당한 기술 지식을 가진 범인의 조직적 절단으로 봄 (PHI-066)
    - [실제 사고] 지원 물자 창고 방화(2024-03): 외국 용병 조직과 메신저로 접촉한 일당이 창고에 불을 질러 약 100만 파운드 피해를 냄 (PHI-015)
    - [실제 사고] 원전 터빈 윤활유 밸브 고의 개방(2014-08): 비원자력 구역의 밸브가 지시 없이 열려 원자로가 자동 정지 (PHI-043)
    - [실제 사고] 해고 통보 직후 공장 설비 파손(2019-08): 해고 통보를 받은 직원이 지게차·망치로 생산 설비와 컴퓨터 장비를 부숨 (PHI-099)
  detect: |-
    ■ 탐지
    - 핵심 설비·케이블 구간에 침입·훼손 감지와 감시를 두고 이상 시 즉시 경보(NIST PE-6)
    - 사보타주 대리인 모집·유사 공격 정보를 관계 기관과 나눠 같은 유형 설비의 점검을 강화
    ■ 대응
    - 배선·지원 설비·전력 설비를 물리적으로 보호하고 핵심 구간의 이중화 경로를 물리적으로 떨어뜨림(NIST PE-9, ISO 27001 7.11·7.12, ISMS-P 2.4.3·2.4.4)
    - 화재·물리 위협 대비 설비와 손상 시 대체 운영·복구 계획을 준비해 훈련(NIST CP-2, ISO 27001 7.5)
    - 참고: NPSA 〈위험 주제〉

PHT-IM-03:
  oneline: 드론 출현·설비 훼손으로 공항 활주로·철도 운행·원전 가동 중단
  summary: |-
    - 공격자는 공항 주변 드론 비행, 철도 신호·통신 설비 훼손, 발전 설비 조작으로 공항·철도·발전소 운영을 멈추게 할 수 있음
    - 안전 때문에 의심 신호만으로도 운영을 멈춰야 하고, 배후가 확인되지 않아 같은 방해가 반복될 수 있음
  reference: |-
    ■ 물리 관점
    - 결과 유형: 공항 이착륙 중단, 철도 운행 마비, 원전·발전소 정지
    - 주요 경로: 드론 반복 출현(PHT-SV-01.2), 설비 사보타주(PHT-IM-02)·재직자 사보타주(PHT-IN-02.2)
    - 통제 원칙: 중단을 전제로 판단 기준·대체 운영·재개 절차를 미리 정하는 사업 연속성 계획 — 드론 대응은 탐지·식별·신고 중심이고 기체 무력화는 법적 권한이 있는 기관이 함
    - 연계: OT OTC-IM-03(가용성 상실)·OTC-IM-05(생산·매출 손실)·OT-IM-01(운영 중단 및 생산 손실)
    - 참고: NPSA 〈대드론 — 시설 대비〉 · CISA 〈무인기(UAS) 지침〉
    ■ 실제 사례
    - [실제 사고] 이틀 연속 드론 목격으로 국제공항 활주로 폐쇄(2025-10): 약 7시간 운항이 중단되어 17편 결항·15편 회항으로 승객 약 3,000명이 발이 묶였고 다음 날 밤에도 활주로가 닫힘 (PHI-055)
    - [실제 사고] 대형 드론 출현으로 수도 공항 운항 중단(2025-09): 약 35편이 회항하고 같은 시각 인접국 공항도 닫혔으며, 총리는 기반시설에 대한 가장 심각한 공격이라고 밝힘 (PHI-054)
    - [실제 사고] 고속철 신호 설비 방화로 운행 차질(2024-07): 올림픽 개막 당일 여러 노선 설비가 훼손되어 승객 80만 명이 영향을 받음 (PHI-067)
    - [실제 사고] 철도 무선통신 케이블 절단으로 운행 중단(2022-10): 이중화된 케이블 두 곳이 잘려 북부 철도 운행이 멈춤 (PHI-066)
    - [실제 사고] 드론 반복 출현으로 장시간 운항 중단(2018-12): 유일한 활주로가 약 36시간 닫혀 항공편 1,000편·승객 14만 명이 영향을 받음 (PHI-053)
    - [실제 사고] 원전 밸브 조작으로 원자로 정지(2014-08): 터빈 윤활유 밸브가 고의로 열려 원자로가 자동 정지 (PHI-043)
  detect: |-
    ■ 탐지
    - 운영 중단을 부르는 위협(드론 출현·설비 훼손·내부 조작)을 감시와 사고 보고로 빨리 알아채고 관계 기관과 공유(NIST PE-6)
    - 중단 사건마다 원인·영향·대응 시간을 기록해 반복 패턴과 대응이 늦어진 구간을 찾음
    ■ 대응
    - 운영 중단·재개 판단 기준과 대체 운영 절차를 사업 연속성 계획에 넣고 훈련(NIST CP-2, ISO 27001 5.29·5.30, ISMS-P 2.12.1)
    - 사건이 생기면 사고 대응 절차로 신고·기록·영향 관리를 하고, 드론은 권한 있는 기관에 대응을 맡김(NIST IR-4)
    - 참고: NPSA 〈대드론 — 시설 대비〉 · CISA 〈무인기(UAS) 지침〉

PHT-IM-04:
  oneline: 통제 공역의 드론과 항공기 충돌, 설비 훼손으로 생기는 인명·안전 위협
  summary: |-
    - 공격자나 부주의한 조종자는 공항 접근 공역·비행 제한 구역에 드론을 띄워 항공기와 충돌하게 하거나, 설비 훼손으로 작업자·승객의 안전을 위협할 수 있음
    - 충돌 위치에 따라 경미한 손상에서 대형 참사까지 갈 수 있고, 사고 전에는 위험이 비행 기록·목격 신고로만 드러남
  reference: |-
    ■ 물리 관점
    - 결과 유형: 항공기·승객 안전, 원전·발전 설비 안전, 작업자 안전
    - 주요 경로: 드론 무단 비행(PHT-SV-01.2), 설비 사보타주(PHT-IM-02)·재직자 사보타주(PHT-IN-02.2)
    - 통제 원칙: 안전 위협은 운영 지속보다 우선 — 비상 대응 절차와 관계 기관 공조를 미리 정하고, 추락 기체·잔해는 안전 절차에 따라 처리
    - 연계: OT OTC-IM-11(안전 상실)·OT-IM-05(안전·보호 기능 상실 및 설비 피해)
    - 참고: CISA 〈무인기(UAS) 지침〉
    ■ 실제 사례
    - [실제 사고] 산불 진화 항공기와 취미 드론 충돌(2025-01): 비행 제한 구역의 민간 드론이 물을 뿌리던 소방 항공기 날개에 축구공 크기 구멍을 냈고, 항공기는 안전하게 착륙했으나 며칠간 운용되지 못함 (PHI-061)
    - [실제 사고] 공항 접근 여객기와 드론 충돌(2017-10): 승객을 태우고 공항으로 접근하던 소형 여객기가 고도 1,500피트에서 드론과 충돌해 비상을 선언했고, 장관은 조종석이나 엔진에 부딪혔다면 참사가 될 수 있었다고 밝힘 (PHI-098)
  detect: |-
    ■ 탐지
    - 시설·공역 주변 드론 비행과 안전 위협 신고를 실시간으로 받아 비상 대응 체계로 연결
    - 사고·준사고(근접 비행·충돌)를 기록해 위험 구역과 시간대를 파악
    ■ 대응
    - 안전 위협 발생 시 대피·중단·재개 절차와 관계 기관 연락 체계를 비상 계획에 넣고 훈련(NIST CP-2, ISO 27001 5.29, ISMS-P 2.12.1)
    - 사고 대응 절차로 신고·현장 보존·원인 조사를 하고, 추락 기체는 위험물일 가능성을 고려해 안전하게 처리(NIST IR-4, ISO 27001 7.5)
    - 참고: CISA 〈무인기(UAS) 지침〉

PHT-IM-05:
  oneline: 기술 유출 소송 배상·과징금·자금 탈취와 사고 대응 비용·평판 손실
  summary: |-
    - 공격자나 내부자의 행위는 영업비밀 소송 배상·합의금, 감독기관 과징금, 자금 탈취와 갈취, 사고 대응 비용으로 조직에 직접적인 금전·법적 피해를 줄 수 있음
    - 피해 확정까지 수년이 걸리고, 가해 측 처벌과 별개로 관리 소홀이 드러나면 피해 조직도 제재·평판 손실을 입음
  reference: |-
    ■ 물리 관점
    - 결과 유형: 영업비밀 침해 배상·합의, 수입 금지 같은 무역 제재, 개인정보 보호 위반 과징금, 자금 탈취·갈취, 대응 비용
    - 주요 경로: 인력 영입·퇴직자 반출(PHT-HU-02·IN-03.1), 위장 출입 장치 설치(PHT-PA-03.1), 내부자 매수(PHT-HU-01.1), 분실·폐기 관리 소홀(PHT-IN-05.1·SV-04.2)
    - 통제 원칙: 법적 의무(개인정보·영업비밀·수출통제)를 위험평가에 넣고, 사고 때 증거를 보존해 소송·제재 대응력을 확보
    ■ 실제 사례
    - [실제 사고] 경쟁사 엔지니어 영입·문서 반출 배상 평결(2020-02): 배심원단이 7억 6,460만 달러 배상을 평결했고, 법무부는 이후 영입 업체를 영업비밀 절도 공모 등 21개 혐의로 기소 (PHI-023)
    - [실제 사고] 배터리 인력 채용 영업비밀 분쟁(2021-02): 무역위원회가 수입 금지 효력이 생기는 판결을 확정했고, 양사는 현금·로열티 합계 2조 원 지급에 합의 (PHI-020)
    - [실제 사고] 폐기 장비 재판매에 대한 벌금(2022-09): 고객 정보가 남은 장비가 재판매되어 감독기관이 벌금 3,500만 달러를 부과 (PHI-078)
    - [실제 사고] 거래소 내부 인력 매수와 갈취 요구(2025-05): 회사가 갈취 요구를 거부하고 대응 비용을 최대 4억 달러로 추정 (PHI-013)
    - [실제 사고] 은행 내부망 장치 설치로 자금 탈취(2018-12): 위장 출입자가 설치한 장치로 내부망에 원격 접속해 동유럽 은행 최소 8곳에서 수천만 달러 손실 추정 (PHI-045)
    - [실제 사고] USB 분실에 대한 과태료(2017-10): 보안 정보가 담긴 USB를 잃어버린 공항 운영사에 감독기관이 과태료 12만 파운드를 부과 (PHI-073)
    - [실제 사고] 위장취업 수익의 해외 유출(2024-05): 위장 IT 인력이 취업한 기업들에서 받은 1,700만 달러 이상의 수익이 조력자와 북한으로 돌아감 (PHI-001)
    - [실제 사고] D램 기술 이전 업체의 벌금(2018-11): 기술 이전에 관여한 파운드리가 혐의를 인정하고 벌금을 냄 (PHI-024)
  detect: |-
    ■ 탐지
    - 사고가 생기면 금전·법적 영향(배상·과징금·신고 의무)을 초기에 평가하고 증거를 보존(NIST IR-4, ISO 27001 5.26)
    - 개인정보·영업비밀·수출통제 관련 법적 의무와 이행 상태를 정기 점검(ISO 27001 5.31)
    ■ 대응
    - 정기 위험평가에 기술 유출·내부자·물리 보안 사고의 금전·법적 영향을 반영하고 법무 대응을 준비(NIST RA-3)
    - 사고 대응·복구 절차에 감독기관 신고, 피해자 통지, 소송 대응을 포함(ISMS-P 2.11.5)
