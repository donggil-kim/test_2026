# [EX] 자산·정보 반출 — 물리 관점 문구
# 작성 규칙: oneline 50자 이내 명사형 · summary 2줄(① 내부자 등은 … 수 있음 ② 피해·탐지 곤란 사유) ·
#           reference(■ 물리 관점 / ■ 실제 사례) · detect(■ 탐지 / ■ 대응). 사례는 그 행에 매핑된 사고만, 수치는 사고 DB 요약에 있는 것만.
#           EX는 정보·자산이 밖으로 나가는 물리 경로 — 같은 사고의 행위 주체는 IN·HU 행에서 평가.

PHT-EX-01:
  oneline: USB·외장 디스크·SD 카드와 업무 노트북으로 설계·연구 자료를 통째로 반출
  summary: |-
    - 내부자는 USB·외장 디스크·SD 카드나 업무 노트북에 설계·연구 자료를 담아 출입 검색을 지나 밖으로 가져갈 수 있음
    - 저장장치는 작아 숨기기 쉽고 용량 제약이 거의 없어 자료를 통째로 옮길 수 있으며, 망분리 환경에서도 매체 통제가 비면 그대로 나감
  reference: |-
    ■ 물리 관점
    - 대상: USB·외장 디스크·SD 카드, 업무 노트북, 망분리 단말(T1052 물리 매체 반출 · T1052.001 USB 반출 — ITKB 내부자 관측 기법)
    - 조건: 승인되지 않은 저장장치를 막지 않는 단말, 반출입 검색 예외, 암호화하지 않은 매체, 대용량 복사 기록 부재
    - 연계: 반출 주체는 재직자(PHT-IN-02.1)·퇴직자(PHT-IN-03.1)·협력사(PHT-IN-04)·비의도 분실(PHT-IN-05.1) 행에서 평가 — 디지털 반출은 아이덴티티 IDT-LC-02.1, 클라우드 CL-EF-02(웹 서비스 경유 반출), 공급망 SCT-IM-03
    - 참고: CISA 〈내부자 위협 완화 지침〉
    ■ 실제 사례
    - [실제 사고] 국방 연구기관 퇴직 연구원들의 대용량 저장장치 반출 의혹(2020-04): 퇴직 연구원 20여 명이 설계 기밀과 소스코드를 대용량 이동형 저장장치에 담아 반출한 의혹으로 수사되었고, 한 명은 68만 건을 빼냈다는 의혹을 받음 (PHI-033)
    - [실제 사고] 전투기 공동개발 파견 기술자의 USB 반출 시도(2024-02): 내부 자료가 담긴 이동식 저장장치를 들고 나가려다 적발되었고, 무혐의·기소유예로 끝났으나 공동개발 조건이 조정됨 (PHI-034)
    - [실제 사고] 핵잠수함 설계 기밀 SD 카드 판매 시도(2021-10): 엔지니어가 설계 기밀을 암호화한 SD 카드에 담아 외국에 팔려다 수사기관 위장 요원에게 걸려 체포 (PHI-039)
    - [실제 사고] 매뉴얼·회로도 파일의 개인 하드디스크 백업(2019-01): 보안 구역 촬영이 동료에게 목격된 엔지니어가 약 2,000개 파일을 개인 하드디스크로 백업한 사실이 조사에서 드러남 (PHI-037)
    - [실제 사고] 공관 자료·인사 연락처의 개인 USB 저장(2011-03): 영사들과 관계를 맺은 여성이 공관 자료와 정·관계 인사 연락처를 자신의 USB에 담음 (PHI-094)
    - [실제 사고] 경비 순찰·경호 경로가 담긴 USB 분실(2017-10): 공항 직원이 잃어버린 USB에 보안 정보가 암호화 없이 들어 있어 감독기관이 과태료를 부과 (PHI-073)
    - [실제 사고] 기밀 문서 SD 카드 스캔(2017-06): 전직 요원이 기밀 문서를 SD 카드로 스캔하려던 장면이 매장 감시카메라에 찍혀 간첩 혐의로 유죄 (PHI-010)
  detect: |-
    ■ 탐지
    - 단말의 저장장치 연결과 대용량 복사를 기록하고, 승인되지 않은 매체 사용과 평소보다 큰 복사를 경보(CERT 19)
    - 출입구 반출입 검색에서 저장장치·노트북을 확인하고 반출 기록과 대조(NIST PE-16, ISMS-P 2.4.6)
    ■ 대응
    - 승인·등록된 암호화 매체만 쓰게 하고 그 밖의 저장장치는 단말에서 차단(NIST MP-7·SC-41, ISO 27001 7.10, ISMS-P 2.10.7)
    - 자료 외부 전달은 승인된 전송 경로로만 하도록 정보 전송 규칙을 정함(ISO 27001 5.14)
    - 참고: CISA 〈내부자 위협 완화 지침〉

PHT-EX-02:
  oneline: 기밀 문서 출력·손으로 옮겨 적기·도면 지참으로 디지털 반출 통제 우회
  summary: |-
    - 내부자는 기밀 문서를 여러 번에 나눠 출력하거나 화면의 공정 수치를 손으로 옮겨 적어, 디지털 반출 탐지를 피해 밖으로 가져갈 수 있음
    - 출력·필기는 업무 중 흔한 행동이라 의심받지 않고, 핵심 공정 수치처럼 압축된 정보는 종이 몇 장으로도 충분히 나감
  reference: |-
    ■ 물리 관점
    - 대상: 출력물, 설계 도면, 연구 노트, 공정 레시피처럼 압축된 핵심 정보
    - 조건: 출력 기록·인증 후 출력 부재, 출력물 반출 검사 부재, 분류 표시·워터마크 미흡, 보안 구역 필기 제한 부재
    - 연계: 반출 주체는 퇴직 직전 반출(PHT-IN-03.1)·재직자 유출(PHT-IN-02.1)·비의도 분실(PHT-IN-05.1) 행에서 평가 — ATT&CK은 디지털 반출만 정의해 미연계
    ■ 실제 사례
    - [실제 사고] 10나노급 D램 공정 레시피 자필 반출(2025-12): 연구원 출신이 공정 레시피 정보를 손으로 옮겨 적어 외국 업체로 옮겼고, 검찰은 피해액을 최소 수십조 원으로 추산 (PHI-026)
    - [실제 사고] 퇴사 전 공정 문서 대량 출력(2024-05): 경쟁사로 옮긴 직원이 퇴사 전 공정 문제 해결 문서 약 4,000쪽과 영업비밀을 여러 차례 출력해 반출 (PHI-025)
    - [실제 사고] 기밀을 기억했다가 집에서 옮겨 적어 공유(2023-04): 특권 접근을 가진 주방위군 IT 담당 병사가 근무 중 본 기밀을 집에서 필사해 온라인에 올림 (PHI-040)
    - [실제 사고] 기밀 문서가 버스 정류장 뒤에서 발견(2021-06): 국방부 직원이 잃어버린 기밀 문서 50쪽을 시민이 발견해 언론에 넘김 (PHI-074)
  detect: |-
    ■ 탐지
    - 출력 기록(사용자·문서·쪽수)을 남기고 평소보다 많은 출력, 기밀 문서 반복 출력, 휴일 출력을 경보(CERT 19)
    - 출입구에서 출력물·도면 반출을 확인하고 반출 승인 기록과 대조(NIST PE-16, ISMS-P 2.4.6)
    ■ 대응
    - 기밀 문서는 분류 표시·워터마크를 넣고 인증한 사람만 출력하게 하며, 출력 장치는 보호구역 안에 둠(ISO 27001 5.13, NIST PE-5)
    - 기밀 문서 운반·보관 기준과 클린 데스크를 적용하고 다 쓴 출력물은 파쇄(NIST MP-5, ISO 27001 7.7, ISMS-P 2.4.7)

PHT-EX-03:
  oneline: 휴대폰·태블릿으로 보안 화면·도면·설비를 촬영해 망분리·반출 통제 우회
  summary: |-
    - 내부자나 출입한 외부인은 휴대폰·태블릿·카메라로 보안 단말 화면, 설계 도면, 설비를 찍어 망분리·디지털 반출 통제를 거치지 않고 정보를 가져갈 수 있음
    - 촬영은 몇 초면 끝나고 흔적이 업무 시스템에 남지 않으며, 연휴·야간처럼 사람이 적을 때 하면 동료의 목격도 없음
  reference: |-
    ■ 물리 관점
    - 대상: 보안 단말 화면, 설계 도면·공정도, 생산 설비, 군 함정·장비
    - 조건: 보안 구역 휴대폰 반입 허용이나 카메라 제한 부재, 연휴·야간 감독 공백, 화면 워터마크 부재
    - 연계: 소형 장비 몰래 촬영(PHT-SV-02.2)과 같은 결과, 반출 주체는 재직자(PHT-IN-02.1)·퇴직 예정자(PHT-IN-03.1) 행에서 평가 — ATT&CK의 화면 캡처는 소프트웨어 기능이라 미연계
    ■ 실제 사례
    - [실제 사고] 파운드리 2나노 공정 기밀 촬영·전달(2025-08): 현직 엔지니어들이 전 동료의 요청을 받고 공정 자료를 촬영·복제해 넘겨 실형 선고 (PHI-079)
    - [실제 사고] 명절 연휴 공장 설계도면 스마트폰 촬영(2024-08): 다른 직원이 출근하지 않는 연휴에 직원들이 공장 설계도면 등 국가핵심기술을 열람해 스마트폰으로 찍은 뒤 외국 업체로 옮김 (PHI-027)
    - [실제 사고] 퇴사 전 자료 태블릿 촬영(2024-05): 경쟁사로 옮긴 직원이 퇴사 전 자료 170개를 태블릿으로 촬영해 반출 (PHI-025)
    - [실제 사고] 해군 수병의 함정 사진·영상 제공(2023-08): 수병이 외국 정보요원의 요청에 따라 함정 사진·영상과 기술 매뉴얼을 넘김 (PHI-007)
    - [실제 사고] 웨이퍼 연마 공정도 휴대전화 촬영(2023-01): 연구원이 회사 내부망의 공정도 등을 휴대전화로 찍어 동업하기로 한 외국 업체에 넘김 (PHI-028)
    - [실제 사고] 보안 작업 공간 광각 촬영(2019-01): 엔지니어가 보안 구역에서 광각 렌즈로 사진을 찍는 것을 동료가 목격해 알림 (PHI-037)
    - [실제 사고] 협력사 직원의 시험 로봇 측정·촬영(2019-01): 연구실에서 가져간 로봇 팔을 외부에서 측정·촬영한 뒤 돌려줌 (PHI-038)
  detect: |-
    ■ 탐지
    - 보안 구역 감시 영상과 출입 기록으로 연휴·야간 접근과 화면·도면을 향한 촬영 동작을 확인하고, 동료가 촬영 목격을 알릴 경로를 둠(CERT 12)
    - 화면에 사용자 식별 워터마크를 넣어 촬영본이 발견되면 출처를 추적
    ■ 대응
    - 보안 구역은 휴대폰·카메라 반입을 제한하거나 카메라 사용 제한을 확인하고, 출입 서약으로 촬영 금지를 알림(NIST PE-3·PL-4, ISO 27001 7.6, ISMS-P 2.4.6, CERT 19)
    - 클린 데스크·화면 잠금과 업무 환경 보안 점검(ISO 27001 7.7, ISMS-P 2.4.7)

PHT-EX-04:
  oneline: 시제품·회로 기판·시험 장비·생물 시료를 짐에 숨겨 반출해 역설계
  summary: |-
    - 내부자나 출입한 외부인은 시제품·회로 기판·시험 장비나 종자·세포 같은 시료를 가방·짐에 숨겨 반출하고 측정·역설계로 설계를 복원할 수 있음
    - 실물은 문서 반출 통제에서 빠지기 쉽고, 하루 빌려 측정하고 돌려놓으면 분실로도 드러나지 않음
  reference: |-
    ■ 물리 관점
    - 대상: 시제품·부품·회로 기판·서버, 시험 장비, 종자·세포 같은 생물 시료, 소재 샘플
    - 조건: 실물 자산 목록·위치 추적 부재, 연구실 반출입 검사 부재, 시료 보관 기록 미흡, 시험 재배지처럼 경계가 느슨한 야외 자산
    - 연계: 반출 주체는 퇴직 직전 반출(PHT-IN-03.1)·협력사 인력(PHT-IN-04)·경계 침입(PHT-PA-01.1) 행에서 평가 — 결과는 기술 유출(PHT-IM-01)
    ■ 실제 사례
    - [실제 사고] 암 연구 시료 은닉 반출 시도(2019-12): 병원 연구실 연구원이 시료 21병을 여행가방 속 양말에 숨겨 출국하려다 공항에서 적발되었고, 생물 시료 소지를 묻는 세관 질문에 거짓으로 답함 (PHI-041)
    - [실제 사고] 협력사 직원의 시험 로봇 팔 가방 반출(2019-01): 연구실에 출입하던 협력사 직원이 로봇 팔을 노트북 가방에 넣어 가져가 측정·촬영한 뒤 다음 날 '찾았다'며 돌려줌 (PHI-038)
    - [실제 사고] 퇴사 통보 뒤 회로 기판·서버 반출(2018-07): 자율주행 프로젝트 엔지니어가 회로 기판과 서버를 가져갔다가 출국 직전 체포 (PHI-036)
    - [실제 사고] 시험 재배지의 비공개 종자 수집(2013-12): 외국 농업 기업 임원 등이 시험 재배지에서 비공개 종자를 몰래 수집해 해외로 보내려 했고, 종자 기업 보안 인력이 의심 행동을 발견 (PHI-042)
  detect: |-
    ■ 탐지
    - 시제품·시험 장비·시료를 자산 목록에 올려 위치·사용자를 추적하고, 정기 실사로 없어진 실물을 확인(NIST PE-20, ISO 27001 5.9)
    - 연구실·시험장 출입구의 반출입 검사와 기록으로 승인 없는 실물 반출을 확인(NIST PE-16, ISMS-P 2.4.6)
    ■ 대응
    - 핵심 실물 자산을 정해 보관 구역 출입을 통제하고, 시료·시제품 사용·반출을 승인·기록(NIST PE-3, ISO 27001 7.2, CERT 1·19)
    - 연구 시료의 국외 반출 신고 의무와 세관 신고 규정을 연구 인력에게 교육
