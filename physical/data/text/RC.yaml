# [RC] 정찰·표적 선정 — 물리 관점 문구
# 작성 규칙: oneline 50자 이내 명사형 · summary 2줄(① 공격자는 … 수 있음 ② 피해·탐지 곤란 사유) ·
#           reference(■ 물리 관점 / ■ 실제 사례) · detect(■ 탐지 / ■ 대응). 사례는 그 행에 매핑된 사고만, 수치는 사고 DB 요약에 있는 것만.
#           방어 자료 — 수법은 식별에 필요한 수준까지만 적고 실행 방법은 쓰지 않음. 참고 문헌은 ■ 물리 관점·■ 대응 끝 '참고:' 줄로만.

PHT-RC-01:
  oneline: 경력 프로필·채용 공고·위치 기록 등 공개정보로 핵심 인력·시설 표적 선정
  summary: |-
    - 공격자는 업무용 SNS 경력, 채용 공고, 논문·보도자료, 운동 기록 앱처럼 조직이 통제하지 못하는 공개정보로 핵심 기술 인력·보안 인가자와 시설 위치를 골라낼 수 있음
    - 열람 자체는 합법이라 막을 수 없고, 표적 명단은 위장 접근·포섭·침입 단계에 가서야 드러남
  reference: |-
    ■ 물리 관점
    - 대상: 핵심 기술 인력·보안 인가자의 경력과 과제 이력, 조직도, 시설 위치·배치(T1589.003·T1591.001·T1591.004·T1593.001)
    - 조건: 임직원 프로필의 과제·설비 상세 공개, 채용 공고·보도자료의 공정·설비 정보, 위치 공유 앱의 기본 공개 설정, 퇴직자 경력란의 기술 서술
    - 연계: 온라인 위장 프로필 접근(PHT-RC-03.1)과 금전 포섭(PHT-HU-01.1)의 표적 선정 단계 — 공급망 SCT-DE-01.2(개발자 대상 가짜 채용·협업 제안)
    - 통제 원칙: 어떤 자산과 인력이 노출되면 위험한지 먼저 정하고, 그 정보가 공개 경로로 새지 않게 줄이는 정보 거부가 출발점
    - 참고: NPSA 〈적대적 정찰〉 · NPSA 〈Secure Innovation〉
    ■ 실제 사례
    - [실제 사고] 방산업체 기술자 8명 신상 조사(2018-09): 외국 국가안전 기관의 지시를 받은 유학생이 포섭 대상이 될 수 있는 과학기술자들(대부분 방산업체 근무)의 신상 보고서를 모아 넘겨 유죄 선고 (PHI-011)
    - [실제 사고] 위장 컨설팅 회사 채용 공고로 이력서 수집(2020-07): 유명 컨설팅 회사와 같은 이름의 위장 회사가 온라인 채용 공고로 이력서 400건(90%가 정부·군 보안 인가자)을 받아 일부를 외국 정보기관에 넘김 (PHI-097)
    - [실제 사고] 운동 기록 앱 히트맵의 군 기지 노출(2018-01): 활동 기록을 모아 공개한 전 세계 히트맵에서 해외 군 기지 위치와 장병 이동 경로가 드러나 각국 군이 위치 기록 공개 설정을 점검 (PHI-077)
  detect: |-
    ■ 탐지
    - 임직원·조직 관련 공개정보를 정기 점검해 핵심 인력 명단·과제·시설 배치처럼 표적 선정에 쓰일 노출을 식별하고, 자사·업종 대상 정찰 동향을 위협 인텔리전스로 수집(ISO 27001 5.7, NIST PM-16)
    - 특정 부서·과제 인력에게 몰리는 외부 연락·채용 제안·인맥 요청을 보고받아 같은 출처의 반복 여부 확인
    ■ 대응
    - 핵심 자산과 그 자산을 다루는 인력을 먼저 정하고, 해당 인력의 공개 프로필·발표·채용 공고에 쓸 수 있는 정보 범위를 정함(CERT 1·7)
    - 공개 웹·보도자료·채용 공고를 게시하기 전에 공정·설비·과제 정보를 검토하고, 위치 공유 앱 사용 기준을 둠(NIST AC-22)
    - 공개정보가 표적 선정에 쓰이는 방식과 의심 접근 신고 경로를 교육(NIST AT-2(3), ISO 27001 6.3, ISMS-P 2.2.4)
    - 참고: NPSA 〈적대적 정찰〉 · NPSA 〈Secure Innovation〉

PHT-RC-02:
  oneline: 시설 주변 배회·반복 촬영으로 경비 체계·출입 동선 파악(적대적 정찰)
  summary: |-
    - 공격자는 시설 주변을 배회하거나 반복 촬영하고 출입 절차·경비 반응을 떠보며 침입·감시·사보타주 계획에 필요한 정보를 모을 수 있음
    - 정찰 단계는 피해가 없어 신고·대응이 느슨하지만, 이때 알아채면 이후 단계 전체를 끊을 수 있는 가장 이른 탐지 지점임
  reference: |-
    ■ 물리 관점
    - 대상: 시설 경계·출입 동선, 경비 교대·순찰 패턴, 감시 장비 사각지대, 군사·기반시설과 주변 교통로
    - 징후(식별 수준): 같은 사람·차량의 반복 출현, 출입구·감시 장비 촬영, 절차를 캐묻는 접근, 관광객·언론인 등을 내세운 해명
    - 통제 원칙: 노출 정보를 줄이고(정보 거부), 정찰 행동을 알아채고(탐지), 보안이 강하다는 인상을 주어 포기하게 함(억지) — 시설 설계 단계부터 자연 감시·영역성 확보
    - 연계: 장비로 수집하면 SV(드론 PHT-SV-01.1 · 은닉 장비 PHT-SV-02.1 · 근접 무선 PHT-SV-03.1), 메신저로 모집된 대리인의 정찰은 PHT-HU-01.3
    - 참고: NPSA 〈적대적 정찰〉 · ISO 22341 〈환경설계를 통한 범죄 예방〉
    ■ 실제 사례
    - [실제 사고] 공군기지·공항 반복 촬영과 관제 무전 감청 시도(2025-03): 외국 국적 고교생 등이 한미 군사시설과 공항에서 이착륙 전투기 등을 수천 장 촬영하다 적발되어, 외국인에게 일반이적죄를 처음 적용한 실형 선고 (PHI-048)
    - [실제 사고] 외국 정보기관 의뢰 감시조의 기지·표적 인물 감시(2025-03): 감시조가 미군 기지 주변을 돌며 촬영하고 언론인 등 표적 인물을 감시하다 공무상 비밀법 위반으로 유죄 (PHI-069)
    - [실제 사고] 군 시설·지원 물자 수송로 정찰과 사보타주 준비(2024-04): 외국 정보요원과 접촉한 거주자가 군 훈련장과 수송로를 감시해 사진·영상을 넘기고 공격할 군 시설을 제안 (PHI-070)
    - [실제 사고] 군사훈련 인근 야간 촬영과 사진 삭제(2024-10): 실사격 훈련 기간 정부 시설 인근에서 발견된 유학생들이 언론인이라고 둘러댔고, 이후 군 차량·장비 사진이 확인되어 기소 (PHI-072)
    - [실제 사고] 국제기구 본부 옆 호텔·차량 거점 정찰(2018-10): 외국 군 정보요원들이 본부 옆 호텔에서 사진을 찍고 본부를 향해 세운 차량에 무선 장비를 실었다가 현지 군 정보기관에 차단 (PHI-062, ATT&CK G0007)
    - [실제 사고] 지원 물자 창고 방화와 추가 표적 정찰(2024-03): 외국 용병 조직과 메신저로 접촉한 일당이 창고에 불을 지르고 다른 업체 두 곳의 정찰도 조직 (PHI-015)
  detect: |-
    ■ 탐지
    - 시설 주변 반복 출현 인물·차량, 출입구·감시 장비 촬영, 절차를 캐묻는 접근을 경비·직원이 보고하는 체계를 두고 감시 영상과 대조(NIST PE-6·PE-6(1), ISO 27001 7.4)
    - 보고된 의심 행동을 같은 기간·장소의 다른 신고와 묶어 반복 정찰 여부를 판단하고 관계 기관과 공유(NIST PM-16)
    ■ 대응
    - 보호구역을 지정하고 경계·시야 차단·조명·자연 감시를 설계해 밖에서 얻을 수 있는 정보를 줄임(ISO 27001 7.1, ISMS-P 2.4.1)
    - 순찰 시간·경로를 불규칙하게 바꾸고 눈에 보이는 보안 활동으로 억지, 의심 인물에게는 정해진 응대 절차로 말을 건 뒤 경찰·관계 기관에 신고
    - 군사·국가중요시설 주변 무단 촬영은 직접 제지보다 기록·신고를 우선해 법적 처리 근거를 남김
    - 참고: NPSA 〈적대적 정찰〉 · ISO 22341 〈환경설계를 통한 범죄 예방〉

PHT-RC-03.1:
  oneline: 헤드헌터·연구자·싱크탱크로 위장한 온라인 프로필의 핵심 인력 접근
  summary: |-
    - 공격자는 업무용 SNS에서 헤드헌터·연구자·싱크탱크 직원으로 위장한 프로필로 채용·강연·자문 기회를 미끼 삼아 핵심 기술 인력과 보안 인가자에게 접근할 수 있음
    - 정상 구인·교류와 구별이 어렵고, 관계가 쌓인 뒤 유료 보고서 요청·해외 초청·대면 포섭으로 넘어가야 위험이 드러남
  reference: |-
    ■ 물리 관점
    - 대상: 핵심 기술 인력, 보안 인가 보유자, 재정난·이직 의사가 드러난 인력(T1585.001 위장 SNS 계정 · T1593.001 SNS 검색 · T1598 정보 피싱)
    - 징후(식별 수준): 경력이 빈약하거나 갑자기 만들어진 프로필, 업무와 무관하게 높은 보수의 자문·보고서 제안, 대화를 개인 메신저나 해외 대면 만남으로 옮기려는 요구
    - 연계: 공개정보 표적 선정(PHT-RC-01) 뒤에 오고 금전 포섭(PHT-HU-01.1)으로 이어짐 — 공급망 SCT-DE-01.2(가짜 채용·협업 제안), AI AI-01-08(AI 생성 피싱·신뢰 주체 사칭)
    - 통제 원칙: 접속 수락 전에 상대 프로필을 점검하고, 업무 관련 접근은 개인이 혼자 판단하지 않고 보안 부서에 알리는 구조
    - 참고: NPSA 〈Think Before You Link〉 · NPSA 〈Trusted Research〉
    ■ 실제 사례
    - [실제 사고] 전직 정보기관 요원의 업무용 SNS 헤드헌터 접근 후 기밀 판매(2017-06): 빚을 진 전직 요원에게 싱크탱크 소속이라는 헤드헌터가 접근했고, 요원은 돈을 받고 외국 정보요원에게 기밀을 팔아 징역 20년을 선고받음 (PHI-010)
    - [실제 사고] 위장 컨설팅 회사의 업무용 SNS 물색(2020-07): 위장 회사 채용 공고로 보안 인가자 이력서를 모으고 업무용 SNS로 재정난을 겪던 사업 관계자를 물색해 외국 정보기관에 넘김 (PHI-097)
    - [정부 경보] 위장 헤드헌터·싱크탱크 프로필 1만 명 이상 접근 경고(2017-12): 독일 연방헌법보호청이 9개월 조사 결과 가짜 프로필 사례를 공개하며 관계를 맺은 뒤 해외 방문을 권유하는 수법을 경고 (PHI-090)
    - [정부 경보] 업무용 SNS 위장 접근 1만 건 이상 경고와 점검 앱 공개(2021-04): 영국 MI5가 채용·강연·사업 기회를 미끼로 한 위장 접근을 경고하고, 접속 전 상대를 점검하도록 돕는 앱이 공개됨 (PHI-068)
  detect: |-
    ■ 탐지
    - 핵심 인력이 받은 업무 관련 외부 접근(채용·자문·강연·유료 보고서 요청)을 보안 부서에 알리는 신고 경로를 두고 같은 프로필·회사명의 반복 접근을 확인(ISO 27001 6.8)
    - 업종 대상 위장 프로필·위장 회사 정보를 정부 경보·위협 인텔리전스로 받아 임직원에게 공유(NIST PM-16)
    ■ 대응
    - 핵심 인력 대상 정기 교육에 위장 프로필 식별 요령과 해외 초청·유료 보고서 요청 같은 위험 신호를 포함(NIST AT-2(3), ISO 27001 6.3, ISMS-P 2.2.4, CERT 7·9)
    - 업무용 SNS 프로필에 과제·보안 인가·설비 정보를 쓰지 않는 기준을 정하고, 의심 접근은 차단·신고 후 대화 기록을 보존
    - 참고: NPSA 〈Think Before You Link〉 · NPSA 〈Trusted Research〉

PHT-RC-03.2:
  oneline: 학회 초청·면접·거래 상담을 가장한 대면 질의로 공정·설계 노하우 유도
  summary: |-
    - 공격자는 학회·강연 초청, 채용 면접, 투자·거래 상담을 명목으로 연구자·기술자를 만나 공정·설계 노하우와 연구 성과를 캐물을 수 있음
    - 대화로 나가는 정보는 문서 반출처럼 남지 않고, 초청·사례금이 반복되며 협력·포섭으로 넘어가는 과정이 자연스러워 보임
  reference: |-
    ■ 물리 관점
    - 대상: 공정·설계 노하우, 미공개 연구 성과, 연구 인력의 관심사·처지
    - 징후(식별 수준): 발표 범위를 넘는 상세 질문, 체재비·사례금을 넉넉히 주는 해외 강연 초청, 면접에서 현 직장 공정을 묻는 질의, 투자자를 자처한 반복 면담
    - 연계: 공동연구·인재 유치 위장(PHT-HU-03)과 금전 포섭(PHT-HU-01.1)으로 이어짐 — ATT&CK은 전자 수단의 정보 피싱만 정의해 대면 질의는 미연계
    - 통제 원칙: 외부 발표·면담 전에 말할 수 있는 범위를 정하고, 다녀온 뒤 접촉 내용을 보고하는 절차로 개인 판단에 맡기지 않음
    - 참고: NPSA 〈Trusted Research〉 · NPSA 〈Secure Innovation〉
    ■ 실제 사례
    - [실제 사고] 대학 강연 초청을 가장한 항공기 엔진 기술 탈취 시도(2018-10): 정보요원이 위장 회사·대학을 내세워 항공 기업 직원을 강연 명목으로 초청해 체재비·사례금을 주며 정보를 요구했고, 직원의 협조로 체포되어 징역 20년 선고 (PHI-012)
    - [실제 사고] 투자자로 위장한 공작원들의 호텔 면담(2019-01): 스파이웨어 실태를 공개해 온 연구소 연구원들에게 투자자를 사칭한 남성들이 두 달 새 두 차례 접근해 호텔 면담에서 연구 내용을 캐물었고, 연구소가 역추적해 공개 (PHI-093)
  detect: |-
    ■ 탐지
    - 해외 강연·학회 초청과 외부 면담 일정, 다녀온 뒤 받은 질문을 보고받아 발표 범위를 넘는 반복 질의·같은 초청 주체를 확인
    - 면접·거래 상담에서 상대가 요구한 자료와 질문 목록을 기록해 상담 목적과 맞지 않는 기술 질의를 식별
    ■ 대응
    - 외부 발표·면담 전에 공개 가능 범위를 검토하고 비밀유지 계약과 자료 전달 기준을 둠(ISO 27001 5.14·6.6, ISMS-P 2.2.3)
    - 연구 인력 교육에 정보 유도 대화의 특징과 해외 초청·사례금 신고 기준을 포함(NIST AT-2(3), ISO 27001 6.3, ISMS-P 2.2.4, CERT 7·9)
    - 의심 접촉은 보안 부서·수사기관과 협의해 대응하고 위협 정보를 업종과 공유(NIST PM-16)
    - 참고: NPSA 〈Trusted Research〉 · NPSA 〈Secure Innovation〉
