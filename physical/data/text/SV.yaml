# [SV] 감시·도청·무단촬영 — 물리 관점 문구
# 작성 규칙: oneline 50자 이내 명사형 · summary 2줄(① 공격자는 … 수 있음 ② 피해·탐지 곤란 사유) ·
#           reference(■ 물리 관점 / ■ 실제 사례) · detect(■ 탐지 / ■ 대응). 사례는 그 행에 매핑된 사고만, 수치는 사고 DB 요약에 있는 것만.
#           드론은 탐지·식별·신고·차폐만 권고하고 기체 무력화·전파 교란은 권고하지 않음(법적 권한 있는 기관의 영역).

PHT-SV-01.1:
  oneline: 시판 드론으로 울타리 밖에서 시설 배치·함정·정부 청사 무단 촬영
  summary: |-
    - 공격자는 시판 드론을 울타리 밖이나 시설 상공에 띄워 시설 배치·옥외 설비·정박 함정·정부 청사를 촬영하고 영상을 온라인에 올릴 수 있음
    - 비행이 몇 분이면 끝나고 조종자가 멀리 있어 현장에서 붙잡기 어려우며, 관광·취미 촬영이라는 해명과 구별하기 어려움
  reference: |-
    ■ 물리 관점
    - 대상: 시설 배치·옥외 설비, 건조·정박 중인 함정, 공항·정부 청사, 국가중요시설 주변
    - 징후(식별 수준): 시설 상공·경계 밖의 반복 비행, 같은 장소를 맴도는 체공, 시설 쪽을 향한 촬영, 인근 차량·인물에서의 조종
    - 통제 원칙: 위험평가로 상공에서 보이는 자산을 파악하고 물리 가림과 탐지·식별·신고 절차를 준비 — 기체 무력화·전파 교란은 법적 권한이 있는 기관의 영역(전파법·항공안전법)
    - 연계: 반복 출현·운영 방해는 PHT-SV-01.2, 사람이 하는 현장 답사는 PHT-RC-02 — ATT&CK에는 무인기 수집 기법이 없음
    - 참고: NPSA 〈대드론 — 시설 대비〉 · CISA 〈무인기(UAS) 지침〉
    ■ 실제 사례
    - [실제 사고] 해군기지·정박 항공모함 드론 반복 촬영(2024-06): 유학생들이 해군작전사령부 일대에서 드론을 띄워 기지 내부와 정박한 항공모함을 촬영해 사진 약 170장·영상 22개를 남겼고, 외국인 최초로 일반이적 혐의가 적용되어 1심 실형 (PHI-049)
    - [실제 사고] 국가정보원 청사 드론 촬영(2024-11): 관광객이 비행금지구역에서 문화유산을 찍다 정보기관 건물을 촬영해 항공안전법 위반으로 체포 (PHI-050)
    - [실제 사고] 군함 건조 조선소 드론 촬영(2024-01): 유학생이 항공모함·잠수함을 건조하는 조선소 상공에서 건조 중인 함정을 찍다 드론이 나무에 걸려 발각되었고, 출국하려다 체포되어 실형 (PHI-051)
    - [실제 사고] 해군기지 정박 호위함 드론 촬영 영상 게시(2024-05): 외국 동영상 사이트에 기지에 정박한 호위함을 찍었다는 영상이 올라왔고, 방위성이 조작 가능성이 매우 낮다고 밝히며 대드론 대응 강화를 지시 (PHI-052)
    - [실제 사고] 해상 가스전 인근 드론과 촬영물 소지 외국인 체포(2022-10): 가스관 손상 뒤 석유·가스 시설 인근 드론 목격이 잇따르고 드론·사진을 지닌 외국인들이 체포되었으나, 취미 비행이라는 이유의 무죄로 법적 대응의 한계도 드러남 (PHI-060)
  detect: |-
    ■ 탐지
    - 시설 위험평가로 상공에서 보이는 자산과 접근 방향을 정하고, 승인된 탐지 장비·감시 인력으로 비행을 탐지·추적·식별(NIST PE-6·PE-6(1), ISO 27001 7.4)
    - 목격 시각·위치·기체 특징·조종자 추정 위치를 기록하는 신고 양식을 두고, 반복 출현 패턴을 관계 기관과 공유(NIST PM-16)
    ■ 대응
    - 보호구역을 지정하고 옥외 설비·작업 구역은 가림막·지붕·배치 조정으로 상공 시야에서 가림(ISO 27001 7.1, ISMS-P 2.4.1)
    - 무단 비행은 경찰·군·항공 당국에 신고해 조종자 확인과 법적 처리를 맡기고, 기체 무력화·전파 교란은 권한 있는 기관만 함
    - 참고: NPSA 〈대드론 — 시설 대비〉 · CISA 〈무인기(UAS) 지침〉

PHT-SV-01.2:
  oneline: 공항·원전·군 기지 상공 드론 반복 출현으로 운항 중단·충돌 위험
  summary: |-
    - 공격자는 공항·원전·군 기지 같은 통제 공역에 드론을 반복해 띄워 운항을 멈추게 하거나 시설 대응을 떠볼 수 있고, 부주의한 취미 비행도 항공기와 충돌할 수 있음
    - 야간·원거리 비행은 기체와 조종자를 확인하기 어려워 대부분 배후가 특정되지 않고, 목격 신고만으로도 활주로를 닫아야 해 피해가 커짐
  reference: |-
    ■ 물리 관점
    - 대상: 공항 활주로·접근 공역, 원전·가스 시설 상공, 군 기지, 산불 진화 같은 비행 제한 구역
    - 조건: 목격 신고를 판단할 탐지·식별 수단 부재, 시설·항공 당국·경찰 간 연락 체계 미비, 반복 출현을 묶어 보는 정보 공유 부재
    - 통제 원칙: 출현 시 운항·작업 중단과 재개 기준, 연락 체계를 미리 정한 대응 계획 — 기체 무력화·전파 교란은 법적 권한이 있는 기관만 함(전파법·항공안전법)
    - 연계: 운영 중단은 PHT-IM-03, 충돌·안전 위협은 PHT-IM-04에서 평가 — 무단 촬영은 PHT-SV-01.1
    - 참고: NPSA 〈대드론 — 시설 대비〉 · CISA 〈무인기(UAS) 지침〉
    ■ 실제 사례
    - [실제 사고] 이틀 연속 드론 목격으로 국제공항 활주로 폐쇄(2025-10): 밤사이 드론이 잇따라 목격되어 약 7시간 운항이 중단되고 다음 날 밤에도 두 활주로가 닫혔으나, 야간이라 기체와 출처를 확인하지 못함 (PHI-055)
    - [실제 사고] 대형 드론 출현으로 수도 공항 운항 중단(2025-09): 공항 인근에 대형 드론 여러 대가 나타나 약 35편이 회항하고 같은 시각 인접국 공항도 닫혔으며, 경찰은 숙련된 조종자의 비행으로 봤으나 기체를 회수하지 못함 (PHI-054)
    - [실제 사고] 공항 활주로 인근 드론 반복 출현으로 장시간 운항 중단(2018-12): 유일한 활주로가 닫혀 항공편 1,000편·승객 14만 명이 영향을 받았고, 목격 신고 67건이 확인됐지만 조종자는 특정되지 않음 (PHI-053)
    - [실제 사고] 영국 내 미 공군 기지 상공 소형 드론 연속 침입(2024-11): 여러 기지 주변과 상공에 크기·형태가 다른 드론이 며칠간 침입해 대드론 체계를 투입하고 조사했으나 배후는 특정되지 않음 (PHI-056)
    - [실제 사고] 원전 상공 소형 드론 연쇄 출현(2014-10): 한 달 사이 원전 13곳의 경비원이 소형 드론을 목격했고, 운영사가 사건마다 신원 미상자를 고발 (PHI-057)
    - [실제 사고] 산불 진화 비행 제한 구역의 취미 드론과 소방 항공기 충돌(2025-01): 민간 드론이 물을 뿌리던 소방 항공기 날개에 구멍을 내 항공기를 며칠간 운용하지 못했고, 조종자는 불안전 운항 혐의를 인정 (PHI-061)
  detect: |-
    ■ 탐지
    - 승인된 탐지 장비와 감시 인력으로 시설 주변 공역의 비행을 탐지·추적하고, 목격 신고를 시각·방향·기체 특징으로 기록해 신뢰도를 판단(NIST PE-6, ISO 27001 7.4)
    - 같은 시설·인근 시설의 출현 기록을 관계 기관과 공유해 반복 출현과 조직적 비행을 식별
    ■ 대응
    - 드론 출현을 사고 유형으로 대응 계획에 넣어 운항·작업 중단과 재개 기준, 항공 당국·경찰·군 연락 체계를 정하고 훈련(NIST CP-2, ISO 27001 5.24, ISMS-P 2.11.1)
    - 출현 시 사고 대응 절차로 기록·신고·영향 범위를 관리하고, 기체 무력화·전파 교란은 권한 있는 기관에 맡김(NIST IR-4)
    - 시설 주변 비행 제한 안내와 관계 기관의 비행 금지 구역 지정 협의로 부주의 비행을 줄임(ISMS-P 2.4.1)
    - 참고: NPSA 〈대드론 — 시설 대비〉 · CISA 〈무인기(UAS) 지침〉

PHT-SV-02.1:
  oneline: 회의실·집무실과 철도·물류 경로에 위장 카메라·도청 장비를 숨겨 장기 수집
  summary: |-
    - 공격자는 회의실·집무실이나 철도·물류 경로 주변에 일상 사물로 위장한 카메라·도청 장비를 숨겨 두고 대화·이동 정보를 장기간 수집할 수 있음
    - 설치 뒤에는 공격자가 현장에 없어 발견 전까지 피해가 이어지고, 메신저로 모집한 현지인이 설치하면 배후 추적이 어려움
  reference: |-
    ■ 물리 관점
    - 대상: 경영진 회의실·집무실, 수송 철도·공항·물류 경로, 군 기지 주변, 생산 현장
    - 조건: 회의실 정기 점검 부재, 청소·시설 정비 인력의 보호구역 출입 관리 미흡, 수송 경로 주변 감시 부재, 위장 장치에 대한 인식 부족
    - 연계: 대리인 모집(PHT-HU-01.3)으로 설치 인력을 구하고 근접 무선 가로채기(PHT-SV-03.1)와 함께 쓰임 — ATT&CK의 음성·영상 수집 기법은 침해 단말의 주변기기 이용이라 미연계
    ■ 실제 사례
    - [실제 사고] 철도 노선 은닉 카메라 스파이망(2023-03): 지원 물자 수송 철도 구간과 공항 인근에 카메라를 숨겨 열차 이동을 촬영·전송한 조직이 메신저 지시와 가상화폐 보수로 움직이다 적발되어 14명 유죄 (PHI-014)
    - [실제 사고] 감시조의 위장 은닉 카메라(2025-03): 외국 정보기관 의뢰 감시조가 병·가짜 돌·새집으로 위장한 카메라를 만들어 표적을 감시했고, 압수품에 녹화 장치 55개가 있었음 (PHI-069)
    - [실제 사고] 군 최고 지휘관 사용 예정 사무실의 도청 장비 발견(2023-12): 정기 점검에서 총사령관이 쓸 예정이던 사무실의 정보 수집 장비 부품을 찾아 수사에 착수 (PHI-071)
  detect: |-
    ■ 탐지
    - 경영진 회의실·집무실은 중요 회의 전과 정기적으로 도청·은닉 카메라 점검을 하고 결과를 기록(NIST PE-6, ISO 27001 7.4)
    - 수송 경로·시설 주변에 새로 생긴 사물·장치와 설치 흔적을 순찰로 확인하고, 발견 시 현장을 보존해 신고
    ■ 대응
    - 보호구역 지정과 회의실 출입통제, 청소·정비 인력의 보호구역 작업 승인·동행으로 설치 기회를 줄임(NIST PE-3, ISO 27001 7.3·7.6, ISMS-P 2.4.1·2.4.5)
    - 발견한 장비는 직접 제거하지 않고 수사기관에 신고해 증거를 보존한 뒤 설치 경로를 조사

PHT-SV-02.2:
  oneline: 시계·안경형 소형 카메라를 보안 구역에 들고 들어가 화면·문서 몰래 촬영
  summary: |-
    - 공격자나 포섭된 내부자는 시계·안경·펜 모양의 소형 카메라를 보안 구역에 들고 들어가 단말 화면·문서·설비를 몰래 찍을 수 있음
    - 일상 소지품과 구별이 어려워 반입 검색을 지나치기 쉽고, 촬영물은 장치에 저장되어 네트워크 감시에 걸리지 않음
  reference: |-
    ■ 물리 관점
    - 대상: 보안 단말 화면, 기밀 문서, 생산 설비, 출입·잠금 해제 때 입력하는 비밀번호·PIN
    - 조건: 촬영 기기 반입 통제가 휴대폰에만 맞춰진 규정, 보안 구역 반입 확인 부재, 클린 데스크·화면 보호 미흡
    - 연계: 금전 포섭(PHT-HU-01.1)된 내부자가 반입하는 경우가 많고, 휴대폰 촬영 반출(PHT-EX-03)과 같은 결과로 이어짐
    ■ 실제 사례
    - [실제 사고] 현역 장교 가상화폐 포섭과 시계형 몰래카메라 반입(2022-04): 외국 공작원 지령을 받은 거래소 운영자가 가상화폐로 현역 장교를 포섭했고, 장교는 운영자가 보낸 시계형 몰래카메라를 군부대에 반입 (PHI-008)
    - [실제 사고] 카메라를 숨긴 선글라스로 기내 표적의 휴대폰 PIN 녹화(2025-03): 외국 정보기관 의뢰 감시조의 한 명이 카메라가 숨겨진 선글라스로 옆자리 표적의 휴대폰 PIN을 녹화한 사실이 재판에서 드러남 (PHI-069)
  detect: |-
    ■ 탐지
    - 보안 구역 출입 때 촬영 기능이 있는 소지품(시계·안경·펜 등)을 확인하고, 구역 안 감시 영상으로 화면·문서를 향한 이상 행동을 확인(NIST PE-6)
    - 반입 신고와 실제 소지품이 다르거나 규정을 반복해 어기는 사례를 기록해 내부자 위험 관리와 연계
    ■ 대응
    - 보안 구역 규칙에 촬영 기능 기기 전체의 반입 제한을 명시하고 출입 서약으로 알림(NIST PL-4·PE-3, ISO 27001 7.6, ISMS-P 2.4.6, CERT 3)
    - 클린 데스크·화면 잠금과 업무 환경 보안 점검으로 노출 기회를 줄임(ISO 27001 7.7, ISMS-P 2.4.7)

PHT-SV-03.1:
  oneline: 시설 근처 차량·인접 건물에서 사내 Wi-Fi 침투·가짜 기지국으로 통신 가로채기
  summary: |-
    - 공격자는 시설 근처 차량·호텔이나 먼저 침해한 인접 건물의 장비로 사내 Wi-Fi에 접속하거나, 가짜 접속망·가짜 기지국을 띄워 임직원 통신과 자격증명을 가로챌 수 있음
    - 무선은 벽을 넘어 닿아 출입통제가 소용없고, Wi-Fi는 인터넷 노출 자원과 달리 MFA 없이 열리는 경우가 많아 원격 침투 통제를 비켜 감
  reference: |-
    ■ 물리 관점
    - 대상: 사내 무선망, 임직원 휴대폰 통신, 공항·기내 공용 Wi-Fi 이용자, 관제·업무 무전(T1669 Wi-Fi 네트워크 · T1557 중간자 · T1040 네트워크 스니핑)
    - 조건: 건물 밖까지 닿는 무선 신호, 비밀번호만으로 열리는 Wi-Fi, 무단 접속점·가짜 기지국 탐지 부재, 공용 Wi-Fi에서의 업무 접속
    - 연계: OT OTC-IA-06(무선 통신 침해)·OTC-CO-10(무선 스니핑) — 내부망 확산 이후는 아이덴티티·클라우드 매트릭스에서 평가
    ■ 실제 사례
    - [실제 사고] 인근 조직을 먼저 침해해 그 Wi-Fi 장치로 표적 무선망 접속(2024-11): 공격자가 표적 근처 조직들을 차례로 침해해 무선 어댑터가 있는 시스템을 찾은 뒤 표적 Wi-Fi에 접속했고, 인터넷 노출 자원과 달리 Wi-Fi는 MFA 없이 열렸음 (PHI-063, ATT&CK C0051)
    - [실제 사고] 국제기구 본부 옆 차량의 Wi-Fi 장비로 근접 침투 시도(2018-10): 외국 군 정보요원들이 본부를 향해 세운 렌터카에 Wi-Fi 통신을 가로채거나 조작할 장비를 실었다가 현장에서 차단 (PHI-062, ATT&CK G0007)
    - [실제 사고] 공항·기내 가짜 무료 Wi-Fi로 자격증명 수집(2024-07): 공용 Wi-Fi를 흉내 낸 가짜 접속망을 공항과 국내선에 띄워 다른 사람의 자격증명과 개인 자료를 수집했고, 항공사 직원의 신고로 적발 (PHI-065)
    - [실제 사고] 감시조의 기지 휴대폰 신호 가로채기(2025-03): 외국 정보기관 의뢰 감시조가 미군 기지 주변을 돌며 가짜 기지국 장비로 기지 안 휴대폰 신호를 가로챔 (PHI-069)
    - [실제 사고] 군 관제 무전 감청 시도(2025-03): 공군기지를 반복 촬영하던 외국인들이 무전기로 관제사·조종사 교신 감청을 두 차례 시도했으나 주파수를 맞추지 못함 (PHI-048)
    - [정부 경보] 수도권 정부 시설 주변 가짜 기지국 의심 활동 확인(2018-04): 정부가 수도권에서 가짜 기지국과 일치하는 이상 활동을 관측했다고 처음 공식 인정했으나 장치·주체를 특정하지 못함 (PHI-064)
  detect: |-
    ■ 탐지
    - 무선 침입 탐지로 무단 접속점·사칭 접속망과 비정상 접속 기기를 찾고, 시설 주변의 가짜 기지국 의심 신호를 점검(NIST SI-4(14)·SC-40)
    - Wi-Fi 접속 기록에서 낯선 기기와 평소와 다른 신호 위치를 확인하고, 인접 건물·주차 구역 쪽 신호를 순찰 결과와 대조
    ■ 대응
    - 사내 Wi-Fi는 기기 인증서 기반 인증과 망 분리로 열고, 신호가 건물 밖으로 새지 않게 출력·배치를 조정(NIST AC-18, ISO 27001 7.8, ISMS-P 2.6.1)
    - 출장·공용 Wi-Fi에서는 사내 보안 접속만 쓰도록 하고, 관제·업무 무전은 암호화 장비를 씀

PHT-SV-03.2:
  oneline: 망분리 단말의 전자파·음향 신호를 근거리에서 받아 자료 유출
  summary: |-
    - 공격자는 이미 감염시킨 망분리 단말이나 암호 장비가 내는 전자파·음향 같은 부수 신호를 근처에서 받아 파일·키 입력·암호 키를 빼낼 수 있음
    - 공개 사례는 연구 실증이 대부분이고 최초 감염·근접 수신이 전제되어 위험은 제한적이지만, 망분리만 믿는 시설은 이 경로의 통제가 비어 있음
  reference: |-
    ■ 물리 관점
    - 대상: 망분리·폐쇄망 단말, 암호 장비, 고밀도 자료를 다루는 보안 구역
    - 조건: 보안 구역 가까이까지 사람·차량이 접근할 수 있는 배치, 신호 차폐·이격 거리 기준 부재, 망분리 단말의 최초 감염(악성 USB·내부자 협조)
    - 연계: 최초 감염 경로는 악성 USB(PHT-PA-03.2)·내부자(PHT-IN-02.1) — ATT&CK은 부채널 수집을 정의하지 않음
    ■ 실제 사례
    - [실증] 망분리 PC의 메모리 버스 전파로 자료 유출(2024-09): 연구진이 감염된 망분리 컴퓨터가 내는 전자파를 저가 소프트웨어 정의 라디오와 단순한 안테나로 받아 파일·키 입력·암호 키를 초당 최대 1,000비트로 빼낼 수 있음을 실증 (PHI-092)
    - 공개 사고 미확인 — 기업·기관 대상 전자파·음향 부채널 유출이 실제 사고로 확인된 공개 사례는 찾지 못함(근접 수신·최초 감염이 전제되고 사고가 나도 경위가 공개되지 않는 영역)
  detect: |-
    ■ 탐지
    - 망분리 단말의 USB·주변기기 연결과 비정상 프로세스를 점검해 부채널 유출의 전제인 최초 감염을 찾음
    - 보안 구역 주변에 오래 머무는 차량·인물과 설치된 수신 장치를 순찰로 확인
    ■ 대응
    - 고위험 자료를 다루는 구역은 정보 유출 신호 차폐와 이격 거리를 기준으로 단말·장비를 배치(NIST PE-19·PE-19(1), ISO 27001 7.8, ISMS-P 2.4.3)
    - 망분리 단말의 매체 반입 통제를 함께 두어 최초 감염 경로를 막음

PHT-SV-04.1:
  oneline: 들고 다니는 기밀 문서·노트북 화면이 망원렌즈·어깨 너머로 노출
  summary: |-
    - 공격자는 공개 장소·이동 중에 드러난 기밀 문서나 노트북 화면을 망원렌즈로 찍거나 어깨 너머로 볼 수 있음
    - 노출은 짧은 순간이라 당사자가 알아채기 어렵고, 사진 한 장이 공개되면 작전·계획을 바꿔야 할 만큼 피해가 생김
  reference: |-
    ■ 물리 관점
    - 대상: 이동 중 휴대하는 기밀 문서, 노트북·태블릿 화면, 회의실 화이트보드·창가 화면
    - 조건: 문서를 덮개 없이 들고 다니는 습관, 공공장소·교통수단에서의 업무, 창가 배치·화면 보호 필름 미사용
    - 연계: 비의도 내부자의 부주의 노출(PHT-IN-05.2)과 겹치고 결과는 기밀 유출(PHT-IM-01)
    ■ 실제 사례
    - [실제 사고] 대테러 작전 문서가 사진기자 망원렌즈에 찍힘(2009-04): 책임자가 '비밀' 표시 문서를 보이게 든 채 관저에 들어가 고위 경찰 명단·급습 계획이 읽혔고, 계획을 앞당겨 12명을 체포한 뒤 책임자가 사임 (PHI-076)
  detect: |-
    ■ 탐지
    - 보안 점검에서 창가·공용 공간의 화면 노출, 방치된 문서, 지우지 않은 화이트보드를 확인해 기록
    - 기밀 문서 휴대·반출 기록을 두고 외부 노출 사건이 생기면 바로 신고받아 영향 범위를 판단
    ■ 대응
    - 기밀 문서는 불투명 봉투·잠금 가방으로 운반하고 반출을 승인·기록(NIST MP-5)
    - 클린 데스크·화면 잠금·화면 보호 필름과 공공장소 업무 기준을 정하고 정기 교육(NIST AC-11, ISO 27001 7.7, ISMS-P 2.4.7, CERT 9)

PHT-SV-04.2:
  oneline: 제대로 파기하지 않은 폐기 서버·하드디스크·문서에서 정보 회수·재판매
  summary: |-
    - 공격자나 처리 업체는 완전히 지우지 않고 버린 서버·하드디스크·단말과 파쇄하지 않은 문서에서 고객·기술 정보를 되살려 쓰거나 팔 수 있음
    - 폐기 뒤에는 자산이 목록에서 빠져 추적이 끊기고, 처리 업체가 되팔면 유출 사실을 수년 뒤에야 알게 됨
  reference: |-
    ■ 물리 관점
    - 대상: 폐기·임대 반납 저장매체와 장비, 파쇄 전 문서, 복합기 등 장비에 남은 저장 공간
    - 조건: 파기 경험이 없는 업체에 폐기 위탁, 파기 증명·현장 확인 부재, 폐기 단계의 자산 추적 단절
    - 연계: 수명이 끝난 자산의 관리 공백 — 폐기 업체는 공급망 관리 대상
    ■ 실제 사례
    - [실제 사고] 폐기 위탁 서버·하드디스크가 고객 정보가 남은 채 재판매(2022-09): 파기 경험이 없는 이사·보관 업체에 고객 약 1,500만 명의 정보가 담긴 장비 폐기를 맡겼다가 장비가 온라인에서 재판매되어 감독기관이 벌금 3,500만 달러를 부과 (PHI-078)
  detect: |-
    ■ 탐지
    - 폐기 대상 자산의 목록·일련번호를 파기 증명과 대조해 파기되지 않은 채 사라진 자산을 찾음
    - 폐기 업체 작업을 표본 현장 점검하고, 재판매 시장에 자사 장비가 나오는지 확인
    ■ 대응
    - 저장매체는 재사용·폐기 전에 복구할 수 없게 파기하고 파기 증명을 남김(NIST MP-6, ISO 27001 7.10·7.14, ISMS-P 2.10.7)
    - 파기 역량이 확인된 업체만 쓰고 계약에 파기 방법·증명·감사를 넣음(NIST SR-12)
