- id: PHI-068
  title: 업무용 SNS 위장 프로필 접근 1만 건 이상 경고와 점검 앱 공개
  date: "2021-04"
  kind: 정부 경보
  verification: 정부·사법 확인
  region: 유럽
  sector: [정부·군, 대학·연구기관, IT·소프트웨어]
  actor: 외국 정보기관
  actor_type: [외부자]
  impact: [국가기밀·군사정보 유출]
  summary: >-
    영국 MI5는 외국 정보기관이 LinkedIn 등 업무용 SNS에서 위장 프로필로 접근한 사례를 1만 건 이상 확인했다고 경고했다. 위장 프로필은 정부·첨단기술
    기업·학계 인력에게 채용·강연·사업 기회를 미끼로 관계를 맺어 국가안보 관련 정보를 끌어내는 데 쓰였고, CPNI는 접속 전 상대를 점검하도록
    돕는 앱을 내놨다.
  pht: [PHT-RC-03.1]
  sources:
    - BBC(2021) MI5 warns of spies using LinkedIn to trick staff into spilling secrets | https://bbc.in/3argIDF
    - Dark Reading(2021) Foreign Spies Target British Nationals With Fake Social Media Profiles | https://www.darkreading.com/cyberattacks-data-breaches/foreign-spies-target-british-nationals-with-fake-social-media-profiles
