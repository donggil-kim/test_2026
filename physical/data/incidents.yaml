- id: PHI-066
  title: 이중화된 철도 무선통신 광케이블 2곳 동시 절단으로 북부 철도 운행 마비
  date: "2022-10"
  kind: 사고
  verification: 정부·사법 확인
  legal: 수사·조사
  region: 유럽
  sector: [교통·공항·물류]
  actor: 미상(철도 통신 지식 보유 추정)
  actor_type: [외부자]
  impact: [설비 손상·사보타주, 운영 중단]
  summary: >-
    2022-10-08 독일 철도 무선통신(GSM-R)용으로 이중화된 광케이블 두 곳(헤르네·베를린 카로)이 잘려 니더작센·브레멘·함부르크·슐레스비히홀슈타인
    철도 운행이 약 3시간 멈췄다. 교통부 장관은 공격으로 규정했고, 수사 당국은 데이터 케이블과 철도 무선통신에 대한 상당한 기술 지식을 가진
    범인이 조직적으로 절단한 것으로 봤다.
  pht: [PHT-IM-02, PHT-IM-03]
  sources:
    - RTHK·AFP(2022) Sabotage blamed for major German rail disruption | https://news.rthk.hk/rthk/en/component/k2/1670178-20221008.htm
    - Trains(2022) Sabotage blamed for disruption to German rail operations | https://www.trains.com/trn/news-reviews/news-wire/sabotage-blamed-for-disruption-to-german-rail-operations/feed

- id: PHI-067
  title: 올림픽 개막 당일 고속철 신호 설비 동시다발 방화(승객 80만 명 영향)
  date: "2024-07"
  kind: 사고
  verification: 피해기관 확인
  legal: 수사·조사
  region: 유럽
  sector: [교통·공항·물류]
  actor: 미상
  actor_type: [외부자]
  impact: [설비 손상·사보타주, 운영 중단]
  summary: >-
    파리 올림픽 개막 당일인 2024-07-26 새벽 프랑스 고속철(TGV) 대서양·북부·동부 노선의 신호 박스·전기 설비 5곳이 동시다발로 훼손되거나 훼손 시도를
    당했다. 국영철도공사는 TGV망을 마비시키려는 대규모 공격이라고 밝혔고 승객 80만 명이 영향을 받았으며 복구는 주말까지 이어졌다.
  pht: [PHT-IM-02, PHT-IM-03]
  sources:
    - Gulf News·AFP(2024) France's high-speed railway hit by sabotage ahead of Paris Olympics opening | https://gulfnews.com/sport/olympics/frances-high-speed-railway-hit-by-sabotage-ahead-of-paris-olympics-opening-1.1721981430787
    - Channels TV(2024) Olympics under heavy security after France's high-speed railway hit | https://www.channelstv.com/2024/07/26/olympics-under-heavy-security-after-frances-high-speed-railway-hit/

