# 물리·인적 보안사고 DB — 공개 출처 기반(정부·사법 발표, 기소·판결, 피해 기관 발표, 보안업체 분석, 공신력 있는 보도)
#
# 필드
#   date          사고 인지·공개 시점 YYYY-MM (경위가 크게 앞서면 요약에 적음)
#   kind          사고 · 캠페인 · 공시 · 사례연구(익명) · 정부 경보 · 위협인텔 · 연구·시연
#   verification  정부·사법 확인 · 피해기관 확인 · 보안업체·연구기관 분석 · 언론 보도 · 행위자 주장 · 논란·원인 번복
#   legal         (선택) 법적 처리 — 수사·조사 · 기소 · 유죄 판결 · 무죄·불기소 · 민사 판결·합의 · 행정 처분 · 해당 없음
#   region        피해 지역(한국·미국·유럽·일본·대만·기타·글로벌) — '한국'은 국내 사례 집계에 사용
#   sector        피해 업종(scripts/taxonomy_rules.py SECTORS)
#   actor         행위자(공개 귀속, 개인은 실명 대신 '전 직원' 등으로 익명화)
#   actor_type    위협 주체 유형(외부자 · 내부자(악의) · 내부자(비의도) · 공모 · 제3자)
#   impact        결과 유형(scripts/taxonomy_rules.py IMPACTS)
#   summary       경위·결과 요약(분석가 작성, 수치는 출처 기준). 공격 실행 세부 대신 경위·피해·탐지 계기 중심
#   pht           매핑 세부위협(분석 매핑) — data/taxonomy.yaml의 Lv3 ID
#   attack_ref    (선택) ATT&CK v19.2 그룹·소프트웨어·캠페인 ID(대조·표시용, 자동 매핑에 쓰지 않음)
#   origin        (선택) 다른 매트릭스 사고 DB의 같은 사고 ID(IDI- 아이덴티티 · SCI- 공급망 · INC- 클라우드) — 재인용 추적용
#   sources       '출처 | URL' — 1차 출처를 직접 열지 못하면 확인 수준(verification)을 낮춰 기록하고 원 출처 URL을 함께 적음
#
# 집계 규칙(scripts/taxonomy_rules.py): 실제 사고 = kind ∈ {사고·캠페인·공시·사례연구(익명)}이면서
#   verification ∉ {행위자 주장·논란·원인 번복}. 정부 경보·위협인텔은 실사용 근거, 연구·시연은 실증 근거로만('중' 상한) 반영.
#   여러 조직을 겨냥한 같은 수법의 공격은 캠페인 1건으로 묶음. 정부 통계(검거·적발 건수)는 사고로 세지 않고
#   data/taxonomy.yaml 도메인 context(맥락 통계)에만 적음.
# 익명화: 개인은 실명을 쓰지 않음. 국내 피해 기업명이 공개 발표에 없으면 업종으로만 적음(예: '국내 반도체 기업').

