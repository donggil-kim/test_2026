- id: PHI-001
  title: 미국 '랩톱 팜' 운영자의 북한 IT 인력 위장취업 지원(기업 309곳)
  date: "2024-05"
  kind: 캠페인
  verification: 정부·사법 확인
  legal: 유죄 판결
  region: 미국
  sector: [IT·소프트웨어, 방산·항공우주, 자동차·조선·기계, 금융·서비스]
  actor: 북한 IT 인력·미국 내 조력자
  actor_type: [외부자, 공모]
  impact: [내부 접근 확보, 금전 피해]
  summary: >-
    미국 거주 조력자가 미국인·거주자로 위장한 북한 IT 인력이 309개 미국 기업(포춘 500 기업 포함)에 원격 IT 직원으로 취업하도록 돕고,
    피해 기업이 보낸 노트북을 자택에 모아 둔 '랩톱 팜'을 운영해 미국 안에서 일하는 것처럼 속였다. 이 수법으로 1,700만 달러 이상의 수익이
    본인과 북한에 돌아갔고, 운영자는 2025-07 징역 102개월을 선고받았다.
  pht: [PHT-IN-01.1, PHT-IN-01.2, PHT-IM-05]
  sources:
    - 미 법무부 콜롬비아특별구 연방검찰(2025) Arizona Woman Sentenced for $17M Information Technology Worker Fraud Scheme | https://www.justice.gov/usao-dc/pr/arizona-woman-sentenced-17m-it-worker-fraud-scheme-illegally-generated-revenue-north
    - NK News(2025) American who ran laptop farm for North Korean IT workers sentenced to prison | https://nknews.org/2025/07/american-who-ran-laptop-farm-for-north-korean-it-workers-sentenced-to-prison/

